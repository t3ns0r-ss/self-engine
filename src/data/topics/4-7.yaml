  - Inside a bridgeless group the orientation of Theorem 4.7.4 (c) makes the group strongly connected;
    the bridges have to be directed, and the group at the end of all of them can be reached from everywhere.
  - 'Take the largest bridgeless group C as the target: direct every bridge towards C (a walk from C),
    and orient the other roads by the walk inside their groups; the answer is the size of C.'
