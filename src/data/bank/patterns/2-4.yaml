# Patterns for topic 2.4 (Linearity of expectation, contribution technique). Provisional until the lesson maps them to Recognition Cards.
topic: "2.4"
patterns:
  - id: indicator-linearity
    name: Sum of indicator probabilities
    description: Expected count = sum over events of the probability of each event.
    precondition: E[X + Y] = E[X] + E[Y] for any random variables, even dependent ones.
  - id: contribution-total
    name: Total over all configurations
    description: Sum of a quantity over all subarrays, subsets, or permutations = sum over elements of (value × number of configurations in which it contributes).
    precondition: The total splits into per-element contributions, and the number of configurations for each element can be counted.
  - id: geometric-wait
    name: Expected waiting time
    description: Expected number of trials until success with probability p is 1/p; sum these over stages (collect all coupons).
    precondition: Trials are independent and the success probability is constant within each stage.
  - id: tail-sum
    name: Expectation by tail sums
    description: E[X] = sum over x ≥ 1 of P(X ≥ x) for non-negative integer X; used for maxima and minima of independent values.
    precondition: X takes non-negative integer values, and P(X ≥ x) is easy to compute (often as a product over independent parts).
