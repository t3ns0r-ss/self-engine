    impossible.
  hints:
  - With very few painted squares, what is the answer? Which answers can occur at all?
  - Two squares can always be deleted to disconnect a shape of at least 3 squares (a corner square has
    at most two neighbours), so the answer is at most 2.
  - Answer 1 if some single square is an articulation point, which you can test by removing each square
