# Topic 0.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.2"
draft: true
cards:
  - id: budget-from-constraints
    name: "Choose the algorithm class from n"
    decisive_property: "Plugging the largest allowed input into the step count of your idea (nested loop bounds multiply) gives at most about 10^8 steps per second of time limit; if not, the constraint tells you which smaller class to aim for (for example O(√N) for N up to 10^12)."
    from_theorem: "Theorem 0.2.1"
    how_to_test: "Write the step count of the idea as a product of loop bounds, substitute the maximum values from the constraints, and compare with 10^8 times the time limit."
    weak_signals:
      - "A small bound (n ≤ 100, n ≤ 5000) that allows a direct method"
      - "A huge bound (N ≤ 10^12, 10^18) that forbids looping up to N"
      - "Pairs (a, b) with a fixed product: only one of them needs to be looped over, up to √N"
    kill_signals:
      - "Every idea is already far inside the budget, so the question is correctness, not speed"
    lookalikes:
      - description: "The same question with n ≤ 100 instead of n ≤ 10^12"
        needs: "budget-from-constraints (0.2): any direct method"
        flipping_difference: "Only the bound changes; with the small bound the obvious loop is fine."
    complexity: "Reading the constraints costs nothing; it decides which algorithm to write."
  - id: closed-form
    name: "Formula instead of a loop"
    decisive_property: "The quantity added at each step follows an arithmetic progression or repeats with a short period, so the total over n steps is a formula (n(2a + (n − 1)d)/2, or full periods times one period's sum plus the leftover)."
    from_theorem: "Theorem 0.2.3"
    how_to_test: "Write out the first few terms of the loop. If consecutive terms differ by a constant, or the pattern repeats after p steps, a formula exists. Check the size of the product before dividing."
    weak_signals:
      - "n up to 10^9 or 10^18 with a simple repeated process"
      - "Count of pairs, sum of 1..n, or a pattern that cycles"
      - "The answer only depends on n and a few numbers, not on an array"
    kill_signals:
      - "The terms depend on input data that has no pattern (then the loop is needed)"
    lookalikes:
      - description: "The same process with n ≤ 10^5"
        needs: "a direct loop (0.2 budget)"
        flipping_difference: "With small n, looping is within the budget and less error-prone."
    complexity: "O(1) for a formula, O(p) for a period of length p."
  - id: amortised-total
    name: "Bounded total work"
    decisive_property: "An inner loop moves a counter or index forward by at least one each iteration, the counter never moves back, and its range is 0..n, so the inner loop runs at most n times in total even though it is nested."
    from_theorem: "Theorem 0.2.4"
    how_to_test: "Find what the inner loop advances. If that index is shared with the outer loop (the outer loop continues from where the inner one stopped), the total is linear."
    weak_signals:
      - "Maximal blocks (runs) of equal or monotone elements"
      - "A while loop inside a for loop that skips ahead"
      - "Counting substrings inside runs: a run of length L contributes L(L + 1)/2"
    kill_signals:
      - "The inner loop restarts from the beginning (or moves back) for each outer iteration"
    lookalikes:
      - description: "For each position, scan forward to the end of the array"
        needs: "a quadratic loop (0.2 budget), only for small n"
        flipping_difference: "The inner scan restarts at every position, so the total is n²/2, not n."
    complexity: "O(n) total for the nested loops."
  - id: harmonic-loops
    name: "Loops over multiples"
    decisive_property: "For each i, the inner loop visits only multiples of i up to n (or values up to n / i), so the total is the sum of n / i, at most n(1 + ln n)."
    from_theorem: "Theorem 0.2.5"
    how_to_test: "Check that the inner loop steps by i (j += i) or runs up to n / i. Then the total is about n ln n: fine for n up to about 10^7."
    weak_signals:
      - "A property of every number up to n that depends on its divisors"
      - "Count pairs or triples with a product at most n"
      - "n up to 10^6 or 10^7"
    kill_signals:
      - "Only one number N is involved (then divisors up to √N are enough)"
    lookalikes:
      - description: "Count the divisors of one number N"
        needs: "budget-from-constraints (0.2): divisors up to √N"
        flipping_difference: "One number needs √N steps; all numbers up to n at once need the harmonic loop."
    complexity: "O(n log n): about 1.6·10^8 steps for n = 10^7."
