# Patterns for topic 5.5 (Sweep line with a segment tree). Cards of the lesson: cover-sweep and sweep-count; no-sweep holds the look-alike partners that need no tree.
topic: "5.5"
patterns:
  - id: cover-sweep
    name: Rectangles added and removed along a line
    description: Rectangles (or intervals with a second axis) start and stop as a line sweeps along x; a tree over the compressed y gaps keeps a count per gap and answers the covered length (for an area) or the largest total (for the heaviest point).
    precondition: Every rectangle changes a whole range of y gaps by +1 or -1 (or by its weight), a removal repeats the range of its insertion, and the answer at each x depends only on the counts per gap.
  - id: sweep-count
    name: Count over a sweep with a tree
    description: Points, segments or ranges are sorted along x and a Fenwick tree (or a tree with another aggregate) over y holds what is alive; each question about a rectangle becomes a few prefix questions answered while the sweep passes.
    precondition: The set of points is fixed, the questions can be answered offline in sorted order, and each question splits into prefix questions on x and on y.
  - id: no-sweep
    name: Looks like a sweep, but a simpler tool is enough
    description: The statement has the same surface as a sweep problem (rectangles, squares or points with area or count questions), but the input is tiny, overlaps are counted several times, or the coordinates are small, so brute force, a binary search or a table answers it.
    precondition: The size of the input or the way overlaps are counted removes the need for a tree.
