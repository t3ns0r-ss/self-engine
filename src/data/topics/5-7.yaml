theorems:
- id: 5.7.1
  title: The largest XOR
  plain_words: 'The XOR of two numbers is decided by the highest digit where they differ: if it is 1 there,
    the XOR is bigger than any XOR that has 0 there, whatever the lower digits are. So from the top, always
    try to find a stored number with the opposite digit. If there is one, taking it is never worse; if
    there is none, no stored number in this branch can do better.'
  code: 5.7/thm-1
- id: 5.7.2
  title: Counting by a bound
  plain_words: Compare $x \oplus y$ with $k$ from the top digit. At a place where $k$ has a 1, a number
    $y$ that makes the XOR digit 0 is already smaller than $k$, whatever follows, so the whole branch
    counts at once. The numbers that make the XOR digit 1 stay equal to $k$ so far, and the walk goes
    on with them. Where $k$ has a 0, the XOR digit must be 0 to stay equal.
  code: 5.7/thm-2
- id: 5.7.3
  title: The cheapest tree on XOR weights
  plain_words: Two numbers that agree on the top digit have a smaller XOR than two that differ on it.
    So a cheapest tree first joins each group completely and then adds one cheapest edge across, and that
    edge is found with the same walk as the largest XOR, preferring the same digit.
  code: 5.7/thm-3
cards:
- id: binary-xor
  name: 'XOR against a set of numbers: the largest XOR and counts below a bound (binary trie)'
  from_theorem: 5.7.1
  decisive_property: Numbers below 2^B (B up to 30 or 60) are inserted into a set (and perhaps removed),
    and for a number x the question asks for the stored y with the largest x XOR y, or for how many stored
    y give x XOR y below a bound.
  how_to_test: Write the question as "over the stored y, maximise (or count below k) x XOR y". If the
    set changes between questions, or each question has its own x and its own set (a window, the ancestors
    of a vertex, the numbers up to a limit), build the binary trie with counts and walk B digits. If the
    numbers are fixed and only one best pair is wanted, the high-bit-first method of topic 1.7 is shorter.
  constraint_shapes:
  - 'n = 3·10^5 numbers below 2^30 and the best partner for each one: n²/2 = 4.5·10^10 pairs, against
    n · 30 = 9·10^6 steps for the walks'
  - 'q = 2·10^5 operations "insert x", "remove x", "largest XOR with x": each is one walk of 30 steps,
    6·10^6 steps in all, while a scan of the multiset costs up to the size of the set per query'
  weak_signals:
  - form: Asks for the largest XOR of a number with an element of a set, with insertions and deletions
      in between
    shape: q up to 2·10^5 operations on values below 2^30
  - form: Asks for the largest XOR of a subarray, or of a subarray inside a window, which is the XOR of
      two prefix values
    shape: n up to 2·10^5, prefix XORs are the numbers
  - form: Asks for the number of pairs (or of stored numbers) whose XOR is below, above or in a range
    shape: n up to 10^6 and values up to 10^9, or q up to 10^5 operations
  kill_signals:
  - 'The operation is not XOR: for {5, 6, 3} the pair with the largest XOR is 5 and 3 (XOR 6) and has
    AND 1, but the largest AND is 4 (from 5 and 6), so the trie walk for XOR finds the wrong pair for
    an AND question'
  - 'A fixed array and one question (the largest XOR of two elements): the high-bit-first method of topic
    1.7 needs no trie and is shorter'
  in_action:
    statement: 'A multiset starts with the number 0. There are q operations: add x, remove x (a copy that
      is present), or ask for the largest x XOR y over the numbers y in the multiset.'
    constraints: q ≤ 2·10^5, x below 2^30.
    budget: 'Scanning the multiset for each question: up to q · q / 2 = 2·10^10 steps. Need about q ·
      30 = 6·10^6.'
    candidates:
    - tool: Scan the multiset for every question (topic 0.5)
      verdict: rejected
      because: 2·10^10 steps.
    - tool: High-bit-first with a set of prefixes (topic 1.7)
      verdict: rejected
      because: It is built for a fixed array; each insertion or removal changes the sets of prefixes at
        all 30 levels, and each question needs its own x.
    - tool: A binary trie with counts (this topic)
      verdict: chosen
      because: Insert and remove change the counts on one path; a question is one walk taking the opposite
        digit when its count is positive (Theorem 5.7.1).
    property_check: All numbers have B = 30 binary digits, the questions are about XOR with a stored number,
      and the counts allow removals. The property holds.
    decision: 'A binary trie with 30 levels and counts; add with +1 or −1; maxXor by the greedy walk:
      O(30) per operation.'
  examples:
    positive:
    - inline:
        input: The set is 3, 10, 5, 25, 2, 8. What is the largest XOR of two of its numbers?
        answer: '28'
        why: For x = 5 the walk goes to 25 (the only number whose top digit differs), 5 XOR 25 = 28; no
          other pair gives more (Theorem 5.7.1).
    - inline:
        input: The numbers are 1, 2, 3, 4. How many pairs have a XOR below 3?
        answer: '2'
        why: The XORs are 1⊕2 = 3, 1⊕3 = 2, 1⊕4 = 5, 2⊕3 = 1, 2⊕4 = 6, 3⊕4 = 7; the pairs (1, 3) and (2,
          3) are below 3. Counting each number against the earlier ones with the walk of Theorem 5.7.2
          gives the same 2.
    - worked_example: cses-1655
      why: 'The largest XOR of a subarray of up to 2·10^5 numbers: insert the prefix XORs into a binary
        trie and take the best partner of each new prefix.'
    negative:
    - inline:
        input: The numbers are 5, 6, 3. What is the largest AND of two of them?
        answer: 4 (5 AND 6)
        method_gives: '1'
        why: The trie walk finds the pair with the largest XOR, which is 5 and 3 (XOR 6), with AND 1.
          AND and XOR are maximised by different pairs, so the property "the quantity is x XOR y" fails.
      correct_tool:
        topic: '1.7'
        card: high-bit-first
    - problem: lc-maximum-xor-of-two-numbers-in-an-array
      why: 'A fixed array and one question: the answer is built digit by digit from the top with a set
        of prefixes of the numbers, in O(31 n), with no trie.'
      correct_tool:
        topic: '1.7'
        card: high-bit-first
  lookalikes:
  - description: Sum of XORs over all pairs of a fixed array
    tool:
      topic: '1.7'
      card: per-bit-contribution
    flipping_difference: 'The sum separates by bit: count the ones and zeros at each place; a trie would
      be needed only for the maximum or for counts below a bound.'
  - description: The XOR of any range of a fixed array
    tool:
      topic: '1.7'
      card: prefix-xor
    flipping_difference: One prefix XOR array answers each range in O(1); the trie is for the best range,
      not for a given one.
  complexity: O(B) per insertion, removal, largest-XOR query or count query; memory 2B · (number of stored
    numbers) nodes at most.
- id: xor-split
  name: 'Pairs of numbers by their highest differing digit: the XOR spanning tree, the smallest largest
    XOR (split and trie)'
  from_theorem: 5.7.3
  decisive_property: The question is about all pairs of a set of numbers below 2^B, where the size of
    the XOR of a pair is decided by the highest digit in which the two differ, so every pair inside a
    group that shares the top digit is smaller than every pair across the two groups, and the problem
    falls apart into the two groups plus one crossing pair.
  how_to_test: 'Write the quantity of a pair as x XOR y and ask whether the problem is a sum, a maximum
    or a tree over all pairs. Split the numbers by the top digit: if every pair inside a group is smaller
    than every pair across, the problem divides into the groups and the crossing part. Count the cost:
    the crossing pair needs one trie walk of B steps per number, so a level of the recursion costs about
    n times B and the whole recursion about n times B times B.'
  constraint_shapes:
  - 'n = 2·10^5 numbers below 2^30 and the cheapest tree over all pairs: the graph has n²/2 = 2·10^10
    edges, so no list of edges can be built; the split costs about n · 30 · 30 = 1.8·10^8 steps'
  - 'n = 1.5·10^5 numbers and one number x to be chosen: x has 2^30 possible values, so no trial of x;
    the recursion on the digits visits each number once per level, 30 levels'
  weak_signals:
  - form: Asks for the weight of a cheapest spanning tree (or the total weight of a connection) where
      the cost between two numbers is their XOR
    shape: n up to 2·10^5, values below 2^30, no edge list in the input
  - form: Asks for the smallest possible value of the largest XOR after choosing a number x that is XORed
      into every element, or after pairing the elements
    shape: n up to 2·10^5, values below 2^30; the answer is built digit by digit
  - form: Asks for a pairing or a game whose score is the largest XOR of a pair, with an even number of
      elements
    shape: 2N numbers, N up to 2·10^5, values below 2^30
  kill_signals:
  - 'The weight of an edge is a sum or a difference, not an XOR: for the numbers 1, 2, 3 with weight x
    + y the cheapest tree has weight 7 (edges 1+2 and 1+3), while the split by the top digit would join
    {2, 3} first at cost 5 and then add 3, giving 8; the property that inside edges are lighter fails'
  - 'The graph is given by a list of edges (a few hundred thousand): Kruskal over the list is shorter
    and the split is not needed'
  in_action:
    statement: There are n cities, city i has a number a_i. A road between two cities costs a_i XOR a_j.
      Connect all cities with the smallest total cost.
    constraints: n ≤ 2·10^5, 0 ≤ a_i < 2^30.
    budget: 'The roads are all pairs: n²/2 = 2·10^10, too many to list or to scan. Need about n · 30 ·
      30 = 1.8·10^8.'
    candidates:
    - tool: Kruskal over all pairs (topic 4.5)
      verdict: rejected
      because: '2·10^10 edges: they cannot even be stored.'
    - tool: Prim with a scan of all numbers at each step (topic 4.5)
      verdict: rejected
      because: n² = 4·10^10 steps.
    - tool: Split by the top digit with a trie for the crossing edge (this topic)
      verdict: chosen
      because: Edges inside a group are lighter than edges across, so the tree is the two smaller trees
        plus one cheapest crossing edge (Theorem 5.7.3).
    property_check: The cost of a road is an XOR, so two numbers that share the top digit cost less than
      two that differ in it. The property holds.
    decision: 'Sort, remove repeats (equal numbers cost 0), and recurse on the digits from the top; at
      each split find the cheapest crossing edge with a trie of one side: O(n · 30 · 30).'
  examples:
    positive:
    - inline:
        input: The numbers are 1, 2, 3, 4 and the road between two of them costs their XOR. What is the
          cheapest total cost to connect all four?
        answer: '8'
        why: The top digit splits them into {1, 2, 3} and {4}. Inside, the roads 2-3 (cost 1) and 1-3
          (cost 2) connect the first group; across, the cheapest road is 1-4 (cost 5). The total is 1
          + 2 + 5 = 8, and Prim on all pairs also gives 8 (Theorem 5.7.3).
    - inline:
        input: The numbers are 3, 5, 9, 12. What is the cheapest total cost?
        answer: '20'
        why: 'Split by the digit of 8: {3, 5} and {9, 12}. Inside: 3 XOR 5 = 6 and 9 XOR 12 = 5. Across:
          the cheapest is 5 XOR 12 = 9. The total is 6 + 5 + 9 = 20, as Prim gives.'
    negative:
    - inline:
        input: The numbers are 1, 2, 3 and the road between two of them costs their sum x + y. What is
          the cheapest total cost?
        answer: 7 (the roads 1+2 and 1+3)
        method_gives: '3'
        why: 'The split by the top digit assumes that inside roads are lighter than crossing roads, which
          is true for XOR and false for a sum: the road 1+2 across the groups costs 3, while 2+3 inside
          costs 5. The method returns 3 (the XOR tree), not the cost of the sum graph.'
      correct_tool:
        topic: '4.5'
        card: cheapest-connect
    - problem: ac-abc117_d
      why: 'The sum of x XOR a_i over all i for one chosen x separates by digit: each digit of x is decided
        by counting the ones in that digit. There are no pairs of numbers and no tree.'
      correct_tool:
        topic: '1.7'
        card: per-bit-contribution
  lookalikes:
  - description: Cheapest spanning tree of a graph given by a list of edges
    tool:
      topic: '4.5'
      card: cheapest-connect
    flipping_difference: A listed graph has its edges in the input and is solved by sorting them and joining
      groups; the XOR graph has n²/2 edges that exist only as a rule, so the split by the top digit and
      the trie are needed.
  - description: The largest XOR over all pairs of a fixed array
    tool:
      topic: '1.7'
      card: high-bit-first
    flipping_difference: One maximum over pairs is built digit by digit with a set of prefixes; the split
      is needed when a tree, a pairing or a choice of x depends on every group at every level.
  complexity: 'O(n B²) for n numbers below 2^B: each level of the recursion walks every number once through
    a trie of B steps; memory O(n B) for the largest trie.'
