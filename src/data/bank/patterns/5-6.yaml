# Patterns for topic 5.6 (Mo's algorithm). Cards of the lesson: mo-offline and mo-variants; no-mo holds the look-alike partners that need no Mo order.
topic: "5.6"
patterns:
  - id: mo-offline
    name: Offline range queries with a cheap add and remove
    description: The questions about ranges of a fixed array are all known first; they are sorted by the block of the left end and then by the right end, and a window is moved from one question to the next by adding or removing one element, repairing the answer in constant time.
    precondition: The array does not change between the questions, they can be answered in any order, and the answer of a window is repaired in O(1) steps when one element enters or leaves.
  - id: mo-variants
    name: Mo's order with a third coordinate, on a tree, or with adds only
    description: The same window idea when the plain order does not fit: changes between the questions add time as a third coordinate, paths in a tree become ranges of an Euler order in which a vertex seen twice cancels, and a window that cannot remove (a maximum) only grows while the left part is rolled back.
    precondition: The questions are offline, a step still repairs the answer cheaply (or an add repairs it and a rollback undoes it), and the number of changes or the tree size keeps the total number of moves within the limit.
  - id: no-mo
    name: Looks like a Mo problem, but another tool is cheaper
    description: Offline questions about ranges with the same surface as a Mo problem, but the answer is a minimum, or the pairs are few enough to become segments, so a sweep with a tree answers it in O((n + q) log n).
    precondition: The answer cannot be repaired in O(1) when an element leaves, or the objects that count can be listed and counted offline with a tree.
