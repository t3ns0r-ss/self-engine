# Topic 4.2 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '4.2'
uses:
- topic: '0.3'
  what: 'Simulation: following the arrows step by step, the contrast'
- topic: '0.4'
  what: 'Parity: the cycle length and the number of steps'
- topic: '0.5'
  what: 'Brute force: trying every order or every colouring, the reference solutions in the tests'
- topic: '0.6'
  what: 'Queue, stack and priority queue: the containers of the walks'
- topic: '1.1'
  what: Sorting and the lexicographic order of sequences
- topic: '1.7'
  what: 'Bits: the weights of binary digits, in one drill problem'
- topic: '2.2'
  what: 'Fast exponentiation: counting the colourings as a power of 2, in one review problem'
- topic: '2.3'
  what: 'Counting rules: orders counted by a factorial, in one drill problem'
- topic: '3.3'
  what: 'Subset sums: splitting numbers into two equal groups'
- topic: '3.7'
  what: 'Bitmask DP: courses with prerequisites and a limit per semester'
- topic: '4.1'
  what: 'Graph traversal: the walk, distances by a queue, adjacency lists'
theorems:
- id: 4.2.1
  title: Two sides and odd cycles
  plain_words: Walk out from a vertex and give every vertex the colour opposite to the one it was reached
    from. The vertices split into two sides if and only if this never gives two neighbours the same colour,
    and that happens exactly when the graph contains a cycle with an odd number of edges.
  code: 4.2/thm-1
- id: 4.2.2
  title: Cycles and non-tree edges
  plain_words: A walk reaches each vertex by one edge, and uses $n - c$ edges to do so. Any other edge
    leads to a vertex that is already reached, and together with the two routes back to their common start
    it closes a cycle. So extra edges beyond $n - c$ are exactly the cycles.
  code: 4.2/thm-2
- id: 4.2.3
  title: Topological order
  plain_words: Keep taking a vertex that nothing unfinished points at. If you can take them all, the order
    you took them in is the answer. If you get stuck, every vertex left is pointed at by another vertex
    left, and going backwards among them must eventually run in a circle.
  code: 4.2/thm-3
- id: 4.2.4
  title: Directed cycles by a search
  plain_words: Follow arrows as far as you can, remembering the route you are on. If an arrow leads back
    to a vertex on your current route, you have gone around a circle. If every arrow leads to places already
    finished or new, there is no circle.
  code: 4.2/thm-4
- id: 4.2.5
  title: The smallest order
  plain_words: When several vertices are free to be taken, take the one with the smallest number. This
    never blocks a later choice, and at every position it puts the smallest number that any valid order
    could put there.
  code: 4.2/thm-5
- id: 4.2.6
  title: Earliest places for the small numbers
  plain_words: 'To get vertex 1 as early as possible, then vertex 2, and so on, build the order from the
    back: put into the last free place the largest vertex that nothing remaining has to follow.'
  code: 4.2/thm-6
- id: 4.2.7
  title: Euler trails and the stack method
  plain_words: "A trail that uses every edge exactly once exists when the edges form one connected piece and at most two vertices have an odd number of edges (for arrows: as many in as out everywhere, except one start and one end). Walk along unused edges with a stack and write a vertex down when it is stuck; the list, read backwards, is the trail."
  code: 4.2/thm-7
- id: 4.2.8
  title: Rounds of the removal process and unique orders
  plain_words: "Take all free vertices together, round after round: the number of rounds is the number of vertices on a longest chain of arrows, and the order is unique exactly when there are as many rounds as vertices."
  code: 4.2/thm-8
cards:
- id: two-sides
  name: Two sides (two-colouring)
  from_theorem: 4.2.1
  decisive_property: Every item must be put on one of two sides (two teams, two colours, two values 0
    and 1), and the rules are pairs of items that must be on different sides; the question asks whether
    this is possible, for a split, or for the number of splits.
  how_to_test: Turn every "must differ" pair into an edge. Walk from an unmarked vertex and give each
    vertex the colour opposite to the vertex it was reached from. If an edge joins two vertices of the
    same colour, the answer is "impossible" (an odd cycle exists); otherwise the colours are a valid split.
  constraint_shapes:
  - 'n up to 10^5 items and m up to 2·10^5 pairs: trying every split means 2^100000 assignments, while
    one walk touches n + m = 3·10^5 entries'
  - 'n = 20 items: 2^20 ≈ 10^6 splits with 50 pair checks each is 5·10^7, which brute force can do, but
    n = 10^5 cannot'
  weak_signals:
  - form: Asks to divide people into two teams so that no two enemies (or friends, or conflicting items)
      share a team, or to say it is impossible
    shape: n up to 10^5 people, m up to 2·10^5 pairs of enemies
  - form: Asks whether a graph is bipartite, or has a cycle of odd length
    shape: One graph with n, m ≤ 2·10^5
  - form: Each pair (a, b) says that two values must be different and each value is one of two choices
      (left or right, 0 or 1, even or odd)
    shape: n, m ≤ 2·10^5; the choices form two classes
  - form: Asks to direct or label the edges so that no vertex both receives and sends (no path of two
      edges)
    shape: n, m ≤ 2·10^5; every edge goes from a "sender" side to a "receiver" side
  kill_signals:
  - 'Three or more sides are allowed: the triangle 1–2–3 cannot be split into two sides, but it can be
    split into three teams, so a two-colouring check would wrongly answer "no" (the first negative example
    below)'
  - 'Pairs must be on the SAME side: then the pairs merge items into groups (components, topic 4.1), and
    the split is a different question'
  - The condition is about sums or sizes of the sides, not about pairs that must differ (splitting numbers
    into two groups of equal sum)
  in_action:
    statement: A radio network has n transmitters and m pairs that interfere. Each transmitter must use
      one of two frequencies, and interfering transmitters must use different ones. Print a valid choice,
      or say it is impossible.
    constraints: n ≤ 10^5, m ≤ 2·10^5.
    budget: 'Trying all frequency choices: 2^n, with n = 10^5 that is 2^100000. One walk over the transmitters
      and the pairs: n + m = 3·10^5 steps. Need about O(n + m).'
    candidates:
    - tool: Try every assignment of the two frequencies (brute force, topic 0.5)
      verdict: rejected
      because: '2^n assignments: only possible for n up to about 20.'
    - tool: Walk and give each transmitter the frequency opposite to its parent (this topic)
      verdict: chosen
      because: Every rule is a pair that must differ, so the frequencies are the colours of Theorem 4.2.1.
    property_check: 'Each rule says "different", there are exactly two frequencies, and the pairs are
      listed. By Theorem 4.2.1 a split exists exactly when no edge joins two vertices of the same colour:
      yes.'
    decision: Walk from every unmarked transmitter, colouring by the opposite of the parent. On a conflict
      print IMPOSSIBLE; otherwise print the colours. Time O(n + m).
  examples:
    positive:
    - inline:
        input: 'Six pupils; pairs that must be in different teams: 1–2, 2–3, 3–4, 4–1, 5–6; can they form
          two teams?'
        answer: 'yes'
        why: 'The pairs form a cycle of length 4 (even) and a single edge, so no odd cycle exists: the
          walk gives 1, 3 one colour and 2, 4 the other, and 5, 6 different colours; trying all 2^6 splits
          agrees.'
    - worked_example: cses-1668
      why: Friends may not share a team, so each friendship is an edge that must join different colours.
    negative:
    - inline:
        input: Enemies 1–2, 2–3, 1–3 (a triangle); can THREE teams be formed so that no two enemies share
          a team?
        answer: 'yes'
        method_gives: 'no'
        why: Giving the three pupils three different teams works. The two-colouring check only knows two
          sides, and the triangle is an odd cycle, so it says no. With more than two sides the odd-cycle
          argument no longer applies.
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
    - problem: cses-1623
      why: The condition is on the total weights of the two groups, not on pairs that must be on different
        sides; there are no pairs at all.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
  lookalikes:
  - description: Group items whose pairs must be on the same side
    tool:
      topic: '4.1'
      card: components
    flipping_difference: When a pair means "together", chains of pairs put many items into one group,
      and the answer counts or labels groups. When a pair means "apart", the same chains must alternate
      sides, and odd cycles make it impossible.
  - description: Split numbers into two groups with the same sum
    tool:
      topic: '3.3'
      card: subset-sums
    flipping_difference: The condition compares sums of the sides, so a table of reachable sums decides
      it. Two-colouring needs pairs that must differ and is about structure only.
  complexity: 'O(n + m): one walk.'
- id: undirected-cycle
  name: Cycles in an undirected graph
  from_theorem: 4.2.2
  decisive_property: The graph has two-way edges (and no repeated edges, or repeated edges are counted
    by the formula), and the question is whether a cycle exists, how many edges must go to leave no cycle
    (m − (n − c) for c components), or to print one cycle.
  how_to_test: Count the vertices n, the edges m and the components c with one walk. The graph is a forest
    exactly when m = n − c; the surplus m − (n − c) is the number of edges that close cycles. To print
    a cycle, remember parent and depth and join the climbs from the ends of one non-tree edge.
  constraint_shapes:
  - 'n, m up to 2·10^5: removing each edge in turn and testing connectivity is m · (n + m) = 2·10^5 ·
    4·10^5 = 8·10^10 steps, while counting is one walk of n + m = 4·10^5'
  - 'n = 2·10^5 vertices: choosing which edges to delete among 2·10^5 edges is 2^200000 subsets, so a
    formula or one walk is the only option'
  weak_signals:
  - form: Asks whether the graph has a cycle, is a forest, or is a single chain or loop (every vertex
      of degree 2)
    shape: One graph with n, m ≤ 2·10^5
  - form: Asks for the fewest edges to remove so that no cycle remains
    shape: n, m ≤ 2·10^5; the answer is one number
  - form: Asks to print one cycle ("round trip", "loop of cables", "a ring")
    shape: n, m ≤ 2·10^5; the output is a list of up to n vertices
  - form: Asks which components are cycles, paths or unicyclic (one extra edge)
    shape: n, m ≤ 2·10^5; classify each component by its vertices and edges
  kill_signals:
  - 'The edges are arrows: for the arrows 1→2, 1→3, 2→3 the count m = 3 exceeds n − c = 2, but there is
    no directed cycle, since no arrow leads back (the first negative example below)'
  - 'The graph has repeated edges and the walk-based test is used: two cables between the same two computers
    form a cycle of length 2 that the test "edge to a marked vertex other than the parent" skips; count
    edges with the formula instead'
  in_action:
    statement: A map shows n towns and m two-way roads, no repeated roads. Decide whether the roads contain
      a loop (a closed route that visits no town twice), and if so, print one loop.
    constraints: n, m ≤ 2·10^5.
    budget: 'Removing each road in turn and testing whether the towns stay connected: m · (n + m) = 8·10^10
      steps. One walk with parents and depths: n + m = 4·10^5. Need about O(n + m).'
    candidates:
    - tool: Remove each road and check connectivity again (graph traversal, topic 4.1)
      verdict: rejected
      because: 'm walks of n + m steps each: 8·10^10.'
    - tool: One walk with parents and depths; look for a non-tree edge (this topic)
      verdict: chosen
      because: Roads are two-way and simple, so a non-tree edge exists exactly when a loop does (Theorem
        4.2.2).
    property_check: 'The roads are undirected and no repeated road exists. The walk uses n − c roads as
      tree edges, and any further road closes a loop: m > n − c iff a loop exists (Theorem 4.2.2).'
    decision: Walk with a queue storing parent and depth. At the first road to a marked town other than
      the parent, climb from both ends to the meeting town and print the loop. If no such road exists,
      print that there is no loop. Time O(n + m).
  examples:
    positive:
    - inline:
        input: Six computers, cables 1–2, 2–3, 3–1, 4–5, 5–6; the fewest cables to remove so that no loop
          of cables remains?
        answer: '1'
        why: There are 5 cables, 6 computers and 2 groups, so 5 − (6 − 2) = 1 cable is surplus. Removing
          any cable of the triangle leaves a forest; trying every set of cables confirms that none smaller
          works.
    - worked_example: ac-abc288_c
      why: Deleting edges until the graph is a forest takes exactly m − (n − c) deletions, one per surplus
        edge.
    negative:
    - inline:
        input: One-way roads 1→2, 1→3, 2→3; is there a directed cycle?
        answer: 'no'
        method_gives: 'yes'
        why: 'Read as two-way roads, 3 roads on 3 towns in 1 group give 3 − (3 − 1) = 1 surplus, a cycle.
          But the roads only go forward: no road leads back to 1 or to 2, so there is no directed cycle.
          The formula needs edges that work both ways.'
      correct_tool:
        topic: '4.2'
        card: directed-cycle
    - problem: lc-find-eventual-safe-states
      why: The arrows have directions, and the question is which nodes can never run into a cycle; the
        surplus of edges over n − c says nothing about that.
      correct_tool:
        topic: '4.2'
        card: dependency-order
  lookalikes:
  - description: Detect a cycle in a graph of one-way roads
    tool:
      topic: '4.2'
      card: directed-cycle
    flipping_difference: With arrows, an arrow to a vertex that is already marked may be just a second
      route (as in 1→2, 1→3, 2→3). A cycle exists only if the arrow leads to a vertex still on the stack,
      so the vertex states are needed.
  - description: Count the groups of a graph
    tool:
      topic: '4.1'
      card: components
    flipping_difference: Groups ask how the vertices split; cycles ask how many edges are left over inside
      the groups (m − (n − c)). The same walk gives both numbers.
  complexity: 'O(n + m): one walk.'
- id: dependency-order
  name: Order that respects dependencies
  from_theorem: 4.2.3
  decisive_property: Items have to be listed or done one after another, certain items must come before
    others ("a before b", prerequisites, needs), and the question asks for such an order, for whether
    one exists, or for the smallest one as a sequence.
  how_to_test: Draw an arrow a→b for every "a before b". Count the arrows into each vertex and repeatedly
    take a vertex with none left. If all vertices come out, the sequence is an order; if some stay, a
    directed cycle blocks every order. For the smallest sequence take the smallest free vertex each time
    (a min-heap). To finish item 1 as early as possible, then item 2, and so on, build the order from
    the back instead (Theorem 4.2.6). To ask whether the order is unique, or how many rounds are needed
    when everything that is free is done at once, take all free vertices together as one round (Theorem
    4.2.8). The order is unique exactly when no round holds two vertices.
  constraint_shapes:
  - 'n up to 2·10^5 items and m up to 2·10^5 rules: n! orders are out of reach, one pass with counters
    is n + m = 4·10^5, and with a heap about (n + m) · log n ≈ 4·10^5 · 18 = 7·10^6'
  - 'Letters: at most 26 vertices and 25 rules from adjacent words, so a few hundred steps decide the
    alphabet order'
  weak_signals:
  - form: Asks for an order of tasks, courses or items in which every prerequisite comes first, or says
      it is impossible
    shape: n and m up to 2·10^5
  - form: Asks for the lexicographically smallest valid order, or to finish item 1 as soon as possible,
      then item 2 as soon as possible, and so on
    shape: n up to 2·10^5; a priority queue is expected (smallest first for the sequence, largest placed
      last for the early places)
  - form: Asks to reconstruct an order or an alphabet from partial comparisons (adjacent words of a dictionary,
      "x is before y" facts)
    shape: up to 26 letters or up to 10^5 items; each fact gives one arrow
  - form: Asks which items have no prerequisite, whether every item can eventually be done, whether the
      order is unique, or how many rounds are needed when everything free is done at once
    shape: n, m ≤ 2·10^5; counts of arrows into each vertex, and the number of free vertices at each step
  kill_signals:
  - 'The rules are about exact places, not about before and after: with "item 1 stands immediately before
    item 3" on three items, 2 orders work, but the arrow 1→3 admits 3 (the first negative example below)'
  - 'There is a limit on how many items can be done at the same time or in one round: the order alone
    does not decide the number of rounds'
  - 'The rules contain a cycle: then no order exists, and the method reports exactly that, so the cycle
    is the answer, not a failure of the tool'
  - 'The aim is the early places of small numbers, not the smallest sequence: with the single rule "3
    before 1", the smallest sequence 2, 3, 1 puts 1 last, while 3, 1, 2 puts it second (Theorem 4.2.6
    is the right tool for that aim)'
  in_action:
    statement: A recipe has n steps and m rules "step a must be done before step b". Print an order in
      which all steps can be done, or say it is impossible.
    constraints: n ≤ 2·10^5, m ≤ 2·10^5.
    budget: 'There are n! orders, far beyond 10^8 already for n = 12 (479 001 600). One pass that counts
      the rules into each step and removes free steps: n + m = 4·10^5. Need about O(n + m).'
    candidates:
    - tool: Try all orders and check each (brute force, topic 0.5)
      verdict: rejected
      because: 'n! orders: 479 001 600 for n = 12 already.'
    - tool: Repeatedly take a step that no unfinished rule points at (this topic)
      verdict: chosen
      because: Rules are before/after pairs and there is no limit on parallel work.
    property_check: 'The rules are "a before b" pairs, so they are arrows. Theorem 4.2.3: if all steps
      are taken, the sequence is valid; otherwise a directed cycle exists and no order does.'
    decision: Count the arrows into each step, queue the steps with none, and take them one by one decreasing
      the counts of their targets. Print the order if all n steps came out, else IMPOSSIBLE. Time O(n
      + m).
  examples:
    positive:
    - inline:
        input: Five items; rules 4 before 2, 5 before 1, 3 before 1; what is the smallest valid order?
        answer: 34251 (the order 3, 4, 2, 5, 1)
        why: Items 3, 4 and 5 are free at the start; the smallest, 3, goes first; then 4 (1 still waits
          for 5), which frees 2; then 2, then 5, which frees 1. Trying all 120 orders gives the same smallest
          one.
    - inline:
        input: Four tasks; rules 1 before 2, 2 before 3, 3 before 1, 3 before 4; is there a valid order?
        answer: 'no'
        why: 'The rules 1, 2, 3 form a cycle: nothing is free at the start, so nothing can be taken. The
          method reports "none" and trying all 24 orders confirms that none works.'
    - worked_example: lc-find-eventual-safe-states
      why: Taking away the nodes whose arrows all lead to already removed nodes is Theorem 4.2.3 on the
        reversed arrows; the nodes that never become free are those on or leading to a cycle.
    negative:
    - inline:
        input: Three items; the rule is "item 1 stands immediately before item 3"; in how many orders
          of 1, 2, 3 does it hold?
        answer: '2'
        method_gives: '3'
        why: '"Immediately before" fixes the places of two items next to each other: only 1 3 2 and 2
          1 3 work. The arrow 1→3 only says "somewhere before", which allows 3 orders (1 2 3 as well).
          Order rules must be about before and after only.'
      correct_tool:
        topic: '0.5'
        card: permutations
    - problem: lc-parallel-courses-ii
      why: Courses have prerequisites, but at most k may be taken in a semester and the fewest semesters
        is asked, so the order alone is not enough.
      correct_tool:
        topic: '3.7'
        card: submask-mask
  lookalikes:
  - description: Order the items by a number each one carries (a sort key)
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: When every item has a key and the order is by key, sorting does it. When the
      order is given by pairs of items ("a before b") with no common key, the pairs form arrows and the
      order comes from removing free vertices.
  - description: Is there a directed cycle, and print one
    tool:
      topic: '4.2'
      card: directed-cycle
    flipping_difference: Both fail on a cycle. If you need to know which vertices form the cycle, the
      search with vertex states prints it; if you need the order when there is none, the removal process
      gives it.
  complexity: O(n + m) with a queue; O((n + m) log n) with a min-heap.
- id: directed-cycle
  name: Cycles of arrows
  from_theorem: 4.2.4
  decisive_property: 'A set of items where each item points to others (a→b: "a depends on b", "a becomes
    b", "a leads to b"), and the question asks whether following the arrows can run in a circle, to print
    a circle, or what happens when each item has exactly one arrow and the arrows are followed again and
    again.'
  how_to_test: Follow arrows with an explicit stack and three states (not entered, on the stack, finished).
    An arrow to a vertex on the stack closes a cycle, which is the stack from that vertex on. When every
    vertex has exactly one arrow, follow them from each unfinished start and look for the first vertex
    met twice on the current route.
  constraint_shapes:
  - 'n up to 2·10^5 items each pointing to one other: following the arrows from every start without remembering
    costs up to n · n = 4·10^10 steps, while marking finished vertices touches each once, n = 2·10^5'
  - 'n, m up to 2·10^5 arrows: a search that finishes each vertex once costs n + m = 4·10^5'
  weak_signals:
  - form: Asks whether a set of "rename a to b" or "a points to b" rules can lead back to the start, or
      to print the circle
    shape: n, m ≤ 2·10^5 arrows
  - form: Every item has exactly one outgoing arrow (a permutation, a "next" array) and the question is
      about the cycle you end in, its length, or the steps before it
    shape: n ≤ 2·10^5; p_i is given for every i
  - form: Asks which items are safe (never run into a circle) or which lie on circles
    shape: n, m ≤ 2·10^5
  - form: Asks to detect an infinite process or a deadlock (a waits for b, b waits for a)
    shape: n, m ≤ 2·10^5 "waits for" pairs
  kill_signals:
  - 'The graph is undirected: a single road 1–2 read as the arrows 1→2 and 2→1 is a "cycle" of length
    2, but a single road is not a cycle of an undirected graph (the first negative example below)'
  - The question is about the number of steps after a huge number such as 10^18, where only the length
    of the cycle (a remainder) matters, not the cycle itself
  in_action:
    statement: n towns each have exactly one one-way road leaving them, to a town p_i. Starting from town
      1 and following the roads, how many different towns are visited before a town repeats, and how long
      is the cycle?
    constraints: n ≤ 2·10^5.
    budget: 'One start follows at most n roads, so n = 2·10^5 steps. Starting from every town without
      remembering: n · n = 4·10^10. Need about O(n) for all starts.'
    candidates:
    - tool: Follow the roads from each town and stop when a town repeats on the route (simulation, topic
        0.3)
      verdict: rejected
      because: 'Up to n steps for each of n starts: 4·10^10.'
    - tool: A search with the three vertex states, marking finished towns (this topic)
      verdict: chosen
      because: Each town is entered once; the first road to a town on the current route closes the cycle
        (Theorem 4.2.4).
    property_check: 'Every road is one-way and followed forwards only, and each town has one road. An
      arrow to a vertex on the stack closes a cycle: yes (Theorem 4.2.4).'
    decision: Follow the roads from town 1 with a stack and states; when a town on the stack is met again,
      the towns from it to the top form the cycle (its length is the answer), and the towns before it
      are the ones visited before the cycle. Time O(n).
  examples:
    positive:
    - inline:
        input: Five towns with one-way roads 1→2, 2→3, 3→4, 4→2, 5→4; which towns lie on the cycle?
        answer: 234 (towns 2, 3, 4)
        why: 'The search from 1 goes 1, 2, 3, 4 and the road 4→2 leads to town 2, which is on the stack:
          the stack from 2 is the cycle. Towns 1 and 5 lead into it but are not on it; checking which
          towns can reach themselves agrees.'
    - inline:
        input: Rename requests 1→2, 2→3, 3→1, 4→1; which names are on a cycle of renames?
        answer: '123'
        why: Names 1, 2, 3 rename each other in a circle, so none can be renamed first without clashing;
          name 4 only points into the circle, so it is not on it.
    negative:
    - inline:
        input: One two-way road between towns 1 and 2; does an undirected graph with this single road
          have a cycle?
        answer: 'no'
        method_gives: 'yes'
        why: Reading the road as the arrows 1→2 and 2→1 gives a directed cycle of length 2, but in an
          undirected graph a cycle needs at least three different vertices; a single road leads nowhere
          new. For two-way roads use the count of non-tree edges.
      correct_tool:
        topic: '4.2'
        card: undirected-cycle
    - problem: ac-abc136_d
      why: Every child follows an arrow every step, but the number of steps is 10^100, and only whether
        it is even or odd decides which of two cells the child is on; the cycle itself is not needed.
      correct_tool:
        topic: '0.4'
        card: parity
  lookalikes:
  - description: Is there an order of the items that respects all arrows?
    tool:
      topic: '4.2'
      card: dependency-order
    flipping_difference: A topological order exists exactly when no directed cycle does. If the output
      must be the order itself, removing free vertices gives it directly; if the output is the cycle,
      the vertex states show it.
  - description: Is there a cycle in a graph of two-way roads?
    tool:
      topic: '4.2'
      card: undirected-cycle
    flipping_difference: For two-way roads an edge to the parent is not a cycle, and a marked neighbour
      other than the parent closes one. For arrows only an arrow to a vertex on the stack does.
  complexity: 'O(n + m): each vertex is entered once and each arrow tried once.'
- id: euler-trail
  name: Trail that uses every edge once
  from_theorem: 4.2.7
  decisive_property: "Every road, pair, domino or arrow must be used exactly once in one route, and all of them lie in one connected piece. Then the route exists exactly when 0 or 2 vertices have an odd degree (for arrows: every vertex has as many arrows in as out, except one start with one more out and one end with one more in)."
  how_to_test: "Count the degree of every vertex (for arrows, out minus in). Zero odd vertices allow a closed route, two odd vertices allow an open route that starts at one of them, any other count allows none. Then check that the edges form one piece: run the stack method (Theorem 4.2.7) and compare the number of vertices it writes down with m + 1."
  constraint_shapes:
    - "m up to 2·10^5 edges, each used once: trying every order of the edges is m! (already 10! = 3 628 800 for 10 edges), while the stack method touches every edge twice, about 4·10^5 steps"
    - "The answer is a route with m + 1 = 2·10^5 + 1 vertices, so printing alone takes about m steps and the method has to be O(n + m)"
  weak_signals:
    - form: "Asks for a route, a string or an arrangement that uses every road, pair, piece or domino exactly once, or says that it is impossible"
      shape: "n up to 10^5 vertices and m up to 2·10^5 edges; every edge appears exactly once in the answer"
    - form: "Asks to restore a sequence from all its overlapping pieces of a fixed length, or to build the shortest string that contains every string of length n"
      shape: "Each piece is an edge from its first symbols to its last symbols; with 62 symbols and pieces of 3 there are at most 62 · 62 = 3844 vertices"
    - form: "Asks to give a direction to every edge, or to split the edges into routes, so that as many vertices as possible have in-degree equal to out-degree"
      shape: "n up to 200 or 10^5 and m up to 2000 or 2·10^5; the answer is tied to the number of odd-degree vertices"
  kill_signals:
    - "Every vertex, not every edge, must be visited once: this is a route through all vertices, which is hard in general and is done for about 20 vertices with a table over visited sets. The complete graph on 4 towns has such a route, but all four degrees are odd, so the edge test says none (the second negative example below)"
    - "The edges lie in two or more separate pieces: every degree can be even and still no route crosses from one piece to the other (the first negative example below)"
    - "The edges have lengths and the shortest closed route through every edge is asked, with edges allowed to repeat: the order of the edges alone no longer decides the answer"
  in_action:
    statement: "A city has n crossings and m two-way streets. A mail van must start at crossing 1, drive along every street exactly once and return to crossing 1. Print such a route, or IMPOSSIBLE."
    constraints: "n ≤ 10^5, m ≤ 2·10^5."
    budget: "There are m! orders of the streets: 10! = 3 628 800 already for 10 streets. One pass over the streets and crossings is n + m = 3·10^5. Need about O(n + m)."
    candidates:
      - tool: "Try every order of the streets (brute force, topic 0.5)"
        verdict: rejected
        because: "10! = 3 628 800 for just 10 streets."
      - tool: "Visit every crossing once with a table over visited sets (topic 3.7)"
        verdict: rejected
        because: "The van must use every street, not visit every crossing, and 10^5 crossings are far beyond the about 20 that a table over sets allows."
      - tool: "Degree test and stack method (this topic)"
        verdict: chosen
        because: "Every street must be used once: Theorem 4.2.7 applies."
    property_check: "Each time the van passes through a crossing it uses two streets there, so a closed route needs an even degree everywhere. Theorem 4.2.7: even degrees and all streets reachable from crossing 1 are also enough."
    decision: "Count the degrees; run the stack method from crossing 1 with a used mark per street; print the route if it has m + 1 crossings, else IMPOSSIBLE. Time O(n + m)."
  examples:
    positive:
      - inline:
          input: "Roads 1–2, 2–3, 3–1 and 3–4; can a trail use every road exactly once?"
          answer: "yes (for example 3, 2, 1, 3, 4)"
          why: "Crossings 3 and 4 have odd degree (3 and 1), the others even, and the roads form one piece, so Theorem 4.2.7 gives an open trail between 3 and 4. Trying every order of the 4 roads finds one too."
      - inline:
          input: "Arrows 1→2, 2→3, 3→1, 1→4 and 4→1; can one closed route follow every arrow exactly once?"
          answer: "yes (1, 2, 3, 1, 4, 1)"
          why: "Every vertex has as many arrows in as out (vertex 1 has two of each) and the arrows are connected, so the closed route exists. Trying every order of the 5 arrows finds it too."
    negative:
      - inline:
          input: "Two separate triangles, 1–2–3 and 4–5–6; can a trail use every road exactly once?"
          answer: "no"
          method_gives: "yes"
          why: "Every degree is 2, so the parity test alone says yes, but no trail can go from one triangle to the other: the roads are not one connected piece (the second part of the decisive property). Trying every order of the 6 roads confirms that none works."
        correct_tool:
          topic: "4.1"
          card: components
      - inline:
          input: "The complete graph on 4 towns (6 roads); is there a route that visits every town exactly once?"
          answer: "yes (1, 2, 3, 4)"
          method_gives: "no"
          why: "The question is about towns, not roads. Every town has degree 3, so four are odd and the edge test says that no trail uses all roads; but the route 1, 2, 3, 4 visits every town once. Visiting every vertex once is a different problem (the first part of the decisive property fails)."
        correct_tool:
          topic: "3.7"
          card: path-mask
  lookalikes:
    - description: "A route that visits every vertex exactly once"
      tool:
        topic: "3.7"
        card: path-mask
      flipping_difference: "Visiting every vertex once is decided by a table over the sets of visited vertices and works for about 20 vertices; using every edge once is decided by the degrees alone, for 10^5 vertices."
    - description: "Are two vertices connected, or how many pieces does the graph have?"
      tool:
        topic: "4.1"
        card: components
      flipping_difference: "Pieces are found by one walk and say nothing about odd degrees. The trail needs the pieces to be one (a check inside the stack method) and the degrees to be even except at two vertices."
  complexity: "O(n + m): every edge is looked at twice and every edge puts one vertex on the stack."
problems:
- id: cses-1668
  role: worked_example
  summary: Divide n ≤ 10^5 pupils into two teams so that no two friends (m ≤ 2·10^5 friendships) are in
    the same team, or say it is impossible.
- id: ac-abc288_c
  role: worked_example
  summary: Given a simple undirected graph with N ≤ 2·10^5 vertices and M ≤ 2·10^5 edges, find the fewest
    edges to delete so that no cycle remains.
- id: lc-find-eventual-safe-states
  role: worked_example
  summary: In a directed graph with up to 10^4 nodes, list the nodes (in increasing order) from which
    every possible path ends at a terminal node.
- id: ac-abc327_d
  role: ladder
  card: two-sides
  rung: 1
  twist: Base case of the card
  summary: Given N ≤ 2·10^5 and M pairs (A_i, B_i), decide whether some sequence X of 0s and 1s satisfies
    X[A_i] ≠ X[B_i] for every pair.
  hints:
  - What do the pairs form if you draw an edge for each pair? And what if a pair has A_i equal to B_i?
  - A graph, and X is a two-colouring of it (Theorem 4.2.1). A pair with equal ends is a loop and can
    never be satisfied.
  - Build the adjacency lists, colour each component by a walk, and answer No at the first edge inside
    a colour or at a pair with equal ends.
- id: cf-687A
  role: ladder
  card: two-sides
  rung: 2
  twist: Recognise the condition "two disjoint vertex covers" as a two-colouring.
  summary: A graph with n, m ≤ 10^5 is given. Find two disjoint sets of vertices A and B such that every
    edge has an end in A and an end in B (each set is a vertex cover), or say it is impossible.
  hints:
  - Take any edge uv. What does "A covers it" say, and what does "B covers it" say, given that A and B
    share no vertex?
  - One end is in A and the other in B, for every edge. So every edge joins the two sets, which is a two-colouring.
  - Colour the graph. If that fails print −1; otherwise print the two colour classes (vertices without
    edges can be left out, as each set must be non-empty).
- id: cf-1144F
  role: ladder
  card: two-sides
  rung: 3
  twist: 'The condition is about the arrows at each vertex: restate it as a split into senders and receivers.'
  summary: A connected graph has n vertices and m ≤ 2·10^5 edges. Direct every edge so that the resulting
    directed graph has no path of two arrows, or say it is impossible; print the direction of each edge.
  hints:
  - 'What does "no path of two arrows" say about a single vertex: can it have an arrow in and an arrow
    out?'
  - 'No. Every vertex only sends or only receives, so the vertices split into two sides and every edge
    joins them: a two-colouring.'
  - Colour the graph. If that fails print NO; otherwise direct every edge from colour 0 to colour 1 and
    print, for each edge, whether it goes from its first end to its second.
- id: ac-abc285_d
  role: ladder
  card: directed-cycle
  rung: 1
  twist: Base case of the card
  summary: N ≤ 10^5 users each want to change their handle S_i to T_i (all S_i are different, all T_i
    are different). One change at a time, and the new handle must not be in use at that moment. Is there
    an order of the changes?
  hints:
  - When is a request blocked? Draw an arrow from S_i to T_i for every request.
  - A request is blocked while another user still has its new handle; so the other user must change first.
    A circle of such waits cannot be resolved, and without a circle an order exists.
  - Give each handle a number with a map (topic 0.6), add the arrows, and answer No exactly when the graph
    has a directed cycle (the search with three states, or removing vertices with no arrow in).
- id: cf-1020B
  role: ladder
  card: directed-cycle
  rung: 2
  twist: Report where each route first meets itself.
  summary: Each of n ≤ 1000 students i points to one student p_i. For every starting student, follow the
    pointers and print the first student reached for the second time.
  hints:
  - Start at a student and keep following p. Where must the route repeat first?
  - There is one arrow out of every vertex, so the route enters a cycle and the first repeated vertex
    is the one where it joins the cycle.
  - For each start, follow p with a visited mark and print the vertex that is met again; a walk of up
    to n steps from each of n ≤ 1000 starts is fast enough.
- id: ac-abc256_e
  role: ladder
  card: directed-cycle
  rung: 3
  twist: Each cycle pays exactly once, at its cheapest member.
  summary: N ≤ 2·10^5 people; person i dislikes person X_i. You choose the order in which candies are
    handed out; person i has frustration C_i if X_i receives a candy before i. Minimise the total frustration.
  hints:
  - Draw an arrow i → X_i. When could everybody have frustration 0, and what stops that?
  - 'Person i is happy when i is served before X_i. Along a path of arrows that is easy, but around a
    cycle someone must be served after the person they dislike: exactly one person per cycle pays.'
  - Find the cycles of this graph (one arrow per vertex, three states) and add the smallest C_i on each
    cycle.
- id: cses-1756
  role: ladder
  card: dependency-order
  rung: 1
  twist: 'Base case of the card: choose the order yourself.'
  summary: Given an undirected graph with n ≤ 10^5 nodes and m ≤ 2·10^5 edges, choose a direction for
    every edge so that the directed graph has no cycle, and print the edges.
  hints:
  - When is a directed graph free of cycles? Think of the order in which the vertices come.
  - If every arrow goes from an earlier to a later vertex of some fixed order, there can be no cycle (Theorem
    4.2.3).
  - Fix the order 1, 2, …, n and print every edge from its smaller end to its larger end.
- id: lc-minimum-number-of-vertices-to-reach-all-nodes
  role: ladder
  card: dependency-order
  rung: 2
  twist: Only the in-degrees matter.
  summary: Given a directed acyclic graph with up to 10^5 vertices, find the smallest set of vertices
    from which every vertex can be reached.
  hints:
  - Which vertices cannot be reached from any other vertex?
  - 'Exactly the vertices with in-degree 0 must be in the set. Without a cycle they are also enough: going
    backwards along arrows from any vertex ends at a vertex with no arrow in.'
  - Count the in-degrees and return the vertices with in-degree 0.
- id: cf-510C
  role: ladder
  card: dependency-order
  rung: 4
  twist: Build the arrows from sorted data, and spot an impossible prefix.
  summary: n ≤ 100 names are listed in the order of a dictionary written with an unknown order of the
    26 letters. Find an alphabet order that makes the list sorted, or print Impossible.
  hints:
  - What does a pair of neighbouring names tell you about the alphabet?
  - The first position where they differ gives the rule "this letter before that letter". If the second
    name is a proper prefix of the first, no alphabet works.
  - Add an arrow for each rule, take letters with no arrow into them one at a time (any order is fine),
    and print the alphabet, or Impossible if some letters are never free.
- id: lc-build-a-matrix-with-conditions
  role: ladder
  card: dependency-order
  rung: 5
  twist: Two independent orders, one for rows and one for columns.
  summary: Place the numbers 1 to k (k ≤ 400) in a k × k matrix, each once, so that given pairs stand
    strictly above/below and strictly left/right of each other; return an empty matrix if that is impossible.
  hints:
  - The row conditions and the column conditions concern different things. Can they be treated separately?
  - 'Yes: each set is a list of "a before b" rules, so each needs its own order: one for the rows and
    one for the columns.'
  - Find an order for the rows and an order for the columns (return an empty matrix if either has a cycle)
    and put the number v at (position of v in the row order, position of v in the column order).
- id: ac-abc287_c
  role: ladder
  card: undirected-cycle
  rung: 1
  twist: Base case of the card
  summary: 'Given a simple undirected graph with N ≤ 2·10^5 vertices and M edges, decide whether it is
    a path graph: one chain through all vertices and no other edges.'
  hints:
  - How many edges does a chain through N vertices have, and what degrees do its vertices have?
  - N − 1 edges, one component, and no vertex of degree above 2. With N − 1 edges and one component there
    is no cycle (Theorem 4.2.2).
  - Check M = N − 1, every degree at most 2, and that one walk reaches all vertices; print Yes if all
    hold.
- id: cf-103B
  role: ladder
  card: undirected-cycle
  rung: 2
  twist: Exactly one extra edge in a single component.
  summary: A graph with n ≤ 100 vertices and m edges is given. Decide whether it is connected and has
    exactly one cycle (a ring with trees hanging from it).
  hints:
  - 'Connected with exactly one cycle: what does the number m − (n − c) say?'
  - 'With one component (c = 1), exactly one edge beyond a tree: m = n.'
  - Check that one walk reaches all vertices and that m = n; print the required answer.
- id: lc-shortest-cycle-in-a-graph
  role: ladder
  card: undirected-cycle
  rung: 3
  twist: Run the walk from every vertex and combine distances over non-tree edges.
  summary: Given an undirected graph with n ≤ 1000 vertices and at most 1000 edges, return the length
    of its shortest cycle, or −1 if it has none.
  hints:
  - If you fix a start s, what does a non-tree edge u–w of the walk give?
  - A closed walk of length d[u] + d[w] + 1 that contains a cycle, so it is never shorter than the shortest
    cycle. For a start s on a shortest cycle, the non-tree edge opposite to s gives exactly its length.
  - Run the walk from every vertex (about n · (n + m) = 2·10^6 steps), skip the edge to the parent, take
    the smallest d[u] + d[w] + 1 over the other edges to marked vertices, and print −1 if there is none.
- id: ac-abc291_e
  role: ladder
  card: dependency-order
  rung: 3
  twist: "Is the order unique? Look at how many vertices are free at each step (Theorem 4.2.8)."
  summary: "Given N ≤ 2·10^5 and M facts A_X < A_Y about a hidden permutation A, decide whether the facts leave exactly one permutation, and print it if so."
  hints:
    - "When would two different permutations both fit the facts? Think about two vertices that could be taken at the same moment."
    - "If at some step two vertices have no unused arrow into them, they can be swapped (Theorem 4.2.8). So the order is unique exactly when the set of free vertices never holds two."
    - "Run the removal process with a counter of free vertices; stop with No when it ever holds two or when a vertex is never freed, and otherwise print each vertex's position."
- id: cf-825E
  role: ladder
  card: dependency-order
  rung: 6
  twist: "Smallest label for vertex 1 first, then vertex 2: build the order from the back (Theorem 4.2.6)."
  summary: "Give the n ≤ 10^5 vertices of a directed graph without cycles the distinct labels 1 to n so that every arrow goes to a larger label, and the label of vertex 1 is as small as possible, then that of vertex 2, and so on."
  hints:
    - "Try the rule 3 before 1 on three vertices. Does giving the smallest free vertex the smallest label work?"
    - "Not for this goal: it gives vertex 1 the largest label. Build from the back, as in Theorem 4.2.6: the largest label goes to the largest vertex that has no arrow out of it."
    - "Reverse the arrows, take the largest free vertex with a max-heap, give it the labels n, n − 1, … in this order, and print the label of every vertex."
- id: cses-1691
  role: ladder
  card: euler-trail
  rung: 1
  twist: "Base case of the card: a closed route from crossing 1."
  summary: "Given n ≤ 10^5 crossings and m ≤ 2·10^5 two-way streets, print a route that starts and ends at crossing 1 and uses every street exactly once, or IMPOSSIBLE."
  hints:
    - "Each time the route passes through a crossing it uses two streets there. What does that say about the number of streets at every crossing?"
    - "Every degree must be even, and every street must be reachable from crossing 1. Theorem 4.2.7 says this is also enough."
    - "Check the degrees, then run the stack method from crossing 1 with a used mark per street; print the finished crossings in reverse order if there are m + 1 of them, else IMPOSSIBLE."
- id: lc-valid-arrangement-of-pairs
  role: ladder
  card: euler-trail
  rung: 2
  twist: "Arrows instead of two-way streets, and the start is not given: find it from out minus in. Values are renamed."
  summary: "Given up to 10^5 pairs [start, end] with values up to 10^9, list all the pairs in an order in which every pair starts where the previous one ended; such an order exists."
  hints:
    - "Think of each pair as an arrow from start to end. What kind of route does an arrangement describe?"
    - "A route that uses every arrow once (Theorem 4.2.7). It must start at the vertex with one more arrow out than in, if there is one; if every vertex is balanced, any vertex with an arrow will do."
    - "Rename the values to 0, 1, 2, … with a map, run the stack method with a pointer per vertex, and list the arrows between neighbouring vertices of the route."
- id: cf-267B
  role: ladder
  card: euler-trail
  rung: 3
  twist: "The vertices are the numbers on the dominoes, loops are allowed, and the turns have to be printed."
  summary: "Given n ≤ 100 dominoes with halves from 0 to 6, put them all in a row, turning some of them, so that touching halves are equal; print the order and the turns, or say it is impossible."
  hints:
    - "Draw the numbers 0 to 6 as points and each domino as a line between its two numbers. What does a good row look like in this picture?"
    - "A row is a route that uses every line once; a double domino is a loop. By Theorem 4.2.7 you need 0 or 2 odd numbers and all dominoes in one piece."
    - "Run the stack method from an odd number, or from any number that is used; a domino is turned when the route goes from its second number to its first."
- id: ac-abc286_g
  role: ladder
  card: euler-trail
  rung: 4
  twist: "Some edges may be used freely: merge the vertices they join before counting degrees."
  summary: "Given a connected graph with N, M ≤ 2·10^5 and a subset S of its edges, decide whether a walk uses every edge of S exactly once (edges outside S may be used any number of times)."
  hints:
    - "Edges outside S cost nothing. What can you say about two vertices joined by such an edge?"
    - "Vertices joined through edges outside S can be treated as one vertex: find these groups with a walk over those edges (topic 4.1) and give each group one name."
    - "Count the degree of every group using only the edges of S. The answer is Yes when at most two groups have an odd degree (Theorem 4.2.7); the groups are connected because the graph is."
- id: cf-508D
  role: ladder
  card: euler-trail
  rung: 5
  twist: "The vertices are pairs of symbols: build the graph from the pieces."
  summary: "Given n ≤ 2·10^5 pieces of 3 symbols (letters and digits), each a substring of a hidden password of length n + 2 that contains every piece once, restore a password or say there is none."
  hints:
    - "Where do two neighbouring pieces of the password overlap? How many symbols do they share?"
    - "Make the pairs of symbols the vertices and each piece an arrow from its first pair to its last pair. A password is then a route that uses every arrow once."
    - "Check the start and end balance of the arrows and that they are connected, run the stack method, and print the first pair followed by the last symbol of every later vertex; print NO if no route exists."
- id: ac-abc209_d
  role: drill
  summary: 'A tree of N ≤ 10^5 towns and Q ≤ 10^5 queries (c, d): two people leave towns c and d at the
    same moment, walking towards each other''s town at the same speed; do they meet at a town or on a
    road?'
- id: lc-is-graph-bipartite
  role: drill
  summary: Decide whether an undirected graph of at most 100 nodes, given by adjacency lists, can be split
    into two sets with every edge joining the two sets.
- id: cf-1702E
  role: drill
  summary: Dominoes carry two numbers each, and every number from 1 to n occurs exactly twice in total
    (n ≤ 2·10^5 over all tests); can the dominoes be split into two sets so that no number appears twice
    in one set?
- id: cf-1176E
  role: drill
  summary: 'A connected graph with n and m up to 2·10^5 over all tests: choose at most ⌊n/2⌋ vertices
    so that every vertex is chosen or adjacent to a chosen vertex.'
- id: cf-1867D
  role: drill
  summary: Decide whether a given array b (n ≤ 10^5 over all tests) can be produced by the allowed operations
    with parameter k; it depends on the lengths of the cycles of the graph i → b_i.
- id: lc-count-visited-nodes-in-a-directed-graph
  role: drill
  summary: A directed graph of n ≤ 10^5 nodes has exactly one outgoing edge per node; for every start
    node, count the different nodes visited before the walk meets a node it already visited.
- id: lc-course-schedule-ii
  role: drill
  summary: Return a valid order of numCourses ≤ 2000 courses given prerequisite pairs, or an empty list
    if there is none.
- id: lc-course-schedule-iv
  role: drill
  summary: For at most 100 courses with prerequisite pairs (indirect prerequisites count), answer queries
    asking whether course u is a prerequisite of course v.
- id: lc-count-the-number-of-computer-unlocking-permutations
  role: drill
  summary: Computers 0 to n − 1 (n ≤ 10^5) have password complexities; computer 0 starts unlocked, and
    computer i can be unlocked using an unlocked computer j < i of smaller complexity. Count the valid
    unlocking orders modulo 10^9 + 7.
- id: lc-score-after-flipping-matrix
  role: drill
  summary: In a binary matrix of at most 20 × 20 cells, a move toggles a whole row or column; each row
    is read as a binary number. Find the highest possible sum of the rows.
- id: lc-possible-bipartition
  role: lookalike
  summary: Split n ≤ 2000 people into two groups so that no pair from a list of at most 10^4 dislikes
    shares a group; answer yes or no.
- id: lc-divide-nodes-into-the-maximum-number-of-groups
  role: lookalike
  summary: Divide the nodes of an undirected graph (n ≤ 500, at most 10^4 edges) into numbered groups
    so that every edge joins nodes in neighbouring groups; give the largest possible number of groups,
    or −1.
- id: cses-1669
  role: lookalike
  summary: Print a round trip (a cycle through at least three different cities) in a graph of n ≤ 10^5
    cities and m ≤ 2·10^5 two-way roads, or say there is none.
- id: cses-1678
  role: lookalike
  summary: Print a round trip in a directed graph of n ≤ 10^5 cities and m ≤ 2·10^5 one-way flights, or
    say there is none.
- id: cses-1679
  role: lookalike
  summary: Print any order in which n ≤ 10^5 courses can be completed given m ≤ 2·10^5 requirements "a
    before b", or IMPOSSIBLE.
- id: cses-1757
  role: lookalike
  summary: Print the order of n ≤ 10^5 courses that completes course 1 as soon as possible, then course
    2, and so on, given m ≤ 2·10^5 requirements "a before b" (a valid schedule exists).
- id: cses-1693
  role: lookalike
  summary: "Print a route from level 1 to level n that uses each of m ≤ 2·10^5 one-way teleporters between n ≤ 10^5 levels exactly once, or IMPOSSIBLE."
- id: ac-abc190_e
  role: lookalike
  summary: "Gems may stand next to each other for M ≤ 10^5 given pairs among N ≤ 10^5 kinds; find the fewest gems in a row that contain each of K ≤ 17 chosen kinds, or -1."
- id: cses-1692
  role: review
  card: euler-trail
  review_set: 1
  summary: "Print a shortest bit string that contains every bit string of length n ≤ 15 as a substring."
- id: lc-cracking-the-safe
  role: drill
  summary: "A safe opens when the last n digits typed (base k, k^n ≤ 4096) equal its code; return a shortest string of keystrokes that must contain the code, whatever it is."
- id: cf-723E
  role: drill
  summary: "Give a direction to each of the m ≤ 2000 roads between n ≤ 200 cities so that as many cities as possible have as many roads going out as coming in."
- id: ac-abc292_d
  role: checkpoint
  card: undirected-cycle
  summary: In an undirected graph with N, M ≤ 2·10^5 (self-loops and repeated edges are allowed), decide
    whether every connected component has the same number of vertices and edges.
- id: ac-abc223_d
  role: checkpoint
  card: dependency-order
  summary: Find the lexicographically smallest permutation of 1..N (N ≤ 2·10^5) in which A_i appears before
    B_i for each of M ≤ 2·10^5 rules, or print −1 if there is none.
- id: cf-1594D
  role: checkpoint
  card: two-sides
  summary: Each of n players is an imposter (always lies) or a crewmate (always tells the truth); m comments
    say that player i claims player j to be an imposter or a crewmate. Find the largest possible number
