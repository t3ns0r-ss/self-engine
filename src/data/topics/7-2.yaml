decision_map:
- weak_signal: 'The same quantity for every vertex taken as the root: the sum of distances, the number
    of ways, the best start'
  choose: rerooting
  when: The answer for a child is made from the answer above its parent and the other children, with prefix
    and suffix values or the two best (Theorem 7.2.1).
  over:
  - card: subtree-dp
    topic: '7.1'
    because: 'Only one root is asked about: a single DP.'
  - card: farthest-each
    topic: '4.6'
    because: For the farthest vertex alone the ends of the diameter are enough.
- weak_signal: The same quantity for every vertex taken as the root where the combination is a maximum,
    a minimum, a product modulo any number or a pair of numbers
  choose: exclude-one
  when: The part above a child is the other parts of its parent combined, and the combination cannot be
    undone, so the two best values or prefix and suffix values are used (Theorem 7.2.2).
  over:
  - card: rerooting
    topic: '7.2'
    because: 'A sum or a count can be undone: subtract the part of the child.'
  - card: farthest-each
    topic: '4.6'
    because: The unweighted farthest vertex needs only the ends of a diameter.
glossary_added:
- rerooting
- ways out of a vertex
