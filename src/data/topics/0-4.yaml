# Topic 0.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.4"
draft: true
cards:
  - id: parity
    name: Parity invariant
    decisive_property: Every allowed move changes some integer quantity by an even amount (or flips its parity every time), so its parity is fixed by the start and the number of moves; a target with the other parity is impossible.
    from_theorem: Theorem 0.4.3
    how_to_test: Write down what one move does to a sum, a count or a coordinate sum, and check whether the change is always even (or always odd). Then compare the parity at the start and at the target.
    weak_signals:
      - '"Is it possible to reach …?", "can the array be made …?" with moves that change two things at once'
      - Moves of ±2, swaps of two elements, flips of two items
      - A sum that must split into two equal halves
    kill_signals:
      - "Parity matches but the answer still depends on sizes or order: parity is only a necessary condition, and the rest needs another argument"
    lookalikes:
      - description: Reach a target where each move changes a value by an arbitrary amount
        needs: divisibility (0.4) or a closed form (0.2)
        flipping_difference: Without a fixed even change per move, parity says nothing.
    complexity: O(1) after reading the input, or O(n) to count odd values.
  - id: divisibility
    name: Divisibility and counting multiples
    decisive_property: The condition depends only on remainders modulo k or on whether k divides a quantity, so it is decided by % and integer division; the multiples of k in [l, r] number ⌊r/k⌋ − ⌊(l−1)/k⌋.
    from_theorem: Theorem 0.4.2
    how_to_test: Ask whether replacing every value by its remainder modulo k changes the answer. If not, work with remainders; for counts of multiples use the floor formula, checking the sign of l − 1.
    weak_signals:
      - '"divisible by", "multiple of", "remainder when divided by"'
      - Counting numbers in a huge range [l, r] (up to 10^18) with a divisibility condition
      - Equal shares, groups of k, rounding up to the next multiple
    kill_signals:
      - The condition involves two divisors at once in a way that needs a common multiple (then gcd-lcm)
    lookalikes:
      - description: Count numbers in [l, r] divisible by a or by b
        needs: "gcd-lcm (0.4): subtract the multiples of lcm(a, b)"
        flipping_difference: With two divisors, numbers divisible by both are counted twice unless the LCM is subtracted.
    complexity: O(1) per query.
  - id: gcd-lcm
    name: GCD and LCM via Euclid
    decisive_property: The answer is the GCD or LCM of some numbers, or a quantity kept by remainders and subtractions (gcd(a, b) = gcd(b, a mod b) = gcd(a, b − a)), so Euclid computes it in O(log) steps.
    from_theorem: Theorem 0.4.5
    how_to_test: Check whether the process only subtracts one value from another or takes remainders; if so, the GCD is unchanged throughout. For a common multiple, check that a / gcd · b stays within the type.
    weak_signals:
      - Repeatedly subtract the smaller from the larger
      - '"largest size that divides …", "smallest number that is a multiple of all …"'
      - Events with periods that must coincide (clocks, cycles)
    kill_signals:
      - A GCD of every pair or a GCD over subranges with updates (later topics)
    lookalikes:
      - description: Can a sum of multiples of A have remainder C modulo B?
        needs: "mod-arithmetic-basic (0.4): remainders of kA repeat with period B"
        flipping_difference: The question is about remainders reachable by multiples, not about one common multiple; trying k = 1..B decides it.
    complexity: O(log max) per GCD; O(n log max) for an array.
  - id: mod-arithmetic-basic
    name: Arithmetic modulo m
    decisive_property: Only additions, subtractions and multiplications are applied, and the answer is asked modulo m (or only remainders matter), so every intermediate value can be reduced modulo m without changing the result.
    from_theorem: Theorem 0.4.4
    how_to_test: Check that no division is needed before the final answer, and that a product of two reduced values (below m²) fits in long long.
    weak_signals:
      - '"print the answer modulo 10^9 + 7" or "modulo 998244353"'
      - Huge sums or products, counts that grow exponentially
      - Pairs whose sum is divisible by k (pair remainders r and k − r)
    kill_signals:
      - "The formula divides (an average, a fraction, a binomial coefficient): that needs the modular inverse, topic 2.2"
    lookalikes:
      - description: The answer is a fraction p/q printed modulo a prime
        needs: modular inverse (2.2, a later topic)
        flipping_difference: Division modulo m is not the remainder of a division; it needs a later tool.
    complexity: O(number of operations), each O(1).
problems:
  - id: cf-4A
    role: ladder
    card: parity
    rung: 1
    twist: Base case of the card
    summary: Can a watermelon of weight w (w ≤ 100) be split into two parts that both have even, positive weight?
    hints:
      - If both parts are even, what is the parity of their sum?
      - Even plus even is even, so w must be even (Theorem 0.4.3). Is every even w possible?
      - YES exactly when w is even and w > 2 (w = 2 would need a part of weight 0).
  - id: cf-1367B
    role: ladder
    card: parity
    rung: 2
    twist: Count the misplaced elements of each parity; a swap fixes one of each kind.
    summary: "For each of t tests: an array of n ≤ 40 numbers; with swaps of any two elements, make every position i have the parity of i; the fewest swaps or −1."
    hints:
      - Which elements are in a wrong position, and what kinds of wrong are there?
      - x = odd values at even positions, y = even values at odd positions. A useful swap exchanges one of each kind, and no swap fixes two of the same kind.
      - If x = y the answer is x, else −1.
  - id: cses-1092
    role: ladder
    card: parity
    rung: 3
    twist: Parity rules out half the inputs; for the rest, an explicit construction proves possibility.
    summary: Split the numbers 1, 2, …, n (n ≤ 10^6) into two sets with equal sums, and print them, or report that it is impossible.
    hints:
      - What must the total sum n(n + 1)/2 satisfy for two equal halves to exist?
      - It must be even. When it is, take numbers from n downwards into the first set while they fit into the remaining half; every remainder below the current number can still be made exactly.
      - If n(n + 1)/2 is odd print NO. Else set need = n(n + 1)/4 and for i = n down to 1 put i in set 1 when i ≤ need (need −= i), otherwise in set 2. Use long long and fast output.
  - id: ac-abc125_d
    role: ladder
    card: parity
    rung: 4
    twist: The invariant is the parity of the number of negative values, under an operation that flips two signs.
    summary: An array of N integers (N ≤ 10^5, |A_i| ≤ 10^9); any number of times, multiply two adjacent elements by −1; the largest possible sum.
    hints:
      - What does one operation do to the number of negative values?
      - It changes it by −2, 0 or +2, so its parity never changes; and repeated operations can move a pair of minus signs anywhere, so any arrangement with that parity is reachable.
      - With an even count of negatives (zeros count as either sign), the answer is the sum of |A_i|; with an odd count, subtract 2·min|A_i|. Use long long.
  - id: ac-abc101_b
    role: ladder
    card: divisibility
    rung: 1
    twist: Base case of the card
    summary: Does the digit sum S(N) divide N (N ≤ 10^9)?
    hints:
      - How do you get the digits of N one at a time?
      - N % 10 is the last digit and N / 10 removes it; repeat on a copy of N.
      - Compute S on a copy, then print Yes when N % S == 0.
  - id: cses-1618
    role: ladder
    card: divisibility
    rung: 2
    twist: Count multiples of 5, 25, 125, … up to n instead of computing n!.
    summary: The number of trailing zeros of n! (n ≤ 10^9).
    hints:
      - A trailing zero comes from a factor 10 = 2·5. Which factor is rarer in n!?
      - "Factors 5 are rarer, so count them: every multiple of 5 up to n gives one, every multiple of 25 one more, and so on (Theorem 0.4.2)."
      - Answer n/5 + n/25 + n/125 + … while the power of 5 is at most n; keep the power in long long.
  - id: ac-abc182_c
    role: ladder
    card: divisibility
    rung: 3
    twist: Divisibility by 3 depends only on the digit sum modulo 3, so only remainders of digits matter.
    summary: Erase as few digits as possible from N (N < 10^18) so that the rest (at least one digit) is a multiple of 3; print the count or −1.
    hints:
      - When is a number a multiple of 3, in terms of its digits?
      - Exactly when its digit sum is (10 ≡ 1 modulo 3). With s = digit sum mod 3, you need to erase digits whose remainders add up to s modulo 3.
      - "s = 0: answer 0. Otherwise erase one digit with remainder s if one exists (1), else two digits with remainder 3 − s (2); answer −1 if that would erase every digit."
  - id: cses-1754
    role: ladder
    card: divisibility
    rung: 4
    twist: Divisibility gives a necessary condition, and a bound on the two piles completes it.
    summary: "For each of t ≤ 10^5 tests: two piles of a and b coins (≤ 10^9); each move removes 1 from one pile and 2 from the other; can both become empty?"
    hints:
      - How many coins does every move remove in total?
      - Three, so a + b must be divisible by 3. Also the larger pile loses at most 2 per move while the smaller loses at least 1.
      - YES when (a + b) % 3 == 0 and max(a, b) ≤ 2·min(a, b); otherwise NO.
  - id: cf-1360D
    role: ladder
    card: divisibility
    rung: 5
    twist: Search the divisors of n up to √n (topic 0.2) for the largest one not exceeding k.
    summary: "For each of t tests: buy exactly n shovels (n, k ≤ 10^9) using packages of one size d ≤ k; the fewest packages."
    hints:
      - If every package has d shovels and the total is exactly n, what must d be?
      - d must divide n and be at most k; the number of packages is n / d, so the largest such d is best.
      - Loop i from 1 while i·i ≤ n; for each divisor i, consider d = i and d = n / i when they are at most k; print n / (largest d).
  - id: lc-find-greatest-common-divisor-of-array
    role: ladder
    card: gcd-lcm
    rung: 1
    twist: Base case of the card
    summary: The GCD of the smallest and the largest element of an array (length ≤ 1000).
    hints:
      - Which two numbers are involved?
      - Find the minimum and maximum, then apply Euclid (Theorem 0.4.5).
      - "Return gcd(min, max), with the loop while b ≠ 0: (a, b) = (b, a % b), or std::gcd."
  - id: lc-greatest-common-divisor-of-strings
    role: ladder
    card: gcd-lcm
    rung: 2
    twist: The GCD appears in the lengths of strings, not in values.
    summary: The longest string x such that both str1 and str2 (lengths ≤ 1000) are copies of x repeated.
    hints:
      - If x repeats to make both strings, what must the length of x divide?
      - It must divide both lengths. A common repeating block exists exactly when str1 + str2 equals str2 + str1.
      - If str1 + str2 ≠ str2 + str1 return ""; otherwise return the prefix of str1 of length gcd(len1, len2).
  - id: ac-abc297_d
    role: ladder
    card: gcd-lcm
    rung: 3
    twist: "Subtracting repeatedly is Euclid in slow motion: replace a run of subtractions by one division."
    summary: Starting from A and B (≤ 10^18), repeatedly subtract the smaller from the larger until they are equal; how many subtractions?
    hints:
      - With A = 10^18 and B = 1 the process takes about 10^18 steps. What does a run of subtractions of B from A amount to?
      - Subtracting B from A while A > B is the same as replacing A by A mod B, except that it stops at B when B divides A.
      - "While A ≠ B (say A > B): if A % B == 0 add A / B − 1 and stop; else add A / B and set A = A % B. O(log) rounds (Theorem 0.4.5)."
  - id: ac-abc109_c
    role: ladder
    card: gcd-lcm
    rung: 4
    twist: Turn the question into the GCD of differences.
    summary: From position X, a walker can move ±D any number of times; find the largest D that lets it visit every city x_1..x_N (N ≤ 10^5, values ≤ 10^9).
    hints:
      - Which positions can the walker reach for a fixed D?
      - Exactly X + kD for integers k, so D must divide every |x_i − X|.
      - The answer is the GCD of all |x_i − X|, folded with Euclid from 0.
  - id: ac-abc070_c
    role: ladder
    card: gcd-lcm
    rung: 5
    twist: "The LCM of many large numbers: divide before multiplying to stay within long long."
    summary: N clocks (N ≤ 100) complete a turn every T_i seconds (T_i ≤ 10^18); when do all hands point up together again (guaranteed ≤ 10^18)?
    hints:
      - A hand points up at every multiple of T_i. What is the first time that is a multiple of all T_i?
      - The LCM of all T_i (Theorem 0.4.6), folded from 1.
      - "L = L / gcd(L, T_i) * T_i: dividing first keeps every value at most the final answer, ≤ 10^18."
  - id: ac-abc266_b
    role: ladder
    card: mod-arithmetic-basic
    rung: 1
    twist: Base case of the card
    summary: The remainder of N (|N| ≤ 10^18) modulo 998244353, as a value in [0, 998244353).
    hints:
      - What does C++ print for -7 % 5?
      - "It prints −2: the remainder takes the sign of N (Theorem 0.4.1)."
      - Print ((N % M) + M) % M with M = 998244353.
  - id: ac-abc275_b
    role: ladder
    card: mod-arithmetic-basic
    rung: 2
    twist: Products of three values up to 10^18 must be reduced factor by factor, and the difference made non-negative.
    summary: For six non-negative integers up to 10^18 with A·B·C ≥ D·E·F, print (A·B·C − D·E·F) mod 998244353.
    hints:
      - A·B·C can reach 10^54. Which values can you reduce before multiplying?
      - "Every factor, by Theorem 0.4.4: reduce each modulo M first, then multiply two at a time and reduce again."
      - x = (a·b % M)·c % M and y = (d·e % M)·f % M with reduced factors; print (x − y + M) % M.
  - id: cses-1617
    role: ladder
    card: mod-arithmetic-basic
    rung: 3
    twist: A count that grows exponentially, computed modulo 10^9 + 7 step by step.
    summary: The number of bit strings of length n (n ≤ 10^6), modulo 10^9 + 7.
    hints:
      - How many strings are there, as a formula?
      - 2^n, far too large to store. Each step multiplies by 2, and multiplication commutes with taking remainders.
      - Start with 1 and multiply by 2 n times, taking % (10^9 + 7) after every step.
  - id: lc-pairs-of-songs-with-total-durations-divisible-by-60
    role: ladder
    card: mod-arithmetic-basic
    rung: 4
    twist: "Pair up remainders: a sum is divisible by 60 exactly when the remainders add to 0 modulo 60."
    summary: Count pairs i < j of songs (n ≤ 6·10^4, durations ≤ 500) whose total duration is divisible by 60.
    hints:
      - Checking all pairs costs n² / 2 ≈ 1.8·10^9. When is a + b divisible by 60, in terms of a mod 60 and b mod 60?
      - Exactly when (a mod 60 + b mod 60) mod 60 = 0, so a song with remainder r pairs with remainder (60 − r) mod 60.
      - Keep cnt[0..59]; for each song add cnt[(60 − r) % 60] to the answer, then increment cnt[r]. Use long long.
  - id: ac-abc409_c
    role: ladder
    card: mod-arithmetic-basic
    rung: 5
    twist: Positions on a circle are running sums modulo L; equilateral triangles need L divisible by 3.
    summary: Points 1..N (N ≤ 3·10^5) lie on a circle of length L (≤ 3·10^5), point i + 1 at distance d_i clockwise from point i; count the triples forming an equilateral triangle.
    hints:
      - Where is point i on the circle, as a number in [0, L)?
      - p_1 = 0 and p_{i+1} = (p_i + d_i) mod L. Three points form an equilateral triangle exactly when they sit at p, p + L/3, p + 2L/3, so L must be divisible by 3.
      - Count cnt[p] for every position. If L % 3 ≠ 0 the answer is 0; otherwise add cnt[p]·cnt[p + L/3]·cnt[p + 2L/3] for p < L/3, in long long.
  - id: ac-abc178_c
    role: ladder
    card: mod-arithmetic-basic
    rung: 6
    twist: "Count the complement: all sequences minus those missing a required digit, with a subtraction modulo p."
    summary: Count sequences of N digits (N ≤ 10^6) that contain at least one 0 and at least one 9, modulo 10^9 + 7.
    hints:
      - It is easier to count the sequences that fail. Which ones fail?
      - Those with no 0 (9^N), those with no 9 (9^N); the ones with neither (8^N) are in both groups, so 9^N + 9^N − 8^N sequences fail.
      - Answer (10^N − 2·9^N + 8^N) mod p, each power by a loop of N multiplications; add 2p before the final % to keep it non-negative.
