drill:
- problem: lc-can-i-win
  answer:
    topic: '3.7'
    card: assignment-mask
  property: A position is the set of numbers already picked (the total follows from it), at most 2^20
    sets; a set is winning if some unused number reaches T or leads to a losing set.
  why_others_fail: Searching the game tree without remembering sets visits up to 20! move orders; greedy
    "take the largest" can hand the opponent a winning total.
- problem: lc-count-the-number-of-square-free-subsets
  answer:
    topic: '3.7'
    card: assignment-mask
  property: A product is square-free when no prime is used twice; the primes below 30 are 10, so cnt[mask]
    over the primes already used is a knapsack over 2^10 masks.
  why_others_fail: Enumerating subsets of 1000 numbers is impossible; a product formula ignores the clashes
    between numbers sharing a prime.
- problem: lc-the-number-of-good-subsets
  answer:
    topic: '3.7'
    card: assignment-mask
  property: Only 30 different values exist; count each, and run a DP over masks of the 10 primes below
    30, adding each square-free value with its multiplicity; the 1s multiply the result by 2^(count of
    1s).
  why_others_fail: Enumerating subsets of 10^5 numbers is impossible, and a product of independent choices
    per value ignores that two values may share a prime (6 and 10 both use 2).
- problem: lc-maximum-number-of-achievable-transfer-requests
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: 'With 16 requests there are 2^16 subsets, and each subset is checked on its own in O(16):
    plain enumeration.'
  why_others_fail: 'No DP is needed: nothing is combined between subsets, so a mask DP would only add
    work.'
- problem: lc-minimum-time-to-break-locks-i
  answer:
    topic: '0.5'
    card: permutations
  property: 'Only 8! = 40320 orders, each evaluated in O(n): try them all.'
  why_others_fail: A mask DP over (set of broken locks) also works, but with n ≤ 8 trying every order
    is simpler.
- problem: lc-minimum-moves-to-spread-stones-over-grid
  answer:
    topic: '0.5'
    card: permutations
  property: At most 8 extra stones must go to at most 8 empty cells; try every matching order (≤ 8!) and
    add the Manhattan distances.
  why_others_fail: Simulating moves one by one is a search over grid states; matching extra stones to
    empty cells directly is enough.
- problem: lc-longest-string-chain
  answer:
    topic: '3.4'
    card: lis-reduction
  property: A chain goes from shorter to longer words, so sorting by length gives the order; best[w] =
    1 + best of w with one letter removed, looked up in a map.
  why_others_fail: It looks like ordering items along a path, but with 1000 words a mask is impossible,
    and the length already fixes the order.
- problem: cses-1744
  answer:
    topic: '3.6'
    card: merge-split
  property: 'Each cut splits a piece into two independent rectangles: moves[a][b] = 1 + min over all cuts
    of the two parts (0 for a square).'
  why_others_fail: No small set of items is involved, so no mask; the greedy "cut off the largest square"
    fails (5 × 6 needs 4 cuts, the greedy 5).
lookalike_pairs:
- a: lc-maximum-compatibility-score-sum
  b: lc-maximum-matching-of-players-with-trainers
  a_tool:
    topic: '3.7'
    card: assignment-mask
  b_tool:
    topic: '1.5'
    card: sorted-matching
  flipping_difference: Both pair the items of two lists one-to-one. In A the value of a pair is an arbitrary
    table (shared answers), so no order helps and the set of used mentors must be the state. In B a pair
    works by a threshold on numbers, so after sorting the smallest player takes the smallest trainer that
    fits.
  shared_surface: Both pair the items of two lists one-to-one.
  flipping_input: 'A: n ≤ 20 with a table of compatibility scores for each pair, so no order helps and
    the set of used partners is the state. B: abilities and capacities up to 10^5, where a pair works
    by a threshold, so after sorting the smallest player takes the smallest trainer that fits.'
- a: lc-maximum-product-of-the-length-of-two-palindromic-subsequences
  b: lc-count-number-of-maximum-bitwise-or-subsets
  a_tool:
    topic: '3.7'
    card: submask-mask
  b_tool:
    topic: '0.5'
    card: subset-bitmask
  flipping_difference: Both look at the subsets of a small set. In B each subset is judged alone, so a
    single loop over masks is enough. In A two disjoint subsets must be combined, so for each mask the
    submasks of its complement are visited, 3^n pairs in all.
  shared_surface: Both look at the subsets of a small set.
  flipping_input: 'A: two disjoint palindromic subsets of a string of length 12 whose lengths multiply
    to the most, so for each mask the submasks of its complement are visited. B: the number of subsets
    of 12 numbers with the largest OR, each subset judged alone in one loop over the 4096 masks.'
self_test:
- q: For the cost matrix of Section 4.1, what is dp[011], and which assignments give it?
  a: '3: worker 0 takes job 1 (cost 1) and worker 1 job 0 (cost 2). The other order, job 0 then job 1,
    costs 4 + 0.'
- q: Why can the masks be filled in increasing numeric order?
  a: Every transition removes (or adds) one bit, and removing a bit from a mask gives a smaller integer,
    so all states a mask reads come earlier in that order (Theorem 3.2.3).
- q: For n = 16 cities, how many states does the TSP table have, and how many steps does it take?
  a: '2^16 · 16 ≈ 10^6 states, each trying up to 16 next cities: about 1.7 · 10^7 steps.'
- q: Weights 1, 3, 2, 2, 2 and capacity 5. What is the answer, and why does keeping only the smallest
    number of groups, ignoring the fill, fail?
  a: 2 groups, {1, 2, 2} and {3, 2}. Among packings of a set with the fewest groups, the one with the
    lightest last group must be kept; keeping a fuller one can force a later item into a new group (that
    version prints 3).
- q: List the non-empty submasks of 1011 (binary) in the order of the loop s = (s − 1) & m. How many (mask,
    submask) pairs are there for n = 15?
  a: 1011, 1010, 1001, 1000, 0011, 0010, 0001 (11, 10, 9, 8, 3, 2, 1). For n = 15 there are 3^15 ≈ 1.4
    · 10^7 pairs.
- q: Eight locks must be broken in the best order. Mask DP or trying all orders?
  a: 'Either works: 8! = 40320 orders is tiny. The mask DP (2^8 · 8 states) becomes necessary from about
    n = 12, where n! is too large.'
- q: The table gives dp[full][v] for every last city v. How do you get the shortest Hamiltonian path,
    and how the shortest tour?
  a: 'Path: the minimum of dp[full][v]. Tour: the minimum of dp[full][v] + d(v, start), the edge back
    to the start.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - lc-smallest-sufficient-team
  - ac-abc215_e
  - cses-1690
decision_map:
- weak_signal: Pair or order n ≤ 20 items with an arbitrary cost table; each item used once
  choose: assignment-mask
  when: Only the set of used items matters for the future, and the next position is its size (Theorem
    3.7.1).
  over:
  - card: permutations
    because: Trying all orders is fine only up to n ≈ 9 (9! ≈ 3.6 · 10^5).
    topic: '0.5'
  - card: sorted-matching
    because: When a pair works by a threshold on numbers, sorting and a greedy match are enough for n
      up to 10^5.
    topic: '1.5'
- weak_signal: Visit all n ≤ 18 places exactly once; shortest route or number of routes
  choose: path-mask
  when: The future depends on the visited set and the current place (Theorem 3.7.2); add the edge back
    for a tour.
  over:
  - card: sort-then-scan
    because: Places on a line are visited best in sorted order; no mask is needed.
    topic: '1.1'
  - card: lis-reduction
    because: When the order is forced by a key (word length, size), sorting by it gives a chain DP over
      1000s of items.
    topic: '3.4'
- weak_signal: Fewest rides, sessions or bins for n ≤ 20 items under a capacity
  choose: group-mask
  when: Groups are interchangeable; keep (groups, last fill) per set and add items one at a time (Theorem
    3.7.3).
  over:
  - card: opposite-ends
    because: With at most two items per group, pair the heaviest with the lightest after sorting.
    topic: '1.3'
  - card: subset-sums
    because: Two groups with equal sums is a reachable-sum question that handles large n.
    topic: '3.3'
- weak_signal: Split n ≤ 16 items into groups of any size with a score per group; choose two disjoint
    subsets
  choose: submask-mask
  when: A set's value combines one group (a submask) with the rest, O(3^n) (Theorem 3.7.4).
  over:
  - card: subset-bitmask
    because: If each subset is judged on its own, a single loop over the 2^n masks is enough.
    topic: '0.5'
glossary_added:
- bitmask DP
- submask
- Hamiltonian path
- TSP
