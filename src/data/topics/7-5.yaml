# Topic 7.5 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.5'
uses:
- topic: '0.3'
  what: 'Implementation: reading a given board position and checking it'
- topic: '0.4'
  what: 'Parity and divisibility: the case analysis on counts modulo 3 and the divisor games'
- topic: '0.5'
  what: 'Brute force: the search over all positions of a game, the reference of every check'
- topic: '1.1'
  what: 'Sorting: a rule that orders the stones, used by a greedy look-alike'
- topic: '1.2'
  what: 'Prefix sums: the one-dimensional DP of the score game'
- topic: '1.4'
  what: 'Binary search: a search on the answer around a greedy check'
- topic: '1.7'
  what: 'Bitwise operations: the xor, its highest bit and the arithmetic of Nim'
- topic: '2.1'
  what: 'Number theory: prime factors and divisors in games on numbers'
- topic: '3.1'
  what: 'Backtracking: the search over the positions of a small board'
- topic: '3.2'
  what: 'Dynamic programming: a value for each position, built from the positions it moves to'
- topic: '3.6'
  what: 'Interval DP: score games where the players take from the two ends of a row'
- topic: '3.7'
  what: 'Bitmask DP: games where the state is the set of numbers already used'
- topic: '4.1'
  what: 'Graph traversal: the states of a game as a graph, searched from the end'
- topic: '4.2'
  what: 'Graph structure: cycles and the order of a directed graph'
- topic: '4.5'
  what: 'Trees: the vertices and leaves of a game on a tree'
- topic: '6.3'
  what: 'Trie: a game that builds a word letter by letter in a dictionary'
- topic: '7.2'
  what: 'DP on DAGs: a game on an acyclic state graph'
theorems:
- id: 7.5.1
  title: Winning and losing positions
  plain_words: 'Start from the positions where the game is over: the player to move there has lost. A
    position from which one can move to a lost position is won. A position from which every move leads
    to a won position is lost. Go on until nothing new can be said. If the moves can go round in a circle,
    some positions may never get a label, and those are the draws, where each player can keep avoiding
    defeat for ever.'
  code: 7.5/thm-1
- id: 7.5.2
  title: Nim
  plain_words: The xor 0 is a position from which every move spoils the balance, and from every unbalanced
    position there is a move that restores it. The game ends in a balanced position (no stones), so whoever
    balances the position last wins. To balance, look at the highest bit in which the piles are unbalanced;
    some pile has a 1 there, and it can be cut so that all the bits of the xor are repaired, because changing
    that bit from 1 to 0 makes the number smaller.
  code: 7.5/thm-2
- id: 7.5.3
  title: Sprague–Grundy
  plain_words: 'Every impartial game behaves like a Nim pile whose size is its Grundy number: the mex
    says that from the position one can reach every smaller number, and none equal to itself, exactly
    as from a Nim pile of that size. A sum of Nim piles is decided by the xor of their sizes, so a sum
    of arbitrary games is decided by the xor of their Grundy numbers.'
  code: 7.5/thm-3
- id: 7.5.4
  title: Periodicity of subtraction games
  plain_words: The next number depends only on the last $m$ numbers, and these numbers are small. There
    are only finitely many different windows of $m$ small numbers, so the same window must come twice,
    and from then on the sequence repeats. The program watches for the first repeated window, and then
    every position far away is read from the period.
  code: 7.5/thm-4
cards:
- id: win-lose
  name: Label the positions as winning or losing from the end of the game
  from_theorem: 7.5.1
  decisive_property: Two players move alternately by the same rules, the player who cannot move loses,
    the positions (heap sizes, states of a board, vertices) can be listed, and a position is winning exactly
    when some move leads to a losing one.
  how_to_test: 'Write the complete state of the game, including whose turn it is when the players have
    different moves. Count the states: if there are at most about 10^7 and each has few moves, a table
    over them is enough. Check the end of the game (positions without moves are lost). If positions can
    repeat, use the counters of Theorem 7.5.1 and expect draws.'
  constraint_shapes:
  - 'a heap of n = 10^6 sticks with at most 100 allowed removals: 10^8 steps label all the sizes, against
    an exponential search without a memo'
  - 'a monster on a circle of n = 7000 objects, two players with up to 7000 steps each: about 10^8 edges,
    labelled by counters in O(V + E)'
  weak_signals:
  - form: 'Asks who wins (or the result: win, lose, loop) from a given position of a two-player game with
      perfect play'
    shape: a heap, a circle, a grid or a graph with up to 10^6 positions
  - form: Asks for the winner from every starting position of a game with a small set of moves
    shape: n up to 10^6, at most 100 moves
  - form: Asks who wins a game on a graph that may have cycles, where a draw is possible
    shape: up to 10^5 vertices, moves depending on the player
  kill_signals:
  - 'The players do not have the same moves and the state does not record whose turn it is: the label
    of a position is then not a function of the position alone; put the player into the state'
  - 'The game has a score to maximise and not a win/lose result: the table is over the best score difference
    (topic 3.6 or 3.2), and the rule "the last mover wins" gives a wrong answer (the coins 1, 5, 2: the
    first player loses on points, but takes the last coin)'
  in_action:
    statement: A heap of n sticks and a set of allowed removals p_1, …, p_k. The players remove sticks
      in turn; the player who cannot move loses. For every heap size 1..n tell who wins.
    constraints: n ≤ 10^6, k ≤ 100.
    budget: The sequences of moves are exponential; labelling n sizes with k moves each costs n·k = 10^8.
    candidates:
    - tool: Search all sequences of moves (topic 0.5)
      verdict: rejected
      because: Exponential without a memo.
    - tool: Grundy numbers (this topic)
      verdict: rejected
      because: 'More than needed: only the winner of one heap is asked.'
    - tool: Label the sizes in increasing order (this topic)
      verdict: chosen
      because: The game is finite and acyclic, and a position is winning exactly when some move leads
        to a losing position (Theorem 7.5.1).
    property_check: Both players have the same moves, the game is finite, the player who cannot move loses.
      The property holds.
    decision: 'win[0] = false; win[x] = true if some p ≤ x has win[x − p] false: O(n·k).'
  examples:
    positive:
    - inline:
        input: A heap of 7 sticks; each player removes 1, 3 or 4 sticks; the player who cannot move loses.
          Does the player to move win (answer W) or lose (answer L)?
        answer: L
        why: 'The labels of the heaps 0 to 7 are L W L W W W W L (Theorem 7.5.1): from 7 every move leads
          to a winning heap (6, 4 or 3).'
    - inline:
        input: A game on the positions 0, 1, 2, 3 with the moves 0→1, 1→0, 2→0, 2→3; the player who cannot
          move loses. The player to move stands at the position 2. Is the result W (win), L (lose) or
          D (draw)?
        answer: W
        why: 'The position 3 has no moves: L. The position 2 has a move to 3, so it is W. The positions
          0 and 1 move only to each other and stay unlabelled: draws (Theorem 7.5.1 (b)).'
    - worked_example: cses-1729
      why: 'Who wins a heap game with a small set of removals, for every size up to 10^6: the table of
        win/lose in increasing order.'
    negative:
    - inline:
        input: The coins 1, 5, 2 lie in a row; the players take a coin from either end in turn, and the
          player with the larger total at the end wins. Does the first player win (yes or no)?
        answer: 'no'
        method_gives: 'yes'
        why: The first player ends with 3 and the second with 5, so the first player loses on points.
          The rule "the player who takes the last coin wins" says that the first player takes the last
          of three coins and wins. The result depends on the scores, not on who moves last.
      correct_tool:
        topic: '3.6'
        card: take-from-ends
    - problem: lc-predict-the-winner
      why: 'Asks who gets the larger score when the players take numbers from the two ends: a DP on the
        best difference of scores over the intervals, not a win/lose label.'
      correct_tool:
        topic: '3.6'
        card: take-from-ends
  lookalikes:
  - description: A score game (the larger total wins)
    tool:
      topic: '3.6'
      card: take-from-ends
    flipping_difference: When the winner is the player with more points, the table holds the best score
      difference of the remaining part; the label "winning" is not enough.
  - description: Several independent heaps played together
    tool:
      topic: '7.5'
      card: grundy-sum
    flipping_difference: A sum of games has too many positions to label; each part gets a Grundy number
      and the numbers are combined by xor.
  complexity: O(V + E) time and memory for a game graph; O(n·k) for a heap game with k removals.
- id: nim-sum
  name: 'Nim: any number of stones from one pile, decided by the xor of the sizes'
  from_theorem: 7.5.2
  decisive_property: The position is a set of independent piles, a move takes any positive number of items
    from exactly one pile (or the game can be seen as such, with a hidden pile), and the player who cannot
    move loses; the position is lost exactly when the xor of the sizes is 0.
  how_to_test: Identify the piles. Check that a move changes one pile only and that any smaller size can
    be reached from a pile (not only a fixed number of items less). If the moves are limited (at most
    2 stones, one stone from several piles), use the Grundy numbers instead. Compute the xor of the sizes;
    for hidden Nim (stairs, rules stated with the xor) find which part of the position is the pile.
  constraint_shapes:
  - 'n = 10^5 piles of up to 10^9 stones: the positions are astronomically many, against one xor of n
    numbers'
  - 'n = 10^5 runs of consecutive pile sizes up to 10^16: the piles cannot be listed, against the xor
    of a run in O(1) by the formula for 0..k'
  weak_signals:
  - form: Asks who wins a game with several piles where a move takes any number of stones from one pile
    shape: n up to 10^6 piles, sizes up to 10^9 or 10^16
  - form: Asks who wins a game on stairs or along a line where balls move one step down, the last mover
      wins
    shape: n up to 10^5 stairs, up to 10^9 balls
  - form: Asks who wins a game where players erase numbers and the rules mention the xor of what is left
    shape: n up to 1000 numbers
  kill_signals:
  - 'A move may take only a limited number of stones: with at most 2 stones per move, a pile of 3 is lost
    for the player to move, while the xor of the sizes (3) says he wins (use the Grundy numbers)'
  - 'A move may touch several piles at once (one stone from each pile of a chosen set): two piles of 1
    are won by taking both, while the xor of the sizes says that the first player loses'
  in_action:
    statement: 'Several quarries: each has a run of heaps of the consecutive sizes x, x+1, …, x+m−1 (up
      to 10^16). A move takes any positive number of stones from one heap; the player who cannot move
      loses. Who wins?'
    constraints: n quarries, x and m up to 10^16.
    budget: The heaps cannot be listed. Need O(1) for each quarry.
    candidates:
    - tool: A table over the positions (this topic)
      verdict: rejected
      because: The positions are made of many huge numbers.
    - tool: List the heaps and xor them (topic 1.7)
      verdict: rejected
      because: A run can have 10^16 heaps.
    - tool: The xor of a run by the formula for 0..k (this topic)
      verdict: chosen
      because: Nim is decided by the xor of the sizes (Theorem 7.5.2), and the xor of a run is two values
        of the formula for 0..k.
    property_check: 'A move takes any number of stones from one heap and the heaps are independent: Nim.
      The property holds.'
    decision: 'total = xor over the quarries of (xorUpTo(x + m − 1) xor xorUpTo(x − 1)); the first player
      wins iff total ≠ 0: O(n).'
  examples:
    positive:
    - inline:
        input: Nim with the piles 3, 4, 5. Does the first player (answer first) or the second player (answer
          second) win?
        answer: first
        why: The xor 3 ⊕ 4 ⊕ 5 = 2 is not 0; the first player wins by leaving 1, 4, 5, whose xor is 0
          (Theorem 7.5.2).
    - inline:
        input: A staircase of 4 stairs with 5, 2, 7, 2 balls. A move takes any positive number of balls
          from a stair k ≥ 2 to the stair k − 1; the player who cannot move loses. Does the first or the
          second player win?
        answer: second
        why: 'The balls on the even stairs are Nim piles: the stairs 2 and 4 have 2 and 2 balls, with
          the xor 0, so the second player wins.'
    - worked_example: lc-chalkboard-xor-game
      why: A game of erasing numbers decided by the xor of the board and the parity of their count.
    negative:
    - inline:
        input: One pile of 3 stones. A move takes 1 or 2 stones. The player who cannot move loses. Does
          the first or the second player win?
        answer: second
        method_gives: first
        why: 'A pile of 3 is lost for the player to move: whatever he takes (1 or 2), the opponent takes
          the rest. The xor rule of Nim says that the size 3 is a win for the first player, but a move
          may not take all 3 stones.'
      correct_tool:
        topic: '7.5'
        card: grundy-sum
    - problem: lc-can-i-win
      why: 'Asks who wins when numbers are chosen without repetition until a total is reached: the state
        is the set of numbers used, a bitmask table, not a Nim pile.'
      correct_tool:
        topic: '3.7'
        card: assignment-mask
  lookalikes:
  - description: Piles with a limit on the number of stones taken in a move
    tool:
      topic: '7.5'
      card: grundy-sum
    flipping_difference: A limit makes the xor of the sizes wrong; each pile gets a Grundy number (size
      modulo the limit plus one for the limit of removals 1..limit) and the numbers are xored.
  - description: A game of parity where a move touches several piles
    tool:
      topic: '7.5'
      card: grundy-pattern
    flipping_difference: 'When a move changes several piles at once, the piles are not independent: a
      brute force on small cases finds the pattern (for example, "some pile is odd").'
  complexity: O(n) time for n piles (O(1) for a run of sizes).
- id: grundy-sum
  name: 'Sums of independent games: the xor of the Grundy numbers of the parts'
  from_theorem: 7.5.3
  decisive_property: The position is made of independent parts, a move changes exactly one part (possibly
    splitting it into new independent parts), the game is finite with normal play, and the Grundy number
    of one part (the mex over its moves) can be computed or guessed.
  how_to_test: Cut the position into parts that do not influence each other. Check that every move touches
    one part only. Compute the Grundy numbers of one part by the mex for small sizes; for large sizes
    find a formula or a period (next card). The sum is lost exactly when the xor of the numbers is 0.
    If a move touches two parts at once, the property fails.
  constraint_shapes:
  - 'n = 2·10^5 piles of up to 10^9 stones with moves of L to R stones: the sum has astronomically many
    positions, against a formula for the Grundy number of one pile and one xor'
  - 'n = 10^5 numbers up to 10^6 where a move replaces a number by a proper divisor: a sieve gives the
    Grundy number of every number, and one xor'
  weak_signals:
  - form: Asks who wins a game that is a collection of independent objects of the same kind (heaps, numbers,
      intervals) where a move changes one object
    shape: n up to 2·10^5 objects, sizes up to 10^9
  - form: Asks who wins a game where a move splits an object into independent objects
    shape: sizes up to 2000, a table of Grundy numbers by the mex over the splits
  - form: Asks who wins independent heaps with a range of allowed removals
    shape: sizes up to 10^9, the Grundy number by a formula with a period
  kill_signals:
  - 'A move touches several parts at once: in the game "remove one stone from each pile of a chosen set",
    two piles of 1 are a win for the first player (take both), while the numbers of the single piles (1
    and 1) have the xor 0 (find the pattern, next card)'
  - 'The game has cycles, or the players have different moves: Grundy numbers are not defined; use the
    labels of Theorem 7.5.1 with the player in the state'
  in_action:
    statement: N piles of A_i stones; a move removes between L and R stones from one pile; the player
      who cannot move loses. Who wins?
    constraints: N ≤ 2·10^5, A_i ≤ 10^9.
    budget: The positions of the sum are astronomically many. Need O(N).
    candidates:
    - tool: 'Plain Nim: the xor of the sizes (this topic)'
      verdict: rejected
      because: The number of stones per move is limited, so the xor of the sizes is wrong.
    - tool: A table of Grundy numbers up to 10^9
      verdict: rejected
      because: Too big.
    - tool: The Grundy number of one pile by its period, then the xor (this topic)
      verdict: chosen
      because: The piles are independent; a pile has the number ⌊(A mod (L + R)) / L⌋ (Theorem 7.5.3).
    property_check: 'Independent piles, a move changes one pile, a finite game: a sum of games. The property
      holds.'
    decision: 'g(A) = (A mod (L + R)) / L; the first player wins iff the xor of the g(A_i) is not 0: O(N).'
  examples:
    positive:
    - inline:
        input: The heap game with the removals 1, 3, 4 is played on the three heaps 5, 3, 6 together (a
          move is made in one heap). Does the first or the second player win?
        answer: second
        why: The Grundy numbers of the heaps are 3, 1, 2 (the table starts 0 1 0 1 2 3 2); their xor 3
          ⊕ 1 ⊕ 2 = 0, so the second player wins (Theorem 7.5.3).
    - inline:
        input: Two piles of 4 and 7 stones; a move removes 2 or 3 stones from one pile; the player who
          cannot move loses. Does the first or the second player win?
        answer: first
        why: 'A pile has the number ⌊(A mod 5) / 2⌋: 4 gives 2 and 7 gives 1; the xor 3 is not 0, so the
          first player wins.'
    - worked_example: cses-2207
      why: 'A move splits a heap into two independent heaps: the Grundy number of a heap is the mex of
        the xors of the numbers of the two parts.'
    negative:
    - inline:
        input: Two piles of 1 stone. A move chooses any non-empty set of non-empty piles and removes one
          stone from each. Does the first or the second player win?
        answer: first
        method_gives: second
        why: The first player takes one stone from both piles and the second player cannot move. Treating
          each pile as a separate game with the single move "remove one stone" gives the numbers 1 and
          1, whose xor is 0 and the answer "second"; but a move touches both piles, so they are not independent.
      correct_tool:
        topic: '7.5'
        card: grundy-pattern
    - problem: lc-stone-game-vii
      why: 'Asks for the best score difference when the players take stones from the two ends: a score
        to maximise, with the state an interval, not a sum of independent games.'
      correct_tool:
        topic: '3.6'
        card: take-from-ends
  lookalikes:
  - description: Independent heaps with any number of stones taken
    tool:
      topic: '7.5'
      card: nim-sum
    flipping_difference: If a move takes any number of stones from one heap, the Grundy number of a heap
      is its size and the xor of the sizes decides.
  - description: A single token on a graph (not a sum of games)
    tool:
      topic: '7.5'
      card: win-lose
    flipping_difference: With one token, label the positions by Theorem 7.5.1; Grundy numbers are needed
      only when several such games are played at the same time.
  complexity: O(size · moves) for the Grundy numbers of one part (or O(1) with a formula), then O(parts)
    for the xor.
- id: grundy-pattern
  name: Find the pattern of the results by a brute force, then prove it
  from_theorem: 7.5.4
  decisive_property: The state space is too large for a table, but the game can be solved by brute force
    on small sizes, the results show a pattern (a period, a formula in a few quantities, or a parity),
    and the pattern can be proved by induction on the size.
  how_to_test: Write a brute force for small sizes and print the results (the winners, or the Grundy numbers)
    in a table. Look for a period, a parity, a threshold, or a formula in the maximum or the sum. State
    the pattern and prove it by induction (the result after any move is known by the pattern); compare
    it with the brute force for all small cases and far beyond the first period. If no pattern shows up
    where the brute force reaches, the property is not established.
  constraint_shapes:
  - 'n = 10^9 and a move subtracts a divisor: the positions cannot be tabled, but the brute force for
    n up to 60 shows who wins (odd n lose, even n win, except the powers of two)'
  - '10^5 piles of sizes up to 10^9 where a move removes one cow or splits a pile: the Grundy numbers
    of small sizes show a short period and a recursion for the large ones'
  weak_signals:
  - form: Asks who wins a game with a very large number of stones or a huge number, with moves that are
      simple to state
    shape: sizes up to 10^9 or 10^18, a handful of moves
  - form: Asks who wins a game where a move depends on the divisors, the parity or the maximum of the
      state
    shape: n up to 100 piles, sizes up to 10^9
  - form: Asks for the Grundy number of one huge object, to be combined by xor
    shape: n up to 10^5, a formula or a period is needed
  kill_signals:
  - 'The game is not impartial: Alice may remove 1 or 2 stones and Bob only 1, from a heap of 3; treating
    both as having the moves 1 and 2 says the first player loses (3 is a multiple of 3), but Alice wins
    (label the states with the player, Theorem 7.5.1)'
  - 'The brute force cannot reach sizes at which a pattern is visible, or the pattern is only guessed
    and never checked far beyond the cases it was seen on: it stays a conjecture'
  in_action:
    statement: A number n ≤ 10^9. A move subtracts a divisor d of n with 1 < d < n. The player who cannot
      move loses; Alice moves first. For each of t ≤ 10^4 tests print who wins.
    constraints: t ≤ 10^4, n ≤ 10^9.
    budget: The labels of all numbers up to 10^9 cannot be tabled. Need O(1) or O(log n) for each test.
    candidates:
    - tool: Label all numbers up to n (Theorem 7.5.1)
      verdict: rejected
      because: 10^9 positions.
    - tool: Grundy numbers of all numbers
      verdict: rejected
      because: The same size problem.
    - tool: A brute force for small n, a pattern, and a proof (this topic)
      verdict: chosen
      because: 'For n up to 60 the winners show a rule: odd n lose, even n that is not a power of two
        win, and 2^k wins exactly when k is even; it is proved by induction (Theorem 7.5.1).'
    property_check: An impartial game; the brute force reaches sizes where the pattern is clear; the pattern
      has an induction proof. The property holds.
    decision: 'Print the winner by the parity of n and by whether n is a power of two: O(1) for each test.'
  examples:
    positive:
    - inline:
        input: The heap game with the removals 1, 3, 4. What is the Grundy number of a heap of 100 stones?
        answer: '0'
        why: 'The numbers have the period 7: 0 1 0 1 2 3 2. Since 100 mod 7 = 2 and g(2) = 0, the Grundy
          number is 0 (Theorem 7.5.4).'
    - inline:
        input: The heap game with the removals 1 and 2. What is the Grundy number of a heap of 1000 stones?
        answer: '1'
        why: The numbers repeat 0, 1, 2 with the period 3, and 1000 mod 3 = 1, so the number is 1 (Theorem
          7.5.4).
    negative:
    - inline:
        input: A heap of 3 stones. Alice may remove 1 or 2 stones, Bob may remove only 1 stone; the player
          who cannot move loses; Alice moves first. Who wins (Alice or Bob)?
        answer: Alice
        method_gives: Bob
        why: Alice removes 1, Bob must remove 1, Alice removes the last stone and Bob cannot move. Treating
          both players as having the moves 1 and 2 gives the Grundy number 0 for the heap 3, so "the first
          player loses", but the players do not have the same moves and the Grundy numbers do not apply.
      correct_tool:
        topic: '7.5'
        card: win-lose
    - problem: lc-stone-game-v
      why: 'Asks for the best score in a game where a row is split into two parts: an interval DP over
        the scores, not a question of who moves last.'
      correct_tool:
        topic: '3.6'
        card: merge-split
  lookalikes:
  - description: A single small state space (a heap up to 10^6)
    tool:
      topic: '7.5'
      card: win-lose
    flipping_difference: If the positions can be listed, the table of win/lose answers directly; the pattern
      is for sizes that cannot be tabled.
  - description: Independent parts whose Grundy numbers are already known by a formula
    tool:
      topic: '7.5'
      card: grundy-sum
    flipping_difference: When the number of one part is known (a formula or a period), the sum is a plain
      xor; finding the pattern is the step before.
  complexity: O(table size) to find the period, then O(1) for each query; the proof is done once.
problems:
- id: cses-1729
  role: worked_example
  summary: A heap of n ≤ 10^6 sticks and k ≤ 100 allowed move sizes; a move removes one allowed number
    of sticks; the player who cannot move loses; for every heap size from 1 to n print W or L.
- id: lc-chalkboard-xor-game
  role: worked_example
  summary: A list of up to 1000 numbers; Alice and Bob erase one number in turn, Alice first; a player
    whose erasure makes the xor of the rest 0 loses, and a player who starts with xor 0 wins; does Alice
    win?
- id: cses-2207
  role: worked_example
  summary: A heap of n ≤ 2000 coins; a move splits one heap into two non-empty heaps of different sizes;
    the player who cannot move loses; for each of up to 100 values of n print first or second.
- id: cf-1363C
  role: ladder
  card: win-lose
  rung: 1
  twist: 'Base case of the card: a game on a tree reduced to counting, with a special case.'
  summary: A tree of n ≤ 1000 vertices and a special vertex x; two players remove a leaf in turn, Ayush
    first; the player who removes x wins; who wins? †
  hints:
  - Try the case where x is a leaf at the start. Who wins at once?
  - If x is not a leaf, the game goes on until x becomes a leaf, and then the player to move takes it.
    Everything else only changes how many vertices are removed before that.
  - 'The game ends exactly when only x and one neighbour are left, so n − 2 vertices are removed first
    and the player to move then takes x: Ayush wins if x is a leaf, or if n is even; otherwise Ashish
    wins.'
- id: cf-1033C
  role: ladder
  card: win-lose
  rung: 2
  twist: The states are the cells of a permutation, and the order of labelling is given by the values.
  summary: A permutation a of 1 … n, n ≤ 10^5, and a token on a cell i; a move goes to a cell j with a_j
