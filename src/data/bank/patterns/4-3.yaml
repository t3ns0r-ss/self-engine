# Patterns for topic 4.3 (Dijkstra, 0-1 BFS, Bellman–Ford, Floyd–Warshall). Provisional until the lesson maps them to Recognition Cards.
topic: "4.3"
patterns:
  - id: dijkstra
    name: Non-negative weights
    description: Single-source shortest paths with Dijkstra's algorithm and a heap.
    precondition: All edge weights are non-negative, so a vertex's distance is final when it is taken from the heap.
  - id: zero-one
    name: Weights 0 and 1
    description: Shortest paths with weights in {0, 1} using a deque (front for 0, back for 1).
    precondition: Every weight is 0 or 1, so the deque always holds at most two distinct distances in order.
  - id: negative-edges
    name: Negative edges and cycles
    description: Shortest paths with negative edges, or detecting a reachable negative cycle, with Bellman–Ford.
    precondition: There are at most n − 1 edges on a shortest simple path, so n − 1 rounds of relaxation suffice unless a negative cycle exists.
  - id: all-pairs
    name: All pairs, small n
    description: Distances between every pair of vertices for n ≤ about 500 with Floyd–Warshall.
    precondition: n^3 fits the budget, and adding intermediate vertices one at a time keeps every distance correct.
  - id: state-dijkstra
    name: Shortest paths over extended states
    description: Dijkstra on (vertex, extra state), such as "one discount coupon used or not" or "k-th shortest".
    precondition: The extra state has few values and all edge weights stay non-negative.
