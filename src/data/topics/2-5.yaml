decision_map:
- weak_signal: Two step sizes, jugs or coins and an exact target; a lattice point on a line; moving k steps around a circle
  choose: integer-solutions
  when: 'The condition is $a \cdot x + b \cdot y = c$ in integers: solvable exactly when gcd(a, b) divides c, with one solution from extended Euclid and the rest spaced by (b/g, −a/g) (Theorems 2.5.1 and 2.5.2).'
  over:
  - card: gcd-lcm
    topic: '0.4'
    because: When only existence is asked and the numbers are small, the GCD test is enough; the card is needed for a solution, the smallest one or the number of solutions.
  - card: enumerate-answer
    topic: '0.5'
    because: Looping over one unknown is up to $10^9$ steps when the numbers are large.
- weak_signal: First time two periodic events coincide; a number with given remainders modulo several numbers; two cycles reaching the same position
  choose: merge-congruences
  when: 'Every condition has the form x ≡ r (mod m): the system is solvable exactly when every pair agrees modulo its gcd, and the solutions are one class modulo the lcm (Theorem 2.5.4).'
  over:
  - card: gcd-lcm
    topic: '0.4'
    because: Without offsets the answer is the lcm alone; offsets make it a system of congruences.
  - card: inverse-prime
    topic: '2.2'
    because: A prime modulus gives inverses by Fermat; non-coprime or composite moduli need the merge.
glossary_added:
