# Patterns for topic 3.2 (DP foundations: state, transition, base case; memoisation vs tabulation). Provisional until the lesson maps them to Recognition Cards.
topic: "3.2"
patterns:
  - id: linear-state
    name: One index per state
    description: dp[i] is computed from a few earlier states (steps, jumps, minimum coins), in increasing i.
    precondition: The best answer for i depends only on answers for smaller indices (optimal substructure without cycles).
  - id: extra-small-state
    name: Index plus a small extra state
    description: dp[i][s] where s records a small fact about the past (last action, parity, count used).
    precondition: The future depends on the past only through that small extra state.
  - id: two-index
    name: Two indices per state
    description: dp[i][j] over two indices, such as a position and a count or prefixes of two inputs.
    precondition: Each state depends only on states with smaller (i, j) in a fixed order.
  - id: memo-recursion
    name: Recursion with a cache
    description: Write the natural recursion and store each result, when a bottom-up order is awkward to write.
    precondition: The number of distinct arguments is small and the recursion never calls itself on the same arguments in a cycle.
  - id: reconstruct
    name: Recover the choices
    description: Output the optimal sequence of choices, not just the value, by storing or recomputing which transition was best.
    precondition: Each state's optimum came from a recorded predecessor, so following predecessors back rebuilds a solution.
