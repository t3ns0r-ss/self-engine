- id: cses-3410
  role: drill
  summary: 'Maximum Manhattan Distances: n ≤ 2·10^5 different points added one by one (coordinates up
    to 10^9 in absolute value); after each addition print the largest |dx| + |dy| over all pairs.'
- id: ac-abc075_d
  role: drill
  summary: 'Axis-Parallel Rectangle: N ≤ 50 points with different x and different y (coordinates up to
    10^9 in absolute value) and a number K; the smallest area of an axis-parallel rectangle that holds
