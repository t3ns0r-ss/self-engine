# Topic 3.3 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '3.3'
uses:
- topic: '0.4'
  what: Remainders and divisibility
- topic: '0.5'
  what: 'Brute force: subsets as bitmasks, the reference solutions in the tests'
- topic: '1.1'
  what: Sorting
- topic: '1.5'
  what: 'Greedy: the contrast; greedy is right for divisible goods, not for whole items'
- topic: '1.7'
  what: 'Bits: shifts and bitwise or, used on a bitset of reachable sums'
- topic: '2.2'
  what: 'Modular arithmetic: counts printed modulo a prime'
- topic: '2.3'
  what: 'Combinatorics: counting subsets'
- topic: '3.1'
  what: Backtracking and meet in the middle, the tools for few items with huge numbers
- topic: '3.2'
  what: 'Dynamic programming foundations: states, transitions, Theorems 3.2.1–3.2.3, saving memory with
    rows, and the loop-order bug for counting'
theorems:
- id: 3.3.1
  title: 0/1 knapsack
  plain_words: For each prefix of the items and each capacity, the best value either skips the new item
    or takes it and uses the best of the smaller capacity. One row of capacities, updated from the largest
    capacity down, does it while using each item at most once.
  code: 3.3/thm-1
- id: 3.3.2
  title: Indexing by value
  plain_words: If the weights are huge but the values are small, swap the roles. For each total value,
    keep the smallest weight that reaches it, and the answer is the largest value whose smallest weight
    fits in the capacity.
  code: 3.3/thm-2
- id: 3.3.3
  title: Unbounded knapsack
  plain_words: When an item may be used any number of times, update one row with the capacity running
    upward, so the item can be used again within the same pass. With the coin loop outside each collection
    of coins is counted once.
  code: 3.3/thm-3
- id: 3.3.4
  title: Subset sums
  plain_words: To know which totals can be formed from numbers each used once, keep a row of true and
    false flags and update it for each number. A bitset does one number in a single shift-and-or.
  code: 3.3/thm-4
- id: 3.3.5
  title: Power-of-two splitting
  plain_words: An item with c copies can be replaced by bundles of 1, 2, 4, … copies and a remainder.
    Choosing some of the bundles gives every count from 0 to c and nothing more, so the bounded knapsack
    becomes a 0/1 knapsack with about log c items per kind.
  code: 3.3/thm-5
cards:
- id: zero-one
  name: Each item at most once
  decisive_property: Each item is taken or not, independently of the others except through one total (weight,
    cost, size), and either that total's capacity or the sum of the values is small enough to index; then
    best[items][capacity] (or the least weight for each exact value) loses nothing.
  from_theorem: 3.3.1
  how_to_test: 'Check that no item excludes or requires another, find the one total that is bounded, and
    compare n·W with n·(sum of values): index the table by whichever is small (Theorem 3.3.2 for values).'
  constraint_shapes:
  - 'n up to 100 and capacity up to 10^5: the 2^100 subsets are impossible, while n · W = 10^7 table steps
    are easy.'
  - 'Weights up to 10^9 but values up to 1000: the capacity table has 10^9 columns, the value table at
    most 10^5.'
  weak_signals:
  - form: Choose items with a cost and a gain under a budget, each item once
    shape: n up to 1000 and a budget up to 10^5
  - form: Weights up to 10^9 with small values
    shape: n up to 100 and values up to 1000
  - form: Two quantities per item, one bounded and one maximised
    shape: Both totals added over the chosen items
  kill_signals:
  - 'Items can be split into fractions: for the items (3, 30), (4, 50), (5, 60) and capacity 8 the whole-item
    answer is 90, but with fractions it is 98, by value per weight.'
  - 'Both weights and values are huge and n is small: with three items up to 10^9 the table has 3·10^9
    cells, while the 8 subsets give 1150000000 directly.'
  in_action:
    statement: n books with prices h_i and pages s_i; buy each book at most once with total price at most
      x, maximising the total pages.
    constraints: n ≤ 1000, x ≤ 10^5.
    budget: Trying every subset is 2^1000. The table of (books decided, money spent) has 10^8 cells and
      is computed in one row of 10^5.
    candidates:
    - tool: Greedy by pages per price
      verdict: rejected
      because: With budget 10 and books (6, 60), (5, 45), (5, 45), the best ratio takes the first book
        and then nothing fits, 60 pages against 90.
    - tool: Table over (books decided, money spent)
      verdict: chosen
      because: After deciding about the first i books, only the money spent matters for the rest.
    property_check: The books are independent except through the total price, and x ≤ 10^5 indexes a row
      (Theorem 3.3.1).
    decision: 'best[c] = 0; for each book, for c from x down to h_i: best[c] = max(best[c], best[c − h_i]
      + s_i); print best[x].'
  examples:
    positive:
    - inline:
        input: The items (3, 30), (4, 50), (5, 60) with capacity 8, each at most once
        answer: '90'
        why: Weights 3 + 5 give 30 + 60 = 90; the capacity row after the last item ends in 90.
    - worked_example: cses-1158
      why: Each book is bought at most once and the money spent is the only thing that matters about the
        earlier books.
    negative:
    - inline:
        input: The items (3, 30), (4, 50), (5, 60) with capacity 8 when items can be split into fractions
        answer: '98'
        method_gives: '90'
        why: Fractions remove the all-or-nothing choice; taking the best value per weight first is optimal,
          50 + 60 · 4/5 = 98.
      correct_tool:
        topic: '1.5'
        card: extreme-first
    - inline:
        input: Three items with weights and values up to 10^9 and capacity 10^9
        answer: '1150000000'
        method_gives: too-slow
        why: The table has 3·10^9 cells; with only three items the 8 subsets can be tried directly.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
  lookalikes:
  - description: Fill a knapsack with divisible goods (any fraction of an item) to maximise value
    tool:
      topic: '1.5'
      card: extreme-first
    flipping_difference: Fractions remove the all-or-nothing choice, so taking the best value per weight
      first is optimal; whole items need the table.
  complexity: O(n·W) time and O(W) memory with one row; O(n·V) when indexed by value.
- id: unbounded
  name: Unlimited copies
  decisive_property: Every item (coin, piece length, attack) may be used any number of times, so after
    taking one copy the same item is still available; one row with the capacity loop running upwards reads
    the current row and is correct. For counts, the items loop is outside when the order of the parts
    does not matter.
  from_theorem: 3.3.3
  how_to_test: Check that copies are unlimited; for a count, decide whether 1 + 2 and 2 + 1 are the same
    solution (item loop outside) or different (capacity loop outside).
  constraint_shapes:
  - 'Coins up to 100 kinds and an amount up to 10^6: the table is 10^8 steps; the number of coin sequences
    is astronomical.'
  weak_signals:
  - form: Coins of given values, as many of each as needed, fewest coins or number of ways
    shape: Amount up to 10^6
  - form: Cut a rod or ribbon into pieces of given lengths; spells with a damage and a cost, cast any
      number of times
    shape: Total up to 10^4 to 10^6
  - form: Count the ways to pay, where order does or does not matter
    shape: Modulo a prime
  kill_signals:
  - 'Each item may be used at most once: with one coin of value 3 and the amount 6, the upward loop finds
    2 coins, but the amount cannot be paid (use the downward loop of the 0/1 card).'
  - 'The coin system is canonical (1, 5, 10, 25) and the amount is huge: 10^18 needs 4·10^16 coins by
    greedy, and a table over amounts is impossible.'
  in_action:
    statement: Coins of m distinct values with unlimited supply; for the amount x, print the fewest coins
      that pay exactly x, and the number of multisets of coins that pay x, modulo 10^9 + 7.
    constraints: m ≤ 100, x ≤ 10^6.
    budget: Trying every combination is exponential. One row with m · x = 10^8 steps.
    candidates:
    - tool: Greedy, largest coin first
      verdict: rejected
      because: 'For general coin values it fails: with the coins 1, 3, 4 and the amount 6 it takes 4 +
        1 + 1, three coins, while 3 + 3 uses two.'
    - tool: One row with the amount loop running upwards
      verdict: chosen
      because: A coin may be used again, so the update must read the entry already updated for this coin.
    property_check: Copies are unlimited, so the update of best[s] reads best[s − c] of the same round
      (Theorem 3.3.3).
    decision: 'For each coin c, for s from c up to x: fewest[s] = min(fewest[s], fewest[s − c] + 1) and
      ways[s] += ways[s − c]; the coin loop is outside, so each multiset is counted once.'
  examples:
    positive:
    - inline:
        input: The multisets of the coins 1 and 2 that pay 3
        answer: '2'
        why: 1 + 1 + 1 and 1 + 2; the ordered sequences 111, 12, 21 would be 3.
    - inline:
        input: The fewest coins of values 1, 5 and 6 that pay 11
        answer: '2'
        why: 5 + 6 uses two coins; the table gives 2 for the amount 11.
    negative:
    - inline:
        input: The fewest coins to pay 6 when there is only one coin of value 3 (each coin at most once),
          using the upward loop
        answer: '-1'
        method_gives: '2'
        why: The upward loop lets the coin be used twice; with each item at most once the loop runs downwards.
      correct_tool:
        topic: '3.3'
        card: zero-one
    - inline:
        input: The fewest coins of values 1, 5, 10, 25 for the amount 10^18
        answer: '40000000000000000'
        method_gives: too-slow
        why: For this canonical coin system the greedy is provably optimal, so the answer is 10^18 / 25
          coins; a table over 10^18 amounts is impossible.
      correct_tool:
        topic: '1.5'
        card: extreme-first
  lookalikes:
  - description: The fewest coins of values 1, 5, 10 and 25 for an amount up to 10^18
    tool:
      topic: '1.5'
      card: extreme-first
    flipping_difference: For these coin values the greedy is provably optimal, so a huge amount is no
      problem; with arbitrary coin values the table over amounts is needed and the amount must be small.
  complexity: O(n·W).
- id: subset-sums
  name: Which totals are reachable
  decisive_property: The question is only which sums (or how many subsets for each sum) can be formed
    from numbers each used once, and the range of sums is small; the row of reachable sums, updated downwards
    or with a bitset shift, answers it.
  from_theorem: 3.3.4
  how_to_test: Bound the largest relevant sum S and check that n·S (or n·S/64 with a bitset) fits; check
    whether a count, a yes/no, or the closest reachable sum is asked.
  constraint_shapes:
  - 'n up to 1000 and a total up to 10^6: n · S = 10^9 as booleans, but 1.6·10^7 words with a bitset.'
  weak_signals:
  - form: Split items into two groups with sums as equal as possible, or with equal sums
    shape: Total up to 10^6
  - form: Can exactly X be reached by choosing one of two moves per step
    shape: X up to 10^5
  - form: Counts of subsets with a given sum, modulo a prime
    shape: Sum up to 10^5
  kill_signals:
  - 'The sums are huge and n is about 40: 36 numbers near 10^9 have sums up to 3.6·10^10, so no row indexes
    them; the closest sum 17088489972 comes from lists of half-sums.'
  - 'Values matter, not only totals: a table of reachable prices says nothing about the pages gained in
    the book shop problem.'
  in_action:
    statement: Split n numbers into two groups so that the difference of the group sums is as small as
      possible.
    constraints: n ≤ 1000, numbers ≤ 1000, total ≤ 10^6.
    budget: Trying every split is 2^1000. A bitset of 10^6 bits shifted for each number is 1000 · 10^6
      / 64 = 1.6·10^7 word operations.
    candidates:
    - tool: Try every subset
      verdict: rejected
      because: 2^1000 subsets.
    - tool: Bitset of reachable sums
      verdict: chosen
      because: One group has sum s, the other total − s; the best s is the reachable sum closest to total
        / 2.
    property_check: Only reachability is asked, each number is used once, and the total is at most 10^6
      (Theorem 3.3.4).
    decision: 'reach[0] = 1; for each x: reach |= reach << x; find the largest reachable s ≤ total / 2
      and print total − 2s.'
  examples:
    positive:
    - inline:
        input: The number of different sums of subsets of 2 3 7
        answer: '8'
        why: The sums are 0, 2, 3, 5, 7, 9, 10, 12.
    - worked_example: cses-1093
      why: The divisions of 1..n into two sets of equal sums are counted by the subsets with sum exactly
        half the total, one row of counts.
    negative:
    - inline:
        input: The subset sum closest to half the total among 36 numbers near 10^9
        answer: '17088489972'
        method_gives: too-slow
        why: The sums reach 3.6·10^10, far beyond any row; with n around 40 the two halves are listed
          and combined with a sorted list.
      correct_tool:
        topic: '3.1'
        card: meet-in-middle
    - problem: cses-1158
      why: The question asks for the most pages for a price, so values matter; a row of reachable prices
        cannot say which pages are gained.
      correct_tool:
        topic: '3.3'
        card: zero-one
  lookalikes:
  - description: Split n ≤ 40 numbers up to 10^9 into two groups with sums as close as possible
    tool:
      topic: '3.1'
      card: meet-in-middle
    flipping_difference: Sums up to 4·10^10 cannot be indexed; with n ≤ 40, two lists of 2^20 half-sums
      do the job instead.
  complexity: O(n·S), or O(n·S/64) with a bitset.
- id: bounded
  name: Limited copies
  decisive_property: Item i may be taken up to c_i times, copies of one item are interchangeable, and
    splitting c_i into bundles 1, 2, 4, … plus a remainder lets the 0/1 table choose every count from
    0 to c_i and nothing more.
  from_theorem: 3.3.5
  how_to_test: Check that only the number of copies taken matters, compute Σ log c_i, and check that W·Σ
    log c_i fits; for counts of ways, split by the number of copies instead (each count once).
  constraint_shapes:
  - 'n up to 100 kinds with c_i up to 1000 and W up to 10^5: expanding every copy is 10^5 items times
    W = 10^10, while bundles give 10 items per kind, 10^8.'
  weak_signals:
  - form: Each kind of coin, book or item comes in a given number of copies
    shape: c_i up to 1000
  - form: Recipes or buns with limited ingredients
    shape: Capacity up to 10^5
  - form: Maximise a value with a count limit on each kind
    shape: n up to 100 kinds
  kill_signals:
  - 'Counting ways where bundles count a choice several times: to take 3 of 10 copies, the bundles 1,
    2, 4, 3 give two subsets (3, and 1 + 2), while there is one way; loop over the number of copies instead.'
  - 'All c_i are 1 (plain 0/1) or unlimited (unbounded): the bundles add nothing.'
  in_action:
    statement: n kinds of items; kind i has weight w_i, value v_i and c_i copies. Choose copies with total
      weight at most W, maximising the total value.
    constraints: n ≤ 100, W ≤ 10^5, c_i ≤ 1000.
    budget: Treating every copy as an item is up to 10^5 items; bundles give about 10 per kind, 1000 items
      and 10^8 steps.
    candidates:
    - tool: Unbounded loop
      verdict: rejected
      because: It would allow more copies than exist.
    - tool: Bundles of 1, 2, 4, … copies and a remainder, as 0/1 items
      verdict: chosen
      because: Choosing some bundles gives every count from 0 to c_i and nothing more.
    property_check: Copies are interchangeable, so only the number taken matters (Theorem 3.3.5).
    decision: For each kind, split c into bundles; for each bundle of size t run the downward 0/1 update
      with weight t·w and value t·v.
  examples:
    positive:
    - inline:
        input: 5 copies of an item with weight 2 and value 3, capacity 7
        answer: '9'
        why: Three copies weigh 6 and give 9; four would weigh 8.
    - inline:
        input: Two kinds (weight 3, value 4, 2 copies) and (weight 2, value 3, 3 copies), capacity 8
        answer: '11'
        why: One copy of the first kind and two of the second weigh 7 and give 4 + 6 = 10, but two of
          the first and one of the second weigh 8 and give 8 + 3 = 11.
    negative:
    - inline:
        input: The ways to take exactly 3 of 10 interchangeable copies, counted as subsets of the bundles
          1, 2, 4, 3
        answer: '1'
        method_gives: '2'
        why: The count 3 is reached by the bundle 3 and by the bundles 1 and 2, so the bundles count one
          choice twice; loop over the number of copies for counting.
      correct_tool:
        topic: '3.3'
        card: bounded
    - problem: cses-1158
      why: Every book is bought at most once, a plain 0/1 knapsack; bundles add nothing.
      correct_tool:
        topic: '3.3'
        card: zero-one
  lookalikes:
  - description: Pay an amount with coins of given values, each available in unlimited supply
    tool:
      topic: '3.3'
      card: unbounded
    flipping_difference: With no limit on copies the upward loop already allows any count; bundles are
      needed only when the count is capped.
  complexity: O(W · Σ log c_i).
problems:
- id: cses-1158
  role: worked_example
  summary: Buy books (each at most once, n ≤ 1000, prices and pages ≤ 1000) with total price at most x
    ≤ 10^5, maximising the pages.
- id: cses-1093
  role: worked_example
  summary: Count the ways to divide 1, 2, …, n (n ≤ 500) into two sets with equal sums, modulo 10^9 +
    7.
- id: lc-ones-and-zeroes
  role: ladder
  card: zero-one
  rung: 1
  twist: Base case of the card
  summary: Choose the most strings (up to 600 binary strings) so that together they contain at most m
    zeros and at most n ones (m, n ≤ 100).
  hints:
  - What plays the role of the weight here, and how many weights does each string have?
  - 'Two weights: its zeros and its ones. The table has two capacity indices, best[a][b] = most strings
    with at most a zeros and b ones (Theorem 3.3.1 with a pair as the capacity).'
  - For each string, loop a and b both downwards and set best[a][b] = max(best[a][b], best[a − zeros][b
    − ones] + 1); print best[m][n].
- id: ac-abc317_d
  role: ladder
  card: zero-one
  rung: 2
  twist: Minimise the cost of reaching at least a target instead of maximising a value under a capacity.
  summary: Win more than half of the seats of N ≤ 100 districts (total seats ≤ 10^5) by converting voters;
    district i needs a known number of voters to switch. The fewest voters.
  hints:
  - For one district, how many voters must switch, and what does winning it give?
  - Winning district i costs max(0, ⌈(Y_i − X_i)/2⌉) voters and gives Z_i seats. minCost[s] = fewest voters
    to win exactly s seats, a 0/1 table over seats.
  - Fill minCost over seats 0..ΣZ with ∞ for impossible, downwards per district; the answer is the minimum
    of minCost[s] over s > ΣZ/2. Use long long.
- id: lc-tallest-billboard
  role: ladder
  card: zero-one
  rung: 3
  twist: The index is the difference between two sides, and each item has three choices (left, right,
    or unused).
  summary: Weld up to 20 rods (total length ≤ 5000) into two supports of equal height; the largest possible
    height (0 if none).
  hints:
  - Instead of the two heights, what single number describes how far a partial solution is from being
    balanced?
  - The difference d between the taller and shorter side. Keep best[d] = the largest shorter side for
    that difference; a rod goes to the taller side, to the shorter side, or nowhere.
  - 'Start with best[0] = 0, others −∞; for each rod, build a new row from the old: d + r (taller side),
    |d − r| with the shorter side growing by min(d, r), or unchanged. Answer best[0].'
- id: ac-abc364_e
  role: ladder
  card: zero-one
  rung: 4
  twist: The number of items eaten becomes an index, and one of the two capacities becomes the stored
    value.
  summary: Order N ≤ 80 dishes so that the total sweetness stays ≤ X and saltiness ≤ Y (≤ 10^4) for as
    long as possible; he stops after the first dish that exceeds a limit. The most dishes eaten.
  hints:
  - He eats a subset that fits both limits, then one more dish. What do you need to know about a subset
    to decide whether it fits?
  - 'Its size, its sweetness and its saltiness. Index two of them and minimise the third: minSalt[k][a]
    = least saltiness of k dishes with sweetness exactly a ≤ X.'
  - Fill minSalt with ∞, minSalt[0][0] = 0, downwards in k and a for each dish (O(N²X)); find the largest
    k with some minSalt[k][a] ≤ Y; print min(N, k + 1).
- id: ac-abc169_f
  role: ladder
  card: zero-one
  rung: 5
  twist: Counting instead of maximising, and each item has three roles (in U, in T only, or outside T).
  summary: Sum over all subsets T of 1..N (N, S ≤ 3000) of the number of subsets U of T with sum S, modulo
    998244353.
  hints:
  - Count the pairs (T, U) with U ⊆ T and sum(U) = S. What can each element do?
  - 'Be in U (adds a_i to the sum), be in T but not in U, or be outside T: the last two keep the sum.
    So cnt[s] becomes 2·cnt[s] + cnt[s − a_i].'
  - cnt[0] = 1; for each a_i, update s downwards with cnt[s] = 2·cnt[s] + cnt[s − a_i] (mod p); print
    cnt[S].
- id: ac-abc159_f
  role: ladder
  card: zero-one
  rung: 6
  twist: Each chosen set is weighted by how many segments [L, R] contain it, which depends on its first
    and last elements.
  summary: For all segments [L, R] of an array (N, S ≤ 3000), count the subsets of the segment with sum
    S; print the total over all segments modulo 998244353.
  hints:
  - A subset with first index x and last index y lies in how many segments?
  - x · (N − y + 1). So give a subset the weight x when it starts at x, and multiply by (N − y + 1) when
    it ends at y.
  - 'For each i (1-based): add 1 to cnt[0], so that cnt[0] = i (the left end L can be any of 1..i); add
    cnt[S − a_i] · (N − i + 1) to the answer (the subsets with sum S whose last element is i); then update
    cnt[s] += cnt[s − a_i] for s downwards. Check it by hand with N = 2.'
- id: lc-coin-change
  role: ladder
  card: unbounded
  rung: 1
  twist: Base case of the card
  summary: The fewest coins (unlimited supply, up to 12 coin values) that make an amount ≤ 10^4, or −1.
  hints:
  - After using one coin of value c, is that coin still available?
  - 'Yes, so the upward loop is right: fewest[x] = min over coins c ≤ x of fewest[x − c] + 1 (Theorem
    3.3.3).'
  - fewest[0] = 0, others ∞; fill x upwards; print −1 if fewest[amount] is still ∞.
- id: lc-coin-change-ii
  role: ladder
  card: unbounded
  rung: 2
  twist: Count the ways, where 1 + 2 and 2 + 1 are the same way.
  summary: Count the multisets of coins (up to 300 values, unlimited supply) that make an amount ≤ 5000.
  hints:
  - Which loop must be outside so that each multiset is counted once?
  - 'The coins: then every combination is built in the order of the coin list, once (Theorem 3.3.3, note
    2).'
  - ways[0] = 1; for each coin c, for x from c upwards, ways[x] += ways[x − c].
- id: cf-189A
  role: ladder
  card: unbounded
  rung: 3
  twist: The total must be exactly n and the number of pieces is maximised, with unreachable totals marked.
  summary: Cut a ribbon of length n ≤ 4000 into pieces of lengths a, b or c only, maximising the number
    of pieces (a cut is guaranteed to exist).
  hints:
  - Which totals can be cut exactly, and how do you keep the others from being used?
  - best[x] = most pieces summing to exactly x; best[0] = 0 and −∞ for totals that cannot be made, so
    they never feed a later total.
  - For x from 1 to n, best[x] = max over the lengths l ≤ x with best[x − l] ≠ −∞ of best[x − l] + 1;
    print best[n].
- id: ac-abc099_c
  role: ladder
  card: unbounded
  rung: 4
  twist: The items are generated from the statement (1 and powers of 6 and 9), and the obvious greedy
    is wrong.
  summary: Withdraw exactly N ≤ 10^5 yen when one withdrawal can be 1 yen, a power of 6 or a power of
    9; the fewest withdrawals.
  hints:
  - Try the greedy "largest allowed amount first" on N = 12. Is it optimal?
  - 'No: greedy takes 9 + 1 + 1 + 1 (4 withdrawals), but 6 + 6 needs 2. The amounts are unlimited items,
    so use the coin table over 0..N.'
  - List the items 1, 6, 36, …, 9, 81, … up to N; fewest[x] = 1 + min over items ≤ x of fewest[x − item].
- id: lc-partition-equal-subset-sum
  role: ladder
  card: subset-sums
  rung: 1
  twist: Base case of the card
  summary: Can an array of up to 200 numbers (each ≤ 100) be split into two groups with equal sums?
  hints:
  - If the total is T, what must one group sum to?
  - Exactly T/2 (and T must be even). So the question is whether T/2 is a reachable subset sum (Theorem
    3.3.4).
  - reach[0] = true; for each number, update s downwards from T/2 (or reach |= reach << a); answer reach[T/2].
- id: ac-abc274_d
  role: ladder
  card: subset-sums
  rung: 2
  twist: Each number gets a sign, and the numbers split into two independent problems (x moves and y moves).
  summary: A robot arm has N ≤ 1000 segments (lengths ≤ 10) that alternate between horizontal and vertical,
    each turning 90° either way; can its tip reach (x, y)? The first segment points right.
  hints:
  - What freedom does each segment have, once you look at the axis it moves along?
  - Every segment after the first moves + or − along its axis, independently of the others. So x is a
    signed sum of the odd segments (the first fixed to +) and y of the even ones.
  - Solve two reachability problems with sums offset by 10^4 to allow negatives; print Yes if x and y
    are both reachable.
- id: ac-abc281_d
  role: ladder
  card: subset-sums
  rung: 3
  twist: The table is indexed by the count of chosen items and the sum modulo D, and stores the largest
    sum.
  summary: Choose exactly K of N ≤ 100 numbers (≤ 10^9) so that their sum is a multiple of D ≤ 100; the
    largest such sum, or −1.
  hints:
  - The sum is up to 10^11. What do you really need to know about it while choosing?
  - Only its remainder modulo D, and how many numbers were chosen. Store best[j][r] = the largest sum
    of j chosen numbers with remainder r.
  - best[0][0] = 0, others −1; for each number, update j downwards with best[j + 1][(r + a) mod D] = max(…,
    best[j][r] + a); print best[K][0].
- id: cf-1637D
  role: ladder
  card: subset-sums
  rung: 4
  twist: 'Algebra first: the cost only depends on one sum, and then the problem is choosing which reachable
    sum is best.'
  summary: Two arrays of n ≤ 100 values (≤ 100); you may swap a_i with b_i for any i. Minimise Σ over
    pairs i < j of (a_i + a_j)² + (b_i + b_j)².
  hints:
  - Expand the sum of squares over pairs. Which parts change when you swap a_i and b_i?
  - Only (Σa)² + (Σb)² changes; the squares of the single values are fixed. With Σa + Σb = T fixed, choose
    for each i whether a_i or b_i joins A, and minimise sA² + (T − sA)² over reachable sA.
  - reach over sums ≤ 10^4 where each index adds a_i or b_i (exactly one of them); evaluate every reachable
    sA and add the fixed part.
- id: ac-abc286_d
  role: ladder
  card: bounded
  rung: 1
  twist: Base case of the card
  summary: N ≤ 50 kinds of coins, A_i yen each with B_i ≤ 50 coins of each kind; can you pay exactly X
    ≤ 10^4 yen?
  hints:
  - How many ways are there to use coin kind i, and how expensive is trying them all?
  - 'Use 0..B_i coins of kind i: trying every count for every amount is X·ΣB ≈ 2.5·10^7, which fits; bundles
    of 1, 2, 4, … (Theorem 3.3.5) are faster.'
  - reach[0] = true; for each kind, either loop over the count for each amount (from a copy of the old
    row) or add the bundles with the 0/1 loop; print Yes if reach[X].
- id: cses-1159
  role: ladder
  card: bounded
  rung: 2
  twist: 'Counts up to 1000 copies and a capacity of 10^5: trying every count is 10^10, so the bundles
    are needed.'
  summary: 'Book Shop with copies: n ≤ 100 books with prices, pages and up to 1000 copies each; total
    price at most x ≤ 10^5, maximise the pages.'
  hints:
  - How many items does a book with k copies become if you split it into bundles?
  - About log₂ k + 1 bundles (1, 2, 4, …, remainder), each a 0/1 item. With k ≤ 1000 that is at most 10
    items per book (Theorem 3.3.5).
  - 'The limited-copies template of Section 6: split, then the downward loop for each bundle; about 10^8
    steps.'
- id: lc-number-of-ways-to-earn-points
  role: ladder
  card: bounded
  rung: 3
  twist: 'Counting instead of maximising: the bundles would count the same number of copies in several
    ways, so loop over the count of each type instead.'
  summary: Count the ways to score exactly target ≤ 1000 points with up to 50 question types, each with
    a count ≤ 50 and a mark; questions of one type are identical. Modulo 10^9 + 7.
  hints:
  - If you split a type into bundles, can the same number of questions be formed in two ways?
  - 'Yes: with 10 questions the bundles are 1, 2, 4 and 3, and taking 3 questions can be the bundles 1
    + 2 or the bundle 3, so the count would be doubled. Loop over the number k of questions taken from
    each type instead (types outside, so the order of the questions does not matter).'
  - For each type, new[x] = Σ over k = 0..count with k·marks ≤ x of old[x − k·marks]; O(target · Σcount)
    = 2.5·10^6.
