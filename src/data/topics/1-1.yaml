# Topic 1.1 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.1"
draft: true
cards:
  - id: sort-then-scan
    name: Sort, then look at neighbours
    decisive_property: The question is order-free (shuffling the input never changes the answer), and in sorted order the elements that matter to each other are neighbours or a block of consecutive elements, so one sort and one scan decide it.
    from_theorem: Theorem 1.1.2
    how_to_test: Shuffle a small input by hand and check the answer stays the same; then check that the best pair or group can be taken from consecutive elements of the sorted list.
    weak_signals:
      - '"The closest two", "the smallest difference", "choose k with the smallest spread"'
      - The input order plays no role in the statement (a set of people, sticks, scores)
      - n up to 2·10^5, so comparing all pairs is too slow
      - Intervals given in any order that may overlap (sorted by start, overlapping ones become neighbours)
    kill_signals:
      - Positions matter ("adjacent in the input", "at least x apart", "contiguous segment")
      - The collection changes between questions (an ordered set, topic 0.6)
    lookalikes:
      - description: The smallest difference between two values at least x positions apart
        needs: "ordered-set-lookup (0.6): insert values as the scan passes them"
        flipping_difference: The distance condition depends on positions, so the input cannot be sorted.
    complexity: O(n log n) to sort, then O(n).
  - id: custom-order
    name: Sort by your own rule
    decisive_property: The statement fixes an order by one or more keys (or by a rule that reduces to comparing a key), so sorting with a comparator that is a strict weak ordering, with every tie-break the statement asks for, produces it.
    from_theorem: Theorem 1.1.3
    how_to_test: Write the order as a list of keys with a direction for each ("by score descending, then by index ascending"). If it is a rule between pairs, find the key it compares.
    weak_signals:
      - '"Sorted by …, and in case of a tie by …"'
      - Ranking, standings, leaderboards
      - Ratios or fractions that decide the order
      - '"For equal …, the one with …": a tie-break that makes a scan after sorting work'
    kill_signals:
      - The order changes as items are processed (keep them in a set or priority queue, topic 0.6)
    lookalikes:
      - description: Print the standings after every update
        needs: "ordered-set-lookup (0.6): a set of (key, id) pairs"
        flipping_difference: Keys change between outputs, so one sort is not enough.
    complexity: O(n log n) comparisons, times the cost of one comparison.
  - id: sort-with-index
    name: Sort but remember positions
    decisive_property: The work needs the elements in value order, but the answer refers to their original positions (or ties are broken by position), so the sort runs on (value, index) pairs.
    from_theorem: Theorem 1.1.4
    how_to_test: Check whether the output is printed in input order or names indices; if so, every element must carry its index through the sort.
    weak_signals:
      - '"Print the answer for each element in input order", "output the indices"'
      - Ranks or places of elements, ties by index
    kill_signals:
      - Only the multiset of values matters (plain sort-then-scan)
    lookalikes:
      - description: Print the values in sorted order
        needs: sort-then-scan (1.1)
        flipping_difference: No position is reported, so the indices are not needed.
    complexity: O(n log n).
  - id: coordinate-compression
    name: Replace values by ranks
    decisive_property: Only comparisons between values matter (which is smaller, which are equal), never their differences, so each value can be replaced by its rank among the distinct values, which is below n and can index an array.
    from_theorem: Theorem 1.1.5
    how_to_test: Replace the values by others in the same order (for example 7, 10, 50 by 0, 1, 2) and check that the answer does not change.
    weak_signals:
      - Values up to 10^9 but only n ≤ 2·10^5 of them
      - '"How many distinct values are smaller", "the k-th largest distinct"'
      - Rows or columns that disappear when empty
    kill_signals:
      - Distances or gaps between values matter (lengths, sums of values)
    lookalikes:
      - description: Total length of the union of intervals
        needs: event-sweep (1.1)
        flipping_difference: Lengths depend on the actual coordinates, not only on their order.
    complexity: O(n log n).
  - id: event-sweep
    name: Intervals as sorted events
    decisive_property: The quantity (how many intervals cover a point, a running total) changes only at interval ends, so sorting the 2n start and end events, with the tie order the statement implies, and keeping a counter gives its value everywhere.
    from_theorem: Theorem 1.1.6
    how_to_test: List what happens at a start and at an end; check that nothing changes between events; decide whether an end and a start at the same time overlap.
    weak_signals:
      - Intervals with coordinates or times up to 10^9
      - '"At the busiest moment", "the maximum number at the same time"'
      - Daily costs between start and end days
    kill_signals:
      - Coordinates are small enough to mark every point (simulation, topic 0.3)
      - Each query needs a different subset of intervals
    lookalikes:
      - description: The same intervals with times up to 10^5 and one query per time
        needs: "simulation (0.3) or a running total over every time point"
        flipping_difference: Small coordinates make it cheap to walk every time point, so sorting is optional.
    complexity: O(n log n) to sort 2n events, then O(n).
problems:
  - id: cf-1399A
    role: ladder
    card: sort-then-scan
    rung: 1
    twist: Base case of the card
    summary: "Up to 50 numbers; repeatedly pick two whose difference is at most 1 and delete the smaller. Can one number remain? (t test cases)"
    hints:
      - Does the order in which the numbers are listed matter for the answer?
      - "No, so sort them. In sorted order, a number can only be removed together with a close neighbour (Theorem 1.1.2: the closest values are neighbours)."
      - "Sort; the answer is YES exactly when every pair of sorted neighbours differs by at most 1."
  - id: ac-abc132_c
    role: ladder
    card: sort-then-scan
    rung: 2
    twist: The answer is the size of one gap in sorted order, not a minimum over all gaps.
    summary: "N even (≤ 10^5) difficulties; count the thresholds K that put exactly half of the problems at K or above."
    hints:
      - Which problems are at K or above? Think of the difficulties in sorted order.
      - "In sorted order d_1 ≤ … ≤ d_N, the problems at K or above are a suffix. Exactly N/2 of them means d_{N/2} < K ≤ d_{N/2+1}."
      - "Sort and print d_{N/2+1} − d_{N/2} (with indices from 1)."
  - id: ac-abc115_c
    role: ladder
    card: sort-then-scan
    rung: 3
    twist: "A group of K values instead of a pair: the best group is a block of the sorted list."
    summary: Choose K of N trees (N ≤ 10^5, heights ≤ 10^9) so that the tallest minus the shortest chosen height is as small as possible.
    hints:
      - Does the order of the trees in the input matter?
      - "No. In sorted order, some best choice is K consecutive trees (Theorem 1.1.2, part 2)."
      - "Sort and take the minimum of h[i + K − 1] − h[i] over all i."
  - id: ac-abc361_c
    role: ladder
    card: sort-then-scan
    rung: 4
    twist: The statement keeps the original order of the remaining elements, which looks like a reason not to sort; it is not.
    summary: Remove exactly K of N values (N ≤ 2·10^5) so that the maximum minus the minimum of what remains is as small as possible.
    hints:
      - The remaining elements keep their order. Does that order change max − min?
      - "No: max − min depends only on which values remain. So choose N − K values with the smallest spread."
      - "Sort; the answer is the minimum of a[i + N − K − 1] − a[i] over all i (a block of N − K values)."
  - id: lc-h-index
    role: ladder
    card: sort-then-scan
    rung: 5
    twist: The condition compares a value with how many values are at least as large, which sorting turns into a comparison with an index.
    summary: Given n ≤ 5000 citation counts, the largest h such that at least h papers have at least h citations each.
    hints:
      - "If the counts are sorted from largest to smallest, how many papers have at least c[i] citations?"
      - "At least i + 1 (indices from 0): the papers 0..i all have at least c[i]. So h works when c[h − 1] ≥ h."
      - "Sort in decreasing order and return the largest h with c[h − 1] ≥ h (or 0)."
  - id: cf-1311B
    role: ladder
    card: sort-then-scan
    rung: 6
    twist: Only some adjacent swaps are allowed, so only parts of the array can be sorted, and the result is compared with the fully sorted array.
    summary: "An array of up to 100 values and a set of positions p where swapping a[p] and a[p + 1] is allowed (any number of times); can the array be sorted? (t test cases)"
    hints:
      - "Which elements can reach which places using only the allowed swaps?"
      - "Consecutive allowed positions join places into blocks; inside a block any order can be reached, and nothing crosses a block border."
      - "Sort each block on its own, then check whether the whole array is non-decreasing. (With n ≤ 100, repeating the allowed swaps that fix an out-of-order pair also works.)"
  - id: lc-relative-sort-array
    role: ladder
    card: custom-order
    rung: 1
    twist: Base case of the card
    summary: Sort arr1 (length ≤ 1000, values ≤ 1000) so that values listed in arr2 come first in arr2's order, then the other values in increasing order.
    hints:
      - Can you give every value a number (a key) so that sorting by that number gives the required order?
      - "Key of v: its position in arr2 if it is there, otherwise 1000 + v (larger than every position). Keys compare like the rule (Theorem 1.1.3, part 1)."
      - "Build the key with a map or an array of size 1001, then sort arr1 by key."
  - id: ac-abc128_b
    role: ladder
    card: custom-order
    rung: 2
    twist: Two keys with opposite directions, the first a string.
    summary: Print N ≤ 100 restaurants by city name in dictionary order and, within a city, by score from highest to lowest.
    hints:
      - Write the order as a list of keys with a direction for each.
      - "City ascending, then score descending. A pair (city, −score) compared with < gives exactly that (Theorem 1.1.3, part 2)."
      - "Sort tuples (city, −score, index) and print the indices."
  - id: ac-abc222_c
    role: ladder
    card: custom-order
    rung: 3
    twist: The ranking is recomputed after every round of a simulation.
    summary: 2N ≤ 100 players play M ≤ 100 rounds of rock-paper-scissors, paired by the current ranking (more wins first, then smaller number); print the final ranking.
    hints:
      - What decides the pairs of each round?
      - "The ranking after the previous round: more wins first, ties by smaller number. Re-sort before every round; 100 sorts of 100 players are cheap."
      - "Keep wins[]; each round sort the players by (−wins, number), play the pairs (1st, 2nd), (3rd, 4th), …, update the wins; print the last ranking."
  - id: lc-largest-number
    role: ladder
    card: custom-order
    rung: 4
    twist: The rule compares two items with each other (which concatenation is larger), and you must check it is a strict weak ordering.
    summary: Arrange n ≤ 100 non-negative integers (≤ 10^9) so that writing them one after another gives the largest number; return it as a string.
    hints:
      - "For two numbers x and y, which should come first?"
      - "x first when the string x + y is larger than y + x. Section 4.3 shows that this rule compares a key, so it is a valid comparator."
      - "Sort the strings with that comparator and join them; if the result starts with 0, the answer is \"0\"."
  - id: lc-sort-the-people
    role: ladder
    card: sort-with-index
    rung: 1
    twist: Base case of the card
    summary: Given n ≤ 1000 names and distinct heights, return the names ordered from tallest to shortest.
    hints:
      - Sorting the heights alone loses which name belongs to which height. What must travel with each height?
      - "Its index (or the name itself): sort pairs (height, index) (Theorem 1.1.4)."
      - "Sort the pairs by height in decreasing order and output names[index] in that order."
  - id: ac-abc294_c
    role: ladder
    card: sort-with-index
    rung: 2
    twist: The output is the place of every element in the sorted order, printed in input order.
    summary: Two increasing sequences of lengths N, M ≤ 10^5 with no common value are merged and sorted; print the position of every element of each sequence.
    hints:
      - "After sorting all N + M values together, how do you know where A_i went?"
      - "Each value carries a label (which sequence, which index); writing place[label] = k while reading the sorted list gives every position (Theorem 1.1.4, part 2)."
      - "Sort the pairs (value, label); print the places of A's elements, then of B's. (Both inputs are already sorted, so merging them also works.)"
  - id: ac-abc208_c
    role: ladder
    card: sort-with-index
    rung: 3
    twist: The sorted order only decides who gets one extra piece; arithmetic with K up to 10^18 does the rest.
    summary: Hand out K ≤ 10^18 sweets to N ≤ 2·10^5 citizens (one each per round, and a last partial round to the smallest IDs); print each citizen's total in input order.
    hints:
      - How many full rounds are there, and who receives the last pieces?
      - "Everyone gets K / N; the K mod N citizens with the smallest IDs get one more. Who those are needs the IDs in sorted order, but the output is in input order."
      - "Sort pairs (ID, index), mark the first K mod N indices, then print K / N + mark[i] for each i. Use long long."
  - id: lc-how-many-numbers-are-smaller-than-the-current-number
    role: ladder
    card: coordinate-compression
    rung: 1
    twist: Base case of the card
    summary: For each of n ≤ 500 values (≤ 100), count the values in the array that are smaller than it.
    hints:
      - "In sorted order, where does the first copy of a value stand?"
      - "At the place equal to the number of values smaller than it (not distinct values: every smaller value counts)."
      - "Sort pairs (value, index); walk them, remembering the place where the current value first appeared, and store that place at each index."
  - id: lc-rank-transform-of-an-array
    role: ladder
    card: coordinate-compression
    rung: 2
    twist: Equal values get the same rank, and ranks count distinct values.
    summary: Replace each of n ≤ 10^5 values (|value| ≤ 10^9) by its rank among the distinct values, starting from 1.
    hints:
      - What should two equal values get? Two different values?
      - "This is exactly coordinate compression (Theorem 1.1.5), with ranks starting at 1 instead of 0."
      - "Sort pairs (value, index); increase the rank only when the value changes; store rank + 1 at each index."
  - id: ac-abc273_c
    role: ladder
    card: coordinate-compression
    rung: 3
    twist: Ranks are counted from the top (distinct values greater), and the answer counts how many elements share each rank.
    summary: For each K = 0..N−1 (N ≤ 2·10^5), count the elements that have exactly K distinct values greater than them in the array.
    hints:
      - "\"Exactly K distinct values greater\" is a rank. Counted from which end?"
      - "From the largest: compress in decreasing order, so the largest value has rank 0."
      - "Compute each element's rank among distinct values in decreasing order, count the elements per rank, and print the counts for K = 0..N−1 (zeros after the last rank)."
  - id: ac-abc213_c
    role: ladder
    card: coordinate-compression
    rung: 4
    twist: Rows and columns are compressed separately, and the input is a grid up to 10^9 by 10^9.
    summary: N ≤ 10^5 numbered cards on an H × W grid (H, W ≤ 10^9); remove every empty row and column; print each card's final row and column.
    hints:
      - After all removals, what decides the final row of a card?
      - "Only how many non-empty rows are above it: its row's rank among the distinct rows of the cards. Columns are independent."
      - "Compress the A values and the B values separately and print rank + 1 for each card."
  - id: cses-1619
    role: ladder
    card: event-sweep
    rung: 1
    twist: Base case of the card
    summary: n ≤ 2·10^5 customers with arrival and leaving times (≤ 10^9, all distinct); the largest number in the restaurant at the same time.
    hints:
      - Where can the number of customers change?
      - "Only at arrivals (+1) and departures (−1). Times are distinct, so no tie order is needed."
      - "Sort the 2n events by time and sweep with a counter; print its largest value (Theorem 1.1.6)."
  - id: lc-car-pooling
    role: ladder
    card: event-sweep
    rung: 2
    twist: Events carry weights (passenger counts), and the statement fixes the tie order.
    summary: Trips (≤ 1000) pick up p passengers at one point and drop them at a later point on a road; can a car of a given capacity do all of them?
    hints:
      - "What happens at a pick-up point and at a drop-off point? What if both are at the same place?"
      - "+p at pick-up, −p at drop-off; the statement says drop-offs come first at the same place."
      - "Sort events (place, change) so that negative changes come first at equal places, sweep, and fail if the load ever exceeds the capacity. (Places ≤ 1000 also allow a count per place.)"
  - id: ac-abc128_e
    role: ladder
    card: event-sweep
    rung: 3
    twist: Each roadwork must first be turned into an interval of start times, and the sweep keeps a multiset instead of a counter.
    summary: N roadworks block point X_i during a time window; Q ≤ 2·10^5 people start walking from 0 at given times; how far does each walk before hitting a blocked point (or −1)?
    hints:
      - "A person starting at time D is at point X at time D + X. For which D does roadwork i stop them at X_i?"
      - "Exactly when S_i − X_i ≤ D < T_i − X_i: an interval of start times. A person stops at the smallest X among the roadworks whose interval contains D."
      - "Events: add X at S − X, remove X at T − X, query at D; sort with removals before additions before queries at equal times; keep a multiset (topic 0.6) and answer with its smallest element or −1."
  - id: cses-1074
    role: worked_example
    summary: Make n ≤ 2·10^5 sticks (lengths ≤ 10^9) all the same length, where changing a length by x costs x; the least total cost.
  - id: ac-abc221_d
    role: worked_example
    summary: N ≤ 2·10^5 players each logged in for B_i consecutive days from day A_i (both ≤ 10^9); for every k = 1..N, the number of days on which exactly k players logged in.
  - id: ac-abc309_c
    role: drill
    summary: N ≤ 3·10^5 medicines, the i-th taken b_i pills a day for the first a_i days (a_i, b_i ≤ 10^9); the first day with at most K pills.
  - id: ac-abc354_c
    role: drill
    summary: N ≤ 2·10^5 cards with distinct strengths and distinct costs; a card is discarded while some card is stronger and cheaper; which cards remain?
  - id: cf-1353B
    role: drill
    summary: "Two arrays of n ≤ 30 values; at most k swaps of an element of a with an element of b; the largest possible sum of a. (t test cases)"
  - id: lc-sort-characters-by-frequency
    role: drill
    summary: Rearrange a string (length ≤ 5·10^5) so that characters appear grouped, from the most frequent to the least frequent.
  - id: cf-1294B
    role: drill
    summary: "A robot at (0, 0) moving only right or up must collect n ≤ 1000 packages at given points; print YES and the shortest path that is first in dictionary order, or NO. (t test cases)"
  - id: cf-1203B
    role: drill
    summary: "4n sticks (n ≤ 100); can they form n rectangles, each from 4 sticks with equal opposite sides, all with the same area? (q test cases)"
  - id: lc-remove-covered-intervals
    role: drill
    summary: Among n ≤ 1000 distinct intervals [l, r), count those not covered by another interval of the list.
  - id: ac-abc357_c
    role: drill
    summary: Print the level-N carpet (N ≤ 6), a 3^N × 3^N picture made of eight level-(N−1) carpets around an empty centre.
  - id: cses-2162
    role: drill
    summary: n ≤ 2·10^5 children stand in a circle and every second child leaves; print the order in which they leave.
  - id: ac-abc345_c
    role: drill
    summary: The number of different strings obtained by swapping exactly one pair of positions of a string of length ≤ 10^6.
  - id: lc-minimum-absolute-difference
    role: lookalike
    summary: All pairs with the smallest difference among n ≤ 10^5 distinct values, in increasing order.
  - id: lc-minimum-absolute-difference-between-elements-with-constraint
    role: lookalike
    summary: The smallest difference between two values of an array (n ≤ 10^5) whose positions are at least x apart.
  - id: lc-merge-intervals
    role: lookalike
    summary: Merge n ≤ 10^4 intervals, given in any order, into the disjoint intervals covering the same points.
  - id: lc-insert-interval
    role: lookalike
    summary: Insert one interval into a list of n ≤ 10^4 disjoint intervals already sorted by start, merging where they overlap.
  - id: ac-abc308_c
    role: checkpoint
    card: custom-order
    summary: Sort N ≤ 2·10^5 people by their success rate A_i / (A_i + B_i) (A_i, B_i ≤ 10^9), highest first, ties by number.
  - id: ac-abc188_d
    role: checkpoint
    card: event-sweep
    summary: N ≤ 2·10^5 services, each used on days a_i..b_i (≤ 10^9) at c_i per day; on any day you may pay C instead of the day's total; the least total cost.
  - id: ac-abc186_d
    role: checkpoint
    card: sort-then-scan
    summary: The sum of |A_i − A_j| over all pairs i < j of N ≤ 2·10^5 values (|A_i| ≤ 10^8).
  - id: lc-k-closest-points-to-origin
    role: review
    card: custom-order
    review_set: 1
    summary: The k closest of n ≤ 10^4 points (coordinates ≤ 10^4 in absolute value) to the origin.
  - id: lc-count-days-without-meetings
    role: review
    card: sort-then-scan
    review_set: 1
    summary: Count the days from 1 to days (≤ 10^9) not covered by any of n ≤ 10^5 meetings, given as possibly overlapping day ranges.
  - id: ac-abc113_c
    role: review
    card: sort-with-index
    review_set: 1
    summary: M ≤ 10^5 cities with prefectures and distinct founding years; print each city's 12-digit ID (prefecture, then its order of founding within the prefecture) in input order.
  - id: lc-happy-students
    role: review
    card: sort-then-scan
    review_set: 1
    summary: Count the groups of selected students (n ≤ 10^5) such that every selected student's number is below the group size and every other student's number is above it.
  - id: ac-abc257_c
    role: review
    card: sort-then-scan
    review_set: 2
    summary: N ≤ 2·10^5 people with weights and child/adult labels; choose a threshold X maximising the people correctly judged (child below X, adult at X or above).
  - id: lc-the-number-of-weak-characters-in-the-game
    role: review
    card: custom-order
    review_set: 2
    summary: Count the characters (n ≤ 10^5) for which another character has strictly larger attack and strictly larger defence.
  - id: lc-count-ways-to-group-overlapping-ranges
    role: review
    card: sort-then-scan
    review_set: 2
    summary: Split n ≤ 10^5 ranges into two groups so that overlapping ranges share a group; the number of ways modulo 10^9 + 7.
  - id: cses-2168
    role: review
    card: custom-order
    review_set: 3
    summary: For each of n ≤ 2·10^5 distinct ranges, does it contain another range, and is it contained in another range?
  - id: ac-abc169_e
    role: review
    card: sort-then-scan
    review_set: 3
    summary: N ≤ 2·10^5 unknowns, each X_i between A_i and B_i (≤ 10^9); how many different values can their median take?
  - id: ac-abc376_e
    role: review
    card: sort-then-scan
    review_set: 3
    summary: "Choose K of N indices (sum of N ≤ 2·10^5 over test cases) minimising (largest A among them) × (sum of B among them)."
drill:
  - problem: ac-abc309_c
    answer_card: sort-then-scan
    answer_topic: "1.1"
    property: "The daily total only drops on the days a_i + 1, and the order of the medicines does not matter: sort by a_i and walk down from the day-1 total until it is at most K."
    why_others_fail: Days go up to 10^9, so simulating day by day is too slow; a map of counts per day still needs the days in order, which is the sort.
  - problem: ac-abc354_c
    answer_card: sort-then-scan
    answer_topic: "1.1"
    property: "Order-free: after sorting by strength from strongest, a card survives exactly when its cost is below every cost seen so far, so one scan with a running minimum decides it."
    why_others_fail: Checking every pair x, y is 2·10^10; a custom order is not the point, since only one key (strength) is sorted.
  - problem: cf-1353B
    answer_card: sort-then-scan
    answer_topic: "1.1"
    property: "Only the multisets of a and b matter: sorted, the i-th smallest of a meets the i-th largest of b, and a swap helps only while that b is larger."
    why_others_fail: Trying every choice of pairs to swap grows exponentially with k; positions play no role, so no index needs remembering.
  - problem: lc-sort-characters-by-frequency
    answer_card: custom-order
    answer_topic: "1.1"
    property: "The output order is fixed by a computed key, the count of each character (map-counting, 0.6, then sort the characters by count descending)."
    why_others_fail: Counting alone gives no order; positions in the input play no role.
  - problem: cf-1294B
    answer_card: sort-then-scan
    answer_topic: "1.1"
    property: "A robot that only moves right or up must visit the packages in order of (x, y); the input order is irrelevant. Sort, then check neighbours: y must never decrease."
    why_others_fail: Trying all visiting orders is n!; a set of points does not give the order.
  - problem: cf-1203B
    answer_card: sort-then-scan
    answer_topic: "1.1"
    property: "Order-free: sorted, equal sticks must pair up as neighbours, and the k-th smallest pair must go with the k-th largest pair for all areas to be equal."
    why_others_fail: Trying all groupings of 4n sticks is far too many; counting with a map finds the pairs but not which pair goes with which.
  - problem: lc-remove-covered-intervals
    answer_card: custom-order
    answer_topic: "1.1"
    property: "Sorted by start ascending and, for equal starts, end descending, an interval is covered exactly when its end is at most the largest end seen before it; the tie-break is what makes this work."
    why_others_fail: Without the tie-break, an interval with the same start and a larger end comes later and is missed; all pairs is fine for n ≤ 1000 but the sort is the intended tool.
  - problem: ac-abc357_c
    answer_card: recursive-choices
    answer_topic: "0.5"
    property: A level-N picture is defined by eight level-(N−1) pictures, so a recursive function (or a check of the base-3 digits of row and column) draws it.
    why_others_fail: Nothing is compared or ordered; there is no input list to sort.
  - problem: cses-2162
    answer_card: stack-queue
    answer_topic: "0.6"
    property: "The circle is processed in order of arrival: take the child at the front, move it to the back, remove the next one; a queue does each step in O(1)."
    why_others_fail: The removal order depends on positions in the circle, not on values, so sorting has nothing to sort.
  - problem: ac-abc345_c
    answer_card: map-counting
    answer_topic: "0.6"
    property: "Swapping two different letters gives a distinct new string, so count the pairs of positions with different letters from the letter counts, plus 1 if some letter repeats (that swap gives S back)."
    why_others_fail: Sorting the letters loses nothing but adds nothing either; trying all pairs of positions is 5·10^11.
