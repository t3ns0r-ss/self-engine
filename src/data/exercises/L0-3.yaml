- id: cp-1
  role: checkpoint
  type: build
  title: 'Model a library: books, members, loans'
  prompt: 'Build the library in 45 minutes (see exercises/L0.3/cp-1): a Library that owns its books and members, with loans that refer to them without owning them. Copies must be independent and loans must survive growth. Add a short decision record saying which parts are owned, which are referred to, and why.'
  card: owned-part
  clarifying:
  - q: How many books may one member hold?
    a: 3 by default, settable in the constructor; one more throws std::length_error and changes nothing.
    critical: true
  - q: What happens when a book that is already lent is lent again?
    a: std::logic_error, and the first loan stays.
    critical: true
  - q: What happens for an unknown book or member id?
    a: std::out_of_range.
    critical: true
  - q: Does a copied Library share loans with the original?
    a: 'No: copies are independent.'
    critical: false
  - q: In what order does titles_of list the titles?
    a: By book id.
    critical: false
  checkers:
  - kind: kit
    path: L0.3/cp-1
  - kind: rubric
    id: rubric-lld-build-v1
  reference: reference/L0.3/cp-1
  time_limit_minutes: 45
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: rev-1-1
  role: review
  type: recognise
  title: Draw the ownership for Document, Paragraph, Font
  prompt: A Document has paragraphs; each paragraph uses a Font from a table shared by all documents. Say which classes own which and which only refer, and name the lifetime rule the program must keep.
  card: referred-part
  review_set: 1
  techniques:
  - L0.3
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id003
    property: A paragraph refers to a font that the table owns, so the table must outlive every document that uses it.
    why_others_fail: If the document owned its fonts each document would carry copies; if it deleted them another document would use a deleted font.
  checkers: []
- id: rev-1-2
  role: review
  type: recognise
  title: Is an Order a kind of Cart?
  prompt: 'A colleague wants class Order : public Cart because an order starts as a cart and has the same items. Decide, using the contract test.'
  card: true-subtype
  review_set: 1
  techniques:
  - L0.3
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: Derive only if every promise of Cart (items can be added and removed) also holds for an Order, which is frozen after payment.
    why_others_fail: Add and remove on a paid Order must be refused, which breaks Cart's promise; an Order should hold a copy of the items.
  checkers: []
