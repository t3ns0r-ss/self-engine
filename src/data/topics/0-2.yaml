decision_map:
- weak_signal: A huge bound such as N ≤ 10^12, or pairs (a, b) with a fixed product
  choose: budget-from-constraints
  when: The bound rules out looping to N; factor pairs let you loop only up to √N (Theorem 0.2.2).
  over:
  - card: closed-form
    because: A formula is needed only when even √N steps are too many or no pairing exists.
- weak_signal: A repeated simple process with n up to 10^9 or 10^18
  choose: closed-form
  when: The added amount follows an arithmetic progression or repeats with a short period, so the total
    is a formula.
  over:
  - card: budget-from-constraints
    because: A plain loop is fine only when n times the cost of one step fits the budget.
  - card: overflow-64bit
    because: The formula still needs 64-bit products; check sizes as in topic 0.1.
    topic: '0.1'
- weak_signal: Maximal blocks (runs) of equal or similar elements; a while loop inside a loop
  choose: amortised-total
  when: The inner loop advances an index that the outer loop then continues from, so the total is O(n).
  over:
  - card: budget-from-constraints
    because: If the inner loop restarts for every position, the count is n²/2 and must fit the budget
      instead.
- weak_signal: A property of every number up to n that depends on its divisors, or counts of products
    at most n
  choose: harmonic-loops
  when: Turning the question around (each i visits its multiples) costs about n ln n in total.
  over:
  - card: budget-from-constraints
    because: Divisors up to √k for each k separately cost about n√n, too slow for n around 10^7.
