drill:
- problem: cf-185A
  answer:
    topic: '2.2'
    card: fast-power
  property: The count satisfies up' = 3·up + down with up + down = 4^n, which gives 2^(n−1)·(2^n + 1);
    with n up to 10^18, both powers need fast exponentiation modulo the prime.
  why_others_fail: Simulating n years is impossible; the closed formula reduces it to two powers.
- problem: ac-arc176_b
  answer:
    topic: '2.2'
    card: fast-power
  property: Modulo 2^M − 2^K the powers of 2 repeat with period M − K from 2^K on, so N can be reduced
    to below M; the last digit of 2^N' is then 2^N' mod 10, a power with an exponent up to 10^18.
  why_others_fail: The modulus is not prime and not even fixed, so Fermat does not apply; the reduction
    comes from 2^M ≡ 2^K.
- problem: lc-double-modular-exponentiation
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: All exponents are at most 1000, so multiplying step by step with a reduction after each product
    is fast enough.
  why_others_fail: 'No exponent is large: binary exponentiation is not needed (it also works, but the
    card''s property does not hold).'
- problem: lc-smallest-integer-divisible-by-k
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: 'Only the remainder of 11…1 modulo k matters: r = (10r + 1) mod k, and within k steps the
    remainders repeat, so either 0 appears or never does.'
  why_others_fail: There is no power to compute and no division; the remainders are tracked one digit
    at a time.
- problem: ac-arc107_a
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: The sum factors into three triangular numbers A(A+1)/2, each below 10^18, so it can be halved
    exactly before reducing modulo the prime.
  why_others_fail: Dividing by 2 modulo the prime would also work, but halving the exact value first needs
    no inverse at all.
- problem: ac-arc120_b
  answer:
    topic: '0.3'
    card: grid-processing
  property: The condition holds exactly when every anti-diagonal is one colour; scan the diagonals and
    multiply by 2 for each empty one.
  why_others_fail: The modulus only reduces a product of 2s; the work is the grid argument, not modular
    arithmetic.
- problem: lc-number-of-subsequences-that-satisfy-the-given-sum-condition
  answer:
    topic: '1.3'
    card: opposite-ends
  property: 'Sort; for each minimum a[i], two pointers find the largest j with a[i] + a[j] ≤ target, and
    the elements in between are free: 2^(j−i) subsets from a precomputed table.'
  why_others_fail: The powers of 2 have exponents below n, so a table built by doubling is enough; the
    decision is the two-pointer scan.
- problem: cf-1294C
  answer:
    topic: '2.1'
    card: trial-division
  property: 'One number up to 10^9: take its smallest divisor a, then the smallest divisor b of n/a above
    a, by trial division up to the square root.'
  why_others_fail: Nothing is asked modulo anything; it is a factorisation question about a single number.
- problem: lc-powerful-integers
  answer:
    topic: '0.5'
    card: nested-loops
  property: Powers of x up to 10^6 have exponents at most 20, so trying every pair of exponents is a few
    hundred checks.
  why_others_fail: Nothing is computed modulo anything and no exponent is large; the bound makes the search
    tiny.
- problem: cf-762A
  answer:
    topic: '2.1'
    card: trial-division
  property: 'One number up to 10^15: its divisors come in pairs (d, n/d) with d ≤ √n, about 3·10^7 trials.'
  why_others_fail: There is no power or remainder to compute; it is a factorisation question about one
    number.
lookalike_pairs:
- a: lc-count-collisions-of-monkeys-on-a-polygon
  b: cf-913A
  a_tool:
    topic: '2.2'
    card: fast-power
  b_tool:
    topic: '0.1'
    card: overflow-64bit
  flipping_difference: 'Both involve 2^n for a huge n and a remainder. In A the power is the value and
    the modulus is a fixed prime, so the power is computed by squaring. In B the power is the modulus:
    once it exceeds m (n ≥ 27), m mod 2^n is m, and computing 2^n would only overflow.'
  shared_surface: Both involve 2^n for a huge n and a remainder.
  flipping_input: 'A: print 2^n − 2 modulo 10^9 + 7 with n = 10^9, the power is the value and is computed
    by squaring. B: print 1000 mod 2^n with n = 10^8, the power is the modulus and the answer is 1000
    with no power computed.'
- a: ac-abc293_e
  b: cf-963A
  a_tool:
    topic: '2.2'
    card: fast-power
  b_tool:
    topic: '2.2'
    card: inverse-prime
  flipping_difference: Both are geometric sums modulo a number. In A the modulus M is any integer up to
    10^9, so q − 1 may have no inverse and the sum is built by doubling (S(2k) = S(k)·(1 + A^k)). In B
    the modulus 10^9 + 9 is prime, so the closed formula with an inverse works, except when the ratio
    is 1 modulo the prime, which needs its own case.
  shared_surface: Both are geometric sums 1 + q + … + q^(m−1) modulo a number.
  flipping_input: 'A: the modulus is 10 and the sum 1 + 3 + 9 + 27 = 40 is built by doubling, giving 0,
    since 2 has no inverse modulo 10. B: the modulus is 7 and (3^4 − 1) · 2^(−1) = 80 · 4 = 320 ≡ 5, equal
    to 40 mod 7 = 5, using the inverse of 2.'
self_test:
- q: How many multiplications does binary exponentiation need for a^(10^18) mod m, roughly?
  a: '10^18 has 60 bits, so 60 rounds with at most two multiplications each: at most 120 (Theorem 2.2.1).'
- q: Compute 3^(10^18) mod 7 by hand.
  a: 7 is prime and does not divide 3, so the exponent may be reduced modulo 6 (Theorem 2.2.5). Since
    10 ≡ 4 (mod 6) and 4·4 = 16 ≡ 4, every power of 10 is ≡ 4 (mod 6), so 10^18 ≡ 4. So 3^(10^18) ≡ 3^4
    = 81 ≡ 4 (mod 7).
- q: Why does 4 have no inverse modulo 10, and what does the formula a^(p−2) print for it if you use it
    anyway with p = 10?
  a: 'gcd(4, 10) = 2 ≠ 1, so 4x ≡ 1 (mod 10) has no solution (Theorem 2.2.3). 4^8 mod 10 = 6, a wrong
    answer printed silently: Fermat''s formula needs a prime modulus.'
- q: A probability is 2/6. Is its value modulo 998244353 the same as that of 1/3? Why?
  a: 'Yes. 2·3 = 6·1, so the two fractions are equal, and Theorem 2.2.4, part 1, says equal fractions
    give equal residues: 2·6^(−1) ≡ 3^(−1) = 332748118.'
- q: You must compute 2^(3^(10^9)) modulo 10^9 + 7. Which modulus do you use for 3^(10^9), and why not
    10^9 + 7?
  a: 'Modulo p − 1 = 10^9 + 6: powers of 2 modulo the prime p repeat with period p − 1 (Fermat), not p.
    Reducing modulo p would give a wrong exponent.'
- q: The sum 1 + r + … + r^(n−1) modulo 10^9 + 7 is computed as (r^n − 1)/(r − 1). Which input breaks
    this formula, and what is the right answer there?
  a: 'r ≡ 1 modulo 10^9 + 7: then r − 1 has no inverse. Every term is 1, so the sum is n mod (10^9 + 7).'
