  role: ladder
  card: point-update-range-query
  rung: 4
  twist: 'Offline: sort the queries by one bound and let the tree answer the other.'
  summary: 'Two arrays of up to 10^5 numbers and queries (x, y): the largest nums1[j] + nums2[j] with
