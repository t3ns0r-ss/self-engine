# Exercise inventory (DESIGN_TRACKS_PLAN.md Sections 10.10 and 18.2): planned cards, ladder rungs, drill stubs,
# checkpoint and review stubs for all 100 topics. Stubs are one line; the exercise YAML and kits are written per topic
# by scripts/new_topic.mjs from this file. Checked by scripts/inventory_check.mjs.
topics:
  L0.0:
    cards:
      - id: raii
        name: RAII for a resource
      - id: ownership-pointer
        name: Choosing unique_ptr, shared_ptr or a plain reference
    ladder:
      - rung: 1
        card: raii
        new_force: A class that owns a file handle and closes it in its destructor
        needs_new_structure: true
        tests: closing happens once, even when an exception is thrown after opening
      - rung: 2
        card: raii
        new_force: A function returns a heap object; the caller must not leak it
        needs_new_structure: true
        tests: unique_ptr returned by value, sanitizer reports no leak
      - rung: 3
        card: ownership-pointer
        new_force: Two owners really need the same object
        needs_new_structure: true
        tests: shared_ptr count reaches 0 exactly once; no dangling use
      - rung: 4
        card: ownership-pointer
        new_force: A function only reads an object it does not own
        needs_new_structure: true
        tests: takes a const reference; passing a temporary compiles, storing it does not dangle
      - rung: 5
        card: null
        new_force: A small value type is copied freely
        needs_new_structure: false
        tests: no pointers needed; copies are independent
    drill:
      - stub: A function opens a socket, parses a header, and may throw halfway
        answer:
          topic: L0.0
          card: raii
      - stub: A cache hands out the same 40 MB decoded image to three widgets, any of which may outlive the others
        answer:
          topic: L0.0
          card: ownership-pointer
      - stub: A helper prints a record it is given and keeps nothing
        answer: none
      - stub: A struct of three ints passed to a function 100 times a second
        answer: none
      - stub: A factory builds a parser and gives sole ownership to its caller
        answer:
          topic: L0.0
          card: ownership-pointer
      - stub: A lock must be released on every return path of a 25-line function
        answer:
          topic: L0.0
          card: raii
    checkpoint:
      title: Wrap a temporary file so it is always deleted
      type: build
    reviews:
      - set: 1
        stubs:
          - "Spot the leak: a loader that returns raw new Image on one path and throws on another"
          - Which of unique_ptr, shared_ptr or a reference for a logger passed to 5 classes
      - set: 2
        stubs:
          - Make a scoped timer that records elapsed time even on early return
          - "Two threads read one config that is replaced every hour: who owns it?"
  L0.1:
    cards:
      - id: class-invariant
        name: Class that protects an invariant
      - id: immutable-value
        name: Immutable value object
    ladder:
      - rung: 1
        card: class-invariant
        new_force: A Money type must never hold a negative amount
        needs_new_structure: true
        tests: constructor rejects negatives; no setter exposes the field
      - rung: 2
        card: class-invariant
        new_force: Money addition must not overflow or mix currencies
        needs_new_structure: true
        tests: adding two currencies throws; large sums are detected
      - rung: 3
        card: immutable-value
        new_force: A DateRange must keep start <= end after every change
        needs_new_structure: true
        tests: every mutator keeps the invariant; a failing change leaves the old range
      - rung: 4
        card: immutable-value
        new_force: A value object is shared between two orders
        needs_new_structure: true
        tests: changing one order never changes the other; no setters exist
      - rung: 5
        card: null
        new_force: A bag of independent settings with no relationship between fields
        needs_new_structure: false
        tests: plain struct passes; no class needed
    drill:
      - stub: A seat count that must stay between 0 and capacity
        answer:
