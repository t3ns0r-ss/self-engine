# Topic 3.7 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '3.7'
uses:
- topic: '0.5'
  what: 'Brute force: enumerating all subsets as bitmasks, the method this topic improves on'
- topic: '0.6'
  what: Maps and sets
- topic: '1.1'
  what: Sorting
- topic: '1.3'
  what: Two pointers on sorted weights
- topic: '1.5'
  what: Greedy matching in sorted order
- topic: '1.7'
  what: 'Bits: 1 << j, mask >> j & 1, mask | (1 << j), mask ^ (1 << j), and __builtin_popcount'
- topic: '2.1'
  what: 'Number theory: primes and square-free numbers'
- topic: '2.2'
  what: Modular arithmetic
- topic: '3.2'
  what: 'DP foundations: states, transitions, filling in an acyclic order (Theorem 3.2.3), memoisation'
- topic: '3.3'
  what: Knapsack and subset sums
- topic: '3.4'
  what: Sequence DP
- topic: '3.5'
  what: 'Counting DP: counts modulo a prime'
- topic: '3.6'
  what: Interval DP
theorems:
- id: 3.7.1
  title: Assignment over masks
  plain_words: When items are used at most once and the future depends only on which ones are used, store
    the set of used items as the bits of a number. The next item to place is given by how many are used,
    so the table has 2^n states instead of n! orders.
  code: 3.7/thm-1
- id: 3.7.2
  title: Paths through every vertex
  plain_words: To visit every city exactly once, remember which cities are visited and where you are.
    The shortest path to a state comes from the shortest path to the state without the last city, plus
    one edge.
  code: 3.7/thm-2
- id: 3.7.3
  title: Fewest groups
  plain_words: To pack items into groups with a capacity, add the items one at a time and keep, for each
    set of packed items, the smallest pair of groups used and weight of the last group. A pair that is
    smaller is never worse for what comes next.
  code: 3.7/thm-3
- id: 3.7.4
  title: Submask enumeration
  plain_words: The loop s = (s − 1) & m visits every submask of m exactly once, from large to small. Running
    it for every mask makes 3^n steps, because each item is either outside the mask, in the mask only,
    or in the submask.
  code: 3.7/thm-4
cards:
- id: assignment-mask
  name: Assigning items with a mask of used ones
  decisive_property: Items (jobs, partners, numbers, primes) are used at most once each, there are at
    most about 20 of them, and the future depends only on the set already used, not on the order; then
    dp[mask] over used sets, with the next position given by the size of the mask, replaces trying all
    n! orders.
  from_theorem: 3.7.1
  how_to_test: 'Write what a partial solution must remember: if it is just "which of the n items are taken"
    (plus the position, which equals the count), and 2^n · n fits, the mask DP applies.'
  constraint_shapes:
  - 'n up to 20 workers and jobs: the 20! ≈ 2.4·10^18 orders are impossible, while 2^20 · 20 = 2·10^7
    steps are easy.'
  weak_signals:
  - form: n up to 16–20 people, jobs or numbers to pair or order, with an arbitrary cost table
    shape: n ≤ 20
  - form: '"Each used at most once" with a small universe (letters of a word, primes below 30, skills)'
    shape: A universe of at most 20 items
  - form: A game where players take numbers from a small pool, and the pool left decides the position
    shape: A pool of at most 20 numbers
  kill_signals:
  - 'n up to 10^5: no mask exists; for 100000 players and trainers the sorted greedy finds the most matches,
    99778 in the example, while 2^100000 states are impossible.'
  - 'The state is not a set of items: the shape of a rectangle being cut has no subset to store.'
  in_action:
    statement: n workers and n jobs; c[i][j] is the cost of giving job j to worker i. Give every worker
      one job, at the least total cost.
    constraints: n ≤ 20, c up to 10^9.
    budget: 'Trying every permutation is 20! ≈ 2.4·10^18. The table has 2^20 masks with up to 20 jobs
      each: 2·10^7 steps.'
    candidates:
    - tool: Greedy, each worker takes the cheapest free job
      verdict: rejected
      because: A cheap choice early can take the only good job of a later worker.
    - tool: dp over the set of jobs already taken
      verdict: chosen
      because: After the first k workers have their jobs, the rest depends only on which jobs are taken,
        and k is the size of the set.
    property_check: Only the set of used jobs matters for the future, and 2^n · n fits (Theorem 3.7.1).
    decision: 'dp[0] = 0; for each mask, worker = popcount(mask), try every free job j: dp[mask | 1 <<
      j] = min(dp[mask | 1 << j], dp[mask] + c[worker][j]); print dp[2^n − 1].'
  examples:
    positive:
    - inline:
        input: The cheapest assignment for the costs 4 1 3 / 2 0 5 / 3 2 2
        answer: '5'
        why: dp over the masks 000 to 111 is 0, 4, 1, 3, 3, 5, 3, 5; worker 0 takes job 1, worker 1 job
          0, worker 2 job 2.
    - worked_example: ac-dp_o
      why: The ways to pair N men with N women depend only on the set of women already used, N ≤ 21.
    negative:
    - inline:
        input: The most matches between 100000 players and 100000 trainers, a player fitting a trainer
          with capacity at least the player's ability
        answer: '99778'
        method_gives: too-slow
        why: Whether a pair works is a threshold on sorted values, so matching in sorted order is optimal;
          the mask over 100000 trainers has 2^100000 states.
      correct_tool:
        topic: '1.5'
        card: sorted-matching
    - problem: lc-palindrome-partitioning-ii
      why: The state is the length of the prefix already covered by palindromic pieces, one number, not
        a set of used items.
      correct_tool:
        topic: '3.2'
        card: linear-state
  lookalikes:
  - description: Match players to trainers (10^5 each), a player fitting a trainer with capacity at least
      the player's ability; the most matches
    tool:
      topic: '1.5'
      card: sorted-matching
    flipping_difference: Whether a pair works is a threshold on sorted values, so matching in sorted order
      is optimal; with an arbitrary cost table (XOR, compatibility scores) and n ≤ 20, the mask DP is
      needed.
  complexity: O(2^n · n) time, O(2^n) memory.
- id: path-mask
  name: Paths through every vertex
  decisive_property: A route must visit every one of n ≤ about 18 places exactly once (or count such routes),
    with arbitrary distances or allowed moves between them; the state is (visited set, current place),
    since the rest of the route depends on nothing else.
  from_theorem: 3.7.2
  how_to_test: Check that "each place exactly once" (or "all places") is required, that the cost of the
    next step depends only on the current place and the next one, and that 2^n · n² fits.
  constraint_shapes:
  - 'n up to 16 cities: the 15! orders are 1.3·10^12, while 2^16 · 16² = 1.7·10^7 steps are easy.'
  weak_signals:
  - form: Visit all n ≤ 16–18 cities, return or not; the shortest route
    shape: n ≤ 18
  - form: Order all words, strings or numbers so that neighbours fit together (overlap, divisibility,
      a chain rule)
    shape: n ≤ 14 to 20
  - form: Count the orders or routes that use every element once
    shape: n ≤ 20
  kill_signals:
  - 'Points on a line: visiting 100000 points needs only max − min after sorting, 999980003 in the example,
    while 2^100000 states are impossible.'
  - 'Visiting every edge, not every vertex, or a large n: a different problem.'
  in_action:
    statement: n cities with one-way travel times; starting at city 0, visit every city exactly once and
      return to city 0 in the least total time.
    constraints: n ≤ 16.
    budget: '15! = 1.3·10^12 orders. The table has 2^16 · 16 states with 16 transitions each: 1.7·10^7
      steps.'
    candidates:
    - tool: Try all orders of the other cities
      verdict: rejected
      because: (n − 1)! orders.
    - tool: dp over (visited set, last city)
      verdict: chosen
      because: The rest of the route depends only on which cities are used and where it stands.
    property_check: The cost of the next step depends only on the current city and the next one (Theorem
      3.7.2).
    decision: dp[1][0] = 0; extend each (mask, v) by every unvisited u; print the minimum over v of dp[all][v]
      + d[v][0].
  examples:
    positive:
    - inline:
        input: The shortest tour of four cities with distances 0 2 9 10 / 1 0 6 4 / 15 7 0 8 / 6 3 12
          0
        answer: '21'
        why: The tour 0 → 2 → 3 → 1 → 0 has length 9 + 8 + 3 + 1 = 21; trying all 3! orders confirms it.
    - worked_example: lc-special-permutations
      why: The orders of the numbers in which neighbours divide each other are counted with the state
        (set used, last number), n ≤ 14.
    negative:
    - inline:
        input: The shortest walk visiting 100000 points on a number line
        answer: '999980003'
        method_gives: too-slow
        why: On a line, walking from the leftmost to the rightmost point visits all of them, so the answer
          is max − min after sorting.
      correct_tool:
        topic: '1.1'
        card: sort-then-scan
    - problem: ac-dp_o
      why: Each man is paired with a woman; the state is the set of women used, and no route or last position
        is part of it.
      correct_tool:
        topic: '3.7'
        card: assignment-mask
  lookalikes:
  - description: Visit all n ≤ 10^5 points on a number line, starting at any point; the shortest walk
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: On a line, walking from the leftmost to the rightmost point visits all of them,
      so the answer is max − min after sorting; with arbitrary distances between places the order matters
      and needs the (set, last) table.
  complexity: O(2^n · n²) time, O(2^n · n) memory.
- id: group-mask
  name: Packing items into the fewest groups
  decisive_property: At most about 20 items must be split into the fewest groups (rides, sessions, bins)
    under a capacity, groups are interchangeable, and a set of packed items is best summarised by (groups
    used, fill of the last group); then items are added one at a time over masks.
  from_theorem: 3.7.3
  how_to_test: Check that groups have a capacity and no order, that n ≤ 20, and that the pair (groups,
    last fill) compared in that order is never worse for the future.
  constraint_shapes:
  - 'n up to 20 items: trying all assignments to groups is exponential, while 2^20 · 20 = 2·10^7 steps
    are easy.'
  weak_signals:
  - form: Fewest elevator rides, work sessions or trucks for items with weights
    shape: n ≤ 20
  - form: Split n ≤ 16 numbers into k groups with equal sums
    shape: n ≤ 16
  - form: Each group holds at most C in total, any number of items
    shape: n ≤ 20
  kill_signals:
  - 'At most two items per group: three items of weight 1 with capacity 3 need 2 boats, but any number
    per group gives 1; sort and pair the lightest with the heaviest.'
  - 'Only two groups (equal halves) and larger n: 1, 2, …, 40 split into two groups of sum 410, which
    subset sums decide, while 2^40 masks are impossible.'
  in_action:
    statement: n items with weights w_i must be split into groups of total weight at most C each; print
      the fewest groups.
    constraints: n ≤ 20, C ≤ 10^9.
    budget: 'All assignments of items to groups are exponential. The table has 2^20 masks with 20 transitions:
      2·10^7 steps.'
    candidates:
    - tool: Greedy, first fit in the given order
      verdict: rejected
      because: The order of filling decides the number of groups, and the best order is what is being
        searched.
    - tool: dp over masks of (groups, fill of the last group)
      verdict: chosen
      because: A smaller pair is never worse for adding the next item.
    property_check: Groups are interchangeable and the pair is monotone (Theorem 3.7.3).
    decision: best[0] = (1, 0); best[mask] = the minimum over j in mask of add(best[mask without j], w_j);
      print the first number of best[all].
  examples:
    positive:
    - inline:
        input: The fewest groups for the weights 4 8 6 1 with capacity 10
        answer: '2'
        why: For example {4, 6} and {8, 1}; best[all] = (2, 9).
    - inline:
        input: The fewest groups for five items of weight 5 with capacity 12
        answer: '3'
        why: A group holds at most two items (10 ≤ 12 < 15), so five items need ⌈5/2⌉ = 3 groups.
    negative:
    - inline:
        input: Three items of weight 1 with capacity 3 and at most two items per group, computed with
          any number of items per group
        answer: '2'
        method_gives: '1'
        why: The limit of two items per group is a different rule; with at most two per group, pair the
          heaviest remaining with the lightest that fits (two pointers on sorted weights).
      correct_tool:
        topic: '1.3'
        card: opposite-ends
    - inline:
        input: Can 1, 2, …, 40 be split into two groups of equal sum 410?
        answer: '1'
        method_gives: too-slow
        why: With 40 items the mask table has 2^40 entries; for two groups of equal sum the row of reachable
          sums (up to 820) answers it.
      correct_tool:
        topic: '3.3'
        card: subset-sums
  lookalikes:
  - description: The fewest boats for n ≤ 5·10^4 people with weights, each boat carrying at most two people
      and weight at most C
    tool:
      topic: '1.3'
      card: opposite-ends
    flipping_difference: With at most two people per boat, pairing the heaviest with the lightest that
      fits is optimal (two pointers on the sorted weights); with any number of items per group, the order
      of filling matters and the mask table is needed.
  complexity: O(2^n · n) time.
- id: submask-mask
  name: Splitting a set into a first group and the rest
  decisive_property: The value of a set of at most about 16 items is the best way to split it into one
    group and the rest (or a set is built from two disjoint parts), so dp[mask] tries every submask; all
    masks with all their submasks take 3^n steps.
  from_theorem: 3.7.4
  how_to_test: Check that the answer combines a chosen subset with an answer for its complement, that
    the value of a single group can be precomputed for every mask, and that 3^n fits (n ≤ 16–18).
  constraint_shapes:
  - 'n up to 16 items: 3^16 = 4.3·10^7 pairs of (mask, submask), while the 16-item set partitions number
    10^10.'
  weak_signals:
  - form: Partition n ≤ 16 items into groups of any size; each group scores a value
    shape: n ≤ 16
  - form: Schedule courses or tasks in rounds, choosing a subset each round
    shape: n ≤ 16
  - form: Choose two disjoint subsets with properties
    shape: n ≤ 16
  kill_signals:
  - 'Each subset is judged on its own: the subsets of 20 numbers with the largest OR can be counted by
    looping over the 2^20 masks, 1024079 of them, while 3^20 pairs are too slow.'
  - 'The groups have a capacity and should be few: the (groups, fill) table is faster, 2^n · n steps for
    the fewest groups, while 3^20 is too slow.'
  in_action:
    statement: Split n items with weights w_i into groups of total weight at most C each; a group scores
      the square of its total weight. Maximise the total score.
    constraints: n ≤ 16, C ≤ 10^4.
    budget: The set partitions of 16 items number 10^10. The submask loop is 3^16 = 4·10^7 steps.
    candidates:
    - tool: Try every partition of the items
      verdict: rejected
      because: 10^10 partitions.
    - tool: dp[mask] over the submask that holds the lowest item
      verdict: chosen
      because: The score of a group depends on the group alone, so the best split is a group plus the
        best for the rest, and fixing the lowest item counts each split once.
    property_check: The value of a set is the best of one group plus the value of the remaining set, and
      3^16 fits (Theorem 3.7.4).
    decision: sum[mask] by lowest bit; dp[mask] = the maximum over submasks s containing the lowest item
      with sum[s] ≤ C of dp[mask ^ s] + sum[s]².
  examples:
    positive:
    - inline:
        input: Split the weights 3 2 2 into groups of total at most 5, a group scoring the square of its
          total
        answer: '29'
        why: The groups {3, 2} and {2} score 25 + 4 = 29, against 25 for {3} and {2, 2} and 17 for separate
          items.
    - inline:
        input: Split the weights 1 2 3 4 into groups of total at most 5, a group scoring the square of
          its total
        answer: '50'
        why: The groups {1, 4} and {2, 3} score 25 + 25 = 50.
    negative:
    - inline:
        input: The number of subsets of 20 numbers whose OR is the largest possible, computed by splitting
          into submasks
        answer: '1024079'
        method_gives: too-slow
        why: Each subset is judged alone, so a single loop over the 2^20 masks with an incremental OR
          is enough; the 3^20 pairs of masks are 3.5·10^9.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - problem: ac-dp_o
      why: Each man is paired with a woman; the state is the set of women used, with no splitting of a
        set into two parts.
      correct_tool:
        topic: '3.7'
        card: assignment-mask
  lookalikes:
  - description: Count the subsets of n ≤ 16 numbers whose bitwise OR is the largest possible
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: Each subset is checked alone, so enumerating the 2^n masks and computing each
      OR is enough; the submask DP is needed when a set's value depends on how it is split into parts.
  complexity: O(3^n) time, O(2^n) memory.
problems:
- id: ac-dp_o
  role: worked_example
  summary: Count the ways to pair N ≤ 21 men with N women along a 0/1 compatibility table, modulo 10^9
    + 7.
- id: lc-special-permutations
  role: worked_example
  summary: Count the orders of n ≤ 14 distinct numbers in which every two neighbours divide one another,
    modulo 10^9 + 7.
- id: lc-minimum-xor-sum-of-two-arrays
  role: ladder
  card: assignment-mask
  rung: 1
  twist: Base case of the card
  summary: Rearrange the second of two arrays (n ≤ 14) to minimise the sum of nums1[i] XOR nums2[i].
  hints:
  - If nums1[0..k−1] are already matched, what about the matching matters for the rest?
  - Only which elements of nums2 are used, a mask; k is its popcount (Theorem 3.7.1).
  - dp[mask | 1 << j] = min(dp[mask] + (nums1[popcount(mask)] XOR nums2[j])) over free j; answer dp[all].
- id: ac-abc318_d
  role: ladder
  card: assignment-mask
  rung: 2
  twist: 'Not every item must be used, and pairs are unordered: always decide the lowest undecided vertex.'
  summary: Choose edges with pairwise distinct endpoints in a complete weighted graph on N ≤ 16 vertices,
    maximising the total weight.
  hints:
  - Pairs are unordered and some vertices stay unmatched. How do you avoid building the same matching
    in many orders?
  - 'Always decide the lowest vertex not yet in the mask: leave it unmatched, or match it with another
    free vertex.'
  - 'dp[mask] over decided vertices; from mask, let i = lowest free vertex: dp[mask | 1 << i] (unmatched)
    and dp[mask | 1 << i | 1 << j] + w(i, j). O(2^N · N).'
- id: lc-maximize-score-after-n-operations
  role: ladder
  card: assignment-mask
  rung: 3
  twist: Items are used two at a time, and the step number (from the popcount) multiplies the score.
  summary: 2n ≤ 14 numbers; in operation i (1-based) remove two of them, x and y, scoring i · gcd(x, y).
    Maximise the total.
  hints:
  - After some operations, what do you know about the next operation from the set of used numbers alone?
  - 'Its number: popcount(mask) / 2 + 1, and which numbers are still free.'
  - dp[mask] for masks of even size; add every free pair (i, j) with (popcount/2 + 1) · gcd; precompute
    the gcds.
- id: ac-abc354_e
  role: ladder
  card: assignment-mask
  rung: 4
  twist: 'A two-player game: a mask is winning or losing instead of a cost.'
  summary: N ≤ 18 cards with a front and a back number; players alternately remove two cards with equal
    fronts or equal backs; who cannot move loses. Who wins?
  hints:
  - What does a position consist of, and when is it winning?
  - Only the set of cards still on the table. It is winning if some allowed move leads to a losing set.
  - 'win[mask] for increasing masks (removing cards makes the mask smaller): check all pairs in mask;
    O(2^N · N²).'
- id: ac-abc142_e
  role: ladder
  card: assignment-mask
  rung: 5
  twist: Each choice adds a whole set at once (a key opens several boxes), combined by OR, and may be
    reused.
  summary: N ≤ 12 boxes and M ≤ 1000 keys; a key costs a_i, opens a given set of boxes, and can be used
    any number of times. The least cost to open all boxes, or −1.
  hints:
  - Write each key as a mask of boxes. What does buying a key do to the set of opened boxes?
  - 'mask becomes mask | key: a knapsack whose "weight" is a set combined by OR (topic 3.3, unbounded).'
  - cost[0] = 0; for every mask in increasing order and every key, cost[mask | key] = min(cost[mask] +
    a); answer cost[all]. O(2^N · M).
- id: cf-895C
  role: ladder
  card: assignment-mask
  rung: 6
  twist: The mask is a parity of prime exponents, combined by XOR, with values repeated many times.
  summary: Count the non-empty subsets of n ≤ 10^5 numbers (each ≤ 70) whose product is a perfect square,
    modulo 10^9 + 7.
  hints:
  - When is a product a square, in terms of the primes up to 70?
  - When every prime appears an even number of times. Store for each value the parities of its prime exponents
    as a mask over the 19 primes; a product is a square when the XOR of the masks is 0.
  - 'Group equal values: taking an even or an odd number of the c copies of a value gives 2^(c − 1) ways
    each. dp over the 70 values and the 2^19 parity masks; subtract the empty subset.'
- id: ac-abc180_e
  role: ladder
  card: path-mask
  rung: 1
  twist: Base case of the card
  summary: A tour from city 1 through all N ≤ 17 cities in 3D and back; moving from (a, b, c) to (p, q,
    r) costs |p − a| + |q − b| + max(0, r − c). The cheapest tour.
  hints:
  - The costs are not symmetric. Does the template care?
  - 'No: Theorem 3.7.2 works with any costs d(u, v); only the set visited and the current city matter.'
  - Compute all costs, run dp[mask][last] from city 1, close the tour back to city 1. O(2^N · N²).
- id: cf-580D
  role: ladder
  card: path-mask
  rung: 2
  twist: A bonus on the edge between consecutive items, and only m of the n items are used.
  summary: Eat exactly m of n ≤ 18 dishes in some order; dish i gives a_i, and eating y right after x
    gives a bonus c(x, y). Maximise the total.
  hints:
  - What decides the value of eating dish j next?
  - 'Its own value and the dish eaten just before it: the state is (dishes eaten, last dish).'
  - dp[mask][last] with a_j + bonus(last, j) per step; the answer is the best over masks with popcount
    m. Use long long.
- id: ac-abc278_f
  role: ladder
  card: path-mask
  rung: 3
  twist: 'A game on paths: a state is winning or losing.'
  summary: N ≤ 16 words; players alternately say an unused word whose first letter is the last letter
    of the previous word; who cannot move loses. Does the first player win?
  hints:
  - What does the next player need to know?
  - Which words are used and which word was said last.
  - win[mask][last] = some unused j with first(j) = last letter of last and win[mask | j][j] false; evaluate
    from full masks down (or memoise). The first move can be any word.
- id: cf-11D
  role: ladder
  card: path-mask
  rung: 4
  twist: 'Count cycles, each counted once: fix the lowest vertex as the start and divide by the two directions.'
  summary: Count the simple cycles (length at least 3) in a simple undirected graph with n ≤ 19 vertices.
  hints:
  - A cycle can be written starting at any of its vertices and in two directions. How do you pick one
    way?
  - Start at its lowest vertex s and only use higher vertices; then each cycle is found exactly twice
    (two directions).
  - cnt[mask][v] = paths from lowest(mask) to v inside mask; close when v is adjacent to the start and
    the path has at least 3 vertices; divide the total by 2.
- id: cses-1653
  role: ladder
  card: group-mask
  rung: 1
  twist: Base case of the card
  summary: Take n ≤ 20 people with weights up an elevator with capacity x; the fewest rides.
  hints:
  - Rides are interchangeable. What do you keep for a set of people already taken?
  - The smallest (rides, weight in the last ride) over all ways to pack them (Theorem 3.7.3).
  - 'best[mask] = min over the last person p of adding p to best[mask without p]: into the last ride if
    it fits, else a new ride.'
- id: lc-minimum-number-of-work-sessions-to-finish-the-tasks
  role: ladder
  card: group-mask
  rung: 2
  twist: Time instead of weight; the same pair state.
  summary: Finish n ≤ 14 tasks in work sessions of at most sessionTime ≤ 15 hours each; a task cannot
    be split. The fewest sessions.
  hints:
  - How is a session like an elevator ride?
  - Its capacity is the session time; tasks are the people. The order of sessions does not matter.
  - The same (sessions, time used in the current session) per mask; answer the session count for all tasks.
- id: lc-minimum-incompatibility
  role: ladder
  card: group-mask
  rung: 3
  twist: Groups of a fixed size with distinct values; the cost of a group (max − min) is collected while
    it is filled.
  summary: Split n ≤ 16 numbers into k groups of equal size with no repeated value inside a group; a group
    costs its max minus its min. Minimise the total, or −1.
  hints:
  - Sort the numbers and fill the groups one after another, each in increasing order of value. What must
    the state remember?
  - 'The used set and the last element added: the size of the current group follows from popcount(mask)
    mod (n/k), and its cost grows by (next − last) at each step.'
  - 'Sort the numbers first. dp[mask][last]: within a group add a free element with a larger value (cost
    += difference); when a group is full, start the next one with the lowest free element, which is then
    the group''s minimum (cost 0). O(2^n · n²).'
- id: ac-dp_u
  role: ladder
  card: submask-mask
  rung: 1
  twist: Base case of the card
  summary: Split N ≤ 16 rabbits into groups; every pair in the same group adds a given (possibly negative)
    score. Maximise the total.
  hints:
  - What is the score of one group, and how do you split a set into a first group and the rest?
  - score[s] = sum over pairs in s, precomputed for all masks; the group of the lowest rabbit is some
    submask s.
  - best[mask] = max over submasks s containing the lowest bit of score[s] + best[mask ^ s] (Theorem 3.7.4).
    O(3^N).
- id: lc-parallel-courses-ii
  role: ladder
  card: submask-mask
  rung: 2
  twist: The submask is limited to k courses chosen among those currently available.
  summary: n ≤ 15 courses with prerequisites; at most k per semester, each only after its prerequisites.
    The fewest semesters.
  hints:
  - Why is "take the k courses with the most dependants" not safe?
  - Choices interact through later prerequisites; greedy rules fail on small cases. A state is just the
    set of finished courses.
  - dp[mask] = fewest semesters; available = courses not in mask with prerequisites in mask; if at most
    k are available take all, else try every submask of size k.
- id: ac-abc332_e
  role: ladder
  card: submask-mask
  rung: 3
  twist: A fixed number of groups D, so the table has a count index as well as the mask.
  summary: Put N ≤ 15 items with weights into D bags (bags may be empty) to minimise the variance of the
    bag weights.
  hints:
  - The mean is fixed. What is left to minimise?
  - The sum of the squared bag weights.
  - sq[mask] = (sum of mask)²; dp[d][mask] = min over submasks s of dp[d − 1][mask ^ s] + sq[s]; variance
    = dp[D][all] / D − mean². O(D · 3^N).
