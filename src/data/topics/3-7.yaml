# Topic 3.7 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.7"
draft: true
cards:
  - id: assignment-mask
    name: Assigning items with a mask of used ones
    decisive_property: Items (jobs, partners, numbers, primes) are used at most once each, there are at
      most about 20 of them, and the future depends only on the set already used, not on the order; then
      dp[mask] over used sets, with the next position given by the size of the mask, replaces trying all
      n! orders.
    from_theorem: Theorem 3.7.1
    how_to_test: 'Write what a partial solution must remember: if it is just "which of the n items are
      taken" (plus the position, which equals the count), and 2^n · n fits, the mask DP applies.'
    weak_signals:
      - n ≤ 16–20 people, jobs or numbers to pair or order, with an arbitrary cost table
      - '"Each used at most once" with a small universe (letters of a word, primes below 30, skills)'
      - A game where players take numbers from a small pool, and the pool left decides the position
    kill_signals:
      - 'n up to 10^5: no mask; the cost must have structure (sorting, greedy)'
      - 'The cost of a pair depends only on comparing two values (a threshold): sorting and a greedy match
        solve it'
    lookalikes:
      - description: Match players to trainers (10^5 each), a player fitting a trainer with capacity at
          least the player's ability; the most matches
        needs: sorted-matching (1.5)
        flipping_difference: Whether a pair works is a threshold on sorted values, so matching in sorted
          order is optimal; with an arbitrary cost table (XOR, compatibility scores) and n ≤ 20, the mask
          DP is needed.
    complexity: O(2^n · n) time, O(2^n) memory.
  - id: path-mask
    name: Paths through every vertex
    decisive_property: A route must visit every one of n ≤ about 18 places exactly once (or count such
      routes), with arbitrary distances or allowed moves between them; the state is (visited set, current
      place), since the rest of the route depends on nothing else.
    from_theorem: Theorem 3.7.2
    how_to_test: Check that "each place exactly once" (or "all places") is required, that the cost of
      the next step depends only on the current place and the next one, and that 2^n · n² fits.
    weak_signals:
      - Visit all n ≤ 16–18 cities, return or not; the shortest route
      - Order all words, strings or numbers so that neighbours fit together (overlap, divisibility, a
        chain rule)
      - Count the orders or routes that use every element once, n ≤ 20
    kill_signals:
      - 'Points on a line or with a special metric: the best order is sorted, no mask needed'
      - 'Visit every edge, not every vertex, or n large: a different problem (Eulerian paths, later topics)'
    lookalikes:
      - description: Visit all n ≤ 10^5 points on a number line, starting at any point; the shortest walk
        needs: sort-then-scan (1.1)
        flipping_difference: On a line, walking from the leftmost to the rightmost point visits all of
          them, so the answer is max − min after sorting; with arbitrary distances between places the
          order matters and needs the (set, last) table.
    complexity: O(2^n · n²) time, O(2^n · n) memory.
  - id: group-mask
    name: Packing items into the fewest groups
    decisive_property: At most about 20 items must be split into the fewest groups (rides, sessions, bins)
      under a capacity, groups are interchangeable, and a set of packed items is best summarised by (groups
      used, fill of the last group); then items are added one at a time over masks.
    from_theorem: Theorem 3.7.3
    how_to_test: Check that groups have a capacity and no order, that n ≤ 20, and that the pair (groups,
      last fill) compared in that order is never worse for the future.
    weak_signals:
      - Fewest elevator rides, work sessions or trucks for n ≤ 20 items with weights
      - Split n ≤ 16 numbers into k groups with equal sums
      - Each group holds at most C in total, any number of items
    kill_signals:
      - 'At most two items per group: sort and pair the lightest with the heaviest'
      - 'Only two groups (equal halves): subset sums (3.3), with much larger n'
    lookalikes:
      - description: The fewest boats for n ≤ 5·10^4 people with weights, each boat carrying at most two
          people and weight at most C
        needs: opposite-ends (1.3)
        flipping_difference: With at most two people per boat, pairing the heaviest with the lightest
          that fits is optimal (two pointers on the sorted weights); with any number of items per group,
          the order of filling matters and the mask table is needed.
    complexity: O(2^n · n) time.
  - id: submask-mask
    name: Splitting a set into a first group and the rest
    decisive_property: The value of a set of at most about 16 items is the best way to split it into one
      group and the rest (or a set is built from two disjoint parts), so dp[mask] tries every submask;
      all masks with all their submasks take 3^n steps.
    from_theorem: Theorem 3.7.4
    how_to_test: Check that the answer combines a chosen subset with an answer for its complement, that
      the value of a single group can be precomputed for every mask, and that 3^n fits (n ≤ 16–18).
    weak_signals:
      - Partition n ≤ 16 items into groups of any size; each group scores a value
      - Schedule courses or tasks in rounds, choosing a subset each round
      - Choose two disjoint subsets with properties
    kill_signals:
      - 'Each subset is judged on its own and only counted or compared: enumerate the 2^n subsets directly
        (0.5)'
      - 'The groups have a capacity and should be few: the (groups, fill) table of the group-mask card
        is faster, 2^n · n'
    lookalikes:
      - description: Count the subsets of n ≤ 16 numbers whose bitwise OR is the largest possible
        needs: subset-bitmask (0.5)
        flipping_difference: Each subset is checked alone, so enumerating the 2^n masks and computing
          each OR is enough; the submask DP is needed when a set's value depends on how it is split into
          parts.
    complexity: O(3^n) time, O(2^n) memory.
