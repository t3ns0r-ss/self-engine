# Topic 2.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "2.2"
draft: true
cards:
  - id: fast-power
    name: Powers with huge exponents
    decisive_property: "The answer is a power a^b (or a product of a few powers) modulo m, and b is far too large to multiply b times (up to 10^18); squaring the base at each bit of b gives it in O(log b) multiplications."
    from_theorem: Theorem 2.2.1
    how_to_test: "Write the answer as a closed formula; if it contains x^n with n beyond about 10^7, and only the remainder is asked, the card applies."
    weak_signals:
      - "\"Print the answer modulo 10^9 + 7\" with n up to 10^9 or 10^18 and a formula like k^n or (k − 1)^n"
      - "Each of n independent positions has k choices; count the arrangements"
      - "The number of strings, colourings or subsets for a huge length"
    kill_signals:
      - "The modulus is the power itself (m mod 2^n): the answer is m once 2^n > m, no power is computed"
      - "The answer is exact and huge (not modulo anything): big-number arithmetic, not this card"
    lookalikes:
      - description: "Print m mod 2^n for n up to 10^8"
        needs: "integer-rounding (0.1)"
        flipping_difference: "Here the power is the modulus, not the value: once 2^n exceeds m the answer is m itself."
    complexity: "O(log b) multiplications."
  - id: inverse-prime
    name: Division and fractions modulo a prime
    decisive_property: "The formula divides (or the answer is a fraction P/Q), and the modulus is a prime p that does not divide the divisors; multiplying by the inverse a^(p−2) keeps every step modulo p, and the result is the residue of the exact answer."
    from_theorem: Theorem 2.2.3
    how_to_test: "Check that the modulus is prime (10^9 + 7 and 998244353 are) and that no divisor in the formula can be a multiple of it."
    weak_signals:
      - "\"Print the answer as P·Q^(−1) mod 998244353\", or a probability modulo a prime"
      - "A formula with a division, such as a geometric sum (r^n − 1)/(r − 1)"
      - "Undoing a multiplication applied to many values at once"
    kill_signals:
      - "The modulus is not prime (any M up to 10^9): use extended Euclid when gcd(a, M) = 1, or avoid division altogether"
      - "The divisor can be a multiple of p (for example r ≡ 1 in a geometric sum): handle that case separately"
    lookalikes:
      - description: "A geometric sum 1 + r + … + r^(n−1) modulo an arbitrary M"
        needs: "fast-power (2.2) with doubling"
        flipping_difference: "M is not prime, so (r^n − 1)/(r − 1) cannot be divided; split the sum in halves recursively instead."
    complexity: "O(log p) per inverse, or O(n) for the inverses of 1..n."
  - id: exponent-reduction
    name: Reducing huge exponents
    decisive_property: "The exponent itself is too large to store or is a power or product (a^(b^c), an exponent given as a huge number), and the modulus p of the base is prime with p ∤ a; then the exponent may be reduced modulo p − 1."
    from_theorem: Theorem 2.2.5
    how_to_test: "Check that the base's modulus is prime, that the base is not a multiple of it (or treat that case alone), and reduce the exponent modulo p − 1, not p."
    weak_signals:
      - "Towers of powers a^(b^c) modulo 10^9 + 7"
      - "An exponent given as a list of digits or as a huge product"
      - "The product of all divisors, or a power of a count that is itself huge"
    kill_signals:
      - "The base can be a multiple of p (then the power is 0 for every positive exponent)"
      - "The base's modulus is not prime: reducing modulo p − 1 is not valid"
    lookalikes:
      - description: "a^b mod p with b ≤ 10^18 given directly"
        needs: "fast-power (2.2)"
        flipping_difference: "b fits in a long long, so fast power handles it without any reduction."
    complexity: "O(log p) after reducing the exponent."
problems:
  - id: ac-abc162_e
    role: worked_example
    summary: "The sum of the GCDs of all K^N sequences with entries in [1, K] (N, K ≤ 10^5), modulo 10^9 + 7."
  - id: cses-2182
    role: worked_example
    summary: "Given a prime factorisation (up to 10^5 primes ≤ 10^6, exponents ≤ 10^9), the number, sum and product of the divisors modulo 10^9 + 7."
  - id: cses-1095
    role: ladder
    card: fast-power
    rung: 1
    twist: Base case of the card
    summary: "For n ≤ 2·10^5 pairs (a, b) with a, b ≤ 10^9, print a^b modulo 10^9 + 7 (with 0^0 = 1)."
    hints:
      - "Multiplying b times is 10^9 steps per pair. How can the bits of b help?"
      - "Square the base for each bit of b and multiply it in where the bit is 1 (Theorem 2.2.1)."
      - "Start r at 1 (which also gives 0^0 = 1), reduce a first, and use long long products."
  - id: cf-1594B
    role: ladder
    card: fast-power
    rung: 2
    twist: The exponents are the bits of k, so the answer is a sum of powers.
    summary: "Numbers that are sums of distinct powers of n, in increasing order: print the k-th one modulo 10^9 + 7 (n, k ≤ 10^9, many tests)."
    hints:
      - Write the first few special numbers for n = 3. How do they relate to 1, 10, 11, 100 in binary?
      - "The k-th special number uses n^i exactly for the bits i set in k (topic 1.7)."
      - "Walk the bits of k, keeping the current power of n modulo the prime; add it where the bit is 1."
  - id: lc-powx-n
    role: ladder
    card: fast-power
    rung: 3
    twist: The same squaring with real numbers and negative exponents.
    summary: "Compute x^n for a real x (|x| < 100) and an integer n with |n| < 2^31."
    hints:
      - "Squaring works for any associative multiplication, not only modulo m. What changes for a negative n?"
      - "x^n = (1/x)^(−n); careful: −n overflows int when n = −2^31."
      - "Copy n into a long long, take 1/x if it is negative, then run the binary exponentiation loop on doubles."
  - id: lc-count-good-numbers
    role: ladder
    card: fast-power
    rung: 4
    twist: Count with the product rule first; the count is a product of two powers.
    summary: "Count digit strings of length n ≤ 10^15 with even digits at even positions and prime digits at odd positions, modulo 10^9 + 7."
    hints:
      - How many choices does each position have, and are the positions independent?
      - "5 choices at each of the ⌈n/2⌉ even positions and 4 at each of the ⌊n/2⌋ odd ones: 5^⌈n/2⌉ · 4^⌊n/2⌋."
      - "Two fast powers with long long exponents, then one product modulo 10^9 + 7."
  - id: ac-abc168_e
    role: ladder
    card: fast-power
    rung: 5
    twist: Group the items first (GCD normalisation from topic 0.4), then multiply powers of 2 over the groups.
    summary: "Choose a non-empty set of up to 2·10^5 sardines (A_i, B_i up to 10^18 in absolute value) without two with A_i·A_j + B_i·B_j = 0; count the ways modulo 10^9 + 7."
    hints:
      - When are two sardines on bad terms? Think of (A, B) as a direction, and normalise it.
      - "Divide (A, B) by its GCD and fix the sign; the bad partner of direction (a, b) is (−b, a). Sardines (0, 0) clash with everyone."
      - "For each pair of partner classes of sizes x and y the ways are 2^x + 2^y − 1; multiply over classes, add the (0, 0) sardines one at a time, subtract the empty choice."
  - id: ac-abc298_d
    role: ladder
    card: inverse-prime
    rung: 1
    twist: Base case of the card
    summary: "Maintain a decimal string under 6·10^5 operations (append a digit, delete the first digit, print the value modulo 998244353)."
    hints:
      - "Appending is v = 10v + x. What must be subtracted when the first digit d is deleted?"
      - "d · 10^(L − 1), where L is the current length. Keep 10^(L − 1) modulo the prime as the length changes."
      - "On append multiply the power by 10; on delete multiply it by the inverse of 10 (Theorem 2.2.3), or recompute it with fast power."
  - id: ac-abc152_e
    role: ladder
    card: inverse-prime
    rung: 2
    twist: The common value is an LCM too large to store; divide it modulo a prime instead.
    summary: "Choose positive B_i with all A_i·B_i equal (N ≤ 10^4, A_i ≤ 10^6) and the smallest sum of B_i; print the sum modulo 10^9 + 7."
    hints:
      - The smallest common value of A_i·B_i is the LCM of all A_i. How large can it be?
      - "Far too large, so keep its factorisation (largest exponent per prime, Theorem 2.1.3) and its value modulo 10^9 + 7."
      - "Then B_i = L / A_i becomes L · A_i^(−1) modulo the prime (Theorem 2.2.4); sum them."
  - id: cf-1279D
    role: ladder
    card: inverse-prime
    rung: 3
    twist: A probability, written as a sum of fractions and printed modulo 998244353.
    summary: "A bot picks a random kid, a random item from that kid's wish list, and a random kid to receive it; print the probability that the receiver wants the item, modulo 998244353."
    hints:
      - Write the probability as a sum over the first kid and the item they pick.
      - "It is Σ over kids x, items y in x's list of (1/n)·(1/k_x)·(cnt[y]/n), with cnt[y] the number of kids wanting y."
      - "Count cnt first; then add the terms as residues, using the inverses of n and of each k_x (Theorem 2.2.4)."
  - id: lc-fancy-sequence
    role: ladder
    card: inverse-prime
    rung: 4
    twist: Undo a global multiplication for values appended later.
    summary: "Support append, add to all, multiply all, and read one value modulo 10^9 + 7, with up to 10^5 operations."
    hints:
      - Updating every element on each addAll or multAll is too slow. Can one global map x → m·x + a describe all updates?
      - "An element appended now must come out as its value after the current map; store the x with m·x + a = val."
      - "Store (val − a)·m^(−1) modulo the prime; getIndex returns m·stored + a. m is never a multiple of the prime, so the inverse exists."
  - id: cses-1712
    role: ladder
    card: exponent-reduction
    rung: 1
    twist: Base case of the card
    summary: "For n ≤ 10^5 triples with a, b, c ≤ 10^9, print a^(b^c) modulo 10^9 + 7 (with 0^0 = 1)."
    hints:
      - "b^c cannot be computed. By Fermat, what does the exponent matter modulo?"
      - "Reduce b^c modulo p − 1 = 10^9 + 6 with fast power (Theorem 2.2.5); then raise a to it."
      - "Handle a = 0 separately: the answer is 1 only when b^c = 0, that is b = 0 and c > 0."
  - id: lc-super-pow
    role: ladder
    card: exponent-reduction
    rung: 2
    twist: The modulus 1337 is not prime, so the exponent is consumed digit by digit instead of reduced.
    summary: "Compute a^b mod 1337, where b has up to 2000 decimal digits."
    hints:
      - "1337 = 7·191 is not prime, so reducing b modulo 1336 is not justified. How can the digits of b be used directly?"
      - "a^(10e + d) = (a^e)^10 · a^d, so process the digits from left to right."
      - "Keep r = a^(prefix of b) mod 1337: for each digit d, r = r^10 · a^d mod 1337, each power by fast power."
  - id: cf-615D
    role: ladder
    card: exponent-reduction
    rung: 3
    twist: The product of all divisors needs counts in the exponent, kept modulo p − 1 without dividing.
    summary: "Given the m ≤ 2·10^5 prime factors of n (primes ≤ 2·10^5, with repetition), print the product of all divisors of n modulo 10^9 + 7."
    hints:
      - "Each prime p with exponent e contributes p to the power (0 + 1 + … + e) times the number of divisors of the other primes. Why?"
      - "That count is a product of (e_q + 1) over the other primes, which can be huge: keep it modulo p − 1 (Theorem 2.2.5)."
      - "p − 1 is not prime, so do not divide by (e + 1); use prefix and suffix products of (e_q + 1) modulo 10^9 + 6 instead."
  - id: cf-185A
    role: drill
    summary: "After n ≤ 10^18 years of a triangle plant that splits each triangle into four, how many triangles point upwards, modulo 10^9 + 7?"
  - id: ac-arc176_b
    role: drill
    summary: "The last digit of 2^N mod (2^M − 2^K) for N, M, K up to 10^18 (2·10^5 tests)."
  - id: lc-double-modular-exponentiation
    role: drill
    summary: "For up to 100 rows (a, b, c, m) with values ≤ 1000, find the rows with ((a^b mod 10)^c) mod m equal to a target."
  - id: lc-smallest-integer-divisible-by-k
    role: drill
    summary: "The length of the smallest number made only of 1s that is divisible by k ≤ 10^5, or −1."
  - id: ac-arc107_a
    role: drill
    summary: "The sum of a·b·c over 1 ≤ a ≤ A, 1 ≤ b ≤ B, 1 ≤ c ≤ C (each up to 10^9), modulo 998244353."
  - id: ac-arc120_b
    role: drill
    summary: "Paint the empty cells of an H × W grid (≤ 500) red or blue so that every right/down path meets the same number of red cells; count the ways modulo 998244353."
  - id: lc-number-of-subsequences-that-satisfy-the-given-sum-condition
    role: drill
    summary: "Count the non-empty subsequences (n ≤ 10^5) whose minimum plus maximum is at most a target, modulo 10^9 + 7."
  - id: cf-1294C
    role: drill
    summary: "Write n ≤ 10^9 as a product of three distinct integers, each at least 2, or report that it is impossible (100 tests)."
  - id: lc-count-collisions-of-monkeys-on-a-polygon
    role: lookalike
    summary: "Each of n ≤ 10^9 monkeys on a polygon moves to a neighbouring vertex; count the ways with at least one collision, modulo 10^9 + 7."
  - id: cf-913A
    role: lookalike
    summary: "Print m mod 2^n for n, m ≤ 10^8."
  - id: ac-abc293_e
    role: lookalike
    summary: "The sum A^0 + A^1 + … + A^(X−1) modulo M, with A, M ≤ 10^9 and X ≤ 10^12."
  - id: cf-963A
    role: lookalike
    summary: "A sum of terms ±a^(n−i)·b^i for i = 0..n (n ≤ 10^9), with signs repeating with period k ≤ 10^5, modulo 10^9 + 9."
drill:
  - problem: cf-185A
    answer_card: fast-power
    answer_topic: "2.2"
    property: "The count satisfies up' = 3·up + down with up + down = 4^n, which gives 2^(n−1)·(2^n + 1); with n up to 10^18, both powers need fast exponentiation modulo the prime."
    why_others_fail: "Simulating n years is impossible; the closed formula reduces it to two powers."
  - problem: ac-arc176_b
    answer_card: fast-power
    answer_topic: "2.2"
    property: "Modulo 2^M − 2^K the powers of 2 repeat with period M − K from 2^K on, so N can be reduced to below M; the last digit of 2^N' is then 2^N' mod 10, a power with an exponent up to 10^18."
    why_others_fail: "The modulus is not prime and not even fixed, so Fermat does not apply; the reduction comes from 2^M ≡ 2^K."
  - problem: lc-double-modular-exponentiation
    answer_card: mod-arithmetic-basic
    answer_topic: "0.4"
    property: "All exponents are at most 1000, so multiplying step by step with a reduction after each product is fast enough."
    why_others_fail: "No exponent is large: binary exponentiation is not needed (it also works, but the card's property does not hold)."
  - problem: lc-smallest-integer-divisible-by-k
    answer_card: mod-arithmetic-basic
    answer_topic: "0.4"
    property: "Only the remainder of 11…1 modulo k matters: r = (10r + 1) mod k, and within k steps the remainders repeat, so either 0 appears or never does."
    why_others_fail: "There is no power to compute and no division; the remainders are tracked one digit at a time."
  - problem: ac-arc107_a
    answer_card: mod-arithmetic-basic
    answer_topic: "0.4"
    property: "The sum factors into three triangular numbers A(A+1)/2, each below 10^18, so it can be halved exactly before reducing modulo the prime."
    why_others_fail: "Dividing by 2 modulo the prime would also work, but halving the exact value first needs no inverse at all."
  - problem: ac-arc120_b
    answer_card: grid-processing
    answer_topic: "0.3"
    property: "The condition holds exactly when every anti-diagonal is one colour; scan the diagonals and multiply by 2 for each empty one."
    why_others_fail: "The modulus only reduces a product of 2s; the work is the grid argument, not modular arithmetic."
  - problem: lc-number-of-subsequences-that-satisfy-the-given-sum-condition
    answer_card: opposite-ends
    answer_topic: "1.3"
    property: "Sort; for each minimum a[i], two pointers find the largest j with a[i] + a[j] ≤ target, and the elements in between are free: 2^(j−i) subsets from a precomputed table."
    why_others_fail: "The powers of 2 have exponents below n, so a table built by doubling is enough; the decision is the two-pointer scan."
  - problem: cf-1294C
    answer_card: trial-division
    answer_topic: "2.1"
    property: "One number up to 10^9: take its smallest divisor a, then the smallest divisor b of n/a above a, by trial division up to the square root."
    why_others_fail: "Nothing is asked modulo anything; it is a factorisation question about a single number."
lookalike_pairs:
  - a: lc-count-collisions-of-monkeys-on-a-polygon
    b: cf-913A
    a_tool: "fast-power (2.2): 2^n − 2 modulo 10^9 + 7 with n up to 10^9"
    b_tool: "overflow-64bit (0.1): the answer is m itself once 2^n > m"
    flipping_difference: "Both involve 2^n for a huge n and a remainder. In A the power is the value and the modulus is a fixed prime, so the power is computed by squaring. In B the power is the modulus: once it exceeds m (n ≥ 27), m mod 2^n is m, and computing 2^n would only overflow."
  - a: ac-abc293_e
    b: cf-963A
    a_tool: "fast-power (2.2): split the geometric sum in halves recursively, because M is arbitrary"
    b_tool: "inverse-prime (2.2): (q^m − 1)/(q − 1) with the inverse of q − 1 modulo the prime"
    flipping_difference: "Both are geometric sums modulo a number. In A the modulus M is any integer up to 10^9, so q − 1 may have no inverse and the sum is built by doubling (S(2k) = S(k)·(1 + A^k)). In B the modulus 10^9 + 9 is prime, so the closed formula with an inverse works, except when the ratio is 1 modulo the prime, which needs its own case."
