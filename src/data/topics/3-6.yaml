# Topic 3.6 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.6"
cards:
  - id: merge-split
    name: Best split point of a segment
    decisive_property: Some last (or first) event of a solution on [l, r] splits it into two contiguous
      parts that never interact (the last merge of neighbours, the first cut, the last balloon, the root
      of a tree), and its cost depends only on l, r and the split point; then best[l][r] is the best over
      k of the two parts plus that cost.
    from_theorem: Theorem 3.6.2
    how_to_test: Name the event that splits the segment; check that the two parts are independent and
      that the event's cost does not depend on how the parts were built; check n³ fits (n ≤ about 500).
    weak_signals:
      - Merge neighbouring piles, each merge costing the total size
      - 'Cut a stick, bracket an expression, triangulate a polygon: the order of the operations matters'
      - n up to 100–500 and an O(n³) budget
    kill_signals:
      - 'Any two items may be merged, not only neighbours: the order is free, and a greedy with a heap
        works (Huffman)'
      - 'n up to 10^5: interval DP is too slow; look for a greedy or a formula'
    lookalikes:
      - description: Merge n ropes, any two at a time, each merge costing their total length
        needs: heap-extract (0.6)
        flipping_difference: Without the neighbour rule, merging the two smallest ropes first is optimal
          (Huffman), O(n log n) with a heap; with neighbours only, the greedy fails and the split-point
          table is needed.
    complexity: O(n³) time, O(n²) memory.
  - id: take-from-ends
    name: Taking from the ends
    decisive_property: Every step removes an item from the left or the right end (a game or a process),
      so what remains is always one segment [l, r] and the state needs nothing else; for a two-player
      game, store the score difference of the player to move.
    from_theorem: Theorem 3.6.3
    how_to_test: Check that only ends are removed; check whether anything besides the segment matters
      (whose turn follows from the length; a step count follows from l and the length); for games, check
      that the totals add up to a fixed sum.
    weak_signals:
      - Two players alternately take the first or last element; both play optimally
      - Remove elements from either end; the i-th removal is weighted by i or by a multiplier
      - n up to 1000–5000
    kill_signals:
      - 'Only one player, and exactly k items are taken from the ends: the rest is a fixed window in the
        middle (1.3)'
      - 'Items can be taken from anywhere: sorting or a greedy, not a segment'
    lookalikes:
      - description: Take exactly k cards in total from either end of a row to maximise their sum (no
          opponent)
        needs: fixed-window (1.3)
        flipping_difference: Whatever the order, the cards not taken form one window of length n − k,
          so minimising that window's sum answers it in O(n); the segment table is needed when the order
          of removals matters (an opponent, weights by turn).
    complexity: O(n²) time; O(n) memory with one row per length.
  - id: palindrome-segment
    name: Palindromes inside segments
    decisive_property: The question is about palindromes inside the string (the longest palindromic subsequence,
      fewest insertions or deletions, which substrings are palindromes), and the answer for [l, r] depends
      only on whether s_l = s_r and the answers for [l + 1, r − 1], [l + 1, r] and [l, r − 1].
    from_theorem: Theorem 3.6.4
    how_to_test: Write the case s_l = s_r (both ends used) and the case s_l ≠ s_r (drop one end); check
      n² fits (n ≤ about 5000).
    weak_signals:
      - Longest palindromic subsequence; fewest characters to insert or delete to get a palindrome
      - Cut a string into the fewest palindromes, or into exactly k palindromes
      - Count palindromic substrings, or answer many "is s[l..r] a palindrome" queries
    kill_signals:
      - 'The palindrome must be contiguous and only the longest one is asked: expanding around each centre
        is simpler (O(n²), no table)'
      - 'The letters may be rearranged: only the counts of each letter matter (0.6)'
    lookalikes:
      - description: The longest palindromic substring (contiguous) of a string of length 1000
        needs: nested-loops (0.5)
        flipping_difference: A contiguous palindrome is determined by its centre and radius, so expanding
          from each of the 2n − 1 centres finds it in O(n²) without any table; a subsequence may skip
          letters, which needs the segment table.
    complexity: O(n²) time and memory (or two rows by length).
  - id: first-element-match
    name: The first element and its partner
    decisive_property: Elements are removed in groups that become contiguous only after the elements between
      them are removed (equal letters joined after the middle disappears, matching brackets), so the first
      element of [l, r] either goes alone or with some later partner k; fixing k splits the rest into
      the inside (l, k) and the outside [k, r], which do not interact.
    from_theorem: Theorem 3.6.5
    how_to_test: 'Ask what happens to s_l: alone, or together with which k; check that the inside of (l,
      k) must be finished first and that joining s_l to k''s group costs nothing extra (or add an index
      for what it costs).'
    weak_signals:
      - Delete blocks of equal letters; letters join after the middle is deleted; fewest operations
      - A printer that paints ranges, each new range over the old; fewest turns
      - Remove pairs of matching elements, possibly after removing what is between them
    kill_signals:
      - 'Only adjacent equal pairs are removed and the order does not change the result: a stack (0.6)'
      - 'The cost of a group depends on its size (points = size²): the state needs one more index, the
        number of equal elements attached'
    lookalikes:
      - description: Repeatedly delete two adjacent equal letters until none remain; print the final string
        needs: stack-queue (0.6)
        flipping_difference: Every order of deletions leaves the same string, so one pass with a stack
          simulates it; with a choice of which blocks to delete and a count to minimise, the segment table
          is needed.
    complexity: O(n³) time, O(n²) memory.
problems:
  - id: ac-dp_n
    role: worked_example
    summary: Combine N ≤ 400 slimes in a row, two neighbours at a time, each combination costing the new
      size; the least total cost.
  - id: lc-palindrome-partitioning-ii
    role: worked_example
    summary: Cut a string (length ≤ 2000) into palindromes with the fewest cuts.
  - id: lc-minimum-cost-tree-from-leaf-values
    role: ladder
    card: merge-split
    rung: 1
    twist: Base case of the card
    summary: Build a binary tree whose leaves, read left to right, are a given array (n ≤ 40) and where
      each inner node is the product of the largest leaf in its left and in its right subtree; minimise
      the sum of the inner nodes.
    hints:
      - The root splits the leaves into two groups. What do the groups look like?
      - A left block [l, k] and a right block [k + 1, r] of the array, built independently; the root costs
        max(l..k) · max(k + 1..r).
      - cost[l][r] = min over k of cost[l][k] + cost[k + 1][r] + maxLeft · maxRight (Theorem 3.6.2); precompute
        the range maxima.
  - id: lc-minimum-score-triangulation-of-polygon
    role: ladder
    card: merge-split
    rung: 2
    twist: The split point is a vertex shared by both parts.
    summary: Triangulate a convex polygon with n ≤ 50 vertices carrying values; a triangle scores the
      product of its three values. Minimise the total score.
    hints:
      - The edge between vertices i and j belongs to exactly one triangle of the part of the polygon between
        them. Which?
      - Triangle (i, k, j) for some k between them; it splits the part into the polygons i..k and k..j,
        which are triangulated independently.
      - best[i][j] = min over i < k < j of best[i][k] + best[k][j] + v_i·v_k·v_j, with best = 0 when j
        = i + 1; answer best[0][n − 1].
  - id: lc-minimum-cost-to-cut-a-stick
    role: ladder
    card: merge-split
    rung: 3
    twist: 'Cutting instead of merging: the first cut splits the stick, and the segments are between cut
      positions.'
    summary: Make all given cuts (up to 100) in a stick of length n; each cut costs the length of the
      piece being cut. Minimise the total cost.
    hints:
      - Which event splits the problem into independent pieces?
      - 'The first cut made in a piece: after it, the two sides are cut independently, and it costs the
        piece''s length whatever happens later.'
      - Sort the cuts and add 0 and n at the ends; cost[i][j] = (c_j − c_i) + min over i < k < j of cost[i][k]
        + cost[k][j], with cost = 0 when no cut lies inside.
  - id: lc-burst-balloons
    role: ladder
    card: merge-split
    rung: 4
    twist: The last event inside the segment, not the first, keeps the parts independent.
    summary: Burst all balloons (n ≤ 300) with values; bursting one earns the product of its value and
      its current neighbours' values (1 beyond the ends). Maximise the total.
    hints:
      - If you choose the first balloon to burst, its neighbours change later. What if you choose the
        last one in an open interval (l, r)?
      - When k is the last balloon burst between l and r, its neighbours at that moment are exactly l
        and r, and the balloons on each side of k never meet each other.
      - Pad with 1 at both ends; best[l][r] = max over l < k < r of best[l][k] + best[k][r] + v_l·v_k·v_r
        over open intervals, filled by length.
  - id: cf-1312E
    role: ladder
    card: merge-split
    rung: 5
    twist: The interval table answers "can [l, r] shrink to one value?", and a second table over prefixes
      uses it.
    summary: Repeatedly replace two equal neighbours v, v by one element v + 1 in an array (n ≤ 500);
      the smallest possible final length.
    hints:
      - When can a whole segment [l, r] become one element, and what value would it have?
      - Its last step joins two parts [l, k] and [k + 1, r] that each became the same value v − 1; the
        value is then determined by the segment.
      - val[l][r] = v + 1 if val[l][k] = val[k + 1][r] = v for some k (else none); then minLen[i] = min
        over j with val[j][i] defined of minLen[j − 1] + 1.
  - id: cf-1025D
    role: ladder
    card: merge-split
    rung: 6
    twist: The root of a subtree is the split point, and the state remembers which side its parent is
      on.
    summary: Given n ≤ 700 sorted distinct numbers, decide whether they can form a binary search tree
      in which every edge joins two numbers with a common divisor greater than 1.
    hints:
      - In a binary search tree, the keys of a subtree form a segment of the sorted list. Where is its
        parent?
      - 'Just outside the segment: at position l − 1 or r + 1. A segment is fine if some root k inside
        has gcd > 1 with that parent and both sides [l, k − 1] and [k + 1, r] are fine with parent k.'
      - ok[l][r][side] over segments, trying every root k; precompute a gcd table. O(n³) with small constants;
        the answer is ok for the whole list with no parent.
  - id: ac-dp_l
    role: ladder
    card: take-from-ends
    rung: 1
    twist: Base case of the card
    summary: Two players alternately remove the first or last element of a sequence (N ≤ 3000); the first
      maximises and the second minimises X − Y, the difference of their totals. Print X − Y.
    hints:
      - After some moves, what is left, and what number describes the game from there?
      - A segment [l, r]; the score difference for the player to move (Theorem 3.6.3).
      - diff[l][r] = max(a_l − diff[l + 1][r], a_r − diff[l][r − 1]); the answer is diff for the whole
        row. Use long long.
  - id: cses-1097
    role: ladder
    card: take-from-ends
    rung: 2
    twist: The first player's total instead of the difference.
    summary: Two players alternately take the first or last number of a list (n ≤ 5000); both maximise
      their own totals. Print the first player's total.
    hints:
      - How do the first player's total, the second player's total, the difference and the sum relate?
      - They add up to the sum S and differ by D, so the first total is (S + D) / 2.
      - Compute D as in Deque with one array per length (n² long longs would be 200 MB); print (S + D)
        / 2.
  - id: lc-stone-game-vii
    role: ladder
    card: take-from-ends
    rung: 3
    twist: A move scores the sum of what remains, not the item taken.
    summary: Players alternately remove the leftmost or rightmost stone (n ≤ 1000) and score the sum of
      the remaining stones; the first maximises, the second minimises the difference. Return the difference.
    hints:
      - What does removing a_l score, and what is left for the opponent?
      - It scores sum(l + 1..r) and leaves the segment [l + 1, r] to the opponent.
      - diff[l][r] = max(sum(l + 1, r) − diff[l + 1][r], sum(l, r − 1) − diff[l][r − 1]) with prefix sums.
  - id: lc-maximum-score-from-performing-multiplication-operations
    role: ladder
    card: take-from-ends
    rung: 4
    twist: 'One player, weights by turn, and n up to 10^5 but only m ≤ 300 removals: describe the segment
      by (operations done, how many from the left).'
    summary: 'Perform m ≤ 300 operations on an array of n ≤ 10^5: the i-th takes the first or last element
      x, scores multipliers[i] · x, and removes it. Maximise the score.'
    hints:
      - A segment table over n = 10^5 is too big. After i operations, what determines the remaining segment?
      - 'How many of the i elements came from the left: then the left end and the right end are both known.'
      - dp[i][left] over 0 ≤ left ≤ i ≤ m; take nums[left] or nums[n − 1 − (i − left)]. O(m²).
  - id: cf-1336C
    role: ladder
    card: take-from-ends
    rung: 5
    twist: 'Adding to both ends instead of removing: the filled positions are a segment, and the count
      is modulo a prime.'
    summary: Take the letters of S (|S| ≤ 3000) in order and put each at the front or the back of a string
      A; count the operation sequences after which (at some point) A starts with T, modulo 998244353.
    hints:
      - After i letters have been placed, which positions of the final string do they occupy?
      - 'A contiguous block [l, r] of length i: each letter goes just before or just after the block.'
      - ways[l][r] = ways to fill positions l..r with the first r − l + 1 letters so that they agree with
        T where T has a letter (positions beyond |T| match anything); extend by placing the next letter
        at l − 1 or r + 1; sum ways[0][r] for r ≥ |T| − 1.
  - id: lc-palindromic-substrings
    role: ladder
    card: palindrome-segment
    rung: 1
    twist: Base case of the card
    summary: Count the palindromic substrings of a string of length ≤ 1000 (different positions count
      separately).
    hints:
      - When is s[l..r] a palindrome, in terms of a shorter substring?
      - When s_l = s_r and s[l + 1..r − 1] is a palindrome (or is empty or one letter).
      - pal[l][r] by increasing length (or l downwards); count the true entries.
  - id: lc-minimum-insertion-steps-to-make-a-string-palindrome
    role: ladder
    card: palindrome-segment
    rung: 2
    twist: The fewest insertions, not the longest palindrome.
    summary: The fewest characters to insert anywhere into a string (length ≤ 500) to make it a palindrome.
    hints:
      - Which letters of s can stay unpaired with an inserted letter?
      - 'Those of a palindromic subsequence: they pair with each other, and every other letter needs a
        new partner.'
      - Answer n − (longest palindromic subsequence) (Theorem 3.6.4); or ins[l][r] = ins[l + 1][r − 1]
        if the ends are equal, else 1 + min of the two shorter segments.
  - id: lc-maximize-palindrome-length-from-subsequences
    role: ladder
    card: palindrome-segment
    rung: 3
    twist: 'The palindrome must use both strings: its outermost pair has one end in each.'
    summary: Choose a non-empty subsequence of word1 and one of word2 (lengths ≤ 1000) and concatenate
      them; the longest palindrome you can get (0 if none).
    hints:
      - Work on s = word1 + word2. What must be true of the two outermost letters of the palindrome?
      - They are equal, the left one lies in word1 and the right one in word2; everything between is any
        palindromic subsequence of the inside.
      - Fill the palindromic-subsequence table P of s; answer the max of 2 + P[i + 1][j − 1] over i in
        word1, j in word2 with s_i = s_j.
  - id: cf-245H
    role: ladder
    card: palindrome-segment
    rung: 4
    twist: 'Up to 10^6 queries: a second table counts the palindromes inside every segment.'
    summary: Answer up to 10^6 queries "how many palindromic substrings does s[l..r] have" for a string
      of length ≤ 5000.
    hints:
      - With the table pal[l][r], how do you count the palindromes inside [l, r] from smaller segments?
      - 'Inclusion–exclusion: those inside [l + 1, r], plus those inside [l, r − 1], minus those counted
        twice inside [l + 1, r − 1], plus [l, r] itself.'
      - cnt[l][r] = cnt[l + 1][r] + cnt[l][r − 1] − cnt[l + 1][r − 1] + pal[l][r]; answer each query in
        O(1). Use fast input and output; 25·10^6 ints fit.
  - id: cf-1132F
    role: ladder
    card: first-element-match
    rung: 1
    twist: Base case of the card
    summary: Delete a string (length ≤ 500) by repeatedly removing a contiguous block of equal letters;
      the fewest operations.
    hints:
      - What happens to the first letter s_l?
      - Either it is removed on its own, or together with some later equal letter s_k, after everything
        between them is gone (Theorem 3.6.5).
      - C[l][r] = min(1 + C[l + 1][r], min over k with s_k = s_l of C[l + 1][k − 1] + C[k][r]); O(n³).
  - id: lc-strange-printer
    role: ladder
    card: first-element-match
    rung: 2
    twist: 'Printing over earlier prints instead of deleting: the same pairing of the first letter.'
    summary: A printer prints a run of one letter over any range in one turn, covering what was there;
      the fewest turns to print a given string (length ≤ 100).
    hints:
      - The first letter must be printed by some turn. What else might that turn usefully print?
      - 'Later letters equal to it: s_l can share its turn with an equal s_k, and everything between them
        is printed on top later, independently.'
      - turns[l][r] = min(1 + turns[l + 1][r], min over k with s_k = s_l of turns[l + 1][k − 1] + turns[k][r]),
        the same recurrence as Clear the String.
  - id: lc-remove-boxes
    role: ladder
    card: first-element-match
    rung: 3
    twist: The score of a group depends on its size, so the state counts how many equal boxes are attached.
    summary: Remove boxes (n ≤ 100, coloured) in groups of contiguous equal colours; a group of k boxes
      scores k². Maximise the total.
    hints:
      - If the first box waits to be removed together with a later box of its colour, how much does that
        group score?
      - It depends on how many boxes end up in the group, so the state must know how many equal boxes
        are already waiting on the left.
      - 'best[l][r][t] with t equal boxes attached to box l: remove them now ((t + 1)² + best[l + 1][r][0])
        or join a later equal box m (best[l + 1][m − 1][0] + best[m][r][t + 1]). O(n⁴) with small constants.'
  - id: ac-abc217_f
    role: ladder
    card: first-element-match
    rung: 4
    twist: 'Count the orders, not the minimum: the two independent parts interleave, counted by a binomial
      coefficient.'
    summary: 2N ≤ 400 people stand in a row; a pair of neighbours who are friends can leave, closing the
      gap. Count the orders in which everyone leaves, modulo 998244353.
    hints:
      - The first person of a segment leaves together with someone. Who, and what must happen first?
      - With some friend k, after everyone between them has left; the people after k leave independently
        of those between.
      - 'ways[l][r] = Σ over friends k with an even inside of ways[l + 1][k − 1] · ways[k + 1][r] · C(pairs
        in [l, r], pairs in [l, k]): the pairs of [l, k] (ending with l–k) interleave with the pairs of
        [k + 1, r].'
  - id: lc-different-ways-to-add-parentheses
    role: drill
    summary: List every value an expression of numbers and +, −, * (length ≤ 20) can take under all ways
      of placing brackets.
  - id: lc-unique-binary-search-trees
    role: drill
    summary: Count the binary search trees with the keys 1..n (n ≤ 19).
  - id: lc-palindrome-partitioning-iii
    role: drill
    summary: Change the fewest letters of a string (length ≤ 100) so that it can be cut into exactly k
      palindromes.
  - id: lc-palindrome-partitioning-iv
    role: drill
    summary: Can a string (length ≤ 2000) be cut into exactly three non-empty palindromes?
  - id: cses-1744
    role: drill
    summary: Cut an a × b rectangle (a, b ≤ 500) into squares with the fewest cuts, each cut straight
      across one piece.
  - id: lc-minimum-operations-to-reduce-x-to-zero
    role: drill
    summary: Remove elements from either end of an array (n ≤ 10^5, values ≥ 1) so that the removed values
      add up to exactly x; the fewest removals, or −1.
  - id: lc-longest-palindrome-by-concatenating-two-letter-words
    role: drill
    summary: Choose two-letter words (up to 10^5) and concatenate them in any order to form the longest
      palindrome; its length.
  - id: lc-minimum-number-of-moves-to-make-palindrome
    role: drill
    summary: The fewest swaps of neighbouring letters that turn a string (length ≤ 2000, a palindrome
      is possible) into a palindrome.
  - id: lc-predict-the-winner
    role: lookalike
    summary: Players alternately take the first or last of up to 20 numbers; does player 1 end with at
      least as much as player 2?
  - id: lc-stone-game
    role: lookalike
    summary: An even number of piles (up to 500) with an odd total; players alternately take the first
      or last pile. Does the first player win?
  - id: lc-longest-palindromic-subsequence
    role: lookalike
    summary: The length of the longest palindromic subsequence of a string of length ≤ 1000.
  - id: lc-longest-palindromic-substring
    role: lookalike
    summary: The longest palindromic substring (contiguous) of a string of length ≤ 1000.
  - id: cf-1509C
    role: checkpoint
    card: take-from-ends
    summary: Order n ≤ 2000 runners with given speeds; after the i-th runner, the discrepancy is the largest
      minus the smallest speed so far. Minimise the sum of the discrepancies.
  - id: cf-607B
    role: checkpoint
    card: palindrome-segment
    summary: A row of n ≤ 500 coloured gems; each second, remove one contiguous palindromic block (the
      rest closes up). The fewest seconds to remove everything.
  - id: cf-149D
    role: checkpoint
    card: first-element-match
    summary: 'Colour the brackets of a correct bracket sequence (length ≤ 700): in each matched pair exactly
      one bracket is red or blue, and neighbouring coloured brackets differ. Count the colourings modulo
      10^9 + 7.'
  - id: lc-stone-game-v
    role: review
    card: merge-split
    review_set: 1
    summary: Alice splits a row of stones (n ≤ 500) into two non-empty parts; Bob throws away the part
      with the larger sum and Alice scores the other part's sum (on a tie she chooses); repeat until one
      stone is left. Maximise Alice's score.
  - id: lc-maximum-number-of-operations-with-the-same-score-ii
    role: review
    card: take-from-ends
    review_set: 1
    summary: Repeatedly delete the first two, the last two, or the first and last elements of an array
      (n ≤ 2000) so that every deletion has the same sum; the most deletions.
  - id: lc-maximum-number-of-non-overlapping-palindrome-substrings
    role: review
    card: palindrome-segment
    review_set: 1
    summary: Choose the most non-overlapping palindromic substrings of length at least k in a string of
      length ≤ 2000.
  - id: lc-scramble-string
    role: review
    card: merge-split
    review_set: 2
    summary: A string is scrambled by splitting it into two non-empty parts, possibly swapping them, and
      scrambling each part again; decide whether s2 is a scramble of s1 (lengths ≤ 30).
  - id: lc-guess-number-higher-or-lower-ii
    role: review
    card: merge-split
    review_set: 2
    summary: A number from 1 to n ≤ 200 is hidden; each wrong guess x costs x and tells you higher or
      lower. The least money that guarantees you find it.
  - id: lc-count-different-palindromic-subsequences
    role: review
    card: palindrome-segment
    review_set: 2
    summary: Count the different non-empty palindromic subsequences of a string over a–d (length ≤ 1000),
      modulo 10^9 + 7.
  - id: lc-the-score-of-students-solving-math-expression
    role: review
    card: merge-split
    review_set: 3
    summary: 'Grade answers to an expression of one-digit numbers with + and * (up to 15 operators): 5
      points for the true value, 2 for a value reachable by some other order of operations, 0 otherwise.'
  - id: lc-selling-pieces-of-wood
    role: review
    card: merge-split
    review_set: 3
    summary: Cut an m × n board (m, n ≤ 200) with straight cuts across whole pieces and sell pieces of
      the listed shapes at their prices; the most money.
  - id: lc-unique-binary-search-trees-ii
    role: review
    card: merge-split
    review_set: 3
    summary: List all binary search trees with the keys 1..n (n ≤ 8).
drill:
  - problem: lc-different-ways-to-add-parentheses
    answer_card: merge-split
    answer_topic: '3.6'
    property: The operator applied last splits the expression into a left and a right part that are evaluated
      independently; the values of a segment come from the values of its two parts, memoised by segment.
    why_others_fail: Evaluating left to right gives one value; listing bracketings without memoisation
      repeats the same segments many times.
  - problem: lc-unique-binary-search-trees
    answer_card: merge-split
    answer_topic: '3.6'
    property: 'The root k splits the keys into the ranges below and above it, which form independent subtrees:
      trees(range) = Σ over roots of trees(left) · trees(right), and only the length of a range matters.'
    why_others_fail: Listing the trees is far too many for n = 19; a product rule does not apply because
      the sizes of the two sides vary with the root.
  - problem: lc-palindrome-partitioning-iii
    answer_card: palindrome-segment
    answer_topic: '3.6'
    property: The cost of making s[l..r] a palindrome comes from s_l, s_r and the inside (one change per
      mismatched pair), an interval table; then a table over (prefix, pieces) picks the last piece.
    why_others_fail: Fixing letters greedily from the outside ignores where the cuts go; trying all cut
      sets is C(99, k − 1).
  - problem: lc-palindrome-partitioning-iv
    answer_card: palindrome-segment
    answer_topic: '3.6'
    property: With the table pal[l][r] built in O(n²), each choice of the two cut points is checked in
      O(1), O(n²) pairs in all.
    why_others_fail: Checking each piece directly is O(n) per pair, O(n³) = 8·10^9; taking the longest
      palindrome first can block the other two.
  - problem: cses-1744
    answer_card: merge-split
    answer_topic: '3.6'
    property: 'Each cut splits a piece into two smaller rectangles that are cut independently: moves[a][b]
      = 1 + min over all cut positions of the two parts, 0 for a square.'
    why_others_fail: 'Cutting off the largest square each time (as in Euclid''s algorithm) is not optimal:
      a 5 × 6 rectangle needs 4 cuts, the greedy uses 5. The table tries every cut.'
  - problem: lc-minimum-operations-to-reduce-x-to-zero
    answer_card: shrinkable-window
    answer_topic: '1.3'
    property: Whatever the order, the removed elements are a prefix and a suffix, so what stays is one
      window with sum total − x; with positive values the longest such window is found with a shrinkable
      window.
    why_others_fail: A segment table over 10^5 elements is 10^10 states; the order of removals does not
      matter here, only the total.
  - problem: lc-longest-palindrome-by-concatenating-two-letter-words
    answer_card: map-counting
    answer_topic: '0.6'
    property: 'The order is free, so count the words: each pair "xy" with "yx" adds 4 letters, each pair
      of "xx" adds 4, and one leftover "xx" may go in the middle.'
    why_others_fail: Palindrome tables need a fixed string; here the words can be arranged, so only their
      counts matter.
  - problem: lc-minimum-number-of-moves-to-make-palindrome
    answer_card: left-to-right-forced
    answer_topic: '1.5'
    property: The leftmost letter must end up paired with an equal letter at the right end; moving the
      nearest such letter from the right outwards is never worse, so the pairs are forced one by one (the
      single odd letter moves inwards).
    why_others_fail: An interval table over [l, r] does not capture the swaps, which change the string;
      trying all swap sequences is exponential.
lookalike_pairs:
  - a: lc-predict-the-winner
    b: lc-stone-game
    a_tool: 'take-from-ends (3.6): the score-difference table over segments'
    b_tool: 'a parity argument (0.4): the first player can take all even-position or all odd-position
      piles'
    flipping_difference: 'The same game. In B the number of piles is even, so the first player can force
      taking exactly the piles at even positions (or odd ones), and with an odd total one of these sets
      is larger: the answer is always yes. In A the count may be odd and ties count, so the game must
      be evaluated with the table.'
  - a: lc-longest-palindromic-subsequence
    b: lc-longest-palindromic-substring
    a_tool: 'palindrome-segment (3.6): the table P[l][r] over segments'
    b_tool: 'nested-loops (0.5): expand around each of the 2n − 1 centres'
    flipping_difference: 'Both ask for the longest palindrome inside s. A subsequence (A) may skip letters,
      so the best one for [l, r] depends on dropping either end: a table. A substring (B) is contiguous,
      determined by its centre and length, so growing it from every centre finds it in O(n²) with no table.'
self_test:
  - q: Fill the merging table for piles (4, 1, 2, 3). What is the answer, and which split does the last
      merge use?
    a: 19. The rows are 0 5 10 19 / 0 3 9 / 0 5 / 0; for [1, 4] the split k = 1 gives 0 + 9, k = 2 gives
      5 + 5, k = 3 gives 10 + 0, so k = 1 (piles 4 | 1, 2, 3) and the last merge costs the total 10.
  - q: Why does filling the table for l = 1, 2, …, n with r increasing inside give wrong answers?
    a: best[1][r] needs best[2][r], a segment with a larger left end, which this order has not computed
      yet (it still holds 0). Loop over the length outside, or over l downwards.
  - q: Players take from the ends of (3, 9, 1, 2). What is the score difference for the first player,
      what is the first player's total, and what does "take the larger end" give?
    a: 'D = 7, so the first total is (15 + 7) / 2 = 11 (take 2 first). The greedy takes 3, then the opponent
      takes 9: totals 5 and 10.'
  - q: What is the longest palindromic subsequence of "abcab", and how many letters must be inserted to
      make it a palindrome?
    a: 3 (for example "aba"); the other 2 letters each need an inserted partner, so 5 − 3 = 2 insertions.
  - q: How many operations clear "abaca" if one operation deletes a block of equal letters? Which partner
      does the first a choose in the recurrence?
    a: '3: delete b, delete c, then aaa. The first a pairs with the a at position 3: C[2][2] + C[3][5]
      = 1 + 2.'
  - q: In Burst Balloons, why choose the balloon burst last in an open interval (l, r), not the first?
    a: After the first burst the neighbours of the other balloons change, so the two sides are not independent.
      The last balloon k in (l, r) has neighbours l and r when it bursts, and the balloons on its two
      sides never become neighbours of each other.
  - q: For a string of length 1000, which tool finds the longest palindromic substring, and which the
      longest palindromic subsequence?
    a: 'Substring: expand around each centre, O(n²), no table. Subsequence: the segment table of Theorem
      3.6.4, also O(n²), because letters may be skipped.'
checkpoint:
  time_limit_minutes: 120
  problems:
    - cf-1509C
    - cf-607B
    - cf-149D
decision_map:
  - weak_signal: Merge neighbours, cut, bracket or triangulate; the order of operations changes the cost;
      n ≤ 500
    choose: merge-split
    when: Some last (or first) event splits the segment into independent parts and costs a function of
      l, r and the split point (Theorem 3.6.2).
    over:
      - card: heap-extract
        because: If any two items may be merged, not only neighbours, the two smallest first is optimal
          (Huffman), with a heap.
      - card: extreme-first
        because: Greedy "cheapest neighbouring pair first" fails, as (2, 2, 1, 2) shows.
  - weak_signal: Take from the left or the right end; two players play optimally
    choose: take-from-ends
    when: Only ends are removed, so the rest is a segment; store the score difference of the player to
      move (Theorem 3.6.3).
    over:
      - card: fixed-window
        because: With one player and exactly k removals that are all counted the same, the remaining part
          is one window of fixed length.
      - card: extreme-first
        because: Taking the larger end each time fails, as (3, 9, 1, 2) shows.
  - weak_signal: 'Palindromes: longest, fewest insertions, cut into palindromes, count them'
    choose: palindrome-segment
    when: The answer for [l, r] depends on s_l = s_r and the inner segments (Theorem 3.6.4); for cuts,
      the palindrome table feeds a table over prefixes.
    over:
      - card: nested-loops
        because: The longest palindromic substring alone is found by expanding around each centre.
      - card: lcs
        because: The longest palindromic subsequence is also the LCS with the reverse; the segment table
          is the direct form and extends to partitions.
  - weak_signal: Remove blocks or pairs; the parts left and right of a removed block join and can be removed
      together later
    choose: first-element-match
    when: The first element goes alone or with a later partner k after (l, k) is cleared; the inside and
      the outside do not interact (Theorem 3.6.5).
    over:
      - card: stack-queue
        because: If only adjacent equal pairs are removed and the order does not matter, one pass with
          a stack gives the result.
glossary_added: ["interval DP", "split point", "palindromic subsequence", "score difference"]
