# Topic 3.2 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '3.2'
uses:
- topic: '0.2'
  what: 'Complexity: states times transitions against the budget'
- topic: '0.4'
  what: Remainders and divisibility
- topic: '0.5'
  what: Brute force and recursion over choices, which the table replaces
- topic: '0.6'
  what: Sets and maps, used for dictionary look-ups and caches
- topic: '1.1'
  what: Sorting, used by the interval problems
- topic: '1.2'
  what: Prefix sums and prefix extremes
- topic: '1.3'
  what: Two pointers over sequences
- topic: '1.4'
  what: Binary search, used to find the last compatible item
- topic: '1.5'
  what: Greedy choices and exchange arguments
- topic: '1.7'
  what: Bits of a number
- topic: '2.2'
  what: 'Modular arithmetic: counts printed modulo a prime'
- topic: '2.3'
  what: 'Combinatorics: the sum rule for counting, and counting by formulas'
- topic: '2.4'
  what: Expected values, which some problems turn into a table
- topic: '3.1'
  what: 'Backtracking: the recursion over choices that the table replaces (Theorem 3.1.2, canonical order)'
theorems:
- id: 3.2.1
  title: Optimal substructure
  plain_words: If what you may do next, and what it costs, depends only on the current state and not on
    how you got there, then the best value at a state is the best over the last step of the best value
    at the previous state plus the step's cost. So each state needs to be solved only once.
  code: 3.2/thm-1
- id: 3.2.2
  title: Counting by the last choice
  plain_words: If each object is built by exactly one sequence of choices, the number of objects at a
    state is the sum, over the last choice, of the number at the state before it. Different last choices
    give different objects, so nothing is counted twice.
  code: 3.2/thm-2
- id: 3.2.3
  title: Tabulation
  plain_words: If the states can be numbered so that every step goes from a smaller to a larger number,
    fill the table in that order, and each state is computed from states that are already correct. The
    time is the number of states and steps, not the number of solutions.
  code: 3.2/thm-3
- id: 3.2.4
  title: Memoisation
  plain_words: Keep the plain recursion but store each answer the first time it is computed. If no state
    depends on itself, every state is then computed once, and only the states that are really reached
    cost anything.
  code: 3.2/thm-4
- id: 3.2.5
  title: Adding a small fact to the state
  plain_words: When the future depends on the position and one more small fact, such as the last activity
    or a parity, put that fact in the state. The table then has one row for each value of the fact, and
    the same recurrence applies.
  code: 3.2/thm-5
- id: 3.2.6
  title: Reconstruction
  plain_words: While filling the table, remember for each state which step gave its best value. Starting
    at the best final state and following those steps backwards lists an optimal solution, not only its
    value.
  code: 3.2/thm-6
cards:
- id: linear-state
  name: One index per state
  decisive_property: Solutions are built left to right, and the allowed next choices and their costs depend
    only on the current position, not on how it was reached; so the best value (or the number of ways)
    at position i is computed from a few earlier positions, each once.
  from_theorem: 3.2.1
  how_to_test: Take two different ways of reaching position i and check that every continuation allowed
    after one is allowed after the other, with the same cost. For counts, also check that each object
    is built by exactly one sequence of choices (Theorem 3.2.2).
  constraint_shapes:
  - 'n up to 10^5 stones with jumps up to k = 100: trying every jump sequence is exponential, while one
    value per stone is n · k = 10^7 steps.'
  weak_signals:
  - form: Minimum cost or number of ways to reach position n with steps or jumps of a few kinds
    shape: n up to 10^5 or 10^6
  - form: Choose some elements of an array with a rule about neighbours (no two adjacent), maximise the
      total
    shape: n up to 2·10^5
  - form: Split a string or array into pieces from a dictionary or with a cost per piece
    shape: Length up to 10^5
  kill_signals:
  - 'The next choice depends on more than the position: with points 10 1 1 on two days and no activity
    twice in a row, the best is 11, but the day alone as the state gives 10 + 10 = 20.'
  - 'A rule counts the choices: choosing exactly 2 non-adjacent elements of 5 5 -9 gives -4, but a position-only
    table of any number of elements gives 5.'
  in_action:
    statement: A frog on stone 1 of n stones may jump to any of the next k stones, paying the height difference;
      print the smallest total cost to reach stone n.
    constraints: n ≤ 10^5, k ≤ 100.
    budget: Trying every jump sequence is exponential. One value per stone with k transitions each is
      10^7 steps.
    candidates:
    - tool: Recursion over every jump sequence
      verdict: rejected
      because: The number of sequences is exponential in n.
    - tool: One table value per stone
      verdict: chosen
      because: The cost of a jump depends only on the two stones, so the best cost to reach a stone is
        the best over the previous stone of its cost plus the jump.
    property_check: Two ways of reaching stone i allow the same jumps with the same costs, so the stone
      is a sufficient state (Theorem 3.2.1).
    decision: best[0] = 0; best[i] = the minimum over j in [i − k, i − 1] of best[j] + |h_i − h_j|; print
      best[n − 1].
  examples:
    positive:
    - inline:
        input: The frog on the heights 10 30 40 20 with jumps of 1 or 2 stones
        answer: '30'
        why: best = 0, 20, 30, 30; the path is stones 1, 2, 4 with cost 20 + 10.
    - worked_example: cses-1140
      why: After sorting by end day, the best pay using the first i projects is the larger of skipping
        project i and taking it after the projects that end before it starts.
    negative:
    - inline:
        input: Two days with points 10 1 1 on both days, never the same activity twice, with the day alone
          as the state
        answer: '11'
        method_gives: '20'
        why: The best of each day alone is the same activity twice; the future depends on the last activity
          as well as the day.
      correct_tool:
        topic: '3.2'
        card: extra-small-state
    - inline:
        input: Choose exactly 2 non-adjacent elements of 5 5 -9 with the best sum, with the position alone
          as the state
        answer: '-4'
        method_gives: '5'
        why: A table of the best sum over any number of elements misses that exactly two must be chosen;
          the count of chosen elements is a second index.
      correct_tool:
        topic: '3.2'
        card: two-index
  lookalikes:
  - description: The fewest jumps to reach the end when from position i you may jump anywhere up to a[i]
      ahead
    tool:
      topic: '1.5'
      card: left-to-right-forced
    flipping_difference: Reachable positions form a prefix that only grows, so a greedy scan of the farthest
      reach answers it in O(n); the table works but is not needed.
  complexity: O(n × transitions per position).
- id: extra-small-state
  name: Index plus a small extra fact
  decisive_property: The allowed choices or their costs at position i depend on the past only through
    i and one more value from a small set (the last action, a parity, a count up to k, a flag); with that
    value added, two partial solutions with the same state have the same future.
  from_theorem: 3.2.5
  how_to_test: Write down what the rule for the next choice reads about the past. If it is more than the
    position, find the smallest extra value that captures it and count the states n·|X|.
  constraint_shapes:
  - 'n up to 10^5 days and m = 10 activities: the states are n · m = 10^6, each with m transitions, 10^7
    steps.'
  weak_signals:
  - form: Not the same action on two consecutive days; alternate between two kinds
    shape: n up to 10^5 and a few kinds
  - form: Buy and sell with a cooldown, a fee or at most k transactions
    shape: n up to 10^5 and k up to 100
  - form: A switch, a mode or a health state that changes the cost of the next step
    shape: A few modes
  kill_signals:
  - 'The extra fact is a capacity or a sum up to 10^9: with 3 items and capacity 10^9 the table has 4·10^9
    states, while the 8 subsets give the best value 8 directly.'
  - 'The extra fact is a whole set of past choices: its 2^n values are far too many for a table of this
    kind.'
  in_action:
    statement: On each of n days choose one of m activities; activity j on day i earns p[i][j], and the
      same activity may not be chosen on two consecutive days. Print the largest total.
    constraints: n ≤ 10^5, m ≤ 10.
    budget: Trying every sequence is m^n. With the state (day, last activity) there are n · m = 10^6 states
      with m transitions each.
    candidates:
    - tool: Position alone as the state
      verdict: rejected
      because: The best of each day would repeat the same activity, which breaks the rule.
    - tool: State (day, last activity)
      verdict: chosen
      because: The rule reads only the last activity, so the pair determines the future.
    property_check: The next choice depends on the past only through the last activity, one of m values
      (Theorem 3.2.5).
    decision: dp[0][j] = p[0][j]; dp[i][j] = p[i][j] + the maximum of dp[i − 1][q] over q ≠ j; print the
      maximum of dp[n − 1].
  examples:
    positive:
    - inline:
        input: Two days with points 10 1 1 on both days, never the same activity twice in a row
        answer: '11'
        why: dp[2][A] = 10 + max(dp[1][B], dp[1][C]) = 11 and dp[2][B] = 1 + 10 = 11.
    - worked_example: ac-abc291_d
      why: The number of valid choices for the first i cards depends on the side shown by card i, a state
        of two values.
    negative:
    - inline:
        input: The largest value with capacity 10^9 over 3 items, with the state (item, remaining capacity)
        answer: '8'
        method_gives: too-slow
        why: The capacity is up to 10^9, so the table has 4·10^9 states; with 3 items, trying the 8 subsets
          is exact.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - problem: ac-abc184_f
      why: With 40 numbers and sums up to 10^9, the extra fact "sum so far" takes up to 10^9 values; the
        halves are listed instead.
      correct_tool:
        topic: '3.1'
        card: meet-in-middle
  lookalikes:
  - description: The maximum sum of a contiguous subarray, with no extra rule
    tool:
      topic: '1.2'
      card: prefix-extremes
    flipping_difference: Without a rule linking consecutive choices, the best subarray is a prefix difference;
      the extra state is needed only when a rule (one deletion, a sign flip) changes the future.
  complexity: O(n · |X| · transitions).
- id: two-index
  name: Two indices per state
  decisive_property: A partial solution is described by two numbers, such as positions in two strings
    or a position and a count, and every transition increases one of them or both; so the table dp[i][j]
    can be filled in increasing i and, within a row, increasing j.
  from_theorem: 3.2.3
  how_to_test: Name the two numbers, list the transitions, and check that each one moves to a pair that
    is larger in the fill order; then count the pairs.
  constraint_shapes:
  - 'Two strings of length 2000: 4·10^6 states, while a table for two indices of 10^5 each is 10^10.'
  weak_signals:
  - form: Two strings, such as whether one matches a pattern or a third can be formed by interleaving
      them
    shape: Lengths up to 2000
  - form: Choose exactly k of n items, or reach position n with a counter that stays within a range
    shape: n and k up to 2000
  - form: Sequences where each value must be close to the previous one, with some values fixed
    shape: n up to 2000
  kill_signals:
  - 'Both indices range up to 10^5 or more: the paths of a 100000 × 100000 grid number 879467333 modulo
    10^9 + 7, from one binomial coefficient, while 10^10 table cells are too many.'
  - 'The count is not part of the state in the data: the days up to 10^9 in the projects problem make
    a table of days impossible; sort and use one index.'
  in_action:
    statement: Choose exactly k of n elements, no two adjacent, with the largest sum.
    constraints: n ≤ 2000, k ≤ n.
    budget: Trying every subset is 2^n. The table of (elements considered, elements chosen) has n · k
      = 4·10^6 states.
    candidates:
    - tool: Try every subset of exactly k elements
      verdict: rejected
      because: C(n, k) subsets.
    - tool: Table over (prefix length, count chosen)
      verdict: chosen
      because: Each state is reached from a smaller prefix with one fewer or equal count, so rows can
        be filled in order.
    property_check: Both indices only grow along the transitions, so the table is filled in increasing
      order (Theorem 3.2.3).
    decision: dp[0][0] = 0; dp[i][j] = the larger of dp[i − 1][j] and dp[i − 2][j − 1] + a_i; print dp[n][k]
      or impossible.
  examples:
    positive:
    - inline:
        input: The lattice paths from (0, 0) to (2, 2)
        answer: '6'
        why: dp[i][j] = dp[i − 1][j] + dp[i][j − 1] gives 1, 2, 3 in the first rows and dp[2][2] = 6.
    - inline:
        input: Exactly 2 non-adjacent elements of 3 -1 4 1 with the largest sum
        answer: '7'
        why: The choices are (3, 4) = 7, (3, 1) = 4 and (-1, 1) = 0; the table over (prefix, count) finds
          7.
    negative:
    - inline:
        input: The lattice paths in a 100000 × 100000 grid, modulo 10^9 + 7
        answer: '879467333'
        method_gives: too-slow
        why: The table has 10^10 cells; the paths are one binomial coefficient C(200000, 100000), a choice
          of positions.
      correct_tool:
        topic: '2.3'
        card: bijection-paths
    - problem: cses-1140
      why: The days go up to 10^9, so a table over (project, day) is impossible; sorting by end day gives
        a single index.
      correct_tool:
        topic: '3.2'
        card: linear-state
  lookalikes:
  - description: Whether a short string is a subsequence of a long one
    tool:
      topic: '1.3'
      card: merge-walk
    flipping_difference: Matching each character at its first possible place is never worse, so two pointers
      decide it; a table over two indices is needed when a character may match in several ways (wildcards,
      interleaving).
  complexity: O(rows · columns · transitions).
- id: memo-recursion
  name: Recursion with a cache
  decisive_property: The natural recursion has few distinct arguments but calls them many times, and no
    argument depends on itself; storing each result the first time makes every state cost its transitions
    once, even when the reachable states are scattered or their order is awkward.
  from_theorem: 3.2.4
  how_to_test: Write the recursion, count the distinct arguments it can reach (not the calls), and check
    that each call's arguments are smaller in some sense, so there is no cycle.
  constraint_shapes:
  - 'n up to 10^12 with f(n) = f(n/2) + f(n/3) + f(n/4): the plain recursion has more calls than particles,
    while the reachable arguments are about a thousand.'
  weak_signals:
  - form: A recursive formula such as f(n) = f(n/2) + f(n/3)
    shape: n up to 10^12 or 10^18
  - form: Two players take stones or moves, and the winner is asked
    shape: A small number of states
  - form: A recursive structure whose size explodes but whose levels are few
    shape: A few levels
  kill_signals:
  - 'The recursion has a closed form and the reachable arguments are all the values below n: f(n) = f(n
    − 1) + n for n = 10^9 would store 10^9 values, while n(n + 1)/2 = 500000000500000000.'
  - 'The distinct arguments are many and the order is simple: tabulation is faster and has no recursion
    depth.'
  in_action:
    statement: A coin worth n can be exchanged for coins worth ⌊n/2⌋, ⌊n/3⌋ and ⌊n/4⌋, or sold for n;
      print the most money obtainable.
    constraints: n ≤ 10^12.
    budget: The plain recursion makes about 3^(log n) calls, far too many. The reachable arguments number
      about a thousand.
    candidates:
    - tool: Plain recursion
      verdict: rejected
      because: The same arguments recur and the calls multiply.
    - tool: Recursion with a map as the cache
      verdict: chosen
      because: Only the reachable arguments are computed, once each, and a table indexed up to 10^12 is
        impossible.
    property_check: Arguments only get smaller, so there is no cycle, and the value depends only on the
      argument (Theorem 3.2.4).
    decision: g(n) = max(n, g(n/2) + g(n/3) + g(n/4)) with g(0) = 0, storing every result in a map.
  examples:
    positive:
    - inline:
        input: The most money from a coin of value 12
        answer: '13'
        why: g(12) = max(12, g(6) + g(4) + g(3)) = max(12, 6 + 4 + 3) = 13.
    - inline:
        input: The ways to climb 20 stairs with steps of 1 or 2
        answer: '10946'
        why: The cache holds ways(2) .. ways(20), each computed once, instead of the 21891 calls of the
          plain recursion.
    negative:
    - inline:
        input: f(n) = f(n − 1) + n with f(0) = 0, for n = 10^9
        answer: '500000000500000000'
        method_gives: too-slow
        why: Every value below n is reached, so the cache would hold 10^9 values; the recursion has the
          closed form n(n + 1)/2.
      correct_tool:
        topic: '0.2'
        card: closed-form
    - problem: ac-abc291_d
      why: The states are the n cards in order, 2·10^5 of them; a table filled in one pass has no recursion
        depth, which could overflow the stack.
      correct_tool:
        topic: '3.2'
        card: extra-small-state
  lookalikes:
  - description: f(n) = f(n − 1) + n with f(0) = 0, for n up to 10^18
    tool:
      topic: '0.2'
      card: closed-form
    flipping_difference: Every value 0..n is reached, far too many to store; the recursion has a formula,
      n(n + 1)/2. A cache helps only when the reachable arguments are few.
  complexity: O(number of reachable states × transitions), plus a cache lookup per call.
- id: reconstruct
  name: Recover the choices
  decisive_property: The output is an optimal solution itself, not only its value; recording for each
    state one transition that attains its optimum lets you walk back from the best final state and rebuild
    a solution of exactly that value.
  from_theorem: 3.2.6
  how_to_test: Check that each state's optimum is attained by a recorded transition and that the walk
    back ends at a base case; for the lexicographically smallest solution, decide the tie-break before
    filling the table.
  constraint_shapes:
  - 'n up to 10^5: the table is n values, and the walk back adds n steps; listing the optimal solutions
    to choose one would be exponential.'
  weak_signals:
  - form: Print the chosen items, the sequence of moves or the string, not just the best value
    shape: n up to 10^5
  - form: Print any optimal solution, or the lexicographically smallest one
    shape: Ties in the table
  kill_signals:
  - 'Walking back from the end of a table filled forward gives the lexicographically largest choice: for
    2 2 2 2 it takes positions 2 and 4, not 1 and 3; fill the suffix table and walk forward.'
  - 'Only the value or the count is asked: the table alone is enough, as in the flipping cards problem.'
  in_action:
    statement: Choose elements of an array of positive integers, no two adjacent, with the largest sum;
      print the lexicographically smallest list of positions among the optimal choices.
    constraints: n ≤ 10^5.
    budget: The table is n values; the walk is n steps.
    candidates:
    - tool: List all optimal choices and compare
      verdict: rejected
      because: There can be exponentially many optimal choices.
    - tool: Suffix table and a forward walk
      verdict: chosen
      because: Taking a position whenever it still reaches the optimum makes the first position as small
        as possible, then the second.
    property_check: The best value from each suffix is known, so the choice at each step can be tested
      against it (Theorem 3.2.6).
    decision: best[i] = max(best[i + 1], a[i] + best[i + 2]); walk i from 0, taking i when a[i] + best[i
      + 2] = best[i] and jumping by 2.
  examples:
    positive:
    - inline:
        input: The stones on the cheapest path for the heights 10 30 40 20 with jumps of 1 or 2
        answer: 1-2-4
        why: Following the recorded predecessors back from stone 4 gives 4, 2, 1; reversed, 1, 2, 4.
    - inline:
        input: The lexicographically smallest positions with the largest non-adjacent sum in 5 1 5
        answer: 1-3
        why: The best sum is 10 and only positions 1 and 3 reach it.
    negative:
    - inline:
        input: The lexicographically smallest optimal positions in 2 2 2 2, walking back from the end
          of a table filled forward
        answer: 1-3
        method_gives: 2-4
        why: The walk back takes the last position whenever it attains the optimum, which gives positions
          2 and 4; the forward walk over the suffix table gives 1 and 3.
      correct_tool:
        topic: '3.2'
        card: reconstruct
    - problem: ac-abc291_d
      why: Only the number of valid choices is asked; the table of counts is the whole answer and no solution
        is printed.
      correct_tool:
        topic: '3.2'
        card: extra-small-state
  lookalikes:
  - description: Print the order of n tasks that minimises the total waiting time
    tool:
      topic: '1.5'
      card: exchange-order
    flipping_difference: The output is a solution, but an exchange argument proves that sorting by duration
      is optimal, so no table and no walk back are needed.
  complexity: Same as the table, plus O(length of the solution) for the walk back.
problems:
- id: ac-abc291_d
  role: worked_example
  summary: Count the ways to choose a side for each of N ≤ 2·10^5 cards so that neighbouring cards show
    different numbers, modulo 998244353.
- id: cses-1140
  role: worked_example
  summary: Attend some of n ≤ 2·10^5 projects (days up to 10^9) that share no day, maximising the total
    pay.
- id: lc-climbing-stairs
  role: ladder
  card: linear-state
  rung: 1
  twist: Base case of the card
  summary: Count the ways to climb n ≤ 45 stairs with steps of 1 or 2.
  hints:
  - Look at the last step of a climb. What can it be, and what is left before it?
  - The last step is 1 or 2, so the climbs of n are the climbs of n − 1 and the climbs of n − 2, each
    followed by one step; the classes do not overlap (Theorem 3.2.2).
  - ways[0] = ways[1] = 1 and ways[i] = ways[i − 1] + ways[i − 2]; print ways[n].
- id: ac-dp_a
  role: ladder
  card: linear-state
  rung: 2
  twist: A minimum cost instead of a count.
  summary: A frog on N ≤ 10^5 stones jumps 1 or 2 stones ahead, paying the height difference; the cheapest
    way to the last stone.
  hints:
  - Does the cheapest way to finish from stone i depend on how the frog reached stone i?
  - 'No: the stone alone is the state. best[i] = min(best[i − 1] + |h_i − h_{i−1}|, best[i − 2] + |h_i
    − h_{i−2}|) (Theorem 3.2.1).'
  - Fill best[0] = 0, then i = 1, 2, … in order; print best[N − 1].
- id: ac-dp_b
  role: ladder
  card: linear-state
  rung: 3
  twist: Up to K transitions into each state instead of two.
  summary: The same frog may jump up to K ≤ 100 stones ahead (N ≤ 10^5); the cheapest way to the last
    stone.
  hints:
  - How many stones can the last jump into stone i come from?
  - Any of the K stones before it; take the minimum of best[i − j] + |h_i − h_{i−j}| over j = 1..K.
  - 'The cheapest-jumps template of Section 6: O(NK) = 10^7 steps.'
- id: lc-word-break
  role: ladder
  card: linear-state
  rung: 4
  twist: The transitions are dictionary words ending at position i, checked with a set (topic 0.6).
  summary: Can a string (length ≤ 300) be cut into words from a dictionary of words up to 20 letters long?
  hints:
  - If the first i characters can be cut into words, what must be true about the last word?
  - ok[i] is true when some word s[j..i) is in the dictionary and ok[j] is true; the last word ends at
    i, and words are at most 20 letters, so only j ≥ i − 20 matter.
  - ok[0] = true; for each i, try every j from max(0, i − 20) to i − 1 with a set lookup of s.substr(j,
    i − j); print ok[n].
- id: cf-1741E
  role: ladder
  card: linear-state
  rung: 5
  twist: 'Transitions point both ways: a length marker can describe the segment before it or the segment
    after it, so a state receives values from earlier and also sends them forward.'
  summary: A sequence (n ≤ 2·10^5) was formed by splitting an array into segments and writing each segment's
    length just before or just after it; can the given sequence have arisen this way?
  hints:
  - Let ok[i] mean that the first i elements can be fully explained. Which elements can be a length marker,
    and for which segment?
  - If b_i is the marker of the segment just before it, that segment is b_{i−b_i}..b_{i−1} and ok[i] needs
    ok[i − b_i − 1]. If it is the marker of the segment just after it, it explains positions up to i +
    b_i, which needs ok[i − 1].
  - 'ok[0] = true; for i = 1..n: if i − b_i − 1 ≥ 0 and ok[i − b_i − 1], set ok[i]; if ok[i − 1] and i
    + b_i ≤ n, set ok[i + b_i]. Print YES if ok[n].'
- id: ac-dp_c
  role: ladder
  card: extra-small-state
  rung: 1
  twist: Base case of the card
  summary: On each of N ≤ 10^5 days choose one of three activities with given points, never the same activity
    two days running; maximise the total.
  hints:
  - With "day i" alone as the state, what goes wrong? Try two days where the same activity is best on
    both.
  - 'The rule reads yesterday''s activity, so it must be in the state: dp[i][a] = points of a on day i
    + max over b ≠ a of dp[i − 1][b] (Theorem 3.2.5).'
  - The no-repeat template of Section 6 with m = 3.
- id: lc-best-time-to-buy-and-sell-stock-with-cooldown
  role: ladder
  card: extra-small-state
  rung: 2
  twist: 'The extra fact has three values that form a small machine: holding a share, just sold (must
    rest tomorrow), or free.'
  summary: Buy and sell one share at a time on n ≤ 5000 days of prices; after a sale you must wait a day
    before buying again. Maximise the profit.
  hints:
  - What do you need to know about yesterday to decide what you may do today?
  - Whether you hold a share, and if not, whether you sold yesterday. Keep the best profit for each of
    the three situations at the end of each day.
  - hold = max(hold, free − price), sold = hold_prev + price, free = max(free, sold_prev); update all
    three from yesterday's values; answer max(free, sold).
- id: lc-maximum-subarray-sum-with-one-deletion
  role: ladder
  card: extra-small-state
  rung: 3
  twist: 'The extra fact is a flag: whether the one allowed deletion has been used.'
  summary: The largest sum of a non-empty contiguous subarray (n ≤ 10^5) after deleting at most one element
    from it (it must stay non-empty).
  hints:
  - For subarrays ending at position i, what two kinds should you keep apart?
  - Those with no deletion yet (keep0) and those with the deletion already used (keep1). keep1 either
    extends a keep1 subarray by a[i], or deletes a[i] from a keep0 subarray ending at i − 1.
  - keep1 = max(keep1 + a[i], keep0_prev), keep0 = max(keep0 + a[i], a[i]); the answer is the largest
    keep0 or keep1 seen (keep1 only from i ≥ 1).
- id: cf-698A
  role: ladder
  card: extra-small-state
  rung: 4
  twist: Some actions are forbidden on some days, and the goal is to minimise the rest days.
  summary: For n ≤ 100 days you know whether the gym is open and whether a contest runs; never do the
