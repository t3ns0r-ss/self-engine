# Patterns for topic 5.7 (Binary trie and XOR). Cards of the lesson: binary-xor (patterns max-xor and xor-count) and xor-split.
topic: "5.7"
patterns:
  - id: max-xor
    name: Largest (or smallest) XOR with a set
    description: Maximum of x ⊕ y over pairs, or for a query x against a set that changes, by walking a binary trie from the highest digit and taking the opposite digit whenever it exists.
    precondition: Digits decide from the highest down (2^b exceeds all lower digits together), so taking the opposite digit whenever possible is optimal; all numbers have the same number of digits.
  - id: xor-count
    name: Counting XOR below a bound
    description: Count pairs or subarrays with XOR less than k (or at least k, or in a range) by walking the binary trie along k's digits with counts stored on the nodes; also sums over pairs taken by digit.
    precondition: Branches that already make the XOR smaller than k can be counted whole from stored subtree counts.
  - id: xor-split
    name: Split by the highest differing digit
    description: A question over all pairs of a set of numbers (a cheapest spanning tree on XOR weights, the smallest possible largest XOR, a pairing game) is solved by splitting the set by its highest digit and recursing, with a trie to find the cheapest edge across.
    precondition: Edges inside a group are lighter than every edge across the groups, because the highest digit of an XOR decides its size.
