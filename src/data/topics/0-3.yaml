# Topic 0.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.3"
draft: true
cards:
  - id: direct-simulation
    name: "Step-by-step simulation"
    decisive_property: "The number of steps times the cost of one step fits the budget; or the process is deterministic on a small set of states, so it repeats within that many steps and the state after T steps follows from the first repeat and the period."
    from_theorem: "Theorem 0.3.1"
    how_to_test: "Count the steps the statement describes (with the largest input) and multiply by the cost of one step. If that is too large, ask whether the next state depends only on the current one and how many states exist."
    weak_signals:
      - "The statement describes a process in detail: 'repeat …', 'in each second …', 'after the operations, print …'"
      - "Small limits on the number of steps (N, Q up to 10^5 with O(1) per step)"
      - "A huge number of steps (K up to 10^18) over a small set of states"
    kill_signals:
      - "The number of steps is huge and the state space is huge too (a formula or a later technique is needed)"
    lookalikes:
      - description: "The same rule applied 5·10^15 times, with no small state space"
        needs: "case-analysis (0.3): reason about the result"
        flipping_difference: "Neither stepping nor cycle detection fits; the answer follows from what the rule does to each part."
    complexity: "O(steps · cost per step); with cycle detection O(K) for K states."
  - id: grid-processing
    name: "Grid processing"
    decisive_property: "Each cell is visited a constant number of times, and every neighbour access goes through a direction array and a bounds check, so the scan costs O(HW) and never reads outside the grid."
    from_theorem: "Theorem 0.3.2"
    how_to_test: "Check that H·W fits the budget and that every access (r + dr, c + dc) is either checked against 0..H−1 and 0..W−1 or lands in a padding border."
    weak_signals:
      - "Input is H lines of W characters ('#' and '.')"
      - "Neighbours, directions, turning left or right, walking until a wall"
      - "Rotating or transposing a matrix"
    kill_signals:
      - "Shortest number of moves between cells (a later topic: breadth-first search, 4.1)"
    lookalikes:
      - description: "Fewest moves from one cell to another"
        needs: "4.1 (a later topic)"
        flipping_difference: "Exploring all paths needs a queue-based search, not a single scan."
    complexity: "O(HW) with a constant of at most 9 per cell for 8 neighbours."
  - id: string-processing
    name: "One-pass string processing"
    decisive_property: "A small state (a counter, the previous character, a flag) summarises the prefix read so far, and the next state depends only on the old state and the next character, so one left-to-right scan decides the answer."
    from_theorem: "Theorem 0.3.3"
    how_to_test: "Name the state you would keep after reading a prefix, and check that nothing else about the prefix is ever needed."
    weak_signals:
      - "Transform or check a string: brackets, separators, replacements, case changes"
      - "Length up to 10^5 or 10^6 (one pass needed)"
      - "Output built character by character"
    kill_signals:
      - "The answer depends on rearranging the characters (then counts per letter decide: case analysis)"
    lookalikes:
      - description: "Make a palindrome by reordering the letters freely"
        needs: "case-analysis (0.3) on letter counts"
        flipping_difference: "When order may change, only the counts matter, not a scan of the string."
    complexity: "O(n) updates of a constant-size state."
  - id: case-analysis
    name: "Case analysis"
    decisive_property: "The inputs split into a few cases that together cover every allowed input (including the boundaries), and each case has a direct answer."
    from_theorem: "Theorem 0.3.4"
    how_to_test: "List the cases before coding, then check every boundary input (equal values, zero, smallest n) against exactly one case's rule. Compare with a brute force on small inputs."
    weak_signals:
      - "Few inputs with large values; the answer is YES/NO or a small number"
      - "Geometry of a few points, comparisons of a few quantities"
      - "A rule applied an astronomical number of times (reason about the result instead)"
    kill_signals:
      - "Too many cases to list: look for a single rule (formula) or a scan instead"
    lookalikes:
      - description: "The same rule applied only a few times"
        needs: "direct-simulation (0.3)"
        flipping_difference: "With few steps, following the process is simpler and safer than reasoning about cases."
    complexity: "O(1) or a constant number of comparisons per input."
problems: []
drill: []
