  hints:
  - Inside a part of the graph without bridges you can reach any place and come back using other roads.
    What does this make of such a part?
  - Contract every bridgeless group to one vertex; the bridges form a tree, and the walk from a to b follows
    the path between the groups of a and b in this tree.
  - Say YES if a group on this path contains a road with an artifact, or the path uses a bridge with an
