kind: pattern
domain: parking-fees
variants: [naive, patterned]
claims: ["L2.1.1"]
scenarios:
  - name: 01-weekend
    request: "Add a weekend plan at double the hourly rate."
    blast_radius:
      naive: {count: 2, behaviours: ["HOURLY", "DAILY"], where: "FeeCalculator::fee"}
      patterned: {count: 0, behaviours: [], where: "make_calculator (wiring only)"}
  - name: 02-free30
    request: "The first 30 minutes are free on the hourly plan."
    blast_radius:
      naive: {count: 2, behaviours: ["DAILY", "WEEKEND"], where: "FeeCalculator::fee"}
      patterned: {count: 0, behaviours: [], where: "HourlyPricing::fee"}
  - name: 03-truck
    request: "Trucks pay more: hourly doubles and daily adds 50; weekend is unchanged. Every plan now needs the vehicle type."
    blast_radius:
      naive: {count: 1, behaviours: ["WEEKEND"], where: "FeeCalculator::fee"}
      patterned: {count: 1, behaviours: ["WEEKEND"], where: "WeekendPricing::fee (signature only)"}
