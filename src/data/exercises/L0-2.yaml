topic: L0.2
exercises:
- id: rung-1
  role: ladder
  type: change_ladder
  title: An interface with two shapes
  prompt: Implement Shape as an interface with Rect and Square deriving from it, and total_area that adds up a list of shapes through the Shape interface only (see kit.hpp).
  card: virtual-interface
  rung: 1
  new_force: Two shapes expose area() behind one interface
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.2/ladder/rung-1
  reference: reference/L0.2/ladder/rung-1
  alternatives:
  - 'A switch on a kind tag inside total_area: works for 2 shapes and edits the caller for each new one.'
  hints:
  - What must the caller know about a shape? Write only that as the base class.
  - Make area() pure virtual with `= 0`; the tests fail if a Shape object can be made.
  - Mark the overrides with `override` so that the compiler checks the signature.
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: rung-2
  role: ladder
  type: change_ladder
  title: Deleting through a base pointer
  prompt: BufferedHandler counts itself in live_buffers. Deleting one through a Handler pointer must run its destructor. Fix Handler so that it does.
  card: virtual-interface
  rung: 2
  new_force: Deleting a derived object through a base pointer
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.2/ladder/rung-2
  reference: reference/L0.2/ladder/rung-2
  alternatives:
  - 'Never delete through the base: hold only BufferedHandler objects. Safe, but it gives up the interface.'
  hints:
  - Which destructor runs when you delete through a Handler*?
  - The compiler decides from the static type unless the destructor is virtual.
  - Make ~Handler virtual and mark ~BufferedHandler override.
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: rung-3
  role: ladder
  type: change_ladder
  title: The same promise at compile time
  prompt: Implement STriangle::area, area_of and total_of so that any type with an area() member works without a base class. A type the tests define themselves must work without editing your functions.
  card: static-polymorphism
  rung: 3
  new_force: A third shape is added without editing callers
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.2/ladder/rung-3
  reference: reference/L0.2/ladder/rung-3
  alternatives:
  - 'Derive STriangle from Shape and use the virtual version: works, adds a pointer per object and a look-up per call.'
  hints:
  - What do area_of and total_of need from a type? The concept HasArea says it.
  - Both are templates constrained by HasArea; they call s.area().
  - STriangle is b * h / 2, rounded down.
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: rung-4
  role: ladder
  type: change_ladder
  title: A hot loop, two ways
  prompt: Implement repeat_static (resolved at compile time) and repeat_dynamic (through the Shape interface). Both return the sum of n calls to area().
  card: static-polymorphism
  rung: 4
  new_force: A hot loop calls a tiny function 10 million times
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.2/ladder/rung-4
  reference: reference/L0.2/ladder/rung-4
  alternatives:
  - 'Always use the dynamic version: the same answers, one indirect call per iteration.'
  hints:
  - Both loops do the same sum; only how the call is chosen differs.
  - repeat_static is a template over HasArea; repeat_dynamic takes const Shape&.
  - Check n = 0 and n = 1 as well as 10 million.
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: rung-5
  role: ladder
  type: change_ladder
  title: Only one implementation
  prompt: 'Implement EventCounter as a concrete class. Do not add a base class or a virtual function: only one implementation will ever exist.'
  card: null
  rung: 5
  new_force: Only one implementation will ever exist
  needs_new_structure: false
  checkers:
  - kind: kit
    path: L0.2/ladder/rung-5
  reference: reference/L0.2/ladder/rung-5
  alternatives:
  - 'An ICounter interface with one Counter class: more code, 8 more bytes per object, no new behaviour.'
  hints:
  - Is there a second implementation, now or planned?
  - If not, an interface adds a class and a hidden pointer and changes nothing.
  - A plain class with add, count and reset is the whole job.
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: ex-1
  role: worked_example
  type: recognise
  title: A logger that is never replaced
  prompt: Every module of a program writes its messages through one Logger class. It always writes into the same list of lines and nobody has asked for a second kind of logger or a fake one for tests. A colleague proposes an ILogger interface with a LoggerImpl class. Decide.
  answer:
    kind: none
    simplest: A plain concrete class
    why: There is one implementation and no second planned; the interface would add a class and 8 bytes per object (measured) and change no behaviour.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: ex-2
  role: worked_example
  type: recognise
  title: Codecs named in a configuration file
  prompt: A program reads a list of codec names (for example upper, reverse) from a configuration file at start-up and applies the codecs to a text in the order listed. More codecs will be added over the year. Decide how the codecs should be represented.
  card: virtual-interface
  answer:
    kind: card
    card: &id001
      topic: L0.2
      card: virtual-interface
    property: The file decides which classes run while the program runs, and the loop must not change when a codec is added.
    why_others_fail: A template needs the types at compile time, and a switch in the loop is edited for every new codec.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-1
  role: drill
  type: recognise
  title: Output format from a user setting
  prompt: A report exporter must write PDF or CSV, chosen by a setting the user changes between runs. A third format is planned.
  answer:
    kind: card
    card: *id001
    property: Several implementations, picked while the program runs; the caller needs only write().
    why_others_fail: A switch in the caller is edited for every new format.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-2
  role: drill
  type: recognise
  title: Comparators in a tight loop
  prompt: A sort routine is called with comparators written in the source (by id, by name) inside a loop that runs 10 million times. No comparator is ever read from outside.
  answer:
    kind: card
    card: &id002
      topic: L0.2
      card: static-polymorphism
    property: The type is fixed at each call site, so the call can be resolved when compiled.
    why_others_fail: A virtual comparator adds an indirect call and a pointer for a choice the source already makes.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-3
  role: drill
  type: recognise
  title: One logger for everything
  prompt: One Logger class is used by every module of a program. It is never replaced and no second kind is planned.
  answer:
    kind: none
    simplest: A plain concrete class
    why: 'One implementation: an interface would add code and a pointer and change nothing.'
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-4
  role: drill
  type: recognise
  title: Plugins listed in a file
  prompt: A program loads a list of plugin names from a file and runs each plugin in turn. New plugins are added by other teams.
  answer:
    kind: card
    card: *id001
    property: The file chooses the classes while running, and new plugins must not edit the loop.
    why_others_fail: A template cannot choose its type after the program is built.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-5
  role: drill
  type: recognise
  title: A connection returned to a pool
  prompt: A database connection must go back to a pool no matter how the request handler exits, including when it throws.
  answer:
    kind: card
    card:
      topic: L0.0
      card: raii
    property: Acquire in a constructor and release in a destructor so every exit releases.
    why_others_fail: A release call before each return misses the throw.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-6
  role: drill
  type: recognise
  title: A helper with one implementation
  prompt: A helper computes a checksum for one file format. There is one way to compute it and no test double is wanted.
  answer:
    kind: none
    simplest: A plain function or class
    why: 'One implementation and no second planned: nothing to put behind an interface.'
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-7
  role: drill
  type: recognise
  title: A queue with a count
  prompt: A queue class whose size must always equal the number of stored elements.
  answer:
    kind: card
    card:
      topic: L0.1
      card: class-invariant
    property: A rule about the object's own fields, checked at every change.
    why_others_fail: A public size can be set to anything by any line.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: r-8
  role: drill
  type: recognise
  title: A colour shared by widgets
  prompt: A colour value is copied between 12 widgets and must never change under them.
  answer:
    kind: card
    card:
      topic: L0.1
      card: immutable-value
    property: Many holders of one value; nobody can change it after it is built.
    why_others_fail: A mutable colour edited by one widget changes what the others show.
  checkers: []
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: cp-1
  role: checkpoint
  type: build
  title: Build a shape area service with an interface and a template twin
  prompt: 'Build the shape area service in 45 minutes (see exercises/L0.2/cp-1): an interface Shape with Rect and Square, an AreaService that owns the shapes it is given and works with any subclass, and a template twin that gives the same total with no base class. Add a short decision record saying where you used the interface, where the template, and why.'
  card: virtual-interface
  clarifying:
  - q: Which operations does Shape promise?
    a: area(), perimeter() and name().
    critical: true
  - q: What does largest() return when two shapes have the same area?
    a: The first one added.
    critical: true
  - q: What happens when a null shape is added?
    a: std::invalid_argument, and nothing is stored.
    critical: true
  - q: May a caller define its own Shape subclass?
    a: 'Yes: the service must work with it and destroy it correctly.'
    critical: false
  - q: Does the template twin need a base class?
    a: 'No: any type with an area() member.'
    critical: false
  checkers:
  - kind: kit
    path: L0.2/cp-1
  - kind: rubric
    id: rubric-lld-build-v1
  reference: reference/L0.2/cp-1
  time_limit_minutes: 45
  techniques:
  - L0.2
  checked_on: '2026-10-19'
- id: rev-1-1
  role: review
  type: recognise
  title: Which call is dynamic?
  prompt: Given `Shape* p` and a function template `area_of(const S&)`, say which of `p->area()` and `area_of(rect)` is chosen while the program runs and which when it is compiled, and what each costs.
  card: static-polymorphism
  review_set: 1
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: The template call is resolved when compiled, with no look-up; the call through the base pointer reads the hidden pointer and calls through the table.
    why_others_fail: Treating both as the same hides that the virtual call needs a pointer per object and cannot be expanded in place.
  checkers: []
- id: rev-1-2
  role: review
  type: recognise
  title: Why the base destructor is virtual
  prompt: A Base has a virtual function but a plain destructor, and `Base* p = new Derived; delete p;` leaves the derived buffer unreleased. Say what is wrong and what the one-word fix is.
  card: virtual-interface
  review_set: 1
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id001
    property: Deleting through a base pointer must run the derived destructor, which needs the base destructor to be virtual.
    why_others_fail: Without `virtual` the call is resolved from the static type and only ~Base runs.
  checkers: []
- id: rev-1-3
  role: review
  type: refactor
  title: Replace a tag and a switch with an interface
  prompt: A function picks the text for email or SMS with an enum and a switch. Replace it with an interface so that a new channel needs no edit to the code that sends.
  card: virtual-interface
  review_set: 1
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  checkers:
  - kind: kit
    path: L0.2/rev-1-3
  reference: reference/L0.2/rev-1-3
- id: rev-2-1
  role: review
  type: build
  title: A pipeline of steps chosen at run time
  prompt: Write a Pipeline that owns steps added while the program runs, runs them in order, and works with a Step subclass the caller defines.
  card: virtual-interface
  review_set: 2
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  checkers:
  - kind: kit
    path: L0.2/rev-2-1
  reference: reference/L0.2/rev-2-1
  clarifying:
  - q: In what order do the steps run?
    a: In the order they were added.
    critical: true
  - q: What happens when a null step is added?
    a: std::invalid_argument, and nothing is stored.
    critical: true
  - q: What does an empty pipeline return?
    a: Its input unchanged.
    critical: false
  - q: May a caller define its own Step?
    a: Yes; it must work and be destroyed with the pipeline.
    critical: false
- id: rev-2-2
  role: review
  type: recognise
  title: A codec list loaded at start-up
  prompt: Choose between an interface with virtual functions and a function template for a list of codecs whose names are read from a file when the program starts. Give the deciding fact.
  card: virtual-interface
  review_set: 2
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id001
    property: The classes are chosen while the program runs, so one container must hold several types behind a base.
    why_others_fail: A vector in a template holds one type, and the file cannot choose the type after compilation.
  checkers: []
- id: rev-2-3
  role: review
  type: recognise
  title: Two classes, one call
  prompt: Two classes Circle and Square both derive from Shape with a virtual `area()`. Explain in words how `shape_ref.area()` reaches the right function for each object, using the words "hidden pointer" and "table".
  card: virtual-interface
  review_set: 2
  techniques:
  - L0.2
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id001
    property: Each object holds a hidden pointer to its class's table of functions; the call reads the pointer, finds area in that table and calls it.
    why_others_fail: Thinking the compiler picks by the variable's type misses that the object's class decides.
  checkers: []

