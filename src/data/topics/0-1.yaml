decision_map:
- weak_signal: Values up to 10^9 or 10^18 in the constraints
  choose: overflow-64bit
  when: Some sum, product, or count can pass about 2.1·10^9 (use long long) or even 9.2·10^18 (check by
    division before multiplying).
  over:
  - card: integer-rounding
    because: Rounding is the issue only when a division, square root or decimal is involved; size alone
      is this card.
- weak_signal: '"Round up", "at least how many", divisions with possibly negative values, square roots
    of large integers'
  choose: integer-rounding
  when: All quantities are integers, so the floor, ceiling, or square root can be computed exactly; the
    sign of the values decides which formula is safe.
  over:
  - card: overflow-64bit
    because: The values may also need long long, but the decisive risk is the direction of rounding or
      floating-point error.
- weak_signal: The first line is t, the number of test cases
  choose: multi-test
  when: The statement bounds the sum of sizes over all tests, so per-test work must depend only on that
    test; nothing may carry over between tests.
  over: []
