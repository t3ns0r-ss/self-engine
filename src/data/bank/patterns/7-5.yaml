# Patterns for topic 7.5 (Sprague–Grundy theorem). Provisional until the lesson maps them to Recognition Cards.
topic: "7.5"
patterns:
  - id: win-lose
    name: Winning and losing positions
    description: Label positions as winning or losing by dynamic programming over moves.
    precondition: "The game is finite and acyclic: a position is winning exactly when some move leads to a losing position."
  - id: nim-sum
    name: Nim
    description: Several piles, remove any amount from one pile; first player wins exactly when the XOR of pile sizes is non-zero.
    precondition: Every move changes exactly one pile, and from a non-zero XOR there is always a move to zero.
  - id: grundy-sum
    name: Sums of independent games
    description: "A game made of independent parts: the first player wins exactly when the XOR of the parts' Grundy numbers is non-zero."
    precondition: "The parts are independent: a move changes exactly one part."
  - id: grundy-pattern
    name: Finding the pattern
    description: Compute Grundy numbers for small sizes by brute force, find a period or formula, then prove it.
    precondition: The Grundy sequence has a pattern that can be proved by induction on the size.
