drill:
  - problem: cf-1328A
    answer_card: integer-rounding
    answer_topic: "0.1"
    property: "The answer is (b − a mod b) mod b: an exact remainder computation, 0 when b already divides a."
    why_others_fail: Multi-test is present but not the decision; a loop adding 1 until divisible takes up to 10^9 steps per test.
  - problem: cf-1409A
    answer_card: integer-rounding
    answer_topic: "0.1"
    property: Each move changes a by at most 10, so the answer is ⌈|a − b| / 10⌉, an exact ceiling of non-negative values.
    why_others_fail: Trying moves one by one is up to 10^8 steps per test; floating-point ceil is unnecessary.
  - problem: cf-1791A
    answer_card: multi-test
    answer_topic: "0.1"
    property: "Each test is one letter and constant work: the only decision is reading t tests correctly."
    why_others_fail: "No large values and no rounding: the other cards do not apply."
  - problem: cf-1772A
    answer_card: multi-test
    answer_topic: "0.1"
    property: Each test is a three-character string; read it as a string and add the digits, per test.
    why_others_fail: Values are single digits, so overflow and rounding play no part.
  - problem: cf-2009A
    answer_card: multi-test
    answer_topic: "0.1"
    property: The expression always equals b − a, so each test is O(1); the input is many tests.
    why_others_fail: Looks like a minimisation over c, but no search or rounding is needed.
  - problem: cf-1676A
    answer_card: multi-test
    answer_topic: "0.1"
    property: Each test is one short string with constant work.
    why_others_fail: "No large numbers: digits sum to at most 27."
  - problem: ac-abc220_c
    answer_card: overflow-64bit
    answer_topic: "0.1"
    property: "The total of one copy of A reaches 10^14 and X reaches 10^18: count full copies as X / total in long long, then walk one copy."
    why_others_fail: Rounding is involved, but the decisive risk is the 64-bit size of every sum; an int sum fails at once.
  - problem: ac-abc281_c
    answer_card: overflow-64bit
    answer_topic: "0.1"
    property: Reduce T modulo the playlist total (up to 10^14) in long long, then walk the songs.
    why_others_fail: Walking song by song up to T takes up to 10^18 steps; the sums need long long.
lookalike_pairs:
  - a: ac-abc169_b
    b: ac-abc169_c
    a_tool: overflow-64bit (0.1)
    b_tool: integer-rounding (0.1)
    flipping_difference: "B gives one factor with two decimals: the danger is floating-point error (read it as an integer number of hundredths), not the size of the product."
  - a: ac-abc239_b
    b: ac-abc345_b
    a_tool: "integer-rounding (0.1): floor"
    b_tool: "integer-rounding (0.1): ceiling"
    flipping_difference: B asks for the ceiling. C++ truncation equals the floor only for X ≥ 0 and the ceiling only for X ≤ 0, so each problem breaks on the other sign.
self_test:
  - q: What does this print, and why? int a = 100000, b = 100000; long long c = a * b; cout << c;
    a: It prints 1410065408 on the usual compilers (formally the behaviour is undefined). a * b is computed in int because both operands are int; 10^10 does not fit, and the wrapped value 10^10 − 2·2^32 is what gets copied into c. Write 1LL * a * b.
  - q: Why is -7 / 2 equal to -3 in C++, while ⌊−3.5⌋ = −4? How do you compute the floor?
    a: "C++ integer division truncates toward zero. For a negative quotient that is not whole, truncation rounds up, so the floor is one less: q = a / b; if (a % b != 0 && a < 0) q--; (for b > 0)."
  - q: An input has t ≤ 10^4 tests with the sum of n at most 2·10^5. A program clears a global array of 2·10^5 entries at the start of every test. How many steps does the clearing take in the worst case?
    a: Up to 10^4 · 2·10^5 = 2·10^9 steps, far too slow, even though the real data is only 2·10^5 numbers. Clear only the first n entries, or use a vector of size n created inside the test loop (Theorem 0.1.3).
  - q: Is (long long)sqrt((double)x) always the integer square root for 0 ≤ x ≤ 10^18? Give a counterexample.
    a: No. For x = 10^18 − 1 it gives 10^9 instead of 999 999 999, because converting x to double already rounds it up to 10^18. Correct the guess with integer comparisons (Theorem 0.1.5).
  - q: Three values, each at most 10^6, are multiplied. Which type do you need for the product? And for four such values?
    a: "Three: up to 10^18, which fits long long (below 9.2·10^18) but not int. Four: up to 10^24, which fits no built-in type; check with division before multiplying (Theorem 0.1.2), or reduce modulo something if the problem asks for it."
  - q: |-
      Why end lines with "
      " instead of endl when printing 10^6 lines?
    a: |-
      endl writes a newline and also flushes the output buffer, sending it to the system immediately. Flushing 10^6 times is slow; "
      " only adds the newline and lets the buffer fill up first.
  - q: What does (a + b − 1) / b give for a = −6, b = 4, and what is ⌈−6/4⌉?
    a: (−6 + 3) / 4 = −3 / 4, which truncates to 0. The true ceiling of −1.5 is −1. The shortcut is valid only for a ≥ 0; in general use −⌊−a/b⌋.
checkpoint:
  time_limit_minutes: 90
  problems:
    - lc-string-to-integer-atoi
    - cf-1418A
    - cf-1555A
decision_map:
  - weak_signal: Values up to 10^9 or 10^18 in the constraints
    choose: overflow-64bit
    when: Some sum, product, or count can pass about 2.1·10^9 (use long long) or even 9.2·10^18 (check by division before multiplying).
    over:
      - card: integer-rounding
        because: Rounding is the issue only when a division, square root or decimal is involved; size alone is this card.
  - weak_signal: '"Round up", "at least how many", divisions with possibly negative values, square roots of large integers'
    choose: integer-rounding
    when: All quantities are integers, so the floor, ceiling, or square root can be computed exactly; the sign of the values decides which formula is safe.
    over:
      - card: overflow-64bit
        because: The values may also need long long, but the decisive risk is the direction of rounding or floating-point error.
  - weak_signal: The first line is t, the number of test cases
    choose: multi-test
    when: The statement bounds the sum of sizes over all tests, so per-test work must depend only on that test; nothing may carry over between tests.
    over: []
