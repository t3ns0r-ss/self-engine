# Topic 1.5 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.5"
cards:
  - id: exchange-order
    name: Order by an exchange argument
    decisive_property: "The task is to choose an order of items, and comparing two adjacent items x, y with \"x then y\" against \"y then x\" shows that the item with the smaller key should come first, regardless of the others; so sorting by that key is optimal."
    from_theorem: Theorem 1.5.1
    how_to_test: Write the cost change of swapping two adjacent items in the middle of any order; check that it depends only on those two and has a fixed sign once their keys are compared.
    weak_signals:
      - '"In which order should the tasks be done", total waiting time, total penalty'
      - The cost of an item depends on the items done before it
      - Pairs of values (a_i, b_i) where the best order mixes both
      - '"Can every job be finished by its deadline": durations and deadlines'
    kill_signals:
      - The swap effect depends on items far away, not only on the two swapped
      - Items can be skipped, and which ones to skip interacts with the order (later topics)
    lookalikes:
      - description: Order the items so that a running total never drops below zero, with items that can also be skipped
        needs: a combination of choices (Phase 3)
        flipping_difference: Skipping makes the decision a subset choice, which a single adjacent swap does not settle.
    complexity: O(n log n).
  - id: interval-selection
    name: Earliest end first
    decisive_property: "Every chosen interval counts the same and chosen intervals must not overlap, so taking the compatible interval that ends first keeps the greedy ahead of any other selection; the same ends give the fewest points that hit all intervals."
    from_theorem: Theorem 1.5.2
    how_to_test: Check that the goal is a count (not a total weight) and that touching intervals are handled as the statement says.
    weak_signals:
      - '"The most meetings / films / events", "the fewest intervals to remove so the rest do not overlap"'
      - '"The fewest arrows / points / bombs that hit every interval"'
      - Intervals given in any order with large coordinates
      - Ranges of angles or slopes that act as intervals once written as fractions
    kill_signals:
      - Intervals have weights and the total weight counts
      - All intervals must be kept and grouped (that is the maximum overlap, topic 1.1)
    lookalikes:
      - description: Split all intervals into the fewest groups of non-overlapping intervals
        needs: "event-sweep (1.1): the maximum overlap"
        flipping_difference: Nothing may be removed, so the answer is how many intervals overlap at the busiest point.
    complexity: O(n log n).
  - id: extreme-first
    name: Most extreme first
    decisive_property: "Items contribute independently and the only limit is how many items (or units) are taken, so the k most valuable items (or units) are best: any other choice can be improved item by item."
    from_theorem: Theorem 1.5.3
    how_to_test: Check that an item's value does not depend on which others are taken and that the limit is a count, not a size.
    weak_signals:
      - '"The fewest items to reach a total", "the largest total with at most k items"'
      - Goods that can be split, with a value per unit
      - The smallest or largest remaining item forces what must happen to it
    kill_signals:
      - Items have different sizes and cannot be split (later topics)
      - Taking an item changes the values of the others
    lookalikes:
      - description: Items with sizes and values that cannot be split, under a size limit
        needs: a combination of choices (topic 3.3)
        flipping_difference: Unsplittable items of different sizes break the item-by-item improvement.
    complexity: O(n log n), or O(n) when only the k largest are needed.
  - id: sorted-matching
    name: Matching two sorted lists
    decisive_property: "Items of one list are paired with items of another, and whether a pair works (or what it costs) depends on a threshold in one sorted order, so pairs never need to cross: walking both sorted lists and giving each item the smallest sufficient partner is optimal."
    from_theorem: Theorem 1.5.4
    how_to_test: Check that a smaller partner that works is never more useful to the others than a larger one, so uncrossing two pairs never hurts.
    weak_signals:
      - Children and cookies, people and seats, tasks and workers
      - '"Each … can be used at most once", "the maximum number of pairs"'
      - Pairing the smallest with the largest to balance sums
    kill_signals:
      - Whether a pair works depends on two different attributes at once (no single sorted order)
    lookalikes:
      - description: Pair people into boats of capacity C, at most two per boat
        needs: opposite-ends (1.3)
        flipping_difference: Pairs within one list rather than across two lists; the heaviest person is paired with the lightest if possible.
    complexity: O(n log n + m log m).
  - id: left-to-right-forced
    name: Left-to-right forced choices
    decisive_property: "Positions are handled from left to right, what remains possible depends only on a small state, and the greedy choice at each position leads to a state that dominates every other choice's state, so it is never worse."
    from_theorem: Theorem 1.5.5
    how_to_test: Name the state after each position and show that the greedy choice reaches the best state, for example the farthest reach or the most useful change left.
    weak_signals:
      - '"Can you reach the end", "the fewest jumps / segments to cover"'
      - The first position that is wrong must be fixed now, and fixing it as far right as possible helps
      - Change-making with a fixed set of coins processed in order
    kill_signals:
      - A choice now changes the options far ahead in ways the state does not capture
    lookalikes:
      - description: Buy and sell a stock once, with the best profit
        needs: "prefix-extremes (1.2)"
        flipping_difference: One trade is a pair of days (prefix minimum), not a sequence of choices.
    complexity: O(n) after any sorting.
problems:
  - id: cses-1630
    role: ladder
    card: exchange-order
    rung: 1
    twist: Base case of the card
    summary: n ≤ 2·10^5 tasks with durations and deadlines done one after another; each earns (deadline − finishing time), possibly negative; the largest total.
    hints:
      - Split the total into a part that does not depend on the order and a part that does.
      - "Σ deadlines − Σ finishing times. Only Σ finishing times depends on the order: shortest first minimises it (Section 4.1)."
      - Sort by duration, accumulate the finishing times in long long, and subtract from the sum of deadlines.
  - id: ac-abc131_d
    role: ladder
    card: exchange-order
    rung: 2
    twist: A yes/no question about deadlines; the swap compares the worst lateness, not a sum.
    summary: N ≤ 2·10^5 jobs with durations A_i and deadlines B_i, done one at a time from time 0; can all be finished by their deadlines?
    hints:
      - Take two adjacent jobs with the later deadline first. Can swapping them make anything late that was on time?
      - "No: after the swap the earlier-deadline job finishes earlier, and the other finishes when the pair finished before, which is before the earlier deadline if the pair was on time. So earliest deadline first (Theorem 1.5.1)."
      - Sort by deadline, add the durations, and check every finishing time against its deadline (long long).
  - id: lc-two-city-scheduling
    role: ladder
    card: exchange-order
    rung: 3
    twist: The order is a split into two equal groups, and the key is a difference of two costs.
    summary: 2n people (2n ≤ 100), each with a cost to city A and to city B; send exactly n to each city at the least total cost.
    hints:
      - Suppose everyone goes to B first. What does moving one person to A change?
      - "It adds aCost − bCost. Two people in the wrong groups can be swapped when the one in A has the larger difference, so sort by aCost − bCost."
      - Sort by aCost − bCost; the first n go to A and the rest to B.
  - id: cses-1629
    role: ladder
    card: interval-selection
    rung: 1
    twist: Base case of the card
    summary: The most films (n ≤ 2·10^5, times ≤ 10^9) that can be watched completely, one at a time.
    hints:
      - Which of the three rules from Section 1 is safe?
      - "Earliest end first (Theorem 1.5.2). Here a film may start exactly when the previous one ends."
      - Sort by end; take a film when its start is at least the end of the last film taken.
  - id: lc-minimum-number-of-arrows-to-burst-balloons
    role: ladder
    card: interval-selection
    rung: 2
    twist: Hitting points instead of a selection, with coordinates up to 2^31 − 1.
    summary: The fewest vertical arrows that burst all balloons, each balloon an interval [x_start, x_end] on a line (up to 10^5 balloons).
    hints:
      - How is "fewest points hitting every interval" related to "most disjoint intervals"?
      - "They are equal, and the points can be the ends of the chosen intervals (Theorem 1.5.2, part 2)."
      - Sort by end; shoot at the end of the first balloon not yet burst; compare in a way that cannot overflow (avoid end + 1).
  - id: ac-abc225_e
    role: ladder
    card: interval-selection
    rung: 3
    twist: The intervals are ranges of slopes, which must be compared exactly as fractions.
    summary: N ≤ 2·10^5 figures "7" in the plane; delete some so that as many as possible remain wholly visible from the origin.
    hints:
      - Which directions from the origin does one 7 block? Describe it as an interval.
      - "The slopes from y_i/(x_i − 1) down to (y_i − 1)/x_i, or in the other order: an interval of angles. Visible figures must have disjoint interiors of these intervals."
      - Earliest end first on the angle intervals, comparing fractions a/b and c/d by a·d and c·b in long long (touching ends are allowed).
  - id: lc-maximum-units-on-a-truck
    role: ladder
    card: extreme-first
    rung: 1
    twist: Base case of the card
    summary: Box types with a count and units per box; the most units a truck can carry with at most truckSize boxes.
    hints:
      - Does a box's value depend on which other boxes are taken? What is the only limit?
      - "No, and the limit is a count of boxes: take boxes with the most units first (Theorem 1.5.3)."
      - Sort the types by units per box in decreasing order and take as many boxes of each as still fit.
  - id: ac-abc229_c
    role: ladder
    card: extreme-first
    rung: 2
    twist: The goods are cheese in grams, which can be split; the limit is in grams.
    summary: N ≤ 3·10^5 cheeses, B_i grams each with deliciousness A_i per gram; the tastiest pizza with at most W grams.
    hints:
      - Each gram is an independent unit worth A_i. Which grams should be used?
      - "The most delicious grams first (Theorem 1.5.3, part 2)."
      - Sort by A_i in decreasing order and take min(B_i, grams left) of each; long long.
  - id: ac-abc121_c
    role: ladder
    card: extreme-first
    rung: 3
    twist: Minimise a cost instead of maximising a value; the cheapest units come first.
    summary: Buy exactly M ≤ 10^5 cans; store i sells up to B_i cans at A_i yen each; the least total.
    hints:
      - "Mirror the previous rung: which cans should be bought first?"
      - The cheapest cans, store by store in increasing price.
      - Sort stores by price; buy min(B_i, cans still needed) at each; long long.
  - id: ac-abc187_d
    role: ladder
    card: extreme-first
    rung: 4
    twist: The value of choosing a town has to be computed first; it is 2A_i + B_i.
    summary: N ≤ 2·10^5 towns with A_i voters for Aoki and B_i for Takahashi; a speech in a town turns all its voters to Takahashi; the fewest speeches to win.
    hints:
      - Start with no speeches. By how much does a speech in town i change (Takahashi's votes − Aoki's votes)?
      - "By A_i + B_i for Takahashi and A_i less for Aoki: 2A_i + B_i, independent of the other towns."
      - "Start from −ΣA, sort the values 2A_i + B_i in decreasing order and add them until the difference becomes positive."
  - id: cf-158B
    role: ladder
    card: extreme-first
    rung: 5
    twist: The items are groups that must stay together, so the greedy works on counts of each group size.
    summary: Groups of 1 to 4 children must each ride in one taxi of capacity 4; the fewest taxis.
    hints:
      - Which groups can never share a taxi with anything, and which partner should a group of 3 take?
      - "4s ride alone; each 3 takes a 1 if there is one; 2s pair up; a leftover 2 takes up to two 1s; the remaining 1s fill taxis of 4."
      - Count the groups by size and apply the rules in that order; check that each rule only uses seats nothing larger could use.
  - id: lc-assign-cookies
    role: ladder
    card: sorted-matching
    rung: 1
    twist: Base case of the card
    summary: The most children (up to 3·10^4) that can each get one cookie at least as large as their greed.
    hints:
      - Which cookie should the least greedy child get?
      - "The smallest cookie that satisfies it (Theorem 1.5.4)."
      - Sort both lists and walk them with two indices.
  - id: lc-minimize-maximum-pair-sum-in-array
    role: ladder
    card: sorted-matching
    rung: 2
    twist: Pairs are formed within one list, and the largest pair sum is minimised.
    summary: Pair up the n ≤ 10^5 elements of an array (n even) so that the largest pair sum is as small as possible.
    hints:
      - Who should the largest element be paired with?
      - "The smallest: if it were paired with another element b and the smallest with c, swapping partners does not raise the larger of the two sums."
      - Sort and pair a[i] with a[n − 1 − i]; return the largest of these sums.
  - id: ac-abc245_e
    role: ladder
    card: sorted-matching
    rung: 3
    twist: Two conditions (width and length), so one dimension is swept in sorted order and the other is matched in a multiset.
    summary: Put N chocolates into M ≥ N boxes, one per box, with width and length both fitting (no rotation); is it possible?
    hints:
      - Process chocolates from widest to narrowest. Which boxes are wide enough for the current one, and do they stay wide enough for later ones?
      - "Boxes with width at least the current chocolate's width; they remain usable for every narrower chocolate. Among them, the length decides."
      - "Sort chocolates and boxes by width descending; insert the boxes wide enough into a multiset of lengths; give each chocolate the shortest sufficient length (s.lower_bound), or answer No."
  - id: lc-lemonade-change
    role: ladder
    card: left-to-right-forced
    rung: 1
    twist: Base case of the card
    summary: Customers pay 5, 10 or 20 for a 5 lemonade in a fixed order; can every one get exact change from the bills received so far?
    hints:
      - What is the state after each customer?
      - "The numbers of 5 and 10 bills. For a 20, pay change as 10 + 5 if possible, else 5 + 5 + 5: keeping fives dominates keeping tens, since a five pays for more."
      - Simulate with two counters and that choice for 20s.
  - id: ac-abc135_c
    role: ladder
    card: left-to-right-forced
    rung: 2
    twist: Each hero shares two towns with neighbours, so the order of decisions matters.
    summary: N + 1 towns with A_i monsters and N heroes, hero i able to defeat up to B_i monsters in towns i and i + 1; the most monsters defeated.
    hints:
      - Go from the left. Which town should hero 1 help first?
      - "Town 1, which only hero 1 can reach; then the remaining capacity goes to town 2, which leaves more for hero 2 to use further right."
      - For each hero, defeat min(B, A_i) in town i, then min(rest, A_{i+1}) in town i + 1, updating A; long long sum.
  - id: ac-abc116_c
    role: ladder
    card: left-to-right-forced
    rung: 3
    twist: Counting operations, where every rise from one flower to the next forces new operations.
    summary: The fewest operations "add 1 to every flower in [l, r]" that turn N ≤ 100 zero heights into the heights h_i.
    hints:
      - When h_i > h_{i−1}, how many operations must start exactly at flower i?
      - "At least h_i − h_{i−1}: operations covering i but not i − 1 start at i. Extending every operation as far right as possible reaches this bound."
      - "Answer: Σ max(0, h_i − h_{i−1}) with h_0 = 0."
  - id: lc-jump-game
    role: ladder
    card: left-to-right-forced
    rung: 4
    twist: The state is the farthest reachable index, updated position by position.
    summary: From index 0, each value is the longest allowed jump; can the last index (n ≤ 10^4) be reached?
    hints:
      - Which indices are reachable after looking at positions 0..i?
      - "All indices up to a farthest reach; a larger reach dominates a smaller one."
      - "Scan i while i ≤ reach, updating reach = max(reach, i + nums[i]); answer whether reach ≥ n − 1."
  - id: ac-abc318_c
    role: worked_example
    summary: An N-day trip with fares F_i; one-day passes are sold in batches of D for P yen; the least total cost.
  - id: cses-2183
    role: worked_example
    summary: The smallest positive sum that no subset of n ≤ 2·10^5 coins (values ≤ 10^9) can make.
  - id: ac-abc117_c
    role: drill
    summary: N pieces must visit M distinct points on a line (moving one step at a time); the fewest moves.
  - id: ac-abc136_c
    role: drill
    summary: Each of N squares may be lowered by 1 once; can the heights be made non-decreasing?
  - id: ac-abc396_c
    role: drill
    summary: Choose black and white balls with values (negative allowed) so that at least as many black as white are chosen; the largest total.
  - id: ac-abc271_c
    role: drill
