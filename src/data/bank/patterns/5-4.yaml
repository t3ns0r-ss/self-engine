# Patterns for topic 5.4 (Square-root decomposition, Mo's algorithm). Provisional until the lesson maps them to Recognition Cards.
topic: "5.4"
patterns:
  - id: blocks
    name: Blocks of size √n
    description: Split the array into blocks of about √n with a summary per block; updates touch one block, queries touch O(√n) blocks and items.
    precondition: A block's summary can be rebuilt in O(√n) and queried in O(1).
  - id: mo
    name: Offline queries with add and remove
    description: Order range queries by (block of l, r) and move the two ends, adding and removing one element at a time.
    precondition: Queries are offline, and adding or removing one element updates the answer in O(1) or close to it.
  - id: threshold-split
    name: Small versus large parameter
    description: Handle small parameters (below √n) with a table and large ones directly, because there are few large ones or each has few steps.
    precondition: Work for a parameter k is about n / k when large and fits in an O(n·√n) table when small.
