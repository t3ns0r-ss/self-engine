  - For each restriction, build the bit mask of the roads on its path (walk up from both ends to the lowest
    common ancestor); the union is the OR of the masks, over 2^20 subsets.
- id: cf-1516D
  role: drill
  summary: 'An array of n ≤ 10^5 numbers up to 10^5 and q ≤ 10^5 questions [l, r]: the fewest pieces into
