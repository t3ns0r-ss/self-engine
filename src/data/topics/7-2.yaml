drill:
- problem: lc-maximum-number-of-jumps-to-reach-the-last-index
  answer:
    topic: '7.2'
    card: longest-path
  property: All jumps go to a larger index, so the indices in order are a topological order and dp[j]
    = max dp[i] + 1 over valid i < j; -1 for unreachable.
  why_others_fail: A search over jump sequences is exponential; the graph has no cycle, so one pass gives
    the best.
- problem: lc-integer-replacement
  answer:
    topic: '7.2'
    card: state-dag
  property: 'Memoise f(n) on a map: for an even n it is 1 + f(n/2), for an odd n it is 1 + min(f(n − 1),
    f(n + 1)); only O(log n) values appear.'
  why_others_fail: A table up to n has 2^31 entries; breadth-first search from n visits too many numbers.
- problem: cf-1517D
  answer:
    topic: '7.2'
    card: state-dag
  property: 'A walk of k edges that returns uses every edge twice, so k/2 steps out are enough: dp[s][cell]
    over s ≤ k/2, answer 2·dp[k/2][cell]; -1 for odd k.'
  why_others_fail: A search over walks of length k is exponential, and Dijkstra does not count steps.
- problem: lc-sort-integers-by-the-power-value
  answer:
    topic: '3.2'
    card: memo-recursion
  property: Each number depends on the next one of its chain, so the steps are memoised in a table or
    a map and then the numbers are sorted by (power, value).
  why_others_fail: Counting every chain from scratch is slow only for large ranges, but the sort still
    needs the power for each number; no graph is needed.
- problem: lc-shopping-offers
  answer:
    topic: '3.2'
    card: memo-recursion
  property: 'The state is the vector of remaining needs (at most 7^6 vectors): memoise the cheapest price
    for it, try each offer that does not exceed the needs, or buy the rest alone.'
  why_others_fail: 'There are no ordered prerequisites or edges to a given graph: the states are made
    from the needs and the memo recursion is the plain tool.'
- problem: lc-ugly-number-ii
  answer:
    topic: '0.6'
    card: heap-extract
  property: Take the smallest number from a min-heap, push 2x, 3x, 5x (skipping repeats), and the n-th
    number taken is the answer.
  why_others_fail: Testing each integer for being ugly is too slow for large gaps; the sequence is generated
    in order and no best value over paths is asked.
- problem: lc-2-keys-keyboard
  answer:
    topic: '2.1'
    card: spf-factorise
  property: 'The answer is the sum of the prime factors of n counted with multiplicity: a factor p costs
    one copy and p − 1 pastes, p steps.'
  why_others_fail: A DP over lengths works, but the sum of the prime factors is O(√n) with no table at
    all.
- problem: lc-all-possible-full-binary-trees
  answer:
    topic: '3.2'
    card: memo-recursion
  property: 'Memoise by n the list of trees: for odd n split n − 1 nodes into odd left and right parts
    and combine every left tree with every right tree.'
  why_others_fail: 'The output is the list of trees, not one number: a DP over counts gives no trees.'
lookalike_pairs:
- a: lc-shortest-distance-after-road-addition-queries-ii
  b: lc-shortest-distance-after-road-addition-queries-i
  a_tool:
    topic: '0.6'
    card: ordered-set-lookup
  b_tool:
    topic: '7.2'
    card: longest-path
  shared_surface: Both start from a line of cities with roads i → i + 1, add roads one at a time and ask
    for the shortest distance from the first to the last city after each query.
  flipping_difference: In version I there are at most 500 cities and queries, so one pass of the DP in
    the order of the cities after each query costs O(q · (n + q)). In version II there are up to 10^5
    and no two added roads cross, so the cities skipped by a road can be removed from an ordered set,
    and the answer is its size minus 1.
  flipping_input: 'n = q = 10^5: 10^5 passes of 2·10^5 steps are 2·10^10 steps, against O((n + q) log
    n) with the set.'
- a: lc-minimum-number-of-days-to-eat-n-oranges
  b: lc-minimum-number-of-operations-to-make-x-and-y-equal
  a_tool:
    topic: '7.2'
    card: state-dag
  b_tool:
    topic: '4.1'
    card: state-graph
  shared_surface: Both ask for the fewest moves to turn one number into another with moves that divide
    by a small number or change the number by 1.
  flipping_difference: 'In the oranges problem every useful move makes the number smaller and n goes up
    to 2·10^9, so a memo on the values f(n) = 1 + min(n % 2 + f(n/2), n % 3 + f(n/3)) visits O(log² n)
    states. In the second problem moves can also add 1, so the states can go up and down and form cycles:
    a breadth-first search over the small range of numbers is the tool.'
  flipping_input: 'n = 2·10^9: a breadth-first search over the numbers has 2·10^9 states, against 257
    numbers for the memo.'
self_test:
- q: Run Kahn's algorithm (Theorem 7.2.1) on the edges 0→1, 0→2, 1→3, 2→3. Give an order and the longest
    path ending at each vertex, by edges.
  a: In-degrees 0, 1, 1, 2. The order 0, 1, 2, 3; longest path ending at 0, 1, 2, 3 is 0, 1, 1, 2.
- q: A graph has the edges 0→1, 1→2, 2→1. What does Kahn's algorithm take, and what does that say?
  a: Only the vertex 0 has in-degree 0; after taking it the vertex 1 still has an edge from 2. So 1 of
    3 vertices is taken, which says there is a cycle and the DP has no order.
- q: Count the paths from 0 to 3 in the DAG 0→1, 0→2, 1→3, 2→3, 0→3 (Theorem 7.2.2).
  a: ways[0] = 1, ways[1] = 1, ways[2] = 1, ways[3] = ways[1] + ways[2] + ways[0] = 3.
- q: The pairs (best, count) of the tails of a vertex are (5, 2), (5, 3), (4, 10), and the edge weights
    are 0. What is the pair of the vertex?
  a: 'The best is 5, reached by the first two tails: the count is 2 + 3 = 5. The tail with 4 is worse
    and its count is dropped: (5, 5).'
- q: Why is the second pass of Kosaraju run on the reversed graph in the order of the first pass, and
    in which order do the components come out?
  a: The vertex that finishes last in the first pass lies in a source component; its component in the
    reversed graph reaches only vertices of its own component. So each search collects exactly one component,
    and the components come out in topological order of the condensation.
- q: For n = 7, compute days(7) with days(n) = 1 + min(n % 2 + days(n/2), n % 3 + days(n/3)), days(0)
    = 0, days(1) = 1.
  a: days(7) = 1 + min(1 + days(3), 1 + days(2)). days(3) = 1 + min(1 + days(1), 0 + days(1)) = 2, days(2)
    = 1 + min(0 + days(1), 2 + days(0)) = 2. So days(7) = 1 + min(3, 3) = 4.
- q: A walk may visit a vertex twice in a strongly connected component. Why can the coin collector take
    all coins of a component?
  a: Every vertex of a component reaches every other, so a walk can visit them all and come back to the
    exit; each room pays once, so the component gives the sum of its coins.
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-1472G
  - lc-number-of-ways-of-cutting-a-pizza
  - lc-length-of-longest-v-shaped-diagonal-segment
decision_map:
- weak_signal: The longest, heaviest or cheapest path, or the time to finish tasks, in a graph without
    cycles (or where every move goes to a larger value, position or time)
  choose: longest-path
  when: There is no directed cycle, or moves go to a larger number or a smaller measure, and the best
    value at a vertex depends on its tails (Theorem 7.2.1).
  over:
  - card: dijkstra
    topic: '4.3'
    because: With cycles and non-negative weights the order is found while searching; without cycles an
      order is known and negative weights are fine.
  - card: dependency-order
    topic: '4.2'
    because: Only an order or a cycle test is asked, with no values.
- weak_signal: The number of paths or ways to go from one vertex to another in a graph without cycles,
    or the number of ways that reach the best value
  choose: count-paths
  when: The count at a vertex is the sum of the counts at its tails, in a topological order; with a best
    value keep the pair (value, count) (Theorem 7.2.2).
  over:
  - card: longest-path
    topic: '7.2'
    because: Only the best value is asked, not the number of ways.
  - card: every-pair
    topic: '4.3'
    because: Counting paths between all pairs of a graph with cycles is a matrix power, not a DP.
- weak_signal: A directed graph with cycles where a walk may use vertices again and again, and the value
    is a sum over the visited vertices or edges
  choose: condensation-dp
  when: Every vertex of a component can be reached from every other, so the component is one unit; the
    components form a DAG (Theorem 7.2.3).
  over:
  - card: mutual-reach
    topic: '4.7'
    because: Only the components or whether two vertices reach each other is asked; no value over the
      DAG.
  - card: path-mask
    topic: '3.7'
    because: A path that may visit each vertex once is a bitmask DP, not a condensation.
- weak_signal: A process with a state made of a few numbers (position and last jump, city and fuel, a
    size) and moves that always shrink or grow one of them, with a very large range
  choose: state-dag
  when: Every move goes to a state with a smaller measure, so a memoised search over the states has no
    cycle, and only a few states are reached (Theorem 7.2.4).
  over:
  - card: state-graph
    topic: '4.1'
    because: 'If moves can go back, the states have cycles: breadth-first search for the fewest moves.'
  - card: recursive-choices
    topic: '0.5'
    because: Without memoisation the same state is solved again and again.
