# Patterns for topic 7.4 (Greedy II: priority-queue greedy, regret greedy). Provisional until the lesson maps them to Recognition Cards.
topic: "7.4"
patterns:
  - id: deadline-heap
    name: Choose, then drop the worst
    description: Take items in order of deadline or time and keep a heap of chosen ones, dropping the worst whenever a limit is exceeded.
    precondition: Removing the worst chosen item always restores feasibility at the smallest possible loss.
  - id: regret
    name: Undoable choices
    description: Take the best option now but insert an "undo" item (with the opposite value) so that a later, better decision can reverse it.
    precondition: Every reversal corresponds to a valid change of the solution, so the heap explores all improving exchanges.
  - id: merge-smallest
    name: Merge the two smallest
    description: Repeatedly combine the two smallest items (merging piles, optimal prefix codes).
    precondition: An optimal merge tree exists in which the two smallest items are siblings at the deepest level.
  - id: sweep-with-heap
    name: Sweep plus heap of available items
    description: Sweep through time or values, add items as they become available, and take the best available item from a heap.
    precondition: Items become available in sorted order, and the best available item can be taken without hurting the future.
