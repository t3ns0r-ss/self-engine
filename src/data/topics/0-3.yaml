drill:
- problem: ac-abc392_c
  answer:
    topic: '0.3'
    card: direct-simulation
  property: 'Follow the description one lookup at a time: build wearer[Q_i] = i, then the answer for bib
    b is Q[P[wearer[b]]]; N steps of O(1).'
  why_others_fail: 'No grid, no string to scan, and nothing to split into cases: the work is following
    the stated links, which an inverse array makes cheap.'
- problem: ac-abc322_c
  answer:
    topic: '0.3'
    card: direct-simulation
  property: 'Walk the days from N down to 1, keeping the next fireworks day: each day costs O(1).'
  why_others_fail: Walking forward from every day separately can take O(N²) steps when fireworks are rare.
    No case split decides it.
- problem: ac-abc265_c
  answer:
    topic: '0.3'
    card: grid-processing
  property: Follow the arrows with a bounds check before each move; there are only H·W squares, so a walk
    of more than H·W moves has repeated a square and loops forever (Theorem 0.3.1).
  why_others_fail: Stepping without a limit never ends on a loop; a formula cannot predict the arrows.
- problem: ac-abc297_c
  answer:
    topic: '0.3'
    card: grid-processing
  property: Scan each row left to right and replace TT by PC as soon as it appears; taking the leftmost
    pair never blocks a better choice.
  why_others_fail: Trying every set of pairs is exponential; there is nothing to repeat over time.
- problem: ac-abc380_c
  answer:
    topic: '0.3'
    card: string-processing
  property: One scan finds the start and end of every block of 1s; then the answer is built by copying
    pieces of S.
  why_others_fail: Moving characters one at a time is quadratic; the definition gives the result string
    directly.
- problem: ac-abc394_c
  answer:
    topic: '0.3'
    card: string-processing
  property: 'Scan from right to left: whenever position i holds W and i + 1 holds A, write AC there; a
    new A at i can only create a WA with i − 1, which the scan meets next.'
  why_others_fail: Repeating "find the leftmost WA" from scratch costs O(n) per replacement, O(n²) in
    total.
- problem: ac-abc239_c
  answer:
    topic: '0.3'
    card: case-analysis
  property: 'A point at distance √5 differs by (±1, ±2) or (±2, ±1): try the 8 points around the first
    and check the squared distance to the second.'
  why_others_fail: The coordinates go up to 10^9, so no grid can be scanned; there are only 8 candidates.
- problem: cf-1676C
  answer:
    topic: '0.3'
    card: string-processing
  property: 'For each pair of words, add |a_i − b_i| over the m letters: 50·49/2 pairs times 8 letters.'
  why_others_fail: 'No process to run and no cases to split: a direct scan of each pair fits the small
    limits.'
- problem: ac-abc189_c
  answer:
    topic: '0.2'
    card: budget-from-constraints
  property: 'N ≤ 10^4, so all pairs (l, r) cost 5·10^7 steps: for each l, extend r keeping the running
    minimum and multiply it by the length.'
  why_others_fail: 'Looks like a grid or a string scan, but the deciding fact is the budget: N² fits.'
- problem: ac-abc419_c
  answer:
    topic: '0.2'
    card: closed-form
  property: With 8-direction moves, time to meet is max(⌈(max R − min R)/2⌉, ⌈(max C − min C)/2⌉).
  why_others_fail: 'Looks like a grid walk, but the grid is 10^9 by 10^9: stepping is impossible, and
    the answer depends only on the extreme rows and columns.'
