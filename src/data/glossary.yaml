# Glossary (PLAN.md Section 5.1). Terms are added by the lesson that first defines them.
- term: "window"
  definition: "A subarray the algorithm is currently looking at, described by its two ends l and r. The empty window has l = r + 1."
  topic: "1.3"
- term: "pointer"
  definition: "In two-pointer methods, an integer variable holding an index into an array (not a C++ pointer type)."
  topic: "1.3"
- term: "two pointers"
  definition: "The method of keeping two indices into one or two arrays and moving each in only one direction, so the total number of moves is linear."
  topic: "1.3"
- term: "sliding window"
  definition: "A window whose two ends both move right as the algorithm runs."
  topic: "1.3"
- term: "validity condition"
  definition: "A yes/no property of windows given by the problem, such as 'the sum is at most K'. A window with the property is valid."
  topic: "1.3"
- term: "sub-window"
  definition: "A window [l', r'] lying inside [l, r], that is l ≤ l' and r' ≤ r (possibly empty)."
  topic: "1.3"
- term: "closed under shrinking"
  definition: "A validity condition is closed under shrinking if every sub-window of a valid window is also valid."
  topic: "1.3"
- term: "closed under extension"
  definition: "A validity condition is closed under extension if every window containing a valid window is also valid; equivalently, its opposite is closed under shrinking."
  topic: "1.3"
- term: "amortised analysis"
  definition: "Bounding the total cost of a sequence of steps instead of each step alone, for example by counting how far a pointer can move in total."
  topic: "0.2"
- term: "subsequence"
  definition: "A sequence obtained from another by deleting some elements without changing the order of the rest."
  topic: "1.3"
- term: "CP"
  expansion: "competitive programming"
  definition: "Solving well-defined algorithmic problems under time and memory limits, judged automatically."
  topic: "0.1"
- term: "compiler"
  definition: "A program that turns source code into a program the computer can run, or reports a compile error."
  topic: "0.1"
- term: "online judge"
  definition: "A website that compiles a submission, runs it on hidden tests, and compares its output with the expected output."
  topic: "0.1"
- term: "standard input"
  definition: "The text a program reads (cin in C++); judges supply the test there. Standard output (cout) is where the answer is written."
  topic: "0.1"
- term: "verdict"
  definition: "The judge's result for a submission: AC, WA, TLE, MLE, RE, or CE."
  topic: "0.1"
- term: "AC"
  expansion: "Accepted"
  definition: "Verdict: correct on every test."
  topic: "0.1"
- term: "WA"
  expansion: "Wrong Answer"
  definition: "Verdict: some output differs from the expected output."
  topic: "0.1"
- term: "TLE"
  expansion: "Time Limit Exceeded"
  definition: "Verdict: the program ran longer than the time limit."
  topic: "0.1"
- term: "MLE"
  expansion: "Memory Limit Exceeded"
  definition: "Verdict: the program used more memory than allowed."
  topic: "0.1"
- term: "RE"
  expansion: "Runtime Error"
  definition: "Verdict: the program crashed, for example by reading outside an array or dividing by zero."
  topic: "0.1"
- term: "CE"
  expansion: "Compilation Error"
  definition: "Verdict: the source did not compile."
  topic: "0.1"
- term: "test case"
  definition: "One complete input instance. A multi-test input holds several, usually preceded by their count t."
  topic: "0.1"
- term: "bit"
  definition: "A binary digit, 0 or 1. A b-bit integer type has 2^b possible values."
  topic: "0.1"
- term: "signed type"
  definition: "An integer type holding negative and positive values (int, long long); an unsigned type holds only values ≥ 0."
  topic: "0.1"
- term: "overflow"
  definition: "When the exact result of an arithmetic step does not fit its type. For signed types the result is undefined in C++."
  topic: "0.1"
- term: "integer division"
  definition: "C++ a / b for integers: the quotient truncated toward zero. The remainder a % b satisfies a == (a / b) * b + a % b."
  topic: "0.1"
- term: "floor"
  definition: "The largest integer at most x, written ⌊x⌋. The ceiling ⌈x⌉ is the smallest integer at least x."
  topic: "0.1"
- term: "floating-point number"
  definition: "An approximate real number (C++ double) with 53 significant bits; integers above 2^53 are not all exact."
  topic: "0.1"
- term: "integer square root"
  definition: "The largest integer whose square is at most x, that is ⌊√x⌋."
  topic: "0.1"
- term: "step"
  definition: "One simple operation (arithmetic, comparison, array access, assignment). Running time is counted in steps."
  topic: "0.2"
- term: "big-O"
  definition: "f(n) = O(g(n)) if f(n) ≤ c·g(n) for some constant c and all large n: f grows at most as fast as g, up to a constant factor."
  topic: "0.2"
- term: "complexity class"
  definition: "The function g in a bound O(g(n)), such as O(1), O(log n), O(n), O(n log n), O(n²), O(2^n)."
  topic: "0.2"
- term: "budget"
  definition: "The number of steps that fit in the time limit: about 10^8 simple steps per second."
  topic: "0.2"
- term: "closed form"
  definition: "A formula that gives the value of a sum (or other repeated computation) without performing every step."
  topic: "0.2"
- term: "harmonic sum"
  definition: "H_n = 1 + 1/2 + … + 1/n, at most 1 + ln n. Loops over multiples cost about n·H_n steps."
  topic: "0.2"
- term: "divisor"
  definition: "A positive integer d with N mod d = 0. Divisors come in pairs (d, N/d), one of them at most √N."
  topic: "0.2"
- term: "simulation"
  definition: "A program that carries out a described process step by step, keeping the process's state in variables."
  topic: "0.3"
- term: "state"
  definition: "All the values that determine what a process does next."
  topic: "0.3"
- term: "deterministic"
  definition: "A process is deterministic if its next state depends only on its current state."
  topic: "0.3"
- term: "eventually periodic"
  definition: "A sequence that, from some index μ on, repeats with a period λ ≥ 1: x(i + λ) = x(i) for all i ≥ μ."
  topic: "0.3"
- term: "pigeonhole principle"
  definition: "If more than K objects are put into K boxes, some box holds at least two."
  topic: "0.3"
- term: "grid"
  definition: "An H by W array of cells (r, c) with 0 ≤ r < H and 0 ≤ c < W; 4-neighbours share a side, 8-neighbours a side or a corner."
  topic: "0.3"
- term: "direction array"
  definition: "Arrays of row and column changes, one entry per direction, so that all neighbours are handled by one loop."
  topic: "0.3"
- term: "one-pass scan"
  definition: "Reading a string or array once from left to right while updating a small, fixed set of variables."
  topic: "0.3"
- term: "case analysis"
  definition: "Splitting all possible inputs into cases that together cover everything and solving each case by its own rule."
  topic: "0.3"
- term: "divides"
  definition: "a divides b (written a | b) if b = k·a for some integer k."
  topic: "0.4"
- term: "multiple"
  definition: "b is a multiple of a if b = k·a for some integer k; 0 is a multiple of every integer."
  topic: "0.4"
- term: "remainder"
  definition: "For m > 0, a mod m is the unique r with 0 ≤ r < m and a = q·m + r. C++'s a % m is negative when a is negative."
  topic: "0.4"
- term: "congruent"
  definition: "a ≡ b (mod m) if m divides a − b, that is if a and b have the same remainder modulo m."
  topic: "0.4"
- term: "parity"
  definition: "Whether an integer is even (divisible by 2) or odd."
  topic: "0.4"
- term: "invariant"
  definition: "A quantity that no step of a process changes, such as the parity of a count when every step changes it by 2."
  topic: "0.4"
- term: "GCD"
  expansion: "greatest common divisor"
  definition: "The largest integer dividing both numbers; gcd(a, 0) = |a|."
  topic: "0.4"
- term: "coprime"
  definition: "Two integers are coprime if their GCD is 1."
  topic: "0.4"
- term: "LCM"
  expansion: "least common multiple"
  definition: "The smallest positive integer that is a multiple of both numbers; lcm(a, b) = a / gcd(a, b) · b."
  topic: "0.4"
- term: "Euclidean algorithm"
  definition: "Computes gcd(a, b) by replacing (a, b) with (b, a mod b) until the second number is 0; O(log) steps."
  topic: "0.4"
- term: "search space"
  definition: "The set of all candidates that might be the answer to a problem."
  topic: "0.5"
- term: "brute force"
  definition: "Exhaustive search: checking every candidate in the search space and keeping the best or the first that passes."
  topic: "0.5"
- term: "bitmask"
  definition: "An integer used as a set: element i belongs to it exactly when bit i is 1, tested with (mask >> i) & 1."
  topic: "0.5"
- term: "permutation"
  definition: "An arrangement of all elements of a list in some order; n different elements have n! permutations."
  topic: "0.5"
- term: "lexicographic order"
  definition: "Comparing sequences at the first position where they differ, as words in a dictionary."
  topic: "0.5"
- term: "recursion"
  definition: "A function calling itself on a smaller problem, with a base case that stops without a further call."
  topic: "0.5"
- term: "base case"
  definition: "The smallest case of a recursive function, solved directly without calling itself."
  topic: "0.5"
- term: "STL"
  expansion: "Standard Template Library"
  definition: "The part of the C++ standard library with containers (vector, set, map, …) and algorithms."
  topic: "0.6"
- term: "container"
  definition: "An object that stores a collection of elements, such as vector<int> or set<int>."
  topic: "0.6"
- term: "iterator"
  definition: "A pointer-like object to one element of a container; *it is the element, ++it the next one, c.end() the position past the last."
  topic: "0.6"
- term: "ordered set"
  definition: "C++ set: distinct values kept in increasing order, with insert, erase and lookups in O(log n)."
  topic: "0.6"
- term: "multiset"
  definition: "An ordered set that allows repeated values; erase(x) removes every copy, erase(find(x)) one copy."
  topic: "0.6"
- term: "map"
  definition: "C++ map: pairs (key, value) with distinct keys, ordered by key; cnt[x] inserts x with value 0 if missing."
  topic: "0.6"
- term: "hash table"
  definition: "unordered_set and unordered_map: elements in buckets chosen by a hash of the value; O(1) operations on average, no order."
  topic: "0.6"
- term: "stack"
  definition: "A container where only the most recently added element can be read or removed (last in, first out)."
  topic: "0.6"
- term: "queue"
  definition: "A container where elements leave in the order they arrived (first in, first out)."
  topic: "0.6"
- term: "deque"
  definition: "A double-ended queue: elements can be added and removed at both ends in O(1)."
  topic: "0.6"
- term: "priority queue"
  definition: "A container that gives the largest element in O(1) and inserts or removes the largest in O(log n)."
  topic: "0.6"
- term: "heap"
  definition: "A tree stored in an array in which every parent is at least as large as its children; it implements a priority queue."
  topic: "0.6"
- term: "non-decreasing"
  definition: "A sequence is non-decreasing (sorted) if i < j implies a[i] ≤ a[j]; a function f on indices is non-decreasing if i < j implies f(i) ≤ f(j). Non-increasing is the same with ≥."
  topic: "1.1"
- term: "merging"
  definition: "Producing one sorted sequence from two sorted sequences, by repeatedly taking the smaller front element."
  topic: "1.1"
- term: "merge sort"
  definition: "Sorting an array by sorting its two halves by the same method and merging them; O(n log n) comparisons."
  topic: "1.1"
- term: "order-free"
  definition: "A question about a list is order-free if shuffling the list never changes the answer; such a question may be asked about the sorted list."
  topic: "1.1"
- term: "comparator"
  definition: "A function less(x, y) telling sort when x must come before y."
  topic: "1.1"
- term: "strict weak ordering"
  definition: "A comparator that is irreflexive (less(x, x) is false), transitive, and whose equivalence (neither less(x, y) nor less(y, x)) is transitive. sort requires one; a comparator written with <= is not."
  topic: "1.1"
- term: "stable sort"
  definition: "A sort that keeps equivalent elements in their original relative order, such as merge sort or std::stable_sort."
  topic: "1.1"
- term: "rank"
  definition: "The rank of a value in a collection is the number of distinct values in the collection smaller than it."
  topic: "1.1"
- term: "coordinate compression"
  definition: "Replacing every value by its rank, which keeps all comparisons and makes the values small enough to index an array."
  topic: "1.1"
- term: "event"
  definition: "A pair (time, change) marking where a quantity changes, such as the start or end of an interval."
  topic: "1.1"
- term: "sweep"
  definition: "Processing events in sorted order while keeping the current value of the quantity they change."
  topic: "1.1"
- term: "subarray"
  definition: "A run of consecutive elements a[l], a[l+1], …, a[r] of an array, written [l, r] with both ends included. Also called a segment."
  topic: "1.2"
- term: "prefix sum"
  definition: "P[k] = a[0] + … + a[k−1], the sum of the first k elements, with P[0] = 0. Suffix sums are the same from the other end."
  topic: "1.2"
- term: "range sum"
  definition: "The sum of a subarray a[l] + … + a[r]; with prefix sums it is P[r+1] − P[l]."
  topic: "1.2"
- term: "difference array"
  definition: "d[0] = a[0] and d[i] = a[i] − a[i−1]; adding v on [l, r] changes only d[l] and d[r+1], and the running sum of d gives back a."
  topic: "1.2"
- term: "offline"
  definition: "A problem is offline if all its operations are known before any answer is needed, so they may be processed in any order; online problems must answer each query before reading the next."
  topic: "1.2"
- term: "2D prefix sum"
  definition: "S[x][y], the sum of the cells in rows 0..x−1 and columns 0..y−1 of a grid; any rectangle sum is a signed combination of four of them."
  topic: "1.2"
- term: "prefix maximum"
  definition: "M[k] = max(a[0], …, a[k−1]), computed by M[k+1] = max(M[k], a[k]); prefix minima and suffix maxima and minima are defined the same way."
  topic: "1.2"
- term: "predicate"
  definition: "A function that answers each element of a range (often integers) with true or false, such as p(i) = (a[i] ≥ 5)."
  topic: "1.4"
- term: "monotone predicate"
  definition: "A predicate that stays true once it becomes true: false, …, false, true, …, true. Binary search needs one."
  topic: "1.4"
- term: "binary search"
  definition: "Finding the first true position of a monotone predicate by testing the middle of the remaining range and keeping the half that can contain it; O(log n) tests."
  topic: "1.4"
- term: "lower bound"
  definition: "In a sorted array, the first index i with a[i] ≥ x (n if none); it equals the number of elements less than x. Returned by std::lower_bound."
  topic: "1.4"
- term: "upper bound"
  definition: "In a sorted array, the first index i with a[i] > x (n if none); it equals the number of elements at most x. Returned by std::upper_bound."
  topic: "1.4"
- term: "feasibility check"
  definition: "A predicate ok(x) answering \"can the job be done with answer x?\" for an optimisation problem."
  topic: "1.4"
- term: "search on the answer"
  definition: "Binary search over the possible answers x of an optimisation problem, using a monotone feasibility check."
  topic: "1.4"
- term: "greedy algorithm"
  definition: "An algorithm that builds a solution by a sequence of choices, each made by a fixed rule from the current situation and never revised. It needs a proof: most plausible greedy rules are wrong."
  topic: "1.5"
- term: "counterexample"
  definition: "A concrete input on which a rule or claim gives a wrong answer."
  topic: "1.5"
- term: "exchange argument"
  definition: "A proof that a greedy rule is optimal: change any optimal solution step by step, never making it worse, until it becomes the greedy solution (for example by swapping adjacent items that are out of key order)."
  topic: "1.5"
- term: "inversion"
  definition: "For an order of items and a key, a pair of items in which the one with the larger key comes first."
  topic: "1.5"
- term: "greedy stays ahead"
  definition: "A proof method: show by induction that after each step the greedy solution is at least as good, in a measured sense, as any other solution after the same number of steps."
  topic: "1.5"
- term: "dominates"
  definition: "State A dominates state B if every way to finish from B can also be used from A, with a result at least as good."
  topic: "1.5"
- term: "next greater element"
  definition: "For position i, the nearest position j > i with a[j] > a[i]; previous greater and next/previous smaller elements are defined the same way."
  topic: "1.6"
- term: "monotonic stack"
  definition: "A stack whose values from bottom to top only decrease (or only increase); scanning an array with one finds every nearest greater or smaller element in O(n)."
  topic: "1.6"
- term: "span"
  definition: "For minima, the longest subarray around position i in which a[i] is a minimum: from just after the previous smaller element to just before the next smaller element."
  topic: "1.6"
- term: "monotonic deque"
  definition: "A deque whose values from front to back only decrease (or only increase); it gives the maximum (or minimum) of a sliding window in O(1) amortised per step."
  topic: "1.6"
- term: "dominated"
  definition: "In a window that moves right, an element is dominated if a later element of the window is at least as large; it can never again be the window's maximum."
  topic: "1.6"
- term: "bitwise operator"
  definition: "An operator that applies a rule to each bit position separately: AND (&), OR (|), exclusive or (^) and NOT (~)."
  topic: "1.7"
- term: "XOR"
  expansion: "exclusive or"
  definition: "The bitwise operator whose result has bit b set exactly when one of the two operands has it; written ^ in C++ and ⊕ in formulas. Every value is its own inverse: x ⊕ x = 0."
  topic: "1.7"
- term: "prefix XOR"
  definition: "P_0 = 0 and P_i = a_1 ⊕ … ⊕ a_i; the XOR of a_l..a_r is P_r ⊕ P_(l−1)."
  topic: "1.7"
- term: "popcount"
  definition: "The number of 1 bits of a non-negative integer; __builtin_popcount in C++ (__builtin_popcountll for long long)."
  topic: "1.7"
- term: "lowest set bit"
  definition: "For x > 0, the value 2^b of the lowest bit b that is 1 in x; computed as x & -x."
  topic: "1.7"
- term: "prime"
  definition: "An integer p ≥ 2 whose only positive divisors are 1 and p."
  topic: "2.1"
- term: "composite"
  definition: "An integer n ≥ 2 that is not prime: it has a divisor d with 1 < d < n."
  topic: "2.1"
- term: "prime factorisation"
  definition: "n = p_1^e_1 · … · p_k^e_k with primes p_1 < … < p_k; every n ≥ 2 has exactly one."
  topic: "2.1"
- term: "sieve of Eratosthenes"
  definition: "Finds all primes up to N by crossing off the multiples of each prime, starting at p²; O(N log log N)."
  topic: "2.1"
- term: "smallest prime factor"
  definition: "spf(x), the smallest prime dividing x ≥ 2. A table of it up to N factorises any x ≤ N in at most log₂ x divisions."
  topic: "2.1"
- term: "trial division"
  definition: "Factorising one number n by trying divisors d = 2, 3, … while d² ≤ n; the leftover n > 1 is a prime factor."
  topic: "2.1"
- term: "extended Euclidean algorithm"
  definition: "Computes g = gcd(a, b) together with integers x, y such that ax + by = g."
  topic: "2.1"
- term: "Bézout coefficients"
  definition: "Integers x, y with ax + by = gcd(a, b). The equation ax + by = c has integer solutions exactly when gcd(a, b) divides c."
  topic: "2.1"
- term: "binary exponentiation"
  definition: "Computing a^b mod m by squaring: read the bits of b, square the base at each bit, multiply it in where the bit is 1; O(log b) multiplications."
  topic: "2.2"
- term: "modular inverse"
  definition: "An x with a·x ≡ 1 (mod m), written a^(−1) mod m. It exists exactly when gcd(a, m) = 1; modulo a prime p it is a^(p−2) mod p."
  topic: "2.2"
- term: "Fermat's little theorem"
  definition: "For a prime p not dividing a, a^(p−1) ≡ 1 (mod p)."
  topic: "2.2"
- term: "fraction modulo a prime"
  definition: "A rational answer P/Q printed modulo a prime p is P·Q^(−1) mod p; sums, products and quotients of fractions can be computed this way step by step."
  topic: "2.2"
- term: "product rule"
  definition: "If an object is built by k choices with m_1, …, m_k options each (the counts not depending on earlier choices), there are m_1·…·m_k objects. Disjoint cases add (sum rule)."
  topic: "2.3"
- term: "factorial"
  definition: "n! = 1·2·…·n, with 0! = 1: the number of orders of n different elements."
  topic: "2.3"
- term: "binomial coefficient"
  definition: "C(n, r), the number of subsets of size r of n elements: n!/(r!(n − r)!), and 0 when r < 0 or r > n."
  topic: "2.3"
- term: "multinomial coefficient"
  definition: "n!/(c_1!·…·c_k!): the number of arrangements of a list with c_i copies of value i."
  topic: "2.3"
- term: "stars and bars"
  definition: "Splitting n identical items into k labelled groups: C(n + k − 1, k − 1) ways, or C(n − 1, k − 1) if every group gets at least one."
  topic: "2.3"
- term: "inclusion–exclusion"
  definition: "Counting the elements with none of several properties as the sum over all sets S of properties of (−1)^|S| times the number with all properties in S."
  topic: "2.3"
- term: "bijection"
  definition: "A one-to-one correspondence between two sets; sets in bijection have the same size, so a hard count can be replaced by an easy one."
  topic: "2.3"
- term: "lattice path"
  definition: "A walk on integer points with unit steps right or up; there are C(a + b, a) of them from (0, 0) to (a, b)."
  topic: "2.3"
- term: "probability space"
  definition: "A finite set of outcomes with probabilities that add up to 1; an event is a set of outcomes, and its probability is the sum of theirs."
  topic: "2.4"
- term: "random variable"
  definition: "A number attached to each outcome of a random experiment, such as the sum of two dice."
  topic: "2.4"
- term: "expected value"
  definition: "E[X] = Σ X(ω)·P(ω), the probability-weighted average of a random variable."
  topic: "2.4"
- term: "indicator"
  definition: "The random variable 1_A that is 1 when event A happens and 0 otherwise; E[1_A] = P(A)."
  topic: "2.4"
- term: "independent"
  definition: "Events A and B with P(A and B) = P(A)·P(B), such as separate dice rolls."
  topic: "2.4"
- term: "linearity of expectation"
  definition: "E[X + Y] = E[X] + E[Y] for any random variables, dependent or not; so an expected count is the sum of the probabilities of the events counted."
  topic: "2.4"
- term: "contribution technique"
  definition: "Computing a total over all configurations as the sum over elements of value × the number of configurations in which the element counts."
  topic: "2.4"
- term: "coupon collector"
  definition: "Drawing uniformly from n kinds until all have appeared takes n·(1 + 1/2 + … + 1/n) draws on average."
  topic: "2.4"
- term: "partial solution"
  definition: "The first few choices of a recursion over choices, such as the columns of the queens placed in the first rows."
  topic: "3.1"
- term: "search tree"
  definition: "The tree of calls of a recursion: one node per call, the children of a node being the calls it makes."
  topic: "3.1"
- term: "backtracking"
  definition: "Recursion that extends a partial solution one choice at a time, tests it, and undoes the choice when the call returns."
  topic: "3.1"
- term: "pruning"
  definition: "Not calling into a node of the search tree, so its whole subtree is skipped, because it cannot lead to a valid or better solution."
  topic: "3.1"
- term: "optimistic estimate"
  definition: "For a partial solution, a number never worse than the value of any of its completions; used to prune in branch and bound."
  topic: "3.1"
- term: "branch and bound"
  definition: "Backtracking for an optimisation problem that prunes a partial solution when its optimistic estimate cannot beat the best solution found."
  topic: "3.1"
- term: "meet in the middle"
  definition: "Splitting n choices into two halves, listing all choices of each half (2^(n/2) each), and combining the two lists after sorting one."
  topic: "3.1"
- term: "DP state"
  definition: "In dynamic programming, a short description of a partial solution that keeps exactly what its future depends on, such as the stone a frog stands on."
  topic: "3.2"
- term: "transition"
  definition: "One choice leading from one state to another, with its cost or value."
  topic: "3.2"
- term: "DP"
  expansion: "dynamic programming"
  definition: "Computing a value for every state from the states one transition earlier, each state once, instead of listing all solutions."
  topic: "3.2"
- term: "tabulation"
  definition: "Filling a table of states in an order where every state comes after the states it uses."
  topic: "3.2"
- term: "memoisation"
  definition: "Keeping a recursion but storing each result the first time it is computed, so repeated calls return at once."
  topic: "3.2"
- term: "optimal substructure"
  definition: "An optimal solution cut after any choice starts with an optimal partial solution for its state."
  topic: "3.2"
- term: "knapsack"
  definition: "Choosing items with a weight and a value under a total-weight capacity; solved by a table over (items decided, capacity used)."
  topic: "3.3"
- term: "0/1 knapsack"
  definition: "The knapsack in which each item is taken at most once; its one-row table is updated with the capacity running downwards."
  topic: "3.3"
- term: "unbounded knapsack"
  definition: "The knapsack in which each item may be taken any number of times; its one-row table is updated with the capacity running upwards."
  topic: "3.3"
- term: "bounded knapsack"
  definition: "The knapsack in which item i may be taken at most c_i times; split into power-of-two bundles to reduce it to the 0/1 knapsack."
  topic: "3.3"
- term: "subset sum"
  definition: "The total of the numbers in some subset; a sum is reachable if some subset adds up to it exactly."
  topic: "3.3"
- term: "bitset"
  definition: "A fixed-length sequence of bits stored in machine words, so that shifts and bitwise operations act on 64 positions at once."
  topic: "3.3"
