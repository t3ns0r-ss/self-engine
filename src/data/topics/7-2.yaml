  hints:
  - The same city can be visited on different days. What is the state of the tour?
  - 'The state is (city, day mod d): n·d states with m·d edges. The state graph can have cycles.'
  - Condense the state graph (iterative, Theorem 7.2.3). The value of a component is the number of distinct
    cities with an open museum on a day of a state in it. Two components on one path never share a city
    with an open day, otherwise they would be one component. Longest path from the component of (1, 0).
- id: lc-count-all-possible-routes
  role: ladder
  card: state-dag
  rung: 1
  twist: 'Base case of the card: the state (city, fuel) has a falling measure, the fuel.'
  summary: Up to 100 cities at distinct positions, a start, a finish and a fuel up to 200; a move to another
    city costs the distance and the fuel must stay non-negative; the number of routes from start to finish
