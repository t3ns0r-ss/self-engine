# Patterns for topic 2.3 (Counting rules, nCr mod p, stars and bars, inclusion–exclusion). Provisional until the lesson maps them to Recognition Cards.
topic: "2.3"
patterns:
  - id: ncr-mod-p
    name: Binomials modulo a prime
    description: Precompute factorials and inverse factorials to answer C(n, r) mod p in O(1).
    precondition: p is prime and larger than every n used, and n fits in an array.
  - id: product-sum-rules
    name: Product and sum rules
    description: Count arrangements by multiplying independent choices and adding disjoint cases.
    precondition: The choices are independent (product rule) or the cases do not overlap (sum rule).
  - id: stars-bars
    name: Identical items into distinct boxes
    description: Count ways to split n identical items into k distinct boxes, possibly with lower bounds per box.
    precondition: Items are indistinguishable and boxes are distinguishable, so a distribution is a placement of k − 1 bars.
  - id: include-exclude
    name: Counting by inclusion–exclusion
    description: Count objects that avoid every one of several bad properties by an alternating sum over sets of properties.
    precondition: The size of every intersection of bad sets can be computed directly.
  - id: bijection-paths
    name: Counting by a bijection
    description: Map objects to choices of positions (lattice paths, sequences with fixed counts) and count them with one binomial.
    precondition: There is a one-to-one correspondence between the objects and the subsets being counted.
