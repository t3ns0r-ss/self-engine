drill:
- problem: cses-2105
  answer:
    topic: '6.4'
    card: distinct-substrings
  property: 'The question counts the different substrings of one string of up to 10^5 letters: n(n+1)/2
    minus the sum of the LCP values.'
  why_others_fail: A set of the substrings would hold 5·10^9 strings; hashing them costs the same number
    of steps.
- problem: cses-1113
  answer:
    topic: '1.1'
    card: sort-with-index
  property: 'Sorting the given last column stably (by letter, keeping the original places) gives the first
    column; the k-th occurrence of a letter in the two columns is the same character, so following these
    links from # rebuilds the string.'
  why_others_fail: Sorting all rotations would give the transform itself, not undo it; the inverse needs
    only one stable sort of single letters.
- problem: lc-longest-common-prefix
  answer:
    topic: '0.3'
    card: string-processing
  property: 'Compare the strings letter by letter with the first one and stop at the first difference:
    at most 200 · 200 letters.'
  why_others_fail: The sizes are tiny and the pairs are not independent substrings of one text; no sorting
    of suffixes is needed.
- problem: lc-isomorphic-strings
  answer:
    topic: '0.6'
    card: map-counting
  property: Keep two maps, from letters of the first string to letters of the second and back; every position
    must agree with both maps.
  why_others_fail: The question is a one-to-one renaming of letters, not a common substring or an order
    of suffixes.
- problem: lc-minimum-number-of-steps-to-make-two-strings-anagram
  answer:
    topic: '0.6'
    card: map-counting
  property: Count the letters of both strings; the answer is the sum of the surplus of the first string
    over the second.
  why_others_fail: Only the numbers of the letters matter, not their places, so no suffix is involved.
- problem: lc-custom-sort-string
  answer:
    topic: '1.1'
    card: custom-order
  property: Sort the letters of s by their place in the given order, or count each letter and write them
    out in that order.
  why_others_fail: The keys are single letters with a given order, not suffixes of one string.
- problem: lc-longest-uncommon-subsequence-ii
  answer:
    topic: '0.5'
    card: nested-loops
  property: For each string test with two pointers whether it is a subsequence of any other; with 50 strings
    of 10 letters that is 25000 steps.
  why_others_fail: The strings are compared as subsequences, which sorted suffixes cannot describe, and
    the sizes are tiny.
- problem: lc-word-pattern
  answer:
    topic: '0.6'
    card: set-membership
  property: Two maps between the letters of the pattern and the words must stay consistent in both directions.
  why_others_fail: A pattern of letters is matched to words by a bijection; nothing is looked for in a
    text.
lookalike_pairs:
- a: ac-practice2_i
  b: lc-k-divisible-elements-subarrays
  a_tool:
    topic: '6.4'
    card: distinct-substrings
  b_tool:
    topic: '0.6'
    card: set-membership
  shared_surface: Both count the different pieces (substrings of a string, subarrays of an array) that
    a text has.
  flipping_difference: 'In the array version there are at most 200 numbers, so all 20 100 subarrays are
    put into a set and counted. In the string version there are up to 5·10^5 letters, so the n²/2 pieces
    cannot be stored: sort the suffixes and subtract the LCP values.'
  flipping_input: A string of 5·10^5 letters has 1.25·10^11 substrings by place, far more than a set can
    hold, while the suffix array and the LCP array need about 10^7 steps.
- a: lc-last-substring-in-lexicographical-order
  b: lc-find-the-lexicographically-largest-string-from-the-box-i
  a_tool:
    topic: '6.4'
    card: sorted-suffixes
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both ask for the lexicographically largest substring of a string (of a given kind).
  flipping_difference: 'In the box version the string has at most 5000 letters, so the 5000 candidate
    pieces are compared one against another directly, 2.5·10^7 letter steps. In the last-substring version
    the string has up to 4·10^5 letters: the largest substring is the largest suffix, found in the sorted
    suffixes.'
  flipping_input: 'A string of 4·10^5 letters equal to a: comparing the candidates directly costs about
    n²/2 = 8·10^10 steps, while the doubling needs about 4·10^6.'
self_test:
- q: Write the suffix array and the LCP array of abab, and use Theorem 6.4.4 to count its different substrings.
  a: 'The sorted suffixes are ab (2), abab (0), b (3), bab (1), so sa = [2, 0, 3, 1] and lcp = [0, 2,
    0, 1]. The count is 10 − (2 + 0 + 1) = 7: a, b, ab, ba, aba, bab, abab.'
- q: Use Theorem 6.4.2 to find the longest common prefix of the suffixes of abab that start at 0 and at
    2.
  a: 'Their ranks are 1 (abab) and 0 (ab). The range is lcp[1 … 1] = [2], so the answer is 2. Directly:
    abab and ab share ab.'
- q: Do one round of the doubling of Theorem 6.4.1 (k = 1) for the string aab. Give the pairs and the
    ranks.
  a: The letters give 97, 97, 98. The pairs are (97, 97), (97, 98), (98, −1) for the positions 0, 1, 2.
    They are all different and already in order, so the ranks are 0, 1, 2 and the suffix array is [0,
    1, 2] (aab < ab < b).
- q: The text is aaab. Find the block of the pattern aa in the suffix array and say where the pattern
    occurs.
  a: 'The sorted suffixes are aaab (0), aab (1), ab (2), b (3), so sa = [0, 1, 2, 3]. Their first two
    letters are aa, aa, ab, b: the first two are equal to aa, the block is [0, 2). The pattern occurs
    twice, at 0 and at 1 (the first at 0).'
- q: Why must the empty second block get −1 and not 0 in the doubling?
  a: A rank 0 belongs to a real block, the smallest one. With 0 for the empty block, a short suffix would
    tie with a real block of rank 0 and the ranks would never become all different. For aaa the loop would
    not stop (the template crashes).
- q: A string has 10^6 letters. Why is the doubling with sort risky, and what is used instead?
  a: 'Each round sorts 10^6 pairs, about 2·10^7 comparisons, and there are 20 rounds: about 4·10^8 comparisons
    of pairs, too slow in the worst case. The counting sort makes each round O(n), so the total is about
    2·10^7 steps.'
- q: Why does Kasai's algorithm visit the positions in the order of the text, not in the order of the
    ranks?
  a: The fact h(i + 1) ≥ h(i) − 1 relates the suffix i to the suffix i + 1, which are far apart in sorted
    order. Along the ranks the common beginning can fall to 0 and rise again, and nothing is saved.
