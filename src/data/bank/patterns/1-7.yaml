# Patterns for topic 1.7 (Bits: XOR properties, prefix XOR, per-bit contribution). Provisional until the lesson maps them to Recognition Cards.
topic: "1.7"
patterns:
  - id: xor-identities
    name: XOR identities
    description: Use x ⊕ x = 0, x ⊕ 0 = x, and the freedom to reorder XORs to cancel pairs, find a unique element, or solve small XOR equations.
    precondition: XOR is associative, commutative, and every value is its own inverse.
  - id: prefix-xor
    name: XOR of subarrays
    description: XOR of a subarray is P[r] ⊕ P[l−1]; count or find subarrays with a given XOR by looking up earlier prefix values.
    precondition: The condition on a subarray's XOR is a condition on a pair of prefix XOR values.
  - id: per-bit-contribution
    name: Each bit separately
    description: Sum over all pairs or subarrays of XOR, AND, or OR by counting, for each bit, how many of them have that bit set.
    precondition: The total equals the sum over bits b of 2^b times a count that depends only on bit b.
  - id: high-bit-first
    name: Highest bit first
    description: Maximise or minimise a value bit by bit from the highest bit down, keeping a bit whenever it is still achievable.
    precondition: 2^b is larger than the sum of all lower bits (2^b − 1), so a higher bit decides the comparison by itself.
  - id: bit-identities
    name: Sum and bit identities
    description: "Relate a + b, a ⊕ b, a & b, and a "
    precondition: " b (for example a + b = (a ⊕ b) + 2(a & b)) to reconstruct or count numbers."
