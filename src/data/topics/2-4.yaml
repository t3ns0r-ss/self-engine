# Topic 2.4 data file (CURRICULUM_GAPS_PLAN.md Section 5.4). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '2.4'
uses:
- topic: '0.1'
  what: 'Overflow: coordinates up to 10^9 give cross products near 8·10^18, which need `long long`, and
    a running sum needs `__int128`'
- topic: '0.2'
  what: 'Complexity: edge tests and chain steps against a budget of about 10^8'
- topic: '0.4'
  what: 'Greatest common divisor: the lattice points on an edge, and directions written in lowest terms'
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, and trying all choices in two small problems'
- topic: '0.6'
  what: 'Sets and maps: the window of the closest-pair sweep, and sets of points in look-alikes'
- topic: '1.1'
  what: 'Sorting: the points are sorted by x and y for the chains and the sweep'
- topic: '1.2'
  what: 'Prefix sums and running extremes: the tool of one negative example and of drill problems'
- topic: '1.4'
  what: 'Binary search: the search over the angle at the first corner of a convex polygon'
- topic: '2.2'
  what: 'Fast exponentiation: powers of 2 modulo a prime in one checkpoint problem'
theorems:
- id: 2.4.1
  title: The sign of a cross product says left, right or on the line
  plain_words: 'Subtract the first point from the other two and cross the two arrows: a positive number
    means the third point is to the left of the walk from the first point to the second, a negative number
    means to the right, and zero means all three points are on one line. The size of the number is twice
    the area of the triangle.'
  code: 2.4/thm-1
- id: 2.4.2
  title: Two segments share a point exactly when they cross properly or an end lies on the other segment
  plain_words: Look at which side of each segment the two ends of the other one are on. If they are on
    opposite sides both ways, the segments cross. Otherwise they can only touch, and that happens exactly
    when an end lies on the other segment, which includes two segments on one line.
  code: 2.4/thm-2
- id: 2.4.3
  title: Twice the area is a sum of cross products, and the boundary points are a sum of gcds
  plain_words: 'Walk around the polygon and add up one cross product for every edge: the total is twice
    the area, and it is negative if you walk clockwise. An edge from one lattice point to another holds
    gcd(dx, dy) lattice points, not counting the end, so the boundary count is a sum of gcds.'
  code: 2.4/thm-3
- id: 2.4.4
  title: A point is inside a polygon when a ray to the right crosses an odd number of edges, after the
    boundary has been tested
  plain_words: First test whether the point is on an edge. If not, shoot a ray to the right and count
    the edges it crosses, treating a corner at the height of the ray as if it were slightly above the
    ray. An odd count means inside.
  code: 2.4/thm-4
- id: 2.4.5
  title: Sorted by x, a stack with a left-turn rule builds the convex hull
  plain_words: Sort the points, then add them one at a time to a stack. Before a point is added, remove
    the top of the stack while the last two stack points and the new point do not make a left turn. What
    is left is the lower edge of the hull; do the same from the other side for the upper edge.
  code: 2.4/thm-5
- id: 2.4.6
  title: A sorted sweep finds the closest pair by looking at a few earlier points per point
  plain_words: Sort by x and keep the recent points in a set ordered by y. For a new point only the points
    that are closer than the best distance so far in both x and y matter, and only a few of them can fit
    there, so each point needs only a few distance tests.
  code: 2.4/thm-6
cards:
- id: cross-sign
  name: Sign of the cross product
  from_theorem: 2.4.1
  decisive_property: Every fact that the question needs about the points is a side of a directed line
    (left, right or on it), a twice-area, or a count built from those, and the coordinates are integers,
    so that cross products of coordinate differences are computed exactly in 64 bits (the largest is 8·M²
    for coordinates up to M in absolute value, below 9.2·10^18 for M = 10^9).
  how_to_test: 'Write the question as "is C left of, right of or on the line from A to B" (or as "twice
    the area of ...", or "do these two segments touch"). Check that the coordinates are integers and bound
    the cross product: 8·M² must stay below 9.2·10^18, which holds up to M of about 10^9. If the answer
    needs real coordinates, lengths or angles, the card does not apply.'
  constraint_shapes:
  - 't = 10^5 independent tests, each with 6 or 8 numbers: O(1) per test is needed, so the test must be
    one formula and not a loop over the plane'
  - 'Coordinates up to 10^9: a difference reaches 2·10^9, a product 4·10^18 and a cross product 8·10^18,
    so `long long` just fits, while `int` (2.1·10^9) and `double` (53 bits, about 9·10^15) do not'
  weak_signals:
  - form: Asks whether three points are on one line, which way a path turns, or whether a shape is convex
    shape: Integer coordinates up to 10^9; up to 10^5 tests, or a few hundred points with all triples
      tried
  - form: Asks whether segments cross, touch or overlap
    shape: Pairs of segments with integer ends, up to 10^5 pairs; touching counts as sharing a point
  - form: Asks for the area of a polygon (as twice the area) or for the lattice points inside and on its
      border
    shape: Up to 10^5 corners with coordinates up to 10^9, and an integer answer
  - form: Asks whether a point is inside, on the border of or outside a polygon
    shape: A polygon of up to 10^5 corners and up to 10^5 query points; a convex polygon allows a binary
      search
  kill_signals:
  - 'Coordinates up to 4·10^9 or more: for A = (0, 0), B = (4·10^9, 1) and C = (1, 4·10^9) the true cross
    product is 1.6·10^19 − 1, above 2^63, so in 64 bits it wraps to a negative number and gives the wrong
    side (the first negative example below); use `__int128` (topic 0.1)'
  - 'The question compares only lengths or squared distances (nearest, farthest, the k closest): no side
    and no area is involved, and sorting or a heap is enough (the second negative example below)'
  - 'Coordinates are real numbers that need a tolerance, or the question needs an angle or a circle: a
    sign test is exact only for integers, and the rest is not part of this course'
  in_action:
    statement: A park fence is a closed polygon with n = 1000 posts at integer points with coordinates
      up to 10^9 in absolute value, listed in order; the fence does not cross itself. For each of q =
      1000 visitors, say whether the visitor is inside the fence, outside it or standing on it.
    constraints: n, q ≤ 1000, coordinates up to 10^9 in absolute value.
    budget: n·q = 10^6 edge tests of O(1) each is easily fast enough. Marking the cells inside would need
      up to 4·10^18 cells. Whether a visitor stands exactly on the fence must be decided exactly, so a
      test with real numbers is not safe. Need an exact O(1) test per edge.
    candidates:
    - tool: Add the angles seen from the visitor with floating-point numbers
      verdict: rejected
      because: '"On the fence" needs an exact answer, and rounding at coordinates near 10^9 makes it unreliable.'
    - tool: Mark the cells inside by a flood fill over a grid
      verdict: rejected
      because: The grid would have up to 4·10^18 cells.
    - tool: Cross-product sign tests, the boundary first and then the crossings of a ray (this topic)
      verdict: chosen
      because: Every edge test is one exact integer cross product.
    property_check: Each test is a cross product of two coordinate differences, at most 8·10^18 in absolute
      value, so `long long` holds it (Theorem 2.4.1). A visitor is on the fence exactly when some edge
      has cross product 0 with the visitor and the visitor is inside the edge's bounding box; otherwise
      the parity of the edges crossed by a ray to the right decides (Theorem 2.4.4).
    decision: 'For every visitor, loop over the n edges: boundary test first, then the half-open crossing
      count. Time O(n·q) = 10^6.'
  examples:
    positive:
    - inline:
        input: 'A = (0, 0), B = (4, 0), C = (1, 3): what is the cross product, and on which side of AB
          is C?'
        answer: 12 (C is left of AB, and the triangle has twice the area 12)
        why: The cross product is 4·3 − 0·1 = 12. It is positive, so C is on the left, and it is twice
          the area, the same as base times height, 4 · 3.
    - inline:
        input: 'The segments (0, 0)-(3, 0) and (2, 0)-(5, 0) lie on one line and overlap on x from 2 to
          3: do they share a point?'
        answer: 1 (yes)
        why: All four cross values are 0, so the segments are on one line, but the end (2, 0) has cross
          product 0 with the first segment and lies in its bounding box, which is condition (2) of Theorem
          2.4.2.
    negative:
    - inline:
        input: 'A = (0, 0), B = (4·10^9, 1), C = (1, 4·10^9): what is the sign of the cross product, computed
          with 64-bit numbers?'
        answer: 1 (the true value is 16·10^18 − 1, positive)
        method_gives: '-1'
        why: 'The true cross product is above 2^63, which is 9.22·10^18, so a 64-bit number wraps around
          to a negative value and reports a right turn. The decisive property fails: the cross product
          does not fit in 64 bits when coordinates reach 4·10^9. Wider arithmetic is needed.'
      correct_tool:
        topic: '0.1'
        card: overflow-64bit
    - problem: lc-count-square-sum-triples
      why: It asks for right triangles, but there are no points, only whole-number side lengths up to
        250, so there is nothing to take a cross product of. Trying every pair of legs, at most 62 500
        pairs, and testing whether the sum of squares is a perfect square answers it.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
  lookalikes:
  - description: 'Triangles from given side lengths: the largest perimeter or the number of triples that
      can form a triangle'
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: Lengths have only the triangle inequality, and a sort puts the best triples side
      by side. Points have positions, and the area comes from a cross product.
  - description: Rectangles whose corners are given points, with sides parallel to the axes
    tool:
      topic: '0.6'
      card: set-membership
    flipping_difference: If the sides are parallel to the axes, a set of points answers "is the fourth
      corner there". A tilted rectangle needs the dot and cross products of this topic.
  - description: Hull or nearest pair of many points
    tool:
      topic: '2.4'
      card: sorted-sweep
    flipping_difference: A single polygon or a single pair of segments needs no sorting. The next card
      sorts the points and uses the same turn test over thousands of them.
  complexity: O(1) per cross product, O(n) for a polygon with n corners, and O(log n) per query point
    for a convex polygon after one binary search.
- id: sorted-sweep
  name: Hull or nearest pair in one sorted pass
  from_theorem: 2.4.5
  decisive_property: 'The points are fixed and can be sorted by x (then y); the answer is either the outer
    boundary of the points (the convex hull) or the pair at the smallest distance; and one left-to-right
    pass with a small kept structure is correct because whatever leaves it can never matter again: a stack
    point that makes a non-left turn lies on or above a segment between two other points, and a window
    point farther behind than the best distance cannot improve it.'
  how_to_test: Ask whether the answer is a function of the outer boundary (which points are on the fence,
    its area or perimeter, whether another set is inside it). Then check that a point that makes a non-left
    turn with its two stack neighbours can be thrown away for good. Or ask whether the answer is the smallest
    distance between two points, and check that a point more than the best distance behind in x can be
    thrown away. In both cases the points must not change between the questions.
  constraint_shapes:
  - 'n = 2·10^5 points: all pairs are 2·10^10 distances (200 seconds at 10^8 per second), while a sort
    and one pass are about 2·10^5 · 18 ≈ 4·10^6 steps'
  - 'Coordinates up to 10^9 in absolute value: squared distances reach 8·10^18, which `long long` just
    holds, so the sweep compares squares and never takes a square root of a large number'
  weak_signals:
  - form: Asks which points lie on the fence around all the points, the area or perimeter of the smallest
      convex region that holds them, or whether one set lies inside the hull of another
    shape: Between 10^3 and 2·10^5 points with integer coordinates up to 10^9, each given once, nothing
      changing
  - form: Asks for the smallest distance between two of n points, or hides it in a formula such as (i
      − j)² + (S_i − S_j)²
    shape: n up to 2·10^5; the squared distance is the answer or the quantity to minimise, and all pairs
      would be 2·10^10
  - form: Asks for lines or parabolas through two of n points with no other point on one side of them
    shape: n up to 10^5 points; after a change of variables the curves become straight lines and the count
      is a count of hull edges
  kill_signals:
  - 'Points are inserted or removed between the questions and the hull or the nearest pair must be kept
    up to date: one sorted pass answers only a fixed set, and a changing hull is not part of this course'
  - 'The distance is the Manhattan distance and the farthest pair is wanted: it comes from the largest
    and smallest values of x + y and of x − y, not from the hull (the first negative example below)'
  - 'Only a fixed point or a fixed line is compared with all the others (the k closest to the origin):
    sorting by one number is enough (the second negative example below)'
  in_action:
    statement: A delivery firm has n = 200 000 depots at integer points with coordinates up to 10^9 in
      absolute value. Which depots are on the boundary of the smallest convex fence that holds them all,
      including depots in the middle of a side of the fence?
    constraints: n ≤ 2·10^5, coordinates up to 10^9 in absolute value.
    budget: Testing each depot against every triangle of the other depots is about n⁴/6 ≈ 10^20 tests.
      Even testing each depot against every pair as a fence side is n³ = 8·10^15. Need about O(n log n).
    candidates:
    - tool: Test every depot against every triangle of the others (brute force, topic 0.5)
      verdict: rejected
      because: About 10^20 tests.
    - tool: Sort by x and keep a stack for the lower and the upper chain (this topic)
      verdict: chosen
      because: The depots do not change, and a depot that makes a right turn on the stack can never be
        on the boundary of that chain.
    property_check: A point stays on the lower chain while every three neighbours make a left turn (cross
      product above 0). Depots in the middle of a side have cross product 0 with their neighbours and
      must stay, so the stack pops only when the cross product is below 0 (Theorem 2.4.5 pops on 0 as
      well when only corners are wanted).
    decision: Sort, build both chains with a stack that pops on a right turn, then sort and remove repeated
      points. Time O(n log n).
  examples:
    positive:
    - inline:
        input: 'The points (0,0), (4,0), (4,4), (0,4), (2,2), (2,0): how many corners does the convex
          hull have?'
        answer: '4'
        why: (2,2) is inside the square, and (2,0) is in the middle of the bottom side, so the stack drops
          it (cross product 0). The corners are the four corners of the square.
    - inline:
        input: 'The points (0,0), (3,4), (1,1), (5,5): what is the smallest squared distance between two
          of them?'
        answer: '2'
        why: 'Sorted by x, the point (1,1) meets (0,0) at squared distance 2. The others are farther:
          13 from (3,4) to (1,1) and 5 from (3,4) to (5,5). The sweep finds the 2 and never looks at a
          point more than 2 steps behind.'
    negative:
    - inline:
        input: 'The points (0,0), (10,0), (6,6): what is the largest Manhattan distance |dx| + |dy| between
          two of them?'
        answer: 12 (between (0,0) and (6,6))
        method_gives: '10'
        why: 'The pair that is farthest in the ordinary distance is (0,0) and (10,0), at Manhattan distance
          10, and the hull method finds that pair. In the Manhattan distance the farthest pair is different.
          The decisive property fails: the answer is not determined by the shape of the hull. The largest
          |dx| + |dy| is the larger of the ranges of x + y and of x − y, found by one scan with running
          extremes.'
      correct_tool:
        topic: '1.2'
        card: prefix-extremes
    - problem: lc-k-closest-points-to-origin
      why: Only the distances to one fixed point, the origin, are compared. No pair of points and no boundary
        is involved, so sorting by squared distance (or keeping a heap) answers it.
      correct_tool:
        topic: '1.1'
        card: custom-order
  lookalikes:
  - description: The smallest difference between two numbers of an array
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: On a line the closest pair is a pair of neighbours after sorting. In the plane
      the neighbours by x need not be close in y, so a window by x and a set by y are needed.
  - description: Tests on one polygon or one pair of segments
    tool:
      topic: '2.4'
      card: cross-sign
    flipping_difference: A single polygon needs no sorting. The hull applies the same turn test to thousands
      of points, and the sorting is what makes one pass enough.
  - description: Points on a small grid with a count per cell
    tool:
      topic: '1.2'
      card: prefix-2d
    flipping_difference: On a grid of at most about 1000 by 1000 cells a table counts the points in any
      rectangle; the sorted sweep is for coordinates up to 10^9.
  complexity: 'O(n log n): the sort, then each point enters and leaves the stack or the window once; the
    set of the window costs O(log n) per step.'
problems:
- id: cses-2189
  role: ladder
  card: cross-sign
  rung: 1
  twist: 'Base case of the card: the sign of one cross product, in 64 bits.'
  summary: t ≤ 10^5 tests, each a directed line through two points and a third point (coordinates up to
    10^9 in absolute value); print LEFT, RIGHT or TOUCH.
  hints:
  - Look from the first point towards the second. Which of the three answers does a point exactly on the
    line get?
  - Subtract the first point from the other two. The cross product of the two difference vectors is positive,
    negative or zero (Theorem 2.4.1).
  - 'Differences reach 2·10^9 and the products 4·10^18: keep them in `long long`, and print by the sign
    of the result.'
- id: lc-minimum-lines-to-represent-a-line-chart
  role: ladder
  card: cross-sign
  rung: 2
  twist: Collinear test on neighbouring triples, after a sort; no division of slopes.
  summary: n ≤ 10^5 points (day, price) with different days and values up to 10^9; the chart joins neighbours
    in day order; find the least number of straight lines that draw it.
  hints:
  - In which order must the points be taken? When do two neighbouring pieces of the chart lie on one line?
  - Sort by day. Three points a, b, c in a row continue one line exactly when the cross product of (b
    − a) and (c − a) is 0 (Theorem 2.4.1). A slope as a fraction would need division and rounding.
  - Count one line for the first two points and one more line each time the cross product is not 0. The
    products reach 10^18, so use `long long`; one point needs 0 lines.
- id: ac-abc266_c
  role: ladder
  card: cross-sign
  rung: 3
  twist: 'Every corner must turn the same way: four signs at once.'
  summary: Four points of a quadrilateral without self-intersection, given in counterclockwise order,
    coordinates up to 100 in absolute value, no three on a line; say whether it is convex.
  hints:
  - Walk around the four corners. What does the turn look like at a corner where the quadrilateral bends
    inwards?
  - At each corner take the cross product of the vectors to the next two corners (Theorem 2.4.1). In counterclockwise
    order a convex corner gives a positive value.
  - Print Yes exactly when all four values are positive. No three points are collinear, so no value is
    0.
- id: cf-227A
  role: ladder
  card: cross-sign
  rung: 4
  twist: 'Three points as a turn: left, straight or right is the answer.'
  summary: Three points A, B and C with large integer coordinates; going from A to B and on to C, decide
    whether the way turns left, goes straight or turns right †.
  hints:
  - Stand at B, having come from A. What does 'left of the direction A to B' say about where C is?
  - The sign of the cross product of (B − A) and (C − A) tells it (Theorem 2.4.1).
  - 'Look at the bound on the coordinates in the statement: if the cross product can pass 9.2·10^18, compute
    it in `__int128` (topic 0.1).'
- id: cses-2190
  role: ladder
  card: cross-sign
  rung: 5
  twist: Four signs, and the touching and overlapping cases.
  summary: t ≤ 10^5 pairs of segments with ends up to 10^9 in absolute value; for each pair say whether
    they share at least one point.
  hints:
  - Where can two segments share a point without crossing? Think of an end of one lying on the other,
    and of two segments on one line.
  - Take the signs of the cross products of the ends of one segment seen from the other (Theorem 2.4.2);
    a proper crossing needs opposite signs on both sides.
  - 'If a sign is 0, that end is on the line of the other segment and counts only inside the bounding
    box. Multiply signs, not cross products: 4·10^18 times 4·10^18 overflows.'
- id: cses-2191
  role: ladder
  card: cross-sign
  rung: 6
  twist: 'Many cross products add up: twice the area of a polygon.'
  summary: A simple polygon with n ≤ 1000 corners (coordinates up to 10^9 in absolute value) listed in
    order; print twice its area.
  hints:
  - Why does the statement ask for twice the area? What is the area of a triangle with one corner at the
    origin?
  - Add the term x_i·y_{i+1} − x_{i+1}·y_i over all edges (Theorem 2.4.3); the absolute value of the total
    is twice the area, whichever way the corners go.
  - 'One term reaches 2·10^18 and the running total can pass 9.2·10^18 on the way: keep the total in `__int128`,
    then print its absolute value.'
- id: cses-2193
  role: ladder
  card: cross-sign
  rung: 7
  twist: 'Counting lattice points: boundary by gcd, inside by Pick''s theorem.'
  summary: A simple polygon with n ≤ 10^5 corners (coordinates up to 10^9 in absolute value); print the
    number of lattice points strictly inside and the number on the boundary.
  hints:
  - How many lattice points lie on one edge from (x1, y1) to (x2, y2), not counting one end? Try dx =
    4, dy = 6.
  - gcd(|dx|, |dy|) of them, so the boundary count is the sum over the edges (Theorem 2.4.3).
  - 'Pick''s theorem: twice the area = 2·I + B − 2. Solve it for I. The twice area comes from the sum
    of cross products.'
- id: cses-2192
  role: ladder
  card: cross-sign
  rung: 8
  twist: Boundary first, then the parity of crossings of a ray.
  summary: A simple polygon with n ≤ 1000 corners and m ≤ 1000 points, all coordinates up to 10^9 in absolute
    value; for each point print INSIDE, OUTSIDE or BOUNDARY.
  hints:
  - What is the first thing to test for a point, before any counting of crossings?
  - A point is on the boundary when some edge has cross product 0 with it and the point is in the edge's
    bounding box (Theorem 2.4.4).
  - Otherwise count the edges crossed by a ray to the right, treating a corner at the ray's height as
    lying just above it; an odd count means inside. n·m = 10^6 edge tests is fine.
- id: ac-abc296_g
  role: ladder
  card: cross-sign
  rung: 9
  twist: 'A convex polygon and 2·10^5 queries: a binary search on the angle at the first corner.'
  summary: A strictly convex polygon with N ≤ 2·10^5 corners in counterclockwise order and Q ≤ 2·10^5
    points (coordinates up to 10^9 in absolute value); for each point print IN, OUT or ON.
  hints:
  - N·Q = 4·10^10 edge tests is too many. Which property of a convex polygon gives an order to search
    in?
  - Seen from the first corner the other corners come in counterclockwise order, so a binary search on
    the cross product with the first corner finds the triangle that holds the point (topic 1.4).
  - 'Test the two edges at the first corner first, then the far edge of the triangle that the search found;
    cross product 0 means the boundary (template: Convex polygon and queries).'
- id: cf-849B
  role: ladder
  card: cross-sign
  rung: 10
  twist: 'Two parallel lines: compare directions with a cross product, not a slope.'
  summary: n ≤ 1000 points (i, y_i) for i = 1..n; can all points be covered by two parallel lines, each
    with at least one point, so that every point is on exactly one of them? †
  hints:
  - If the answer is yes, how many of the first three points lie on the same line of the two? Which pairs
    can that be?
  - Two of the first three points share a line (pigeonhole), so try the pairs (1, 2), (1, 3) and (2, 3)
    as the first line.
  - 'Put every point on the chosen line into one group. The rest must be non-empty and lie on one line
    with the same direction: compare directions with a cross product (Theorem 2.4.1), not with a division.'
- id: cf-340B
  role: ladder
  card: cross-sign
  rung: 11
  twist: Area as a cross product, with the best corner on each side of a diagonal.
  summary: n ≤ 300 points with small integer coordinates; find the largest area of a simple quadrilateral
    whose corners are among the points †.
  hints:
  - A quadrilateral is two triangles that share a diagonal. If you fix the diagonal, what is left to choose?
  - 'For a diagonal (i, j) the best corner on each side is the point with the largest cross product on
    that side (Theorem 2.4.1: the sign tells the side).'
  - Try all diagonals and take the best corner on each side in O(n); use only diagonals that have a point
    on both sides. n³ = 2.7·10^7.
- id: cses-2195
  role: ladder
  card: sorted-sweep
  rung: 1
  twist: 'Base case of the card: the monotone chain, keeping the points in the middle of an edge.'
  summary: n ≤ 2·10^5 different points with coordinates up to 10^9 in absolute value (the hull has positive
    area); print all points on the boundary of the convex hull, including points in the middle of an edge.
  hints:
  - After sorting by x and then y, the lowest chain of the hull runs from the first point to the last.
    What does a point of that chain look like seen from its two neighbours?
  - Keep a stack. Before pushing a point, remove the top while the last two stack points and the new point
    make a right turn (Theorem 2.4.5). Do the same from right to left for the upper chain.
  - Points in the middle of an edge must stay, so pop only for a strict right turn (cross < 0). With this
    rule a chain can repeat points when all points are collinear, so sort and remove duplicates at the
    end.
- id: lc-erect-the-fence
  role: ladder
  card: sorted-sweep
  rung: 2
  twist: The same hull with all the points on a line allowed.
  summary: n ≤ 3000 different trees with coordinates in 0..100; return the trees that lie exactly on the
    fence (the boundary of the convex hull), in any order.
  hints:
  - What is different here from a hull that lists only the corners? What if every tree is on one line?
  - 'Keep the points in the middle of an edge: pop only for a strict right turn (Theorem 2.4.5), and make
    a set of the answer so that nothing repeats.'
  - Run the lower chain left to right and the upper chain right to left; for a single line both chains
    hold all the points, so the set removes the repeats.
- id: cf-166B
  role: ladder
  card: sorted-sweep
  rung: 3
  twist: 'The hull of two sets: is one polygon strictly inside the other?'
  summary: A strictly convex polygon A (n ≤ 10^5 corners, given clockwise) and a polygon B (m ≤ 2·10^4
    corners, any shape); is every corner of B strictly inside A? †
  hints:
  - If a corner of B is outside A or on its edge, the answer is no. What must the hull of all the points
    look like when B is strictly inside A?
  - Then the hull of A ∪ B is A itself, with the same corners and nothing else on its boundary (Theorem
    2.4.5).
  - 'Use the version of the chain that keeps points in the middle of an edge: B is strictly inside exactly
    when the hull of all the points has n points. A corner of B equal to a corner of A is a duplicate
    and must give ''no''.'
- id: cses-2194
  role: ladder
  card: sorted-sweep
  rung: 4
  twist: 'Closest pair: a window by x and a set ordered by y.'
  summary: n ≤ 2·10^5 different points with coordinates up to 10^9 in absolute value; print the smallest
    squared distance between two of them.
  hints:
  - 'n²/2 = 2·10^10 distances is too many. Sort by x: when can a point on the left no longer be the nearest
    to the current point?'
  - Keep the points whose x is less than the best distance behind the current point in a set ordered by
    y, and for the new point look only at the points with y within the best distance (Theorem 2.4.6).
  - Use squared distances in `long long` (up to 8·10^18). The window width is the integer square root
    of the best squared distance, plus 1.
- id: cf-1142C
  role: ladder
  card: sorted-sweep
  rung: 5
  twist: A change of variables turns parabolas into lines; then the upper hull.
  summary: n ≤ 10^5 points with integer coordinates; count the parabolas y = x² + bx + c through two points
    with different x that have no given point strictly above them †.
  hints:
  - A parabola y = x² + bx + c goes through two points. What happens to it if you replace every y by y
    − x²?
  - Replace each point (x, y) by (x, y − x²). The parabola becomes the straight line z = b·x + c, and
    a point is above the parabola exactly when it is above the line.
  - 'So count the edges of the upper hull of the new points (the upper chain of Theorem 2.4.5), merging
    the points on one edge, with only the highest point for each x. Check the coordinate bounds: y − x²
    and the cross products must fit in `long long`.'
- id: cf-552D
  role: checkpoint
  card: cross-sign
  summary: n ≤ 2000 different points with coordinates up to 100 in absolute value; count the triangles
    with a non-zero area whose corners are among the points †.
- id: ac-arc082_c
  role: checkpoint
  card: cross-sign
  summary: N ≤ 200 different points with coordinates below 10^4; the score of a subset that forms a convex
    polygon is 2 to the power of the number of points inside or on the hull minus the size of the subset;
    print the sum of the scores modulo 998244353.
- id: cf-429D
  role: checkpoint
  card: sorted-sweep
  summary: An array a of n ≤ 10^5 numbers (|a_i| ≤ 10^4); for positions i ≠ j let g be the sum of the
    entries after the smaller position up to the larger one; find the least value of (i − j)² + g² †.
- id: cf-1163C1
  role: review
  card: cross-sign
  review_set: 1
  summary: n ≤ 50 different points; a wire joins every pair of points and wires on one line are merged;
    count the pairs of distinct wires that intersect (are not parallel) †.
- id: cf-1030D
  role: review
  card: cross-sign
  review_set: 1
  summary: 'Integers n, m, k up to 10^9: find three lattice points in the rectangle [0, n] × [0, m] that
    form a triangle of area exactly n·m / k, or say that there is none †.'
- id: ac-math_and_algorithm_bu
  role: review
  card: cross-sign
  review_set: 1
  summary: A simple polygon with N ≤ 10^5 corners (coordinates up to 10^9 in absolute value) and one point
    not on its boundary; say whether the point is inside.
- id: lc-largest-triangle-area
  role: lookalike
  summary: n ≤ 50 different points with coordinates in −50..50; find the area of the largest triangle
    that has three of the points as corners.
- id: lc-largest-perimeter-triangle
  role: lookalike
  summary: An array of n ≤ 10^4 side lengths up to 10^6; find the largest perimeter of a triangle with
