drill:
- problem: lc-range-sum-query-mutable
  answer:
    topic: '5.2'
    card: updates-and-range-sums
  property: Values change one at a time and the same range sum is asked between the changes; a tree gives
    both in O(log n).
  why_others_fail: Prefix sums must be rebuilt after each change (O(n) per update); a sparse table does
    not support sums at all.
- problem: cf-1579E2
  answer:
    topic: '5.2'
    card: inversion-count
  property: Putting a_i in front adds the number of earlier elements smaller than it, putting it at the
    back adds the number of earlier elements greater; take the smaller, and get both counts from a tree
    over the ranks.
  why_others_fail: A sort or a merge sort gives the total inversions of one fixed order, but here each
    choice is priced by counts that change as elements are added.
- problem: cf-1311F
  answer:
    topic: '5.2'
    card: inversion-count
  property: 'Sort by position; a pair i < j contributes x_j − x_i exactly when v_i ≤ v_j, so for each
    j you need the count and the sum of the earlier points with v ≤ v_j: two trees over the ranks of the
    speeds.'
  why_others_fail: Checking pairs is O(n²); a plain sort handles one coordinate, and the second condition
    is an order condition that needs a count.
- problem: ac-arc075_c
  answer:
    topic: '5.2'
    card: inversion-count
  property: Subtract K from every element; a subarray qualifies when its sum is at least 0, that is, when
    the earlier prefix value is at most the later one. Count such pairs of prefix sums with a tree over
    their ranks.
  why_others_fail: Prefix sums alone only give each sum; the count of pairs in a given order of the prefix
    values needs a counting tree, and the table of counts for equal values (1.2) is not enough for "at
    most".
- problem: lc-count-of-smaller-numbers-after-self
  answer:
    topic: '5.2'
    card: inversion-count
  property: Scan from the right and keep a tree of the values already seen; the answer for an element
    is the prefix count of the smaller values.
  why_others_fail: Sorting the array loses the order; a sorted container with order statistics is not
    in the standard library.
- problem: lc-count-number-of-teams
  answer:
    topic: '0.5'
    card: nested-loops
  property: 'With n ≤ 1000 you can fix the middle soldier and count the smaller and larger ones on each
    side in a plain loop: n² = 10^6 steps.'
  why_others_fail: A tree gives O(n log n) and also works, but the limit does not need it; reaching for
    a tree here is more code for no gain.
- problem: lc-count-good-triplets-in-an-array
  answer:
    topic: '5.2'
    card: inversion-count
  property: Rename every value by its place in the second permutation; a good triplet is then an increasing
    triple of the new sequence. For each middle value, count the smaller ones on its left and the larger
    on its right with trees.
  why_others_fail: Checking triples is O(n³); the two-sided counts need two sweeps with a tree.
- problem: cf-1354D
  answer:
    topic: '5.2'
    card: kth-present
  property: An array of counts over the values makes the k-th smallest the place where the prefix count
    reaches k, found by the descent in O(log n); memory is one array.
  why_others_fail: A balanced tree (an ordered multiset with order statistics) needs a non-standard header
    and much more memory at 10^6 elements; a sorted set cannot jump to the k-th element.
- problem: lc-longest-nice-subarray
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: 'The property survives shrinking: if a window is nice, so is every window inside it. Keep
    the OR of the window; when a new element overlaps it, move the left end until it does not.'
  why_others_fail: There are no updates and no queries to answer, only one longest range to find; a tree
    or a table has nothing to answer.
- problem: lc-minimum-impossible-or
  answer:
    topic: '1.7'
    card: bit-identities
  property: A power of two can only be built from itself, and if every power of two below 2^k is present,
    every number below 2^k can be built; so the answer is the smallest power of two missing from the array.
  why_others_fail: 'Trying numbers one by one with a counting structure is impossible: the answer follows
    from a bit argument, not from counting in ranges.'
lookalike_pairs:
- a: cses-1648
  b: cses-1651
  a_tool:
    topic: '5.2'
    card: updates-and-range-sums
  b_tool:
    topic: '5.2'
    card: updates-and-range-sums
  shared_surface: Both are an array of n ≤ 2·10^5 numbers with q ≤ 2·10^5 mixed operations, all done with
    the same kind of tree.
  flipping_difference: In A one value changes and a whole range is summed, so the tree stores the values.
    In B a whole range changes and one value is read, so the tree stores the differences between neighbours
    and a read is a prefix sum.
  flipping_input: 'a = [1, 2, 3]. A: replace a_2 by 5; the sum of positions 1..3 is then 1 + 5 + 3 = 9.
    B: add 4 to positions 2..3 and read position 3; the answer is 3 + 4 = 7, found as the starting value
    plus the prefix of the differences (+4 at place 2).'
- a: ac-abc405_f
  b: ac-abc402_d
  a_tool:
    topic: '5.2'
    card: offline-sweep-count
  b_tool:
    topic: '0.6'
    card: map-counting
  shared_surface: Both put points evenly on a circle, draw a line or chord between pairs of points and
    count crossings.
  flipping_difference: In Chord Crossing the chords are segments, so whether two cross depends on the
    order of the endpoints around the circle, and the counting is a sweep over sorted endpoints with a
    tree. In Line Crossing the lines are infinite, so two lines always meet unless they are parallel,
    and parallel lines have the same sum of endpoints modulo N; a table of counts finishes it.
  flipping_input: N = 6 points. The chords (1, 2) and (3, 5) do not cross as segments (neither end of
    the second lies between 1 and 2), but as lines they meet, because the sums 1 + 2 = 3 and 3 + 5 = 8
    ≡ 2 differ modulo 6.
self_test:
- q: Build the Fenwick tree of sums for a = [3, 1, 4, 1, 5, 9, 2, 6]. What are tree[6] and tree[8]?
  a: 'tree[6] is the sum of the block of lowbit(6) = 2 positions ending at 6, that is a_5 + a_6 = 5 +
    9 = 14. tree[8] is the block of 8 positions ending at 8, the whole array: 31.'
- q: For the same array, which entries does prefix(7) read, and what is the result?
  a: '7 is 111 in binary: the entries are tree[7] = 2, tree[6] = 14 and tree[4] = 9 (7 → 6 → 4 → 0). The
    sum is 25, and indeed 3 + 1 + 4 + 1 + 5 + 9 + 2 = 25.'
- q: With n = 8, which entries change when a_3 grows by 10?
  a: 'Start at 3 and add the lowest set bit each time: 3, then 3 + 1 = 4, then 4 + 4 = 8, then 16 is past
    n. So tree[3], tree[4] and tree[8] get +10, which are exactly the blocks that contain position 3.'
- q: With n = 5 and a difference tree, you add 4 to positions 2..4 and then read position 5. Which two
    point updates are made, and what is read?
  a: 'The difference at 2 gets +4 and the difference at 5 gets −4. Reading position 5 is the prefix up
    to 5, which is +4 − 4 = 0, plus the starting value: the addition did not reach position 5.'
- q: Count the inversions of [3, 1, 2] the way Theorem 5.2.4 does, step by step.
  a: 'Ranks are 3, 1, 2. At j = 0 no earlier element: 0. At j = 1 (rank 1) the earlier elements with rank
    at most 1 number 0, so 1 − 0 = 1. At j = 2 (rank 2) the earlier elements with rank at most 2 number
    1 (the rank 1), so 2 − 1 = 1. The total is 2: the pairs (3, 1) and (3, 2).'
- q: Counts are [1, 0, 1, 1, 0, 1, 1, 0] for n = 8, so tree = [1, 1, 1, 3, 0, 1, 1, 5]. Run the descent
    for k = 4. What is the result?
  a: 'Step 8: pos + 8 = 8 is allowed, but tree[8] = 5 is not less than 4, so pos stays 0. Step 4: tree[4]
    = 3 < 4, so pos = 4 and k = 1. Step 2: tree[6] = 1 is not less than 1. Step 1: tree[5] = 0 < 1, so
    pos = 5 and k = 1. The result pos + 1 = 6 is the place of the 4th one (places 1, 3, 4, 6).'
- q: Why can the tree not answer "smallest value in a range" in the same way as sums when values change?
    Use a = [5, 2, 7, 2] and set a_2 to 9.
  a: A block of minimums cannot be corrected from the change alone. Before, tree[2] = min(5, 2) = 2; after
    a_2 = 9 it must be min(5, 9) = 5, but the update chain only knows the old and new value of a_2, not
    a_1. Sums can be fixed by adding the difference, a minimum cannot. Use a segment tree (topic 5.3)
    for that.
