# Rubrics (DESIGN_TRACKS_PLAN.md Section 10.7). Anchors describe observable evidence. Score = sum(weight x score / 2).
# Generated once from a script; edit by hand now. Extend only with Saurabh's approval.
- id: rubric-lld-build-v1
  name: LLD build or mock
  criteria:
  - id: requirements
    name: Requirements and assumptions
    weight: 10
    critical: false
    anchors:
      0: No requirements or assumptions written down
      1: Requirements listed, but at least one assumption that changes the design is unstated
      2: Requirements and assumptions written before coding; every assumption the design depends on is stated
  - id: entities
    name: Entities and responsibilities
    weight: 20
    critical: true
    anchors:
      0: One class holds most of the logic, or classes are named but own no behaviour
      1: Entities match the nouns, but at least one behaviour sits in a class that does not own its data
      2: Each behaviour sits with the data it uses; each class can be described in one sentence without 'and'
  - id: extensibility
    name: Extensibility under the stated changes
    weight: 20
    critical: true
    anchors:
      0: A stated change request needs edits in 3 or more existing classes, or breaks existing tests
      1: Every stated change request works, but at least one needs edits to unrelated existing behaviour
      2: Every stated change request is applied by adding code or editing one class; shown with a worked change
  - id: correctness
    name: 'Correctness: kit tests pass'
    weight: 20
    critical: true
    anchors:
      0: Fewer than half of the kit tests pass
      1: At least half pass, but not all
      2: All kit tests pass
  - id: restraint
    name: Pattern use justified, no over-engineering
    weight: 10
    critical: false
    anchors:
      0: A pattern is used with no stated force, or a stated change is left unsupported where a pattern is needed
      1: Patterns used, with a reason for only some
      2: Each pattern is tied to a named force with a number or change request; the simplest option was considered
        in writing
  - id: concurrency
    name: Concurrency or state safety
    weight: 10
    critical: false
    critical_when: the prompt involves concurrency or states
    anchors:
      0: Shared state is mutated from several threads or states with no protection or transition rule, and the prompt
        involves this
      1: Protection exists but one illegal state or interleaving is still reachable
      2: Every shared mutable value has a stated owner or lock, and illegal transitions are rejected; shown with
        a test or an argument
  - id: readability
    name: Readability
    weight: 10
    critical: false
    anchors:
      0: Names do not match what the code does, or methods run over 40 lines
      1: Names are accurate; one method mixes two levels of detail
      2: Names are accurate, methods are short, and the public interface reads like the requirements
- id: rubric-hld-mock-v1
  name: HLD full design (mock)
  criteria:
  - id: requirements
    name: Requirements and scope
    weight: 10
    critical: false
    anchors:
      0: Starts designing with no questions and no stated scope
      1: Scope stated; fewer than half of the critical questions asked
      2: Scope stated and the critical questions asked; non-goals named
  - id: estimation
    name: Estimation
    weight: 15
    critical: true
    anchors:
      0: No numbers, or numbers more than 10x from the reference, or no working shown
      1: Working shown; key numbers within 10x of the reference
      2: Working shown; key numbers within 3x of the reference; the numbers are used to choose components
  - id: api-data
    name: API and data model
    weight: 15
    critical: false
    anchors:
      0: No API or no data model
      1: API and data model given, but one main access pattern is not served by the data model
      2: API and data model given; every main access pattern maps to a key or index
  - id: design
    name: High-level design
    weight: 20
    critical: true
    anchors:
      0: Components are listed without the read path and write path
      1: Read path and write path traced, but one component has no stated job or size
      2: Read path and write path traced step by step; each component's job and size follow from the numbers
  - id: deep-dive
    name: Deep dive
    weight: 20
    critical: true
    anchors:
      0: No component is examined beyond its name
      1: One component examined; the mechanism or its limit is missing
      2: One component examined with its mechanism, its data, and the number at which it stops working
  - id: failure
    name: Bottlenecks and failure
    weight: 10
    critical: false
    anchors:
      0: No failure or bottleneck discussed
      1: One failure named, with no detection or effect on users
      2: At least two failures named, each with detection and the effect on users
  - id: tradeoffs
    name: Trade-offs and decision record
    weight: 10
    critical: false
    anchors:
      0: No alternative mentioned
      1: An alternative mentioned, without the numbers that would flip the choice
      2: Choice, two alternatives, and the change in numbers that would flip the choice, written down
- id: rubric-hld-deep-dive-v1
  name: HLD deep dive
  criteria:
  - id: requirements
    name: Requirements and the critical questions
    weight: 15
    critical: false
    anchors:
      0: No questions asked
      1: Some questions asked; at least one critical question missed
      2: All critical questions asked or their answers stated as assumptions
  - id: numbers
    name: Numbers
    weight: 20
    critical: true
    anchors:
      0: No numbers, or more than 10x from the reference
      1: Key numbers within 10x of the reference, with working
      2: Key numbers within 3x of the reference, with working, and used to size the mechanism
  - id: mechanism
    name: Mechanism and data
    weight: 30
    critical: true
    anchors:
      0: The mechanism is named but not described
      1: The mechanism is described, but a data structure or message is missing
      2: The mechanism is described step by step with its data structures, and a small example is traced
  - id: failure
    name: Failure behaviour
    weight: 20
    critical: true
    anchors:
      0: No failure considered
      1: One failure considered, without its effect on users or its detection
      2: Main failures considered; each with detection, effect on users, and recovery
  - id: tradeoffs
    name: Trade-offs and decision record
    weight: 15
    critical: false
    anchors:
      0: No alternative mentioned
      1: An alternative mentioned, without numbers
      2: Choice, two alternatives and the flip condition with numbers written down
- id: rubric-hld-failure-v1
  name: HLD failure exercise
  criteria:
  - id: prediction
    name: Correct prediction of behaviour
    weight: 40
    critical: true
    anchors:
      0: The predicted behaviour contradicts the design as given
      1: The prediction is right in outline but misses a step that changes what users see
      2: The prediction follows the design step by step and matches the reference outcome
  - id: detection
    name: Detection
    weight: 20
    critical: false
    anchors:
      0: No way to notice the failure is given
      1: A signal is named, with no threshold or place it is measured
      2: A signal is named with where it is measured and the value that triggers action
  - id: mitigation
    name: Mitigation with its cost
    weight: 40
    critical: true
    anchors:
      0: No mitigation, or one that does not address the failure
      1: A mitigation that works, with no cost stated
      2: A mitigation that works, with its cost (money, latency, staleness or new failure modes) stated
