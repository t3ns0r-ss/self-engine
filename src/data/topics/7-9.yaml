drill:
- problem: ac-abc227_d
  answer:
    topic: '1.4'
    card: answer-search
  property: x projects are possible exactly when the sum of min(A_i, x) is at least K·x, because a department
    gives at most one employee to each project; this is monotone in x, so binary search on x with a 64-bit
    sum.
  why_others_fail: A flow with a source, the departments and the projects is correct but has up to 10^12
    units of supply; the counting inequality replaces it, and no network is built.
- problem: cf-1525D
  answer:
    topic: '3.3'
    card: two-index
  property: In sorted order the best assignment never crosses, so dp[i][j] = the smallest total cost using
    the first i armchairs for the first j occupied ones.
  why_others_fail: All armchairs lie on a line and the cost is the distance, so a sorted two-index DP
    is O(n²); a matching has no costs, and a minimum-cost flow is not in this course.
- problem: cf-1426E
  answer:
    topic: '0.5'
    card: permutations
  property: The largest number of wins is a sum of three minimums; the smallest is found by trying all
    six orders in which the first player's symbols are matched against the second player's.
  why_others_fail: Only three kinds of items on each side, so the flow tag does not mean a network is
    needed; trying the six orders is exact.
- problem: cf-1016D
  answer:
    topic: '7.8'
    card: invariant-then-build
  property: The XOR of all row values must equal the XOR of all column values; if it does, put the row
    XORs in the first column and the column XORs in the last row and correct the corner.
  why_others_fail: 'There is no limit to fill: the totals are XORs, not sums, so a flow does not apply;
    an invariant and a direct build do.'
- problem: cf-727D
  answer:
    topic: '1.5'
    card: sorted-matching
  property: The six sizes lie on a line and every list of allowed sizes is one size or two neighbours,
    so process the sizes in order and give the two-size participants the smaller size while it lasts.
  why_others_fail: Intervals on a line are nested enough for a sorted greedy; a general matching is needed
    only when the allowed lists are arbitrary.
- problem: cf-965D
  answer:
    topic: '1.3'
    card: fixed-window
  property: The most frogs equal the smallest sum of l consecutive stone counts; it is a minimum cut that
    is a window of consecutive positions, so a sliding window sum finds it.
  why_others_fail: The graph is a line of positions, so the cut is a window and not an arbitrary set;
    building the network is not needed.
- problem: cf-498C
  answer:
    topic: '7.9'
    card: flow-or-cut
  property: An operation takes one unit of a prime from an odd-position item and one from an even-position
    item along a given pair; per prime, source to odd item (its exponent), pair edges, even item to sink
    (its exponent), and the answer is the sum of the flows over all primes.
  why_others_fail: Greedy choices of pairs can use a prime on one pair that another pair needed more;
    a flow lets the later choices undo the earlier ones.
- problem: cf-510E
  answer:
    topic: '7.9'
    card: flow-or-cut
  property: Every fox needs exactly two neighbours and a prime sum joins an even and an odd age, so a
    flow with source to even fox (2), allowed pair (1), odd fox to sink (2) must saturate; the tables
    are the cycles of the chosen edges.
  why_others_fail: There are no costs, only a requirement of exactly two partners per fox; trying all
    seatings is hopeless, and a greedy first choice can strand a fox.
lookalike_pairs:
- a: cf-1139E
  b: lc-find-the-maximum-number-of-marked-indices
  a_tool:
    topic: '7.9'
    card: pairing
  b_tool:
    topic: '1.5'
    card: sorted-matching
  shared_surface: Both ask for the largest number of disjoint pairs between items of one group and items
    of another, where a rule says which two items may be paired.
  flipping_difference: In the second, two indices may be paired when 2·x ≤ y, a threshold in one sorted
    order, so two pointers over the sorted array pair the smallest items with the next ones and nothing
    is blocked. In the first, the allowed pairs are arbitrary lists (which students a club has), and an
    early choice can block a later club, so a matching search is needed.
  flipping_input: Club A can offer the values {0, 1} and club B only {0}. Giving A its first value 0 blocks
    B, so the first-fit answer is 1 pair; the matching gives A the value 1 and B the value 0, 2 pairs.
- a: ac-practice2_d
  b: ac-abc407_d
  a_tool:
    topic: '7.9'
    card: pairing
  b_tool:
    topic: '3.8'
    card: assignment-mask
  shared_surface: Both place dominoes (1 × 2 tiles) on disjoint pairs of neighbouring cells of a grid.
  flipping_difference: The first asks only for the largest number of tiles on a grid up to 100 by 100,
    a matching on the chessboard colouring. The second scores the exact set of uncovered cells (their
    XOR) on a grid of at most 20 cells, so the state is a mask of covered cells.
  flipping_input: On a 2 × 2 grid with all cells free, the first problem answers 2 tiles. In the second,
    with the values 1, 2, 4, 8 in the four cells, the best score is 15, reached with no domino at all.
self_test:
- q: In the network s→a 1, s→b 1, a→b 1, a→t 1, b→t 1 the path s, a, b, t is pushed first. What path does
    the residual graph offer next, and what is the final flow?
  a: 'The path s, b, a, t: it goes from s to b (1 left), then from b back to a along the backward edge
    of a→b (that edge carries 1 unit), then from a to t (1 left). Pushing it cancels the flow on a→b,
    and the final flow is 2, the capacity of the cut {s} (Theorem 7.9.1, step 3). Without backward edges
    the algorithm would stop at 1.'
- q: The edges are s→a 5, a→t 3 and s→t 2. What is the maximum flow, and which vertices form the source
    side of the minimum cut recovered from the residual graph?
  a: The flow is 3 + 2 = 5. After it, s→a has 2 left, so a is reachable, and both edges into t are full,
    so t is not. The source side is {s, a}, and the cut edges are a→t (3) and s→t (2), capacity 5 (Theorem
    7.9.1, step 4).
- q: A two-way street between junctions 1 and 2 carries at most 3 cars per hour in each direction. How
    is it written in a network, and what changes if only the edge 1→2 is added?
  a: Two directed edges 1→2 and 2→1 of capacity 3 each. With only 1→2, nothing can travel from 2 to 1,
    and a question about a flow from 2 to 1 answers 0 instead of 3. In the cut counts, an edge from the
    sink side back to the source side must not be counted (the bug "counting edges in both directions").
- q: Three people are friends with each other and are to be paired up. Why does a matching algorithm for
    two groups give a wrong answer, and what is the true answer?
  a: The friendship graph is a triangle, which is not bipartite; there are no two groups. Splitting each
    person into a left and a right copy gives 3 pairs, but each real person can be in one pair only, so
    at most 1 pair exists (a pair uses 2 of the 3 people). Topic 3.8 handles up to about 20 people with
    a mask.
- q: Three people each like all three hats. What is the size of a largest matching, and how many ways
    are there to give everyone a different hat? Which tool counts the ways?
  a: The matching has 3 pairs. The number of ways is 3 · 2 · 1 = 6. A matching algorithm finds one assignment;
    counting needs the bitmask DP of topic 3.8 over the hats given out, or a product here.
- q: In the directed graph with edges 1→2, 2→3, 1→3, 3→4, 4→5, 3→5, find the largest number of paths from
    1 to 5 that share no edge, and the largest number that share no vertex except 1 and 5. Why do they
    differ?
  a: 'Edge-disjoint: 2 (the paths 1,3,5 and 1,2,3,4,5 share the vertex 3 but no edge). Vertex-disjoint:
    1, because every path passes through vertex 3, and in the split graph the edge from the entry of 3
    to the exit of 3 has capacity 1 (Theorem 7.9.8).'
- q: A 2 by 2 grid has a coin in every cell, and one move empties a row or a column. What are the largest
    matching, the smallest vertex cover and the largest independent set of the graph with rows and columns
    as vertices?
  a: The graph is the complete bipartite graph on 2 + 2 vertices. The largest matching has 2 pairs (row
    1 with column 1, row 2 with column 2), the smallest cover has 2 vertices (both rows), and the largest
    independent set has 4 − 2 = 2 vertices (both columns, or both rows) (Theorem 7.9.7).
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-653D
  - cf-1082G
