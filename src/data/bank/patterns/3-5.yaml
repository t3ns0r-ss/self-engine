# Patterns for topic 3.5 (Grid and counting DP modulo a prime). Provisional until the lesson maps them to Recognition Cards.
topic: "3.5"
patterns:
  - id: grid-paths
    name: Counting paths in a grid
    description: Number of right/down paths through a grid with blocked cells, modulo a prime.
    precondition: Moves form an acyclic order on the cells, so each cell's count is the sum of its predecessors' counts.
  - id: sequence-counting
    name: Counting sequences
    description: Count sequences or strings satisfying local rules, modulo a prime.
    precondition: Whether a sequence can be extended depends only on a small state (last element, current sum).
  - id: partition-counting
    name: Ordered and unordered sums
    description: Count ways to write n as a sum of allowed parts, either as ordered sequences or as multisets.
    precondition: For unordered sums the loop over part types is outside the loop over totals, so each multiset is counted once.
  - id: range-sum-transition
    name: Transitions over a range
    description: dp[i] is the sum of dp[j] over a contiguous range of j; keep prefix sums of dp to make each transition O(1).
    precondition: The set of predecessors is a contiguous range of indices.
