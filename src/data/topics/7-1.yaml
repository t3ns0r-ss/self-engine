    the largest total score. †
- id: cf-461B
  role: review
  card: subtree-dp
  review_set: 2
  summary: A tree of n ≤ 10^5 vertices, each coloured black or white, with at least one black vertex;
    the number of ways to remove some edges so that every component has exactly one black vertex, modulo
