  - id: cf-492C
    role: checkpoint
    card: extreme-first
    summary: "Raise exam grades (each at most r) to reach an average of at least avg; one point in exam i costs b_i essays; the fewest essays."
  - id: cf-545C
    role: checkpoint
    card: left-to-right-forced
    summary: "Trees at increasing positions with heights; each may be felled left, right or left standing, and fallen trees may not overlap any point already taken; the most trees felled."
  - id: cses-1632
    role: checkpoint
    card: interval-selection
    summary: k ≤ n club members watch films (n ≤ 2·10^5); each member watches non-overlapping films; the largest total number of films watched.
  - id: ac-abc103_d
    role: review
    card: interval-selection
    review_set: 1
    summary: N islands in a row joined by bridges; M requests ask that islands a_i and b_i be disconnected; the fewest bridges to remove.
  - id: lc-reduce-array-size-to-the-half
    role: review
    card: extreme-first
