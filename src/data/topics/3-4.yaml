# Topic 3.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.4"
draft: true
cards:
  - id: lis
    name: Longest increasing subsequence
    decisive_property: "The answer is the longest subsequence in which each chosen element must exceed (or be at least) the previous chosen one, a rule between consecutive chosen elements only; then the smallest possible last value for each length forms a sorted array, and each element updates it by one binary search."
    from_theorem: Theorem 3.4.2
    how_to_test: "Check that the rule compares only consecutive chosen elements and is an order (<, ≤); decide strict (lower_bound) or non-strict (upper_bound); for other pairwise rules with n ≤ 5000, use the O(n²) table of Theorem 3.4.1."
    weak_signals:
      - "Longest strictly increasing or non-decreasing subsequence, n up to 2·10^5"
      - "Fewest elements to delete or change so that the array becomes sorted"
      - "For every position, the longest increasing subsequence ending there"
    kill_signals:
      - "The chosen elements must be contiguous (a subarray): a scan or a window, not a subsequence"
      - "Elements may be reordered: then sorting answers it"
    lookalikes:
      - description: "The longest contiguous strictly increasing subarray"
        needs: "sort-then-scan (1.1)"
        flipping_difference: "Contiguity means a single scan counting the current run is enough; a subsequence may skip elements, which needs the tails array."
    complexity: "O(n log n); O(n²) for the simple table."
  - id: lis-reduction
    name: Chains after sorting one key
    decisive_property: "Items have two keys and a chain needs both to increase (nested envelopes, boxes, pairs, players by age and score); after sorting by the first key, with ties ordered so that equal first keys cannot follow each other, a chain is exactly an increasing subsequence of the second key."
    from_theorem: Theorem 3.4.3
    how_to_test: "Write the chain condition as 'both keys increase'; choose the tie order for equal first keys (second key decreasing for strict chains) and check a small case with equal first keys by hand."
    weak_signals:
      - "Put boxes or envelopes inside each other; stack cuboids"
      - "Choose a team or a sequence where two attributes must both increase"
      - "Order is free in the input, but the chain must be increasing in two measures"
    kill_signals:
      - "Only one key matters (plain sorting or plain LIS)"
      - "The goal is the number of chains or groups needed to cover all items (a greedy with sorted piles, or Dilworth-style counting)"
    lookalikes:
      - description: "The longest chain of pairs (a, b) where b of one is less than a of the next"
        needs: "interval-selection (1.5)"
        flipping_difference: "Each pair is an interval and the chain needs them disjoint in order: earliest end first is optimal. Nested envelopes need both sides increasing, which sorting alone does not give."
    complexity: "O(n log n) after sorting."
  - id: lcs
    name: Longest common subsequence
    decisive_property: "Two sequences are matched in order, the best value for two prefixes depends only on shorter prefixes (matching two equal last elements never hurts), and n·m fits; the table over prefix pairs gives the answer and, walking back, one optimal matching."
    from_theorem: Theorem 3.4.4
    how_to_test: "Name the state (i, j) = prefix lengths, list the three moves (skip a_i, skip b_j, match both), and check n·m ≤ about 10^7."
    weak_signals:
      - "Two strings or arrays; keep elements in order on both sides"
      - "Fewest deletions to make two strings equal; lines between equal numbers that must not cross"
      - "Lengths up to 1000–5000 each"
    kill_signals:
      - "One sequence has distinct values that are a permutation of the other's: the matching reduces to LIS in O(n log n)"
      - "Only whether one is a subsequence of the other: two pointers (1.3)"
    lookalikes:
      - description: "Is s a subsequence of t?"
        needs: "merge-walk (1.3)"
        flipping_difference: "Matching each character of s at its first possible place in t is never worse, so two pointers decide it in O(|s| + |t|); the LCS table is needed only when both sides may skip characters."
    complexity: "O(n·m) time, O(m) memory with two rows if only the length is needed."
  - id: edit-distance
    name: Edit distance
    decisive_property: "One string is turned into another by single-character insertions, deletions and replacements with per-operation costs; every edit sequence is an alignment read left to right, so the cheapest cost for two prefixes comes from the three shorter prefix pairs."
    from_theorem: Theorem 3.4.5
    how_to_test: "Check that the operations act on single characters with fixed costs (possibly different per operation), set the base cases E[i][0] and E[0][j], and check n·m."
    weak_signals:
      - "Fewest operations to turn one string into another: insert, delete, replace"
      - "Is a string within distance k of another; spelling correction"
      - "Different costs for deleting, inserting and replacing"
    kill_signals:
      - "Only replacements are allowed and the strings have equal length: count the differing positions"
      - "Only deletions on both sides: n + m − 2·LCS"
    lookalikes:
      - description: "Fewest deletions from both strings to make them equal"
        needs: "lcs (3.4)"
        flipping_difference: "Without insertions or replacements, the answer is n + m − 2·LCS; edit distance is needed when a replacement can do in one step what costs two deletions."
    complexity: "O(n·m)."
problems:
  - id: cses-1145
    role: worked_example
    summary: The length of the longest strictly increasing subsequence of an array of n ≤ 2·10^5 values.
  - id: ac-abc185_e
    role: worked_example
    summary: Delete elements from two sequences (N, M ≤ 1000) so that the rests have equal length; the
      cost is the number deleted plus the positions where the rests differ. Minimise it.
  - id: lc-increasing-triplet-subsequence
    role: ladder
    card: lis
    rung: 1
    twist: Base case of the card
    summary: Decide whether an array (n ≤ 5·10^5) has indices i < j < k with strictly increasing values,
      in O(n) time and O(1) memory.
    hints:
      - In the smallest-tail array of Theorem 3.4.2, which entries matter if you only care about length
        3?
      - 'Only the first two: the smallest value seen so far (tail of length 1) and the smallest tail of
        an increasing pair.'
      - 'Keep first and second (both +∞ at the start); for each x: if x ≤ first, first = x; else if x
        ≤ second, second = x; else return true.'
  - id: lc-longest-increasing-subsequence
    role: ladder
    card: lis
    rung: 2
    twist: The whole tails array, not just two entries.
    summary: The length of the longest strictly increasing subsequence of up to 2500 numbers.
    hints:
      - O(n²) passes here, but which array lets you do it in O(n log n)?
      - tails[k] = smallest last value of a strictly increasing subsequence of length k + 1; it is sorted
        (Theorem 3.4.2).
      - For each x, replace the first tail ≥ x (lower_bound), or append if there is none; the answer is
        the size of tails.
  - id: lc-find-the-longest-valid-obstacle-course-at-each-position
    role: ladder
    card: lis
    rung: 3
    twist: Non-decreasing instead of strictly increasing, and an answer for every position.
    summary: For every position i of an array (n ≤ 10^5), the longest non-decreasing subsequence that
      ends at i and uses it.
    hints:
      - Which single call changes when equal values may follow each other?
      - 'lower_bound becomes upper_bound: an equal tail may be extended, so x replaces the first tail
        strictly greater than x.'
      - For each i, p = upper_bound(tails, x) − begin; the answer for i is p + 1; then set tails[p] =
        x (or append).
  - id: ac-abc393_f
    role: ladder
    card: lis
    rung: 4
    twist: 'Read more than the length from the tails array: how many lengths have a tail ≤ X.'
    summary: 'Q ≤ 2·10^5 queries (R, X) on an array of N ≤ 2·10^5 values: the longest strictly increasing
      subsequence of the first R elements that uses only values ≤ X.'
    hints:
      - Can you answer all queries with the same R from one state of the tails array?
      - 'Yes: process the queries sorted by R while adding A_1, A_2, … to the tails array. A subsequence
        of length k with values ≤ X exists exactly when tails[k − 1] ≤ X.'
      - tails is sorted, so the answer is upper_bound(tails, X) − begin at the moment R elements have
        been added; print the answers in the input order.
  - id: ac-abc354_f
    role: ladder
    card: lis
    rung: 5
    twist: For every element, the longest increasing subsequence ending there and the longest starting
      there.
    summary: For T test cases (total N ≤ 2·10^5), list the indices i such that A_i belongs to at least
      one longest strictly increasing subsequence.
    hints:
      - If A_i is in some longest increasing subsequence, what do the parts before and after it look like?
      - A longest increasing subsequence ending at i and one starting at i, glued at A_i. Compute L[i]
        with the tails array left to right and R[i] right to left (on negated values).
      - i qualifies exactly when L[i] + R[i] − 1 equals the overall length; reset the tails array between
        test cases.
  - id: cf-4D
    role: ladder
    card: lis-reduction
    rung: 1
    twist: Base case of the card
    summary: A card of size w × h and n ≤ 5000 envelopes; build the longest chain of envelopes, each strictly
      larger in both sides than the previous, starting with one larger than the card. Print its length
      and the envelopes.
    hints:
      - Which envelopes can never be used, and what order do the rest of a chain follow?
      - Drop envelopes that do not strictly contain the card. A chain is increasing in width, so after
        sorting by width it is an increasing subsequence in both sides (Theorem 3.4.3).
      - 'With n ≤ 5000, the O(n²) table of Theorem 3.4.1 is enough: dp[i] = 1 + max dp[j] over j before
        i with smaller width and height; store the j that gave the max and walk back to print. Print 0
        if nothing fits.'
  - id: lc-maximum-height-by-stacking-cuboids
    role: ladder
    card: lis-reduction
    rung: 2
    twist: Each item may be rotated, and the chain maximises the total height instead of the length.
    summary: Stack some of n ≤ 100 cuboids, each rotatable, so that each one fits under the one below
      in all three sides (≤); maximise the total height.
    hints:
      - For one cuboid, which rotation is never worse than the others?
      - 'Sort its three sides and use the largest as the height: if a stacking works with some rotations,
        it also works with all cuboids sorted this way (compare sorted sides).'
      - Sort the cuboids by their sorted sides; h[i] = height_i + max h[j] over earlier j with all three
        sides ≤; answer max h. O(n²).
  - id: lc-delete-columns-to-make-sorted-iii
    role: ladder
    card: lis-reduction
    rung: 3
    twist: '"Increasing" is a check across all rows, so the order is not a single key.'
    summary: Up to 100 strings of equal length ≤ 100; delete the fewest columns so that every string reads
      in non-decreasing order.
    hints:
      - Instead of deleting columns, think about which columns you keep. What must hold between two kept
        columns i < j?
      - In every row, s[i] ≤ s[j]. Kept columns form a chain under this rule, and the rule only compares
        consecutive kept columns.
      - keep[j] = 1 + max keep[i] over i < j that pass the check in every row (Theorem 3.4.1); answer
        = length − max keep. O(L²·n).
  - id: lc-uncrossed-lines
    role: ladder
    card: lcs
    rung: 1
    twist: Base case of the card
    summary: Draw lines between equal numbers of two arrays (lengths ≤ 500) written on two parallel lines,
      with no two lines crossing or sharing an endpoint; the most lines.
    hints:
      - If lines do not cross, how do their endpoints appear in the two arrays?
      - 'In the same order on both sides: the matched numbers form a common subsequence.'
      - The answer is the length of the longest common subsequence (Theorem 3.4.4).
  - id: lc-maximum-length-of-repeated-subarray
    role: ladder
    card: lcs
    rung: 2
    twist: 'Contiguous: a common substring instead of a common subsequence.'
    summary: The longest subarray that appears in both of two arrays (lengths ≤ 1000).
    hints:
      - What should a table entry mean so that the contiguity is kept?
      - L[i][j] = length of the longest common block ending exactly at a_i and b_j.
      - L[i][j] = L[i − 1][j − 1] + 1 if a_i = b_j, else 0; the answer is the largest entry, not the last
        one.
  - id: lc-minimum-ascii-delete-sum-for-two-strings
    role: ladder
    card: lcs
    rung: 3
    twist: Each skipped character has a cost, and the total cost is minimised.
    summary: Make two strings (lengths ≤ 1000) equal by deleting characters; minimise the sum of the ASCII
      codes of the deleted characters.
    hints:
      - What are the moves at (i, j), and what does each cost?
      - Delete s_i (cost its code), delete t_j (cost its code), or keep both if they are equal (cost 0).
      - cost[i][0] and cost[0][j] are prefix sums of codes; cost[i][j] = cost[i − 1][j − 1] if equal,
        else the cheaper of the two deletions.
  - id: ac-dp_f
    role: ladder
    card: lcs
    rung: 4
    twist: Print one longest common subsequence, not only its length.
    summary: Print any longest common subsequence of two strings s and t (lengths ≤ 3000).
    hints:
      - With the full table filled, where does an optimal matching end?
      - 'At (n, m): if s_n = t_m that character is the last of an optimal subsequence; otherwise the value
        comes from (n − 1, m) or (n, m − 1), whichever is larger.'
      - Walk back from (n, m) with these rules, collect the matched characters, and reverse them. Keep
        the whole table (9·10^6 ints).
  - id: lc-edit-distance
    role: ladder
    card: edit-distance
    rung: 1
    twist: Base case of the card
    summary: The fewest insertions, deletions and replacements of single characters that turn one word
      into another (lengths ≤ 500).
    hints:
      - What are E[i][0] and E[0][j]?
      - 'i deletions and j insertions: turning a prefix into the empty string, or the reverse.'
      - E[i][j] = E[i − 1][j − 1] if the characters are equal, else 1 + min(E[i − 1][j], E[i][j − 1],
        E[i − 1][j − 1]) (Theorem 3.4.5).
  - id: cses-1639
    role: ladder
    card: edit-distance
    rung: 2
    twist: 'Strings up to 5000 characters: 2.5·10^7 cells, where two rows save the memory.'
    summary: The edit distance between two strings of lengths up to 5000.
    hints:
      - Which entries does E[i][·] read?
      - Only row i − 1 and the entry to its left in row i.
      - Keep two rows of m + 1 ints (or the full table, about 100 MB, if the memory limit allows); swap
        them after each i.
  - id: ac-abc386_f
    role: ladder
    card: edit-distance
    rung: 3
    twist: Only "is the distance at most K ≤ 20" is asked, for strings of length up to 5·10^5.
    summary: Can S be turned into T (lengths ≤ 5·10^5) with at most K ≤ 20 single-character insertions,
      deletions and replacements?
    hints:
      - If E[i][j] ≤ K, how far apart can i and j be?
      - At most K, because each unmatched character costs at least 1. So only the band |i − j| ≤ K of
        the table matters.
      - If ||S| − |T|| > K, print No. Otherwise store E[i][i + δ] for δ in [−K, K], treat cells outside
        the band as K + 1, and cap values at K + 1. O(|S|·K).
  - id: lc-delete-operation-for-two-strings
    role: drill
    summary: The fewest single-character deletions, from either of two words (lengths ≤ 500), that make
      them equal.
  - id: lc-longest-ideal-subsequence
    role: drill
    summary: The longest subsequence of a lowercase string (length ≤ 10^5) in which neighbouring letters
      are at most k ≤ 25 apart in the alphabet.
  - id: cses-3403
    role: drill
    summary: Print the length and one example of a longest common subsequence of two integer arrays (n,
      m ≤ 1000).
  - id: lc-longest-arithmetic-subsequence
    role: drill
    summary: The longest arithmetic subsequence of an array of n ≤ 1000 values in [0, 500].
  - id: ac-abc204_d
    role: drill
    summary: Cook N ≤ 100 dishes (times ≤ 1000) in two ovens, each oven one dish at a time; the earliest
      moment all dishes are done.
  - id: lc-last-stone-weight-ii
    role: drill
    summary: Up to 30 stones (weights ≤ 100); smashing two leaves their difference (or nothing if equal).
      The smallest possible weight of the last stone, or 0.
  - id: lc-number-of-matching-subsequences
    role: drill
    summary: Count how many of 5000 words (lengths ≤ 50) are subsequences of a string s of length ≤ 5·10^4.
  - id: lc-longest-arithmetic-subsequence-of-given-difference
    role: drill
    summary: The longest subsequence of an array (n ≤ 10^5) in which neighbours differ by exactly a given
      d.
  - id: lc-wiggle-subsequence
    role: drill
    summary: The longest subsequence of an array (n ≤ 1000) whose consecutive differences strictly alternate
      in sign.
  - id: lc-russian-doll-envelopes
    role: lookalike
    summary: The most envelopes (n ≤ 10^5) that can be put one inside another, each strictly smaller in
      width and height than the one around it; rotation is not allowed.
  - id: lc-maximum-length-of-pair-chain
    role: lookalike
    summary: The longest chain of pairs (n ≤ 1000) where the second number of each pair is less than the
      first number of the next; pairs may be chosen in any order.
  - id: lc-minimum-operations-to-make-a-subsequence
    role: lookalike
    summary: The fewest insertions into arr (length ≤ 10^5) so that target (length ≤ 10^5, distinct values)
      becomes a subsequence of it.
  - id: lc-longest-common-subsequence
    role: lookalike
    summary: The length of the longest common subsequence of two strings of lengths ≤ 1000.
drill:
  - problem: lc-delete-operation-for-two-strings
    answer_card: lcs
    answer_topic: '3.4'
    property: 'Only deletions are allowed, so what survives is a common subsequence; keeping the longest
      one deletes the fewest: n + m − 2·LCS.'
    why_others_fail: Edit distance would allow a replacement for cost 1, which here costs two deletions;
      matching letters greedily can pick the wrong copy of a repeated letter.
  - problem: lc-longest-ideal-subsequence
    answer_card: lis
    answer_topic: '3.4'
    property: 'The rule compares only consecutive chosen letters, so the best subsequence ending in each
      letter is all you need: best[c] = 1 + max best[c′] over the letters c′ within k (26 values instead
      of n indices).'
    why_others_fail: The O(n²) table of Theorem 3.4.1 is 10^10 steps; the tails array needs an order like
      <, and "within k" is not one.
  - problem: cses-3403
    answer_card: lcs
    answer_topic: '3.4'
    property: 'Both arrays keep their order and both may skip elements, with n·m = 10^6: the table over
      prefix pairs, then a walk back from (n, m) to print one subsequence.'
    why_others_fail: Two pointers only decide whether one array is a subsequence of the other; the reduction
      to LIS needs distinct values, and these arrays may repeat.
  - problem: lc-longest-arithmetic-subsequence
    answer_card: lis
    answer_topic: '3.4'
    property: 'The rule between consecutive chosen elements depends on the difference, so put it in the
      state: len[i][d] = 1 + len[j][d] over j < i with a_i − a_j = d, an O(n²) table as in Theorem 3.4.1.'
    why_others_fail: The difference is not given, so the one-value map of a fixed difference does not
      apply; the tails array needs an order between values, not equal differences.
  - problem: ac-abc204_d
    answer_card: subset-sums
    answer_topic: '3.3'
    property: 'Only the total time given to the first oven matters, and it is a subset sum ≤ 10^5: answer
      = min over reachable s of max(s, total − s).'
    why_others_fail: 'The greedy "next dish into the less loaded oven" fails: times 3, 3, 2, 2, 2 give
      7 that way, but 3 + 3 and 2 + 2 + 2 finish at 6. Nothing here is a sequence to keep in order.'
  - problem: lc-last-stone-weight-ii
    answer_card: subset-sums
    answer_topic: '3.3'
    property: Every order of smashing ends with |sum(A) − sum(B)| for some split into two groups, and
      every split can be reached; so find the reachable subset sum closest to half the total.
    why_others_fail: 'Always smashing the two heaviest stones fails: 3, 3, 2, 2, 2 leaves 2 that way,
      but the split 3 + 3 against 2 + 2 + 2 leaves 0.'
  - problem: lc-number-of-matching-subsequences
    answer_card: sorted-search
    answer_topic: '1.4'
    property: 'Deciding "is a subsequence" is greedy: match each letter at its first possible position
      after the previous one, found by binary search in that letter''s sorted list of positions.'
    why_others_fail: An LCS table per word is 5000 · 5·10^4 · 50 steps; it answers a harder question than
      the one asked.
  - problem: lc-longest-arithmetic-subsequence-of-given-difference
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'The predecessor of a value x must be exactly x − d, so best[x] = best[x − d] + 1 with best
      kept in a map by value: one index, one transition.'
    why_others_fail: The O(n²) table of Theorem 3.4.1 is 10^10 steps, and the tails array needs an order
      (<), not a fixed difference.
  - problem: lc-wiggle-subsequence
    answer_card: extra-small-state
    answer_topic: '3.2'
    property: Whether the next element may be taken depends only on whether the last step went up or down,
      so two numbers (longest ending with a rise, with a fall) updated in one pass suffice.
    why_others_fail: The O(n²) subsequence table of Theorem 3.4.1 also passes at n ≤ 1000, but it tracks
      the last index where only the last direction matters; the tails array does not apply because the
      rule is not an order.
lookalike_pairs:
  - a: lc-russian-doll-envelopes
    b: lc-maximum-length-of-pair-chain
    a_tool: 'lis-reduction (3.4): sort by width, equal widths by height descending, then LIS of the heights'
    b_tool: 'interval-selection (1.5): sort by the second number and take each pair that starts after
      the last taken one ends'
    flipping_difference: Both build the longest chain of pairs. In A both coordinates must increase, so
      after sorting one key the other still has to form an increasing subsequence. In B a pair only has
      to start after the previous one ends, like disjoint intervals, and the earliest end first is optimal.
  - a: lc-minimum-operations-to-make-a-subsequence
    b: lc-longest-common-subsequence
    a_tool: 'lis-reduction (3.4): replace each element of arr by its position in target, then LIS of the
      positions'
    b_tool: 'lcs (3.4): the O(n·m) table over prefix pairs'
    flipping_difference: Both are a longest common subsequence (A asks for |target| − LCS). In A the values
      of target are distinct, so each element of arr matches at most one position and the LCS is an increasing
      subsequence of positions, O(n log n) at 10^5. In B letters repeat, and at 1000 × 1000 the table
      is fast enough.
self_test: []
