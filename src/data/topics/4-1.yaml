- id: lc-number-of-operations-to-make-network-connected
  role: review
  card: components
  review_set: 1
  summary: n ≤ 10^5 computers are joined by cables; one operation moves a cable to join two computers
    that are not connected. Find the fewest operations that connect every computer, or −1 if there are
    too few cables.
- id: cf-1365D
  role: review
  card: grid-graph
  review_set: 1
  summary: On a grid with good people, bad people, walls and empty cells (n, m ≤ 50), you may turn empty
    cells into walls. Decide whether all good people can reach the exit in the bottom-right corner while
    no bad person can.
- id: ac-abc224_d
  role: review
  card: state-graph
  review_set: 1
  summary: A puzzle on a graph with nine vertices has eight numbered pieces and one empty vertex; a move
    slides a piece along an edge into the empty vertex. Find the fewest moves that put piece j on vertex
    j, or −1.
- id: ac-abc259_d
  role: review
  card: components
  review_set: 2
  summary: N ≤ 3000 circles are drawn in the plane. Can you get from a start point to a target point (both
    on circles) moving only along the circles?
- id: ac-abc211_d
  role: review
  card: unweighted-shortest
  review_set: 2
  summary: 'N cities and M roads (N, M ≤ 2·10^5): count the routes from city 1 to city N that take the
    fewest roads, modulo 10^9 + 7.'
- id: lc-word-ladder
  role: review
  card: state-graph
  review_set: 2
  summary: Change one letter at a time to turn beginWord into endWord, where every word on the way must
    be in a dictionary of at most 5000 words (length at most 10); print the number of words on the shortest
    sequence, or 0.
- id: cf-813C
  role: review
  card: unweighted-shortest
  review_set: 3
  summary: On a tree with n ≤ 2·10^5 vertices, Alice starts at vertex 1 and Bob at vertex x. They alternate
    moves (Bob first), each moving along an edge or staying. Alice wants to catch Bob as soon as possible
    and Bob wants to delay it; print the number of moves Alice makes.
- id: ac-abc184_e
  role: review
  card: grid-graph
  review_set: 3
  summary: On a grid up to 2000 × 2000 with walls, a start S, a goal G and teleporters marked by lowercase
    letters (a teleporter jumps to any cell with the same letter), find the shortest time from S to G,
