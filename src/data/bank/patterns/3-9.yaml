# Patterns for topic 3.9 (Meet in the middle). Cards of the lesson: size-band, sorted-merge, grid-path-split.
topic: "3.9"
patterns:
  - id: size-band
    name: Read the size first
    description: "n between about 30 and 45 (or a base-3 version of it): 2^n is far too many, 2^(n/2) per half is fine, and the answer is a pair of one choice from each half."
    precondition: The objective is a part from each half combined by a simple rule (a sum, an exclusive or), and each half has at most about 2^22 entries.
  - id: sorted-merge
    name: Merge the half lists by sorting
    description: Sort one list of half-answers and, for each entry of the other, find the partner by binary search, by two pointers, or by an exact key in a map; this includes four-sum, where the halves are pairs.
    precondition: The test on a pair is a lookup in one sorted list (equal, at most, closest) or monotone in both lists, so one pass of two pointers works.
  - id: grid-path-split
    name: Cut a path at its middle
    description: A path of 2k steps (a grid walk, a sequence of moves) is cut at step k; each half is enumerated by recursion, and the halves are matched per middle cell.
    precondition: Every path crosses the middle line in exactly one cell, and the condition on the whole path is a combination of one value from each half.
