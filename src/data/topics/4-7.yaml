  hints:
  - What does it mean that an edge belongs to exactly one simple cycle? Consider the pieces of the graph
    that stay together when a vertex is removed.
  - 'Split the edges into blocks: during the walk of Theorem 4.7.3, push each edge on a stack, and when
    a child c has low[c] ≥ tin[v], pop the edges down to (v, c): that is one block.'
  - A block is a single simple cycle exactly when it has as many edges as vertices; print the edges of
