# Patterns for topic 1.3 (Two pointers and sliding window). Provisional until the lesson maps them to Recognition Cards.
topic: "1.3"
patterns:
  - id: shrinkable-window
    name: Shrinkable window
    description: Longest or shortest contiguous segment where validity is closed under shrinking.
    precondition: If [l, r] is valid, every sub-window of it is valid.
  - id: fixed-window
    name: Fixed-size window
    description: Every window of length exactly k; update the window's value incrementally as it slides.
    precondition: The window's value can be updated in O(1) or O(log n) when one element enters and one leaves.
  - id: count-windows
    name: Count valid windows
    description: Count segments satisfying a monotone condition by counting the valid windows that end at each r.
    precondition: Validity is closed under shrinking, so for a fixed r the valid left ends form a range and contribute r − l + 1.
  - id: opposite-ends
    name: Opposite ends of a sorted array
    description: Pairs with a target sum or difference after sorting; the pointers move toward each other.
    precondition: Sorted order makes the pair condition monotone in each pointer.
  - id: merge-walk
    name: Walk two sorted sequences
    description: Walk two sorted arrays together to merge them, match elements, or count pairs across them.
    precondition: Both sequences are sorted, so once an element is passed it is never needed again and each pointer moves forward only.
