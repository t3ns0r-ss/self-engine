# Patterns for topic 6.3 (Trie, binary trie for max-XOR). Provisional until the lesson maps them to Recognition Cards.
topic: "6.3"
patterns:
  - id: prefix-tree
    name: Words in a prefix tree
    description: Insert words and count or list words with a given prefix, or the longest common prefix of a set.
    precondition: Words with a common prefix share the same path from the root.
  - id: max-xor
    name: Maximum XOR pair
    description: Maximum of x ⊕ y over pairs, or for a query x against a set, by walking a binary prefix tree from the highest bit.
    precondition: Bits decide from the highest down (2^b exceeds all lower bits), so taking the opposite bit whenever possible is optimal.
  - id: dictionary-split
    name: Splitting text into dictionary words
    description: Count or check ways to split a string into words from a dictionary by walking the prefix tree from each position.
    precondition: The words that can start at a position are found by one walk down the prefix tree.
  - id: xor-count
    name: Counting XOR below a bound
    description: Count pairs or subarrays with XOR less than k by walking the binary prefix tree along k's bits.
    precondition: Branches that already make the XOR smaller than k can be counted whole from stored subtree counts.
