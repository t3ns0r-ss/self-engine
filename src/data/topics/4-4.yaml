  choose: largest-edge
  when: The cost is the heaviest edge and the edges can be added in order of weight (Theorem 4.4.6).
  over:
  - card: dijkstra
    because: If the cost of a trip is the sum of its edges, shortest paths are needed.
    topic: '4.3'
  - card: cheapest-connect
    because: If the total weight of a network that connects everything is asked, the kept edges are summed
