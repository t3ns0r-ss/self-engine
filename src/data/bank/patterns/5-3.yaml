# Patterns for topic 5.3 (Segment tree, lazy propagation). Provisional until the lesson maps them to Recognition Cards.
topic: "5.3"
patterns:
  - id: point-range
    name: Point update, range query
    description: Any associative operation (sum, minimum, GCD) with single-element changes and range queries.
    precondition: The operation is associative, so a range splits into O(log n) stored nodes.
  - id: custom-node
    name: Rich node summaries
    description: Nodes store a summary (maximum subarray sum, bracket balance, longest run) merged from their two children.
    precondition: The merge of two adjacent summaries is associative and computable from the summaries alone.
  - id: lazy-add
    name: Range add with lazy tags
    description: Add a value to a range and query sums or minima over ranges.
    precondition: A pending addition can be applied to a node's summary without visiting its children.
  - id: lazy-assign
    name: Range assign with lazy tags
    description: Set a range to a value (and possibly also add), with tags composed in the right order.
    precondition: "Tags compose: two pending updates on a node can be combined into one."
  - id: tree-descent
    name: Searching inside the tree
    description: Find the first index where the prefix sum or value reaches x by walking down the tree.
    precondition: Each node's summary tells which child contains the answer.
