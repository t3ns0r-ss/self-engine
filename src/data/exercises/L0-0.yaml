- id: rev-1-2
  role: review
  type: recognise
  title: A logger passed to five classes
  prompt: A logger is created in main and passed to five classes. All five are destroyed before main ends. Decide how each class should hold the logger.
  card: ownership-pointer
  review_set: 1
  techniques:
  - L0.0
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: The logger outlives every user, so each class can hold a plain reference; no ownership is shared.
    why_others_fail: A shared_ptr in each class would add a count to a lifetime that is already clear.
  checkers: []
- id: rev-1-3
  role: review
  type: recognise
  title: A single-line wrapper
  prompt: A function opens a file, reads one integer and closes it. Nothing between the open and the close can throw and there is only one return. A colleague wants a FileGuard class.
  card: raii
  review_set: 1
  techniques:
  - L0.0
  checked_on: '2026-10-19'
  answer:
    kind: none
    simplest: Open, read and close in order
    why: There is one exit and nothing in between can throw, so a 15-line class protects against nothing.
  checkers: []
- id: rev-2-1
  role: review
  type: build
  title: A scoped timer
  prompt: Write a scoped timer that records elapsed time even on early return or when an exception passes through.
  card: raii
  review_set: 2
  techniques:
  - L0.0
  checked_on: '2026-10-19'
  checkers:
  - kind: kit
    path: L0.0/rev-2-1
  reference: reference/L0.0/rev-2-1
  clarifying:
  - q: What does the timer read, and where does it write?
    a: It calls the clock function it was given and appends to the vector it was given.
    critical: true
  - q: What is recorded if the scope throws?
    a: The elapsed time up to the throw, once.
    critical: true
  - q: Can the timer be copied?
    a: No; it can be moved, and a moved-from timer records nothing.
    critical: false
  - q: Does it need real clocks?
    a: 'No: the tests pass a fake clock function.'
    critical: false
- id: rev-2-2
  role: review
  type: recognise
  title: One configuration replaced every hour
  prompt: Two request handlers read a configuration object that a background task replaces every hour. A handler may still be reading the old one when the new one arrives. Who owns each version?
  card: ownership-pointer
  review_set: 2
  techniques:
  - L0.0
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: Each handler and the holder of the current version share ownership, so an old version is destroyed when the last handler lets go.
    why_others_fail: A reference to a single object breaks when it is replaced; a unique_ptr has one owner, so a second holder would have to copy.
  checkers: []
