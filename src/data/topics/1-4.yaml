  time_limit_minutes: 90
  problems:
  - ac-abc174_e
  - lc-find-k-th-smallest-pair-distance
  - cf-1201C
decision_map:
- weak_signal: Many independent queries about a fixed sorted collection, "how many ≤ x", the nearest value
  choose: sorted-search
  when: The searched sequence is sorted (or non-decreasing by construction), so each query is one or two
    bounds (Theorem 1.4.2).
  over:
  - card: direct-simulation
    because: Scanning for every query is O(n) per query.
    topic: '0.3'
  - card: merge-walk
    because: A forward walk needs the queries sorted too; it fits when all queries are known in advance,
      the search fits always.
    topic: '1.3'
- weak_signal: '"The smallest … at least x", "the closest", min and max of a changing collection'
  choose: sorted-search
  when: The collection does not change between the questions, so a sorted array and two bounds answer
    them.
  over:
  - card: ordered-set-lookup
    because: A set pays for keeping order under insertions and erasures; with no changes, a sorted vector
      is simpler and faster.
    topic: '0.6'
- weak_signal: '"Minimise the maximum", "maximise the minimum", "the least time / capacity / speed such
    that …"'
  choose: answer-search
  when: The check "can the answer be x?" is monotone in x and much cheaper than solving directly (Theorem
    1.4.3).
  over:
  - card: enumerate-answer
    because: Trying every x works only when the range of answers is small; the search needs log of the
      range checks.
    topic: '0.5'
  - card: sort-then-scan
    because: A single sorted scan decides the answer only when the best choice is visible in sorted order;
      a capacity or time limit usually needs the check.
    topic: '1.1'
- weak_signal: The k-th smallest element of a huge collection (pair sums, products, a table, numbers not
    in a list)
  choose: kth-by-counting
  when: The number of elements at most x can be counted fast, and the collection is too large to list
    (Theorem 1.4.6).
  over:
  - card: heap-extract
    because: Popping k items from a priority queue works only for small k (about 10^5).
    topic: '0.6'
  - card: sort-then-scan
    because: Sorting needs the whole collection in memory, impossible for n² elements.
    topic: '1.1'
- weak_signal: 'Two lists: merge them, match elements, closest element, or pairs across them'
  choose: sorted-search
  when: One list is fixed and each element of the other is handled on its own, for example online or with
    a condition that is not monotone along the second list.
  over:
  - card: merge-walk
    because: The walk needs both lists sorted and a monotone partner index; a search needs only the searched
      list sorted.
    topic: '1.3'
