# Patterns for topic 2.5 (Linear Diophantine equations and the Chinese remainder theorem).
topic: "2.5"
patterns:
  - id: diophantine
    name: Linear equations in two integer unknowns
    description: Decide whether a·x + b·y = c has integer solutions, find one, list all of them, or find the best one in a range, with extended Euclid.
    precondition: The solutions exist exactly when gcd(a, b) divides c, and all of them are spaced by (b/g, −a/g).
  - id: linear-congruence
    name: One congruence with any modulus
    description: Solve a·x ≡ b (mod m) when m is not prime, or find when a periodic walk first hits a target, by reducing to a·x + m·y = b.
    precondition: A solution exists exactly when gcd(a, m) divides b, and then the solutions are one residue class modulo m / gcd(a, m).
  - id: crt
    name: Systems of congruences
    description: Merge x ≡ r1 (mod m1) and x ≡ r2 (mod m2) into one congruence modulo lcm(m1, m2), when the moduli are not coprime.
    precondition: The two congruences agree modulo gcd(m1, m2); then the solution is unique modulo the lcm.
