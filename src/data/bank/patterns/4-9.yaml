# Patterns for topic 4.9 (State-space search). Cards of the lesson: state-graph, mask-search, extra-state, cut-states.
topic: "4.9"
patterns:
  - id: state-graph
    name: Invent the node
    description: The graph is not given. A state (the place plus whatever else the rules depend on, such as a direction, a parity, a number or a pair of positions) is a vertex, a move is an edge, and a queue-based search finds the fewest moves.
    precondition: The state holds everything the moves and the goal depend on, every move costs the same, and the number of states times the number of moves fits the budget.
  - id: mask-search
    name: Search over a place and a set
    description: The state is a place together with a set of at most about 18 items (keys held, vertices visited, cells flipped, parities), kept as a bitmask; a queue-based search or Dijkstra runs over the pairs.
    precondition: The set has few elements, so places times 2^k states fit the budget, and a move changes the set by a fixed rule.
  - id: extra-state
    name: Dijkstra over a place and a resource
    description: The state is a place together with a small resource or mode (a coupon, a fuel level, a bicycle, a pending edge) and moves have different non-negative costs; Dijkstra runs over the pairs.
    precondition: The extra part has few values, every cost is non-negative, and the pair fixes the moves and their costs.
  - id: cut-states
    name: Cut the state down
    description: The state would be too large or unbounded, so a coordinate is bounded, capped or dropped because a larger value is never worse, and only the best value per place is kept.
    precondition: A state with the resource at least as good and the cost at most as large can do everything the other state can, or a bound proves that values above it never matter.
