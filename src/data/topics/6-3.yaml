
id: '6.3'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, and the plain loops the trie replaces'
- topic: '0.6'
  what: 'Standard containers: maps and sets of whole strings, the contrast with a trie'
- topic: '1.1'
  what: 'Sorting: the sorted array that also answers prefix counts, and the offline order of queries'
- topic: '1.4'
  what: 'Binary search: the counting of words with a prefix in a sorted array'
- topic: '1.7'
  what: 'Bit operations: XOR, binary digits, and the high-bit-first method'
- topic: '0.3'
  what: 'String processing: the direct comparison of two strings'
- topic: '1.3'
  what: 'Two pointers: windows of values and subsequence tests'
- topic: '1.6'
  what: 'Monotonic stack and deque: the window of a review problem'
- topic: '3.1'
  what: 'Backtracking: the board search that a trie prunes'
- topic: '3.3'
  what: 'Dynamic programming: the DP over places that uses the trie walk'
- topic: '6.2'
  what: 'Prefix function: matching one pattern, the contrast with a dictionary'
- topic: '1.5'
  what: 'Greedy: choosing the smallest value for each position in turn'
- topic: '4.6'
  what: 'Trees: the path from a vertex to the root in a review problem'
- topic: '6.1'
  what: 'Polynomial hashing: the palindrome test of a ladder problem'
