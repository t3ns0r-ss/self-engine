drill:
- problem: ac-abc471_e
  answer:
    topic: '2.4'
    card: contribution-total
  property: The square of a sum splits into single terms a_i^2 and pair terms 2·a_i·a_j; ball i is in
    C(N − 1, K − 1) of the choices and a pair in C(N − 2, K − 2), so the total is two sums with binomial
    weights.
  why_others_fail: Listing the subsets is impossible; the total over all configurations is collected per
    element and per pair.
- problem: cf-2008F
  answer:
    topic: '2.4'
    card: indicator-linearity
  property: 'The expected product is the average of a_i·a_j over all C(n, 2) pairs: ((Σ a)^2 − Σ a^2)/2
    divided by C(n, 2), modulo the prime.'
  why_others_fail: 'No process or waiting: one uniform choice of a pair, so the expectation is a plain
    average, computed with the pair-sum identity.'
- problem: lc-total-appeal-of-a-string
  answer:
    topic: '2.4'
    card: contribution-total
  property: 'Count each distinct letter of a substring at its first occurrence there: position i is first
    for (i − previous occurrence)·(n − i) substrings.'
  why_others_fail: A total over all O(n^2) substrings is needed; each position's contribution is a product
    of two counts.
- problem: ac-abc331_c
  answer:
    topic: '1.2'
    card: range-sum
  property: 'Bucket the values and take suffix sums over values: each answer is one suffix sum.'
  why_others_fail: Only one sum per element over a fixed array; no total over configurations or probabilities.
- problem: ac-abc420_c
  answer:
    topic: '0.3'
    card: direct-simulation
  property: 'Keep the running total of min(A_k, B_k): an update changes one index, so subtract its old
    minimum and add the new one.'
  why_others_fail: The sum looks like a total over elements, but only one term changes per update.
- problem: ac-abc452_e
  answer:
    topic: '2.1'
    card: multiples-sieve
  property: Write i mod j as i − j·⌊i/j⌋; for every j, the values ⌊i/j⌋ form N/j blocks, a harmonic loop
    with block sums from prefix sums.
  why_others_fail: The double sum is not split per element by a probability; the key is grouping i by
    multiples of j.
- problem: lc-number-of-substrings-with-only-1s
  answer:
    topic: '0.2'
    card: closed-form
  property: Each maximal run of L ones holds L(L + 1)/2 such substrings.
  why_others_fail: A closed formula per run; nothing is random or summed over configurations by contribution.
- problem: lc-sum-of-absolute-differences-in-a-sorted-array
  answer:
    topic: '1.2'
    card: range-sum
  property: The array is sorted, so element i's total is i·a_i − (prefix sum before i) plus (suffix sum
    after i) − (n − 1 − i)·a_i.
  why_others_fail: Each answer is about one element against all others, a direct prefix-sum formula.
- problem: lc-sum-of-distances
  answer:
    topic: '1.2'
    card: range-sum
  property: Group the positions of each value; inside a group (sorted), each position's total distance
    is two prefix-sum expressions.
  why_others_fail: 'It is a total over pairs, but per index and only within equal values: prefix sums
    per group, no counting of configurations.'
- problem: lc-count-nice-pairs-in-an-array
  answer:
    topic: '0.6'
    card: map-counting
  property: Rearranged, the condition says nums[i] − rev(nums[i]) equals nums[j] − rev(nums[j]); count
    equal keys with a map and add c(c − 1)/2.
  why_others_fail: 'Only pairs with equal keys count: no probability or per-element contribution is needed.'
lookalike_pairs:
- a: ac-abc437_d
  b: lc-minimum-moves-to-equal-array-elements-ii
  a_tool:
    topic: '2.4'
    card: contribution-total
  b_tool:
    topic: '1.1'
    card: sort-then-scan
  flipping_difference: Both are sums of absolute differences. A adds them over all pairs, a total over
    configurations collected per element. B chooses one target x to minimise Σ|a_i − x|, an optimisation
    whose answer is a median; no total over pairs is involved.
  shared_surface: Both are sums of absolute differences.
  flipping_input: 'A: the sum of |a_i − a_j| over all pairs of 1 3 6 is 2 + 5 + 3 = 10, collected per
    element with sorting and prefix sums. B: the fewest total moves to make 1 3 6 equal is 5, choosing
    the median 3 as the target (2 + 0 + 3).'
- a: ac-abc154_d
  b: ac-abc126_c
  a_tool:
    topic: '2.4'
    card: indicator-linearity
  b_tool:
    topic: '2.3'
    card: product-sum-rules
  flipping_difference: 'Both throw dice and ask a probabilistic question. A asks for an expected sum,
    which linearity reduces to numbers per die. B asks for the probability of an event, which is not an
    expectation of a sum: it is split into disjoint cases by the first roll.'
  shared_surface: Both ask a probabilistic question about dice.
  flipping_input: 'A: the expected sum of two dice is 7, by adding the two expected values 3.5. B: the
    probability that two dice sum to 7 is 6/36, counted by splitting on the first die (each face has exactly
    one partner).'
self_test:
- q: Three letters are put in three envelopes at random. What is the expected number of letters in the
    right envelope, and why may the events be dependent?
  a: Each letter is right with probability 1/3, so the expectation is 3·(1/3) = 1 (Theorem 2.4.2). The
    events are dependent (if two letters are right, so is the third), but linearity does not need independence.
- q: What is the sum of the sums of all subarrays of (2, 5, 1)?
  a: 'Element i (0-based) lies in (i + 1)(3 − i) subarrays: 2·3 + 5·4 + 1·3 = 29 (Theorem 2.4.3).'
- q: A coin lands heads with probability 1/4. How many flips does it take on average to see the first
    head, and to see heads twice?
  a: '4 flips for the first head (Theorem 2.4.5). The second head is a second stage with the same probability:
    4 + 4 = 8.'
- q: Two fair dice are rolled. What is the expected value of the smaller number?
  a: P(min ≥ x) = ((7 − x)/6)^2, so E[min] = (36 + 25 + 16 + 9 + 4 + 1)/36 = 91/36 ≈ 2.53 (Theorem 2.4.4).
- q: Why can you not compute E[X^2] as (E[X])^2 for the number of heads X in two fair flips?
  a: E[X] = 1, but X^2 is 0, 1, 1, 4 with equal probability, so E[X^2] = 1.5. Linearity applies to sums,
    not to squares; expand X^2 into a sum of products of indicators first.
- q: 'Seeing all 4 faces of a fair 4-sided die: how many rolls on average?'
  a: 4·(1 + 1/2 + 1/3 + 1/4) = 25/3 ≈ 8.33 (coupon collector, Theorem 2.4.5).
