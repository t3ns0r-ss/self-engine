- id: lc-sum-of-distances-in-tree
  role: review
  card: rerooting
  review_set: 2
  summary: A tree of n ≤ 3·10^4 nodes; for each node, the sum of the distances to all other nodes.
- id: lc-minimize-the-total-price-of-the-trips
  role: review
  card: tree-merge
  review_set: 2
  summary: A tree of n ≤ 50 vertices with a price on each and up to 100 trips along paths; the prices
    of a set of vertices, no two adjacent, may be halved; the least total price of all trips.
- id: lc-maximize-sum-of-weights-after-edge-removals
  role: review
  card: subtree-dp
  review_set: 3
  summary: A tree of n ≤ 10^5 nodes with a weight on each edge and a number k; remove edges so that every
