# Topic 0.6 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.6'
uses:
- topic: '0.1'
  what: vector, long long and fast input and output
- topic: '0.2'
  what: The step budget, O(log n), and amortised analysis (Theorem 0.2.4)
- topic: '0.3'
  what: 'Implementation: many problems here are simulations whose state lives in a container'
- topic: '0.4'
  what: Remainders and divisibility, which several problems here use as the key of a map
- topic: '0.5'
  what: 'Brute force: the reference solutions in this lesson''s tests'
theorems:
- id: 0.6.1
  title: push_back is cheap on average
  plain_words: A vector that doubles its space when it is full copies fewer than two elements per push_back
    on average, so building a vector of n elements costs about n steps even though a single push_back
    can be slow.
  code: 0.6/thm-1
- id: 0.6.2
  title: A set remembers each distinct value once
  plain_words: After inserting values into a set it holds each distinct value exactly once, so its size
    is the number of distinct values and one lookup tells whether a value occurred. Each operation takes
    about log n steps.
  code: 0.6/thm-2
- id: 0.6.3
  title: A map of counts gives the pairs of equal values
  plain_words: Walk through the values and keep a count per value. Just before counting a value, the stored
    count is the number of earlier equal values, and adding these up over all positions gives the number
    of equal pairs.
  code: 0.6/thm-3
- id: 0.6.4
  title: A set answers nearest-value questions while it changes
  plain_words: A set keeps its elements in order, so the smallest value at least x, and the largest value
    at most x, are found in log n steps, however many insertions and deletions came before.
  code: 0.6/thm-4
- id: 0.6.5
  title: A priority queue hands out the largest element again and again
  plain_words: If a process says to take the largest number, possibly put new numbers back, and repeat,
    a priority queue does each round in about log n steps and gives exactly the numbers the process asks
    for.
  code: 0.6/thm-5
- id: 0.6.6
  title: A stack matches each closing bracket with the latest open one
  plain_words: When the newest unfinished item is always the one dealt with next, a stack handles it in
    constant time per step. For brackets, a closing bracket pairs with the most recent opening bracket
    not yet closed.
  code: 0.6/thm-6
cards:
- id: set-membership
  name: Distinctness and membership
  decisive_property: Only whether a value has occurred matters, not how often or where, so a set of the
    values seen so far answers each "seen before?" or "how many distinct?" in O(log n).
  from_theorem: 0.6.2
  how_to_test: Ask whether replacing the input by its set of distinct values keeps the answer. If counts
    or positions matter, it is a map instead.
  constraint_shapes:
  - 'n up to 2·10^5 values up to 10^9: an array indexed by value needs 10^9 cells, and comparing every
    pair is 2·10^10 steps, while a set does n lookups of about 18 steps each, 3.6·10^6 in all.'
  weak_signals:
  - form: Asks how many different values there are, or whether a duplicate exists
    shape: n up to 2·10^5 with values up to 10^9 or strings
  - form: Asks "has this appeared before?" for each element in turn
    shape: One lookup per element in an input too large for a pair loop
  kill_signals:
  - 'The answer depends on how many times a value occurs: in 3 1 3 3 the value 3 occurs three times, but
    a set reports count 1.'
  - 'The positions matter: in 1 2 1 the value 1 repeats, but with a limit of distance 1 there is no valid
    repeat, and a set of seen values cannot tell.'
  in_action:
    statement: Process q queries on a collection of integers; "1 x" adds x, "2 x" asks whether x is present,
      "3" asks how many distinct values it holds.
    constraints: q ≤ 2·10^5, 0 ≤ x ≤ 10^9.
    budget: Scanning a list for every query of type 2 is up to 2·10^5 · 2·10^5 = 4·10^10 steps. A set
      does each query in about 18 steps, 3.6·10^6 in all.
    candidates:
    - tool: A list searched from the start for every query
      verdict: rejected
      because: Up to 4·10^10 steps in total.
    - tool: A set of the values added (this topic)
      verdict: chosen
      because: Only presence and the number of distinct values matter, and each operation takes O(log
        n).
    property_check: The questions are only about which values have been added, never how often or when,
      so the set holds all the information needed (Theorem 0.6.2). Inserting an existing value changes
      nothing, so size() is the number of distinct values.
    decision: A set<int>; insert for type 1, count for type 2, size for type 3.
  examples:
    positive:
    - inline:
        input: The number of distinct values in 3 1 3 3
        answer: '2'
        why: The set holds 1 and 3, each once, so its size is 2.
    - inline:
        input: Does some value occur twice in 4 2 7 2?
        answer: 'yes'
        why: Inserting the values in order, the second 2 is already in the set, which shows a repeat.
    negative:
    - inline:
        input: A repeated value within distance 1 in 1 2 1, judged by a set of seen values
        answer: 'no'
        method_gives: 'yes'
        why: The set only knows that 1 occurred before, not where. The two 1s are 2 apart, so with a limit
          of distance 1 there is no valid repeat; the last position of each value must be stored in a
          map.
      correct_tool:
        topic: '0.6'
        card: map-counting
    - inline:
        input: How many times does 3 occur in 3 1 3 3, read from a set?
        answer: '3'
        method_gives: '1'
        why: A set keeps each value once, so count(3) is 1 however often 3 was inserted. Counts need a
          map from value to count.
      correct_tool:
        topic: '0.6'
        card: map-counting
  lookalikes:
  - description: Is there a repeated value within distance k?
    tool:
      topic: '0.6'
      card: map-counting
    flipping_difference: 'The distance between equal values matters, so the set must remember positions:
      a map from value to last index.'
  complexity: O(log n) per operation, O(n log n) in all.
- id: map-counting
  name: Counting by key
  decisive_property: The answer depends only on how many times each key occurs (or on a list or last position
    per key), so a map from key to count, filled in one pass, decides it; pairs with equal keys are counted
    from the counts read before each increment.
  from_theorem: 0.6.3
  how_to_test: Write the answer as a function of the per-key counts. If you need "how many earlier elements
    equal this one", read the count before incrementing.
  constraint_shapes:
  - 'n up to 2·10^5: counting equal pairs by comparing every pair is 2·10^10 steps, but one pass with
    a map is 2·10^5 lookups; the number of pairs can reach 2·10^10, which needs long long.'
  weak_signals:
  - form: Asks how many times something occurs, the most frequent value, or the number of pairs with an
      equal property
    shape: n up to 2·10^5 and values or names up to 10^9
  - form: Groups items by a key such as the same letters, the same remainder or the same name
    shape: One answer per group, or a count of group sizes
  - form: Asks for two positions whose values satisfy an equation, such as a sum
    shape: For each element, the partner value is determined, so one lookup per element
  kill_signals:
  - 'The question needs the nearest key, not an exact one: for the values 2, 5, 9 and the question "closest
    to 6", the key 6 is absent, and the answer 5 needs an ordered lookup.'
  - 'Asking about absent keys with [] fills the map: after cnt[7], cnt[8], cnt[9] on a map holding 2 keys,
    the map has 5; use find or count to check presence.'
  in_action:
    statement: Find positions i < j with a_i + a_j = x, or print IMPOSSIBLE.
    constraints: n ≤ 2·10^5, 1 ≤ x, a_i ≤ 10^9.
    budget: Trying every pair is up to 2·10^10 steps. One lookup per element is 2·10^5 · 18 steps.
    candidates:
    - tool: Test every pair of positions
      verdict: rejected
      because: Up to 2·10^10 pairs.
    - tool: A map from value to its first position, one lookup per element (this topic)
      verdict: chosen
      because: For each a_j the partner x − a_j is a single value, found in one lookup.
    property_check: The answer depends only on which values occurred before j and where, so a map from
      value to position holds it. For each j one find of x − a_j decides (Theorem 0.6.3 uses the same
      earlier-elements idea).
    decision: Scan j from the left; find x − a_j in the map; insert a_j after the check.
  examples:
    positive:
    - inline:
        input: The number of pairs i < j with equal values in 3 1 3 3
        answer: '3'
        why: Reading the count before each increment gives 0, 0, 1, 2, which add up to 3; the value 3
          occurs three times, and 3 · 2 / 2 = 3.
    - worked_example: cses-1640
      why: Each element asks for one partner value x − a_j among the earlier elements, a lookup in a map
        from value to position.
    negative:
    - inline:
        input: The value among 2, 5, 9 closest to 6, looked up as the key 6 in a map
        answer: '5'
        method_gives: '-1'
        why: A map finds exact keys only. The key 6 is not present, but the nearest stored value, 5, needs
          an ordered lookup in a set.
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
    - inline:
        input: The size of the map of 3 1 3 3 after asking about the absent keys 7, 8, 9 with cnt[key]
        answer: '2'
        method_gives: '5'
        why: Reading cnt[key] with [] inserts the key with value 0, so three empty entries appear. Use
          find or count when only testing presence.
      correct_tool:
        topic: '0.6'
        card: map-counting
  lookalikes:
  - description: Count pairs i < j with a_i = a_j versus pairs with a_i < a_j
    tool:
      topic: '0.6'
      card: ordered-set-lookup
    flipping_difference: Equality is answered by counts per key; order comparisons between different keys
      are not.
  complexity: O(log n) per update, O(n log n) in all.
- id: ordered-set-lookup
  name: Nearest value in a changing set
  decisive_property: Each question asks for the smallest stored value ≥ x, the largest ≤ x, or the minimum
    or maximum, while values are inserted and erased between questions; a set or multiset answers each
    in O(log n).
  from_theorem: 0.6.4
  how_to_test: 'Check that the collection changes between queries (otherwise a sorted array would do)
    and that each query is about order: nearest, smallest, largest.'
  constraint_shapes:
  - 'q up to 2·10^5 mixed insertions, deletions and queries: keeping a plain array in order costs up to
    n = 2·10^5 steps per insertion, 4·10^10 in all, while a set costs about 18 steps per operation.'
  weak_signals:
  - form: Asks for the smallest value that is at least x, the closest value, or the largest not exceeding
      a bound
    shape: A bound x per query and values up to 10^9
  - form: Mixes insertions and deletions with queries about the collection
    shape: q up to 2·10^5 operations of several types
  - form: Asks for the difference between the largest and smallest value of a changing collection
    shape: Both ends are read after every update
  kill_signals:
  - 'Only the overall largest is ever taken: a priority queue is simpler, and ordered lookups are not
    needed.'
  - 'The collection never changes: then a one-time ordering of the values answers every question, which
    costs nothing per query.'
  in_action:
    statement: A multiset of integers undergoes q operations; "1 x" adds x, "2 x" removes one copy of
      x, "3 x" prints the largest element ≤ x, "4 x" the smallest element ≥ x (−1 if none).
    constraints: q ≤ 2·10^5, 0 ≤ x ≤ 10^9.
    budget: Scanning all elements for each query is up to 2·10^5 · 2·10^5 = 4·10^10 steps. A multiset
      takes about 18 steps per operation.
    candidates:
    - tool: A list scanned in full for each question
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: A multiset with s.upper_bound and s.lower_bound (this topic)
      verdict: chosen
      because: It stays ordered through insertions and deletions, and both questions are one lookup.
    property_check: The questions are about order (nearest value in one direction) and the set changes
      between them. Elements before s.upper_bound(x) are ≤ x, so the one just before it is the largest
      ≤ x, provided the iterator is not begin (Theorem 0.6.4).
    decision: multiset<int>; erase one copy with erase(find(x)); answer with *prev(s.upper_bound(x)) and
      *s.lower_bound(x) after checking begin and end.
  examples:
    positive:
    - inline:
        input: The largest value ≤ 6 in the set 2, 5, 9
        answer: '5'
        why: s.upper_bound(6) points to 9, the first value above 6, and the element before it, 5, is the
          largest value at most 6.
    - inline:
        input: The smallest value ≥ 6 in the set 2, 5, 9
        answer: '9'
        why: s.lower_bound(6) points to the first value that is not below 6, which is 9.
    negative:
    - inline:
        input: Remove one copy of 4 from the multiset 4, 4, 7 with erase(4); the size afterwards
        answer: '2'
        method_gives: '1'
        why: erase(value) removes every copy, so both 4s go. To remove one copy, erase(find(4)).
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
    - inline:
        input: The largest value ≤ 5 in the set 2, 5, 9, taken as the element before s.lower_bound(5)
        answer: '5'
        method_gives: '2'
        why: s.lower_bound(5) points to 5 itself (the first value not below 5), so the element before
          it is 2. For "at most x" the element before s.upper_bound(x) is the one to use.
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
  lookalikes:
  - description: Always remove the overall largest element
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: Without a bound x, only the extreme is needed, and a priority queue gives it
      directly.
  complexity: O(log n) per operation.
- id: heap-extract
  name: Repeatedly take the extreme
  decisive_property: The process itself says to remove the largest (or smallest) element again and again,
    possibly inserting new ones; a priority queue does each step in O(log n).
  from_theorem: 0.6.5
  how_to_test: Check that every step needs only the current extreme element, never a value near some x
    or an element in the middle.
  constraint_shapes:
  - 'K up to 10^5 rounds on n up to 10^5 numbers: scanning for the largest in each round is 10^5 · 10^5
    = 10^10 steps, while a priority queue costs about 17 steps per round, 1.7·10^6 in all.'
  weak_signals:
  - form: Says each time to take the largest (or smallest) element, change it, and put it back
    shape: K up to 10^5 repetitions on n up to 10^5 numbers
  - form: Asks to merge or combine the two smallest items repeatedly
    shape: n up to 2·10^5 piles and a total cost to minimise
  - form: Asks for the k-th largest of a growing collection
    shape: A heap of size k, updated per element
  kill_signals:
  - 'A step needs the largest element below a bound: for prices 3, 7, 10 and budget 8 the top of a max-heap
    gives 10, over budget, while the answer is 7.'
  - 'The extreme is not the right choice: merging the two largest of 1, 2, 3 each time costs 5 + 6 = 11,
    but merging the two smallest costs 3 + 6 = 9.'
  in_action:
    statement: There are n piles with sizes a_i. Repeatedly merge the two smallest piles into one, paying
      their total size, until one pile is left. Print the total cost.
    constraints: n ≤ 2·10^5, 1 ≤ a_i ≤ 10^9.
    budget: Finding the two smallest by scanning is up to 2·10^5 steps per merge and 2·10^5 merges, 4·10^10
      in all. A priority queue costs about 18 steps per operation.
    candidates:
    - tool: Scan the list for the two smallest each time
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: A min-priority queue (this topic)
      verdict: chosen
      because: Every step takes the smallest element, possibly puts a new one back, and never looks at
        anything else.
    property_check: Each merge needs only the current two smallest elements, the extreme of the collection,
      and inserts the sum. top() returns a smallest element, pop removes it, push inserts, so the queue
      always holds the current piles (Theorem 0.6.5).
    decision: priority_queue with greater<>; pop twice, add the sum to the cost, push the sum.
  examples:
    positive:
    - inline:
        input: Halve (rounding down) the largest of 8 3 5, three times; the sum that remains
        answer: '7'
        why: Take 8 → 4, then 5 → 2, then 4 → 2, leaving 3, 2, 2 with sum 7; each round needs only the
          current largest.
    - inline:
        input: Merge the two smallest of piles 1, 2, 3 until one is left, paying the total each time
        answer: '9'
        why: Merge 1 and 2 for 3, then 3 and 3 for 6; the total cost is 9.
    negative:
    - inline:
        input: The most expensive ticket at most 8 among 3, 7, 10, taken as the top of a priority queue
        answer: '7'
        method_gives: '10'
        why: The top is 10, which is above the budget. The question has a bound, so it needs an ordered
          lookup, the largest value at most 8.
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
    - inline:
        input: Merge the two largest (instead of the two smallest) of piles 1, 2, 3 each time, paying
          the total
        answer: '9'
        method_gives: '11'
        why: Merging 3 and 2 costs 5, then 5 and 1 costs 6, a total of 11. The process asks for the two
          smallest; the priority queue must be ordered the right way.
      correct_tool:
        topic: '0.6'
        card: heap-extract
  lookalikes:
  - description: Each customer takes the most expensive ticket within their budget
    tool:
      topic: '0.6'
      card: ordered-set-lookup
    flipping_difference: The bound depends on the customer, so the overall largest is not enough; a multiset
      finds the largest ≤ budget.
  complexity: O(log n) per step.
- id: stack-queue
  name: Stack and queue processes
  decisive_property: 'The process only ever touches the most recent unfinished item (a stack: brackets,
    undo, merging with the last element) or the oldest waiting item (a queue: first come, first served),
    so each step is O(1).'
  from_theorem: 0.6.6
  how_to_test: 'Ask which item each step looks at: if always the newest, use a stack; if always the oldest,
    a queue; if both ends, a deque.'
  constraint_shapes:
  - 'A string of 2·10^5 brackets or n up to 5·10^5 insertions: matching each closing bracket by scanning
    back is up to n²/2 = 10^11 steps, but a stack does one push or pop per character, 2·10^5 steps in
    all.'
  weak_signals:
  - form: Asks whether brackets are properly nested, or to cancel the last item added
    shape: A string of up to 2·10^5 characters, and a question about matching or cancelling
  - form: Describes serving, processing or scheduling in order of arrival
    shape: Items that join at one end and leave from the other, up to 10^5 of them
  - form: Combines each new element with the last one while a condition holds
    shape: n up to 2·10^5 elements processed once in order
  kill_signals:
  - 'A step needs an element from the middle or the largest overall: serving the most valuable of 3 9
    5 first takes 9, but the front of a queue is 3.'
  - 'Brackets of different kinds are only counted: "([)]" has depth never below 0 and ending at 0, but
    it is not nested; the kind of the newest open bracket must be kept.'
  in_action:
    statement: Start from the sequence (0). For i = 1, …, N insert i immediately to the left (L) or right
      (R) of the number i − 1; print the final sequence.
    constraints: 1 ≤ N ≤ 5·10^5.
    budget: Inserting into the middle of a vector moves up to N elements, N²/2 ≈ 10^11 steps in all. A
      deque with pushes at its two ends costs 5·10^5 steps.
    candidates:
    - tool: Insert into a vector at the position of i − 1
      verdict: rejected
      because: Each insertion in the middle moves everything after it, about 10^11 steps in all.
    - tool: Process the letters from the end and push to either end of a deque (this topic)
      verdict: chosen
      because: When i − 1 is placed, the numbers inserted after it are already one block, so i − 1 goes
        at the left or right end of that block.
    property_check: Going backwards, the block of numbers i, …, N is already built, and i − 1 lands directly
      left of i or directly right of i, which is at the left or the right end of the block. So each step
      touches only an end of the deque, in O(1).
    decision: Deque starting with N; for i from N down to 1, push i − 1 at the back if S_i is L, at the
      front if R.
  examples:
    positive:
    - inline:
        input: Is "(()())" properly nested?
        answer: 'yes'
        why: Pushing the position of each '(' and popping at each ')' never meets an empty stack and ends
          empty, so every ')' is matched with the nearest unmatched '('.
    - worked_example: ac-abc237_d
      why: Each step adds to the left or right end of the block built so far, which is exactly what a
        deque does in O(1).
    negative:
    - inline:
        input: Serve the most valuable of 3 9 5 first, with a plain queue
        answer: '9'
        method_gives: '3'
        why: A queue serves the oldest item, 3. The process asks for the most valuable, so a priority
          queue is the right tool.
      correct_tool:
        topic: '0.6'
        card: heap-extract
    - inline:
        input: Is "([)]" properly nested, if brackets are only counted and not matched by kind?
        answer: 'no'
        method_gives: 'yes'
        why: The count of open brackets goes 1, 2, 1, 0 and never below 0, but the ')' meets an open '['
          on top. A stack holding the kinds finds the mismatch.
      correct_tool:
        topic: '0.6'
        card: stack-queue
  lookalikes:
  - description: Serve the most valuable waiting item first
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: Priority by value replaces arrival order, so a priority queue replaces the queue.
  complexity: O(1) per push or pop.
problems:
- id: cses-1621
  role: ladder
  card: set-membership
  rung: 1
  twist: Base case of the card
  summary: The number of distinct values among n integers (n ≤ 2·10^5, values ≤ 10^9).
  hints:
  - Values up to 10^9 cannot index an array. What container keeps each value once?
  - 'A set: inserting a value twice keeps one copy (Theorem 0.6.2).'
  - 'Insert all values into a set<int> and print its size: O(n log n).'
- id: ac-abc164_c
  role: ladder
  card: set-membership
  rung: 2
  twist: The values are strings instead of numbers.
  summary: The number of different item names among N draws (N ≤ 2·10^5, names of up to 10 letters).
  hints:
  - Does a set work for strings?
  - 'Yes: set<string> compares strings in dictionary order; each operation costs O(log N) comparisons
    of up to 10 letters.'
  - Insert every name into a set<string> and print its size.
- id: ac-abc291_c
  role: ladder
  card: set-membership
  rung: 3
  twist: The values are positions (pairs) produced by a walk.
  summary: A walk of N steps (N ≤ 2·10^5) on the grid from the origin, each step L, R, U or D; does it
    visit some point twice?
  hints:
  - What do you need to remember about the walk so far to answer "have I been here before?"
  - The set of points visited so far; a pair<int, int> can be stored in a set.
  - Insert (0, 0), then after each step check whether the new point is already in the set before inserting
    it.
- id: ac-abc278_c
  role: ladder
  card: set-membership
  rung: 4
  twist: Insertions and deletions of pairs, with membership questions in between.
  summary: 'Users up to 10^9 and Q ≤ 2·10^5 operations: A follows B, A unfollows B, or ask whether A and
    B follow each other.'
  hints:
  - Users go up to 10^9, so a table of all pairs is impossible. What exactly must be stored?
  - 'Only the "A follows B" relations created so far: a set of pairs, with insert and erase.'
  - 'set<pair<int, int>>: insert {A, B}, erase {A, B}, and answer Yes when both {A, B} and {B, A} are
    in it.'
- id: ac-abc398_c
  role: ladder
  card: map-counting
  rung: 1
  twist: Base case of the card
  summary: Among N people (N ≤ 3·10^5) holding numbers up to 10^9, the person whose number is the largest
    among numbers that nobody else holds, or −1.
  hints:
  - Which numbers are held by exactly one person?
  - Count each number with a map (Theorem 0.6.3); the candidates are the numbers with count 1.
  - Count all numbers, then scan the people and keep the one with count 1 and the largest number.
- id: ac-abc206_c
  role: ladder
  card: map-counting
  rung: 2
  twist: 'Count the complement: all pairs minus pairs of equal values.'
  summary: The number of pairs i < j with A_i ≠ A_j (N ≤ 3·10^5).
  hints:
  - Counting unequal pairs directly needs all pairs. What is easier to count?
  - All pairs N(N − 1)/2 minus equal pairs, and equal pairs come from the counts per value.
  - Answer N(N − 1)/2 − Σ c(c − 1)/2 over the counts c, in long long.
- id: ac-abc261_c
  role: ladder
  card: map-counting
  rung: 3
  twist: The count is read before incrementing, while the input is processed.
  summary: Print N names (N ≤ 2·10^5) in order, adding "(k)" to a name that already appeared k times before.
  hints:
  - For each name you need the number of earlier equal names. Which theorem gives it?
  - 'Theorem 0.6.3, part 2: the count read just before incrementing.'
  - map<string, int> cnt; for each name print it, plus "(" + to_string(cnt[s]) + ")" if cnt[s] > 0; then
    cnt[s]++.
- id: ac-abc137_c
  role: ladder
  card: map-counting
  rung: 4
  twist: The key is a summary of the string (its letter counts), not the string itself.
  summary: Count pairs among N strings of 10 letters (N ≤ 10^5) that are anagrams of each other.
  hints:
  - Two strings are anagrams exactly when what is equal?
  - Their letter counts. Use the array of 26 counts (or any fixed summary of them) as the key of a map.
  - Count each summary with a map and add c(c − 1)/2 per summary, in long long (the answer can reach 5·10^9).
