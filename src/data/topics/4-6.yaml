# Topic 4.6 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '4.6'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check'
- topic: '0.6'
  what: 'Data structures of the standard library: the queue of the dependency order'
- topic: '1.1'
  what: 'Sorting: the nodes of the path problem by value'
- topic: '1.2'
  what: 'Prefix sums: the box sizes of the potato problem'
- topic: '1.3'
  what: 'Two pointers: the next place where a block must end'
- topic: '1.4'
  what: 'Binary search: the box sizes of the potato problem'
- topic: '1.7'
  what: 'Bit operations: the xor of the weights on a path'
- topic: '2.1'
  what: 'Primes and factorisation: the blocks of the array problem'
- topic: '2.3'
  what: 'Subsets as bit masks: the inclusion–exclusion of the last ladder problem'
- topic: '4.1'
  what: 'Graph traversal: state graphs and shortest routes as the contrast'
- topic: '4.2'
  what: 'Graph structure: pointers and cycles'
- topic: '4.3'
  what: 'Shortest paths: Floyd-Warshall as the reference in the checks'
- topic: '4.4'
  what: 'Disjoint set union and Kruskal order: the contrast for graphs with cycles'
- topic: '4.5'
  what: 'Trees: rooting, parents and depths, visit order, subtree sums'
theorems:
- id: 4.6.1
  title: Binary lifting
  plain_words: To climb $2^j$ levels, climb $2^{j-1}$ levels twice. So write down, for every vertex, where
    one step, two steps, four steps, eight steps and so on lead, each level built from the one before
    it. Any number of steps is a sum of different powers of two, so any climb is at most about 18 jumps.
  code: 4.6/thm-1
- id: 4.6.2
  title: Lowest common ancestor
  plain_words: First bring the deeper vertex up to the level of the other. If they are the same vertex,
    that is the answer. Otherwise they are on the same level but different, so climb both together; look
    from the biggest jump to the smallest, and take a jump only if you would still land on two different
    vertices. You stop just below the meeting point, and its parent is the answer.
  code: 4.6/thm-2
- id: 4.6.3
  title: Distance in a tree
  plain_words: The trip from $u$ to $v$ goes up to their meeting point and down again. The two ends' distances
    from the root count the stretch above the meeting point twice, so take it off twice.
  code: 4.6/thm-3
- id: 4.6.4
  title: Aggregates on a path
  plain_words: 'Along with each jump of $2^j$ levels, remember the smallest edge it passes over. A path
    is cut into exactly the same jumps as in the search for the meeting point, so the smallest edge of
    the path is the smallest of the smallest edges of the jumps. The idea works for anything that can
    be combined piece by piece: a sum, a maximum, a minimum.'
  code: 4.6/thm-4
- id: 4.6.5
  title: Counting along paths offline
  plain_words: 'A path uses the edge above $v$ exactly when one of its ends is inside the subtree of $v$
    and the other is outside. Put $+1$ at both ends and $-2$ at the meeting point: the contributions of
    a path cancel inside every subtree that holds the whole path, and leave exactly $+1$ in each subtree
    that holds just one end.'
  code: 4.6/thm-5
cards:
- id: jump-up
  name: Jumping up by powers of two (k-th ancestor)
  from_theorem: 4.6.1
  decisive_property: Every item has exactly one next item (a parent, or a teleporter), and the questions
    ask where one ends up after k steps, with k large and many questions.
  how_to_test: Check that the next item depends only on the current item (not on the step number or on
    a choice) and that k is too large for stepping. Then build the table of the 1, 2, 4, 8, ... steps
    ahead from the table before it, and answer a query by the binary digits of k.
  constraint_shapes:
  - 'n = 2·10^5 items and q = 2·10^5 queries with k up to 10^9: stepping is up to 2·10^14 steps, while
    the table has 30 · 2·10^5 = 6·10^6 entries and a query takes 30 jumps'
  - 'A tree of 2·10^5 vertices that is a path: climbing one parent at a time costs 2·10^5 steps per query'
  weak_signals:
  - form: Asks for the k-th boss, ancestor or parent of a vertex, for many vertices and many k
    shape: n, q up to 2·10^5, k up to n
  - form: Each place has one teleporter, bus or pointer, and asks where one ends up after k moves, with
      k up to 10^9 or 10^18
    shape: n up to 2·10^5, q up to 2·10^5
  - form: Asks for the first place on the way to the root that satisfies a condition that never goes from
      true back to false
    shape: A tree with n up to 2·10^5
  kill_signals:
  - 'The next item depends on the step number, or there is a choice at each step: the pair (item, step
    number) is the state (the first negative example below)'
  - 'The graph has several arrows out of an item: there is no single next item to jump to'
  in_action:
    statement: 'There are n planets and each has one teleporter to a planet (possibly itself). There are
      q queries (x, k): starting on planet x and using k teleporters, which planet is reached?'
    constraints: n, q ≤ 2·10^5, k ≤ 10^9.
    budget: Stepping is q · k = 2·10^14. Need about O((n + q) log k).
    candidates:
    - tool: Simulating the k steps (topic 0.5)
      verdict: rejected
      because: Up to 10^9 steps per query.
    - tool: Table of the 2^j-th successors and the binary digits of k (this topic)
      verdict: chosen
      because: Each planet has one next planet, so 2^j steps are two steps of 2^(j-1); a query uses at
        most 30 jumps (Theorem 4.6.1).
    property_check: One teleporter per planet, the same at every step; k is large; many queries. The property
      holds.
    decision: Build up[j][v] for j = 0..29 from up[0] = teleporter; for each query take the jumps of the
      set bits of k and print the result.
  examples:
    positive:
    - inline:
        input: The tree 1–2–3–4–5–6 with the extra branch 2–7–8, rooted at 1. What is the 5th ancestor
          of vertex 6?
        answer: '1'
        why: Climbing five parents from 6 gives 5, 4, 3, 2, 1. The table gives the same with two jumps,
          4 + 1 = 5.
    - inline:
        input: Four planets with the teleporters 1→2, 2→1, 3→1, 4→4. Starting on planet 3 and using 4
          teleporters, where does one arrive?
        answer: '2'
        why: 3 → 1 → 2 → 1 → 2. The jumps of 4 steps (one table lookup) give the same planet.
    - worked_example: cses-1750
      why: 'One teleporter per planet and k up to 10^9: the table of 2^j-th successors answers each query
        in 30 jumps.'
    negative:
    - inline:
        input: Planets 1, 2, 3. On odd-numbered steps the teleporters are 1→2, 2→3, 3→1; on even-numbered
          steps all lead to planet 1. Starting on planet 1, where does one arrive after 2 steps?
        answer: '1'
        method_gives: '3'
        why: Step 1 goes 1 → 2 and step 2 goes 2 → 1. A table built for the odd-step teleporters alone
          says 1 → 2 → 3. The next place depends on the step number, so the state is (planet, parity of
          the step).
      correct_tool:
        topic: '4.1'
        card: state-graph
    - problem: ac-abc340_d
      why: 'At each stage there are two ways to go on, with different costs: there is no single next stage,
        and the question asks for the cheapest way, not for a fixed number of steps.'
      correct_tool:
        topic: '4.3'
        card: dijkstra
  lookalikes:
  - description: The lowest common ancestor of two vertices
    tool:
      topic: '4.6'
      card: meeting-vertex
    flipping_difference: 'The same table is used, but the jump length is not given: it is found by comparing
      the two ancestors at each level.'
  - description: Following pointers until a place repeats, to find the cycle
    tool:
      topic: '4.2'
      card: directed-cycle
    flipping_difference: With k small or a cycle asked for, one walk with states is enough; the table
      is for many queries with large k.
  complexity: O(n log k) to prepare, O(log k) per query.
- id: meeting-vertex
  name: Lowest common ancestor
  from_theorem: 4.6.2
  decisive_property: 'The tree has a fixed root, and the questions ask for the lowest vertex that is above
    (or equal to) both of two vertices, or what that vertex tells: the meeting point, the shared part
    of two paths, the vertex where two routes to the root merge.'
  how_to_test: Check that the root is fixed and that the question is about the first common vertex when
    climbing from two vertices. Equalise the depths with the k-th ancestor, then jump both together from
    the largest jump to the smallest while the ancestors differ.
  constraint_shapes:
  - 'q = 2·10^5 pairs in a tree of 2·10^5 vertices: climbing is up to 4·10^10 steps, while two lifts of
    at most 18 jumps each are about 7·10^6'
  - 'A chain-like tree: depth 2·10^5, so a plain climb for each pair is too slow'
  weak_signals:
  - form: Asks for the lowest common boss, ancestor or meeting point of two vertices, for many pairs
    shape: n, q up to 2·10^5
  - form: Asks whether a vertex lies on the path between two others, or which vertex is the top of a path
    shape: n, q up to 2·10^5
  - form: Needs the number of edges or the total weight between two vertices (the next card), or the top
      of a path to place counts on it
    shape: n, q up to 2·10^5
  kill_signals:
  - 'The root is not fixed: the meeting vertex changes with the root (the first negative example below)'
  - 'The graph is not a tree (a vertex may have several parents): "lowest common ancestor" is not unique'
  in_action:
    statement: A company is a tree with the boss 1 at the root. For each of q pairs (a, b), print the
      lowest employee who is a boss of both (an employee counts as his own boss).
    constraints: n, q ≤ 2·10^5.
    budget: Climbing is up to q · n = 4·10^10 steps. Need about O((n + q) log n).
    candidates:
    - tool: Climbing one parent at a time (topic 4.5)
      verdict: rejected
      because: 4·10^10 steps for a chain.
    - tool: 'Binary lifting: equalise the depths, then jump while the ancestors differ (this topic)'
      verdict: chosen
      because: The test "the ancestors differ" is monotone in the jump length, so the largest-to-smallest
        loop finds the child of the meeting point (Theorem 4.6.2).
    property_check: A fixed root, pairs of vertices, and the answer is the first common vertex above them.
    decision: Prepare the jump table and depths once; for each pair run the lift and the loop, and print
      the parent of the stopping vertex.
  examples:
    positive:
    - inline:
        input: The tree 1–2–3–4–5–6 with the branch 2–7–8, rooted at 1. What is the lowest common ancestor
          of 6 and 8?
        answer: '2'
        why: The ancestors of 6 are 6, 5, 4, 3, 2, 1 and those of 8 are 8, 7, 2, 1; the lowest one they
          share is 2. Marking one chain and climbing the other agrees.
    - inline:
        input: The same tree. What is the lowest common ancestor of 8 and 7?
        answer: '7'
        why: Vertex 7 is an ancestor of 8, and a vertex counts as its own ancestor, so 7 is the answer.
    negative:
    - inline:
        input: The tree 1–2, 1–3, 3–4, 3–5. What is the lowest common ancestor of 2 and 5 when the tree
          is rooted at vertex 4?
        answer: '3'
        method_gives: '1'
        why: Rooted at 4, the path from 2 to 5 is 2–1–3–5, and its top is 3 (the vertex closest to 4).
          The table made for the root 1 gives vertex 1. A different root needs a new walk and a new table.
      correct_tool:
        topic: '4.5'
        card: depths-parents
    - problem: ac-abc202_e
      why: 'The question is about the vertices below a given vertex at a given depth: a subtree range
        and a sorted list per depth, not a meeting point of two vertices.'
      correct_tool:
        topic: '4.5'
        card: subtree-ranges
  lookalikes:
  - description: The k-th ancestor of one vertex
    tool:
      topic: '4.6'
      card: jump-up
    flipping_difference: There the jump length is given; here it is found by comparing two chains, which
      needs both vertices at the same depth first.
  - description: The distance between two vertices
    tool:
      topic: '4.6'
      card: tree-distance
    flipping_difference: The distance uses the lowest common ancestor, but asks for a number about the
      whole path.
  complexity: O(n log n) to prepare, O(log n) per query.
- id: tree-distance
  name: Distances in a tree
  from_theorem: 4.6.3
  decisive_property: The graph is a tree and the questions ask for the distance (edges or total weight)
    between two given vertices, for many pairs, or for something that is built from such distances.
  how_to_test: Check that the graph is a tree (n − 1 edges, connected) and that weights are not negative.
    Compute the weighted depth of every vertex from a root, find the lowest common ancestor of each pair,
    and answer wd[u] + wd[v] − 2·wd[lca].
  constraint_shapes:
  - 'q = 2·10^5 pairs in a tree of n = 2·10^5: a walk for each pair is up to 8·10^10 steps, while the
    formula needs two lookups and one lowest common ancestor'
  - 'Weights up to 10^9: distances up to 2·10^14, in 64 bits'
  weak_signals:
  - form: Asks for the distance between a and b in a tree, for many pairs
    shape: n, q up to 2·10^5
  - form: 'Asks whether a vertex lies on the path between two others: d(a, c) + d(c, b) = d(a, b)'
    shape: n, q up to 2·10^5
  - form: Asks for the length of a cycle made by adding an edge to a tree, or the length of the shortest
      route when one extra edge may be used
    shape: A tree plus a few extra edges, q up to 2·10^5
  kill_signals:
  - 'The graph has cycles: the formula gives the length of the tree path, not the shortest route (the
    first negative example below)'
  - 'A weight is negative or edges are directed with different costs each way: the formula is not valid'
  in_action:
    statement: A tree of n cities is given. For each of q pairs (a, b), print the number of roads on the
      trip between a and b.
    constraints: n, q ≤ 2·10^5.
    budget: A walk per pair is up to 8·10^10 steps. Need about O((n + q) log n).
    candidates:
    - tool: A walk from a for every pair (topic 4.5)
      verdict: rejected
      because: Up to 8·10^10 steps.
    - tool: depth[a] + depth[b] − 2·depth[lca] with binary lifting (this topic)
      verdict: chosen
      because: The unique path goes up to the lowest common ancestor and down again (Theorem 4.6.3).
    property_check: The graph is a tree with unit edges, and the answer is a path length between two given
      vertices.
    decision: Root the tree at 1, compute depths and the jump table, and answer each pair with the formula.
  examples:
    positive:
    - inline:
        input: The tree with the edges 1–2 (3), 2–3 (4), 2–4 (1), 4–5 (6), 1–6 (2). What is the distance
          between 3 and 5?
        answer: '11'
        why: 'The path is 3–2–4–5 with 4 + 1 + 6 = 11. With the root 1, the weighted depths of 3 and 5
          are 7 and 10 and their lowest common ancestor 2 has 3: 7 + 10 − 6 = 11. A table of all distances
          agrees.'
    - inline:
        input: The tree 1–2, 1–3, 3–4, 3–5 (every edge counts 1). What are the distances for the pairs
          (1, 3), (2, 5), (1, 4)?
        answer: 1,3,2
        why: The paths are 1–3, 2–1–3–5 and 1–3–4, with 1, 3 and 2 edges; the formula gives the same.
    - worked_example: cses-1135
      why: 'A tree and 2·10^5 distance questions: depths and the lowest common ancestor.'
    negative:
    - inline:
        input: The triangle 1–2, 2–3, 1–3 (every edge counts 1). What is the distance between 2 and 3?
        answer: '1'
        method_gives: '2'
        why: The tree of a walk from 1 has the edges 1–2 and 1–3, and the formula gives 1 + 1 − 0 = 2,
          but the edge 2–3 gives 1. With a cycle, the tree path is not the shortest route; use the walk
          of topic 4.1 from the first vertex.
      correct_tool:
        topic: '4.1'
        card: unweighted-shortest
    - problem: ac-abc361_e
      why: The question asks for the length of a whole trip through all cities, which uses the diameter,
        not a distance between two given cities.
      correct_tool:
        topic: '4.5'
        card: longest-path
  lookalikes:
  - description: The farthest vertex from every vertex
    tool:
      topic: '4.5'
      card: farthest-each
    flipping_difference: There the distances from one vertex to all others are all needed (two walks);
      here single pairs are asked, and the lowest common ancestor answers each in O(log n).
  - description: The smallest edge on the path between two vertices
    tool:
      topic: '4.6'
      card: path-values
    flipping_difference: The distance is a sum that comes from two depths; the minimum cannot be subtracted,
      so values are stored with the jumps.
  complexity: O(n log n) to prepare, O(log n) per query.
- id: path-values
  name: Minimum, maximum or sum along a path
  from_theorem: 4.6.4
  decisive_property: The tree is fixed, and each question asks for a combination (the smallest, the largest,
    the sum, the XOR) of the values on the path between two vertices, or on a long walk along pointers.
  how_to_test: Check that the combination can be done piece by piece (it is associative) and that the
    values do not change between questions. Store with each jump of 2^j levels the combination of the
    values it passes, and combine the pieces along the same jumps as the search for the meeting point.
  constraint_shapes:
  - 'q = 2·10^5 questions on paths of a tree of 2·10^5 vertices: walking each path is up to 4·10^10 steps,
    while the combined jumps are about 40 table lookups'
  - 'A pointer graph and k up to 10^12 steps with a sum of gains: jumps of 2^j steps with their sums,
    40 jumps per query'
  weak_signals:
  - form: Asks for the smallest or largest edge weight (toll, height limit) on the path between two vertices
    shape: n, q up to 2·10^5
  - form: Asks for the sum of values collected after k moves along pointers, with k up to 10^12
    shape: n up to 2·10^5
  - form: Asks for the sum or XOR of the values on a vertex-to-vertex path of a tree without changes between
      questions
    shape: n, q up to 2·10^5
  kill_signals:
  - 'The values change between questions: the tables become stale (a task for a structure with updates,
    in a later phase)'
  - 'The graph has cycles and the question wants the best route: the unique tree path is not the best
    route (the first negative example below)'
  in_action:
    statement: A tree has n cities and roads with toll limits. For each of q pairs (a, b), print the smallest
      limit on the road path between them.
    constraints: n, q ≤ 2·10^5, limits ≤ 10^9.
    budget: A walk per question is up to 4·10^10 steps. Need about O((n + q) log n).
    candidates:
    - tool: A walk of the path for every question (topic 4.5)
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: Binary lifting with a table of minima over the jumps (this topic)
      verdict: chosen
      because: The path is cut into the same disjoint jumps as the search for the lowest common ancestor,
        and the minimum is associative (Theorem 4.6.4).
    property_check: A fixed tree, fixed limits, many path questions about a minimum.
    decision: Store mn[j][v] with the jump table; for each pair, lift the deeper vertex, jump both while
      the ancestors differ, taking minima, and add the last two edges.
  examples:
    positive:
    - inline:
        input: The tree 1–2 (3), 2–3 (4), 2–4 (1), 4–5 (6), 1–6 (2). What is the smallest edge weight
          on the path from 3 to 5?
        answer: '1'
        why: The path 3–2–4–5 has the weights 4, 1, 6, and the smallest is 1. The table of minima over
          the jumps gives the same.
    - inline:
        input: A dish starts empty. K = 5 times, put A[X mod 3] more candies on it, where X is the number
          of candies on it and A = (1, 2, 3). How many candies are on the dish at the end?
        answer: '7'
        why: 'X = 0 → 1 → 3 → 4 → 6 → 7. The position X mod 3 is the vertex, the next position is (X +
          A) mod 3, and the jump table also stores the sum of the gains: 5 = 4 + 1 steps.'
    - worked_example: ac-abc241_e
      why: 'The same dish with N up to 2·10^5 and K up to 10^12: jumps of 2^j steps with the sum of the
        candies they add.'
    negative:
    - inline:
        input: The triangle 1–2 (5), 2–3 (5), 1–3 (1). What is the largest possible smallest edge on a
          trip from 2 to 3?
        answer: '5'
        method_gives: '1'
        why: The direct edge 2–3 has weight 5. A table built for the tree of a walk from vertex 1 (edges
          1–2 and 1–3) gives the path 2–1–3 with smallest edge 1. With cycles, the best trip lies in a
          maximum spanning tree (the Kruskal order of topic 4.4), and the table is built on that tree.
      correct_tool:
        topic: '4.4'
        card: largest-edge
    - problem: ac-abc333_d
      why: The question asks which vertices to delete in a tree, decided by the sizes of subtrees, not
        by a combination along a path.
      correct_tool:
        topic: '4.5'
        card: subtree-values
  lookalikes:
  - description: The distance between two vertices
    tool:
      topic: '4.6'
      card: tree-distance
    flipping_difference: A sum can be built from the two depths and the meeting point; a minimum or a
      maximum cannot be subtracted, so the values travel with the jumps.
  - description: Counting how many given paths use each edge
    tool:
      topic: '4.6'
      card: path-counts
    flipping_difference: 'There all paths are known first and nothing is asked in between: +1 at the ends
      and −2 at the meeting point, then subtree sums; here each query is answered separately.'
  complexity: O(n log n) to prepare, O(log n) per query.
- id: path-counts
  name: Adding along many paths (offline)
  from_theorem: 4.6.5
  decisive_property: Many paths of a tree are given, each adds one (or a value) to every edge or vertex
    on it, and the totals are asked only at the end.
  how_to_test: Check that the totals are asked after all the paths and that the tree is fixed. Put +1
    at both ends of each path and −2 at the lowest common ancestor, then take the sums over the subtrees;
    the sum at v is the count of the edge above v. For vertices, put −1 at the meeting point and −1 at
    its parent.
  constraint_shapes:
  - 'q = 2·10^5 paths in a tree of 2·10^5 vertices: adding along each path is up to 4·10^10 steps, while
    the counts need q lowest-common-ancestor queries and one pass over the tree'
  - 'Counts up to q per edge, and sums of values up to 10^14: 64-bit numbers'
  weak_signals:
  - form: Many trips are made along the roads of a tree; asks how many times each road is used, or which
      is used most
    shape: n, q up to 2·10^5
  - form: Many ranges of a path are painted or incremented; asks for the final values on all vertices
      or edges
    shape: n, q up to 2·10^5
  - form: Asks for the cost of the busiest edge, or the total cost when each use of a road costs a price
    shape: n, q up to 2·10^5
  kill_signals:
  - 'Questions about the counts come between the additions (online): an offline sum cannot answer them
    (a task for a structure with updates, in a later phase)'
  - 'The question counts vertices rather than edges: use the vertex form of the counts, with −1 at the
    meeting point and at its parent (the first negative example below)'
  in_action:
    statement: A tree of n cities and q trips, each from a city a to a city b along the roads. For each
      road, print the number of trips that use it.
    constraints: n, q ≤ 2·10^5.
    budget: Walking each trip is up to q · n = 4·10^10 steps. Need about O((n + q) log n).
    candidates:
    - tool: Walking each trip and adding 1 on its edges (topic 4.5)
      verdict: rejected
      because: 4·10^10 steps for a chain.
    - tool: +1 at both ends, −2 at the meeting point, then subtree sums (this topic)
      verdict: chosen
      because: The sum over the subtree of v counts exactly the paths with one end inside (Theorem 4.6.5).
    property_check: All trips are known first, the answers are totals per road, and the tree is fixed.
    decision: Root the tree, find each trip's lowest common ancestor with binary lifting, add the counts,
      and sum over subtrees in the backward pass over the visit order.
  examples:
    positive:
    - inline:
        input: The tree 1–2, 1–3, 2–4, 2–5, 3–6 and the trips 4–5, 4–6, 5–6. How many trips use the road
          above each of the vertices 2, 3, 4, 5, 6?
        answer: 2,2,2,2,2
        why: Every road is used by two of the three trips; for example the road 2–1 is used by 4–6 and
          5–6. The counts +1, +1, −2 and the subtree sums give the same.
    - inline:
        input: The path 1–2–3–4 and the trips 1–4 and 2–3. How many trips use the road above each of the
          vertices 2, 3, 4?
        answer: 1,2,1
        why: The trip 1–4 uses all three roads and the trip 2–3 uses only the road 3–2, so the counts
          are 1, 2, 1.
    negative:
    - inline:
        input: The path 1–2–3 and the single trip 2–3. How many trips pass through the vertex 2?
        answer: '1'
        method_gives: '0'
        why: 'The trip starts at vertex 2, so it passes through it. The edge version puts the count of
          the road above vertex 2 at vertex 2, and the road 2–1 is not used: 0. For vertices the lowest
          common ancestor and its parent each get −1.'
      correct_tool:
        topic: '4.6'
        card: path-counts
    - problem: ac-abc333_d
      why: The question deletes vertices of a tree and depends on subtree sizes; no trips are given.
      correct_tool:
        topic: '4.5'
        card: subtree-values
  lookalikes:
  - description: The smallest or largest value on one path
    tool:
      topic: '4.6'
      card: path-values
    flipping_difference: One path per question is answered at once; counting along many paths needs all
      paths known first.
  - description: The sum of the values in each subtree
    tool:
      topic: '4.5'
      card: subtree-values
    flipping_difference: The same backward pass, but here the values to add come from the ends and meeting
      points of the paths.
  complexity: 'O((n + q) log n): q lowest-common-ancestor queries and one backward pass.'
problems:
- id: cses-1750
  role: worked_example
  summary: 'n ≤ 2·10^5 planets each with one teleporter, and q ≤ 2·10^5 queries (x, k): starting on planet
    x and using k ≤ 10^9 teleporters, which planet is reached?'
- id: cses-1135
  role: worked_example
  summary: 'A tree with n ≤ 2·10^5 nodes and q ≤ 2·10^5 queries: the distance (number of edges) between
    nodes a and b.'
- id: ac-abc241_e
  role: worked_example
  summary: A sequence A of length N ≤ 2·10^5; K ≤ 10^12 times, put A[X mod N] more candies on the dish,
    X being the number there now; how many candies are on the dish at the end?
- id: ac-abc167_d
  role: ladder
  card: jump-up
  rung: 1
  twist: 'Base case of the card with a huge k: the same table, about 60 levels.'
  summary: N ≤ 2·10^5 towns, each with one teleporter to town A_i; starting at town 1 and using a teleporter
    exactly K ≤ 10^18 times, which town is reached?
  hints:
  - Does the next town depend on anything other than the current town? What does K up to 10^18 rule out?
  - Build up[j][v], the town after 2^j teleporters, from the level before it; 60 levels are enough for
    10^18.
  - Start at town 1 and, for every set bit j of K, move to up[j][town]; print the final town.
- id: lc-kth-ancestor-of-a-tree-node
  role: ladder
  card: jump-up
  rung: 2
  twist: 'The same table on a real tree: a jump can leave the tree, and the answer is then −1.'
  summary: A tree of n ≤ 5·10^4 nodes is given by its parent array (root 0, parent −1); answer up to 5·10^4
    queries "the k-th ancestor of node", or −1 if the root is passed.
  hints:
  - What should the table hold above the root, so that a jump that leaves the tree is noticed?
  - Use −1 as a marker that is its own parent in every level, and build up[j][v] from up[j − 1][up[j −
    1][v]].
  - For every set bit of k, jump; as soon as the marker is reached, the answer is −1. Build the table
    once and answer each query in O(log n).
- id: ac-abc258_e
  role: ladder
  card: jump-up
  rung: 3
  twist: 'The successor is not given: compute where the next box starts first, then double over it.'
  summary: Potatoes with the repeating weights W_0..W_{N-1} are packed in order, a box being sealed as
    soon as its weight reaches X; for Q ≤ 2·10^5 questions K ≤ 10^12, how many potatoes are in the K-th
    sealed box?
  hints:
  - A box starts at some position of the sequence and its size depends only on that position. What is
    the "next" of a start?
  - For each start, the box size is (X / total weight) · N plus the rest found by a binary search on the
    prefix sums of the doubled sequence; the next start is (start + size) mod N.
  - 'The K-th box starts after K − 1 jumps from position 0: use the table of the jumps and print the size
    stored for that start.'
- id: cf-1175E
  role: ladder
  card: jump-up
  rung: 4
  twist: The pointer comes from a greedy rule on a line, and a query counts how many jumps fit before
    the end.
  summary: 'n ≤ 2·10^5 intervals on a line and m ≤ 2·10^5 questions [x, y]: the fewest of the given intervals
    whose union covers [x, y], or −1 if that is impossible.'
  hints:
  - 'Greedy: standing at the point x, which interval is the best next choice?'
  - Let far[p] be the largest right end of an interval that starts at or before p (a running maximum).
    One greedy step moves p to far[p]; build the table of 2^j such steps.
  - For a question, jump from x while the result stays below y, counting the steps; the answer is that
    count plus one, and −1 if the first step does not even move forward.
- id: lc-lowest-common-ancestor-of-a-binary-tree
  role: ladder
  card: meeting-vertex
  rung: 1
  twist: 'Base case of the card for a single question: no table is needed, one pass finds the meeting
    place.'
  summary: In a binary tree with 2 to 10^5 nodes of distinct values, find the lowest common ancestor of
    two given different nodes p and q (a node may be its own descendant).
  hints:
  - If p is in the left part of a node and q in the right part, where is the lowest common ancestor?
  - 'Let a pass return, for each subtree, what it found: p or q, or the answer itself once both are found.'
  - 'Return the node if it is p or q; otherwise look at the two sides: both sides found something → this
    node is the answer; only one side → return its result; none → nothing.'
- id: lc-step-by-step-directions-from-a-binary-tree-node-to-another
  role: ladder
  card: meeting-vertex
  rung: 2
  twist: The meeting place is where the two root paths stop agreeing, and the directions follow from it.
  summary: In a binary tree of n ≤ 10^5 nodes with the values 1..n, give the shortest path from the node
    startValue to the node destValue as a string of the letters L, R and U (down left, down right, up).
  hints:
  - The shortest path goes up to one vertex and then down. Which vertex is that?
  - Write the path from the root to each of the two nodes as a string of L and R; the lowest common ancestor
    is where the two strings stop agreeing.
  - Remove the common prefix; the answer is one U for each letter left in the start string, followed by
    what is left of the destination string (use a stack, not recursion, for deep trees).
- id: cf-1702G1
  role: ladder
  card: meeting-vertex
  rung: 3
  twist: Distances through the meeting place decide whether a set of vertices lies on one path.
  summary: 'A tree of n ≤ 2·10^5 vertices and q ≤ 5 queries, each a set of vertices: is there a simple
    path in the tree that contains every vertex of the set?'
  hints:
  - If such a path exists, which two vertices of the set must be its ends?
  - Root the tree at 1. Take the deepest vertex u of the set and the vertex v of the set farthest from
    u; only the path from u to v can work.
  - Every other vertex w of the set must satisfy dist(u, w) + dist(w, v) = dist(u, v); compute the distances
    from depths and the lowest common ancestor.
- id: lc-cycle-length-queries-in-a-tree
  role: ladder
  card: tree-distance
  rung: 1
  twist: The tree is shallow (at most 30 levels), so the lowest common ancestor is found by climbing;
    the cycle is one edge longer than the path.
  summary: In the complete binary tree with 2^n − 1 nodes (n ≤ 30, node x has the children 2x and 2x +
    1), for each of up to 10^5 queries (a, b) add the edge a–b and give the length of the cycle it creates.
  hints:
  - What is the cycle made of?
  - 'The path in the tree from a to b plus the new edge: its length is dist(a, b) + 1.'
  - The parent of x is x / 2. Repeatedly replace the larger label by its half and count the steps until
    the two are equal; add one for the new edge.
- id: ac-abc014_4
  role: ladder
  card: tree-distance
  rung: 2
  twist: The same distance formula as the base case, now on an arbitrary tree with depths and a table.
  summary: A tree with N ≤ 10^5 vertices and Q ≤ 10^5 candidate edges (a, b); for each, how many edges
    has the one cycle that appears when the edge is added?
  hints:
  - The new edge closes a cycle with the tree path between a and b. How long is it?
  - The path has depth[a] + depth[b] − 2 · depth[lca(a, b)] edges, and the new edge adds one more.
  - Root at vertex 1, build the lifting table, and print distance + 1 for every candidate.
- id: cf-832D
  role: ladder
  card: tree-distance
  rung: 3
  twist: Three distances give the length of the part shared by two paths.
  summary: A tree of n ≤ 10^5 stations and q ≤ 10^5 queries of three stations; for each choice of which
    of the three is the meeting end, the other two walk their shortest paths to it, and the score is the
    number of stations the two paths share; print the best score.
  hints:
  - Where do the two paths from s and t to f stop being the same?
  - The shared part has (d(s, f) + d(t, f) − d(s, t)) / 2 edges, so one more station than that.
  - Try each of the three stations as f, compute the three distances with the lowest common ancestor,
    and take the maximum.
- id: cf-1304E
  role: ladder
  card: tree-distance
  rung: 4
  twist: Distances with one extra edge, and a parity argument about walking back and forth.
  summary: 'A tree of n ≤ 10^5 vertices and q ≤ 10^5 questions (x, y, a, b, k): after adding the edge
    x–y, is there a walk from a to b with exactly k edges (edges may be repeated)?'
  hints:
  - Which routes from a to b are worth trying when one extra edge is added?
  - 'Three: the tree path, a → x → y → b, and a → y → x → b; walking an edge back and forth adds exactly
    2 edges to any walk.'
  - Answer YES if some candidate length d satisfies d ≤ k and k − d is even; the distances come from the
    lowest common ancestor.
- id: lc-maximize-value-of-function-in-a-ball-passing-game
  role: ladder
  card: path-values
  rung: 1
  twist: The jump table also carries a sum of the indices passed, and every start is tried.
  summary: receiver[i] is the player to whom player i passes; the ball starts at a chosen player and is
    passed exactly k ≤ 10^10 times; the score is the sum of the indices of all players who touched the
    ball (start included, repetitions counted). Find the best score over all starting players.
  hints:
  - After k passes you need the sum of the indices on the way. How do the sums of two halves of a walk
    combine?
  - Keep, for each level j and player i, the player after 2^j passes and the sum of the indices of those
    2^j players after i; the sum of a level is the sum of the two halves.
  - For each start combine the jumps of the set bits of k (34 levels), add the start itself, and take
    the maximum; use 64-bit numbers.
- id: cses-2101
  role: ladder
  card: path-values
  rung: 2
  twist: The tree has to be built first (the roads that join two components in the order of the days),
    then the path maximum is the answer.
  summary: 'n ≤ 2·10^5 cities, m ≤ 2·10^5 roads built one per day, and q ≤ 2·10^5 questions (a, b): after
    how many days is it first possible to travel from a to b (−1 if never)?'
  hints:
  - Which roads can matter? A road that joins two cities already connected adds nothing for any question.
  - Keep only the roads that join two different components (the union–find of topic 4.4 finds them in
    the order of the days); they form a forest whose edge weight is the day.
  - The answer is the largest day on the forest path between a and b (a table of the maximum over each
    jump), or −1 if a and b are in different trees.
- id: cf-1843F2
  role: ladder
  card: path-values
  rung: 3
  twist: 'The aggregate is not a plain minimum or sum: a block of four numbers is merged along the jumps,
    in the right direction.'
  summary: 'A tree with ±1 edge weights (n ≤ 2·10^5 in total) and queries (u, v, k): does the path from
    u to v contain a subsegment whose sum is exactly k?'
  hints:
  - Which values of k are possible if every weight is +1 or −1?
  - A subsegment sum changes by one when the segment grows or shrinks by one, so every value between the
    smallest and the largest subsegment sum (the empty segment gives 0) can be reached.
  - Store for each jump the sum, the best prefix, the best suffix and the best segment, for both the maximum
    and the minimum; merge them along the path, reversing one of the two sides at the lowest common ancestor.
- id: cf-191C
  role: ladder
  card: path-counts
  rung: 1
  twist: 'Base case of the card: +1 at both ends, −2 at the lowest common ancestor, subtree sums per road.'
  summary: A tree of n ≤ 10^5 towns and k ≤ 10^5 pairs (a, b), each a trip along the unique path; print
    for every road, in the input order, how many trips use it.
  hints:
  - Counting the roads of every trip separately is too slow. What can be added to a whole path in constant
    time?
  - Add +1 at a, +1 at b and −2 at the lowest common ancestor; the sum over the subtree of a vertex is
    the number of trips using the road above it.
  - Root at 1, compute the lowest common ancestors, take the sums in the order of the walk backwards,
    and print for each road the sum of its lower end.
- id: lc-minimum-edge-weight-equilibrium-queries-in-a-tree
  role: ladder
  card: path-counts
  rung: 2
  twist: 'Counts of 26 values along a path from prefixes at the ends: the same −2 at the lowest common
    ancestor, now as a subtraction.'
  summary: 'A tree of n ≤ 10^4 nodes with edge weights from 1 to 26 and m ≤ 2·10^4 queries (a, b): the
    fewest edges to change so that all edges on the path from a to b have the same weight.'
  hints:
  - What is the answer if the number of edges of each weight on the path is known?
  - The path length minus the largest count of one weight. How can the counts on a path be found for many
