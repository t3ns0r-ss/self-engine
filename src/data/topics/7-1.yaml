- id: cf-1946C
  role: ladder
  card: subtree-dp
  rung: 2
  twist: Counting finished pieces from the leaves up, with a binary search on the size of a piece.
  summary: A tree of n ≤ 10^5 vertices and numbers k and x; the largest x such that k edges can be cut
