# Topic 0.1 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.1"
draft: true
cards:
  - id: overflow-64bit
    name: 64-bit integers
    decisive_property: Some intermediate value (a sum, a product, a count) can exceed about 2.1·10^9 but stays below about 9.2·10^18, so every step must be computed in long long; a product that could pass 10^18 is checked by division first (a > L / b) instead of being computed.
    from_theorem: Theorem 0.1.1
    how_to_test: Multiply out the largest values the constraints allow for every intermediate result, not just the answer. Over 2.1·10^9 means long long; over 9.2·10^18 means checking before multiplying (Theorem 0.1.2) or unsigned long long up to 1.8·10^19.
    weak_signals:
      - Values up to 10^9 or 10^18 in the constraints
      - A sum of many values, a product of two values, or a count of pairs
      - The statement warns that the answer may not fit in a 32-bit integer
    kill_signals:
      - Even the 64-bit range is exceeded and the answer is asked modulo a number (topic 0.4)
      - All values and their combinations stay below about 2·10^9
    lookalikes:
      - description: Compute a product of decimal numbers exactly (rounding, not size, is the trap)
        needs: "integer-rounding (0.1): scale to integers"
        flipping_difference: The danger is the floating-point error, not the size of the result.
    complexity: "No extra cost: long long arithmetic is as fast as int for these purposes."
  - id: multi-test
    name: Many test cases in one input
    decisive_property: The statement bounds the sum of the sizes over all test cases, so the work per test must depend only on that test's size; anything sized by the maximum (clearing a global array) multiplies by the number of tests.
    from_theorem: Theorem 0.1.3
    how_to_test: Find the line that bounds the sum of n over all tests. Then check that every loop and every allocation inside a test is sized by that test's n, and that nothing carries over from the previous test.
    weak_signals:
      - The first line is t, the number of test cases
      - "'The sum of n over all test cases does not exceed …'"
      - Codeforces Div. 3 and Div. 4 problems almost always
    kill_signals:
      - One test per input (then per-test cost is the whole cost)
    lookalikes:
      - description: A single test with q queries, where each query is small
        needs: "multi-test reasoning still applies: total work is the sum over queries"
        flipping_difference: Queries share data, so state must persist between them instead of being reset.
    complexity: "Sum over tests of the per-test cost: O(total n) when each test is linear in its own n."
  - id: integer-rounding
    name: Exact integer rounding
    decisive_property: All quantities are integers, so floors, ceilings and square roots can be computed exactly with integer arithmetic (a / b with a sign correction, (a + b − 1) / b for a ≥ 0, a corrected integer square root) instead of floating point.
    from_theorem: Theorem 0.1.4
    how_to_test: Look for 'round up', 'at least how many', 'divided by … rounded', a square root, or a percentage. Then check the signs of the values (negative values change truncation) and whether values exceed 2^53 ≈ 9·10^15 (double loses exactness).
    weak_signals:
      - "'How many groups of size b are needed', 'rounded up', 'at least'"
      - Integer division with possibly negative values
      - Square roots or percentages of large integers
      - Decimal inputs like 1.23 that can be read as integers in hundredths
    kill_signals:
      - The answer is a real number with an allowed absolute or relative error (use double)
    lookalikes:
      - description: Ceiling of X/10 instead of floor of X/10, with negative X
        needs: integer-rounding (0.1), the other formula
        flipping_difference: Truncation toward zero equals the floor only for non-negative values, and equals the ceiling only for non-positive values.
    complexity: O(1) per division; the integer square root correction moves the guess by at most one or two steps.
problems:
  - id: cses-1083
    role: ladder
    card: overflow-64bit
    rung: 1
    twist: Base case of the card
    summary: All numbers 1..n except one are given (n ≤ 2·10^5); find the missing one.
    hints:
      - What is 1 + 2 + … + n, and how large can it get?
      - It is n(n + 1)/2 ≈ 2·10^10 for n = 2·10^5, more than an int holds (Theorem 0.1.1).
      - Compute n(n + 1)/2 in long long and subtract the sum of the given numbers (also in long long).
  - id: ac-abc162_b
    role: ladder
    card: overflow-64bit
    rung: 2
    twist: "The sum is of a filtered sequence: only the terms not divisible by 3 or 5."
    summary: Sum of the numbers 1..N (N ≤ 10^6) that are divisible by neither 3 nor 5.
    hints:
      - How big is the sum of all numbers up to 10^6?
      - "About 5·10^11: it needs long long even though every term fits in an int."
      - Loop i from 1 to N, add i when i % 3 != 0 and i % 5 != 0, keeping the total in long long.
  - id: ac-abc165_b
    role: ladder
    card: overflow-64bit
    rung: 3
    twist: A loop whose value grows by 1% a year and stops at 10^18, with a floor at every step.
    summary: A balance of 100 grows by 1% a year, rounded down each year; in how many years does it first reach X (X ≤ 10^18)?
    hints:
      - How many years can it take, and how big can the balance get just before it stops?
      - "Under 4000 years, but the balance reaches 10^18, and balance · 101 must not overflow: 10^18 · 101 is about 10^20."
      - Keep the balance in long long and update balance += balance / 100 (the same as balance · 101 / 100 rounded down, without the big product).
  - id: ac-abc327_b
    role: ladder
    card: overflow-64bit
    rung: 4
    twist: Powers grow so fast that the loop must stop before computing a power that overflows.
    summary: Given B ≤ 10^18, find A with A^A = B, or −1.
    hints:
      - How large can A be if A^A ≤ 10^18?
      - 15^15 ≈ 4.4·10^17 and 16^16 ≈ 1.8·10^19, so only A ≤ 15 can work; 16^16 itself does not fit.
      - For A = 1..15 compute A^A by repeated multiplication in long long and compare with B.
  - id: ac-abc079_b
    role: ladder
    card: overflow-64bit
    rung: 5
    twist: A recurrence whose values grow towards 10^18.
    summary: The N-th Lucas number (L_0 = 2, L_1 = 1, L_i = L_{i−1} + L_{i−2}), N ≤ 86.
    hints:
      - Lucas numbers grow like Fibonacci numbers. Will the 86th fit in an int?
      - "No: the statement promises it is below 10^18, so long long is needed and enough."
      - Keep two long long variables for the last two terms and step N times.
  - id: cses-1094
    role: ladder
    card: overflow-64bit
    rung: 6
    twist: The answer is a total of many increments, each up to 10^9.
    summary: Fewest +1 moves (n ≤ 2·10^5, x_i ≤ 10^9) to make the array non-decreasing.
    hints:
      - If x_i is smaller than the previous value, how many moves does it need at least?
      - Raise it exactly to the previous value; the total can reach about 2·10^5 · 10^9 = 2·10^14.
      - Scan left to right, keeping the current maximum; add max − x_i when x_i is smaller. Use long long for the total.
  - id: lc-count-odd-numbers-in-an-interval-range
    role: ladder
    card: integer-rounding
    rung: 1
    twist: Base case of the card
    summary: Count the odd numbers in [low, high] (0 ≤ low ≤ high ≤ 10^9).
    hints:
      - How many odd numbers are there in [0, v]?
      - "Exactly ⌊(v + 1) / 2⌋: for v ≥ 0 that is plain integer division."
      - Answer (high + 1) / 2 − low / 2, since the odd numbers below low number ⌊low / 2⌋.
  - id: ac-abc176_a
    role: ladder
    card: integer-rounding
    rung: 2
    twist: "A ceiling: the number of batches is ⌈N / X⌉."
    summary: A machine makes at most X pieces at a time in T minutes; minutes to make N pieces (all ≤ 1000).
    hints:
      - How many batches are needed for N pieces?
      - ⌈N / X⌉ batches, each taking T minutes.
      - Print (N + X − 1) / X · T, which is safe because all values are positive (Theorem 0.1.4).
  - id: ac-abc302_a
    role: ladder
    card: integer-rounding
    rung: 3
    twist: The same ceiling with values up to 10^18, so the shortcut must be checked for overflow.
    summary: Stamina A drops by B per attack (A, B ≤ 10^18); fewest attacks to reach 0 or less.
    hints:
      - The answer is ⌈A / B⌉. Is (A + B − 1) / B safe here?
      - A + B − 1 can reach 2·10^18, still below 9.2·10^18, so it fits a long long.
      - "Read A and B as long long and print (A + B − 1) / B. Do not use floating point: 10^18 / 3 is not exact in a double."
  - id: ac-abc273_b
    role: ladder
    card: integer-rounding
    rung: 4
    twist: Rounding to the nearest multiple of 10^i, repeated K times, with halves rounded up.
    summary: Round X (X < 10^15) to the nearest multiple of 10, then of 100, …, up to 10^K, in turn; print the result.
    hints:
      - For a power p = 10^i, how do you round X to the nearest multiple of p with integers only?
      - "The remainder r = X % p decides: if 2r ≥ p round up (X − r + p), else down (X − r)."
      - Loop i = 1..K with p in long long (10^15 fits); apply the rule each time.
  - id: ac-abc334_b
    role: ladder
    card: integer-rounding
    rung: 5
    twist: "Floor division of possibly negative values: positions are A + kM with A, L, R down to −10^18."
    summary: Trees stand at A + kM for every integer k; count those in [L, R] (coordinates up to ±10^18, M ≤ 10^9).
    hints:
      - Shift everything by A. Which k satisfy L ≤ A + kM ≤ R?
      - k from ⌈(L − A) / M⌉ to ⌊(R − A) / M⌋, and L − A can be negative, so C++ / is not the floor.
      - "Use floorDiv from Section 6: answer ⌊(R − A) / M⌋ − ⌈(L − A) / M⌉ + 1. The differences stay within ±2·10^18."
  - id: cf-1A
    role: ladder
    card: integer-rounding
    rung: 6
    twist: "Two ceilings multiplied: the product can pass the int range."
    summary: Cover an n by m rectangle with a by a tiles (n, m, a ≤ 10^9); fewest tiles.
    hints:
      - How many tiles does one side of length n need?
      - ⌈n / a⌉ along one side and ⌈m / a⌉ along the other.
      - "Multiply the two ceilings in long long: each can be 10^9, so the product reaches 10^18."
  - id: cf-1742A
    role: ladder
    card: multi-test
    rung: 1
    twist: Base case of the card
    summary: "For each of t tests, three numbers: is one of them the sum of the other two?"
    hints:
      - What does one test need, and what must be read t times?
      - Read t, then loop t times; each test reads its own three numbers and prints YES or NO.
      - Check a == b + c, b == a + c, or c == a + b.
  - id: cf-1703A
    role: ladder
    card: multi-test
    rung: 2
    twist: Each test is a short string compared without regard to letter case.
    summary: 'For each of t tests, a 3-letter string: is it "yes" in any mix of upper and lower case?'
    hints:
      - How do you compare letters ignoring case?
      - Convert every letter to lower case (tolower) and compare with "yes".
      - Loop over the t tests, reading one string each.
  - id: cf-1283A
    role: ladder
    card: multi-test
    rung: 3
    twist: Each test is a small time calculation.
    summary: For each of t tests, a time h:m (not midnight); minutes until the next midnight.
    hints:
      - How many minutes are there in a day?
      - 1440; the current time is 60h + m minutes after midnight.
      - Print 1440 − (60h + m) for each test.
  - id: cf-1335A
    role: ladder
    card: multi-test
    rung: 4
    twist: Each test is a counting formula with n up to 2·10^9.
    summary: "For each of t tests: in how many ways can n candies be split as a > b > 0 with a + b = n?"
    hints:
      - For a given b, what is a, and when is a > b?
      - a = n − b and a > b means b < n / 2, so b runs from 1 to ⌊(n − 1) / 2⌋.
      - Print (n − 1) / 2 for each test; n up to 2·10^9 needs long long (or unsigned) to be safe when reading.
  - id: cses-1068
    role: worked_example
    summary: From n ≤ 10^6, halve when even and replace by 3n + 1 when odd until 1; print every value.
  - id: ac-abc284_b
    role: worked_example
    summary: For each of T tests (T, N ≤ 100), count the odd numbers among N given.
  - id: ac-abc048_b
    role: worked_example
