    b_tool: "multiples-sieve (2.1): for each g, the GCD of all present multiples of g"
    flipping_difference: "A asks about contiguous subarrays of a short array, so extending each start with a running GCD is enough. B asks about any subsequences of 10^5 elements, which cannot be listed; but g is a GCD of some subsequence exactly when the GCD of all present multiples of g is g, a loop over multiples bounded by the values."
