# Patterns for topic 6.1 (Polynomial hashing). Provisional until the lesson maps them to Recognition Cards.
topic: "6.1"
patterns:
  - id: substring-compare
    name: Equal substrings in O(1)
    description: Compare any two substrings by their hashes after O(n) preparation.
    precondition: Polynomial hashes of prefixes give any substring's hash; collisions are rare with a large random base and modulus.
  - id: hash-length-search
    name: Hashing plus searching over length
    description: Longest common prefix of two suffixes, or the longest substring appearing twice, by searching over the length.
    precondition: '"A match of length L exists" is monotone in L, and each check is a hash comparison.'
  - id: palindrome-hash
    name: Palindromes by hashing
    description: Test whether substrings are palindromes by comparing forward and reverse hashes.
    precondition: A substring is a palindrome exactly when it equals its reverse.
  - id: distinct-by-hash
    name: Counting distinct substrings of a length
    description: Count or compare distinct substrings of a fixed length by storing their hashes.
    precondition: Equal substrings have equal hashes, and collisions are rare enough to ignore with good parameters.
