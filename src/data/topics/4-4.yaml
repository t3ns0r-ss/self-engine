drill:
- problem: lc-number-of-provinces
  answer:
    topic: '4.4'
    card: merge-groups
  property: 'Cities are only joined, and the question is the number of groups: unite every connected pair
    and count the leaders (Theorem 4.4.1). For this size a walk per group (topic 4.1) also works.'
  why_others_fail: The structure is simpler to write than a walk with a matrix; trying all subsets of
    cities is impossible.
- problem: lc-lexicographically-smallest-equivalent-string
  answer:
    topic: '4.4'
    card: merge-groups
  property: The equivalence classes of letters are the groups of a union where each pair is joined; the
    leader of each group is kept as the smallest letter of the group, and every letter of the base string
    is replaced by its leader (Theorem 4.4.1).
  why_others_fail: Replacing letters one pair at a time does not follow chains of equivalences, and a
    walk per letter repeats work that the structure keeps.
- problem: ac-abc293_d
  answer:
    topic: '4.4'
    card: merge-groups
  property: Ropes are vertices, ties are edges; a tie whose two ropes are already in one group closes
    a ring (Theorem 4.4.1(d)). Count the groups with a closing tie (rings) and the others (lines).
  why_others_fail: A walk with a parent test works too, but the union gives the closing tie directly when
    `unite` returns false.
- problem: lc-most-stones-removed-with-same-row-or-column
  answer:
    topic: '4.4'
    card: merge-groups
  property: Stones sharing a row or a column are in one group, and from every group all but one stone
    can be removed (in the right order), so the answer is stones minus groups; the groups come from uniting
    stones by rows and columns (Theorem 4.4.1).
  why_others_fail: Simulating removals in all orders is exponential; the number of groups gives the answer
    directly.
- problem: lc-graph-connectivity-with-threshold
  answer:
    topic: '4.4'
    card: merge-groups
  property: 'Only joining happens and queries ask whether two cities share a group: unite each divisor
    z > threshold with its multiples 2z, 3z, … (a harmonic number of steps) and answer by comparing leaders
    (Theorem 4.4.1).'
  why_others_fail: Testing all pairs of cities for a common divisor is 10^8 pairs times a gcd; uniting
    through divisors needs only about n log n calls.
- problem: lc-keys-and-rooms
  answer:
    topic: '4.1'
    card: components
  property: 'A key opens a room one way only: the question is the set reachable from room 0 along directed
    edges, a walk from the start (Theorem 4.1.1).'
  why_others_fail: The union treats every key as a two-way link and would say yes when a room can be reached
    only against the direction of the keys.
- problem: lc-number-of-enclaves
  answer:
    topic: '4.1'
    card: grid-graph
  property: The cells and the four-direction moves are a graph on a grid; start the walk from the land
    cells on the boundary, and count the land cells that were not reached (Theorem 4.1.5).
  why_others_fail: Uniting every land cell with its neighbours would work as well but the question asks
    about one special group (the boundary), which a single walk gives.
- problem: ac-abc208_d
  answer:
    topic: '4.3'
    card: every-pair
  property: 'The table after round k of the Floyd–Warshall algorithm is exactly the shortest distance
    with stop-overs among 1..k (Theorem 4.3.4): sum it after each round.'
  why_others_fail: A shortest-path search from every town for every k is 400 · 400 searches; the table
    gives all values in one pass of N³.
- problem: ac-abc311_c
  answer:
    topic: '4.2'
    card: directed-cycle
  property: 'One arrow out of every vertex: follow the arrows from a start with the vertex states until
    a vertex on the current route repeats (Theorem 4.2.4).'
  why_others_fail: The union cannot give the vertices of a cycle, and shortest paths measure costs the
    question does not ask for.
- problem: lc-find-minimum-time-to-reach-last-room-i
  answer:
    topic: '4.3'
    card: dijkstra
  property: 'The time to enter a room depends on the arrival time (wait if too early) and never gets smaller
    by arriving later: Dijkstra on the arrival times (Theorem 4.3.1).'
  why_others_fail: A walk by levels counts moves, not time with waiting, and a spanning tree has nothing
    to do with a trip between two rooms.
lookalike_pairs:
- a: cses-1676
  b: cses-1677
  a_tool:
    topic: '4.4'
    card: merge-groups
  b_tool:
    topic: '4.4'
    card: reverse-time
  shared_surface: Both have n computers and m connections, and print the number of groups (and more) after
    each step.
  flipping_difference: 'In A the roads appear one by one, so a disjoint set union answers each step as
    it comes. In B the connections break one by one; the structure cannot split, so the film is run backwards:
    start with the connections that never break and add the broken ones in reverse.'
  flipping_input: 'Computers 1, 2, 3 and the connections 1–2, 2–3. A: the roads appear in this order,
    so the number of groups is 2, then 1. B: the same two connections break in this order, so before any
    break there is 1 group, after the first break 2, after the second 3.'
- a: cses-1675
  b: ac-abc218_e
  a_tool:
    topic: '4.4'
    card: cheapest-connect
  b_tool:
    topic: '4.4'
    card: cheapest-connect
  shared_surface: Both give roads with costs and ask for the best set of roads in a connected network.
  flipping_difference: 'In A every road costs money and the cheapest set that connects everything is wanted:
    Kruskal buys a road only if it joins two groups. In B a road has a price C that can be negative, removing
    a road earns C, and the network must stay connected: a road with C ≤ 0 is never worth removing, so
    all of these are kept even when they close a loop; Kruskal runs on the positive roads on top of them,
    and the answer is the sum of the positive roads left out.'
  flipping_input: Three towns and the roads 1–2 (−1), 2–3 (−1), 1–3 (−1). A would keep two roads (total
    −2) and skip the third, which closes a loop. B keeps all three, because removing a road of price −1
    would lose 1 point, and the answer is 0.
self_test:
- q: Five vertices 0..4 and the calls unite(0, 1), unite(2, 3), unite(3, 4), unite(1, 4). Which calls
    return true, and what are the groups at the end?
  a: 'All four return true: the first three join separate groups, and the last joins {0, 1} with {2, 3,
    4}. One group of 5 remains; the number of true calls is n − c = 5 − 1 = 4, as Theorem 4.4.1(d) says.'
- q: The calls unite(0, 1), unite(1, 2), unite(2, 3), ... are made with n vertices. If a group always
    hung under the single new vertex, what depth would one find call have? What does union by size give?
  a: Hanging the big group under the new vertex builds a chain of depth n − 1, so one find takes n steps.
    With union by size the new vertex (size 1) goes under the leader of the big group, so every vertex
    has depth at most 1 here, and in general at most log2 n (step 4 of the proof).
- q: Edges are removed in the order {1,2}, {2,3}, {1,3} from a triangle. Using the reverse run, how many
    groups are there after 0, 1, 2 and 3 removals?
  a: '1, 1, 2, 3. Starting with no edges (3 groups, after 3 removals) the reverse run adds {1,3}: 2 groups
    (after 2 removals), adds {2,3}: 1 group (after 1 removal), adds {1,2}: the ends are in one group already,
    so it stays 1 (after 0 removals).'
- q: Three towns joined by the roads 1–2 (3), 2–3 (3), 1–3 (3). What does Kruskal's algorithm buy, and
    is the minimum spanning tree unique?
  a: 'It buys the first two roads in the order it sees them (the third closes a loop); the total is 6.
    The tree is not unique: any two of the three roads have weight 6, so there are three minimum spanning
    trees. The weight is the same for every order of ties.'
- q: Why does the cut property (Theorem 4.4.3) require that no edge of F crosses the cut? Give an example
    where it fails if one does.
  a: Take a triangle with all weights 1, F = {0–1, 1–2} (a minimum spanning tree) and the cut {0} | {1,
    2}. The edge 0–1 of F crosses the cut, and the lightest crossing edges are 0–1 and 0–2; adding 0–2
    to F closes a cycle, so F ∪ {0–2} is not inside any tree. The proof uses that the edge f it removes
    is not in F.
- q: Roads 1–2 (7), 2–3 (2), 1–3 (5), 3–4 (9). What is the smallest possible largest road on a trip from
    town 1 to town 4, and at which step of Kruskal's order do 1 and 4 meet?
  a: '9. In order: 2–3 (2), 1–3 (5) give the group {1, 2, 3}; 1–2 (7) is skipped; 3–4 (9) joins town 4,
    and now 1 and 4 are in one group (Theorem 4.4.6). Every trip to town 4 must use the road 3–4.'
- q: Roads 1–2 (4), 1–3 (5), 2–3 (1). What does Prim's algorithm from vertex 1 build and what is its weight?
    How can the tree of shortest paths from vertex 1 differ?
  a: 'Prim takes 1–2 (4), then the lightest edge leaving the tree, 2–3 (1): weight 5. Shortest paths from
    1: distance 4 to town 2, and town 3 at distance 5 either directly (1–3) or through town 2 (4 + 1);
    the tree of shortest paths may use 1–3, with weight 9. The shortest-path tree minimises distances,
    not the total weight.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - lc-checking-existence-of-edge-length-limited-paths
  - lc-remove-max-number-of-edges-to-keep-graph-fully-traversable
  - ac-abc380_e
decision_map:
- weak_signal: Links are added one at a time and the questions ask whether two items are connected, how
    big a group is, or how many groups there are; or "does this link close a loop?"
  choose: merge-groups
  when: Groups only merge and nothing is removed (Theorem 4.4.1); the answer is at the leader of the group.
  over:
  - card: components
    because: If all links are given first and nothing is asked in between, one walk gives the groups.
    topic: '4.1'
  - card: reverse-time
    because: If links are also removed, but all steps are known, run the steps backwards.
- weak_signal: Links or items are removed one by one in a known order, and after each removal asks the
    number of groups, the largest group or the pairs that are cut off.
  choose: reverse-time
  when: The whole order of removals is known (offline) and the questions are only about groups (Theorem
    4.4.2).
  over:
  - card: merge-groups
    because: If the steps only add links, the order of events can be used as it is.
  - card: components
    because: If the questions are about one fixed graph, a single walk is enough.
