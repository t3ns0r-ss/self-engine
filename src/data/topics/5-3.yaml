id: '5.3'
uses:
- topic: '0.2'
  what: 'Amortised total work: the contrast for operations that cannot be a tag'
- topic: '0.5'
  what: 'Brute force: the reference solution of every check'
- topic: '0.6'
  what: 'Standard containers: sets for the contrast problems'
- topic: '1.1'
  what: 'Sorting and coordinate compression: positions or values become ranks, items are sorted before
    a sweep'
- topic: '1.2'
  what: 'Prefix sums: the tool when nothing changes'
- topic: '1.3'
  what: 'Two pointers: the contrast for a window that can shrink, and the sweep of the contrast problems'
- topic: '1.4'
  what: 'Binary search: the contrast for an answer found by search on a fixed array'
- topic: '1.7'
  what: 'Bit operations: masks of letters and flips per bit'
- topic: '2.1'
  what: 'Divisors and GCD: the join of a GCD tree'
- topic: '3.2'
  what: 'Dynamic programming over one index: the linear pass for the best subarray of a fixed array'
- topic: '5.1'
  what: 'Sparse table: the tool for minimums and maximums when nothing changes'
- topic: '5.2'
  what: 'Fenwick tree: the shorter tool for sums with changes, and the sweep for counts'
theorems:
- id: 5.3.1
  title: The tree and the range query
  plain_words: 'Cut the range into halves again and again until the pieces are single positions. A question
    about $l..r$ goes down from the root: a piece fully inside the question is taken whole, a piece outside
    is ignored, and a piece that sticks out is opened. Only the pieces at the two edges of the question
    can stick out, so about two pieces per level are opened and the question touches about $4 \log_2 n$
    pieces.'
  code: 5.3/thm-1
- id: 5.3.2
  title: A change touches one path
  plain_words: A node's value depends only on the positions in its range. A change at position $i$ therefore
    affects only the nodes whose range contains $i$, and these form one line from the root down to the
    leaf of $i$. Fix that line from the bottom to the top.
  code: 5.3/thm-2
- id: 5.3.3
  title: Adding to a range with lazy tags
  plain_words: A piece that is entirely inside an update does not pass the update down. It just updates
    its own sum, as if it had added $x$ to each of its positions, and writes a note "$x$ for everything
    below". Any later visit that wants to look *inside* this piece first gives the note to the two halves.
    So a note travels down only when it is needed.
  code: 5.3/thm-3
- id: 5.3.4
  title: 'Tags that combine: add, assign, multiply'
  plain_words: 'A note can be "add 5" or "set to 7" or "multiply by 3". Two notes in a row are the same
    as one note of the same kind, so a node only ever needs to keep one note. The order is important:
    "add 2, then multiply by 3" is not "multiply by 3, then add 2".'
  code: 5.3/thm-4
- id: 5.3.5
  title: Walking down the tree to find a position
  plain_words: The root knows the biggest number in the whole array. If the left half contains a big enough
    number, the first big enough number is in the left half, because everything in the left half comes
    before everything in the right half. If it does not, look in the right half. One step down per level,
    and no search through the positions.
  code: 5.3/thm-5
- id: 5.3.6
  title: A node with more than one number
  plain_words: To know the best stretch of a joined range, a node must remember more than its own best.
    The best stretch of two parts is either inside the left part, inside the right part, or crosses the
    border, in which case it is the best ending of the left part glued to the best beginning of the right
    part. And to be able to say these things about the next join, the new node must also know its own
    best beginning and ending.
  code: 5.3/thm-6
cards:
- id: point-update-range-query
  name: Changing values and asking range minimum, maximum or GCD (segment tree)
  from_theorem: 5.3.2
  decisive_property: Single values are replaced between the questions, and a question asks for a combination
    of a range that cannot be taken back (minimum, maximum, GCD, product modulo a number, a bit operation),
    but whose value for a range is the combination of the values for its two halves.
  how_to_test: Check that there are changes between the questions (otherwise a table is enough) and that
    the combination of two halves is the combination of the whole (associative), but a sum with an inverse
    would be better done by the Fenwick tree. Then store the value of every piece of a halving of the
    array.
  constraint_shapes:
  - 'n = q = 2·10^5 with changes: a scan per question is up to 4·10^10 steps (about 400 seconds); one
    tree operation is at most 4 · 18 = 72 steps, about 1.4·10^7 in all'
  - 'Total n of 5·10^5 over many tests: build the tree for each test in O(n); do not reallocate arrays
    of the maximum size for every test'
  weak_signals:
  - form: Asks for the minimum, maximum or GCD of a range after single values were replaced
    shape: n, q up to 2·10^5, operations of two kinds mixed in the input
  - form: Asks, after each change, a property of the whole array that is the combination of the properties
      of its parts (the largest value, the number of values below a bound that is fixed)
    shape: n up to 2·10^5, the answer printed after every change
  - form: Repeatedly replaces an element by a combination of its neighbours or by a value that depends
      on its position, and then asks for a total
    shape: n, q up to 2·10^5, each change affects one position
  kill_signals:
  - 'The combination of the halves does not give the answer for the whole: the number of different values
    in [1, 2, 1, 2] is 2, but the halves [1, 2] and [1, 2] have 2 each, and adding gives 4'
  - 'The only changes are additions to single values and the questions ask sums: the Fenwick tree is shorter
    and about three times faster'
  in_action:
    statement: 'A shop has the price of each of n products. There are q operations: "set the price of
      product k to x" and "the lowest price among products a to b".'
    constraints: n, q ≤ 2·10^5, prices up to 10^9.
    budget: 'Scanning the range for each question: up to n · q = 4·10^10 steps, about 400 seconds. Need
      about O(log n) per operation.'
    candidates:
    - tool: Sparse table (topic 5.1)
      verdict: rejected
      because: 'It needs a fixed array: one change would have to rebuild n log n entries.'
    - tool: Fenwick tree (topic 5.2)
      verdict: rejected
      because: It answers a range from two prefixes, and a minimum cannot be subtracted.
    - tool: Segment tree (this topic)
      verdict: chosen
      because: A change recomputes one path of at most 18 nodes (Theorem 5.3.2) and a question combines
        at most 36 whole nodes (Theorem 5.3.1).
    property_check: There are changes between questions, the minimum of a range is the minimum of the
      minimums of its halves, and it cannot be taken back. The property holds.
    decision: Segment tree of minimums; set a leaf and recompute the path above it; combine the whole
      nodes of a question.
  examples:
    positive:
    - inline:
        input: a = [5, 2, 7, 3]. Set a_2 to 9, then ask the minimum of positions 1 to 3.
        answer: '5'
        why: Changes and range minimums are mixed. After the change the range holds 5, 9, 7. The tree
          recomputes the path of the leaf of position 2 and combines two whole nodes for the question.
    - inline:
        input: a = [12, 18, 8, 6]. Set a_3 to 9, then ask the GCD of positions 2 to 4.
        answer: '3'
        why: The GCD of two halves is the GCD of the whole, and it cannot be taken back. After the change
          the range holds 18, 9, 6 and the GCD is 3.
    - worked_example: cses-1649
      why: 'Replace single values and ask the minimum of a range, for arrays of up to 2·10^5 numbers:
        a segment tree of minimums.'
    negative:
    - inline:
        input: a = [3, 7, 2, 9]. How many values in positions 1 to 4 are smaller than 5, if each node
          keeps the minimum of its range and the answer is 1 when the minimum of the range is below 5?
        answer: '2'
        method_gives: '1'
        why: The minimum below 5 only says that at least one value is below 5. The count of values below
          a bound is not the combination of the minimums of the halves. A sweep with sorted questions
          and a Fenwick tree counts it.
      correct_tool:
        topic: '5.2'
        card: offline-sweep-count
    - problem: cses-1648
      why: The questions ask for sums, and a sum can be taken back by subtracting; the Fenwick tree is
        shorter and faster.
      correct_tool:
        topic: '5.2'
        card: updates-and-range-sums
  lookalikes:
  - description: Minimum of a range of an array that never changes
    tool:
      topic: '5.1'
      card: idempotent-range-query
    flipping_difference: Without changes the table answers in O(1) after one build; the segment tree is
      for arrays that change.
  - description: Sums of a range with single changes
    tool:
      topic: '5.2'
      card: updates-and-range-sums
    flipping_difference: A sum can be taken back, so two prefixes give a range and the tree is shorter
      than the segment tree.
  complexity: O(n) to build, O(log n) per change and per query, O(n) memory (4n entries).
- id: lazy-range-update
  name: Adding to or setting a whole range, then asking range sums or minimums (lazy propagation)
  from_theorem: 5.3.3
  decisive_property: An operation changes every value of a range in the same way (adds a number, sets
    to a number, multiplies), the questions ask a combination of a range (sum, minimum, maximum), and
    the effect of the operation on the combination of a node is known from the node value and its length.
  how_to_test: 'Write what happens to the stored value of a node that lies fully inside the range: the
    new sum, or the new minimum. If that needs only the old value, the length and the operation, the operation
    can be a tag. Check that two operations in a row can be merged into one tag, and in which order.'
  constraint_shapes:
  - 'n = q = 2·10^5 with range changes: changing each value is up to 4·10^10 steps; a lazy tree makes
    each operation at most about 4 · 18 = 72 visits with a push at each'
  - 'Operations of three kinds (add, assign, sum) mixed: the tag must be able to hold an assignment followed
    by an addition'
  weak_signals:
  - form: Adds a number to every element of a range many times and asks the sum or the minimum of other
      ranges between the additions
    shape: n, q up to 2·10^5, both kinds of operations mixed
  - form: Sets every element of a range to a number and asks for sums or the number of elements of some
      kind
    shape: n, q up to 2·10^5 with three kinds of operations
  - form: Switches (flips) all the elements of a range and asks how many are on
    shape: n, q up to 2·10^5, a node keeps a count that turns into its length minus itself
  kill_signals:
  - 'The operation does not act on a node in one step: replacing each value by its square root changes
    the sum of [4, 9] from 13 to 5, but the root of the sum is 3'
  - 'Only single reads follow range additions: a Fenwick tree over the differences is shorter (topic 5.2)'
  in_action:
    statement: 'A row of n lamps has brightness values. There are q operations: "add d to the brightness
      of lamps l to r" and "what is the total brightness of lamps l to r?".'
    constraints: n, q ≤ 2·10^5, d up to 10^9.
    budget: 'Adding to each lamp of the range: up to n · q = 4·10^10 steps. Need about O(log n) per operation.'
    candidates:
    - tool: Fenwick tree over differences (topic 5.2)
      verdict: rejected
      because: It reads one value after range additions, but the sum of a range after range additions
        needs more than one tree.
    - tool: A segment tree with point updates (this topic, Theorem 5.3.2)
      verdict: rejected
      because: 'A range addition would touch every leaf: n steps.'
    - tool: Segment tree with lazy tags (this topic)
      verdict: chosen
      because: A whole node inside the range takes the addition at once and keeps a tag for its children
        (Theorem 5.3.3).
    property_check: Adding d to a node of length len adds d · len to its sum, and two additions merge
      by adding the numbers. The property holds.
    decision: Lazy tree of sums with a tag for pending additions; push before opening a node.
  examples:
    positive:
    - inline:
        input: a = [3, 1, 4, 1, 5]. Add 10 to positions 2 to 4, then ask the sum of positions 3 to 5.
        answer: '30'
        why: After the addition the array is [3, 11, 14, 11, 5]. The tree gives the added 10 to a whole
          node and a tag; the question pushes the tag down only where it needs to look inside.
    - inline:
        input: a = [2, 2, 2, 2]. Set positions 2 to 3 to 7, then ask the sum of all positions.
        answer: '18'
        why: An assignment of a node of length len gives the sum 7 · len, and a tag that says "assigned
          7". The array is [2, 7, 7, 2] and the sum is 18.
    - worked_example: cf-52C
      why: 'Add a number to a circular range and ask the minimum of a circular range, for up to 2·10^5
        numbers: a lazy tree of minimums, with a range that wraps split in two.'
    negative:
    - inline:
        input: a = [4, 9]. Replace every value of positions 1 to 2 by its integer square root and ask
          the sum. What is it?
        answer: '5'
        method_gives: '3'
        why: The values become 2 and 3, sum 5. A tag that applies the square root to the stored sum gives
          the root of 13, which is 3. The operation has no effect on a node that is known from the sum
          and the length. Every value can be rooted at most 6 times before it is 1, so doing it value
          by value costs little in total.
      correct_tool:
        topic: '0.2'
        card: amortised-total
    - problem: cses-1651
      why: Range additions are followed only by reads of single values, so a Fenwick tree over the differences
        does everything with a short code.
      correct_tool:
        topic: '5.2'
        card: updates-and-range-sums
  lookalikes:
  - description: Adding to ranges and printing the whole array at the end
    tool:
      topic: '1.2'
      card: difference-array
    flipping_difference: If every read comes after every addition, one pass over a difference array is
      enough; the tree is for reads between the additions.
  - description: Changing single values and asking range minimums
    tool:
      topic: '5.3'
      card: point-update-range-query
    flipping_difference: 'With single changes no tag is needed: a change recomputes one path.'
  complexity: O(n) to build, O(log n) per operation, O(n) memory (4n entries for sums and for tags).
- id: custom-node
  name: A node that stores several numbers (best subarray, matched brackets, smallest value and its count)
  from_theorem: 5.3.6
  decisive_property: The answer for a range is not one number that combines directly, but it can be computed
    from a small fixed set of numbers kept for each range, and the set for a joined range is computed
    from the sets of its two parts.
  how_to_test: Ask what the answer for the joined range needs from each part. If the answer is decided
    by a few facts about each part (the best prefix, the best suffix, the total) and those facts for the
    joined range also come from the same facts of the parts, the node is that set of facts. Check that
    the join is not commutative when the order of the positions matters.
  constraint_shapes:
  - 'n = q = 2·10^5 with changes: recomputing the best subarray from scratch is up to 4·10^10 steps; one
    tree operation combines at most about 36 nodes of four numbers'
  - 'Several tests with total n ≤ 5·10^5: build the tree per test in O(n)'
  weak_signals:
  - form: Asks for the best sum of a subarray or the longest stretch with some property, after single
      changes, for the whole array or for a range
    shape: n, q up to 2·10^5, the answer is printed after each change
  - form: Asks for the longest balanced bracket sequence or the number of matched pairs inside a range
    shape: n up to 10^6, a string of brackets and ranges
  - form: Asks for the smallest value of a range together with how many times it occurs, or the second
      largest
    shape: n, q up to 2·10^5, node needs a pair or a triple of numbers
  kill_signals:
  - 'The set of facts grows with the range: the number of different values of [1, 2, 1, 2] is 2 and the
    halves give 2 and 2, so no fixed set of numbers per node can join them'
  - 'The node joins in a way that needs the elements themselves (median, k-th): a different structure
    is needed'
  in_action:
    statement: 'An array of n numbers can change: "set a_k to x". After each change print the largest
      sum of a subarray (it may be empty, sum 0).'
    constraints: n, q ≤ 2·10^5, values up to 10^9 in absolute value.
    budget: 'Recomputing the best subarray after each change: O(n) per change, 4·10^10 steps. Need about
      O(log n) per change.'
    candidates:
    - tool: Kadane after each change (topic 3.2, linear)
      verdict: rejected
      because: 'O(n) per change: 4·10^10 steps.'
    - tool: Segment tree of sums (this topic, Theorem 5.3.1)
      verdict: rejected
      because: A node with only the sum cannot say where the best stretch is.
    - tool: Segment tree with a node of four numbers (this topic)
      verdict: chosen
      because: The best subarray of a joined range is inside a part or crosses the border, and the node
        (sum, prefix, suffix, best) joins in O(1) (Theorem 5.3.6).
    property_check: The four numbers of a joined range are computed from the four numbers of the parts.
      The property holds.
    decision: Tree of four numbers per node; after each change recompute the path and print the best of
      the root.
  examples:
    positive:
    - inline:
        input: a = [-1, 2, 3, -4, 5, -2]. What is the best sum of a non-empty subarray of positions 2
          to 5 (counting from 1)?
        answer: '6'
        why: The range holds 2, 3, -4, 5. The best stretch is the whole range, 2 + 3 - 4 + 5 = 6. The
          node of a joined range keeps sum, prefix, suffix and best, so the answer comes from two nodes.
    - inline:
        input: a = [4, -10, 3, -1, 3]. What is the best sum of a non-empty subarray of positions 2 to
          5 (counting from 1)?
        answer: '5'
        why: The range holds -10, 3, -1, 3; the best stretch is 3, -1, 3 = 5. It crosses the border of
          two nodes, as the suffix of one and the prefix of the other.
    - worked_example: cses-1190
      why: 'The largest sum of a subarray after each of up to 2·10^5 changes: the node keeps the sum,
        the best prefix, the best suffix and the best subarray.'
    negative:
    - inline:
        input: a = [1, 2, 1, 2]. How many different values are in positions 1 to 4, if each node keeps
          the number of different values of its range and two nodes are joined by adding their numbers?
        answer: '2'
        method_gives: '4'
        why: The halves [1, 2] and [1, 2] have 2 different values each, and 2 + 2 = 4. The whole range
          has 2. The number of different values cannot be computed from the two numbers alone, because
          the same value can be in both halves. A sweep with sorted questions and a Fenwick tree counts
          them.
      correct_tool:
        topic: '5.2'
        card: offline-sweep-count
    - problem: cses-1749
      why: Finding the element at place k of a shrinking list needs only counts, and the descent on a
        Fenwick tree does it with a short code.
      correct_tool:
        topic: '5.2'
        card: kth-present
  lookalikes:
  - description: Largest sum of a subarray of a fixed array
    tool:
      topic: '3.2'
      card: linear-state
    flipping_difference: For one array without changes, one pass of Kadane gives the answer in O(n).
  - description: Minimum of a range with single changes
    tool:
      topic: '5.3'
      card: point-update-range-query
    flipping_difference: The minimum is one number that joins directly; a node of several numbers is needed
      only when the answer depends on more than one fact about each part.
  complexity: O(n) to build, O(log n) per change or query (each join is O(1)), O(n) memory.
- id: tree-descent
  name: The first position that fits (walking down the tree)
  from_theorem: 5.3.5
  decisive_property: The question asks for the first (or last) position where a value reaches a bound,
    where the values change by single updates or range updates between the questions, and the value of
    a node tells whether such a position exists inside it (maximum for "at least", minimum for "at most").
  how_to_test: Write the condition as "some value in this range is at least x". If a node can answer that
    from its stored value, the walk from the root goes left whenever the left child can answer yes. Check
    that after the answer the structure must change (a value is reduced, a position is removed), which
    a binary search over prefix queries would make as slow as the sum.
  constraint_shapes:
  - 'n = q = 2·10^5 with changes: a scan to the first fitting position is up to 4·10^10 steps; a binary
    search with a range query at each step is 18 · 72 steps; a descent is 18 steps'
  - 'The answer position changes the array (a room is used up): each question is followed by a point update,
    O(log n)'
  weak_signals:
  - form: Finds the first position (room, seat, slot) where the value is at least a given number, and
      then reduces it
    shape: n, q up to 2·10^5, each request depends on the changes made by the earlier ones
  - form: Finds the first or last element after position l that is greater than a given number, with changes
      between questions
    shape: n, q up to 2·10^5, changing values
  - form: Finds the smallest value not present or the smallest index with a count of zero in a changing
      set
    shape: values up to 10^6 and n, q up to 2·10^5
  kill_signals:
  - 'The condition is equality, which a maximum cannot decide: for a = [3, 1, 5] and the value 4, the
    maximum of the array is 5 ≥ 4 but no value is 4'
  - 'The array does not change: a sparse table with a binary search (topic 5.1) or an offline sort is
    enough'
  in_action:
    statement: A hotel has n rooms, each with a number of free beds. q groups arrive; each wants the first
      room with at least g free beds; it takes that room, and its free beds drop by g. Print the room
      for each group, or 0 if none.
    constraints: n, q ≤ 2·10^5, free beds up to 10^9.
    budget: 'Scanning the rooms for each group: up to n · q = 4·10^10 steps. Need about O(log n) per group.'
    candidates:
    - tool: Sparse table of maximums and binary search (topic 5.1)
      verdict: rejected
      because: The free beds change after each group, so the table would have to be rebuilt.
    - tool: Ordered set of free beds (topic 0.6)
      verdict: rejected
      because: It finds the nearest value, but the first room by position is needed, not the first by
        size.
    - tool: Segment tree of maximums with a descent (this topic)
      verdict: chosen
      because: The walk down finds the first room with enough beds in at most 18 steps (Theorem 5.3.5),
        and the room is updated by a path recomputation (Theorem 5.3.2).
    property_check: The condition is "at least g", a maximum answers it for every node, and the array
      changes after each answer. The property holds.
    decision: Tree of maximums; if the root is below g print 0; otherwise descend, print the room, subtract
      g and recompute the path.
  examples:
    positive:
    - inline:
        input: 'Free beds per room: [3, 1, 4, 1, 5, 9, 2, 6]. Which room (counting from 0) is the first
          with at least 5 free beds?'
        answer: '4'
        why: The root maximum 9 is at least 5. The left half has maximum 4, which is less than 5, so the
          answer is in the right half; there the left quarter has maximum 9, and then the first of its
          two leaves has 5.
    - inline:
        input: 'Free beds: [3, 1, 4, 1, 5, 9, 2, 6]. After room 2 is set to 0, which room is the first
          with at least 4 free beds?'
        answer: '4'
        why: The change recomputes the path of room 2. The left half now has maximum 3, so the walk goes
          right, and finds room 4.
    negative:
    - inline:
        input: a = [3, 1, 5]. Which position (counting from 0) is the first with value exactly 4, or -1
          if none, if the walk goes left whenever the left child has a maximum of at least 4?
        answer: '-1'
        method_gives: '2'
        why: The maximum is 5, which is at least 4, so the walk ends at the value 5 and calls it the answer.
          A maximum only answers "at least". Finding an exact value is a membership question for a set.
      correct_tool:
        topic: '0.6'
        card: set-membership
    - problem: cses-1749
      why: The question is about counts of present places, a sum with a prefix that reaches k; the descent
        on a Fenwick tree does this with less code.
      correct_tool:
        topic: '5.2'
        card: kth-present
  lookalikes:
  - description: The k-th present element of a changing list
    tool:
      topic: '5.2'
      card: kth-present
    flipping_difference: There the node value is a count and the descent compares the prefix with k; the
      Fenwick tree does it with a shorter code.
  - description: The first element at least x in a fixed array
    tool:
      topic: '5.1'
      card: monotone-range-search
    flipping_difference: For a fixed array a table and a binary search find it without any tree.
  complexity: O(log n) per descent and per update.
problems:
- id: cses-1649
  role: worked_example
  summary: 'An array of n ≤ 2·10^5 numbers and q ≤ 2·10^5 operations: set a_k to u, or print the smallest
    number in positions a to b.'
- id: cf-52C
  role: worked_example
  summary: 'A circle of n ≤ 2·10^5 numbers and m ≤ 2·10^5 operations: add v to a circular range, or print
    the smallest number on a circular range.'
- id: cses-1190
  role: worked_example
  summary: An array of n ≤ 2·10^5 numbers and m ≤ 2·10^5 changes "set a_k to x"; after each change print
    the largest sum of a subarray (the empty subarray is allowed).
- id: ac-abc309_f
  role: ladder
  card: point-update-range-query
  rung: 1
  twist: 'Base case with the tree as a helper: sort first, then answer by a range minimum over a changing
    array.'
  summary: N ≤ 2·10^5 boxes with three sides each (rotation allowed); is there a box that fits strictly
    inside another?
  hints:
  - Sort the sides of every box so that rotation does not matter. Then box i fits inside box j when every
    side of i is smaller than the same side of j.
  - Sort the boxes by the smallest side and process them in groups of equal smallest side. For each box,
    ask whether an already inserted box (with a strictly smaller first side) has a smaller second side
    and a smaller third side.
  - Keep a tree over the compressed second sides that stores the smallest third side among the inserted
    boxes; query the prefix of strictly smaller second sides. Insert a whole group only after the group
    has been queried.
- id: ac-abc283_f
  role: ladder
  card: point-update-range-query
  rung: 2
  twist: The value in the tree is a combination of position and value, and each query is split in two
    halves.
  summary: A permutation P of 1..N (N ≤ 2·10^5); for every i print the smallest value of |P_i − P_j| +
    |i − j| over j ≠ i.
  hints:
  - 'Remove the absolute values: for j before i and P_j below P_i the distance is (P_i + i) − (P_j + j),
    and the other three cases are similar.'
  - Process the positions in order, with two trees over the values of P that hold the best P_j + j and
    P_j − j among the positions already seen; query the part of the values below P_i and the part above.
  - Do the same again from the right (or process the positions from the end) for the positions after i.
    The answer is the smallest of the four candidates.
- id: ac-abc285_f
  role: ladder
  card: point-update-range-query
  rung: 3
  twist: The tree answers a yes/no question by keeping counts that can be compared with a formula.
  summary: 'A string S of length N ≤ 2·10^5 and Q ≤ 2·10^5 operations: change one character, or ask whether
    the substring l..r is a substring of the sorted version of the whole string.'
  hints:
  - A substring of a sorted string is non-decreasing, and for the letters strictly between its smallest
    and largest letter it must contain all the copies that exist in S.
  - Keep, for each of the 26 letters, a tree of counts over the positions (or one count per letter in
    a Fenwick tree), and a tree that counts the positions where S_i > S_{i+1}.
  - Answer yes when no descent lies inside l..r and, for every letter strictly between the first and the
