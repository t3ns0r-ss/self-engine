drill:
- problem: ac-abc248_d
  answer:
    topic: '1.4'
    card: sorted-search
  property: For each value X keep the sorted list of its positions; the answer is the number of positions
    in [L, R], a difference of two bounds in that list.
  why_others_fail: A 2D table of prefix counts per value needs N² memory; scanning each query is too slow.
- problem: ac-abc353_c
  answer:
    topic: '1.4'
    card: sorted-search
  property: Without the mod the sum is (N − 1)·ΣA; each pair with A_i + A_j ≥ 10^8 loses 10^8 once. After
    sorting, the partners j > i with A_j ≥ 10^8 − A_i form a suffix found by a lower bound.
  why_others_fail: All pairs are 4.5·10^10; the mod makes a pure formula impossible without counting the
    overflowing pairs.
- problem: lc-find-minimum-in-rotated-sorted-array
  answer:
    topic: '1.4'
    card: sorted-search
  property: '"nums[i] ≤ nums[n − 1]" is false on the first block and true on the second, so the minimum
    is its first true index.'
  why_others_fail: A linear scan is O(n), and the statement asks for O(log n); sorting would also lose
    the point.
- problem: lc-capacity-to-ship-packages-within-d-days
  answer:
    topic: '1.4'
    card: answer-search
  property: A capacity c works iff loading each day greedily needs at most D days (Lemma 1.4.4); larger
    capacities work too, so search the smallest c.
  why_others_fail: The order is fixed, so sorting does not apply; trying every capacity up to the total
    weight is too slow.
- problem: lc-minimum-number-of-days-to-make-m-bouquets
  answer:
    topic: '1.4'
    card: answer-search
  property: By day d, a scan counts runs of bloomed flowers and the bouquets they give; later days only
    add bloomed flowers, so "m bouquets by day d" is monotone.
  why_others_fail: Simulating every day up to 10^9 is too slow; the adjacency condition rules out sorting.
- problem: lc-kth-smallest-element-in-a-sorted-matrix
  answer:
    topic: '1.4'
    card: kth-by-counting
  property: count(x) of entries ≤ x takes one staircase walk or n bounds; the k-th smallest is the first
    x with count(x) ≥ k.
  why_others_fail: Copying and sorting all n² entries breaks the memory limit the statement sets; a heap
    works but costs k log n.
- problem: cf-1538C
  answer:
    topic: '1.4'
    card: sorted-search
  property: Order-free, so sort; for each i the partners j > i with l − a_i ≤ a_j ≤ r − a_i form a range
    found by two bounds.
  why_others_fail: All pairs are 2·10^10; a map of counts answers equality, not a range of values.
- problem: ac-abc341_d
  answer:
    topic: '1.4'
    card: kth-by-counting
  property: The numbers up to x divisible by exactly one of N, M number x/N + x/M − 2·x/lcm(N, M), non-decreasing
    in x; the K-th is the first x where the count reaches K.
  why_others_fail: Listing the numbers one by one takes up to K = 10^10 steps.
- problem: ac-abc267_c
  answer:
    topic: '1.2'
    card: range-sum
  property: 'Moving the part one step right changes the weighted sum by −(sum of the old part) + M·(new
    element), and the sum of a part is a range sum: O(N) with prefix sums.'
  why_others_fail: Nothing here is monotone in a searchable way; it is an update of a running value with
    range sums.
- problem: ac-abc339_c
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: The start count must be at least −(smallest prefix sum) and at least 0; the answer is that
    start plus the total.
  why_others_fail: Searching over the start value works but is unnecessary; the bound is a prefix minimum
    read off in one pass.
- problem: lc-product-of-array-except-self
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: The product of everything except i is (product of the prefix before i) × (product of the suffix
    after i), both built in one pass each.
  why_others_fail: Division is forbidden (and fails with zeros); there is nothing to search.
lookalike_pairs:
- a: lc-search-a-2d-matrix
  b: lc-search-a-2d-matrix-ii
  a_tool:
    topic: '1.4'
    card: sorted-search
  b_tool:
    topic: '1.3'
    card: opposite-ends
  flipping_difference: In A each row starts above the previous row's end, so the matrix read row by row
    is one sorted list; in B only rows and columns are sorted, so no middle element splits the candidates.
  shared_surface: Both search a matrix of integers for a target value.
  flipping_input: The matrix [[1, 3, 5], [2, 4, 6]] has sorted rows and columns (B), but read row by row
    it is 1 3 5 2 4 6, not one sorted list, so a single binary search over positions fails; in A the second
    row would start above 5, as in [[1, 3, 5], [7, 9, 11]].
- a: lc-find-k-pairs-with-smallest-sums
  b: lc-kth-smallest-number-in-multiplication-table
  a_tool:
    topic: '0.6'
    card: heap-extract
  b_tool:
    topic: '1.4'
    card: kth-by-counting
  flipping_difference: A needs only k ≤ 10^4 items, which a priority queue lists in order; B's k can be
    9·10^8, so the k-th must be found by counting.
  shared_surface: Both ask for the smallest values among sums or products of pairs.
  flipping_input: With k = 3 and the sorted arrays [1, 7, 11] and [2, 4, 6] (A), a priority queue lists
    the three smallest pair sums 3, 5, 7; with k = 9·10^8 on a 3·10^4 × 3·10^4 table (B) listing is impossible
    and the k-th value is found by counting.
self_test:
- q: In First Bad Version, n can be 2^31 − 1. What goes wrong with mid = (lo + hi) / 2 in int, and what
    is the fix?
  a: lo + hi can exceed 2^31 − 1 (for example lo = 2·10^9, hi = 2^31 − 1) and overflows to a negative
    number, so mid is negative. lo + (hi − lo) / 2 never exceeds hi, so it cannot overflow.
- q: The template starts with lo = −1 and hi = n. Why does it never read a[−1] or a[n]?
  a: It only reads a[mid], and while hi − lo ≥ 2, mid = lo + (hi − lo) / 2 is strictly between lo and
    hi, so 0 ≤ mid ≤ n − 1. The two outside positions are part of the invariant by agreement but are never
    tested.
- q: On the array (5, 3, 8), is p(i) = (a_i ≥ 4) monotone? What can binary search return for "the first
    index with a_i ≥ 4" and "the first index with a_i ≥ 6"?
  a: 'p is true, false, true: not monotone. For x = 6 the search tests index 1 (3, false), then index
    2 (8, true) and returns 2, which is right by luck; for x = 4 it tests index 1 (false) and returns
    2, but the correct answer is 0. Sort first, or prove monotonicity.'
- q: For "maximise the smallest gap d when choosing m positions", in which direction is ok(d) monotone,
    and what are safe starting values for lo and hi?
  a: 'If d works, every smaller d works: ok is true, …, true, false, …. Keep ok(lo) true and ok(hi) false:
    lo = 0 (always possible) and hi = span + 1 (impossible); the answer is lo.'
- q: Why can "while (hi − lo > 1e-9)" loop forever for answers near 10^9 with double, while 100 fixed
    iterations cannot?
  a: 'Neighbouring doubles near 10^9 are about 1.2·10^-7 apart, so the gap can never drop below 1e-9:
    once hi and lo are neighbours, mid equals one of them and nothing changes. A fixed count of 100 halvings
    always ends, and leaves the interval as narrow as the type allows.'
- q: S = {1, 2, 2, 3} and k = 2. Why is the k-th smallest the smallest x with count(x) ≥ k, and not an
    x with count(x) = k?
  a: 'count(1) = 1 and count(2) = 3: no x has count exactly 2. The 2nd smallest is 2, the first x where
    the count reaches at least 2 (Theorem 1.4.6).'
- q: In (1, 3, 5, 5, 8), compute the lower and upper bounds of 5 and of 4, and the number of elements
    in [4, 5].
  a: lower(5) = 2, upper(5) = 4, lower(4) = 2, upper(4) = 2. The elements in [4, 5] number upper(5) −
    lower(4) = 4 − 2 = 2 (the two 5s).
