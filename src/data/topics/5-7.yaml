drill:
- problem: cf-1879D
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: 'The XOR of a subarray is two prefix values; each bit is counted on its own: for each bit
    keep the count and the sum of the indices of the prefixes with the digit 0 and with 1, and add 2^bit
    times the sum of distances to prefixes with the other digit.'
  why_others_fail: A trie finds the best partner; here the sum over all pairs separates by bit and no
    tree is needed.
- problem: lc-find-kth-largest-xor-coordinate-value
  answer:
    topic: '1.2'
    card: prefix-2d
  property: A two-dimensional prefix XOR gives the value of every cell in O(1) from its neighbours; then
    the k-th largest of 10^6 values is found by sorting or selection.
  why_others_fail: The values are fixed and listed, and the question is an order statistic, not a best
    XOR with a changing set.
- problem: cf-1322B
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: Each digit of the answer is the parity of the number of pairs whose sum has that digit; for
    one digit, sort the sums reduced modulo 2^(digit + 1) and count pairs with two pointers.
  why_others_fail: The sums are not XORs, so a binary trie of the numbers does not decide them; the question
    separates by digit and a sort.
- problem: cf-1851F
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: The pair with the smallest XOR is a neighbour in sorted order, so one pass over neighbours
    finds the pair; the best x then comes from the digits where the pair agrees.
  why_others_fail: One pair is needed, not a changing set, so sorting finds it without a tree.
- problem: lc-minimum-number-of-operations-to-make-array-xor-equal-to-k
  answer:
    topic: '1.7'
    card: xor-identities
  property: The XOR of all elements XOR k has a 1 exactly at the digits that must be flipped; the answer
    is the number of ones.
  why_others_fail: There is no set to search and no second number to choose; the XOR of the whole array
    is one number.
- problem: lc-find-the-xor-of-numbers-which-appear-twice
  answer:
    topic: '0.6'
    card: map-counting
  property: Count each number in a set or a map and XOR those that were seen twice; at most 50 numbers.
  why_others_fail: XOR appears only as the last step; nothing is asked about a best partner.
- problem: cf-979D
  answer:
    topic: '5.7'
    card: binary-xor
  property: A binary trie for each divisor, with the smallest number on every node; a query walks by the
    digits and skips nodes whose smallest number is too big.
  why_others_fail: A scan of the set costs its size per query, up to 10^5 · 10^5 steps.
- problem: cf-1980G
  answer:
    topic: '5.7'
    card: binary-xor
  property: The value of a cycle is the XOR of the root values of two vertices (and an edge); a binary
    trie of the root values answers the largest XOR with a stored value, one trie for each parity of the
    depth.
  why_others_fail: Trying every other vertex for every query costs n steps per query, 4·10^10 in all.
lookalike_pairs:
- a: lc-maximum-strong-pair-xor-ii
  b: lc-maximum-strong-pair-xor-i
  a_tool:
    topic: '5.7'
    card: binary-xor
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both ask for the largest XOR among pairs (x, y) with |x − y| ≤ min(x, y).
  flipping_difference: 'In version I there are at most 50 numbers, so all pairs (2500) are tested directly.
    In version II there are up to 5·10^4 numbers: sort them, slide a window of numbers that can pair with
    y (those between y / 2 and y) and keep the window in a binary trie with counts.'
  flipping_input: '5·10^4 numbers: all pairs would be 1.25·10^9 tests, while the window and the trie need
    about 5·10^4 · 20 = 10^6 steps.'
- a: cf-2093G
  b: lc-find-maximum-balanced-xor-subarray-length
  a_tool:
    topic: '5.7'
    card: binary-xor
  b_tool:
    topic: '1.7'
    card: prefix-xor
  shared_surface: Both ask for a shortest or longest subarray of an array of numbers, where the condition
    is about XOR values.
  flipping_difference: In the first problem the condition is an inequality between the XOR of two elements
    and a bound k, so for each right end the best left end is found with a binary trie that keeps the
    latest index on each node (Theorem 5.7.2). In the second the condition is an equality, the XOR of
    the whole stretch is 0, which two equal prefix XOR values give, so a map from the prefix value (with
    the balance of even and odd numbers) to its first index decides it.
  flipping_input: 'The prefix XORs of 1, 2, 3 are 0, 1, 3, 0: the stretch 1, 2, 3 has XOR 0 because the
    first and last prefix values are equal, which a map sees at once; the question "some two elements
    of the stretch have XOR at least 3" needs the trie.'
self_test:
- q: With 4-bit numbers, the set is 6, 9, 12 and x = 10. Which number does the walk of Theorem 5.7.1 reach,
    and what is the largest XOR?
  a: 6 = 0110, 9 = 1001, 12 = 1100 and x = 1010. The top digit of x is 1; the numbers with top digit 0
    is 6. Go to 6; the other digits cannot change the choice. 10 XOR 6 = 1100 = 12, while 10 XOR 9 = 3
    and 10 XOR 12 = 6.
- q: With the set 1, 2, 3, 4, how many stored y have 6 XOR y < 4?
  a: 'The XORs are 6⊕1 = 7, 6⊕2 = 4, 6⊕3 = 5, 6⊕4 = 2. Only 2 is below 4: one number (y = 4).'
- q: Why must all numbers in a binary trie be written with the same number of digits?
  a: The comparison of two XOR values by the first differing digit works only for strings of the same
    length. Written without leading zeros, 1 would be the digit string 1 and 2 would be 10, and their
    digits would line up at the wrong places. With 3 digits they are 001 and 010.
- q: To count the pairs i < j with a_i XOR a_j < k, the numbers are inserted into the trie as they are
    counted. For the single number 5 and k = 1, what goes wrong if the number is inserted before it is
    counted?
  a: 'Inserted first, the number 5 is counted against itself: 5 XOR 5 = 0 < 1 gives one pair, but there
    are no pairs at all. The number must be counted against the earlier numbers first and inserted afterwards.'
- q: The numbers are 1, 2, 3, 4 and the cost of an edge is the XOR of its ends. Use Theorem 5.7.3 to find
    the weight of a cheapest spanning tree.
  a: 'The top digit (the value 4) splits them into {1, 2, 3} and {4}. In {1, 2, 3} the digit of value
    2 splits {1} from {2, 3}: inside {2, 3} the edge costs 1, and the cheapest edge across is 1 XOR 3
    = 2. Across the top split the cheapest edge is 1 XOR 4 = 5. The total is 1 + 2 + 5 = 8.'
- q: Why does the tree of Theorem 5.7.3 contain exactly one edge between the two groups, and why is it
    the cheapest crossing edge?
  a: Every edge inside a group costs less than every crossing edge, so Kruskal takes all the useful inside
    edges first, and by then each group is one component. The next edge it takes is the cheapest crossing
    one and it joins the two components, so every later crossing edge makes a cycle and is skipped.
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-1285D
  - ac-abc308_g
