# Topic 7.1 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.1'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, trying all subsets of vertices or edges'
- topic: '1.1'
  what: 'Sorting: the gains at a vertex taken in decreasing order, and the largest values when no connectedness
    is needed'
- topic: '1.2'
  what: 'Prefix sums: a map of prefix sums along a root path, and the difference array that counts pairs
    by distance'
- topic: '1.4'
  what: 'Binary search: counting the nodes of a complete tree by the depth of its last level'
- topic: '1.5'
  what: 'Greedy: the largest gains taken first, and the minimal changes that equalise the paths'
- topic: '2.1'
  what: 'Number theory: primes labelling the vertices, and the common divisors along a path'
- topic: '3.2'
  what: 'Dynamic programming: a value for each small case built from the values of smaller cases'
- topic: '3.3'
  what: 'Knapsack: the subset sum over the sizes of the children'
- topic: '3.6'
  what: 'Interval DP: counting palindromic substrings, the contrast with a tree'
- topic: '4.1'
  what: 'Graph traversal: a search from every vertex, and the breadth-first order of a rooted tree'
- topic: '4.2'
  what: 'Graph structure: the two-colouring of a tree'
- topic: '4.5'
  what: 'Trees: rooted trees, subtrees, sizes, depths and the farthest vertex'
- topic: '4.6'
  what: 'LCA: the distance between two given vertices'
- topic: '0.6'
  what: 'Standard containers: the map of prefix sums on the current root path'
- topic: '1.7'
  what: 'Bit operations: the xor of the values along a path'
- topic: '2.2'
  what: 'Modular arithmetic: counts modulo a prime or any other modulus'
- topic: '2.3'
  what: 'Combinatorics: counting orders and subsets with products of binomial-like factors'
- topic: '2.4'
  what: 'Expected value: the counting of orders of a tree'
theorems:
- id: 7.1.1
  title: The subtree DP
  plain_words: The subtree of a vertex is a smaller copy of the same question, and the subtrees of different
    children have nothing in common except that they hang from the same vertex. So once the colour of
    the vertex is fixed, the paintings of the child subtrees are chosen independently, and the counts
    multiply. A white vertex lets each child have any colour; a black vertex forces each child to be white.
  code: 7.1/thm-1
- id: 7.1.2
  title: The best path
  plain_words: Every path in a rooted tree has one highest vertex, where it turns from going up to going
    down. From that vertex it goes down into at most two different children. So the best path through
    a vertex is its own value plus the best two downward paths of its children, and a child whose best
    downward path is negative is simply left out. Take the best over all the vertices.
  code: 7.1/thm-2
- id: 7.1.3
  title: Rerooting
  plain_words: The answer for a root is made from the parts of the tree that hang from its neighbours.
    Rooting the tree once gives the part below every vertex. The part above a vertex $c$ is the tree seen
    from its parent $p$ without the subtree of $c$, and it is made from the part above $p$ and the other
    children of $p$. To leave one child out of a product, keep the product of the children in front of
    it and the product of those behind it. Each vertex does work proportional to its number of children.
  code: 7.1/thm-3
- id: 7.1.4
  title: Merging with sizes
  plain_words: To choose $j$ vertices in the subtree of $v$ we decide how many come from each child; this
    is a knapsack over the children. The table of a vertex has as many entries as its subtree has vertices,
    so merging two tables of sizes $a$ and $b$ takes $a \cdot b$ steps. That is the number of pairs made
    of one vertex from each part. Two vertices are brought together only once, at their lowest common
    ancestor, so the whole work is at most the number of pairs of vertices.
  code: 7.1/thm-4
cards:
- id: subtree-dp
  name: Best value or number of ways for a subtree, from the values of its children (states per vertex)
  from_theorem: 7.1.1
  decisive_property: A rule about neighbouring vertices or edges of a tree (no two black neighbours, at
    most d chosen edges at a vertex, each component with one black vertex) makes the value for the subtree
    of a vertex depend only on the state of the vertex and on the same kind of values for its children.
  how_to_test: 'Write down what the parent needs to know about a subtree: a colour, "the edge to the parent
    is taken", a count. If a short list of states is enough (up to about 3), write the value of each state
    of a vertex as a combination over its children (a product, a sum, a maximum with a limited choice).
    If a rule needs to know about vertices in other subtrees, or the graph has a cycle, the property fails.'
  constraint_shapes:
  - 'n = 10^5 vertices and the number of paintings with no two black neighbours: 2^n paintings, against
    2n numbers in the DP'
  - 'n = 3·10^5 and the best set of edges with at most d_i chosen at each vertex: 2^(n−1) subsets, against
    about n log n for two states per vertex and a sort of the gains'
  weak_signals:
  - form: Asks for the number or the best value of choices on the vertices or edges of a tree under a
      rule between neighbours (independent set, matching, degree limits, colourings)
    shape: n up to 10^5 to 3·10^5, an answer modulo a prime or in 64 bits
  - form: Asks for a minimum or a maximum over a tree of a quantity built from the children by max, min
      or sum (cameras, a game on a tree, a value at the root)
    shape: n up to 3·10^5, values coming from the leaves
  - form: Asks to cut edges or choose vertices so that every component meets a condition
    shape: n up to 10^5, one state is whether the edge to the parent is cut
  kill_signals:
  - 'The graph has a cycle: a 4-cycle has 7 paintings with no two black neighbours, but the product rule
    applied to the path 0–1–2–3 (the cycle with one edge forgotten) gives 8'
  - 'The rule links vertices in different subtrees without going through their common ancestor (all black
    vertices must have different values anywhere in the tree): a state per vertex is not enough'
  in_action:
    statement: A tree is given. Paint each vertex white or black so that no two adjacent vertices are
      both black. Print the number of ways modulo 10^9 + 7.
    constraints: n ≤ 10^5.
    budget: 2^n paintings. Need about n.
    candidates:
    - tool: Try all paintings (topic 0.5)
      verdict: rejected
      because: 2^100000 paintings.
    - tool: A DP along a path of positions (topic 3.2)
      verdict: rejected
      because: A vertex has several children, so there is no single line of positions to move along.
    - tool: The subtree DP with two states per vertex (this topic)
      verdict: chosen
      because: The subtree of a vertex touches the rest only through the vertex, so the paintings of the
        child subtrees multiply (Theorem 7.1.1).
    property_check: The rule is about neighbours only, the graph is a tree, and one bit (the colour of
      the vertex) is all a parent needs. The property holds.
    decision: 'Root the tree, take the vertices children first, w[v] = Π (w[c] + b[c]) and b[v] = Π w[c],
      print w[root] + b[root]: O(n).'
  examples:
    positive:
    - inline:
        input: How many paintings of a path of 3 vertices have no two adjacent black vertices?
        answer: '5'
        why: 'Rooted at one end: the leaf has (1, 1); the middle vertex has w = 2 and b = 1; the root
          has w = 2 + 1 = 3 and b = 2; the total is 5 (Theorem 7.1.1).'
    - inline:
        input: How many paintings of a star with a centre and 3 leaves have no two adjacent black vertices?
        answer: '9'
        why: 'Rooted at the centre: each leaf has (1, 1), so w = 2 · 2 · 2 = 8 and b = 1; the total is
          9.'
    - worked_example: ac-abc259_f
      why: 'Choosing edges with at most d_i at each vertex: two states per vertex (the edge to the parent
        taken or not) and the largest gains taken at each vertex.'
    negative:
    - inline:
        input: How many paintings of a cycle of 4 vertices have no two adjacent black vertices?
        answer: '7'
        method_gives: '8'
        why: A cycle is not a tree. The DP along the path 0–1–2–3 forgets the edge 3–0 and also counts
          the paintings in which 0 and 3 are both black.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - problem: lc-minimum-height-trees
      why: 'Asks for the roots that give the smallest height: these are the one or two centres of the
        tree, found by removing leaves layer by layer; there are no choices to count or optimise.'
      correct_tool:
        topic: '4.5'
        card: farthest-each
  lookalikes:
  - description: Choosing items with no two neighbours in a row
    tool:
      topic: '3.2'
      card: linear-state
    flipping_difference: On a line the DP moves over positions; in a tree a vertex has several children
      and the values of all of them are combined by a product or a sum.
  - description: The size or the height of every subtree
    tool:
      topic: '4.5'
      card: subtree-values
    flipping_difference: 'One number per subtree by a sum or a maximum, with no choices: plain subtree
      values. Choices and states make it a DP.'
  complexity: O(n · S) for S states per vertex when each child is combined in O(1); O(n log n) if the
    gains at a vertex are sorted; memory O(n).
- id: through-vertex
  name: 'Best path or pair of vertices in a tree: the top vertex joins two downward paths'
  from_theorem: 7.1.2
  decisive_property: The question asks for the best path (or the number of pairs of vertices) of a tree
    under a value that adds up along the path or splits at its highest vertex (sums, distances up to a
    small limit, parities), and every path has a unique top vertex where it joins at most two downward
    paths.
  how_to_test: Write the value of a path as (a part below one child) + (a part below another child) +
    (the top vertex). If that works, keep for each vertex the best downward value (or a short array of
    counts) and combine the two best children, or all pairs of children, at the vertex. If the path must
    have a fixed shape (start at the root, end at a leaf), it is a subtree DP; if the chosen set may branch,
    take all the positive children instead of two.
  constraint_shapes:
  - 'n = 3·10^5 vertices and the path with the largest sum of values: n²/2 = 4.5·10^10 paths, against
    one pass with the two best children of every vertex'
  - 'n = 10^5 and the number of paths with exactly one prime label: 5·10^9 paths, against counting by
    the top vertex or by pieces in O(n)'
  weak_signals:
  - form: Asks for the largest or smallest sum of values or weights on a path of a tree, with negative
      values allowed
    shape: n up to 3·10^5, the answer in 64 bits
  - form: Asks for the number of pairs of vertices or leaves whose distance, sum or xor is in a range
    shape: n up to 10^5, counts by distance up to a small limit, or by parity or bit
  - form: Asks for the longest path whose vertices all satisfy a property (equal values, a common divisor
      above 1, different neighbours)
    shape: n up to 2·10^5, a downward length for each value or each prime
  kill_signals:
  - 'The question is a connected set that may branch, not a path: for a centre with the value 1 and three
    leaves with the value 5, the best connected set has the sum 16 but the best path has the sum 11'
  - 'All values are 1 and only the longest path is asked (the diameter of an unweighted tree): two searches
    (topic 4.5) are shorter'
  in_action:
    statement: A tree has an integer (possibly negative) on each vertex. Print the largest sum of the
      values on a path.
    constraints: n ≤ 3·10^5.
    budget: n²/2 = 4.5·10^10 paths. Need about n.
    candidates:
    - tool: A search from every vertex (topic 4.1)
      verdict: rejected
      because: n searches of n steps each, 9·10^10 steps.
    - tool: Two searches for the diameter (topic 4.5)
      verdict: rejected
      because: It finds the longest path by edges, not the path with the largest sum of values; with negative
        values the two-search trick fails.
    - tool: The top-vertex DP (this topic)
      verdict: chosen
      because: Every path has a top vertex that joins its two best downward paths (Theorem 7.1.2).
    property_check: A path is two downward paths joined at the top vertex, and the sum of values splits
      into the two parts. The property holds.
    decision: 'down[v] = a[v] + max(0, best child); at v add the two best positive child values; take
      the maximum over v: O(n).'
  examples:
    positive:
    - inline:
        input: The tree 0–1, 0–2, 2–3, 2–4 has the values −2, 5, 1, 3, −4 on the vertices 0 to 4. What
          is the largest sum on a path?
        answer: '7'
        why: 'The path 1–0–2–3 has the top 0 and the sum 5 − 2 + 1 + 3 = 7: down(1) = 5 and down(2) =
          4 are the two best (Theorem 7.1.2).'
    - inline:
        input: The same tree has the values −3, −1, −2, −9, −5. What is the largest sum on a path?
        answer: '-1'
        why: Every child path is negative and is left out; the best path is the vertex 1 alone, with the
          value −1.
    - worked_example: lc-number-of-good-leaf-nodes-pairs
      why: 'Pairs of leaves with a distance at most 10: counted at the top vertex of each pair from the
        numbers of leaves at each distance below the children.'
    negative:
    - inline:
        input: A star has a centre with the value 1 and three leaves with the value 5. What is the largest
          sum of a connected set of vertices?
        answer: '16'
        method_gives: '11'
        why: 'The set may branch: it takes all three leaves, 1 + 5 + 5 + 5 = 16. A path through the centre
          can use only two of them.'
      correct_tool:
        topic: '7.1'
        card: subtree-dp
    - problem: ac-abc138_d
      why: 'Adds amounts to whole subtrees and reads the totals at the vertices: pass the sums down from
        the root. No path and no top vertex are involved.'
      correct_tool:
        topic: '4.5'
        card: depths-parents
  lookalikes:
  - description: The longest path of an unweighted tree (the diameter)
    tool:
      topic: '4.5'
      card: longest-path
    flipping_difference: 'All lengths are 1: two searches find the ends. With values on vertices or edges,
      possibly negative, the top-vertex DP is needed.'
  - description: The distance between two given vertices
    tool:
      topic: '4.6'
      card: tree-distance
    flipping_difference: 'A fixed pair: the lowest common ancestor gives the distance. The best path over
      all pairs needs the DP at the top vertices.'
  complexity: O(n) for the two best children of each vertex; O(n · D²) with count arrays of length D;
    memory O(n) (O(n · D) with count arrays).
- id: rerooting
  name: An answer for every vertex taken as the root (moving the root across an edge)
  from_theorem: 7.1.3
  decisive_property: The question asks for a value for each vertex taken as the root (or as the start,
    the centre, the capital), the value is built from the parts of the tree beyond the neighbours of that
    vertex, and the part beyond a neighbour changes in a simple way when the root moves by one edge.
  how_to_test: 'Write the answer for a root r as a combination (sum, product, maximum) over the neighbours
    u of a value of the part beyond u. If the value of the part above a child c can be made from the part
    above its parent and the other children of the parent, rerooting costs O(n). Check whether the combination
    has an inverse: for a maximum, a minimum, a gcd or a product modulo a number that may not be prime,
    use prefix and suffix values or the two best.'
  constraint_shapes:
  - 'n = 2·10^5 and the sum of distances from every vertex: n² = 4·10^10 steps for a search from each
    vertex, against about 3n for the two passes'
  - 'n = 10^5 and, for every vertex, the number of connected black sets that contain it, modulo a number
    that may not be prime: n² = 10^10 for a DP from every vertex, against n with prefix and suffix products'
  weak_signals:
  - form: 'Asks for the same quantity for every vertex of a tree: the sum of distances, the number of
      ways, the best score if this vertex is the root or the start'
    shape: n up to 2·10^5, an array of n answers
  - form: Asks for the best vertex to start at or to choose as the centre, where the cost depends on the
      whole tree seen from it
    shape: n up to 2·10^5, minimise or maximise over the vertices
  - form: Asks for the number of ways for every root, where a division by the factor of one child could
      meet a zero modulo the modulus
    shape: n up to 2·10^5, a modulus of 10^9 + 7 or an arbitrary one
  kill_signals:
  - 'The simple update from the parent drops information: for the farthest vertex, answer(c) = max(down(c),
    answer(p) + 1) is wrong when the farthest way from p goes through c: on the path 3–1–0–2 it gives
    3 for the vertex 1 where the answer is 2'
  - 'Only one root (or a few) is asked about: a single subtree DP is enough'
  in_action:
    statement: A tree is given. For every vertex print the sum of the distances from it to all the other
      vertices.
    constraints: n ≤ 2·10^5.
    budget: 'A search from every vertex: n² = 4·10^10. Need about n.'
    candidates:
    - tool: A breadth-first search from every vertex (topic 4.1)
      verdict: rejected
      because: 4·10^10 steps.
    - tool: Counting the contribution of each edge (topic 4.5)
      verdict: rejected
      because: The edge to the parent of c lies on size(c)·(n − size(c)) paths, which gives the total
        over all pairs, not the sum for each vertex.
    - tool: Rerooting (this topic)
      verdict: chosen
      because: Moving the root from p to c brings size(c) vertices one step closer and the other n − size(c)
        one step farther (Theorem 7.1.3).
    property_check: The answer for a root is a sum over the parts beyond its neighbours, and one edge
      changes it by n − 2·size(c). The property holds.
    decision: 'Compute the sum of depths for the root 0 and the sizes, then answer(c) = answer(p) + n
      − 2·size(c) in the order of a breadth-first search: O(n).'
  examples:
    positive:
    - inline:
        input: In the tree 0–1, 0–2, 2–3, 2–4, what is the sum of the distances from the vertex 2 to all
          vertices?
        answer: '5'
        why: The sum for the root 0 is 1 + 1 + 2 + 2 = 6 and the subtree of 2 has 3 vertices, so 6 + 5
          − 2 · 3 = 5 (Theorem 7.1.3).
    - inline:
        input: In the same tree, how many connected sets of vertices contain the vertex 1?
        answer: '6'
        why: 'down(1) = 1 and up(1) = 5, so the number is 1 · (5 + 1) = 6: the vertex 1 alone, or with
          the vertex 0 and nothing or one of the 4 connected sets of the side of 2.'
    - worked_example: cses-1133
      why: 'The sum of the distances from every vertex of a tree of up to 2·10^5 vertices: answer(c) =
        answer(p) + n − 2·size(c).'
    negative:
    - inline:
        input: In the tree with the edges 0–1, 0–2 and 1–3 (the path 3–1–0–2), what is the largest distance
          from the vertex 1 to another vertex?
        answer: '2'
        method_gives: '3'
        why: The update answer(c) = max(down(c), answer(p) + 1) takes the farthest distance from the vertex
          0, which is 2 and goes through 1 itself, and adds 1. The part above 1 must not contain the subtree
          of 1.
      correct_tool:
        topic: '4.5'
        card: farthest-each
    - problem: cses-2079
      why: Asks for one vertex, a centroid, and it is found by walking from the root towards the heavy
        child; no table of answers for all the vertices is needed.
      correct_tool:
        topic: '4.5'
        card: subtree-values
  lookalikes:
  - description: The same quantity for one fixed root
    tool:
      topic: '7.1'
      card: subtree-dp
    flipping_difference: 'One root: a single subtree DP. Every vertex as the root: the second pass of
      the rerooting is added.'
  - description: The distance between given pairs of vertices
    tool:
      topic: '4.6'
      card: tree-distance
    flipping_difference: 'Queries about pairs: the lowest common ancestor. A value for every vertex as
      the centre: rerooting.'
  complexity: O(n) for the two passes with prefix and suffix values over the children (O(n log n) if the
    children must be sorted); memory O(n).
- id: tree-merge
  name: 'Choosing k vertices in a connected part of a tree: merging the tables of the children with the
    size bound'
  from_theorem: 7.1.4
  decisive_property: A state of a vertex contains a count (the number of chosen vertices, of cut edges,
    of components) that is at most the size of the subtree, and the counts of the children must be combined
    like a knapsack.
  how_to_test: Write the state as (vertex, count) with the count at most the size of the subtree. Merging
    a child costs (the part merged so far) times (the size of the child), and by the pair argument of
    Theorem 7.1.4 all merges together cost n(n−1)/2. That is fine for n up to about 5000. If the count
    is a budget that does not depend on the sizes, the tables are not bounded by sizes and the bound fails.
  constraint_shapes:
  - 'n = 5000 and the best connected set of exactly k vertices: C(5000, k) sets, against n(n − 1)/2 =
    1.25·10^7 merging steps'
  - 'n = 5000 and the number of ways to cut edges so that every component has diameter at most K: 2^(n−1)
    subsets, against about n²/2 = 1.25·10^7 steps with tables indexed by depth'
  weak_signals:
  - form: Asks for the best value when exactly (or at most) k vertices or edges are chosen in a tree,
      with the chosen set connected or linked to the root
    shape: n up to 5000 (sometimes 3000), k up to n
  - form: Asks for a number of ways with a length or a depth parameter that is at most the size of the
      subtree
    shape: n up to 5000, a prime modulus
  - form: Asks for the number of subsets of vertices or edges by their number of components
    shape: n up to 5000, one answer for each count
  kill_signals:
  - 'There is no connectedness: the 3 largest of the values 1, −5, −5, 10, 10 add up to 21 by sorting,
    but the tables for connected sets that contain the root give 6'
  - 'n is large (10^5) or the table length is a budget up to 10^9: the n² bound fails, and a greedy or
    a different state must be found'
  in_action:
    statement: A tree with n vertices has an integer on each vertex. Print the largest sum of a connected
      set of exactly k vertices.
    constraints: n ≤ 3000.
    budget: C(n, k) sets. Need about n².
    candidates:
    - tool: Try all subsets (topic 0.5)
      verdict: rejected
      because: 2^3000 subsets.
    - tool: Take the k largest values (topic 1.1)
      verdict: rejected
      because: The chosen vertices must be connected, and the k largest values may be far apart.
    - tool: Merging tables bounded by sizes (this topic)
      verdict: chosen
      because: A table for a subtree has one entry for each number of vertices, and the merges cost n(n
        − 1)/2 steps in all (Theorem 7.1.4).
    property_check: The state is (vertex, number of chosen vertices) with the number at most the subtree
      size; the combination over children is a knapsack. The property holds.
    decision: 'dp[v][j] for connected sets containing v; merge the children one by one into a new table;
      the answer is the best dp[v][k] over all v: O(n²).'
  examples:
    positive:
    - inline:
        input: The tree 0–1, 0–2, 2–3, 2–4 has the values 1, −5, −5, 10, 10. What is the largest sum of
          a connected set of 3 vertices that contains the vertex 0?
        answer: '6'
        why: The tables give 6 for {0, 2, 3} (1 − 5 + 10); the set {0, 1, 2} has −9 (Theorem 7.1.4).
    - inline:
        input: In the same tree, what is the largest sum of a connected set of 4 vertices that contains
          the vertex 0?
        answer: '16'
        why: The set {0, 2, 3, 4} has the sum 1 − 5 + 10 + 10 = 16.
    negative:
    - inline:
        input: For the values 1, −5, −5, 10, 10, what is the largest sum of any 3 vertices (not necessarily
          connected)?
        answer: '21'
        method_gives: '6'
        why: Without connectedness the answer is the sum of the 3 largest values, 10 + 10 + 1 = 21. The
          tables look only at connected sets that contain the root.
      correct_tool:
        topic: '1.1'
        card: sort-then-scan
    - problem: lc-maximum-number-of-k-divisible-components
      why: Cuts edges so that every component has a sum divisible by k; there is no count to choose, and
        cutting an edge whenever the subtree sum is divisible is enough.
      correct_tool:
        topic: '4.5'
        card: subtree-values
  lookalikes:
  - description: Choosing items with a total weight bound
    tool:
      topic: '3.3'
      card: zero-one
    flipping_difference: 'Items in a row: one item is merged at a time. In a tree whole subtrees are merged,
      and the size bound keeps the total at n².'
  - description: Choosing the k largest elements of an array
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: Without connectedness sorting is enough; the tables are needed because the chosen
      vertices must hang together.
  complexity: O(n²) time for all tables; memory O(n) if a table is freed after it has been merged into
    its parent; with tables cut at K entries about O(nK).
problems:
- id: cses-1133
  role: worked_example
  summary: A tree of n ≤ 2·10^5 vertices; for every vertex, the sum of the distances from it to all other
    vertices.
- id: ac-abc259_f
  role: worked_example
  summary: A tree of N ≤ 3·10^5 vertices with a weight (possibly negative) on each edge and a limit d_i
    for each vertex; the largest total weight of a set of edges in which at most d_i edges touch the vertex
    i.
- id: lc-number-of-good-leaf-nodes-pairs
  role: worked_example
  summary: A binary tree of up to 1024 nodes and a number distance up to 10; the number of pairs of different
    leaves whose distance is at most distance.
- id: cf-1528A
  role: ladder
  card: subtree-dp
  rung: 1
  twist: 'Base case of the card: two states per vertex, the two ends of its range.'
  summary: A tree of n ≤ 10^5 vertices; each vertex v gets a number a_v from the range [l_v, r_v]; the
    beauty is the sum of |a_u − a_v| over the edges; the largest beauty. †
  hints:
  - Does it matter which numbers in the range you choose? The beauty is a sum of absolute values, which
    is convex in each a_v when the others are fixed.
  - So an optimal choice uses only the ends l_v or r_v of the ranges, and each vertex has two states.
  - dp[v][0] and dp[v][1] = the best beauty inside the subtree of v when a_v = l_v, or a_v = r_v. For
    each child c add max(|a_v − l_c| + dp[c][0], |a_v − r_c| + dp[c][1]). Use 64 bits.
- id: cf-274B
  role: ladder
  card: subtree-dp
  rung: 2
  twist: 'Operations that always contain the root: the needs of the children are combined by a maximum.'
  summary: A tree of n ≤ 10^5 vertices with an integer on each vertex; in one move choose a connected
    set of vertices that contains the vertex 1 and add 1 to all of them or subtract 1 from all of them;
    the fewest moves that make all numbers 0. †
  hints:
  - A move that reaches a deep vertex also contains every vertex on the way up to the root. What does
    that say about the number of moves that cover a vertex and those that cover its children?
  - For each vertex let plus[v] and minus[v] be the numbers of +1 moves and −1 moves that cover it. They
    are at least the maximum over the children.
  - 'Start with plus = the maximum of the children and minus = the maximum of the children. The covers
    must cancel the value: while plus − minus is not equal to −a_v, raise plus or minus (whichever is
    needed). The answer is plus[1] + minus[1]. 64 bits.'
- id: cf-1153D
  role: ladder
  card: subtree-dp
  rung: 3
  twist: Combining the children differently at different vertices (minimum or sum).
  summary: A rooted tree of n ≤ 3·10^5 vertices; each inner vertex takes the maximum or the minimum of
    its children; the k leaves get the numbers 1 … k in some order; the largest value that can appear
    at the root. †
  hints:
  - 'Ask the opposite question: for a value x at the root, what is the least number of leaves that must
    have values at least x?'
  - 'Let dp[v] be that least number for the subtree of v. A leaf needs 1. A max vertex needs only one
    child to reach x: the minimum of the children. A min vertex needs all of them: the sum.'
  - The root needs dp[1] leaves with the largest numbers, so the best value is k − dp[1] + 1.
- id: cf-1088E
  role: ladder
  card: subtree-dp
  rung: 4
  twist: 'The same DP used twice: first for the value, then for counting the best pieces.'
  summary: A tree of n ≤ 3·10^5 vertices with an integer on each vertex; choose k ≥ 1 disjoint connected
    sets to make (the sum of their sums) / k as large as possible, and among the best choices take the
    largest k; print the sum of the sums and k. †
  hints:
  - The average of k sums is at most the largest sum of a single connected set. When is the maximum reached?
  - Let M be the largest sum of a connected set, found with dp[v] = a_v + the sum of the positive dp of
    the children. The average is M exactly when every chosen set has the sum M.
  - 'Count the most disjoint sets of sum M: go bottom-up, and when dp[v] = M count one and reset dp[v]
    to 0 so that the parent does not use it. The answer is M · k and k.'
- id: cf-1083A
  role: ladder
  card: through-vertex
  rung: 1
  twist: 'Base case of the card: the best path with values on vertices and lengths on edges.'
  summary: A tree of n ≤ 3·10^5 vertices with an amount w_v at each vertex and a length on each edge;
    a path collects the amounts of its vertices and pays the lengths of its edges; the largest total over
    all paths (a single vertex is a path). †
  hints:
  - Every path has a top vertex. What does a path with a given top look like?
  - down[v] = w_v + max(0, the best of down[c] − length(v, c) over the children).
  - At v take the two best of the values max(0, down[c] − length) and add w_v; the answer is the maximum
    over all v. 64 bits.
- id: cf-766E
  role: ladder
  card: through-vertex
  rung: 2
  twist: Counting by the top vertex, bit by bit, with parities.
  summary: A tree of n ≤ 10^5 vertices with a number up to 10^6 on each vertex; for all pairs i ≤ j take
    the xor of the numbers on the path from i to j (both ends included); print the sum of these xors.
    †
  hints:
  - 'Treat each bit on its own: the xor has the bit set when an odd number of vertices on the path have
    the bit.'
  - For one bit keep cnt[v][0] and cnt[v][1], the numbers of downward paths from v with an even or an
    odd number of vertices with the bit.
  - At the top v combine the paths of the children already seen with the paths of the new child (an odd
    total comes from one odd and one even part, with v counted once), so that every pair is counted once;
    add 2^bit times the number of odd paths. 64 bits.
- id: lc-count-valid-paths-in-a-tree
  role: ladder
  card: through-vertex
  rung: 3
  twist: Counting pairs by the top vertex, with pieces of the tree that have no prime label.
  summary: A tree with the vertices labelled 1 … n (n ≤ 10^5); the number of pairs of different vertices
    such that the path between them has exactly one vertex with a prime label.
  hints:
  - Remove the vertices with a prime label. What do the vertices that are left form?
  - They form pieces. A valid path has exactly one prime vertex p, and its other vertices lie in the pieces
    next to p, at most one piece on each side.
  - For a prime p with the sizes s_1, s_2, … of the pieces hanging from its neighbours, the valid paths
    through p are the pairs (p, x) with x in a piece, Σ s_i, and the pairs from two different pieces,
    Σ_{i<j} s_i s_j. Add over all primes (sieve of topic 2.1). 64 bits.
- id: ac-abc220_f
  role: ladder
  card: rerooting
  rung: 1
  twist: 'Base case of the card: the sum of distances for every vertex, the question of the first worked
    example on a second judge.'
  summary: A tree of N ≤ 2·10^5 vertices; for every vertex i, the sum of the distances from i to all vertices.
  hints:
  - What changes when the root moves from a vertex to its child? Count the vertices that get closer and
    the ones that get farther.
  - 'size[c] vertices get one step closer and n − size[c] one step farther: answer[c] = answer[p] + n
    − 2·size[c].'
  - Root at the vertex 1; the answer for the root is the sum of the depths; then one pass in an order
    with parents first.
- id: ac-abc160_f
  role: ladder
  card: rerooting
  rung: 2
  twist: A count of orders that changes by a ratio of sizes along an edge.
  summary: A tree of N ≤ 2·10^5 vertices; for each k, the number of ways to write the numbers 1 … N on
    the vertices so that 1 is on the vertex k and each next number is on a vertex adjacent to one that
    already has a number, modulo 10^9 + 7.
  hints:
  - For a fixed k, the numbers form an order of the vertices in which every vertex comes after its parent
    when the tree is rooted at k. How many such orders are there?
  - n! divided by the product of the subtree sizes (rooted at k).
  - 'Moving the root from p to c changes only two sizes: the size of p becomes n − size(c) and the size
    of c becomes n. So answer(c) = answer(p) · size(c) / (n − size(c)), with modular inverses of the numbers
    1 … N.'
- id: cf-543D
  role: ladder
  card: rerooting
  rung: 3
  twist: 'Products with factors that can be 0 modulo the prime: prefix and suffix products.'
  summary: A tree of n ≤ 2·10^5 vertices (the cities and roads); choose which roads to repair; for each
    city taken as the capital, the number of choices in which every path from the capital to a city contains
    at most one road that is not repaired, modulo 10^9 + 7. †
  hints:
  - For one fixed capital, let f(v) be the number of choices inside the subtree of v such that every path
    from v down contains at most one bad road.
  - 'For each child c either the edge to c is repaired and the subtree of c is as f(c), or it is not repaired
    and everything below c must be repaired (1 way): f(v) = Π (f(c) + 1).'
  - 'Reroot: the product without one child cannot be got by dividing, because f(c) + 1 can be 0 modulo
    10^9 + 7. Use prefix and suffix products over the children.'
- id: lc-time-taken-to-mark-all-nodes
  role: ladder
  card: rerooting
  rung: 4
  twist: 'A maximum of costs that depend on the parity of the target: the two best values.'
  summary: A tree of n ≤ 10^5 nodes; a node is marked at time x if a neighbour was marked at time x −
    1 (odd node) or x − 2 (even node); for each start node, the time when all nodes are marked.
  hints:
  - 'The time to mark a node is the sum, along the path from the start, of the costs of the nodes after
    the start: 1 for an odd node and 2 for an even one. What is asked for each start?'
  - 'The largest cost of a path starting at s. Root the tree once: down[v] = the largest cost below v,
    up[c] = the largest cost of a path leaving through the parent.'
  - 'A maximum has no inverse: keep the two best values at each vertex, as in the template for the farthest
    vertex, and add the cost of the vertex that is reached.'
- id: cf-1856E1
  role: ladder
  card: tree-merge
  rung: 1
  twist: 'Base case of the card: a subset sum over the sizes of the children of each vertex.'
  summary: A rooted tree of n ≤ 5000 vertices; the vertices get the numbers 1 … n in some order a; count
    the triples (u, v, w) such that u is an ancestor of v and of w, neither of v and w is an ancestor
    of the other, and a_v < a_u < a_w; the largest possible count. †
  hints:
  - 'Look at one vertex u: v and w lie in the subtrees of two different children of u. What decides which
    of the two has the smaller number?'
  - The best is to give some of the child subtrees numbers below a_u and the others numbers above it.
    If the first group has x vertices and all child subtrees have S vertices in all, the count at u is
    x · (S − x).
  - The choices at different vertices are independent. At each vertex find, by a subset sum over the sizes
    of its children, the x closest to S / 2, and add x · (S − x). The sizes add up to n, so the work is
    O(n²).
- id: ac-abc287_f
  role: ladder
  card: tree-merge
  rung: 2
  twist: 'Counting subsets by their number of components: tables indexed by the count.'
  summary: A tree of N ≤ 5000 vertices; for each x from 1 to N, the number of non-empty subsets of vertices
    whose induced subgraph has exactly x connected components, modulo 998244353.
  hints:
  - Count subsets by the number of components. When a vertex is added, which components does it join?
  - dp[v][x][c] = the number of subsets of the subtree of v with x components, where c says whether v
    is chosen. Merging a chosen child into a chosen v joins two components, so x goes down by one.
  - The table length is the number of components, at most the subtree size, so merging costs the product
    of the sizes and the total is O(N²) (Theorem 7.1.4).
- id: cf-1499F
  role: ladder
  card: tree-merge
  rung: 3
  twist: Tables indexed by depth, merged with the bound on the heights.
  summary: A tree of n ≤ 5000 vertices and a number k; the number of sets of edges to remove so that every
    component of the rest has diameter at most k, modulo 998244353. †
  hints:
  - Think of dp[v][d] = the number of ways to cut edges inside the subtree of v so that all finished components
    have diameter at most k and the component of v has depth d (the longest downward path from v).
  - 'Merging a child c: cut the edge (v, c), which multiplies by the number of valid ways for c (the sum
    over its depths); or keep it, which needs d + d_c + 1 ≤ k and gives the new depth max(d, d_c + 1).'
  - The tables are as long as the heights, so the merge is bounded by the sizes (Theorem 7.1.4) and the
    total is O(n²). The answer is the sum of dp[1][d].
- id: lc-maximum-profit-from-trading-stocks-with-discounts
  role: ladder
  card: tree-merge
  rung: 4
  twist: A budget as the count of the table, with a state for the boss buying.
  summary: A company tree of n employees (employee 1 is the head); each employee can buy a stock at price
    present[i] and sell it tomorrow at future[i]; if the direct boss buys, the employee gets half price
    (rounded down); a budget limit; the largest profit.
  hints:
  - For each employee decide to buy or not; the boss's decision changes the price. What state do you need?
  - dp[v][b][s] = the best profit in the subtree of v with the budget b used, where s says whether the
    boss of v bought. Merge the children like a knapsack over the budget.
  - 'Here the table length is the budget, not the subtree size, so the merge costs n · budget²: check
    the limits, the bound of Theorem 7.1.4 does not apply to this table.'
- id: lc-binary-tree-cameras
  role: checkpoint
  card: subtree-dp
  summary: A binary tree of up to 1000 nodes; a camera on a node watches the node, its parent and its
    children; the fewest cameras that watch every node.
- id: cf-1101D
  role: checkpoint
  card: through-vertex
  summary: A tree of n ≤ 2·10^5 vertices with a number up to 2·10^5 on each vertex; the largest number
    of vertices on a path such that the gcd of the numbers on it is greater than 1, or 0 if there is none.
    †
- id: ac-dp_v
  role: checkpoint
  card: rerooting
  summary: A tree of N ≤ 10^5 vertices and a number M (2 to 10^9); for each vertex v, the number of ways
    to paint the vertices white or black so that the black vertices are connected and v is black, modulo
    M.
- id: lc-find-number-of-coins-to-place-in-tree-nodes
  role: review
  card: subtree-dp
  review_set: 1
  summary: A tree of n ≤ 2·10^4 nodes rooted at 0 with a cost on each; a node gets the largest product
    of the costs of three nodes in its subtree (0 if negative, 1 if the subtree has fewer than 3 nodes);
    the number for each node.
- id: cf-1238F
  role: review
  card: through-vertex
  review_set: 1
  summary: A tree (Σ n ≤ 3·10^5 over the tests); the largest number of vertices of a connected subgraph
    that is a caterpillar, a path together with some of the neighbours of its vertices. †
- id: cf-1187E
  role: review
  card: rerooting
  review_set: 1
  summary: A tree of n ≤ 2·10^5 vertices; choose a first vertex and then repeatedly colour a vertex adjacent
