decision_map:
- weak_signal: Split items into two teams or colours so that certain pairs are kept apart; is the graph
    bipartite?
  choose: two-sides
  when: Every rule is a pair that must differ and there are exactly two sides (Theorem 4.2.1).
  over:
  - card: components
    because: If the pairs mean "together", the pairs form groups, not sides.
    topic: '4.1'
  - card: subset-sums
    because: If the sides are compared by sums or sizes, a table of reachable sums decides it.
    topic: '3.3'
- weak_signal: Is there a loop in a graph of two-way links? How many links to remove to leave none? Print
    a loop.
  choose: undirected-cycle
  when: 'The links work both ways: count m − (n − c), or find a non-tree edge (Theorem 4.2.2).'
  over:
  - card: directed-cycle
    because: 'If the links are one-way arrows, an edge to a marked vertex may be just a second route:
      use the vertex states.'
  - card: components
    because: If only the groups are asked, not the loops inside them, one walk per group is enough.
    topic: '4.1'
- weak_signal: Put tasks in an order where "a before b" holds; is it possible; the smallest order; item
    1 as early as possible
  choose: dependency-order
  when: The rules are before/after pairs and nothing limits parallel work (Theorems 4.2.3, 4.2.5, 4.2.6).
  over:
  - card: sort-then-scan
    because: If every item carries a key that gives the order, sorting does it.
    topic: '1.1'
  - card: submask-mask
    because: If at most k items can be done per round and the fewest rounds are asked, the order alone
      is not enough.
    topic: '3.7'
- weak_signal: 'One-way pointers or "waits for" rules: is there a circle, which items are on circles,
    where does the route end?'
  choose: directed-cycle
  when: Arrows are followed forwards only, with the three vertex states (Theorem 4.2.4); one arrow per
    vertex is the simplest case.
  over:
  - card: undirected-cycle
    because: If the links are two-way, a link back to the parent is not a cycle.
  - card: parity
    because: If the number of steps is huge and only its parity decides the position, no cycle search
      is needed.
    topic: '0.4'
- weak_signal: "Use every road, pair or domino exactly once; restore a string from all its pieces; give the edges directions so that in equals out"
  choose: euler-trail
  when: "The demand is about edges, they form one connected piece, and 0 or 2 vertices have an odd degree (Theorem 4.2.7)."
  over:
    - card: path-mask
      because: "If every vertex, not every edge, must be visited once, the route is a Hamiltonian path and needs a table over the visited sets."
      topic: '3.7'
    - card: components
      because: "If only the pieces of the graph are asked, one walk per piece is enough; use the degrees only when each edge must be used exactly once."
      topic: '4.1'
