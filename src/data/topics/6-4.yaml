decision_map:
- weak_signal: How many different substrings; the k-th different substring; how many of each length; a
    value summed over all different substrings
  choose: distinct-substrings
  when: Each different substring is owned by the first suffix, in sorted order, that begins with it, and
    the suffix of rank r owns n − sa[r] − lcp[r] of them (Theorem 6.4.4).
  over:
  - card: distinct-by-hash
    topic: '6.1'
    because: A set of window hashes counts the different blocks of one fixed length; for all lengths at
      once, or for the k-th substring, the LCP array is needed.
  - card: set-membership
    topic: '0.6'
    because: A set of all substrings is enough up to about 3000 letters.
- weak_signal: The smallest rotation; the largest or smallest suffix; many comparisons of suffixes; a
    string made from the order of its suffixes
  choose: sorted-suffixes
  when: The suffixes of one long string are sorted once by doubling the compared block (Theorem 6.4.1)
    and every comparison is then a comparison of two ranks.
  over:
  - card: substring-compare
    topic: '6.1'
    because: Hashes answer only whether two blocks are equal; the order of the suffixes needs the ranks.
  - card: custom-order
    topic: '1.1'
    because: Separate strings are sorted by comparing them as they are; the suffixes of one string need
      the doubling.
- weak_signal: 'Many patterns on one fixed text: how many times, where first, or the k-th substring when
    repeats count'
  choose: occurrences-by-order
  when: The occurrences of a pattern are a block of consecutive ranks, found by two binary searches (Theorem
    6.4.5).
  over:
  - card: pattern-occurrences
    topic: '6.2'
    because: One pattern is matched with the prefix function in O(n + |p|); many patterns on a fixed text
      are answered from the sorted suffixes.
  - card: prefix-tree
    topic: '6.3'
    because: A trie of words answers which words begin with a string; the suffix array answers where a
      string occurs anywhere in the text.
- weak_signal: The longest common substring of strings; the sum of the common beginnings over pairs of
    positions; comparing arbitrary pieces of a string
  choose: common-substring
  when: The common beginning of two suffixes is the smallest LCP value between their ranks (Theorem 6.4.2),
    so pairs become range minimums.
  over:
  - card: z-compare
    topic: '6.2'
    because: If every pair has the position 0 as one end, the Z-function gives all values in O(n) without
      sorting.
  - card: hash-length-search
    topic: '6.1'
    because: A binary search on the length with hashes finds one longest repeated or common block, but
      is probabilistic and does not give sums over pairs.
