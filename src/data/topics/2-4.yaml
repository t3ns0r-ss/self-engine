# Topic 2.4 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '2.4'
uses:
- topic: '0.1'
  what: Overflow and long long for the totals
- topic: '0.2'
  what: Closed forms and counting runs
- topic: '0.3'
  what: Direct simulation
- topic: '0.4'
  what: Divisibility and remainders
- topic: '0.5'
  what: 'Brute force: listing the configurations, which gives the reference solutions'
- topic: '0.6'
  what: Counting values with maps
- topic: '1.1'
  what: 'Sorting: contributions of the i-th smallest element'
- topic: '1.2'
  what: Prefix sums
- topic: '1.3'
  what: Two pointers over sorted values
- topic: '1.4'
  what: Binary search
- topic: '1.5'
  what: Greedy choices
- topic: '1.6'
  what: 'Monotonic stack: counting the subarrays in which an element is the minimum or the maximum'
- topic: '2.1'
  what: Number theory
- topic: '2.2'
  what: 'Modular arithmetic: fractions modulo a prime (Theorem 2.2.4), for answers printed as P·Q^(−1)
    mod p'
- topic: '2.3'
  what: 'Combinatorics: counting outcomes, binomial coefficients and factorial tables'
theorems:
- id: 2.4.1
  title: Linearity of expectation
  plain_words: The average of a sum is the sum of the averages, even when the parts depend on each other.
    So an average over a huge set of outcomes can be found by averaging each part separately.
  code: 2.4/thm-1
- id: 2.4.2
  title: Expected counts from indicators
  plain_words: The expected number of events that happen is the sum of their probabilities, because each
    event is a 0-or-1 variable whose average is its probability. The events may depend on each other.
  code: 2.4/thm-2
- id: 2.4.3
  title: The contribution technique
  plain_words: A total over many configurations is a sum over elements of the element's value times the
    number of configurations in which it counts. Swapping the order of the two sums means the configurations
    never have to be listed.
  code: 2.4/thm-3
- id: 2.4.4
  title: Tail sums
  plain_words: The expected value of a non-negative integer is the sum over x ≥ 1 of the probability that
    it is at least x. For a maximum of independent draws, the probability that it is at most x is a product,
    so it is easy to find.
  code: 2.4/thm-4
- id: 2.4.5
  title: Waiting times
  plain_words: Repeating independent trials with success probability p until the first success takes 1/p
    trials on average. A process made of stages one after another takes the sum of the stage times, which
    gives the coupon collector's n·(1 + 1/2 + … + 1/n).
  code: 2.4/thm-5
cards:
- id: indicator-linearity
  name: Expected counts from indicators
  decisive_property: The quantity whose average is asked is a count (or a weighted sum) of events, and
    the probability of each single event can be computed; then the expected value is the sum of those
    probabilities, even when the events depend on each other.
  from_theorem: 2.4.2
  how_to_test: Write the random quantity as a sum of indicators (one per position, pair or element) and
    check that each P(event) has a formula.
  constraint_shapes:
  - 'A random permutation of n = 10^5: listing the n! orders is impossible, while n probabilities are
    10^5 steps.'
  weak_signals:
  - form: '"Expected number of …": fixed points, inversions, matches, distinct values, components'
    shape: n up to 10^5 or 10^6
  - form: A random permutation, random choices or random swaps
    shape: The answer is a fraction modulo 998244353
  - form: The process is complicated but each element's fate has a simple probability
    shape: One probability per element or pair
  kill_signals:
  - 'The quantity is a maximum, not a sum: the expected larger of two dice is 4.4722, not the larger of
    the two expected values, 3.5 (use tail sums).'
  - 'The question asks for a probability that an event happens at all: a random permutation of 3 has a
    fixed point with probability 0.6667, but the expected number of fixed points is 1 (use inclusion–exclusion).'
  in_action:
    statement: A random permutation of n elements is chosen uniformly; print the expected number of fixed
      points.
    constraints: n ≤ 10^5.
    budget: Listing the n! permutations is impossible beyond n = 12. One probability per position is n
      steps.
    candidates:
    - tool: Average over all permutations
      verdict: rejected
      because: n! outcomes.
    - tool: Sum of indicators, one per position
      verdict: chosen
      because: Each position stays with probability 1/n, and expectations add whatever the dependence.
    property_check: The quantity is a count of events (position i stays), and each probability is 1/n
      (Theorem 2.4.2).
    decision: Print n · (1/n) = 1.
  examples:
    positive:
    - inline:
        input: The expected number of fixed points of a random permutation of 4
        answer: '1'
        why: Each of the 4 positions stays with probability 1/4, so 4 · 1/4 = 1; averaging over the 24
          permutations gives the same.
    - worked_example: ac-abc326_e
      why: The salary is the sum of A_y times the probability that A_y is paid, and each probability is
        (1/N)(1 + 1/N)^(y−1).
    negative:
    - inline:
        input: The expected larger of two dice, computed as the larger of the two expected values
        answer: '4.4722'
        method_gives: '3.5'
        why: A maximum is not a sum; the average of the larger die is 161/36 = 4.4722, found by tail sums.
      correct_tool:
        topic: '2.4'
        card: tail-sum
    - inline:
        input: The probability that a random permutation of 3 has at least one fixed point, computed as
          the expected number of fixed points
        answer: '0.6667'
        method_gives: '1'
        why: Linearity gives the expected number of fixed points, 1, not the chance that there is at least
          one, 4/6.
      correct_tool:
        topic: '2.3'
        card: include-exclude
  lookalikes:
  - description: The probability that at least one event happens
    tool:
      topic: '2.3'
      card: include-exclude
    flipping_difference: Linearity gives the expected number of events, not the chance that the number
      is positive; for that, use inclusion–exclusion or the complement.
  complexity: O(number of events).
- id: contribution-total
  name: Totals by contribution
  decisive_property: A total over all subarrays, subsets, pairs or permutations is a sum over elements
    of value times a condition on that element; counting, for each element, the configurations in which
    it counts gives the total without listing the configurations.
  from_theorem: 2.4.3
  how_to_test: 'Exchange the sums: for one element, describe exactly the configurations in which it contributes,
    and check that their number has a formula (positions, sorting, nearest greater elements).'
  constraint_shapes:
  - 'n up to 2·10^5: listing the n² / 2 = 2·10^10 subarrays is too slow, while one weight per element
    is 2·10^5 steps.'
  weak_signals:
  - form: The sum over all subarrays (or substrings, subsets) of their minimum, maximum, sum or number
      of distinct values
    shape: n up to 2·10^5
  - form: Sum of |a_i − a_j| or of some function over all pairs
    shape: n up to 2·10^5 and values up to 10^9
  - form: Listing the configurations is too slow
    shape: Subsets of 2·10^5 elements, 2^n of them
  kill_signals:
  - 'Only one configuration is asked about: the largest subarray sum of 3 −5 4 is 4, while the contribution
    total over all subarrays is 1.'
  - 'The value of a configuration is not a sum over elements: the sum over the subarrays of 2 2 2 of the
    product of the elements is 22, while the weights (i + 1)(n − i) give 20.'
  in_action:
    statement: Print the sum, over all subarrays of an array, of the sum of the subarray, modulo 10^9
      + 7.
    constraints: n ≤ 2·10^5, a_i ≤ 10^9.
    budget: Listing the subarrays is 2·10^10, and summing each is more. One pass with a weight per element
      is 2·10^5 steps.
    candidates:
    - tool: Sum every subarray
      verdict: rejected
      because: n² / 2 subarrays, each with up to n terms.
    - tool: Value times the number of subarrays containing it
      verdict: chosen
      because: Element i lies in (i + 1)(n − i) subarrays and counts its value in each.
    property_check: The total is a sum over elements of a value times a condition (the element is inside
      the subarray), and the number of subarrays for an element is a product of two lengths (Theorem 2.4.3).
    decision: total = Σ a[i] · (i + 1) · (n − i) modulo 10^9 + 7.
  examples:
    positive:
    - inline:
        input: The sum of the sums of all subarrays of 1 2 3
        answer: '20'
        why: 1 · 1 · 3 + 2 · 2 · 2 + 3 · 3 · 1 = 20; listing the subarrays gives 1 + 2 + 3 + 3 + 5 + 6
          = 20.
    - worked_example: ac-abc127_e
      why: The total of the distances is, for each pair of cells, the distance times the C(cells − 2,
        k − 2) choices of the other cells.
    negative:
    - inline:
        input: The largest subarray sum of 3 −5 4, computed as the total of the contributions
        answer: '4'
        method_gives: '1'
        why: A maximum over configurations is not a total; contributions only add up. A scan with prefix
          minima gives the maximum.
      correct_tool:
        topic: '1.2'
        card: range-sum
    - inline:
        input: The sum over all subarrays of 2 2 2 of the product of their elements, computed with the
          weights (i + 1)(n − i)
        answer: '22'
        method_gives: '20'
        why: A product is not a sum over elements, so weights per element do not apply; the subarrays
          can be listed for small n.
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: The maximum over all subarrays of their sum
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: A maximum over configurations is not a total; contributions only add up.
  complexity: O(n) or O(n log n) after the per-element counts.
- id: geometric-wait
  name: Waiting for a success
  decisive_property: Independent trials repeat until something happens, with a fixed success probability
    within each stage; each stage takes 1/p trials on average and the stages add.
  from_theorem: 2.4.5
  how_to_test: Split the process into stages in which the success probability is the same at every trial,
    and check that the stages come one after another.
  constraint_shapes:
  - 'n up to 10^6 kinds of coupons: n stages, each with one inverse modulo 998244353, about 3·10^7 steps.'
  weak_signals:
  - form: '"Expected number of rolls, draws or attempts until …"'
    shape: A fixed success probability per attempt
  - form: Collect all kinds, see every face, visit every vertex by random picks
    shape: n up to 10^6 kinds
  - form: A process restarts from the beginning on failure
    shape: Stages with their own probabilities
  kill_signals:
  - 'There is a fixed number of trials: the probability of at least one 6 in 3 rolls is 0.4213, not an
    expected waiting time of 6 (use 1 − (1 − p)^k).'
  - 'The success probability depends on the history: drawing without replacement from 2 red and 2 blue
    balls until the first red takes 1.6667 draws on average, not 1/p = 2.'
  in_action:
    statement: There are n kinds of coupons and each draw is uniform; you own c kinds. Print the expected
      number of further draws until you own all n, modulo 998244353.
    constraints: n ≤ 10^6.
    budget: Simulating is not exact. One stage per missing kind with one inverse each is n · 30 steps.
    candidates:
    - tool: Simulate many times
      verdict: rejected
      because: It gives an estimate, not a residue.
    - tool: Sum of the expected stage lengths
      verdict: chosen
      because: With j kinds owned, a draw is new with probability (n − j)/n, so the stage takes n/(n −
        j) draws, and the stages add.
    property_check: The stages come in order and within a stage every draw has the same success probability
      (Theorem 2.4.5).
    decision: Sum n · (n − j)^(−1) modulo p for j = c, …, n − 1.
  examples:
    positive:
    - inline:
        input: The rolls of a die until the first 6
        answer: '6'
        why: Each roll succeeds with probability 1/6, so 1/p = 6.
    - inline:
        input: The rolls of a die until all six faces have appeared
        answer: '14.7'
        why: The stages take 6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1 = 14.7.
    negative:
    - inline:
        input: The probability of at least one 6 in 3 rolls of a die, computed as the expected waiting
          time 1/p
        answer: '0.4213'
        method_gives: '6'
        why: A fixed number of trials asks for a probability, 1 − (5/6)³, not for a waiting time.
      correct_tool:
        topic: '2.2'
        card: fast-power
    - inline:
        input: The draws without replacement from 2 red and 2 blue balls until the first red, computed
          as 1/p with p = 1/2
        answer: '1.6667'
        method_gives: '2'
        why: After a blue ball is drawn the red probability changes, so the trials are not identical;
          the position of the first red is 1/2 + 2/3 + 3/6 = 5/3, which is an expectation over positions.
      correct_tool:
        topic: '2.4'
        card: indicator-linearity
  lookalikes:
  - description: The probability of at least one success in k trials
    tool:
      topic: '2.2'
      card: fast-power
    flipping_difference: 'A fixed number of trials: 1 − (1 − p)^k, not an expected waiting time.'
  complexity: O(number of stages).
- id: tail-sum
  name: Expectation by tail sums
  decisive_property: The random value is a non-negative integer, typically a maximum or minimum of independent
    values, and P(X ≥ x) (or P(X ≤ x)) is easy as a product; then E[X] = Σ P(X ≥ x).
  from_theorem: 2.4.4
  how_to_test: Check that the values are integers in a range small enough to sum over, and that P(max
    ≤ x) or P(min ≥ x) factors over independent parts.
  constraint_shapes:
  - 'm up to 10^6 values and k up to 10^9 draws: listing the m^k outcomes is impossible, while m terms
    with one fast power each is 3·10^7 steps.'
  weak_signals:
  - form: Expected maximum or minimum of several dice, draws or random numbers
    shape: m up to 10^6 and k up to 10^9
  - form: Expected value of the largest (or k-th largest) of independent choices
    shape: Independent draws
  - form: Probabilities that are easy as "all of them are at most x"
    shape: A product over the independent parts
  kill_signals:
  - 'The values are dependent: the larger of two cards drawn without replacement from 1..6 is 4.6667,
    not the independent 4.4722.'
  - 'The value is a sum: the expected sum of two dice is 7, while the maximum formula gives 4.4722; linearity
    is simpler.'
  in_action:
    statement: k numbers are drawn independently and uniformly from 1..m; print the expected maximum modulo
      998244353.
    constraints: m ≤ 10^6, k ≤ 10^9.
    budget: Listing m^k outcomes is impossible. The tail sum has m terms, each a power of about 30 rounds.
    candidates:
    - tool: Average over all outcomes
      verdict: rejected
      because: m^k outcomes.
    - tool: Tail sum
      verdict: chosen
      because: P(max ≥ x) = 1 − ((x − 1)/m)^k is easy, and E[max] is the sum of these over x.
    property_check: The maximum is a non-negative integer of independent draws, so P(max ≤ x) is a product
      (Theorem 2.4.4).
    decision: Sum over x = 1..m of 1 − (x − 1)^k · (m^k)^(−1) modulo p.
  examples:
    positive:
    - inline:
        input: The expected larger of two dice
        answer: '4.4722'
        why: Σ over x of 1 − ((x − 1)/6)² = 6 − 55/36 = 161/36.
    - inline:
        input: The expected smaller of two dice
        answer: '2.5278'
        why: P(min ≥ x) = ((7 − x)/6)², and the sum over x = 1..6 is 91/36.
    negative:
    - inline:
        input: The expected larger of two cards drawn without replacement from 1..6
        answer: '4.6667'
        method_gives: '4.4722'
        why: The two values are not independent, so P(max ≤ x) is not a product; it is C(x, 2) / C(6,
          2), counted with binomial coefficients.
      correct_tool:
        topic: '2.3'
        card: ncr-mod-p
    - inline:
        input: The expected sum of two dice, computed with the maximum formula
        answer: '7'
        method_gives: '4.4722'
        why: 'A sum is linear: the expected values add, 3.5 + 3.5 = 7. Only maxima and minima need tail
          sums.'
      correct_tool:
        topic: '2.4'
        card: indicator-linearity
  lookalikes:
  - description: Expected sum of several dice
    tool:
      topic: '2.4'
      card: indicator-linearity
    flipping_difference: A sum is linear, so add the expectations. Only maxima and minima need tail sums.
  complexity: O(range of values × number of independent parts), or less with fast powers.
problems:
- id: ac-abc326_e
  role: worked_example
  summary: Roll an N-sided die while each roll beats the previous paid one, paying A_y for each such roll
    y; the expected total pay modulo 998244353 (N ≤ 3·10^5).
- id: ac-abc127_e
  role: worked_example
  summary: Sum, over all ways to choose K cells of an N × M grid (NM ≤ 2·10^5), of the Manhattan distances
    between all chosen pairs, modulo 10^9 + 7.
- id: cses-1728
  role: ladder
  card: indicator-linearity
  rung: 1
  twist: Base case of the card
  summary: Each x_i is uniform on 1..r_i (n, r_i ≤ 100); print the expected number of inversions to six
    decimal places.
  hints:
  - The number of inversions is a count over pairs. What does linearity let you do with it?
  - E = Σ over pairs i < j of P(x_i > x_j) (Theorem 2.4.2); each probability is a count over the r_i·r_j
    outcomes.
  - For each pair, count the outcomes with x_i > x_j by looping over x_i (O(100) per pair), divide by
    r_i·r_j, and print with six decimals.
- id: ac-abc360_e
  role: ladder
  card: indicator-linearity
  rung: 2
  twist: Track one probability through K random swaps; symmetry handles all other positions.
  summary: A black ball starts at position 1 of N; K times, two random positions are swapped. Print the
    expected final position of the black ball modulo 998244353.
  hints:
  - The expected position is Σ x·P(ball at x). Do the positions other than 1 differ in probability?
  - By symmetry, all positions other than 1 are equally likely; only q = P(ball at position 1) needs tracking.
  - Update q once per swap with modular fractions; finish with E = q·1 + (1 − q)·(2 + … + N)/(N − 1).
- id: cf-235B
  role: ladder
  card: indicator-linearity
  rung: 3
  twist: A sum of squares of run lengths, rewritten as a sum over clicks.
  summary: Each of n ≤ 10^5 clicks succeeds independently with probability p_i; the score is the sum of
    the squares of the lengths of the maximal runs of successes. Print the expected score.
  hints:
  - A square of a run length is not linear. How much does one more success add to L^2?
  - Extending a run of length L to L + 1 adds 2L + 1, so the score is a sum over clicks of [success]·(2·(current
    run length before it) + 1).
  - By linearity, keep E[run length ending at i] = p_i·(E[previous] + 1) and add p_i·(2·E[previous] +
    1).
- id: lc-sum-of-all-odd-length-subarrays
  role: ladder
  card: contribution-total
  rung: 1
  twist: Base case of the card
  summary: The total of the sums of all odd-length subarrays of an array of up to 100 positive integers.
  hints:
  - 'Instead of listing the subarrays, ask: in how many odd-length subarrays does a[i] appear?'
  - Choose a left end among i + 1 positions and a right end among n − i; the length is odd when both distances
    to i have the same parity.
  - 'Count the even and odd choices on each side: ((L_even·R_even) + (L_odd·R_odd)) subarrays, times a[i]
    (Theorem 2.4.3).'
- id: ac-abc150_e
  role: ladder
  card: contribution-total
  rung: 2
  twist: Greedy order first (largest costs last), then each cost's multiplier over all pairs (S, T).
  summary: For all pairs of different 0/1 sequences S, T of length N ≤ 2·10^5, add the cheapest cost of
    turning S into T, where each change costs C_i times the number of mismatches just before it; modulo
    10^9 + 7.
  hints:
  - For one pair, in which order should the mismatched positions be fixed? (Topic 1.5.)
  - Fix them in decreasing order of C; after sorting C increasingly, C_i is paid with multiplier 1 + (number
    of larger mismatched positions).
  - 'Sum over all pairs by contribution: C_i''s multiplier over all pairs is a sum over how many of the
    N − i larger positions mismatch, a binomial sum with a closed form times 4^(N−1).'
- id: ac-abc297_f
  role: ladder
  card: contribution-total
  rung: 3
  twist: The area of the bounding box is a count of cells; each cell's probability uses inclusion–exclusion
    over four sides.
  summary: Choose K cells of an H × W grid uniformly at random (H, W ≤ 1000); print the expected number
    of cells in their bounding box modulo 998244353.
  hints:
  - The area is the number of cells inside the box. Use linearity over the cells, or over the possible
    boxes.
  - Sum over all possible boxes (i·j sizes with their positions) of area × P(the bounding box is exactly
    this box).
  - 'The number of K-subsets whose bounding box is exactly a given h × w box is an inclusion–exclusion
    over the four sides that might be empty: 16 terms of C(cells, K).'
- id: cf-1009E
  role: ladder
  card: contribution-total
  rung: 4
  twist: Sum over all 2^(n−1) rest patterns of the cost, by the multiplier of each a_i.
  summary: A journey of n ≤ 10^6 km costs a_i for the i-th km since the last rest; any subset of the n
    − 1 intermediate points may have rest sites. Print the sum of the costs over all subsets (the expected
    cost times 2^(n−1)), modulo 998244353.
  hints:
  - For one km j and a value i, in how many rest patterns is j the i-th km since the last rest?
  - 'The last rest must be exactly i km back, and the points in between must have none; the others are
    free: a power of 2.'
  - Collect, for each a_i, its multiplier 2^(n−i) + (n − i)·2^(n−i−1) (and 1 for i = n), and add a_i times
    it.
- id: ac-arc085_a
  role: ladder
  card: geometric-wait
  rung: 1
  twist: Base case of the card
  summary: A submission solves M random cases with probability 1/2 each and the others surely; resubmit
    until all pass. Print the expected total time (N ≤ 100, M ≤ 5).
  hints:
  - What is the probability that one submission passes everything?
  - '1/2^M, independently each time: the expected number of submissions is 2^M (Theorem 2.4.5).'
  - Multiply by the time of one submission, 1900·M + 100·(N − M).
- id: ac-abc194_d
  role: ladder
  card: geometric-wait
  rung: 2
  twist: Stages by the number of vertices visited, like the coupon collector.
  summary: Walk on N ≤ 10^5 vertices by jumping to a uniformly random vertex each step and adding that
    edge; the expected number of steps until the graph is connected.
  hints:
  - The graph is connected exactly when every vertex has been visited. What matters at each step?
  - With k vertices visited, a step reaches a new one with probability (N − k)/N.
  - Add N/(N − k) for k = 1, …, N − 1 (Theorem 2.4.5), and print it as a decimal.
- id: cf-1265E
  role: ladder
  card: geometric-wait
  rung: 3
  twist: Failure sends you back to the start, so the stages are not independent waits.
  summary: Ask mirrors 1..n in order; mirror i says yes with probability p_i/100; a no restarts from mirror
    1 the next day. Print the expected number of days until mirror n says yes, modulo 998244353.
  hints:
  - One round is a run of days that ends with a no or with success at mirror n. How many days does a round
    take, and how likely is success?
  - A round succeeds with probability P = p_1⋯p_n; the expected number of rounds is 1/P (Theorem 2.4.5).
  - Each round lasts 1 + p_1 + p_1 p_2 + … + p_1⋯p_(n−1) days on average; the answer is that over P, all
    modulo the prime.
- id: cses-1727
  role: ladder
  card: tail-sum
  rung: 1
  twist: Base case of the card
  summary: n ≤ 100 children each get a uniform number of candies from 1 to k ≤ 100; print the expected
    maximum to six decimal places.
  hints:
  - P(max ≤ x) is easy. Why?
  - 'The children are independent: P(max ≤ x) = (x/k)^n.'
  - E[max] = Σ_x (1 − ((x − 1)/k)^n) (Theorem 2.4.4), with doubles.
- id: cf-453A
  role: ladder
  card: tail-sum
  rung: 2
  twist: Large exponents in floating point; use ratios to avoid overflow.
  summary: The expected maximum of n ≤ 10^5 throws of an m-sided die (m ≤ 10^5), as a real number.
  hints:
  - Same formula as for a few dice; what goes wrong with x^n for n = 10^5?
  - Compute (x/m)^n with pow on the ratio, which stays between 0 and 1.
  - E[max] = Σ_x x·((x/m)^n − ((x − 1)/m)^n), or the tail-sum form.
- id: ac-abc295_e
  role: ladder
  card: tail-sum
  rung: 3
  twist: The k-th smallest instead of the maximum; each tail probability is a binomial sum over the random
    entries.
  summary: Replace each 0 of A (length N ≤ 2000, values ≤ M ≤ 2000) by a uniform value in 1..M, sort,
    and print the expected K-th element modulo 998244353.
  hints:
  - E[A_K] = Σ_x P(A_K ≥ x). When is the K-th smallest at least x?
  - When at most K − 1 elements are below x. Fixed entries are known; each random entry is below x with
    probability (x − 1)/M.
  - 'For each x, sum over how many random entries fall below x with binomial coefficients and powers modulo
