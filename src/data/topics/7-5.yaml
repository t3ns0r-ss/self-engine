drill:
- problem: lc-stone-game-ii
  answer:
    topic: '7.5'
    card: win-lose
  property: 'The positions (first pile left, M) are finitely many and every move shortens the row: the
    value of a position is the suffix sum minus the best of the opponent over x ≤ 2M, a minimax over the
    states of Theorem 7.5.1.'
  why_others_fail: A greedy choice of x does not work; the winner is decided by the future moves of the
    opponent, which the memo over (position, M) holds.
- problem: lc-stone-game-vi
  answer:
    topic: '1.1'
    card: custom-order
  property: 'A stone is worth aliceValues[i] + bobValues[i] to the pair: taking it gains for you and denies
    the opponent. Sort the stones by this sum, take them in turns, compare the totals.'
  why_others_fail: There are 5·10^4 stones, so the states are too many for a game DP; the sort by the
    sum is the only thing needed.
- problem: lc-stone-game-viii
  answer:
    topic: '3.2'
    card: linear-state
  property: 'Let dp[i] be the best difference when the leftmost i stones are already merged: dp[i] = max(dp[i
    + 1], prefix[i] − dp[i + 1]) from the right, and the answer is dp[2].'
  why_others_fail: 'A search of the game tree is exponential, and the Grundy numbers need independent
    games: it is a single scoring game, so a DP of the score difference is enough.'
- problem: cf-1728D
  answer:
    topic: '3.6'
    card: take-from-ends
  property: The remaining letters are always a substring; dp[l][r] holds the outcome win, draw or lose
    for the player to move, so it is an interval DP.
  why_others_fail: Theorem 7.5.1 alone does not help with three outcomes that depend on the comparison
    of two words; the substring is the state.
- problem: cf-455B
  answer:
    topic: '6.3'
    card: prefix-tree
  property: The positions are the prefixes of the strings, so they are the nodes of the trie; compute
    for each node whether the player to move can force a win and whether he can force a loss, then combine
    over k games.
  why_others_fail: A table of all words is not available; the trie is the game graph, and k is large,
    so only the two flags are needed.
- problem: cf-1190B
  answer:
    topic: '7.5'
    card: grundy-pattern
  property: The game is finite and has a short rule; a brute force on small piles shows that the winner
    depends on the parity of sum(a_i − i) over the sorted piles, after the first moves that lose at once
    are excluded.
  why_others_fail: A search over the piles is too big for 10^9 stones; the pattern, found with the brute
    force, gives the answer.
- problem: cf-3C
  answer:
    topic: '0.3'
    card: case-analysis
  property: 'Only one position is given: count the signs, test the eight lines and decide among the cases
    (wrong counts, two winners, a win followed by another move).'
  why_others_fail: 'There is no game tree to search: the question is about the legality of one board,
    not about optimal play.'
- problem: cf-1527B2
  answer:
    topic: '7.5'
    card: grundy-pattern
  property: Small strings can be searched by the brute force; the result depends only on the number of
    zeros and on whether the string is a palindrome (with a special case of one centre zero), a short
    case analysis found from small cases.
  why_others_fail: The strings are too long for a search over the positions; the pattern from the brute
    force is used.
lookalike_pairs:
- a: cses-1098
  b: cses-1730
  a_tool:
    topic: '7.5'
    card: grundy-sum
  b_tool:
    topic: '7.5'
    card: nim-sum
  shared_surface: Both give n heaps of sticks, a move takes sticks from one heap, and the player who cannot
    move loses.
  flipping_difference: 'In Nim Game I any number of sticks can be taken, so a heap is a Nim heap and the
    winner is decided by the xor of the sizes. In Nim Game II only 1, 2 or 3 sticks can be taken: the
    Grundy number of a heap of x sticks is x mod 4, and the xor is taken over these numbers, not over
    the sizes.'
  flipping_input: Heaps 4 and 4 with the moves 1 to 3 give the values 0 and 0 (second wins, xor of x mod
    4 is 0); heaps 1 and 2 with any move give 1 xor 2 = 3 (first wins). The heaps 3 and 4 give 3 xor 4
    = 7 in the first game and 3 xor 0 = 3 in the second, but heaps 4 alone are won in the first game and
    lost in the second.
- a: cses-2208
  b: cses-1099
  a_tool:
    topic: '7.5'
    card: grundy-pattern
  b_tool:
    topic: '7.5'
    card: nim-sum
  shared_surface: Both give a row of heaps or stairs with counters, a move takes some of them from one
    place, and the player who cannot move loses.
  flipping_difference: 'In Stair Game a move sends balls from a stair to the one below, and the answer
    is the xor of every second stair: Nim on part of the position. In Another Game the answer is an invariant
    of the parity of the heap sizes: the first player wins exactly when some heap has an odd size.'
  flipping_input: The single heap 2 is lost for the first player in Another Game; one stair with 2 balls
    on the stair 2 is won in Stair Game (the xor of p_2 is 2).
self_test:
- q: The moves of a heap game are to remove 2 or 3 sticks. Label the heaps 0 to 7 as W (the player to
    move wins) or L (Theorem 7.5.1).
  a: 0 L, 1 L, 2 W, 3 W, 4 W (to 1), 5 L (to 3 and 2, both W), 6 L (to 4 and 3, both W), 7 W (to 5).
- q: Nim with the piles 6, 10, 13. Who wins, and what is a winning move? (Theorem 7.5.2)
  a: '6 xor 10 = 12 and 12 xor 13 = 1, which is not 0, so the first player wins. The pile 13 xor 1 = 12
    is smaller than 13: take one stone from the pile 13.'
- q: Compute mex{0, 1, 3, 4} and mex{1, 2}. What does a Grundy number 0 mean?
  a: mex{0, 1, 3, 4} = 2 and mex{1, 2} = 0. A position with the Grundy number 0 is lost for the player
    to move.
- q: A heap game with the moves remove 1 or remove 2. Give g(0) … g(5), and decide who wins with the heaps
    4, 5, 7.
  a: 'g = 0, 1, 2, 0, 1, 2 (x mod 3). The heaps give 1, 2, 1: the xor is 2, so the first player wins.'
- q: 'Each heap allows only the move "remove one stone". Two heaps of one stone each: who wins, and what
    do the sum and the xor of the Grundy numbers say?'
  a: 'The first player removes a stone, the second removes the other, and the first cannot move: the second
    player wins. Each heap has g = 1; the xor is 0 (lost, correct), the sum 2 would wrongly say won.'
- q: A subtraction game has the moves 2 and 5. List the lost heaps up to 15, give the period, and decide
    whether 100 is lost (Theorem 7.5.4).
  a: 'Lost: 0, 1, 4, 7, 8, 11, 14, 15. The period is 7, the lost residues 0, 1, 4. 100 mod 7 = 2, so 100
    is a win.'
- q: After the backward search of Theorem 7.5.1 (b) a position has no label. What is it, and why can neither
    player force a win from it?
  a: It is a draw (a loop). Every move from it leads to a won position or to another unlabelled one, and
    at least one leads to an unlabelled position; each player can avoid losing by staying among the unlabelled
    positions.
checkpoint:
  time_limit_minutes: 150
  problems:
  - lc-cat-and-mouse
  - ac-abc349_e
  - cf-768E
decision_map:
- weak_signal: Two players move in turn on a position, the player who cannot move loses, and the question
    is who wins (or what the result of every start is)
  choose: win-lose
  when: 'The positions are few enough to label, or the label of a position depends only on the labels
    after a move: win if some move reaches a lost position (Theorem 7.5.1).'
  over:
  - card: memo-recursion
    topic: '3.2'
    because: A one-player best value needs only a maximum; here the opponent chooses too, and the result
      is win or lose.
  - card: state-graph
    topic: '4.1'
    because: Only reachability is asked; here the opponent also moves, and the labels alternate.
- weak_signal: 'Several piles or a pile of numbers, a move changes one pile, and any number of stones
    may be taken (or a very simple structure: a run of heaps, stairs)'
  choose: nim-sum
  when: Each pile is a Nim heap, so the first player wins exactly when the xor of the sizes is not 0 (Theorem
    7.5.2).
  over:
  - card: win-lose
    topic: '7.5'
    because: The number of positions is too large to label; the xor decides without labelling.
  - card: grundy-sum
    topic: '7.5'
    because: Here every heap allows any removal; if the moves are restricted, the heap size is not its
      Grundy number.
- weak_signal: Independent games added together (piles, numbers, intervals, primes), each with its own
    move rule, and the first player who cannot move loses
  choose: grundy-sum
  when: 'A game splits into parts that do not affect each other: compute the Grundy number of each part
    by the mex and xor them (Theorem 7.5.3).'
  over:
  - card: nim-sum
    topic: '7.5'
    because: The Grundy number of a part is not its size unless every removal is allowed.
  - card: win-lose
    topic: '7.5'
    because: A table over the product of the parts is too large; the numbers of the parts are combined
      with the xor.
- weak_signal: 'A game whose rule is simple but whose answer for large parameters is unclear: a subtraction
    set, a parity or period, a rule with a previous move'
  choose: grundy-pattern
  when: Write a brute force, print the labels or Grundy numbers for small inputs, find the period or the
    case rule, and prove it by induction (Theorem 7.5.4).
  over:
  - card: win-lose
    topic: '7.5'
    because: The parameter is too large for the table; only the pattern fits.
  - card: case-analysis
    topic: '0.3'
    because: The pattern must be proved and checked against a brute force; a guess without proof is not
      enough.
