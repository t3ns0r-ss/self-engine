# Topic 1.6 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.6'
uses:
  - topic: '0.1'
    what: '64-bit integers: window sums reach 10^14 and the sum of all minima exceeds 10^18'
  - topic: '0.2'
    what: Amortised analysis (Theorem 0.2.4), which bounds the total number of pops
  - topic: '0.4'
    what: Modular arithmetic, for answers printed modulo a prime
  - topic: '0.5'
    what: Brute force, the baseline every test compares against
  - topic: '0.6'
    what: The STL stack, deque and multiset; the multiset is the slower alternative to the deque
  - topic: '1.1'
    what: Sorting, the right tool when a problem asks about subsequences or ranks instead of subarrays
  - topic: '1.2'
    what: 'Prefix sums: sums over a span, and the difference array in Example 1'
  - topic: '1.3'
    what: 'Two pointers: fixed and shrinkable windows, which the deque equips with their maximum and minimum'
  - topic: '1.4'
    what: Binary search, the alternative to a stack in two of the stretch problems
  - topic: '1.5'
    what: 'Greedy: a few stack problems are greedy rules proved by a dominance argument'
theorems:
  - id: 1.6.1
    title: A monotonic stack finds every nearest greater element in O(n)
    plain_words: Keep a pile of positions whose values never go up from bottom to top. A new value removes
      everything smaller from the top of the pile, and each removed position has just found its next greater
      element.
    code: 1.6/thm-1
  - id: 1.6.2
    title: Each element decides the subarrays inside its span
    plain_words: Every subarray has one rightmost smallest element. The subarrays that a given element
      decides are those that start after the nearest smaller element on its left and end before the nearest
      smaller-or-equal element on its right, so their number is a product of two distances.
    code: 1.6/thm-2
  - id: 1.6.3
    title: A monotonic deque keeps the maximum of a sliding window at its front
    plain_words: In a window that moves right, an element followed by a larger or equal one can never
      be the maximum again. A deque that keeps only the elements not dominated this way has the window
      maximum at its front.
    code: 1.6/thm-3
cards:
  - id: nearest-greater
    name: Nearest greater or smaller element
    decisive_property: Each position needs the nearest element to one side that is greater (or smaller)
      by a plain comparison, and an element answered by a later, larger one is never needed again; so
      a monotonic stack gives every answer in O(n), each element pushed and popped once.
    from_theorem: 1.6.1
    how_to_test: Ask, for an element that has just been answered by a larger one, whether it can still
      matter for any later position. If not, it can be popped.
    constraint_shapes:
      - 'One array of n up to 2·10^5 and one answer per element: scanning right from every position until
        a larger value appears costs about n²/2 = 2·10^10 steps on a falling array, so the answers must
        come from one pass.'
    weak_signals:
      - form: Asks, for every element, for the next warmer day, the next greater element, or how far it
          can see
        shape: One array with n ≥ 10^5; the output is one position or one distance per element; the relation
          is a plain comparison of values
      - form: Asks to delete at most k elements so that what is left is the smallest or largest possible
          in dictionary order
        shape: A digit string or array with n ≥ 10^5; the kept elements keep their order; a deleted element
          is always followed by a smaller one
      - form: Asks for the first position on one side that beats the current element
        shape: Several answers of the form "nearest position to the left (or right) whose value is larger",
          sizes of 10^5 or more
    kill_signals:
      - The relation is not a comparison of values. For "the nearest element to the right that is a multiple
        of a_i" on (2, 3, 4), the element 3 is larger than 2 but is not the answer, and the element 4
        after it is.
      - The array changes between questions. After a_3 is changed in (3, 1, 2), an answer stored earlier
        for position 2 may no longer be true.
    in_action:
      statement: Given the temperatures of n days, print for every day how many days pass until a warmer
        day (0 if there is none).
      constraints: n ≤ 2·10^5, 1 ≤ t_i ≤ 10^9.
      budget: 'Scanning forward from every day: up to n²/2 = 2·10^10 comparisons on a falling sequence.
        At about 10^8 simple steps per second that is over 200 seconds, so about O(n) is needed.'
      candidates:
        - tool: Scan forward from every day (nested loops, topic 0.5)
          verdict: rejected
          because: About 2·10^10 steps in the worst case.
        - tool: Sort the days by temperature (topic 1.1)
          verdict: rejected
          because: Sorted order forgets positions, and the answer is the first warmer day by position.
        - tool: Monotonic stack (this topic)
          verdict: chosen
          because: O(n), if the property below holds.
      property_check: Day j is waiting for a warmer day. Any day between j and today that is also waiting
        is at most as warm as j (otherwise it would have answered j). So the waiting days form a pile
        whose temperatures never rise from bottom to top, and a new day answers a run from the top. An
        answered day is never needed again. The relation is a plain comparison, so the property holds.
      decision: Monotonic stack, O(n).
    examples:
      positive:
        - inline:
            input: t = [5, 3, 8, 4, 2, 9]
            answer: 2,1,3,2,1,0
            why: Each day waits for the first strictly warmer day and is never needed again once answered;
              the stack and a double loop both give 2,1,3,2,1,0.
        - worked_example: ac-abc372_d
          why: The counted buildings are the new records seen from position i + 1, which is the nearest-taller
            structure of this card.
      negative:
        - inline:
            input: a = [3, 1, 2]; ask for the next greater element of position 1, change a[2] to 0, then
              ask again
            answer: -1 (none)
            method_gives: '2'
            why: The stack answers were computed before the change, so position 2 is still reported although
              its value dropped to 0. The property needs one fixed array.
          correct_tool:
            topic: '0.5'
            card: nested-loops
        - inline:
            input: a = [2, 3, 4]; nearest later position whose value is a multiple of a[0]
            answer: '2'
            method_gives: '1'
            why: Popping on the comparison 'greater' removes the element 2 as soon as 3 arrives, but 3
              is not a multiple of 2 and 4 is. An answered element must stay answered; here the relation
              is not a comparison.
          correct_tool:
            topic: '0.5'
            card: nested-loops
    lookalikes:
      - description: For each element, the smallest later value that is larger than it (the next larger
          value in value order, not the nearest one by position)
        tool:
          topic: '0.6'
          card: ordered-set-lookup
        flipping_difference: 'The stack answers by position: the nearest larger element. Here the answer
          is the closest value above a_i among later elements, which may lie farther away than the nearest
          larger one, so a set ordered by value is needed.'
    complexity: O(n) amortised.
  - id: element-span
    name: Span of an element
    decisive_property: The quantity is a sum or maximum over all subarrays of their minimum (or maximum),
      or a rectangle limited by its lowest bar. Each element decides exactly the subarrays inside its
      span between the previous smaller and the next smaller element, with ties broken on one side, so
      its contribution comes from two stack scans.
    from_theorem: 1.6.2
    how_to_test: Fix the element that decides the subarray (its minimum or lowest bar) and check that
      the subarrays it decides are all those with l in one range and r in another range.
    constraint_shapes:
      - 'One array with n up to 2·10^5 and a sum over all subarrays: there are n(n+1)/2 ≈ 2·10^10 subarrays,
        so each must not be visited, and the total can reach 10^9 · n²/2 ≈ 2·10^19, which needs a modulus
        or a wide type.'
    weak_signals:
      - form: Asks for the sum (or maximum) of the minimum over all subarrays
        shape: One array with n ≥ 10^5; the answer is usually printed modulo a prime; the value of a subarray
          is one of its own elements
      - form: Asks for the largest rectangle under bars, or the largest all-ones rectangle in a grid
        shape: Bar heights up to 10^9 and n ≥ 10^5 (or a grid whose rows are turned into bar heights)
      - form: Asks for the best value of the form "minimum times length" or "minimum times sum" over subarrays
        shape: One array with n ≥ 10^5, non-negative values, a product of a minimum with a size
    kill_signals:
      - The quantity is the sum of all elements of each subarray; that is a difference of prefix sums,
        not a question about one deciding element (topic 1.2). On (3, 1, 2) the answer is 19, but the
        span formula gives 9.
      - The quantity is taken over subsequences instead of subarrays. On (2, 1, 4) the minima of all subsequences
        add up to 12, but the span formula gives 10.
    in_action:
      statement: Given n integers, print the sum of the minimum of every subarray modulo 10^9 + 7.
      constraints: n ≤ 2·10^5, 1 ≤ a_i ≤ 10^9.
      budget: 'All subarrays: n(n+1)/2 ≈ 2·10^10 minima even with a running minimum. At about 10^8 simple
        steps per second that is over 200 seconds, so about O(n) is needed.'
      candidates:
        - tool: Running minimum for every left end (nested loops, topic 0.5)
          verdict: rejected
          because: About 2·10^10 steps.
        - tool: Prefix sums (topic 1.2)
          verdict: rejected
          because: A minimum is not a difference of prefix values.
        - tool: Span of each element from two monotonic stacks (this topic)
          verdict: chosen
          because: O(n), if each subarray has one deciding element.
      property_check: Every subarray has a rightmost minimum, so each subarray is counted by exactly one
        element. For the element at position i, the subarrays it decides start after the previous smaller
        element and end before the next smaller-or-equal element, so they form a rectangle of (i − L)(R
        − i) choices. Both nearest elements come from Theorem 1.6.1. Holds.
      decision: Sum of a_i · (i − L_i) · (R_i − i), with L from the previous strictly smaller element
        and R from the next smaller-or-equal element. O(n).
    examples:
      positive:
        - inline:
            input: a = [2, 4, 1, 3], the sum of the minima of all subarrays
            answer: '17'
            why: Every subarray has one rightmost minimum, so the spans count each subarray once; the
              formula and the ten subarrays added directly both give 17.
        - inline:
            input: bars h = [1, 3, 5, 6, 2, 2, 4], the largest rectangle under the bars
            answer: '12'
            why: The best rectangle has some lowest bar. The bars 2 at positions 4 and 5 stretch over
              positions 1 to 6, so the area is 2 · 6 = 12, found as the largest span times height.
      negative:
        - inline:
            input: a = [3, 1, 2], the sum of all elements of every subarray
            answer: '19'
            method_gives: '9'
            why: A subarray's sum is not decided by one element, so the span formula answers a different
              question (the sum of minima, 9). The sums are differences of prefix values.
          correct_tool:
            topic: '1.2'
            card: range-sum
        - inline:
            input: a = [2, 1, 4], the sum of the minimum over all non-empty subsequences
            answer: '12'
            method_gives: '10'
            why: A span counts only contiguous pieces, so it misses subsequences such as (2, 4), whose
              minimum is 2. Sorting the values and counting by rank handles subsequences.
          correct_tool:
            topic: '1.1'
            card: sort-then-scan
    lookalikes:
      - description: The best "mountain" arrangement of tower heights when n ≤ 1000
        tool:
          topic: '0.5'
          card: nested-loops
        flipping_difference: With n ≤ 10^3 an O(n) walk for each possible peak is only 10^6 steps, so
          no span is needed; at n = 10^5 those walks would cost 10^10.
      - description: The sum of all elements of every subarray
        tool:
          topic: '1.2'
          card: range-sum
        flipping_difference: No single element decides a subarray here; element i lies in (i + 1)(n −
          i) subarrays, so its total contribution is a_i · (i + 1)(n − i) with no stack at all.
    complexity: O(n) for all spans.
  - id: window-deque
    name: Sliding window extremes
    decisive_property: A window moves only to the right and only its maximum (or minimum) is needed at
      every step. An element dominated by a later, larger element in the window is never needed again,
      so a monotonic deque keeps the maximum at its front in O(1) amortised per step, also inside shrinkable
      windows.
    from_theorem: 1.6.3
    how_to_test: Check that both window ends only move right and that only the window's maximum or minimum
      is needed (not a median or a count).
    constraint_shapes:
      - 'n up to 10^6 and a window of length k: recomputing each window''s maximum costs (n − k + 1) ·
        k steps, which is n²/4 = 2.5·10^11 when k = n/2, so each step must be O(1) amortised.'
    weak_signals:
      - form: Asks for the maximum (or minimum) of every window of k consecutive elements
        shape: One array with n ≥ 10^5 and one window length k that may be large; one output per window
      - form: Asks for the longest subarray in which the maximum minus the minimum is at most a limit
        shape: One array with n ≥ 10^5 and a bound on max − min; both ends of the subarray only move right
      - form: Asks for the best earlier prefix sum within the last k or within a range of allowed lengths
        shape: Subarray length between a and b, n ≥ 10^5, sums up to 10^14, so the best start is the smallest
          prefix sum in a moving range
    kill_signals:
      - The window needs its median or another middle element. For (1, 5, 2, 4) and k = 3 the maxima are
        5, 5 but the medians are 2, 4, so dominated elements still matter.
      - The left end can move back, or queries arrive as arbitrary ranges. For (1, 7, 2, 3, 4), a deque
        kept for the window [2, 4] has already lost position 1, so a query on [0, 4] would be answered
        with 4 instead of 7.
    in_action:
      statement: Given n numbers and k, print the maximum of every window of k consecutive numbers.
      constraints: n ≤ 10^6, 1 ≤ k ≤ n, |a_i| ≤ 10^9.
      budget: 'Scanning each window: (n − k + 1) · k steps, which is n²/4 = 2.5·10^11 at k = n/2. At about
        10^8 simple steps per second that is about 40 minutes, so about O(n) is needed.'
      candidates:
        - tool: Recompute the maximum of each window (nested loops, topic 0.5)
          verdict: rejected
          because: (n − k + 1) · k steps, up to 2.5·10^11.
        - tool: Fixed window with a running sum (topic 1.3)
          verdict: rejected
          because: A sum can be undone when an element leaves; a maximum cannot.
        - tool: A multiset of the window (topic 0.6)
          verdict: rejected
          because: O(n log n) works, but n = 10^6 with a heavy constant is tight; the deque is O(n).
        - tool: Monotonic deque (this topic)
          verdict: chosen
          because: O(n), if the property below holds.
      property_check: Both ends of the window only move right, and only the maximum is asked. A position
        j is dominated once a later position in the window has a value at least as large; every later
        window containing j also contains that position, so j never becomes the maximum. Holds.
      decision: Monotonic deque, O(n).
    examples:
      positive:
        - inline:
            input: a = [5, 1, 3, 2, 6, 4], k = 3
            answer: 5,3,6,6
            why: Both window ends move right and only the maximum is asked, so dominated elements can
              be dropped for good; the deque and the direct scan give 5,3,6,6.
        - worked_example: cses-1644
          why: The best start for a right end is the smallest prefix sum in a range whose two ends only
            move right.
      negative:
        - inline:
            input: a = [1, 5, 2, 4], k = 3, the median of every window
            answer: 2,4
            method_gives: 5,5
            why: A median is not an extreme. The deque discards 1 and 2 as dominated, yet the median of
              the first window is 2.
          correct_tool:
            topic: '0.6'
            card: ordered-set-lookup
        - inline:
            input: a = [1, 7, 2, 3, 4]; the maximum of a[2..4], then of a[0..4]
            answer: 4,7
            method_gives: 4,4
            why: The window's left end moved back for the second query, but the deque dropped position
              1 when it left the first window.
          correct_tool:
            topic: '0.5'
            card: nested-loops
    lookalikes:
      - description: The median of every window of length k
        tool:
          topic: '0.6'
          card: ordered-set-lookup
        flipping_difference: A median is not an extreme, so dominated elements can still become the answer;
          two multisets balanced around the middle keep it.
    complexity: O(n) amortised.
problems:
  - id: ac-abc372_d
    role: worked_example
    summary: For each of N ≤ 2·10^5 buildings with distinct heights, count the later buildings taller
      than everything between.
  - id: cses-1644
    role: worked_example
    summary: The largest sum of a subarray of n ≤ 2·10^5 integers whose length is between a and b.
  - id: lc-next-greater-element-i
    role: ladder
    card: nearest-greater
    rung: 1
    twist: Base case of the card
    summary: nums1 is a subset of nums2 (distinct values, lengths ≤ 1000); for each value of nums1, the
      next greater value after it in nums2, or −1.
    hints:
      - Answer the question for every value of nums2 first; nums1 only selects some of the answers.
      - One scan of nums2 with a stack of values whose next greater is not found yet (Theorem 1.6.1).
        Store each answer in a map from value to next greater.
      - Pop while top < x and set next[top] = x; push x. Values left on the stack get −1. Then look up
        every value of nums1.
  - id: lc-final-prices-with-a-special-discount-in-a-shop
    role: ladder
    card: nearest-greater
    rung: 2
    twist: The next smaller-or-equal element instead of the next greater one.
    summary: Prices of n ≤ 500 items; item i is discounted by the first later price that is ≤ its own;
      print the final prices.
    hints:
      - Which later item gives the discount, in the words of this topic?
      - The next smaller-or-equal element. Reverse the comparison of Theorem 1.6.1 and include equality
        in the pop condition.
      - Pop while prices[top] ≥ prices[i] and subtract prices[i] from the popped item's price; push i.
  - id: lc-daily-temperatures
    role: ladder
    card: nearest-greater
    rung: 3
    twist: The answer is a distance, so the stack must hold positions, not values.
    summary: For each of n ≤ 10^5 daily temperatures, the number of days until a warmer one (0 if never).
    hints:
      - What does the stack need to store to compute a distance?
      - Positions. The value is read as temperatures[position].
      - Pop while temperatures[top] < temperatures[i] and set answer[top] = i − top; push i. The rest
        stay 0.
  - id: cses-1645
    role: ladder
    card: nearest-greater
    rung: 4
    twist: The previous smaller element, read from the top when an element is pushed instead of when it
      is popped.
    summary: For each position of an array (n ≤ 2·10^5), the nearest position to its left with a smaller
      value, or 0.
    hints:
      - Which earlier positions can never be the answer for anything further right?
      - Any earlier position whose value is ≥ the current one is hidden behind it. Pop them; the top that
        remains is the answer (Theorem 1.6.1, part 3, with the comparison reversed).
      - Pop while x[top] ≥ x[i]; print top + 1 (1-based) or 0 if empty; push i. Use fast input and output.
  - id: lc-online-stock-span
    role: ladder
    card: nearest-greater
    rung: 5
    twist: The values arrive one at a time, and each must be answered before the next arrives.
    summary: A stream of ≤ 10^4 daily prices; for each, the number of consecutive days up to today with
      a price ≤ today's.
    hints:
      - The span ends at the previous day with a strictly greater price. Does the left-to-right stack
        need to see the future?
      - 'No: the previous greater element is the top after popping, so each price is answered as it arrives.
        Store (price, day index) or (price, span) on the stack.'
      - Pop while the top's price ≤ price; the span is today − top's day (or today + 1 if the stack is
        empty); push today.
  - id: lc-next-greater-element-ii
    role: ladder
    card: nearest-greater
    rung: 6
    twist: The array is circular; the next greater element may come after wrapping around.
    summary: A circular array of n ≤ 10^4 integers; for each element, the next greater value going around,
      or −1.
    hints:
      - How long a straight array contains, after each position, every element that comes next around
        the circle?
      - 'Two copies of the array: run the usual scan over i = 0 .. 2n − 1 with index i mod n.'
      - Pop while nums[top] < nums[i mod n] and set answer[top] = nums[i mod n]; push i mod n only during
        the first n steps.
  - id: ac-abc379_f
    role: ladder
    card: nearest-greater
    rung: 7
    twist: Queries about a stack of an earlier step; answer them offline and binary search the stack.
    summary: N ≤ 2·10^5 buildings with distinct heights and Q ≤ 2·10^5 queries (l, r); count the buildings
      east of r visible from both l and r.
    hints:
      - A building j > r visible from l, is it always visible from r?
      - 'Yes: nothing between l and j is taller than j, so nothing between r and j is either. So the answer
        counts the buildings visible from l with position > r.'
      - 'Sort the queries by l and scan l from right to left, keeping the stack of buildings visible from
        l (as in Section 8, Example 1). Positions on the stack increase from top to bottom: binary search
        for the first one > r (topic 1.4).'
  - id: cses-1142
    role: ladder
    card: element-span
    rung: 1
    twist: Base case of the card
    summary: n ≤ 2·10^5 boards of width 1 and heights ≤ 10^9; the largest area of a rectangle that fits
      on the fence.
    hints:
      - The best rectangle has a lowest board. How far can a rectangle of that height extend?
      - To the nearest strictly lower board on each side (Theorem 1.6.2, part 3).
      - Two stack scans for the nearest lower board on the left and on the right; the area is h[i]·(R
        − L − 1) in long long.
  - id: lc-sum-of-subarray-minimums
    role: ladder
    card: element-span
    rung: 2
    twist: Count every subarray once, which needs the tie rule, and answer modulo 10^9 + 7.
    summary: The sum of min(b) over every subarray b of an array (n ≤ 3·10^4, values ≤ 3·10^4), modulo
      10^9 + 7.
    hints:
      - In how many subarrays is arr[i] the minimum? What goes wrong when two minima are equal?
      - '(i − L)(R − i) with L the previous strictly smaller and R the next smaller-or-equal element:
        strict on one side only (Theorem 1.6.2).'
      - Two stack scans for L and R; add arr[i]·(i − L)·(R − i) in long long and reduce modulo 10^9 +
        7 (topic 0.4).
  - id: lc-largest-rectangle-in-histogram
    role: ladder
    card: element-span
    rung: 3
    twist: The same question in one scan, computing each bar's area at the moment it is popped.
    summary: Bars of width 1 and heights h_i (n ≤ 10^5, h_i ≤ 10^4); the largest rectangle under them.
    hints:
      - When bar j is popped by bar i, which two bars bound its rectangle?
      - On the right, i (the first lower bar); on the left, the new top after the pop.
      - Append a bar of height 0 so that every bar is popped; when j is popped, the area is h[j]·(i −
        top − 1), with top = −1 for an empty stack.
  - id: cses-3221
    role: ladder
    card: window-deque
    rung: 1
    twist: Base case of the card
    summary: An array of n ≤ 10^7 values made by a given generator; print the XOR of the minima of all
      windows of k elements.
    hints:
      - n = 10^7 rules out O(n log n) with a large constant. Which structure gives each window's minimum
        in O(1) amortised?
      - A monotonic deque with values increasing from front to back (Theorem 1.6.3 with the comparison
        reversed).
      - Generate the values into an array; pop the back while ≥ x_i, push i, pop the front if ≤ i − k,
        and XOR the front's value into the answer from i = k − 1 on.
  - id: lc-longest-continuous-subarray-with-absolute-diff-less-than-or-equal-to-limit
    role: ladder
    card: window-deque
    rung: 2
    twist: The left end moves irregularly, and the window needs both its maximum and its minimum.
    summary: The longest subarray of n ≤ 10^5 values in which every two elements differ by at most limit.
    hints:
      - Every two elements differ by at most limit exactly when max − min ≤ limit. Is that condition kept
        when the window shrinks?
      - Yes, so the shrinkable window of topic 1.3 applies; two deques give the maximum and the minimum.
      - For each right end, push it to both deques; while max − min > limit, move l and pop any front
        < l. Answer the longest window.
  - id: lc-continuous-subarrays
    role: ladder
    card: window-deque
    rung: 3
    twist: Count all valid windows instead of finding the longest one.
    summary: The number of subarrays of n ≤ 10^5 values in which every two elements differ by at most
      2.
    hints:
      - For a fixed right end r, which left ends give a valid window?
      - All l from the smallest valid left end up to r, because a valid window stays valid when it shrinks.
        That is r − l + 1 windows.
      - The same two-deque window as the previous rung; add r − l + 1 for each right end, in long long
        (the count reaches 5·10^9).
  - id: lc-remove-k-digits
    role: drill
    summary: Remove k digits from a number given as a string of n ≤ 10^5 digits to make it as small as
      possible.
  - id: lc-maximum-width-ramp
    role: drill
    summary: The largest j − i with i < j and nums[i] ≤ nums[j] (n ≤ 5·10^4).
  - id: lc-car-fleet
    role: drill
    summary: n ≤ 10^5 cars drive to a target on one lane and cannot pass, so a faster car joins the slower
      one ahead; the number of groups that arrive.
  - id: lc-sum-of-subarray-ranges
    role: drill
    summary: The sum of (largest − smallest) over all subarrays of n ≤ 1000 integers.
