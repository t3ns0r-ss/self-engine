decision_map:
- weak_signal: '"In which order should the tasks be done", total waiting time, deadlines and durations'
  choose: exchange-order
  when: Comparing two adjacent items in both orders gives a key, independent of the others (Theorem 1.5.1).
  over:
  - card: permutations
    because: Trying all n! orders works only for n up to about 10.
    topic: '0.5'
  - card: custom-order
    because: A custom sort applies an order the statement gives; here the order must first be derived
      and proved.
    topic: '1.1'
- weak_signal: The most non-overlapping intervals, or the fewest points that hit every interval
  choose: interval-selection
  when: Every interval counts the same, and overlap follows the statement's rule for touching ends (Theorem
    1.5.2).
  over:
  - card: subset-bitmask
    because: All subsets of intervals are 2^n.
    topic: '0.5'
  - card: event-sweep
    because: A sweep measures overlap at each moment; choosing which intervals to keep needs the earliest-end
      rule.
    topic: '1.1'
- weak_signal: Intervals or time ranges with coordinates up to 10^9; the busiest moment; totals per day
  choose: interval-selection
  when: The question is which intervals to keep (or where to place points), not how many overlap at a
    time.
  over:
  - card: event-sweep
    because: The maximum overlap answers "how many groups", but not "how many can be kept".
    topic: '1.1'
- weak_signal: '"The fewest items to reach a total", "the largest total with at most k items", goods that
    can be split'
  choose: extreme-first
  when: Items (or units) contribute independently and the only limit is their number (Theorem 1.5.3).
  over:
  - card: subset-bitmask
    because: Subsets are 2^n; independence makes the k best items optimal without trying them.
    topic: '0.5'
  - card: sort-then-scan
    because: Sorting is the same first step, but the proof that the extreme items are best is what licenses
      stopping early.
    topic: '1.1'
- weak_signal: 'Children and cookies, people and seats: pair items of two lists, each used at most once'
  choose: sorted-matching
  when: Whether a pair works is a threshold in one sorted order, so pairs never need to cross (Theorem
    1.5.4).
  over:
  - card: merge-walk
    because: The walk is the implementation; the matching proof says which partner to take when several
      work.
    topic: '1.3'
  - card: permutations
    because: Trying all assignments is n!.
    topic: '0.5'
- weak_signal: '"Minimise the maximum", "maximise the minimum", "the least time / capacity / speed such
    that …"'
  choose: sorted-matching
  when: The quantity is decided by how two sorted lists (or one list with itself) are paired, as in "minimise
    the largest pair sum".
  over:
  - card: answer-search
    because: A search needs a check; when the best pairing is known directly, the check is unnecessary.
    topic: '1.4'
- weak_signal: '"Can you reach the end", the fewest jumps or segments to cover, fix the first violation
    from the left'
  choose: left-to-right-forced
  when: A small state after each position (a reach, the change in the till) decides the rest, and the
    greedy choice reaches the best state (Theorem 1.5.5).
  over:
  - card: direct-simulation
    because: Simulating every possible sequence of choices branches; the dominating state removes the
      branching.
    topic: '0.3'
  - card: recursive-choices
    because: Recursion over all choices is exponential.
    topic: '0.5'
