  hints:
  - Is the stone alone enough to describe the situation? What decides the next jumps?
  - The state is (stone, last jump k). The position grows with every jump, so there is no cycle. k is
    at most the number of the stone.
  - From each reachable state try k − 1, k, k + 1 (above 0) to stones that exist (a map from the position
    to the stone); the answer is yes if some state at the last stone is reached. n² states in all.
- id: cf-505C
  role: ladder
  card: state-dag
  rung: 3
  twist: The state keeps only the offset of the jump length, which stays within about 250 of the first
