drill:
- problem: lc-different-ways-to-add-parentheses
  answer:
    topic: '3.6'
    card: merge-split
  property: The operator applied last splits the expression into a left and a right part that are evaluated
    independently; the values of a segment come from the values of its two parts, memoised by segment.
  why_others_fail: Evaluating left to right gives one value; listing bracketings without memoisation repeats
    the same segments many times.
- problem: lc-unique-binary-search-trees
  answer:
    topic: '3.6'
    card: merge-split
  property: 'The root k splits the keys into the ranges below and above it, which form independent subtrees:
    trees(range) = Σ over roots of trees(left) · trees(right), and only the length of a range matters.'
  why_others_fail: Listing the trees is far too many for n = 19; a product rule does not apply because
    the sizes of the two sides vary with the root.
- problem: lc-palindrome-partitioning-iii
  answer:
    topic: '3.6'
    card: palindrome-segment
  property: The cost of making s[l..r] a palindrome comes from s_l, s_r and the inside (one change per
    mismatched pair), an interval table; then a table over (prefix, pieces) picks the last piece.
  why_others_fail: Fixing letters greedily from the outside ignores where the cuts go; trying all cut
    sets is C(99, k − 1).
- problem: lc-palindrome-partitioning-iv
  answer:
    topic: '3.6'
    card: palindrome-segment
  property: With the table pal[l][r] built in O(n²), each choice of the two cut points is checked in O(1),
    O(n²) pairs in all.
  why_others_fail: Checking each piece directly is O(n) per pair, O(n³) = 8·10^9; taking the longest palindrome
    first can block the other two.
- problem: cses-1744
  answer:
    topic: '3.6'
    card: merge-split
  property: 'Each cut splits a piece into two smaller rectangles that are cut independently: moves[a][b]
    = 1 + min over all cut positions of the two parts, 0 for a square.'
  why_others_fail: 'Cutting off the largest square each time (as in Euclid''s algorithm) is not optimal:
    a 5 × 6 rectangle needs 4 cuts, the greedy uses 5. The table tries every cut.'
- problem: lc-minimum-operations-to-reduce-x-to-zero
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: Whatever the order, the removed elements are a prefix and a suffix, so what stays is one window
    with sum total − x; with positive values the longest such window is found with a shrinkable window.
  why_others_fail: A segment table over 10^5 elements is 10^10 states; the order of removals does not
    matter here, only the total.
- problem: lc-longest-palindrome-by-concatenating-two-letter-words
  answer:
    topic: '0.6'
    card: map-counting
  property: 'The order is free, so count the words: each pair "xy" with "yx" adds 4 letters, each pair
    of "xx" adds 4, and one leftover "xx" may go in the middle.'
  why_others_fail: Palindrome tables need a fixed string; here the words can be arranged, so only their
    counts matter.
- problem: lc-minimum-number-of-moves-to-make-palindrome
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: The leftmost letter must end up paired with an equal letter at the right end; moving the nearest
    such letter from the right outwards is never worse, so the pairs are forced one by one (the single
    odd letter moves inwards).
  why_others_fail: An interval table over [l, r] does not capture the swaps, which change the string;
    trying all swap sequences is exponential.
lookalike_pairs:
- a: lc-predict-the-winner
  b: lc-stone-game
  a_tool:
    topic: '3.6'
    card: take-from-ends
  b_tool:
    topic: '0.4'
    card: parity
  flipping_difference: 'The same game. In B the number of piles is even, so the first player can force
    taking exactly the piles at even positions (or odd ones), and with an odd total one of these sets
    is larger: the answer is always yes. In A the count may be odd and ties count, so the game must be
    evaluated with the table.'
  shared_surface: Both are two-player games on a row of piles.
  flipping_input: 'A: the row 3 9 1 2 with ties counting, where the table gives the first player 11 of
    15. B: an even number of piles, where the first player can force all even-position (or all odd-position)
    piles and the answer is always yes, by a parity argument.'
- a: lc-longest-palindromic-subsequence
  b: lc-longest-palindromic-substring
  a_tool:
    topic: '3.6'
    card: palindrome-segment
  b_tool:
    topic: '0.5'
    card: nested-loops
  flipping_difference: 'Both ask for the longest palindrome inside s. A subsequence (A) may skip letters,
    so the best one for [l, r] depends on dropping either end: a table. A substring (B) is contiguous,
    determined by its centre and length, so growing it from every centre finds it in O(n²) with no table.'
  shared_surface: Both ask for the longest palindrome inside a string.
  flipping_input: 'A: for abcab the longest palindromic subsequence is 3 (aba), which skips letters and
    needs the table. B: the longest palindromic substring is 1, found by expanding around each of the
    2n − 1 centres with no table.'
self_test:
- q: Fill the merging table for piles (4, 1, 2, 3). What is the answer, and which split does the last
    merge use?
  a: 19. The rows are 0 5 10 19 / 0 3 9 / 0 5 / 0; for [1, 4] the split k = 1 gives 0 + 9, k = 2 gives
    5 + 5, k = 3 gives 10 + 0, so k = 1 (piles 4 | 1, 2, 3) and the last merge costs the total 10.
- q: Why does filling the table for l = 1, 2, …, n with r increasing inside give wrong answers?
  a: best[1][r] needs best[2][r], a segment with a larger left end, which this order has not computed
    yet (it still holds 0). Loop over the length outside, or over l downwards.
- q: Players take from the ends of (3, 9, 1, 2). What is the score difference for the first player, what
    is the first player's total, and what does "take the larger end" give?
  a: 'D = 7, so the first total is (15 + 7) / 2 = 11 (take 2 first). The greedy takes 3, then the opponent
    takes 9: totals 5 and 10.'
- q: What is the longest palindromic subsequence of "abcab", and how many letters must be inserted to
    make it a palindrome?
  a: 3 (for example "aba"); the other 2 letters each need an inserted partner, so 5 − 3 = 2 insertions.
- q: How many operations clear "abaca" if one operation deletes a block of equal letters? Which partner
    does the first a choose in the recurrence?
  a: '3: delete b, delete c, then aaa. The first a pairs with the a at position 3: C[2][2] + C[3][5] =
    1 + 2.'
- q: In Burst Balloons, why choose the balloon burst last in an open interval (l, r), not the first?
  a: After the first burst the neighbours of the other balloons change, so the two sides are not independent.
    The last balloon k in (l, r) has neighbours l and r when it bursts, and the balloons on its two sides
    never become neighbours of each other.
- q: For a string of length 1000, which tool finds the longest palindromic substring, and which the longest
    palindromic subsequence?
  a: 'Substring: expand around each centre, O(n²), no table. Subsequence: the segment table of Theorem
    3.6.4, also O(n²), because letters may be skipped.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - cf-1509C
  - cf-607B
  - cf-149D
decision_map:
- weak_signal: Merge neighbours, cut, bracket or triangulate; the order of operations changes the cost;
    n ≤ 500
  choose: merge-split
  when: Some last (or first) event splits the segment into independent parts and costs a function of l,
    r and the split point (Theorem 3.6.2).
  over:
  - card: heap-extract
    because: If any two items may be merged, not only neighbours, the two smallest first is optimal (Huffman),
      with a heap.
    topic: '0.6'
  - card: extreme-first
    because: Greedy "cheapest neighbouring pair first" fails, as (2, 2, 1, 2) shows.
    topic: '1.5'
- weak_signal: Take from the left or the right end; two players play optimally
  choose: take-from-ends
  when: Only ends are removed, so the rest is a segment; store the score difference of the player to move
    (Theorem 3.6.3).
  over:
  - card: fixed-window
    because: With one player and exactly k removals that are all counted the same, the remaining part
      is one window of fixed length.
    topic: '1.3'
  - card: extreme-first
    because: Taking the larger end each time fails, as (3, 9, 1, 2) shows.
    topic: '1.5'
- weak_signal: 'Palindromes: longest, fewest insertions, cut into palindromes, count them'
  choose: palindrome-segment
  when: The answer for [l, r] depends on s_l = s_r and the inner segments (Theorem 3.6.4); for cuts, the
    palindrome table feeds a table over prefixes.
  over:
  - card: nested-loops
    because: The longest palindromic substring alone is found by expanding around each centre.
    topic: '0.5'
  - card: lcs
    because: The longest palindromic subsequence is also the LCS with the reverse; the segment table is
      the direct form and extends to partitions.
    topic: '3.4'
- weak_signal: Remove blocks or pairs; the parts left and right of a removed block join and can be removed
    together later
  choose: first-element-match
  when: The first element goes alone or with a later partner k after (l, k) is cleared; the inside and
    the outside do not interact (Theorem 3.6.5).
  over:
  - card: stack-queue
    because: If only adjacent equal pairs are removed and the order does not matter, one pass with a stack
      gives the result.
    topic: '0.6'
glossary_added:
- interval DP
- split point
- palindromic subsequence
- score difference
