# Topic 1.6 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.6"
draft: true
cards:
  - id: nearest-greater
    name: Nearest greater or smaller element
    decisive_property: "Each position needs the nearest element to one side that is greater (or smaller), and an element beaten by a later, larger one can never be that answer for anything further right; so a monotonic stack finds all answers in O(n), each element pushed and popped once."
    from_theorem: Theorem 1.6.1
    how_to_test: Ask, for an element that has just been passed by a larger one, whether it can still matter for any later position. If not, it can be popped.
    weak_signals:
      - '"The next warmer day", "the next greater element", "how far can it see"'
      - Each element needs the first element on one side that beats it
      - Removing elements so that what is left is as small as possible in dictionary order
    kill_signals:
      - The question is about a range given as a query, not the nearest element (later topics)
      - The array changes between questions
    lookalikes:
      - description: For each element, the number of greater elements to its right (not only the nearest)
        needs: a later topic (5.2)
        flipping_difference: Counting all greater elements needs every one of them, including those a monotonic stack has popped.
    complexity: O(n) amortised.
  - id: element-span
    name: Span of an element
    decisive_property: "The quantity is a sum or maximum over all subarrays of their minimum (or maximum), or a rectangle limited by its lowest bar; each element decides exactly the subarrays inside its span between the previous smaller and the next smaller element (ties broken on one side), so its contribution is computed from two stack scans."
    from_theorem: Theorem 1.6.2
    how_to_test: Fix the element that decides the subarray (its minimum or lowest bar) and check that the subarrays it decides are all l in one range and r in another.
    weak_signals:
      - '"Sum of the minimum (or maximum) over all subarrays"'
      - Largest rectangle under bars, or of ones in a grid row by row
      - An answer of the form "minimum times length" or "minimum times sum"
    kill_signals:
      - The quantity is a sum of all elements of each subarray (that is prefix sums, topic 1.2)
    lookalikes:
      - description: The best mountain arrangement when n ≤ 1000
        needs: "nested-loops (0.5): try every peak"
        flipping_difference: Small n allows an O(n) scan per peak, so the stack is not needed.
    complexity: O(n) for all spans.
  - id: window-deque
    name: Sliding window extremes
    decisive_property: "A window moves only to the right and its maximum (or minimum) is needed at every step; an element dominated by a later, larger element in the window is never needed again, so a monotonic deque keeps the maximum at its front in O(1) amortised per step, also inside shrinkable windows."
    from_theorem: Theorem 1.6.3
    how_to_test: Check that both window ends only move right and that only the window's maximum or minimum is needed (not a median or a count).
    weak_signals:
      - '"The maximum of every window of length k"'
      - '"The longest subarray with max − min ≤ limit"'
      - The best previous prefix sum within the last k positions
    kill_signals:
      - The window needs its median or another middle element (a multiset, topic 0.6)
      - The left end can move back
    lookalikes:
      - description: The median of every window of length k
        needs: "ordered-set-lookup (0.6): two multisets"
        flipping_difference: A median is not an extreme, so dominated elements can still become the answer.
    complexity: O(n) amortised.
problems:
  - id: ac-abc372_d
    role: worked_example
    summary: For each of N ≤ 2·10^5 buildings with distinct heights, count the later buildings taller than everything between.
  - id: cses-1644
    role: worked_example
    summary: The largest sum of a subarray of n ≤ 2·10^5 integers whose length is between a and b.
  - id: lc-next-greater-element-i
    role: ladder
    card: nearest-greater
    rung: 1
    twist: Base case of the card
    summary: nums1 is a subset of nums2 (distinct values, lengths ≤ 1000); for each value of nums1, the next greater value after it in nums2, or −1.
    hints:
      - Answer the question for every value of nums2 first; nums1 only selects some of the answers.
      - "One scan of nums2 with a stack of values whose next greater is not found yet (Theorem 1.6.1). Store each answer in a map from value to next greater."
      - "Pop while top < x and set next[top] = x; push x. Values left on the stack get −1. Then look up every value of nums1."
  - id: lc-final-prices-with-a-special-discount-in-a-shop
    role: ladder
    card: nearest-greater
    rung: 2
    twist: The next smaller-or-equal element instead of the next greater one.
    summary: Prices of n ≤ 500 items; item i is discounted by the first later price that is ≤ its own; print the final prices.
    hints:
      - Which later item gives the discount, in the words of this topic?
      - "The next smaller-or-equal element. Reverse the comparison of Theorem 1.6.1 and include equality in the pop condition."
      - "Pop while prices[top] ≥ prices[i] and subtract prices[i] from the popped item's price; push i."
  - id: lc-daily-temperatures
    role: ladder
    card: nearest-greater
    rung: 3
    twist: The answer is a distance, so the stack must hold positions, not values.
    summary: For each of n ≤ 10^5 daily temperatures, the number of days until a warmer one (0 if never).
    hints:
      - What does the stack need to store to compute a distance?
      - Positions. The value is read as temperatures[position].
      - "Pop while temperatures[top] < temperatures[i] and set answer[top] = i − top; push i. The rest stay 0."
  - id: cses-1645
    role: ladder
    card: nearest-greater
    rung: 4
    twist: The previous smaller element, read from the top when an element is pushed instead of when it is popped.
    summary: For each position of an array (n ≤ 2·10^5), the nearest position to its left with a smaller value, or 0.
    hints:
      - Which earlier positions can never be the answer for anything further right?
      - Any earlier position whose value is ≥ the current one is hidden behind it. Pop them; the top that remains is the answer (Theorem 1.6.1, part 3, with the comparison reversed).
      - "Pop while x[top] ≥ x[i]; print top + 1 (1-based) or 0 if empty; push i. Use fast input and output."
  - id: lc-online-stock-span
    role: ladder
    card: nearest-greater
    rung: 5
    twist: The values arrive one at a time, and each must be answered before the next arrives.
    summary: A stream of ≤ 10^4 daily prices; for each, the number of consecutive days up to today with a price ≤ today's.
    hints:
      - The span ends at the previous day with a strictly greater price. Does the left-to-right stack need to see the future?
      - "No: the previous greater element is the top after popping, so each price is answered as it arrives. Store (price, day index) or (price, span) on the stack."
      - "Pop while the top's price ≤ price; the span is today − top's day (or today + 1 if the stack is empty); push today."
  - id: lc-next-greater-element-ii
    role: ladder
    card: nearest-greater
    rung: 6
    twist: The array is circular; the next greater element may come after wrapping around.
    summary: A circular array of n ≤ 10^4 integers; for each element, the next greater value going around, or −1.
    hints:
      - How long a straight array contains, after each position, every element that comes next around the circle?
      - "Two copies of the array: run the usual scan over i = 0 .. 2n − 1 with index i mod n."
      - "Pop while nums[top] < nums[i mod n] and set answer[top] = nums[i mod n]; push i mod n only during the first n steps."
  - id: ac-abc379_f
    role: ladder
    card: nearest-greater
    rung: 7
    twist: Queries about a stack of an earlier step; answer them offline and binary search the stack.
    summary: N ≤ 2·10^5 buildings with distinct heights and Q ≤ 2·10^5 queries (l, r); count the buildings east of r visible from both l and r.
    hints:
      - A building j > r visible from l, is it always visible from r?
      - "Yes: nothing between l and j is taller than j, so nothing between r and j is either. So the answer counts the buildings visible from l with position > r."
      - "Sort the queries by l and scan l from right to left, keeping the stack of buildings visible from l (as in Section 8, Example 1). Positions on the stack increase from top to bottom: binary search for the first one > r (topic 1.4)."
  - id: cses-1142
    role: ladder
    card: element-span
    rung: 1
    twist: Base case of the card
    summary: n ≤ 2·10^5 boards of width 1 and heights ≤ 10^9; the largest area of a rectangle that fits on the fence.
    hints:
      - The best rectangle has a lowest board. How far can a rectangle of that height extend?
      - To the nearest strictly lower board on each side (Theorem 1.6.2, part 3).
      - "Two stack scans for the nearest lower board on the left and on the right; the area is h[i]·(R − L − 1) in long long."
  - id: lc-sum-of-subarray-minimums
    role: ladder
    card: element-span
    rung: 2
    twist: Count every subarray once, which needs the tie rule, and answer modulo 10^9 + 7.
    summary: The sum of min(b) over every subarray b of an array (n ≤ 3·10^4, values ≤ 3·10^4), modulo 10^9 + 7.
    hints:
      - In how many subarrays is arr[i] the minimum? What goes wrong when two minima are equal?
      - "(i − L)(R − i) with L the previous strictly smaller and R the next smaller-or-equal element: strict on one side only (Theorem 1.6.2)."
      - "Two stack scans for L and R; add arr[i]·(i − L)·(R − i) in long long and reduce modulo 10^9 + 7 (topic 0.4)."
  - id: lc-largest-rectangle-in-histogram
    role: ladder
    card: element-span
    rung: 3
    twist: The same question in one scan, computing each bar's area at the moment it is popped.
    summary: Bars of width 1 and heights h_i (n ≤ 10^5, h_i ≤ 10^4); the largest rectangle under them.
    hints:
      - When bar j is popped by bar i, which two bars bound its rectangle?
      - "On the right, i (the first lower bar); on the left, the new top after the pop."
      - "Append a bar of height 0 so that every bar is popped; when j is popped, the area is h[j]·(i − top − 1), with top = −1 for an empty stack."
  - id: cses-3221
    role: ladder
    card: window-deque
    rung: 1
    twist: Base case of the card
    summary: An array of n ≤ 10^7 values made by a given generator; print the XOR of the minima of all windows of k elements.
    hints:
      - n = 10^7 rules out O(n log n) with a large constant. Which structure gives each window's minimum in O(1) amortised?
      - "A monotonic deque with values increasing from front to back (Theorem 1.6.3 with the comparison reversed)."
      - "Generate the values into an array; pop the back while ≥ x_i, push i, pop the front if ≤ i − k, and XOR the front's value into the answer from i = k − 1 on."
  - id: lc-longest-continuous-subarray-with-absolute-diff-less-than-or-equal-to-limit
    role: ladder
    card: window-deque
    rung: 2
    twist: The left end moves irregularly, and the window needs both its maximum and its minimum.
    summary: The longest subarray of n ≤ 10^5 values in which every two elements differ by at most limit.
    hints:
      - Every two elements differ by at most limit exactly when max − min ≤ limit. Is that condition kept when the window shrinks?
      - "Yes, so the shrinkable window of topic 1.3 applies; two deques give the maximum and the minimum."
      - "For each right end, push it to both deques; while max − min > limit, move l and pop any front < l. Answer the longest window."
  - id: lc-continuous-subarrays
    role: ladder
    card: window-deque
    rung: 3
    twist: Count all valid windows instead of finding the longest one.
    summary: The number of subarrays of n ≤ 10^5 values in which every two elements differ by at most 2.
    hints:
      - For a fixed right end r, which left ends give a valid window?
      - "All l from the smallest valid left end up to r, because a valid window stays valid when it shrinks. That is r − l + 1 windows."
      - "The same two-deque window as the previous rung; add r − l + 1 for each right end, in long long (the count reaches 5·10^9)."
  - id: lc-remove-k-digits
    role: drill
    summary: Remove k digits from a number given as a string of n ≤ 10^5 digits to make it as small as possible.
  - id: lc-maximum-width-ramp
    role: drill
    summary: The largest j − i with i < j and nums[i] ≤ nums[j] (n ≤ 5·10^4).
  - id: lc-car-fleet
    role: drill
    summary: n ≤ 10^5 cars drive to a target on one lane and cannot pass, so a faster car joins the slower one ahead; the number of groups that arrive.
  - id: lc-sum-of-subarray-ranges
    role: drill
    summary: The sum of (largest − smallest) over all subarrays of n ≤ 1000 integers.
  - id: lc-longest-repeating-character-replacement
    role: drill
    summary: Change at most k letters of an uppercase string (length ≤ 10^5); the longest substring of one repeated letter.
  - id: lc-find-peak-element
    role: drill
    summary: Find any index whose value is larger than both neighbours (neighbours differ; outside the array is −∞) in O(log n) time.
  - id: lc-gas-station
    role: drill
    summary: n ≤ 10^5 stations on a circle with gas[i] and the cost to the next one; the starting station from which the full circle can be driven, or −1.
  - id: cses-1073
    role: drill
    summary: n ≤ 2·10^5 cubes arrive in order; each goes on a tower whose top cube is larger, or starts a new tower; the fewest towers.
  - id: lc-beautiful-towers-i
    role: lookalike
    summary: Choose heights ≤ maxHeights[i] (n ≤ 10^3) that rise to one peak and then fall; the largest total height.
  - id: lc-beautiful-towers-ii
    role: lookalike
    summary: The same mountain of heights ≤ maxHeights[i] with the largest total, for n ≤ 10^5.
  - id: lc-sliding-window-maximum
    role: lookalike
    summary: The maximum of every window of k consecutive elements (n ≤ 10^5).
  - id: lc-sliding-window-median
    role: lookalike
    summary: The median of every window of k consecutive elements (n ≤ 10^5).
drill:
  - problem: lc-remove-k-digits
    answer_card: nearest-greater
    answer_topic: "1.6"
    property: "A digit followed by a smaller digit should go first. Keep the kept digits on a stack that increases from bottom to top, and pop a larger top while removals remain; remove the rest from the end."
    why_others_fail: Trying every set of k removals is exponential, and sorting the digits destroys their order.
  - problem: lc-maximum-width-ramp
    answer_card: nearest-greater
    answer_topic: "1.6"
    property: "Only positions smaller than everything before them can be the best left end; they form a decreasing stack. Scan j from the right and pop every candidate i with nums[i] ≤ nums[j]: no j further left gives it a wider ramp."
    why_others_fail: "All pairs are O(n²); a two-pointer walk needs a monotone condition on both ends. Sorting positions by value with a running minimum of positions (topic 1.1) also works."
  - problem: lc-car-fleet
    answer_card: nearest-greater
    answer_topic: "1.6"
    property: "Sorted from the car closest to the target backwards, each car's arrival time alone is (target − position) / speed. A car joins the fleet ahead unless it would arrive strictly later; the fleet times kept form a monotonic stack."
    why_others_fail: Simulating the cars over time is slow and needs exact meeting times; only the order of arrival times matters.
  - problem: lc-sum-of-subarray-ranges
    answer_card: element-span
    answer_topic: "1.6"
    property: "The sum of (max − min) is the sum of maxima minus the sum of minima, each computed from the span of every element with one-sided ties (Theorem 1.6.2)."
    why_others_fail: "With n ≤ 1000, O(n²) over all subarrays with running max and min also passes; the span method is the O(n) answer."
  - problem: lc-longest-repeating-character-replacement
    answer_card: shrinkable-window
    answer_topic: "1.3"
    property: "A window is valid when its length minus the count of its most frequent letter is at most k; that survives shrinking, so the left end only moves right."
    why_others_fail: The window needs counts of 26 letters, not the maximum value of its elements, so no deque is needed.
  - problem: lc-find-peak-element
    answer_card: sorted-search
    answer_topic: "1.4"
    property: "If nums[mid] < nums[mid + 1], some peak lies to the right of mid; otherwise one lies at mid or to its left. Keep the half that rises: O(log n)."
    why_others_fail: The nearest greater element finds a peak too, but in O(n); the problem asks for O(log n).
  - problem: lc-gas-station
    answer_card: left-to-right-forced
    answer_topic: "1.5"
    property: "If the tank goes negative at station i, no start from the current start up to i works, so restart after i. A start exists exactly when the total gas is at least the total cost."
    why_others_fail: No nearest element is asked; one running sum with a restart rule is enough.
  - problem: cses-1073
    answer_card: extreme-first
    answer_topic: "1.5"
    property: "Put each cube on the tower whose top is the smallest value larger than the cube, or start a new tower; a smaller top that still fits wastes the least."
    why_others_fail: "A stack keeps one sequence, but many towers are open at once and a cube may go on any of them: keep the tops in a multiset (topic 0.6) and use upper_bound."
lookalike_pairs:
  - a: lc-beautiful-towers-i
    b: lc-beautiful-towers-ii
    a_tool: "brute force (0.5): try every peak and walk outwards"
    b_tool: "element-span (1.6): best left and right sums from a monotonic stack"
    flipping_difference: "A has n ≤ 10^3, so trying every peak with an O(n) walk is fast enough; B has n ≤ 10^5, so the best non-decreasing prefix ending at each i must come from the previous smaller position in O(1) amortised."
  - a: lc-sliding-window-maximum
    b: lc-sliding-window-median
    a_tool: window-deque (1.6)
    b_tool: "two multisets (0.6) balanced around the middle"
    flipping_difference: "A needs only the maximum, so an element with a larger one after it can be dropped for good; B needs the middle value, which can be any element of the window, so nothing can be dropped."
self_test: []
checkpoint:
  time_limit_minutes: 90
  problems: []
decision_map: []
glossary_added:
  - next greater element
  - monotonic stack
  - span
  - monotonic deque
  - dominated

