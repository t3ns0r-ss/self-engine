drill:
- problem: lc-longest-happy-prefix
  answer:
    topic: '6.2'
    card: period-border
  property: 'The longest proper prefix that is also a suffix is the longest border: s[0..π[n−1]).'
  why_others_fail: Hashing every prefix compares O(n) pairs and is only probable; the prefix function
    gives the border in one pass.
- problem: lc-minimum-number-of-valid-strings-to-form-target-i
  answer:
    topic: '6.2'
    card: z-compare
  property: For each word, the Z-function of word + separator + target gives, at every place of the target,
    how long a prefix of the word matches there; then a greedy jump over the longest reaches.
  why_others_fail: Matching each word at each place letter by letter is the product of the sizes; a hash
    comparison needs a binary search for every place.
- problem: cf-471D
  answer:
    topic: '6.2'
    card: pattern-occurrences
  property: 'Replace the heights by the differences of neighbours: the second wall fits at a place exactly
    when its difference sequence occurs there; count occurrences with the prefix function.'
  why_others_fail: Comparing the walls at every start is n · w, up to 4·10^10 steps.
- problem: cf-2010C2
  answer:
    topic: '6.2'
    card: period-border
  property: A string t is s glued to itself with an overlap exactly when s is a border of t longer than
    half of t; the longest border (one prefix-function value) decides.
  why_others_fail: Trying all lengths of s and comparing is quadratic.
- problem: cf-1295B
  answer:
    topic: '1.2'
    card: range-sum
  property: The balance of a prefix is the balance of whole copies of s plus the prefix sum inside one
    copy; the prefix sums of one copy decide how many prefixes reach x.
  why_others_fail: The string is repeated, but no border or period of it is asked for; the question is
    about sums.
- problem: cf-1360F
  answer:
    topic: '0.5'
    card: enumerate-answer
  property: A solution differs from the first string in at most one place, so try the first string and
    its m · 25 single-letter changes, and check each candidate against all strings.
  why_others_fail: With n, m ≤ 10 every candidate can be tried; matching tools are not needed.
- problem: cf-1660F2
  answer:
    topic: '5.2'
    card: inversion-count
  property: With prefix values p (+1 for −, −1 for +) the count asks for pairs l < r with p[l] ≤ p[r]
    and p[l] ≡ p[r] modulo 3; a Fenwick tree for each residue counts them.
  why_others_fail: The condition is on pairs of prefix values, not on equal blocks; the prefix function
    has nothing to compare.
- problem: cf-1182C
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: Sort the words by (number of vowels, last vowel) and pair neighbours with the same key first,
    then pair the rest by the number of vowels.
  why_others_fail: The words are matched by a key, not found inside another text.
lookalike_pairs:
- a: lc-number-of-subarrays-that-match-a-pattern-ii
  b: lc-number-of-subarrays-that-match-a-pattern-i
  a_tool:
    topic: '6.2'
    card: pattern-occurrences
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both count the subarrays whose neighbouring comparisons follow a pattern of −1, 0, 1.
  flipping_difference: 'In version I the array has at most 100 numbers, so checking every start letter
    by letter costs about 10^4 steps. In version II the array has up to 10^6 numbers: turn it into the
    sequence of neighbour comparisons and count the occurrences of the pattern with the prefix function.'
  flipping_input: 'nums of length 10^6 and a pattern of 5·10^5 entries, all equal to 1: checking every
    start costs about 5·10^5 · 5·10^5 = 2.5·10^11 steps; the prefix function costs about 1.5·10^6.'
- a: lc-find-beautiful-indices-in-the-given-array-ii
  b: lc-find-beautiful-indices-in-the-given-array-i
  a_tool:
    topic: '6.2'
    card: pattern-occurrences
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both ask for the places where a occurs near an occurrence of b in a string.
  flipping_difference: In version I the strings a and b have at most 10 letters, so their occurrences
    are found by comparing at every start. In version II they may have up to 5·10^5 letters, so the occurrence
    lists need a linear-time matcher.
  flipping_input: 's of length 5·10^5 and a, b of length 2.5·10^5: comparing at every start costs about
    6·10^10 steps for each; the prefix function costs about 10^6 each.'
self_test:
- q: Compute the prefix function of ababaca.
  a: 'π = 0, 0, 1, 2, 3, 0, 1. For example the prefix ababa (place 4) has the longest border aba (length
    3); at the place 5 the letter c fits no border (all fall-backs fail), so 0; at the place 6 the letter
    a matches the beginning: 1.'
- q: List all borders and all periods of u = aabaabaa.
  a: π = 0, 1, 0, 1, 2, 3, 4, 5. The longest border has length 5; then π[4] = 2, then π[1] = 1, then π[0]
    = 0. The borders are 1, 2, 5. The periods are 8 − 5 = 3, 8 − 2 = 6, 8 − 1 = 7 and 8.
- q: Is abcabcab a repetition of a shorter block? Use Theorem 6.2.2.
  a: 'π = 0, 0, 0, 1, 2, 3, 4, 5, so the smallest period is 8 − 5 = 3. It does not divide 8, so the string
    is not a repetition: the blocks abc, abc, ab leave a partial copy.'
- q: Compute the Z-function of aabaab.
  a: z = 6, 1, 0, 3, 1, 0. At the place 1 the suffix abaab agrees with the beginning aabaab for one letter;
    at the place 3 the suffix aab agrees for 3 letters; at the place 4 the suffix ab agrees for one letter.
- q: Find the places where t = aab occurs in s = aaabaab using the prefix function of aab#aaabaab.
  a: The values equal to 3 appear for the occurrences ending at the places 3 and 6 of s, so the occurrences
    start at 1 and 4.
- q: Why is the separator needed? Take t = aa and s = aaa and compare the prefix function of the joined
    string with and without it.
  a: 'Without a separator the string is aaaaa with π = 0, 1, 2, 3, 4. The test π = 2 fires only at the
    place 2, which is inside the pattern itself, while the real occurrences show up as the values 3 and
    4. With the separator, aa#aaa has π = 0, 1, 0, 1, 2, 2: the value 2 appears twice, for the occurrences
    that end at the places 1 and 2 of s (starts 0 and 1).'
- q: For s = abab give occ[k], the number of places where the prefix of length k occurs, for k = 1, 2,
    3, 4.
  a: occ = 2, 2, 1, 1. The prefix a occurs at 0 and 2, ab at 0 and 2, aba and abab only at 0.
- q: 'Fill the matching automaton of t = ab: next[k][c] for k = 0, 1, 2 and the letters a and b.'
  a: 'next[0][a] = 1, next[0][b] = 0. next[1][a] = 1 (b does not follow, fall back to the border 0 and
    a matches), next[1][b] = 2. From the full state 2: next[2][a] = next[π[1]][a] = next[0][a] = 1, next[2][b]
    = next[0][b] = 0.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - cses-1733
  - cf-631D
  - cf-1984D
decision_map:
- weak_signal: Where does a string occur in another; is it inside; is one string a rotation of another
  choose: pattern-occurrences
  when: Every match is an exact equality of the pattern with a block of the text and the lengths are too
    large to compare at every start (Theorem 6.2.4).
  over:
  - card: substring-compare
    topic: '6.1'
    because: Hashing answers equality of arbitrary pairs of blocks with a small chance of error; a fixed
      pattern against all starts is exact with the prefix function.
  - card: string-processing
    topic: '0.3'
    because: For short strings a direct scan is simpler.
  - card: merge-walk
    topic: '1.3'
    because: If the letters of the pattern may be separated, it is a subsequence test, not a block match.
- weak_signal: The longest prefix that is also a suffix; the periods of a string; whether a string is
    a shorter block repeated; copies glued with overlap
  choose: period-border
  when: The question is about a prefix equal to a suffix of the same string, which is read from the prefix
    function (Theorems 6.2.1 and 6.2.2).
  over:
  - card: substring-compare
    topic: '6.1'
    because: Arbitrary blocks need hashes; a border compares the beginning with the end of one string.
  - card: palindrome-hash
    topic: '6.1'
    because: A prefix equal to the reverse of a suffix is not a border.
- weak_signal: For every suffix, how far it agrees with the beginning; the sum of those lengths; a match
    with at most one mismatch; overlaps of occurrences
  choose: z-compare
  when: The quantity is the common beginning of a suffix with the whole string (or a pattern) for many
    places (Theorem 6.2.5).
  over:
  - card: period-border
    topic: '6.2'
    because: The prefix function gives whole suffixes that are prefixes (borders); the Z-function also
      gives partial agreement at every place.
  - card: substring-compare
    topic: '6.1'
    because: Two arbitrary blocks, neither at the beginning, need hashes.
- weak_signal: Count the strings that avoid or must contain a pattern; a DP in which the number of matched
    letters of a pattern is part of the state
  choose: pattern-occurrences
  when: The matching automaton gives the next state in O(1) after each letter (Theorem 6.2.4 (b)).
  over:
  - card: sequence-counting
    topic: '3.5'
    because: If the condition is local (no two equal neighbours), the state is the last letter or two;
      a long pattern needs the matched length.
  - card: neighbour-digits
    topic: '3.8'
    because: Digit DP with a forbidden pattern takes the matched length as a state too, taken from the
      automaton.
glossary_added:
- border
- period
- prefix function
- Z-function
- matching automaton
