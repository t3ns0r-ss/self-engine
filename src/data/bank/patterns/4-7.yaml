# Patterns for topic 4.7 (SCC, bridges, articulation points). Provisional until the lesson maps them to Recognition Cards.
topic: "4.7"
patterns:
  - id: scc
    name: Strongly connected components
    description: Group vertices that can reach each other, and build the acyclic graph of components.
    precondition: Mutual reachability is an equivalence relation, and the graph of its classes has no directed cycle.
  - id: condensation-reasoning
    name: Reasoning on the component graph
    description: "Answer questions on the component graph: fewest edges to make everything reachable, vertices reachable from all others."
    precondition: The component graph is acyclic, so it has sources and sinks with simple counting rules.
  - id: bridges
    name: Bridges
    description: Find edges whose removal disconnects the graph, from low-link values in a depth-first traversal.
    precondition: A tree edge (p, v) is a bridge exactly when no back edge from v's subtree reaches p or above.
  - id: cut-vertices
    name: Cut vertices
    description: Find vertices whose removal disconnects the graph, from low-link values.
    precondition: A non-root vertex p is a cut vertex exactly when some child's subtree has no back edge reaching above p.
