# Patterns for topic 1.5 (Greedy I: exchange argument, stays ahead (arrays and sorting only)). Provisional until the lesson maps them to Recognition Cards.
topic: "1.5"
patterns:
  - id: exchange-order
    name: Order by an exchange argument
    description: Process items in an order given by a key; swapping two adjacent items that break the order never improves the answer.
    precondition: For any adjacent pair out of key order, swapping them does not make the total worse.
  - id: interval-selection
    name: Earliest end first
    description: Choose the maximum number of non-overlapping intervals (or fewest points covering all) by earliest end.
    precondition: "The greedy choice stays ahead: after k picks it ends no later than the k-th pick of any other valid solution."
  - id: extreme-first
    name: Biggest or smallest first
    description: Reach a target with the fewest items, or maximise a total under a count limit, by taking the most extreme items first.
    precondition: Any optimal solution can be changed to use the most extreme available item instead without getting worse.
  - id: sorted-matching
    name: Matching two sorted lists
    description: Pair items from two lists (people to seats, tasks to workers) in sorted order, assigning the smallest feasible partner.
    precondition: An optimal pairing exists in which both lists are matched in sorted order; crossing pairs can be uncrossed without loss.
  - id: left-to-right-forced
    name: Left-to-right forced choices
    description: Scan once from the left and make the choice that is forced or leaves the most room for the rest (fix the first violation, extend as far as allowed).
    precondition: The decision at the leftmost point affects only what lies to its right, and the greedy choice leaves a state at least as good as any alternative.
