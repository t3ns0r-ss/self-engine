  hints:
  - If a_i is a power of one prime, every divisor is a multiple of that prime. What follows for d_1 +
    d_2?
  - Otherwise split a_i = p^k · m with p = spf(a_i) and m > 1 coprime to p. Take d_1 = p^k, d_2 = m.
  - 'No prime of a_i divides p^k + m: a prime dividing one of the two terms does not divide the other.
    Build the table up to 10^7.'
- id: cf-1203C
  role: ladder
  card: trial-division
  rung: 1
  twist: Base case of the card
  summary: Given n ≤ 4·10^5 integers up to 10^12, count the positive integers that divide all of them.
  hints:
  - Which numbers divide every element? Relate them to one number.
  - They are exactly the divisors of g = gcd of all elements (topic 0.4).
  - Count the divisors of g by trial division up to √g ≤ 10^6 (Theorem 0.2.2).
- id: ac-abc169_d
