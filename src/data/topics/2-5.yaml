# Topic 2.5 data file (CURRICULUM_GAPS_PLAN.md Section 5.1, S7). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '2.5'
uses:
- topic: '0.1'
  what: 'Overflow: 64-bit integers and __int128 for products'
- topic: '0.2'
  what: Reading constraints to choose between a loop and a formula
- topic: '0.4'
  what: GCD and LCM via Euclid, remainders, divisibility
- topic: '0.5'
  what: 'Brute force: the reference solutions in the tests'
- topic: '1.4'
  what: Binary search over a monotone answer
- topic: '2.1'
  what: Extended Euclid and Bézout (Theorem 2.1.2), divisors and factorisation
- topic: '2.2'
  what: 'Modular arithmetic: inverses modulo a prime, powers (Theorem 2.2.3)'
theorems:
- id: 2.5.1
  title: One solution of a linear equation in two integers
  plain_words: Two whole numbers a and b can build exactly the multiples of their GCD. So $a \cdot x + b \cdot y = c$ has whole-number solutions exactly when the GCD divides c, and extended Euclid hands you one of them.
  code: 2.5/thm-1
- id: 2.5.2
  title: All solutions and the smallest non-negative one
  plain_words: Once you have one solution, every other one is found by moving x by b/g and y by a/g in opposite directions. So the solutions are one arithmetic progression, and the smallest non-negative x is a single remainder.
  code: 2.5/thm-2
- id: 2.5.3
  title: One linear congruence
  plain_words: The congruence $a \cdot x \equiv b \pmod m$ is the same as $a \cdot x + m \cdot y = b$. It has a solution exactly when gcd(a, m) divides b, and then the solutions are one residue class modulo m/g.
  code: 2.5/thm-3
- id: 2.5.4
  title: Two congruences, then many
  plain_words: Two congruences x ≡ r1 (mod m1) and x ≡ r2 (mod m2) can be true together only if r1 and r2 agree modulo gcd(m1, m2). When they do, the answers are one residue class modulo the lcm, so a long list is merged two at a time.
  code: 2.5/thm-4
cards:
- id: integer-solutions
  name: Linear equations and congruences in integers
  decisive_property: The question asks for integers x, y with $a \cdot x + b \cdot y = c$ (or x with $a \cdot x \equiv b \pmod m$), perhaps with a range, a sign or a smallest-value condition; it is solvable exactly when gcd(a, b) divides c, and all solutions form one arithmetic progression with steps (b/g, −a/g).
  from_theorem: 2.5.2
  how_to_test: 'Write the condition as $a \cdot x + b \cdot y = c$ (a congruence $a \cdot x \equiv b \pmod m$ is $a \cdot x + m \cdot y = b$) and check that x and y may be any integers, possibly limited afterwards by a range; then ask what is wanted: existence (GCD test), one solution (extended Euclid), the smallest non-negative x, or the number of solutions in a box.'
  constraint_shapes:
  - 'a, b up to $10^9$ and c up to $10^{18}$ with $10^5$ tests: trying x up to b is $10^{14}$ steps, while extended Euclid is about 45 steps per test.'
  - 'A box of $10^{12}$ values for x: a loop over x is $10^{12}$, the progression formula is $O(\log b)$.'
  weak_signals:
  - form: Exact payment with two coin sizes, or two jug sizes, and a target
    shape: Sizes up to $10^9$, target up to $10^{18}$
  - form: Moving k steps at a time around a circle of n positions until a given position
    shape: n up to $10^9$, many queries
  - form: A lattice point on the line $a \cdot x + b \cdot y = c$, or inside a box
    shape: Coordinates up to $10^{18}$
  kill_signals:
  - 'Only the existence of a solution is asked and the numbers are tiny: the GCD test or a loop is enough (topic 0.4 and 0.5).'
  - 'Three or more unknowns with a small bound on each: loop over all but two and apply the card to the last two.'
  in_action:
    statement: You have coins of 7 and 12. Can you pay exactly 100, and in how many ways with non-negative counts?
    constraints: Coin values and the amount up to $10^9$ in the real problem; the numbers above are the small instance.
    budget: A loop over the number of 7-coins is up to $10^9$ steps per query; the progression formula is about 40 steps.
    candidates:
    - tool: Loop over the number of coins of one kind
      verdict: rejected
      because: Up to $10^9$ iterations per query is too slow when there are many queries.
    - tool: Extended Euclid, then the progression of solutions
      verdict: chosen
      because: 'gcd(7, 12) = 1 divides 100, one solution is (−500, 300), and the solutions move by (12, −7): the non-negative ones form one short stretch.'
    property_check: The condition is $a \cdot x + b \cdot y = c$ with whole x, y and a range condition afterwards (Theorem 2.5.2).
    decision: Get one solution with extended Euclid, shift x into the range by multiples of b/g, and count the steps that keep y in range.
  examples:
    positive:
    - inline:
        input: Pay exactly 100 with coins of 7 and 12, in how many ways (non-negative counts)?
        answer: '1'
        why: The solutions are (4, 6) plus multiples of (12, −7); only t = 0 keeps both counts non-negative.
    - inline:
        input: Pay exactly 60 with coins of 6 and 10, in how many ways?
        answer: '3'
        why: gcd(6, 10) = 2 divides 60; the solutions are (10, 0), (5, 3), (0, 6), spaced by (5, −3).
    negative:
    - inline:
        input: 'Does 6x + 10y = 14 have an integer solution? (Shortcut tried: 14 must be a multiple of 6 or of 10.)'
        answer: '1'
        method_gives: '0'
        why: The shortcut mixes up "a multiple of a or b" with "a multiple of gcd(a, b)"; gcd(6, 10) = 2 divides 14 and (14, −7) is a solution.
      correct_tool:
        topic: '0.4'
        card: gcd-lcm
    - inline:
        input: The smallest non-negative x with 4x + 6y = 10, taking the x that extended Euclid gives, scaled by c / g.
        answer: '1'
        method_gives: '-5'
        why: 'The scaled x is one solution, not the smallest: it must be shifted by multiples of b/g = 3 into [0, 3).'
      correct_tool:
        topic: '2.5'
        card: integer-solutions
  lookalikes:
  - description: Whether a number can be built from two numbers, asked only as a yes or no, with a, b up to $10^9$
    tool:
      topic: '0.4'
      card: gcd-lcm
    flipping_difference: When only existence is asked, gcd(a, b) dividing c is the whole answer; the card is needed once a solution, the smallest one or the number of solutions is asked.
  complexity: $O(\log \min(a, b))$ per equation.
- id: merge-congruences
  name: Systems of congruences with any moduli
  decisive_property: The question gives several conditions x ≡ r_i (mod m_i), or one periodic event repeating with period m_1 and another with m_2, and asks for the first x (or the number of x in a range); they have a common solution exactly when every pair agrees modulo the GCD of its moduli, and then the solutions are one residue class modulo the lcm.
  from_theorem: 2.5.4
  how_to_test: List every condition as x ≡ r_i (mod m_i); merge them two at a time, checking that the residues agree modulo gcd(m, m_i); if one merge fails the whole system has no solution; the final modulus is the lcm, which must fit in 64 bits (or the answer is asked modulo something).
  constraint_shapes:
  - 'Two periods up to $10^9$: waiting for both events to coincide by stepping the time is up to $10^{18}$ steps, the merge is about 45 steps.'
  - 'Up to $10^4$ congruences: merging one by one is $10^4$ extended Euclid steps; the lcm stays below $10^{18}$ or the problem asks for it modulo a prime.'
  weak_signals:
  - form: Two periodic events, "first time both happen"
    shape: Periods up to $10^9$
  - form: A number with given remainders modulo several numbers
    shape: Up to $10^4$ moduli
  - form: The same position reached by two cycles (cycle lengths n and m)
    shape: n, m up to $5 \cdot 10^5$
  kill_signals:
  - 'The moduli are small and the lcm is at most $10^7$: stepping through x is simpler (topic 0.5).'
  - 'The congruences depend on each other (the modulus of one involves the unknown): this card does not apply.'
  in_action:
    statement: x leaves remainder 2 when divided by 6 and remainder 8 when divided by 10. Find the smallest such x.
    constraints: The moduli are up to $10^9$ in the real problem; the numbers above are the small instance.
    budget: Stepping x up to the lcm (up to $10^{18}$) is too slow; one merge is about 45 steps.
    candidates:
    - tool: Step x until both conditions hold
      verdict: rejected
      because: The first common x can be as large as the lcm, up to $10^{18}$.
    - tool: Merge the two congruences (Theorem 2.5.4)
      verdict: chosen
      because: 'gcd(6, 10) = 2 and 2 ≡ 8 (mod 2), so a solution exists and is unique modulo 30: x = 8.'
    property_check: The two conditions are of the form x ≡ r (mod m) and the residues agree modulo gcd(6, 10) = 2.
    decision: Merge them into x ≡ 8 (mod 30); merge further congruences into this one the same way.
  examples:
    positive:
    - inline:
        input: The smallest x with x ≡ 2 (mod 6) and x ≡ 8 (mod 10)
        answer: '8'
        why: The residues agree modulo gcd(6, 10) = 2, so the solutions are one class modulo 30, and the smallest is 8.
    - inline:
        input: The smallest x with x ≡ 2 (mod 3), x ≡ 3 (mod 5) and x ≡ 2 (mod 7)
        answer: '23'
        why: Merging the first two gives x ≡ 8 (mod 15); merging with the third gives x ≡ 23 (mod 105).
    negative:
    - inline:
        input: The smallest x with x ≡ 1 (mod 4) and x ≡ 2 (mod 6), treating the moduli as coprime (product formula).
        answer: '-1'
        method_gives: '22'
        why: gcd(4, 6) = 2 and 1, 2 disagree modulo 2, so no solution exists; the coprime formula returns 22, which is not 1 modulo 4.
      correct_tool:
        topic: '2.5'
        card: merge-congruences
    - inline:
        input: How many x in [0, 48) have x ≡ 3 (mod 4) and x ≡ 3 (mod 6), taking the period to be the product 24?
        answer: '4'
        method_gives: '2'
        why: The period of the solutions is lcm(4, 6) = 12, not 24; the solutions are 3, 15, 27, 39.
      correct_tool:
        topic: '2.5'
        card: merge-congruences
  lookalikes:
  - description: Two periodic events that start together, asked when they next meet (no offsets)
    tool:
      topic: '0.4'
      card: gcd-lcm
    flipping_difference: With both starting at 0 the answer is the lcm; offsets r_1 and r_2 turn it into a system of congruences, which needs the merge.
  complexity: $O(\log m)$ per merge.
problems:
- id: cf-633A
  role: ladder
  card: integer-solutions
  rung: 1
  twist: Base case of the card
  summary: Can the number $c \le 10^8$ be written as $a \cdot x + b \cdot y$ with non-negative integers x, y?
  hints:
  - Try x = 0, 1, 2, … and check whether $c - a \cdot x$ is a non-negative multiple of b. How many x are enough?
  - Only x up to c / a matter, which is at most $10^8$, fine here; the solutions of $a \cdot x + b \cdot y = c$ also form a progression (Theorem 2.5.2).
  - Loop x from 0 while $a \cdot x \le c$ and test $(c - a \cdot x) \bmod b = 0$.
- id: lc-water-and-jug-problem
  role: ladder
  card: integer-solutions
  rung: 2
  twist: Only existence is asked; the total must also stay within the jugs.
  summary: 'Jugs of x and y litres ($\le 10^3$) with fill, empty and pour operations: can the total water be exactly target?'
  hints:
  - Every operation changes the total by x, by y or not at all. Which totals are combinations of x and y?
  - By Bézout (Theorem 2.5.1) the reachable totals are the multiples of gcd(x, y); the jugs also limit the total to x + y.
  - Return $\text{target} \le x + y$ and $\text{target} \bmod \gcd(x, y) = 0$.
- id: ac-abc340_f
  role: ladder
  card: integer-solutions
  rung: 3
  twist: A geometric condition that becomes a linear equation in integers.
  summary: Given $(X, Y) \ne (0, 0)$ with $|X|, |Y| \le 10^{17}$, find integers A, B with $|A|, |B| \le 10^{18}$ so that the triangle (0, 0), (X, Y), (A, B) has area 1, or print −1.
  hints:
  - The triangle with vertices (0, 0), (X, Y), (A, B) has area $|X \cdot B - Y \cdot A| / 2$. Write the condition as an equation in A and B.
  - $X \cdot B - Y \cdot A = \pm 2$ has a solution exactly when g = gcd(|X|, |Y|) divides 2 (Theorem 2.5.1).
  - Get u, v with $|X| \cdot u + |Y| \cdot v = g$ from extended Euclid, fix the signs and multiply by 2/g; the bounds of Theorem 2.5.2 keep the values within $10^{18}$.
- id: cf-1244C
  role: ladder
  card: integer-solutions
  rung: 4
  twist: A linear equation with an extra limit on x + y, solved by bounding one variable.
  summary: Find non-negative x, y, z with x + y + z = n, $x \cdot w + y \cdot d = p$ (d < w, n up to $10^{12}$, w up to $10^5$), or report −1.
  hints:
  - If $y \ge w$, trade w draws for d wins. What happens to the points and to x + y?
  - Replacing w draws ($w \cdot d$ points) by d wins ($d \cdot w$ points) keeps the points and lowers x + y, so y can be kept below w.
  - 'Try every y from 0 to $w - 1$: check that $p - y \cdot d$ is non-negative and divisible by w, then $x = (p - y \cdot d)/w$ and $x + y \le n$.'
- id: cf-919E
  role: ladder
  card: merge-congruences
  rung: 1
  twist: 'Base case of the card: two coprime moduli combine two residues of n into one.'
  summary: Count the n up to x ($\le 10^{12}$) with $n \cdot a^n \equiv b \pmod p$ ($p \le 10^6$ prime).
  hints:
  - $a^n$ repeats with period p − 1 in n, and n itself repeats modulo p. Fix n mod (p − 1) = i.
  - For a fixed i the condition is a linear congruence in n modulo p, with a unique solution n mod p (a is invertible).
  - 'Now n is known modulo p and modulo p − 1, which are coprime: merge them (Theorem 2.5.4) into one residue modulo $p \cdot (p - 1)$ and count the $n \le x$ in that class, for every i.'
- id: cf-1500B
  role: ladder
  card: merge-congruences
  rung: 2
  twist: Moduli with a common factor; merging has to check consistency.
  summary: Two sequences of colours repeat with periods n and m (up to $5 \cdot 10^5$); find the first day on which they have differed k times (k up to $10^{12}$).
  hints:
  - Two days t with equal colours satisfy t ≡ i (mod n) and t ≡ j (mod m) for positions i, j with the same colour. When can both hold?
  - They can hold together exactly when i ≡ j (mod gcd(n, m)), and then t is unique modulo lcm(n, m) (Theorem 2.5.4).
  - Collect the days with equal colours within one lcm period, then binary search the day by which k differences have happened.
- id: cf-338D
  role: ladder
  card: merge-congruences
  rung: 3
  twist: A system of up to $10^4$ congruences, merged one by one.
  summary: In the table gcd(i, j) with $1 \le i \le n$ and $1 \le j \le m$ (up to $10^{12}$), does a given sequence a_1..a_k (k up to $10^4$) appear as consecutive entries of one row?
  hints:
  - Every a_l must divide the row number i, and a_l must divide the column j + l − 1. Which row is best?
  - Take i = lcm(a_1..a_k) (it must be at most n); the columns satisfy j ≡ −(l − 1) (mod a_l) for every l, a system of congruences.
  - Merge them one by one (Theorem 2.5.4), check that the final j and j + k − 1 are within m, and verify gcd(i, j + l − 1) = a_l for every l.
- id: ac-agc063_d
  role: ladder
  card: merge-congruences
  rung: 4
  twist: N congruences whose moduli and residues are arithmetic progressions, so the system is reduced before it is merged.
  summary: Is there a non-negative x with $x \equiv a + kb \pmod{c + kd}$ for every k = 0..N−1 (N up to $10^6$)? If so, the smallest such x modulo 998244353.
  hints:
  - 'Compare $d \cdot (a + k \cdot b)$ and $b \cdot (c + k \cdot d)$: their difference does not depend on k. What does that say about $d \cdot x$ modulo each $c + k \cdot d$?'
  - So $d \cdot x \equiv a \cdot d - b \cdot c$ modulo every $c + k \cdot d$, hence modulo their lcm L. The step back from this to the original system loses a factor gcd(c, d), which needs separate care.
  - The lcm of an arithmetic progression of terms up to $10^{12}$ comes from a sieve over small primes (large prime cofactors are distinct); then Theorem 2.5.3 on $d \cdot x \equiv a \cdot d - b \cdot c \pmod L$, with the smallest x found from a small multiple t of L. These hints are a derivation, not checked against an editorial.
- id: cf-7C
  role: checkpoint
  card: integer-solutions
  summary: Find any integer point (x, y) with $|x|, |y| \le 5 \cdot 10^{18}$ on the line $A \cdot x + B \cdot y + C = 0$ ($|A|, |B|, |C| \le 2 \cdot 10^9$), or −1.
- id: cf-687B
  role: checkpoint
  card: merge-congruences
  summary: Given c_1..c_n and k (up to $10^6$), is x mod k determined by the residues x mod c_1, …, x mod c_n for every integer x?
- id: ac-abc193_e
  role: checkpoint
  card: merge-congruences
  summary: A train repeats a schedule with period 2X + 2Y and stops at town B in a window of Y seconds; Takahashi is awake in a window of Q seconds in each period P + Q; find the first time he can get off (Y, Q at most 500, X, P up to $10^9$).
- id: ac-abc186_e
  role: review
  card: integer-solutions
  review_set: 1
  summary: On a circle of N chairs, start S chairs clockwise from the throne and move K chairs clockwise each time; the number of moves to first reach the throne, or −1 $(N, K \le 10^9)$.
- id: ac-abc315_g
  role: review
  card: integer-solutions
  review_set: 1
  summary: Count the triples (i, j, k) with $1 \le i, j, k \le N$ and $A \cdot i + B \cdot j + C \cdot k = X$, with N, A, B, C, X up to about $10^9$ to $10^{18}$.
- id: ac-arc221_a
  role: review
  card: merge-congruences
  review_set: 1
  summary: The sum over i = 1..N of $\gcd(A \cdot i + B, C \cdot i + D)$ modulo 998244353, with N up to $10^9$ and A, B, C, D up to $10^4$, for up to 200 cases.
- id: cf-1055C
  role: lookalike
  summary: 'Two cyclic schedules with periods t_a and t_b and one lucky window each: the longest stretch of days that is lucky for both (periods up to $10^9$).'
- id: cf-1260C
  role: lookalike
  summary: 'Two kinds of planks painted by multiples of r and of b with a rule on runs of one colour: can the fence be painted without k planks of one colour in a row (up to $10^9$)?'
- id: lc-check-if-it-is-a-good-array
  role: lookalike
  summary: Given $n \le 10^5$ positive integers up to $10^9$, can an integer combination of some of them equal 1?
- id: cf-1155C
  role: lookalike
  summary: 'A set of alarm times and a set of possible intervals: pick a start and an interval so that every alarm time is hit (times up to $10^{18}$).'
- id: cf-1091C
  role: drill
  summary: 'Walking around a circle of n positions (up to $10^9$) in steps of k: the sum of the visited positions for every k that divides n.'
- id: cf-1285C
  role: drill
  summary: Find two positive integers a, b with lcm(a, b) = X ($X \le 10^{12}$) and the smallest possible max(a, b).
- id: cf-1538D
  role: drill
  summary: Can a be turned into b in exactly k moves, each dividing one of them by a divisor greater than 1 (up to $10^9$, many tests)?
- id: cf-1114C
  role: drill
  summary: The number of trailing zeros of n! in base b (n up to $10^{18}$, b up to $10^{12}$).
- id: cf-1062B
  role: drill
  summary: The smallest value of n (up to $10^6$) reachable by multiplying by any integer and taking square roots, and the fewest operations.
- id: ac-abc149_c
  role: drill
  summary: The smallest prime that is at least X (X up to $10^5$).
- id: lc-three-divisors
  role: drill
  summary: Does n (up to $10^4$) have exactly three positive divisors?
- id: lc-number-of-common-factors
  role: drill
  summary: The number of positive integers dividing both a and b (up to 1000).
drill:
- problem: cf-1091C
  answer:
    topic: '2.1'
    card: trial-division
  property: 'Only the divisors of n matter: list them by trial division up to $\sqrt{n}$ and evaluate a formula for each.'
  why_others_fail: No equation in two unknowns is solved and no congruences are merged, so the Bézout and merge cards do not apply.
- problem: cf-1285C
  answer:
    topic: '2.1'
    card: trial-division
  property: lcm(a, b) = X means each prime power of X goes wholly to a or wholly to b; enumerate the divisors of X.
  why_others_fail: No residues or equations are involved; it is a search over divisors, not a congruence.
- problem: cf-1538D
  answer:
    topic: '2.1'
    card: trial-division
  property: 'The number of available moves is governed by the prime factors of a and b with multiplicity: factorise by trial division up to $\sqrt{n}$.'
  why_others_fail: The moves divide numbers; there is no linear equation or system of remainders.
- problem: cf-1114C
  answer:
    topic: '2.1'
    card: trial-division
  property: 'Trailing zeros come from the prime factors of the base: factorise b and apply Legendre''s formula per prime.'
  why_others_fail: Nothing is solved modulo anything; the card for equations and congruences has no equation to work on.
- problem: cf-1062B
  answer:
    topic: '2.1'
    card: trial-division
  property: 'Only the prime exponents of n matter: factorise n and read off the operations from the largest exponent.'
  why_others_fail: No unknown has to satisfy a linear condition, so the extended Euclid cards do not apply.
- problem: ac-abc149_c
  answer:
    topic: '2.1'
    card: trial-division
  property: A primality test by trial division up to $\sqrt{n}$, repeated for X, X + 1, …
  why_others_fail: There is no equation or congruence; a small loop with a primality test is enough.
- problem: lc-three-divisors
  answer:
    topic: '2.1'
    card: trial-division
  property: 'A number has exactly three divisors exactly when it is the square of a prime: test by trial division.'
  why_others_fail: No linear equation in integers appears; a divisor count decides.
- problem: lc-number-of-common-factors
  answer:
    topic: '2.1'
    card: trial-division
  property: The common factors of a and b are the divisors of gcd(a, b); count by trial division.
  why_others_fail: Only a GCD is needed, and no solution of $a \cdot x + b \cdot y = c$ is asked for.
lookalike_pairs:
- a: cf-1055C
  b: cf-1260C
  a_tool:
    topic: '2.5'
    card: integer-solutions
  b_tool:
    topic: '0.4'
    card: gcd-lcm
  shared_surface: Both have two periodic patterns with different periods and a gcd of the periods.
  flipping_difference: 'In A the two schedules start at different offsets, and the question is which shifts between them can happen: the shifts are exactly the numbers congruent to the offset difference modulo gcd, which comes from $a \cdot x + b \cdot y = c$. In B both patterns start together, so only gcd(r, b) matters and no equation is solved.'
  flipping_input: 'A: periods 6 and 10 with lucky days [0, 1] and [3, 4]: the reachable shifts differ from 3 by multiples of 2. B: planks painted by multiples of 6 and of 10: only gcd = 2 matters.'
- a: lc-check-if-it-is-a-good-array
  b: cf-1155C
  a_tool:
    topic: '2.5'
    card: integer-solutions
  b_tool:
    topic: '0.4'
    card: gcd-lcm
  shared_surface: Both ask about the gcd of a whole array.
  flipping_difference: 'In A the question is whether integer combinations of the numbers reach 1, which is Bézout: the gcd of the array must be 1. In B the gcd of the differences between alarm times decides which interval divides all of them, and no combination is formed.'
  flipping_input: 'A: the array 12, 5, 7 gives gcd 1, so yes. B: alarms at 3, 9, 21 have differences 6 and 12, gcd 6, so the intervals that work are the divisors of 6.'
self_test:
- q: When does 6x + 10y = 15 have an integer solution, and why?
  a: 'Never: gcd(6, 10) = 2 does not divide 15, and 6x + 10y is always even (Theorem 2.5.1).'
- q: Give all solutions of 6x + 10y = 14 from the solution (4, −1).
  a: (4 + 5t, −1 − 3t) for every integer t, since b/g = 5 and a/g = 3 (Theorem 2.5.2).
- q: Solve 6x ≡ 4 (mod 10).
  a: 'gcd(6, 10) = 2 divides 4, so there is a solution class modulo 5: x ≡ 4 (mod 5), the smallest is 4 (Theorem 2.5.3).'
- q: Do x ≡ 1 (mod 4) and x ≡ 2 (mod 6) have a common solution?
  a: 'No: gcd(4, 6) = 2 and 1 ≢ 2 (mod 2), so the residues disagree (Theorem 2.5.4).'
- q: What is the modulus of the merged congruence of x ≡ 2 (mod 6) and x ≡ 8 (mod 10)?
  a: lcm(6, 10) = 30, not 60; the merged congruence is x ≡ 8 (mod 30).
- q: Why can the extended Euclid x for $a \cdot x + b \cdot y = c$ be negative or too large?
  a: It is one solution, scaled by c/g; the smallest non-negative x is found by reducing it modulo b/g (Theorem 2.5.2).
- q: When are the moduli of a system too large to merge in 64-bit integers?
  a: When their lcm exceeds about $10^{18}$; use __int128 for the products or ask for the answer modulo something smaller.
