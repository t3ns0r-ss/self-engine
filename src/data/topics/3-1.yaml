- id: lc-maximum-points-in-an-archery-competition
  role: lookalike
  summary: Choose which of 12 target sections to win, each by shooting one more arrow than the opponent did there, within a limit on arrows, to score as many points as possible.
- id: lc-find-the-punishment-number-of-an-integer
  role: lookalike
  summary: For each i up to 1000 decide whether the digits of i squared can be cut into pieces that add up to i, and sum the squares of those i.
- id: ac-abc188_c
  role: ladder
  card: divide-conquer
  rung: 1
  twist: Base case of the card
  summary: $2^N$ players ($N \le 16$) with different ratings play a knockout tournament in which neighbours meet first; print the label of the player who loses the final.
  hints:
  - Look at the left half of the players only. What does the tournament among them look like, compared with the whole tournament?
  - 'It is the same kind of tournament on half the players. So the winner of the whole tournament is the better of the winners of the two halves, and the final is played between exactly those two.'
  - '$\text{win}(l, r)$ returns the player with the highest rating among $l..r-1$ by recursing on both halves. Compute the winners of the left and right halves of all players and print the label of the one with the lower rating. There are $O(2^N)$ calls.'
- id: lc-longest-nice-substring
  role: ladder
  card: divide-conquer
  rung: 2
  twist: There is no merge step. A letter that has only one case in the piece cuts the piece.
  summary: Find the longest substring of a string of at most $100$ letters in which every letter that appears, appears in both uppercase and lowercase (the earliest one if two are equally long).
  hints:
  - Can a letter that appears in only one case be inside a nice substring?
  - No. So cut the string at every such letter. A nice substring lies inside one piece, and each piece is the same question on a shorter string.
  - '$\text{rec}(l, r)$: if every letter of the piece has both cases, the whole piece is nice; otherwise recurse on each piece between the bad letters and keep the longer answer (the earlier one on a tie). Each cut removes a letter from play, so the depth is at most 52.'
- id: lc-sort-an-array
  role: ladder
  card: divide-conquer
  rung: 3
  twist: The merge step itself. The same split and merge now sorts the array.
  summary: Sort an array of at most $5 \cdot 10^4$ integers in $O(n \log n)$ time without using a library sort.
  hints:
  - Cut the array into two halves and sort each half with the same function. What is left to do?
  - 'Merge two sorted halves into one: look at the front value of each half and take the smaller one (the left one on a tie, so equal values keep their order). This is the two-pointer merge of topic 1.3.'
  - '$\text{msort}(l, r)$: if $r - l \le 1$ return; $m = (l + r)/2$; sort both halves; merge them into a buffer; copy the buffer back. The time is $T(n) = 2T(n/2) + O(n) = O(n \log n)$ (Theorem 3.1.5).'
- id: cf-1385D
  role: ladder
  card: divide-conquer
  rung: 4
  twist: The recursion carries a parameter, the letter its part must be made of, and tries both ways to split the work. †
  summary: A string of $n = 2^k$ lowercase letters ($n \le 131072$) is $c$-good if it has length 1 and is the letter $c$, or one half is all $c$ and the other half is $(c+1)$-good. Find the fewest letter changes that make it 'a'-good. †
  hints:
  - 'What are the two ways a string can be $c$-good? What must one half look like, and what must the other half be?'
  - 'If the left half is all $c$, the right half must be $(c+1)$-good, which is the same question on half the length with the next letter. The same holds with the halves swapped. Take the cheaper way.'
  - '$\text{cost}(l, r, c)$: if the length is 1, return $s_l \ne c$; otherwise return the smaller of (letters in the left half different from $c$) + $\text{cost}(\text{right}, c+1)$ and (letters in the right half different from $c$) + $\text{cost}(\text{left}, c+1)$. Each level scans $n$ letters in total, so $O(n \log n)$.'
- id: cf-873D
  role: review
  card: divide-conquer
  review_set: 1
  summary: Given $n \le 100000$ and $k \le 200000$, build a permutation for which a given merge sort (split in the middle, sort both halves, merge; a part that is already sorted is not split again) makes exactly $k$ calls of its recursive function, or say there is none. †
- id: lc-maximum-binary-tree
  role: drill
  summary: Build the tree of a list of at most $1000$ distinct numbers in which the root is the maximum and the left and right subtrees are built in the same way from the numbers before and after it.
- id: lc-majority-element
  role: drill
  summary: Find the value that occurs more than $\lfloor n/2 \rfloor$ times in an array of $n \le 5 \cdot 10^4$ numbers (such a value exists).
- id: lc-longest-substring-with-at-least-k-repeating-characters
  role: lookalike
  summary: Find the length of the longest substring of a string of at most $10^4$ lowercase letters in which every letter that appears, appears at least $k$ times.
- id: lc-length-of-longest-subarray-with-at-most-k-frequency
  role: lookalike
  summary: Find the length of the longest subarray of $n \le 10^5$ numbers in which every value appears at most $k$ times.
drill:
- problem: lc-combination-sum-ii
  answer:
    topic: '3.1'
    card: generate-all
  property: The output is a list of distinct multisets; sorting the candidates and skipping a repeated
    value within one loop gives each combination once, and breaking the loop when a candidate exceeds
    the remaining target cuts dead branches early.
  why_others_fail: A bitmask over 100 candidates (0.5) is $2^{100}$; the target is small, but a list of combinations, not a count, is asked.
- problem: lc-letter-tile-possibilities
  answer:
    topic: '3.1'
    card: generate-all
  property: The answer counts distinct sequences of a multiset of at most 7 tiles; trying each distinct
    letter once per position (count per letter) lists each sequence once, and there are at most 13 699
    of them.
  why_others_fail: next_permutation (0.5) only gives full-length arrangements, and every subset of tiles
    would need sorting and a set to remove repeats; a formula would need multinomials over every choice
    of counts.
- problem: lc-maximum-score-words-formed-by-letters
  answer:
    topic: '3.1'
    card: generate-all
  property: Words are taken or skipped one at a time while the letter counts stay non-negative; a partial choice that overdraws a letter can never be repaired, so it is rejected at once, and $2^{14}$ choices fit anyway.
  why_others_fail: 'Greedy by word score (1.5) fails: two cheaper words can beat one expensive word that
    uses their letters. A plain bitmask (0.5) also works here; the recursion with counts avoids rechecking
    every word for each mask.'
- problem: ac-abc310_d
  answer:
    topic: '3.1'
    card: constraint-placement
  property: Place players one by one into an existing team or a new one (teams unlabelled, so a new team
    is always the next one); an incompatible pair is checked as soon as its second player is placed, and
    a placement with too few players left to fill the remaining teams is cut.
  why_others_fail: Assigning team labels to players ($T^N$ with 0.5) counts each division $T!$ times and ignores the empty-team rule unless handled; no counting formula handles arbitrary incompatible pairs.
- problem: lc-distribute-repeating-integers
  answer:
    topic: '3.1'
    card: bound-pruning
  property: Give orders, largest first, to a value whose remaining count is large enough; a value with
    the same remaining count as one already tried for this order is skipped (symmetry), and big orders
    first make failures appear near the root.
  why_others_fail: 'Greedy "largest order to the most frequent value" (1.5) fails on small cases, for example counts (3, 4) and orders (3, 2, 2): greedy gives the 3 to the count 4 and gets stuck, while 3 to the count 3 and 2 + 2 to the count 4 works; and $50^{10}$ assignments without cuts are too many.'
- problem: cf-1462C
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: The digits form a set from 1..9, only $2^9 = 512$ sets exist; for each set with sum $x$, the number is its digits in increasing order, and fewer digits make a smaller number.
  why_others_fail: 'A backtracking search over digit sequences works but is not needed: the order of the
    digits is fixed (increasing), so only the set matters, and 512 sets are a plain bitmask loop.'
- problem: lc-combination-sum-iii
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: The universe is only the 9 digits, so all 512 subsets can be checked with a bitmask; each
    mask is one set, so no set repeats.
  why_others_fail: Backtracking with a start index also works but is not needed for 9 items; it would
    matter only if the candidates were many or repeated.
- problem: lc-maximum-rows-covered-by-columns
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: At most $2^{12} = 4096$ column sets; a row is covered when its own mask of ones is a subset of the chosen mask, an $O(1)$ test per row.
  why_others_fail: Generating combinations recursively is the same search with more code; greedy by column
    frequency (1.5) fails when rows need columns together.
- problem: lc-minimum-limit-of-balls-in-a-bag
  answer:
    topic: '1.4'
    card: answer-search
  property: 'Feasibility of a penalty $p$ is monotone: if bags of at most $p$ are reachable, so are bags of at most $p + 1$; the splits needed are $\sum (\lceil x/p \rceil - 1)$, so binary search on $p$.'
  why_others_fail: Searching over ways to split (3.1) is hopeless with $10^5$ bags and $10^9$ operations; the choices of different bags are independent once $p$ is fixed.
- problem: lc-maximum-binary-tree
  answer:
    topic: '3.1'
    card: divide-conquer
  property: The list splits at its maximum into the numbers before it and the numbers after it, the two parts are independent, and the tree is the root with the two subtrees built by the same function. With $n \le 1000$ even an uneven split costs about $n^2/2 = 5 \cdot 10^5$ visits.
  why_others_fail: A stack (0.6) builds the tree in $O(n)$ but needs a separate argument, and is needed only when $n$ is large, because a sorted list makes the recursion cost $n^2/2$. Trying shapes of trees directly has no structure to prune.
- problem: lc-majority-element
  answer:
    topic: '0.6'
    card: map-counting
  property: Only how often each value occurs matters, so one pass with a map of counts finds the value whose count is above $n/2$ in $O(n \log n)$.
  why_others_fail: Divide and conquer also works, since the majority of the whole array is the majority of one half, but each merge needs a counting scan and the code is longer than one pass with a map. Checking every pair is $n^2/2 \approx 1.25 \cdot 10^9$.
lookalike_pairs:
- a: cses-1622
  b: lc-minimum-number-of-operations-to-make-string-sorted
  a_tool:
    topic: '3.1'
    card: generate-all
  b_tool:
    topic: '2.3'
    card: ncr-mod-p
  flipping_difference: 'Both live in the list of distinct arrangements of a string in lexicographic order. A asks to print the whole list, so $n \le 8$ and listing is the answer. B (once the operation is seen to be "go to the previous arrangement") asks only for a position in that list for $n = 3000$, where the list has astronomically many entries: count instead of listing.'
  shared_surface: Both concern the arrangements of a string in lexicographic order.
  flipping_input: 'A: print every distinct arrangement of the 3 letters A A B (3 lines). B: the position
    of an arrangement of a string of length 3000, where the list has astronomically many entries and counting
    with multinomial coefficients replaces listing.'
- a: lc-maximum-points-in-an-archery-competition
  b: lc-find-the-punishment-number-of-an-integer
  a_tool:
    topic: '0.5'
    card: subset-bitmask
  b_tool:
    topic: '3.1'
    card: generate-all
  shared_surface: Both try every choice of a small number of options and keep the best or count the good ones.
  flipping_difference: In A each of 12 sections is won or skipped, so the choices are the subsets of a fixed set and a bitmask lists them. In B a number is cut into pieces at unknown places, so the choices are ordered cuts, and a recursion with a canonical order lists each cut once.
  flipping_input: 'A: 12 sections and 9 arrows, win a subset of sections (a bitmask over 12). B: the number 36 squared is 1296, cut into 1 + 29 + 6, so the cuts of the digits are listed by recursion.'
- a: lc-longest-substring-with-at-least-k-repeating-characters
  b: lc-length-of-longest-subarray-with-at-most-k-frequency
  a_tool:
    topic: '3.1'
    card: divide-conquer
  b_tool:
    topic: '1.3'
    card: shrinkable-window
  flipping_difference: With "at most $k$", a window that breaks the rule is repaired by moving its left end, and the best window ending at each position never moves backwards, so two pointers work. With "at least $k$", a longer piece can repair the rule, so no pointer rule exists; but a letter that appears fewer than $k$ times in the piece lies in no valid substring, and cutting at it gives independent pieces.
  shared_surface: Both ask for the longest substring or subarray in which the count of every value is compared with $k$.
  flipping_input: 'B: 1 2 3 1 2 3 1 2 with $k = 2$, where a window that gets a third copy of a value is shortened from the left and the answer is 6. A: aabcc with $k = 2$, where b appears once and is cut out, leaving the pieces aa and cc, so the answer is 2.'
self_test:
- q: For 4 queens, a programmer adds the test "reject a queen placed in column 0" to make the search faster.
    What does the program print, and which condition of Theorem 3.1.1 is broken?
  a: 'It prints 0 instead of 2: both solutions, (1, 3, 0, 2) and (2, 0, 3, 1), have a queen in column
    0. The test rejects partial solutions that can still be completed, so the condition "never reject
    a completable partial solution" fails.'
- q: How many distinct sub-multisets does (1, 1, 2) have, and how many does the recursion of Theorem 3.1.2
    produce without the skip rule?
  a: 'With the skip: 3 · 2 = 6 (take 0, 1 or 2 copies of 1 and 0 or 1 copy of 2). Without it, every subset
    of the 3 indices is produced, 2^3 = 8, with {1} and {1, 2} each appearing twice.'
- q: For "choose items with values $\ge 0$ to maximise the total under a weight limit", is "value so far" an optimistic estimate for branch and bound? Give numbers.
  a: 'No. It never exceeds the best completion, so it is pessimistic: with best = 5 found and a partial
    solution of value 3 that can still add an item of value 4, the estimate 3 ≤ 5 cuts the branch although
    7 is reachable. "Value so far + values of all undecided items" is optimistic.'
- q: With a budget of about $10^8$ steps, why does a search over 40 yes-or-no choices fail even with a good bound, and which topic covers the way out?
  a: 'The bound has no guarantee: with nearly equal values it cuts little, and $2^{40} \approx 10^{12}$ is $10^4$ times the budget. Splitting the choices into two halves of 20 is covered in topic 3.9.'
- q: For 3 queens there is no solution. How many calls does the queens search make, and how many would
    it make with an exact test?
  a: 'The queens test makes 6 calls: the root, the 3 queens of row 0, and 2 queens of row 1 (after columns
    0 and 2), each of which has no free square in row 2. An exact test accepts no partial solution, since
    none can be completed, so only the root is called: (L + 1) · S = 0 calls besides it.'
- q: In the smallest-largest-load search, why may a job skip a worker whose load equals the load of an
    earlier worker, but not a worker whose load is merely larger?
  a: 'Swapping two workers with equal loads maps every completion to one with the same loads, so both
    branches have the same best value. Workers with different loads are not interchangeable: for jobs
    (2, 6, 8, 14, 8, 6, 9) on 2 workers, forbidding the more loaded worker gives 28 instead of the optimum
    27.'
- q: When the merge takes a value from the right half, why does it add `m - i`, and why must a tie take the left value?
  a: 'The right value is smaller than the smallest waiting left value, and the waiting left values are sorted, so all `m - i` of them are greater: each is a crossing inversion with it. Equal values are not an inversion, so on a tie the left value goes first. For 2 2 the answer is 0; sending ties to the right half would count 1 (Theorem 3.1.5).'
- q: Why does cutting at the largest element not give $O(n \log n)$ in general? Give the work for a sorted array of $n = 1024$.
  a: 'The parts have sizes $k$ and $n - 1 - k$. For a sorted array they are $n - 1$ and 0, so $T(n) = T(n-1) + O(n) = O(n^2)$ and the depth is $n$. The $O(n \log n)$ bound needs an even split. For $n = 1024$ the work is 524 799 element visits against 10 240 for an even split.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - lc-sudoku-solver
  - lc-matchsticks-to-square
  - ac-abc326_d
decision_map:
- weak_signal: '"Return all" combinations, subsets, permutations or partitions; the output is the list
    itself'
  choose: generate-all
  when: The number of valid objects is small enough to print, and each object has one canonical order
    of choices (Theorem 3.1.2).
  over:
  - card: subset-bitmask
    because: A bitmask lists index subsets; with repeated values the same collection appears several times
      and must be filtered, while the skip rule never produces repeats.
    topic: '0.5'
  - card: ncr-mod-p
    because: When only the count is asked and it is huge (printed modulo a prime), count with a formula
      instead of listing.
    topic: '2.3'
- weak_signal: $n \le 8\text{–}10$ and "visit every … once", "arrange", "relabel"
  choose: constraint-placement
  when: Constraints can be checked as each item is placed, so most orders die after a few placements (Theorem
    3.1.1).
  over:
  - card: permutations
    because: next_permutation checks only complete orders; it is enough when n! times the check fits,
      but cannot cut a bad prefix.
    topic: '0.5'
- weak_signal: 'A puzzle on a small board: queens, Sudoku, tiles, a word path through a grid'
  choose: constraint-placement
  when: Every rule involves a few cells and is checked as soon as they are filled; marks are undone after
    each call (Theorem 3.1.1).
  over:
  - card: recursive-choices
    because: Without checks before the last position, the search lists every filling of the board, astronomically
      many.
    topic: '0.5'
  - card: grid-processing
    because: Walking or simulating once on the grid answers questions about one path; a puzzle asks for
      a filling, which needs a search.
    topic: '0.3'
- weak_signal: '"Minimise the maximum", "maximise the minimum", "the least time / capacity / speed such
    that …"'
  choose: bound-pruning
  when: Few items ($n \le 12\text{–}20$) go to groups in any combination, and the current largest load is an optimistic estimate (Theorem 3.1.3).
  over:
  - card: answer-search
    because: Binary search on the answer needs a fast feasibility test; when items may go to any group
      in any combination, the test is itself a search.
    topic: '1.4'
  - card: extreme-first
    because: Greedy "largest item to the least loaded group" is a good first answer for the bound, but
      not always optimal.
    topic: '1.5'
- weak_signal: Small $n$ ($\le 20$) and "choose some of the items"
  choose: generate-all
  when: Chosen items conflict with each other or use up a shared resource, so a recursion that checks
    each addition stops early; with no conflicts, a bitmask is simpler.
  over:
  - card: subset-bitmask
    because: A bitmask checks every subset in full, which is fine for $n \le 20$; recursion pays off when conflicts cut most branches or the work per subset is large.
    topic: '0.5'
- weak_signal: Count the pairs $i < j$ with a condition between the two values, or the best segment that may cross the middle, with $n$ up to $2 \cdot 10^5$
  choose: divide-conquer
  when: The answer for a range is the answer for its two halves plus a cross term that takes $O(n)$ (for example while merging two sorted halves), and the split is even (Theorem 3.1.5).
  over:
  - card: sort-then-scan
    because: Sorting alone forgets the original positions, which an inversion depends on; sorting inside a merge keeps the count.
    topic: '1.1'
  - card: shrinkable-window
    because: Two pointers need a rule that stays broken once a window is too long; a crossing pair, or an "at least $k$" rule, is not monotone like that.
    topic: '1.3'
