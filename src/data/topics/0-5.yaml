# Topic 0.5 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.5'
uses:
- topic: '0.1'
  what: 'long long: subset sums of 20 weights up to 10^9 reach 2·10^10'
- topic: '0.2'
  what: The step budget, used to decide whether the number of candidates is small enough
- topic: '0.3'
  what: 'Implementation: checking one candidate is often a small simulation or a grid scan'
- topic: '0.4'
  what: Remainders and divisibility, which appear in many checks
theorems:
- id: 0.5.1
  title: Exhaustive search is correct and costs candidates times check
  plain_words: If you check every candidate and keep the best, you get the right answer; the cost is the
    number of candidates times the cost of one check. Pairs, triples, subsets and orders have well-known
    counts, so the budget can be checked before coding.
  code: 0.5/thm-1
- id: 0.5.2
  title: A bitmask is a subset
  plain_words: The numbers from 0 to 2^n − 1, written in binary, correspond one to one to the subsets
    of n items, with bit i telling whether item i is in. A single loop over the numbers lists every subset
    exactly once.
  code: 0.5/thm-2
- id: 0.5.3
  title: next_permutation visits every arrangement once
  plain_words: Starting from the sorted sequence and repeatedly taking the next larger arrangement visits
    every distinct arrangement exactly once, in increasing order. Starting from an unsorted sequence skips
    the arrangements before it.
  code: 0.5/thm-3
- id: 0.5.4
  title: A recursion that tries every choice lists all sequences once
  plain_words: A function that fills one position, tries every allowed value there and calls itself for
    the next position checks every sequence exactly once. It works even when the number of positions comes
    from the input.
  code: 0.5/thm-4
- id: 0.5.5
  title: Testing every value in order finds the smallest answer
  plain_words: If the answer is the smallest value in a known range that passes a test, trying the values
    from the smallest up and stopping at the first success returns it. If none passes, there is no answer.
  code: 0.5/thm-5
cards:
- id: nested-loops
  name: Try every pair or triple
  decisive_property: The candidates are pairs, triples or a few values, every candidate is listed by nested
    loops, and their number (about n²/2 or n³/6, fewer after computing the last variable from the others)
    times the check fits the budget.
  from_theorem: 0.5.1
  how_to_test: Write the candidate as a tuple, count the tuples with the largest input, and see whether
    one variable is determined by the others.
  constraint_shapes:
  - 'n up to 3000 with pairs: 3000·2999/2 ≈ 4.5·10^6 pairs fit the budget of 10^8 easily; n up to 10^4
    gives 5·10^7 pairs, still in budget, while n = 2·10^5 gives 2·10^10 pairs and does not.'
  - 'Three variables each up to K = 3000: a triple loop is 3001³ ≈ 2.7·10^10 steps, but fixing the third
    from the other two is 3001² ≈ 9·10^6.'
  weak_signals:
  - form: Asks how many ways to choose two or three values with a given sum or property
    shape: A small total or n up to 100 to 3000, and values in a small range
  - form: Asks whether a sum of coins or items can equal a target
    shape: Three or four kinds of items with small counts
  kill_signals:
  - 'n² is far over the budget: for n = 2·10^5 there are 2·10^10 pairs, so a sort, a map or a formula
    is needed.'
  - 'The loop bounds are wrong, not the idea: with the inner loop starting at j = i instead of i + 1,
    the pairs of 1 2 3 adding up to 4 count 2 instead of 1, because 2 + 2 is counted.'
  in_action:
    statement: Count the triples (x, y, z) of integers with 0 ≤ x, y, z ≤ K and x + 2y + 3z = S.
    constraints: 0 ≤ K ≤ 3000.
    budget: Three nested loops are (K + 1)³ ≈ 2.7·10^10 steps, 270 times the budget of 10^8. Two loops
      are (K + 1)² ≈ 9·10^6.
    candidates:
    - tool: Three nested loops over x, y, z
      verdict: rejected
      because: About 2.7·10^10 steps.
    - tool: Two loops over y and z, with x = S − 2y − 3z computed (this topic)
      verdict: chosen
      because: x is determined by the other two, so no candidate is missed, and 9·10^6 steps fit.
    property_check: Every valid triple has x = S − 2y − 3z, so looping over y and z and testing 0 ≤ x
      ≤ K lists every valid triple exactly once (Theorem 0.5.1). The number of candidates is (K + 1)²
      and each check is O(1).
    decision: Loop over y and z, compute x, count when 0 ≤ x ≤ K.
  examples:
    positive:
    - inline:
        input: Triples (x, y, z) with 0 ≤ x, y, z ≤ 3 and x + 2y + 3z = 6
        answer: '5'
        why: Looping over y and z and computing x finds (0,3,0), (2,2,0), (3,0,1), (1,1,1), (0,0,2) —
          five triples, the same five that three loops find.
    - worked_example: ac-abc144_b
      why: Whether N can be written as a product of two integers from 1 to 9 is decided by trying all
        81 pairs.
    negative:
    - inline:
        input: Pairs i < j of 1 2 3 that add up to 4, with the inner loop starting at j = i
        answer: '1'
        method_gives: '2'
        why: Starting the inner loop at j = i pairs an item with itself, and 2 + 2 = 4 is counted. The
          pairs i < j start at j = i + 1.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: Pairs of 1 2 3 4 that add up to 5, with i and j both running over every index
        answer: '2'
        method_gives: '4'
        why: Each unordered pair {1, 4} and {2, 3} is counted in both orders. The theorem counts pairs
          i < j, each once.
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: The same question about pairs with n = 2·10^5
    tool:
      topic: '0.5'
      card: nested-loops
    flipping_difference: n²/2 = 2·10^10 pairs do not fit the budget, so listing every pair is no longer
      an option; with n = 3000 it is.
  complexity: O(n²) for pairs, O(n³) for triples, O(K²) after fixing the last variable.
- id: subset-bitmask
  name: All subsets as bitmasks
  decisive_property: Each of n ≤ about 20 items is independently in or out, every subset can be checked
    on its own, and 2^n · (cost of one check) fits the budget.
  from_theorem: 0.5.2
  how_to_test: Ask "is this a yes/no choice for each item?", then compute 2^n times the cost of checking
    one subset.
  constraint_shapes:
  - 'n = 20 items: 2^20 = 1 048 576 subsets, each checked in 20 steps, about 2·10^7 steps, which fits;
    n = 40 would be 2^40 ≈ 10^12 subsets, which does not.'
  weak_signals:
  - form: Asks to choose some of the items, split them into two groups, or say which switches are on
    shape: N ≤ 15 or N ≤ 20 in an otherwise ordinary statement
  - form: Every item is either used or not used
    shape: The check of one choice is a sum or a count over the chosen items
  kill_signals:
  - 'Each item has more than two options: three items each placed in A, B or C have 27 placements, but
    3 bits give only 8 subsets.'
  - 'Order matters: the orders of 3 items number 6, while the 8 subsets of 3 items say nothing about order.'
  in_action:
    statement: Split n apples of weights p_1, …, p_n into two groups so that the difference of the group
      weights is as small as possible.
    constraints: 1 ≤ n ≤ 20, 1 ≤ p_i ≤ 10^9.
    budget: 2^20 · 20 ≈ 2·10^7 steps to try every split, well inside 10^8.
    candidates:
    - tool: Try the splits greedily, heaviest apple first
      verdict: rejected
      because: A greedy order is not proved to give the minimum (3, 3, 2, 2, 2 split greedily gives a
        difference of 2, the best is 0).
    - tool: Try every subset as group 1, with a bitmask (this topic)
      verdict: chosen
      because: Each apple is in group 1 or not, so a split is a subset, and 2^20 subsets fit the budget.
    property_check: Each apple independently goes to group 1 or group 2, so splits correspond to the subsets
      of the apples (Theorem 0.5.2). Group 2 weighs total − s, so the difference of a subset of weight
      s is |total − 2s|. 2^20 subsets with 20 steps each is about 2·10^7.
    decision: Loop over masks, add up the weights of the chosen apples, and keep the smallest |total −
      2s|.
  examples:
    positive:
    - inline:
        input: Subsets of {3, 5, 7} with sum between 8 and 12
        answer: '3'
        why: The subsets {3, 5}, {5, 7} and {3, 7} have sums 8, 12 and 10; the empty set, the singletons
          and the full set 15 fall outside. Eight bitmasks cover all of them.
    - inline:
        input: The number of subsets of 4 items
        answer: '16'
        why: Four items give the bitmasks 0 to 15, one for each yes/no choice, 2^4 = 16.
    - worked_example: cses-1623
      why: Each apple is in group 1 or not, so the splits are exactly the subsets, and with n ≤ 20 all
        2^20 of them are tried.
    negative:
    - inline:
        input: Each of 2 items is placed in place A, B or C, counted with one bit per item
        answer: '9'
        method_gives: '4'
        why: Two bits give only 2^2 = 4 combinations, but three places per item give 3 · 3 = 9 placements.
          More than two options per item need recursion, not one bit.
      correct_tool:
        topic: '0.5'
        card: recursive-choices
    - inline:
        input: The number of different orders of 3 items, counted as the subsets of 3 items
        answer: '6'
        method_gives: '8'
        why: There are 3! = 6 orders but 2^3 = 8 subsets; a subset records which items are chosen, not
          in what order. When order matters, list the orders.
      correct_tool:
        topic: '0.5'
        card: permutations
  lookalikes:
  - description: Each item goes to one of three or four places
    tool:
      topic: '0.5'
      card: recursive-choices
    flipping_difference: More than two choices per item do not fit one bit each; recursion (or base k
      counting) lists them.
  complexity: O(2^n · n) when each subset is checked in O(n).
- id: permutations
  name: All orders
  decisive_property: The answer depends on the order of n ≤ about 9 items, every order can be checked
    on its own, and (number of distinct orders, at most n!) times the check fits the budget.
  from_theorem: 0.5.3
  how_to_test: Ask whether swapping two items changes the result (then the order matters), and compute
    n! · n.
  constraint_shapes:
  - 'n = 9 items: 9! = 362 880 orders, each checked in 9 steps, about 3·10^6 steps; n = 12 gives 12! =
    479 001 600 orders and does not fit.'
  weak_signals:
  - form: Asks to visit every city once, arrange items, or relabel in some order
    shape: N ≤ 8 or N ≤ 10 and a cost that depends on the order
  - form: Asks for the K-th arrangement of the letters of a string
    shape: A short string, and the arrangements are taken in alphabetical order
  kill_signals:
  - 'Only which items are chosen matters, not their order: choosing 2 of 4 items has 6 choices, but listing
    orders gives 12.'
  - 'n is 12 or more: 12! = 479 001 600 orders is far over the budget once each is checked.'
  in_action:
    statement: Visit all n places once, in any order, starting anywhere; moving from i to j costs w[i][j].
      Print the smallest total cost.
    constraints: 1 ≤ n ≤ 9, 0 ≤ w[i][j] ≤ 10^9.
    budget: 9! · 9 ≈ 3·10^6 steps to try every order.
    candidates:
    - tool: Always move to the cheapest unvisited place
      verdict: rejected
      because: A locally cheap move can force an expensive one later; there is no proof that it gives
        the minimum.
    - tool: Try every order with next_permutation (this topic)
      verdict: chosen
      because: The cost depends on the order, and 9! orders fit the budget.
    property_check: The total cost changes when two places are swapped, so the order matters, and the
      9! orders are all candidates. Starting from the sorted order 0, 1, …, n − 1, next_permutation visits
      each order once (Theorem 0.5.3).
    decision: Loop do … while next_permutation over the places, compute each cost, keep the smallest.
  examples:
    positive:
    - inline:
        input: Places 0, 1, 2 with cost w[i][j] = 10 · |i − j| + (1 if i > j); the cheapest order
        answer: '20'
        why: The order 0, 1, 2 costs 10 + 10 = 20, the order 2, 1, 0 costs 11 + 11 = 22, and every other
          order costs 31, so the minimum is 20; the six orders are all candidates.
    - worked_example: ac-abc054_c
      why: A path from vertex 1 that visits every vertex once is an order of the other vertices; with
        N ≤ 8 all 7! orders are tried.
    negative:
    - inline:
        input: Choose 2 of 4 items (order irrelevant), counted as the orders of 2 of the 4 items
        answer: '6'
        method_gives: '12'
        why: Orders count each pair {a, b} twice (a, b and b, a). When order is irrelevant only the 6
          subsets matter.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - inline:
        input: The arrangements of 3 2 1 listed with next_permutation, started from the unsorted order
        answer: '6'
        method_gives: '1'
        why: 3 2 1 is already the largest arrangement, so next_permutation stops at once and visits one
          arrangement. Sort the sequence first.
      correct_tool:
        topic: '0.5'
        card: permutations
  lookalikes:
  - description: Choose which items to take, order irrelevant
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: 'With order irrelevant, 2^n subsets replace n! orders: far fewer candidates.'
  complexity: O(n! · n) when each order is checked in O(n).
- id: recursive-choices
  name: Recursive generation
  decisive_property: A candidate is a sequence of L choices whose length L is part of the input (or whose
    allowed choices depend on earlier ones), and the number of sequences (k^L or fewer) times the check
    fits the budget.
  from_theorem: 0.5.4
  how_to_test: Write the candidate as positions with choices; check that L varies with the input, so a
    fixed number of nested loops cannot list it, and bound the number of sequences.
  constraint_shapes:
  - 'L and M up to 8: at most 8^8 = 16 777 216 sequences, each checked in 8 steps, about 1.3·10^8 steps
    at the very edge; with a restriction such as |c_p − c_{p−1}| ≤ D far fewer remain.'
  weak_signals:
  - form: Asks for all sequences of length N that satisfy a rule, such as non-decreasing sequences or
      numbers written only with the digits 3, 5, 7
    shape: N and M together at most about 10
  - form: Each item has three or more options
    shape: A product k^L of small parameters, such as 4^8 = 65 536
  kill_signals:
  - 'k^L is far over the budget even for small-looking parameters: L = 30 with k = 2 is 2^30 ≈ 10^9 sequences.'
  - 'The rule restricts the choices, but the recursion tries every value: for length 2 over 1..3 with
    |c_1 − c_0| ≤ 1 there are 7 valid sequences, and an unrestricted recursion lists 9.'
  in_action:
    statement: Print all sequences c_0 … c_{L−1} with every c_p in 1..M and |c_p − c_{p−1}| ≤ D, in lexicographic
      order.
    constraints: 1 ≤ L ≤ 8, 1 ≤ M ≤ 8, 0 ≤ D < M.
    budget: At most 8^8 ≈ 1.7·10^7 sequences are possible, and the restriction cuts most of them.
    candidates:
    - tool: L nested loops written out
      verdict: rejected
      because: L is part of the input, so the number of loops is not fixed in the code.
    - tool: A recursive function that fills position pos and calls itself for pos + 1 (this topic)
      verdict: chosen
      because: The recursion depth equals L, and the allowed values at pos can depend on c[pos − 1].
    property_check: By induction on L − pos, rec(pos) with the earlier positions fixed tries every allowed
      value at pos and completes the rest in every way, exactly once (Theorem 0.5.4). The restriction
      is just a continue inside the loop.
    decision: 'rec(pos): base case pos == L stores the sequence; otherwise loop over v, skip values with
      |v − c[pos − 1]| > D, set c[pos] = v and recurse.'
  examples:
    positive:
    - inline:
        input: Sequences of length 3 over {1, 2}
        answer: '8'
        why: Each of 3 positions has 2 choices, so 2 · 2 · 2 = 8 sequences; the recursion reaches the
          base case once per sequence.
    - inline:
        input: Non-decreasing sequences of length 2 over 1..3
        answer: '6'
        why: The allowed values at position 1 are those at least c_0, giving 11, 12, 13, 22, 23, 33 —
          six sequences.
    negative:
    - inline:
        input: Strictly increasing sequences of length 2 over 1..4, listed by recursing over every value
          at both positions
        answer: '6'
        method_gives: '16'
        why: The recursion generates all 4 · 4 = 16 sequences, but only 6 are strictly increasing. Such
          a sequence is the same as a 2-element subset of 1..4, which a bitmask lists directly.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - inline:
        input: Sequences of length 2 over 1..3 with |c_1 − c_0| ≤ 1, where the recursion forgets the condition
        answer: '7'
        method_gives: '9'
        why: Without the continue on |v − c[pos − 1]| > D the recursion lists all 3 · 3 = 9 sequences;
          the choices at pos must be restricted by the earlier choice.
      correct_tool:
        topic: '0.5'
        card: recursive-choices
  lookalikes:
  - description: Strictly increasing sequences of length N from 1..M
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: A strictly increasing sequence is the same as the set of its values, so N-element
      subsets list them; repeats would break that.
  complexity: O(k^L) sequences times the cost of a check.
- id: enumerate-answer
  name: Try every candidate answer
  decisive_property: The answer (or one key quantity) lies in a range proved small from the constraints,
    and each value can be checked directly, so testing every value in order finds the smallest that works.
  from_theorem: 0.5.5
  how_to_test: Bound the answer from the constraints, then check that (range size) × (cost of one check)
    fits the budget.
  constraint_shapes:
  - 'An answer proved to lie in 1..10^6 with a check of 20 steps: 2·10^7 steps fit; if the answer may
    be as large as 10^9, testing every value is 10^9 tests, ten seconds, and does not.'
  weak_signals:
  - form: Asks for the smallest x such that a property holds
    shape: A small proved bound on x, such as x ≤ 10^6
  - form: One quantity, such as the number of mixed items bought or the starting value, determines everything
      else
    shape: The range of that quantity is small even though the inputs are large
  kill_signals:
  - 'The range is huge: the smallest x with x² ≥ 10^18 is 10^9, and a test limited to 10^6 values returns
    no answer; compute it with an integer square root instead.'
  - 'The proved bound is wrong or missing: the smallest x with digit sum 40 is 49 999, and testing only
    x ≤ 9999 finds none.'
  in_action:
    statement: Find the smallest x with 1 ≤ x ≤ 10^6 that is a multiple of K and has digit sum S, or print
      −1.
    constraints: 1 ≤ S ≤ 60, 1 ≤ K ≤ 10^6.
    budget: 10^6 values, each checked in about 7 steps (the digits), 7·10^6 steps in all.
    candidates:
    - tool: Build x digit by digit from S
      verdict: rejected
      because: Requires a construction that is easy to get wrong; the bound 10^6 makes testing every x
        cheap.
    - tool: Test every x from 1 to 10^6 in order and stop at the first success (this topic)
      verdict: chosen
      because: The range is small, each test is a remainder and a digit sum, and the first x that passes
        is the smallest.
    property_check: The answer, if it exists, lies in 1..10^6 by the statement, and 7·10^6 steps fit the
      budget. Every smaller x was tested and failed, so the first success is the smallest (Theorem 0.5.5).
    decision: Loop x upward; print the first x with x % K == 0 and digit sum S; print −1 if none.
  examples:
    positive:
    - inline:
        input: The smallest x in 1..100 divisible by 7 with digit sum 10
        answer: '28'
        why: The multiples of 7 below 28 have digit sums 7, 5, 3 (7, 14, 21), and 28 has 2 + 8 = 10; testing
          in order stops there.
    - inline:
        input: The smallest x with x · x ≥ 50
        answer: '8'
        why: 7 · 7 = 49 is below 50 and 8 · 8 = 64 is not, so testing x = 1, 2, … stops at 8.
    negative:
    - inline:
        input: The smallest x with x · x ≥ 10^18, testing x up to 10^6
        answer: '1000000000'
        method_gives: '-1'
        why: The answer is 10^9, far outside the tested range. With such a range testing every value costs
          10^9 steps, and the answer comes from an exact integer square root.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
    - inline:
        input: The smallest x with digit sum 40, testing x up to 9999
        answer: '49999'
        method_gives: '-1'
        why: 'A number below 10^4 has digit sum at most 36, so the range was too small. The bound must
          be proved: the smallest number with digit sum 40 has five digits (4 + 9 + 9 + 9 + 9).'
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
  lookalikes:
  - description: The same smallest-x question with x up to 10^18
    tool:
      topic: '0.1'
      card: integer-rounding
    flipping_difference: Testing every value is impossible; the answer must be computed (an exact root,
      a division) or found by a faster search.
  complexity: O(range · cost of one check).
problems:
- id: ac-abc087_b
  role: ladder
  card: nested-loops
  rung: 1
  twist: Base case of the card
  summary: Count the ways to pay exactly X yen with at most A coins of 500, B of 100 and C of 50 (A, B,
    C ≤ 50).
  hints:
  - How many combinations (a, b, c) are there in total?
  - 'At most 51³ ≈ 1.3·10^5: few enough to try them all (Theorem 0.5.1).'
  - Three loops over a ≤ A, b ≤ B, c ≤ C; count those with 500a + 100b + 50c = X.
- id: ac-abc181_c
  role: ladder
  card: nested-loops
  rung: 2
  twist: Triples of points instead of numbers, with an exact integer test for each.
  summary: Do any three of N points (N ≤ 10^2, coordinates ≤ 10^3) lie on one line?
  hints:
  - How many triples of points are there, and how do you test one without division?
  - At most 100·99·98/6 ≈ 1.6·10^5 triples. Points 1, 2, 3 are on one line exactly when (x2 − x1)(y3 −
    y1) = (y2 − y1)(x3 − x1).
  - Three loops i < j < k with that integer test; print Yes at the first match.
- id: ac-abc085_c
  role: ladder
  card: nested-loops
  rung: 3
  twist: The third count is determined by the other two, so two loops suffice.
  summary: Can N bills (N ≤ 2000) of 10000, 5000 and 1000 yen add up to exactly Y yen? Print one way or
    −1 −1 −1.
  hints:
  - Three loops of 2001 values are 8·10^9 steps. Is the third count free?
  - 'No: with x and y chosen, z = N − x − y is forced (Section 4.1).'
  - 'Loop x and y with x + y ≤ N, set z = N − x − y, and test 10000x + 5000y + 1000z = Y: about 2·10^6
    steps.'
- id: ac-abc051_b
  role: ladder
  card: nested-loops
  rung: 4
  twist: The computed variable needs its own bound check.
  summary: Count triples (X, Y, Z) with 0 ≤ X, Y, Z ≤ K and X + Y + Z = S (K ≤ 2500).
  hints:
  - Three loops cost 1.6·10^10. Which variable is determined by the other two?
  - Z = S − X − Y. It must also satisfy 0 ≤ Z ≤ K, which the loops no longer guarantee.
  - Loop X and Y (6.25·10^6 steps), compute Z, and count it when 0 ≤ Z ≤ K.
- id: lc-subsets
  role: ladder
  card: subset-bitmask
  rung: 1
  twist: Base case of the card
  summary: List every subset of an array of n ≤ 10 distinct numbers.
  hints:
  - How many subsets are there, and how can one integer stand for one subset?
  - There are 2^n; the integers 0..2^n − 1 correspond to them one-to-one (Theorem 0.5.2).
  - For each mask, collect nums[i] for every i with (mask >> i) & 1.
- id: ac-abc079_c
  role: ladder
  card: subset-bitmask
  rung: 2
  twist: 'Each of the three operators is + or −: a bitmask over the operators, not the items.'
  summary: Insert + or − between the four digits of ABCD so the value is 7; print one such formula.
  hints:
  - How many ways are there to choose the three operators?
  - '2³ = 8: let bit k of a mask choose + or − for the k-th operator.'
  - For mask 0..7 evaluate the formula; print the first that gives 7.
- id: ac-abc289_c
  role: ladder
  card: subset-bitmask
  rung: 3
  twist: The check of a subset is itself a small scan (mark the covered numbers).
  summary: M sets of numbers from 1..N (N, M ≤ 10); count the choices of sets whose union is all of 1..N.
  hints:
  - How many choices of sets are there, and how much does checking one cost?
  - '2^M ≤ 1024 choices, each checked by marking the numbers of the chosen sets: about N·M steps.'
  - For every mask, mark the elements of the chosen sets in a boolean array and count the masks where
    all of 1..N are marked.
- id: ac-abc190_c
  role: ladder
  card: subset-bitmask
  rung: 4
  twist: The bit chooses between two options of a person, not "in or out".
  summary: K people (K ≤ 16) each put a ball on one of two given dishes; M conditions each need two dishes
    to both have a ball; the most conditions satisfied.
  hints:
  - What is one candidate, and how many are there?
  - 'A choice of dish for every person: 2^K ≤ 65536 candidates, one bit per person.'
  - For each mask place the balls (dish C_i if bit i is 0, else D_i), then count the conditions met; keep
    the maximum. About 2^K·(K + M) steps.
- id: ac-abc167_c
  role: ladder
  card: subset-bitmask
  rung: 5
  twist: Optimise a cost over subsets while checking several requirements at once.
  summary: N books (N ≤ 12) each cost C_i and raise M skills (M ≤ 12) by given amounts; the cheapest set
    of books that brings every skill to at least X, or −1.
  hints:
  - How many sets of books are there?
  - '2^12 = 4096; for each, add up the cost and the gain in every skill: 4096·12·12 ≈ 6·10^5 steps.'
  - For every mask sum costs and skills, check all skills ≥ X, and keep the minimum cost; −1 if no mask
    passes.
- id: lc-permutations
  role: ladder
  card: permutations
  rung: 1
  twist: Base case of the card
  summary: List every order of an array of n ≤ 6 distinct numbers.
  hints:
  - If you only had the indices 0..n − 1, which order would come first?
  - The sorted order 0, 1, …, n − 1. Stepping with next_permutation from it visits every order once (Theorem
    0.5.3).
  - Fill idx with 0..n − 1, then do { record nums[idx[0]], …, nums[idx[n − 1]] } while (next_permutation(idx)).
- id: ac-abc145_c
  role: ladder
  card: permutations
  rung: 2
  twist: Average a quantity over all n! orders instead of finding one order.
  summary: N towns (N ≤ 8) at given points; the average length of a path visiting all of them, over all
