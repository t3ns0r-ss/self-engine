drill:
- problem: cses-3138
  answer:
    topic: '6.1'
    card: palindrome-hash
  property: The longest palindrome ending at i is at most two letters longer than the one ending at i
    − 1, so trying lengths from the previous answer + 2 downward with O(1) hash tests makes O(n) tests
    in all.
  why_others_fail: A table of palindromic blocks has n²/2 = 2·10^10 entries for n = 2·10^5, and scanning
    every block is O(n²).
- problem: ac-abc250_e
  answer:
    topic: '6.1'
    card: distinct-by-hash
  property: The hash of the set of the first x terms of A is the sum of random weights of its different
    values; two sets are equal when their hashes are equal.
  why_others_fail: Building a set for each query costs O(n) per query, 4·10^10 steps in all; comparing
    only the sizes ignores which values are present.
- problem: ac-abc158_e
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: 'For a prime P other than 2 and 5, the substring from i to j is divisible by P exactly when
    the remainders of the suffixes starting at i and at j are equal; count equal remainders with an array
    of size P (P = 2 or 5: look at the last digit).'
  why_others_fail: 'Hashing blocks does not help: the question is about the value of a block modulo P,
    which the suffix remainders give directly.'
- problem: cf-1731C
  answer:
    topic: '1.7'
    card: prefix-xor
  property: The XOR of a subarray is the XOR of two prefix values; for each of the about √(2n) squares,
    count the pairs of prefix values that XOR to it with an array of counts.
  why_others_fail: There is nothing to compare for equality between blocks; the quantity is an XOR value,
    not the identity of a block.
- problem: cf-778A
  answer:
    topic: '1.4'
    card: answer-search
  property: If k removals still leave p as a subsequence, so do k − 1; binary search k and test with one
    greedy scan that marks the removed places.
  why_others_fail: The test is a subsequence check on letters that skips some places, not a comparison
    of equal blocks, so block hashes cannot decide it.
- problem: cf-1290B
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: The answer depends on the length of the range, its first and last letters and the number of
    different letters in it; the counts of every letter in a range are differences of 26 prefix-count
    arrays.
  why_others_fail: No two blocks are compared with each other; hashing would compute a number that the
    decision never uses.
- problem: cf-1426F
  answer:
    topic: '3.2'
    card: linear-state
  property: Run through the string keeping four counts (the number of ways to have formed '', a, ab, abc);
    a ? triples the counts and adds the shifted ones.
  why_others_fail: A subsequence skips letters, so it is not a block of the string and no block hash counts
    it.
- problem: cf-682D
  answer:
    topic: '3.2'
    card: two-index
  property: The state is a pair of positions (one in each string) with the number of pieces chosen and
    whether a piece is open; the table has 10^6 · k entries.
  why_others_fail: Choosing which pieces to take is the whole problem; equality tests of blocks do not
    decide how many pieces to use.
lookalike_pairs:
- a: lc-longest-duplicate-substring
  b: lc-repeated-dna-sequences
  a_tool:
    topic: '6.1'
    card: hash-length-search
  b_tool:
    topic: '6.1'
    card: distinct-by-hash
  shared_surface: Both ask for blocks of a string that occur at least twice, in a string of up to 10^5
    letters.
  flipping_difference: In Repeated DNA Sequences the length is fixed at 10, so one pass over the windows
    with a set decides everything. In Longest Duplicate Substring the length is unknown, so it is found
    by binary search on the length with a hash test (Theorem 6.1.4).
  flipping_input: s = banana. With the length fixed at 4 there is no repeated block (bana, anan, nana).
    Without a fixed length the longest repeated block is ana, of length 3.
- a: lc-distinct-echo-substrings
  b: cf-1948D
  a_tool:
    topic: '6.1'
    card: distinct-by-hash
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both look for substrings made of two equal halves in a string of a few thousand letters.
  flipping_difference: In Distinct Echo Substrings every letter is known, so two halves are equal exactly
    when their hashes are, and the different echo substrings are counted in a set of hashes. In Tandem
    Repeats? a ? may stand for any letter, so equal halves is no longer an equality of hashes; the problem
    is solved by scanning runs of positions where s[i] and s[i + L] can match, in O(n²).
  flipping_input: s = ab?b. The ? can become a, so the whole string becomes abab with equal halves, and
    the answer is 4. A hash test treats ? as a letter, finds no equal halves anywhere, and answers 0.
self_test:
- q: Take s = bad and B = 10 (a = 1, b = 2, d = 4). Write the prefix hashes h[0..3] and use Theorem 6.1.1
    to find the hash of s[1..3).
  a: 'h = 0, 2, 21, 214. The hash of s[1..3) is h[3] − h[1]·10² = 214 − 200 = 14, which is the hash of
    ad: 1·10 + 4.'
- q: With p = 11 and the strings u = (1, 2), v = (2, 1), for which bases B do the hashes collide? How
    many bases does Theorem 6.1.2 allow at most?
  a: H(u) = B + 2 and H(v) = 2B + 1 are equal when B ≡ 1, so only B = 1 collides. The theorem allows at
    most m − 1 = 1 base for m = 2.
- q: A program makes 2·10^5 comparisons of blocks of length up to 2·10^5. What does Theorem 6.1.2 promise
    for p = 10^9 + 7, and for p = 2^61 − 1?
  a: The bound is c(L − 1)/p. For p = 10^9 + 7 it is 4·10^10 / 10^9 = 40, which says nothing. For p =
    2^61 − 1 ≈ 2.3·10^18 it is about 1.7·10^-8.
- q: The hash of abc is 123 (B = 10). Use Theorem 6.1.3 to find the hash of bcd, and then the hash after
    the letter c of bcd is replaced by z (value 26).
  a: 'Sliding: (123 − 1·100)·10 + 4 = 234. Replacing the letter at place 1 (value 3) by 26: 234 + (26
    − 3)·10 = 464.'
- q: For s = aaaaa, for which L is the statement 'some block of length L occurs exactly twice' true? Is
    it closed under shortening?
  a: The blocks a, aa, aaa, aaaa occur 5, 4, 3, 2 times, so the statement is true only at L = 4. At L
    = 3 it is false, so it is not closed under shortening, and binary search on L would be wrong for this
    statement.
- q: n = 8 and the block s[2..5). Which block of the reversed string t does Theorem 6.1.5 compare it with?
  a: t[n − r..n − l) = t[3..6).
- q: With p = 5, which weight tables make the multisets {1, 1, 2} and {1, 2, 2} collide in Theorem 6.1.6?
    What is the probability?
  a: The sums are 2·w1 + w2 and w1 + 2·w2, equal exactly when w1 = w2. For random weights this has probability
    1/5.
- q: Letters are given the values a = 0, b = 1, ... Which two different strings have the same hash for
    every base, and why does the lesson use a = 1?
  a: The strings a and aa both have the hash 0, whatever the base, because every term is a multiple of
    the value 0. Letters 1 to 26 make the leading coefficient of any difference non-zero.
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-985F
  - cf-113B
  - lc-shortest-palindrome
decision_map:
- weak_signal: Many questions 'are these two blocks of a string equal?', or a loop over lengths or cut
    points that compares the block before a cut with the block after it
  choose: substring-compare
  when: 'Every test is an exact equality of two blocks and the number of tests times the block length
    is far below the prime (Theorems 6.1.1 and 6.1.2): prefix hashes, O(1) per test.'
  over:
  - card: nested-loops
    topic: '0.5'
    because: Comparing letter by letter is fine only when the number of tests times the block length is
      below about 10^8.
  - card: lcs
    topic: '3.4'
    because: If letters may be skipped, the matched letters are a common subsequence, not two equal blocks.
  - card: string-processing
    topic: '0.3'
    because: One pass over the string is enough when no block is compared with another.
- weak_signal: The number of different substrings, windows or rotations; grouping equal words or equal
    sets of values
  choose: distinct-by-hash
  when: The objects are blocks or sets and only equality matters; store a hash instead of the object (Theorems
    6.1.2, 6.1.3, 6.1.6).
  over:
  - card: set-membership
    topic: '0.6'
    because: Short objects are stored whole in a set; hashing is for long strings, many substrings, or
      sets.
  - card: count-windows
    topic: '1.3'
    because: If the question is about the values inside each window, count them while the window moves.
  - card: linear-state
    topic: '3.2'
    because: Distinct subsequences are not blocks; count them with a DP.
- weak_signal: The longest block that occurs twice (or in all of several strings); the largest length
    for which a test on blocks holds
  choose: hash-length-search
  when: The statement is closed under shortening (or lengthening) and one test is a pass over window hashes
    (Theorem 6.1.4).
  over:
  - card: answer-search
    topic: '1.4'
    because: There the test is a greedy scan over numbers; here it compares blocks.
  - card: shrinkable-window
    topic: '1.3'
    because: If the test is a count condition on one window, two pointers need no binary search and no
      hash.
  - card: enumerate-answer
    topic: '0.5'
    because: If the statement is not monotone, every length has to be tried.
- weak_signal: Is a block a palindrome? The longest palindromic substring; palindromic prefixes; palindromes
    under updates
  choose: palindrome-hash
  when: The objects are blocks of one string and n is too large for a table of all blocks (Theorem 6.1.5).
  over:
  - card: palindrome-segment
    topic: '3.6'
    because: For subsequences, or for n up to about 5000, the table over the ends of blocks is exact.
  - card: string-processing
    topic: '0.3'
    because: A single test, or a few, is a direct scan.
