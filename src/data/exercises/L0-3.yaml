- id: rev-2-2
  role: review
  type: recognise
  title: Which relationship is a Student to a Course?
  prompt: A Student takes several Courses, and a Course has several Students. Students are created at admission and deleted at graduation, courses are created each term. Say which class owns which, and what the Course holds.
  card: referred-part
  review_set: 2
  techniques:
  - L0.3
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id003
    property: 'Neither owns the other: students and courses are built and destroyed by different parts of the program, so a course holds ids or references to students.'
    why_others_fail: Owning students in a course would delete them at the end of the term and copy them into each course.
  checkers: []
- id: rev-2-3
  role: review
  type: recognise
  title: Why a Square derived from Rect breaks a Rect promise
  prompt: Explain in words, using set_width, why code written for Rect gives a wrong area when it is handed a Square that derives from Rect, and give the fix.
  card: true-subtype
  review_set: 2
  techniques:
  - L0.3
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: Code written for Rect assumes that set_width leaves the height alone; a Square must change both, so the base promise is broken.
    why_others_fail: Calling the square "a kind of rectangle" in mathematics is not enough; in code the promises of the operations decide.
  checkers: []

