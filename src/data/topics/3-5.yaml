- id: lc-new-21-game
  role: ladder
  card: probability-dp
  rung: 1
  twist: Base case of the card, and the transition is a window sum of the row, kept as a running total.
  summary: Alice draws a number from 1 to maxPts (all equally likely) while she has fewer than k points,
    and stops at k or more; print the probability that she ends with n or fewer points (k, n, maxPts at
    most 10^4).
  hints:
  - What is the probability of ever having exactly x points, in terms of the probabilities for smaller
    scores?
  - She reaches x from x - j after drawing j, which has probability 1/maxPts, but only from a score below
    k (she stops at k or more). So f[x] is the sum of f[y] over y in [x - maxPts, x - 1] with y < k, divided
    by maxPts.
  - 'Keep the window sum as a running total: add f[x] when it is below k, subtract f[x - maxPts]. The
    answer is the sum of f[x] for k <= x <= n. O(n + maxPts).'
- id: ac-dp_j
  role: ladder
  card: probability-dp
  rung: 2
  twist: 'Expected number of steps: the table is filled backwards, and a roll that does nothing is a self-loop.'
