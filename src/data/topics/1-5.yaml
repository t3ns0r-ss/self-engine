    summary: N villages at sorted coordinates with populations; Q ≤ 2·10^5 queries for the population living in [L, R].
  - id: lc-minimum-speed-to-arrive-on-time
    role: drill
    summary: Take n trains in order, each leaving only at an integer hour; the least integer speed that arrives within a given time, or −1.
  - id: ac-abc321_d
    role: drill
    summary: The sum over all N·M pairs of a main dish and a side dish of min(price sum, P) (N, M ≤ 2·10^5).
  - id: lc-non-overlapping-intervals
    role: lookalike
    summary: The fewest intervals to remove from a list (n ≤ 10^5) so that the rest do not overlap.
  - id: lc-divide-intervals-into-minimum-number-of-groups
    role: lookalike
