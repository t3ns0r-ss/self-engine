drill:
- problem: ac-abc309_c
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'The daily total only drops on the days a_i + 1, and the order of the medicines does not matter:
    sort by a_i and walk down from the day-1 total until it is at most K.'
  why_others_fail: Days go up to 10^9, so simulating day by day is too slow; a map of counts per day still
    needs the days in order, which is the sort.
- problem: ac-abc354_c
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'Order-free: after sorting by strength from strongest, a card survives exactly when its cost
    is below every cost seen so far, so one scan with a running minimum decides it.'
  why_others_fail: Checking every pair x, y is 2·10^10; a custom order is not the point, since only one
    key (strength) is sorted.
- problem: cf-1353B
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'Only the multisets of a and b matter: sorted, the i-th smallest of a meets the i-th largest
    of b, and a swap helps only while that b is larger.'
  why_others_fail: Trying every choice of pairs to swap grows exponentially with k; positions play no
    role, so no index needs remembering.
- problem: lc-sort-characters-by-frequency
  answer:
    topic: '1.1'
    card: custom-order
  property: The output order is fixed by a computed key, the count of each character (map-counting, 0.6,
    then sort the characters by count descending).
  why_others_fail: Counting alone gives no order; positions in the input play no role.
- problem: cf-1294B
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'A robot that only moves right or up must visit the packages in order of (x, y); the input
    order is irrelevant. Sort, then check neighbours: y must never decrease.'
  why_others_fail: Trying all visiting orders is n!; a set of points does not give the order.
- problem: cf-1203B
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'Order-free: sorted, equal sticks must pair up as neighbours, and the k-th smallest pair must
    go with the k-th largest pair for all areas to be equal.'
  why_others_fail: Trying all groupings of 4n sticks is far too many; counting with a map finds the pairs
    but not which pair goes with which.
- problem: lc-remove-covered-intervals
  answer:
    topic: '1.1'
    card: custom-order
  property: Sorted by start ascending and, for equal starts, end descending, an interval is covered exactly
    when its end is at most the largest end seen before it; the tie-break is what makes this work.
  why_others_fail: Without the tie-break, an interval with the same start and a larger end comes later
    and is missed; all pairs is fine for n ≤ 1000 but the sort is the intended tool.
- problem: ac-abc357_c
  answer:
    topic: '0.5'
    card: recursive-choices
  property: A level-N picture is defined by eight level-(N−1) pictures, so a recursive function (or a
    check of the base-3 digits of row and column) draws it.
  why_others_fail: Nothing is compared or ordered; there is no input list to sort.
- problem: cses-2162
  answer:
    topic: '0.6'
    card: stack-queue
  property: 'The circle is processed in order of arrival: take the child at the front, move it to the
    back, remove the next one; a queue does each step in O(1).'
  why_others_fail: The removal order depends on positions in the circle, not on values, so sorting has
    nothing to sort.
- problem: ac-abc345_c
  answer:
    topic: '0.6'
    card: map-counting
  property: Swapping two different letters gives a distinct new string, so count the pairs of positions
    with different letters from the letter counts, plus 1 if some letter repeats (that swap gives S back).
  why_others_fail: Sorting the letters loses nothing but adds nothing either; trying all pairs of positions
    is 5·10^11.
lookalike_pairs:
- a: lc-minimum-absolute-difference
  b: lc-minimum-absolute-difference-between-elements-with-constraint
  a_tool:
    topic: '1.1'
    card: sort-then-scan
  b_tool:
    topic: '0.6'
    card: ordered-set-lookup
  flipping_difference: B requires the two positions to be at least x apart, so positions matter and the
    array cannot be sorted.
  shared_surface: Both ask for the smallest absolute difference between two elements of an integer array.
  flipping_input: 'a = [4, 5, 9] with the two positions at least 2 apart: A would answer 1 (4 and 5),
    but B must answer 5 (positions 0 and 2).'
- a: lc-merge-intervals
  b: lc-insert-interval
  a_tool:
    topic: '1.1'
    card: sort-then-scan
  b_tool:
    topic: '0.3'
    card: direct-simulation
  flipping_difference: B's intervals are already sorted by start and disjoint, so the sort is not needed
    and one scan suffices.
  shared_surface: Both return a list of disjoint intervals after combining the overlapping ones.
  flipping_input: Merging [[8, 10], [1, 3], [2, 6]] needs a sort first and gives [1, 6], [8, 10]; inserting
    [4, 5] into the already sorted [[1, 3], [6, 9]] needs no sort, and one scan gives [1, 3], [4, 5],
    [6, 9].
self_test:
- q: Is "count the pairs i < j with a_i > a_j" order-free? Answer with two arrays holding the same values.
  a: No. (1, 2) has 0 such pairs and (2, 1) has 1, although both hold the values 1 and 2. The answer depends
    on positions, so the input must not be sorted first (counting such pairs fast needs later tools).
- q: What is wrong with sorting by the comparator [](int x, int y) { return x <= y; }?
  a: 'It is not a strict weak ordering: less(5, 5) is true, so 5 must come before itself. sort then has
    no valid result to produce; with many equal values it can read past the end of the vector and crash.
    Use x < y.'
- q: Treat two numbers as equivalent when they differ by at most 1, and otherwise compare them with <.
    Show with three numbers that this is not a strict weak ordering.
  a: '1 and 2 are equivalent, 2 and 3 are equivalent, but 1 < 3, so 1 and 3 are not equivalent: equivalence
    is not transitive (condition 3 of the definition). sort''s guarantees then no longer hold, and its
    result is unspecified.'
- q: 'Which question can be answered after coordinate compression, and which cannot: (a) the largest number
    of the intervals [1, 2], [100, 200], [150, 160] that share a point; (b) the total length they cover?'
  a: '(a) Yes: overlap depends only on the order of the endpoints, which ranks keep. (b) No: lengths need
    the real coordinates; after compression [1, 2] and [100, 200] could both have length 1. Use the event
    sweep with real coordinates (Theorem 1.1.6, part 3).'
- q: The closed intervals [1, 3] and [3, 5] share the point 3. With events (start, +1) and (end, −1),
    without shifting ends by one, which tie order gives the right largest overlap?
  a: 'Starts before ends at equal times: at time 3 the counter goes 1 → 2 (start of [3, 5]) → 1 (end of
    [1, 3]), so it reaches 2. With ends first it goes 1 → 0 → 1 and reports 1. Shifting closed ends to
    e + 1 and putting ends first is the same rule.'
- q: You sort pairs (score, name) to rank players by score, and the statement says that equal scores keep
    the input order. What goes wrong, and give two fixes.
  a: 'Equal scores are then ordered by name, not by input order. Fixes: sort (score, index) pairs instead
    (Theorem 1.1.4), or stable_sort with a comparator on the score alone.'
- q: Two arrays A and B. Show that a closest pair a ∈ A, b ∈ B can be found among neighbours of the sorted
    order of all values together.
  a: Take a closest cross pair a ≤ b (the other case is symmetric) and suppose some c lies strictly between
    them in the merged order. If c is from A, then (c, b) is a cross pair at least as close; if c is from
    B, then (a, c) is. Repeating with the new pair (it spans fewer elements) ends at a closest cross pair
    with nothing between, which is two neighbours with different labels. So sort the values labelled by
    array and scan neighbours with different labels.
checkpoint:
  time_limit_minutes: 90
  problems:
  - ac-abc308_c
  - ac-abc188_d
  - ac-abc186_d
decision_map:
- weak_signal: The closest two values, the smallest difference, choose k values with the smallest spread
  choose: sort-then-scan
  when: The question is order-free; in sorted order the best pair is two neighbours and the best group
    is a block (Theorem 1.1.2).
  over:
  - card: nested-loops
    because: Comparing every pair is n²/2, about 2·10^10 for n = 2·10^5.
    topic: '0.5'
  - card: ordered-set-lookup
    because: A multiset also finds neighbours, but it is needed only when values arrive between questions;
      for a fixed list one sort is simpler.
    topic: '0.6'
- weak_signal: '"The smallest … at least x", "the closest", min and max of a changing collection'
  choose: sort-then-scan
  when: All values are known before any question and nothing is inserted or erased; then the collection
    is a sorted array, not a changing set.
  over:
  - card: ordered-set-lookup
    because: A set pays O(log n) per insertion to stay sorted while changing; a fixed list is sorted once.
    topic: '0.6'
- weak_signal: '"Sorted by …, and for ties by …"; rankings, standings, leaderboards'
  choose: custom-order
  when: The statement fixes the order by keys or by a pairwise rule that reduces to a key; every tie-break
    goes into the comparator (Theorem 1.1.3).
  over:
  - card: heap-extract
    because: A priority queue gives only the current best and suits orders that change as items are removed;
      a fixed ranking needs one sort.
    topic: '0.6'
  - card: direct-simulation
    because: Re-scanning for the best remaining item each time is O(n²).
    topic: '0.3'
- weak_signal: Print a result for each element in input order, but the work needs value order
  choose: sort-with-index
  when: Every element carries its index through the sort, and results are written back by index (Theorem
    1.1.4).
  over:
  - card: sort-then-scan
    because: Sorting the values alone loses which value came from where, especially among equal values.
- weak_signal: '"Has this appeared before?", "how many different …", values too large for an array'
  choose: coordinate-compression
  when: Beyond equality, the order of the values matters (ranks, "how many distinct values are smaller"),
    and they must index an array.
  over:
  - card: set-membership
    because: A set answers presence; ranks need the sorted distinct values.
    topic: '0.6'
  - card: map-counting
    because: A hash map keeps no order; an ordered map walked in key order is the same compression.
    topic: '0.6'
- weak_signal: Intervals or time ranges with coordinates up to 10^9; the busiest moment; totals per day
  choose: event-sweep
  when: The quantity changes only at interval ends, so 2n sorted events with the statement's tie order
    describe it everywhere (Theorem 1.1.6).
  over:
  - card: direct-simulation
    because: Walking every time point costs the whole coordinate range, up to 10^9 per interval.
    topic: '0.3'
  - card: sort-then-scan
    because: Sorting intervals by start answers merging questions, but the count at each moment needs
      starts and ends as separate events.
