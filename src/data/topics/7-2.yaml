# Topic 7.2 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.2'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, listing all paths or all walks'
- topic: '0.6'
  what: 'Standard containers: a heap for the smallest available vertex, and maps that keep the values
    of states'
- topic: '1.1'
  what: 'Sorting: the cells of a grid in increasing order of their numbers'
- topic: '1.2'
  what: 'Prefix sums: 2D prefix sums that say whether a part of a pizza has an apple'
- topic: '1.4'
  what: 'Binary search: the smallest allowed value in a search on the answer'
- topic: '2.1'
  what: 'Number theory: the prime factors of a number, and the sieve'
- topic: '2.3'
  what: 'Counting: the sum rule behind adding the counts of the tails, and counting modulo 10^9 + 7'
- topic: '3.2'
  what: 'Dynamic programming: a value for each small case built from the values of smaller cases, and
    memoised recursion'
- topic: '3.7'
  what: 'Bitmask DP: the DP over subsets that enumerates the orders of a DAG'
- topic: '4.1'
  what: 'Graph traversal: breadth-first search over a state graph'
- topic: '4.2'
  what: 'Graph structure: directed cycles and the topological order'
- topic: '4.3'
  what: 'Shortest paths: Dijkstra with counts and the graphs with cycles'
- topic: '4.7'
  what: 'Connectivity: strongly connected components and the graph of components'
- topic: '4.4'
  what: 'DSU: not used by the DP itself; the lookalike problems may use it'
theorems:
- id: 7.2.1
  title: Topological order and the DP in it
  plain_words: 'If a graph has no cycle, there is always a vertex that nothing points into: start there.
    Take it away and repeat. This gives an order in which every edge points forward, so when a vertex
    is reached, everything it depends on is already finished. If at some moment every remaining vertex
    has an edge coming from a remaining vertex, walking backwards along those edges must meet a vertex
    twice, and that is a cycle.'
  code: 7.2/thm-1
- id: 7.2.2
  title: Counting paths
  plain_words: 'Every path to $v$ ends with one last edge. Sorting the paths by their last edge, the paths
    ending with the edge $u \to v$ are exactly the paths to $u$ followed by that edge, so there are as
    many of them as paths to $u$. The best paths to $v$ end with an edge from a vertex where the path
    so far is itself best: otherwise the beginning could be replaced by a better one. So the best value
    and its number are kept together, and a better value replaces the pair while an equal value adds the
    numbers.'
  code: 7.2/thm-2
- id: 7.2.3
  title: The condensation
  plain_words: Inside a component every vertex can be reached from every other, so a walk that enters
    it can collect everything in it before it leaves. Between components there is no way back, so a walk
    goes through the components in an order given by a path of the condensation. So gluing each component
    into one vertex with the sum of its coins turns the question into a longest path in a graph without
    cycles.
  code: 7.2/thm-3
- id: 7.2.4
  title: Memoised recursion on a state graph
  plain_words: 'If every move makes some number smaller, the states with their moves have no cycle: a
    DAG that is never written out. A recursive function that remembers its answers is then exactly a DP
    on it, and it visits only the states that are really reached, which are often very few even when the
    possible values are huge.'
  code: 7.2/thm-4
cards:
- id: longest-path
  name: Best value of a path ending at each vertex of an acyclic graph (order from in-degrees)
  from_theorem: 7.2.1
  decisive_property: The graph has no directed cycle (or the statement can be turned into one), the quantity
    of a path adds up along its edges, and the best value at a vertex depends only on the best values
    at the vertices with an edge into it.
  how_to_test: 'Write the value at a vertex as a best of (value at a tail + the weight of the edge) over
    the edges into it. Check that the graph has no directed cycle, or that moves always go to larger numbers,
    larger positions or smaller measures, so that an order exists. Run Kahn''s algorithm: if it takes
    fewer than n vertices there is a cycle, and the property fails. If the value also needs a second parameter
    (a letter, a number of edges), add it to the state.'
  constraint_shapes:
  - 'n = 3·10^5 vertices and m = 3·10^5 edges and the path with the largest number of vertices of one
    letter: the number of paths can be exponential, against one pass of 26(n + m) steps'
  - 'n = 10^5 cells of a grid and the longest increasing path: the number of increasing paths is exponential,
    against sorting the cells and one pass with 4 neighbours each'
  weak_signals:
  - form: Asks for the longest, shortest, heaviest or cheapest path in a graph that is said to have no
      cycle (or a cycle means the answer is -1)
    shape: n and m up to 3·10^5, weights that may be negative
  - form: Asks for the largest number of steps of a process in which a number only grows or only falls
      (jump to a larger value, to a taller building, to a later time)
    shape: n up to 10^5, moves defined by a rule, not listed
  - form: Asks for a schedule or a time to finish tasks with prerequisites, many tasks at once
    shape: n up to 5·10^4, the finishing time of a task is its duration plus the largest finishing time
      of its prerequisites
  kill_signals:
  - 'The graph has a directed cycle and the path must not repeat vertices: the longest simple path is
    hard in general (for n up to about 20 use a bitmask DP, topic 3.7); on the graph 0→1→0, 1→2 Kahn''s
    algorithm takes nothing and the DP returns 0 where the longest simple path has 2 edges'
  - 'The weights are positive and the graph has cycles and the question is the shortest path: Dijkstra
    (topic 4.3) is the tool'
  in_action:
    statement: A directed acyclic graph has n vertices and m edges with integer weights (possibly negative).
      Print the largest total weight of a path.
    constraints: n, m ≤ 2·10^5.
    budget: The number of paths can be exponential. Need about n + m.
    candidates:
    - tool: Try all paths from every vertex (topic 0.5)
      verdict: rejected
      because: Exponentially many paths.
    - tool: Dijkstra on negated weights (topic 4.3)
      verdict: rejected
      because: Negated weights are negative; Dijkstra needs non-negative weights.
    - tool: The DP in a topological order (this topic)
      verdict: chosen
      because: Every path ending at v ends with an edge u → v after a path ending at u, and u comes first
        in the order (Theorem 7.2.1).
    property_check: The graph has no cycle, and a total weight splits into the weight of the earlier part
      and the last edge. The property holds.
    decision: 'Kahn''s algorithm for the order; dp[v] = max(0, max over edges u → v of dp[u] + w); print
      the largest dp: O(n + m).'
  examples:
    positive:
    - inline:
        input: The edges 0→1, 0→2, 1→3, 2→3, 3→4, 2→5 form a DAG. What is the largest number of edges
          on a path?
        answer: '3'
        why: The values of the longest path ending at each vertex are 0, 1, 1, 2, 3, 2 in the order 0,
          1, 2, 3, 5, 4; the largest is 3, the path 0→1→3→4 (Theorem 7.2.1).
    - inline:
        input: The edges 0→1 (weight 5), 1→2 (−3), 0→2 (1), 2→3 (4) form a DAG. What is the largest total
          weight of a path?
        answer: '6'
        why: The path 0→1→2→3 has 5 − 3 + 4 = 6, the path 0→2→3 has 1 + 4 = 5, and no path is better;
          a negative edge is no problem in a DAG.
    - worked_example: cses-1680
      why: 'The route through the largest number of cities in a DAG of 10^5 cities: the DP in a topological
        order, with the predecessor kept to read the route backwards.'
    negative:
    - inline:
        input: The edges are 0→1, 1→0 and 1→2 (a cycle between 0 and 1). What is the largest number of
          edges on a path that visits no vertex twice?
        answer: '2'
        method_gives: '0'
        why: Kahn's algorithm takes no vertex, because 0 and 1 each have an edge into them from the other,
          so the DP has nothing to work on. The longest simple path is 0→1→2, with 2 edges.
      correct_tool:
        topic: '3.7'
        card: path-mask
    - problem: ac-abc223_d
      why: 'Asks for a topological order itself (the lexicographically smallest one), not for a best value
        along the edges: Kahn''s algorithm with a heap, with no DP.'
      correct_tool:
        topic: '4.2'
        card: dependency-order
  lookalikes:
  - description: Order of courses or tasks with prerequisites (no values)
    tool:
      topic: '4.2'
      card: dependency-order
    flipping_difference: If only an order or a yes/no (is there a cycle?) is asked, Kahn's algorithm is
      the whole solution. A best value along the edges adds the DP in that order.
  - description: Shortest paths with non-negative weights in a graph with cycles
    tool:
      topic: '4.3'
      card: dijkstra
    flipping_difference: With cycles the order of finishing is found while searching (Dijkstra). Without
      cycles it is known in advance, and negative weights are allowed.
  complexity: O(n + m) for the order and the DP; O((n + m) · S) with S values per vertex; memory O(n +
    m).
- id: count-paths
  name: Number of paths (or the best value and its number) in an acyclic graph
  from_theorem: 7.2.2
  decisive_property: The graph has no directed cycle (or the moves always go to a smaller measure) and
    the answer counts paths, or counts the paths that reach the best value, so that the count at a vertex
    is the sum of the counts at its tails.
  how_to_test: Write the number of ways to reach a vertex as the sum over the edges into it. If the question
    also asks for the best value, keep the pair (value, number) and let a better value replace the pair
    and an equal value add the numbers. Check that the structure has no cycle (an order exists) and that
    parallel edges or different routes are really different paths in the statement.
  constraint_shapes:
  - 'n = 10^5 levels and m = 2·10^5 teleporters and the number of ways to go from the first to the last:
    the number of paths is exponential, against n + m additions modulo 10^9 + 7'
  - 'a grid of 10^4 cells with moves up, left and up-left and the number of paths with the largest sum:
    exponentially many paths, against 3 neighbours for each cell'
  weak_signals:
  - form: Asks for the number of ways to go from one vertex to another in a graph without cycles (or in
      a grid with moves in two directions), modulo a prime
    shape: n up to 10^5, answer modulo 10^9 + 7
  - form: Asks for the best value and the number of ways that reach it
    shape: n and m up to 2·10^5, a pair of numbers
  - form: Asks for the number of increasing sequences of moves (strictly larger value, shorter distance
      to a target)
    shape: n up to 10^5 cells or nodes, the order follows the values
  kill_signals:
  - 'The graph has cycles and paths may not repeat vertices: counting simple paths is not a sum over tails.
    On the edges 0→1, 1→2, 2→1, 2→3 there is one simple path from 0 to 3, but Kahn''s algorithm never
    takes the vertices 1, 2, 3 and the count is 0'
  - 'Counting walks of a fixed length in a graph with cycles: the count depends on the length, so the
    state needs the number of steps'
  in_action:
    statement: A game has n levels joined by m one-way teleporters, with no directed cycle. Print the
      number of ways to go from the level 1 to the level n, modulo 10^9 + 7.
    constraints: n ≤ 10^5, m ≤ 2·10^5.
    budget: Exponentially many paths. Need about n + m.
    candidates:
    - tool: List the paths with a depth-first search (topic 0.5)
      verdict: rejected
      because: The number of paths is exponential.
    - tool: A depth-first search with a table of visited levels (topic 4.1)
      verdict: rejected
      because: A visited mark would cut the second path to a level, but different paths to the same level
        must all be counted.
    - tool: The sum over tails in a topological order (this topic)
      verdict: chosen
      because: The paths to v end with an edge u → v after a path to u, and are counted by ways(u) (Theorem
        7.2.2).
    property_check: The graph has no directed cycle, and each path has exactly one last edge. The property
      holds.
    decision: 'Kahn''s order; ways[0] = 1; for each vertex in the order add ways[v] to ways[u] for each
      edge v → u, modulo 10^9 + 7; print ways[n − 1]: O(n + m).'
  examples:
    positive:
    - inline:
        input: 'The DAG with the edges 0→1, 0→2, 1→3, 2→3, 3→4, 2→5: in how many ways can the vertex 4
          be reached from the vertex 0?'
        answer: '2'
        why: The paths are 0→1→3→4 and 0→2→3→4. The counts are 1, 1, 1 for the vertices 0, 1, 2, then
          1 + 1 = 2 for the vertex 3 and 2 for the vertex 4 (Theorem 7.2.2).
    - inline:
        input: A 3 × 3 grid has moves to the right and downwards. In how many ways can the bottom right
          cell be reached from the top left cell?
        answer: '6'
        why: 'The number of ways to reach a cell is the number for the cell above plus the number for
          the cell on its left: 1 1 1 / 1 2 3 / 1 3 6.'
    - worked_example: cses-1681
      why: 'The number of ways to complete a game of 10^5 levels joined by one-way teleporters without
        a cycle: the sum over the tails in a topological order.'
    negative:
    - inline:
        input: The edges are 0→1, 1→2, 2→1, 2→3. How many paths without a repeated vertex go from the
          vertex 0 to the vertex 3?
        answer: '1'
        method_gives: '0'
        why: The graph has the cycle 1→2→1, so the DP in the order of Kahn's algorithm never reaches the
          vertices 1, 2, 3 and the count stays 0. The one path is 0→1→2→3.
      correct_tool:
        topic: '0.5'
        card: recursive-choices
    - problem: lc-number-of-ways-to-arrive-at-destination
      why: 'The graph has cycles and positive weights, and the shortest paths are wanted: Dijkstra with
        the counts of the shortest paths. The DAG is the graph of the shortest-path edges, which only
        Dijkstra can find.'
      correct_tool:
        topic: '4.3'
        card: dijkstra
  lookalikes:
  - description: Counting paths in a grid with moves in two directions, by a formula
    tool:
      topic: '2.3'
      card: bijection-paths
    flipping_difference: An empty grid has a binomial formula; obstacles, values or arbitrary edges need
      the DP over the cells.
  - description: The number of ways as a longest or shortest value
    tool:
      topic: '7.2'
      card: longest-path
    flipping_difference: A best value is a maximum or minimum of the tails; a count is their sum; the
      best value with its number keeps both together.
  complexity: O(n + m) for the order and the sums; O(n + m) with pairs (value, number); memory O(n + m).
- id: condensation-dp
  name: 'A directed graph with cycles: the DP on its components'
  from_theorem: 7.2.3
  decisive_property: The graph has directed cycles, but a vertex on a cycle can reach all vertices of
    the cycle, so the vertices of a strongly connected component are interchangeable for the question
    (they can all be visited, and their weights are collected together) and the components form a DAG.
  how_to_test: 'Ask whether a walk that enters a component can use all of it: values that are collected
    once and are non-negative, or reachability. If so, find the components (topic 4.7), give each the
    combined value, and run the DP on the condensation. If the walk must avoid repeating vertices, or
    values can be negative, a component cannot be treated as one vertex.'
  constraint_shapes:
  - 'n = 10^5 rooms and m = 2·10^5 one-way tunnels with coins, and the most coins on a walk: walks can
    be infinite, against a pass of Kosaraju (2(n + m)) and a DP on the components'
  - 'n = 10^5 cities and d = 50 days of the week: 5·10^6 states (city, day), with the museums collected
    once: the states form a graph with cycles, against SCC on 5·10^6 states and a DP on the components'
  weak_signals:
  - form: Asks for the largest sum collected on a walk that may repeat vertices, where each vertex is
      collected once
    shape: n up to 10^5, values at least 0
  - form: Asks for the best value of an infinite walk or of a path in a graph whose cycles are gains (every
      pass around a cycle is worth the same or more)
    shape: n up to 10^5, values on edges or vertices
  - form: Asks for the number of distinct things visited on a walk over a graph of states (city, day)
      with cycles
    shape: n · d up to 5·10^6, a set of cities in each component
  kill_signals:
  - 'The values can be negative: a cycle of two rooms with 5 and −3 coins is worth 5 (stay in the first
    room), not 2, so the component total is not what can be collected'
  - 'The walk must not repeat vertices: the longest simple path in a graph with cycles is hard (n up to
    about 20 can use a bitmask)'
  in_action:
    statement: A game has n rooms and m one-way tunnels, and each room has some coins. Starting and ending
      in any rooms, what is the largest number of coins that can be collected (a room's coins are taken
      once)?
    constraints: n ≤ 10^5, m ≤ 2·10^5, coins up to 10^9.
    budget: Walks that repeat rooms are unbounded in number. Need about n + m.
    candidates:
    - tool: A DP in a topological order (topic 4.2)
      verdict: rejected
      because: The graph has cycles, so there is no topological order.
    - tool: A bitmask DP over the rooms visited (topic 3.7)
      verdict: rejected
      because: 2^n sets of rooms.
    - tool: Components, then the DP on the condensation (this topic)
      verdict: chosen
      because: Inside a component every room can be visited, and the components form a DAG (Theorem 7.2.3).
    property_check: The coins are at least 0 and taken once, so a component is worth its total and the
      walk goes through components along a path of the condensation. The property holds.
    decision: 'Kosaraju gives the components in a topological order; best[c] = total[c] + the best of
      the components with a tunnel into c; print the largest: O(n + m).'
  examples:
    positive:
    - inline:
        input: Six rooms have the coins 2, 3, 1, 4, 1, 7 and the tunnels 0→1, 1→2, 2→0, 2→3, 3→4, 4→3,
          2→5. What is the largest number of coins on a walk?
        answer: '13'
        why: 'The rooms 0, 1, 2 form one component worth 6, the rooms 3 and 4 another worth 5, and the
          room 5 a third worth 7. The walk takes 6 and then 7: 13 (Theorem 7.2.3).'
    - inline:
        input: Three rooms have the coins 5, 5, 4 and the tunnels 0→1, 1→0, 1→2. What is the largest number
          of coins on a walk?
        answer: '14'
        why: 'The rooms 0 and 1 are one component worth 10, followed by the room 2 worth 4: 14.'
    - worked_example: cses-1686
      why: 'The most coins on a walk through 10^5 rooms with one-way tunnels: components, their sums,
        and the longest path of the condensation.'
    negative:
    - inline:
        input: Two rooms have the coins 5 and −3 and the tunnels 0→1 and 1→0. What is the largest value
          of a walk?
        answer: '5'
        method_gives: '2'
        why: The component total is 5 − 3 = 2, but the walk can stay in the first room and take only 5.
          With negative values the component is no longer one vertex.
      correct_tool:
        topic: '3.7'
        card: path-mask
    - problem: cses-1682
      why: 'Only asks whether every room can be reached from every other: the number of strongly connected
        components is 1. No values are collected.'
      correct_tool:
        topic: '4.7'
        card: mutual-reach
  lookalikes:
  - description: Counting the components or their sources and sinks
    tool:
      topic: '4.7'
      card: condensed-dag
    flipping_difference: Reasoning about the shape of the condensation (sources, sinks) needs no values;
      a value on the vertices and a best path makes it a DP.
  - description: A graph without cycles
    tool:
      topic: '7.2'
      card: longest-path
    flipping_difference: A DAG is its own condensation; with cycles the components are found first.
  complexity: O(n + m) for the components and the DP; memory O(n + m).
- id: state-dag
  name: 'Implicit acyclic state graphs: memoised recursion over the states'
  from_theorem: 7.2.4
  decisive_property: The statement describes states and moves, not a graph; some number (the value, the
    length, the position, the number of rolls made) strictly changes in one direction at every move, so
    the state graph has no cycle, and the states that can be reached are not too many.
  how_to_test: 'Name the state: everything the future depends on (the position and the last jump, the
    cell and the direction, the last two rolls). Find the measure that changes at every move. Estimate
    the number of reachable states times the moves per state; if it fits, write the memoised recursion
    (or the loop in the order of the measure). If a move can lead back, use a search over the states (topic
    4.1) instead.'
  constraint_shapes:
  - 'n up to 2·10^9 and halving or thirding moves: n different values, against the 257 values ⌊n / (2^a
    3^b)⌋ that can be reached'
  - 'a grid of 50 × 50 cells and 10 pieces: dp[row][column][pieces] has 25000 states with up to 100 moves
    each, against listing the ways to cut'
  weak_signals:
  - form: Asks for the fewest steps, the number of ways or the best score of a process with a clear rule
      for the moves, and a huge range of values
    shape: n up to 10^9 or 10^18, with halving, division or a jump that grows each time
  - form: Asks for the number of sequences of a given length with a rule about the last one or two items
      (differences, gcd, gaps)
    shape: length up to 10^4, a small alphabet
  - form: Asks for the best or the number of ways in a grid or on a line where a move goes forward and
      a second parameter (direction, turn used, fuel left) is part of the state
    shape: up to 10^5 cells, a small extra parameter
  kill_signals:
  - 'A move can undo another (x → x + 1 and x → x − 1): the state graph has cycles; from 1 to 2 with such
    moves the recursion on smaller numbers never goes up and reports no way, while one step up is enough'
  - 'The number of reachable states is large (every integer up to 10^9): the table has no room; look for
    a formula or a greedy'
  in_action:
    statement: There are n oranges. Each day you eat one, or, if the number left is even, half of them,
      or, if it is divisible by 3, two thirds of them. Print the fewest days to eat all.
    constraints: n ≤ 2·10^9.
    budget: A table over 0..n has 2·10^9 entries. Need about log² n.
    candidates:
    - tool: A table of the fewest days for 0..n (topic 3.2)
      verdict: rejected
      because: 2·10^9 entries.
    - tool: A breadth-first search over the numbers (topic 4.1)
      verdict: rejected
      because: 'It visits every number from n down to 0 that can be reached with single steps: about n
        states.'
    - tool: Memoised recursion on a state graph (this topic)
      verdict: chosen
      because: Single oranges are eaten only to make the number divisible, so the states are ⌊n / (2^a
        3^b)⌋, a few hundred (Theorem 7.2.4).
    property_check: Every call is on a smaller number, so there is no cycle, and the reachable numbers
      are few. The property holds.
    decision: 'days(n) = 1 + min(n % 2 + days(n / 2), n % 3 + days(n / 3)) with a map as memo: O(log²
      n).'
  examples:
    positive:
    - inline:
        input: What is the fewest days to eat 10 oranges, eating one, half (if even) or two thirds (if
          divisible by 3) per day?
        answer: '4'
        why: 'days(10) = 1 + min(0 + days(5), 1 + days(3)) = 1 + min(4, 3) = 4: eat one, then 6 oranges
          (9 − 6 = 3), then 2, then 1 (Theorem 7.2.4).'
    - inline:
        input: What is the fewest days to eat 6 oranges with the same moves?
        answer: '3'
        why: 'days(6) = 1 + min(0 + days(3), 0 + days(2)) = 1 + 2 = 3: eat 3, then 2, then 1.'
    negative:
    - inline:
        input: A number may be changed by x → x − 1, x → x + 1, x → x / 5 (if divisible) and x → x / 11
          (if divisible). What is the fewest operations to turn 1 into 2?
        answer: '1'
        method_gives: '-1'
        why: The moves can go up and down, so the state graph has cycles. A recursion that only follows
          moves to smaller numbers never goes up from 1 and finds no way, while x + 1 is one step.
      correct_tool:
        topic: '4.1'
        card: state-graph
    - problem: lc-sliding-puzzle
      why: A move can be undone, so the states are not ordered by any falling measure; a breadth-first
        search over the positions of the board finds the fewest moves.
      correct_tool:
        topic: '4.1'
        card: state-graph
  lookalikes:
  - description: Fewest steps with small numbers (up to about 10^6)
    tool:
      topic: '4.1'
      card: state-graph
    flipping_difference: A search or a table over all numbers is enough when the range is small; with
      a huge range only the reachable states may be visited, which is the memoised recursion.
  - description: A DP with a table indexed by a position and a small extra parameter
    tool:
      topic: '3.2'
      card: two-index
    flipping_difference: With indexes that run over a small range the table is filled in order; here the
      states are found by the recursion and stored in a map.
  complexity: O(R · k) for R reachable states with k moves each, with a map (log R extra) or an array
    if the states are numbered; memory O(R).
problems:
- id: cses-1680
  role: worked_example
  summary: A directed graph of n ≤ 10^5 cities and m ≤ 2·10^5 flights with no cycle; the route from city
    1 to city n with the most cities, printed, or IMPOSSIBLE.
- id: cses-1681
  role: worked_example
  summary: A directed graph of n ≤ 10^5 cities and m ≤ 2·10^5 flights with no cycle; the number of routes
    from city 1 to city n, modulo 10^9 + 7.
- id: cses-1686
  role: worked_example
  summary: A directed graph of n ≤ 10^5 rooms and m ≤ 2·10^5 tunnels with a number of coins in each room
    (possibly with cycles); the most coins that can be collected on a walk from any room to any room,
    each room paying once.
- id: ac-dp_g
  role: ladder
  card: longest-path
  rung: 1
  twist: 'Base case of the card: the longest path of a DAG by its number of edges.'
  summary: A directed graph of N ≤ 10^5 vertices and M ≤ 10^5 edges with no directed cycle; the length,
    in edges, of the longest directed path.
  hints:
  - Is the number of paths small? Think of a graph where every vertex has two edges to the next layer.
  - Let dp[v] be the length of the longest path that ends at v. Which vertices can be the one before v?
  - 'Take the vertices in a topological order (Kahn, Theorem 7.2.1): dp[v] = max over edges u → v of dp[u]
    + 1, with 0 if there is none; the answer is the largest dp.'
- id: cf-919D
  role: ladder
  card: longest-path
  rung: 2
  twist: A vector of 26 values at each vertex, and a cycle means the answer is -1.
  summary: A directed graph of n ≤ 3·10^5 vertices and m ≤ 3·10^5 edges, each vertex with a letter; the
    largest number of times one letter occurs on a path, or -1 if the value can be as large as we like.
    †
  hints:
  - When is the answer infinite? Think of a path that goes around a cycle again and again.
  - 'If the graph has a cycle, the answer is -1. Otherwise fix a letter c: what is the best count of c
    on a path that ends at v?'
  - dp[v][c] = (letter of v is c) + max over edges u → v of dp[u][c], in a topological order; 26 values
    per vertex, 26(n + m) steps in all. The answer is the largest dp[v][c]; Kahn takes fewer than n vertices
    when there is a cycle.
- id: cf-721C
  role: ladder
  card: longest-path
  rung: 3
  twist: 'A count of vertices is added to the state: the cheapest time to reach v with exactly k places.'
  summary: A directed graph of n ≤ 5000 places and m ≤ 5000 one-way roads with times, no cycle; a limit
    T; the walk from 1 to n of time at most T that visits the most places, printed. †
  hints:
  - 'One number per vertex is not enough: a cheaper route may visit fewer places. What else can the state
    hold?'
  - Let dp[k][v] be the smallest time to arrive at v having visited exactly k places. The graph has no
    cycle, so k is at most n.
  - Process the vertices in a topological order and for each edge u → v and each k set dp[k + 1][v] =
    min(dp[k][u] + w), keeping the parent for the route. The answer is the largest k with dp[k][n] ≤ T.
    About n · (n + m) steps.
- id: cf-1679D
  role: ladder
  card: longest-path
  rung: 4
  twist: The DP is the check inside a binary search on the answer, and a cycle makes the check pass.
  summary: A directed graph of n ≤ 2·10^5 vertices and m ≤ 2·10^5 edges with a number a_v on each vertex,
    and a number k up to 10^18; a walk of k vertices has the cost of its largest a_v; the smallest cost
    of a walk with k vertices, or -1. †
  hints:
  - If the cost is at most x, which vertices may the walk use? Is the condition monotone in x?
  - Binary search on x (topic 1.4). For a fixed x keep the vertices with a_v ≤ x. If they contain a cycle,
    a walk can be as long as we like.
  - 'Otherwise the kept vertices form a DAG: the longest path in vertices, by Kahn and the DP, must be
    at least k. Cost O((n + m) log(max a)).'
- id: lc-longest-increasing-path-in-a-matrix
  role: ladder
  card: longest-path
  rung: 5
  twist: 'The graph is not given: the cells are the vertices and the moves to a larger neighbour are the
    edges.'
  summary: A matrix of up to 200 × 200 integers; the length of the longest strictly increasing path that
    moves to a neighbour up, down, left or right.
  hints:
  - Draw an edge from a cell to each neighbour with a larger number. Can this graph have a cycle?
  - Edges always go to a larger value, so the order of the values is a topological order. The paths can
    be exponentially many.
  - Sort the cells by value (topic 1.1) and set len[cell] = 1 + max len of the smaller neighbours; or
    a memoised search on the same recurrence. O(mn log(mn)).
- id: lc-number-of-restricted-paths-from-first-to-last-node
  role: ladder
  card: count-paths
  rung: 1
  twist: 'Base case of the card with a twist: the DAG appears only after the distances are known.'
  summary: An undirected connected weighted graph of n ≤ 2·10^4 nodes and up to 4·10^4 edges; a path from
    node 1 to node n is restricted if the distance to n strictly falls at each step; the number of restricted
    paths, modulo 10^9 + 7.
  hints:
  - The graph has cycles, but the allowed steps go to a node that is strictly closer to n. Does the allowed
    graph have a cycle?
  - First find the distance dist[v] from n to every node with Dijkstra (topic 4.3). Allowed steps are
    the edges u → v with dist[u] > dist[v].
  - 'Take the nodes by increasing dist: ways[n] = 1 and ways[u] = sum of ways[v] over the neighbours v
    with a smaller dist. Print ways[1]. Nodes with equal dist cannot be neighbours in a path, so ties
    are no problem.'
- id: lc-number-of-increasing-paths-in-a-grid
  role: ladder
  card: count-paths
  rung: 2
  twist: Every cell starts a path, so the count is summed over all cells.
  summary: A grid with m·n ≤ 10^5 integers; the number of strictly increasing paths, of any length at
    least 1, that start and end anywhere and move to a neighbour up, down, left or right, modulo 10^9
    + 7.
  hints:
  - A single cell is a path. Let cnt[c] be the number of increasing paths that end at the cell c. What
    is its last step?
  - 'The path ends with a step from a smaller neighbour: cnt[c] = 1 + the sum of cnt[u] over the smaller
    neighbours u.'
  - Process the cells by increasing value, or use a memoised search; the answer is the sum of cnt over
    all cells, modulo 10^9 + 7. Equal values never depend on each other, so the order among them does
    not matter.
- id: lc-number-of-paths-with-max-score
  role: ladder
  card: count-paths
  rung: 3
  twist: The pair (best sum, number of ways) is combined; a better sum replaces, an equal sum adds.
  summary: A square board of up to 100 × 100 with digits, an obstacle X and the cells S (bottom right)
    and E (top left); moves go up, left or diagonally up-left; the largest sum of the digits on a path
    and the number of paths with that sum, modulo 10^9 + 7 (0 0 if there is no path).
  hints:
  - Every move goes to a smaller row or column, so the cells in decreasing order of (row, column) are
    a topological order.
  - For each cell keep the pair (best sum, number of paths that reach it).
  - 'For a cell look at the three cells it can come from: take the largest sum, add the numbers of the
    neighbours that reach it, then add the digit of the cell. Only the number is taken modulo 10^9 + 7,
    not the sum; a cell with no way keeps the number 0.'
- id: cf-894E
  role: ladder
  card: condensation-dp
  rung: 1
  twist: Inside a component an edge is used again and again until it is worn out; the component value
    is a sum of triangular numbers.
  summary: A directed graph of n ≤ 10^6 junctions and m ≤ 10^6 roads, each road with a number w of mushrooms;
    walking on a road collects the mushrooms, and then the next time k less on a road is collected w,
    w − 1, w − 3, w − 6, … (triangular decrements) until the road is empty; the most mushrooms on a walk
    from the junction s. †
  hints:
  - A walk may go around a cycle again and again. What happens inside a strongly connected component?
  - Inside a component every road can be used as long as it gives something, so each road of a component
    gives its full total. How many times the road gives w, w − 1, w − 3, … while positive, is found by
    a formula or a binary search.
  - Find the components (Theorem 7.2.3), give each component the total of its inside roads, and run the
    longest path DP over the components from s; a road between two components gives w once.
- id: ac-arc030_3
  role: ladder
  card: condensation-dp
  rung: 2
  twist: The value of a component is a sorted list of letters, and the DP holds strings, not numbers.
  summary: A directed graph of N ≤ 200 vertices, each with a lowercase letter, and a number K ≤ 300; choose
    a walk from any vertex and collect exactly K letters (each visit to a vertex may collect its letter);
    the lexicographically smallest string, or -1 if no walk collects K letters.
  hints:
  - In a strongly connected component, what can you collect, and in what order?
  - You can visit the vertices of the component in any order and as often as you like, so any multiset
    of its letters in any number is possible up to the reachable count; the smallest string takes the
    letters in sorted order.
  - Condense (Theorem 7.2.3). Let dp[comp][len] be the smallest string of that length collected from comp
    onward; combine a prefix of the sorted letters of the component with dp of a successor. With N ≤ 200
    and K ≤ 300 the strings are short enough to compare directly.
- id: cf-1137C
  role: ladder
  card: condensation-dp
  rung: 3
  twist: The vertices of the graph are the states (city, day mod d); distinct museums must not be counted
    twice.
  summary: A directed graph of n ≤ 10^5 cities and m ≤ 10^5 one-way roads and a week of d ≤ 50 days; each
