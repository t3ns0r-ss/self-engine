  hints:
  - What does the sum of A_i · B_i do when A_i grows by x?
  - It grows by x times B_i, so the node needs ΣB as well as ΣAB.
  - Keep ΣA, ΣB and ΣAB in each node and two addition tags; applying (x to A) changes ΣAB by x · ΣB and
