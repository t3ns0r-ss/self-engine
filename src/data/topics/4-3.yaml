drill:
- problem: lc-path-with-maximum-probability
  answer:
    topic: '4.3'
    card: dijkstra
  property: 'A product of numbers in [0, 1] never increases along a path, so the best value for a node
    is final when it is taken out of a max-heap: the same order of finishing as in Dijkstra''s algorithm,
    with "largest product" in place of "smallest sum" (the proof of Theorem 4.3.1 only needs that a longer
    route is never better).'
  why_others_fail: Trying all paths is exponential, and rounds of relaxation over 2·10^4 edges cost n·m
    = 2·10^8; adding the probabilities is the wrong measure.
- problem: lc-number-of-ways-to-arrive-at-destination
  answer:
    topic: '4.3'
    card: dijkstra
  property: 'The question asks for the shortest time and the number of routes that reach it: while the
    heap search finishes the vertices, copy the count of routes when a strictly better distance is found
    and add the count when the distance ties (Theorem 4.3.1 gives the order in which the counts become
    final).'
  why_others_fail: Listing all routes is exponential; a plain BFS ignores the times.
- problem: lc-design-graph-with-shortest-path-calculator
  answer:
    topic: '4.3'
    card: dijkstra
  property: 'All weights are positive and a query names one start and one end: keep the adjacency lists,
    append an edge on each call and run a heap search for each query (Theorem 4.3.1); the sizes make this
    cheap.'
  why_others_fail: Keeping the whole table of distances up to date is more work than a few queries need,
    and Bellman–Ford rounds are slower for no benefit.
- problem: lc-minimum-time-to-visit-disappearing-nodes
  answer:
    topic: '4.3'
    card: dijkstra
  property: The cost of an edge is a fixed time, so the earliest arrival is a shortest distance; a node
    can be used only if the distance is strictly less than its disappearance time, which is a test inside
    the relaxation step and does not change the order of finishing (Theorem 4.3.1).
  why_others_fail: A plain BFS ignores the lengths, and a table of all pairs is far too large for 5·10^4
    nodes.
- problem: ac-abc400_d
  answer:
    topic: '4.3'
    card: zero-one-weights
  property: 'There are two kinds of moves, free walks and kicks costing 1, and the question counts kicks:
    weights 0 and 1 only, which a deque handles (Theorem 4.3.2) without the logarithm of a heap.'
  why_others_fail: A plain BFS counts moves, not kicks; trying all sets of kicks is exponential.
- problem: lc-minimum-cost-to-convert-string-i
  answer:
    topic: '4.3'
    card: every-pair
  property: 'Only 26 letters exist, so the rules form a small graph, and the string asks for the cheapest
    conversion for up to 10^5 pairs of letters: build the table of all pairs once with the triple loop
    of Theorem 4.3.4 and add up one entry per position.'
  why_others_fail: A search per position costs 10^5 searches; one table for 26 letters costs 26^3 steps.
- problem: cf-25C
  answer:
    topic: '4.3'
    card: every-pair
  property: 'The table of all distances is already given; a new road (a, b, c) can only improve a pair
    (i, j) through the road, so one pass over all pairs updates the table in n² steps (the idea of Theorem
    4.3.4: allow a new middle vertex and relax every pair).'
  why_others_fail: Running the triple loop again after each road costs k · n³ = 8·10^9 steps; a search
    from every city is slower.
- problem: lc-minimum-cost-to-reach-destination-in-time
  answer:
    topic: '4.3'
    card: extra-state
  property: Two things limit the trip, the fee (to minimise) and the time (to stay within the limit);
    the time used is an extra fact in the state, so the state is (city, time used) and the search on fees
    runs over n · maxTime states (Theorem 4.3.5).
  why_others_fail: Dijkstra on the cities alone keeps only one number per city, and the cheapest fee to
    a city may need more time than allowed, losing a trip that is dearer but quicker.
- problem: lc-rotting-oranges
  answer:
    topic: '4.1'
    card: multi-source
  property: 'Every step takes one minute and there are several sources at once: this is the fewest edges
    from a set of start cells, a multi-source BFS measured in levels (Theorem 4.1.4).'
  why_others_fail: No weights appear, so Dijkstra's heap is not needed; the levels of a queue do the same
    work.
- problem: ac-abc284_c
  answer:
    topic: '4.1'
    card: components
  property: 'No distance or cost is asked, only how many groups the vertices fall into: one walk per group
    (Theorem 4.1.2).'
  why_others_fail: The shortest-path tools of this topic compute distances that the question does not
    ask for.
- problem: ac-abc289_d
  answer:
    topic: '3.2'
    card: linear-state
  property: 'Positions only increase, so each position depends on earlier ones: a table can[i] over the
    positions in order, no search needed.'
  why_others_fail: The positions and steps look like a graph, but with no weights and no cycles a single
    left-to-right pass is enough.
- problem: lc-course-schedule
  answer:
    topic: '4.2'
    card: directed-cycle
  property: The question is whether the arrows contain a cycle; no cost is asked (Theorem 4.2.4 and the
    order of Theorem 4.2.3).
  why_others_fail: Shortest-path tools compute costs that the question does not ask for, and negative-cycle
    detection is a different question.
lookalike_pairs:
- a: cses-1671
  b: cses-1672
  a_tool:
    topic: '4.3'
    card: dijkstra
  b_tool:
    topic: '4.3'
    card: every-pair
  shared_surface: Both give a graph of cities with weighted roads and ask for cheapest costs.
  flipping_difference: A asks for the costs from one city on a large sparse graph (10^5 cities), so one
    heap search is the whole answer and a table would not even fit. B asks for many pairs on a small graph
    (500 cities, 10^5 questions), so the table of all pairs is built once and each question is a lookup.
  flipping_input: 'The roads 1–2 (1) and 2–3 (1). A asks for the costs from city 1: 0 1 2. B asks for
    the pairs (3, 1) and (2, 3): 2 and 1; the second pair does not start at city 1, so a single search
    from city 1 cannot answer it.'
- a: ac-abc237_e
  b: ac-abc137_e
  a_tool:
    topic: '4.3'
    card: dijkstra
  b_tool:
    topic: '4.3'
    card: negative-weights
  shared_surface: Both ask for the best total gain along a walk, and some single steps lose points, so
    some weights are negative.
  flipping_difference: 'In A the gains come from heights: a trip round a cycle returns to the same height,
    so the total gain of a cycle can never be positive, and shifting every edge by the heights makes all
    costs non-negative, so a heap search works. In B the gains are arbitrary numbers, a cycle can have
    a positive total, and the answer may be unbounded; Bellman–Ford with the test for a cycle that lies
    on a way to the target is needed.'
  flipping_input: 'Two towns joined by a road, heights 0 and 3. A: the trip 1 → 2 → 1 loses 6 on the way
    up and gains 3 on the way down, a total of −3, so going round never pays and the answer is the best
    single trip (0 or −6 or −3: the best is 0, staying in town 1). B: three towns with the trains 1 →
    2 and 2 → 1 each worth +1 net and 2 → 3 worth 0; going round 1 → 2 → 1 gains 2 every time, and 2 →
    3 leads on to the target, so the answer is −1.'
self_test:
- q: Roads 1→2 (3), 1→3 (5), 2→3 (1), all one-way. In what order does Dijkstra's algorithm take the vertices
    out of the heap, and what are the final distances?
  a: Vertex 1 first (0); then 2 (3), because 3 < 5; then 3, which has been improved from 5 to 4 through
    vertex 2, so the final distances are 0, 3, 4. Vertex 3 enters the heap twice (with 5 and later with
    4); the entry with 5 is stale and is skipped.
- q: A road network has one road of length −2 and no cycle. Why can Dijkstra's algorithm give a wrong
    distance, and which algorithm from this topic still works?
  a: Dijkstra finishes a vertex as soon as it is taken from the heap, which is right only because a later
    route cannot be shorter (Theorem 4.3.1, step 3 needs non-negative weights); a negative road can make
    a later route shorter. Bellman–Ford does not rely on that and works for any weights without a negative
    cycle.
- q: A grid has open cells and rocks, and you ask for the fewest rocks on a way from corner to corner.
    Why is a plain BFS wrong, and what is the right tool?
  a: 'A plain BFS minimises the number of steps; here the cost of a step is 0 into an open cell and 1
    into a rock. Costs of only 0 and 1 are exactly the card for 0-1 BFS: a deque with cost-0 moves in
    front and cost-1 moves at the back.'
- q: Bellman–Ford runs n rounds on a graph of n vertices and the last round still changes a value. What
    does this tell you, and why must it not be the end of the story for a problem "cheapest cost from
    1 to n"?
  a: Some negative cycle can be reached from the start (Theorem 4.3.3(c)). But it makes the answer unbounded
    only if the cycle lies on a walk from vertex 1 to vertex n; so keep only vertices that are reachable
    from 1 and reach n, and report "unbounded" only when a change in round n happens among them.
- q: n = 400 towns, 10^5 questions "cost from a to b". Compare the work of Dijkstra's algorithm for each
    question with Floyd–Warshall once.
  a: One Dijkstra costs about (n + m) log n; for 10^5 questions on a dense graph (m up to 160000) this
    is roughly 10^5 · 1.6·10^5 · 9 ≈ 10^11. Floyd–Warshall costs 400³ = 6.4·10^7 once, and every question
    is a lookup.
- q: A trip may use at most k free roads. Why is the state of the search (town, number of free roads used)
    and not just the town? Give the number of states.
  a: The cheapest cost to a town depends on how many free roads are left, and a cheaper arrival with all
    free roads used can be worse than a dearer arrival with some left; one number per town cannot hold
    both. The number of states is n · (k + 1).
- q: In Floyd–Warshall, what goes wrong if the loops are ordered i, j, k instead of k, i, j?
  a: After the round of k the table must be correct for all routes through the vertices 1..k (Theorem
    4.3.4). With k innermost, the entry for (i, j) is finished before the entries it needs (through the
    later middle vertices) have been improved, so some distances stay too long.
