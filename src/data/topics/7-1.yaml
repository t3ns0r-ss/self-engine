  hints:
  - Fix x and ask only whether k cuts suffice. If x works, does a smaller x work too?
  - Go from the leaves up and let size[v] be the number of vertices of the piece of v that is still attached
    below. When size[v] ≥ x, cut the edge to the parent, count one finished piece and set size[v] to 0.
  - x is possible when the count of finished pieces is at least k + 1 (the piece left at the root also
    needs x vertices). Binary search x from 1 to n / (k + 1).
- id: ac-abc149_f
  role: ladder
  card: subtree-dp
  rung: 6
  twist: The sizes of the branches of every vertex from one pass of subtree sizes, then an expected value
    by a product of powers of one half.
  summary: A tree of N ≤ 2·10^5 vertices; every vertex is painted black or white with probability 1/2;
    the expected number of white vertices in the smallest connected subgraph that contains all black vertices,
    modulo 10^9 + 7.
  hints:
  - When is a white vertex v inside the smallest connected subgraph? Remove v and look at the branches
    that are left.
  - It is inside exactly when at least two of the branches contain a black vertex. A branch with s vertices
    has no black vertex with probability 1/2^s.
  - The branch sizes at v are the sizes of the subtrees of its children and N minus the size of its own
    subtree. For each v take half of 1 − (the chance that no branch has a black vertex) − (the chance
    that exactly one has), using inverse powers of 2 modulo the prime.
