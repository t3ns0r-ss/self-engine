decision_map:
- weak_signal: Choose r of n positions, cells or people; anagrams; many C(n, r) queries modulo a prime
  choose: ncr-mod-p
  when: The count is a formula in binomial or multinomial coefficients with every n below the prime and
    small enough for a factorial table (Theorem 2.3.3).
  over:
  - card: nested-loops
    because: Listing the subsets is exponential; the formula counts them in O(1) each.
    topic: '0.5'
  - card: fast-power
    because: When every position is free (no positions to choose), the count is k^n and needs no binomial.
    topic: '2.2'
- weak_signal: Fill positions one by one, each with a restriction against earlier ones; count by cases
  choose: product-sum-rules
  when: The number of options at every step is the same whatever was chosen before (or the cases are disjoint),
    so the counts multiply (or add) (Theorem 2.3.1).
  over:
  - card: ncr-mod-p
    because: A binomial is needed only when the order of choosing does not matter; a step-by-step product
      counts ordered choices.
  - card: include-exclude
    because: If the options at a step depend on which earlier values were taken, fix the order (for example
      by sorting) or subtract the bad cases.
- weak_signal: Split identical items among labelled people; non-decreasing sequences; ordered sums with
    a fixed total
  choose: stars-bars
  when: 'Identical items, distinguishable groups, only lower bounds: k − 1 bars among n + k − 1 positions
    (Theorem 2.3.5).'
  over:
  - card: fast-power
    because: 'Different items each choose a group independently: k^n.'
    topic: '2.2'
  - card: include-exclude
    because: Upper bounds on the groups need an alternating sum over the groups that exceed them.
- weak_signal: 'Avoid several properties at once: divisible by none of a few numbers, no fixed points,
    no part above a limit'
  choose: include-exclude
  when: For every set of properties the number of objects with all of them has a formula, and the number
    of sets is small (Theorem 2.3.6).
  over:
  - card: gcd-lcm
    because: With two properties only, Theorem 0.4.6 already counts the union.
    topic: '0.4'
  - card: multiples-sieve
    because: For counting coprime pairs among values up to 10^6, the subtraction over multiples of Theorem
      2.1.6 does the same job without listing sets of primes.
    topic: '2.1'
- weak_signal: Walks with right and up steps, two kinds of moves with fixed totals, bracket sequences
  choose: bijection-paths
  when: The objects correspond one-to-one with choices of positions (which steps go right), so one binomial
    counts them; a boundary is handled by reflecting the bad paths (Theorem 2.3.7).
  over:
  - card: ncr-mod-p
    because: The bijection is what turns the question into C(n, r); after it, the table computes the number.
  - card: include-exclude
    because: A few blocked cells are removed by subtracting the paths through them, in order of position.
glossary_added:
- product rule
- factorial
- binomial coefficient
- multinomial coefficient
- stars and bars
- inclusion–exclusion
- bijection
- lattice path
