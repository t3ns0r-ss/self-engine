# Topic 7.4 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.4'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, and the search over subsets'
- topic: '0.6'
  what: 'Standard containers: the priority queue (heap), pairs and tuples in a heap, the ordered multiset'
- topic: '1.1'
  what: 'Sorting: the items in the order of the last days, the arrival or a ratio'
- topic: '1.3'
  what: 'Two pointers: the fixed window that a look-alike problem needs'
- topic: '1.4'
  what: 'Binary search: a search on the answer around a greedy check'
- topic: '1.5'
  what: 'The first greedy topic: exchange arguments, the earliest end first, the most extreme first'
- topic: '3.2'
  what: 'Dynamic programming: the O(n²) tables that the greedy replaces'
- topic: '3.3'
  what: 'Knapsack: choices with values or with unequal gains and costs, where the greedy fails'
- topic: '4.4'
  what: 'Disjoint sets: the days left free, in the weighted version of the events problem'
- topic: '7.3'
  what: 'DP sped up with trees: the weighted scheduling problem that a DP solves'
theorems:
- id: 7.4.1
  title: Take everything, drop the worst
  plain_words: 'Do every course for now. As soon as the schedule runs late, the course that wastes the
    most time is the one to give up: giving up any other course frees less time, and the number of courses
    given up is the same. Because the courses are looked at in the order of their last days, the only
    schedule that can run late is the last one added, so one removal repairs it.'
  code: 7.4/thm-1
- id: 7.4.2
  title: Pay late
  plain_words: Do nothing until a requirement is violated. Then something earlier must have been chosen,
    and the best earlier item is always at least as good as any other earlier item that could be chosen
    instead, so it is safe to choose it now, even though the choice is made late. The heap keeps the earlier
    items that are still available.
  code: 7.4/thm-2
- id: 7.4.3
  title: Take the best and put a changed item back
  plain_words: If every item gets less and less rewarding, the best $k$ operations are simply the $k$
    best gains in the whole table, and a heap that always offers each item's next gain hands them out
    in order. For merging, the two lightest items belong at the bottom of the merge tree, where their
    weights are counted the most times, so they are merged first.
  code: 7.4/thm-3
- id: 7.4.4
  title: The sweep with a heap of what is available
  plain_words: Among the events that are open today, the one that closes first is the one that will be
    missed if it is not taken now, and taking it does not stop us from taking any other event later. For
    rooms, a new room is opened only when every room in use holds somebody who is still there today; those
    people, plus the newcomer, are all present on the same day, so that many rooms were needed anyway.
  code: 7.4/thm-4
cards:
- id: deadline-heap
  name: Take everything, drop the worst when a limit is exceeded
  from_theorem: 7.4.1
  decisive_property: The items are looked at in an order in which a limit (a last day, a health bound,
    a number of segments over a point) must hold after each step, only the number of items kept counts,
    and when the limit fails, giving up the item that costs the most restores it at the least loss.
  how_to_test: Sort the items in the order in which the limits come. Write each limit as "total ≤ bound"
    after the step. Check that what is maximised is the number of items kept (all alike) and that one
    removal restores the limit. If the items have values, dropping the costliest one is not enough, and
    the problem is a knapsack.
  constraint_shapes:
  - 'n = 2·10^5 potions and the most that can be drunk with the health never below 0: the subsets are
    2^n and the health has up to 2·10^14 values, against n log n with one heap'
  - 'n = 2·10^5 courses with last days: a DP over the number of courses is n² = 4·10^10, against n log
    n'
  weak_signals:
  - form: Asks for the largest number of items that can be done one after another, each by its deadline,
      with durations
    shape: n up to 2·10^5, durations and deadlines up to 10^9
  - form: Asks for the most items that can be taken in a row while a running balance (health, money, fuel)
      never drops below 0
    shape: n up to 2·10^5, values of both signs
  - form: Asks for the fewest removals so that no point is covered by more than k intervals
    shape: n up to 2·10^5, k up to n
  kill_signals:
  - 'The items have values and the total value is asked: with the courses (3, 4, value 7) and (2, 4, value
    6) the drop-the-longest rule keeps the value 6 where 7 is possible; this is a knapsack (topic 3.3)'
  - 'The limits do not come in one fixed order, so no sorting makes each limit a prefix: one removal no
    longer repairs the schedule'
  in_action:
    statement: n potions in a row change your health by a_i (some are negative). Your health starts at
      0 and must never be negative, and you drink in the order of the row. Print the largest number of
      potions you can drink.
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: There are 2^n subsets and the health has up to 2·10^14 values. Need about n log n.
    candidates:
    - tool: Try all subsets (topic 0.5)
      verdict: rejected
      because: 2^n subsets.
    - tool: A DP over the position and the health (topic 3.2)
      verdict: rejected
      because: The health has up to 2·10^14 different values.
    - tool: Drink everything and put back the most harmful potion when the health is negative (this topic)
      verdict: chosen
      because: The harmful potions are courses whose last day is the sum of the good potions before them,
        so Theorem 7.4.1 applies.
    property_check: Only the number of potions counts; the condition after each potion is health ≥ 0;
      a negative health is repaired by putting back the most harmful potion drunk. The property holds.
    decision: 'A min-heap of the drunk potions: push, add to the health, and while the health is below
      0 pop the smallest; the answer is the size of the heap: O(n log n).'
  examples:
    positive:
    - inline:
        input: The courses (duration, last day) are (100, 200), (200, 1300), (1000, 1250), (2000, 3200).
          What is the largest number of courses that can be taken one after another?
        answer: '3'
        why: 'In the order of the last days the totals are 100, 1100, 1300, and then 3300 passes 3200,
          so the course of 2000 is dropped (Theorem 7.4.1): 3 courses.'
    - inline:
        input: The potions 4, −4, 1, −3, 1, −3 stand in a row; the health starts at 0 and may not drop
          below 0. What is the largest number of potions that can be drunk?
        answer: '5'
        why: 'The loop drinks 4, −4, 1, then −3 makes the health −2, and it puts back the −4 (the health
          is 2); then 1 and −3 give the health 3 and 0. It keeps 4, 1, −3, 1, −3: 5 potions.'
    - worked_example: lc-course-schedule-iii
      why: 'The most courses taken one after another with last days, n up to 10^4 or more: sort by the
        last day and keep a heap of durations.'
    negative:
    - inline:
        input: 'Two courses with values: (duration 3, last day 4, value 7) and (duration 2, last day 4,
          value 6). Only one of them fits. What is the largest total value?'
        answer: '7'
        method_gives: '6'
        why: The two courses cannot be taken together (the total 5 passes the day 4). The rule drops the
          longest, which is the course of value 7, and keeps the value 6. With values the choice is a
          knapsack.
      correct_tool:
        topic: '3.3'
        card: zero-one
    - problem: lc-maximum-profit-in-job-scheduling
      why: 'The jobs have profits and may not overlap: dropping a job by its length is not enough; sort
        by the end and take the better of skipping a job and taking it with the best total before its
        start (a DP with a prefix maximum).'
      correct_tool:
        topic: '7.3'
        card: prefix-max-transition
  lookalikes:
  - description: Courses with profits (weighted scheduling)
    tool:
      topic: '3.3'
      card: zero-one
    flipping_difference: When the total value counts and not the number of courses, dropping the longest
      is wrong, and a DP over the time (or over the number of courses) is used.
  - description: The most intervals with fixed positions that do not overlap
    tool:
      topic: '1.5'
      card: interval-selection
    flipping_difference: When the intervals have fixed positions, sort by the end and take what fits,
      with no heap. Durations with deadlines and a free start need the heap.
  complexity: O(n log n) time (sorting and the heap), O(n) memory.
- id: regret
  name: 'Pay late: repair a violated requirement on a prefix with the best earlier item'
  from_theorem: 7.4.2
  decisive_property: The requirements are lower bounds on nested prefixes (the fuel needed to reach a
    point, the balance of a prefix), an item that was passed can be chosen at any later moment, and any
    two items are comparable (all costs equal, or all gains equal).
  how_to_test: 'Write each requirement as "the chosen gain among the items before this point is at least
    R". Check that the groups of items are nested prefixes and that the items can be ordered by quality:
    all costs equal (take the largest gain) or all gains equal (take the smallest cost). If both vary,
    the property fails. Scan the points, put the new items in a heap, and repair each violated requirement
    with the best item in the heap.'
  constraint_shapes:
  - 'n = 2·10^5 stations and the fewest stops to reach a far target: the subsets are 2^n and the DP over
    the number of stops is n² = 4·10^10, against n log n with a heap'
  - 'n = 5·10^4 characters "?" in a bracket string, each with a price for "(" and a price for ")": the
    assignments are 2^n, against n log n'
  weak_signals:
  - form: Asks for the fewest (or cheapest) items to choose so that a running total never drops below
      a bound at any point
    shape: n up to 2·10^5, the items are passed in order
  - form: Asks for the furthest point reached with a limited number of one-time boosts (ladders, jumps,
      refuels) of unequal size
    shape: n up to 10^5, boosts up to the number of items
  - form: Asks for the cheapest way to repair a sequence (a bracket string with ?, a balance) so that
      every prefix is valid
    shape: n up to 5·10^4, two prices for each unknown
  kill_signals:
  - 'The gains and the costs both differ and are not comparable: with the requirement 10 and the items
    (gain 10, cost 100), (gain 6, cost 1), (gain 5, cost 1) the largest gain costs 100, but the two small
    items give 11 at the cost 2 (a knapsack, topic 3.3)'
  - 'The requirement is not a lower bound on a prefix but depends on items after the point: a prefix cannot
    be repaired from the earlier items alone'
  in_action:
    statement: A car starts with startFuel units of fuel and drives to a target at distance target (one
      unit of fuel per unit of distance). Stations on the way have fuel amounts that are all taken at
      a stop. Print the fewest stops, or −1.
    constraints: n ≤ 2·10^5 stations, positions and fuels up to 10^9.
    budget: The subsets of stations are 2^n and the DP over the number of stops is n². Need about n log
      n.
    candidates:
    - tool: Try all subsets of stations (topic 0.5)
      verdict: rejected
      because: 2^n subsets.
    - tool: 'A DP: the furthest distance with j stops (topic 3.2)'
      verdict: rejected
      because: n² steps.
    - tool: Drive on, keep the passed stations in a heap and use the largest fuel when the fuel runs out
        (this topic)
      verdict: chosen
      because: All stops cost 1, so the largest fuel is at least as good as any other station, and the
        points to be reached give nested requirements (Theorem 7.4.2).
    property_check: Each point that must be reached needs a lower bound on the fuel of the stations before
      it; the groups are nested; all costs are equal. The property holds.
    decision: 'A max-heap of the fuels of the passed stations; while the reach is below the target pop
      the largest, add it and count a stop; −1 if the heap is empty: O(n log n).'
  examples:
    positive:
    - inline:
        input: The target is at 100, the car starts with 10 units, and the stations (position, fuel) are
          (10, 60), (20, 30), (30, 30), (60, 40). What is the fewest number of stops?
        answer: '2'
        why: 'The car reaches 10 and uses the station there (60): the reach is 70. It has passed the stations
          at 20, 30 and 60; the largest fuel among them is 40: the reach is 110 ≥ 100. Two stops (Theorem
          7.4.2).'
    - inline:
        input: The heights of seven buildings are 4, 2, 7, 6, 9, 14, 12. You have 5 bricks and 1 ladder;
          a climb of h costs h bricks or one ladder; going down is free. What is the largest index you
          can reach, starting at the index 0?
        answer: '4'
        why: 'The climbs are 5 (to the index 2), 3 (to the index 4) and 5 (to the index 5). The first
          is paid with 5 bricks. The second needs 3 more: the largest paid climb, 5, becomes the ladder
          and 5 bricks come back; the second uses 3. The third needs 5 and only 2 bricks are left, and
          no ladder: the walk stops at the index 4.'
    - worked_example: lc-minimum-number-of-refueling-stops
      why: 'The fewest stops to reach a far target, with any number of stations: keep the passed stations
        in a heap and use the largest fuel late.'
    negative:
    - inline:
        input: 'A car starts with 1 unit of fuel and the target is at distance 10. Three stations stand
          at the position 1: (fuel 10, price 100), (fuel 6, price 1), (fuel 5, price 1). What is the least
          total price of the fuel bought?'
        answer: '2'
        method_gives: '100'
        why: 'The largest fuel (10) is chosen first and costs 100, but the two small stations give 11
          units and cost only 2. Both the fuels and the prices differ, so the largest fuel is not at least
          as good as the others: a knapsack.'
      correct_tool:
        topic: '3.3'
        card: zero-one
    - problem: lc-coin-change
      why: 'Asks for the fewest coins with a given sum: taking the largest coin first fails for the coins
        1, 3, 4 and the sum 6 (4 + 1 + 1 against 3 + 3); the DP over the sums is the tool.'
      correct_tool:
        topic: '3.3'
        card: unbounded
  lookalikes:
  - description: Boosts with one requirement at the end only
    tool:
      topic: '1.5'
      card: extreme-first
    flipping_difference: 'With a single requirement at the end, sort the boosts and take the largest ones:
      there is no heap and no repair on the way. The heap is for requirements at several points.'
  - description: The fewest coins with a given sum (unequal values, no prefix structure)
    tool:
      topic: '3.3'
      card: unbounded
    flipping_difference: There is no prefix requirement and the largest coin is not safe to take; a DP
      over the sums is used.
  complexity: O(n log n) time, O(n) memory.
- id: extract-and-replace
  name: Take the best item, change it, and put it back into the heap
  from_theorem: 7.4.3
  decisive_property: Each step takes the item with the extreme key (the largest gain, the smallest weight)
    and changes it, and the next gain of an item is no larger than the one just taken; or the cost of
    joining two items is the sum of their weights, and the two lightest items are joined first.
  how_to_test: List what one step does to an item and compare the next gain of that item with the gain
    just taken. If the gains of an item never increase, the heap of the current best gains is the tool;
    for joining, check that the cost is the sum of the two weights. If an item can gain more later (a
    bonus after two steps), the property fails.
  constraint_shapes:
  - 'k = 10^5 operations on n = 10^5 numbers, each halving one number: the sequences of choices are n^k,
    against (n + k) log n with a heap'
  - 'n = 2·10^5 sticks joined two at a time at the cost of the sum: the number of orders is astronomical,
    against n log n with a min-heap'
  weak_signals:
  - form: Asks for the best result after exactly k operations, each applied to one chosen item and making
      that item less rewarding to use again
    shape: n and k up to 10^5, an operation halves a number, or adds one student to a class, or lowers
      a price
  - form: Asks for the fewest operations to reduce a total by a given amount, each operation reducing
      one item
    shape: n up to 10^5, the item is halved or decremented
  - form: Asks for the cheapest way to join n pieces two at a time, the cost being the sum of the two
      sizes
    shape: n up to 2·10^5, sizes up to 10^9
  kill_signals:
  - 'The gains of an item can rise: with two items whose gains are (0, 10) and (3, 2) and two operations,
    the process takes 3 + 2 = 5 where 10 is possible (use a DP over the number of operations used on each
    item)'
  - 'The cost of joining is not the sum of the two weights (a product, or a cost for the place): the two
    lightest items are no longer best joined first'
  in_action:
    statement: An array of n positive numbers. One operation halves a chosen number (the result may be
      a fraction). Print the fewest operations that reduce the sum of the numbers by at least half.
    constraints: n ≤ 10^5, numbers up to 10^7.
    budget: The sequences of choices are exponential. Need about (n + k) log n for k operations.
    candidates:
    - tool: Try all sequences of choices (topic 0.5)
      verdict: rejected
      because: n^k sequences.
    - tool: Halve the numbers in the given order
      verdict: rejected
      because: The effect of an operation depends on the number it is applied to, so the order matters.
    - tool: Always halve the current largest number (this topic)
      verdict: chosen
      because: The gains x/2, x/4, … of a number fall, so the best operation is on the largest number
        now (Theorem 7.4.3 (a)).
    property_check: Each operation gains half of the current value of the number, and the gains of one
      number only fall. The property holds.
    decision: 'A max-heap of the current numbers: pop the largest x, add x/2 to the removed amount, push
      x/2; stop when the removed amount reaches half the sum: O((n + k) log n).'
  examples:
    positive:
    - inline:
        input: The piles 5, 4, 9 are changed by 2 operations; each removes floor(x / 2) stones from one
          pile (a pile can be used again). What is the smallest number of stones left?
        answer: '12'
        why: 'The gains: the pile 9 gives 4, then the new pile 5 and the old piles 5 and 4 give 2 each;
          the best two operations gain 4 + 2 = 6 (Theorem 7.4.3 (a)): 18 − 6 = 12.'
    - inline:
        input: The weights 4, 3, 2, 6 are joined two at a time; joining two items costs their sum and
          gives one item. What is the smallest total cost of joining them all into one?
        answer: '29'
        why: 'Join the two lightest each time: 2 + 3 = 5 (cost 5), 4 + 5 = 9 (cost 9), 6 + 9 = 15 (cost
          15). The total is 29 (Theorem 7.4.3 (b)).'
    negative:
    - inline:
        input: Two items have the gains of their successive operations (0, 10) and (3, 2). Two operations
          are made. What is the largest total gain?
        answer: '10'
        method_gives: '5'
        why: Two operations on the first item give 0 + 10. The process that takes the largest current
          gain starts with the 3 of the second item and then takes 2, and gets 5, because the gain of
          the first item rises after a poor first step.
      correct_tool:
        topic: '3.2'
        card: two-index
    - problem: lc-maximum-points-you-can-obtain-from-cards
      why: 'Asks for the best k cards taken from the two ends: the next card depends on which end was
        taken before, and the answer is the total minus the smallest window of n − k cards (a fixed window,
        or a prefix and a suffix); no heap.'
      correct_tool:
        topic: '1.3'
        card: fixed-window
  lookalikes:
  - description: Choosing the k largest elements, where an element is gone after it is taken
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: If a taken item simply disappears, the k largest can be taken with a heap or
      a sort. Here the item changes and goes back into the heap with its next gain.
  - description: Operations whose gains are arbitrary, with a limit on how many are used
    tool:
      topic: '3.3'
      card: zero-one
    flipping_difference: When the gains of an item do not fall, the best use of the operations is a DP
      over the budget, not a heap.
  complexity: O((n + k) log n) time, O(n) memory.
- id: sweep-with-heap
  name: Sweep over time or keys, with a heap of the items that are available
  from_theorem: 7.4.4
  decisive_property: The items become available in a fixed order (a start time or a key) and are used
    one at a time or until they expire, and among the available items the one that expires first, or is
    best by a fixed key, can always be taken without hurting the future.
  how_to_test: 'Sort the items by the moment they become available. Sweep the time (or the keys): add
    what has become available to a heap ordered by the end or by the key, drop what has expired, and take
    the top. Check by an exchange that taking the top loses nothing. If the items have values, or take
    several days, the property fails.'
  constraint_shapes:
  - 'n = 2·10^5 events with first and last days, one event a day: the assignments are exponential, against
    n log n with one heap'
  - 'n = 2·10^5 customers with arrival and departure days: scanning all rooms for each customer is 4·10^10
    steps, against n log n'
  weak_signals:
  - form: Asks for the largest number of tasks, events or jobs done when each can be done inside a window
      of time and one is done at a time
    shape: n up to 2·10^5, windows of days
  - form: Asks for the fewest rooms, machines or servers, or for an assignment of items to them, when
      the items occupy intervals
    shape: n up to 2·10^5, intervals up to 10^9
  - form: Asks for the best team or set of k items, where a threshold (the smallest efficiency, the largest
      ratio) is swept in sorted order
    shape: n up to 10^5, k up to n
  kill_signals:
  - 'The items have values: with two events that can only be attended on the day 1, with the values 1
    and 5, the earliest-end rule may take the value 1 where 5 is possible (sort by the value and use a
    disjoint set of free days, topic 4.4)'
  - 'An item takes several days, or the days are not integers: the earliest end is not the right item
    to take, because the choice depends on the length'
  in_action:
    statement: n customers arrive on the day a_i and leave on the day b_i (both days included). Give each
      customer a room so that nobody shares a room on the same day, using the fewest rooms. Print the
      number of rooms and a room for each customer.
    constraints: n ≤ 2·10^5, days up to 10^9.
    budget: Scanning all rooms for each customer is n · rooms = 4·10^10 steps. Need about n log n.
    candidates:
    - tool: Try all assignments (topic 0.5)
      verdict: rejected
      because: Exponentially many.
    - tool: Scan all rooms for a free one, for each customer
      verdict: rejected
      because: n · rooms steps.
    - tool: Sort by arrival and keep a heap of (departure, room) for the rooms in use (this topic)
      verdict: chosen
      because: The room that frees first is the best candidate, and a new room is opened only when all
        rooms hold somebody present today (Theorem 7.4.4).
    property_check: The customers are handled in the order of arrival, a room becomes available when its
      customer leaves, and the one that leaves first is the best candidate. The property holds.
    decision: 'Sort by arrival; a min-heap of (departure, room); reuse the top if its departure is before
      the arrival, otherwise a new room: O(n log n).'
  examples:
    positive:
    - inline:
        input: The events (first day, last day) are (1, 2), (2, 3), (3, 4), (1, 2). One event can be attended
          each day. What is the largest number of events attended?
        answer: '4'
        why: 'Day 1: attend an event ending on 2. Day 2: (2, 3) opens, attend the event ending on 2. Day
          3: attend (2, 3). Day 4: attend (3, 4). All four (Theorem 7.4.4).'
    - inline:
        input: Six engineers have the speeds 2, 10, 3, 1, 5, 8 and the efficiencies 5, 4, 3, 9, 7, 2.
          A team of at most 2 has the performance (the sum of the speeds) × (the smallest efficiency).
          What is the largest performance?
        answer: '60'
        why: 'Sweeping from the highest efficiency: with the efficiency 4 as the smallest, the best two
          speeds seen so far are 10 and 5, so the performance is (10 + 5) × 4 = 60.'
    - worked_example: cses-1164
      why: 'The fewest rooms for customers with arrival and departure days, n up to 2·10^5: sort by arrival
        and keep a heap of the rooms in use.'
    negative:
    - inline:
        input: Two events that can only be attended on the day 1, with the values 1 and 5, listed in this
          order. One event a day. What is the largest total value?
        answer: '5'
        method_gives: '1'
        why: The earliest-end rule sees two events with the same last day and takes the first, of value
          1. With values, the order must be by value, not by the end.
      correct_tool:
        topic: '4.4'
        card: merge-groups
    - problem: cses-1629
      why: 'Asks for the most movies (intervals with fixed times) watched one after another: sort by the
        end and take what fits; there is no heap.'
      correct_tool:
        topic: '1.5'
        card: interval-selection
  lookalikes:
  - description: Fixed intervals, a largest set of non-overlapping ones
    tool:
      topic: '1.5'
      card: interval-selection
    flipping_difference: 'Intervals with fixed times: sort by the end and take what fits. Windows with
      a free choice of the day need the heap.'
  - description: Intervals with values on a line, a best set that does not overlap
    tool:
      topic: '7.3'
      card: prefix-max-transition
    flipping_difference: With values and whole ranges occupied, a DP with a prefix maximum over the end
      times is used, not a greedy.
  complexity: O(n log n) time (sorting and the heap), O(n) memory.
problems:
- id: lc-course-schedule-iii
  role: worked_example
  summary: Up to 10^4 courses, each with a duration and a last day; one course at a time with no breaks;
    the largest number of courses that can be taken.
- id: lc-minimum-number-of-refueling-stops
  role: worked_example
  summary: A car with startFuel units of fuel drives to a target at distance target; stations on the way
    (up to 500) have fuel that is all taken at a stop; the fewest stops, or -1.
- id: cses-1164
  role: worked_example
  summary: n ≤ 2·10^5 customers with arrival and departure days (both included); the fewest rooms so that
    nobody shares a room on a day, and a room for each customer.
- id: cf-1526C2
  role: ladder
