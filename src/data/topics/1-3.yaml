# Topic 1.3 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.3'
uses:
- topic: '0.1'
  what: Reading input and long long for sums that pass about 2·10^9
- topic: '0.2'
  what: Turning n ≤ 2·10^5 into "about 10^6 to 10^7 operations are fine, n² is not"
- topic: '0.3'
  what: One-pass scans, which several negative examples contrast with a moving window
- topic: '0.4'
  what: Remainders, used by one ladder problem on subarray sums modulo m
- topic: '0.5'
  what: 'Brute force: the reference solutions in the tests, and the plain loops several negative examples
    fall back to'
- topic: '0.6'
  what: map and multiset to keep the values inside a window
- topic: '1.1'
  what: 'Sorting: two of the forms here work on sorted arrays'
- topic: '1.2'
  what: 'Prefix sums: the standard alternative when a condition is an exact sum or values can be negative'
theorems:
- id: 1.3.1
  title: A window that only ever shrinks from the left finds the longest valid window
  plain_words: If every part of a valid window is valid too, then for each right end the best left end
    never moves left as the right end grows. One pass that moves both ends only forward finds the longest
    valid window.
  code: 1.3/thm-1
- id: 1.3.2
  title: For each right end the valid left ends form one block
  plain_words: When every part of a valid window is valid, the valid left ends for a fixed right end are
    all positions from the best one up to the right end itself, so each right end contributes one count
    to the number of valid windows.
  code: 1.3/thm-2
- id: 1.3.3
  title: A window of fixed length is updated by one add and one remove
  plain_words: To look at every window of exactly k elements, add the element that enters and remove the
    one that leaves. This works whenever the summary of the window can undo an add, such as a sum, a table
    of counts or a multiset.
  code: 1.3/thm-3
- id: 1.3.4
  title: From both ends of a sorted array, one end can always be discarded
  plain_words: In a sorted array, if the smallest and largest of the remaining elements add to too little,
    the smallest can never be part of a solution; if they add to too much, the largest cannot. So the
    two ends can be moved inwards.
  code: 1.3/thm-4
- id: 1.3.5
  title: Two sorted lists can be walked with pointers that only move forward
  plain_words: When both lists are sorted, what each element of the first list needs from the second begins
    where the previous one stopped, so one pointer into the second list only moves forward. A subsequence
    check is the same walk.
  code: 1.3/thm-5
- id: 1.3.6
  title: A subsequence is found by matching each character as early as possible
  plain_words: A string t is a subsequence of s exactly when scanning s once and matching the next character
    of t whenever it appears matches all of t. Matching early never hurts the later characters.
  code: 1.3/thm-6
cards:
- id: shrinkable-window
  name: Shrinkable window
  decisive_property: Validity is closed under shrinking (every sub-window of a valid window is valid),
    the empty window is valid, and validity can be rechecked after adding or removing one element. For
    'shortest window with property P', the same holds for the opposite of P.
  from_theorem: 1.3.1
  how_to_test: Take any valid window, delete its first or last element, and argue it stays valid for every
    possible input. Then try a small counterexample with the problem's extreme values (zeros, negatives,
    repeated values).
  constraint_shapes:
  - 'n up to 2·10^5 and a condition on a contiguous window: checking every window is n²/2 = 2·10^10 steps,
    but the two pointers each move at most n times, so at most 2n = 4·10^5 checks.'
  weak_signals:
  - form: Asks for the longest or shortest contiguous subarray or substring with a property
    shape: n up to 2·10^5, with a sum at most K and non-negative values, or "all distinct", or "at most
      k of something"
  - form: Asks for the fewest items to remove from the two ends of a row
    shape: What remains is one middle window, so the question is the longest valid middle window
  kill_signals:
  - 'Values can be negative and the condition is a sum: for 5, −3, 1 and "sum at most 3" the whole array
    is valid (sum 3) although removing the 1 leaves a window with sum 2, and the shrinking window, which
    discards the 5 and its prefixes, finds length 2 instead of 3.'
  - 'The condition is "exactly K", not closed under shrinking: in 0 0 0 5 the longest window with sum
    exactly 3 does not exist, but the longest window with sum at most 3 has length 3.'
  in_action:
    statement: Given n values and K, find the length of the longest subarray with sum at most K (all values
      non-negative).
    constraints: n ≤ 2·10^5, 0 ≤ a_i ≤ 10^9, K up to 2·10^14.
    budget: Summing every subarray is n²/2 = 2·10^10 steps, 200 times the budget. Two pointers that move
      forward only are at most 2n = 4·10^5 steps.
    candidates:
    - tool: Sum every subarray with two loops
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: A window whose left end moves right while the sum is too large (this topic)
      verdict: chosen
      because: Values are non-negative, so removing an element never raises the sum, and the best left
        end never moves left.
    property_check: Every sub-window of a window with sum at most K has sum at most K (non-negative values),
      and the empty window has sum 0 ≤ K, so validity is closed under shrinking (Theorem 1.3.1). The sum
      is updated in O(1) when an element enters or leaves.
    decision: Add a[r]; while the sum exceeds K remove a[l] and advance l; record r − l + 1.
  examples:
    positive:
    - inline:
        input: The longest window with sum at most 5 in 3 1 2 1 4 1
        answer: '3'
        why: The window [1, 3] with values 1, 2, 1 has sum 4, and no window of length 4 has sum at most
          5; the shrinking window finds it in one pass.
    - worked_example: cses-1141
      why: A window with all songs distinct stays valid when an element is removed, so a shrinking window
        finds the longest one.
    negative:
    - inline:
        input: The longest window with sum at most 3 in 5 −3 1, with a negative value
        answer: '3'
        method_gives: '2'
        why: The whole array has sum 3, but the window must drop the 5 first, and a left end that has
          moved right never moves back. A negative value means a larger window can be valid when a smaller
          one is not.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The longest window with sum exactly 3 in 0 0 0 5, answered by the window with sum at most
          3
        answer: '0'
        method_gives: '3'
        why: 'Exactly 3 is not closed under shrinking: the window 0 0 0 has sum 0, not 3. No window has
          sum 3, so the answer is 0, while the "at most 3" window has length 3.'
      correct_tool:
        topic: '1.2'
        card: prefix-count-lookup
  lookalikes:
  - description: Longest subarray with sum at most K when values may be negative
    tool:
      topic: '1.2'
      card: prefix-extremes
    flipping_difference: A negative value means a sub-window can have a larger sum, so validity is not
      closed under shrinking and a moving window loses candidates; prefix sums do not need that closure.
  complexity: O(n) checks, each O(1) with a running sum.
- id: count-windows
  name: Count valid windows
  decisive_property: Validity (or its opposite, for 'at least' counts) is closed under shrinking and the
    empty window is valid, so for each right end r the valid left ends form one range L(r)..r and contribute
    r − L(r) + 1.
  from_theorem: 1.3.2
  how_to_test: 'Fix a right end r and check that the valid left ends have no gap: if [l, r] is valid,
    so is [l + 1, r]. If the question asks for ''at least'', test the opposite condition and subtract
    from n(n+1)/2.'
  constraint_shapes:
  - 'n up to 2·10^5: the count can reach n(n + 1)/2 ≈ 2·10^10, which needs long long, while counting window
    by window is 2·10^10 steps and the two-pointer count is 4·10^5.'
  weak_signals:
  - form: Asks to count the subarrays or substrings that satisfy a condition
    shape: n up to 2·10^5 and an answer up to about n²/2
  - form: Conditions such as "product less than k", "at most k distinct values" or "contains every letter"
    shape: A condition on the window that stays true when an element is removed (or false when added)
  kill_signals:
  - 'The condition is "sum at most 1" with a negative value: for 2, −1, 1 there are 4 such windows, but
    the shrinking count finds 3, because the window [2, −1] is lost when the 2 is removed.'
  - '"At least" is counted with the "at most" loop: for 3 1 2 1 4 1 there are 11 windows with sum at least
    5 and 12 with sum at most 5, and the loop answers 12.'
  in_action:
    statement: Count the subarrays of a (positive values) whose sum is at least K.
    constraints: n ≤ 2·10^5, 1 ≤ a_i ≤ 10^9, K up to 10^14.
    budget: 'Checking every subarray is n²/2 = 2·10^10 steps. Two pointers: 4·10^5.'
    candidates:
    - tool: Test every subarray
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: Count the subarrays with sum below K with a shrinking window and subtract from n(n + 1)/2
        (this topic)
      verdict: chosen
      because: '"Sum at least K" is not closed under shrinking, but its opposite, "sum below K", is, and
        the empty window qualifies.'
    property_check: The opposite condition "sum < K" is closed under shrinking for positive values and
      holds for the empty window. For each right end r the valid left ends are L(r)..r, contributing r
      − L(r) + 1 (Theorem 1.3.2), so the windows with sum below K are counted in O(n).
    decision: below = Σ (r − L(r) + 1) over the window with sum < K; answer n(n + 1)/2 − below, in long
      long.
  examples:
    positive:
    - inline:
        input: The windows with sum at most 5 in 3 1 2 1 4 1
        answer: '12'
        why: The values of r − L(r) + 1 are 1, 2, 2, 3, 2, 2, which add up to 12 of the 21 windows.
    - worked_example: ac-abc130_d
      why: Counting the subarrays with sum at least K is done through the opposite condition, "sum below
        K", which a shrinking window counts.
    negative:
    - inline:
        input: The windows of 2 −1 1 with sum at most 1, counted by r − L(r) + 1 with a shrinking window
        answer: '4'
        method_gives: '3'
        why: With the negative value, the sum can fall again after a shrink, so valid left ends for one
          r are not one block. The window [2, −1] (sum 1) is lost when the 2 is removed; counting every
          window directly finds all 4.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The windows of 3 1 2 1 4 1 with sum at least 5, counted with the "at most 5" loop
        answer: '11'
        method_gives: '12'
        why: The loop counts the windows with sum at most 5, which is a different set. Windows with sum
          at least 5 are the total 21 minus the windows with sum below 5.
      correct_tool:
        topic: '1.3'
        card: count-windows
  lookalikes:
  - description: Count subarrays with sum exactly K when values can be negative
    tool:
      topic: '1.2'
      card: prefix-count-lookup
    flipping_difference: Exact sums with negative values make the valid left ends for one r scattered,
      not one range; a map of earlier prefix sums finds them.
  complexity: O(n) checks.
- id: fixed-window
  name: Fixed-size window
  decisive_property: Every window considered has the same length k, and the window's summary supports
    removing one element exactly (undoing an add), so each slide costs one add and one remove.
  from_theorem: 1.3.3
  how_to_test: Check that the length is fixed by the statement, then name the summary (sum, count array,
    map, multiset) and how to remove the leaving element from it.
  constraint_shapes:
  - 'n = 2·10^5 and k = 10^5: recomputing each window costs k steps, (n − k + 1) · k ≈ 10^10 in all, while
    one add and one remove per slide is 2·10^5.'
  weak_signals:
  - form: Asks about every subarray or substring of length exactly k
    shape: n up to 2·10^5 and a fixed k
  - form: Asks for the best window of a given size, or whether some window of length k satisfies a condition
    shape: A sum, a count of distinct values or a maximum per window
  - form: Asks to take exactly k items from the two ends of a row
    shape: The items left form one window of length n − k
  kill_signals:
  - 'The window length is not fixed: the longest window of 3 1 2 1 4 1 with sum at most 5 has length 3,
    but the best window of length 2 only shows 2; a shrinkable window is needed.'
  - 'The summary cannot remove: a single variable holding the maximum so far gives 5, 5 for the window
    maxima of 5 1 2 4 with k = 3, where the answer is 5, 4; a multiset can remove one copy.'
  in_action:
    statement: Given n values and k, print the sum of every window of k consecutive values.
    constraints: n ≤ 2·10^5, k ≤ n, |a_i| ≤ 10^9.
    budget: Adding up each window is up to (n − k + 1) · k ≈ 10^10 steps. One add and one remove per slide
      is 2·10^5.
    candidates:
    - tool: Add up each window from scratch
      verdict: rejected
      because: Up to about 10^10 steps.
    - tool: Slide the window, adding the entering value and subtracting the leaving one (this topic)
      verdict: chosen
      because: The window length is fixed, and a sum can undo an add exactly.
    property_check: By induction on r, after iteration r the running sum holds exactly a_{max(0, r − k
      + 1)}..a_r (Theorem 1.3.3). Subtracting a[r − k] removes exactly the element that left, so the sum
      stays exact.
    decision: For each r add a[r], subtract a[r − k] when r ≥ k, output the sum when r ≥ k − 1, in long
      long.
  examples:
    positive:
    - inline:
        input: The sums of all windows of length 3 in 3 1 2 1 4 1
        answer: 6,4,7,6
        why: 'Sliding adds the entering value and removes the leaving one: 3 + 1 + 2 = 6, then − 3 + 1
          = 4, then − 1 + 4 = 7, then − 2 + 1 = 6.'
    - inline:
        input: The maxima of all windows of length 3 in 5 1 2 4
        answer: 5,4
        why: 'A multiset of the window supports removing one copy, so its largest element is the window
          maximum: 5 for [5, 1, 2] and 4 for [1, 2, 4].'
    negative:
    - inline:
        input: The window maxima of 5 1 2 4 with k = 3, kept in one variable "maximum so far"
        answer: 5,4
        method_gives: 5,5
        why: When the 5 leaves the window the variable still holds 5, and the second largest value was
          never stored. The summary must be able to remove an element, as a multiset can.
      correct_tool:
        topic: '1.3'
        card: fixed-window
    - inline:
        input: The longest window with sum at most 5 in 3 1 2 1 4 1, answered with windows of length exactly
          2
        answer: '3'
        method_gives: '2'
        why: The statement does not fix the length, so there is no fixed k to slide. The longest valid
          window is found by a window that grows and shrinks.
      correct_tool:
        topic: '1.3'
        card: shrinkable-window
  lookalikes:
  - description: Maximum of every window of length k in O(n) for n up to 10^7
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: The summary is a maximum, and the log factor of a multiset is too slow at n =
      10^7; at n = 2·10^5 a multiset is fine.
  complexity: O(n) for a sum or an array of counts, O(n log n) for a map or multiset.
- id: opposite-ends
  name: Opposite ends of a sorted array
  decisive_property: The array is (or may be) sorted, so with one pointer fixed the pair's value is monotone
    in the other, and at each step one end can be shown to belong to no remaining solution and discarded.
  from_theorem: 1.3.4
  how_to_test: Sort, look at the pair (smallest, largest), and say which of the two can be ruled out when
    the pair's value is too small and when it is too large.
  constraint_shapes:
  - 'n up to 2·10^5: trying every pair is 2·10^10 steps, while sorting is 3.6·10^6 steps and the two pointers
    meet after at most n − 1 = 2·10^5 moves.'
  weak_signals:
  - form: Asks for a pair or triple with a given sum, a sum at most T, or the best pair score
    shape: n up to 2·10^5, values up to 10^9, and the order of the input irrelevant
  - form: Asks for the widest container, or a score that depends on the two ends of a range
    shape: A pair (i, j) scored by j − i and the smaller of two heights
  kill_signals:
  - 'The original indices must be reported: for 3 2 4 and target 6 the answer is positions 1 and 2, but
    pointers on the sorted array 2 3 4 give the sorted positions 0 and 2.'
  - 'The pair must use two different positions: with pointers allowed to meet (l ≤ r) the array 3 5 and
    target 6 wrongly succeeds with 3 + 3 at l = r = 0.'
  in_action:
    statement: Is there a pair of different positions i < j with a_i + a_j = T?
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9, |T| ≤ 2·10^9.
    budget: Testing every pair is up to 2·10^10 steps. Sorting is 3.6·10^6 and the pointer walk 2·10^5.
    candidates:
    - tool: Test every pair of positions
      verdict: rejected
      because: About 2·10^10 pairs.
    - tool: Sort, then move two pointers inwards from the ends (this topic)
      verdict: chosen
      because: The order of the input does not matter, and a sum that is too small rules out the left
        end, while one that is too large rules out the right end.
    property_check: In the sorted array with l < r, if a_l + a_r < T then a_l + a_j ≤ a_l + a_r < T for
      every j in (l, r], so no solution uses l; if the sum exceeds T, none uses r (Theorem 1.3.4). Each
      step discards one end, so at most n − 1 steps.
    decision: Sort; l = 0, r = n − 1; while l < r compare a_l + a_r with T and move l right or r left.
  examples:
    positive:
    - inline:
        input: Is there a pair in 1 2 4 6 9 with sum 8?
        answer: 'yes'
        why: The pointers start at 1 + 9 = 10 > 8 (drop 9), then 1 + 6 = 7 < 8 (drop 1), then 2 + 6 =
          8, found.
    - worked_example: lc-container-with-most-water
      why: For two lines, the area is limited by the shorter side, so moving the pointer at the shorter
        side inwards discards it, and the pointers meet after at most n − 1 steps.
    negative:
    - inline:
        input: Two Sum on the unsorted 3 2 4 with target 6; report the original indices of the pair
        answer: 1-2
        method_gives: 0-2
        why: Sorting gives 2 3 4 and the pointers find the pair at sorted positions 0 and 2, which no
          longer name the original positions 1 and 2. A map from value to index keeps them.
      correct_tool:
        topic: '0.6'
        card: map-counting
    - inline:
        input: Is there a pair of different positions in 3 5 with sum 6, if the pointers are allowed to
          meet (l ≤ r)?
        answer: 'no'
        method_gives: 'yes'
        why: At l = r = 0 the sum is 3 + 3 = 6, which uses one position twice. The loop must stop when
          l = r, since the pair needs two positions.
      correct_tool:
        topic: '1.3'
        card: opposite-ends
  lookalikes:
  - description: Two Sum on an unsorted array where original indices must be returned
    tool:
      topic: '0.6'
      card: map-counting
    flipping_difference: Sorting loses the indices, so a map from value to index is the natural tool.
  complexity: O(n) after an O(n log n) sort.
- id: merge-walk
  name: Walk two sorted sequences
  decisive_property: Both sequences are sorted in the same direction (or the matching is in order, as
    for subsequences), so what each element of the first needs from the second starts at a prefix boundary
    that only moves forward; a passed element is never needed again.
  from_theorem: 1.3.5
  how_to_test: Sort both lists and check that if element a[i] needs b[j], then a[i + 1] never needs anything
    before b[j].
  constraint_shapes:
  - 'n and m up to 2·10^5: for each a_i a scan of all of b is n · m = 4·10^10 steps, while one forward
    pointer into b makes at most n + m = 4·10^5 moves in all.'
  weak_signals:
  - form: Asks to merge two lists, match elements, count pairs across them, or find the closest element
      of one list to each element of the other
    shape: Two lists with n and m up to 2·10^5, sorted or allowed to be sorted
  - form: Asks whether one string is a subsequence of another
    shape: Strings of length up to 2·10^5, and deleting characters keeps order
  kill_signals:
  - 'The queries are not sorted: for a = 9, 2 and b = 1 3 5 7 the counts of b below each a are 4, 1, but
    a pointer that only moves forward answers 4, 4 for the second.'
  - 'The comparison is wrong on equal values: for a = 5, 5 and b = 5 the counts of b strictly below each
    a are 0, 0, but a walk that advances on b[j] ≤ a[i] gives 1, 1.'
  in_action:
    statement: For every element of a (sorted), count the elements of b (sorted) that are smaller.
    constraints: n, m ≤ 2·10^5, values up to 10^9.
    budget: Scanning all of b for each element of a is n · m = 4·10^10 steps. A forward pointer is at
      most n + m = 4·10^5 moves.
    candidates:
    - tool: Scan all of b for each a_i
      verdict: rejected
      because: About 4·10^10 steps.
    - tool: One pointer j into b that only moves forward (this topic)
      verdict: chosen
      because: Both lists are sorted, so the elements of b below a_i are a prefix, and for a larger a_{i+1}
        that prefix only grows.
    property_check: The elements of b below a_i are b_0..b_{p(i)−1}, a prefix, and p is non-decreasing
      because a is sorted (Theorem 1.3.5). The pointer advances while b[j] < a[i], so it never moves back
      and makes at most m moves overall.
    decision: j = 0; for each i advance j while b[j] < a[i]; p[i] = j.
  examples:
    positive:
    - inline:
        input: For a = 2 5 5 9 and b = 1 3 5 7, the number of elements of b below each element of a
        answer: 1,2,2,4
        why: Below 2 is {1}; below 5 are {1, 3}, twice; below 9 are all four elements of b. The pointer
          moves 1, 2, 2, 4 and never back.
    - inline:
        input: Is "ace" a subsequence of "abcde"?
        answer: 'yes'
        why: Scanning the second string and matching the next letter whenever it appears matches a, c
          and e in order.
    negative:
    - inline:
        input: For the unsorted a = 9 2 and b = 1 3 5 7, the counts of b below each element of a, with
          one forward pointer
        answer: 4,1
        method_gives: 4,4
        why: After the 9 the pointer is at 4. The 2 needs the count 1, which is behind the pointer, and
          a pointer that only moves forward cannot return. The queries must be sorted, or an ordered lookup
          used.
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
    - inline:
        input: For a = 5 5 and b = 5, the number of elements of b strictly below each element of a, with
          the walk advancing on b[j] ≤ a[i]
        answer: 0,0
        method_gives: 1,1
        why: The walk advances on equal values, which are not below. The advance condition must be the
          strict b[j] < a[i].
      correct_tool:
        topic: '1.3'
        card: merge-walk
  lookalikes:
  - description: For each element of a, the closest element of b, when a arrives online one query at a
      time
    tool:
      topic: '0.6'
      card: ordered-set-lookup
    flipping_difference: Queries are not sorted, so the pointer in b cannot only move forward; a set with
      ordered lookups answers each in O(log m).
  complexity: O(n + m) after sorting.
problems:
- id: lc-longest-substring-without-repeating-characters
  role: ladder
  card: shrinkable-window
  rung: 1
  twist: Base case of the card
  summary: Longest substring of a string (length up to 5·10^4) with no repeated character.
  hints:
  - If a substring has no repeated character, does every shorter substring inside it also have none?
  - 'Yes: "all distinct" is closed under shrinking, so Theorem 1.3.1 applies. Keep a count of each character
    in the window.'
  - Extend r; while s[r] now occurs twice, remove s[l] and advance l; record r − l + 1.
- id: ac-abc326_c
  role: ladder
  card: shrinkable-window
  rung: 2
  twist: The window runs over sorted coordinates, and validity compares its two ends (A_r − A_l < M).
  summary: N gifts on a number line (N ≤ 3·10^5); the most gifts inside one half-open interval of length
    M.
  hints:
  - Does the input order of the gifts matter? What changes after sorting the coordinates?
  - After sorting, a run of gifts fits in one interval of length M exactly when the last minus the first
    is less than M, and that is closed under shrinking.
  - Sort; for each r advance l while A[r] − A[l] ≥ M; the answer is the largest r − l + 1.
- id: ac-abc229_d
  role: ladder
  card: shrinkable-window
  rung: 3
  twist: 'Validity is a budget: at most K dots inside the window.'
  summary: A string of X and . (length ≤ 2·10^5); change at most K dots into X to make the longest run
    of X.
  hints:
  - The final run of X is some window of S. Which windows can be turned completely into X?
  - A window works when it contains at most K dots, and removing characters never adds dots.
  - Slide the window counting dots; while the count exceeds K, advance l; maximise r − l + 1.
- id: ac-abc124_d
  role: ladder
  card: shrinkable-window
  rung: 4
  twist: The budget counts maximal blocks of 0s inside the window, not single characters.
  summary: A 0/1 string (N ≤ 10^5); with at most K flips of whole segments, the longest run of 1s.
  hints:
  - One flip can turn one maximal block of 0s into 1s. How many flips does a given window need?
  - 'A window can be made all 1s with as many flips as it has blocks of 0s, and a shorter window never
    has more blocks: the condition "at most K blocks" is closed under shrinking.'
  - Compress S into runs (value, length). Slide a window over the runs that holds at most K runs of 0s,
    and add up the run lengths inside it.
- id: cses-3420
  role: ladder
  card: count-windows
  rung: 1
  twist: Base case of the card
  summary: Count the subarrays (n ≤ 2·10^5) whose elements are all different.
  hints:
  - If a subarray has all elements different, do all its sub-subarrays too?
  - Yes, so for each right end the valid left ends form one range L(r)..r (Theorem 1.3.2).
  - Keep a map of counts; for each r shrink until a[r] occurs once; add r − l + 1 to a long long total.
- id: lc-subarray-product-less-than-k
  role: ladder
  card: count-windows
  rung: 2
  twist: Product instead of sum, and k ≤ 1 makes every non-empty window invalid.
  summary: Count contiguous subarrays (n ≤ 3·10^4, values 1–1000) whose product is strictly less than
    k (0 ≤ k ≤ 10^6).
  hints:
  - All values are at least 1. What happens to the product when an element leaves the window?
  - '"Product < k" is closed under shrinking. The empty window has product 1, so when k ≤ 1 no non-empty
    window is valid: handle it first.'
  - Multiply in nums[r]; while the product is at least k, divide out nums[l] and advance l; add r − l
    + 1.
- id: ac-abc260_e
  role: ladder
  card: count-windows
  rung: 3
  twist: 'Answers are needed for every length: each left end adds 1 to a range of lengths, done with a
    difference array (1.2).'
  summary: N pairs of numbers in 1..M (N, M ≤ 2·10^5); for every k, count the intervals of length k of
    1..M that contain at least one number of every pair.
  hints:
  - Is "contains one number of every pair" closed under shrinking or under extension?
  - Under extension. For each left end l, the smallest good right end R(l) never moves left as l grows,
    and every right end from R(l) to M is good.
  - 'Keep, per pair, how many of its two numbers are inside, and the number of satisfied pairs. For each
    l, lengths R(l) − l + 1 to M − l + 1 are good: add 1 to that range with a difference array.'
- id: ac-abc146_e
  role: ladder
  card: count-windows
  rung: 4
  twist: 'The window is over candidate left ends: only the last K − 1 prefix positions can pair with r.'
  summary: Count subarrays (N ≤ 2·10^5) whose sum, taken modulo K, equals their length.
  hints:
  - Write the condition with prefix sums P. Since a remainder is less than K, what does it say about the
    length?
  - The length r − l is less than K, and the condition becomes (P[r] − r) mod K = (P[l] − l) mod K.
  - Scan r; keep a map counting the keys (P[l] − l) mod K for the last K − 1 positions l only, erasing
    the key of the position that falls out.
- id: lc-maximum-average-subarray-i
  role: ladder
  card: fixed-window
  rung: 1
  twist: Base case of the card
  summary: Largest average of a block of exactly k consecutive numbers (n ≤ 10^5).
  hints:
  - Two neighbouring blocks of length k share k − 1 elements. What changes between them?
  - A sum supports removing one element exactly, so Theorem 1.3.3 applies.
  - Sum the first k; then add nums[r] and subtract nums[r − k]; keep the largest sum and divide by k once
    at the end.
- id: lc-maximum-number-of-vowels-in-a-substring-of-given-length
  role: ladder
  card: fixed-window
  rung: 2
  twist: The summary counts characters with a property instead of adding values.
  summary: Most vowels in any substring of length exactly k (string length ≤ 10^5).
  hints:
  - What does the window need to remember about its characters?
  - Only how many vowels it holds; one character enters and one leaves per slide.
  - Count vowels in the first k; add 1 if s[r] is a vowel, subtract 1 if s[r − k] is; keep the maximum.
- id: ac-abc210_c
  role: ladder
  card: fixed-window
  rung: 3
  twist: The summary is the number of distinct values, kept with a map of counts.
  summary: Most distinct colours among K consecutive candies (N ≤ 3·10^5, colours up to 10^9).
  hints:
  - Recounting the colours of every block costs O(NK). What is the smallest change per slide?
  - One colour count goes up and one goes down; the distinct count changes only when a count moves between
    0 and 1.
  - 'Map of counts: when a count becomes 1, distinct++; when it becomes 0, distinct−− (or erase the key
    and use the map size).'
- id: ac-abc352_d
  role: ladder
  card: fixed-window
  rung: 4
  twist: The window slides over values, not positions, and its summary is a multiset of positions.
  summary: In a permutation (N ≤ 2·10^5), choose K consecutive values whose positions are as close together
    as possible; print the smallest last-minus-first position.
  hints:
  - Fix the values a, a + 1, …, a + K − 1. What does choosing exactly these cost?
  - With pos[v] the index of value v, the cost is the largest minus the smallest pos over a window of
    K consecutive values.
  - 'Slide over v keeping a multiset of pos values: insert pos[v], erase one copy of pos[v − K]; minimise
    last element minus first element.'
- id: ac-abc337_d
  role: ladder
  card: fixed-window
  rung: 5
  twist: 'Many lines: run the fixed window along every row and every column.'
  summary: Grid of o, x and . (H·W ≤ 2·10^5); fewest . cells to turn into o so that K consecutive cells
    in a row or a column are all o, or −1.
  hints:
  - For one row and one block of K cells, when is the block possible and what does it cost?
  - Possible when it holds no x; the cost is its number of dots. Both counts slide in O(1).
  - For each row and each column, slide a window of length K counting x and dots; take the minimum dot
    count over windows with no x.
- id: lc-two-sum-ii-input-array-is-sorted
  role: ladder
  card: opposite-ends
  rung: 1
  twist: Base case of the card
  summary: In a sorted array (n ≤ 3·10^4), the positions of the two numbers adding up to a target, using
    O(1) extra memory.
  hints:
  - Compare the smallest plus the largest with the target. Which one can be ruled out?
  - If the sum is too small, the smallest cannot pair with anything left (Theorem 1.3.4); if too large,
    the largest cannot.
  - l = 0, r = n − 1; move l up or r down until the sum matches; positions are 1-based in the answer.
- id: cses-1090
  role: ladder
  card: opposite-ends
  rung: 2
  twist: 'Count groups instead of finding one pair: settle the heaviest remaining child at each step.'
  summary: Fewest gondolas for n children (n ≤ 2·10^5) when a gondola holds one or two children with total
    weight at most x.
  hints:
  - Sort the weights. Who should the heaviest child share with, if anyone?
  - 'If the heaviest cannot share with the lightest, they share with no one. If they can, sharing with
    the lightest is never worse: in any best plan, swap the lightest with the heaviest child''s partner
    and every gondola stays within x.'
  - 'Opposite ends: if p[l] + p[r] ≤ x, move both; otherwise move only r; count one gondola per step.'
- id: cses-1641
  role: ladder
  card: opposite-ends
  rung: 3
  twist: 'Three values: fix one, then solve a pair problem on the rest.'
  summary: Positions of three values (n ≤ 5000) at different positions with sum x, or IMPOSSIBLE.
  hints:
  - n ≤ 5000 allows about n² steps but not n³.
  - Sort the values together with their original positions; after fixing the first value, the other two
    must add up to x minus it.
  - For each i, run the opposite-ends search on the part after i; print the original positions.
- id: lc-merge-sorted-array
  role: ladder
  card: merge-walk
  rung: 1
  twist: Base case of the card
  summary: Merge two sorted arrays (total length ≤ 200) into the first, which has free space at its end.
  hints:
  - Filling the first array from the front overwrites values not read yet. Where is the free space?
  - 'At the end: walk both arrays from their largest elements, placing the larger one in the last free
    cell.'
  - 'Three indices: the end of the first array''s data, the end of the second array, and the cell to fill;
    stop when the second array is used up.'
- id: lc-is-subsequence
  role: ladder
  card: merge-walk
  rung: 2
  twist: The sequences are not sorted; the walk follows positions instead (Theorem 1.3.6).
  summary: Is string s a subsequence of string t (|t| ≤ 10^4)?
  hints:
  - Where should the first character of s be matched in t?
  - 'At its earliest occurrence: matching early never hurts later characters (Theorem 1.3.6).'
  - One index into s; scan t and advance the index on each match; answer whether the index reached |s|.
- id: ac-abc212_c
  role: ladder
  card: merge-walk
  rung: 3
  twist: 'Closest pair across two lists: check the neighbours on both sides of the pointer.'
  summary: Smallest |A_i − B_j| over two lists of up to 2·10^5 numbers each.
  hints:
  - For one A_i, which B values can be closest to it?
  - Only the largest B below A_i and the smallest B at least A_i. After sorting both lists, that boundary
    moves only forward as A_i grows.
  - Sort both; for each A_i advance j while B[j] < A_i; check B[j] and B[j − 1].
- id: cses-1084
  role: ladder
  card: merge-walk
  rung: 4
  twist: 'Matching with a tolerance: each step discards an element that can never be used.'
  summary: Most applicants (n, m ≤ 2·10^5) who get an apartment, when an applicant wanting size x accepts
    sizes x − k to x + k, one apartment each.
  hints:
  - Sort both lists. If the smallest apartment is too small for the smallest applicant, can anyone use
    it?
  - 'No. Likewise, if it is too big for the smallest applicant, no apartment fits that applicant. Otherwise
    match the two: in any best matching, swapping partners so that these two are matched never loses a
    match.'
  - 'Two pointers over the sorted lists: discard the apartment if too small, the applicant if the apartment
    is too big, otherwise count a match and move both.'
