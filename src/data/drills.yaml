# Implementation drills (CURRICULUM_GAPS_PLAN.md Section 6, item 1). Short coding exercises for the bugs that cost
# contest time without being hard: reading, resetting, rounding, overflow, comparators and boundaries.
# They are not topics: curriculum.yaml has no rows for them. Each drill sits in the earliest topic it needs
# (`topic`), is shown under that lesson's "Check yourself" and on the Drills page, and has a tested unit
# code/{unit}/ (solution.cpp, brute.cpp, gen.cpp, tests/). Write the drill yourself first, with a timer, then open the reference.
- id: read-eof
  title: Read until the input ends
  topic: '0.1'
  minutes: 3
  unit: 0.1/drill-read-eof
  task: >-
    The input is a list of integers separated by spaces and line breaks, and nothing says how many. Print the count,
    the sum and the largest value on one line. There are up to $2 \cdot 10^5$ numbers, each with absolute value at most $10^9$.
  check:
    - 'Use a loop that stops when reading fails, not a count you invented.'
    - 'The sum of $2 \cdot 10^5$ values of $10^9$ needs `long long`.'
    - 'Start the maximum at the smallest `long long`, not at 0 (all numbers can be negative).'
  bug: A loop `while (!cin.eof())` runs once more after the last number and uses a stale value.
- id: multi-reset
  title: Many test cases, nothing left over
  topic: '0.1'
  minutes: 4
  unit: 0.1/drill-multi-reset
  task: >-
    There are $t$ test cases. Each gives $n$ and then $n$ integers $a_i$ with $1 \le a_i \le n$. For each test, print how many
    different values occur. The sum of all $n$ is at most $2 \cdot 10^5$, but $t$ can be large.
  check:
    - 'Create the "seen" array inside the test loop, sized by this test''s $n$.'
    - 'Do not size it by the largest possible $n$ and clear it every time: that costs $t$ times the maximum.'
    - 'Run it on two equal tests in a row; a leftover value shows up as a wrong second answer.'
  bug: An array made once and never cleared keeps the values of the previous test.
- id: floor-div
  title: Floor division with negative numbers
  topic: '0.1'
  minutes: 3
  unit: 0.1/drill-floor-div
  task: >-
    For each query $a, b$ with $|a| \le 10^{18}$ and $b \ge 1$, print the quotient $q = \lfloor a/b \rfloor$ and the remainder
    $r$ with $0 \le r < b$, so that $a = bq + r$.
  check:
    - 'C++ rounds `a / b` toward zero, so for $a = -7$, $b = 2$ it gives $-3$, not $-4$.'
    - 'After `r = a % b`, a negative `r` means "add $b$ to it and subtract 1 from the quotient".'
    - 'Try $a = -1$ with $b = 10^{18}$ and $a = -6$, $b = 3$ (remainder 0, no correction).'
  bug: Using `%` as if it never returned a negative number breaks indexing, hashing and every "mod $m$" formula.
- id: sort-keys
  title: Sort by several keys
  topic: '1.1'
  minutes: 4
  unit: 1.1/drill-sort-keys
  task: >-
    Each contestant has an id, a score and a penalty. Print the ids in rank order: higher score first, then smaller
    penalty, then smaller id. There are up to $2 \cdot 10^5$ contestants.
  check:
    - 'Put the keys in a tuple in priority order, and negate the one that must go descending.'
    - 'Sort a `vector<array<long long, 3>>` with the default comparison; no hand-written comparator is needed.'
    - 'If you do write a comparator, it must return false for equal elements (never `<=`).'
  bug: A comparator with `<=` can crash the sort or loop forever, and a key in the wrong order gives a wrong ranking quietly.
- id: prefix-queries
  title: Prefix sums in five minutes
  topic: '1.2'
  minutes: 4
  unit: 1.2/drill-prefix-queries
  task: >-
    Given an array and $q$ questions "what is the sum of positions $l$ to $r$ (both included, counting from 1)?", answer every
    question. Both $n$ and $q$ are up to $2 \cdot 10^5$, and the values can be negative.
  check:
    - 'Keep `pre` with one extra slot, `pre[0] = 0`, and read the array from index 1.'
    - 'The answer is `pre[r] - pre[l - 1]`; with $l = 1$ it must still work.'
    - '`long long` for `pre`: the sums reach $2 \cdot 10^{14}$.'
  bug: An off-by-one in the first index (`pre[l]` instead of `pre[l - 1]`) drops the element at $l$.
- id: window-longest
  title: The shrinking window, from memory
  topic: '1.3'
  minutes: 5
  unit: 1.3/drill-window-longest
  task: >-
    All numbers are positive. Print the length of the longest block of consecutive elements with sum at most $K$
    (0 if every single element is above $K$). $n \le 2 \cdot 10^5$, $K \le 10^{15}$.
  check:
    - 'The right end walks forward once; the left end only moves forward, inside a `while` (not an `if`).'
    - 'Update the answer after the shrinking loop, when the block is valid.'
    - 'If one element is above $K$ the window becomes empty: the length is 0, and the left end stays behind the right end.'
  bug: Shrinking with `if` instead of `while` leaves a too heavy window after a big element and overcounts.
- id: safe-midpoint
  title: A midpoint that cannot overflow
  topic: '1.4'
  minutes: 4
  unit: 1.4/drill-safe-midpoint
  task: >-
    Find the smallest integer $x$ with $\lfloor x/3 \rfloor \ge k$ by binary search over $[0, 9 \cdot 10^{18}]$, for
    $0 \le k \le 3 \cdot 10^{18}$. The answer is $3k$, but the point is the search itself.
  check:
    - '`(lo + hi) / 2` overflows when both ends are above $4.6 \cdot 10^{18}$; write `lo + (hi - lo) / 2`.'
    - 'Use the half-open pattern `while (lo < hi)` with `hi = mid` and `lo = mid + 1`, so the loop always ends.'
    - 'Test $k = 3 \cdot 10^{18}$: the answer $9 \cdot 10^{18}$ is the right end of the range.'
  bug: The sum `lo + hi` wraps to a negative number, `mid` is negative, and the search runs off the range.
- id: closed-events
  title: Closed or half-open intervals
  topic: '1.5'
  minutes: 5
  unit: 1.5/drill-closed-events
  task: >-
    Each guest is in the hall on the whole days $l_i$ to $r_i$, both included. Print the largest number of guests on one day.
    A guest who leaves on day 5 and one who arrives on day 5 are both there on day 5. $n \le 2 \cdot 10^5$, days up to $10^9$.
  check:
    - 'Turn the closed days $[l, r]$ into the half-open $[l, r + 1)$: arrive at $l$, leave at $r + 1$.'
    - 'Sort the events as pairs (time, change). At equal times the leaving (−1) comes first, which is right for half-open ends.'
    - 'Check by hand: guests (1, 5) and (5, 8) give 2, and guests (1, 1) and (2, 2) give 1.'
  bug: Leaving at $r$ instead of $r + 1$ undercounts the day $r$; mixing the two conventions double counts or misses a day.
- id: next-greater
  title: Next greater element
  topic: '1.6'
  minutes: 4
  unit: 1.6/drill-next-greater
  task: >-
    For every position, print the first value to its right that is strictly greater, or $-1$. $n \le 2 \cdot 10^5$.
  check:
    - 'Scan from the right and keep a stack of candidates; pop everything that is not strictly greater than the current value.'
    - 'Equal values must be popped too (strictly greater): try the array 3 3 3.'
    - 'Read the answer from the top of the stack before pushing the current value.'
  bug: Popping with `<` instead of `<=` keeps equal values and reports a number that is not greater.
- id: grid-bfs
  title: Grid BFS skeleton
  topic: '4.1'
  minutes: 5
  unit: 4.1/drill-grid-bfs
  task: >-
    A grid has free cells `.`, walls `#`, one start `S` and one goal `G`. A step goes to a free side neighbour. Print the fewest
    steps from `S` to `G`, or $-1$. The grid is up to $1000 \times 1000$.
  check:
    - 'Use a distance array filled with $-1$: it is also the visited mark, so each cell enters the queue once.'
    - 'Write the four directions as two small arrays and loop over them; check the bounds before reading the cell.'
    - 'Print the distance of `G` (it stays $-1$ when `G` cannot be reached). Try a wall between `S` and `G`.'
  bug: Marking a cell visited when it leaves the queue, not when it enters, makes the queue grow without bound.
