- id: cf-1980G
  role: drill
  summary: A tree with edge weights, queries that XOR all edge weights by a number, and queries "add a
    new edge from a vertex v to another vertex and find the largest XOR of the cycle that closes"; up
    to 2·10^5 vertices and queries. †
- id: cf-1654E
  role: exam
  card: threshold-split
  summary: An array of n ≤ 10^5 numbers up to 10^5; the fewest numbers to change so that the array becomes
    an arithmetic progression with an integer step. †
- id: cf-1904D2
  role: exam
  card: idempotent-range-query
  summary: Several tests (Σ n ≤ 2·10^5); arrays a and b; an operation sets a_i to the maximum of a over
    a stretch that contains i; can a become b? †
- id: lc-minimum-possible-integer-after-at-most-k-adjacent-swaps-on-digits
  role: exam
  card: updates-and-range-sums
  summary: A number as a string of up to 3·10^4 digits and a number k ≤ 10^9; the smallest number reachable
    by at most k swaps of neighbouring digits.
- id: lc-reverse-pairs
  role: exam
  card: inversion-count
  summary: An array of up to 5·10^4 numbers; the number of pairs i < j with nums[i] > 2 · nums[j].
- id: lc-maximum-sum-of-subsequence-with-non-adjacent-elements
  role: exam
  card: custom-node
  summary: An array of up to 5·10^4 numbers and as many changes "set nums[i] to x"; after each change
    take the largest sum of a subsequence with no two neighbours, and print the total of these answers
    modulo 10^9 + 7.
- id: cf-1263E
  role: exam
  card: lazy-range-update
