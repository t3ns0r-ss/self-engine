# Topic 1.6 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.6"
draft: true
cards:
  - id: nearest-greater
    name: Nearest greater or smaller element
    decisive_property: "Each position needs the nearest element to one side that is greater (or smaller), and an element beaten by a later, larger one can never be that answer for anything further right; so a monotonic stack finds all answers in O(n), each element pushed and popped once."
    from_theorem: Theorem 1.6.1
    how_to_test: Ask, for an element that has just been passed by a larger one, whether it can still matter for any later position. If not, it can be popped.
    weak_signals:
      - '"The next warmer day", "the next greater element", "how far can it see"'
      - Each element needs the first element on one side that beats it
      - Removing elements so that what is left is as small as possible in dictionary order
    kill_signals:
      - The question is about a range given as a query, not the nearest element (later topics)
      - The array changes between questions
    lookalikes:
      - description: For each element, the number of greater elements to its right (not only the nearest)
        needs: a later topic (5.2)
        flipping_difference: Counting all greater elements needs every one of them, including those a monotonic stack has popped.
    complexity: O(n) amortised.
  - id: element-span
    name: Span of an element
    decisive_property: "The quantity is a sum or maximum over all subarrays of their minimum (or maximum), or a rectangle limited by its lowest bar; each element decides exactly the subarrays inside its span between the previous smaller and the next smaller element (ties broken on one side), so its contribution is computed from two stack scans."
    from_theorem: Theorem 1.6.2
    how_to_test: Fix the element that decides the subarray (its minimum or lowest bar) and check that the subarrays it decides are all l in one range and r in another.
    weak_signals:
      - '"Sum of the minimum (or maximum) over all subarrays"'
      - Largest rectangle under bars, or of ones in a grid row by row
      - An answer of the form "minimum times length" or "minimum times sum"
    kill_signals:
      - The quantity is a sum of all elements of each subarray (that is prefix sums, topic 1.2)
    lookalikes:
      - description: The best mountain arrangement when n ≤ 1000
        needs: "nested-loops (0.5): try every peak"
        flipping_difference: Small n allows an O(n) scan per peak, so the stack is not needed.
    complexity: O(n) for all spans.
  - id: window-deque
    name: Sliding window extremes
    decisive_property: "A window moves only to the right and its maximum (or minimum) is needed at every step; an element dominated by a later, larger element in the window is never needed again, so a monotonic deque keeps the maximum at its front in O(1) amortised per step, also inside shrinkable windows."
    from_theorem: Theorem 1.6.3
    how_to_test: Check that both window ends only move right and that only the window's maximum or minimum is needed (not a median or a count).
    weak_signals:
      - '"The maximum of every window of length k"'
      - '"The longest subarray with max − min ≤ limit"'
      - The best previous prefix sum within the last k positions
    kill_signals:
      - The window needs its median or another middle element (a multiset, topic 0.6)
      - The left end can move back
    lookalikes:
      - description: The median of every window of length k
        needs: "ordered-set-lookup (0.6): two multisets"
        flipping_difference: A median is not an extreme, so dominated elements can still become the answer.
    complexity: O(n) amortised.
