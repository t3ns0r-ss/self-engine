# PostgreSQL for labs. Image pinned in .env.labserver (version and digest checked at D0).
# The host port defaults to 5432; set LAB_POSTGRES_PORT in .env.labserver when 5432 is taken on the server.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env.labserver}
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?set LAB_DB_PASSWORD in .env.labserver}
      POSTGRES_DB: lab
    ports: ["${LAB_BIND:-127.0.0.1}:${LAB_POSTGRES_PORT:-5432}:5432"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 30
