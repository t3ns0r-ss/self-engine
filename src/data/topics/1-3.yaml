# Topic 1.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.3"
cards:
  - id: shrinkable-window
    name: Shrinkable window
    decisive_property: Validity is closed under shrinking (every sub-window of a valid window is valid), the empty window is valid, and validity can be rechecked after adding or removing one element. For 'shortest window with property P', the same holds for the opposite of P.
    from_theorem: Theorem 1.3.1
    how_to_test: Take any valid window, delete its first or last element, and argue it stays valid for every possible input. Then try a small counterexample with the problem's extreme values (zeros, negatives, repeated values).
    weak_signals:
      - Longest or shortest contiguous subarray or substring satisfying a condition
      - Condition of the form 'at most k of something', 'sum at most K' with non-negative values, or 'all distinct'
      - n up to 2·10^5, so O(n²) is too slow
      - Fewest items removed from the two ends of a row (what remains is one middle window, so find the longest valid middle window)
    kill_signals:
      - Values can be negative and the condition is about a sum (removing an element can raise the sum)
      - "The condition is 'exactly k' (not closed under shrinking: rewrite as at-most-k minus at-most-(k−1), or use prefix sums)"
      - The question is about subsequences, not contiguous segments
    lookalikes:
      - description: Longest subarray with sum at most K when values may be negative
        needs: 1.2 prefix sums with sorted prefix values (and 1.4)
        flipping_difference: A negative value means a sub-window can have a larger sum, so validity is not closed under shrinking.
    complexity: "O(n) window updates: each pointer moves right at most n times. O(n log n) when the window keeps a map of counts."
  - id: count-windows
    name: Count valid windows
    decisive_property: Validity (or its opposite, for 'at least' counts) is closed under shrinking and the empty window is valid, so for each right end r the valid left ends form one range L(r)..r and contribute r − L(r) + 1.
    from_theorem: Theorem 1.3.2
    how_to_test: "Fix a right end r and check that the valid left ends have no gap: if [l, r] is valid, so is [l + 1, r]. If the question asks for 'at least', test the opposite condition and subtract from n(n+1)/2."
    weak_signals:
      - Count the subarrays or substrings satisfying a condition
      - Answer can be about n²/2, so it needs long long
      - Conditions like 'product less than k', 'at most k distinct', 'contains every letter at least once'
    kill_signals:
      - Condition is an exact sum or exact count with possibly negative values (use prefix sums with a hash map, 1.2)
      - Validity is not monotone in the left end for a fixed right end (valid left ends have gaps)
    lookalikes:
      - description: Count subarrays with sum exactly K when values can be negative
        needs: 1.2 prefix sums with a map of prefix counts
        flipping_difference: Exact sums with negative values make the valid left ends for one r scattered, not one range.
    complexity: O(n) window updates plus O(1) per r to add r − l + 1; the count needs long long.
  - id: fixed-window
    name: Fixed-size window
    decisive_property: Every window considered has the same length k, and the window's summary supports removing one element exactly (undoing an add), so each slide costs one add and one remove.
    from_theorem: Theorem 1.3.3
    how_to_test: Check that the length is fixed by the statement, then name the summary (sum, count array, map, multiset) and how to remove the leaving element from it.
    weak_signals:
      - Every subarray or substring of length exactly k
      - Best window of a given size, or 'some window of length k satisfies …'
      - "Also: windows of k consecutive values, after turning values into positions"
      - Take exactly k items from the two ends of a row (the items left form one window of length n − k)
    kill_signals:
      - Window length is not fixed (use a shrinkable window instead)
      - The summary cannot be undone (a single running maximum); a multiset or a later tool is needed
    lookalikes:
      - description: Maximum of every window of length k in O(n) for n up to 10^7
        needs: 1.6 (a later topic)
        flipping_difference: The summary is a maximum and the log factor of a multiset is too slow.
    complexity: "n adds and at most n removes: O(n) for sums and count arrays, O(n log n) for maps and multisets."
  - id: opposite-ends
    name: Opposite ends of a sorted array
    decisive_property: The array is (or may be) sorted, so with one pointer fixed the pair's value is monotone in the other, and at each step one end can be shown to belong to no remaining solution and discarded.
    from_theorem: Theorem 1.3.4
    how_to_test: Sort, look at the pair (smallest, largest), and say which of the two can be ruled out when the pair's value is too small and when it is too large.
    weak_signals:
      - Pairs (or triples) with a given sum, at most a given sum, or the best pair score
      - The order of the input does not matter, or the array is already sorted
      - O(1) extra memory requested
    kill_signals:
      - The original indices or order matter and sorting would destroy them (use a hash map, 0.6)
      - The pair must be adjacent or contiguous (a window card instead)
    lookalikes:
      - description: Two Sum on an unsorted array where original indices must be returned
        needs: 0.6 map from value to index
        flipping_difference: Sorting loses the indices, so a value-to-index map is the natural tool.
    complexity: "O(n log n) to sort, then O(n): each step moves one pointer inward."
  - id: merge-walk
    name: Walk two sorted sequences
    decisive_property: Both sequences are sorted in the same direction (or the matching is in order, as for subsequences), so what each element of the first needs from the second starts at a prefix boundary that only moves forward; a passed element is never needed again.
    from_theorem: Theorem 1.3.5
    how_to_test: Sort both lists and check that if element a[i] needs b[j], then a[i + 1] never needs anything before b[j].
    weak_signals:
      - "Two lists: merge them, match elements, count pairs across them, closest element of one to each element of the other"
      - Check whether one string is a subsequence of another
    kill_signals:
      - Matching depends on the original order of both lists in a way sorting breaks
      - Each query needs an element far back in the other list (pointer would move backwards)
    lookalikes:
      - description: For each element of a, the closest element of b, when a arrives online one query at a time
        needs: 0.6 set with ordered lookups
        flipping_difference: Queries are not sorted, so the pointer in b cannot only move forward.
    complexity: O(n + m) after sorting both sequences.
problems:
  - id: lc-longest-substring-without-repeating-characters
    role: ladder
    card: shrinkable-window
    rung: 1
    twist: Base case of the card
    summary: Longest substring of a string (length up to 5·10^4) with no repeated character.
    hints:
      - If a substring has no repeated character, does every shorter substring inside it also have none?
      - 'Yes: "all distinct" is closed under shrinking, so Theorem 1.3.1 applies. Keep a count of each character in the window.'
      - Extend r; while s[r] now occurs twice, remove s[l] and advance l; record r − l + 1.
  - id: ac-abc326_c
    role: ladder
    card: shrinkable-window
    rung: 2
    twist: The window runs over sorted coordinates, and validity compares its two ends (A_r − A_l < M).
    summary: N gifts on a number line (N ≤ 3·10^5); the most gifts inside one half-open interval of length M.
    hints:
      - Does the input order of the gifts matter? What changes after sorting the coordinates?
      - After sorting, a run of gifts fits in one interval of length M exactly when the last minus the first is less than M, and that is closed under shrinking.
      - Sort; for each r advance l while A[r] − A[l] ≥ M; the answer is the largest r − l + 1.
  - id: ac-abc229_d
    role: ladder
    card: shrinkable-window
    rung: 3
    twist: "Validity is a budget: at most K dots inside the window."
    summary: A string of X and . (length ≤ 2·10^5); change at most K dots into X to make the longest run of X.
    hints:
      - The final run of X is some window of S. Which windows can be turned completely into X?
      - A window works when it contains at most K dots, and removing characters never adds dots.
      - Slide the window counting dots; while the count exceeds K, advance l; maximise r − l + 1.
  - id: ac-abc124_d
    role: ladder
    card: shrinkable-window
    rung: 4
    twist: The budget counts maximal blocks of 0s inside the window, not single characters.
    summary: A 0/1 string (N ≤ 10^5); with at most K flips of whole segments, the longest run of 1s.
    hints:
      - One flip can turn one maximal block of 0s into 1s. How many flips does a given window need?
      - 'A window can be made all 1s with as many flips as it has blocks of 0s, and a shorter window never has more blocks: the condition "at most K blocks" is closed under shrinking.'
      - Compress S into runs (value, length). Slide a window over the runs that holds at most K runs of 0s, and add up the run lengths inside it.
  - id: cses-3420
    role: ladder
    card: count-windows
    rung: 1
    twist: Base case of the card
    summary: Count the subarrays (n ≤ 2·10^5) whose elements are all different.
    hints:
      - If a subarray has all elements different, do all its sub-subarrays too?
      - Yes, so for each right end the valid left ends form one range L(r)..r (Theorem 1.3.2).
      - Keep a map of counts; for each r shrink until a[r] occurs once; add r − l + 1 to a long long total.
  - id: lc-subarray-product-less-than-k
    role: ladder
    card: count-windows
    rung: 2
    twist: Product instead of sum, and k ≤ 1 makes every non-empty window invalid.
    summary: Count contiguous subarrays (n ≤ 3·10^4, values 1–1000) whose product is strictly less than k (0 ≤ k ≤ 10^6).
    hints:
      - All values are at least 1. What happens to the product when an element leaves the window?
      - '"Product < k" is closed under shrinking. The empty window has product 1, so when k ≤ 1 no non-empty window is valid: handle it first.'
      - Multiply in nums[r]; while the product is at least k, divide out nums[l] and advance l; add r − l + 1.
  - id: ac-abc260_e
    role: ladder
    card: count-windows
    rung: 3
    twist: "Answers are needed for every length: each left end adds 1 to a range of lengths, done with a difference array (1.2)."
    summary: N pairs of numbers in 1..M (N, M ≤ 2·10^5); for every k, count the intervals of length k of 1..M that contain at least one number of every pair.
    hints:
      - Is "contains one number of every pair" closed under shrinking or under extension?
      - Under extension. For each left end l, the smallest good right end R(l) never moves left as l grows, and every right end from R(l) to M is good.
      - "Keep, per pair, how many of its two numbers are inside, and the number of satisfied pairs. For each l, lengths R(l) − l + 1 to M − l + 1 are good: add 1 to that range with a difference array."
  - id: ac-abc146_e
    role: ladder
    card: count-windows
    rung: 4
    twist: "The window is over candidate left ends: only the last K − 1 prefix positions can pair with r."
    summary: Count subarrays (N ≤ 2·10^5) whose sum, taken modulo K, equals their length.
    hints:
      - Write the condition with prefix sums P. Since a remainder is less than K, what does it say about the length?
      - The length r − l is less than K, and the condition becomes (P[r] − r) mod K = (P[l] − l) mod K.
      - Scan r; keep a map counting the keys (P[l] − l) mod K for the last K − 1 positions l only, erasing the key of the position that falls out.
  - id: lc-maximum-average-subarray-i
    role: ladder
    card: fixed-window
    rung: 1
    twist: Base case of the card
    summary: Largest average of a block of exactly k consecutive numbers (n ≤ 10^5).
    hints:
      - Two neighbouring blocks of length k share k − 1 elements. What changes between them?
      - A sum supports removing one element exactly, so Theorem 1.3.3 applies.
      - Sum the first k; then add nums[r] and subtract nums[r − k]; keep the largest sum and divide by k once at the end.
  - id: lc-maximum-number-of-vowels-in-a-substring-of-given-length
    role: ladder
    card: fixed-window
    rung: 2
    twist: The summary counts characters with a property instead of adding values.
    summary: Most vowels in any substring of length exactly k (string length ≤ 10^5).
    hints:
      - What does the window need to remember about its characters?
      - Only how many vowels it holds; one character enters and one leaves per slide.
      - Count vowels in the first k; add 1 if s[r] is a vowel, subtract 1 if s[r − k] is; keep the maximum.
  - id: ac-abc210_c
    role: ladder
    card: fixed-window
    rung: 3
    twist: The summary is the number of distinct values, kept with a map of counts.
    summary: Most distinct colours among K consecutive candies (N ≤ 3·10^5, colours up to 10^9).
    hints:
      - Recounting the colours of every block costs O(NK). What is the smallest change per slide?
      - One colour count goes up and one goes down; the distinct count changes only when a count moves between 0 and 1.
      - "Map of counts: when a count becomes 1, distinct++; when it becomes 0, distinct−− (or erase the key and use the map size)."
  - id: ac-abc352_d
    role: ladder
    card: fixed-window
    rung: 4
    twist: The window slides over values, not positions, and its summary is a multiset of positions.
    summary: In a permutation (N ≤ 2·10^5), choose K consecutive values whose positions are as close together as possible; print the smallest last-minus-first position.
    hints:
      - Fix the values a, a + 1, …, a + K − 1. What does choosing exactly these cost?
      - With pos[v] the index of value v, the cost is the largest minus the smallest pos over a window of K consecutive values.
      - "Slide over v keeping a multiset of pos values: insert pos[v], erase one copy of pos[v − K]; minimise last element minus first element."
  - id: ac-abc337_d
    role: ladder
    card: fixed-window
    rung: 5
    twist: "Many lines: run the fixed window along every row and every column."
    summary: Grid of o, x and . (H·W ≤ 2·10^5); fewest . cells to turn into o so that K consecutive cells in a row or a column are all o, or −1.
    hints:
      - For one row and one block of K cells, when is the block possible and what does it cost?
      - Possible when it holds no x; the cost is its number of dots. Both counts slide in O(1).
      - For each row and each column, slide a window of length K counting x and dots; take the minimum dot count over windows with no x.
  - id: lc-two-sum-ii-input-array-is-sorted
    role: ladder
    card: opposite-ends
    rung: 1
    twist: Base case of the card
    summary: In a sorted array (n ≤ 3·10^4), the positions of the two numbers adding up to a target, using O(1) extra memory.
    hints:
      - Compare the smallest plus the largest with the target. Which one can be ruled out?
      - If the sum is too small, the smallest cannot pair with anything left (Theorem 1.3.4); if too large, the largest cannot.
      - l = 0, r = n − 1; move l up or r down until the sum matches; positions are 1-based in the answer.
  - id: cses-1090
    role: ladder
    card: opposite-ends
    rung: 2
    twist: "Count groups instead of finding one pair: settle the heaviest remaining child at each step."
    summary: Fewest gondolas for n children (n ≤ 2·10^5) when a gondola holds one or two children with total weight at most x.
    hints:
      - Sort the weights. Who should the heaviest child share with, if anyone?
      - "If the heaviest cannot share with the lightest, they share with no one. If they can, sharing with the lightest is never worse: in any best plan, swap the lightest with the heaviest child's partner and every gondola stays within x."
      - "Opposite ends: if p[l] + p[r] ≤ x, move both; otherwise move only r; count one gondola per step."
  - id: cses-1641
    role: ladder
    card: opposite-ends
    rung: 3
    twist: "Three values: fix one, then solve a pair problem on the rest."
    summary: Positions of three values (n ≤ 5000) at different positions with sum x, or IMPOSSIBLE.
    hints:
      - n ≤ 5000 allows about n² steps but not n³.
      - Sort the values together with their original positions; after fixing the first value, the other two must add up to x minus it.
      - For each i, run the opposite-ends search on the part after i; print the original positions.
  - id: lc-merge-sorted-array
    role: ladder
    card: merge-walk
    rung: 1
    twist: Base case of the card
    summary: Merge two sorted arrays (total length ≤ 200) into the first, which has free space at its end.
    hints:
      - Filling the first array from the front overwrites values not read yet. Where is the free space?
      - "At the end: walk both arrays from their largest elements, placing the larger one in the last free cell."
      - "Three indices: the end of the first array's data, the end of the second array, and the cell to fill; stop when the second array is used up."
  - id: lc-is-subsequence
    role: ladder
    card: merge-walk
    rung: 2
    twist: The sequences are not sorted; the walk follows positions instead (Theorem 1.3.6).
    summary: Is string s a subsequence of string t (|t| ≤ 10^4)?
    hints:
      - Where should the first character of s be matched in t?
      - "At its earliest occurrence: matching early never hurts later characters (Theorem 1.3.6)."
      - One index into s; scan t and advance the index on each match; answer whether the index reached |s|.
  - id: ac-abc212_c
    role: ladder
    card: merge-walk
    rung: 3
    twist: "Closest pair across two lists: check the neighbours on both sides of the pointer."
    summary: Smallest |A_i − B_j| over two lists of up to 2·10^5 numbers each.
    hints:
      - For one A_i, which B values can be closest to it?
      - Only the largest B below A_i and the smallest B at least A_i. After sorting both lists, that boundary moves only forward as A_i grows.
      - Sort both; for each A_i advance j while B[j] < A_i; check B[j] and B[j − 1].
  - id: cses-1084
    role: ladder
    card: merge-walk
    rung: 4
    twist: "Matching with a tolerance: each step discards an element that can never be used."
    summary: Most applicants (n, m ≤ 2·10^5) who get an apartment, when an applicant wanting size x accepts sizes x − k to x + k, one apartment each.
    hints:
      - Sort both lists. If the smallest apartment is too small for the smallest applicant, can anyone use it?
      - "No. Likewise, if it is too big for the smallest applicant, no apartment fits that applicant. Otherwise match the two: in any best matching, swapping partners so that these two are matched never loses a match."
      - "Two pointers over the sorted lists: discard the apartment if too small, the applicant if the apartment is too big, otherwise count a match and move both."
