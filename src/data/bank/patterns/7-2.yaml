# Patterns for topic 7.2 (DP on DAGs). Provisional until the lesson maps them to Recognition Cards.
topic: "7.2"
patterns:
  - id: longest-path
    name: Longest path in an acyclic graph
    description: Longest path or best-scoring path by processing vertices in dependency order.
    precondition: The graph has no directed cycle, so every vertex's best value depends only on earlier vertices in the order.
  - id: count-paths
    name: Counting paths
    description: Number of paths between two vertices of an acyclic graph, modulo a prime.
    precondition: No directed cycles, so the number of paths is finite and accumulates in dependency order.
  - id: condensation-dp
    name: Dynamic programming on components
    description: Collapse strongly connected components first, then run the acyclic dynamic programming on the component graph.
    precondition: Inside a component every vertex can reach every other, so a component acts as one vertex with combined value.
  - id: state-dag
    name: Implicit acyclic state graphs
    description: States with moves that always decrease some measure, processed in that order.
    precondition: Some quantity strictly decreases along every move, so the state graph has no cycle.
