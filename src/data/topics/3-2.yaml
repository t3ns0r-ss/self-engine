# Topic 3.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.2"
draft: true
cards:
  - id: linear-state
    name: One index per state
    decisive_property: "Solutions are built left to right, and the allowed next choices and their costs depend only on the current position, not on how it was reached; so the best value (or the number of ways) at position i is computed from a few earlier positions, each once."
    from_theorem: Theorem 3.2.1
    how_to_test: "Take two different ways of reaching position i and check that every continuation allowed after one is allowed after the other, with the same cost. For counts, also check that each object is built by exactly one sequence of choices (Theorem 3.2.2)."
    weak_signals:
      - "Minimum cost or number of ways to reach position n with steps or jumps of a few kinds"
      - "Choose some elements of an array with a rule about neighbours (no two adjacent), maximise the total"
      - "Split a string or array into pieces from a dictionary or with a cost per piece"
      - "n up to 10^5 or 10^6, and backtracking would branch at every position"
    kill_signals:
      - "The next choice depends on more than the position (the last action, how many used so far): add that to the state"
      - "A greedy choice is provably optimal (an exchange argument, 1.5): no table needed"
    lookalikes:
      - description: "The fewest jumps to reach the end when from position i you may jump anywhere up to a[i] ahead"
        needs: "left-to-right-forced (1.5)"
        flipping_difference: "Reachable positions form a prefix that only grows, so a greedy scan of the farthest reach answers it in O(n); the table works but is not needed."
    complexity: "O(n × transitions per position)."
  - id: extra-small-state
    name: Index plus a small extra fact
    decisive_property: "The allowed choices or their costs at position i depend on the past only through i and one more value from a small set (the last action, a parity, a count up to k, a flag); with that value added, two partial solutions with the same state have the same future."
    from_theorem: Theorem 3.2.5
    how_to_test: "Write down what the rule for the next choice reads about the past. If it is more than the position, find the smallest extra value that captures it and count the states n·|X|."
    weak_signals:
      - "Not the same action on two consecutive days; alternate between two kinds"
      - "Buy and sell with a cooldown, a fee or at most k transactions"
      - "A switch, a mode or a health state that changes the cost of the next step"
      - "At most one deletion, one flip or one skip allowed"
    kill_signals:
      - "The extra fact is a whole set of past choices (2^n values): that is a subset state (topic 3.7)"
      - "The extra fact is a capacity or a sum up to 10^5 or more: the item-and-capacity table of topic 3.3"
    lookalikes:
      - description: "The maximum sum of a contiguous subarray, with no extra rule"
        needs: "prefix-extremes (1.2)"
        flipping_difference: "Without a rule linking consecutive choices, the best subarray is a prefix difference; the extra state is needed only when a rule (one deletion, a sign flip) changes the future."
    complexity: "O(n · |X| · transitions)."
  - id: two-index
    name: Two indices per state
    decisive_property: "A partial solution is described by two numbers, such as positions in two strings or a position and a count, and every transition increases one of them or both; so the table dp[i][j] can be filled in increasing i and, within a row, increasing j."
    from_theorem: Theorem 3.2.3
    how_to_test: "Name the two numbers, list the transitions, and check that each one moves to a pair that is larger in the fill order; then count the pairs."
    weak_signals:
      - "Two strings: does one match a pattern, can a third be formed by interleaving them"
      - "Choose exactly k of n items, or reach position n with a counter that stays within a range"
      - "Sequences where each value must be close to the previous one, with some values fixed"
    kill_signals:
      - "Both indices range up to 10^5 or more (10^10 states): look for a single-index state or a greedy"
      - "The two indices describe a contiguous interval [l, r] that grows from the inside (interval states, topic 3.6)"
    lookalikes:
      - description: "Whether a short string is a subsequence of a long one"
        needs: "merge-walk (1.3)"
        flipping_difference: "Matching each character at its first possible place is never worse, so two pointers decide it; a two-index table is needed when a character may match in several ways (wildcards, interleaving)."
    complexity: "O(rows · columns · transitions)."
  - id: memo-recursion
    name: Recursion with a cache
    decisive_property: "The natural recursion has few distinct arguments but calls them many times, and no argument depends on itself; storing each result the first time makes every state cost its transitions once, even when the reachable states are scattered or their order is awkward."
    from_theorem: Theorem 3.2.4
    how_to_test: "Write the recursion, count the distinct arguments it can reach (not the calls), and check that each call's arguments are smaller in some sense, so there is no cycle."
    weak_signals:
      - "A recursive formula f(n) = f(n/2) + f(n/3) for n up to 10^18"
      - "Two players take stones or moves, and the winner is asked (win if some move leads to a losing state)"
      - "A recursive structure (a burger of layers, a tree of votes) whose size explodes but whose levels are few"
    kill_signals:
      - "The distinct arguments are many (10^7 or more) and the order is simple: tabulation is faster and has no recursion depth"
      - "A state can lead back to itself (moves that undo each other): the recursion never ends"
    lookalikes:
      - description: "f(n) = f(n − 1) + n with f(0) = 0, for n up to 10^18"
        needs: "closed-form (0.2)"
        flipping_difference: "Every value 0..n is reached, far too many to store; the recursion has a formula, n(n + 1)/2. A cache helps only when the reachable arguments are few."
    complexity: "O(number of reachable states × transitions), plus a cache lookup per call."
  - id: reconstruct
    name: Recover the choices
    decisive_property: "The output is an optimal solution itself, not only its value; recording for each state one transition that attains its optimum lets you walk back from the best final state and rebuild a solution of exactly that value."
    from_theorem: Theorem 3.2.6
    how_to_test: "Check that each state's optimum is attained by a recorded transition and that the walk back ends at a base case; for the lexicographically smallest solution, decide the tie-break before filling the table."
    weak_signals:
      - "Print the chosen items, the sequence of moves or the string, not just the best value"
      - "Print any optimal solution, or the lexicographically smallest one"
    kill_signals:
      - "Only the value or the count is asked"
    lookalikes:
      - description: "Print the order of n tasks that minimises the total waiting time"
        needs: "exchange-order (1.5)"
        flipping_difference: "The output is a solution, but an exchange argument proves that sorting by duration is optimal, so no table and no walk back are needed."
    complexity: "Same as the table, plus O(length of the solution) for the walk back."
problems:
  - id: ac-abc291_d
    role: worked_example
    summary: Count the ways to choose a side for each of N ≤ 2·10^5 cards so that neighbouring cards show
      different numbers, modulo 998244353.
  - id: cses-1140
    role: worked_example
    summary: Attend some of n ≤ 2·10^5 projects (days up to 10^9) that share no day, maximising the total
      pay.
  - id: lc-climbing-stairs
    role: ladder
    card: linear-state
    rung: 1
    twist: Base case of the card
    summary: Count the ways to climb n ≤ 45 stairs with steps of 1 or 2.
    hints:
      - Look at the last step of a climb. What can it be, and what is left before it?
      - The last step is 1 or 2, so the climbs of n are the climbs of n − 1 and the climbs of n − 2, each
        followed by one step; the classes do not overlap (Theorem 3.2.2).
      - ways[0] = ways[1] = 1 and ways[i] = ways[i − 1] + ways[i − 2]; print ways[n].
  - id: ac-dp_a
    role: ladder
    card: linear-state
    rung: 2
    twist: A minimum cost instead of a count.
    summary: A frog on N ≤ 10^5 stones jumps 1 or 2 stones ahead, paying the height difference; the cheapest
      way to the last stone.
    hints:
      - Does the cheapest way to finish from stone i depend on how the frog reached stone i?
      - 'No: the stone alone is the state. best[i] = min(best[i − 1] + |h_i − h_{i−1}|, best[i − 2] +
        |h_i − h_{i−2}|) (Theorem 3.2.1).'
      - Fill best[0] = 0, then i = 1, 2, … in order; print best[N − 1].
  - id: ac-dp_b
    role: ladder
    card: linear-state
    rung: 3
    twist: Up to K transitions into each state instead of two.
    summary: The same frog may jump up to K ≤ 100 stones ahead (N ≤ 10^5); the cheapest way to the last
      stone.
    hints:
      - How many stones can the last jump into stone i come from?
      - Any of the K stones before it; take the minimum of best[i − j] + |h_i − h_{i−j}| over j = 1..K.
      - 'The cheapest-jumps template of Section 6: O(NK) = 10^7 steps.'
  - id: lc-word-break
    role: ladder
    card: linear-state
    rung: 4
    twist: The transitions are dictionary words ending at position i, checked with a set (topic 0.6).
    summary: Can a string (length ≤ 300) be cut into words from a dictionary of words up to 20 letters
      long?
    hints:
      - If the first i characters can be cut into words, what must be true about the last word?
      - ok[i] is true when some word s[j..i) is in the dictionary and ok[j] is true; the last word ends
        at i, and words are at most 20 letters, so only j ≥ i − 20 matter.
      - ok[0] = true; for each i, try every j from max(0, i − 20) to i − 1 with a set lookup of s.substr(j,
        i − j); print ok[n].
  - id: cf-1741E
    role: ladder
    card: linear-state
    rung: 5
    twist: 'Transitions point both ways: a length marker can describe the segment before it or the segment
      after it, so a state receives values from earlier and also sends them forward.'
    summary: A sequence (n ≤ 2·10^5) was formed by splitting an array into segments and writing each segment's
      length just before or just after it; can the given sequence have arisen this way?
    hints:
      - Let ok[i] mean that the first i elements can be fully explained. Which elements can be a length
        marker, and for which segment?
      - If b_i is the marker of the segment just before it, that segment is b_{i−b_i}..b_{i−1} and ok[i]
        needs ok[i − b_i − 1]. If it is the marker of the segment just after it, it explains positions
        up to i + b_i, which needs ok[i − 1].
      - 'ok[0] = true; for i = 1..n: if i − b_i − 1 ≥ 0 and ok[i − b_i − 1], set ok[i]; if ok[i − 1] and
        i + b_i ≤ n, set ok[i + b_i]. Print YES if ok[n].'
  - id: ac-dp_c
    role: ladder
    card: extra-small-state
    rung: 1
    twist: Base case of the card
    summary: On each of N ≤ 10^5 days choose one of three activities with given points, never the same
      activity two days running; maximise the total.
    hints:
      - With "day i" alone as the state, what goes wrong? Try two days where the same activity is best
        on both.
      - 'The rule reads yesterday''s activity, so it must be in the state: dp[i][a] = points of a on day
        i + max over b ≠ a of dp[i − 1][b] (Theorem 3.2.5).'
      - The no-repeat template of Section 6 with m = 3.
  - id: lc-best-time-to-buy-and-sell-stock-with-cooldown
    role: ladder
    card: extra-small-state
    rung: 2
    twist: 'The extra fact has three values that form a small machine: holding a share, just sold (must
      rest tomorrow), or free.'
    summary: Buy and sell one share at a time on n ≤ 5000 days of prices; after a sale you must wait a
      day before buying again. Maximise the profit.
    hints:
      - What do you need to know about yesterday to decide what you may do today?
      - Whether you hold a share, and if not, whether you sold yesterday. Keep the best profit for each
        of the three situations at the end of each day.
      - hold = max(hold, free − price), sold = hold_prev + price, free = max(free, sold_prev); update
        all three from yesterday's values; answer max(free, sold).
  - id: lc-maximum-subarray-sum-with-one-deletion
    role: ladder
    card: extra-small-state
    rung: 3
    twist: 'The extra fact is a flag: whether the one allowed deletion has been used.'
    summary: The largest sum of a non-empty contiguous subarray (n ≤ 10^5) after deleting at most one
      element from it (it must stay non-empty).
    hints:
      - For subarrays ending at position i, what two kinds should you keep apart?
      - Those with no deletion yet (keep0) and those with the deletion already used (keep1). keep1 either
        extends a keep1 subarray by a[i], or deletes a[i] from a keep0 subarray ending at i − 1.
      - keep1 = max(keep1 + a[i], keep0_prev), keep0 = max(keep0 + a[i], a[i]); the answer is the largest
        keep0 or keep1 seen (keep1 only from i ≥ 1).
  - id: cf-698A
    role: ladder
    card: extra-small-state
    rung: 4
    twist: Some actions are forbidden on some days, and the goal is to minimise the rest days.
    summary: For n ≤ 100 days you know whether the gym is open and whether a contest runs; never do the
      same activity two days running. Minimise the days of rest.
    hints:
      - Which three values can "yesterday" take, and which of them limit today?
      - Rest, contest or gym. Contest is allowed only on a contest day and not after a contest; gym only
        when open and not after gym; rest is always allowed and adds 1.
      - dp[i][x] = fewest rests up to day i ending with activity x (infinity if impossible); fill from
        dp[i − 1] with the rules; print the minimum of the last row.
  - id: ac-abc359_d
    role: ladder
    card: extra-small-state
    rung: 5
    twist: The extra fact is the last K − 1 characters, up to 2^9 = 512 values, stored as a bitmask (topic
      1.7).
    summary: Fill each ? of a string of A, B and ? (N ≤ 1000) with A or B so that no substring of length
      K ≤ 10 is a palindrome; count the ways modulo 998244353.
    hints:
      - A palindrome of length K ending at position i depends on which characters?
      - Only the last K characters. So the state is (position, last K − 1 characters); appending a character
        is allowed when the K-window it completes is not a palindrome.
      - 'dp over positions with 2^(K−1) masks: for each mask and each allowed letter, form the K-window,
        check it, and add to the new mask (drop the oldest bit). Sum the last layer.'
  - id: lc-interleaving-string
    role: ladder
    card: two-index
    rung: 1
    twist: Base case of the card
    summary: Is s3 an interleaving of s1 and s2 (each ≤ 100 characters), keeping the order of each?
    hints:
      - After using the first i characters of s1 and the first j of s2, which character of s3 comes next?
      - Character i + j of s3. It must equal s1[i] (then move to (i + 1, j)) or s2[j] (then (i, j + 1));
        ok[i][j] needs only these two smaller states.
      - ok[0][0] = true; fill i from 0 and j from 0 with ok[i][j] = (i > 0 and ok[i − 1][j] and s1[i −
        1] = s3[i + j − 1]) or (j > 0 and ok[i][j − 1] and s2[j − 1] = s3[i + j − 1]).
  - id: ac-abc267_d
    role: ladder
    card: two-index
    rung: 2
    twist: The second index is a count of items chosen, and an item's value depends on that count.
    summary: Choose a subsequence of length M from N ≤ 2000 numbers to maximise Σ k·B_k, where B_k is
      the k-th chosen number.
    hints:
      - When A_i becomes the k-th chosen number, what do you need to know about the earlier choices?
      - 'Only how many were chosen before (k − 1) and the best sum for that: dp[i][j] = max(dp[i − 1][j],
        dp[i − 1][j − 1] + j·A_i).'
      - Fill an (N + 1) × (M + 1) table with −∞ for impossible states (values can be negative) and long
        long; print dp[N][M].
  - id: lc-regular-expression-matching
    role: ladder
    card: two-index
    rung: 3
    twist: A star lets one pattern position match zero or many characters, so a transition can stay on
      the same pattern index.
    summary: Does a pattern with . (any character) and x* (zero or more of x) match a whole string (both
      ≤ 20 characters)?
    hints:
      - With the state (position in the string, position in the pattern), what are the choices when the
        next pattern item is x*?
      - Skip x* entirely (pattern index + 2), or, if the current character matches x, consume one character
        and stay on x* (string index + 1). Every transition increases at least one index.
      - m[i][j] = the suffixes s[i..] and p[j..] match; fill from the ends backwards with the star and
        non-star cases; print m[0][0].
  - id: cf-1077F1
    role: ladder
    card: two-index
    rung: 4
    twist: The count of chosen positions and the position of the last one are both needed, and the rule
      "no gap of k unchosen pictures" limits where the previous choice can be.
    summary: Repost exactly x of n ≤ 200 pictures so that every k consecutive pictures contain a repost;
      maximise the total beauty of the reposted pictures (or report −1).
    hints:
      - If picture i is the j-th repost, where can the (j − 1)-th repost be?
      - Among the k pictures just before i, otherwise a gap of k unreposted pictures appears. So dp[i][j]
        = a_i + max over i − k ≤ p < i of dp[p][j − 1].
      - dp[0][0] = 0 (a virtual start), −∞ elsewhere; fill in increasing i and j in O(n²k); the answer
        is the best dp[i][x] with i ≥ n − k + 1, or −1.
  - id: ac-abc275_d
    role: ladder
    card: memo-recursion
    rung: 1
    twist: Base case of the card
    summary: Compute f(N) for N ≤ 10^18, where f(0) = 1 and f(k) = f(⌊k/2⌋) + f(⌊k/3⌋).
    hints:
      - How many different arguments can the recursion reach from N, and how many calls does it make without
        storing anything?
      - Only values ⌊N/(2^a 3^b)⌋, at most a few thousand; but without storing, the same values are recomputed
        exponentially often. Store each result in a map (Theorem 3.2.4).
      - 'f(k): if k == 0 return 1; if k is in the map return it; else compute f(k/2) + f(k/3), store and
        return.'
  - id: ac-abc115_d
    role: ladder
    card: memo-recursion
    rung: 2
    twist: The recursion follows a self-similar structure and needs stored sizes of the smaller levels;
      only one branch is followed at each level.
    summary: A level-L burger is bun, level-(L−1) burger, patty, level-(L−1) burger, bun (level 0 is a
      patty); count the patties in the bottom X layers of a level-N burger (N ≤ 50).
    hints:
      - Store the total layers and patties of each level first. Where can layer X fall in a level-L burger?
      - In the bottom bun, inside the lower level-(L−1) burger, at the middle patty, inside the upper
        burger, or at the top bun; each case needs at most one recursive call.
      - 'f(L, X): handle L = 0 and X at the ends; if X is within the lower half, return f(L − 1, X − 1);
        at the middle, patties of level L − 1 plus 1; above it, add f(L − 1, X − layers[L − 1] − 2).'
  - id: ac-abc391_e
    role: ladder
    card: memo-recursion
    rung: 3
    twist: 'Each call returns two values: the result of the group and the cheapest number of changes that
      would flip it.'
    summary: A string of 3^N bits (N ≤ 13) is reduced by repeatedly replacing each group of three by its
      majority; find the fewest bit changes that flip the final bit.
    hints:
      - For one group of three children, how can you flip its majority, and how much does each option
        cost?
      - If all three children agree, flip the two cheapest; if two agree, flip the cheaper of those two.
        So a call needs, from each child, its value and its cost to flip.
      - rec(level, start) returns (value, cost) from the three children; at level 0 a bit costs 1 to flip;
        print the cost at the top.
  - id: lc-largest-divisible-subset
    role: ladder
    card: reconstruct
    rung: 1
    twist: Base case of the card
    summary: Print a largest subset of n ≤ 1000 distinct positive integers in which every pair divides
      one way or the other.
    hints:
      - After sorting, what does a valid subset look like, read from the smallest element up?
      - A chain where each element divides the next. len[i] = 1 + max len[j] over j < i with nums[j] dividing
        nums[i]; store the j that gave the maximum as parent[i] (Theorem 3.2.6).
      - Sort, fill len and parent in O(n²), start at the index with the largest len and follow parent
        back, printing the elements.
  - id: ac-abc271_d
    role: ladder
    card: reconstruct
    rung: 2
    twist: The table is a yes/no table over (cards used, sum), and the choices are rebuilt by walking
      back through it.
    summary: Each of N ≤ 100 cards shows a_i or b_i; choose sides so the total is exactly S ≤ 10^4, and
      print the choice as a string of H and T (or No).
    hints:
      - Which table tells you, after the fact, which side card i must have shown?
      - 'ok[i][s] = the first i cards can total s. If ok[N][S], walk back: card i shows a_i if ok[i −
        1][s − a_i], otherwise b_i (and then ok[i − 1][s − b_i] holds).'
      - Fill ok in O(N·S), walk back from (N, S) building the string in reverse, then reverse it.
  - id: lc-form-largest-integer-with-digits-that-add-up-to-target
    role: ladder
    card: reconstruct
    rung: 3
    twist: The output must be the largest number, so the walk is greedy from the front and needs a table
      that tells how many digits are still possible.
    summary: Digits 1..9 have given paint costs; paint the largest integer whose total cost is exactly
      target ≤ 5000 (or report 0).
    hints:
      - 'Which matters more for the size of a number: its length or its first digit?'
      - 'The length. len[t] = the most digits with total cost exactly t (−∞ if impossible). Then choose
        digits from the front: the largest digit d with len[t − cost(d)] = len[t] − 1 keeps the maximum
        length.'
      - Fill len over 0..target; if len[target] < 0 print 0; otherwise build the string digit by digit
        with the greedy rule, from t = target down to 0.
