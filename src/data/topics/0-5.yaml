decision_map:
- weak_signal: Small n (≤ 20) and "choose some of the items"
  choose: subset-bitmask
  when: Each item is in or out independently and 2^n times the check fits (Theorem 0.5.2).
  over:
  - card: permutations
    because: Use orders only when the order changes the answer; otherwise n! repeats each subset many
      times.
  - card: recursive-choices
    because: Use recursion when items have more than two options or the choices depend on earlier ones.
- weak_signal: n ≤ 8–10 and "visit every … once", "arrange", "relabel"
  choose: permutations
  when: The answer depends on the order and n! times the check fits (Theorem 0.5.3).
  over:
  - card: subset-bitmask
    because: Subsets lose the order, which decides the answer here.
- weak_signal: Sequences of a length given in the input; three or more options per position
  choose: recursive-choices
  when: The number of positions varies, or choices depend on earlier ones, and k^L fits (Theorem 0.5.4).
  over:
  - card: nested-loops
    because: Nested loops need a fixed number of positions written into the code.
  - card: subset-bitmask
    because: A bitmask fits only two options per position.
- weak_signal: Few variables (two to four) with a small total, "how many ways"
  choose: nested-loops
  when: The tuples, with the last variable computed from the others, fit the budget (Theorem 0.5.1).
  over:
  - card: budget-from-constraints
    because: The same budget check from topic 0.2 decides how many loops are affordable.
    topic: '0.2'
  - card: closed-form
    because: A formula is needed only when even two loops are too many.
    topic: '0.2'
- weak_signal: '"The smallest x such that …" with a small proven bound on x'
  choose: enumerate-answer
  when: Testing every value in order up to the bound fits (Theorem 0.5.5).
  over:
  - card: case-analysis
    because: Reasoning about cases is riskier than testing a small range directly.
    topic: '0.3'
  - card: closed-form
    because: A formula is needed only when the range is too large to test.
    topic: '0.2'
