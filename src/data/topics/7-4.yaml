  summary: 'A list of N ≤ 2·10^5 operations on a number x that starts at 0: type 1 sets x to Y, type 2
    adds Y to x; at most K operations may be ignored; the largest possible final x.'
  hints:
  - The last type 1 operation that is not ignored decides the base value. What follows from this for the
    type 1 operations after it?
  - They must all be ignored, so each of them costs one of the K ignores. The rest of the budget can ignore
    the most negative additions after it.
  - Scan from the last operation to the first, keeping the sum of the additions after the current point
    and a bounded max-heap of the most negative ones that are ignored (the size is the remaining budget).
