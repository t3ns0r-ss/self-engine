# Patterns for topic 7.3 (DP sped up with Fenwick or segment trees). Provisional until the lesson maps them to Recognition Cards.
topic: "7.3"
patterns:
  - id: prefix-max-transition
    name: Best over smaller values
    description: dp[i] = best dp[j] over j < i with a[j] < a[i], plus something; keep a Fenwick tree of best values indexed by a.
    precondition: The transition takes the best over a prefix of compressed values, and the best only ever improves.
  - id: window-transition
    name: Best over a sliding range
    description: dp[i] = minimum of dp[j] over j in a range [i − k, i − 1] plus a cost, with a segment tree over j.
    precondition: The set of predecessors is a range of indices, and the combining operation is associative.
  - id: counting-with-tree
    name: Counting increasing subsequences
    description: Number of increasing subsequences (or similar counts) modulo a prime, with a tree of sums indexed by value.
    precondition: The transition sums over a prefix of compressed values.
  - id: range-update-transition
    name: Transitions that update ranges
    description: Choosing an option adds a cost to a whole range of previous states; maintain dp with a lazy segment tree.
    precondition: Each new element changes the values of a contiguous range of states by the same amount.
  - id: line-envelope
    name: Lowest of straight lines
    description: dp[i] = a term of i plus the least over earlier j of (m_j * x_i + c_j) after the cost is expanded; a deque of lines when the slopes and the points are sorted, a Li Chao tree otherwise.
    precondition: The cost of the pair (j, i) contains a product of one number of j and one number of i, and nothing else that mixes them.
  - id: monotone-split
    name: Best last cut that only moves right
    description: A layered DP over k groups, dp[t][i] = min over j of dp[t-1][j] + cost(j, i), solved by divide and conquer on the cut point.
    precondition: The cost of a group comes from prefix sums in O(1) and satisfies the quadrangle inequality, so the smallest best j never moves left.
