decision_map:
- weak_signal: A tree with a boss, a root or a path to the root; asks about levels, depth, the path up,
    or needs parents before children.
  choose: depths-parents
  when: The graph is a tree (n − 1 edges, connected); one walk from the root gives parents and depths
    (Theorem 4.5.1).
  over:
  - card: unweighted-shortest
    because: If the graph has cycles, the walk needs marks and a queue.
    topic: '4.1'
  - card: components
    because: If the graph may fall into pieces, ask first which vertices are reached.
    topic: '4.1'
- weak_signal: For each vertex, how many vertices, how much, or which flag is below it; how many times
    an edge is used; the sum of distances over all pairs.
  choose: subtree-values
  when: 'The value of a vertex is combined from its children (Theorems 4.5.2 and 4.5.6): go backwards
    over the visit order.'
  over:
  - card: farthest-each
    because: If the answer for a vertex needs the part of the tree above it too (the farthest vertex),
      a subtree sees only half.
  - card: reverse-time
    because: If the graph is not a tree and parts disappear over time, reverse the time.
    topic: '4.4'
- weak_signal: Many questions about whether a vertex is below another, or about the contents of subtrees,
    on a tree with a fixed root.
  choose: subtree-ranges
  when: The root is fixed and the subtree is a block of the visit order (Theorem 4.5.3); use arrays and
    binary search on the blocks.
  over:
  - card: subtree-values
    because: If one number per subtree is enough and there are no further questions, the backward pass
      is simpler.
  - card: merge-groups
    because: If edges are added while questions come, the graph is not a fixed tree.
    topic: '4.4'
- weak_signal: The longest path of a tree, the diameter, the shortest walk that visits every vertex, or
    a quantity that depends on the two ends of the longest path.
  choose: longest-path
  when: The graph is a tree with non-negative weights; two walks give the diameter (Theorem 4.5.4).
  over:
  - card: path-mask
    because: If the graph has cycles and the longest simple path is asked, the paths must be tried (small
      n).
    topic: '3.7'
  - card: dijkstra
    because: If the question is the cheapest route between two given places, the shortest path is needed.
    topic: '4.3'
- weak_signal: For every vertex, the distance to the farthest vertex; the best meeting place; the smallest
    height over all roots.
  choose: farthest-each
  when: 'A tree with non-negative weights: the farthest distance of every vertex is the larger of its
    distances to the two ends of a diameter (Theorem 4.5.5).'
  over:
  - card: longest-path
    because: If only one number is asked, the diameter, two walks are enough.
  - card: every-pair
    because: If the graph has cycles, the distances from every vertex must be computed (small n).
    topic: '4.3'
