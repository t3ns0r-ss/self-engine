  hints:
  - Which edges can reduce the number of connected pairs at all?
  - 'Only a bridge: it splits the vertices into a part of size s and a part of size n − s, and the pairs
    left are s(s−1)/2 + (n−s)(n−s−1)/2.'
  - Find the bridges with the sizes of the subtrees below them, take the smallest value over all bridges,
    and use n(n−1)/2 if there is no bridge.
- id: cf-652E
  role: ladder
  card: bridge-tree
  rung: 2
  twist: Inside a bridgeless group one can go and return by different roads, so only the path of bridges
    between the groups of a and b matters.
  summary: n ≤ 3·10^5 islands joined by m ≤ 3·10^5 two-way bridges, some holding artifacts; Johnny walks
