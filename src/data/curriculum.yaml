# Curriculum registry (PLAN.md Section 4). Topics are ordered by `order`, not by id.
# requires: the topics a lesson leans on most ("0.x" in PLAN.md is expanded to every Phase 0 topic;
# 7.7 "Phases 0–2" and 7.8 "all" are expanded likewise). Any earlier topic may still be used.
# target_rating: the phase band [L, H].
# Phase 7 lessons open with "This topic combines X and Y."
