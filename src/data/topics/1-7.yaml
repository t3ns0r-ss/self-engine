drill:
- problem: cf-1527A
  answer:
    topic: '1.7'
    card: high-bit-first
  property: The AND keeps n's highest bit until a number without it appears; the first such number counting
    down is 2^h − 1, and it clears every bit at once.
  why_others_fail: Simulating the AND from n downwards takes up to 10^9 steps per test; only the highest
    bit matters.
- problem: ac-abc347_d
  answer:
    topic: '1.7'
    card: bit-identities
  property: Where C has a 1, exactly one of X, Y has the bit; where C has a 0, both or neither. So popcount(C)
    bits are split, and (a + b − popcount(C)) / 2 extra bits are shared on zeros of C; check parity and
    that enough positions exist.
  why_others_fail: Searching X and Y is impossible below 2^60; each bit's role is fixed by C, so only
    counts matter.
- problem: ac-abc261_e
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: 'Each bit of X evolves on its own: for each bit, keep what the composed operations so far
    do to a 0 and to a 1, and apply that to X''s current bit.'
  why_others_fail: Replaying operations 1..i for every i is O(N²); bits do not interact under and, or
    and xor.
- problem: ac-abc349_d
  answer:
    topic: '1.7'
    card: high-bit-first
  property: From the current l, take the largest aligned block [l, l + 2^i) that does not pass R, where
    2^i divides l; a larger block covers more and is never worse.
  why_others_fail: R reaches 2^60, so the numbers cannot be walked one by one; the block sizes are powers
    of two decided from the top.
- problem: cses-3426
  answer:
    topic: '1.7'
    card: prefix-xor
  property: 'The XOR of a window is a running XOR: XOR in the entering value and XOR out the leaving one
    (they cancel), as with prefix values.'
  why_others_fail: A deque (topic 1.6) keeps a maximum; XOR needs no deque because it can be undone.
- problem: lc-sum-of-two-integers
  answer:
    topic: '1.7'
    card: bit-identities
  property: 'a + b = (a ⊕ b) + 2(a & b): repeat with a ⊕ b and (a & b) << 1 until the carry is 0.'
  why_others_fail: There is nothing to search or count; the sum identity is the whole solution.
- problem: cf-1514B
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: The largest sum with AND 0 has each of the k bits missing from exactly one element; the bits
    choose independently, giving n^k arrays.
  why_others_fail: Listing arrays is hopeless; bits are independent, so the count is a product over bits.
- problem: lc-maximum-xor-for-each-query
  answer:
    topic: '1.7'
    card: high-bit-first
  property: 'Within maximumBit bits, the best k sets every bit the current XOR lacks: k = x ⊕ (2^m − 1),
    which gives all ones, the largest possible value.'
  why_others_fail: Trying every k < 2^m for each query is too slow; the top bits are decided independently,
    all at once.
- problem: lc-binary-subarrays-with-sum
  answer:
    topic: '1.3'
    card: count-windows
  property: 'Values are 0 or 1, so window sums only grow when the window grows: exactly goal = (at most
    goal) − (at most goal − 1), each counted by a shrinking window.'
  why_others_fail: It asks for a sum, not a XOR; prefix sums with a map (topic 1.2) also work, but no
    bit property is involved.
- problem: ac-abc384_d
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: Remove whole periods from S (S mod the period sum), then look for a window with that sum in
    two copies of the array; positive values make the window shrinkable.
  why_others_fail: S is up to 10^18, so the infinite sequence cannot be walked; there are no bitwise operations
    in the statement.
- problem: cses-1631
  answer:
    topic: '1.5'
    card: extreme-first
  property: If the longest book takes more than all the others together, the answer is twice it; otherwise
    the answer is the total. Only the extreme book matters.
  why_others_fail: Nothing involves bits; the answer depends only on the sum and the maximum.
lookalike_pairs:
- a: lc-single-number
  b: lc-single-number-ii
  a_tool:
    topic: '1.7'
    card: xor-identities
  b_tool:
    topic: '1.7'
    card: per-bit-contribution
  flipping_difference: A's duplicates come in pairs, which cancel under XOR; B's come in threes, which
    XOR leaves as one copy, so each bit is counted and taken modulo 3.
  shared_surface: Both ask for the number that appears once in an array where every other number repeats.
  flipping_input: 'A = [4, 1, 4]: the XOR is 1, the unique value. B = [2, 2, 2, 9]: the XOR is 2 ⊕ 9 =
    11, but counting each bit modulo 3 gives 9.'
- a: ac-abc147_d
  b: ac-abc365_e
  a_tool:
    topic: '1.7'
    card: per-bit-contribution
  b_tool:
    topic: '1.7'
    card: prefix-xor
  flipping_difference: A sums over pairs of elements; B sums over subarrays, whose XOR is P_j ⊕ P_(i−1),
    so the per-bit counting runs over prefix values (and must exclude length-1 subarrays).
  shared_surface: Both ask for a sum of XOR values over many pairs or many subarrays.
  flipping_input: 'a = [1, 2, 3]: summing a_i ⊕ a_j over pairs gives 6 (A); summing the XOR of every subarray
    of length at least 2 gives 3 + 1 + 0 = 4 (B), which is counted over the prefix values 0, 1, 3, 0.'
self_test:
- q: Why can the XOR of a range be computed from prefix values, while the AND of a range cannot?
  a: 'XOR can be undone: P_r ⊕ P_(l−1) removes the first l − 1 values because x ⊕ x = 0 (Theorem 1.7.1).
    AND has no inverse: once a bit is 0 in the prefix, knowing P_(l−1) does not tell whether the range
    itself had it.'
- q: In (5, 3, 5, 3, 5), what is the XOR of all values, and why?
  a: '5: the two 3s cancel, and of the three 5s two cancel, leaving one (Theorem 1.7.1, part 4).'
- q: Why does the sum of a_i + a_j over all pairs not split into a count per bit, while the sum of a_i
    ⊕ a_j does?
  a: Addition carries into higher bits, so bit b of a sum depends on lower bits too. Bit b of a XOR depends
    only on bit b of the two numbers (Theorem 1.7.3, note 1). For sums, use (n − 1) · Σ a_i instead.
- q: Why does setting bit b of the answer beat any choice of all the lower bits?
  a: 2^b > 2^(b−1) + … + 1 = 2^b − 1, so a number with bit b set and all lower bits 0 is still larger
    than one without it and all lower bits 1 (Theorem 1.7.4).
- q: In the largest AND of a pair, why must the count at bit b include all bits decided above it, not
    only bit b?
  a: The kept bits must all come from the same pair. Two values with bit b and two other values with a
    higher bit do not give a pair having both (Section 7, 'checking each bit alone').
- q: Given s = a + b = 10 and x = a ⊕ b = 4, find a and b, or explain why none exist.
  a: 'c = (s − x)/2 = 3 = 011_2, and c & x = 011 & 100 = 0, so a = 3 and b = 3 | 4 = 7: 3 + 7 = 10 and
    3 ⊕ 7 = 4 (Theorem 1.7.5).'
- q: Which subarrays does the map count in 'subarrays with XOR k' when k = 0, and why must the lookup
    come before recording P_j?
  a: Pairs of equal prefix values, that is, subarrays whose XOR is 0. Recording P_j first would pair it
    with itself, counting an empty subarray at every position.
checkpoint:
  time_limit_minutes: 90
  problems:
  - cf-1362C
  - lc-number-of-wonderful-substrings
  - ac-abc117_d
decision_map:
- weak_signal: '"Every element appears twice except …", the missing number, values encoded by XORs of
    neighbours'
  choose: xor-identities
  when: The values are combined by XOR, so repeated values cancel and x ⊕ y = z can be solved for x (Theorem
    1.7.1).
  over:
  - card: map-counting
    because: Counting occurrences with a map also finds the odd one out, but in O(n log n) time and O(n)
      memory; XOR needs one variable.
    topic: '0.6'
  - card: nested-loops
    because: Comparing all pairs is O(n²).
    topic: '0.5'
- weak_signal: XOR of a range a[l..r]; subarrays or substrings whose XOR is 0 or k; letters with even
    counts
  choose: prefix-xor
  when: The condition is on the XOR of a contiguous range and equals a fixed value (Theorem 1.7.2).
  over:
  - card: prefix-count-lookup
    because: The counting is the same; the difference is that a range is P_r ⊕ P_(l−1), not a difference
      of sums.
    topic: '1.2'
  - card: shrinkable-window
    because: A XOR does not grow or shrink with the window, so a window that shrinks on failure misses
      answers.
    topic: '1.3'
- weak_signal: Sum of XOR, AND or OR over all pairs, subarrays or subsets; Hamming distances; popcounts
    over a range
  choose: per-bit-contribution
  when: Each bit of every term depends only on that bit of the inputs, so the total is a count per bit
    (Theorem 1.7.3).
  over:
  - card: nested-loops
    because: All pairs are O(n²); per bit it is O(n · B).
    topic: '0.5'
  - card: subset-bitmask
    because: Listing all 2^n subsets works only for n up to about 20.
    topic: '0.5'
- weak_signal: '"Maximise the XOR / AND", the best x with x ≤ K, the largest or smallest value under bit
    conditions'
  choose: high-bit-first
  when: A higher bit outweighs all lower ones, and at each bit you can check whether a valid choice keeps
    it (Theorem 1.7.4).
  over:
  - card: enumerate-answer
    because: Trying every x up to K is too slow when K reaches 10^12 or more.
    topic: '0.5'
  - card: answer-search
    because: The best value is not found by a yes/no check that grows monotonically; it is built bit by
      bit.
    topic: '1.4'
- weak_signal: Given a + b together with a ⊕ b or a & b; power of two; bit flips to make a | b equal c
  choose: bit-identities
  when: The condition rewrites with a + b = (a ⊕ b) + 2(a & b) and similar identities, fixing each bit
    (Theorem 1.7.5).
  over:
  - card: enumerate-answer
    because: Trying every a up to s is impossible for s up to 10^18.
    topic: '0.5'
  - card: case-analysis
    because: The cases are per bit, and the identities say which combinations are possible.
    topic: '0.3'
