  - Keep, for every node, the 26 counts along the way from the root; the counts on the path are cnt[a]
    + cnt[b] − 2 · cnt[lca]; the path length comes from the depths.
- id: ac-abc152_f
  role: ladder
  card: path-counts
  rung: 3
  twist: 'Each restriction is a path: record its roads as a bit mask, then count by inclusion–exclusion
    over the restrictions.'
  summary: 'A tree with N ≤ 50 vertices and M ≤ 20 restrictions (u, v): the path from u to v must contain
    at least one black edge; count the ways to paint the N − 1 edges white or black.'
  hints:
  - 'Count the paintings that break a set S of restrictions: which edges are then forced white?'
  - 'Inclusion–exclusion over subsets S of the restrictions: add (−1)^|S| · 2^(N − 1 − |union of the paths
