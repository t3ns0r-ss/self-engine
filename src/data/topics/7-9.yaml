# Topic 7.9 data file (CURRICULUM_GAPS_PLAN.md Section 5.5). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '7.9'
uses:
- topic: '0.1'
  what: 'Overflow: a flow can reach 10^12 and more, so every capacity and every total is a long long'
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, and the search over sets of vertices'
- topic: '1.1'
  what: 'Sorting: compressing coordinates before building a network, and the sorted pass of a look-alike'
- topic: '1.3'
  what: 'Windows: the cut of one drill problem is a window of consecutive positions'
- topic: '1.4'
  what: 'Binary search on the answer: a flow or a matching as the test inside the search'
- topic: '1.5'
  what: 'Greedy choices: matching two sorted lists, the tool of a look-alike'
- topic: '1.7'
  what: 'Bits: the element and bit graph of one ladder problem'
- topic: '2.1'
  what: 'Factorisation: the network over prime factors in two drill problems'
- topic: '3.3'
  what: 'DP over two indices: the tool of one drill problem'
- topic: '3.8'
  what: 'Bitmask DP over assignments: the look-alike when one side has at most about 20 items'
- topic: '4.1'
  what: 'Graphs: edge lists, breadth-first search (the residual graph is searched with it) and components'
- topic: '4.2'
  what: 'Bipartite graphs: the two sides of every matching problem'
- topic: '4.3'
  what: 'Dijkstra: the cheapest single route, the tool of one negative example'
- topic: '4.5'
  what: 'Cuts: a cut splits the vertices into two sides, the word used for the minimum cut here'
- topic: '7.3'
  what: 'DP on DAGs: counting paths, the tool of one negative example'
- topic: '7.5'
  what: 'Greedy II: jobs with deadlines (a heap), the look-alike when the allowed slots are a prefix'
- topic: '7.8'
  what: 'Constructive algorithms: the invariant and the build of one drill problem'
theorems:
- id: 7.9.1
  title: A flow is largest exactly when no augmenting path is left, and then the cut of the reachable
    vertices is as small as the flow
  plain_words: Keep pushing flow along any path that still has room, counting backward edges that undo
    earlier pushes. When no such path is left, the flow is as large as possible, and the vertices you
    can still reach from the source form a cut that is exactly as small as the flow.
  code: 7.9/thm-1
- id: 7.9.2
  title: Choosing a side for every item, with a cost per item and a penalty per separated pair, is a minimum
    cut
  plain_words: If every item takes one of two sides, pays a cost for its side, and some listed pairs pay
    a penalty when the first is on one side and the second on the other, then the cheapest choice costs
    the same as a minimum cut of a network that has one edge for each cost and each penalty.
  code: 7.9/thm-2
- id: 7.9.3
  title: Augmenting along shortest paths needs at most V times E rounds
  plain_words: If every round pushes along a path with the fewest edges, the length of that path never
    goes down, and every edge can be the one that fills up only about half as many times as there are
    vertices. So the number of rounds depends on the shape of the network only, not on the capacities.
  code: 7.9/thm-3
- id: 7.9.4
  title: 'Dinic phases: the distance from the source to the sink grows after each blocking flow'
  plain_words: Dinic pushes flow along shortest paths only until every shortest path has a full edge.
    After that phase the shortest path to the sink is strictly longer. A path has fewer than V edges,
    so there are fewer than V phases.
  code: 7.9/thm-4
- id: 7.9.5
  title: A largest matching of a bipartite graph is a maximum flow of a unit network
  plain_words: 'Pairing items is the same as sending one unit of water through each pair: a pipe of width
    1 into every left item and out of every right item makes sure that each is used at most once. The
    largest matching has as many pairs as the largest flow has units.'
  code: 7.9/thm-5
- id: 7.9.6
  title: 'Kuhn: trying each left vertex once for an augmenting path finds a largest matching'
  plain_words: A matching is largest exactly when no path alternates from an unpaired left item to an
    unpaired right item. If the search from one item finds no such path, it will not find one later either,
    so one try per left item is enough.
  code: 7.9/thm-6
- id: 7.9.7
  title: 'König: in a bipartite graph the largest matching has as many pairs as the smallest vertex cover
    has vertices'
  plain_words: The fewest vertices that touch every edge is exactly as many as the most pairs you can
    form. After the matching is found, a search along alternating paths from the unpaired left items tells
    which vertices to take. The items that are left out of the cover are the largest group with no pair
    connected.
  code: 7.9/thm-7
- id: 7.9.8
  title: Paths that share no edge are a maximum flow with capacity 1; paths that share no vertex need
    every vertex split in two
  plain_words: The most paths from the source to the sink that share no edge is the maximum flow when
    every edge has capacity 1. To forbid shared vertices too, split each vertex into an entry and an exit
    joined by one edge of capacity 1, so that every vertex can be used only once.
  code: 7.9/thm-8
- id: 7.9.9
  title: Dinic on a unit bipartite network is Hopcroft–Karp and needs at most about 2 times the square root of V phases
  plain_words: When every vertex can be used only once, the paths that are still missing from a maximum matching
    cannot share a vertex. After about the square root of V phases every augmenting path is longer than the
    square root of V, so only about the square root of V of them can still fit, and each phase costs only a
    pass over the edges.
  code: 7.9/thm-9
cards:
- id: flow-or-cut
  name: Maximum flow or minimum cut
  from_theorem: 7.9.1
  decisive_property: The question is either how much can be routed from a source to a sink through limits
    on edges (or on vertices, by splitting them), or, equivalently, how little must be removed to separate
    them; or every item must take one of two sides, paying a cost for its own side and a penalty for each
    listed pair that is separated. All numbers are non-negative integers, nothing is charged per unit
    that is sent, and the network has at most about 10^5 edges. Then the answer is the value of a maximum
    flow, or the capacity of a minimum cut, which is the same number.
  how_to_test: Name the source and the sink. For routing, check that every limit is a capacity on an edge
    or on a vertex and that no price per unit is asked. For sides, write the cost of every choice as a
    cost per item plus a penalty per pair on different sides, and check that all are non-negative; a penalty
    for two items on the same side is allowed if the meaning of the sides of one of the two groups can
    be swapped.
  constraint_shapes:
  - 'n = 500 vertices, m = 1000 edges, capacities up to 10^9: the largest flow is up to 10^12, so 64 bits;
    Dinic does at most V²E = 2.5·10^8 steps (Theorem 7.9.4) and much fewer in practice'
  - 'A grid of 100 by 100 cells, each painted one of two colours: 2^10000 colourings cannot be tried,
    while the network has 10^4 vertices and 4·10^4 edges'
  weak_signals:
  - form: Asks for the most that can be sent, the fewest roads or rooms to remove to disconnect two places,
      or the most routes that share nothing
    shape: A graph of up to 500 vertices and 1000 edges (or 10^5 edges with capacity 1), edge limits up
      to 10^9, a source and a sink named in the statement
  - form: Every item or cell takes one of two states, with a cost for each state and a penalty or gain
      for neighbouring items in different states
    shape: A grid up to 100 by 100 or up to 1000 items with listed pairs; 2^n choices are far too many
  - form: Choose a set of items so that choosing an item forces choosing others, and maximise reward minus
      cost
    shape: Up to about 1000 items and dependencies, rewards up to 10^9
  kill_signals:
  - 'A price per unit sent ("the cheapest way to send k units"): that is minimum-cost flow, which is not
    in this course; if only one route is needed, a shortest path answers it (the first negative example
    below)'
  - 'The question counts all paths, not the most that share nothing: in the graph with edges s→a, s→b,
    a→b, a→t, b→t there are 3 paths but at most 2 that share no edge (the second negative example below)'
  - 'A penalty when two items are on the same side, with no way to swap the meaning of the sides in a
    group: the costs are not a cut'
  in_action:
    statement: A town has n = 400 junctions and m = 900 one-way roads; road i carries at most c_i cars
      per hour (c_i ≤ 10^4). How many cars per hour can drive from junction 1 (the stadium) to junction
      n (the highway)?
    constraints: n ≤ 400, m ≤ 900, c_i ≤ 10^4.
    budget: Choosing which roads carry which cars has no small search space; there are far more than 2^900
      ways to pick road sets. A flow network has 400 vertices and 900 edges, and Dinic needs at most V²E
      = 1.4·10^8 steps, and in practice a small fraction of that.
    candidates:
    - tool: Send the widest path first, again and again, never taking flow back
      verdict: rejected
      because: Without backward edges an early choice can block the best total; the network s→a 1, s→b
        1, a→b 1, a→t 1, b→t 1 loses a unit if the first path is s, a, b, t.
    - tool: Dijkstra (topic 4.3) for the best single route
      verdict: rejected
      because: It finds one route, while the question adds up the capacity of many routes that compete
        for the same roads.
    - tool: Maximum flow with Dinic (this topic)
      verdict: chosen
      because: The limits are capacities on edges, there is no price per car, and the numbers are non-negative
        integers.
    property_check: Every limit is a capacity on a road, the source is junction 1 and the sink is junction
      n, and nothing is charged per car (Theorem 7.9.1). The answer is at most the sum of the capacities
      leaving junction 1, at most 9·10^6, which fits, but the code uses long long anyway.
    decision: Maximum flow from 1 to n with Dinic, O(V²E).
  examples:
    positive:
    - inline:
        input: 'The network s→a 2, s→b 2, a→b 1, a→t 1, b→t 2: the largest flow from s to t'
        answer: '3'
        why: The edges into t hold 1 + 2 = 3, and the flow 1 along s,a,t plus 2 along s,b,t reaches it.
          The same number is the capacity of the cut with t alone on one side, as Theorem 7.9.1 says.
    - inline:
        input: 'A row of four cells B ? ? W: paint the ? cells to make as many neighbouring pairs of different
          colours as possible'
        answer: '3'
        why: Painting them W and B gives B W B W with 3 different pairs, the most possible for 4 cells.
          The cut method flips the colour of every second cell, ties the fixed cells to the source and
          finds minimum cut 0, so the answer is 3 − 0 (Theorem 7.9.2).
    negative:
    - inline:
        input: 'The cheapest route from 1 to 3 with edge costs 1→2: 2, 2→3: 2 and 1→3: 5'
        answer: '4'
        method_gives: '7'
        why: 'The numbers are costs, not capacities: only one route is used, and the cost adds up along
          it. Read as capacities, the maximum flow is 2 + 5 = 7, which answers a different question. The
          decisive property fails: there is no limit to fill, only a price to pay along one route.'
      correct_tool:
        topic: '4.3'
        card: dijkstra
    - inline:
        input: The number of different paths from s to t in the graph s→a, s→b, a→b, a→t, b→t
        answer: '3'
        method_gives: '2'
        why: 'The paths s,a,t, s,b,t and s,a,b,t may share edges, so all three count. The maximum flow
          counts only paths that share nothing, which is 2 here: both edges leaving s are used up. The
          question counts, and a flow does not count.'
      correct_tool:
        topic: '7.3'
        card: count-paths
  lookalikes:
  - description: Count the paths from s to t in a graph without cycles, or find the best one
    tool:
      topic: '7.3'
      card: count-paths
    flipping_difference: A path count lets paths share edges and adds the counts of the predecessors.
      A flow asks for the largest number of paths that fit through limited edges at the same time.
  - description: The cheapest route, or the fewest steps, from one place to another
    tool:
      topic: '4.3'
      card: dijkstra
    flipping_difference: One route with a price along it is a shortest path. Many routes that compete
      for limited edges, with no price, is a flow.
  - description: Choose edges to connect all the vertices as cheaply as possible
    tool:
      topic: '4.5'
      card: cheapest-connect
    flipping_difference: A spanning tree connects everything and pays for each edge it takes. A minimum
      cut separates two places and pays for each edge it removes; the two use the word "cut" for a different
      job.
  complexity: O(V²E) for Dinic (Theorem 7.9.4) and O(V·E²) for Edmonds–Karp (Theorem 7.9.3); the cut is
    read off after the flow in O(E).
- id: pairing
  name: Bipartite matching and König
  from_theorem: 7.9.5
  decisive_property: Items of two kinds must be paired through a list of allowed pairs (a bipartite graph),
    each item in at most one pair, and every allowed pair counts the same. Then the largest number of
    pairs is a maximum matching. Equally, the fewest rows and columns that touch every marked cell (a
    vertex cover) has the same size, and the most items with no two in conflict is the number of items
    minus that size, when all conflicts go between the two kinds.
  how_to_test: 'Split the items into two groups so that every allowed pair has one end in each: a chessboard
    colouring of a grid, rows against columns, people against jobs. Then check that no pair has a cost
    and that the lists of allowed slots have no threshold or interval shape for which a sorted pass is
    enough. For "the fewest lines" or "the most items with no conflict", check that the conflicts also
    go between the two groups.'
  constraint_shapes:
  - 'n = 500 items on each side and 1000 allowed pairs: Kuhn takes V·E = 1000 · 1000 = 10^6 steps'
  - 'A grid of 100 by 100 cells has 10^4 vertices and 2·10^4 neighbour pairs: Kuhn can reach V·E = 2·10^8
    steps, so Dinic on the unit network is used (Theorem 7.9.9: about 2·100 phases of 3·10^4 steps, 6·10^6 in all), and 2^(10^4) subsets cannot be tried'
  weak_signals:
  - form: Asks for the most pairs, dominoes or assignments when every item is used once and the allowed
      pairs are listed or given by neighbouring cells
    shape: Two groups of up to 500 items with 10^3 pairs, or a grid up to 100 by 100 coloured like a chessboard
  - form: Asks for the fewest rows and columns (guards, moves, lines) that cover every marked cell, or
      for the most cells with no two in conflict
    shape: An n by n grid with n up to 100, or a graph whose conflicts only join two groups
  - form: Asks whether everyone can be given a different slot, or how many must be dropped so that they
      can
    shape: Up to 10^4 items on each side and 10^5 allowed pairs; the answer is a yes or no, or a count
  kill_signals:
  - 'The items pair with items of the same kind (people with friends): the graph is not bipartite and
    general matching is not in this course; for three people who are all friends the doubled graph reports
    3 pairs, but only 1 pair is possible (the first negative example below)'
  - 'The question counts the ways to assign, or needs the exact set that is used: for 3 people and 3 hats
    that all fit, the matching has 3 pairs but there are 6 ways (the second negative example below)'
  - 'Every pair has a cost that matters (the assignment problem): the Hungarian algorithm is not in this
    course; for at most about 20 items a bitmask DP answers it'
  in_action:
    statement: A hall has n = 300 volunteers and 300 stations. Each volunteer lists the stations they
      can staff (at most 10 each). Can every volunteer be given a different station?
    constraints: n = 300 on each side, at most 3000 pairs.
    budget: A bitmask over 300 stations has 2^300 states. Giving each volunteer the first free station
      is O(E) but may block someone. A matching search costs V·E = 300 · 3000 = 9·10^5 steps.
    candidates:
    - tool: Give each volunteer the first free station on their list
      verdict: rejected
      because: 'It can block a later volunteer: if one volunteer lists {1, 2} and the next lists {1},
        first-fit gives station 1 to the first, and the second has nothing.'
    - tool: Bitmask DP over stations (topic 3.8)
      verdict: rejected
      because: It needs 2^300 states; it is for at most about 20 items.
    - tool: Kuhn's algorithm (this topic)
      verdict: chosen
      because: Volunteers and stations are the two sides, every pair counts the same.
    property_check: Volunteers and stations are two groups, every listed pair is one edge, nothing has
      a cost (Theorem 7.9.5), and the lists have no interval structure. Kuhn finds a largest matching
      (Theorem 7.9.6).
    decision: Run Kuhn; the answer is yes exactly when the matching has 300 pairs.
  examples:
    positive:
    - inline:
        input: 'Left items 1, 2, 3 with allowed right items 1: {a, b}, 2: {a}, 3: {a}: the largest number
          of pairs'
        answer: '2'
        why: Items 2 and 3 can only use a, so one of them is left out; item 1 takes b and one of the others
          takes a. Three pairs would need three different right items, but only a and b are used.
    - inline:
        input: 'A 3 by 3 grid with coins at (1,1), (1,2), (2,1), (3,3), and a move that empties a whole
          row or column: the fewest moves'
        answer: '3'
        why: The coins are edges between their row and their column; the largest matching has 3 edges
          (row 1 with column 2, row 2 with column 1, row 3 with column 3), so by König (Theorem 7.9.7)
          3 lines are needed and enough.
    negative:
    - inline:
        input: Three people who are all friends with each other, to be paired up
        answer: '1'
        method_gives: '3'
        why: 'The friendship graph is a triangle, which is not bipartite. Splitting every person into
          a left and a right copy and running a matching gives 3 pairs, but a real pairing of people uses
          each person once, and only 1 pair is possible. The decisive property fails: the pairs do not
          join two groups.'
      correct_tool:
        topic: '3.8'
        card: assignment-mask
    - inline:
        input: 'Three people who each like all three hats: in how many ways can they wear different hats'
        answer: '6'
        method_gives: '3'
        why: The largest matching has 3 pairs, but the question asks how many different assignments exist,
          which is 3 · 2 · 1 = 6. A matching algorithm finds one assignment, not all of them.
      correct_tool:
        topic: '3.8'
        card: assignment-mask
  lookalikes:
  - description: Pair items when the allowed partners of each item are a threshold in one sorted order,
      such as a pair that needs 2·x ≤ y
    tool:
      topic: '1.5'
      card: sorted-matching
    flipping_difference: With a threshold, walking both sorted lists with two pointers finds the largest
      number of pairs. With arbitrary lists, an early choice can block a later one, and a matching search
      is needed.
  - description: Assign jobs to the days before their deadlines, or events to days inside their intervals
    tool:
      topic: '7.5'
      card: deadline-heap
    flipping_difference: When the allowed days of every job are all days up to a deadline, the sets are
      nested and a heap greedy of topic 7.5 finds the answer. When the allowed days are arbitrary lists,
      a matching is needed.
  - description: Assign when one side has at most about 20 items and the count of ways, or an exact set,
      is needed
    tool:
      topic: '3.8'
      card: assignment-mask
    flipping_difference: A bitmask DP over the small side counts assignments or tracks which items are
      used. A matching only says how many pairs are possible and has no state for counting.
  complexity: O(V·E) for Kuhn (Theorem 7.9.6); a cover or an independent set costs one more search, O(E)
    (Theorem 7.9.7); Dinic on the unit network runs in at most O(V²E) (Theorem 7.9.4) and is much faster
    on grids.
problems:
- id: cses-1694
  role: ladder
  card: flow-or-cut
  rung: 1
  twist: 'Base case of the card: the value of a maximum flow.'
  summary: n ≤ 500 computers and m ≤ 1000 one-way connections with speeds up to 10^9; the largest total
    speed from computer 1 to computer n.
  hints:
  - Think of the speeds as widths of pipes. What limits the total that can leave computer 1?
  - The answer is the maximum flow from 1 to n (Theorem 7.9.1); run Dinic (Theorem 7.9.4).
  - 'Several connections may join the same pair of computers: add each as its own edge. The total can
    reach 10^12, so use long long.'
- id: cses-1695
  role: ladder
  card: flow-or-cut
  rung: 2
  twist: 'Recover the cut: the streets themselves, not only their number.'
  summary: n ≤ 500 crossings and m ≤ 1000 two-way streets; the fewest streets to close so that no route
    leads from crossing 1 to crossing n, and which streets.
  hints:
  - Closing a street uses up one unit. Which tool counts the fewest edges whose removal separates two
    vertices?
  - A minimum cut equals a maximum flow with capacity 1 on every edge, and a two-way street is two directed
    edges (Theorem 7.9.1).
  - After the flow, mark everything reachable from crossing 1 through edges with room left; the streets
    from a marked to an unmarked crossing are the answer.
- id: cses-1711
  role: ladder
  card: flow-or-cut
  rung: 3
  twist: 'Edge-disjoint paths: read the paths back from the flow.'
  summary: n ≤ 500 rooms and m ≤ 1000 one-way teleporters, each usable once; the largest number of routes
    from room 1 to room n that share no teleporter, and the routes.
  hints:
  - Each teleporter may be used once in the whole game. What capacity does that give it?
  - With all capacities 1, the maximum flow is the largest number of routes that share no edge (Theorem
    7.9.8, part a).
  - To print the routes, walk from room 1 along teleporters that carry flow, using each once; a walk that
    returns to a room it has left is cut at that room.
- id: cf-546E
  role: ladder
  card: flow-or-cut
  rung: 4
  twist: A transport network with two totals that must match.
  summary: n ≤ 100 cities with a_i soldiers and m ≤ 200 roads; each soldier stays or moves along one road;
    can the soldiers end with b_i in city i, and how †.
  hints:
  - 'Every soldier ends in one city: his own or a neighbour. What limits how many leave a city, and how
    many arrive in one?'
  - Source to city i with capacity a_i, city i to its own copy and to the copies of its neighbours without
    a limit, each copy to the sink with capacity b_j (Theorem 7.9.1).
  - The answer is YES exactly when the maximum flow equals both the sum of a_i and the sum of b_j; the
    moves are the flows on the middle edges.
- id: ac-abc318_g
  role: ladder
  card: flow-or-cut
  rung: 5
  twist: 'Vertices instead of edges: split each vertex in two.'
  summary: A connected undirected graph with up to 2·10^5 vertices and edges and three different vertices
    A, B, C; is there a simple path from A to C that passes through B.
  hints:
  - A simple path from A through B to C is two paths out of B, one to A and one to C. What must they not
    share?
  - 'They share no vertex except B: vertex-disjoint paths. Split every vertex into an entry and an exit
    joined by one edge of capacity 1 (Theorem 7.9.8, part b).'
  - Start the flow at B and let the sink be reached from A and from C by one edge of capacity 1 each;
    the answer is Yes exactly when the flow is 2. An undirected edge is two directed edges.
- id: ac-abc259_g
  role: ladder
  card: flow-or-cut
  rung: 6
  twist: 'Two groups with a flipped meaning: rows and columns chosen or not.'
  summary: H × W ≤ 100 × 100 cards with values up to 10^9 in absolute value; choose rows and columns;
    every card in a chosen row or column is collected, but a negative card in a chosen row and a chosen
    column is forbidden; the largest sum.
  hints:
  - Each row and each column is chosen or not. Which cards depend on both their row and their column?
  - A positive card is lost when neither of its lines is chosen; a negative card forbids both. Let the
    source side mean "chosen" for rows and "not chosen" for columns, and each of these becomes a cut edge
    between a row and a column (Theorem 7.9.2).
  - 'Answer = (sum of the positive cards) − (minimum cut). Positive card: edge column to row with capacity
    A. Negative card: an edge row to column of infinite capacity, plus |A| from the row to the sink and
    from the source to the column. Use long long and an infinity above 10^14.'
- id: ac-abc193_f
  role: ladder
  card: flow-or-cut
  rung: 7
  twist: 'Pay for separated pairs on a grid: the chessboard flip.'
  summary: An N × N grid, N ≤ 100, of black, white and unpainted cells; paint the unpainted cells to make
    the number of neighbouring pairs with different colours as large as possible.
  hints:
  - For one unpainted cell, which neighbours make black better and which make white better? Is the total
    a sum over neighbouring pairs?
  - 'Flip the colour of every cell with i + j odd: "different colours" becomes "same colour", so the goal
    is as few neighbouring pairs with different flipped colours as possible.'
  - 'That is a minimum cut (Theorem 7.9.2): black cells tied to the source and white cells to the sink
    with infinite capacity, capacity 1 in both directions between neighbours. Answer = (number of neighbouring
    pairs) − (minimum cut).'
- id: cses-1696
  role: ladder
  card: pairing
  rung: 1
  twist: 'Base case of the card: a maximum matching and its pairs.'
  summary: n ≤ 500 boys and m ≤ 500 girls with k ≤ 1000 allowed dance pairs; the largest number of pairs,
    and the pairs.
  hints:
  - Every boy dances with at most one girl and every girl with at most one boy. What kind of graph is
    this?
  - It is a bipartite graph, and the largest matching is the answer (Theorems 7.9.5 and 7.9.6). Kuhn takes
    about V·E = 10^6 steps.
  - After the run, matchOf of a girl is her boy, or none; print the pairs that have a partner.
- id: cses-1709
  role: ladder
  card: pairing
  rung: 2
  twist: 'König: the cover is the answer, and it must be printed.'
  summary: An n × n grid, n ≤ 100, with coins; one move empties a whole row or column; the fewest moves
    to empty the grid, and the moves.
  hints:
  - Each coin lies in one row and one column, and a move takes a whole line. What must the chosen lines
    do to every coin?
  - Rows and columns are the two sides and each coin is an edge; the chosen lines form a vertex cover,
    and the smallest cover has as many vertices as the largest matching has pairs (Theorem 7.9.7).
  - Find a maximum matching, mark the vertices reached by alternating paths from the unmatched rows, and
    take the unmarked rows and the marked columns.
- id: cf-1423B
  role: ladder
  card: pairing
  rung: 3
  twist: A matching test inside a binary search.
  summary: n ≤ 10^4 airports, n factories and m ≤ 10^5 possible roads, each with a number of days; join
    each factory to a different airport and make the largest number of days among the chosen roads as
    small as possible †.
  hints:
  - If a limit D on the days is fixed, which roads may be used, and how could you test whether D works?
  - For a fixed D the question is whether a perfect matching exists among the roads with at most D days
    (Theorem 7.9.5). The test only gets easier as D grows, so binary search over the sorted days (topic
    1.4).
  - With n = 10^4 and 10^5 roads, Kuhn is too slow; run Dinic on the unit network (Theorem 7.9.4). Print
    −1 if even all roads do not give a perfect matching.
- id: cf-2026E
  role: ladder
  card: pairing
  rung: 4
  twist: 'König on a graph you build: elements against bits.'
  summary: An array of n ≤ 100 numbers below 2^60; the value of a subsequence is its length minus the
    number of one bits in the OR of its elements; the largest value †.
  hints:
  - Write the value as (length) + (bits that are zero in every chosen element) − 60. What are you choosing,
    elements, bits, or both?
  - Join every element to the bits it has. Chosen elements and zero bits with no edge between them form
    an independent set, and the answer is its largest size minus 60.
  - In a bipartite graph the largest independent set has (number of vertices) − (maximum matching) vertices
    (Theorem 7.9.7), so the answer is n − (maximum matching).
- id: cf-1139E
  role: lookalike
  summary: n ≤ 5000 students in clubs, each with a potion value; for each of d days one student (given)
