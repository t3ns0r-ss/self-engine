  hints:
  - Let f(i) be the number of vertices at the distance exactly i. How is f(i) built from earlier values?
  - f(i) = the sum over the edges of f(i − d); this is a recurrence of order 100 with the counts of each
    length as the coefficients. The question asks for a sum of f(0), …, f(x).
  - 'Add the running sum as an extra coordinate (Theorem 7.6.3 (b)): a 101 × 101 matrix, raised to the
    power x + 1, gives the sum. 101^3 · 30 · 2 ≈ 6·10^7 steps.'
- id: cf-1182E
  role: ladder
  card: augmented-matrix
  rung: 2
  twist: 'The terms are multiplied, not added: take the logarithm and the exponents add, modulo p − 1.'
