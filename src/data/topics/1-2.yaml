drill:
- problem: ac-abc328_c
  answer:
    topic: '1.2'
    card: range-sum
  property: Mark each p with S_p = S_{p+1}; a query counts marks at p in [l, r − 1], a range sum of a
    fixed 0/1 array.
  why_others_fail: Scanning each query is 9·10^10 steps; nothing changes between queries, so no structure
    beyond prefix sums is needed.
- problem: ac-abc401_c
  answer:
    topic: '1.2'
    card: range-sum
  property: 'Each new term is the sum of the previous K terms, a range sum of the sequence built so far:
    keep prefix sums (mod 10^9) and take P_i − P_{i−K}.'
  why_others_fail: Adding K terms for each of N terms is 10^12 steps; there is no order to sort.
- problem: ac-abc265_d
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: Every condition is P_y − P_x = P (and so on), a lookup of one prefix value; values are positive,
    so a set of prefix sums answers "is P_x + P a prefix sum?" for every x.
  why_others_fail: Trying all (x, y, z, w) is far too many; the sums are exact values, not inequalities.
- problem: lc-matrix-block-sum
  answer:
    topic: '1.2'
    card: prefix-2d
  property: Every answer is the sum of a rectangle (clipped to the matrix) of a fixed grid, given by four
    2D prefix sums.
  why_others_fail: Summing each block directly is up to (2k+1)² per cell; 1D prefix sums alone still cost
    a loop over rows.
- problem: cses-1643
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: For each end j the best start has the smallest earlier prefix sum, so a running minimum of
    the prefix sums gives the answer in one pass.
  why_others_fail: All subarrays are 2·10^10; with negative values no counting of exact sums helps.
- problem: ac-abc125_c
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: Replacing a_i means taking the gcd of all others, the gcd of a prefix before i and a suffix
    after i; prefix and suffix gcds are built with one step each, like prefix maxima.
  why_others_fail: Recomputing the gcd of N − 1 numbers for each i is O(N²); a gcd cannot be undone like
    a sum, so prefix sums do not apply.
- problem: lc-subarray-sums-divisible-by-k
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: A subarray sum is divisible by k exactly when its two prefix sums have the same remainder,
    so count equal remainders with a map (fixing negative remainders).
  why_others_fail: All subarrays are about 4.5·10^8, and negative values rule out moving both ends forward.
- problem: cf-313B
  answer:
    topic: '1.2'
    card: range-sum
  property: Mark positions where a character equals the next one; each query is a range sum of the marks
    over [l, r − 1].
  why_others_fail: Scanning each query is up to 10^10 steps.
- problem: ac-abc365_c
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: The total Σ min(x, A_i) does not depend on the order of the A_i; sorted, the people below
    the cap are a prefix, and one scan finds where the budget runs out.
  why_others_fail: Prefix sums of the input order do not separate the people below the cap from those
    above it; that needs the values in sorted order.
- problem: ac-abc312_c
  answer:
    topic: '1.1'
    card: event-sweep
  property: The numbers of willing sellers and buyers change only at the values A_i and B_i + 1; sweeping
    these sorted values with two counters finds the first X that works.
  why_others_fail: Prices go up to 10^9, so a difference array over all prices is too large; only the
    event values matter.
- problem: lc-count-number-of-bad-pairs
  answer:
    topic: '0.6'
    card: map-counting
  property: 'j − i = nums[j] − nums[i] means nums[i] − i = nums[j] − j: count pairs with equal keys nums[i]
    − i, and subtract from all pairs.'
  why_others_fail: The pairs are any two positions, not subarrays, so no prefix sums are involved; it
    is counting by key.
lookalike_pairs:
- a: ac-abc127_c
  b: ac-abc408_c
  a_tool:
    topic: '0.3'
    card: string-processing
  b_tool:
    topic: '1.2'
    card: difference-array
  flipping_difference: A asks for walls in every interval (one intersection, max of L and min of R); B
    asks how many intervals cover each wall, which needs the full coverage counts.
  shared_surface: Both give M intervals of positions 1..N and ask about walls or positions inside them.
  flipping_input: 'N = 5 and the intervals [1, 3], [2, 5]: A, which asks for the positions in every interval,
    gets the overlap [2, 3], 2 positions; B, which needs the coverage of each position, gets 1, 2, 2,
    1, 1.'
- a: lc-shifting-letters
  b: lc-shifting-letters-ii
  a_tool:
    topic: '1.2'
    card: range-sum
  b_tool:
    topic: '1.2'
    card: difference-array
  flipping_difference: In A every shift covers a prefix, so a letter's total is a suffix sum; in B shifts
    cover arbitrary ranges in both directions, so a difference array records them.
  shared_surface: Both shift letters of a string by amounts given in a list and ask for the final string.
  flipping_input: 'A with shifts 3, 5, 9 on "abc": each shift covers a prefix, so the totals are the suffix
    sums 17, 14, 9; B with the range shifts "0..1 forward" and "1..2 backward": the totals are +1, 0,
    −1, recorded in a difference array.'
self_test:
- q: Why can prefix sums give the sum of a[l..r] but prefix maxima cannot give the maximum of a[l..r]?
    Use a = (5, 1, 2) and the range [1, 2].
  a: 'A sum can be undone: sum(1..2) = P_3 − P_1. A maximum cannot: the prefix maxima are (5, 5, 5), and
    M_3 = M_1 = 5 says nothing about max(1, 2) = 2. Prefix maxima only answer ranges that start at position
    0.'
- q: For a = (1, −1, 1, −1), count the subarrays with sum 0 using prefix sums, and check by listing them.
  a: 'P = (0, 1, 0, 1, 0). The value 0 occurs 3 times (3 pairs) and 1 occurs twice (1 pair): 4. The subarrays
    are [0, 1], [1, 2], [2, 3] and [0, 3].'
- q: For a = (3) and K = 3, what does the map-counting scan return if P_0 = 0 is not put into the map
    first?
  a: 0 instead of 1. The only subarray is [0, 0], whose prefix pair is (P_0, P_1) = (0, 3); without P_0
    in the map, P_1 − K = 0 is never found.
- q: Can the map scan of Theorem 1.2.2 count the subarrays with sum at most K? Why or why not?
  a: 'Not as it stands: the condition becomes P_i ≥ P_j − K, an inequality, and a map of exact values
    answers only equality. Counting earlier values above a bound needs the prefix values kept in order
    (later topics); for non-negative values topic 1.3 has a simpler way.'
- q: q = 2·10^5 updates "add v on [l, r]" alternate with 2·10^5 queries "print a_i". What does a difference
    array cost here, and why?
  a: Each query needs the running sum of d up to i, O(n) per query, so about 4·10^10 in total. Theorem
    1.2.3 needs all updates before the reads (offline); interleaved updates and reads need a tree structure
    from Phase 5.
- q: For the grid with rows (1, 2) and (3, 4), compute S and use the four-corner formula for the single
    cell in row 1, column 1 (0-based).
  a: 'S rows: (0, 0, 0), (0, 1, 3), (0, 4, 10). The cell is rows 1..1, columns 1..1: S_{2,2} − S_{1,2}
    − S_{2,1} + S_{1,1} = 10 − 3 − 4 + 1 = 4.'
- q: A program for the largest subarray sum starts with best = 0. What does it print for (−3, −1), and
    what should it print?
  a: It prints 0, the sum of the empty subarray, which the statement does not allow; the answer is −1.
    Start best at the smallest possible value (or at a_0) and update it before the current prefix sum
    becomes a possible start.
checkpoint:
  time_limit_minutes: 90
  problems:
  - ac-abc233_d
  - ac-abc388_d
  - ac-abc366_d
decision_map:
- weak_signal: Many queries asking for the sum or count over a range [l, r] of a fixed array or string
  choose: range-sum
  when: Nothing changes between queries and the quantity is a sum or a count (Theorem 1.2.1).
  over:
  - card: direct-simulation
    because: Scanning each range is O(n) per query, 4·10^10 for n = q = 2·10^5.
    topic: '0.3'
  - card: ordered-set-lookup
    because: A set finds the positions near a bound, but counting how many lie between two bounds is not
      one of its fast operations.
    topic: '0.6'
- weak_signal: Count the segments (subarrays, substrings) that satisfy a condition
  choose: prefix-count-lookup
  when: The condition is an exact sum, a sum divisible by k, or a balance of two kinds, i.e. a condition
    on the pair (P_l, P_{r+1}) alone; values may be negative (Theorem 1.2.2).
  over:
  - card: nested-loops
    because: All subarrays are n²/2, about 2·10^10.
    topic: '0.5'
  - card: map-counting
    because: Counting equal keys of the elements counts pairs of positions; subarrays need equal keys
      of the prefix sums.
    topic: '0.6'
- weak_signal: '"Add v to every element from l to r" many times, then print the array; coverage counts
    on a short line'
  choose: difference-array
  when: All updates come before the reads and the positions fit in an array (Theorem 1.2.3).
  over:
  - card: direct-simulation
    because: Applying each update element by element is O(n) per update.
    topic: '0.3'
  - card: event-sweep
    because: Events need a sort; when positions are small, an array indexed by position does the same
      job without sorting. Keep the sweep for coordinates up to 10^9.
    topic: '1.1'
- weak_signal: Input is H lines of W characters; neighbours, directions, walking until a wall
  choose: prefix-2d
  when: The questions are sums or counts over many axis-parallel rectangles of a grid that does not change.
  over:
  - card: grid-processing
    because: Counting each rectangle cell by cell costs its area per query.
    topic: '0.3'
