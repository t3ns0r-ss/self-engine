decision_map:
- weak_signal: Count the groups of linked items, or ask what a start can reach (links given as pairs)
  choose: components
  when: The links work both ways and are listed (or each item has few neighbours); one walk per group,
    or one walk from the start (Theorems 4.1.1, 4.1.2).
  over:
  - card: map-counting
    because: If every item carries a key that decides its group, a map from key to group is enough.
    topic: '0.6'
  - card: sort-then-scan
    because: If the links are implied by overlap of ranges and could number n², sort the ranges and scan.
    topic: '1.1'
- weak_signal: Fewest moves, roads or jumps from A to B (a graph where each step is one move)
  choose: unweighted-shortest
  when: Every edge costs the same; walk from the start with a queue and keep the parents to print the
    route (Theorem 4.1.3).
  over:
  - card: left-to-right-forced
    because: If all jumps go forward along a line, always jumping as far as possible is forced and needs
      no walk.
    topic: '1.5'
  - card: linear-state
    because: If moves go forward only but cost different amounts, a table over the positions gives the
      cheapest way.
    topic: '3.2'
- weak_signal: 'A map of cells: rooms, islands, enclosed regions, fewest steps from S to T'
  choose: grid-graph
  when: The same few moves from every cell, and the answer depends on the cell only (Theorem 4.1.5).
  over:
  - card: grid-paths
    because: If the question asks to count right/down routes, fill a table cell by cell instead of walking.
    topic: '3.5'
  - card: constraint-placement
    because: 'If a route may not reuse a cell, the choices depend on the path so far: backtrack.'
    topic: '3.1'
- weak_signal: For every cell, the distance to the nearest fire, exit, monster or marked cell; who gets
    there first
  choose: multi-source
  when: All sources start together at time 0 and every step costs one; put all of them in the queue (Theorem
    4.1.4).
  over:
  - card: sorted-search
    because: If the points lie on a sorted line, the nearest one is found by binary search.
    topic: '1.4'
  - card: enumerate-answer
    because: If a handful of sources start at different times, take the least of (start time + distance)
      over the sources.
    topic: '0.5'
- weak_signal: Fewest operations to turn A into B in a small puzzle (numbers, strings, locks, boards,
    extra information on a grid)
  choose: state-graph
  when: The state holds everything that matters, every move costs one, and the reachable states fit in
    the limits (Theorem 4.1.6).
  over:
  - card: generate-all
    because: If every solution is wanted, or whether one exists in a huge space, backtrack with pruning.
    topic: '3.1'
  - card: sequence-counting
    because: If the question asks for the number of ways to do something in k moves, a counting table
      is needed.
    topic: '3.5'
  - card: linear-state
    because: If moves go forward only and cost different amounts, a table over the states is enough.
    topic: '3.2'
