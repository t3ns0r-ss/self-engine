decision_map:
- weak_signal: The most that can be sent from a source to a sink, the fewest edges or vertices to remove
    to separate two places, paths that share nothing, or two sides with a cost for each item and a penalty
    for each separated pair
  choose: flow-or-cut
  when: Capacities and penalties are non-negative integers, nothing is charged per unit sent, and the
    network has at most about 10^5 edges (Theorems 7.9.1 and 7.9.2).
  over:
  - topic: '4.3'
    card: dijkstra
    because: If only one route is needed and the numbers are prices along it, a shortest path answers
      it.
  - topic: '7.3'
    card: count-paths
    because: If the question counts all paths, which may share edges, a DP over a graph without cycles
      counts them.
  - topic: '4.5'
    card: cheapest-connect
    because: If the goal is to connect all the vertices as cheaply as possible, a spanning tree answers
      it.
- weak_signal: Pairs, dominoes or assignments with every item used once and a list of allowed pairs; the
    fewest rows and columns that cover the marked cells; the most items with no two in conflict
  choose: pairing
  when: The allowed pairs join two groups, no pair has a cost, and the lists have no threshold or interval
    shape (Theorems 7.9.5 to 7.9.7).
  over:
  - topic: '1.5'
    card: sorted-matching
    because: If a pair is allowed by a threshold in one sorted order, two sorted lists are walked with
      two pointers.
  - topic: '7.5'
    card: deadline-heap
    because: If every job may go to any slot up to its deadline, the allowed sets are nested and a heap
      greedy answers it.
  - topic: '3.8'
    card: assignment-mask
    because: If one side has at most about 20 items, or the count of the ways is asked, a bitmask DP over
      the used items answers it.
