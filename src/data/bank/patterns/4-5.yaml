# Patterns for topic 4.5 (Tree properties, subtree sizes, diameter, centre, Euler tour). Provisional until the lesson maps them to Recognition Cards.
topic: "4.5"
patterns:
  - id: subtree-aggregate
    name: Subtree sizes and sums
    description: Compute the size, sum, or count of something in every subtree with one traversal from the root.
    precondition: A subtree's value is combined from its children's subtree values.
  - id: diameter
    name: Longest path in a tree
    description: "Find the diameter by two traversals: the farthest vertex from any vertex, then the farthest from that one."
    precondition: Edge weights are non-negative, so the farthest vertex from any vertex is an endpoint of some diameter.
  - id: farthest-from-each
    name: Farthest vertex for every vertex
    description: Every vertex's eccentricity equals its distance to one of the two diameter endpoints; the centre lies on the diameter.
    precondition: "Same as the diameter: weights are non-negative, so a farthest vertex is always a diameter endpoint."
  - id: euler-tour
    name: Subtrees as ranges
    description: Number vertices in traversal order so each subtree is a contiguous range [tin, tout]; ancestor test by range containment.
    precondition: A depth-first traversal visits a whole subtree before leaving it.
  - id: depth-parent
    name: Depths, parents, levels
    description: Compute depths, parents, and counts per level of a rooted tree, and answer questions using them.
    precondition: A rooted tree has exactly one path from the root to each vertex.
