- id: cf-1462C
  role: drill
  summary: For x ≤ 50, the smallest positive integer whose digits are all different and add up to x, or
    −1.
- id: lc-combination-sum-iii
  role: drill
  summary: List every set of k distinct digits from 1..9 whose sum is n (n ≤ 60).
- id: lc-maximum-rows-covered-by-columns
  role: drill
  summary: Choose exactly numSelect of n ≤ 12 columns of a 0/1 matrix (m ≤ 12 rows) to maximise the number
