# Patterns for topic 4.2 (Bipartiteness, cycle detection, topological sort). Provisional until the lesson maps them to Recognition Cards.
topic: "4.2"
patterns:
  - id: two-colouring
    name: Two-colouring
    description: Split vertices into two sides with every edge crossing, or report impossible.
    precondition: A graph can be two-coloured exactly when it has no cycle of odd length.
  - id: directed-cycle
    name: Cycles in directed graphs
    description: Detect a directed cycle, or output one, using vertex states (unvisited, on stack, finished).
    precondition: A directed graph has a cycle exactly when a depth-first traversal meets an edge to a vertex still on the stack.
  - id: dependency-order
    name: Order respecting dependencies
    description: Order tasks so every prerequisite comes first, or report that it is impossible.
    precondition: The dependency graph has no directed cycle.
  - id: smallest-order
    name: Lexicographically smallest order
    description: Among valid dependency orders, output the lexicographically smallest one, using a min-heap of available vertices.
    precondition: The graph has no directed cycle, and taking the smallest available vertex never blocks a smaller choice later.
  - id: undirected-cycle
    name: Cycles in undirected graphs
    description: Detect or output a cycle in an undirected graph from a non-tree edge of a traversal.
    precondition: An undirected graph has a cycle exactly when a traversal meets an already visited vertex other than its parent.
