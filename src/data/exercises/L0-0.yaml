- id: r-6
  role: drill
  type: recognise
  title: A lock on a 25-line function
  prompt: A lock must be released on every return path of a 25-line function that has four of them.
  answer:
    kind: card
    card: *id001
    property: 'A scoped hold: lock in the constructor, unlock in the destructor.'
    why_others_fail: Four hand-written unlocks must all stay correct when a fifth return is added.
  checkers: []
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: cp-1
  role: checkpoint
  type: build
  title: Wrap a temporary file so it is always deleted
  prompt: 'Build TempFile in 45 minutes (see exercises/L0.0/cp-1). It creates an empty file in the temporary directory, deletes it when its owner goes away on every way out of the scope, can be moved but not copied, and a moved-from object must not delete the file the new owner still uses. Add a short decision record: which way out of the scope would a hand-written delete have missed?'
  card: raii
  clarifying:
  - q: Where is the file created and how is it named?
    a: In the system temporary directory, with the name the caller passes.
    critical: false
  - q: What should happen if the file cannot be created?
    a: The constructor throws std::runtime_error.
    critical: true
  - q: Can a TempFile be copied?
    a: No. It can be moved; the new owner then owns the file.
    critical: true
  - q: May the destructor throw if the delete fails?
    a: No. A destructor must not throw; ignore the error.
    critical: true
  - q: Does write replace or append?
    a: Append.
    critical: false
  checkers:
  - kind: kit
    path: L0.0/cp-1
  - kind: rubric
    id: rubric-lld-build-v1
  reference: reference/L0.0/cp-1
  time_limit_minutes: 45
  techniques:
  - L0.0
  checked_on: '2026-10-19'
