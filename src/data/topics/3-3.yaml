# Topic 3.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.3"
draft: true
cards:
  - id: zero-one
    name: Each item at most once
    decisive_property: "Each item is taken or not, independently of the others except through one total (weight, cost, size), and either that total's capacity or the sum of the values is small enough to index; then best[items][capacity] (or the least weight for each exact value) loses nothing."
    from_theorem: Theorem 3.3.1
    how_to_test: "Check that no item excludes or requires another, find the one total that is bounded, and compare n·W with n·(sum of values): index the table by whichever is small (Theorem 3.3.2 for values)."
    weak_signals:
      - "Choose items with a cost and a gain under a budget, each item once"
      - "n up to 100–1000 and a capacity up to 10^5, or weights up to 10^9 with small values"
      - "Two quantities per item, one bounded and one maximised"
    kill_signals:
      - "Items can be split or taken fractionally (greedy by ratio, 1.5)"
      - "Capacity and values are both huge but n ≤ 40 (meet in the middle, 3.1)"
    lookalikes:
      - description: "Fill a knapsack with divisible goods (any fraction of an item) to maximise value"
        needs: "extreme-first (1.5)"
        flipping_difference: "Fractions remove the all-or-nothing choice, so taking the best value per weight first is optimal; whole items need the table."
    complexity: "O(n·W) time and O(W) memory with one row; O(n·V) when indexed by value."
  - id: unbounded
    name: Unlimited copies
    decisive_property: "Every item (coin, piece length, attack) may be used any number of times, so after taking one copy the same item is still available; one row with the capacity loop running upwards reads the current row and is correct. For counts, the items loop is outside when the order of the parts does not matter."
    from_theorem: Theorem 3.3.3
    how_to_test: "Check that copies are unlimited; for a count, decide whether 1 + 2 and 2 + 1 are the same solution (item loop outside) or different (capacity loop outside)."
    weak_signals:
      - "Coins of given values, as many of each as needed: fewest coins or number of ways"
      - "Cut a rod or ribbon into pieces of given lengths; spells with a damage and a cost, cast any number of times"
      - "Total up to 10^4–10^6"
    kill_signals:
      - "Each item may be used at most once (downward loop, 0/1)"
      - "The coin system is canonical (1, 5, 10, 25) and a greedy proof exists (1.5)"
    lookalikes:
      - description: "The fewest coins of values 1, 5, 10 and 25 for an amount up to 10^18"
        needs: "extreme-first (1.5)"
        flipping_difference: "For these coin values the greedy is provably optimal, so a huge amount is no problem; with arbitrary coin values the table over amounts is needed and the amount must be small."
    complexity: "O(n·W)."
  - id: subset-sums
    name: Which totals are reachable
    decisive_property: "The question is only which sums (or how many subsets for each sum) can be formed from numbers each used once, and the range of sums is small; the row of reachable sums, updated downwards or with a bitset shift, answers it."
    from_theorem: Theorem 3.3.4
    how_to_test: "Bound the largest relevant sum S and check that n·S (or n·S/64 with a bitset) fits; check whether a count, a yes/no, or the closest reachable sum is asked."
    weak_signals:
      - "Split items into two groups with sums as equal as possible, or with equal sums"
      - "Can exactly X be reached by choosing one of two moves per step"
      - "Counts of subsets with a given sum, modulo a prime"
    kill_signals:
      - "The sums are huge but n ≤ 40 (meet in the middle, 3.1)"
      - "Only the number of elements matters, not their values"
    lookalikes:
      - description: "Split n ≤ 40 numbers up to 10^9 into two groups with sums as close as possible"
        needs: "meet-in-middle (3.1)"
        flipping_difference: "Sums up to 4·10^10 cannot be indexed; with n ≤ 40, two lists of 2^20 half-sums do the job instead."
    complexity: "O(n·S), or O(n·S/64) with a bitset."
  - id: bounded
    name: Limited copies
    decisive_property: "Item i may be taken up to c_i times, copies of one item are interchangeable, and splitting c_i into bundles 1, 2, 4, … plus a remainder lets the 0/1 table choose every count from 0 to c_i and nothing more."
    from_theorem: Theorem 3.3.5
    how_to_test: "Check that only the number of copies taken matters, compute Σ log c_i, and check that W·Σ log c_i fits; for counts of ways, split by the number of copies instead (each count once)."
    weak_signals:
      - "Each kind of coin, book or item comes in a given number of copies"
      - "Recipes or buns with limited ingredients"
      - "c_i up to 1000 and capacity up to 10^5"
    kill_signals:
      - "All c_i are 1 (plain 0/1) or unlimited (unbounded)"
      - "Counting ways where bundles would count a choice several times: loop over the number of copies instead"
    lookalikes:
      - description: "Pay an amount with coins of given values, each available in unlimited supply"
        needs: "unbounded (3.3)"
        flipping_difference: "With no limit on copies the upward loop already allows any count; bundles are needed only when the count is capped."
    complexity: "O(W · Σ log c_i)."
problems:
  - id: cses-1158
    role: worked_example
    summary: Buy books (each at most once, n ≤ 1000, prices and pages ≤ 1000) with total price at most
      x ≤ 10^5, maximising the pages.
  - id: cses-1093
    role: worked_example
    summary: Count the ways to divide 1, 2, …, n (n ≤ 500) into two sets with equal sums, modulo 10^9
      + 7.
  - id: lc-ones-and-zeroes
    role: ladder
    card: zero-one
    rung: 1
    twist: Base case of the card
    summary: Choose the most strings (up to 600 binary strings) so that together they contain at most
      m zeros and at most n ones (m, n ≤ 100).
    hints:
      - What plays the role of the weight here, and how many weights does each string have?
      - 'Two weights: its zeros and its ones. The table has two capacity indices, best[a][b] = most strings
        with at most a zeros and b ones (Theorem 3.3.1 with a pair as the capacity).'
      - For each string, loop a and b both downwards and set best[a][b] = max(best[a][b], best[a − zeros][b
        − ones] + 1); print best[m][n].
  - id: ac-abc317_d
    role: ladder
    card: zero-one
    rung: 2
    twist: Minimise the cost of reaching at least a target instead of maximising a value under a capacity.
    summary: Win more than half of the seats of N ≤ 100 districts (total seats ≤ 10^5) by converting voters;
      district i needs a known number of voters to switch. The fewest voters.
    hints:
      - For one district, how many voters must switch, and what does winning it give?
      - Winning district i costs max(0, ⌈(Y_i − X_i)/2⌉) voters and gives Z_i seats. minCost[s] = fewest
        voters to win exactly s seats, a 0/1 table over seats.
      - Fill minCost over seats 0..ΣZ with ∞ for impossible, downwards per district; the answer is the
        minimum of minCost[s] over s > ΣZ/2. Use long long.
  - id: lc-tallest-billboard
    role: ladder
    card: zero-one
    rung: 3
    twist: The index is the difference between two sides, and each item has three choices (left, right,
      or unused).
    summary: Weld up to 20 rods (total length ≤ 5000) into two supports of equal height; the largest possible
      height (0 if none).
    hints:
      - Instead of the two heights, what single number describes how far a partial solution is from being
        balanced?
      - The difference d between the taller and shorter side. Keep best[d] = the largest shorter side
        for that difference; a rod goes to the taller side, to the shorter side, or nowhere.
      - 'Start with best[0] = 0, others −∞; for each rod, build a new row from the old: d + r (taller
        side), |d − r| with the shorter side growing by min(d, r), or unchanged. Answer best[0].'
  - id: ac-abc364_e
    role: ladder
    card: zero-one
    rung: 4
    twist: The number of items eaten becomes an index, and one of the two capacities becomes the stored
      value.
    summary: Order N ≤ 80 dishes so that the total sweetness stays ≤ X and saltiness ≤ Y (≤ 10^4) for
      as long as possible; he stops after the first dish that exceeds a limit. The most dishes eaten.
    hints:
      - He eats a subset that fits both limits, then one more dish. What do you need to know about a subset
        to decide whether it fits?
      - 'Its size, its sweetness and its saltiness. Index two of them and minimise the third: minSalt[k][a]
        = least saltiness of k dishes with sweetness exactly a ≤ X.'
      - Fill minSalt with ∞, minSalt[0][0] = 0, downwards in k and a for each dish (O(N²X)); find the
        largest k with some minSalt[k][a] ≤ Y; print min(N, k + 1).
  - id: ac-abc169_f
    role: ladder
    card: zero-one
    rung: 5
    twist: Counting instead of maximising, and each item has three roles (in U, in T only, or outside
      T).
    summary: Sum over all subsets T of 1..N (N, S ≤ 3000) of the number of subsets U of T with sum S,
      modulo 998244353.
    hints:
      - Count the pairs (T, U) with U ⊆ T and sum(U) = S. What can each element do?
      - 'Be in U (adds a_i to the sum), be in T but not in U, or be outside T: the last two keep the sum.
        So cnt[s] becomes 2·cnt[s] + cnt[s − a_i].'
      - cnt[0] = 1; for each a_i, update s downwards with cnt[s] = 2·cnt[s] + cnt[s − a_i] (mod p); print
        cnt[S].
  - id: ac-abc159_f
    role: ladder
    card: zero-one
    rung: 6
    twist: Each chosen set is weighted by how many segments [L, R] contain it, which depends on its first
      and last elements.
    summary: For all segments [L, R] of an array (N, S ≤ 3000), count the subsets of the segment with
      sum S; print the total over all segments modulo 998244353.
    hints:
      - A subset with first index x and last index y lies in how many segments?
      - x · (N − y + 1). So give a subset the weight x when it starts at x, and multiply by (N − y + 1) when it ends at y.
      - 'For each i (1-based): add 1 to cnt[0], so that cnt[0] = i (the left end L can be any of 1..i); add cnt[S − a_i] · (N − i + 1) to the answer (the subsets with sum S whose last element is i); then update cnt[s] += cnt[s − a_i] for s downwards. Check it by hand with N = 2.'
  - id: lc-coin-change
    role: ladder
    card: unbounded
    rung: 1
    twist: Base case of the card
    summary: The fewest coins (unlimited supply, up to 12 coin values) that make an amount ≤ 10^4, or
      −1.
    hints:
      - After using one coin of value c, is that coin still available?
      - 'Yes, so the upward loop is right: fewest[x] = min over coins c ≤ x of fewest[x − c] + 1 (Theorem
        3.3.3).'
      - fewest[0] = 0, others ∞; fill x upwards; print −1 if fewest[amount] is still ∞.
  - id: lc-coin-change-ii
    role: ladder
    card: unbounded
    rung: 2
    twist: Count the ways, where 1 + 2 and 2 + 1 are the same way.
    summary: Count the multisets of coins (up to 300 values, unlimited supply) that make an amount ≤ 5000.
    hints:
      - Which loop must be outside so that each multiset is counted once?
      - 'The coins: then every combination is built in the order of the coin list, once (Theorem 3.3.3,
        note 2).'
      - ways[0] = 1; for each coin c, for x from c upwards, ways[x] += ways[x − c].
  - id: cf-189A
    role: ladder
    card: unbounded
    rung: 3
    twist: The total must be exactly n and the number of pieces is maximised, with unreachable totals
      marked.
    summary: Cut a ribbon of length n ≤ 4000 into pieces of lengths a, b or c only, maximising the number
      of pieces (a cut is guaranteed to exist).
    hints:
      - Which totals can be cut exactly, and how do you keep the others from being used?
      - best[x] = most pieces summing to exactly x; best[0] = 0 and −∞ for totals that cannot be made,
        so they never feed a later total.
      - For x from 1 to n, best[x] = max over the lengths l ≤ x with best[x − l] ≠ −∞ of best[x − l] +
        1; print best[n].
  - id: ac-abc099_c
    role: ladder
    card: unbounded
    rung: 4
    twist: The items are generated from the statement (1 and powers of 6 and 9), and the obvious greedy
      is wrong.
    summary: Withdraw exactly N ≤ 10^5 yen when one withdrawal can be 1 yen, a power of 6 or a power of
      9; the fewest withdrawals.
    hints:
      - Try the greedy "largest allowed amount first" on N = 12. Is it optimal?
      - 'No: greedy takes 9 + 1 + 1 + 1 (4 withdrawals), but 6 + 6 needs 2. The amounts are unlimited
        items, so use the coin table over 0..N.'
      - List the items 1, 6, 36, …, 9, 81, … up to N; fewest[x] = 1 + min over items ≤ x of fewest[x −
        item].
  - id: lc-partition-equal-subset-sum
    role: ladder
    card: subset-sums
    rung: 1
    twist: Base case of the card
    summary: Can an array of up to 200 numbers (each ≤ 100) be split into two groups with equal sums?
    hints:
      - If the total is T, what must one group sum to?
      - Exactly T/2 (and T must be even). So the question is whether T/2 is a reachable subset sum (Theorem
        3.3.4).
      - reach[0] = true; for each number, update s downwards from T/2 (or reach |= reach << a); answer
        reach[T/2].
  - id: ac-abc274_d
    role: ladder
    card: subset-sums
    rung: 2
    twist: Each number gets a sign, and the numbers split into two independent problems (x moves and y
      moves).
    summary: A robot arm has N ≤ 1000 segments (lengths ≤ 10) that alternate between horizontal and vertical,
      each turning 90° either way; can its tip reach (x, y)? The first segment points right.
    hints:
      - What freedom does each segment have, once you look at the axis it moves along?
      - Every segment after the first moves + or − along its axis, independently of the others. So x is
        a signed sum of the odd segments (the first fixed to +) and y of the even ones.
      - Solve two reachability problems with sums offset by 10^4 to allow negatives; print Yes if x and
        y are both reachable.
  - id: ac-abc281_d
    role: ladder
    card: subset-sums
    rung: 3
    twist: The table is indexed by the count of chosen items and the sum modulo D, and stores the largest
      sum.
    summary: Choose exactly K of N ≤ 100 numbers (≤ 10^9) so that their sum is a multiple of D ≤ 100;
      the largest such sum, or −1.
    hints:
      - The sum is up to 10^11. What do you really need to know about it while choosing?
      - Only its remainder modulo D, and how many numbers were chosen. Store best[j][r] = the largest
        sum of j chosen numbers with remainder r.
      - best[0][0] = 0, others −1; for each number, update j downwards with best[j + 1][(r + a) mod D]
        = max(…, best[j][r] + a); print best[K][0].
  - id: cf-1637D
    role: ladder
    card: subset-sums
    rung: 4
    twist: 'Algebra first: the cost only depends on one sum, and then the problem is choosing which reachable
      sum is best.'
    summary: Two arrays of n ≤ 100 values (≤ 100); you may swap a_i with b_i for any i. Minimise Σ over
      pairs i < j of (a_i + a_j)² + (b_i + b_j)².
    hints:
      - Expand the sum of squares over pairs. Which parts change when you swap a_i and b_i?
      - Only (Σa)² + (Σb)² changes; the squares of the single values are fixed. With Σa + Σb = T fixed,
        choose for each i whether a_i or b_i joins A, and minimise sA² + (T − sA)² over reachable sA.
      - reach over sums ≤ 10^4 where each index adds a_i or b_i (exactly one of them); evaluate every
        reachable sA and add the fixed part.
  - id: ac-abc286_d
    role: ladder
    card: bounded
    rung: 1
    twist: Base case of the card
    summary: N ≤ 50 kinds of coins, A_i yen each with B_i ≤ 50 coins of each kind; can you pay exactly
      X ≤ 10^4 yen?
    hints:
      - How many ways are there to use coin kind i, and how expensive is trying them all?
      - 'Use 0..B_i coins of kind i: trying every count for every amount is X·ΣB ≈ 2.5·10^7, which fits;
        bundles of 1, 2, 4, … (Theorem 3.3.5) are faster.'
      - reach[0] = true; for each kind, either loop over the count for each amount (from a copy of the
        old row) or add the bundles with the 0/1 loop; print Yes if reach[X].
  - id: cses-1159
    role: ladder
    card: bounded
    rung: 2
    twist: 'Counts up to 1000 copies and a capacity of 10^5: trying every count is 10^10, so the bundles
      are needed.'
    summary: 'Book Shop with copies: n ≤ 100 books with prices, pages and up to 1000 copies each; total
      price at most x ≤ 10^5, maximise the pages.'
    hints:
      - How many items does a book with k copies become if you split it into bundles?
      - About log₂ k + 1 bundles (1, 2, 4, …, remainder), each a 0/1 item. With k ≤ 1000 that is at most
        10 items per book (Theorem 3.3.5).
      - 'The limited-copies template of Section 6: split, then the downward loop for each bundle; about
        10^8 steps.'
  - id: lc-number-of-ways-to-earn-points
    role: ladder
    card: bounded
    rung: 3
    twist: 'Counting instead of maximising: the bundles would count the same number of copies in several
      ways, so loop over the count of each type instead.'
    summary: Count the ways to score exactly target ≤ 1000 points with up to 50 question types, each with
      a count ≤ 50 and a mark; questions of one type are identical. Modulo 10^9 + 7.
    hints:
      - If you split a type into bundles, can the same number of questions be formed in two ways?
      - 'Yes: with 10 questions the bundles are 1, 2, 4 and 3, and taking 3 questions can be the bundles 1 + 2 or the bundle 3, so the count would be doubled. Loop over the number k of questions taken from each type instead (types outside, so the order of the questions does not matter).'
      - For each type, new[x] = Σ over k = 0..count with k·marks ≤ x of old[x − k·marks]; O(target · Σcount)
        = 2.5·10^6.
  - id: lc-perfect-squares
    role: drill
    summary: The fewest perfect squares that add up to n ≤ 10^4.
  - id: lc-combination-sum-iv
    role: drill
    summary: Count the ordered sequences of numbers from a set of up to 200 distinct values (each ≤ 1000,
      unlimited use) that add up to target ≤ 1000.
  - id: cses-1634
    role: drill
    summary: The fewest coins (n ≤ 100 values up to 10^6, unlimited supply) that make x ≤ 10^6, or −1.
  - id: cses-1745
    role: drill
    summary: List every sum (in increasing order) that can be formed from some non-empty subset of n ≤
      100 coins with values ≤ 1000.
  - id: ac-abc240_c
    role: drill
    summary: Make N ≤ 100 jumps, the i-th of length a_i or b_i (≤ 100); can the total be exactly X ≤ 10^4?
  - id: lc-ways-to-express-an-integer-as-sum-of-powers
    role: drill
    summary: Count the sets of distinct positive integers whose x-th powers (x ≤ 5) add up to n ≤ 300,
      modulo 10^9 + 7.
  - id: ac-abc289_d
    role: drill
    summary: A robot climbs from step 0 by moves of A_1..A_N steps (N ≤ 10); traps lie on M given steps
      (≤ 10^5); can it stand exactly on step X ≤ 10^5?
  - id: ac-abc118_d
    role: drill
    summary: With exactly N ≤ 10^4 matchsticks, write the largest integer using only allowed digits (each
      digit costs its number of sticks).
  - id: lc-maximum-ice-cream-bars
    role: drill
    summary: Buy as many ice cream bars as possible (n ≤ 10^5, costs ≤ 10^5) with at most 10^8 coins.
  - id: lc-closest-dessert-cost
    role: drill
    summary: Choose one of n ≤ 10 bases and 0, 1 or 2 of each of m ≤ 10 toppings (costs ≤ 10^4) to get
      as close as possible to target ≤ 10^4.
  - id: ac-dp_d
    role: lookalike
    summary: N ≤ 100 items with weights w_i ≤ W ≤ 10^5 and values up to 10^9; the largest total value
      within weight W.
  - id: ac-dp_e
    role: lookalike
    summary: N ≤ 100 items with weights up to W ≤ 10^9 and values up to 10^3; the largest total value
      within weight W.
  - id: cses-1635
    role: lookalike
    summary: Count the ordered ways to make x ≤ 10^6 from n ≤ 100 coin values (unlimited supply), modulo
      10^9 + 7.
  - id: cses-1636
    role: lookalike
    summary: Count the ways to make x ≤ 10^6 from n ≤ 100 coin values (unlimited supply) when the order
      of the coins does not matter, modulo 10^9 + 7.
drill:
  - problem: lc-perfect-squares
    answer_card: unbounded
    answer_topic: '3.3'
    property: 'Each square may be used any number of times and the total is small: fewest[x] = 1 + min
      over squares q ≤ x of fewest[x − q], with the upward loop.'
    why_others_fail: 'Greedy "largest square first" fails: 12 = 9 + 1 + 1 + 1 (4) but 4 + 4 + 4 (3).'
  - problem: lc-combination-sum-iv
    answer_card: unbounded
    answer_topic: '3.3'
    property: Unlimited copies with a small total, and here 1 + 2 and 2 + 1 are different, so the amount
      loop is outside and every number is tried as the last one (Theorem 3.3.3, note 2).
    why_others_fail: With the items outside, the table counts multisets and misses the orders; listing
      the sequences (3.1) is exponential.
  - problem: cses-1634
    answer_card: unbounded
    answer_topic: '3.3'
    property: 'Unlimited copies and a total up to 10^6: the coin table over amounts, upward loop, with
      −1 for unreachable totals.'
    why_others_fail: Greedy by the largest coin fails for coins such as {1, 3, 4} and x = 6 (4 + 1 + 1
      against 3 + 3).
  - problem: cses-1745
    answer_card: subset-sums
    answer_topic: '3.3'
    property: 'Each coin is used at most once and all sums are at most 10^5: the reachable-sums row (or
      a bitset) built downwards gives every sum.'
    why_others_fail: Bitmasks over 2^100 subsets are impossible; the unbounded upward loop would reuse
      coins.
  - problem: ac-abc240_c
    answer_card: subset-sums
    answer_topic: '3.3'
    property: 'Every jump contributes exactly one of two values and the totals are at most 10^4: the set
      of reachable totals after i jumps, updated from the previous set, decides it.'
    why_others_fail: Trying all 2^100 choices is impossible; a greedy choice per jump cannot see whether
      X stays reachable.
  - problem: lc-ways-to-express-an-integer-as-sum-of-powers
    answer_card: subset-sums
    answer_topic: '3.3'
    property: 'The candidates k^x ≤ n are each used at most once and n is small: count subsets by their
      sum with the downward loop.'
    why_others_fail: The upward loop would allow 1^x + 1^x, a repeated integer; listing the sets (3.1)
      is possible but slower and gives no count modulo a prime directly.
  - problem: ac-abc289_d
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'Whether step x can be reached depends only on x: ok[x] = not a trap and ok[x − A_i] for
      some i, filled upwards. No capacity or value, just reachability of positions.'
    why_others_fail: Thinking of the moves as coins with a total X works too, but the traps make it a
      plain table over positions, the one-index state of 3.2.
  - problem: ac-abc118_d
    answer_card: reconstruct
    answer_topic: '3.2'
    property: best[n] = the most digits using exactly n sticks; the answer has best[N] digits and is rebuilt
      greedily from the front, taking the largest digit that keeps best[remaining] = best[current] − 1
      (Theorem 3.2.6).
    why_others_fail: A knapsack value table cannot compare whole numbers as values; the length table plus
      the greedy walk is what decides the largest number.
  - problem: lc-maximum-ice-cream-bars
    answer_card: extreme-first
    answer_topic: '1.5'
    property: 'Every bar counts the same, so the cheapest bars first is optimal: replacing a bought bar
      by a cheaper unbought one never hurts.'
    why_others_fail: A 0/1 knapsack over 10^8 coins is far too large, and it is not needed when all values
      are equal.
  - problem: lc-closest-dessert-cost
    answer_card: recursive-choices
    answer_topic: '0.5'
    property: With m ≤ 10 toppings and 3 choices each, there are 3^10 ≈ 6·10^4 combinations per base,
      few enough to try all by recursion.
    why_others_fail: A bounded knapsack table also works, but trying every combination is simpler and
      fast enough.
lookalike_pairs:
  - a: ac-dp_d
    b: ac-dp_e
    a_tool: 'zero-one (3.3): best value for each capacity, W ≤ 10^5 columns'
    b_tool: 'zero-one (3.3), indexed by value: least weight for each total value, at most 10^5 columns'
    flipping_difference: The same 0/1 knapsack; only the bounds differ. In A the capacity is small, so
      it indexes the table. In B the capacity is 10^9 but the values add up to at most 10^5, so the roles
      swap (Theorem 3.3.2).
  - a: cses-1635
    b: cses-1636
    a_tool: 'unbounded (3.3) with the amount loop outside: ordered sequences'
    b_tool: 'unbounded (3.3) with the coin loop outside: multisets'
    flipping_difference: Both count ways to pay x with unlimited coins. A counts 2 + 3 and 3 + 2 separately,
      so each amount is split by its last coin (amounts outside). B counts each collection once, so the
      coins are added in a fixed order (coins outside).
self_test: []
checkpoint:
