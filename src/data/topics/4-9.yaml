# Topic 4.9 data file (CURRICULUM_GAPS_PLAN.md Section 5.1, S5). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '4.9'
uses:
- topic: '0.1'
  what: 'Overflow: distances that pass $2 \cdot 10^9$ need `long long`'
- topic: '0.2'
  what: 'Complexity: states times moves against a budget of about $10^8$ steps'
- topic: '0.5'
  what: 'Brute force: the reference solutions in the tests, and trying every order'
- topic: '0.4'
  what: 'Remainders modulo a number: the remainder is part of the state in one drill problem'
- topic: '0.6'
  what: 'Queue, map and priority queue: the containers of the searches'
- topic: '1.7'
  what: 'Bits: a set of at most 20 items stored in the bits of an integer, with OR and exclusive or'
- topic: '3.1'
  what: 'Backtracking: listing sequences of moves, the contrast for states'
- topic: '3.2'
  what: 'Dynamic programming: a table in a fixed order, the contrast when every move goes forward'
- topic: '3.3'
  what: 'Knapsack: a table over (items, amount), the contrast in one drill problem'
- topic: '3.5'
  what: 'Counting dynamic programming: counting routes, the contrast for the fewest moves'
- topic: '3.6'
  what: 'Interval dynamic programming: splitting a line into groups, in one drill problem'
- topic: '3.7'
  what: 'Bitmask dynamic programming: a table over (set, last item), the contrast and the partner of the
    set card'
- topic: '3.9'
  what: 'Meet in the middle: named in the scope list as the idea that is not applied to searches here'
- topic: '4.1'
  what: 'Graph traversal: the queue-based search, distances by counting moves, grids as graphs (Theorems
    4.1.3 and 4.1.5)'
- topic: '4.3'
  what: 'Shortest paths: Dijkstra''s algorithm and the heap (Theorem 4.3.1), the algorithm that runs over
    the states'
theorems:
- id: 4.9.1
  title: Puzzles as graphs
  plain_words: Any puzzle where you want the fewest moves and every move counts the same is a search through
    a graph whose dots are the positions of the puzzle. Walk it with a queue, remember each position you
    saw, and the first time you reach the goal is the fewest moves.
  code: 4.9/thm-1
- id: 4.9.2
  title: Dijkstra over pairs
  plain_words: If what you may do next depends on a small extra fact, make a separate vertex for every
    pair (place, fact) and run Dijkstra on those pairs.
  code: 4.9/thm-2
- id: 4.9.3
  title: A set as part of the state
  plain_words: If every move changes a small set of items by a fixed rule (add an item, toggle an item),
    make the pair (place, set) a vertex. A search over these pairs answers the question, and there are
    only places times $2^k$ of them for $k$ items.
  code: 4.9/thm-3
- id: 4.9.4
  title: A dominated state can be skipped
  plain_words: 'If two states are at the same place and one has at least as much of a resource that never
    hurts, then once that one is finished the other can be thrown away: no answer changes. Keep only the
    best amount per place.'
  code: 4.9/thm-4
cards:
- id: state-graph
  name: Invent the node
  from_theorem: 4.9.1
  decisive_property: A puzzle or process in which a state (everything that matters about the situation)
    fixes what moves are possible next, every move costs one, the state space is small enough to visit
    (up to about 10^6 to 10^7 states), and the question asks for the fewest moves to a goal state.
  how_to_test: 'Write down what must be remembered: that is the state. Multiply the ranges of its parts
    to count the states. If the count times the number of moves is within the budget and every move costs
    one, walk the states with a queue and a table (or map) of distances.'
  constraint_shapes:
  - 'A number up to 10^6 with two moves: 10^6 states × 2 moves = 2·10^6 steps'
  - 'Boards with a few pieces: 9 cells of the sliding puzzle give 9!/2 = 181 440 reachable states with
    at most 4 moves each, about 7·10^5 steps; 12 items in any order would give 12! ≈ 4.8·10^8 states,
    too many'
  weak_signals:
  - form: Asks for the fewest operations that turn A into B (numbers, strings, boards)
    shape: Numbers up to 10^6, strings of length ≤ 8, or boards with 6 to 9 cells, so the state space
      is about 10^4 to 10^6
  - form: A small puzzle with locks, jugs, tokens or a sliding board, and a goal configuration
    shape: The board is tiny but the configurations are many (a 4-digit lock has 10^4)
  - form: 'A map problem where something beyond the cell matters: a key, the direction, the number of
      walls broken'
    shape: R·C ≤ 10^6 with one extra field of at most 10 values, so the states are R·C·10 or fewer
  - form: Two walkers, tokens or players move together, or the cost or rule of a move depends on the previous
      move
    shape: Graphs or grids of $10^3$ to $10^6$ cells, so a pair of positions has up to $10^6$ to $10^7$
      values
  kill_signals:
  - 'Moves have different costs: on the line 0..6 with the move +1 costing 1 and the move +3 costing 5,
    the fewest moves to 6 are two (+3, +3) at cost 10, while six moves of +1 cost only 6 (the first negative
    example below)'
  - 'The question asks how many ways or sequences there are: a search visits each state once and cannot
    count routes (the second negative example)'
  - 'The number of states is huge: arrangements of 20 items give 20! ≈ 2.4·10^18 states'
  in_action:
    statement: A counter shows 1. One button adds 1, another triples the number. The number may never
      exceed 10 000. Find the fewest presses to show exactly 100.
    constraints: Target 100, limit 10^4.
    budget: 'The number of press sequences doubles with each press. The state is the number, at most 10^4
      values, with 2 moves each: 2·10^4 steps. Need about O(states).'
    candidates:
    - tool: Try all press sequences (backtracking, topic 3.1)
      verdict: rejected
      because: The number of sequences doubles with each press; some targets below 10^4 need 22 presses
        (2^22 ≈ 4·10^6 sequences), and for larger limits it explodes.
    - tool: Queue-based walk over the numbers (this topic)
      verdict: chosen
      because: The number fully describes the situation, each press costs one, and there are at most 10^4
        states.
    property_check: 'The state is the shown number alone: the next numbers are x + 1 and 3x (if at most
      10^4). Every press costs 1. 10^4 states fit. Theorem 4.9.1 applies.'
    decision: 'Queue and a distance table (or map) over the numbers; start at 1; the first time 100 is
      removed gives 7 presses: 1, 3, 9, 10, 11, 33, 99, 100. Time O(10^4 · 2).'
  examples:
    positive:
    - inline:
        input: 'The counter shows 2; buttons: add 1, triple; fewest presses to show 29 (never above 10
          000)?'
        answer: '5'
        why: 'The numbers are the states and each press costs one: 2, 3, 9, 27, 28, 29 is 5 presses, found
          by the search before any longer route; a table filled in increasing order gives the same.'
    - inline:
        input: 'Two jugs of 3 and 5 litres, operations: fill a jug, empty a jug, pour one into the other
          until it is full or empty; fewest operations to get 4 litres in a jug?'
        answer: '6'
        why: A state is the pair (litres in the 3-litre jug, litres in the 5-litre jug), at most 4 · 6
          = 24 states; the search reaches 4 litres after 6 operations, and trying all operation sequences
          of that length agrees.
    negative:
    - inline:
        input: Positions 0 to 6 on a line; the move +1 costs 1 and the move +3 costs 5; the cheapest way
          from 0 to 6?
        answer: '6'
        method_gives: '10'
        why: 'The search finds the fewest moves (+3, +3: two moves) at cost 10, but moves have different
          costs and six moves of +1 cost only 6. Because every move goes forward, a table over the positions
          gives the cheapest cost.'
      correct_tool:
        topic: '3.2'
        card: linear-state
    - problem: lc-number-of-ways-to-stay-in-the-same-place-after-some-steps
      why: The question asks for the number of move sequences of a fixed length, and a search marks each
        state once, so it loses the number of ways; a table over (step, position) adds the counts.
      correct_tool:
        topic: '3.5'
        card: sequence-counting
  lookalikes:
  - description: List every arrangement of a puzzle that satisfies the rules (for example all placements
      of queens)
    tool:
      topic: '3.1'
      card: generate-all
    flipping_difference: When every solution is wanted, or the question is whether a solution exists in
      a huge space, backtracking with pruning builds them. The queue-based search answers "fewest moves
      from a start" and needs a small state space.
  - description: Count the ways to reach a target in exactly k moves
    tool:
      topic: '3.5'
      card: sequence-counting
    flipping_difference: A search finds how few moves are needed and visits each state once; counting
      ways needs a table that adds the counts of every state at every step.
  complexity: O(S·k) for S reachable states with k moves each (times log S with a map).
- id: mask-search
  name: Place plus a set of items
  from_theorem: 4.9.3
  decisive_property: What you may do next, or whether you are done, depends on which of at most about
    20 items you have visited, collected, flipped or used; a move changes that set by a fixed rule (add
    an item, toggle an item) that depends only on where you go; and the number of places times $2^k$ states,
    for $k$ items, fits the budget.
  how_to_test: 'Write the state as (place, set of items) with the set stored as a bitmask. Multiply the
    number of places by $2^k$ and by the moves per state: up to about $10^7$ to $10^8$ is fine. Then check
    that a move changes the set by an OR or an exclusive or that depends only on the place entered.'
  constraint_shapes:
  - '$n = 17$ vertices and a walk that visits all of them: $17 \cdot 2^{17} \approx 2.2 \cdot 10^6$ states
    and about $3.5 \cdot 10^7$ moves; a $3 \times 3$ board of lights has only $2^9 = 512$ states'
  - '$k = 10$ symptoms and $m = 1000$ medicines: $2^{10} = 1024$ states and $1024 \cdot 1000 \approx 10^6$
    moves for Dijkstra over the sets'
  weak_signals:
  - form: Asks for the fewest moves (or the least cost) to visit all of some items, collect all keys,
      or clear all of some flags
    shape: A graph or grid with $10^3$ to $10^5$ places and an item count of 10 to 18, unusually small
      next to the other limits
  - form: Every move sets or toggles something and the goal is "everything off" or "every item seen"
    shape: $k \le 10$ to $18$ flags (symptoms, lights, doors) in the statement
  - form: Asks for the best value for every subset, or every pattern of parities
    shape: $n \le 17$ and the answer is summed over $2^n$ patterns
  kill_signals:
  - 'The set has too many items: for $n = 25$ vertices the pairs number $25 \cdot 2^{25} \approx 8.4 \cdot
    10^8$, too many to store (the first negative example below)'
  - 'Moves have different costs but the search counts moves: on the triangle with costs 5, 5 and 1 the
    search that counts edges returns a walk of cost 10, while the cheapest is 6 (the second negative example
    below)'
  in_action:
    statement: A grid of $R \times C \le 400$ cells has walls, a start, a goal and up to 8 keys on the
      floor. A door of colour $c$ can be entered only while you hold the key of colour $c$. Find the fewest
      steps from the start to the goal.
    constraints: $R \cdot C \le 400$, at most 8 keys.
    budget: 'Trying every order of picking up the keys: $8! = 40\,320$ orders, each with several path
      searches. The state (cell, keys held) has $400 \cdot 2^8 = 102\,400$ values with 4 moves each: about
      $4 \cdot 10^5$ steps. Need about $O(\text{states})$.'
    candidates:
    - tool: Try every order of collecting the keys (brute force, topic 0.5)
      verdict: rejected
      because: $8!$ orders, each with several searches, and the best route may pass a door that needs
        a key picked up on an earlier detour.
    - tool: Search over (cell, keys held) (this topic)
      verdict: chosen
      because: The keys are a set of 8 items, and entering a key cell adds one bit to it.
    property_check: 'The pair (cell, set of keys) fixes which moves are allowed and when the goal is reached.
      The set has 8 items, so there are $2^8 = 256$ sets per cell, and a move adds the bit of the key
      it picks up or needs the bit of the door (Theorem 4.9.3): yes.'
    decision: Breadth-first search over $400 \cdot 256$ states with a table `dist[cell][keys]`; time $O(R
      \cdot C \cdot 2^8)$.
  examples:
    positive:
    - inline:
        input: 'The star with centre 0 and leaves 1, 2, 3: the fewest moves of a walk that visits every
          vertex'
        answer: '4'
        why: A state is (vertex, set of vertices seen), $4 \cdot 16 = 64$ pairs. The walk leaf, centre,
          leaf, centre, leaf takes 4 moves, and any shorter walk misses a leaf; trying every order of
          first visits gives the same 4.
    - inline:
        input: A $2 \times 2$ board with the top row 1 1 and the bottom row 0 0; a flip toggles the chosen
          cell and its side neighbours; the fewest flips that make every cell 0
        answer: '2'
        why: The board is 4 bits, so there are 16 states, and a flip is an exclusive or with a fixed mask.
          Flipping the two bottom cells clears the board, and checking all 16 sets of flips shows that
          one flip is not enough.
    negative:
    - inline:
        input: 'The path of 25 vertices: the fewest moves of a walk that visits every vertex'
        answer: '24'
        method_gives: too-slow
        why: 'The search over (vertex, set) would have $25 \cdot 2^{25} \approx 8.4 \cdot 10^8$ states,
          far over any memory limit. A path has a plain answer: walk from one end to the other, 24 moves,
          the distance a search from one end finds.'
      correct_tool:
        topic: '4.1'
        card: unweighted-shortest
    - inline:
        input: 'The triangle with the edges 0-1 (cost 5), 1-2 (cost 5) and 0-2 (cost 1): the cheapest
          total cost of a walk that visits every vertex'
        answer: '6'
        method_gives: '10'
        why: Two edges are the fewest, and the search that counts edges stops at the first walk with two
          edges, which can be 0, 1, 2 at cost 10. The cheapest walk is 1, 0, 2 at cost 6. Costs differ,
          so Dijkstra must run over the same (vertex, set) pairs.
      correct_tool:
        topic: '4.9'
        card: extra-state
  lookalikes:
  - description: Choose the order of up to 20 places with a cost between every two of them, and ask for
      the cheapest tour
    tool:
      topic: '3.7'
      card: path-mask
    flipping_difference: When the cost between two places is given and no search through a map is needed,
      the table over (set, last place) of bitmask DP does the work. Here the cost between two places has
      to be found by a search first, or the places are cells of a grid.
  - description: Count the subsets of up to 20 items with a property, with no place to move through
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: When only the set matters and there is no place, listing all $2^k$ sets is enough.
      A place and the moves between places make the pair (place, set) the state.
  complexity: $O(P \cdot 2^k \cdot d)$ for $P$ places, $k$ items and $d$ moves per state (times $\log$
    with Dijkstra).
- id: extra-state
  name: Dijkstra over a place and a resource
  from_theorem: 4.9.2
  decisive_property: A cheapest-route problem has a small extra fact that changes what you may do or what
    a step costs (a voucher used or not, the parity of the steps, the number of walls broken, the fuel
    left), that fact has only a few values, and the step costs stay at least 0.
  how_to_test: Write the state as (vertex, extra fact); count the states (n times the number of values
    of the fact) and the moves per state; check that every cost is at least 0. Then run Dijkstra (or the
    deque if the costs are 0 and 1) on the pairs.
  constraint_shapes:
  - 'n = 10^5 vertices and 3 values of the fact: 3·10^5 states and about 6·m edges, a few million heap
    steps'
  - 'A fuel level from 0 to 100 on n = 1000 cities: 10^5 states; a fact with 10^9 values is impossible'
  weak_signals:
  - form: You may use a discount, coupon or free ride at most once (or at most k times)
    shape: n, m ≤ 2·10^5 and k ≤ 2 or so
  - form: Asks for the cheapest or shortest route with at most k special moves (walls broken, flights
      taken)
    shape: k up to about 20 on a grid with up to 10^5 cells
  - form: 'The cost of a step depends on a small state: the time of day modulo something, the fuel left,
      a switch'
    shape: a few values; n ≤ 10^5
  - form: Asks for the cheapest route with a parity condition (an even number of edges, or an odd number)
    shape: n, m ≤ 2·10^5; the parity is the extra fact
  kill_signals:
  - 'The fact has too many values (the set of visited vertices of a big graph, a fuel of 10^9): the pairs
    do not fit in the limits'
  - 'The costs can be negative: with a bonus voucher that pays the price of one road, Dijkstra over pairs
    reports 0 where the true total is −4 (the first negative example below)'
  in_action:
    statement: A subway has n stations and m tracks with ticket prices. A pass lets you ride at most two
      tracks for free. Find the cheapest trip from station 1 to station n.
    constraints: n ≤ 10^5, m ≤ 2·10^5.
    budget: 'Choosing the two free tracks: about m² / 2 = 2·10^10 pairs, each needing a shortest-path
      run. The pairs (station, free rides used) number 3n = 3·10^5, with about 6m = 1.2·10^6 edges.'
    candidates:
    - tool: Try every choice of two free tracks and run Dijkstra each time (this topic)
      verdict: rejected
      because: 2·10^10 runs.
    - tool: Dijkstra over the pairs (station, free rides used) (this topic)
      verdict: chosen
      because: The extra fact has 3 values and every price is at least 0 (Theorem 4.9.2).
    property_check: 'The extra fact (0, 1 or 2 free rides used) has 3 values, and prices are non-negative:
      yes. The fact together with the station is the whole state.'
    decision: Keep dist[v][k] for k = 0, 1, 2; a track costs its price (same k) or, if k < 2, costs 0
      and moves to k + 1. Print the smallest of dist[n][0..2]. Time O((n + m) log m).
  examples:
    positive:
    - inline:
        input: One-way roads 1→2 (5), 2→3 (6), 3→4 (7); one road may be used for free; the cheapest trip
          from 1 to 4?
        answer: '11'
        why: The whole trip costs 18; the best free road is the most expensive one (7), leaving 5 + 6
          = 11. The pairs (station, free road used) give 11, and freeing each road in turn gives the same.
    - inline:
        input: The 3 × 4 map "..#.", ".##.", "...." where one wall may be broken; the fewest steps from
          the top-left to the top-right cell?
        answer: '3'
        why: 'Without breaking a wall the route goes down, along the bottom row and up: 7 steps. Breaking
          the wall in the top row gives 3 steps along the top row. The search over (cell, wall broken
          yet) finds 3, and breaking each wall in turn agrees.'
    negative:
    - inline:
        input: One-way roads 1→3 (1), 1→2 (5), 2→3 (10), 3→4 (1); a bonus voucher pays you the price of
          ONE road instead of you paying it (that road costs −w); the cheapest total from 1 to 4?
        answer: '-4'
        method_gives: '0'
        why: 'The best use is on the road 2→3 after 1→2: 5 − 10 + 1 = −4. Dijkstra over the pairs has
          already finished the pair (3, voucher used) with the value −1 (voucher on the road 1→3) before
          the route through 2 offers −5, because the costs are negative. Negative costs break Dijkstra;
          Bellman–Ford on the pairs gives −4.'
      correct_tool:
        topic: '4.3'
        card: negative-weights
    - problem: ac-abc176_d
      why: The cost depends on the kind of move only (walk 0, warp 1), with nothing extra to remember,
        so a deque on the cells is enough; the pairs would only waste memory.
      correct_tool:
        topic: '4.3'
        card: zero-one-weights
  lookalikes:
  - description: Cheapest route when every move goes forward to a later position and the extra fact is
      small
    tool:
      topic: '3.2'
      card: extra-small-state
    flipping_difference: When every move goes to a larger position, a table indexed by (position, fact)
      is filled in order without a heap. Dijkstra over pairs is needed when moves can go back.
  - description: Count the ways to reach the end using exactly k special moves
    tool:
      topic: '3.5'
      card: sequence-counting
    flipping_difference: Counting ways needs a table that adds the counts of every state; a shortest-path
      search finds only how cheap, and visits each pair once.
  complexity: O(|F| (n + m) log(|F| m)) for |F| values of the extra fact.
- id: cut-states
  name: Cut the state down
  from_theorem: 4.9.4
  decisive_property: 'A search over (place, resource) pairs where more of the resource is never worse:
    from a state with more of it, every move of the other state is also possible at the same cost and
    leads to a state that is again at least as good, and the goal does not care how much is left. Then
    a state can be skipped when a finished state at the same place has at least as much, and only the
    best amount per place is kept.'
  how_to_test: Take two states at the same place that differ only in the resource, where the first has
    more. Check that every move of the second is possible from the first at the same cost, leading to
    a state with at least as much of the resource. If so, keep one number per place, the largest amount
    seen, instead of one entry per amount.
  constraint_shapes:
  - 'A $40 \times 40$ grid with up to $k = 1600$ removable obstacles: all pairs (cell, used) are $1600
    \cdot 1601 \approx 2.6 \cdot 10^6$; the pruned search stores 1600 numbers, one per cell, and a cell
    is entered at most once for each strictly larger amount'
  - 'A trip along at most 50 roads with an amount of silver that can reach $10^9$: no route can spend
    more than $50 \cdot 50 = 2500$, so every amount above 2500 is the same state as 2500'
  weak_signals:
  - form: At most $k$ special moves are allowed (remove an obstacle, use a coupon, skip a stop) and $k$
      is large next to the rest
    shape: $k$ up to $10^3$ with $10^3$ to $10^5$ places, so places times $k$ is large to store
  - form: A number is carried through the route that can grow without bound (money, fuel, silver coins)
    shape: Values up to $10^9$ in the statement, but at most 100 roads per trip, so only a small part
      of the range can matter
  - form: An unbounded coordinate (a number that can be doubled, a position on a line) with a target
    shape: 'Targets up to $10^4$: the states above a small multiple of the target are useless'
  kill_signals:
  - 'More of the resource can hurt, or two states are not comparable: a cheaper arrival that has already
    used its coupon is not better than a dearer arrival that still has it. Keeping only the cheapest cost
    per city gives 10 on the road example below, where the true answer is 4 (the first negative example)'
  - 'The extra part is a parity, a direction or a mode: no value is better than another, so every value
    is a separate state'
  in_action:
    statement: A $40 \times 40$ grid has open cells and obstacles. You may step onto at most $k$ obstacles.
      Find the fewest steps from the top-left to the bottom-right cell.
    constraints: $1 \le k \le 1600$.
    budget: 'Every pair (cell, obstacles used): $1600 \cdot 1601 \approx 2.6 \cdot 10^6$ states with 4
      moves each, about $10^7$ steps: it fits, but most of the states are never useful, and for a larger
      grid the table does not fit.'
    candidates:
    - tool: Breadth-first search over every pair (cell, obstacles used) (this topic, Theorem 4.9.1)
      verdict: rejected
      because: $2.6 \cdot 10^6$ states to store; correct, but it does not scale to a bigger grid or $k$.
    - tool: The same search keeping only the largest number of obstacles left per cell (this topic)
      verdict: chosen
      because: An earlier visit with at least as many left did everything a later visit of that cell can.
    property_check: 'A visit with more obstacles left can copy every move of a visit with fewer, so the
      second kind is dominated, and breadth-first search finishes states in order of steps, so the dominating
      visit came no later (Theorem 4.9.4): yes.'
    decision: Breadth-first search with `bestLeft[cell]`; enter a cell only with more obstacles left than
      `bestLeft[cell]`. Memory $O(R \cdot C)$.
  examples:
    positive:
    - inline:
        input: 'The grid ". # ." / "# # #" / ". . ." with at most 1 obstacle: the fewest steps from the
          top-left to the bottom-right cell'
        answer: '4'
        why: 'The middle row is all obstacles, so one is needed: down through the left obstacle, then
          right along the bottom row. The pruned search finds 4, and the search over every (cell, used)
          pair gives the same.'
    - inline:
        input: 'The grid ". # #" / "# . #" / "# # ." with at most 2 obstacles: the fewest steps from the
          top-left to the bottom-right cell'
        answer: '4'
        why: 'The only route goes right through an obstacle, down through the open middle cell and right
          through another obstacle: 4 steps and exactly 2 obstacles. With 1 obstacle there is no route.
          Skipping a visit that has no more obstacles left than an earlier visit loses nothing.'
    negative:
    - inline:
        input: One-way roads 1 to 2 (cost 4) and 2 to 3 (cost 10); one road may be driven for free; the
          cheapest trip from 1 to 3 when only the cheapest cost per city is kept
        answer: '4'
        method_gives: '10'
        why: 'Using the coupon on the first road reaches city 2 for 0, which beats the 4 of paying; keeping
          only that cheapest cost forgets that the coupon is gone, so the last road costs 10. The arrival
          at cost 4 still has its coupon and is not dominated: the true answer is 4 (pay for the first
          road, drive the second for free).'
      correct_tool:
        topic: '4.9'
        card: extra-state
    - problem: lc-cheapest-flights-within-k-stops
      why: A cheaper way to a city with more stops used is not better than a dearer way with fewer stops
        used, because the limit is on the stops. The two arrivals are not comparable, so the stops stay
        in the state, which is what rounds of relaxation do.
      correct_tool:
        topic: '4.3'
        card: negative-weights
  lookalikes:
  - description: Cheapest route where an extra fact has a few values and no value is better than another
      (a parity, a direction, a mode)
    tool:
      topic: '4.9'
      card: extra-state
    flipping_difference: When no amount of the extra fact dominates another, every pair has to be kept
      and Dijkstra runs over all of them; skipping states is only allowed when more is never worse.
  - description: A count of special moves used with every move going to a later position
    tool:
      topic: '3.2'
      card: extra-small-state
    flipping_difference: When every move goes to a larger position, a table over (position, amount used)
      filled in order has no search and no skipping to worry about; the search is for moves that can go
      back.
  complexity: $O(P \cdot R)$ entries in the worst case for $P$ places and $R$ values of the resource (a
    place is entered once per strictly larger value), with memory $O(P)$ and usually far fewer entries.
problems:
- id: lc-open-the-lock
  role: ladder
  card: state-graph
  rung: 1
  twist: Base case of the card
  summary: A lock has 4 wheels of digits 0 to 9, starting at 0000; a move turns one wheel one step up
    or down (9 and 0 are neighbours). Some codes are dead ends that stop the lock. Find the fewest moves
    to a target code, or −1.
  hints:
  - What is a state here, and how many states are there?
  - A state is the 4-digit code; there are 10^4 of them, each with 8 moves (Theorem 4.9.1). Codes in the
    dead-end list are not entered.
  - Walk from 0000 with a queue and a set of seen codes. Return the distance when the target is removed
    from the queue, and −1 if the queue becomes empty first.
- id: ac-abc387_d
  role: ladder
  card: state-graph
  rung: 2
  twist: The state is the cell plus whether the last move was vertical or horizontal.
  summary: On an H × W grid (H, W ≤ 1000) with obstacles, walk from S to G by side steps, alternating
    between vertical and horizontal moves; print the fewest moves, or −1.
  hints:
  - The cell alone does not tell which moves are allowed next. What else must the walk remember?
  - 'Whether the last move was vertical or horizontal: the state is (cell, type of the last move), so
    there are 2 · H · W states.'
  - Walk over the states with a queue, starting from S in both types because the first direction is free.
    Each move goes to a neighbour of the other type. The answer is the smaller distance of G in the two
    types, or −1.
- id: ac-abc410_d
  role: ladder
  card: state-graph
  rung: 3
  twist: The extra part of the state is a value (the xor so far), and the number of values is small.
  summary: A directed graph with N, M ≤ 1000 and edge weights below 1024; among all walks from vertex
    1 to vertex N (vertices and edges may repeat) find the smallest xor of the weights along the walk,
    or −1.
  hints:
  - What must you remember about the walk so far, besides where it is? Why is the vertex alone not enough?
  - The xor of the weights so far. It is below 1024, so the states (vertex, xor) number at most 1000 ·
    1024 ≈ 10^6 (Theorem 4.9.1).
  - Start at (1, 0); an edge from v to w of weight c leads from (v, x) to (w, x xor c). Mark the reachable
    states with a queue; the answer is the smallest x with (N, x) marked, or −1.
- id: ac-abc277_e
  role: ladder
  card: state-graph
  rung: 4
  twist: Hitting a switch changes the state without using a move.
  summary: An undirected graph with N ≤ 2·10^5 vertices has edges that are passable or not (a_i); on some
    vertices there is a switch that inverts the passability of all edges. Walking from vertex 1 to vertex
    N, print the fewest moves (hits are free), or −1.
  hints:
  - What must you remember besides the vertex, and what does hitting a switch cost in moves?
  - 'The parity of the number of hits: the state is (vertex, parity). In parity 0 only edges with a =
    1 are passable, in parity 1 only edges with a = 0. A hit moves between the two states of the same
    vertex and uses no move.'
  - Walk over 2N states with a queue. When a state at a vertex with a switch is reached with distance
    d, give the other parity of the same vertex distance d too (if unseen) and push it. The answer is
    the smaller distance at vertex N, or −1.
- id: ac-abc289_e
  role: ladder
  card: state-graph
  rung: 5
  twist: The state is a pair of positions that move together.
  summary: A graph with N ≤ 2000 vertices, each red or blue, and M ≤ 2000 edges; two people start at vertices
    1 and N and at every step both move along an edge at the same time, always onto vertices of different
    colours; find the fewest steps until they have swapped places, or −1.
  hints:
  - One person’s position does not describe the situation. What is the whole situation, and how many are
    there?
  - 'The pair (position of the first, position of the second): N² = 4 · 10^6 states. A move goes to a
    pair of neighbours with different colours (Theorem 4.9.1).'
  - Breadth-first search from (1, N); from (a, b) try every neighbour of a with every neighbour of b.
    Over all states the work is (2M)² = 1.6 · 10^7, which fits. The answer is the distance of (N, 1),
    or −1.
- id: cf-1681D
  role: ladder
  card: state-graph
  rung: 6
  twist: The state is a number that grows, but only a few numbers can be reached.
  summary: Given x and a length n ≤ 19, one operation replaces the number by its product with one of its
    own digits; find the fewest operations to get a number with exactly n digits, or −1.
  hints:
  - What is a state, and could there be too many? How do the numbers grow?
  - The number itself. Every reachable number has the form x · 2^a · 3^b · 5^c · 7^d, so only a few thousand
    can be reached (Theorem 4.9.1).
  - Breadth-first search from x with a set of seen numbers (64-bit integers); from v multiply by each
    digit of v that is at least 2; the first number with n digits gives the answer; print −1 if the queue
    empties first.
- id: lc-minimum-number-of-flips-to-convert-binary-matrix-to-zero-matrix
  role: ladder
  card: mask-search
  rung: 1
  twist: 'Base case of the card: the whole board is the set.'
  summary: A binary matrix of at most 3 × 3 cells; one step flips a cell and its side neighbours; find
    the fewest steps that make every cell 0, or −1.
  hints:
  - How many different boards are there? What is a state here, and what is a move?
  - A board of at most 9 bits has at most 2^9 = 512 values, and a step is an exclusive or with a fixed
    mask (Theorem 4.9.3).
  - Precompute the 9 masks, then run breadth-first search from the start board over the states; the answer
    is the distance of the board 0, or −1 if it is never reached.
- id: lc-shortest-path-to-get-all-keys
  role: ladder
  card: mask-search
  rung: 2
  twist: The set is the keys held and the place is a grid cell.
  summary: A grid of at most 30 × 30 cells with walls, a start, lower-case keys (at most 6 kinds) and
    upper-case locks; a lock can be entered only while holding its key; find the fewest steps to hold
    every key, or −1.
  hints:
  - What decides whether a step onto a lock is allowed? What must the search remember?
  - 'The set of keys held: at most 6 keys, so 64 sets. The state is (cell, set), 30 · 30 · 64 = 57 600
    states (Theorem 4.9.3).'
  - Breadth-first search with `dist[cell][keys]`; stepping onto a key sets its bit; a lock needs its bit;
    stop the first time the set is full.
- id: ac-abc244_f
  role: ladder
  card: mask-search
  rung: 3
  twist: The set is a pattern of parities, and every vertex is a start.
  summary: A connected graph with N ≤ 17 vertices. For every set S of vertices, take the shortest walk
    that visits each vertex of S an odd number of times and every other vertex an even number of times
    (the empty walk is allowed); print the sum of these lengths over all 2^N sets.
  hints:
  - Which fact about the walk so far matters for the sets S? Is it the order of the visits?
  - 'Only the parity of the number of visits to each vertex: the state is (parities as a bitmask, last
    vertex), 17 · 2^17 ≈ 2.2 · 10^6 states (Theorem 4.9.3).'
  - Put every state (1 << v, v) into the queue at length 1 at the start, and treat the mask 0 as length
    0 (the empty walk). A move to a neighbour w flips bit w. For each mask take the smallest distance
    over the last vertex, and add the numbers up.
- id: ac-abc301_e
  role: ladder
  card: mask-search
  rung: 4
  twist: Search between the special cells first, then run a table over (set, last).
  summary: A grid of up to 300 × 300 cells with a start, a goal, walls and at most 18 candies; find the
    largest number of candies that can be collected on a walk of at most T steps from the start that ends
    at the goal, or −1.
  hints:
  - There are at most 20 special cells. What do you need to know about the order in which you collect
    candies?
  - 'The set of candies collected and the last one: 2^18 · 18 states. The cost between two special cells
    is a grid distance, found by one search from each special cell (Theorem 4.9.3).'
  - Run a breadth-first search from the start, the goal and every candy, then fill best[set][last] = fewest
    steps from the start; take the largest size of a set with best + distance to the goal at most T.
- id: cf-1846G
  role: ladder
  card: mask-search
  rung: 5
  twist: Moves have different costs, so Dijkstra runs over the sets.
  summary: n ≤ 10 symptoms are present at the start; each of m ≤ 1000 medicines takes some days and, for
    every symptom, cures it, causes it or does nothing; find the fewest days until no symptom is left,
    or −1.
  hints:
  - What describes the situation after taking some medicines? How many situations are there?
  - 'The set of symptoms present: 2^10 = 1024 states. A medicine maps a set to (set without the cured
    ones) plus the caused ones, at a cost in days (Theorems 4.9.2 and 4.9.3).'
  - Dijkstra over the 1024 masks from the full mask, trying all medicines from each; print the distance
    of the mask 0, or −1.
- id: cses-1195
  role: ladder
  card: extra-state
  rung: 1
  twist: 'Base case of the card: one coupon is one extra bit.'
  summary: Given n ≤ 10^5 cities and m ≤ 2·10^5 one-way flights with prices, one flight on the trip from
    city 1 to city n may be taken at half price (rounded down); find the least total price.
  hints:
  - What do you need to know about a trip so far, besides where it is? Which values can it take?
  - 'Whether the coupon has been used: a single bit. The state is (city, bit), and Theorem 4.9.2 gives
    the cost with one free edge in the same way.'
  - 'Dijkstra on 2n states: pay the full price and keep the bit, or pay half the price and set the bit;
    print the cheapest cost of (n, 0) and (n, 1).'
- id: ac-abc395_e
  role: ladder
  card: extra-state
  rung: 2
  twist: The extra fact is the direction of all edges.
  summary: Given a directed graph with N, M ≤ 2·10^5, moving along an arrow costs 1 and reversing the
    direction of all arrows at once costs X; find the least cost to go from vertex 1 to vertex N.
  hints:
  - What does the next move depend on, apart from the current vertex?
  - 'On whether the arrows are in their original or in the reversed direction: one bit again.'
  - 'Two layers: in layer 0 the original edges cost 1, in layer 1 the reversed edges cost 1, and switching
    layers at a vertex costs X; Dijkstra on 2N states.'
- id: ac-abc325_e
  role: ladder
  card: extra-state
  rung: 3
  twist: 'A one-way switch: you may change from the car to the train but not back.'
  summary: N ≤ 1000 cities with a full table of distances D; from city 1 to city N you may go by company
    car (time D·A per road) and switch once to a train (time D·B + C per road) in any city, never back;
    find the least total time.
  hints:
  - Which fact about the trip so far changes what the next road costs?
  - 'Whether you are still in the car or already on the train: two layers, 2N states, all costs positive
    (Theorem 4.9.2).'
  - Layer 0 costs D·A per road, layer 1 costs D·B + C, and a free move leads from (v, 0) to (v, 1). The
    graph is dense (N² roads), so use the array version of Dijkstra in O(N²) per layer; print the least
    of dist(N, 0) and dist(N, 1).
- id: cf-1486E
  role: ladder
  card: extra-state
  rung: 4
  twist: The cost of a step depends on the previous step, so the previous step is part of the state.
  summary: n ≤ 10^5 cities and m ≤ 2·10^5 two-way roads with small lengths (at most 50); a trip uses roads
    in pairs and pays the square of the sum of the two lengths of each pair; find the least cost from
    city 1 to every city.
  hints:
  - What does the cost of the second road of a pair depend on? What must be remembered after the first
    road?
  - 'The length of the first road: at most 50 values, plus one value for "no road waiting". The state
    is (city, waiting length), about 51n = 5 · 10^6 states (Theorem 4.9.2).'
  - From (u, 0) take a road of length w to (v, w) at cost 0; from (u, p) take a road of length w to (v,
    0) at cost (p + w)². Dijkstra; the answer for city v is the distance of (v, 0), or −1.
- id: cf-1473E
  role: ladder
  card: extra-state
  rung: 5
  twist: Two optional discounts (the largest and the smallest edge) are two extra bits.
  summary: A weighted undirected graph with n, m ≤ 2·10^5; the weight of a path is the sum of its edges
    minus the largest edge plus the smallest edge; find the least weight of a path from city 1 to every
    other city.
  hints:
  - 'Rewrite the weight: which edge counts zero times and which twice?'
  - Sum − max + min is the least value of the sum where one chosen edge counts 0 times and one chosen
    edge counts twice; the extra fact is two bits, so there are 4 layers (Theorem 4.9.2).
  - Dijkstra over 4n states; an edge may be paid once, skipped, doubled, or skipped and doubled at once
    (counting once). The answer for city v is the distance of (v, both used).
- id: lc-minimum-jumps-to-reach-home
  role: ladder
  card: cut-states
  rung: 1
  twist: 'Base case of the card: a position that can grow without bound is bounded by an argument.'
  summary: A bug starts at 0 on a line and jumps forward by a or backward by b, never twice backward in
    a row, never onto a forbidden position or below 0; find the fewest jumps to reach position x, or −1.
  hints:
  - What does the next jump depend on besides the position? Are there infinitely many positions?
  - Whether the last jump was backward. Positions above max(x, the largest forbidden) + a + b never help,
    so there are only about 6000 positions times 2 (Theorem 4.9.1).
  - Breadth-first search over (position, last jump backward?) with positions up to that bound; the first
    time x is removed from the queue gives the answer, in either state.
- id: lc-shortest-path-in-a-grid-with-obstacles-elimination
  role: ladder
  card: cut-states
  rung: 2
  twist: 'The resource is a count of removals: keep only the best count per cell.'
  summary: A grid of at most 40 × 40 cells of 0 (open) and 1 (obstacle); you may remove at most k obstacles
    on the way; find the fewest steps from the top-left to the bottom-right cell, or −1.
  hints:
  - The state is (cell, removals left). How many states are there for k up to 1600?
  - A visit with more removals left and no later arrival can do everything another visit of that cell
    can, so keep one number per cell (Theorem 4.9.4). If k is at least m + n − 2, the answer is m + n
    − 2.
  - Breadth-first search; enter a cell only if the removals left exceed the best seen at that cell; the
    answer is the steps when the last cell is first removed from the queue, or −1.
- id: cf-520B
  role: ladder
  card: cut-states
  rung: 3
  twist: 'The numbers can grow without bound: show that twice the target is enough.'
  summary: Start at the number n; one button doubles the number and the other subtracts 1 (it must stay
    positive); find the fewest presses to show m, where n, m ≤ 10^4.
  hints:
  - Can the number grow for ever? Is it ever useful to double a number that is already above m?
  - 'Doubling a number u above m costs one press and needs at least 2u − m subtractions afterwards, while
    subtracting from u needs only u − m. So no number above 2m is needed: at most 2 · 10^4 states (Theorem
    4.9.1).'
  - Breadth-first search from n over the numbers 1 to 2m with the two moves; the distance of m is the
    answer (if n ≥ m it is just n − m).
- id: ac-abc164_e
  role: ladder
  card: cut-states
  rung: 4
  twist: 'The extra fact is a number: cap it so the states are finite.'
  summary: Given N ≤ 50 cities, M ≤ 100 roads each costing some silver coins and some time, and at each
    city an exchange of one gold coin into some silver coins taking some time, find for every city the
    least time to reach it from city 1 with a given amount of silver.
  hints:
  - What do you need to know about the trip, besides where it is? Could the amount be huge?
  - The amount of silver; but a trip uses at most N − 1 roads, each costing at most 50 silver, so any
    amount above 2500 is as good as 2500.
  - 'Dijkstra over (city, silver capped at 2500): driving a road lowers the silver and costs time, an
    exchange raises the silver (capped) and costs time; the answer for a city is the cheapest over all
    silver amounts.'
- id: ac-abc339_d
  role: checkpoint
  card: state-graph
  summary: On an N × N grid (N ≤ 60) with obstacles, two players start on different cells; each move picks
    one direction and both try to step that way (a player who is blocked stays). Find the fewest moves
    until both stand on the same cell, or −1.
- id: ac-abc394_e
  role: checkpoint
  card: state-graph
  summary: A directed graph with N ≤ 100 vertices and a lower-case letter on some edges; for every pair
    of vertices (i, j), find the length of the shortest walk from i to j whose letters read the same forwards
    and backwards, or −1.
- id: cf-1801D
  role: checkpoint
  card: cut-states
  summary: n ≤ 800 cities and m ≤ 3000 one-way roads with ticket prices; in each city you can earn money
    by performing, at a rate depending on the city; find the fewest performances needed to get from city
    1 to city n.
- id: ac-abc224_d
  role: review
  card: state-graph
  review_set: 1
  summary: A puzzle on a graph with nine vertices has eight numbered pieces and one empty vertex; a move
    slides a piece along an edge into the empty vertex. Find the fewest moves that put piece j on vertex
    j, or −1.
- id: lc-word-ladder
  role: review
  card: state-graph
  review_set: 1
  summary: Change one letter at a time to turn beginWord into endWord, where every word on the way must
    be in a dictionary of at most 5000 words (length at most 10); print the number of words on the shortest
    sequence, or 0.
- id: ac-abc132_e
  role: review
  card: state-graph
  review_set: 1
  summary: In a directed graph with N, M ≤ 10^5, one ken-ken-pa is exactly three moves along edges. Find
    the fewest ken-ken-pa from S to T, where only the end of a ken-ken-pa counts, or −1.
- id: lc-bus-routes
  role: review
  card: state-graph
  review_set: 1
  summary: Each of at most 500 buses repeats a route of stops forever (all routes together have at most
    10^5 stops). Find the fewest buses you must take to get from a source stop to a target stop, or −1.
- id: lc-minimum-genetic-mutation
  role: drill
  summary: Change one letter at a time to turn an 8-letter gene string over A, C, G, T into another, where
    every string on the way must be in a bank of at most 10 genes; the fewest changes, or −1.
- id: lc-minimum-operations-to-convert-number
  role: drill
  summary: Starting from a number start ≤ 1000, one operation adds, subtracts or XORs one of up to 1000
    given numbers; while 0 ≤ x ≤ 1000 the operations are allowed. The fewest operations to reach goal,
    or −1.
- id: lc-minimum-cost-to-reach-destination-in-time
  role: drill
  summary: Cities and roads with travel times and a passing fee in every city (at most 1000 cities, total
    time at most 1000); find the least total fee of a trip from city 0 to the last city that takes no
    more than the given time, or −1.
- id: lc-minimum-swaps-to-make-sequences-increasing
  role: drill
  summary: Two integer arrays of the same length n ≤ 10^5; one operation swaps the two values at one position;
    find the fewest operations that make both arrays strictly increasing (a solution is guaranteed).
- id: ac-abc201_d
  role: drill
  summary: On an H × W grid (H, W ≤ 2000) of + and − cells, two players alternately move a piece one cell
    right or down from the top-left cell; the mover gains a point on a + cell and loses one on a − cell;
    with both playing for the best result, decide who wins or whether the game is drawn.
- id: lc-maximum-value-of-k-coins-from-piles
  role: drill
  summary: There are n ≤ 1000 piles of coins and you take exactly k coins, each time one from the top
    of any pile (the total number of coins is at most 2000); find the largest total value.
- id: lc-allocate-mailboxes
  role: drill
  summary: Houses at distinct positions on a street (at most 100 houses) and k mailboxes to place; find
    the least total distance from every house to its nearest mailbox.
- id: lc-concatenated-divisibility
  role: drill
  summary: An array of at most 13 positive integers and a number k ≤ 100; among the orders in which the
    numbers can be written one after another so that the resulting number is divisible by k, find the
    lexicographically smallest order, or report that none exists.
- id: lc-sliding-puzzle
  role: lookalike
  summary: A 2 × 3 board holds the tiles 1 to 5 and an empty cell; one move slides a neighbouring tile
    into the empty cell; find the fewest moves to reach the board 1 2 3 / 4 5 0, or −1.
- id: lc-snakes-and-ladders
  role: lookalike
  summary: An n × n board numbered in a zigzag from 1 to n² with some squares that jump to another square;
    from square 1 each turn goes to one of the next six squares (taking a jump if there is one); find
    the fewest turns to reach square n², or −1.
- id: cf-1915G
  role: lookalike
  summary: n ≤ 1000 cities and m ≤ 1000 two-way roads with lengths; in every city you may take over a
    bicycle whose slowness is given; riding a road costs its length times the slowness of the bicycle
    you ride, and you keep your bicycle until you swap it; find the least total time from city 1 to every
    city.
- id: cf-229B
  role: lookalike
  summary: n ≤ 10^5 planets joined by two-way tunnels with travel times; at some planets a gate is blocked
    at given moments, so you must wait for the next free moment before leaving; find the earliest time
    to reach planet n starting at time 0 from planet 1.
drill:
- problem: lc-minimum-genetic-mutation
  answer:
    topic: '4.9'
    card: state-graph
  property: The state is the gene string; only strings in the bank (at most 10, plus the start) can be
    entered, and each mutation costs one, so a queue-based search over those states gives the fewest mutations.
  why_others_fail: Trying all orders of mutations is exponential; the state space is tiny, so a search
    that marks each state once is enough.
- problem: lc-minimum-operations-to-convert-number
  answer:
    topic: '4.9'
    card: state-graph
  property: While x is within 0 to 1000 it is a state with at most 3 · 1000 moves; a number outside the
    range can be reached but not left. A queue-based search over the 1001 states gives the fewest operations.
  why_others_fail: Moves go up and down, so a table filled in increasing order of x has no valid order;
    trying all operation sequences is exponential.
- problem: lc-minimum-cost-to-reach-destination-in-time
  answer:
    topic: '4.9'
    card: extra-state
  property: Two things limit the trip, the fee (to minimise) and the time (to stay within the limit);
    the time used is an extra fact in the state, so the state is (city, time used) and the search on fees
    runs over n · maxTime states (Theorem 4.9.2).
  why_others_fail: Dijkstra on the cities alone keeps only one number per city, and the cheapest fee to
    a city may need more time than allowed, losing a trip that is dearer but quicker.
- problem: lc-minimum-swaps-to-make-sequences-increasing
  answer:
    topic: '3.2'
    card: extra-small-state
  property: Each position is either swapped or not (two states), and a move only goes to the next position,
    so a table filled from left to right with the two states per position gives the answer in $O(n)$.
  why_others_fail: A search over the arrays after each swap has $2^n$ states; the positions are ordered,
    so no search over states is needed.
- problem: ac-abc201_d
  answer:
    topic: '3.5'
    card: grid-paths
  property: Every move goes right or down, so the best score difference from a cell depends only on the
    cells after it, and a table filled from the bottom-right corner decides the winner.
  why_others_fail: A search over positions would visit each cell once but cannot choose between two players
    who want opposite things; the table of best differences does.
- problem: lc-maximum-value-of-k-coins-from-piles
  answer:
    topic: '3.3'
    card: zero-one
  property: 'Exactly one choice per pile (how many top coins to take) and a total of $k$ coins: a table
    over (piles processed, coins taken) with the prefix sums of each pile.'
  why_others_fail: Taking the largest top coin greedily fails because a small coin may hide a large one
    beneath it, and a search over the pile tops has far too many states.
- problem: lc-allocate-mailboxes
  answer:
    topic: '3.6'
    card: merge-split
  property: After sorting, each mailbox serves a consecutive group of houses and sits at its median, so
    a table over (houses covered, mailboxes used) splits the line into groups.
  why_others_fail: 'Searching over the positions of the mailboxes has far too many states, and no move
    costs one: the cost of a group has to be summed.'
- problem: lc-concatenated-divisibility
  answer:
    topic: '3.7'
    card: path-mask
  property: The state is the set of numbers already used plus the remainder so far ($2^{13} \cdot 100$
    states), and the question asks for the smallest valid order, which needs a table of what is still
    possible and a second pass to build the answer.
  why_others_fail: A breadth-first search over the same pairs finds only whether the end is reachable;
    the smallest permutation needs the table and a greedy walk over it.
lookalike_pairs:
- a: lc-sliding-puzzle
  b: lc-snakes-and-ladders
  a_tool:
    topic: '4.9'
    card: state-graph
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both ask for the fewest moves to reach a goal on a small board that the statement draws
    in full.
  flipping_difference: 'In Snakes and Ladders the square alone fixes what can happen next, so the squares
    are the vertices and an ordinary search is enough. In the sliding puzzle the position of the empty
    cell does not fix the moves: the arrangement of all the tiles is the state.'
  flipping_input: A board of 36 squares has 36 states; the 2 × 3 sliding puzzle has 6! = 720 arrangements,
    of which 360 can be reached from one start.
- a: cf-1915G
  b: cf-229B
  a_tool:
    topic: '4.9'
    card: extra-state
  b_tool:
    topic: '4.3'
    card: dijkstra
  shared_surface: Both ask for the earliest or cheapest arrival on a road network of at most about $10^3$
    to $10^5$ places, and something about the place you are in changes what the next road costs or when
    you may leave.
  flipping_difference: On the planets arriving earlier is never worse, since you can always wait for a
    gate, so the earliest arrival time per planet is the whole state and ordinary Dijkstra works. With
    bicycles an earlier arrival may come with a slower bicycle, so the pair (city, bicycle ridden) is
    the state.
self_test:
- q: On the map with rows "S.D.T" and "#K###", where D opens only after K has been visited, what does
    a search over cells alone report as the fewest steps, and what is the true answer?
  a: 'The cell-only search reports 4 (along the top row). The true answer is 6: right, down to K, back
    up, then right through D, right, right. The state must be (cell, key held) (Theorem 4.9.1, precondition
    1).'
- q: A trip may use at most k free roads. Why is the state of the search (town, number of free roads used)
    and not just the town? Give the number of states.
  a: The cheapest cost to a town depends on how many free roads are left, and a cheaper arrival with all
    free roads used can be worse than a dearer arrival with some left; one number per town cannot hold
    both. The number of states is n · (k + 1).
- q: A graph has 18 vertices, and the question is the shortest walk that visits all of them. How many
    (vertex, set) states are there, and about how many moves does the search try if every vertex has 4
    neighbours? Is it within $10^8$? What happens with 25 vertices?
  a: '$18 \cdot 2^{18} = 4\,718\,592$ states with 4 moves each: about $1.9 \cdot 10^7$ steps, which fits.
    With 25 vertices there are $25 \cdot 2^{25} \approx 8.4 \cdot 10^8$ states, too many to store, so
    the idea does not apply (Theorem 4.9.3, precondition 2).'
- q: In the grid search with at most $k$ removable obstacles, a cell is first entered with 0 removals
    left and later, from another side, with 2 left. Should the second visit be dropped? Why?
  a: 'No. A visit is dropped only if a finished visit of the cell has at least as many removals left.
    Here the earlier one has 0 and the later one has 2, so the later one is better and must be kept (Theorem
    4.9.4: a dominated state has no more left).'
- q: Give a triangle with edge costs for which the search over (vertex, set) that counts edges returns
    a walk that visits every vertex but is not the cheapest.
  a: 'The edges 0-1 (5), 1-2 (5), 0-2 (1): the search returns the first walk with two edges, for example
    0, 1, 2 at cost 10, while 1, 0, 2 costs 6. Costs differ, so Dijkstra over the pairs is needed (Theorem
    4.9.2).'
- q: A number game doubles the number or subtracts 1 and the target is $m$. Why is no number above $2m$
    ever needed on a shortest route?
  a: Doubling a number $u > m$ costs one press and lands on $2u$, from which at least $2u - m$ subtractions
    are needed. Subtracting from $u$ directly needs only $u - m$. So a shortest route never doubles a
    number above $m$, and all numbers stay at most $\max(\text{start}, 2m)$.
checkpoint:
  time_limit_minutes: 120
  problems:
  - ac-abc339_d
  - ac-abc394_e
  - cf-1801D
decision_map:
- weak_signal: Fewest operations to turn A into B in a small puzzle (numbers, strings, locks, boards,
    extra information on a grid)
  choose: state-graph
  when: The state holds everything that matters, every move costs one, and the reachable states fit in
    the limits (Theorem 4.9.1).
  over:
  - card: generate-all
    because: If every solution is wanted, or whether one exists in a huge space, backtrack with pruning.
    topic: '3.1'
  - card: sequence-counting
    because: If the question asks for the number of ways to do something in k moves, a counting table
      is needed.
    topic: '3.5'
  - card: linear-state
    because: If moves go forward only and cost different amounts, a table over the states is enough.
    topic: '3.2'
  - card: unweighted-shortest
    topic: '4.1'
    because: If the place alone fixes what can happen next, the places are the vertices and an ordinary
      search is enough.
  - card: extra-state
    topic: '4.9'
    because: If the moves cost different amounts, run Dijkstra over the same pairs.
- weak_signal: Visit all of some items, collect all keys, flip or clear all of some flags, with at most
    about 18 items
  choose: mask-search
  when: A move changes the set of items by a fixed rule, the set has at most about 18 items, and places
    times $2^k$ states fit (Theorem 4.9.3).
  over:
  - card: subset-bitmask
    topic: '0.5'
    because: If there is no place to move through, listing all sets of items is enough.
  - card: path-mask
    topic: '3.7'
    because: If the cost between every two items is given as a table and no search through a map is needed,
      a table over (set, last item) does the work.
  - card: unweighted-shortest
    topic: '4.1'
    because: If a single place is the whole state and no set matters (a path or a tree), a plain search
      is enough.
- weak_signal: 'Cheapest route where something extra counts: a coupon, a number of stops, a direction
    switch, a resource that is spent or collected.'
  choose: extra-state
  when: The next move depends on one more small fact; the search runs on (place, fact) pairs (Theorem
    4.9.2).
  over:
  - card: dijkstra
    because: If the extra fact does not change the later cost, a search over the places alone is enough.
    topic: '4.3'
  - card: state-graph
    topic: '4.9'
    because: If every move costs the same, a breadth-first search over the (place, fact) pairs is enough.
- weak_signal: A count or an amount carried through the route is large (at most $k$ special moves with
    $k$ in the thousands, or a number up to $10^9$)
  choose: cut-states
  when: More of the resource is never worse, so a state with less is skipped once a finished state at
    the same place has at least as much (Theorem 4.9.4).
  over:
  - card: extra-state
    topic: '4.9'
    because: If no amount of the extra fact is better than another (a parity, a direction), keep every
      pair.
  - card: extra-small-state
    topic: '3.2'
    because: If every move goes to a later position, a table over (position, amount) filled in order is
      enough.
glossary_added:
- state graph
- state-space search
- dominated state
