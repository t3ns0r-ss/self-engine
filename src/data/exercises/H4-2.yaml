- id: ex-2
  role: worked_example
  type: recognise
  title: Replicas that fell behind during a deploy
  prompt: A session store has N = 3, W = 2, R = 2. During a deploy one node was down for ten minutes and missed about 12 000 writes. Sessions are read every few seconds while a user is active. Decide what, if anything, to add so the node catches up by itself.
  card: read-repair
  answer:
    kind: card
    card: &id001
      topic: H4.2
      card: read-repair
    property: Reads contact several replicas, versions order the writes of each key, and writing the newest version back is safe to repeat.
    why_others_fail: Waiting for the next write leaves rarely written keys stale on that node; a scheduled comparison of every key is needed only for keys that are not read.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-1
  role: drill
  type: recognise
  title: Session store across three zones
  prompt: A session store spans three zones and must survive the loss of one zone with single-key reads and writes. Operations touch one key. The target is 99.999%.
  answer:
    kind: card
    card: &id002
      topic: H4.2
      card: quorum-replication
    property: N = 3, one replica per zone, W = 2, R = 2, so W + R = 4 > 3 and a minority can be down.
    why_others_fail: One machine gives 99.9% (43.2 minutes a month); a standby needs a failover step during which writes stop.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-2
  role: drill
  type: recognise
  title: Replicas drift after outages
  prompt: After each outage the replicas of a busy key-value store differ, and nothing brings them back together. Keys are read many times a minute.
  answer:
    kind: card
    card: *id001
    property: Reads already contact several replicas, versions order the writes, and writing the newest version back is repeatable.
    why_others_fail: Waiting for the next write leaves keys that are read much more than written stale; quorum settings alone do not repair a replica that missed a write.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-3
  role: drill
  type: recognise
  title: Admin tool
  prompt: A single-region admin tool gets 50 requests a day. An outage of an hour a month is acceptable.
  answer:
    kind: none
    simplest: One database on one machine
    why: One machine gives 43.2 minutes down a month, within the target; three replicas would add machines and quorum code for no need.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-4
  role: drill
  type: recognise
  title: Who supplies the version
  prompt: A three-replica store needs a version number on every write so that replicas keep the newest one. Writes to one key come from three application servers that never talk to each other, and the team wants to know afterwards whether one write had seen another. Server clocks differ by up to 40 ms.
  answer:
    kind: card
    card:
      topic: H4.1
      card: logical-clocks
    property: A vector clock with one counter per writing server (3 counters) tells exactly whether one write saw another, and does not depend on the servers' clocks.
    why_others_fail: A wall-clock timestamp can give a later write the smaller version when the skew (40 ms) exceeds the gap; a single counter orders writes but cannot report that two were concurrent.
  checkers: []
  techniques:
  - H4.2
  - H4.1
  checked_on: '2026-10-23'
- id: r-5
  role: drill
  type: recognise
  title: Archive read once a year
  prompt: An archive of 40 million records is read once a year. A replica was down for a month and missed 1 000 000 writes.
  answer:
    kind: none
    simplest: A scheduled comparison of the replicas
    why: Read repair only runs when a key is read, so the stale replica stays stale; a periodic comparison covers every key.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-6
  role: drill
  type: recognise
  title: Five-node store
  prompt: A key-value store keeps five replicas per key. Each write is acknowledged by three and each read asks three. Operations touch one key.
  answer:
    kind: card
    card: *id002
    property: W + R = 6 > 5 over a fixed set of five replicas, and any 3 of 5 still form both quorums, so two failures are tolerated.
    why_others_fail: Acknowledging fewer than three would let a read set miss the write set.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-7
  role: drill
  type: recognise
  title: Two regions with one counter
  prompt: Two regions both add to one shared counter and must show the same total at all times, even during a network cut between the regions.
  answer:
    kind: none
    simplest: One region that owns the counter
    why: A quorum keeps copies of a key available but does not make two concurrent updates agree on one order; the simplest tool is a single writer.
  checkers: []
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: r-8
  role: drill
  type: recognise
  title: Replies shown above questions
  prompt: A question-and-answer site stores each post on three replicas. Posts come from 9 web servers whose clocks differ by up to 25 ms. Readers sometimes see an answer listed above the question it answers, because posts are sorted by the creating server's clock. Answers arrive 10 ms or more after the question was read.
  answer:
    kind: card
    card:
      topic: H4.1
      card: happened-before
    property: The display order must agree with cause and effect; the clock spread (25 ms) exceeds the gap (10 ms), so a stamp that takes the larger of the received stamp and the local clock fixes it.
    why_others_fail: Adding replicas or quorums does not change which timestamp a post carries; a vector per post costs 72 bytes for a question nobody asks.
  checkers: []
  techniques:
  - H4.2
  - H4.1
  checked_on: '2026-10-23'
- id: cp-1
  role: checkpoint
  type: deep_dive
  title: Quorum store for a shopping cart
  prompt: A shop wants its shopping carts to survive the loss of one machine without losing an acknowledged item. Carts are read 5 times as often as written, 5 000 writes a second at peak, 600 bytes per write, three zones. Write a design for the storage layer in 40 minutes. Choose N, W and R, justify them with numbers, say what a client sees when one and when two machines fail, and cite at least one result from your own runs of the H4.2 lab (the test names and what they showed).
  card: quorum-replication
  clarifying:
  - q: How many carts and how large is one?
    a: About 20 million active carts of about 3 KB each.
    critical: false
  - q: Is a read right after adding an item allowed to miss it?
    a: 'No: the shopper must see the item they just added.'
    critical: true
  - q: What availability is the target?
    a: 99.99% for cart reads and writes.
    critical: true
  - q: Do operations change more than one cart at once?
    a: No, one cart per operation.
    critical: true
  - q: Do carts of one user ever get written by two devices at the same moment?
    a: Rarely, and the later write may win for this exercise.
    critical: false
  checkers:
  - kind: rubric
    id: rubric-hld-deep-dive-v1
  time_limit_minutes: 40
  techniques:
  - H4.2
  checked_on: '2026-10-18'
- id: rev-1-1
  role: review
  type: recognise
  title: Pick N, W and R for a shopping cart
  prompt: A cart service spans three zones. One cart per operation, a shopper must see an item just added, and one zone may be lost. Choose the settings.
  card: quorum-replication
  review_set: 1
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  answer:
    kind: card
    card: *id002
    property: N = 3, W = 2, R = 2 over a fixed set, one replica per zone.
    why_others_fail: W = 1, R = 1 can miss the write; one primary needs a failover.
  checkers: []
- id: rev-1-2
  role: review
  type: estimate
  title: Replication traffic at another size
  prompt: A log store takes 8 000 writes a second of 2 KB each and keeps five replicas. How much data a second goes to the replicas, in megabytes per second?
  card: quorum-replication
  review_set: 1
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  checkers:
  - kind: numeric
    calc: H4.2/calc-quorum-table
    key: replica_traffic_n5_8000w
    unit: MB/s
    factor: 2
- id: rev-1-3
  role: review
  type: recognise
  title: Why does W + R > N give an overlap?
  prompt: 'Two engineers disagree: one says N = 5, W = 2, R = 3 is safe because the numbers add up to the replica count. Decide whether reads always meet writes.'
  card: quorum-replication
  review_set: 1
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  answer:
    kind: none
    simplest: 'Do not rely on it: 2 + 3 = 5 is not greater than 5'
    why: A read set of 3 can be exactly the 3 replicas that the write of 2 missed, so a read can return the old value.
  checkers: []
- id: rev-2-1
  role: review
  type: recognise
  title: 'Sloppy quorum: what is given up?'
  prompt: A store lets a write count stand-in nodes when home replicas are unreachable so it stays available. A later read asks only the home replicas. Is a read after an acknowledged write guaranteed to see it?
  card: quorum-replication
  review_set: 2
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  answer:
    kind: none
    simplest: 'No: use a fixed replica set if reads must see acknowledged writes'
    why: The write set may contain nodes the reader never asks, so the count W + R > N no longer implies a shared node (TestSloppyQuorumBreaksOverlap).
  checkers: []
- id: rev-2-2
  role: review
  type: recognise
  title: When is read repair not enough?
  prompt: A store has replicas that missed 50 000 writes while down. Half the keys are read daily and half are never read. Decide what to rely on for each half.
  card: read-repair
  review_set: 2
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  answer:
    kind: card
    card: *id001
    property: Reads contact several replicas and versions order the writes; the keys read daily are repaired by those reads.
    why_others_fail: Keys that are never read are never repaired, so they need a scheduled comparison of the replicas.
  checkers: []
