# Topic 0.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.3"
draft: true
cards:
  - id: direct-simulation
    name: Step-by-step simulation
    decisive_property: The number of steps times the cost of one step fits the budget; or the process is deterministic on a small set of states, so it repeats within that many steps and the state after T steps follows from the first repeat and the period.
    from_theorem: Theorem 0.3.1
    how_to_test: Count the steps the statement describes (with the largest input) and multiply by the cost of one step. If that is too large, ask whether the next state depends only on the current one and how many states exist.
    weak_signals:
      - "The statement describes a process in detail: 'repeat …', 'in each second …', 'after the operations, print …'"
      - Small limits on the number of steps (N, Q up to 10^5 with O(1) per step)
      - A huge number of steps (K up to 10^18) over a small set of states
    kill_signals:
      - The number of steps is huge and the state space is huge too (a formula or a later technique is needed)
    lookalikes:
      - description: The same rule applied 5·10^15 times, with no small state space
        needs: "case-analysis (0.3): reason about the result"
        flipping_difference: Neither stepping nor cycle detection fits; the answer follows from what the rule does to each part.
    complexity: O(steps · cost per step); with cycle detection O(K) for K states.
  - id: grid-processing
    name: Grid processing
    decisive_property: Each cell is visited a constant number of times, and every neighbour access goes through a direction array and a bounds check, so the scan costs O(HW) and never reads outside the grid.
    from_theorem: Theorem 0.3.2
    how_to_test: Check that H·W fits the budget and that every access (r + dr, c + dc) is either checked against 0..H−1 and 0..W−1 or lands in a padding border.
    weak_signals:
      - Input is H lines of W characters ('#' and '.')
      - Neighbours, directions, turning left or right, walking until a wall
      - Rotating or transposing a matrix
    kill_signals:
      - "Shortest number of moves between cells (a later topic: breadth-first search, 4.1)"
    lookalikes:
      - description: Fewest moves from one cell to another
        needs: 4.1 (a later topic)
        flipping_difference: Exploring all paths needs a queue-based search, not a single scan.
    complexity: O(HW) with a constant of at most 9 per cell for 8 neighbours.
  - id: string-processing
    name: One-pass string processing
    decisive_property: A small state (a counter, the previous character, a flag) summarises the prefix read so far, and the next state depends only on the old state and the next character, so one left-to-right scan decides the answer.
    from_theorem: Theorem 0.3.3
    how_to_test: Name the state you would keep after reading a prefix, and check that nothing else about the prefix is ever needed.
    weak_signals:
      - "Transform or check a string: brackets, separators, replacements, case changes"
      - Length up to 10^5 or 10^6 (one pass needed)
      - Output built character by character
    kill_signals:
      - "The answer depends on rearranging the characters (then counts per letter decide: case analysis)"
    lookalikes:
      - description: Make a palindrome by reordering the letters freely
        needs: case-analysis (0.3) on letter counts
        flipping_difference: When order may change, only the counts matter, not a scan of the string.
    complexity: O(n) updates of a constant-size state.
  - id: case-analysis
    name: Case analysis
    decisive_property: The inputs split into a few cases that together cover every allowed input (including the boundaries), and each case has a direct answer.
    from_theorem: Theorem 0.3.4
    how_to_test: List the cases before coding, then check every boundary input (equal values, zero, smallest n) against exactly one case's rule. Compare with a brute force on small inputs.
    weak_signals:
      - Few inputs with large values; the answer is YES/NO or a small number
      - Geometry of a few points, comparisons of a few quantities
      - A rule applied an astronomical number of times (reason about the result instead)
    kill_signals:
      - "Too many cases to list: look for a single rule (formula) or a scan instead"
    lookalikes:
      - description: The same rule applied only a few times
        needs: direct-simulation (0.3)
        flipping_difference: With few steps, following the process is simpler and safer than reasoning about cases.
    complexity: O(1) or a constant number of comparisons per input.
problems:
  - id: cf-266B
    role: ladder
    card: direct-simulation
    rung: 1
    twist: Base case of the card
    summary: A queue of n boys and girls (n, t ≤ 50); every second, each boy standing directly in front of a girl swaps places with her, all at once; the queue after t seconds.
    hints:
      - How many steps does the process take, and how much work is one step?
      - "t seconds times n positions is at most 2500 operations, so follow the process. The trap: in one second a boy must not move twice."
      - Each second, scan i from 0 to n − 2; when s[i] is B and s[i + 1] is G, swap them and skip to i + 2.
  - id: ac-abc337_c
    role: ladder
    card: direct-simulation
    rung: 2
    twist: 'The state is "who stands behind whom": store that link and follow it from the front, N steps.'
    summary: Each of N people (N ≤ 3·10^5) is either at the front of a line or right behind a given person; print the line from front to back.
    hints:
      - If you know who is at the front, how do you find the second person without searching?
      - Store behind[a] = i for every A_i = a ≠ −1; then each next person is one array lookup away.
      - "Find the i with A_i = −1, then print cur and set cur = behind[cur], N times in all: O(N)."
  - id: ac-abc214_c
    role: ladder
    card: direct-simulation
    rung: 3
    twist: The gems travel around a circle, so the one-step update has to run for two laps.
    summary: N creatures in a circle (N ≤ 2·10^5); creature i passes a gem to the next one S_i time units after receiving it, and is also handed a gem at time T_i; the first time each one receives a gem.
    hints:
      - Creature i + 1 first gets a gem either at T_{i+1} or from creature i. At which time can creature i pass one on?
      - first[i + 1] = min(T[i + 1], first[i] + S[i]). But first[0] may itself come from creature N − 1, around the circle.
      - "Start with first = T and apply the update for i = 0, 1, …, 2N − 1 (indices mod N): two laps carry every chain. Sums reach 2·10^9, so use long long."
  - id: ac-abc250_c
    role: ladder
    card: direct-simulation
    rung: 4
    twist: "Each step must find a ball by its number: keep a second array from number to position so a step costs O(1)."
    summary: Balls numbered 1 to N in a row (N, Q ≤ 2·10^5); each operation swaps the ball numbered x with its right neighbour (its left neighbour if it is last); the final row.
    hints:
      - Finding ball x by scanning the row costs N per operation, 4·10^10 in total. What would let you find it at once?
      - Keep pos[x], the place of ball x, next to row[p], the ball at place p. A swap changes two entries of each.
      - p = pos[x]; q = p + 1, or p − 1 when p is the last place; swap row[p] and row[q]; then set pos[row[p]] = p and pos[row[q]] = q.
  - id: lc-robot-bounded-in-circle
    role: ladder
    card: direct-simulation
    rung: 5
    twist: "The process runs forever: reason about the state after one round of the instructions (Theorem 0.3.1)."
    summary: A robot at (0, 0) facing north repeats a string of G (one step forward), L and R (quarter turns) forever (length ≤ 100); does it stay inside some circle?
    hints:
      - After one round of the instructions, the robot has some position and direction. What happens over the following rounds?
      - If it faces a new direction after one round, then after 4 rounds it is back at (0, 0) facing north, so its path repeats. If it faces north again, every round shifts it by the same vector.
      - Run the instructions once; return true exactly when the robot is back at (0, 0) or does not face north.
  - id: cf-263A
    role: ladder
    card: grid-processing
    rung: 1
    twist: Base case of the card
    summary: A 5 by 5 matrix of zeros with a single 1; the fewest swaps of adjacent rows or adjacent columns that move the 1 to the centre.
    hints:
      - Does swapping two rows change the column of the 1?
      - "No: row swaps move the 1 up or down by one, column swaps left or right by one, independently."
      - Find the 1 at (r, c), 0-based, and print |r − 2| + |c − 2|.
  - id: ac-abc075_b
    role: ladder
    card: grid-processing
    rung: 2
    twist: "All eight neighbours: a direction array of eight offsets with a bounds check."
    summary: An H by W grid (H, W ≤ 50) of bombs and empty squares; replace each empty square by the number of bombs among its eight neighbours.
    hints:
      - How do you visit the eight neighbours of (r, c) without writing eight if statements?
      - Loop over dr and dc from −1 to 1, skipping (0, 0), and check 0 ≤ r + dr < H and 0 ≤ c + dc < W before reading.
      - "For each . cell count the # neighbours that pass the bounds check and write the count as a digit; keep # cells as they are."
  - id: ac-abc096_c
    role: ladder
    card: grid-processing
    rung: 3
    twist: A yes/no question about an operation turns into a check of each cell's four neighbours.
    summary: A target pattern of black squares on an H by W grid (H, W ≤ 50); you may only paint two side-adjacent squares black at a time (painting a square twice is allowed); can you make exactly the pattern?
    hints:
      - Which black squares of the target can never be painted?
      - A black square can be painted together with a neighbour exactly when one of its four side neighbours is black in the target; such pairs never touch a white square.
      - "Answer Yes when every # has a # among its up, down, left and right neighbours inside the grid, otherwise No."
  - id: ac-abc107_b
    role: ladder
    card: grid-processing
    rung: 4
    twist: Decide which rows and columns to keep in one scan of the original grid, then print only those.
    summary: An H by W grid (H, W ≤ 100) of black and white squares with at least one black; remove every all-white row and every all-white column; print what is left.
    hints:
      - Does removing an all-white row change whether some column is all white?
      - "No: a column keeps all its black squares. So the rows and columns to keep can be found from the original grid."
      - "keepRow[i] = row i has a #, keepCol[j] = column j has a #; print a[i][j] for kept i and kept j only."
  - id: lc-spiral-matrix
    role: ladder
    card: grid-processing
    rung: 5
    twist: A walker with a direction array that turns right when the next cell is outside or already visited.
    summary: The entries of an m by n matrix (m, n ≤ 10) in clockwise spiral order, starting at the top-left corner.
    hints:
      - Imagine a walker that records cells. What makes it turn?
      - It turns right when the next cell is outside the matrix or already visited, and it takes exactly m·n steps.
      - "Directions right, down, left, up: dr = {0, 1, 0, −1}, dc = {1, 0, −1, 0}. At each of the m·n steps record and mark the cell; if the next cell fails the bounds or visited check, set d = (d + 1) % 4 first."
  - id: cf-71A
    role: ladder
    card: string-processing
    rung: 1
    twist: Base case of the card
    summary: "Abbreviate each of n words (n ≤ 100, length ≤ 100): a word longer than 10 letters becomes its first letter, the number of letters between, and its last letter."
    hints:
      - What do you need to know about a long word to abbreviate it?
      - Only its first letter, its last letter and its length.
      - Print s when |s| ≤ 10, else s[0], then |s| − 2, then the last letter.
  - id: ac-abc124_c
    role: ladder
    card: string-processing
    rung: 2
    twist: Only two valid final strings exist; count the mismatches against one of them in a single pass.
    summary: A row of tiles given as a 0/1 string (length ≤ 10^5); repaint as few tiles as possible so that neighbouring tiles differ.
    hints:
      - How many 0/1 strings of length n have all neighbouring characters different?
      - "Exactly two: 0101… and 1010…. Each position mismatches exactly one of them."
      - Count c, the positions where s[i] differs from i % 2; the answer is min(c, n − c).
  - id: ac-abc053_b
    role: ladder
    card: string-processing
    rung: 3
    twist: The longest such substring is fixed by two positions found in one scan.
    summary: The greatest length of a substring of s (|s| ≤ 2·10^5) that starts with A and ends with Z; one is guaranteed to exist.
    hints:
      - Which A should the substring start at, and which Z should it end at?
      - "The first A and the last Z: since some A comes before some Z, the first A comes before the last Z."
      - In one scan record the first index of A and the last index of Z; print last − first + 1.
  - id: ac-abc342_c
    role: ladder
    card: string-processing
    rung: 4
    twist: Apply the Q replacements to the 26 letters, not to the N characters.
    summary: A string of length N (≤ 2·10^5) and Q (≤ 2·10^5) operations "replace every c by d"; the final string.
    hints:
      - Rewriting the whole string per operation costs N·Q = 4·10^10. Which state actually changes per operation?
      - "Keep to[x], the letter that an original letter x has become so far. An operation (c, d) sets to[x] = d for every x with to[x] = c: 26 checks."
      - "Start with to[x] = x; for each operation loop over the 26 letters; at the end print to[s[i]] for each i: O(26·Q + N)."
  - id: ac-abc314_d
    role: ladder
    card: string-processing
    rung: 5
    twist: Only the last whole-string case change matters; single-character changes after it keep their own case.
    summary: "A string of upper and lower case letters (N ≤ 5·10^5) and Q (≤ 5·10^5) operations: set one character, make every letter lowercase, or make every letter uppercase; the final string."
    hints:
      - A whole-string operation costs N, so Q of them are too slow. Which of them actually affect the final string?
      - "Only the last one: it decides the case of every character last set before it. Characters set after it keep the case they were given."
      - "Store each position's last set time, and the time and type of the last whole-string operation; apply the single changes, then change the case of every position last set before that operation: O(N + Q)."
  - id: cf-1360A
    role: ladder
    card: case-analysis
    rung: 1
    twist: Base case of the card
    summary: "For each of t tests: the smallest area of a square that holds two a by b rectangles (a, b ≤ 100) without overlap, sides parallel to the square, rotation allowed."
    hints:
      - Put the two rectangles next to each other. Along which side?
      - Side by side along the shorter side gives a box of 2·min(a, b) by max(a, b); the other placements are never smaller.
      - side = max(2·min(a, b), max(a, b)); print side².
  - id: ac-abc205_c
    role: ladder
    card: case-analysis
    rung: 2
    twist: "Compare two huge powers without computing them: the parity of the exponent splits the cases."
    summary: Compare A^C with B^C (|A|, |B| ≤ 10^9, 1 ≤ C ≤ 10^9) and print <, > or =.
    hints:
      - A^C is far too large to compute. When C is even, what do A^C and B^C depend on?
      - "Even C: only |A| and |B| matter. Odd C: raising to the power C keeps the order of A and B."
      - If C is even, replace A and B by |A| and |B|; then compare A with B.
  - id: ac-abc108_b
    role: ladder
    card: case-analysis
    rung: 3
    twist: "Instead of cases by direction, rotate the side vector by 90 degrees: one rule covers every case."
    summary: Two consecutive corners (x1, y1), (x2, y2) of a square, listed counter-clockwise (coordinates ≤ 100); print the other two corners.
    hints:
      - Let (dx, dy) = (x2 − x1, y2 − y1). What is the next side, going counter-clockwise?
      - Rotating (dx, dy) by 90 degrees counter-clockwise gives (−dy, dx), whatever the signs of dx and dy.
      - x3 = x2 − dy, y3 = y2 + dx, x4 = x1 − dy, y4 = y1 + dx.
  - id: ac-abc255_c
    role: ladder
    card: case-analysis
    rung: 4
    twist: "Cases by where X falls: before the first term, after the last, or between two terms; a negative difference is turned around first."
    summary: The distance from X to the nearest term of A, A + D, …, A + (N − 1)D (|X|, |A| ≤ 10^18, |D| ≤ 10^6, N ≤ 10^12).
    hints:
      - Make the difference non-negative first. Where can X lie relative to the terms?
      - If D < 0, use the first term A + (N − 1)D and the difference −D instead. Then X is below the smallest term, above the largest, or between two consecutive terms (D = 0 means one value).
      - "Below: smallest − X; above: X − largest; between: r = (X − smallest) mod D, answer min(r, D − r). All in long long: (N − 1)·|D| ≤ 10^18."
  - id: ac-abc359_c
    role: ladder
    card: case-analysis
    rung: 5
    twist: Move both points to the left half of their tile, then count tiles with a formula.
    summary: The plane is covered by 2 by 1 tiles in a brick pattern; the fewest tiles entered to go from (S_x + 0.5, S_y + 0.5) to (T_x + 0.5, T_y + 0.5) (coordinates ≤ 2·10^16).
    hints:
      - Every step up or down enters a new tile. How far sideways can you move for free while moving vertically?
      - Shift each point to the left square of its tile (subtract 1 from x when x + y is odd). With dx = |S_x − T_x| and dy = |S_y − T_y|, each vertical step can also move one unit sideways.
      - After the shift, the answer is dy + max(0, (dx − dy) / 2).
  - id: ac-abc300_c
    role: worked_example
    summary: "An H by W grid (H, W ≤ 100) holding crosses of # that do not touch; count the crosses of each size from 1 to min(H, W)."
  - id: ac-abc282_c
    role: worked_example
    summary: In a string (N ≤ 2·10^5) with an even number of double quotes, replace every comma outside the quoted parts by a dot.
  - id: ac-abc392_c
    role: drill
    summary: Person i wears bib Q_i and stares at person P_i (N ≤ 3·10^5); for each bib number, the bib number of the person its wearer stares at.
  - id: ac-abc322_c
    role: drill
    summary: Fireworks on M of N festival days (N ≤ 2·10^5, always on the last day); for each day, how many days until the next fireworks.
  - id: ac-abc265_c
    role: drill
    summary: On an H by W grid of arrows U, D, L, R (H, W ≤ 500), follow the arrows from the top-left corner until an arrow points outside; print the last square, or −1 if the walk never stops.
  - id: ac-abc297_c
    role: drill
    summary: In each row of an H by W grid (H, W ≤ 100), turn as many disjoint pairs of horizontally adjacent T into PC as possible.
  - id: ac-abc380_c
    role: drill
    summary: In a 0/1 string (N ≤ 5·10^5), move the K-th maximal block of 1s to right after the (K − 1)-th one.
  - id: ac-abc394_c
    role: drill
    summary: Repeatedly replace the leftmost WA in a string (length ≤ 3·10^5) by AC until none is left; print the result.
  - id: ac-abc239_c
    role: drill
    summary: Is there a lattice point at distance √5 from both of two given lattice points (coordinates up to 10^9)?
  - id: cf-1676C
    role: drill
    summary: "For each of t tests: among n words of length m (n ≤ 50, m ≤ 8), the smallest total letter distance between two of them."
  - id: ac-abc189_c
    role: drill
    summary: N dishes in a row (N ≤ 10^4) with A_i oranges; choose a range and eat the same number x from each dish (x at most every dish in the range); the most oranges.
  - id: ac-abc419_c
    role: drill
    summary: N people on a huge grid (N ≤ 2·10^5) move one step to any of the 8 neighbours or stay each second; the earliest time all can meet.
  - id: ac-abc237_c
