# Topic 1.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.2"
cards:
  - id: range-sum
    name: Range sums of a fixed array
    decisive_property: The array does not change, and every question asks for the sum (or count) of a range, so prefix sums answer each one as P[r+1] − P[l] in O(1) after O(n) preparation.
    from_theorem: Theorem 1.2.1
    how_to_test: Check that no update arrives between questions and that the quantity can be undone by subtraction (a sum or a count, not a maximum).
    weak_signals:
      - Many queries "sum (or number of …) from l to r"
      - A split point i with "everything before i" and "everything after i" measured by sums or counts
      - n and q both up to 2·10^5
      - Substring queries counting a local pattern (two equal neighbours, an "AC"), turned into a 0/1 mark per position
    kill_signals:
      - Values change between queries (later topics)
      - The query asks for a maximum or minimum of a middle range
    lookalikes:
      - description: The same queries, but some operations change an element
        needs: "a tree structure (topic 5.2, later)"
        flipping_difference: Updates between queries would force rebuilding the prefix sums.
    complexity: O(n) preparation, O(1) per query.
  - id: prefix-count-lookup
    name: Pairs of prefix values
    decisive_property: The condition on a subarray [l, r] is a condition on the pair (P[l], P[r+1]) alone, such as an exact difference K or equal remainders, so scanning the prefix sums with a map of earlier values counts or finds the subarrays, even with negative values.
    from_theorem: Theorem 1.2.2
    how_to_test: Rewrite the condition with P[r+1] − P[l]. If it becomes "P[l] equals something computed from P[r+1]", count earlier values with a map.
    weak_signals:
      - '"Count the subarrays with sum exactly K" or "sum divisible by k"'
      - Negative values are allowed
      - Balanced segments (as many A as B), turned into sums of +1 and −1
    kill_signals:
      - The condition is "sum at most K" (an inequality, not a lookup of one value)
      - The subarray must satisfy something that is not a function of its sum
    lookalikes:
      - description: Longest subarray with sum at most K, all values positive
        needs: "moving both ends of the segment forward (topic 1.3, later)"
        flipping_difference: An inequality on positive values is closed under shrinking; an exact sum with any values is a lookup.
    complexity: O(n log n) with map, O(n) on average with unordered_map.
  - id: difference-array
    name: Many range updates, then one read
    decisive_property: All updates add a value to a range and come before all reads, so each update is two changes in the difference array, and one running sum rebuilds the array.
    from_theorem: Theorem 1.2.3
    how_to_test: Check that no read happens between updates, that updates add (not set) values, and that positions fit in an array.
    weak_signals:
      - '"For each of q operations, add v to every element from l to r; print the final array"'
      - Coverage counts of many intervals on a short line
      - Ranges of answers each receiving +1
    kill_signals:
      - A query arrives between updates
      - Coordinates up to 10^9 (sort events instead, topic 1.1)
    lookalikes:
      - description: Each operation shifts a whole prefix of the string
        needs: range-sum (1.2), suffix sums of the shifts
        flipping_difference: When every update covers a prefix, each position's total is a suffix sum of the updates, with no difference array needed.
    complexity: O(1) per update, O(n) for the read.
  - id: prefix-2d
    name: Rectangles in a grid
    decisive_property: The grid is fixed (or all rectangle updates come before the reads), so the four-corner formula on 2D prefix sums gives any rectangle sum in O(1), and four corner changes record any rectangle update.
    from_theorem: Theorem 1.2.4
    how_to_test: Check that every query is an axis-parallel rectangle of a grid that does not change between queries.
    weak_signals:
      - Sums or counts over sub-rectangles of an H × W grid
      - '"Add 1 to every cell of the rectangle", then print the grid'
      - The same 1D question asked about a grid
    kill_signals:
      - Shapes other than rectangles (diagonals, paths)
      - The grid changes between queries
    lookalikes:
      - description: Count the cells of each colour in a rectangle of a grid that repeats with period N
        needs: prefix-2d (1.2) plus counting whole periods (0.4)
        flipping_difference: The grid is huge but periodic, so the rectangle is split into whole periods and partial pieces before the formula applies.
    complexity: O(HW) preparation, O(1) per rectangle.
  - id: prefix-extremes
    name: Best value before or after a position
    decisive_property: Each question needs the maximum or minimum of everything before a position or after it (never a middle range), so prefix and suffix extremes, each computed with one comparison per step, answer it in O(1).
    from_theorem: Theorem 1.2.5
    how_to_test: Write the question for a fixed position i; check that the other side of i is a prefix or a suffix.
    weak_signals:
      - '"Buy before you sell", the largest a_j − a_i with i < j'
      - '"The best value excluding position i", "the best split point"'
      - The largest subarray sum
      - '"Remove (or replace) one element", then the gcd, maximum or minimum of the rest: prefix and suffix versions of an operation that cannot be undone'
    kill_signals:
      - The maximum of an arbitrary range [l, r] is needed (topic 5.1, later)
    lookalikes:
      - description: The largest sum of a subarray of length exactly k
        needs: range-sum (1.2)
        flipping_difference: A fixed length fixes the start, so each candidate is one range sum; no running minimum is needed.
    complexity: O(n) for all prefixes and suffixes.
problems:
  - id: lc-running-sum-of-1d-array
    role: ladder
    card: range-sum
    rung: 1
    twist: Base case of the card
    summary: "Return the running sums of an array of n ≤ 1000 values: the i-th output is the sum of the first i + 1 values."
    hints:
      - How does the i-th running sum relate to the (i − 1)-th?
      - "It is the previous one plus nums[i]: the recurrence P_{k+1} = P_k + a_k of Theorem 1.2.1."
      - Keep one running total and write it after each element.
  - id: lc-range-sum-query-immutable
    role: ladder
    card: range-sum
    rung: 2
    twist: Many range-sum queries on the same array.
    summary: Answer up to 10^4 queries "sum of nums[left..right]" on a fixed array of n ≤ 10^4 values.
    hints:
      - What can be prepared once so that each query is fast?
      - "Prefix sums with P_0 = 0; the sum of nums[left..right] is P_{right+1} − P_left (Theorem 1.2.1)."
      - "Build P in the constructor (size n + 1) and return P[right + 1] − P[left]."
  - id: cses-1646
    role: ladder
    card: range-sum
    rung: 3
    twist: 1-based queries, 2·10^5 of them, and sums beyond int.
    summary: n, q ≤ 2·10^5; values up to 10^9; print the sum of each queried range [a, b] (1-based).
    hints:
      - How large can a range sum be?
      - "Up to 2·10^5 · 10^9 = 2·10^14: long long. With 1-based queries, the sum of [a, b] is P[b] − P[a − 1]."
      - Read with fast input, build P, answer each query in O(1).
  - id: lc-left-and-right-sum-differences
    role: ladder
    card: range-sum
    rung: 4
    twist: Every position needs both the sum before it and the sum after it.
    summary: "For each i of an array (n ≤ 1000), the absolute difference between the sum of the elements left of i and the sum right of i."
    hints:
      - Express "the sum right of i" with the total and a prefix sum.
      - "Left sum is P_i; right sum is total − P_{i+1}."
      - "One pass for the total, one pass keeping P_i; answer |P_i − (total − P_i − nums[i])|."
  - id: lc-find-pivot-index
    role: ladder
    card: range-sum
    rung: 5
    twist: Search for the first position where the two sides are equal, with negative values.
    summary: The leftmost index of an array (n ≤ 10^4, values in [−1000, 1000]) where the sum of the elements before it equals the sum after it, or −1.
    hints:
      - Same two sums as the previous rung. Which position do you return?
      - The first i with P_i = total − P_i − nums[i]; negative values only change nothing in the formula.
      - Scan i from 0 with a running left sum and return at the first match.
  - id: lc-number-of-ways-to-split-array
    role: ladder
    card: range-sum
    rung: 6
    twist: Count the split points instead of finding one, and the sums can pass int.
    summary: Count the indices i < n − 1 where the sum of the first i + 1 elements is at least the sum of the rest (n ≤ 10^5, |values| ≤ 10^5).
    hints:
      - How large can the sums get, and how do you get both sides at every split?
      - "Up to 10^10: long long. Left = P_{i+1}, right = total − P_{i+1}."
      - Scan i from 0 to n − 2 with a running sum and count the splits with left ≥ right.
  - id: lc-subarray-sum-equals-k
    role: ladder
    card: prefix-count-lookup
    rung: 1
    twist: Base case of the card
    summary: Count the subarrays with sum exactly k in an array of n ≤ 2·10^4 values that may be negative.
    hints:
      - Write the sum of a subarray with two prefix sums. What must hold for it to equal k?
      - "P_j − P_i = k, i.e. P_i = P_j − k: count earlier prefix sums equal to P_j − k (Theorem 1.2.2)."
      - "Scan with a map of prefix-sum counts starting with {0: 1}; add count[P − k] before inserting P."
  - id: lc-count-number-of-nice-subarrays
    role: ladder
    card: prefix-count-lookup
    rung: 2
    twist: The quantity summed is "is this element odd", not the element.
    summary: Count the subarrays containing exactly k odd numbers (n ≤ 5·10^4).
    hints:
      - Replace each number by something whose sum over a subarray is the number of odd elements.
      - "1 for odd, 0 for even. Now it is \"subarrays with sum exactly k\"."
      - Apply the previous rung's scan to the 0/1 array (an array of counts works instead of a map, since prefix values are at most n).
  - id: cf-1398C
    role: ladder
    card: prefix-count-lookup
    rung: 3
    twist: The condition compares the sum with the length; subtracting 1 from every element turns it into "sum zero".
    summary: "Count the subarrays of a digit string whose digit sum equals their length (sum of lengths ≤ 10^5, t test cases)."
    hints:
      - "Sum = length means Σ a_i = Σ 1 over the subarray. Move everything to one side."
      - "Σ (a_i − 1) = 0: subarrays with sum 0 of the shifted values, i.e. pairs of equal prefix sums."
      - "Count equal prefix sums of (digit − 1) with a map starting from {0: 1}; the count needs long long."
  - id: cf-466C
    role: ladder
    card: prefix-count-lookup
    rung: 4
    twist: Two cut points must be chosen in order, so the count of earlier good first cuts is kept while scanning for the second cut.
    summary: "Count the ways to cut an array (n ≤ 5·10^5) into three non-empty consecutive parts with equal sums."
    hints:
      - If the total is S, what must the prefix sums be at the two cuts?
      - "S/3 at the first cut and 2S/3 at the second (S must be divisible by 3), with the first cut strictly before the second."
      - "Scan the cut positions; at a position with P = 2S/3, add the number of earlier positions with P = S/3; then, if P = S/3 here, count it. long long."
  - id: lc-corporate-flight-bookings
    role: ladder
    card: difference-array
    rung: 1
    twist: Base case of the card
    summary: "n ≤ 2·10^4 flights and 2·10^4 bookings, each reserving s seats on every flight from first to last; the total seats per flight."
    hints:
      - Adding s to every flight of every booking can cost 4·10^8. What changes only at the ends of a booking?
      - "The difference between neighbouring flights: +s at first, −s after last (Theorem 1.2.3)."
      - "d[first] += s, d[last + 1] −= s for each booking, then a running sum over the flights."
  - id: ac-abc183_d
    role: ladder
    card: difference-array
    rung: 2
    twist: The read is a check of every time against a capacity, and the intervals are half-open.
    summary: N ≤ 2·10^5 people each use P_i litres per minute from time S_i to T_i (exclusive, times ≤ 2·10^5); can a heater of W litres per minute supply everyone?
    hints:
      - Times are small. What do you need to know at every minute?
      - "The total use at that minute: a sum of range additions [S_i, T_i), all known in advance."
      - "d[S] += P, d[T] −= P; a running sum over the times; answer No if it ever exceeds W. long long."
  - id: cf-295A
    role: ladder
    card: difference-array
    rung: 3
    twist: The updates are themselves applied in ranges, so two difference arrays are nested.
    summary: "An array (n ≤ 10^5), m operations \"add d on [l, r]\", and k queries each applying the operations x..y once; print the final array."
    hints:
      - First find out how many times each operation is applied in total.
      - "Each query adds 1 to a range of operations: a difference array over the operations gives each operation's count c."
      - "Then apply each operation once with value c·d through a difference array over the elements. long long."
  - id: cses-1652
    role: ladder
    card: prefix-2d
    rung: 1
    twist: Base case of the card
    summary: In an n × n forest map (n ≤ 1000) of trees and empty squares, count the trees in each of q ≤ 2·10^5 rectangles.
    hints:
      - Turn the map into numbers first. What is a rectangle count then?
      - "1 for a tree, 0 otherwise; a count is a rectangle sum, given by four 2D prefix sums (Theorem 1.2.4)."
      - "Build S with a zero row and column, and answer S[y2][x2] − S[y1−1][x2] − S[y2][x1−1] + S[y1−1][x1−1]."
  - id: lc-range-sum-query-2d-immutable
    role: ladder
    card: prefix-2d
    rung: 2
    twist: 0-based coordinates and negative values, behind a class interface.
    summary: Answer up to 10^4 queries "sum of the sub-rectangle (row1, col1)–(row2, col2)" on a fixed matrix of at most 200 × 200 values (negative allowed).
    hints:
      - Which index shift makes all four corner terms exist without special cases?
      - "S[x][y] = sum of rows < x and columns < y, sized (m + 1) × (n + 1)."
      - "Return S[row2+1][col2+1] − S[row1][col2+1] − S[row2+1][col1] + S[row1][col1]."
  - id: ac-abc331_d
    role: ladder
    card: prefix-2d
    rung: 3
    twist: The grid is 10^9 × 10^9 but repeats an N × N pattern, so counts of whole periods are combined with prefix sums of the pattern.
    summary: A 10^9 × 10^9 grid colours square (i, j) by the N × N pattern (N ≤ 1000) at (i mod N, j mod N); answer Q ≤ 2·10^5 black-square counts of rectangles.
    hints:
      - "Answer a simpler question first: the black squares in the rectangle from (0, 0) to (x − 1, y − 1). How many full copies of the pattern does it contain?"
      - "(x / N)·(y / N) full copies, plus strips: f(x, y) uses the pattern's 2D prefix sums for the remainders x mod N, y mod N and multiples of the full row and column sums."
      - "Write f(x, y) for the rectangle from the origin, then use the four-corner formula on f. long long."
  - id: lc-best-time-to-buy-and-sell-stock
    role: ladder
    card: prefix-extremes
    rung: 1
    twist: Base case of the card
    summary: "Prices for n ≤ 10^5 days; the largest profit from buying on one day and selling on a later day (0 if none)."
    hints:
      - Fix the selling day. Which buying day is best?
      - The cheapest day before it, a prefix minimum (Theorem 1.2.5, part 3).
      - Scan the days keeping the smallest price so far; the answer is the largest price − minimum, at least 0.
  - id: lc-minimum-value-to-get-positive-step-by-step-sum
    role: ladder
    card: prefix-extremes
    rung: 2
    twist: The extreme is taken over the prefix sums, not the elements.
    summary: The smallest positive start value such that start + (each running sum of an array of n ≤ 100 values) stays at least 1.
    hints:
      - Which running sum is the dangerous one?
      - "The smallest prefix sum m: start + m ≥ 1 must hold, and start ≥ 1."
      - "Answer max(1, 1 − m), with m the minimum of the running sums."
  - id: lc-maximum-subarray
    role: ladder
    card: prefix-extremes
    rung: 3
    twist: Both parts together, the best of P_j minus the smallest earlier prefix sum.
    summary: The largest sum of a non-empty subarray of n ≤ 10^5 values (negative allowed).
    hints:
      - Write a subarray sum with prefix sums. For a fixed end j, which start is best?
      - "The one with the smallest earlier prefix sum P_i, i < j (Theorem 1.2.5, part 4)."
      - Scan, keeping the minimum of P_0..P_{j−1} and updating the best P_j − minimum before adding P_j to the minimum.
  - id: ac-abc122_c
    role: worked_example
    summary: For a string of length N ≤ 10^5 over A, C, G, T and Q ≤ 10^5 queries [l, r], count the occurrences of "AC" inside S[l..r].
  - id: lc-trapping-rain-water
