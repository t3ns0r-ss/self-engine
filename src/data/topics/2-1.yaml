    role: worked_example
    summary: "Up to 10^6 integers up to 10^6: are they pairwise coprime, only coprime as a whole set, or neither?"
  - id: ac-abc383_d
    role: worked_example
    summary: Count the integers up to N ≤ 4·10^12 with exactly 9 divisors.
