# Topic 2.2 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '2.2'
uses:
- topic: '0.1'
  what: long long, overflow, and __int128
- topic: '0.2'
  what: 'Complexity analysis: the cost of a loop that halves its counter'
- topic: '0.3'
  what: Case analysis and grid processing
- topic: '0.4'
  what: Congruences, % with negative numbers, and reducing after every operation (Theorem 0.4.4)
- topic: '0.5'
  what: 'Brute force: reading the bits of an exponent (bitmasks)'
- topic: '0.6'
  what: Sets and maps for counting
- topic: '1.1'
  what: Sorting
- topic: '1.2'
  what: Prefix sums and products over ranges
- topic: '1.3'
  what: Two pointers over sorted values
- topic: '1.5'
  what: Greedy choices
- topic: '1.7'
  what: Bits of a number, read one at a time
- topic: '2.1'
  what: Primes, Euclid's lemma and the extended Euclidean algorithm (Theorem 2.1.2)
theorems:
- id: 2.2.1
  title: Binary exponentiation
  plain_words: To compute a^b modulo m, square the base repeatedly and multiply it into the result at
    each bit of b that is 1. That takes one round per bit of b, about 60 rounds for b up to 10^18, instead
    of b multiplications.
  code: 2.2/thm-1
- id: 2.2.2
  title: Fermat's little theorem
  plain_words: For a prime p and a not divisible by p, raising a to the power p − 1 gives remainder 1.
    The numbers a, 2a, …, (p − 1)a are just 1, …, p − 1 in another order, which makes their products equal.
  code: 2.2/thm-2
- id: 2.2.3
  title: Modular inverse
  plain_words: A number a can be divided out modulo m exactly when a and m share no factor. The inverse
    comes from extended Euclid for any such m, and equals a^(p−2) when m is a prime p.
  code: 2.2/thm-3
- id: 2.2.4
  title: Fractions modulo a prime
  plain_words: A fraction P/Q with Q not divisible by p stands for the residue P·Q^(−1). Adding, multiplying
    and dividing fractions then agrees with doing the same on residues, so a whole computation with fractions
    can be done modulo p.
  code: 2.2/thm-4
- id: 2.2.5
  title: Exponent reduction
  plain_words: When the modulus p is prime and p does not divide the base, powers repeat with period p
    − 1, so the exponent can be taken modulo p − 1. If p divides the base, every positive power is 0.
  code: 2.2/thm-5
- id: 2.2.6
  title: Inverses of 1..n
  plain_words: The inverses of 1, …, n modulo a prime p can all be computed in O(n) time, each from an
    earlier one by inv[i] = −(p / i)·inv[p mod i], without a power for each.
  code: 2.2/thm-6
cards:
- id: fast-power
  name: Powers with huge exponents
  decisive_property: The answer is a power a^b (or a product of a few powers) modulo m, and b is far too
    large to multiply b times (up to 10^18); squaring the base at each bit of b gives it in O(log b) multiplications.
  from_theorem: 2.2.1
  how_to_test: Write the answer as a closed formula; if it contains x^n with n beyond about 10^7, and
    only the remainder is asked, the card applies.
  constraint_shapes:
  - 'n up to 10^18 and "print the answer modulo 10^9 + 7": multiplying n times is 10^18 steps, while squaring
    takes about 60 rounds.'
  weak_signals:
  - form: '"Print the answer modulo 10^9 + 7" with a formula like k^n or (k − 1)^n'
    shape: n up to 10^9 or 10^18
  - form: Each of n independent positions has k choices; count the arrangements
    shape: n up to 10^18
  - form: The number of strings, colourings or subsets for a huge length
    shape: Length up to 10^9
  kill_signals:
  - 'The modulus is the power itself (m mod 2^n): for 1000 mod 2^40 the answer is 1000, and computing
    2^40 in 32 bits gives 0 and a division by zero.'
  - 'The quantity is a sum of powers whose last step is a division by a number that has no inverse: (3^10
    − 1)/2 modulo 1000 gives 24, but the sum is 524.'
  in_action:
    statement: Print 2^n − 2 modulo 10^9 + 7 for n up to 10^18.
    constraints: n ≤ 10^18, one query, 1 second.
    budget: n multiplications are 10^18 steps. Squaring takes ⌊log2 n⌋ + 1 ≤ 60 rounds.
    candidates:
    - tool: Multiply by 2, n times, reducing each time
      verdict: rejected
      because: 10^18 steps; the direct loop is correct but far too slow.
    - tool: Binary exponentiation
      verdict: chosen
      because: One round per bit of n, and each product of two residues below 10^9 + 7 fits in long long.
    property_check: The answer is a power with exponent n up to 10^18 and a modulus whose products fit
      64 bits (Theorem 2.2.1).
    decision: Compute power(2, n, MOD), subtract 2, and add MOD if the result is negative.
  examples:
    positive:
    - inline:
        input: 3^13 modulo 1000
        answer: '323'
        why: 13 = 1101 in binary, so four rounds; the result is 243 · 561 mod 1000 = 323.
    - worked_example: ac-abc162_e
      why: The number of sequences of N values that are multiples of d is (K/d)^N with N up to 10^5; each
        one is a power modulo 10^9 + 7.
    negative:
    - inline:
        input: 1000 mod 2^40 (the power is the modulus)
        answer: '1000'
        method_gives: mod-by-zero
        why: 2^40 is far above 1000, so the remainder is 1000 itself. Computing 2^40 in a 32-bit variable
          wraps to 0 and the division fails; no power is needed.
      correct_tool:
        topic: '0.1'
        card: overflow-64bit
    - inline:
        input: The sum 1 + 3 + … + 3^9 modulo 1000, as (3^10 − 1) / 2 after reducing the power
        answer: '524'
        method_gives: '24'
        why: Dividing by 2 after the reduction is wrong, since 2 has no inverse modulo 1000; the sum is
          29524 and 29524 mod 1000 = 524. Add the terms one by one for small n, or split the sum in halves
          for large n.
      correct_tool:
        topic: '0.3'
        card: direct-simulation
  lookalikes:
  - description: Print m mod 2^n for n up to 10^8
    tool:
      topic: '0.1'
      card: overflow-64bit
    flipping_difference: Here the power is the modulus, not the value; once 2^n exceeds m the answer is
      m itself.
  complexity: O(log b) multiplications.
- id: inverse-prime
  name: Division and fractions modulo a prime
  decisive_property: The formula divides (or the answer is a fraction P/Q), and the modulus is a prime
    p that does not divide the divisors; multiplying by the inverse a^(p−2) keeps every step modulo p,
    and the result is the residue of the exact answer.
  from_theorem: 2.2.3
  how_to_test: Check that the modulus is prime (10^9 + 7 and 998244353 are) and that no divisor in the
    formula can be a multiple of it.
  constraint_shapes:
  - 'n up to 2·10^5 fractions or n! divisors: one Fermat power per inverse is 2·10^5 · 30 = 6·10^6 steps,
    and the table of inverses of 1..n is n steps.'
  weak_signals:
  - form: '"Print the answer as P·Q^(−1) mod 998244353", or a probability modulo a prime'
    shape: P and Q up to 10^9 and a prime modulus
  - form: A formula with a division, such as a geometric sum (r^n − 1)/(r − 1)
    shape: n up to 10^18 and a prime modulus
  - form: Undoing a multiplication applied to many values at once
    shape: n up to 2·10^5 values
  kill_signals:
  - 'The modulus is not prime: modulo 10, a^(10 − 2) = 4^8 = 6 is no inverse of 4 (4 · 6 = 24 ≡ 4), and
    4 has none; use extended Euclid when gcd(a, M) = 1.'
  - 'The divisor can be a multiple of p: for 1 + 8 + 8² + 8³ + 8⁴ modulo 7 the formula divides by 8 −
    1 = 7, its inverse formula gives 0, and the sum is 5; handle that ratio separately.'
  in_action:
    statement: Print 1/2 + 1/3 + … (the sum of n fractions P_i/Q_i) as a value modulo 998244353.
    constraints: n ≤ 2·10^5, Q_i ≤ 10^9 and not a multiple of 998244353.
    budget: Adding exact fractions overflows; each term is one power of about 30 rounds, 6·10^6 steps
      in all.
    candidates:
    - tool: Exact fractions with a common denominator
      verdict: rejected
      because: The numerator and denominator grow past any integer type.
    - tool: Residues with inverses by Fermat
      verdict: chosen
      because: 998244353 is prime and no Q_i is a multiple of it, so P·Q^(p−2) is the residue of each
        term, and residues add.
    property_check: The modulus is prime and p does not divide any Q_i, so every inverse exists (Theorems
      2.2.3 and 2.2.4).
    decision: sum += P % p * power(Q, p − 2, p) for every fraction, all modulo p.
  examples:
    positive:
    - inline:
        input: 1/2 + 1/3 as a value modulo 7
        answer: '2'
        why: 1/2 + 1/3 = 5/6, and modulo 7 the residues are 4 + 5 = 9 ≡ 2; indeed 6 · 2 = 12 ≡ 5.
    - worked_example: cses-2182
      why: The sum of divisors is a product of geometric sums (x^(k+1) − 1)/(x − 1), and x − 1 is not
        a multiple of 10^9 + 7 for x ≤ 10^6.
    negative:
    - inline:
        input: The inverse of 4 modulo 10, computed as 4^(10 − 2) mod 10
        answer: '-1'
        method_gives: '6'
        why: 10 is not prime, so Fermat does not apply, and 4 shares the factor 2 with 10 so it has no
          inverse (the method's 6 gives 4 · 6 = 24 ≡ 4).
      correct_tool:
        topic: '2.1'
        card: bezout
    - inline:
        input: 1 + 8 + 8² + 8³ + 8⁴ modulo 7, as (8^5 − 1) / (8 − 1) with an inverse of 7
        answer: '5'
        method_gives: '0'
        why: The divisor 8 − 1 = 7 is a multiple of the prime 7, so it has no inverse and the formula
          yields 0; the five terms are each 1 modulo 7. Sum the terms, or split the sum in halves.
      correct_tool:
        topic: '2.2'
        card: fast-power
  lookalikes:
  - description: A geometric sum 1 + r + … + r^(n−1) modulo an arbitrary M
    tool:
      topic: '2.2'
      card: fast-power
    flipping_difference: M is not prime, so (r^n − 1)/(r − 1) cannot be divided; split the sum in halves
      recursively instead.
  complexity: O(log p) per inverse, or O(n) for the inverses of 1..n.
- id: exponent-reduction
  name: Reducing huge exponents
  decisive_property: The exponent itself is too large to store or is a power or product (a^(b^c), an exponent
    given as a huge number), and the modulus p of the base is prime with p ∤ a; then the exponent may
    be reduced modulo p − 1.
  from_theorem: 2.2.5
  how_to_test: Check that the base's modulus is prime, that the base is not a multiple of it (or treat
    that case alone), and reduce the exponent modulo p − 1, not p.
  constraint_shapes:
  - 'a^(b^c) with b, c up to 10^9: the exponent b^c has 10^10 digits, so it cannot be formed; b^c mod
    (p − 1) takes about 30 rounds.'
  weak_signals:
  - form: Towers of powers a^(b^c) modulo 10^9 + 7
    shape: a, b, c up to 10^9
  - form: An exponent given as a list of digits or as a huge product
    shape: Up to 10^5 factors or digits
  - form: The product of all divisors, or a power of a count that is itself huge
    shape: A count modulo 10^9 + 6 used as an exponent
  kill_signals:
  - 'The base can be a multiple of p: 7^6 modulo 7 is 0, but reducing 6 modulo 6 gives 7^0 = 1.'
  - 'The modulus is not prime: 3^100 modulo 10 is 1, but reducing 100 modulo 9 gives 3^1 = 3.'
  in_action:
    statement: Print a^(b^c) modulo 10^9 + 7 for a, b, c up to 10^9.
    constraints: a, b, c ≤ 10^9, up to 10^5 queries.
    budget: The exponent b^c is too large to compute. Reducing it modulo p − 1 costs 30 rounds, and the
      outer power another 30.
    candidates:
    - tool: Compute b^c exactly, then the power
      verdict: rejected
      because: b^c has up to 9·10^9 digits.
    - tool: Reduce the exponent modulo p − 1
      verdict: chosen
      because: The modulus 10^9 + 7 is prime, so a^e depends only on e mod (p − 1) when p does not divide
        a.
    property_check: The modulus is prime and a is not a multiple of it (a multiple is answered separately),
      so the exponent may be reduced (Theorem 2.2.5).
    decision: If p | a print 0 (or 1 when the exponent is 0); otherwise e = power(b, c, p − 1) and print
      power(a, e, p).
  examples:
    positive:
    - inline:
        input: 3^100 modulo 7
        answer: '4'
        why: 100 mod 6 = 4, so the power is 3^4 = 81 ≡ 4.
    - inline:
        input: 2^(3^4) modulo 5
        answer: '2'
        why: 3^4 = 81 and 81 mod 4 = 1, so the power is 2^1 = 2.
    negative:
    - inline:
        input: 7^6 modulo 7 (the base is a multiple of the prime)
        answer: '0'
        method_gives: '1'
        why: Every positive power of a multiple of 7 is a multiple of 7; reducing the exponent 6 to 0
          would give 7^0 = 1. The multiple of p is answered on its own.
      correct_tool:
        topic: '0.4'
        card: divisibility
    - inline:
        input: 3^100 modulo 10 (the modulus is not prime)
        answer: '1'
        method_gives: '3'
        why: Reducing modulo 10 − 1 = 9 is not valid; the exponent 100 is small enough for fast power
          directly, and 3^100 ≡ 1 modulo 10.
      correct_tool:
        topic: '2.2'
        card: fast-power
  lookalikes:
  - description: a^b mod p with b ≤ 10^18 given directly
    tool:
      topic: '2.2'
      card: fast-power
    flipping_difference: b fits in a long long, so fast power handles it without any reduction.
  complexity: O(log p) after reducing the exponent.
problems:
- id: ac-abc162_e
  role: worked_example
  summary: The sum of the GCDs of all K^N sequences with entries in [1, K] (N, K ≤ 10^5), modulo 10^9
    + 7.
- id: cses-2182
  role: worked_example
  summary: Given a prime factorisation (up to 10^5 primes ≤ 10^6, exponents ≤ 10^9), the number, sum and
    product of the divisors modulo 10^9 + 7.
- id: cses-1095
  role: ladder
  card: fast-power
  rung: 1
  twist: Base case of the card
  summary: For n ≤ 2·10^5 pairs (a, b) with a, b ≤ 10^9, print a^b modulo 10^9 + 7 (with 0^0 = 1).
  hints:
  - Multiplying b times is 10^9 steps per pair. How can the bits of b help?
  - Square the base for each bit of b and multiply it in where the bit is 1 (Theorem 2.2.1).
  - Start r at 1 (which also gives 0^0 = 1), reduce a first, and use long long products.
- id: cf-1594B
  role: ladder
  card: fast-power
  rung: 2
  twist: The exponents are the bits of k, so the answer is a sum of powers.
  summary: 'Numbers that are sums of distinct powers of n, in increasing order: print the k-th one modulo
    10^9 + 7 (n, k ≤ 10^9, many tests).'
  hints:
  - Write the first few special numbers for n = 3. How do they relate to 1, 10, 11, 100 in binary?
  - The k-th special number uses n^i exactly for the bits i set in k (topic 1.7).
  - Walk the bits of k, keeping the current power of n modulo the prime; add it where the bit is 1.
- id: lc-powx-n
  role: ladder
  card: fast-power
  rung: 3
  twist: The same squaring with real numbers and negative exponents.
  summary: Compute x^n for a real x (|x| < 100) and an integer n with |n| < 2^31.
  hints:
  - Squaring works for any associative multiplication, not only modulo m. What changes for a negative
    n?
  - 'x^n = (1/x)^(−n); careful: −n overflows int when n = −2^31.'
  - Copy n into a long long, take 1/x if it is negative, then run the binary exponentiation loop on doubles.
- id: lc-count-good-numbers
  role: ladder
  card: fast-power
  rung: 4
  twist: Count with the product rule first; the count is a product of two powers.
  summary: Count digit strings of length n ≤ 10^15 with even digits at even positions and prime digits
    at odd positions, modulo 10^9 + 7.
  hints:
  - How many choices does each position have, and are the positions independent?
  - '5 choices at each of the ⌈n/2⌉ even positions and 4 at each of the ⌊n/2⌋ odd ones: 5^⌈n/2⌉ · 4^⌊n/2⌋.'
  - Two fast powers with long long exponents, then one product modulo 10^9 + 7.
- id: ac-abc168_e
  role: ladder
  card: fast-power
  rung: 5
  twist: Group the items first (GCD normalisation from topic 0.4), then multiply powers of 2 over the
    groups.
  summary: Choose a non-empty set of up to 2·10^5 sardines (A_i, B_i up to 10^18 in absolute value) without
    two with A_i·A_j + B_i·B_j = 0; count the ways modulo 10^9 + 7.
  hints:
  - When are two sardines on bad terms? Think of (A, B) as a direction, and normalise it.
  - Divide (A, B) by its GCD and fix the sign; the bad partner of direction (a, b) is (−b, a). Sardines
    (0, 0) clash with everyone.
  - For each pair of partner classes of sizes x and y the ways are 2^x + 2^y − 1; multiply over classes,
    add the (0, 0) sardines one at a time, subtract the empty choice.
- id: ac-abc298_d
  role: ladder
  card: inverse-prime
  rung: 1
  twist: Base case of the card
  summary: Maintain a decimal string under 6·10^5 operations (append a digit, delete the first digit,
    print the value modulo 998244353).
  hints:
  - Appending is v = 10v + x. What must be subtracted when the first digit d is deleted?
  - d · 10^(L − 1), where L is the current length. Keep 10^(L − 1) modulo the prime as the length changes.
  - On append multiply the power by 10; on delete multiply it by the inverse of 10 (Theorem 2.2.3), or
    recompute it with fast power.
- id: ac-abc152_e
  role: ladder
  card: inverse-prime
  rung: 2
  twist: The common value is an LCM too large to store; divide it modulo a prime instead.
  summary: Choose positive B_i with all A_i·B_i equal (N ≤ 10^4, A_i ≤ 10^6) and the smallest sum of B_i;
    print the sum modulo 10^9 + 7.
  hints:
  - The smallest common value of A_i·B_i is the LCM of all A_i. How large can it be?
  - Far too large, so keep its factorisation (largest exponent per prime, Theorem 2.1.3) and its value
    modulo 10^9 + 7.
  - Then B_i = L / A_i becomes L · A_i^(−1) modulo the prime (Theorem 2.2.4); sum them.
- id: cf-1279D
  role: ladder
  card: inverse-prime
  rung: 3
  twist: A probability, written as a sum of fractions and printed modulo 998244353.
  summary: A bot picks a random kid, a random item from that kid's wish list, and a random kid to receive
    it; print the probability that the receiver wants the item, modulo 998244353.
  hints:
  - Write the probability as a sum over the first kid and the item they pick.
  - It is Σ over kids x, items y in x's list of (1/n)·(1/k_x)·(cnt[y]/n), with cnt[y] the number of kids
    wanting y.
  - Count cnt first; then add the terms as residues, using the inverses of n and of each k_x (Theorem
    2.2.4).
- id: lc-fancy-sequence
  role: ladder
  card: inverse-prime
  rung: 4
  twist: Undo a global multiplication for values appended later.
  summary: Support append, add to all, multiply all, and read one value modulo 10^9 + 7, with up to 10^5
    operations.
  hints:
  - Updating every element on each addAll or multAll is too slow. Can one global map x → m·x + a describe
    all updates?
  - An element appended now must come out as its value after the current map; store the x with m·x + a
    = val.
  - Store (val − a)·m^(−1) modulo the prime; getIndex returns m·stored + a. m is never a multiple of the
    prime, so the inverse exists.
- id: cses-1712
  role: ladder
  card: exponent-reduction
  rung: 1
  twist: Base case of the card
  summary: For n ≤ 10^5 triples with a, b, c ≤ 10^9, print a^(b^c) modulo 10^9 + 7 (with 0^0 = 1).
  hints:
  - b^c cannot be computed. By Fermat, what does the exponent matter modulo?
  - Reduce b^c modulo p − 1 = 10^9 + 6 with fast power (Theorem 2.2.5); then raise a to it.
  - 'Handle a = 0 separately: the answer is 1 only when b^c = 0, that is b = 0 and c > 0.'
- id: lc-super-pow
  role: ladder
  card: exponent-reduction
  rung: 2
  twist: The modulus 1337 is not prime, so the exponent is consumed digit by digit instead of reduced.
  summary: Compute a^b mod 1337, where b has up to 2000 decimal digits.
  hints:
  - 1337 = 7·191 is not prime, so reducing b modulo 1336 is not justified. How can the digits of b be
    used directly?
  - a^(10e + d) = (a^e)^10 · a^d, so process the digits from left to right.
  - 'Keep r = a^(prefix of b) mod 1337: for each digit d, r = r^10 · a^d mod 1337, each power by fast
    power.'
- id: cf-615D
  role: ladder
  card: exponent-reduction
  rung: 3
  twist: The product of all divisors needs counts in the exponent, kept modulo p − 1 without dividing.
  summary: Given the m ≤ 2·10^5 prime factors of n (primes ≤ 2·10^5, with repetition), print the product
    of all divisors of n modulo 10^9 + 7.
  hints:
  - Each prime p with exponent e contributes p to the power (0 + 1 + … + e) times the number of divisors
    of the other primes. Why?
  - 'That count is a product of (e_q + 1) over the other primes, which can be huge: keep it modulo p −
    1 (Theorem 2.2.5).'
  - p − 1 is not prime, so do not divide by (e + 1); use prefix and suffix products of (e_q + 1) modulo
    10^9 + 6 instead.
- id: cf-185A
  role: drill
  summary: After n ≤ 10^18 years of a triangle plant that splits each triangle into four, how many triangles
    point upwards, modulo 10^9 + 7?
- id: ac-arc176_b
  role: drill
  summary: The last digit of 2^N mod (2^M − 2^K) for N, M, K up to 10^18 (2·10^5 tests).
- id: lc-double-modular-exponentiation
  role: drill
  summary: For up to 100 rows (a, b, c, m) with values ≤ 1000, find the rows with ((a^b mod 10)^c) mod
