# Topic 2.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "2.4"
draft: true
cards:
  - id: indicator-linearity
    name: Expected counts from indicators
    decisive_property: "The quantity whose average is asked is a count (or a weighted sum) of events, and the probability of each single event can be computed; then the expected value is the sum of those probabilities, even when the events depend on each other."
    from_theorem: Theorem 2.4.2
    how_to_test: "Write the random quantity as a sum of indicators (one per position, pair or element) and check that each P(event) has a formula."
    weak_signals:
      - "\"Expected number of …\" fixed points, inversions, matches, distinct values, components"
      - "A random permutation, random choices or random swaps; the answer is a fraction modulo 998244353"
      - "The process is complicated but each element's fate has a simple probability"
    kill_signals:
      - "The quantity is a product or a maximum, not a sum (use tail sums for maxima; products need independence)"
      - "The probability of a single event depends on the whole history (a recurrence over states, Phase 3)"
    lookalikes:
      - description: "The probability that at least one event happens"
        needs: "include-exclude (2.3)"
        flipping_difference: "Linearity gives the expected number of events, not the chance that the number is positive; for that, use inclusion–exclusion or the complement."
    complexity: "O(number of events)."
  - id: contribution-total
    name: Totals by contribution
    decisive_property: "A total over all subarrays, subsets, pairs or permutations is a sum over elements of value times a condition on that element; counting, for each element, the configurations in which it counts gives the total without listing the configurations."
    from_theorem: Theorem 2.4.3
    how_to_test: "Exchange the sums: for one element, describe exactly the configurations in which it contributes, and check that their number has a formula (positions, sorting, nearest greater elements)."
    weak_signals:
      - "The sum over all subarrays (or substrings, subsets) of their minimum, maximum, sum or number of distinct values"
      - "Sum of |a_i − a_j| or of some function over all pairs"
      - "n up to 2·10^5, so listing the O(n^2) configurations is too slow"
    kill_signals:
      - "Only one configuration is asked about (no total over all of them)"
      - "The value of a configuration is not a sum over elements (for example a product of all its elements without logarithms)"
    lookalikes:
      - description: "The maximum over all subarrays of their sum"
        needs: "range-sum (1.2) with prefix minima, or a scan"
        flipping_difference: "A maximum over configurations is not a total; contributions only add up."
    complexity: "O(n) or O(n log n) after the per-element counts."
  - id: geometric-wait
    name: Waiting for a success
    decisive_property: "Independent trials repeat until something happens, with a fixed success probability within each stage; each stage takes 1/p trials on average and the stages add."
    from_theorem: Theorem 2.4.5
    how_to_test: "Split the process into stages in which the success probability is the same at every trial, and check that the stages come one after another."
    weak_signals:
      - "\"Expected number of rolls, draws or attempts until …\""
      - "Collect all kinds, see every face, visit every vertex by random picks"
      - "A process restarts from the beginning on failure"
    kill_signals:
      - "The success probability depends on more than the current stage (state with many values: a recurrence, Phase 3)"
      - "There is a fixed number of trials and the question is about the result (indicators or tail sums instead)"
    lookalikes:
      - description: "The probability of at least one success in k trials"
        needs: "fast-power (2.2)"
        flipping_difference: "A fixed number of trials: 1 − (1 − p)^k, not an expected waiting time."
    complexity: "O(number of stages)."
  - id: tail-sum
    name: Expectation by tail sums
    decisive_property: "The random value is a non-negative integer, typically a maximum or minimum of independent values, and P(X ≥ x) (or P(X ≤ x)) is easy as a product; then E[X] = Σ P(X ≥ x)."
    from_theorem: Theorem 2.4.4
    how_to_test: "Check that the values are integers in a range small enough to sum over, and that P(max ≤ x) or P(min ≥ x) factors over independent parts."
    weak_signals:
      - "Expected maximum or minimum of several dice, draws or random numbers"
      - "Expected value of the largest (or k-th largest) of independent choices"
      - "Probabilities that are easy as \"all of them are at most x\""
    kill_signals:
      - "The values are dependent (drawn without replacement) and no product formula holds"
      - "The value is a sum: plain linearity is simpler"
    lookalikes:
      - description: "Expected sum of several dice"
        needs: "indicator-linearity (2.4)"
        flipping_difference: "A sum is linear: add the expectations. Only maxima and minima need tail sums."
    complexity: "O(range of values × number of independent parts), or less with fast powers."
problems:
  - id: ac-abc326_e
    role: worked_example
    summary: "Roll an N-sided die while each roll beats the previous paid one, paying A_y for each such roll y; the expected total pay modulo 998244353 (N ≤ 3·10^5)."
  - id: ac-abc127_e
    role: worked_example
    summary: "Sum, over all ways to choose K cells of an N × M grid (NM ≤ 2·10^5), of the Manhattan distances between all chosen pairs, modulo 10^9 + 7."
  - id: cses-1728
    role: ladder
    card: indicator-linearity
    rung: 1
    twist: Base case of the card
    summary: "Each x_i is uniform on 1..r_i (n, r_i ≤ 100); print the expected number of inversions to six decimal places."
    hints:
      - "The number of inversions is a count over pairs. What does linearity let you do with it?"
      - "E = Σ over pairs i < j of P(x_i > x_j) (Theorem 2.4.2); each probability is a count over the r_i·r_j outcomes."
      - "For each pair, count the outcomes with x_i > x_j by looping over x_i (O(100) per pair), divide by r_i·r_j, and print with six decimals."
  - id: ac-abc360_e
    role: ladder
    card: indicator-linearity
    rung: 2
    twist: Track one probability through K random swaps; symmetry handles all other positions.
    summary: "A black ball starts at position 1 of N; K times, two random positions are swapped. Print the expected final position of the black ball modulo 998244353."
    hints:
      - "The expected position is Σ x·P(ball at x). Do the positions other than 1 differ in probability?"
      - "By symmetry, all positions other than 1 are equally likely; only q = P(ball at position 1) needs tracking."
      - "Update q once per swap with modular fractions; finish with E = q·1 + (1 − q)·(2 + … + N)/(N − 1)."
  - id: cf-235B
    role: ladder
    card: indicator-linearity
    rung: 3
    twist: A sum of squares of run lengths, rewritten as a sum over clicks.
    summary: "Each of n ≤ 10^5 clicks succeeds independently with probability p_i; the score is the sum of the squares of the lengths of the maximal runs of successes. Print the expected score."
    hints:
      - "A square of a run length is not linear. How much does one more success add to L^2?"
      - "Extending a run of length L to L + 1 adds 2L + 1, so the score is a sum over clicks of [success]·(2·(current run length before it) + 1)."
      - "By linearity, keep E[run length ending at i] = p_i·(E[previous] + 1) and add p_i·(2·E[previous] + 1)."
  - id: lc-sum-of-all-odd-length-subarrays
    role: ladder
    card: contribution-total
    rung: 1
    twist: Base case of the card
    summary: "The total of the sums of all odd-length subarrays of an array of up to 100 positive integers."
    hints:
      - "Instead of listing the subarrays, ask: in how many odd-length subarrays does a[i] appear?"
      - "Choose a left end among i + 1 positions and a right end among n − i; the length is odd when both distances to i have the same parity."
      - "Count the even and odd choices on each side: ((L_even·R_even) + (L_odd·R_odd)) subarrays, times a[i] (Theorem 2.4.3)."
  - id: ac-abc150_e
    role: ladder
    card: contribution-total
    rung: 2
    twist: Greedy order first (largest costs last), then each cost's multiplier over all pairs (S, T).
    summary: "For all pairs of different 0/1 sequences S, T of length N ≤ 2·10^5, add the cheapest cost of turning S into T, where each change costs C_i times the number of mismatches just before it; modulo 10^9 + 7."
    hints:
      - "For one pair, in which order should the mismatched positions be fixed? (Topic 1.5.)"
      - "Fix them in decreasing order of C; after sorting C increasingly, C_i is paid with multiplier 1 + (number of larger mismatched positions)."
      - "Sum over all pairs by contribution: C_i's multiplier over all pairs is a sum over how many of the N − i larger positions mismatch, a binomial sum with a closed form times 4^(N−1)."
  - id: ac-abc297_f
    role: ladder
    card: contribution-total
    rung: 3
    twist: The area of the bounding box is a count of cells; each cell's probability uses inclusion–exclusion over four sides.
    summary: "Choose K cells of an H × W grid uniformly at random (H, W ≤ 1000); print the expected number of cells in their bounding box modulo 998244353."
    hints:
      - "The area is the number of cells inside the box. Use linearity over the cells, or over the possible boxes."
      - "Sum over all possible boxes (i·j sizes with their positions) of area × P(the bounding box is exactly this box)."
      - "The number of K-subsets whose bounding box is exactly a given h × w box is an inclusion–exclusion over the four sides that might be empty: 16 terms of C(cells, K)."
  - id: cf-1009E
    role: ladder
    card: contribution-total
    rung: 4
    twist: Sum over all 2^(n−1) rest patterns of the cost, by the multiplier of each a_i.
    summary: "A journey of n ≤ 10^6 km costs a_i for the i-th km since the last rest; any subset of the n − 1 intermediate points may have rest sites. Print the sum of the costs over all subsets (the expected cost times 2^(n−1)), modulo 998244353."
    hints:
      - "For one km j and a value i, in how many rest patterns is j the i-th km since the last rest?"
      - "The last rest must be exactly i km back, and the points in between must have none; the others are free: a power of 2."
      - "Collect, for each a_i, its multiplier 2^(n−i) + (n − i)·2^(n−i−1) (and 1 for i = n), and add a_i times it."
  - id: ac-arc085_a
    role: ladder
    card: geometric-wait
    rung: 1
    twist: Base case of the card
    summary: "A submission solves M random cases with probability 1/2 each and the others surely; resubmit until all pass. Print the expected total time (N ≤ 100, M ≤ 5)."
    hints:
      - "What is the probability that one submission passes everything?"
      - "1/2^M, independently each time: the expected number of submissions is 2^M (Theorem 2.4.5)."
      - "Multiply by the time of one submission, 1900·M + 100·(N − M)."
  - id: ac-abc194_d
    role: ladder
    card: geometric-wait
    rung: 2
    twist: Stages by the number of vertices visited, like the coupon collector.
    summary: "Walk on N ≤ 10^5 vertices by jumping to a uniformly random vertex each step and adding that edge; the expected number of steps until the graph is connected."
    hints:
      - "The graph is connected exactly when every vertex has been visited. What matters at each step?"
      - "With k vertices visited, a step reaches a new one with probability (N − k)/N."
      - "Add N/(N − k) for k = 1, …, N − 1 (Theorem 2.4.5), and print it as a decimal."
  - id: cf-1265E
    role: ladder
    card: geometric-wait
    rung: 3
    twist: Failure sends you back to the start, so the stages are not independent waits.
    summary: "Ask mirrors 1..n in order; mirror i says yes with probability p_i/100; a no restarts from mirror 1 the next day. Print the expected number of days until mirror n says yes, modulo 998244353."
    hints:
      - "One round is a run of days that ends with a no or with success at mirror n. How many days does a round take, and how likely is success?"
      - "A round succeeds with probability P = p_1⋯p_n; the expected number of rounds is 1/P (Theorem 2.4.5)."
      - "Each round lasts 1 + p_1 + p_1 p_2 + … + p_1⋯p_(n−1) days on average; the answer is that over P, all modulo the prime."
  - id: cses-1727
    role: ladder
    card: tail-sum
    rung: 1
    twist: Base case of the card
    summary: "n ≤ 100 children each get a uniform number of candies from 1 to k ≤ 100; print the expected maximum to six decimal places."
    hints:
      - "P(max ≤ x) is easy. Why?"
      - "The children are independent: P(max ≤ x) = (x/k)^n."
      - "E[max] = Σ_x (1 − ((x − 1)/k)^n) (Theorem 2.4.4), with doubles."
  - id: cf-453A
    role: ladder
    card: tail-sum
    rung: 2
    twist: Large exponents in floating point; use ratios to avoid overflow.
    summary: "The expected maximum of n ≤ 10^5 throws of an m-sided die (m ≤ 10^5), as a real number."
    hints:
      - "Same formula as for a few dice; what goes wrong with x^n for n = 10^5?"
      - "Compute (x/m)^n with pow on the ratio, which stays between 0 and 1."
      - "E[max] = Σ_x x·((x/m)^n − ((x − 1)/m)^n), or the tail-sum form."
  - id: ac-abc295_e
    role: ladder
    card: tail-sum
    rung: 3
    twist: The k-th smallest instead of the maximum; each tail probability is a binomial sum over the random entries.
    summary: "Replace each 0 of A (length N ≤ 2000, values ≤ M ≤ 2000) by a uniform value in 1..M, sort, and print the expected K-th element modulo 998244353."
    hints:
      - "E[A_K] = Σ_x P(A_K ≥ x). When is the K-th smallest at least x?"
      - "When at most K − 1 elements are below x. Fixed entries are known; each random entry is below x with probability (x − 1)/M."
      - "For each x, sum over how many random entries fall below x with binomial coefficients and powers modulo the prime: O(M·N)."
