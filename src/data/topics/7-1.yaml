- id: cf-708C
  role: review
  card: rerooting
  review_set: 3
  summary: A tree of n ≤ 4·10^5 vertices; for each vertex say whether it can become a centroid (every
    component after removing it has at most n/2 vertices) after at most one operation that cuts an edge
