drill:
- problem: cses-1674
  answer:
    topic: '4.5'
    card: subtree-values
  property: 'The number below an employee is the size of the subtree minus one: add the sizes into the
    bosses in the backward pass over a visit order, or from the largest number to the smallest when bosses
    have smaller numbers (Theorem 4.5.2).'
  why_others_fail: A walk of the team of each employee is up to 4·10^10 steps, and a recursive walk of
    a long chain overflows the stack.
- problem: lc-distribute-coins-in-binary-tree
  answer:
    topic: '4.5'
    card: subtree-values
  property: The excess of a subtree (coins minus nodes) must cross the edge above it, so that edge is
    used |excess| times; the answer is the sum of |excess| over the non-root nodes (Theorem 4.5.2).
  why_others_fail: Simulating moves does not give the fewest; each edge carries exactly the excess of
    the subtree below it.
- problem: lc-number-of-nodes-in-the-sub-tree-with-the-same-label
  answer:
    topic: '4.5'
    card: subtree-values
  property: Keep, for each subtree, the 26 counts of the letters; they are the sum of the counts of the
    children plus the node itself, and the answer for a node is the count of its own letter (Theorem 4.5.2
    with a small vector as the value).
  why_others_fail: A walk of the subtree of each node is n² = 10^10 steps.
- problem: ac-abc070_d
  answer:
    topic: '4.5'
    card: depths-parents
  property: 'The path from x to y through K is the path x to K plus K to y, and in a tree each is the
    only path: one walk from K gives all weighted distances d[·]; the answer is d[x] + d[y] in 64 bits
    (Theorem 4.5.1).'
  why_others_fail: A walk for every query is up to 10^10 steps; shortest-path algorithms are not needed
    on a tree.
- problem: ac-abc146_d
  answer:
    topic: '4.5'
    card: depths-parents
  property: The fewest colours is the largest degree; walk from the root and give the edges to the children
    the smallest colours that differ from the colour of the edge to the parent (Theorem 4.5.1).
  why_others_fail: Trying colourings is exponential; the walk with the parent edge colour shows what to
    avoid.
- problem: lc-all-nodes-distance-k-in-binary-tree
  answer:
    topic: '4.5'
    card: depths-parents
  property: Record the parent of every node with one walk so that the tree can be walked in all directions,
    then walk from the target for k steps (Theorem 4.5.1).
  why_others_fail: Searching only downwards from the target misses the nodes that are reached through
    the parent.
- problem: lc-amount-of-time-for-binary-tree-to-be-infected
  answer:
    topic: '4.5'
    card: depths-parents
  property: The time is the largest distance from the start node; record the parents so that the tree
    can be walked in all directions, walk from the start and take the largest depth (Theorem 4.5.1).
  why_others_fail: 'The depth from the root is not the answer: the infection also spreads upwards.'
- problem: lc-all-ancestors-of-a-node-in-a-directed-acyclic-graph
  answer:
    topic: '4.2'
    card: dependency-order
  property: 'The graph is a DAG, not a tree: a node may have several parents and the ancestor sets overlap;
    process the nodes in a topological order and merge the sets of the parents (Theorem 4.2.3).'
  why_others_fail: A tree has one parent per node and a path to the root; here the parent pointers do
    not exist.
- problem: ac-abc350_d
  answer:
    topic: '4.4'
    card: merge-groups
  property: In the end each group of friends is complete, so the answer is the sum of size · (size − 1)
    / 2 over the groups minus the M existing ones; the groups come from uniting the friendships (Theorem
    4.4.1).
  why_others_fail: The network is not a tree and may contain cycles; the sizes of the groups are what
    matters.
- problem: cf-1204C
  answer:
    topic: '4.3'
    card: every-pair
  property: The graph is small (n ≤ 100), so the table of all distances is computed once by the Floyd–Warshall
    algorithm (Theorem 4.3.4); the path is then scanned greedily with these distances to decide which
    vertices must be kept.
  why_others_fail: A search for every pair on the path would be repeated up to 10^6 times; the table gives
    each distance in one lookup.
- problem: lc-minimum-score-of-a-path-between-two-cities
  answer:
    topic: '4.4'
    card: merge-groups
  property: A path may use any road of the group that contains cities 1 and n, so the answer is the smallest
    weight in that group; the group comes from uniting the roads, or from one walk (Theorems 4.4.1 and
    4.1.2).
  why_others_fail: 'Looking for a route with the best minimum edge is not needed: any edge of the group
    can be visited.'
