topic: L0.3
exercises:
- id: rung-1
  role: ladder
  type: change_ladder
  title: A car owns its engine
  prompt: Finish Car so that it holds its Engine as a member by value, records "car built" and "car destroyed", and starts and asks its own engine (see kit.hpp).
  card: owned-part
  rung: 1
  new_force: A Car owns its Engine
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.3/ladder/rung-1
  reference: reference/L0.3/ladder/rung-1
  alternatives:
  - 'Hold the engine through std::unique_ptr<Engine>: also owned, but one allocation and 8 bytes more per car for nothing the tests need.'
  hints:
  - Who creates the engine, and when should it be destroyed? Write the answer in one line.
  - 'Make the engine a plain member of Car: `Engine engine_;`. It is built before the body of the constructor runs.'
  - start() and running() forward to the member; the tests compare sizeof(Car) with sizeof(Engine).
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: rung-2
  role: ladder
  type: change_ladder
  title: A team refers to its players
  prompt: 'Finish Team so that it refers to Player objects that exist on their own: it keeps their addresses, never copies or destroys them, and refuses a temporary player (see kit.hpp).'
  card: referred-part
  rung: 2
  new_force: A Team refers to Players who outlive it
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.3/ladder/rung-2
  reference: reference/L0.3/ladder/rung-2
  alternatives:
  - 'Store copies of the players: simple, but a change to a player is not seen by the team and every add copies a string.'
  hints:
  - Who builds and destroys a player? If it is not the team, the team must not delete it.
  - Store `const Player*` (the address of the player you were given) in a vector.
  - Delete the overload that takes `Player&&`, so a temporary cannot be added.
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: rung-3
  role: ladder
  type: change_ladder
  title: A square is not a rectangle
  prompt: 'Implement Square so that it keeps every promise of a square without deriving from Rect: scaled builds a new square, as_rect converts when a Rect is needed (see kit.hpp).'
  card: true-subtype
  rung: 3
  new_force: A Square wrongly derives from Rectangle
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.3/ladder/rung-3
  reference: reference/L0.3/ladder/rung-3
  alternatives:
  - 'Derive Square from Rect and override set_width and set_height to change both sides: shorter, but the Rect promise is broken (the mistake program).'
  hints:
  - Run keeps_rect_promise in your head on a Square that derives from Rect. What happens to the height?
  - Make Square a separate class with its own side. as_rect builds a new Rect of equal sides.
  - scaled(k) returns a new Square; it must not change this one.
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: rung-4
  role: ladder
  type: change_ladder
  title: Three classes, one logger
  prompt: 'Finish Cart, Checkout and Mailer: each is built with a Logger& that it refers to and does not own, and logs the exact text given in kit.hpp.'
  card: referred-part
  rung: 4
  new_force: Three classes need one Logger that none of them owns
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.3/ladder/rung-4
  reference: reference/L0.3/ladder/rung-4
  alternatives:
  - 'A global logger object: no constructor parameter, but every test shares it and cannot read its own lines.'
  hints:
  - Who creates the logger? If none of the three, none of them owns it.
  - Store the `Logger&` given to the constructor and use it in each function.
  - Checkout::pay checks first and logs after, so a refused payment logs nothing.
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: rung-5
  role: ladder
  type: change_ladder
  title: Sharing six lines without a hierarchy
  prompt: Implement format_cents, Invoice and Receipt. Share the formatting with the free function; neither class may derive from the other or have a virtual function.
  card: null
  rung: 5
  new_force: Two classes reuse 6 lines of formatting
  needs_new_structure: false
  checkers:
  - kind: kit
    path: L0.3/ladder/rung-5
  reference: reference/L0.3/ladder/rung-5
  alternatives:
  - 'Receipt derives from Invoice to reuse its formatting: one hierarchy, a hidden promise that a receipt is an invoice, and nothing gained over a function call.'
  hints:
  - Do Invoice and Receipt stand for each other anywhere? If not, a base class is the wrong tool.
  - Write the formatting once as a free function and call it from both classes.
  - Check 5, 0 and -50 cents as well as 1205.
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: ex-1
  role: worked_example
  type: recognise
  title: A document, its paragraphs and its fonts
  prompt: 'A Document holds paragraphs of text. Each paragraph is shown in a font, and the fonts come from a font table that the program builds once at start-up and that several documents use. Say which relationship each pair has: Document and Paragraph, Paragraph and Font.'
  card: owned-part
  answer:
    kind: card
    card: &id001
      topic: L0.3
      card: owned-part
    property: A paragraph exists only inside its document and nothing else holds it, so the document owns its paragraphs; a font is held by the table and used by many documents, so a paragraph only refers to it.
    why_others_fail: Owning the fonts would copy them into every document and delete one that other documents use; referring to the paragraphs would leave nobody to delete them.
  checkers: []
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: ex-2
  role: worked_example
  type: recognise
  title: Penguin derives from Bird which has fly()
  prompt: A Bird class has eat() and fly(). A Sparrow derives from it. Now a Penguin is needed. A colleague suggests deriving it from Bird and making fly() throw. Decide how to arrange the classes.
  card: true-subtype
  answer:
    kind: card
    card: &id002
      topic: L0.3
      card: true-subtype
    property: Inheritance is right only where every derived class keeps every promise of its base, so fly() must live in a narrower base that only flying birds derive from.
    why_others_fail: 'A fly() that throws breaks the promise of Bird: a loop over all birds ends the program at the first penguin.'
  checkers: []
  techniques:
  - L0.3
  checked_on: '2026-10-19'
- id: r-1
  role: drill
  type: recognise
  title: An order and its line items
  prompt: An order contains its line items. Deleting the order deletes its lines, and no other object ever holds a line.
  answer:
    kind: card
    card: *id001
    property: The lines exist only inside the order and have one owner, so they are members of it.
    why_others_fail: A pointer to lines owned elsewhere would leave the lines with no one to delete them.
  checkers: []
  techniques:
  - L0.3
  checked_on: '2026-10-19'
