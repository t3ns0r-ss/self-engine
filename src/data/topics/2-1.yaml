  - Return whether the GCD of the whole array is 1.
- id: ac-abc340_f
  role: ladder
  card: bezout
  rung: 3
  twist: A geometric condition that becomes a linear equation in integers.
  summary: Given (X, Y) ≠ (0, 0) with |X|, |Y| ≤ 10^17, find integer A, B with |A|, |B| ≤ 10^18 such that
