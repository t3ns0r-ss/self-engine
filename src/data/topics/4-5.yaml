  hints:
  - Root the tree at a specified vertex. When must another vertex be in the subgraph?
  - A vertex is needed exactly when its subtree contains a specified vertex (the path up to the root must
    be connected).
  - Compute a flag per subtree in the backward pass and count the vertices whose flag is set.
- id: cf-1336A
  role: ladder
  card: subtree-values
  rung: 5
  twist: The value of a vertex combines its depth and the size of its subtree, and then the best k are
    sorted out.
  summary: A tree of n ≤ 2·10^5 cities with the capital 1 as the root; choose exactly k cities to be industrial
    and the rest tourism; the envoy of each industrial city travels to the capital, and its happiness
    is the number of tourism cities on its path; maximise the sum of happiness.
  hints:
  - When city v becomes industrial, what does it gain and what does it cost to the others?
  - It gains depth(v), but every vertex below it has v on its path and loses one, because v is no longer
    a tourism city; so its value is depth(v) − (size(v) − 1).
  - Compute the depth and the subtree size of every vertex, sort the values and add up the k largest in
    64 bits.
- id: ac-abc213_d
  role: ladder
  card: subtree-ranges
  rung: 1
  twist: 'Base case of the card: the order of the walk itself is the answer.'
  summary: A tree with N ≤ 2·10^5 vertices; start at vertex 1 and repeatedly move to the smallest-numbered
    unvisited neighbour, or back to the parent if there is none; print the vertices in the order they
    are stood on (including each return).
  hints:
  - What is printed each time the walk enters a vertex, and each time it comes back from a child?
  - The vertex is printed when entered and again after each child has been completed.
  - Sort every adjacency list; walk with an explicit stack of (vertex, next neighbour index) so a path
    of 2·10^5 vertices does not overflow the recursion, and print as described.
- id: cf-570D
  role: ladder
  card: subtree-ranges
  rung: 2
  twist: A range of positions inside one depth; the question is whether letters can form a palindrome.
  summary: 'A rooted tree of n ≤ 5·10^5 vertices with a letter on each vertex and m ≤ 5·10^5 queries (v,
    h): can the letters of the vertices at depth h in the subtree of v be rearranged into a palindrome?'
  hints:
  - A set of letters can form a palindrome exactly when at most one letter has an odd count. What would
    you keep for a block of vertices?
  - The parity of each letter count, as a bitmask; the mask of a block is the XOR of the masks.
  - Walk once to get tin/tout; for every depth store the vertices in the order of tin with prefix XORs;
    for a query find the block of v by two binary searches in the list of depth h and test whether the
    XOR has at most one bit set.
- id: lc-minimum-score-after-removals-on-a-tree
  role: ladder
  card: subtree-ranges
  rung: 3
  twist: Ancestor tests tell how two cut edges split the tree.
  summary: A tree of n ≤ 1000 vertices with numbers; remove two edges to get three components; the score
    is the difference between the largest and the smallest XOR of a component; find the smallest score.
  hints:
  - Cutting the edge above a vertex isolates its subtree. With two cuts, which parts are there?
  - If one cut vertex is an ancestor of the other, the three parts are the lower subtree, the upper subtree
    minus the lower one, and the rest; otherwise the two subtrees and the rest.
  - Compute XOR sums of subtrees and the ranges tin/tout; for each pair of non-root vertices use the ancestor
    test (Theorem 4.5.3) to get the three XORs and minimise max − min in O(n²).
- id: cf-1404B
  role: ladder
  card: longest-path
  rung: 1
  twist: The diameter limits what the chaser can do.
  summary: Alice and Bob stand on vertices a and b of a tree with n vertices (total ≤ 10^5); Alice jumps
    up to da edges, Bob up to db edges per move; Alice wants to land on Bob; who wins with the best play?
  hints:
  - Which three numbers of the tree decide the game?
  - The distance between the players, and the diameter, compared with the jump lengths.
  - Alice wins if dist(a, b) ≤ da, or if 2·da ≥ diameter, or if db ≤ 2·da; otherwise Bob wins. Find the
    diameter by two walks and the distance by a walk from a.
- id: lc-find-minimum-diameter-after-merging-two-trees
  role: ladder
  card: longest-path
  rung: 2
  twist: 'Join two trees by an edge so that the diameter is smallest: connect the centres.'
  summary: Two trees of at most 10^5 vertices each; add one edge between a vertex of the first and a vertex
    of the second so that the diameter of the resulting tree is as small as possible; return it.
  hints:
  - What can the diameter of the merged tree be? Which paths exist?
  - Either one of the old diameters, or a path from the far end of one tree through the new edge to the
    far end of the other.
  - 'Connect the middle vertices (centres) of the two diameters: the answer is max(d1, d2, ceil(d1/2)
    + ceil(d2/2) + 1), with d1, d2 found by two walks each.'
- id: ac-abc221_f
  role: ladder
  card: longest-path
  rung: 3
  twist: 'Count the diameters: every longest path passes through the centre.'
  summary: A tree with N ≤ 2·10^5 vertices and diameter D; count the ways to choose two or more vertices
    so that every two chosen vertices are at distance exactly D, modulo 998244353.
  hints:
  - What do all pairs at distance D have in common? Where do they lie?
  - 'Every path of length D passes through the centre of the tree: a vertex if D is even, an edge if D
    is odd. Two chosen vertices in the same branch of the centre are closer than D.'
  - Find D by two walks. For an even D let c_i be the number of vertices at depth D/2 in the i-th branch
    of the centre; at most one vertex is taken per branch, so the answer is the product of (c_i + 1),
    minus 1, minus the sum of c_i. For an odd D the answer is the product a · b of the counts at the right
    depth on the two sides of the centre edge.
- id: lc-minimum-height-trees
