  hints:
  - After all removals, what decides the final row of a card?
  - 'Only how many non-empty rows are above it: its row''s rank among the distinct rows of the cards.
    Columns are independent.'
  - Compress the A values and the B values separately and print rank + 1 for each card.
- id: cses-1619
  role: ladder
  card: event-sweep
  rung: 1
  twist: Base case of the card
  summary: n ≤ 2·10^5 customers with arrival and leaving times (≤ 10^9, all distinct); the largest number
