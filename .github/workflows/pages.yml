# Publishes the site to GitHub Pages at https://<owner>.github.io/<repo>/ on every push to the
# repository's default branch, on every release tag (topic-*, phase-*), or when run by hand.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Also: Settings → Environments → github-pages → Deployment branches and tags must allow
# the tag patterns (topic-*, phase-*), or the deploy job is refused for tag pushes.
name: Pages

on:
  push:
    branches: [main]
    tags: ['topic-*', 'phase-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium for build-time Mermaid diagrams (D10)
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check every internal link uses the base path and exists
        run: node scripts/check_links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
