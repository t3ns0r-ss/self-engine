# Patterns for topic 6.4 (Suffix array and LCP array). Provisional until the lesson maps them to Recognition Cards.
topic: "6.4"
patterns:
  - id: sorted-suffixes
    name: Sorted order of suffixes
    description: Build the order of all suffixes in O(n log n); answer k-th smallest substring or smallest rotation questions.
    precondition: "Suffixes can be compared by doubling: rank by the first 2^k characters, then by pairs of ranks."
  - id: distinct-substrings
    name: Counting distinct substrings
    description: Number of distinct substrings = sum of (suffix length − LCP with the previous suffix in sorted order).
    precondition: Each new distinct substring is a prefix of a suffix that is longer than its common prefix with the previous suffix.
  - id: common-substring
    name: Longest repeated or common substring
    description: Longest substring occurring twice, or common to two strings, from the maximum adjacent LCP value.
    precondition: Any two suffixes' longest common prefix is the minimum of adjacent LCP values between them, so the best pair is adjacent.
  - id: occurrences-by-order
    name: Occurrences via the sorted order
    description: Find all occurrences of a pattern as one contiguous block of the sorted suffixes.
    precondition: Suffixes starting with the pattern are consecutive in sorted order.
