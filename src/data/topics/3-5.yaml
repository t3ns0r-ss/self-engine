    piece, eat one. Print the expected number of rolls until everything is eaten (relative error 1e-9).
  hints:
  - Do you need to know which dishes have how many pieces, or only how many dishes have 1, 2 and 3 pieces?
  - Only the counts (c1, c2, c3) matter, and E[c1][c2][c3] is the expected number of rolls from there.
    A roll that hits an empty dish changes nothing, which is a self-loop with probability c0 / N.
  - E = (N + c1 E[c1-1][c2][c3] + c2 E[c1+1][c2-1][c3] + c3 E[c1][c2+1][c3-1]) / (c1 + c2 + c3), and E[0][0][0]
