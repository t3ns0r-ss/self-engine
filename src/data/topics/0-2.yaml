self_test:
- q: Is 3n² + 5n + 7 = O(n)? Justify with numbers.
  a: No. For any constant c, 3n² > c·n as soon as n > c/3; for example with c = 1000, n = 400 gives 480
    000 > 400 000. The term n² eventually beats every constant multiple of n.
- q: n ≤ 2·10^5 and the time limit is 2 seconds. Is an O(n²) idea acceptable? And O(n√n)?
  a: 'O(n²) is 4·10^10 steps, about 400 seconds: no. O(n√n) is about 2·10^5 · 450 ≈ 9·10^7 steps: about
    a second, acceptable if the steps are simple.'
- q: 'Is "for i = 1..n: for j = 1..n/i: (one step)" an O(n²) loop?'
  a: 'No. The inner loop runs ⌊n/i⌋ times, so the total is at most n·H_n ≤ n(1 + ln n) (Theorem 0.2.5):
    about 1.5·10^7 for n = 10^6.'
- q: The maximal-blocks loop has a while loop inside a while loop. Why is it O(n) and not O(n²)?
  a: The inner loop advances j, and the outer loop continues from i = j. The index only moves forward
    from 0 to n, so the inner loop runs at most n times in total (Theorem 0.2.4).
- q: Compute 1 + 2 + … + n for n = 4·10^9 in long long. Does n·(n + 1)/2 work as written?
  a: 'No: n(n + 1) ≈ 1.6·10^19 exceeds the long long maximum 9.2·10^18 before the division. Since one
    of n and n + 1 is even, divide that one by 2 first: (n / 2)·(n + 1) when n is even, n·((n + 1) / 2)
    otherwise. The result 8·10^18 fits.'
- q: To list the divisors of N = 10^12, how many values of d must be tried, and why is it enough?
  a: All d with d·d ≤ N, that is d ≤ 10^6. Every divisor e > √N has a partner N/e < √N that is tried,
    and e is recorded as N/d then (Theorem 0.2.2).
- q: Can a program store an array of 10^8 long long values within a 256 MB memory limit?
  a: 'No: 10^8 · 8 bytes = 800 MB. Even 10^8 int values need 400 MB. Plan memory from the constraints
    just like time: about 6·10^7 ints fit in 256 MB.'
