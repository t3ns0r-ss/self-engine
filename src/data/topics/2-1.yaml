  hints:
  - The triangle with vertices (0, 0), (X, Y), (A, B) has area |X·B − Y·A| / 2. Write the condition as
    an equation in A and B.
  - X·B − Y·A = ±2 has a solution exactly when g = gcd(|X|, |Y|) divides 2 (Theorem 2.1.2, part 2).
  - Get u, v with |X|·u + |Y|·v = g from extended Euclid, fix the signs, and multiply by 2/g; the bounds
    of part 1 keep the values within 10^18.
- id: cf-1244C
  role: ladder
  card: bezout
  rung: 4
  twist: A linear equation with an extra limit on x + y, solved by bounding one variable.
  summary: Find non-negative x, y, z with x + y + z = n, x·w + y·d = p (d < w, n ≤ 10^12, p ≤ 10^17, w
