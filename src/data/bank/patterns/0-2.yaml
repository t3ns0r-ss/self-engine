# Patterns for topic 0.2 (Complexity analysis and reading constraints). Provisional until the lesson maps them to Recognition Cards.
topic: "0.2"
patterns:
  - id: budget-from-constraints
    name: Choose the algorithm class from n
    description: "Read the largest bound and pick the growth rate that fits (n ≤ 20: 2^n; n ≤ 500: n^3; n ≤ 5000: n^2; n ≤ 2·10^5: n log n; n ≤ 10^18: constant or logarithmic)."
    precondition: A judge runs roughly 10^8 simple operations per second, so the bound on n fixes the largest allowed growth rate.
  - id: closed-form
    name: Formula instead of a loop
    description: n is up to 10^9 or 10^18, so the loop the statement describes must be replaced by a formula for its result.
    precondition: The loop's effect follows an arithmetic progression or a short period, so its total can be written in closed form.
  - id: amortised-total
    name: Bounded total work
    description: Nested loops that look quadratic but whose total number of steps is bounded by n (each element is processed a constant number of times overall).
    precondition: Some quantity moves only in one direction and has a bounded range, so the sum of inner-loop iterations over the whole run is O(n).
  - id: harmonic-loops
    name: Loops over multiples
    description: For each i, loop over the multiples of i (or n / i items); the total is n/1 + n/2 + … + n/n = O(n log n).
    precondition: The inner loop for index i runs about n / i times.
