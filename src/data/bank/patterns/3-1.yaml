# Patterns for topic 3.1 (Recursion, backtracking, pruning). Provisional until the lesson maps them to Recognition Cards.
topic: "3.1"
patterns:
  - id: generate-all
    name: Generate every valid object
    description: Recursively generate all combinations, permutations, or partitions that satisfy the constraints.
    precondition: The number of valid objects is itself small enough to list.
  - id: constraint-placement
    name: Place with checks
    description: Fill positions one at a time (queens, grid puzzles), checking constraints after each placement and undoing on return.
    precondition: A partial assignment that already breaks a constraint can be rejected without extending it.
  - id: bound-pruning
    name: Cut hopeless branches
    description: Abandon a branch when its cost so far plus an optimistic estimate cannot beat the best answer found.
    precondition: The estimate never overstates what the rest of the branch can achieve.
