  hints:
  - How many orders are there, and what does each contribute?
  - 8! = 40320 orders; each contributes the sum of the N − 1 distances along it.
  - Loop over all orders of the indices with next_permutation, add each path length, and divide the total
    by N!. Print with enough decimals.
- id: ac-abc150_c
  role: ladder
