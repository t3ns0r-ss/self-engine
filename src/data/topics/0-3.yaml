self_test:
- q: A process moves a value through the states 0..9999 by a fixed rule and asks for the state after K
    = 10^18 steps. Why is the answer computable, and in how many steps?
  a: 'The next state depends only on the current one and there are 10^4 states, so within 10^4 + 1 steps
    some state repeats (pigeonhole principle). With the first repeat μ and period λ, the state after K
    ≥ μ steps is the state after μ + (K − μ) mod λ steps (Theorem 0.3.1): about 2·10^4 steps in all.'
- q: In a grid scan, why must `0 <= nr && nr < h && 0 <= nc && nc < w && g[nr][nc] == '#'` be written
    in this order?
  a: '&& stops at the first false condition, so g[nr][nc] is read only when the indices are inside the
    grid. With the cell test first, an out-of-range index is read before it is checked: undefined behaviour,
    often a wrong answer rather than a crash.'
- q: 'Every second, each B directly in front of a G swaps with it, all at once. What goes wrong with "for
    i: if s[i] == B and s[i+1] == G, swap" and how is it fixed?'
  a: After a swap at i, the B is now at i + 1 and may swap again with a G at i + 2 in the same second.
    Either skip i + 1 after a swap, or build the next state in a separate copy from the old one.
- q: You scan a bracket string keeping only the final depth, and answer "balanced" when it is 0. Give
    an input where this is wrong and name the missing part of the state.
  a: '")(" ends at depth 0 but is not balanced: the depth went below zero after the first character. The
    state must also record whether the depth was ever negative (Theorem 0.3.3: the state must decide the
    answer for every prefix, not only the end).'
- q: 'Two intervals [a, b] and [c, d] with integer ends: list cases that decide "they share at least one
    point", and check the boundary b = c.'
  a: They are disjoint exactly when b < c or d < a; otherwise they share a point. At b = c neither disjoint
    case holds, so they share the point b. Writing b <= c for the first case would wrongly call touching
    intervals disjoint.
- q: A string of length 10^6 needs one replacement rule applied to each character, and there are 10^6
    rules to apply in order, each "replace every x by y". Why is changing the string per rule too slow,
    and what state replaces it?
  a: 'That is 10^12 character updates. The rules act on letters, not positions: keep for each of the 26
    letters what it has become (26 updates per rule), and rewrite the string once at the end.'
- q: When is case analysis preferable to following the process step by step, and how do you test that
    your cases are complete?
  a: When the number of steps is huge (or infinite) but the inputs are few, so the answer depends on a
    small number of comparisons. List the cases before coding, check each boundary input against exactly
    one case, and compare with a brute force that follows the process on small inputs.
