decision_map:
- weak_signal: Cheapest cost, shortest time or least total length from a start, with positive roads, flights
    or prices.
  choose: dijkstra
  when: Every weight is non-negative and there is a start (or a goal); the answer is the cost of the cheapest
    route (Theorem 4.3.1).
  over:
  - card: unweighted-shortest
    because: If every road costs the same, a plain BFS counts the steps and needs no heap.
    topic: '4.1'
  - card: negative-weights
    because: If some weights are negative, finishing a vertex early is wrong.
- weak_signal: Fewest changes, fewest breaks, fewest uses of a power on a grid or graph, where most moves
    are free.
  choose: zero-one-weights
  when: Every move costs 0 or 1 (Theorem 4.3.2); free moves go to the front of the deque.
  over:
  - card: unweighted-shortest
    because: If every move costs exactly one, a plain BFS is enough.
    topic: '4.1'
  - card: dijkstra
    because: If the costs take more values than 0 and 1, the heap is needed.
- weak_signal: Roads or trains that can give points, negative costs, or "can the score grow without limit?",
    "is there a cycle that makes it cheaper?"
  choose: negative-weights
  when: Some weight is negative or a cycle with a negative total is asked about (Theorem 4.3.3); use only
    vertices on a way from the start to the goal.
  over:
  - card: dijkstra
    because: If the weights come from heights or potentials and can be shifted to be non-negative, a heap
      search works.
  - card: linear-state
    because: If the graph has no cycle and the vertices come in an order, a table filled in order is enough.
    topic: '3.2'
- weak_signal: The cheapest cost between many pairs of places, or from every place; a small graph (a few
    hundred vertices) with many questions.
  choose: every-pair
  when: n³ is affordable and the questions are about pairs (Theorem 4.3.4); the middle town goes in the
    outer loop.
  over:
  - card: dijkstra
    because: If only one start is asked about on a large graph, one heap search is enough and the table
      would not fit.
  - card: components
    because: If only "can I get from a to b" is asked, the groups of one traversal answer it.
    topic: '4.1'
- weak_signal: 'Cheapest route where something extra counts: a coupon, a number of stops, a direction
    switch, a resource that is spent or collected.'
  choose: extra-state
  when: The next move depends on one more small fact; the search runs on (place, fact) pairs (Theorem
    4.3.5).
  over:
  - card: dijkstra
    because: If the extra fact does not change the later cost, a search over the places alone is enough.
  - card: state-graph
    because: If every move costs the same, a BFS over the (place, fact) pairs is enough.
    topic: '4.1'
