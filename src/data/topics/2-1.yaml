drill:
- problem: ac-abc250_d
  answer:
    topic: '2.1'
    card: sieve
  property: q³ ≤ N/2 gives q ≤ 8·10^5, so all primes involved are below 10^6 and a sieve lists them; then
    count pairs p < q with p·q³ ≤ N by two pointers.
  why_others_fail: Trial division of each k up to 10^18 is impossible; the numbers are built from primes,
    so list the primes instead.
- problem: ac-abc300_d
  answer:
    topic: '2.1'
    card: sieve
  property: a²·b·c² ≤ N with a < b < c forces c ≤ √(N/12) < 3·10^5; sieve the primes up to there and loop
    over a, b with an early break, counting c by a prefix count or binary search.
  why_others_fail: The count runs over numbers up to 10^12, too many to factorise; only the primes up
    to about 3·10^5 matter.
- problem: lc-prime-subtraction-operation
  answer:
    topic: '2.1'
    card: sieve
  property: Values are at most 1000, so a sieve to 1000 lists every usable prime; greedily make each element
    as small as possible while staying above the previous one (subtract the largest prime that keeps it
    so).
  why_others_fail: No number needs factorising, only primality of numbers below 1000, many times.
- problem: ac-abc280_d
  answer:
    topic: '2.1'
    card: trial-division
  property: 'Only one number K ≤ 10^12: factorise it by trial division in 10^6 steps; for each p^e, find
    the smallest multiple of p whose factorial contains p at least e times; the answer is the largest
    of these.'
  why_others_fail: K is far beyond any table; there is one number, so √K trials are affordable.
- problem: ac-abc284_d
  answer:
    topic: '2.1'
    card: trial-division
  property: N = p²·q has min(p, q) ≤ ∛N ≈ 2.1·10^6, so trial division up to the cube root finds the smaller
    prime, and the other follows by division and an exact square root.
  why_others_fail: N up to 9·10^18 is beyond a sieve and √N trials (3·10^9) are too slow; the known shape
    cuts the search to ∛N.
- problem: lc-smallest-value-after-replacing-with-sum-of-prime-factors
  answer:
    topic: '2.1'
    card: trial-division
  property: 'One value at a time, at most 10^5, and it only shrinks: factorise it by trial division (√n
    ≤ 317 trials), replace it by the sum of the primes, and stop when the value no longer changes.'
  why_others_fail: A smallest prime factor table also works, but the numbers to factorise are few; there
    is nothing about all numbers up to a bound.
- problem: ac-abc114_d
  answer:
    topic: '2.1'
    card: trial-division
  property: 'The exponent of each prime p ≤ 100 in N! is the sum of its exponents in 1..N, found by factorising
    each k ≤ 100 by trial division; then count exponent choices with (e₁+1)(e₂+1)… = 75: patterns 75,
    25·3, 15·5, 5·5·3.'
  why_others_fail: N! itself is astronomically large; only the exponents of its primes are needed, and
    the divisor-count formula does the rest.
- problem: lc-3sum
  answer:
    topic: '1.3'
    card: opposite-ends
  property: Sort; fix the smallest value of the triple and look for the other two with two pointers moving
    towards each other, skipping equal values.
  why_others_fail: No divisibility or primes are involved; it is a pair-sum search in a sorted array.
- problem: ac-abc160_e
  answer:
    topic: '1.5'
    card: extreme-first
  property: Only the X largest red and the Y largest green apples can ever be eaten; pool them with the
    colourless ones and take the X + Y largest.
  why_others_fail: 'No number theory: the answer depends only on the order of the values.'
- problem: lc-magnetic-force-between-two-balls
  answer:
    topic: '1.4'
    card: answer-search
  property: Feasibility of a minimum distance d is monotone (a smaller d is easier), and placing balls
    greedily from the left checks it; binary search the largest feasible d.
  why_others_fail: The quantity to maximise is a distance, not a divisor or a prime; it is searched over
    its range.
- problem: lc-x-of-a-kind-in-a-deck-of-cards
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: A group size x works exactly when x divides every value's count, so the answer is whether
    the GCD of the counts is at least 2.
  why_others_fail: 'No factorisation is needed: the GCD itself answers whether a common divisor greater
    than 1 exists.'
lookalike_pairs:
- a: lc-find-the-count-of-numbers-which-are-not-special
  b: lc-four-divisors
  a_tool:
    topic: '2.1'
    card: sieve
  b_tool:
    topic: '2.1'
    card: trial-division
  flipping_difference: Both ask for numbers with a fixed number of divisors. A covers every number of
    a range up to 10^9, too many to test, but exactly three divisors means p², so it needs only the primes
    up to √r. B gives at most 10^4 numbers below 10^5, and √v trials each are cheap.
  shared_surface: Both ask for numbers with a fixed number of divisors.
  flipping_input: 'A: how many numbers up to 10^9 have exactly three divisors? These are p² for a prime
    p ≤ 31622, so one sieve to √10^9 counts them. B: how many divisors does one given number below 10^5
    have? Trial division, √10^5 = 316 steps.'
- a: lc-number-of-subarrays-with-gcd-equal-to-k
  b: lc-number-of-different-subsequences-gcds
  a_tool:
    topic: '0.4'
    card: gcd-lcm
  b_tool:
    topic: '2.1'
    card: multiples-sieve
  flipping_difference: A asks about contiguous subarrays of a short array, so extending each start with
    a running GCD is enough. B asks about any subsequences of 10^5 elements, which cannot be listed; but
    g is a GCD of some subsequence exactly when the GCD of all present multiples of g is g, a loop over
    multiples bounded by the values.
  shared_surface: Both ask about the GCD of elements of an array.
  flipping_input: 'A: the number of subarrays of (2, 4, 6, 3) with GCD 2 is 3, from a running GCD for
    each start (n ≤ 1000). B: the number of pairs of (2, 4, 6, 3) with GCD exactly 2 is 3, but at n =
    10^5 only the loops over multiples fit.'
self_test:
- q: Why does the sieve only need primes p with p² ≤ N, and why may it start crossing off at p²?
  a: Every composite n ≤ N has a prime factor p with p² ≤ n (Theorem 2.1.1, part 2), so the primes above
    √N mark nothing new. A multiple k·p with k < p has a prime factor smaller than p, so it was already
    marked by that prime.
- q: Trial division of n = 2·999983 tries d = 2, finds it, and leaves n = 999983. Why does the loop then
    stop at d = 1000, and what must the program still do?
  a: After dividing by 2 the current n is 999983, and 1000² > 999983, so the loop ends. The leftover 999983
    > 1 is a prime factor (Theorem 2.1.5) and must be recorded; forgetting it loses the factor.
- q: How many divisors does 720 = 2⁴·3²·5 have, and what is their sum?
  a: d(720) = 5·3·2 = 30, and σ(720) = (1+2+4+8+16)(1+3+9)(1+5) = 31·13·6 = 2418 (Theorem 2.1.3).
- q: For which c does 12x + 18y = c have integer solutions? Give all solutions for c = 6.
  a: Exactly for the multiples of gcd(12, 18) = 6 (Theorem 2.1.2, part 2). One solution for c = 6 is x
    = −1, y = 1; all are x = −1 + 3k, y = 1 − 2k, since b/g = 3 and a/g = 2 (part 4).
- q: You must factorise 2·10^5 numbers, each up to 10^12. Which tool, and why not the other two factorising
    tools?
  a: Trial division by the primes up to 10^6 (78 498 of them, listed by a sieve). A smallest prime factor
    table would need 10^12 entries, and plain trial division by every d up to 10^6 costs 10^6 per number,
    2·10^11 in total.
- q: To count pairs with GCD exactly d, why must d go from large to small?
  a: E[d] is the number of pairs both divisible by d minus E[2d], E[3d], … (Theorem 2.1.6, part 2). Those
    must already be final, and they are exactly when every multiple of d has been processed before d.
checkpoint:
  time_limit_minutes: 120
  problems:
  - ac-abc400_e
  - ac-abc393_e
  - cf-7C
decision_map:
- weak_signal: Primes in many ranges, many primality tests of numbers up to 10^7, numbers built from a
    few primes counted up to a bound
  choose: sieve
  when: Every number tested is at most an array-sized N, or the numbers are built from primes that are
    all at most a root of the bound (Theorem 2.1.1).
  over:
  - card: nested-loops
    because: Testing each number by trying all its divisors costs about √N per number, about 10^9 steps
      for all numbers up to 10^7.
    topic: '0.5'
  - card: trial-division
    because: Trial division is for a few large numbers; for all numbers up to N, crossing off multiples
      is much faster.
- weak_signal: Divisor counts, distinct primes or exponents of every element; elements sharing a prime
    factor
  choose: spf-factorise
  when: Many numbers must be factorised and all are at most about 10^7, so a smallest prime factor table
    splits each in O(log x) (Theorem 2.1.4).
  over:
  - card: gcd-lcm
    because: A GCD or LCM alone needs no factorisation; factorise only when individual primes or exponents
      matter.
    topic: '0.4'
  - card: trial-division
    because: 'Trial division costs √x per number: 10^3 for x ≤ 10^6, too slow for 10^6 numbers but fine
      for a few.'
- weak_signal: 'One number up to 10^12, or the GCD of an array: its divisors, prime factors or exponents'
  choose: trial-division
  when: Only a few numbers must be factorised and √n trials fit the budget; the leftover after dividing
    out is a prime (Theorem 2.1.5).
  over:
  - card: spf-factorise
    because: A table cannot reach 10^12.
  - card: nested-loops
    because: Trying every d up to n instead of up to √n is 10^12 steps.
    topic: '0.5'
- weak_signal: 'For every d up to the largest value: how many elements it divides, pairs or subsets with
    GCD exactly d, the largest GCD of a pair'
  choose: multiples-sieve
  when: The values are bounded by an array size M and the answer for d depends on the multiples of d;
    the harmonic bound gives O(M log M), and exact GCD counts come from subtracting multiples from large
    d down (Theorem 2.1.6).
  over:
  - card: harmonic-loops
    because: The same loop shape; this card adds the subtraction of multiples that turns “divisible by
      d” into “GCD exactly d”.
    topic: '0.2'
  - card: nested-loops
    because: Taking the GCD of every pair is O(n²).
    topic: '0.5'
- weak_signal: Two step sizes, jugs, moving k steps around a circle, an integer point on a line ax + by
    + c = 0
  choose: bezout
  when: 'The condition is a·x + b·y = c in integers: solvable exactly when gcd(a, b) divides c, with one
    solution from extended Euclid and the rest spaced by (b/g, −a/g) (Theorem 2.1.2).'
  over:
  - card: gcd-lcm
    because: When only existence is asked, the GCD suffices; extended Euclid is needed for an actual or
      a smallest solution.
    topic: '0.4'
  - card: direct-simulation
    because: Simulating moves around a circle of 10^9 chairs can take 10^9 steps or never end.
    topic: '0.3'
