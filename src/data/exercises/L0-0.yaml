- id: r-4
  role: drill
  type: recognise
  title: A struct of three ints
  prompt: A struct of three ints is passed to a function 100 times a second.
  answer:
    kind: none
    simplest: Pass it by value
    why: Copying 12 bytes is cheaper than any indirection, and there is nothing to own.
