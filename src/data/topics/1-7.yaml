# Topic 1.7 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.7'
uses:
- topic: '0.1'
  what: Integer types and their sizes, long long, overflow
- topic: '0.2'
  what: Closed forms, which a negative example about adding values falls back to
- topic: '0.3'
  what: Case analysis and one-pass scans
- topic: '0.4'
  what: 'Parity and remainders: a XOR of bits is their sum modulo 2'
- topic: '0.5'
  what: 'Brute force: bitmasks, 1 << i, testing a bit with (mask >> i) & 1, and the reference solutions
    in the tests'
- topic: '0.6'
  what: map and unordered_map for counting values
- topic: '1.1'
  what: Sorting and sweeping over sorted values
- topic: '1.2'
  what: 'Prefix sums: a range as the difference of two prefix values, and counting subarrays by pairs
    of equal prefix values'
- topic: '1.3'
  what: Counting subarrays with a given sum, the sum version of prefix XOR
- topic: '1.4'
  what: Binary search over a sorted list or a sorted answer
- topic: '1.5'
  what: 'Greedy: deciding one choice at a time when the first choice dominates all later ones'
- topic: '1.6'
  what: Monotonic deque for window maximum
theorems:
- id: 1.7.1
  title: XOR ignores order and cancels equal pairs
  plain_words: XOR of several numbers is the same in any order, XOR with 0 changes nothing, and XOR of
    a number with itself is 0. So in a list every value that appears twice cancels, and the XOR of the
    list is the XOR of the values that appear an odd number of times.
  code: 1.7/thm-1
- id: 1.7.2
  title: The XOR of a range is the XOR of two prefix values
  plain_words: Keep the running XOR of the array. The XOR of any range is the running XOR at its end combined
    with the running XOR just before its start, because the common part cancels. Counting subarrays with
    a given XOR is then counting pairs of prefix values.
  code: 1.7/thm-2
- id: 1.7.3
  title: A sum of bitwise results is a count per bit
  plain_words: When each bit of a result depends only on the same bit of the inputs, the total over many
    pairs is a sum over the bits of the bit's weight times how many pairs have that bit set, and that
    count needs only how many inputs have the bit.
  code: 1.7/thm-3
- id: 1.7.4
  title: The highest differing bit decides which number is larger
  plain_words: Of two different numbers the larger is the one with a 1 at the highest bit where they differ,
    because that bit is worth more than all the lower bits together. So a best value can be built from
    the top bit down, keeping each bit that some valid choice still allows.
  code: 1.7/thm-4
- id: 1.7.5
  title: Addition is XOR plus the carries
  plain_words: Adding two numbers gives their XOR plus twice the bits they have in common, because the
    common bits carry. This lets a sum and a XOR be turned back into the two numbers, and x & (x − 1)
    and x & −x work on the lowest set bit.
  code: 1.7/thm-5
cards:
- id: xor-identities
  name: XOR cancellation
  decisive_property: The values are combined with XOR, which ignores order and cancels every value that
    appears twice (x ⊕ x = 0); so pairs vanish, a missing or unique value is the XOR of everything, and
    an equation x ⊕ y = z is solved by x = y ⊕ z.
  from_theorem: 1.7.1
  how_to_test: Write the quantity as one XOR of all terms and ask which terms appear an even number of
    times; those cancel.
  constraint_shapes:
  - 'n up to 2·10^5 values up to 10^9: counting each value with a map is 2·10^5 · 18 steps and O(n) memory,
    while one pass of XOR is 2·10^5 steps and one variable.'
  weak_signals:
  - form: Says every element appears twice except one, or asks for the missing number
    shape: n up to 2·10^5 and values up to 10^9, with O(1) memory wanted
  - form: Gives an array encoded as XORs of neighbours or of a hidden value, and asks to recover it
    shape: A system "a_i = XOR of all others", often with n even
  - form: Asks for the XOR of all pairs, triples or pairings of two arrays
    shape: Each value contributes an even or odd number of times
  kill_signals:
  - 'Elements appear three times except one: in 2 2 2 9 the unique value is 9, but the XOR is 2 ⊕ 9 =
    11, because three copies leave one copy.'
  - 'The values are combined by OR, AND or addition, which do not cancel: the OR of 4 7 4 2 7 is 7, not
    the unique value 2.'
  in_action:
    statement: Every number appears twice in a list of n numbers except one; print that number.
    constraints: n ≤ 2·10^5 (odd), values up to 10^9, O(1) extra memory.
    budget: Counting every value with a map is about 2·10^5 · 18 steps and O(n) memory. One pass with
      XOR is 2·10^5 steps and one variable.
    candidates:
    - tool: Count the occurrences of each value in a map
      verdict: rejected
      because: It works but needs O(n) memory, against the O(1) wanted.
    - tool: XOR all the values together (this topic)
      verdict: chosen
      because: Each pair cancels (x ⊕ x = 0), and what remains is the value that appears once.
    property_check: XOR is commutative and associative (Theorem 1.7.1), so the order does not matter,
      and each value that appears an even number of times cancels completely. Only the unique value, which
      appears once, is left.
    decision: result = 0; for each value, result ^= value; print result.
  examples:
    positive:
    - inline:
        input: The value that appears once in 4 7 4 2 7
        answer: '2'
        why: 4 ⊕ 7 ⊕ 4 ⊕ 2 ⊕ 7 reorders to (4 ⊕ 4) ⊕ (7 ⊕ 7) ⊕ 2 = 2.
    - worked_example: ac-abc171_e
      why: Each a_i is the XOR of all x except x_i, so the XOR of all a_i equals the XOR of all x (n is
        even), and x_i = a_i ⊕ that total.
    negative:
    - inline:
        input: The value that appears once in 2 2 2 9 (the others appear three times), computed as the
          XOR of everything
        answer: '9'
        method_gives: '11'
        why: Three copies of 2 leave one 2 after XOR, so the result is 2 ⊕ 9 = 11. For threes, each bit
          is counted and taken modulo 3 instead.
      correct_tool:
        topic: '1.7'
        card: per-bit-contribution
    - inline:
        input: The value that appears once in 4 7 4 2 7, combined with OR instead of XOR
        answer: '2'
        method_gives: '7'
        why: 'OR does not cancel equal values: 4 | 7 | 4 | 2 | 7 = 7. Only XOR has x ⊕ x = 0; with other
          operations the occurrences are counted, for example with a map.'
      correct_tool:
        topic: '0.6'
        card: map-counting
  lookalikes:
  - description: Every element appears three times except one
    tool:
      topic: '1.7'
      card: per-bit-contribution
    flipping_difference: Three copies do not cancel under XOR; count each bit modulo 3 instead.
  complexity: O(n) time, O(1) memory.
- id: prefix-xor
  name: XOR of subarrays from prefix values
  decisive_property: The question is about the XOR of contiguous subarrays; the XOR of a[l..r] is P_r
    ⊕ P_(l−1), so ranges are answered in O(1) and subarrays with XOR k are pairs of prefix values with
    P_i = P_j ⊕ k, counted with a map.
  from_theorem: 1.7.2
  how_to_test: Check that the condition is on the XOR of a contiguous range and equals a fixed value (or
    is 0); then it is a condition on two prefix values.
  constraint_shapes:
  - 'n up to 2·10^5: XORing every subarray is n²/2 = 2·10^10 steps, while one pass with a map of prefix
    values is 2·10^5 lookups; the count itself can reach 2·10^10, so it is a long long.'
  weak_signals:
  - form: Asks for the XOR of a range a[l..r] for many queries with no updates
    shape: n and q up to 2·10^5
  - form: Asks to count the subarrays or substrings whose XOR is 0 or a fixed k, or in which every letter
      appears an even number of times
    shape: n up to 2·10^5; a letter mask per prefix turns "even counts" into an XOR of 0
  - form: Asks for two adjacent parts of a subarray with equal XOR
    shape: A split point inside a range, equal XOR meaning the whole range has XOR 0
  kill_signals:
  - 'The XOR must be at most k: for 1 2 3 4 there are 3 subarrays with XOR at most 1, but a lookup of
    exactly 1 finds 2.'
  - 'P_0 = 0 is missing from the map: for 1 2 3 4 the subarrays with XOR exactly 1 are [1] and [2, 3],
    but without P_0 the count is 1.'
  in_action:
    statement: Count the subarrays of a whose XOR is exactly k.
    constraints: n ≤ 2·10^5, 0 ≤ a_i, k < 2^30.
    budget: Computing the XOR of every subarray is n²/2 = 2·10^10 steps. One pass with a map is about
      2·10^5 · 18 steps.
    candidates:
    - tool: Compute the XOR of every subarray with two loops
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: Prefix XOR values and a map of earlier ones (this topic)
      verdict: chosen
      because: The XOR of a[l..r] is P_r ⊕ P_(l−1), so it equals k exactly when P_(l−1) = P_r ⊕ k, a lookup
        of one value.
    property_check: XOR is its own inverse, so P_r ⊕ P_(l−1) = k is equivalent to P_(l−1) = P_r ⊕ k (Theorem
      1.7.2, part 2). When j is processed the map holds P_0, …, P_(j−1), so one lookup counts all valid
      i; P_0 = 0 must be in the map.
    decision: seen[0] = 1; for each prefix P add seen[P ⊕ k] to the answer, then seen[P]++, with a long
      long answer.
  examples:
    positive:
    - inline:
        input: The XOR of a[2..3] in 1 2 3 4 (1-based)
        answer: '1'
        why: The prefix XORs are 0, 1, 3, 0, 4, and P_3 ⊕ P_1 = 0 ⊕ 1 = 1 = 2 ⊕ 3.
    - inline:
        input: The subarrays of 1 2 3 4 with XOR 3
        answer: '2'
        why: At P = 3 (j = 2) the value 3 ⊕ 3 = 0 was seen (the subarray 1, 2) and at P = 0 (j = 3) the
          value 0 ⊕ 3 = 3 was seen (the subarray 3); two subarrays.
    negative:
    - inline:
        input: The subarrays of 1 2 3 4 with XOR at most 1, counted as the subarrays with XOR exactly
          1
        answer: '3'
        method_gives: '2'
        why: The subarrays [1], [2, 3] and [1, 2, 3] have XOR 1, 1 and 0. A lookup finds exactly 1 and
          misses the XOR 0; "at most k" has no lookup, and for small n every subarray is tried.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The subarrays of 1 2 3 4 with XOR exactly 1, with P_0 = 0 missing from the map
        answer: '2'
        method_gives: '1'
        why: The subarray [1] starts at position 1 and pairs P_1 = 1 with P_0 = 0. Without the empty prefix
          the lookup of 1 ⊕ 1 = 0 finds nothing.
      correct_tool:
        topic: '1.7'
        card: prefix-xor
  lookalikes:
  - description: Count subarrays whose sum is k
    tool:
      topic: '1.2'
      card: prefix-count-lookup
    flipping_difference: Sums use P_j − P_i and XOR uses P_j ⊕ P_i; the counting with a map is the same.
  complexity: O(n log n) with a map.
- id: per-bit-contribution
  name: One bit at a time
  decisive_property: The total is a sum over many pairs, subarrays or subsets of a bitwise result (XOR,
    AND, OR); each bit of the result depends only on that bit of the operands, so the total is Σ 2^b times
    the number of terms whose bit b is set, a count per bit.
  from_theorem: 1.7.3
  how_to_test: Fix one bit b and ask whether the number of terms with bit b set can be counted from bit
    b of the inputs alone.
  constraint_shapes:
  - 'n up to 2·10^5: summing a_i ⊕ a_j over all pairs is n²/2 = 2·10^10 steps, while 30 bits times one
    pass is 6·10^6; the total reaches about 2^30 · n²/4 ≈ 10^19, so the bound against long long must be
    checked.'
  weak_signals:
  - form: Asks for the sum of XOR, AND or OR over all pairs, or over all subarrays
    shape: n up to 2·10^5 and values below 2^30
  - form: Asks for the total Hamming distance, the number of differing bits over all pairs
    shape: Each bit contributes c · (n − c) pairs
  - form: Asks for the sum of the popcount of k & m over a range of k
    shape: A range up to 10^18, and each bit of m repeats with period 2^(b+1) in k
  kill_signals:
  - 'The quantity adds the elements: the sum of a_i + a_j over the pairs of 1 2 3 is 12, but the per-bit
    XOR formula gives 6, because addition carries between bits.'
  - 'Only one pair is asked for: the largest a_i ⊕ a_j for 1 2 3 is 3, but the sum over all pairs is 6;
    a maximum is decided from the top bit.'
  in_action:
    statement: Print the sum of a_i ⊕ a_j over all pairs i < j.
    constraints: n ≤ 2·10^5, 0 ≤ a_i < 2^30.
    budget: All pairs are n²/2 = 2·10^10 steps. Counting the set bits per position is 30 · 2·10^5 = 6·10^6
      steps.
    candidates:
    - tool: XOR every pair
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: For each bit b, count c_b and add 2^b · c_b · (n − c_b) (this topic)
      verdict: chosen
      because: Bit b of a_i ⊕ a_j is 1 exactly when one of the two has bit b, which is c_b · (n − c_b)
        pairs.
    property_check: XOR acts on each bit separately, so the total is Σ_b 2^b · (number of pairs with bit
      b of the XOR set) (Theorem 1.7.3), and that number needs only c_b. The total can reach 2^30 · n²/4
      ≈ 10^19, above the long long limit 9.2·10^18, so the bound or a modulus must be checked.
    decision: For b from 0 to 29, count c_b, add 2^b · c_b · (n − c_b) in long long.
  examples:
    positive:
    - inline:
        input: The sum of a_i ⊕ a_j over the pairs of 1 2 3
        answer: '6'
        why: 'Bit 0 is set in 1 and 3 (c = 2), bit 1 in 2 and 3 (c = 2): 1 · 2 · 1 + 2 · 2 · 1 = 6, and
          directly 3 + 2 + 1 = 6.'
    - inline:
        input: The sum of a_i and a_j over the pairs of 1 2 3
        answer: '3'
        why: 'The AND of a pair has bit b set when both have it: bit 0 has C(2, 2) = 1 pair and bit 1
          has C(2, 2) = 1 pair, giving 1 + 2 = 3.'
    - worked_example: ac-abc356_d
      why: The popcount of k & m is a sum over the set bits of m of "bit b of k", and the count of k in
        0..n with bit b set follows from the period 2^(b+1).
    negative:
    - inline:
        input: The sum of a_i + a_j over the pairs of 1 2 3, answered with the per-bit XOR formula
        answer: '12'
        method_gives: '6'
        why: Addition carries between bits, so it is not bitwise. Each element appears in n − 1 pairs,
          so the sum is (n − 1) times the total, 2 · 6 = 12, a closed form.
      correct_tool:
        topic: '0.2'
        card: closed-form
    - inline:
        input: The largest a_i ⊕ a_j for one pair in 1 2 3, answered with the sum over all pairs
        answer: '3'
        method_gives: '6'
        why: A maximum for one pair is not a sum over pairs. It is decided from the highest bit down,
          keeping a bit when some pair allows it.
      correct_tool:
        topic: '1.7'
        card: high-bit-first
  lookalikes:
  - description: The largest XOR of one pair, instead of the sum over all pairs
    tool:
      topic: '1.7'
      card: high-bit-first
    flipping_difference: A maximum is decided from the top bit down; a sum adds every bit's count.
  complexity: O(30 n).
- id: high-bit-first
  name: Highest bit first
  decisive_property: A value built from bits is to be maximised or minimised; bit b is worth more than
    all lower bits together (2^b > 2^b − 1), so the best value is decided from the highest bit down, keeping
    a bit whenever some valid choice with the bits already fixed allows it.
  from_theorem: 1.7.4
  how_to_test: Fix the higher bits as decided and check that you can tell, for the next bit, whether a
    valid choice with that bit set exists.
  constraint_shapes:
  - 'n up to 2·10^5 values below 2^30: trying every pair is 2·10^10 steps, while 30 bits times one pass
    is 6·10^6.'
  weak_signals:
  - form: Asks to maximise a XOR or an AND, or for the smallest x with a property and x ≤ K
    shape: Values below 2^30 or 2^61 and n up to 2·10^5
  - form: Asks to choose x in a range, or with a given popcount, to optimise an expression in x
    shape: Bits of x decided one at a time
  - form: The answer is compared by its highest differing bit, such as lexicographically by bits
    shape: A greedy per bit with a feasibility test
  kill_signals:
  - 'The objective is a sum over many terms: the sum of a_i ⊕ a_j over all pairs is a count per bit, not
    a greedy.'
  - 'The decided range of bits is too small: the largest AND of 2^25 + 5 and 2^25 + 3 is 2^25 + 1 = 33554433,
    but deciding only 20 bits returns 1.'
  in_action:
    statement: Print the largest a_i & a_j over pairs i < j.
    constraints: 2 ≤ n ≤ 2·10^5, 0 ≤ a_i < 2^30.
    budget: All pairs are n²/2 = 2·10^10 steps. 30 bits times one pass is 6·10^6 steps.
    candidates:
    - tool: AND every pair
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: Decide the answer's bits from the top, keeping a bit when two values contain all the decided
        bits and this one (this topic)
      verdict: chosen
      because: A higher bit is worth more than all lower bits together, so keeping it whenever possible
        is best.
    property_check: Of two different numbers the one with a 1 at the highest differing bit is larger (Theorem
      1.7.4). If two values contain the decided bits and bit b, a pair with that bit exists, and any pair
      without it is smaller than one with it.
    decision: ans = 0; for b from 29 down to 0, if at least two values contain ans | (1 << b), set ans
      to it.
  examples:
    positive:
    - inline:
        input: The largest AND of a pair in 5 6 3
        answer: '4'
        why: 'Bit 2 is in 5 and 6 (keep), bit 1 is only in 6 among those (drop), bit 0 only in 5 (drop):
          100 in binary, which is 5 & 6 = 4.'
    - inline:
        input: The largest AND of a pair in 1 2
        answer: '0'
        why: No bit is shared by two values, so every bit is dropped and the answer is 0.
    negative:
    - inline:
        input: The largest AND of a pair in 5 6 3, keeping a bit when ONE value (not two) contains all
          the decided bits
        answer: '4'
        method_gives: '6'
        why: A single value does not form a pair. The greedy builds 6, which is not the AND of any pair;
          a bit may be kept only when two values still contain it.
      correct_tool:
        topic: '1.7'
        card: high-bit-first
    - inline:
        input: The largest AND of 2^25 + 5 and 2^25 + 3, deciding only the lowest 20 bits
        answer: '33554433'
        method_gives: '1'
        why: Bit 25 is above the decided range, so it is never kept. The range of bits must cover every
          bit that can be set, here 30.
      correct_tool:
        topic: '1.7'
        card: high-bit-first
  lookalikes:
  - description: The XOR of a value with each element of a growing set, maximised after every insertion
    tool:
      topic: '1.7'
      card: prefix-xor
    flipping_difference: Online queries need a bit tree; offline, the prefixes can be checked with a set
      as the greedy goes down the bits.
  complexity: O(30 n).
- id: bit-identities
  name: Sum and bit identities
  decisive_property: The statement mixes addition with AND, OR or XOR; a + b = (a ⊕ b) + 2(a & b) and
    a | b = (a ⊕ b) + (a & b), and x & (x − 1), x & −x act on the lowest set bit, so the unknowns are
    rebuilt bit by bit with no search.
  from_theorem: 1.7.5
  how_to_test: Rewrite the condition with the identities and check that each bit of the unknown is forced
    (or free) independently.
  constraint_shapes:
  - 'Unknowns up to 10^18: trying every a is 10^18 steps, while the identity gives the common bits (s
    − x) / 2 in one step and 60 bit tests.'
  weak_signals:
  - form: Gives a + b and a ⊕ b (or a & b) and asks for a and b
    shape: Values up to 10^18, with many test cases
  - form: Asks whether a number is a power of two, to count its 1 bits, or to find its lowest set bit
    shape: A single number up to 10^18
  - form: Asks to make a | b equal c with the fewest bit flips, or uses operations that only clear bits
    shape: Each bit decided independently
  kill_signals:
  - 'No pair exists and the check is skipped: for a + b = 6 and a ⊕ b = 5 the difference 1 is odd, and
    building c = (6 − 5) / 2 = 0 anyway gives (0, 5), which sums to 5.'
  - 'The common bits overlap the XOR: for a + b = 7 and a ⊕ b = 3 the common bits are 2, which share a
    bit with 3, so no pair exists, although (2, 3) would be built.'
  in_action:
    statement: Given s and x, find non-negative a and b with a + b = s and a ⊕ b = x (with the smallest
      a), or report that none exist.
    constraints: s, x ≤ 10^18, up to 10^5 test cases.
    budget: Trying every a from 0 to s is up to 10^18 steps per test. The identity gives the answer in
      O(1).
    candidates:
    - tool: Try every a from 0 to s
      verdict: rejected
      because: Up to 10^18 steps.
    - tool: Use a + b = (a ⊕ b) + 2 (a & b) to get the common bits (this topic)
      verdict: chosen
      because: The common bits c = (s − x) / 2 are forced, and each remaining bit of x goes to exactly
        one of the two numbers.
    property_check: From a + b = x + 2c the value c = (s − x) / 2 must be a non-negative integer, and
      c shares no bit with x (a bit in both numbers is not in the XOR). If both hold, a = c and b = c
      | x is a solution, and giving every bit of x to b makes a smallest (Theorem 1.7.5).
    decision: If s < x, the difference is odd, or c & x ≠ 0, print −1; otherwise print c and c | x.
  examples:
    positive:
    - inline:
        input: The sum a + b for a = 6 and b = 3, from their XOR and AND
        answer: '9'
        why: 6 ⊕ 3 = 5 and 6 & 3 = 2, and (a ⊕ b) + 2 (a & b) = 5 + 4 = 9 = 6 + 3.
    - inline:
        input: Is 12 a power of two?
        answer: 'no'
        why: 12 & 11 = 8, which is not 0, so 12 has a set bit besides its lowest one; 16 & 15 = 0.
    negative:
    - inline:
        input: Find a, b with a + b = 6 and a ⊕ b = 5, ignoring the parity check
        answer: none
        method_gives: 0-5
        why: The difference 6 − 5 = 1 is odd, so (s − x) / 2 is not an integer and no pair exists. Building
          c = 0 anyway gives (0, 5), whose sum is 5, not 6.
      correct_tool:
        topic: '1.7'
        card: bit-identities
    - inline:
        input: Find a, b with a + b = 7 and a ⊕ b = 3, ignoring the overlap check
        answer: none
        method_gives: 2-3
        why: The common bits are (7 − 3) / 2 = 2 = 10 in binary, which shares bit 1 with 3 = 11. A bit
          cannot be both in both numbers and in exactly one, so the pair (2, 3), which sums to 5, is wrong.
      correct_tool:
        topic: '1.7'
        card: bit-identities
  lookalikes:
  - description: Find the pair with the largest a ⊕ b among given numbers
    tool:
      topic: '1.7'
      card: high-bit-first
    flipping_difference: With a and b chosen from a list, there is no identity to solve; the top bits
      are decided greedily.
  complexity: O(1) per test, O(log) for bit tests.
problems:
- id: ac-abc171_e
  role: worked_example
  summary: N (even) hidden integers; a_i is the XOR of all of them except the i-th; recover them.
- id: ac-abc356_d
  role: worked_example
  summary: The sum of popcount(k AND M) over k = 0..N, for N, M < 2^60, modulo 998244353.
- id: lc-missing-number
  role: ladder
  card: xor-identities
  rung: 1
  twist: Base case of the card
  summary: n distinct numbers from 0..n (n ≤ 10^4); exactly one is missing; find it.
  hints:
  - XOR together the numbers 0..n and the numbers in the array. What survives?
  - Every present number appears twice and cancels (Theorem 1.7.1, part 4); only the missing one appears
    once.
  - 'x = 0; for i in 0..n−1: x ^= i ^ nums[i]; then x ^= n. Return x.'
- id: cf-1421A
  role: ladder
  card: xor-identities
  rung: 2
  twist: An x to choose, whose best value comes from comparing the two terms bit by bit.
  summary: 'For each of t tests: given a and b (≤ 10^9), the smallest value of (a ⊕ x) + (b ⊕ x) over
    all x ≥ 0.'
  hints:
  - Look at one bit. What do the two terms contribute at that bit, for each choice of x's bit?
  - If a and b agree at the bit, x can make both 0; if they differ, exactly one term has the bit whatever
    x is. So the minimum is a ⊕ b.
  - Print a ^ b (take x = a & b).
- id: lc-find-the-original-array-of-prefix-xor
  role: ladder
  card: xor-identities
  rung: 3
  twist: Undo a prefix XOR, the reverse of building one.
  summary: Given pref with pref[i] = arr[0] ⊕ … ⊕ arr[i] (n ≤ 10^5), recover arr.
  hints:
  - How do pref[i] and pref[i − 1] differ?
  - pref[i] = pref[i − 1] ⊕ arr[i]; XOR both sides with pref[i − 1] (Theorem 1.7.1, part 3).
  - arr[0] = pref[0] and arr[i] = pref[i] ^ pref[i − 1].
- id: ac-abc121_d
  role: ladder
  card: xor-identities
  rung: 4
  twist: A range of 10^12 consecutive integers, too many to XOR one by one.
  summary: The XOR of all integers from A to B (0 ≤ A ≤ B ≤ 10^12).
  hints:
  - Write the answer with two XORs of the form 0 ⊕ 1 ⊕ … ⊕ n.
  - 0 ⊕ … ⊕ n is n, 1, n + 1 or 0 by n mod 4 (Section 4.1); the range is f(B) ⊕ f(A − 1).
  - Handle A = 0 separately, and use long long.
- id: cses-1650
  role: ladder
  card: prefix-xor
  rung: 1
  twist: Base case of the card
  summary: n ≤ 2·10^5 values and q ≤ 2·10^5 queries; print the XOR of each range [a, b].
  hints:
  - What plays the role of prefix sums for XOR?
  - P_0 = 0, P_i = P_(i−1) ⊕ x_i; the range is P_b ⊕ P_(a−1) (Theorem 1.7.2).
  - Build P once in O(n) and answer every query in O(1) with fast input and output.
- id: lc-count-triplets-that-can-form-two-arrays-of-equal-xor
  role: ladder
  card: prefix-xor
  rung: 2
  twist: Two adjacent parts with equal XOR mean the whole range has XOR 0.
  summary: Count triples i < j ≤ k (n ≤ 300) where the XOR of arr[i..j−1] equals the XOR of arr[j..k].
  hints:
  - If a = b, what is a ⊕ b, and which range has that XOR?
  - a = b exactly when a ⊕ b = 0, that is, when arr[i..k] has XOR 0, so P_i = P_(k+1). Then every j in
    (i, k] works.
  - For every pair i < k + 1 with equal prefix values, add k − i. O(n²) is fine here.
- id: lc-find-the-longest-substring-containing-vowels-in-even-counts
  role: ladder
  card: prefix-xor
  rung: 3
  twist: The XORed values are bitmasks of letter parities, and the longest range is asked instead of a
    count.
  summary: The longest substring of a string (length ≤ 5·10^5) in which each vowel appears an even number
    of times.
  hints:
  - Keep one bit per vowel. What does the XOR of these bits over a substring say?
  - Each bit is the parity of that vowel's count. All vowels are even exactly when the prefix masks at
    both ends are equal (Theorem 1.7.2).
  - Store the first position of each of the 32 masks (mask 0 at position −1); for each position, the answer
    is the distance to the first occurrence of its mask.
- id: lc-sum-of-all-subset-xor-totals
  role: ladder
  card: per-bit-contribution
  rung: 1
  twist: Base case of the card
  summary: The sum of the XOR of every subset of an array (n ≤ 12).
  hints:
  - For one bit b present in some element, in how many subsets is it set in the XOR?
  - 'In exactly half of them: pair each subset with the one that toggles a fixed element having bit b.'
  - 'Answer: (OR of all elements) · 2^(n−1). A loop over all 2^n subsets (topic 0.5) also fits.'
- id: lc-total-hamming-distance
  role: ladder
  card: per-bit-contribution
  rung: 2
  twist: The quantity per pair is the number of differing bits, so every bit counts 1, not 2^b.
  summary: The sum of the Hamming distances (number of differing bits) over all pairs of n ≤ 10^4 integers.
  hints:
  - For one bit, how many pairs differ there?
  - c · (n − c), where c is the number of values with that bit (Theorem 1.7.3).
  - Sum c · (n − c) over the 30 bits.
- id: cf-1615B
  role: ladder
  card: per-bit-contribution
  rung: 3
  twist: Per-bit counts over a range of consecutive integers, many times, using prefix counts.
  summary: 'For each of t tests: from the integers l, l + 1, …, r (r ≤ 2·10^5), delete as few as possible
    so that the AND of the rest is non-zero.'
  hints:
  - When is an AND non-zero? Think of one bit.
  - When some bit is set in every number kept. For each bit, keep the numbers in [l, r] that have it and
    delete the rest.
  - Precompute, for each bit, prefix counts over 1..2·10^5 (topic 1.2); the answer is (r − l + 1) minus
    the largest count in [l, r].
- id: lc-minimize-xor
  role: ladder
  card: high-bit-first
  rung: 1
  twist: Base case of the card
  summary: Find x with the same number of set bits as num2 that makes x ⊕ num1 as small as possible (values
    ≤ 10^9).
  hints:
  - Which bits of num1 should x cancel first?
  - 'The highest ones: cancelling bit b saves more than all lower bits together (Theorem 1.7.4).'
  - Put x's bits on num1's set bits from the top down; if bits remain, put them on num1's zero bits from
    the bottom up.
- id: cf-1420B
  role: ladder
  card: high-bit-first
  rung: 2
  twist: A comparison of two expressions, decided by the highest bit of each value.
  summary: 'For each of t tests: count pairs i < j with a_i & a_j ≥ a_i ⊕ a_j (total n ≤ 10^5).'
  hints:
  - Compare the two sides at the highest bit set in either number.
  - If both numbers have the same highest bit, the AND has it and the XOR does not; otherwise the XOR
    has it and the AND does not (Theorem 1.7.4).
  - Count the numbers by their highest set bit; add c(c − 1)/2 per group, in long long.
- id: lc-maximum-xor-of-two-numbers-in-an-array
  role: ladder
  card: high-bit-first
  rung: 3
  twist: The best bit at each step needs a pair, checked with a set of prefixes.
  summary: The largest nums[i] ⊕ nums[j] with i ≤ j, for n ≤ 2·10^5 values below 2^31.
  hints:
  - Decide the answer's bits from the top. With the higher bits fixed, how do you check whether bit b
    can be 1?
  - Look at the top bits of every number (x >> b). The candidate answer t is reachable if some prefix
    p has p ⊕ t also among the prefixes (Theorem 1.7.1, part 3).
  - 'For b from 30 down: t = (ans << 1) | 1 on the shifted scale; put all x >> b in a set and keep the
    bit if some p ^ t is in it.'
- id: lc-power-of-two
  role: ladder
  card: bit-identities
  rung: 1
  twist: Base case of the card
  summary: Is the integer n (−2^31 ≤ n < 2^31) a power of two?
  hints:
  - How many bits does a power of two have?
  - One. And x & (x − 1) clears the lowest set bit (Theorem 1.7.5, part 2).
  - Return n > 0 && (n & (n − 1)) == 0; use long long or check n > 0 first.
- id: lc-counting-bits
  role: ladder
  card: bit-identities
  rung: 2
  twist: Popcounts of all numbers 0..n at once, each from an earlier one.
  summary: Return the number of 1 bits of every integer from 0 to n (n ≤ 10^5), in O(n).
  hints:
  - Which smaller number has almost the same bits as i?
  - i >> 1 (drop the lowest bit) or i & (i − 1) (drop the lowest set bit).
  - ans[i] = ans[i >> 1] + (i & 1), or ans[i] = ans[i & (i − 1)] + 1.
- id: cf-1559A
  role: ladder
  card: bit-identities
  rung: 3
  twist: An operation that can only clear bits; the question is which bits must survive.
  summary: 'For each of t tests: an operation replaces elements of a chosen interval by ANDs of mirrored
