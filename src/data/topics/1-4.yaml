# Topic 1.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.4"
draft: true
cards:
  - id: sorted-search
    name: Search a sorted sequence
    decisive_property: "The sequence being searched is sorted (or is non-decreasing by construction, like prefix sums of non-negative values), so \"a_i ≥ x\" is false…false true…true and the first true index is found in O(log n); counts and nearest values follow from lower and upper bounds."
    from_theorem: Theorem 1.4.2
    how_to_test: Name the sequence and check it is non-decreasing, then write the question as "the first index where …" or as a difference of two bounds.
    weak_signals:
      - Many independent queries "how many ≤ x", "the closest value", "the first time the total reaches t"
      - A sorted array is given, or sorting is allowed (the question is order-free)
      - For each element, count the partners in a sorted list that satisfy an inequality
    kill_signals:
      - The collection changes between queries (a set, topic 0.6)
      - All queries are known and can be sorted too (a forward walk, topic 1.3, is simpler)
    lookalikes:
      - description: Search a matrix whose rows and columns are sorted but which is not one sorted list
        needs: "a corner walk that discards a row or a column per step (topic 1.3)"
        flipping_difference: Without a single sorted order, no middle element splits the candidates in two.
    complexity: O(log n) per query after O(n log n) sorting.
  - id: answer-search
    name: Search on the answer
    decisive_property: "The question asks for the smallest (or largest) x that works, and \"x works\" is monotone in x and can be checked much faster than the answer can be found directly, so binary search over x with the check finds it; for real answers, a fixed number of halvings reaches the required precision."
    from_theorem: Theorem 1.4.3
    how_to_test: Write the check ok(x); prove that ok(x) implies ok(x + 1) (or the reverse); find bounds L and R with the answer between them.
    weak_signals:
      - '"Minimise the maximum …" or "maximise the minimum …"'
      - '"The least time / capacity / speed such that …", answers up to 10^9 or 10^18'
      - Splitting an array into consecutive parts, or placing items with a minimum gap
    kill_signals:
      - The check is not monotone (a larger x can fail where a smaller one works)
      - The answer has a direct formula or a single greedy pass gives it
    lookalikes:
      - description: The answer is one of a few candidates that can all be tried
        needs: "enumerate-answer (0.5)"
        flipping_difference: When the candidates are few, trying them all is simpler than proving monotonicity.
    complexity: O(cost of the check · log(R − L)).
  - id: kth-by-counting
    name: k-th smallest by counting
    decisive_property: "The question asks for the k-th smallest element of a huge implicit collection (all pair sums, a multiplication table, the numbers not in a list), and the number of elements ≤ x can be counted fast, so the k-th smallest is the first x with count(x) ≥ k."
    from_theorem: Theorem 1.4.6
    how_to_test: Write count(x) and its cost; check that listing the collection is too slow (k or the collection size is huge).
    weak_signals:
      - '"The k-th smallest" of something with n² or more elements'
      - k up to 10^9 or 10^18
      - Elements defined by a formula over pairs or over a range
    kill_signals:
      - k is small (up to about 10^5); then listing the k smallest with a priority queue works (topic 0.6)
    lookalikes:
      - description: The k smallest pair sums of two sorted arrays with k ≤ 10^4
        needs: "heap-extract (0.6)"
        flipping_difference: Small k lets the pairs be listed in increasing order; counting is needed only when k is huge.
    complexity: O(cost of count · log(value range)).
