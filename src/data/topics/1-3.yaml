decision_map:
  - weak_signal: Longest or shortest contiguous segment with a condition
    choose: shrinkable-window
    when: Validity is closed under shrinking (for "shortest", its opposite is), the empty window is valid, and validity can be rechecked after one element enters or leaves.
    over:
      - card: prefix-count-lookup
        because: Needed when the condition is an exact sum or count, or values can be negative, so validity is not closed under shrinking.
      - card: fixed-window
        because: Only when the statement fixes the length.
      - card: nested-loops
        because: Trying every segment is O(n²); fine only for n up to a few thousand.
  - weak_signal: Count the segments (subarrays, substrings) that satisfy a condition
    choose: count-windows
    when: For each right end the valid left ends form one range, because validity (or its opposite, then subtract from n(n+1)/2) is closed under shrinking.
    over:
      - card: prefix-count-lookup
        because: "For an exact sum, or sums with negative values: count equal prefix values in a map instead."
      - card: nested-loops
        because: O(n²) segments; only for small n.
  - weak_signal: Every segment of a given length k
    choose: fixed-window
    when: The window summary can undo an add (sum, counts, multiset), so each slide is one add and one remove.
    over:
      - card: range-sum
        because: For a sum alone, prefix sums give every window in O(1) with no sliding; the sliding update is needed for counts, distinct values, or a multiset.
  - weak_signal: Take items from the two ends of a row
    choose: shrinkable-window
    when: 'The items left form one middle window: turn "fewest taken" into "longest valid middle window" (or a fixed window of length n − k when exactly k are taken).'
    over:
      - card: nested-loops
        because: Trying every split between left and right takes O(n²) unless the middle part is treated as a window.
  - weak_signal: A pair (or triple) of elements with a target sum, at most a sum, or the best pair score
    choose: opposite-ends
    when: After sorting (or by the problem's own structure) one of the two ends can be ruled out at every step.
    over:
      - card: map-counting
        because: A value-to-position map finds an exact sum in one pass and keeps original positions; prefer it when sorting would lose the positions the answer needs.
      - card: nested-loops
        because: All pairs is O(n²).
  - weak_signal: "Two lists: merge them, match elements, closest element, or pairs across them"
    choose: merge-walk
    when: Both lists are sorted (or the matching is in order, as for subsequences), so what each element needs from the other list starts at a boundary that only moves forward.
    over:
      - card: sort-then-scan
        because: Enough when only one sorted list matters and every relevant pair is adjacent in it.
      - card: ordered-set-lookup
        because: Needed when queries arrive in an order you cannot sort, so the pointer could not move forward only.
