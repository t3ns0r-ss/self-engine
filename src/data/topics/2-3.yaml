# Topic 2.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "2.3"
draft: true
cards:
  - id: ncr-mod-p
    name: Binomial coefficients modulo a prime
    decisive_property: "The count is a formula in binomial (or multinomial) coefficients C(n, r) with n below the prime modulus and small enough for a table (up to a few million); factorial and inverse factorial tables then give each coefficient in O(1)."
    from_theorem: Theorem 2.3.3
    how_to_test: "Write the count as choices of positions or subsets, check that every n in C(n, r) is at most the table size and below p, and that p is prime."
    weak_signals:
      - "Choose r of n positions, cells, or people; \"how many ways\" modulo 998244353 or 10^9 + 7"
      - "Many queries of C(n, r) with n up to 10^6"
      - "Arrangements of letters with repeats (anagrams), or sequences with fixed counts of each value"
    kill_signals:
      - "n is huge (10^18) with r also large: no table fits (only a small r allows the product formula)"
      - "The modulus is not prime or is smaller than n: inverse factorials do not exist"
    lookalikes:
      - description: "Count sequences of length n over k symbols with no restriction"
        needs: "fast-power (2.2)"
        flipping_difference: "Without positions to choose, every position is free: k^n by the product rule, no binomial needed."
    complexity: "O(N) to build the tables, O(1) per coefficient."
  - id: product-sum-rules
    name: Product and sum rules
    decisive_property: "The objects are built by a sequence of choices whose number of options does not depend on the earlier choices (multiply), or split into disjoint cases (add)."
    from_theorem: Theorem 2.3.1
    how_to_test: "Describe how to build one object step by step, and check that the number of options at each step is the same whatever came before, and that no object is built twice."
    weak_signals:
      - "Each position gets a value with a restriction against the previous one (\"different from its neighbour\")"
      - "Count the ways to fill or assign, where values must be distinct and each has its own upper limit"
      - "Count pairs or sequences by splitting into cases by one feature"
    kill_signals:
      - "The number of options at a step depends on which earlier options were taken (not only how many): a step-by-step table (Phase 3)"
      - "The same object can be built in several orders: divide by the overcount, or use binomial coefficients"
    lookalikes:
      - description: "Count the 3-letter strings over an alphabet using at most two different letters"
        needs: "include-exclude (2.3) or case analysis"
        flipping_difference: "A global condition (on the whole string) makes the options at a step depend on earlier letters; split into cases or subtract."
    complexity: "O(number of steps)."
  - id: stars-bars
    name: Identical items into labelled groups
    decisive_property: "The question counts ways to split n identical items (or a total n) into k labelled parts with non-negative or lower-bounded sizes; a split is a choice of k − 1 bar positions among n + k − 1 symbols."
    from_theorem: Theorem 2.3.5
    how_to_test: "Check that the items are identical, the groups distinguishable, and only lower bounds constrain the sizes; shift the lower bounds away."
    weak_signals:
      - "Distribute n identical candies or apples among k children"
      - "Count non-decreasing sequences of length k with values in [1, m]"
      - "Count ways to write a number as an ordered sum of k parts, or exponents summing to a total"
    kill_signals:
      - "The parts have upper bounds (add inclusion–exclusion over the violated bounds)"
      - "The groups are identical (partitions of a number, a different count)"
    lookalikes:
      - description: "Distribute n different items among k children"
        needs: "fast-power (2.2)"
        flipping_difference: "Different items each choose a child independently: k^n, not a stars-and-bars count."
    complexity: "O(1) per count after the factorial tables."
  - id: include-exclude
    name: Inclusion–exclusion over bad properties
    decisive_property: "The objects must avoid several properties at once, and for every set of properties the number of objects having all of them is easy to count; the alternating sum over the sets then counts the objects with none."
    from_theorem: Theorem 2.3.6
    how_to_test: "Name the bad properties, write N(S) for a set S of them, and check that N(S) has a formula; then check that the number of sets (2^m, or m + 1 sizes) is affordable."
    weak_signals:
      - "Count numbers up to N divisible by none (or at least one) of a few given numbers"
      - "Strings or arrays that must contain each of several values at least once"
      - "Permutations with no fixed points; distributions where no part exceeds a limit"
    kill_signals:
      - "The number of properties is large and N(S) depends on the whole set S (2^m is too many)"
      - "The bad events are disjoint: a plain subtraction suffices"
    lookalikes:
      - description: "Count numbers up to N divisible by 6 or by 10"
        needs: "gcd-lcm (0.4)"
        flipping_difference: "With only two sets, Theorem 0.4.6 (part 3) already gives the answer; inclusion–exclusion is its generalisation to many sets."
    complexity: "O(2^m) terms, or O(m) when N(S) depends only on |S|."
  - id: bijection-paths
    name: Counting by a bijection
    decisive_property: "The objects correspond one-to-one with choices of positions (for example the right steps of a lattice path, or the moves of each type), so their number is a single binomial coefficient."
    from_theorem: Theorem 2.3.7
    how_to_test: "Find what fixes an object (which steps go right, how many moves of each kind), check that every such choice gives exactly one object, and count the choices."
    weak_signals:
      - "Walks on a grid with right and up (or down) steps only"
      - "Reach a point with two kinds of moves; how many move orders?"
      - "Sequences with a fixed number of each of two symbols"
    kill_signals:
      - "Cells to avoid or many restrictions on the path (inclusion–exclusion over a few cells, or a step-by-step table)"
      - "More than two kinds of steps with no fixed counts"
    lookalikes:
      - description: "Grid paths that must avoid a few blocked cells"
        needs: "include-exclude (2.3)"
        flipping_difference: "The blocked cells break the bijection; subtract the paths through them, sorted by position."
    complexity: "O(1) per count after the factorial tables."
problems:
  - id: ac-abc145_d
    role: worked_example
    summary: "A piece moves by (+1, +2) or (+2, +1); count the move sequences from (0, 0) to (X, Y) with X, Y ≤ 10^6, modulo 10^9 + 7."
  - id: lc-count-ways-to-make-array-with-product
    role: worked_example
    summary: "For up to 10^4 queries (n, k) with n, k ≤ 10^4, count the arrays of n positive integers with product k, modulo 10^9 + 7."
  - id: cses-1079
    role: ladder
    card: ncr-mod-p
    rung: 1
    twist: Base case of the card
    summary: "Answer 10^5 queries C(a, b) modulo 10^9 + 7 with 0 ≤ b ≤ a ≤ 10^6."
    hints:
      - "Computing each coefficient from scratch costs up to 10^6 steps. What can be prepared once?"
      - "Tables of i! and (i!)^(−1) modulo the prime up to 10^6 (Theorem 2.3.3)."
      - "Answer each query as fact[a]·inv[b]·inv[a − b], reducing after each product."
  - id: cses-1715
    role: ladder
    card: ncr-mod-p
    rung: 2
    twist: "Repeated letters: a multinomial coefficient."
    summary: "How many different strings can be made from all the letters of a given string of length up to 10^6? Modulo 10^9 + 7."
    hints:
      - "Count the copies of each letter. Which arrangements are the same string?"
      - "n!/(c_a!·c_b!·…·c_z!) (Theorem 2.3.4)."
      - "One factorial table up to n; divide by multiplying with inverse factorials."
  - id: cf-1462E1
    role: ladder
    card: ncr-mod-p
    rung: 3
    twist: Sort, fix the smallest chosen element, and choose the others from a window.
    summary: "Count the triples i < j < z whose largest and smallest values differ by at most 2 (values ≤ n, total n ≤ 2·10^5 over the tests; exact count)."
    hints:
      - "Sort first: which elements can join a triple whose smallest element is a[i]?"
      - "Exactly those after i with value at most a[i] + 2: a window ending at some j, found with a pointer (topic 1.3)."
      - "Add C(j − i, 2) for each i; the answer fits in long long without any modulus."
  - id: cf-1475E
    role: ladder
    card: ncr-mod-p
    rung: 4
    twist: Only the ties at the boundary of the best k create choices.
    summary: "Choose k of n bloggers (n ≤ 1000) to maximise their total followers; count the ways to reach the maximum, modulo 10^9 + 7."
    hints:
      - "Sort the followers in decreasing order. Which bloggers are in every best choice?"
      - "All with more followers than the k-th largest value x. Among the c bloggers with exactly x, any r of them can fill the remaining places."
      - "The answer is C(c, r), with r the number of x's among the top k."
  - id: lc-count-anagrams
    role: ladder
    card: ncr-mod-p
    rung: 5
    twist: A product of multinomial coefficients, one per word.
    summary: "Count the strings obtained by permuting the letters within each word of a sentence (length ≤ 10^5), modulo 10^9 + 7."
    hints:
      - "Words are independent: the product rule over the words."
      - "One word gives its length factorial divided by the factorials of its letter counts (Theorem 2.3.4)."
      - "Build one factorial table up to 10^5 and multiply the multinomial coefficients of all words."
  - id: cf-1359E
    role: ladder
    card: ncr-mod-p
    rung: 6
    twist: Prove which arrays work, then count chains of multiples with one binomial each.
    summary: "Count the increasing arrays 1 ≤ a_1 < … < a_k ≤ n (n, k ≤ 5·10^5) such that the remainder after a chain of mod operations never depends on the order; modulo 998244353."
    hints:
      - "Try small arrays. When does the order of the mod operations matter?"
      - "Exactly when some element is not a multiple of the smallest one: the array works if and only if a_1 divides every a_i."
      - "For each a_1, choose the other k − 1 elements among the ⌊n/a_1⌋ − 1 larger multiples: add C(⌊n/a_1⌋ − 1, k − 1) over a_1."
  - id: ac-abc209_c
    role: ladder
    card: product-sum-rules
    rung: 1
    twist: Base case of the card
    summary: "Count the sequences of pairwise different integers with 1 ≤ A_i ≤ C_i (N ≤ 2·10^5, C_i ≤ 10^9), modulo 10^9 + 7."
    hints:
      - "Choose the values position by position. In which order is the number of options fixed?"
      - "Sort the limits increasingly: the i-th position (0-based) then always has C_i − i options (Theorem 2.3.1)."
      - "Multiply the options modulo the prime; if one is at most 0 the answer is 0."
  - id: lc-right-triangles
    role: ladder
    card: product-sum-rules
    rung: 2
    twist: Split by the corner (sum rule), then multiply the two other choices.
    summary: "Count the triples of 1-cells in a grid where one cell shares a row with the second and a column with the third."
    hints:
      - "Which cell of the triangle is special? Fix it."
      - "Fix the corner cell: the second cell is any other 1 in its row, the third any other 1 in its column, independently."
      - "Count 1s per row and column; add (row count − 1)·(column count − 1) over all 1-cells."
  - id: lc-number-of-ways-to-split-a-string
    role: ladder
    card: product-sum-rules
    rung: 3
    twist: Two independent cut positions, plus a separate case with no 1s.
    summary: "Split a binary string (length ≤ 10^5) into three non-empty parts with equal numbers of 1s; count the ways modulo 10^9 + 7."
    hints:
      - "With t ones, each part must contain t/3 of them. Where can the first cut go?"
      - "Anywhere between the (t/3)-th and the (t/3 + 1)-th one; the second cut likewise after the (2t/3)-th one. The two choices are independent."
      - "Multiply the two gap sizes; if t = 0, any 2 of the n − 1 gaps work: C(n − 1, 2)."
  - id: lc-count-all-valid-pickup-and-delivery-options
    role: ladder
    card: product-sum-rules
    rung: 4
    twist: Build the sequence by inserting one order at a time.
    summary: "Count the sequences of n pickups and n deliveries (n ≤ 500) where each delivery comes after its pickup, modulo 10^9 + 7."
    hints:
      - "Suppose the first i − 1 orders are placed. In how many ways can order i be inserted?"
      - "There are 2i − 1 gaps among the 2i − 2 events; the pickup and delivery take two slots in order: i(2i − 1) ways, the same for every earlier arrangement."
      - "Multiply i(2i − 1) over i = 1..n modulo the prime."
  - id: ac-abc220_e
    role: ladder
    card: product-sum-rules
    rung: 5
    twist: Split by the top vertex of the path and the depth reached on each side.
    summary: "Count ordered pairs of vertices at distance D in a perfect binary tree of depth N (N ≤ 10^6, D ≤ 2·10^6), modulo 998244353."
    hints:
      - "A path has a highest vertex. Split the pairs by its depth and by how far the path goes down on each side."
      - "Going down d steps from a vertex reaches 2^d vertices; going down on both sides needs the two different child subtrees: 2^(a−1)·2^(b−1) pairs for a + b = D."
      - "For each depth of the top vertex, the valid (a, b) form a range; sum with powers of 2 precomputed, and multiply by 2 for the order."
  - id: cses-1716
    role: ladder
    card: stars-bars
    rung: 1
    twist: Base case of the card
    summary: "Count the ways to give m identical apples to n children (n, m ≤ 10^6), modulo 10^9 + 7."
    hints:
      - "The apples are identical and the children are not. Draw a distribution as stars and separators."
      - "m stars and n − 1 bars in a row: C(m + n − 1, n − 1) (Theorem 2.3.5)."
      - "Factorial table up to 2·10^6."
  - id: lc-count-sorted-vowel-strings
    role: ladder
    card: stars-bars
    rung: 2
    twist: A sorted string is fixed by how many of each letter it has.
    summary: "Count the strings of length n ≤ 50 over the five vowels whose letters are in non-decreasing order."
    hints:
      - "Given the number of a's, e's, i's, o's and u's, how many sorted strings have exactly those counts?"
      - "Exactly one, so count the 5 counts that add up to n: stars and bars with k = 5."
      - "C(n + 4, 4), small enough for exact integers."
  - id: lc-count-the-number-of-ideal-arrays
    role: ladder
    card: stars-bars
    rung: 3
    twist: Fix the last value, then split each prime's exponent along the array.
    summary: "Count the arrays of length n ≤ 10^4 with values in [1, maxValue ≤ 10^4] where each element divides the next, modulo 10^9 + 7."
    hints:
      - "Fix the last element v. What does a chain of divisors ending at v look like, prime by prime?"
      - "For each prime of v with exponent e, the exponent is non-decreasing along the array: its e increases are placed among n positions, C(e + n − 1, n − 1) ways (stars and bars)."
      - "Multiply over the primes of v (factorise with a smallest prime factor table) and add over all v ≤ maxValue."
  - id: cses-1078
    role: ladder
    card: include-exclude
    rung: 1
    twist: Base case of the card
    summary: "Count right/down paths across an n × n grid (n ≤ 10^6) avoiding m ≤ 1000 traps, modulo 10^9 + 7."
    hints:
      - "Paths without traps are one binomial coefficient. How do you remove those through traps without removing some twice?"
      - "Sort the traps; let f(t) be the paths from the start to trap t that avoid earlier traps: all paths to t minus f(s)·paths(s, t) for traps s before t."
      - "The answer is all paths minus Σ f(t)·paths(t, end); O(m²) binomials from factorial tables."
  - id: cf-1295D
    role: ladder
    card: include-exclude
    rung: 2
    twist: Count residues coprime to a number by inclusion–exclusion over its primes.
    summary: "For given a < m ≤ 10^10, count x in [0, m) with gcd(a + x, m) = gcd(a, m) (up to 50 tests)."
    hints:
      - "Divide by g = gcd(a, m). Which values of (a + x)/g work, and what range do they cover?"
      - "They must be coprime to m/g, and as x runs over [0, m) they run over a full set of residues modulo m/g."
      - "Factorise m/g by trial division and count the numbers in [1, m/g] divisible by none of its primes (Theorem 2.3.6)."
  - id: ac-abc172_e
    role: ladder
    card: include-exclude
    rung: 3
    twist: The bad properties are positions where the two sequences agree; N(S) depends only on |S|.
    summary: "Count pairs of sequences A, B of N distinct values from 1..M with A_i ≠ B_i at every position (N ≤ M ≤ 5·10^5), modulo 10^9 + 7."
    hints:
      - "Fix A (M!/(M − N)! ways). For B, the bad properties are A_i = B_i at position i."
      - "If B must agree with A on a set S of j positions, the other N − j positions take distinct values from the remaining M − j: (M − j)!/(M − N)! ways."
      - "Sum (−1)^j C(N, j)·(M − j)!/(M − N)! over j, then multiply by the count for A."
  - id: lc-unique-paths
    role: ladder
    card: bijection-paths
    rung: 1
    twist: Base case of the card
    summary: "Count right/down paths across an m × n grid (m, n ≤ 100); the answer fits in 2·10^9."
    hints:
      - "How many steps of each kind does every path have?"
      - "m − 1 down and n − 1 right; a path is fixed by which steps go down (Theorem 2.3.7)."
      - "C(m + n − 2, m − 1), computed exactly by multiplying and dividing one factor at a time."
  - id: cses-2064
    role: ladder
    card: bijection-paths
    rung: 2
    twist: Count the bad paths by reflecting them (a bijection with an easier set).
    summary: "Count the valid bracket sequences of length n ≤ 10^6, modulo 10^9 + 7."
    hints:
      - "A sequence is a path with steps +1 and −1 that must never go below 0. How many paths are there without that condition?"
      - "Reflect the part of a bad path before it first reaches −1: bad paths correspond one-to-one to all paths ending at −2."
      - "For n = 2k: C(2k, k) − C(2k, k + 1); for odd n the answer is 0."
  - id: ac-abc205_e
    role: ladder
    card: bijection-paths
    rung: 3
    twist: The same reflection with a shifted boundary.
    summary: "Arrange N white and M black balls (N, M ≤ 10^6) so that every prefix has at most K more whites than blacks; count modulo 10^9 + 7."
    hints:
      - "A row is a lattice path; the condition is a line the path must never cross. When is the answer 0 immediately?"
      - "If N > M + K, no row works. Otherwise reflect each bad path at its first touch of the line w − b = K + 1."
      - "The bad rows correspond to all rows with M + K + 1 whites: answer C(N + M, N) − C(N + M, M + K + 1)."
