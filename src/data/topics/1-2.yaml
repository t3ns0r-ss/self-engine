- id: lc-maximum-subarray
  role: ladder
  card: prefix-extremes
  rung: 3
  twist: Both parts together, the best of P_j minus the smallest earlier prefix sum.
  summary: The largest sum of a non-empty subarray of n ≤ 10^5 values (negative allowed).
  hints:
  - Write a subarray sum with prefix sums. For a fixed end j, which start is best?
  - The one with the smallest earlier prefix sum P_i, i < j (Theorem 1.2.5, part 4).
  - Scan, keeping the minimum of P_0..P_{j−1} and updating the best P_j − minimum before adding P_j to
    the minimum.
- id: ac-abc122_c
  role: worked_example
  summary: For a string of length N ≤ 10^5 over A, C, G, T and Q ≤ 10^5 queries [l, r], count the occurrences
