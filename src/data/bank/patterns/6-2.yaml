# Patterns for topic 6.2 (Prefix function (KMP) and Z-function). Provisional until the lesson maps them to Recognition Cards.
topic: "6.2"
patterns:
  - id: pattern-occurrences
    name: Finding all occurrences
    description: Find every occurrence of a pattern in a text in O(n + m).
    precondition: The prefix function of pattern + separator + text marks an occurrence wherever it equals the pattern length.
  - id: period-border
    name: Periods and borders
    description: Smallest period, all borders, or whether a string is a repetition of a shorter block.
    precondition: A border of length b gives a period n − b, and the borders are the chain of prefix-function values.
  - id: prefix-counts
    name: Counting each prefix's occurrences
    description: How many times each prefix of a string occurs in it, by summing along prefix-function links.
    precondition: Every occurrence of a longer border implies an occurrence of each shorter border in its chain.
  - id: z-compare
    name: Comparing with the prefix
    description: For each position, the longest substring starting there that matches a prefix of the string (Z-function).
    precondition: The Z-box already computed lets each new value start from a known lower bound.
