drill:
- problem: ac-abc195_c
  answer:
    topic: '0.2'
    card: closed-form
  property: Numbers with the same number of digits use the same number of commas, so count each digit-length
    range with a formula.
  why_others_fail: Looping to 10^15 is far over budget; there is no array, so no amortised scan applies.
- problem: ac-abc368_c
  answer:
    topic: '0.2'
    card: closed-form
  property: 'The damage pattern repeats every 3 attacks (5 damage per period): full periods are counted
    by division, the rest by a short loop.'
  why_others_fail: Hitting one point at a time takes up to 10^9 steps per enemy.
- problem: ac-abc180_c
  answer:
    topic: '0.2'
    card: budget-from-constraints
  property: 'Divisors of one number N ≤ 10^12 come in pairs: loop d up to √N = 10^6.'
  why_others_fail: Loops over multiples answer questions about all numbers up to n, not one number; looping
    to N is too slow.
- problem: ac-abc343_c
  answer:
    topic: '0.2'
    card: budget-from-constraints
  property: 'Cubes up to 10^18 have roots up to 10^6, so try every root: 10^6 candidates, each checked
    in about 18 steps.'
  why_others_fail: Looping over all numbers up to N is impossible; no formula gives palindromes directly.
- problem: ac-abc381_c
  answer:
    topic: '0.2'
    card: amortised-total
  property: Around each slash, extend left over 1s and right over 2s; each scan is bounded by its block
    of 1s or 2s, so the total is O(N).
  why_others_fail: Checking every substring is O(N²) or worse.
- problem: ac-abc143_c
  answer:
    topic: '0.2'
    card: amortised-total
  property: The answer is the number of maximal blocks of equal colours, found in one pass.
  why_others_fail: Fusing slimes one at a time and rebuilding the string is quadratic.
- problem: cf-1520B
  answer:
    topic: '0.2'
    card: closed-form
  property: There are 9 such numbers per digit length; count full lengths by formula and the last length
    by comparing n with ddd…d.
  why_others_fail: Checking every number up to 10^9 per test is too slow.
- problem: cf-1426A
  answer:
    topic: '0.2'
    card: closed-form
  property: 'After the first floor, floors hold x flats each: the floor is 1 + ⌈(n − 2) / x⌉ for n > 2.'
  why_others_fail: Walking floor by floor takes up to 10^9 steps per test.
- problem: ac-abc123_c
  answer:
    topic: '0.1'
    card: integer-rounding
  property: 'Only the slowest transport matters: the answer is ⌈N / min⌉ + 4, an exact ceiling of values
    up to 10^15.'
  why_others_fail: Looks like a step-by-step process over minutes (up to 10^15 of them), but the formula
    needs only integer rounding from 0.1.
