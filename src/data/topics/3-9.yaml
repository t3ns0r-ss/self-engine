- id: lc-partition-array-into-two-arrays-to-minimize-sum-difference
  role: review
  card: sorted-merge
  review_set: 1
  summary: Split $2n$ numbers ($n \le 15$) into two groups of $n$ so that the difference of the sums is as small as possible.
- id: lc-closest-subsequence-sum
  role: lookalike
  summary: Choose a subsequence of up to 40 numbers (absolute value up to $10^7$) so that its sum is as close as possible to a goal up to $10^9$.
- id: lc-target-sum
  role: lookalike
  summary: Count the ways to give each of at most 20 non-negative numbers a plus or a minus sign so that the signed sum equals a target.
- id: lc-4sum-ii
  role: lookalike
  summary: Four lists of $n \le 200$ numbers; count the quadruples, one number from each list, whose sum is 0.
- id: lc-count-special-quadruplets
  role: lookalike
  summary: Count the index quadruples $a < b < c < d$ of an array of at most 50 numbers with $x_a + x_b + x_c = x_d$.
- id: ac-abc173_c
  role: drill
  summary: Choose a set of rows and a set of columns of a grid with at most 6 rows and 6 columns to paint red, and count the choices that leave exactly K black squares.
- id: ac-abc404_d
  role: drill
  summary: Visit each of $N \le 10$ zoos 0, 1 or 2 times at given fees so that every one of up to 100 animals is seen at least twice, at the lowest total fee.
- id: ac-abc302_c
  role: drill
  summary: Can $N \le 8$ strings of equal length be put in an order in which neighbouring strings differ in exactly one position?
- id: ac-abc197_c
  role: drill
  summary: Cut a sequence of $N \le 20$ numbers into blocks, OR the numbers inside each block, and XOR the block values; find the smallest result.
- id: cf-886A
  role: drill
  summary: Can six players with given scores be split into two teams of three with equal total score?
- id: lc-minimum-difference-between-highest-and-lowest-of-k-scores
  role: drill
  summary: Choose $k$ of up to 1000 scores so that the highest minus the lowest is as small as possible.
- id: lc-minimum-swaps-to-group-all-1s-together-ii
  role: drill
  summary: The fewest swaps that bring all the 1s of a circular binary array (up to $10^5$ cells) together.
- id: lc-longest-square-streak-in-an-array
  role: drill
  summary: The longest chain $x, x^2, x^4, \dots$ whose members all appear in an array of up to $10^5$ numbers.
drill:
- problem: ac-abc173_c
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: 'At most 6 rows and 6 columns make $2^{12} = 4096$ choices, each checked in a few dozen steps: a bitmask over rows and one over columns.'
  why_others_fail: The sizes are tiny, so there is nothing to split; the halves would only add code to a search of 4096 cases.
- problem: ac-abc404_d
  answer:
    topic: '0.5'
    card: recursive-choices
  property: 'Each of at most 10 zoos has three options, so $3^{10} = 59\,049$ plans, each checked against 100 animals.'
  why_others_fail: $3^{10}$ is far below the budget, so no split is needed even though the choices have three options.
- problem: ac-abc302_c
  answer:
    topic: '0.5'
    card: permutations
  property: With at most 8 strings, all $8! = 40\,320$ orders are tried with `next_permutation`.
  why_others_fail: The orders are not a sum of two independent parts, and 40 320 is already small.
- problem: ac-abc197_c
  answer:
    topic: '0.5'
    card: subset-bitmask
  property: Each of the at most 19 gaps is a cut or not, so $2^{19}$ masks, each evaluated in $O(N)$.
  why_others_fail: $2^{19}$ masks is half a million; the objective (OR inside blocks, XOR between them) does not combine two independent halves by a lookup, so a split would not help.
- problem: cf-886A
  answer:
    topic: '0.5'
    card: nested-loops
  property: Three nested loops choose one team of three out of six players, 20 teams in all.
  why_others_fail: Six numbers have 64 subsets; no band to read.
- problem: lc-minimum-difference-between-highest-and-lowest-of-k-scores
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: After sorting, the $k$ closest scores are $k$ neighbours, so one pass over the windows of $k$ scores finds the answer.
  why_others_fail: The question sounds like choosing $k$ of $n$ items, but sorting makes the best choice a window; no subset list is needed.
- problem: lc-minimum-swaps-to-group-all-1s-together-ii
  answer:
    topic: '1.3'
    card: fixed-window
  property: The 1s end up in a window of fixed length equal to their count, and each step of the window updates the number of 0s inside it by one add and one remove.
  why_others_fail: The $2^n$ choices of which cells to swap never need to be listed; a window of fixed length decides.
- problem: lc-longest-square-streak-in-an-array
  answer:
    topic: '0.6'
    card: set-membership
  property: From each value follow its squares while the next square is in a set; a chain has at most 5 links below $10^5$.
  why_others_fail: Chains are found by membership tests, not by choosing subsets, so no halves exist.
lookalike_pairs:
- a: lc-closest-subsequence-sum
  b: lc-target-sum
  a_tool:
    topic: '3.9'
    card: sorted-merge
  b_tool:
    topic: '0.5'
    card: subset-bitmask
  shared_surface: Both ask about the sums of the subsequences of a list of numbers against a goal.
  flipping_difference: In A there are up to 40 numbers, so $2^{40}$ subsequences are too many and the sums of two halves of 20 are merged by a sorted list. In B there are at most 20 numbers, so $2^{20}$ signed sums can be listed directly, with a bitmask or a plain take-or-not recursion.
  flipping_input: 'A: 40 numbers and a goal, the closest sum is wanted (halves of 20). B: the numbers 1 1 1 1 1 with target 3 give 10 sign patterns by a bitmask over 5 numbers.'
- a: lc-4sum-ii
  b: lc-count-special-quadruplets
  a_tool:
    topic: '3.9'
    card: sorted-merge
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both count quadruples of numbers that satisfy one sum equation.
  flipping_difference: In A the four lists have 200 numbers each, so $200^4$ quadruples are too many and the $n^2$ pair sums of two lists meet the pair sums of the other two. In B the single array has at most 50 numbers, and the plain nested loops take about $2.6 \cdot 10^5$ steps.
  flipping_input: 'A: four lists of 200 numbers, count the zero-sum quadruples. B: the array 1 1 1 3 gives 1 quadruple with $x_a + x_b + x_c = x_d$.'
self_test:
- q: How many subsets does a set of 40 numbers have, and how many sums does each of two halves of 20 have?
  a: $2^{40} \approx 1.1 \cdot 10^{12}$ subsets, and $2^{20} \approx 10^6$ sums per half, so two lists and a sort fit the budget (Theorem 3.9.1).
- q: Why can the list of the $2^k$ subset sums of one half be built in about $2^k$ steps and not $k \cdot 2^k$?
  a: Each new number is added to every sum already listed, so the list doubles with one addition per new entry, $2^k - 1$ additions in all (Theorem 3.9.2).
- q: In "count the subsets with sum at most T", which function finds the number of right sums at most T − x, and what goes wrong with the other one?
  a: '`upper_bound` returns the position after the last sum at most T − x; `lower_bound` stops before the sums equal to T − x and misses every subset whose total is exactly T.'
- q: When can the binary searches of the merge be replaced by two pointers?
  a: When both lists are sorted ascending and the test is "sum at most T", so the number of usable right entries only shrinks as the left value grows (Theorem 3.9.3).
- q: For a grid path of $n + m - 2$ steps, where is the cut, and what happens to the meeting cell?
  a: At the diagonal $i + j = \lfloor (n + m - 2)/2 \rfloor$, which every path crosses exactly once; the meeting cell is counted in one half only.
- q: Why does meet in the middle fail for "the subsets with sum T and no two neighbours chosen"?
  a: The neighbour rule links an element of the left half with one of the right half, so the halves are not independent and their sums cannot be combined alone.
- q: 'Four lists of 200 numbers each: how do you count the quadruples with sum 0 in about $10^6$ steps?'
  a: Sort the $200^2$ sums of the first two lists and look up the negative of each of the $200^2$ sums of the other two.
checkpoint:
  time_limit_minutes: 120
  problems:
  - cses-1628
  - lc-split-array-with-same-average
  - cf-888E
decision_map:
- weak_signal: About 40 numbers (or 25 choices with three options), a sum or an xor over the choices, and values too big for a table
  choose: size-band
  when: '$b^n$ is far too many, each half has at most about $2^{22}$ entries, and the answer is one entry of each half list combined by a sum or an xor (Theorems 3.9.1 and 3.9.2).'
  over:
  - card: subset-bitmask
    topic: '0.5'
    because: Bitmasks over all subsets are enough when $n \le 20$ and cheaper to write.
  - card: bound-pruning
    topic: '3.1'
    because: Branch and bound has no guarantee, and with nearly equal values the estimate cuts little; the halves are guaranteed.
- weak_signal: Equal to, at most or closest to a target over two lists of half answers; a four-sum
  choose: sorted-merge
  when: The pair test is a lookup in one sorted list (binary search), or monotone in both lists so one pass of two pointers does it (Theorems 3.9.1 and 3.9.3).
  over:
  - card: nested-loops
    topic: '0.5'
    because: Nested loops are enough when the total number of tuples is below about $10^8$.
  - card: merge-walk
    topic: '1.3'
    because: Two pointers on two given sorted lists is the same pass; here the lists are first produced from the halves.
- weak_signal: A grid path or a sequence of moves of length about 40 with a combination condition on the whole path
  choose: grid-path-split
  when: Every path crosses a middle line once and the whole-path value is a combination of a first-half and a second-half value, matched per middle cell.
  over:
  - card: constraint-placement
    topic: '3.1'
    because: A condition that the halves cannot see (all values different, a visited set) needs the search over whole paths.
