# Patterns for topic 3.4 (LIS in O(n log n), LCS, edit distance). Provisional until the lesson maps them to Recognition Cards.
topic: "3.4"
patterns:
  - id: lis
    name: Longest increasing subsequence
    description: Length of the longest strictly (or non-strictly) increasing subsequence in O(n log n) with the "smallest tail" array.
    precondition: The smallest-tail array is sorted, so the position to update is found by searching.
  - id: lis-reduction
    name: Problems that reduce to it
    description: After sorting by one key, the question becomes the longest increasing chain in the other key (nested boxes, envelopes, chains of pairs).
    precondition: Sorting by the first key (with the right tie order) leaves exactly the second-key increasing condition.
  - id: lcs
    name: Longest common subsequence
    description: Length or one example of the longest common subsequence of two sequences in O(n·m).
    precondition: n · m fits the budget, and the answer for two prefixes depends only on shorter prefixes.
  - id: edit-distance
    name: Edit distance
    description: Minimum insertions, deletions, and replacements to turn one string into another.
    precondition: Every edit sequence can be reordered to act on the strings from left to right, so the state is a pair of prefixes.
