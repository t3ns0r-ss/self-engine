# Patterns for topic 4.1 (Representation, BFS, DFS, components, grids as graphs). Provisional until the lesson maps them to Recognition Cards.
topic: "4.1"
patterns:
  - id: components
    name: Connected components
    description: Count components, label them, or find the component of each vertex (flood fill).
    precondition: Two vertices are in the same component exactly when a traversal from one reaches the other.
  - id: unweighted-shortest
    name: Fewest edges
    description: Shortest paths by number of edges in an unweighted graph, with a path recovered from parents.
    precondition: Every edge has the same cost, so vertices leave the queue in order of distance.
  - id: grid-graph
    name: Grids as graphs
    description: Treat cells as vertices and allowed moves as edges (labyrinths, counting rooms).
    precondition: Each cell connects to a constant number of neighbours, so a traversal is O(rows · columns).
  - id: multi-source
    name: Distance to the nearest source
    description: Start the traversal from all sources at distance 0 to get every vertex's distance to its nearest source.
    precondition: Edges have equal cost, so a single queue seeded with all sources keeps distance order.
  - id: state-graph
    name: Implicit graphs of states
    description: Vertices are states (numbers, positions with extra data) and moves are edges; search the state space.
    precondition: The number of reachable states is small and every move costs the same.
