drill:
- problem: lc-house-robber-iii
  answer:
    topic: '7.1'
    card: subtree-dp
  property: 'Two states per node, robbed or not: if robbed, the children are not; if not, each child takes
    its better state. The answer is the better state at the root.'
  why_others_fail: 'A greedy by levels fails: robbing a node and its grandchildren can beat robbing its
    children.'
- problem: ac-abc036_d
  answer:
    topic: '7.1'
    card: subtree-dp
  property: The number of paintings of a subtree with the vertex white is the product of the totals of
    the children, and with it black the product of their white numbers.
  why_others_fail: A search over paintings has 2^N cases; a DP along a line does not exist for a tree.
- problem: lc-maximum-sum-bst-in-binary-tree
  answer:
    topic: '7.1'
    card: subtree-dp
  property: Each subtree returns whether it is a search tree, its smallest and largest value and its sum;
    the parent combines the two children in O(1).
  why_others_fail: Testing every node for the search-tree property by walking down costs O(n²).
- problem: cf-1092F
  answer:
    topic: '7.1'
    card: rerooting
  property: The cost of a root changes along an edge by S − 2·sub[c], where S is the total weight and
    sub[c] the weight of the subtree.
  why_others_fail: A search from every vertex costs O(n²).
- problem: cf-1324F
  answer:
    topic: '7.1'
    card: rerooting
  property: The best set for a vertex is its own value plus the positive parts of its neighbours; the
    part above a child is the parent's answer without the contribution of that child.
  why_others_fail: The subtree DP from every vertex as the root costs O(n²).
- problem: ac-abc348_e
  answer:
    topic: '7.1'
    card: rerooting
  property: f(c) = f(p) + W − 2·sub[c] with W the total weight and sub[c] the weight of the subtree of
    c; take the minimum over the vertices.
  why_others_fail: A search from every vertex costs O(N²).
- problem: lc-longest-univalue-path
  answer:
    topic: '7.1'
    card: through-vertex
  property: A path has a top node; for each node keep the longest downward path of equal values and join
    the two children whose value is equal to its own.
  why_others_fail: Starting a search from every node costs O(n²) on a path.
- problem: lc-minimum-increments-to-equalize-leaf-paths
  answer:
    topic: '7.1'
    card: subtree-dp
  property: The largest root-to-leaf cost in each subtree; at a node every child whose value is below
    the largest child value needs one increment, placed on that child.
  why_others_fail: Raising costs at the leaves one by one needs the totals of the subtrees below anyway.
- problem: lc-path-sum-iii
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: Keep a map from the prefix sums on the current root path to counts; at a node add the count
    of (prefix − target) and take the node out of the map on the way back.
  why_others_fail: A DP for every node would count each path from its top, O(n²) on a path; the prefix
    sums make it O(n).
- problem: lc-time-needed-to-inform-all-employees
  answer:
    topic: '4.5'
    card: depths-parents
  property: The answer is the largest sum of inform times on a path from the head, carried down with the
    traversal.
  why_others_fail: There are no choices to make; a DP with states is not needed.
- problem: lc-delete-nodes-and-return-forest
  answer:
    topic: '4.5'
    card: depths-parents
  property: Carry down whether the parent was deleted; a kept node whose parent was deleted (or that has
    no parent) is the root of a new tree.
  why_others_fail: There is nothing to count or optimise; one traversal gives the answer.
- problem: lc-count-complete-tree-nodes
  answer:
    topic: '1.4'
    card: answer-search
  property: 'In a complete tree compare the left and the right depth: equal means a perfect subtree with
    2^h − 1 nodes; a binary search on the last level counts the rest.'
  why_others_fail: Visiting all nodes is O(n); the shape of a complete tree gives O(log² n).
lookalike_pairs:
- a: lc-maximize-the-number-of-target-nodes-after-connecting-trees-ii
  b: lc-maximize-the-number-of-target-nodes-after-connecting-trees-i
  a_tool:
    topic: '4.2'
    card: two-sides
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both join two trees by one edge and ask, for each vertex of the first tree, the largest
    number of target vertices after the best choice of the edge.
  flipping_difference: 'In version I the trees have at most 1000 vertices and a target is at distance
    at most k, so a search from every vertex counts them. In version II the trees have up to 10^5 vertices
    and a target is at an even distance: the two-colouring of each tree gives the count of even distances
    for every vertex at once.'
  flipping_input: 'Two trees of 10^5 vertices: 10^5 searches of 10^5 steps each are 10^10 steps, while
    two colourings take about 2·10^5.'
- a: lc-count-the-number-of-houses-at-a-certain-distance-ii
  b: lc-count-the-number-of-houses-at-a-certain-distance-i
  a_tool:
    topic: '1.2'
    card: difference-array
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both count, for each distance k, the pairs of houses in a line with one extra street
    at that shortest distance.
  flipping_difference: 'In version I there are at most 100 houses, so a search from every house is enough.
    In version II there are up to 10^5: the pairs are split by their place relative to the extra street
    (a line, a cycle, tails) and the counts for ranges of distances are added with a difference array.'
  flipping_input: 'n = 10^5 houses: 10^5 searches of 10^5 steps are 10^10 steps, against O(n) with the
    difference arrays.'
self_test:
- q: Use Theorem 7.1.1 to count the paintings of the path 0–1–2–3, rooted at 0, with no two adjacent black
    vertices.
  a: The leaf 3 has (w, b) = (1, 1). The vertex 2 has w = 2, b = 1; the vertex 1 has w = 3, b = 2; the
    vertex 0 has w = 5, b = 3. The total is 8.
- q: The path 0–1–2 has the values 4, −10, 5. What is the largest sum of a path (Theorem 7.1.2)? Can the
    best path join 0 and 2?
  a: 'down(2) = 5, down(1) = −10 + 5 = −5. The path 0–1–2 has the sum −1, and the vertex 2 alone has 5.
    The answer is 5: joining 0 and 2 costs the −10 of the vertex between them, and a child path below
    0 is left out because it is negative.'
- q: Use answer(c) = answer(p) + n − 2·size(c) to find the sums of the distances in the path 0–1–2–3,
    rooted at 0.
  a: answer(0) = 0 + 1 + 2 + 3 = 6. size(1) = 3, size(2) = 2, size(3) = 1, so answer(1) = 6 + 4 − 6 =
    4, answer(2) = 4 + 4 − 4 = 4, answer(3) = 4 + 4 − 2 = 6. The sums are 6, 4, 4, 6.
- q: Why does the template for connected sets use prefix and suffix products and not a division by the
    factor of one child?
  a: The modulus may be any number, and a factor down(c) + 1 can be 0 modulo it (for M = 6 the factor
    6 is 0), so it has no inverse and the division is impossible. Prefix and suffix products leave one
    child out without dividing.
- q: How many steps do the merges of Theorem 7.1.4 take for a star with a centre and 4 leaves, rooted
    at the centre? For a path of 5 vertices?
  a: 'The star: the leaves are merged into a table of size 1, 2, 3, 4 with a child of size 1 each time:
    1 + 2 + 3 + 4 = 10. The path of 5 vertices rooted at an end: each vertex merges one child of size
    k into a part of size 1: 1·1 + 1·2 + 1·3 + 1·4 = 10. Both are 5 · 4 / 2.'
- q: For the farthest vertex from every vertex, why is answer(c) = max(down(c), answer(p) + 1) wrong?
  a: answer(p) may be the length of a path that goes down into c; adding 1 and using it for c counts the
    way into c's own subtree. On the path 3–1–0–2 it gives 3 for the vertex 1 where the answer is 2. The
    way out of p without c needs the second best way.
- q: Why does the code never call itself on the children, and what does it use instead?
  a: A tree can be a path of 2·10^5 vertices, and a recursion that deep overflows the stack. The code
    makes a list of the vertices with every parent before its children (a breadth-first order) and goes
    through it backwards for the values that come from the children, forwards for those that come from
    the parent.
checkpoint:
  time_limit_minutes: 150
  problems:
  - lc-binary-tree-cameras
  - cf-1101D
  - ac-dp_v
decision_map:
- weak_signal: The number or the best value of choices on the vertices or edges of a tree under a rule
    between neighbours; a minimum or maximum built from the children
  choose: subtree-dp
  when: The subtree of a vertex touches the rest only through the vertex, and a few states per vertex
    are enough (Theorem 7.1.1).
  over:
  - card: linear-state
    topic: '3.2'
    because: On a line the DP moves over positions; a tree needs the combination over several children.
  - card: subtree-values
    topic: '4.5'
    because: One number per subtree with no choices is a plain subtree value.
- weak_signal: The best path of a tree with values or weights; the number of pairs of vertices at a distance
    or with a xor in a range; the longest path with a property
  choose: through-vertex
  when: Every path has a top vertex where it joins at most two downward paths (Theorem 7.1.2).
  over:
  - card: longest-path
    topic: '4.5'
    because: The unweighted diameter is two searches; values and negative weights need the DP.
  - card: tree-distance
    topic: '4.6'
    because: 'A fixed pair of vertices: the lowest common ancestor.'
- weak_signal: 'The same quantity for every vertex taken as the root: the sum of distances, the number
    of ways, the best start'
  choose: rerooting
  when: The answer for a child is made from the answer above its parent and the other children, with prefix
    and suffix values or the two best (Theorem 7.1.3).
  over:
  - card: subtree-dp
    topic: '7.1'
    because: 'Only one root is asked about: a single DP.'
  - card: farthest-each
    topic: '4.5'
    because: For the farthest vertex alone the ends of the diameter are enough.
- weak_signal: Exactly k vertices or edges chosen in a connected part of a tree; a count of ways indexed
    by a depth or a number of components, with n up to 5000
  choose: tree-merge
  when: The count in the state is at most the size of the subtree, so merging tables costs n(n − 1)/2
    in all (Theorem 7.1.4).
  over:
  - card: zero-one
    topic: '3.3'
    because: Items in a row are merged one at a time; subtrees are merged whole.
  - card: sort-then-scan
    topic: '1.1'
    because: Without connectedness the k largest values are enough.
