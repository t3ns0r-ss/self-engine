drill:
  - problem: lc-remove-k-digits
    answer:
      topic: '1.6'
      card: nearest-greater
    property: A digit followed by a smaller digit should go first. Keep the kept digits on a stack that
      increases from bottom to top, and pop a larger top while removals remain; remove the rest from the
      end.
    why_others_fail: Trying every set of k removals is exponential, and sorting the digits destroys their
      order.
  - problem: lc-maximum-width-ramp
    answer:
      topic: '1.6'
      card: nearest-greater
    property: 'Only positions smaller than everything before them can be the best left end; they form
      a decreasing stack. Scan j from the right and pop every candidate i with nums[i] ≤ nums[j]: no j
      further left gives it a wider ramp.'
    why_others_fail: All pairs are O(n²); a two-pointer walk needs a monotone condition on both ends.
      Sorting positions by value with a running minimum of positions (topic 1.1) also works.
  - problem: lc-car-fleet
    answer:
      topic: '1.6'
      card: nearest-greater
    property: Sorted from the car closest to the target backwards, each car's arrival time alone is (target
      − position) / speed. A car joins the fleet ahead unless it would arrive strictly later; the fleet
      times kept form a monotonic stack.
    why_others_fail: Simulating the cars over time is slow and needs exact meeting times; only the order
      of arrival times matters.
  - problem: lc-sum-of-subarray-ranges
    answer:
      topic: '1.6'
      card: element-span
    property: The sum of (max − min) is the sum of maxima minus the sum of minima, each computed from
      the span of every element with one-sided ties (Theorem 1.6.2).
    why_others_fail: With n ≤ 1000, O(n²) over all subarrays with running max and min also passes; the
      span method is the O(n) answer.
  - problem: lc-longest-repeating-character-replacement
    answer:
      topic: '1.3'
      card: shrinkable-window
    property: A window is valid when its length minus the count of its most frequent letter is at most
      k; that survives shrinking, so the left end only moves right.
    why_others_fail: The window needs counts of 26 letters, not the maximum value of its elements, so
      no deque is needed.
  - problem: lc-find-peak-element
    answer:
      topic: '1.4'
      card: sorted-search
    property: 'If nums[mid] < nums[mid + 1], some peak lies to the right of mid; otherwise one lies at
      mid or to its left. Keep the half that rises: O(log n).'
    why_others_fail: The nearest greater element finds a peak too, but in O(n); the problem asks for O(log
      n).
  - problem: lc-gas-station
    answer:
      topic: '1.5'
      card: left-to-right-forced
    property: If the tank goes negative at station i, no start from the current start up to i works, so
      restart after i. A start exists exactly when the total gas is at least the total cost.
    why_others_fail: No nearest element is asked; one running sum with a restart rule is enough.
  - problem: cses-1073
    answer:
      topic: '1.5'
      card: extreme-first
    property: Put each cube on the tower whose top is the smallest value larger than the cube, or start
      a new tower; a smaller top that still fits wastes the least.
    why_others_fail: 'A stack keeps one sequence, but many towers are open at once and a cube may go on
      any of them: keep the tops in a multiset (topic 0.6) and use upper_bound.'
lookalike_pairs:
  - a: lc-beautiful-towers-i
    b: lc-beautiful-towers-ii
    a_tool:
      topic: '0.5'
      card: nested-loops
    b_tool:
      topic: '1.6'
      card: element-span
    shared_surface: Both ask for the largest total height of a mountain-shaped arrangement of towers,
      each capped by its own maximum height.
    flipping_difference: A has n ≤ 10^3, so trying every peak with an O(n) walk is fast enough; B has
      n ≤ 10^5, so the best non-decreasing prefix ending at each position must come from the previous
      smaller position in O(1) amortised.
  - a: lc-sliding-window-maximum
    b: lc-sliding-window-median
    a_tool:
      topic: '1.6'
      card: window-deque
    b_tool:
      topic: '0.6'
      card: ordered-set-lookup
    shared_surface: Both print one value for each window of k consecutive numbers of an array with n up
      to 10^5.
    flipping_difference: A needs only the maximum, so an element with a larger one after it can be dropped
      for good; B needs the middle value, which can be any element of the window, so nothing can be dropped.
    flipping_input: 'a = [1, 5, 2, 4], k = 3: the deque method prints 5, 5, but the medians are 2, 4.'
self_test:
  - q: Why is the next greater element found in O(n) total, although one step can pop many elements?
    a: Each position is pushed once and popped at most once, so all pops together are at most n (Theorem
      0.2.4). A step that pops many elements is paid for by the steps that pushed them.
  - q: For a = (2, 2), what does the sum of subarray minima give if L and R are both the nearest strictly
      smaller elements, and why?
    a: '8 instead of 6: the subarray (2, 2) has two equal minima, and each of them counts it. Breaking
      ties on one side (strict on the left, smaller-or-equal on the right) makes each subarray count only
      for its rightmost minimum.'
  - q: Why does the histogram rectangle need no tie rule, although the sum of minima does?
    a: The histogram takes a maximum over candidates; counting a rectangle twice changes nothing. The
      sum of minima adds the candidates, so each subarray must be counted exactly once.
  - q: In the sliding-window maximum, why may a position j be removed for good when a later position i
      in the window has a[i] ≥ a[j]?
    a: Every later window that contains j also contains i, because windows move only right and i is after
      j. So i's value is at least j's in all of them, and j is never needed as the maximum.
  - q: Which nearest element do you need for 'the number of days until a warmer day', and which for 'the
      number of days since the last day at least as warm'?
    a: 'The next strictly greater element, by position, for the first; the previous greater-or-equal element
      for the second. They come from the same scan: one is recorded when an element is popped, the other
      when it is pushed (Theorem 1.6.1).'
  - q: The stack reported the next greater element of position 1 in (3, 1, 2) as position 2. Then a[2]
      became 0. Is that still right? And what does the popping stack answer for "the nearest later position
      whose value is a multiple of a[0]" in (2, 3, 4)?
    a: 'No: after the change there is none (−1). Stored answers are true only for the array they were
      computed on, so an array that changes between questions rules the card out; for small n, rescan.
      For the multiples, the stack pops 2 as soon as 3 arrives and reports position 1, but 3 is not a
      multiple of 2; the answer is position 2 (value 4). Popping is safe only when the relation is a comparison
      of values.'
  - q: For (3, 1, 2) the span formula gives 9. What is the sum of all elements of every subarray? And
      for (2, 1, 4), where the formula gives 10, what is the sum of the minimum over all non-empty subsequences?
    a: '19 (3 + 1 + 2 + 4 + 3 + 6): no single element decides a subarray''s sum, so use prefix sums (topic
      1.2). 12: the formula counts only contiguous pieces, but (2, 4) has minimum 2 and is a subsequence,
      not a subarray; sorting the values (topic 1.1) and counting by rank handles subsequences.'
  - q: For (1, 5, 2, 4) and k = 3, what are the window maxima and the window medians? And for (1, 7, 2,
      3, 4), why can the deque built for the window [2, 4] not answer the maximum of a[0..4]?
    a: 'The maxima are 5, 5 and the medians are 2, 4: a median is not an extreme, so dominated elements
      can still be the answer (two multisets, topic 0.6). The deque dropped position 1 (value 7) when
      it left the window, so it would answer 4 instead of 7; the left end may only move right.'
checkpoint:
  time_limit_minutes: 90
  problems:
    - cses-1147
    - lc-shortest-subarray-with-sum-at-least-k
    - lc-132-pattern
decision_map:
  - weak_signal: '"The next greater / warmer / taller", "the first day after", "how many can be seen",
      a span back to a larger value'
    choose: nearest-greater
    when: Each position needs the nearest element on one side that beats it, and a beaten element never
      matters again (Theorem 1.6.1).
    over:
      - topic: '0.5'
        card: nested-loops
        because: Scanning outwards from each position is O(n²) on a monotone array.
      - topic: '0.6'
        card: ordered-set-lookup
        because: A set orders values, not positions; the nearest larger value by position needs the stack.
      - topic: '0.6'
        card: stack-queue
        because: A plain stack stores everything; the monotonic invariant is what makes each pop final.
  - weak_signal: Sum or maximum over all subarrays of their minimum or maximum; the largest rectangle
      under bars or in a grid
    choose: element-span
    when: The subarray's value is decided by one element, and the subarrays it decides are all l in one
      range and r in another (Theorem 1.6.2).
    over:
      - topic: '0.5'
        card: nested-loops
        because: All subarrays with a running minimum are O(n²), fine only for n up to about 10^4.
      - topic: '1.2'
        card: range-sum
        because: Prefix sums give each subarray's sum, but the minimum is not a difference of prefixes.
  - weak_signal: The maximum or minimum of every window of k elements; the longest or shortest window
      with max − min within a bound
    choose: window-deque
    when: The window's ends move only to the right and only its maximum or minimum is needed (Theorem
      1.6.3).
    over:
      - topic: '1.3'
        card: fixed-window
        because: A fixed window updates a sum or count in O(1); a maximum cannot be undone when an element
          leaves.
      - topic: '0.6'
        card: ordered-set-lookup
        because: A multiset also works in O(n log n); the deque is O(n) and needed for n near 10^7.
      - topic: '1.3'
        card: shrinkable-window
        because: The window logic is the same; the deque is the part that keeps max − min while the left
          end moves.
glossary_added:
  - next greater element
  - monotonic stack
  - span
  - monotonic deque
  - dominated
