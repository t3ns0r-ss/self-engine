- id: cf-1120C
  role: review
  review_set: 3
  card: z-compare
  summary: Build a string of up to 5000 letters from left to right; appending a letter costs a, appending
    a block that already occurs in the part built costs b; the least total cost.
- id: cf-1537E2
  role: review
  review_set: 3
  card: z-compare
  summary: From a string of up to 5·10^5 letters, by deleting the last letter or doubling the whole string,
    get the lexicographically smallest string of length exactly k.
- id: lc-find-all-good-strings
  role: review
  review_set: 3
  card: pattern-occurrences
  summary: Count the strings of length n ≤ 500 between s1 and s2 (alphabetical order) that do not contain
