id: '5.4'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check'
- topic: '1.1'
  what: 'Sorting: the order of the questions in Mo''s algorithm'
- topic: '1.2'
  what: 'Prefix sums: the counts of one value over positions'
- topic: '1.4'
  what: 'Binary search: counting in a sorted copy of a block and finding positions'
- topic: '1.5'
  what: Greedy choices that the exam problem prices with a tree
- topic: '1.7'
  what: 'Bit operations: prefix XOR values for the pair counts'
- topic: '2.1'
  what: 'Divisors: the contrast problems about divisibility'
- topic: '2.2'
  what: 'Modular arithmetic: factorials and inverses in the contrast problem'
- topic: '3.2'
  what: 'Dynamic programming over one index: the table filled from the right'
- topic: '4.1'
  what: 'Graph traversal: the search from all sources at once'
- topic: '4.5'
  what: 'Trees: the order of entry that turns a subtree into a range'
- topic: '4.6'
  what: 'Lowest common ancestor: distances to the new items in the tree problem'
- topic: '5.1'
  what: 'Sparse table: the tool when the answer comes from the answers of the halves'
- topic: '5.2'
  what: 'Fenwick tree: the tool for counts with changes and the offline sweep'
- topic: '5.3'
  what: 'Segment tree: the tool when a tag or a node fits, and the contrast for blocks'
theorems:
- id: 5.4.1
  title: Blocks, range add and range sum
  plain_words: 'Treat a whole block as one thing: a note "everyone here got $x$" and the total of the
    block. For the ragged ends of a range, which cut a block in the middle, change or read the positions
    one by one. There are at most two ragged ends of less than $B$ positions each, and at most $n / B$
    blocks in between; with $B = \sqrt n$ both are about $\sqrt n$.'
  code: 5.4/thm-1
- id: 5.4.2
  title: Blocks, count of smaller values with changes
  plain_words: A block cannot say how many of its values are below $x$ unless it keeps its values in order.
    Keep them in order, so that one binary search per whole block counts them. A change touches one block,
    and putting one value in a sorted list of $B$ values costs about $B$ moves.
  code: 5.4/thm-2
- id: 5.4.3
  title: Mo's order
  plain_words: 'Group the questions by the block of their left end. Inside a group the left end hops around
    within one block (less than $B$ steps for each question) while the right end only goes one way, up
    or down, so it moves at most $n$ for the whole group. Going from one group to the next costs at most
    $n$ for the right end and about $2B$ for the left. Count: $q$ questions times $B$, plus $n / B$ groups
    times about $2n$.'
  code: 5.4/thm-3
- id: 5.4.4
  title: Mo's algorithm
  plain_words: Keep a window and its answer. To go to the next question, move each end until it is where
    the question wants it, adding or removing one element at a time and repairing the answer after each
    step. Grow before shrinking, so that the window is never "negative" and a removed element was really
    added before.
  code: 5.4/thm-4
- id: 5.4.5
  title: Threshold on the step
  plain_words: A big step leaves the array after only a few jumps, so just make the jumps. A small step
    has only a few different values (fewer than $B$), so for each small step precompute the answer from
    every start. The two costs are balanced at $B \approx \sqrt n$.
  code: 5.4/thm-5
- id: 5.4.6
  title: Few values can be large
  plain_words: A value $x$ can only occur exactly $x$ times in a range if it occurs at least $x$ times
    in the whole array. The total number of places is $n$, and different values of $H$ use at least $1
    + 2 + 3 + \dots$ of them. So there are only about $\sqrt{2n}$ candidates, and for each candidate one
    pass over the array and the questions is enough.
  code: 5.4/thm-6
cards:
- id: sqrt-blocks
  name: Range operations with a note per block of about √n positions
  from_theorem: 5.4.1
  decisive_property: An operation or a question applies to a range of positions, and a block of about
    √n consecutive positions can be updated or read as a whole in one step (a note, a sum, a sorted copy),
    while the ragged ends of the range are done position by position; no tree with O(log n) steps fits
    the operation.
  how_to_test: Cut the array into blocks. For one whole block, write down what the operation does and
    what summary the question needs; if both take O(1) (or O(B)) steps from a stored summary, an operation
    costs about 2B + n/B steps. Check that a tree would need a tag that does not compose or a node that
    is too big.
  constraint_shapes:
  - 'n = q = 2·10^5: scanning the range for every operation is up to 4·10^10 steps (about 400 seconds);
    with blocks of 450 an operation is about 450 + 450 + 450 steps, about 2.7·10^8 in all'
  - 'n = q = 10^5 with a sorted copy per block: a query is about 316 positions plus 316 binary searches
    of 8 steps, about 2.8·10^3 steps; 2.8·10^8 for all queries'
  weak_signals:
  - form: Asks for a count, a sum or a pattern over a range after a range operation whose effect on a
      whole block is simple, but a tree tag for it would not compose
    shape: n, q up to 2·10^5 and a time limit of several seconds
  - form: Asks how many elements of a range are below a bound while single values change
    shape: n, q up to 10^5, three numbers per query
  - form: Applies an operation to a range that is rebuilt block by block, such as a rotation or a copy
      of a stretch, or a block that becomes constant
    shape: n, q up to 10^5, long time limit
  kill_signals:
  - 'The question is about a value that is not a function of the block summary: for the most frequent
    value in a range, the per-block modes of [1, 2, 3 | 2, 4, 5 | 2, 6, 7 | 1, 8, 9] are 1, 2, 2, 1 and
    give the value 1, but the value 2 occurs three times in all'
  - 'The operation composes as a tag and the node is small: a segment tree does it in O(log n) steps (topic
    5.3)'
  in_action:
    statement: 'An array of n numbers. Operations: "set a_k to x", and "how many of the numbers in positions
      l to r are smaller than x?".'
    constraints: n, q ≤ 10^5, values up to 10^9.
    budget: 'Counting in the range for each question: up to n · q = 10^10 steps, about 100 seconds. Need
      about √n steps per operation.'
    candidates:
    - tool: Fenwick tree (topic 5.2)
      verdict: rejected
      because: The count below x depends on the values, and one tree over positions cannot answer it while
        values change.
    - tool: Segment tree with a node of one number (topic 5.3)
      verdict: rejected
      because: A node cannot say how many of its values are below x without knowing all of them.
    - tool: Blocks with a sorted copy (this topic)
      verdict: chosen
      because: A whole block answers by one binary search in its sorted copy, a change rebuilds one copy,
        and the ragged ends are counted one by one (Theorem 5.4.2).
    property_check: A block summary (its sorted values) answers the question for the whole block, and
      a change touches one block. The property holds.
    decision: Blocks of about 300 positions, each with a sorted copy; a query adds up binary searches
      and at most 600 single comparisons; a change fixes one copy.
  examples:
    positive:
    - inline:
        input: a = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3] with blocks of 3. Add 10 to positions 2 to 8 and ask
          the sum of positions 1 to 9.
        answer: '106'
        why: 'Positions 2 (partial) is changed one by one; blocks 1 and 2 are whole and get a note of
          10 each. The sum reads positions 1 and 2 singly, the whole blocks 1 and 2 by their sums, and
          block 3 as the partial position 9: 106.'
    - inline:
        input: a = [5, 2, 8, 1, 9, 3, 7, 4, 6] with blocks of 3. How many of the values in positions 1
          to 7 are smaller than 5?
        answer: '4'
        why: 'The sorted copies are [2, 5, 8], [1, 3, 9], [4, 6, 7]. Positions 1 and 2 are read one by
          one (only 2 counts), block 1 gives 2 by a binary search, positions 6 and 7 are read one by one
          (only 4 counts): 4.'
    negative:
    - inline:
        input: a = [1, 2, 3, 2, 4, 5, 2, 6, 7, 1, 8, 9] in blocks of 3. Which value occurs most often,
          if the answer is taken as the most common among the most common values of the blocks (a tie
          goes to the smaller value)?
        answer: '2'
        method_gives: '1'
        why: 'The block modes are 1, 2, 2 and 1, so the method names 1. But the value 2 occurs three times
          in all, and 1 only twice. The most common value of a range is not a function of the modes of
          its blocks: the occurrences of one value in different blocks add up. Mo''s algorithm counts
          them across the window.'
      correct_tool:
        topic: '5.4'
        card: mo-offline
    - problem: cses-1649
      why: 'Single values change and the question is the minimum of a range: a segment tree does it in
        O(log n) steps with a short code, so blocks would be slower and longer.'
      correct_tool:
        topic: '5.3'
        card: point-update-range-query
  lookalikes:
  - description: Range additions and range sums on an array
    tool:
      topic: '5.3'
      card: lazy-range-update
    flipping_difference: The same operations are done by a segment tree with tags in O(log n) steps; blocks
      are the shorter code for a small n, or for a summary a tree cannot compose.
  - description: Sums of ranges on an array that never changes
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: With no changes, prefix sums answer in O(1) after one pass.
  complexity: O(√n) per operation (O(√(n log n)) with a sorted copy), O(n) memory.
- id: mo-offline
  name: Offline range queries, with a cheap add and remove (Mo's algorithm)
  from_theorem: 5.4.4
  decisive_property: All questions about ranges of a fixed array are known beforehand, and the answer
    for a window can be repaired in O(1) steps when one element enters or leaves it (a count array, a
    sum, a count of counts), but it is not a combination of the answers of the halves.
  how_to_test: Write what changes in the answer when one element at one end enters or leaves the window.
    If the change is a constant number of operations on a count array, answer the questions in Mo's order.
    Check that the array does not change between the questions and that the answers are not needed in
    a given order.
  constraint_shapes:
  - 'n = q = 2·10^5: scanning each range is up to 4·10^10 steps; Mo''s order moves the ends about 3 ·
    2·10^5 · 450 ≈ 2.7·10^8 times, each in O(1)'
  - 'n up to 10^6 and q up to 10^5: the block size is about n / √q ≈ 3000, and the right end moves about
    3 · 10^6 · 316 ≈ 10^9 steps in all: the limit must be generous'
  weak_signals:
  - form: Asks for the number of different values, or a sum of powers of the counts, in many ranges of
      a fixed array
    shape: n, q up to 2·10^5, all ranges given in the input
  - form: Asks for the number of pairs inside a range that satisfy an equality (equal values, equal prefix
      XOR)
    shape: n, q up to 10^5 and values up to 10^6
  - form: Asks for the most common value of a range, or a similar maximum over counts, where the halves
      do not give the answer
    shape: n, q up to 3·10^5 and a time limit of several seconds
  kill_signals:
  - 'The array changes between the questions: for [1, 2, 3] with a_3 set to 1 the range has 2 different
    values, but Mo''s order on the array as first read gives 3'
  - 'The answer is a combination of the halves: a Fenwick tree or a segment tree does it in O(log n) steps'
  in_action:
    statement: An array of n numbers and q questions (l, r). For each question print the sum, over every
      value v, of v multiplied by the square of the number of times v occurs in positions l to r.
    constraints: n, q ≤ 2·10^5, values up to 10^6.
    budget: 'Counting each range separately: up to n · q = 4·10^10 steps, about 400 seconds. Need about
      n √q ≈ 10^8.'
    candidates:
    - tool: Segment tree (topic 5.3)
      verdict: rejected
      because: 'The answer of a range is not a combination of the answers of its halves: the same value
        can be in both.'
    - tool: Fenwick tree with an offline sweep (topic 5.2)
      verdict: rejected
      because: The sweep marks one position per value; here every occurrence counts, in squares.
    - tool: Mo's algorithm (this topic)
      verdict: chosen
      because: 'Adding a value v that occurs c times raises the answer by v (2c + 1), removing lowers
        it by v (2c − 1): O(1) per step (Theorem 5.4.4), and the order of Theorem 5.4.3 bounds the steps.'
    property_check: All questions are known, the array is fixed, and a step of the window changes the
      answer in O(1). The property holds.
    decision: Sort the questions in Mo's order with block size n / √q; keep counts and the answer; use
      64-bit numbers.
  examples:
    positive:
    - inline:
        input: a = [1, 2, 1, 3, 2, 2, 4, 1]. How many different values are in positions 0 to 3?
        answer: '3'
        why: Adding the positions one by one keeps a count array; the number of different values grows
          when a count goes from 0 to 1. The window holds 1, 2, 1, 3 and the answer is 3.
    - inline:
        input: a = [2, 1, 2, 2, 1]. For the whole array, what is the sum over the values v of v times
          the square of the number of occurrences of v?
        answer: '22'
        why: The value 2 occurs 3 times (2 · 9 = 18) and the value 1 occurs twice (1 · 4 = 4). Adding
          one occurrence of v to a count c raises the sum by v (2c + 1), so each step is O(1).
    - worked_example: cf-1514D
      why: 'The most common value of a range of an array is asked for many ranges: Mo''s algorithm keeps
        the counts and the count of counts.'
    negative:
    - inline:
        input: a = [1, 2, 3]. Position 3 is set to 1, and then the number of different values in positions
          1 to 3 is asked. What is it, if the question is answered by Mo's algorithm on the array as first
          read?
        answer: '2'
        method_gives: '3'
        why: After the change the array is [1, 2, 1] and has 2 different values. Mo's algorithm works
          on the array it was given and does not know about the change. With changes between the questions
          the method does not apply; for small n and q the range is simply recounted.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - problem: cses-1734
      why: 'Distinct values in many ranges of a fixed array: the offline sweep with a Fenwick tree takes
        O((n + q) log n) steps, which is much less than n √q.'
      correct_tool:
        topic: '5.2'
        card: offline-sweep-count
  lookalikes:
  - description: The number of different values in a range, with all questions known
    tool:
      topic: '5.2'
      card: offline-sweep-count
    flipping_difference: The sweep by right end with a tree marks the last occurrences; it needs one mark
      per value, which is the case for distinct counts but not for sums of squares of counts.
  - description: A combination of two halves, such as the minimum of a range
    tool:
      topic: '5.1'
      card: idempotent-range-query
    flipping_difference: When the answer comes from the answers of the halves, a table or a tree is enough
      and no order of questions is needed.
  complexity: O(n √q + q log q) with block size n / √q, and O(n) memory.
- id: threshold-split
  name: 'Split by a threshold of about √n: few large ones, many small ones'
  from_theorem: 5.4.5
  decisive_property: A parameter of the question (a step, a count, a size) is either large, so that few
    steps are needed or few items can be that large, or small, so that all small cases can be precomputed
    together; a threshold near √n balances the two.
  how_to_test: Look for a parameter k in the question. Check what the work is for k large (n / k steps,
    or n / k values) and for k small (a table of size n for each small k, or a pass for each small value).
    If both are about √n, split at the threshold.
  constraint_shapes:
  - 'n = q = 10^5 with a step k per question: walking costs n / k, which is large for small k; a table
    for each k below 300 costs 300 · 10^5 = 3·10^7 numbers, and a walk costs at most 330 steps'
  - 'n = 10^5 values and a condition "occurs at least x times": at most about 447 values qualify, and
    one pass of 10^5 steps for each costs 4.5·10^7'
  weak_signals:
  - form: Asks for the sum or the walk along positions p, p + k, p + 2k, ... for many questions with different
      steps k
    shape: n, q up to 10^5 and k up to n
  - form: Asks which values occur at least as many times as their own size, or more than some threshold,
      in a range or in the whole array
    shape: n, q up to 10^5 and values up to n
  - form: Pairs of objects where each of the two sides is either large (few) or small (many) by the number
      of items it holds
    shape: total size up to 2·10^5 and a time limit of several seconds
  kill_signals:
  - 'The steps change with updates to the array: after a_3 is changed, the table of a small step is out
    of date; for [3, 1, 4, 1, 5] with a_3 set to 0 the step sum from 0 with step 2 is 8, but the old table
    says 12'
  - 'The step is always the same (for example 1): a prefix sum array answers all questions'
  in_action:
    statement: An array of n numbers and q questions (p, k). For each question print the sum of a_p, a_{p+k},
      a_{p+2k}, ... up to the end of the array.
    constraints: n, q ≤ 10^5, 1 ≤ k ≤ n.
    budget: 'Walking for each question: up to n steps when k = 1, so n · q = 10^10 steps. Need about √n
      per question.'
    candidates:
    - tool: Prefix sums (topic 1.2)
      verdict: rejected
      because: 'They give sums of consecutive positions, not of every k-th one, unless one array is built
        for every k: n² memory.'
    - tool: Segment tree (topic 5.3)
      verdict: rejected
      because: The positions p, p + k, ... are not a range, so no node covers them.
    - tool: Threshold split on the step (this topic)
      verdict: chosen
      because: A step of at least B leaves the array after n / B jumps; for each small step one table
        of n entries answers in O(1) (Theorem 5.4.5).
    property_check: The work is n / k jumps for large k and a table of size n for each small k; both are
      about √n at B = √n. The property holds.
    decision: B = 300; for each k below B the table T_k[p] = a_p + T_k[p + k]; for k ≥ B walk with at
      most 334 jumps.
  examples:
    positive:
    - inline:
        input: a = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3] with threshold 3. What is the sum from position 1 with
          step 2?
        answer: '20'
        why: 'The step 2 is below the threshold, so the table T_2 is used: T_2[1] = a_1 + T_2[3] = 1 +
          19 = 20 (positions 1, 3, 5, 7, 9 hold 1, 1, 9, 6, 3).'
    - inline:
        input: a = [3, 1, 2, 2, 3, 3, 1, 3]. How many values x occur exactly x times in positions 0 to
          4?
        answer: '2'
        why: 'Only a value that occurs at least x times in the whole array can qualify, and there are
          at most √(2n) of them. In 3, 1, 2, 2, 3 the value 1 occurs once and the value 2 twice, but the
          value 3 occurs twice: the answer is 2.'
    - worked_example: cf-797E
      why: 'The number of jumps p → p + a_p + k before leaving the array, for many starts and many steps
        k: small k are precomputed, large k walked.'
    - worked_example: cf-220B
      why: 'The values that occur exactly x times in a range: only a few values can occur at least as
        often as their own size, so each of them can be handled with prefix counts.'
    negative:
    - inline:
        input: a = [3, 1, 4, 1, 5]. The table for step 2 is built, and then a_3 is set to 0. What is the
          sum from position 0 with step 2?
        answer: '8'
        method_gives: '12'
        why: After the change the positions 0, 2, 4 hold 3, 0, 5 and the sum is 8. The table still holds
          the old value 4 at position 2 and gives 12. The tables are built once; with changes between
          the questions they would have to be rebuilt.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - problem: cses-1646
      why: The step is always 1, so a single array of prefix sums answers every question and no threshold
        is needed.
      correct_tool:
        topic: '1.2'
        card: range-sum
  lookalikes:
  - description: Sums of progressions on a fixed array, with a single known step
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: One step needs one table (or a prefix sum for step 1); the threshold is for many
      different steps in the same input.
  - description: Counting values by their number of occurrences in a range when the counts are small
    tool:
      topic: '5.4'
      card: mo-offline
    flipping_difference: Mo's algorithm maintains a count of counts for any condition on the counts; the
      threshold needs a bound on the number of qualifying values.
  complexity: O(n B + q n / B) for steps (about (n + q) √n), O(√n (n + q)) for large values; memory O(n
    B) or O(n).
problems:
- id: cf-220B
  role: worked_example
  summary: An array of n ≤ 10^5 numbers and m ≤ 10^5 questions (l, r); print how many numbers x occur
    exactly x times among a_l..a_r.
- id: cf-797E
  role: worked_example
  summary: 'n ≤ 10^5 numbers a_p and q ≤ 10^5 questions (p, k): start at p and repeat p → p + a_p + k
    until p > n; print the number of repetitions.'
- id: cf-1514D
  role: worked_example
  summary: 'An array of n ≤ 3·10^5 numbers and q ≤ 3·10^5 questions (l, r): the fewest subsequences into
    which a_l..a_r can be cut so that in each no value occurs more than ceil(len / 2) times.'
- id: cf-785E
  role: ladder
  card: sqrt-blocks
  rung: 1
  twist: 'Base case: sorted blocks, with a change that touches two blocks.'
  summary: A permutation of n ≤ 2·10^5 numbers and q ≤ 5·10^4 swaps of two positions; after each swap
    print the number of inversions. †
  hints:
  - Swapping the values at the positions l < r changes the number of inversions only for the pairs that
    involve one of these two positions and the elements between them.
  - Count how many elements between l and r are smaller (or larger) than each of the two swapped values;
    the change is a sum of these counts with a sign that depends on which of the two values is larger.
  - Keep every block of √n positions sorted. Count the elements below a bound in a whole block by binary
    search and in a partial block by looking at each position; after the swap fix the two sorted blocks.
- id: cf-342E
  role: ladder
  card: sqrt-blocks
  rung: 2
  twist: The structure is rebuilt every √m operations; in between the new items are handled by brute force.
  summary: 'A tree of n ≤ 10^5 vertices, where vertex 1 is red; m ≤ 10^5 operations: paint a vertex red,
    or print the distance from a vertex to the nearest red vertex. †'
  hints:
  - A search from all red vertices at once ([topic 4.1](../../phase-4/4-1-graph-traversal/)) gives the
    distance to the nearest red vertex for every vertex in O(n).
  - Do it again only after √m new vertices have been painted. In between, the nearest red vertex is either
    the old nearest or one of the at most √m new ones.
  - For a question compute the minimum of the stored distance and the tree distances to each new red vertex
    (lowest common ancestors, topic 4.6); rebuild the array of distances when the list of new vertices
    is full.
- id: cf-1619H
  role: ladder
  card: sqrt-blocks
  rung: 3
  twist: A block holds jump pointers and a change repairs the pointers behind it.
  summary: 'A permutation p of n ≤ 10^5 positions and q ≤ 10^5 operations: swap two values of p, or print
    where position i is after applying p exactly k times (k up to 10^9). †'
  hints:
  - Applying p k times from i follows a path of up to k steps; k is large, but the path is on a permutation.
  - 'Keep for each position the position after √n applications. A question jumps by √n many times and
    then makes single steps: about 2√n steps.'
  - A swap of two values changes the pointer of every position whose √n-step path passes through them;
    repair them by walking backwards √n steps along the inverse permutation from each of the two places.
- id: cf-86D
  role: ladder
  card: mo-offline
  rung: 1
  twist: 'Base case: an aggregate that changes by a computable amount at each step.'
  summary: 'An array of n ≤ 2·10^5 numbers up to 10^6 and t ≤ 2·10^5 questions (l, r): the sum over the
    values s of s times the square of the number of times s occurs in a_l..a_r. †'
  hints:
  - The answer for a range is not a combination of the answers of its halves, but one element entering
    the window changes it by a number you can compute.
  - If s occurs c times, taking one more in changes s c² into s (c + 1)², that is by s (2c + 1); taking
    one out changes it by minus s (2c − 1).
  - Sort the questions in Mo's order with block size about n / √t and use 64-bit numbers.
- id: ac-abc384_g
  role: ladder
  card: mo-offline
  rung: 2
  twist: Two pointers, one for each sequence; the repair of each step is a Fenwick query.
  summary: 'Two sequences A and B of N ≤ 10^5 numbers and K ≤ 10^4 questions (X, Y): the sum of |A_i −
    B_j| over i ≤ X and j ≤ Y.'
  hints:
  - Think of the pair (X, Y) as the ends of a window over two sequences. Moving X by one adds or removes
    the terms of one row; moving Y by one, one column.
  - Moving X to X + 1 adds the sum over j ≤ Y of |A_{X+1} − B_j|. Keep a Fenwick tree over the compressed
    values of B[1..Y] with counts and sums to read this in O(log N).
  - Order the questions as Mo does (block of X, then Y), keep a second tree for A[1..X] for the moves
    of Y, and the total is about N √K log N steps.
- id: cf-877F
  role: ladder
  card: mo-offline
  rung: 3
  twist: The window is over prefix values, and the repair needs a value that is looked up in advance.
  summary: 'n ≤ 10^5 books, each of type 1 (value +a_i) or type 2 (value −a_i), and a number k; q questions
    (l, r): the number of subsegments of l..r whose total value is exactly k. †'
  hints:
  - Take the prefix sums P of the signed values; a subsegment l..r has total P_r − P_{l−1}, so you count
    pairs of prefix indices with P_j − P_i = k.
  - Put the window over the prefix indices l − 1..r and keep the number of times each prefix value occurs
    in it.
  - Adding an index with value P adds the count of P − k (as a new right end) or P + k (as a new left
    end). Compress P, P − k and P + k first, so that each step is an array lookup.
- id: ac-abc405_g
  role: ladder
  card: mo-offline
  rung: 4
  twist: The structure that reads the answer is not an O(1) number but a bucketed array on the values.
  summary: 'An array of N ≤ 2.5·10^5 numbers and Q ≤ 2.5·10^5 questions (L, R, X): count the different
    sequences that can be made by arranging the elements smaller than X among A_L..A_R, modulo 998244353.'
  hints:
  - For the elements below X in the range, with counts c_v, the number of arrangements is (Σ c_v)! divided
    by the product of the c_v!.
  - Mo's algorithm keeps the counts c_v of the window. To read the product of the inverse factorials and
    the sum of counts for the values below X quickly, split the values into buckets of √N and keep a sum
    and a product per bucket.
  - 'An add or remove of one element is O(1) (it changes one count and one bucket); a question combines
    the whole buckets below X and the single values of the last bucket: O(√N).'
- id: cf-375D
  role: ladder
  card: mo-offline
  rung: 5
  twist: The window is over an Euler tour, and the answer is read from a count of counts.
  summary: 'A rooted tree of n ≤ 10^5 vertices with colours, and m ≤ 10^5 questions (v, k): the number
    of colours that appear at least k times among the vertices of the subtree of v. †'
  hints:
  - A subtree is a range of the entry order of a depth-first search ([topic 4.5](../../phase-4/4-5-trees/)),
    so the question is about a range of an array of colours.
  - Keep cnt[colour] and ge[j], the number of colours with count at least j. When a colour goes from c
    to c + 1, increase ge[c + 1]; when it goes down, decrease ge[c].
  - The answer is ge[k]. Order the questions as Mo does and use the entry order as the array.
- id: cf-1000F
  role: ladder
  card: mo-offline
  rung: 6
  twist: The answer is any item with a count of one; the repair keeps a set of such items in O(1).
  summary: 'An array of n ≤ 5·10^5 numbers and q ≤ 5·10^5 questions (l, r): print any value that occurs
    exactly once among a_l..a_r, or 0 if there is none. †'
  hints:
  - Keep cnt[v] in Mo's window. You need one value with cnt[v] = 1, and the set of such values changes
    by one item per step.
  - A set from the standard library is too slow for 10^8 steps. Keep a presence array over the values
    and, over it, a count for each bucket of √V values.
  - 'Adding or removing is O(1) (flip one entry and one bucket count). To read an answer find a non-empty
    bucket and then an entry in it: O(√V).'
- id: cf-1921F
  role: ladder
  card: threshold-split
  rung: 1
  twist: 'Base case: suffix sums for small steps and a weighted sum with the position in the progression.'
  summary: 'Several tests (Σ n ≤ 10^5); an array and questions (s, d, k): the sum of i · a_{s + (i−1)
    d} for i = 1..k. †'
  hints:
  - 'For a large step d the progression has at most n / d terms: just compute the sum.'
  - 'For a small step d keep two arrays of suffix sums along the step: the sum of a and the sum of a times
    the index of its position in the progression (a position p has index (p − s) / d + 1, so the weighted
    sum is a difference of two suffix values).'
  - 'The threshold is about √n; the tables for all small d cost n √n, so the memory is the limit: group
    the questions by d offline and reuse one table.'
- id: cf-1207F
  role: ladder
  card: threshold-split
  rung: 2
  twist: The updates must keep the small tables current, so each update is √N work.
  summary: 'An array of 500 000 zeros and q ≤ 5·10^5 operations: add y to a_x, or print the sum of all
    a_i with i mod x = y. †'
  hints:
  - 'A question with a large modulus x has at most N / x positions i = y, y + x, ...: sum them directly.'
  - For each small modulus x ≤ √N keep a table small[x][r], the sum of the a_i with i mod x = r.
  - 'An update at position p adds to small[x][p mod x] for every small x: √N steps. A question with a
    small x reads one entry.'
- id: cf-103D
  role: ladder
  card: threshold-split
  rung: 3
  twist: The same split, but the memory is kept small by answering the questions grouped by their step.
  summary: 'An array of n ≤ 3·10^5 weights and p ≤ 3·10^5 questions (a, b): the sum of w_a, w_{a+b}, w_{a+2b},
    ... up to n. †'
  hints:
  - 'A step of at least √n has at most √n terms: walk.'
  - For small steps the table of one step costs n, but tables for all small steps do not fit in memory.
  - Read all the questions first and sort them by step; for each different small step build the table
    once, answer all its questions, and reuse the array for the next step.
- id: cf-1806E
  role: ladder
  card: threshold-split
  rung: 4
  twist: A memo table on pairs of vertices, kept only on the levels where it is small.
  summary: 'A rooted tree of n ≤ 10^5 vertices with values a, and q ≤ 10^5 questions (x, y) of two vertices
    of the same depth: f(x, y) = a_x · a_y + f(parent of x, parent of y), with f of the roots = a_root
    · a_root. †'
  hints:
  - A question walks up both vertices at the same time to the root; the pair (x, y) at each level is determined.
  - Number the vertices of each depth, so that a pair of vertices of one depth is a pair of small numbers.
    A level with at most √n vertices has at most n pairs.
  - Memoise f only on these levels; there are at most √n levels with more than √n vertices, so a question
    walks at most √n steps through unmemoised levels. The total is O(n √n).
