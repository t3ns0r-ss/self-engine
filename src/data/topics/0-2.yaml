# Topic 0.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.2"
cards:
  - id: budget-from-constraints
    name: Choose the algorithm class from n
    decisive_property: Plugging the largest allowed input into the step count of your idea (nested loop bounds multiply) gives at most about 10^8 steps per second of time limit; if not, the constraint tells you which smaller class to aim for (for example O(√N) for N up to 10^12).
    from_theorem: Theorem 0.2.1
    how_to_test: Write the step count of the idea as a product of loop bounds, substitute the maximum values from the constraints, and compare with 10^8 times the time limit.
    weak_signals:
      - A small bound (n ≤ 100, n ≤ 5000) that allows a direct method
      - A huge bound (N ≤ 10^12, 10^18) that forbids looping up to N
      - "Pairs (a, b) with a fixed product: only one of them needs to be looped over, up to √N"
    kill_signals:
      - Every idea is already far inside the budget, so the question is correctness, not speed
    lookalikes:
      - description: The same question with n ≤ 100 instead of n ≤ 10^12
        needs: "budget-from-constraints (0.2): any direct method"
        flipping_difference: Only the bound changes; with the small bound the obvious loop is fine.
    complexity: Reading the constraints costs nothing; it decides which algorithm to write.
  - id: closed-form
    name: Formula instead of a loop
    decisive_property: The quantity added at each step follows an arithmetic progression or repeats with a short period, so the total over n steps is a formula (n(2a + (n − 1)d)/2, or full periods times one period's sum plus the leftover).
    from_theorem: Theorem 0.2.3
    how_to_test: Write out the first few terms of the loop. If consecutive terms differ by a constant, or the pattern repeats after p steps, a formula exists. Check the size of the product before dividing.
    weak_signals:
      - n up to 10^9 or 10^18 with a simple repeated process
      - Count of pairs, sum of 1..n, or a pattern that cycles
      - The answer only depends on n and a few numbers, not on an array
    kill_signals:
      - The terms depend on input data that has no pattern (then the loop is needed)
    lookalikes:
      - description: The same process with n ≤ 10^5
        needs: a direct loop (0.2 budget)
        flipping_difference: With small n, looping is within the budget and less error-prone.
    complexity: O(1) for a formula, O(p) for a period of length p.
  - id: amortised-total
    name: Bounded total work
    decisive_property: An inner loop moves a counter or index forward by at least one each iteration, the counter never moves back, and its range is 0..n, so the inner loop runs at most n times in total even though it is nested.
    from_theorem: Theorem 0.2.4
    how_to_test: Find what the inner loop advances. If that index is shared with the outer loop (the outer loop continues from where the inner one stopped), the total is linear.
    weak_signals:
      - Maximal blocks (runs) of equal or monotone elements
      - A while loop inside a for loop that skips ahead
      - "Counting substrings inside runs: a run of length L contributes L(L + 1)/2"
    kill_signals:
      - The inner loop restarts from the beginning (or moves back) for each outer iteration
    lookalikes:
      - description: For each position, scan forward to the end of the array
        needs: a quadratic loop (0.2 budget), only for small n
        flipping_difference: The inner scan restarts at every position, so the total is n²/2, not n.
    complexity: O(n) total for the nested loops.
  - id: harmonic-loops
    name: Loops over multiples
    decisive_property: For each i, the inner loop visits only multiples of i up to n (or values up to n / i), so the total is the sum of n / i, at most n(1 + ln n).
    from_theorem: Theorem 0.2.5
    how_to_test: "Check that the inner loop steps by i (j += i) or runs up to n / i. Then the total is about n ln n: fine for n up to about 10^7."
    weak_signals:
      - A property of every number up to n that depends on its divisors
      - Count pairs or triples with a product at most n
      - n up to 10^6 or 10^7
    kill_signals:
      - Only one number N is involved (then divisors up to √N are enough)
    lookalikes:
      - description: Count the divisors of one number N
        needs: "budget-from-constraints (0.2): divisors up to √N"
        flipping_difference: One number needs √N steps; all numbers up to n at once need the harmonic loop.
    complexity: "O(n log n): about 1.6·10^8 steps for n = 10^7."
problems:
  - id: ac-abc167_b
    role: ladder
    card: closed-form
    rung: 1
    twist: Base case of the card
    summary: A cards with 1, B with 0, C with −1 (A + B + C up to 2·10^9); the largest sum of K chosen cards.
    hints:
      - Which cards would you pick first? Can you count instead of picking one by one?
      - "Take ones first, then zeros, then minus ones: the answer depends only on how many of each you take, not on a loop of K steps."
      - Answer min(K, A) − max(0, K − A − B), in long long.
  - id: ac-abc405_c
    role: ladder
    card: closed-form
    rung: 2
    twist: The sum over all pairs i < j becomes a formula in the total sum and the sum of squares.
    summary: Sum of A_i · A_j over all pairs i < j (N ≤ 3·10^5, A_i ≤ 10^4).
    hints:
      - "All pairs is about 4.5·10^10 for N = 3·10^5: too many. What is (A_1 + … + A_N)²?"
      - It is the sum of the squares plus twice the sum over pairs i < j.
      - Answer (S² − sum of squares) / 2 with S the total, all in long long (S² ≤ 9·10^18).
  - id: ac-abc099_b
    role: ladder
    card: closed-form
    rung: 3
    twist: The heights are triangular numbers 1 + 2 + … + k, given implicitly.
    summary: Towers of heights 1, 1+2, …, 1+…+999 stand 1 m apart; two adjacent towers show a and b metres above the snow; find the snow depth.
    hints:
      - Two adjacent towers differ in height by how much?
      - "The k-th and (k+1)-th towers differ by k + 1, and the visible parts differ by the same amount: k + 1 = b − a."
      - The taller tower has height 1 + 2 + … + (b − a) = (b − a)(b − a + 1)/2; the depth is that minus b.
  - id: ac-abc103_c
    role: ladder
    card: closed-form
    rung: 4
    twist: The maximum of a function over all m is found by a formula, without trying any m.
    summary: For N numbers a_i (N ≤ 3000, a_i ≤ 10^5), the largest possible value of (m mod a_1) + … + (m mod a_N) over non-negative m.
    hints:
      - What is the largest possible value of a single term m mod a_i?
      - a_i − 1, reached when m + 1 is a multiple of a_i. Is there one m that is one less than a multiple of every a_i?
      - m = a_1 · a_2 · … · a_N − 1 works (it is never computed), so the answer is the sum of (a_i − 1).
  - id: ac-abc130_c
    role: ladder
    card: closed-form
    rung: 5
    twist: "A geometric answer: any line through the centre halves the area."
    summary: A rectangle W by H (up to 10^9) and a point (x, y) in it; cut by a line through the point to make the smaller part as large as possible; also say whether several cuts achieve it.
    hints:
      - What is the largest possible area of the smaller part, for any cut?
      - Half of W·H, and a line through the point and the rectangle's centre achieves it.
      - Print W·H / 2 as a real number (W·H fits a long long; print its half with one decimal place), then 1 if (x, y) is exactly the centre (2x = W and 2y = H), else 0.
  - id: cses-1072
    role: ladder
    card: closed-form
    rung: 6
    twist: "Count pairs with a formula: all pairs minus attacking pairs, for every board size."
    summary: "For every k from 1 to n (n ≤ 10^4): the number of ways to place two knights on a k by k board so they do not attack each other."
    hints:
      - How many ways are there to place two knights with no restriction?
      - k²(k² − 1)/2. Attacking pairs fit in a 2 by 3 or 3 by 2 box, each box holding 2 attacking pairs.
      - Answer k²(k² − 1)/2 − 4(k − 1)(k − 2), in long long.
  - id: cf-1475B
    role: ladder
    card: closed-form
    rung: 7
    twist: Decide whether n is a sum of copies of two consecutive numbers, without trying all splits.
    summary: "For each of t tests: can n (n ≤ 10^6) be written as 2020a + 2021b with non-negative a and b?"
    hints:
      - Write n = 2020(a + b) + b. What must b be modulo 2020?
      - So b leaves remainder n mod 2020, and a + b = (n − b) / 2020. The smallest choice b = n mod 2020 is possible exactly when it is at most a + b = n / 2020.
      - Answer YES when n mod 2020 ≤ n / 2020.
  - id: cf-1373A
    role: ladder
    card: closed-form
    rung: 8
    twist: Compare two price formulas instead of trying every amount.
    summary: "For each of t tests: shop 1 sells donuts at a each, shop 2 sells boxes of b for c; find an amount that is cheaper in shop 1 and one that is cheaper in shop 2, or −1."
    hints:
      - For shop 1 to be strictly cheaper, which amount is the best candidate?
      - "Buying 1 donut: shop 1 costs a, shop 2 costs c. For shop 2, buying exactly b donuts: shop 1 costs a·b, shop 2 costs c."
      - Print 1 if a < c else −1; print b if c < a·b (in long long) else −1.
  - id: cf-1328B
    role: ladder
    card: closed-form
    rung: 9
    twist: "Locate the k-th string by triangular numbers: blocks of 1, 2, 3, … strings."
    summary: "For each of t tests: the k-th string, in lexicographic order, of length n with n − 2 letters a and two letters b."
    hints:
      - Group the strings by the position of the first (leftmost) b. How many strings are in each group?
      - If the first b is the i-th letter from the right, the second b has i − 1 places, so groups have 1, 2, 3, … strings.
      - Find the smallest i with 1 + 2 + … + i ≥ k, then place the second b according to the remainder; loop i (at most about 6·10^4 steps) or solve the triangular inequality.
  - id: ac-abc330_c
    role: ladder
    card: budget-from-constraints
    rung: 1
    twist: Base case of the card
    summary: Smallest |x² + y² − D| over non-negative integers x, y (D ≤ 2·10^12).
    hints:
      - How large can x usefully be?
      - Only x up to about √D ≈ 1.5·10^6 matters; for each x, the best y is next to √(D − x²).
      - Loop x while x·x ≤ D (plus one more); compute y as the integer square root of D − x² (Theorem 0.1.5) and try y and y + 1.
  - id: ac-abc227_c
    role: ladder
    card: budget-from-constraints
    rung: 2
    twist: "Three nested loops whose bounds shrink: A ≤ N^(1/3), B ≤ √(N / A)."
    summary: Count triples A ≤ B ≤ C of positive integers with A·B·C ≤ N (N ≤ 10^11).
    hints:
      - Since A ≤ B ≤ C, how big can A be? And B for a fixed A?
      - A³ ≤ N and A·B² ≤ N. For fixed A and B, C runs from B to N / (A·B).
      - Loop A and B within those bounds and add N / (A·B) − B + 1; the total is about N^(2/3) ≈ 2·10^7 steps.
  - id: ac-abc057_c
    role: ladder
    card: budget-from-constraints
    rung: 3
    twist: Only factor pairs matter, so loop to √N even though N is 10^10.
    summary: Over all ways to write N = A·B (N ≤ 10^10), the smallest possible number of digits of the larger factor.
    hints:
      - Which pairs (A, B) need to be tried?
      - "Only divisors A ≤ √N, with B = N / A (Theorem 0.2.2): at most 10^5 values."
      - For each divisor A ≤ √N, count the digits of N / A; print the smallest count.
  - id: ac-abc179_c
    role: ladder
    card: harmonic-loops
    rung: 1
    twist: Base case of the card
    summary: Count triples (A, B, C) of positive integers with A·B + C = N (N ≤ 10^6).
    hints:
      - C is determined by A and B. Which pairs (A, B) are allowed?
      - Those with A·B < N, that is A·B ≤ N − 1.
      - "For each A, there are (N − 1) / A choices of B; add them up: about N ln N steps (Theorem 0.2.5)."
  - id: ac-abc292_c
    role: ladder
    card: harmonic-loops
    rung: 2
    twist: Count products for every value up to N first, then combine the counts.
    summary: Count quadruples (A, B, C, D) of positive integers with A·B + C·D = N (N ≤ 2·10^5).
    hints:
      - For each X, let f(X) be the number of pairs with A·B = X. How does the answer use f?
      - Answer = sum over X from 1 to N − 1 of f(X) · f(N − X).
      - Compute f for all X by looping over multiples (f(X) is the number of divisors of X); then one more loop. Use long long.
  - id: ac-abc249_d
    role: ladder
    card: harmonic-loops
    rung: 3
    twist: "Count by value: for each A_j, loop over its multiples among the values."
    summary: Count triples (i, j, k) of indices (N ≤ 2·10^5, values ≤ 2·10^5) with A_i / A_j = A_k.
    hints:
      - The condition is A_i = A_j · A_k. Can you count by values instead of positions?
      - Let cnt[v] be how many times v occurs. For each pair of values (q, r) with q·r ≤ 2·10^5, add cnt[q]·cnt[r]·cnt[q·r].
      - "Loop q from 1 to M and r over values with q·r ≤ M: about M ln M steps for M = 2·10^5. Use long long."
  - id: cses-1069
    role: ladder
    card: amortised-total
    rung: 1
    twist: Base case of the card
    summary: Length of the longest block of one repeated letter in a DNA string (n ≤ 10^6).
    hints:
      - If you start a block at i and extend it, where should the next block start?
      - "Right after this block ends: the inner index never moves back, so the total work is O(n) (Theorem 0.2.4)."
      - Scan maximal blocks with i and j; keep the largest j − i.
  - id: lc-count-binary-substrings
    role: ladder
    card: amortised-total
    rung: 2
    twist: "Combine neighbouring blocks: each pair of adjacent blocks contributes the smaller length."
    summary: Count substrings of a 0/1 string (length ≤ 10^5) with equally many 0s and 1s, all 0s together and all 1s together.
    hints:
      - Such a substring sits across the boundary of two adjacent blocks. How many fit across one boundary?
      - min(length of the left block, length of the right block).
      - Compute block lengths in one pass, then add min of each adjacent pair.
  - id: lc-number-of-zero-filled-subarrays
    role: ladder
    card: amortised-total
    rung: 3
    twist: "Count, not just measure: each block of zeros of length L contributes L(L + 1)/2."
    summary: Count the subarrays made only of zeros (array length ≤ 10^5).
    hints:
      - How many subarrays lie inside one block of L zeros?
      - L(L + 1)/2 (Theorem 0.2.3).
      - Scan maximal blocks of zeros and add L(L + 1)/2 for each, in long long.
  - id: ac-abc369_c
    role: ladder
    card: amortised-total
    rung: 4
    twist: Blocks are defined by a property of adjacent pairs (equal differences), not by equal values.
    summary: Count pairs (l, r) such that A_l..A_r is an arithmetic progression (N ≤ 2·10^5).
    hints:
      - An arithmetic progression has all adjacent differences equal. Look at the sequence of differences.
      - Group maximal blocks of equal differences; a block of L equal differences covers L + 1 elements.
      - Each block of L equal differences gives L(L + 1)/2 progressions of length at least 2; add N for length 1. Use long long.
  - id: lc-longest-turbulent-subarray
    role: ladder
    card: amortised-total
    rung: 5
    twist: The block condition alternates (up, down, up, …), and an equal pair breaks every block.
    summary: Length of the longest subarray (length ≤ 4·10^4) whose adjacent comparisons alternate between < and >.
    hints:
      - When does a turbulent block end?
      - When two adjacent comparisons have the same sign, or two elements are equal.
      - "Scan left to right keeping the current block length: extend it when the sign flips, restart at 2 (or 1 for equal elements) otherwise."
