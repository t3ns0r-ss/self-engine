# Patterns for topic 5.4 (Square-root decomposition). Cards of the lesson: sqrt-blocks, threshold-split and rebuild-batches; no-blocks holds the drill partners that a Fenwick sweep answers.
topic: "5.4"
patterns:
  - id: blocks
    name: Blocks of size √n
    description: Split the array into blocks of about √n with a summary per block; updates touch one block, queries touch O(√n) blocks and items.
    precondition: A block's summary can be rebuilt in O(√n) and queried in O(1).
  - id: rebuild-batches
    name: Rebuild every sqrt(q) changes
    description: The structure is rebuilt once per batch of about sqrt(q) changes, and a question looks at the table of the last rebuild together with the few changes made since.
    precondition: A rebuild costs about O(n), a question can combine the table with one change at a time (a minimum, a count), and changes are only added, never taken back.
  - id: threshold-split
    name: Small versus large parameter
    description: Handle small parameters (below √n) with a table and large ones directly, because there are few large ones or each has few steps.
    precondition: Work for a parameter k is about n / k when large and fits in an O(n·√n) table when small.
  - id: no-blocks
    name: Looks like a block problem, but a Fenwick sweep is enough
    description: Offline questions about ranges or sets of points that tempt a split into blocks, but a sort by one end and a Fenwick tree over the other end answers them in O((n + q) log n).
    precondition: All questions are known first, and each answer is a sum of prefix counts.
