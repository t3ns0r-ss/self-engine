id: '5.1'
uses:
- topic: '0.1'
  what: 'Lambdas and function values: the operation is passed to the table as a function'
- topic: '0.2'
  what: 'Complexity budgets: the n·q estimates and the closed formula of a look-alike'
- topic: '0.3'
  what: 'Implementation: the one-scan answer of a look-alike'
- topic: '0.4'
  what: 'GCD and Euclid''s algorithm: the range GCD and the halving of the value'
- topic: '0.5'
  what: 'Brute force: the reference solution of every check'
- topic: '0.6'
  what: 'Standard containers: the heap and the map of problems in the ladder and reviews'
- topic: '1.1'
  what: 'Sorting: compressing coordinates in a drill problem'
- topic: '1.2'
  what: 'Prefix sums: the tool for sums, where a minimum cannot be undone by subtracting'
- topic: '1.3'
  what: 'Two pointers: the contrast for sums of positive values'
- topic: '1.4'
  what: 'Binary search: the search along a growing range'
- topic: '1.5'
  what: 'Greedy: the sweep that destroys the long windows in the checkpoint'
- topic: '1.6'
  what: 'Monotonic stack and deque: the tools for sliding windows and for sums of minimums'
- topic: '1.7'
  what: 'Bit operations: AND and OR as operations of the table'
- topic: '2.1'
  what: 'Primes and divisors: the halving of a GCD, and GCD questions of the problems'
- topic: '3.2'
  what: 'Dynamic programming: the right-to-left sum of a review problem'
- topic: '4.4'
  what: 'Union of components: the checkpoint problem that merges small into large'
theorems:
- id: 5.1.1
  title: The table of blocks
  plain_words: The minimum of a block of 8 is the smaller of the minimums of its two halves of 4. So each
    row of the table is made from the row before it, with one comparison per entry, and there are only
    about $\log_2 n$ rows.
  code: 5.1/thm-1
- id: 5.1.2
  title: Two blocks cover any range
  plain_words: Take the biggest power of two that fits in the range. One block of that length starts at
    the left end and another ends at the right end. Together they cover the range, and if they overlap,
    no harm is done as long as counting a value twice changes nothing.
  code: 5.1/thm-2
- id: 5.1.3
  title: Growing a range moves the answer one way
  plain_words: If you keep adding days to the right end of the range, the lowest temperature can only
    stay or go down; the GCD can only stay or shrink; the AND can only lose bits. So "has the minimum
    already dropped to $x$ or below?" starts as "no" and, once it turns "yes", stays "yes". That is exactly
    what binary search needs.
  code: 5.1/thm-3
- id: 5.1.4
  title: Only a few changes
  plain_words: 'Every time the GCD changes it becomes a proper divisor, which is at most half as big.
    Starting at most $A \approx 10^9$, it can be halved at most about 30 times, so it has at most about
    30 different values along any row. The same count works for the bits of an AND or an OR: each change
    loses (or gains) at least one bit.'
  code: 5.1/thm-4
cards:
- id: idempotent-range-query
  name: Range minimum, maximum, GCD, AND or OR on a fixed array (sparse table)
  from_theorem: 5.1.2
  decisive_property: 'The array does not change between the questions, and the answer for a range is a
    minimum, a maximum, a GCD, an AND or an OR (or the position of a smallest or largest value): a combination
    that stays the same when one value is counted twice.'
  how_to_test: 'Check two things. (1) No question changes the array. (2) Test the combination on one value:
    min(5, 5) = 5 and gcd(6, 6) = 6 give the value back, while 5 + 5 and 5 XOR 5 do not. If both hold,
    build the table once and answer each range with two blocks.'
  constraint_shapes:
  - 'n = q = 2·10^5: scanning each range costs up to n·q = 4·10^10 steps (about 400 seconds at 10^8 per
    second), while the table has 18 · 2·10^5 = 3.6·10^6 entries and a question costs 2 lookups'
  - 'n = 10^6: the table has 20 · 10^6 ints, about 80 MB, so the memory limit must be checked; for n =
    10^7 it would be 24 · 10^7 ints, about 1 GB, and the table does not fit'
  weak_signals:
  - form: Asks for the lowest or highest value, or its position, between two given positions, for many
      pairs of positions
    shape: n, q up to 2·10^5, and no operation in the statement changes the array
  - form: Inside a loop over positions (or over a binary search), needs the minimum, maximum or GCD of
      a range of the same array again and again
    shape: n up to 2·10^5 and an outer loop of n or n log n steps, so each inner range query must cost
      O(1)
  - form: Asks whether a range is good, where good compares its maximum with its minimum, or compares
      its GCD or AND with a number
    shape: n up to 2·10^5 and ranges given in the input or tried by a search
  kill_signals:
  - 'A question changes a value before a later question: for a = [4, 2, 5] the table says the minimum
    of [0, 2] is 2; after a[1] is set to 9 the true minimum is 4, but the table still says 2'
  - 'The combination is a sum, a count, an XOR or a product: for a = [1, 2, 3] two blocks of length 2
    give (1 + 2) + (2 + 3) = 8 instead of 6'
  - 'The questions are all windows of one length k and n is about 10^7: the table would hold 24 · 10^7
    numbers (about 1 GB), while the deque of topic 1.6 needs only O(n) memory'
  in_action:
    statement: 'A hiker wrote down the altitude at n checkpoints. There are q questions (l, r): what is
      the lowest altitude between checkpoints l and r?'
    constraints: n, q ≤ 2·10^5, altitudes up to 10^9, no altitude changes.
    budget: 'Scanning every range: up to n · q = 4·10^10 steps, about 400 seconds. Need O(1) or O(log
      n) per question.'
    candidates:
    - tool: Scan the range for every question (topic 0.5)
      verdict: rejected
      because: 4·10^10 steps in the worst case.
    - tool: Prefix minimums (topic 1.2)
      verdict: rejected
      because: They answer only ranges that start at checkpoint 1; a minimum cannot be undone by subtracting.
    - tool: Sparse table (this topic)
      verdict: chosen
      because: The array is fixed and the minimum gives the same value when counted twice (Theorem 5.1.2).
    property_check: Nothing changes between questions. min(x, x) = x, so two overlapping blocks of length
      2^k that cover the range give the right minimum. The property holds.
    decision: Sparse table with 18 levels; each question is two lookups and one min.
  examples:
    positive:
    - inline:
        input: a = [5, 2, 4, 7, 1, 3, 6]. What is the smallest value in positions 1 to 5?
        answer: '1'
        why: 'Nothing changes and the minimum ignores repeats. The length is 5, so k = 2 and the blocks
          are [1, 4] and [2, 5]: min(1, 1) = 1, matching a scan.'
    - inline:
        input: a = [12, 18, 8, 24, 6]. What is the GCD of positions 0 to 2?
        answer: '2'
        why: gcd(x, x) = x, so the blocks [0, 1] and [1, 2], which overlap at position 1, give gcd(6,
          2) = 2, matching gcd(12, 18, 8).
    - worked_example: cses-1647
      why: 'A fixed array of up to 2·10^5 numbers and up to 2·10^5 range minimum questions: one table,
        two lookups per question.'
    negative:
    - inline:
        input: a = [1, 2, 3]. What is the sum of positions 0 to 2, if answered like the minimum with two
          blocks of length 2?
        answer: '6'
        method_gives: '8'
        why: 'The blocks [0, 1] and [1, 2] give 3 + 5 = 8: the middle element is added twice. A sum is
          not idempotent, so overlapping blocks are not allowed.'
      correct_tool:
        topic: '1.2'
        card: range-sum
    - problem: cses-3221
      why: All questions are windows of the same length k and n is up to 10^7; a table would need about
        1 GB, while a deque keeps the minimum of the sliding window in O(n).
      correct_tool:
        topic: '1.6'
        card: window-deque
  lookalikes:
  - description: Sums of ranges on a fixed array
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: A sum is not idempotent but can be undone by subtracting, so two prefix sums
      answer it with no table.
  - description: The minimum of every window of one fixed length
    tool:
      topic: '1.6'
      card: window-deque
    flipping_difference: All ranges have the same length and move right one step at a time, so a deque
      answers all of them in O(n) with no n log n table.
  complexity: O(n log n) to build, O(1) per question.
- id: monotone-range-search
  name: Searching along a growing range (first r where the aggregate passes a bound)
  from_theorem: 5.1.3
  decisive_property: For a fixed left end l, the aggregate of a[l..r] (min, GCD or AND, which only go
    down; max or OR, which only go up) moves in one direction as r grows, and the question asks for the
    first or last r where it passes a bound.
  how_to_test: Take one l and write the aggregate for r = l, l + 1, l + 2, ... If it can only go down
    (or only go up), then "has it passed x yet?" changes from no to yes at most once, so binary search
    on r is valid, with one table query per step.
  constraint_shapes:
  - 'n = 2·10^5 left ends with a scan to the right for each: n²/2 = 2·10^10 steps; one binary search per
    left end is 2·10^5 · 18 = 3.6·10^6 table queries'
  - 'q = 2·10^5 questions (l, x), each asking how far right the aggregate stays above x: scanning is up
    to 4·10^10 steps, a search is about 18 queries per question'
  weak_signals:
  - form: Asks, for a start l and a number x, for the farthest or nearest position where the minimum,
      AND, GCD, maximum or OR of the range passes x
    shape: n, q up to 2·10^5, array fixed
  - form: Asks for the first position to the right of p whose value is greater than something that depends
      on the query (such as the height of another building)
    shape: n, q up to 5·10^4 to 2·10^5, so each question needs about O(log n)
  - form: Asks, for every position, for the shortest range starting there that reaches a goal (the largest
      OR, an AND below a number)
    shape: n up to 10^5 and a range length up to n
  kill_signals:
  - 'The aggregate is a sum with negative numbers or an XOR: for a = [5, −4, 1] the sums are 5, 1, 2,
    so "sum ≤ 1" is false, true, false and binary search can miss the answer'
  - 'The bound depends on both ends in a way that is not monotone in r (for example "the range is a palindrome"):
    no search over r works'
  in_action:
    statement: n sensors stand in a row with strengths a_i. For each of q questions (l, x), find the first
      sensor at position l or to the right whose strength is below x; if there is none, print −1.
    constraints: n, q ≤ 2·10^5, strengths up to 10^9, the strengths do not change.
    budget: 'Scanning from l: up to n · q = 4·10^10 steps. Need about O(log n) per question.'
    candidates:
    - tool: Scan to the right for every question (topic 0.5)
      verdict: rejected
      because: 4·10^10 steps in the worst case.
    - tool: Binary search on the array itself (topic 1.4)
      verdict: rejected
      because: The array is not sorted, so single values do not have the "false then true" shape.
    - tool: Binary search on r with range minimum queries (this topic)
      verdict: chosen
      because: The minimum of a[l..r] only goes down as r grows (Theorem 5.1.3), and each test is an O(1)
        table query.
    property_check: For fixed l, "min(a[l..r]) < x" is false and then true. The first position with a
      value below x is the first r where it turns true. The property holds.
    decision: Build the min table once; for each question binary search the first r with min(a[l..r])
      < x, in about 18 queries.
  examples:
    positive:
    - inline:
        input: a = [6, 9, 4, 3, 8, 1], l = 0. What is the first r with min(a[0..r]) ≤ 3?
        answer: '3'
        why: The prefix minimums are 6, 6, 4, 3, 3, 1, which never go up, so "≤ 3" turns true once. The
          search finds r = 3, matching a scan.
    - inline:
        input: a = [1, 2, 4, 8], l = 0. What is the first r with OR(a[0..r]) ≥ 7?
        answer: '2'
        why: 'OR only gains bits, so its value never goes down: 1, 3, 7, 15. "≥ 7" turns true once, at
          r = 2.'
    - worked_example: cf-1878E
      why: 'For each question (l, k) the farthest r with AND ≥ k: the AND only loses bits as r grows,
        so binary search on r works.'
    negative:
    - inline:
        input: a = [3, 1, 2, 5], l = 0. What is the first r with XOR(a[0..r]) ≥ 3?
        answer: '0'
        method_gives: '3'
        why: 'The XORs of the prefixes are 3, 2, 0, 5: true, false, false, true. Binary search tests r
          = 2 (false) and goes right, so it returns 3, but r = 0 already works. XOR goes up and down.'
      correct_tool:
        topic: '1.7'
        card: prefix-xor
    - problem: lc-subarray-sum-equals-k
      why: The values may be negative, so the running sum goes up and down and "sum equals k" is not monotone
        in r; prefix sums with a lookup count the ranges.
      correct_tool:
        topic: '1.2'
        card: prefix-count-lookup
  lookalikes:
  - description: The smallest value that makes a yes/no test true, where the test is a feasibility check
    tool:
      topic: '1.4'
      card: answer-search
    flipping_difference: There the search is over the answer value and each test runs a greedy check;
      here the search is over the right end r and each test is a table query.
  - description: The longest range ending at r (or starting at l) whose sum or count stays under a bound,
      with all values positive
    tool:
      topic: '1.3'
      card: shrinkable-window
    flipping_difference: With positive values two pointers also move l and need no table; the search is
      for an operation such as AND, GCD or min that two pointers cannot update when l moves.
  complexity: O(log n) table queries per search, each O(1) after the O(n log n) build.
- id: few-changes-count
  name: Few different values over all starts (counting by GCD, AND or OR)
  from_theorem: 5.1.4
  decisive_property: The question is about all subarrays (or all left ends) and depends on the GCD, AND
    or OR of each subarray; for a fixed left end that value changes only about log(max value) times as
    the right end grows, so each left end has a few stretches of equal value.
  how_to_test: Take one l and write the aggregate for growing r. For GCD each change at least halves the
    value; for AND and OR each change loses or gains a bit. With values up to 10^9 that is at most 30
    stretches per l. A minimum, maximum, sum or XOR has no such bound.
  constraint_shapes:
  - 'n = 2·10^5: all pairs (l, r) are n²/2 = 2·10^10; with at most 30 stretches per l and a search of
    about 18 queries to find the end of each, the work is at most 2·10^5 · 30 · 18 ≈ 10^8, and usually
    far less'
  - Values up to 10^6 give at most 20 stretches for the GCD (2^20 > 10^6), so about 2·10^5 · 20 · 18 =
    7·10^7 steps
  weak_signals:
  - form: Asks for the sum, the count or the maximum, over all subarrays, of the GCD, AND or OR of the
      subarray
    shape: n up to 2·10^5, so n² pairs are far too many
  - form: Asks for the number of subarrays whose GCD, AND or OR equals (or is at least) a given number
    shape: n up to 10^5 or 2·10^5, values up to 10^9
  - form: Asks for the subarray whose AND or GCD is closest to a target
    shape: n up to 10^5, values up to 10^6
  kill_signals:
  - 'The value of a subarray is its minimum or maximum: a decreasing array 5, 4, 3, 2, 1 has 5 different
    minimums from l = 0, so there is no log n bound'
  - 'The value is a sum or an XOR: for a = [1, 2, 1, 2, 1, 2, 1, 2] the XOR of a[0..r] changes at every
    step (1, 3, 2, 0, 1, 3, 2, 0), giving 8 stretches although the values are below 4'
  in_action:
    statement: Given n numbers, find the sum of gcd(a[l..r]) over all ranges l ≤ r.
    constraints: n ≤ 2·10^5, a_i ≤ 10^6.
    budget: 'All ranges: n²/2 = 2·10^10 pairs. Need about O(n log A log n) = 2·10^5 · 20 · 18 ≈ 7·10^7.'
    candidates:
    - tool: Compute the gcd for every pair (l, r) (topic 0.5)
      verdict: rejected
      because: 2·10^10 pairs.
    - tool: Per-bit contribution (topic 1.7)
      verdict: rejected
      because: The gcd is not a bitwise operation, so bits cannot be counted separately.
    - tool: Stretches of equal gcd with a sparse table (this topic)
      verdict: chosen
      because: For each l the gcd takes at most 20 values (Theorem 5.1.4), each stretch is found by one
        search.
    property_check: For fixed l, the gcd of a[l..r] divides the one before, so it at least halves at each
      change; with a_i ≤ 10^6 there are at most 20 stretches. The property holds.
    decision: For each l list the stretches; add value × length of each; use 64-bit numbers.
  examples:
    positive:
    - inline:
        input: a = [12, 18, 8, 24, 6]. How many different values does gcd(a[0..r]) take as r grows?
        answer: '3'
        why: The values are 12, 6, 2, 2, 2, so three stretches. Each change at least halves the value
          (12 → 6 → 2).
    - inline:
        input: a = [6, 4, 2, 8]. What is the sum of gcd(a[l..r]) over all 10 ranges?
        answer: '32'
        why: The singles give 6 + 4 + 2 + 8 = 20 and the six longer ranges all have gcd 2, giving 12.
          Listing the stretches for every l and adding value × length gives the same 32.
    - worked_example: lc-find-a-value-of-a-mysterious-function-closest-to-target
      why: The AND of a[l..r] has at most 20 different values for each l, so the closest to the target
        is found among the few stretches.
    negative:
    - inline:
        input: a = [1, 2, 1, 2, 1, 2, 1, 2]. How many stretches does the XOR of a[0..r] have?
        answer: '8'
        method_gives: '2'
        why: 'The log bound for values up to 2 promises at most 1 + log2 2 = 2 stretches. But the XORs
          are 1, 3, 2, 0, 1, 3, 2, 0: all 8 are separate stretches. XOR does not move in one direction.'
      correct_tool:
        topic: '1.7'
        card: prefix-xor
    - problem: lc-sum-of-subarray-minimums
      why: The minimum of a[l..r] can change up to n times for one l, so there is no log bound; each element
        decides the ranges where it is the minimum, which a stack finds in O(n).
      correct_tool:
        topic: '1.6'
        card: element-span
  lookalikes:
  - description: The sum of the minimums of all subarrays
    tool:
      topic: '1.6'
      card: element-span
    flipping_difference: The minimum has no log bound on its changes, so the stretches could be as many
      as n; counting where each element is the minimum with a stack avoids stretches altogether.
  - description: Counting subarrays whose sum, modulo a number, has a given value
    tool:
      topic: '1.2'
      card: prefix-count-lookup
    flipping_difference: A sum can be undone by subtracting, so a table of counts of prefix values answers
      it; GCD, AND and OR cannot be undone, which is why the stretches are needed.
  complexity: 'O(n log A log n): at most log A stretches per start, one search of O(log n) table queries
    each.'
problems:
- id: cses-1647
  role: worked_example
  summary: An array of n ≤ 2·10^5 numbers and q ≤ 2·10^5 questions (a, b); print the smallest number in
    positions a to b for each question.
- id: cf-1878E
  role: worked_example
  summary: 'Several arrays (total length ≤ 2·10^5), each with questions (l, k): the largest r ≥ l such
    that the bitwise AND of a_l..a_r is at least k, or −1 if a_l < k.'
- id: lc-find-a-value-of-a-mysterious-function-closest-to-target
  role: worked_example
  summary: An array of up to 10^5 numbers up to 10^6; for a range the function is the bitwise AND of its
    elements; find the smallest |AND − target| over all ranges.
- id: cf-2050F
  role: ladder
  card: idempotent-range-query
  rung: 1
  twist: 'Base case of the card with the GCD: the answer for a range is a GCD over a range of adjacent
    differences.'
  summary: 'An array of n ≤ 2·10^5 numbers and q queries (l, r): the largest m such that all of a_l..a_r
    have the same remainder modulo m (0 if all are equal).'
  hints:
  - When do two numbers have the same remainder modulo m? Look at their difference.
  - All of a_l..a_r agree modulo m exactly when m divides every difference of neighbours in the range,
    so the answer is the GCD of these differences.
  - Build the array of absolute differences and a GCD table over it; the answer for [l, r] is the query
    on [l, r − 1], and 0 when l = r.
- id: cf-1709D
  role: ladder
  card: idempotent-range-query
  rung: 2
  twist: A range maximum compared with a quantity computed per query.
  summary: A grid with up to 10^9 rows and m ≤ 2·10^5 columns where the top a_i cells of column i are
    blocked; for q ≤ 2·10^5 queries, can a robot that moves exactly k cells at a time in one of four directions
    get from one given cell to another?
  hints:
  - First, which differences of rows and columns make the target reachable at all?
  - Climb as high as possible in steps of k from the start row; the robot can cross the columns between
    the two only if their blocked heights are below that row.
  - 'You need the largest blocked height over a range of columns: a maximum table gives it in O(1).'
- id: cf-1548B
  role: ladder
  card: idempotent-range-query
  rung: 3
  twist: The longest range with a GCD condition instead of single queries.
  summary: n ≤ 2·10^5 integers up to 10^18; find the longest range in which all numbers leave the same
    remainder for some modulus m ≥ 2.
  hints:
  - 'As in the first rung: which condition on the differences of neighbours means "same remainder for
    some m ≥ 2"?'
  - The GCD of the differences of the range must not be 1 (a GCD of 0 means all values are equal).
  - The set of good ranges shrinks when a range gets smaller. Move two pointers, or binary search the
    length, with a GCD table to test a range in O(1); answer the longest good range of differences plus
    1.
- id: cf-1696D
  role: ladder
  card: idempotent-range-query
  rung: 4
  twist: The table returns the position of the extreme value, not the value.
  summary: A permutation of n ≤ 2.5·10^5 numbers; i < j are joined if a_i and a_j are the smallest and
    the largest of a_i..a_j (in either order); find the length of the shortest path from 1 to n.
  hints:
  - Which pairs (i, j) are joined? Check the condition on tiny examples.
  - From a position you want to go as far as possible towards n; where is the largest or smallest value
    of the stretch you can still use?
  - 'You need positions of the maximum and the minimum of a range in O(1): a table of positions; the stretch
    ends can be found with a stack.'
- id: cf-514D
  role: ladder
  card: idempotent-range-query
  rung: 5
  twist: 'Several kinds at once: a table for each kind inside two pointers.'
  summary: n ≤ 10^5 droids with m ≤ 5 kinds of parts; destroying a row of consecutive droids costs, for
    every kind, the largest number of parts of that kind in one droid of the row; find the longest row
    with total cost at most k ≤ 10^9 and the cost per kind.
  hints:
  - What is the cost of a row of droids? Which operation over the row appears for each kind?
  - The cost only grows when the row grows, so two pointers can find the longest row.
  - Keep one maximum table per kind and add the m maximums to get the cost of the current row in O(m).
- id: cf-359D
  role: ladder
  card: idempotent-range-query
  rung: 6
  twist: Two tables (GCD and minimum) and a search over the length.
  summary: n ≤ 3·10^5 positive numbers; find the longest ranges that contain an element dividing all other
    elements in the range; print how many such longest ranges there are and their left ends.
  hints:
  - When does a range contain an element that divides all the others?
  - It happens exactly when the GCD of the range equals the minimum of the range.
  - 'If a range of length L is good, so is a smaller one containing the same element: binary search the
    length and test every range of that length with a GCD table and a minimum table.'
- id: lc-maximum-number-of-robots-within-budget
  role: ladder
  card: idempotent-range-query
  rung: 7
  twist: Window cost mixes a maximum and a sum; choose the structure for each.
  summary: Robots in a row, each with a charge time and a running cost (n ≤ 5·10^4, budget ≤ 10^15); choose
    consecutive robots with total cost at most the budget, where the cost of a row is the largest charge
    time plus the number of robots times the sum of their running costs; find the most robots.
  hints:
  - Does a longer row ever cost less than a shorter row inside it?
  - A row inside a good row is good, so two pointers apply; what must you know about the current row to
    compute its cost?
  - Prefix sums for the sum of running costs and a maximum table for the largest charge time; use 64-bit
    numbers.
- id: lc-shortest-subarray-with-or-at-least-k-ii
  role: ladder
  card: monotone-range-search
  rung: 1
  twist: 'Base case of the card with OR: for each start, the first end where the OR reaches k.'
  summary: An array of n ≤ 2·10^5 non-negative numbers up to 10^9 and a number k; the length of the shortest
    non-empty subarray whose OR is at least k, or −1.
  hints:
  - What happens to the OR of a subarray when you add an element at the right?
  - 'The OR only gains bits, so it never goes down: "OR ≥ k" is false and then true for a fixed start.'
  - Build an OR table; for each start binary search the first end where the OR reaches k and keep the
    shortest length.
- id: cf-1237D
  role: ladder
  card: monotone-range-search
  rung: 2
  twist: The bound depends on the start (half the largest value seen so far), so the target is found per
    start.
  summary: Songs in a circle with coolness values a_i (n ≤ 10^5); starting from song i and playing in
    order, you stop at the first song whose coolness is strictly less than half of the largest coolness
    played so far; for each i print how many songs are played, or −1 if you never stop.
  hints:
  - Repeat the circle three times so that a walk never has to wrap. What is the earliest song that stops
    a walk from i?
  - Look at the first song after i that is smaller than a_i / 2, and the first stop of the walk from i
    + 1.
  - For each i binary search the first position after i whose value is below half of a_i, with a minimum
    table; then combine with the stop from i + 1 from the right.
- id: lc-find-building-where-alice-and-bob-can-meet
  role: ladder
  card: monotone-range-search
  rung: 3
  twist: 'The target is the first position right of a point whose value exceeds a threshold: search a
    maximum table.'
  summary: 'Heights of n ≤ 5·10^4 buildings and q queries (a, b): a person moves from building i to any
    building j > i with a greater height; find the leftmost building that both people, starting at a and
    b, can reach, or −1.'
  hints:
  - If the two start positions are the same or the lower one is on the left, where do they meet?
  - Otherwise they must both stand on a building to the right of b that is taller than both starts.
  - Binary search the first building right of b whose height is above the larger start, using a range-maximum
    table.
- id: cf-1632D
  role: ladder
  card: few-changes-count
  rung: 1
  twist: 'Base case of the card: the GCD of a range compared with its length, with few candidates for
    each end.'
  summary: An array of n ≤ 2·10^5 numbers; the fewest changes of single elements so that no range has
    a GCD equal to its length.
  hints:
  - For a fixed right end r, how do the GCD and the length of a range change as l moves left?
  - The GCD falls and the length grows, so there is at most one l where they are equal, found by binary
    search.
  - Sweep r from left to right; when a bad range appears that starts after the last changed position,
    change a_r to a large prime and count it.
- id: lc-smallest-subarrays-with-maximum-bitwise-or
  role: ladder
  card: few-changes-count
  rung: 2
  twist: 'The stretches of an OR: its largest value is reached at the end of the last stretch.'
  summary: An array of n ≤ 10^5 non-negative numbers; for each start i, the length of the shortest subarray
    starting at i whose OR equals the OR of everything from i to the end.
  hints:
  - What is the largest OR any subarray starting at i can have?
  - The OR from i grows with the end and changes at most about 30 times, so only the first end that reaches
    the final value matters.
  - Binary search the smallest end whose OR equals the OR of the suffix, with an OR table.
- id: lc-number-of-subarrays-with-and-value-of-k
  role: ladder
  card: few-changes-count
  rung: 3
  twist: 'Count the ranges whose aggregate equals a value: the stretch with that value, from two searches.'
  summary: An array of n ≤ 10^5 numbers and a number k; count the subarrays whose bitwise AND equals exactly
    k.
  hints:
  - For a fixed end, how does the AND of a_l..r change as l moves left?
  - It never goes up, so the starts where it equals k form one block.
  - Two binary searches on an AND table (the first start with AND ≤ k and the first with AND < k) give
    the block; add its length with 64-bit numbers.
- id: cf-1691D
  role: review
  review_set: 1
  card: idempotent-range-query
  summary: Is it true that for every subarray of an array (total length ≤ 2·10^5) the sum of the elements
