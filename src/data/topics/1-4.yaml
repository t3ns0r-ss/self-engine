# Topic 1.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.4"
draft: true
cards:
  - id: sorted-search
    name: Search a sorted sequence
    decisive_property: "The sequence being searched is sorted (or is non-decreasing by construction, like prefix sums of non-negative values), so \"a_i ≥ x\" is false…false true…true and the first true index is found in O(log n); counts and nearest values follow from lower and upper bounds."
    from_theorem: Theorem 1.4.2
    how_to_test: Name the sequence and check it is non-decreasing, then write the question as "the first index where …" or as a difference of two bounds.
    weak_signals:
      - Many independent queries "how many ≤ x", "the closest value", "the first time the total reaches t"
      - A sorted array is given, or sorting is allowed (the question is order-free)
      - For each element, count the partners in a sorted list that satisfy an inequality
      - '"O(log n)" demanded for an array that is sorted except for a rotation or a single break'
    kill_signals:
      - The collection changes between queries (a set, topic 0.6)
      - All queries are known and can be sorted too (a forward walk, topic 1.3, is simpler)
    lookalikes:
      - description: Search a matrix whose rows and columns are sorted but which is not one sorted list
        needs: "a corner walk that discards a row or a column per step (topic 1.3)"
        flipping_difference: Without a single sorted order, no middle element splits the candidates in two.
    complexity: O(log n) per query after O(n log n) sorting.
  - id: answer-search
    name: Search on the answer
    decisive_property: "The question asks for the smallest (or largest) x that works, and \"x works\" is monotone in x and can be checked much faster than the answer can be found directly, so binary search over x with the check finds it; for real answers, a fixed number of halvings reaches the required precision."
    from_theorem: Theorem 1.4.3
    how_to_test: Write the check ok(x); prove that ok(x) implies ok(x + 1) (or the reverse); find bounds L and R with the answer between them.
    weak_signals:
      - '"Minimise the maximum …" or "maximise the minimum …"'
      - '"The least time / capacity / speed such that …", answers up to 10^9 or 10^18'
      - Splitting an array into consecutive parts, or placing items with a minimum gap
      - '"The most items affordable with a budget", where the cost of k items grows with k'
    kill_signals:
      - The check is not monotone (a larger x can fail where a smaller one works)
      - The answer has a direct formula or a single greedy pass gives it
    lookalikes:
      - description: The answer is one of a few candidates that can all be tried
        needs: "enumerate-answer (0.5)"
        flipping_difference: When the candidates are few, trying them all is simpler than proving monotonicity.
    complexity: O(cost of the check · log(R − L)).
  - id: kth-by-counting
    name: k-th smallest by counting
    decisive_property: "The question asks for the k-th smallest element of a huge implicit collection (all pair sums, a multiplication table, the numbers not in a list), and the number of elements ≤ x can be counted fast, so the k-th smallest is the first x with count(x) ≥ k."
    from_theorem: Theorem 1.4.6
    how_to_test: Write count(x) and its cost; check that listing the collection is too slow (k or the collection size is huge).
    weak_signals:
      - '"The k-th smallest" of something with n² or more elements'
      - k up to 10^9 or 10^18
      - Elements defined by a formula over pairs or over a range
    kill_signals:
      - k is small (up to about 10^5); then listing the k smallest with a priority queue works (topic 0.6)
    lookalikes:
      - description: The k smallest pair sums of two sorted arrays with k ≤ 10^4
        needs: "heap-extract (0.6)"
        flipping_difference: Small k lets the pairs be listed in increasing order; counting is needed only when k is huge.
    complexity: O(cost of count · log(value range)).
problems:
  - id: lc-binary-search
    role: ladder
    card: sorted-search
    rung: 1
    twist: Base case of the card
    summary: Find the index of a target in a sorted array of n ≤ 10^4 distinct values, or −1, in O(log n).
    hints:
      - Write a monotone predicate on the indices whose first true position tells you where the target would be.
      - "p(i) = (nums[i] ≥ target): false…false true…true. Its first true index is the only place the target can be."
      - Run the template with lo = −1, hi = n; then check whether hi < n and nums[hi] equals the target.
  - id: lc-first-bad-version
    role: ladder
    card: sorted-search
    rung: 2
    twist: The predicate is given as a function call, and every call counts.
    summary: Versions 1..n (n up to 2^31 − 1) where every version after the first bad one is bad; find the first bad one with few calls of isBadVersion.
    hints:
      - Is "version v is bad" monotone in v?
      - "Yes: good…good bad…bad. So the answer is the first true position of isBadVersion (Theorem 1.4.1)."
      - "lo = 0, hi = n; mid = lo + (hi − lo) / 2, because lo + hi can overflow int here."
  - id: lc-search-insert-position
    role: ladder
    card: sorted-search
    rung: 3
    twist: The answer is also needed when the target is absent, which is exactly the lower bound.
    summary: In a sorted array of distinct values, return the target's index, or the index where it would be inserted to keep the order.
    hints:
      - Where must the target go if it is not present?
      - "Before the first value that is at least the target: the lower bound (Theorem 1.4.2)."
      - Return the template's hi for p(i) = (nums[i] ≥ target), or lower_bound − begin.
  - id: ac-abc231_c
    role: ladder
    card: sorted-search
    rung: 4
    twist: The array must be sorted first, and many queries share it.
    summary: N, Q ≤ 2·10^5; for each query x, how many of N heights are at least x?
    hints:
      - Does the order of the students matter for the answer?
      - "No, so sort. The heights at least x form a suffix starting at the lower bound of x."
      - Sort once; answer N − lower_bound(x) for each query.
  - id: lc-find-first-and-last-position-of-element-in-sorted-array
    role: ladder
    card: sorted-search
    rung: 5
    twist: Two searches, one for each end of a block of equal values.
    summary: The first and last index of a target in a sorted array with repeats (n ≤ 10^5), or [−1, −1], in O(log n).
    hints:
      - Which two bounds bracket all copies of the target?
      - "The lower bound (first ≥ target) and the upper bound (first > target); the copies sit between them."
      - "If lower = upper the target is absent; otherwise return [lower, upper − 1]."
  - id: ac-abc334_d
    role: ladder
    card: sorted-search
    rung: 6
    twist: "The searched sequence is built: prefix sums of the sorted values."
    summary: N sleighs need R_i reindeer each (≤ 10^9); for Q ≤ 2·10^5 queries X ≤ 2·10^14, the most sleighs that X reindeer can pull.
    hints:
      - Which sleighs should be pulled to pull as many as possible?
      - "The cheapest ones: sort R. Pulling k sleighs needs the prefix sum P_k, which is non-decreasing."
      - "The answer is the largest k with P_k ≤ X: upper_bound(P, X) − 1 on P_0..P_N. long long."
  - id: cf-706B
    role: ladder
    card: sorted-search
    rung: 7
    twist: Many queries with a different bound each, in a Codeforces input format.
    summary: "Prices in n ≤ 10^5 shops; on each of q ≤ 10^5 days you have m_i coins; in how many shops can you buy the drink?"
    hints:
      - Rewrite the question as a count in a sorted array.
      - "The number of prices at most m_i: the upper bound of m_i in the sorted prices (Theorem 1.4.2)."
      - Sort once, then print upper_bound(m_i) − begin for each day.
  - id: lc-search-in-rotated-sorted-array
    role: ladder
    card: sorted-search
    rung: 8
    twist: The array is not sorted, but a different predicate is still monotone.
    summary: A sorted array of distinct values was rotated at an unknown point; find a target in O(log n).
    hints:
      - Compare each element with the last element. What do the answers look like?
      - "\"nums[i] ≤ nums[n−1]\" is false on the first block and true on the second: monotone, so the rotation point is its first true index."
      - Find the rotation point with one search, then search the one sorted part that can contain the target.
  - id: lc-sqrtx
    role: ladder
    card: answer-search
    rung: 1
    twist: Base case of the card
    summary: The integer square root (rounded down) of x ≤ 2^31 − 1, without library powers.
    hints:
      - Is "r·r ≤ x" monotone in r?
      - "It is true, …, true, false, …: the answer is its last true value (the template with the roles swapped)."
      - Search r in [0, x + 1] with lo true and hi false; compute r·r in long long.
  - id: lc-koko-eating-bananas
    role: ladder
    card: answer-search
    rung: 2
    twist: The check is a sum over the input, computed for each candidate.
    summary: Piles of bananas (n ≤ 10^4, piles ≤ 10^9) and h hours; the smallest eating speed k per hour that finishes all piles in time.
    hints:
      - How many hours does speed k need? Does a larger k ever need more?
      - "Σ ceil(p_i / k) hours, which never grows as k grows: monotone (Theorem 1.4.3)."
      - Search the smallest k in [1, max pile] with Σ ceil(p_i / k) ≤ h; use long long for the sum.
  - id: cses-1620
    role: ladder
    card: answer-search
    rung: 3
    twist: The answer can be about 10^18, and the count in the check must not overflow.
    summary: n ≤ 2·10^5 machines each making one product per k_i seconds; the least time to make t ≤ 10^9 products.
    hints:
      - In T seconds, how many products can the machines make together?
      - "Σ floor(T / k_i), non-decreasing in T. The answer is the first T where it reaches t."
      - "Search T in [1, min(k)·t]; stop adding once the sum reaches t, so it cannot overflow."
  - id: ac-abc146_c
    role: ladder
    card: answer-search
    rung: 4
    twist: Maximise instead of minimise, with a cost that jumps at each new digit.
    summary: The integer N costs A·N + B·(digits of N); the largest N ≤ 10^9 affordable with X ≤ 10^18 yen, or 0.
    hints:
      - Is "N is affordable" monotone in N?
      - "Yes: both A·N and the digit count only grow. It is true, …, true, false, …"
      - "Search the last affordable N in [0, 10^9] with lo = 0 (always fine) and hi = 10^9 + 1; the cost fits in long long."
  - id: cf-1873E
    role: ladder
    card: answer-search
    rung: 5
    twist: The check sums how much each column falls short of a candidate height.
    summary: "Columns of heights a_i and x units of water; the tallest tank height h such that filling every column up to h needs at most x units. (t test cases)"
    hints:
      - How much water does height h need?
      - "Σ max(0, h − a_i), non-decreasing in h. The answer is the last h whose need is at most x."
      - Search h up to max(a) + x in long long.
  - id: cf-371C
    role: ladder
    card: answer-search
    rung: 6
    twist: Three ingredients with stock and prices; the upper bound of the search must be chosen with care.
    summary: A recipe of B, S and C pieces, some stock of each, their prices and r rubles; the most hamburgers that can be made.
    hints:
      - What does it cost to make k hamburgers?
      - "For each ingredient, max(0, k·need − have) pieces must be bought; the cost is non-decreasing in k."
      - "Search the last affordable k with hi around 10^13 (stock plus money cannot do more); compute the cost in long long."
  - id: cf-780B
    role: ladder
    card: answer-search
    rung: 7
    twist: The answer is a real number, so a fixed number of halvings replaces the integer loop.
    summary: n friends on a line at positions x_i with top speeds v_i; the least time after which all of them can be at one common point.
    hints:
      - In time t, which points can friend i reach? When do all friends share a point?
      - "Friend i covers [x_i − v_i t, x_i + v_i t]; all intervals meet iff the largest left end ≤ the smallest right end, which only gets easier as t grows."
      - "Search t over the reals with 100 halvings (Theorem 1.4.5) and print with enough digits."
  - id: ac-abc205_d
    role: ladder
    card: kth-by-counting
    rung: 1
    twist: Base case of the card
    summary: For sorted distinct A_i ≤ 10^18 and Q ≤ 10^5 queries K, the K-th smallest positive integer not in A.
    hints:
      - How many positive integers up to x are not in A?
      - "x − (number of A_i ≤ x): non-decreasing in x, so the answer is the first x where it reaches K (Theorem 1.4.6)."
      - "Search x in [1, K + N] with the count computed by an upper bound in A; or, faster, search the index i where A_i − i first reaches K."
  - id: cses-2422
    role: ladder
    card: kth-by-counting
    rung: 2
    twist: The collection has n² ≈ 10^12 elements, and the count is a sum over rows.
    summary: The middle element of the sorted entries of an n × n multiplication table (n < 10^6, n odd).
    hints:
      - How many entries of row i are at most x?
      - "min(n, floor(x / i)); summing over the rows gives count(x) in O(n)."
      - "The answer is the smallest x with count(x) ≥ (n² + 1) / 2; search x in [1, n²] with long long."
  - id: ac-abc155_d
    role: ladder
    card: kth-by-counting
    rung: 3
    twist: Products of pairs with negative numbers, so counting pairs at most x needs care with signs.
    summary: The K-th smallest of the N(N − 1)/2 pairwise products of N ≤ 2·10^5 integers in [−10^9, 10^9].
    hints:
      - "For a fixed a_i and a bound x, which a_j satisfy a_i · a_j ≤ x? Separate a_i > 0, a_i = 0 and a_i < 0."
      - "For a_i > 0: a_j ≤ floor(x / a_i); for a_i < 0: a_j ≥ ceil(x / a_i) (dividing by a negative flips the inequality); for 0: all if x ≥ 0. Each is a bound in the sorted array."
      - "count(x) = (number of ordered pairs i ≠ j) / 2 — subtract the pairs i = j and halve; search the smallest x in [−10^18, 10^18] with count(x) ≥ K, rounding divisions towards −∞ carefully."
  - id: ac-abc143_d
    role: worked_example
    summary: Count the triangles that can be formed from 3 of N ≤ 2000 sticks (lengths ≤ 1000).
  - id: cses-1085
    role: worked_example
    summary: Divide an array of n ≤ 2·10^5 positive values into k consecutive parts so that the largest part sum is as small as possible.
  - id: ac-abc248_d
    role: drill
    summary: N, Q ≤ 2·10^5; each query asks how many of A_L..A_R equal X.
  - id: ac-abc353_c
    role: drill
    summary: The sum over all pairs i < j of (A_i + A_j) mod 10^8, for N ≤ 3·10^5 values below 10^8.
  - id: lc-find-minimum-in-rotated-sorted-array
    role: drill
    summary: The minimum of a sorted array of distinct values rotated at an unknown point, in O(log n).
  - id: lc-capacity-to-ship-packages-within-d-days
    role: drill
    summary: Ship packages in their given order within D days; each day's load is at most the capacity; the least capacity (n ≤ 5·10^4).
  - id: lc-minimum-number-of-days-to-make-m-bouquets
    role: drill
    summary: Flowers bloom on given days (n ≤ 10^5); a bouquet needs k adjacent bloomed flowers; the first day on which m bouquets can be made, or −1.
  - id: lc-kth-smallest-element-in-a-sorted-matrix
    role: drill
    summary: The k-th smallest entry of an n × n matrix (n ≤ 300) whose rows and columns are sorted.
  - id: cf-1538C
    role: drill
    summary: "Count the pairs i < j with l ≤ a_i + a_j ≤ r (n ≤ 2·10^5, t test cases)."
  - id: ac-abc341_d
    role: drill
    summary: The K-th smallest positive integer divisible by exactly one of N and M (N, M ≤ 10^8, K ≤ 10^10).
  - id: ac-abc267_c
    role: drill
    summary: The largest value of 1·B_1 + 2·B_2 + … + M·B_M over the contiguous parts B of length M of an array (N ≤ 2·10^5).
  - id: ac-abc339_c
    role: drill
    summary: A bus's passenger count changed by A_1..A_N (possibly negative) and never went below 0; the smallest possible current count.
  - id: lc-product-of-array-except-self
    role: drill
    summary: For each i, the product of all elements except nums[i] (n ≤ 10^5), in O(n) and without division.
  - id: lc-search-a-2d-matrix
    role: lookalike
    summary: Find a target in an m × n matrix whose rows are sorted and each row starts above the previous row's end, in O(log(mn)).
  - id: lc-search-a-2d-matrix-ii
    role: lookalike
    summary: Find a target in an m × n matrix (≤ 300 × 300) whose rows and columns are each sorted.
  - id: lc-find-k-pairs-with-smallest-sums
    role: lookalike
    summary: The k pairs (one element from each of two sorted arrays) with the smallest sums, k ≤ 10^4.
  - id: lc-kth-smallest-number-in-multiplication-table
    role: lookalike
    summary: The k-th smallest entry of the m × n multiplication table (m, n ≤ 3·10^4, k up to m·n).
  - id: ac-abc174_e
    role: checkpoint
    card: answer-search
    summary: Cut N ≤ 2·10^5 logs at most K ≤ 10^9 times in total so that the longest piece is as short as possible; print it rounded up.
  - id: lc-find-k-th-smallest-pair-distance
    role: checkpoint
    card: kth-by-counting
    summary: The k-th smallest |nums[i] − nums[j]| over all pairs i < j (n ≤ 10^4, values ≤ 10^6).
  - id: cf-1201C
    role: checkpoint
    card: answer-search
    summary: "An array of odd length n ≤ 2·10^5 and k operations, each adding 1 to an element; the largest possible median."
  - id: lc-heaters
    role: review
    card: sorted-search
    review_set: 1
    summary: The smallest common radius for heaters at given positions to warm all houses (up to 3·10^4 each, positions ≤ 10^9).
  - id: lc-successful-pairs-of-spells-and-potions
    role: review
    card: sorted-search
    review_set: 1
    summary: For each spell, the number of potions whose product with it is at least a threshold (n, m ≤ 10^5).
  - id: lc-maximum-candies-allocated-to-k-children
    role: review
    card: answer-search
    review_set: 1
    summary: Split piles of candies (n ≤ 10^5) into sub-piles so that k ≤ 10^12 children each get one sub-pile of the same size; the largest size.
  - id: lc-minimized-maximum-of-products-distributed-to-any-store
    role: review
    card: answer-search
    review_set: 2
