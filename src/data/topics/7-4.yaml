drill:
- problem: lc-maximum-subsequence-score
  answer:
    topic: '7.4'
    card: sweep-with-heap
  property: Sort the pairs by nums2 in decreasing order; the current nums2 is then the smallest of the
    chosen; the best k indices among those seen are the k largest nums1, kept in a min-heap with their
    sum.
  why_others_fail: A search over all k-subsets is exponential, and a DP over (index, count) costs n·k,
    too much for 10^5.
- problem: lc-single-threaded-cpu
  answer:
    topic: '7.4'
    card: sweep-with-heap
  property: Sort the tasks by enqueue time; at each moment the available tasks are in a heap ordered by
    (processing time, index); if the heap is empty, jump to the next enqueue time.
  why_others_fail: Sorting once by processing time ignores which tasks have arrived; scanning all tasks
    for each step costs n².
- problem: lc-maximum-number-of-eaten-apples
  answer:
    topic: '7.4'
    card: sweep-with-heap
  property: Each day push (the day the batch rots, its count); drop the rotten batches; eat from the batch
    that rots soonest; go on after the last day while the heap is not empty.
  why_others_fail: Eating the freshest apples first wastes the ones that rot soon.
- problem: lc-remove-stones-to-minimize-the-total
  answer:
    topic: '7.4'
    card: extract-and-replace
  property: 'A max-heap of the piles: k times pop the largest, remove half of it and push the rest back.'
  why_others_fail: Taking the k largest original piles once ignores that a halved pile may still be the
    largest.
- problem: lc-maximum-number-of-tasks-you-can-assign
  answer:
    topic: '1.4'
    card: answer-search
  property: 'The answer is monotone in k: binary search on k; for a fixed k the k easiest tasks go to
    the k strongest workers, and a deque decides who gets a pill.'
  why_others_fail: A heap by deadline has no deadlines here; taking tasks greedily one by one does not
    say which worker should get a pill.
- problem: lc-avoid-flood-in-the-city
  answer:
    topic: '0.6'
    card: ordered-set-lookup
  property: Keep the set of dry days seen and a map from a lake to its last rain; when a lake rains again,
    dry it on the first dry day after its last rain (a lower bound in the set).
  why_others_fail: A heap by deadline does not tell which dry days come after the last rain of a given
    lake.
- problem: lc-longest-happy-string
  answer:
    topic: '0.6'
    card: heap-extract
  property: 'Build the string letter by letter: take the most frequent letter unless that would make three
    in a row, then the second most frequent; a heap of (count, letter).'
  why_others_fail: 'There is no limit to repair afterwards and no changing gain: it is a simple simulation
    with the extreme element each time.'
- problem: lc-maximum-score-from-removing-stones
  answer:
    topic: '1.5'
    card: extreme-first
  property: Always take from the two largest piles; for three piles the answer is also min(⌊(a + b + c)
    / 2⌋, a + b + c − max).
  why_others_fail: 'A heap works but is not needed: three piles and a formula.'
lookalike_pairs:
- a: lc-maximum-number-of-events-that-can-be-attended
  b: lc-maximum-number-of-events-that-can-be-attended-ii
  a_tool:
    topic: '7.4'
    card: sweep-with-heap
  b_tool:
    topic: '3.2'
    card: two-index
  shared_surface: Both give events with a first day and a last day and ask which events to attend so that
    the number or the total value is as large as possible.
  flipping_difference: 'In version I an event takes any one day inside its window, one event a day, and
    only the number counts: the event with the earliest last day among the open ones is attended each
    day, with a heap. In version II an event occupies its whole range and has a value, and at most k events
    may be attended; the greedy fails, and the answer is a DP over (event, number attended) with a binary
    search for the next event that does not overlap.'
  flipping_input: 'The events (1, 3), (2, 4), (3, 5): in version I all three are attended on the days
    1, 2, 3; in version II (each event occupies its whole range) the events overlap pairwise and only
    one can be attended.'
- a: cf-1249D2
  b: cf-1249D1
  a_tool:
    topic: '7.4'
    card: deadline-heap
  b_tool:
    topic: '1.5'
    card: extreme-first
  shared_surface: Both give segments on a line and a number k and ask for the fewest segments to remove
    so that no point is covered by more than k remaining segments.
  flipping_difference: In the easy version n, k and the coordinates are at most 200, so at each point
    the covering segments are scanned for the one with the largest right end. In the hard version they
    are up to 2·10^5, and the covering segments are kept in an ordered collection in which the largest
    right end is found and removed in O(log n).
  flipping_input: 'n = k = 2·10^5 with coordinates up to 2·10^5: a scan of all segments at each point
    is about 4·10^10 steps, against n log n.'
self_test:
- q: Run Theorem 7.4.1 on the courses (duration, last day) = (4, 4), (3, 5), (2, 6). Which courses does
    it keep?
  a: 'Add (4, 4): the total 4 is in time. Add (3, 5): the total 7 passes the day 5, so the longest course
    (4) is dropped and the total is 3. Add (2, 6): the total 5 is in time. The kept courses are (3, 5)
    and (2, 6): two courses.'
- q: Why is one removal enough when a new course makes the schedule late in Theorem 7.4.1?
  a: The set was feasible before the new course, so only the constraint of the new course, which is the
    last one, can fail. Removing a longest course lowers the total by at least the duration of the new
    course, so the total is back to at most what it was before, which was within the previous last day
    and so within the new, larger or equal, last day.
- q: The potions 3, −5, 2, −1, −2 are drunk in a row (the health starts at 0). Which potions does the
    loop keep?
  a: 'Drink 3 (health 3). Drink −5: the health is −2, so the −5 is put back (the health 3). Drink 2 (5),
    −1 (4), −2 (2). The kept potions are 3, 2, −1, −2: four potions.'
- q: Run the heap of Theorem 7.4.2 for the target 15, the start fuel 5 and the stations (position, fuel)
    = (4, 5), (9, 3), (10, 10).
  a: 'The reach is 5; the station at 4 enters the heap {5}. The target is not reached: take 5, the reach
    is 10 (1 stop). The stations at 9 and 10 enter: {3, 10}. Take 10: the reach is 20 ≥ 15 (2 stops).
    The answer is 2.'
- q: Why can the greedy of Theorem 7.4.2 fail when the stations have different prices and different fuels?
  a: The largest fuel is no longer at least as good as the others, because it may cost much more. With
    the requirement 10 and the items (fuel 10, price 100), (6, 1), (5, 1) the greedy pays 100 where 2
    is enough. The exchange step needs an item that is better in both the fuel and the price.
- q: Join the weights 1, 1, 2, 4 two at a time at the cost of the sum (Theorem 7.4.3 (b)). What is the
    total cost?
  a: 'Join 1 + 1 = 2 (cost 2); the items are 2, 2, 4: join 2 + 2 = 4 (cost 4); the items are 4, 4: join
    them for 8. The total is 2 + 4 + 8 = 14.'
- q: Why does Theorem 7.4.3 (a) need the gains of one item not to increase?
  a: The proof says that the best k operations are the k largest gains of the whole table and that the
    heap hands them out in order. If an item has a small first gain and a large second one, the large
    one is offered only after the small one is taken; with the gains (0, 10) and (3, 2) and two operations
    the process gets 3 + 2 = 5, not 0 + 10.
- q: Run the sweep of Theorem 7.4.4 on the events (first, last) = (1, 3), (1, 3), (2, 2), (3, 3), one
    event a day.
  a: 'Day 1: the open events end on 3 and 3; attend one. Day 2: the event (2, 2) opens; the open ones
    end on 3 and 2; attend the one ending on 2. Day 3: (3, 3) opens; the open ones end on 3 and 3; attend
    one. Three events are attended; the fourth has no day left, since only the days 1, 2, 3 exist.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - ac-abc407_e
  - lc-smallest-range-covering-elements-from-k-lists
  - lc-minimize-deviation-in-array
decision_map:
- weak_signal: The largest number of items done one after another by their deadlines, or taken in a row
    while a running balance stays non-negative
  choose: deadline-heap
  when: Only the number of items counts, the limits come in a fixed order, and giving up the costliest
    item restores a violated limit (Theorem 7.4.1).
  over:
  - card: zero-one
    topic: '3.3'
    because: 'The items have values: a knapsack.'
  - card: interval-selection
    topic: '1.5'
    because: 'The intervals have fixed positions: sort by the end.'
- weak_signal: The fewest or cheapest items to choose so that a running total stays above a bound at every
    point (refuelling, brackets, buying votes)
  choose: regret
  when: The requirements are lower bounds on nested prefixes and the items are comparable (equal costs
    or equal gains) (Theorem 7.4.2).
  over:
  - card: unbounded
    topic: '3.3'
    because: 'Neither the gains nor the costs are comparable: a DP.'
  - card: extreme-first
    topic: '1.5'
    because: 'One requirement at the end only: sort and take the largest.'
- weak_signal: The best result after k operations that each change one item (halve, add a student), or
    the cheapest way to join pieces two at a time
  choose: extract-and-replace
  when: The gains of an item never increase, or the cost of a join is the sum of the weights (Theorem
    7.4.3).
  over:
  - card: heap-extract
    topic: '0.6'
    because: An item that is taken is gone and not put back.
  - card: two-index
    topic: '3.2'
    because: 'The gains of an item can rise: a DP over the number of operations.'
- weak_signal: The most events or tasks done in windows of time, one at a time, or the fewest rooms or
    machines for intervals
  choose: sweep-with-heap
  when: Items become available in a fixed order and the one that expires first can always be taken (Theorem
    7.4.4).
  over:
  - card: interval-selection
    topic: '1.5'
    because: 'Fixed intervals: sort by the end, no heap.'
  - card: merge-groups
    topic: '4.4'
    because: 'Items with values: sort by the value and use free days in a disjoint set.'
