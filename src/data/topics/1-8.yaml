# Topic 1.8 data file (CURRICULUM_GAPS_PLAN.md Section 5.4, gap topic). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '1.8'
uses:
- topic: '0.1'
  what: 'C++ for competitive programming: reading and printing, 64-bit numbers, and the fast input lines whose effect on flushing is the main trap of interactive problems'
- topic: '0.4'
  what: 'Divisibility: the questions about divisors in one review problem'
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, and a search over the orders of six numbers in one look-alike problem'
- topic: '0.6'
  what: 'Standard containers: sets and maps in one problem of the phase exam'
- topic: '1.1'
  what: 'Sorting: the numbers found by the questions are sorted at the end of one problem, and one drill problem is a plain sort'
- topic: '1.2'
  what: 'Prefix sums: a reply that is a total is compared with a prefix sum, and prefix sums are turned back into numbers'
- topic: '1.3'
  what: 'Two pointers: the walk that fits a budget of about two questions per position'
- topic: '1.4'
  what: 'Binary search: the invariant template with its count of tests (Theorem 1.4.1) is the engine of the two halving cards'
- topic: '1.5'
  what: 'Greedy: the largest block that fits, taken from the left, in one drill problem'
- topic: '1.6'
  what: 'Monotonic stack and deque: one problem of the phase exam'
- topic: '1.7'
  what: 'Bits: xor identities, and the identity a + b = (a or b) + (a and b), used when the replies are xors, ands and ors'
theorems:
- id: 1.8.1
  title: Halving meets the information bound
  plain_words: A judge holds one of $n$ numbers and every question has a yes or no reply. After $q$ questions there are at most $2^q$ different reply sequences, and each number needs its own sequence, so $q$ questions are enough only when $2^q$ is at least $n$. Asking whether the number is at most the middle of the range that is left cuts the range in half every time, so the smallest $q$ with $2^q$ at least $n$ is also enough.
  code: 1.8/thm-1
- id: 1.8.2
  title: Comparing two neighbours keeps a local minimum
  plain_words: Look at a range whose left neighbour is larger than its first number and whose right neighbour is larger than its last number. A number that is smaller than both of its neighbours must lie inside it. Compare two neighbouring numbers in the middle; the side where the numbers go down still has this shape, so half of the range can be dropped with two questions.
  code: 1.8/thm-2
- id: 1.8.3
  title: Sums of pairs fix every number
  plain_words: When the reply to a question is the sum of two hidden numbers, the three sums of three numbers add up to twice the total of the three. So the sum of two of them minus the third sum, divided by 2, gives one number exactly. After that one more sum with that number gives every other number, and n questions are enough for n numbers.
  code: 1.8/thm-3
- id: 1.8.4
  title: An adaptive judge changes nothing for a strategy that works for every hidden value
  plain_words: An adaptive judge has no number in mind and only promises that its replies agree with at least one number. A strategy that reads only the replies cannot tell such a judge from a judge with a fixed number. At the end some number agrees with every reply, and a judge holding that number would have given the same replies. So a strategy that is right and fast for every fixed number is right and fast against the adaptive judge, and at the end exactly one number agrees with all the replies.
  code: 1.8/thm-4
cards:
- id: halving
  name: Halving under a query budget
  from_theorem: 1.8.1
  decisive_property: 'Every reply tells which side of the probe still holds an answer, so the range can be cut at the probe (the reply is monotone in the probe: once it says "at most", it says so for every larger probe; or the two ends of a kept range keep values that force an answer inside it), and the budget is at least $\lceil \log_2 n \rceil$ questions.'
  how_to_test: 'For each possible reply to a probe $m$ say which side is kept and check that the kept side still holds an answer: for a yes or no, check that the reply can change only once, from no to yes, as $m$ grows; for a value at the probe, check that the two ends of the kept range keep two different values. Then find the smallest $q$ with $2^q \ge n$ and compare it with the budget: a smaller budget cannot work for any strategy (Theorem 1.8.1).'
  constraint_shapes:
  - '$n$ up to $2 \cdot 10^5$ and 25 questions: $2^{18} = 262144 \ge 2 \cdot 10^5$, so 18 questions are enough, while asking about every position needs up to $2 \cdot 10^5$'
  - 'a hidden number up to $10^9$ and 60 questions: $2^{30} \ge 10^9$, so the budget allows about 30 questions to find the range and 30 to halve it'
  weak_signals:
  - form: 'Asks to find a hidden number, position or threshold with a limit of about $\log_2 n$ questions'
    shape: '$n$ up to $10^5$ or $10^9$ and a limit on the number of questions between 20 and 60'
  - form: 'The judge says whether the hidden value is at most, or lower than or higher than, the number you print'
    shape: '$n$ up to $2^{31}$ and replies such as less, greater or equal'
  - form: 'A reply is a count or a total over a prefix (zeros, rooks, weights) and you want the first prefix where it reaches a target'
    shape: '$n$ up to $2 \cdot 10^5$, a question names a range $[1, m]$, a budget of about 25'
  kill_signals:
  - 'The judge answers only whether the value equals the probe: for the hidden number 3 in 1 to 8 the questions 4, 6 and 7 all say no, the method moves to the right each time and ends at 8, while the number is 3'
  - 'The budget is below $\lceil \log_2 n \rceil$: with $n = 10^5$ and 12 questions, $2^{12} = 4096 < 10^5$, so no strategy can finish (Theorem 1.8.1)'
  in_action:
    statement: 'The judge holds a whole number $x$ between 1 and $10^9$ and answers the question "is $x \le m$?" with yes or no. Find $x$.'
    constraints: 'At most 30 questions.'
    budget: 'Asking about every number needs up to $10^9$ questions. $2^{30} = 1073741824 \ge 10^9$, so 30 questions are the least possible, and the limit allows exactly that.'
    candidates:
    - tool: 'Ask about every number in order (brute force, topic 0.5)'
      verdict: rejected
      because: 'Up to $10^9$ questions against a limit of 30.'
    - tool: 'Binary search with the question "is x at most m?" (this topic)'
      verdict: chosen
      because: 'Each reply halves the range (Theorem 1.8.1): 30 questions.'
    property_check: 'The reply to "is $x \le m$?" is no for every $m < x$ and yes for every $m \ge x$, so it is monotone in $m$. The property holds, and the budget equals the information bound.'
    decision: 'Keep lo (reply no) and hi (reply yes), ask the middle until hi minus lo is 1, then print hi. 30 questions.'
  examples:
    positive:
    - inline:
        input: 'The judge holds x = 37 between 1 and 100 and answers "is x at most m?".'
        answer: '37 (found with 7 questions)'
        why: 'The reply is no below 37 and yes from 37 on, so it is monotone. Each question halves the range 1 to 100, and $\lceil \log_2 100 \rceil = 7$ (Theorem 1.8.1).'
    - worked_example: ac-abc299_d
      why: 'The string starts with 0 and ends with 1. The reply is not monotone in the position, but it says which side holds a change: the half that is kept still has a 0 at its left end and a 1 at its right end. Each question halves the gap, 18 questions for $N = 2 \cdot 10^5$.'
    negative:
    - inline:
        input: 'The judge holds x = 3 between 1 and 8 but answers only "is x equal to m?".'
        answer: '3'
        method_gives: '8'
        why: 'The reply is not monotone: "no" to "is $x = 4$?" does not say whether $x$ is below or above 4. The halving method reads each no as "$x > m$" and ends at 8. With equality replies up to $n - 1$ questions are needed.'
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
    - problem: ac-abc157_c
      why: 'The title says "guess", but there is no judge and no reply: the task asks for the smallest number with given digits, and trying every number below 1000 is the tool.'
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
  lookalikes:
  - description: 'Binary search on the answer in an ordinary problem, where the check is code of ours'
    tool:
      topic: '1.4'
      card: answer-search
    flipping_difference: 'In an ordinary problem a check costs time, so $O(n)$ per check is affordable. In an interactive problem a check is a question from a counted budget, so only $\lceil \log_2 n \rceil$ of them are allowed.'
  - description: 'The first prefix whose count reaches a target in a given array'
    tool:
      topic: '1.2'
      card: prefix-count-lookup
    flipping_difference: 'With the array in hand, prefix counts answer every prefix in $O(1)$ after one pass. With a hidden array each prefix count costs a question, so the search must halve.'
  complexity: '$\lceil \log_2 n \rceil$ questions and $O(\log n)$ time; memory $O(1)$.'
- id: compare-halving
  name: Halving with comparison replies
  from_theorem: 1.8.2
  decisive_property: 'A kept range has an invariant at its two ends (the left neighbour is larger than the first number and the right neighbour is larger than the last number, or the largest value is inside), and one comparison of two numbers restores the invariant for half of the range.'
  how_to_test: 'Write the invariant of the range as a statement about its two ends, check that it is true for the whole input (the outside counts as infinite), and check that comparing the two numbers at the middle gives a half with the same statement. If the numbers must be different, check that too.'
  constraint_shapes:
  - '$n$ up to $10^5$ and a limit of 100 questions: reading every number needs $10^5$, while two questions per round for $\lceil \log_2 10^5 \rceil = 17$ rounds need 34'
  - '$n$ up to $10^5$ and a limit of 20 questions with a reply that is a position: one question per round, 17 rounds, so a reply must be reused'
  weak_signals:
  - form: 'Asks for a local minimum, a peak or any position that is smaller (or larger) than its neighbours'
    shape: '$n$ up to $10^5$, a question reads one number, a limit of about $2 \log_2 n$ reads'
  - form: 'A question gives the position of the largest or second largest number of a range you choose'
    shape: '$n$ up to $10^5$ and about $2 \log_2 n$ or $\log_2 n$ questions'
  - form: 'A circle or a line where a difference changes sign somewhere between two known ends'
    shape: '$n$ up to $10^5$, a read of one position, a limit of about 60 reads'
  kill_signals:
  - 'The task asks for the smallest number overall, not for any local minimum: for 1 3 2 4 0 the method returns position 3 (the number 2), while the smallest number is at position 5'
  - 'The numbers may repeat: for 2 2 2 the comparison of neighbours says nothing about the side, and the invariant cannot be restored'
  in_action:
    statement: 'The judge holds $n$ different numbers. The question "? $i$" gives the $i$-th number. Find a position whose number is smaller than both neighbours (a position outside counts as huge).'
    constraints: '$n \le 10^5$, at most 40 questions.'
    budget: 'Reading every number needs up to $10^5$ questions. With two reads per round, $\lceil \log_2 10^5 \rceil = 17$ rounds need 34 reads, inside the limit.'
    candidates:
    - tool: 'Read every number and scan (brute force, topic 0.5)'
      verdict: rejected
      because: 'Up to $10^5$ questions against a limit of 40.'
    - tool: 'Halving with a threshold question (the card "Halving under a query budget")'
      verdict: rejected
      because: 'The reply is a number, not a yes or no for a threshold on the position, so there is no monotone reply to cut on.'
    - tool: 'Halving with comparison replies (this card)'
      verdict: chosen
      because: 'Comparing the numbers at mid and mid + 1 keeps the invariant on one half (Theorem 1.8.2).'
    property_check: 'At the start the left neighbour of position 1 and the right neighbour of position $n$ are infinite, so the whole range has the invariant. Comparing positions mid and mid + 1 gives a half with the same invariant. The property holds.'
    decision: 'Keep lo and hi with a larger number to the left of lo and a larger number to the right of hi; compare the numbers at mid and mid + 1 and move to the side where they go down. 34 questions.'
  examples:
    positive:
    - inline:
        input: 'The judge holds 9 6 4 3 5 8 10 (the numbers fall and then rise). Find the position of the smallest number.'
        answer: '4 (the number 3)'
        why: 'The numbers fall and then rise, so the only local minimum is the smallest number. The comparison at the middle always points to the side where the numbers fall (Theorem 1.8.2).'
    - worked_example: lc-find-peak-element
      why: 'The array is given and the task asks for a peak: if the number at mid is smaller than the next one, a peak lies to the right, else at mid or to the left. This is the mirror image of the local minimum search.'
    negative:
    - inline:
        input: 'The judge holds 1 3 2 4 0. Find the position of the smallest number.'
        answer: '5 (the number 0)'
        method_gives: '3'
        why: 'The search keeps a local minimum, and the number 2 at position 3 is one (it is smaller than both 3 and 4). The task wants the smallest number overall, and the invariant says nothing about numbers outside the kept range.'
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
    - problem: lc-search-in-rotated-sorted-array
      why: 'The array is given, so reads are free, and the target is a value, not a local minimum; the plain binary search template with a comparison against the first number is the tool.'
      correct_tool:
        topic: '1.4'
        card: sorted-search
  lookalikes:
  - description: 'Search in a sorted array that is given in the input'
    tool:
      topic: '1.4'
      card: sorted-search
    flipping_difference: 'With a given array a read is free and any number of reads is allowed. With hidden numbers each read is a question from a counted budget, so the invariant must restore itself with two reads.'
  - description: 'The same shape with a threshold reply'
    tool:
      topic: '1.8'
      card: halving
    flipping_difference: 'When the reply is a yes or no for a threshold, one question per round suffices. When the reply is a value to compare with a neighbour, two reads per round are needed, or a position reply must be reused.'
  complexity: 'About $2 \lceil \log_2 n \rceil$ reads and $O(\log n)$ time; memory $O(1)$.'
- id: equation-queries
  name: Replies that are equations
  from_theorem: 1.8.3
  decisive_property: 'Each reply is a sum, a xor, a product, a distance or a bit of a few hidden values, and the replies chosen give as many independent equations as there are unknowns (or each question settles one new unknown).'
  how_to_test: 'Write each reply as an equation in the hidden values and count the unknowns. Check that the equations can be solved one after the other (three of them give three numbers, then each further question gives one more) and that the number of questions fits the budget. If two different solutions give the same replies, ask one more question or change the design.'
  constraint_shapes:
  - '$n = 5000$ hidden numbers and a limit of $n$ questions: all pair sums would be $n(n-1)/2 = 12497500$ questions, while three sums plus one per other number is exactly $n$'
  - '$N = 100$ bottles with one bad and the fewest friends: $2^7 = 128 \ge 100$, so 7 friends and 7 bits'
  weak_signals:
  - form: 'Asks to find all hidden numbers, or one bad item among many, with about as many questions as there are items'
    shape: '$n$ up to $5000$ and a limit of $n$ or $2n$ questions'
  - form: 'A question names two hidden numbers (or a range) and the reply is their sum, xor, and, or, or the sum of the range'
    shape: 'values up to $10^9$, so sums fit only in 64 bits'
  - form: 'All questions must be printed before any reply is read (the design is fixed in advance)'
    shape: 'a few items to test and a number of friends or tests equal to $\lceil \log_2 n \rceil$'
  kill_signals:
  - 'The replies are xors but the sum formula is applied: the hidden numbers 6, 3, 5 give the xors 5, 3, 6 and the formula $(5 + 3 - 6)/2$ gives 1, while $a_1 = 6$'
  - 'There are fewer equations than unknowns: for three numbers the two sums $a_1 + a_2 = 3$ and $a_1 + a_3 = 4$ fit four different arrays of non-negative numbers'
  in_action:
    statement: 'The judge holds $n$ whole numbers. The question "? $i$ $j$" gives $a_i + a_j$. Find all the numbers.'
    constraints: '$3 \le n \le 5000$, values up to $10^9$, at most $n$ questions.'
    budget: 'All pair sums are $n(n-1)/2 = 12497500$ questions. The limit is $n = 5000$, so each number may cost one question. A sum reaches $2 \cdot 10^9$, which needs 64 bits.'
    candidates:
    - tool: 'Ask every pair (brute force, topic 0.5)'
      verdict: rejected
      because: '12497500 questions against a limit of 5000.'
    - tool: 'Halving (the card "Halving under a query budget")'
      verdict: rejected
      because: 'No reply says on which side of a probe a value lies, so there is no threshold to cut on.'
    - tool: 'Equations from the replies (this card)'
      verdict: chosen
      because: 'Three sums give three numbers and one sum each gives the rest (Theorem 1.8.3): exactly $n$ questions.'
    property_check: 'The sums $a_1 + a_2$, $a_1 + a_3$ and $a_2 + a_3$ add to $2(a_1 + a_2 + a_3)$ and give $a_1$ exactly; each further number is a sum with $a_1$ minus $a_1$. The replies are independent equations: the property holds.'
    decision: 'Ask the three sums, compute $a_1 = (s_{12} + s_{13} - s_{23})/2$, then ask $s_{1i}$ for $i \ge 4$. $n$ questions, 64-bit sums.'
  examples:
    positive:
    - inline:
        input: 'The judge holds 7 2 9 4 and answers the sum of the two numbers named in a question. Find the numbers.'
        answer: '7,2,9,4 (4 questions)'
        why: 'The replies to "? 1 2", "? 1 3" and "? 2 3" are 9, 16 and 11, so $a_1 = (9 + 16 - 11)/2 = 7$, and "? 1 4" gives 11, so $a_4 = 4$ (Theorem 1.8.3).'
    - worked_example: lc-find-the-original-array-of-prefix-xor
      why: 'The given array holds xors of neighbouring values and the first value is known, so each value follows from the previous one by one equation: the same chain as $a_i = s_{1i} - a_1$.'
    negative:
    - inline:
        input: 'The judge holds 6 3 5 but answers the xor of the two numbers. The sum formula is applied to the replies.'
        answer: '6 (the first number)'
        method_gives: '1'
        why: 'The three xors 5, 3, 6 satisfy $5 \oplus 3 \oplus 6 = 0$, a different relation from the sum formula, so $(5 + 3 - 6)/2 = 1$ is not $a_1$. Xor replies need one anchor (for example one "and" reply) before any number is known.'
      correct_tool:
        topic: '1.7'
        card: xor-identities
    - problem: cses-1646
      why: 'The numbers are given in the input and only range sums are asked, so there is nothing to solve for: prefix sums answer each range in $O(1)$.'
      correct_tool:
        topic: '1.2'
        card: range-sum
  lookalikes:
  - description: 'Range sums of an array that is given in the input'
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: 'With the array given, the sums are computed. With hidden numbers the sums are replies, and the numbers must be solved from them.'
  - description: 'Xor replies of hidden numbers'
    tool:
      topic: '1.7'
      card: xor-identities
    flipping_difference: 'Three xors of three numbers always combine to 0, so they cannot fix the numbers; one reply of another kind (an "and" reply) or a known number is needed.'
  complexity: '$n$ questions, $O(n)$ time; sums need 64-bit integers.'
problems:
- id: ac-abc299_d
  role: worked_example
  summary: 'A hidden 0/1 string of length $N$ up to $2 \cdot 10^5$ that starts with 0 and ends with 1; with at most 20 questions "? i" (the value of $S_i$), print a position where the value changes.'
- id: lc-guess-number-higher-or-lower
  role: ladder
  card: halving
  rung: 1
  twist: 'Base case of the card: a three-way reply (lower, higher, equal) and a plain halving.'
  summary: 'Find a picked number between 1 and $n$ (up to $2^{31} - 1$) by calling guess(m), which says whether m is too high, too low or right.'
  hints:
  - 'What does one call of guess tell you about all the numbers on one side of m?'
  - 'The reply is monotone in m: every number above the pick says "too high" and every number below says "too low". Keep a range that contains the pick.'
  - 'Keep lo and hi, call guess on the middle with mid = lo + (hi - lo) / 2 so that the sum cannot overflow, and shrink the range until it holds one number.'
- id: cf-1807E
  role: ladder
  card: halving
  rung: 2
  twist: 'The reply is a total weight, not a direction: compare it with a prefix sum to get the yes or no (prefix sums, topic 1.2).'
  summary: 'n piles of stones where the stones of one pile are heavier; a question gives the total weight of chosen piles; find the heavy pile with at most 30 questions.'
  hints:
  - 'If you ask for piles 1 to m, what would the reply be if the heavy pile was not among them?'
  - 'The reply is larger than the number of stones in piles 1 to m exactly when the heavy pile is among them, so "heavy pile at most m" is a monotone yes or no.'
  - 'Build prefix sums of the pile sizes, binary search on m with the question for piles 1 to m, at most 18 questions.'
- id: cf-1520F1
  role: ladder
  card: halving
  rung: 3
  twist: 'The reply is a count over a prefix; the question is the first prefix with at least k zeros.'
  summary: 'A hidden 0/1 array; a question gives the sum of a range; find the position of the k-th zero with at most 25 questions.'
  hints:
  - 'How many zeros are in the first m cells, and how can one question tell you that?'
  - 'The number of zeros among the first m cells never decreases as m grows, so "at least k zeros in the first m cells" is monotone in m.'
  - 'Binary search on m: zeros(m) is m minus the reply for the range 1 to m; the answer is the smallest m with zeros(m) at least k.'
- id: cf-1103B
  role: ladder
  card: halving
  rung: 4
  twist: 'The upper end is not known: double the probe first, then halve between the last two probes.'
  summary: 'A hidden number up to $10^9$ and a judge that compares two remainders modulo it; find the number with at most 60 questions.'
  hints:
  - 'You know no upper bound for the hidden number. How can you find one with about 30 questions?'
  - 'Probe 1, 2, 4, 8 and so on until the reply changes: the number lies between the last two probes, and a range of that size can be halved.'
  - 'Doubling costs about $\log_2$ of the number and halving costs about the same, so about 60 questions in all; choose the two numbers of each question so that the reply is monotone in the probe.'
- id: cf-1479A
  role: ladder
  card: compare-halving
  rung: 1
  twist: 'Base case of the card: compare two neighbours and keep the side where the numbers go down.'
  summary: 'A hidden permutation of 1 to $n$ (up to $10^5$); a question reads one number; find a position smaller than both neighbours with at most 100 questions.'
  hints:
  - 'Think of the numbers outside the array as infinite. What does a number at the left end that is smaller than its right neighbour tell you?'
  - 'If a[lo - 1] is larger than a[lo] and a[hi] is smaller than a[hi + 1], a local minimum lies in lo to hi. Reading two neighbours in the middle keeps this on one half.'
  - 'While lo < hi read a[mid] and a[mid + 1]; if a[mid] is larger go to mid + 1 to hi, else lo to mid. About 34 reads.'
- id: cf-1486C2
  role: ladder
  card: compare-halving
  rung: 2
  twist: 'The reply is a position of the second largest; the budget allows one question per step, so a previous reply is reused.'
  summary: 'A hidden permutation; a question about a range gives the position of the second largest number in it; find the position of the largest with at most 20 questions.'
  hints:
  - 'Where is the largest number of a range, compared with the position that the question returns?'
  - 'The largest is on the same side of the returned position as the number you are looking for; ask again about that side, and if the reply is the same position then the largest is inside it.'
  - 'Keep a range that contains the largest, reuse the previous reply for the half you do not ask again, so each step costs one question and 17 steps are enough.'
- id: cf-1019B
  role: ladder
  card: compare-halving
  rung: 3
  twist: 'The compared quantity is a difference with a sign change, and the impossible case is decided by a parity.'
  summary: 'Students sit at a round table, neighbouring numbers differ by exactly 1; find two students opposite each other with equal numbers, or say there are none, with at most 60 questions.'
  hints:
  - 'Look at the difference between a student and the student opposite. What happens to it when you move to the next student?'
  - 'The difference changes by 0 or 2 at each step, and at the opposite positions it has opposite signs, so it must pass through 0 when the half circle between them has the right parity.'
  - 'Binary search on the sign of the difference; if the number of students leaves remainder 2 when divided by 4, print -1 without asking.'
- id: ac-abc337_e
  role: ladder
  card: equation-queries
  rung: 1
  twist: 'Base case of the card: design all questions first so that every reply is one bit of the answer.'
  summary: 'N bottles (up to 100) with one bad; call the fewest friends, give each a set of bottles, read who got sick, and name the bad bottle.'
  hints:
  - 'How many different outcomes can M friends show? What does that say about M?'
  - '$M$ friends show $2^M$ outcomes, so $M$ must be the smallest number with $2^M$ at least $N$. Let each friend be one bit of the bottle number.'
  - 'Friend j gets the bottles whose number minus 1 has bit j set; the sick friends spell the number minus 1 in binary.'
- id: cf-1425F
  role: ladder
  card: equation-queries
  rung: 2
  twist: 'Replies are sums of ranges; prefix sums are turned back into numbers.'
  summary: 'Hidden numbers in n cages (up to 1000); a question gives the sum over a range of at least two cages; find every number with at most n questions.'
  hints:
  - 'If you could ask for the sum of the first m cages for every m, how would you get each number?'
  - 'Ranges of one cage are not allowed, so the first prefix you can ask is the first two cages; one more question about two other cages separates them.'
  - 'Ask the prefix sums for m from 2 to n and the sum of cages 2 and 3 as the last question; then the first number follows by subtraction and the others are differences of prefix sums.'
- id: cf-1556D
  role: ladder
  card: equation-queries
  rung: 3
  twist: 'The replies are an and and an or; the identity a + b = (a or b) + (a and b) turns them into a sum.'
  summary: 'Hidden numbers; a question gives the and or the or of two of them; find the k-th smallest with at most 2n questions.'
  hints:
  - 'Is there a way to get the sum of two numbers from their and and their or?'
  - 'a + b equals (a or b) plus (a and b), so two questions give one pair sum, and pair sums are the equations of Theorem 1.8.3.'
  - 'Get the sums of the pairs (1,2), (1,3), (2,3), solve for the first three numbers, then one pair sum with the first number for each further one; sort and print the k-th.'
- id: cf-1451E1
  role: ladder
