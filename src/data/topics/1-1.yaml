  hints:
  - What happens at a pick-up point and at a drop-off point? What if both are at the same place?
  - +p at pick-up, −p at drop-off; the statement says drop-offs come first at the same place.
  - Sort events (place, change) so that negative changes come first at equal places, sweep, and fail if
    the load ever exceeds the capacity. (Places ≤ 1000 also allow a count per place.)
- id: ac-abc128_e
  role: ladder
  card: event-sweep
  rung: 3
  twist: Each roadwork must first be turned into an interval of start times, and the sweep keeps a multiset
    instead of a counter.
  summary: N roadworks block point X_i during a time window; Q ≤ 2·10^5 people start walking from 0 at
    given times; how far does each walk before hitting a blocked point (or −1)?
  hints:
  - A person starting at time D is at point X at time D + X. For which D does roadwork i stop them at
    X_i?
  - 'Exactly when S_i − X_i ≤ D < T_i − X_i: an interval of start times. A person stops at the smallest
    X among the roadworks whose interval contains D.'
  - 'Events: add X at S − X, remove X at T − X, query at D; sort with removals before additions before
    queries at equal times; keep a multiset (topic 0.6) and answer with its smallest element or −1.'
- id: cses-1074
  role: worked_example
  summary: Make n ≤ 2·10^5 sticks (lengths ≤ 10^9) all the same length, where changing a length by x costs
