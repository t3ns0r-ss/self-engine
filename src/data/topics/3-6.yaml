# Topic 3.6 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '3.6'
uses:
- topic: '0.4'
  what: Parity and divisibility arguments for games
- topic: '0.5'
  what: 'Brute force and nested loops: the reference solutions and expanding around centres'
- topic: '0.6'
  what: Heaps, stacks and counting maps
- topic: '1.1'
  what: Sorting
- topic: '1.2'
  what: 'Prefix sums: the sum of a segment in O(1)'
- topic: '1.3'
  what: Two pointers and fixed windows
- topic: '1.5'
  what: Greedy choices, taking the largest first
- topic: '2.1'
  what: Number theory
- topic: '2.3'
  what: Combinatorics
- topic: '3.1'
  what: 'Backtracking: trying every order of operations'
- topic: '3.2'
  what: 'Dynamic programming foundations: states and transitions (Theorem 3.2.1), filling in an acyclic
    order (Theorem 3.2.3), memoisation (Theorem 3.2.4) and reconstruction (Theorem 3.2.6)'
- topic: '3.4'
  what: 'Sequence DP: tables over pairs of prefixes, the model for the palindrome tables here'
- topic: '3.5'
  what: 'Counting DP: interval counts modulo a prime use the same sum rule'
theorems:
- id: 3.6.1
  title: Filling by length
  plain_words: When the value of a segment depends only on shorter segments inside it, compute the segments
    in order of increasing length. Looping over the left end first would ask for a value that has not
    been computed yet.
  code: 3.6/thm-1
- id: 3.6.2
  title: The best split point
  plain_words: 'Look at the last merge of a solution: it joins two blocks that were built separately and
    never interacted. So the best cost of a segment is the best, over the split point, of the two parts
    plus the cost of that last step.'
  code: 3.6/thm-2
- id: 3.6.3
  title: Score difference
  plain_words: When two players take from the ends of a row, what remains is always one segment. The score
    difference for the player to move is the best, over the two ends, of the number taken minus the opponent's
    difference on what is left.
  code: 3.6/thm-3
- id: 3.6.4
  title: Longest palindromic subsequence
  plain_words: For a segment, if the two end letters are equal they can both be used and the inside is
    solved on its own. If they differ, at least one end is unused, so drop it and take the better of the
    two shorter segments.
  code: 3.6/thm-4
- id: 3.6.5
  title: Pairing the first element
  plain_words: The first letter of a segment is either removed alone or removed together with a later
    equal letter, after everything between them is gone. Choosing that partner splits the segment into
    an inside part and an outside part that do not interact.
  code: 3.6/thm-5
cards:
- id: merge-split
  name: Best split point of a segment
  decisive_property: Some last (or first) event of a solution on [l, r] splits it into two contiguous
    parts that never interact (the last merge of neighbours, the first cut, the last balloon, the root
    of a tree), and its cost depends only on l, r and the split point; then best[l][r] is the best over
    k of the two parts plus that cost.
  from_theorem: 3.6.2
  how_to_test: Name the event that splits the segment; check that the two parts are independent and that
    the event's cost does not depend on how the parts were built; check n³ fits (n ≤ about 500).
  constraint_shapes:
  - 'n up to 400 piles: the (n − 1)! merge orders are impossible, while n² / 2 segments with n split points
    each are 2·10^7 steps.'
  weak_signals:
  - form: Merge neighbouring piles, each merge costing the total size
    shape: n up to 400
  - form: 'Cut a stick, bracket an expression, triangulate a polygon: the order of the operations matters'
    shape: n up to 100 to 500
  - form: An O(n³) budget with an order of operations to choose
    shape: n ≤ 500
  kill_signals:
  - 'Any two items may be merged, not only neighbours: for the piles 3 1 3 1 the free merges cost 15,
    but the neighbour table gives 16 (Huffman, a heap).'
  - 'n is up to 10^5: n³ is far too slow; look for a greedy or a formula.'
  in_action:
    statement: N slimes in a row with sizes a_i; combining two neighbours costs the sum of their sizes.
      Combine all into one at the least total cost.
    constraints: N ≤ 400.
    budget: 'Trying every order of merges is (N − 1)!. The table has 8·10^4 segments with up to 400 split
      points: 3·10^7 steps.'
    candidates:
    - tool: Greedy, merge the smallest neighbouring pair
      verdict: rejected
      because: For the piles 2 2 1 2 it merges 2 + 1 first and pays 15, while merging 2 + 2 and 1 + 2
        first pays 14.
    - tool: Table over segments with a split point
      verdict: chosen
      because: The last merge joins a block [l, k] and a block [k + 1, r] that never interacted, and costs
        the total of the segment.
    property_check: The two parts are independent and the last merge costs S(l, r) whatever k is (Theorem
      3.6.2).
    decision: 'best[l][l] = 0; for lengths 2..N: best[l][r] = the minimum over k of best[l][k] + best[k
      + 1][r], plus prefix[r] − prefix[l − 1].'
  examples:
    positive:
    - inline:
        input: Merge the piles 4 1 2 3, neighbours only, each merge costing the total
        answer: '19'
        why: 'For [1, 4]: k = 1 gives 0 + 9, k = 2 gives 5 + 5, k = 3 gives 10 + 0; the minimum is 9,
          plus the total 10: 19.'
    - worked_example: ac-dp_n
      why: The same neighbour merges with cost equal to the total size, with N up to 400.
    negative:
    - inline:
        input: Merge the piles 3 1 3 1 when any two piles may be merged, not only neighbours
        answer: '15'
        method_gives: '16'
        why: Without the neighbour rule the two smallest piles are merged first (Huffman), 2 + 5 + 8 =
          15; the neighbour table is too restrictive.
      correct_tool:
        topic: '0.6'
        card: heap-extract
    - problem: lc-palindrome-partitioning-ii
      why: The cuts are counted by the prefix covered, with the last piece being a palindrome; one index
        is enough and there is no split of a segment into independent parts.
      correct_tool:
        topic: '3.2'
        card: linear-state
  lookalikes:
  - description: Merge n ropes, any two at a time, each merge costing their total length
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: Without the neighbour rule, merging the two smallest ropes first is optimal (Huffman),
      O(n log n) with a heap; with neighbours only, the greedy fails and the split-point table is needed.
  complexity: O(n³) time, O(n²) memory.
- id: take-from-ends
  name: Taking from the ends
  decisive_property: Every step removes an item from the left or the right end (a game or a process),
    so what remains is always one segment [l, r] and the state needs nothing else; for a two-player game,
    store the score difference of the player to move.
  from_theorem: 3.6.3
  how_to_test: Check that only ends are removed; check whether anything besides the segment matters (whose
    turn follows from the length; a step count follows from l and the length); for games, check that the
    totals add up to a fixed sum.
  constraint_shapes:
  - 'n up to 5000 numbers: the play-by-play search is 2^n, while the table of segments is n² / 2 = 1.25·10^7
    entries.'
  weak_signals:
  - form: Two players alternately take the first or last element; both play optimally
    shape: n up to 1000 to 5000
  - form: Remove elements from either end; the i-th removal is weighted by i or by a multiplier
    shape: n up to 1000
  - form: A game on a row where only the ends are available
    shape: n up to 5000
  kill_signals:
  - 'Only one player and exactly k items are taken from the ends: with 1 79 80 1 1 1 200 1 and k = 3 the
    best is 202, while the game table gives the first player 282 against an opponent.'
  - 'Items can be taken from anywhere: for 1 3 9 3 the first player gets 12 by taking the largest first,
    while the ends-only table gives 10.'
  in_action:
    statement: Two players alternately take the first or the last number of a row; each wants the largest
      total. Print the first player's total.
    constraints: n ≤ 5000.
    budget: Searching every play is 2^n. The table has 1.25·10^7 entries, one row at a time.
    candidates:
    - tool: Greedy, take the larger end
      verdict: rejected
      because: For the row 3 9 1 2 it takes 3 and then lets the opponent have the 9, finishing with 5
        against 10, while the best is 11.
    - tool: Score-difference table over segments
      verdict: chosen
      because: After each move the remaining numbers are one segment, and the mover ends ahead by the
        best of a_l − D[l + 1][r] and a_r − D[l][r − 1].
    property_check: Only ends are removed, so the position is one segment, and the totals add up to the
      fixed sum (Theorem 3.6.3).
    decision: D[l][l] = a_l; D[l][r] = max(a_l − D[l + 1][r], a_r − D[l][r − 1]) by increasing length;
      print (sum + D[1][n]) / 2.
  examples:
    positive:
    - inline:
        input: The first player's total on the row 3 9 1 2, both players playing best
        answer: '11'
        why: 'D[1][4] = 7 and (15 + 7) / 2 = 11: take 2 first, so that the opponent has to open the 9.'
    - inline:
        input: The first player's total on the row 1 5 2
        answer: '3'
        why: D[1][3] = max(1 − D[2][3], 2 − D[1][2]) = max(1 − 3, 2 − 4) = −2, and (8 − 2) / 2 = 3.
    negative:
    - inline:
        input: One player takes exactly 3 cards from the ends of 1 79 80 1 1 1 200 1 (no opponent), with
          the game table
        answer: '202'
        method_gives: '282'
        why: Whatever the order, the cards not taken form one window of length n − k, so the best choice
          is the window with the smallest sum; the game table assumes an opponent takes cards.
      correct_tool:
        topic: '1.3'
        card: fixed-window
    - inline:
        input: Two players take from anywhere in the row 1 3 9 3, the first player's total, with the ends-only
          table
        answer: '12'
        method_gives: '10'
        why: When any number may be taken, the best play is to take the largest remaining each time, so
          sorting gives 9 + 3 = 12; a segment does not describe the state.
      correct_tool:
        topic: '1.5'
        card: extreme-first
  lookalikes:
  - description: Take exactly k cards in total from either end of a row to maximise their sum (no opponent)
    tool:
      topic: '1.3'
      card: fixed-window
    flipping_difference: Whatever the order, the cards not taken form one window of length n − k, so minimising
      that window's sum answers it in O(n); the segment table is needed when the order of removals matters
      (an opponent, weights by turn).
  complexity: O(n²) time; O(n) memory with one row per length.
- id: palindrome-segment
  name: Palindromes inside segments
  decisive_property: The question is about palindromes inside the string (the longest palindromic subsequence,
    fewest insertions or deletions, which substrings are palindromes), and the answer for [l, r] depends
    only on whether s_l = s_r and the answers for [l + 1, r − 1], [l + 1, r] and [l, r − 1].
  from_theorem: 3.6.4
  how_to_test: Write the case s_l = s_r (both ends used) and the case s_l ≠ s_r (drop one end); check
    n² fits (n ≤ about 5000).
  constraint_shapes:
  - 'n up to 5000 letters: the 2^n subsequences are impossible, while n² / 2 = 1.25·10^7 table entries
    are easy.'
  weak_signals:
  - form: Longest palindromic subsequence; fewest characters to insert or delete to get a palindrome
    shape: n up to 5000
  - form: Cut a string into the fewest palindromes, or into exactly k palindromes
    shape: n up to 2000
  - form: Count palindromic substrings, or answer many "is s[l..r] a palindrome" queries
    shape: n up to 5000
  kill_signals:
  - 'The palindrome must be contiguous: the longest palindromic substring of abcab is 1, while the longest
    palindromic subsequence is 3.'
  - 'The letters may be rearranged: the longest palindrome from the letters of abcab is 5, while the subsequence
    table gives 3; only the letter counts matter.'
  in_action:
    statement: Print the length of the longest palindromic subsequence of a string of length up to 5000.
    constraints: n ≤ 5000.
    budget: The 2^n subsequences are impossible. The table over segments has 1.25·10^7 entries, one row
      of memory per l.
    candidates:
    - tool: Try every subsequence
      verdict: rejected
      because: 2^5000 subsequences.
    - tool: Table P[l][r] over segments
      verdict: chosen
      because: If the ends are equal both can be used and the inside is solved; otherwise one end is dropped.
    property_check: The value for [l, r] depends only on the two end letters and shorter segments (Theorem
      3.6.4).
    decision: P[l][l] = 1; P[l][r] = P[l + 1][r − 1] + 2 if s_l = s_r, else max(P[l + 1][r], P[l][r −
      1]); print P[1][n].
  examples:
    positive:
    - inline:
        input: The longest palindromic subsequence of abcab
        answer: '3'
        why: For example aba or bcb; the ends a and b differ, so P = max(P[2][5], P[1][4]) = max(3, 3).
    - inline:
        input: The fewest insertions to make abcab a palindrome
        answer: '2'
        why: n − P[1][n] = 5 − 3 = 2.
    negative:
    - inline:
        input: The longest contiguous palindrome (substring) of abcab, computed as the longest palindromic
          subsequence
        answer: '1'
        method_gives: '3'
        why: A substring cannot skip letters; expanding around each of the 2n − 1 centres finds it with
          no table.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The longest palindrome that can be built by rearranging the letters of abcab
        answer: '5'
        method_gives: '3'
        why: 'Rearranging removes the order, so only the counts of each letter matter: the pairs a, b
          and one middle letter c give abcba.'
      correct_tool:
        topic: '0.6'
        card: map-counting
  lookalikes:
  - description: The longest palindromic substring (contiguous) of a string of length 1000
    tool:
      topic: '0.5'
      card: nested-loops
    flipping_difference: A contiguous palindrome is determined by its centre and radius, so expanding
      from each of the 2n − 1 centres finds it in O(n²) without any table; a subsequence may skip letters,
      which needs the segment table.
  complexity: O(n²) time and memory (or two rows by length).
- id: first-element-match
  name: The first element and its partner
  decisive_property: Elements are removed in groups that become contiguous only after the elements between
    them are removed (equal letters joined after the middle disappears, matching brackets), so the first
    element of [l, r] either goes alone or with some later partner k; fixing k splits the rest into the
    inside (l, k) and the outside [k, r], which do not interact.
  from_theorem: 3.6.5
  how_to_test: Ask what happens to s_l, alone or together with which k; check that the inside of (l, k)
    must be finished first and that joining s_l to k's group costs nothing extra (or add an index for
    what it costs).
  constraint_shapes:
  - 'n up to 500 letters: the sequences of deletions are exponential, while n² / 2 segments with n partners
    each are 6·10^7 steps.'
  weak_signals:
  - form: Delete blocks of equal letters; letters join after the middle is deleted; fewest operations
    shape: n up to 500
  - form: A printer that paints ranges, each new range over the old; fewest turns
    shape: n up to 500
  - form: Remove pairs of matching elements, possibly after removing what is between them
    shape: n up to 500
  kill_signals:
  - 'Only adjacent equal pairs may be deleted: abab cannot be deleted completely, so the answer is impossible,
    while the block-deletion table needs 3 operations; a stack decides it.'
  - 'The cost of a group depends on its size: the state needs one more index, the number of equal elements
    attached.'
  in_action:
    statement: One operation deletes a contiguous block of equal letters; print the fewest operations
      that delete the whole string.
    constraints: n ≤ 500.
    budget: 'The sequences of deletions are exponential. The table has 1.25·10^5 segments with up to 500
      partners: 6·10^7 steps.'
    candidates:
    - tool: Greedy, delete the longest block first
      verdict: rejected
      because: Deleting a letter between two equal letters can join them into one block, which a greedy
        by block length does not see.
    - tool: Table over segments, the first letter alone or with a partner
      verdict: chosen
      because: Choosing the partner k splits the segment into the inside (l, k), finished first, and the
        outside [k, r], where s_l rides along at no cost.
    property_check: The inside and the outside do not interact, and joining s_l to its partner costs nothing
      extra (Theorem 3.6.5).
    decision: C[l][r] = min(1 + C[l + 1][r], the minimum over k with s_k = s_l of C[l + 1][k − 1] + C[k][r]);
      print C[1][n].
  examples:
    positive:
    - inline:
        input: The fewest block deletions for abaca
        answer: '3'
        why: 'Delete b, delete c, then the three a''s are neighbours and go in one operation: the first
          a pairs with the a at position 3, 1 + 2.'
    - inline:
        input: The fewest block deletions for aba
        answer: '2'
        why: Delete b, then the two a's are neighbours and form one block.
    negative:
    - inline:
        input: Delete abab completely when only adjacent equal pairs may be deleted (a stack), computed
          as block deletions
        answer: '-1'
        method_gives: '3'
        why: With pairs only, abab stays as it is, so it cannot be emptied; a stack that pops a letter
          equal to the top decides this in one pass.
      correct_tool:
        topic: '0.6'
        card: stack-queue
    - problem: ac-dp_n
      why: Neighbouring piles are merged with a cost that is the total of the segment, so the last merge
        splits the segment, not a partner of the first element.
      correct_tool:
        topic: '3.6'
        card: merge-split
  lookalikes:
  - description: Repeatedly delete two adjacent equal letters until none remain; print the final string
    tool:
      topic: '0.6'
      card: stack-queue
    flipping_difference: Every order of deletions leaves the same string, so one pass with a stack simulates
      it; with a choice of which blocks to delete and a count to minimise, the segment table is needed.
  complexity: O(n³) time, O(n²) memory.
problems:
- id: ac-dp_n
  role: worked_example
  summary: Combine N ≤ 400 slimes in a row, two neighbours at a time, each combination costing the new
    size; the least total cost.
- id: lc-palindrome-partitioning-ii
  role: worked_example
  summary: Cut a string (length ≤ 2000) into palindromes with the fewest cuts.
- id: lc-minimum-cost-tree-from-leaf-values
  role: ladder
  card: merge-split
  rung: 1
  twist: Base case of the card
  summary: Build a binary tree whose leaves, read left to right, are a given array (n ≤ 40) and where
    each inner node is the product of the largest leaf in its left and in its right subtree; minimise
    the sum of the inner nodes.
  hints:
  - The root splits the leaves into two groups. What do the groups look like?
  - A left block [l, k] and a right block [k + 1, r] of the array, built independently; the root costs
    max(l..k) · max(k + 1..r).
  - cost[l][r] = min over k of cost[l][k] + cost[k + 1][r] + maxLeft · maxRight (Theorem 3.6.2); precompute
    the range maxima.
- id: lc-minimum-score-triangulation-of-polygon
  role: ladder
  card: merge-split
  rung: 2
  twist: The split point is a vertex shared by both parts.
  summary: Triangulate a convex polygon with n ≤ 50 vertices carrying values; a triangle scores the product
    of its three values. Minimise the total score.
  hints:
  - The edge between vertices i and j belongs to exactly one triangle of the part of the polygon between
    them. Which?
  - Triangle (i, k, j) for some k between them; it splits the part into the polygons i..k and k..j, which
    are triangulated independently.
  - best[i][j] = min over i < k < j of best[i][k] + best[k][j] + v_i·v_k·v_j, with best = 0 when j = i
    + 1; answer best[0][n − 1].
- id: lc-minimum-cost-to-cut-a-stick
  role: ladder
  card: merge-split
  rung: 3
  twist: 'Cutting instead of merging: the first cut splits the stick, and the segments are between cut
    positions.'
  summary: Make all given cuts (up to 100) in a stick of length n; each cut costs the length of the piece
    being cut. Minimise the total cost.
  hints:
  - Which event splits the problem into independent pieces?
  - 'The first cut made in a piece: after it, the two sides are cut independently, and it costs the piece''s
    length whatever happens later.'
  - Sort the cuts and add 0 and n at the ends; cost[i][j] = (c_j − c_i) + min over i < k < j of cost[i][k]
    + cost[k][j], with cost = 0 when no cut lies inside.
- id: lc-burst-balloons
  role: ladder
  card: merge-split
  rung: 4
  twist: The last event inside the segment, not the first, keeps the parts independent.
  summary: Burst all balloons (n ≤ 300) with values; bursting one earns the product of its value and its
    current neighbours' values (1 beyond the ends). Maximise the total.
  hints:
  - If you choose the first balloon to burst, its neighbours change later. What if you choose the last
    one in an open interval (l, r)?
  - When k is the last balloon burst between l and r, its neighbours at that moment are exactly l and
    r, and the balloons on each side of k never meet each other.
  - Pad with 1 at both ends; best[l][r] = max over l < k < r of best[l][k] + best[k][r] + v_l·v_k·v_r
    over open intervals, filled by length.
- id: cf-1312E
  role: ladder
  card: merge-split
  rung: 5
  twist: The interval table answers "can [l, r] shrink to one value?", and a second table over prefixes
    uses it.
  summary: Repeatedly replace two equal neighbours v, v by one element v + 1 in an array (n ≤ 500); the
    smallest possible final length.
  hints:
  - When can a whole segment [l, r] become one element, and what value would it have?
  - Its last step joins two parts [l, k] and [k + 1, r] that each became the same value v − 1; the value
    is then determined by the segment.
  - val[l][r] = v + 1 if val[l][k] = val[k + 1][r] = v for some k (else none); then minLen[i] = min over
    j with val[j][i] defined of minLen[j − 1] + 1.
- id: cf-1025D
  role: ladder
  card: merge-split
  rung: 6
  twist: The root of a subtree is the split point, and the state remembers which side its parent is on.
  summary: Given n ≤ 700 sorted distinct numbers, decide whether they can form a binary search tree in
    which every edge joins two numbers with a common divisor greater than 1.
  hints:
  - In a binary search tree, the keys of a subtree form a segment of the sorted list. Where is its parent?
  - 'Just outside the segment: at position l − 1 or r + 1. A segment is fine if some root k inside has
    gcd > 1 with that parent and both sides [l, k − 1] and [k + 1, r] are fine with parent k.'
  - ok[l][r][side] over segments, trying every root k; precompute a gcd table. O(n³) with small constants;
    the answer is ok for the whole list with no parent.
- id: ac-dp_l
  role: ladder
  card: take-from-ends
  rung: 1
  twist: Base case of the card
  summary: Two players alternately remove the first or last element of a sequence (N ≤ 3000); the first
    maximises and the second minimises X − Y, the difference of their totals. Print X − Y.
  hints:
  - After some moves, what is left, and what number describes the game from there?
  - A segment [l, r]; the score difference for the player to move (Theorem 3.6.3).
  - diff[l][r] = max(a_l − diff[l + 1][r], a_r − diff[l][r − 1]); the answer is diff for the whole row.
    Use long long.
- id: cses-1097
  role: ladder
  card: take-from-ends
  rung: 2
  twist: The first player's total instead of the difference.
  summary: Two players alternately take the first or last number of a list (n ≤ 5000); both maximise their
    own totals. Print the first player's total.
  hints:
  - How do the first player's total, the second player's total, the difference and the sum relate?
  - They add up to the sum S and differ by D, so the first total is (S + D) / 2.
  - Compute D as in Deque with one array per length (n² long longs would be 200 MB); print (S + D) / 2.
- id: lc-stone-game-vii
  role: ladder
  card: take-from-ends
  rung: 3
  twist: A move scores the sum of what remains, not the item taken.
  summary: Players alternately remove the leftmost or rightmost stone (n ≤ 1000) and score the sum of
    the remaining stones; the first maximises, the second minimises the difference. Return the difference.
  hints:
  - What does removing a_l score, and what is left for the opponent?
  - It scores sum(l + 1..r) and leaves the segment [l + 1, r] to the opponent.
  - diff[l][r] = max(sum(l + 1, r) − diff[l + 1][r], sum(l, r − 1) − diff[l][r − 1]) with prefix sums.
- id: lc-maximum-score-from-performing-multiplication-operations
  role: ladder
  card: take-from-ends
  rung: 4
  twist: 'One player, weights by turn, and n up to 10^5 but only m ≤ 300 removals: describe the segment
    by (operations done, how many from the left).'
  summary: 'Perform m ≤ 300 operations on an array of n ≤ 10^5: the i-th takes the first or last element
    x, scores multipliers[i] · x, and removes it. Maximise the score.'
  hints:
  - A segment table over n = 10^5 is too big. After i operations, what determines the remaining segment?
  - 'How many of the i elements came from the left: then the left end and the right end are both known.'
  - dp[i][left] over 0 ≤ left ≤ i ≤ m; take nums[left] or nums[n − 1 − (i − left)]. O(m²).
- id: cf-1336C
  role: ladder
  card: take-from-ends
  rung: 5
  twist: 'Adding to both ends instead of removing: the filled positions are a segment, and the count is
    modulo a prime.'
  summary: Take the letters of S (|S| ≤ 3000) in order and put each at the front or the back of a string
    A; count the operation sequences after which (at some point) A starts with T, modulo 998244353.
  hints:
  - After i letters have been placed, which positions of the final string do they occupy?
  - 'A contiguous block [l, r] of length i: each letter goes just before or just after the block.'
  - ways[l][r] = ways to fill positions l..r with the first r − l + 1 letters so that they agree with
    T where T has a letter (positions beyond |T| match anything); extend by placing the next letter at
    l − 1 or r + 1; sum ways[0][r] for r ≥ |T| − 1.
- id: lc-palindromic-substrings
  role: ladder
  card: palindrome-segment
  rung: 1
  twist: Base case of the card
  summary: Count the palindromic substrings of a string of length ≤ 1000 (different positions count separately).
  hints:
  - When is s[l..r] a palindrome, in terms of a shorter substring?
  - When s_l = s_r and s[l + 1..r − 1] is a palindrome (or is empty or one letter).
  - pal[l][r] by increasing length (or l downwards); count the true entries.
- id: lc-minimum-insertion-steps-to-make-a-string-palindrome
  role: ladder
  card: palindrome-segment
  rung: 2
  twist: The fewest insertions, not the longest palindrome.
  summary: The fewest characters to insert anywhere into a string (length ≤ 500) to make it a palindrome.
  hints:
  - Which letters of s can stay unpaired with an inserted letter?
  - 'Those of a palindromic subsequence: they pair with each other, and every other letter needs a new
    partner.'
  - Answer n − (longest palindromic subsequence) (Theorem 3.6.4); or ins[l][r] = ins[l + 1][r − 1] if
    the ends are equal, else 1 + min of the two shorter segments.
- id: lc-maximize-palindrome-length-from-subsequences
  role: ladder
  card: palindrome-segment
  rung: 3
  twist: 'The palindrome must use both strings: its outermost pair has one end in each.'
  summary: Choose a non-empty subsequence of word1 and one of word2 (lengths ≤ 1000) and concatenate them;
    the longest palindrome you can get (0 if none).
  hints:
  - Work on s = word1 + word2. What must be true of the two outermost letters of the palindrome?
  - They are equal, the left one lies in word1 and the right one in word2; everything between is any palindromic
    subsequence of the inside.
  - Fill the palindromic-subsequence table P of s; answer the max of 2 + P[i + 1][j − 1] over i in word1,
    j in word2 with s_i = s_j.
- id: cf-245H
  role: ladder
  card: palindrome-segment
  rung: 4
  twist: 'Up to 10^6 queries: a second table counts the palindromes inside every segment.'
  summary: Answer up to 10^6 queries "how many palindromic substrings does s[l..r] have" for a string
    of length ≤ 5000.
  hints:
  - With the table pal[l][r], how do you count the palindromes inside [l, r] from smaller segments?
  - 'Inclusion–exclusion: those inside [l + 1, r], plus those inside [l, r − 1], minus those counted twice
    inside [l + 1, r − 1], plus [l, r] itself.'
  - cnt[l][r] = cnt[l + 1][r] + cnt[l][r − 1] − cnt[l + 1][r − 1] + pal[l][r]; answer each query in O(1).
    Use fast input and output; 25·10^6 ints fit.
- id: cf-1132F
  role: ladder
  card: first-element-match
  rung: 1
  twist: Base case of the card
  summary: Delete a string (length ≤ 500) by repeatedly removing a contiguous block of equal letters;
    the fewest operations.
  hints:
  - What happens to the first letter s_l?
  - Either it is removed on its own, or together with some later equal letter s_k, after everything between
    them is gone (Theorem 3.6.5).
  - C[l][r] = min(1 + C[l + 1][r], min over k with s_k = s_l of C[l + 1][k − 1] + C[k][r]); O(n³).
- id: lc-strange-printer
  role: ladder
  card: first-element-match
  rung: 2
  twist: 'Printing over earlier prints instead of deleting: the same pairing of the first letter.'
  summary: A printer prints a run of one letter over any range in one turn, covering what was there; the
    fewest turns to print a given string (length ≤ 100).
  hints:
  - The first letter must be printed by some turn. What else might that turn usefully print?
  - 'Later letters equal to it: s_l can share its turn with an equal s_k, and everything between them
    is printed on top later, independently.'
  - turns[l][r] = min(1 + turns[l + 1][r], min over k with s_k = s_l of turns[l + 1][k − 1] + turns[k][r]),
    the same recurrence as Clear the String.
- id: lc-remove-boxes
  role: ladder
  card: first-element-match
  rung: 3
  twist: The score of a group depends on its size, so the state counts how many equal boxes are attached.
  summary: Remove boxes (n ≤ 100, coloured) in groups of contiguous equal colours; a group of k boxes
    scores k². Maximise the total.
  hints:
  - If the first box waits to be removed together with a later box of its colour, how much does that group
    score?
  - It depends on how many boxes end up in the group, so the state must know how many equal boxes are
    already waiting on the left.
  - 'best[l][r][t] with t equal boxes attached to box l: remove them now ((t + 1)² + best[l + 1][r][0])
    or join a later equal box m (best[l + 1][m − 1][0] + best[m][r][t + 1]). O(n⁴) with small constants.'
- id: ac-abc217_f
  role: ladder
  card: first-element-match
  rung: 4
  twist: 'Count the orders, not the minimum: the two independent parts interleave, counted by a binomial
    coefficient.'
  summary: 2N ≤ 400 people stand in a row; a pair of neighbours who are friends can leave, closing the
    gap. Count the orders in which everyone leaves, modulo 998244353.
  hints:
  - The first person of a segment leaves together with someone. Who, and what must happen first?
  - With some friend k, after everyone between them has left; the people after k leave independently of
    those between.
  - 'ways[l][r] = Σ over friends k with an even inside of ways[l + 1][k − 1] · ways[k + 1][r] · C(pairs
    in [l, r], pairs in [l, k]): the pairs of [l, k] (ending with l–k) interleave with the pairs of [k
    + 1, r].'
- id: lc-different-ways-to-add-parentheses
