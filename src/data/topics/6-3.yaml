decision_map:
- weak_signal: How many strings begin with a given string; the longest common prefix of a string with
    the others; the sum of common prefixes over all pairs; a best value kept for every prefix
  choose: prefix-tree
  when: The questions are about beginnings and the answer for a beginning is kept on one node of a shared
    tree (Theorems 6.3.1 and 6.3.2).
  over:
  - card: sorted-search
    topic: '1.4'
    because: For a fixed set and plain counts, sorted words with two binary searches give a count without
      building a tree.
  - card: map-counting
    topic: '0.6'
    because: Whole strings compared as objects (anagrams, equal words) need a map, not a tree.
- weak_signal: At each place of a text, which dictionary words start there; cutting a string into dictionary
    words with a large dictionary
  choose: dictionary-split
  when: One walk of the text down the trie lists all the words that begin at the place (Theorem 6.3.3).
  over:
  - card: linear-state
    topic: '3.2'
    because: With a small dictionary or short words, a set of substrings gives the words of each place;
      the DP is the same.
  - card: pattern-occurrences
    topic: '6.2'
    because: One pattern is matched with the prefix function; many words that begin at every place use
      the trie.
- weak_signal: The largest XOR of a number with a stored set that changes; the best subarray XOR in a
    window; the number of XOR values below a bound
  choose: binary-xor
  when: Numbers below 2^B in a binary trie with counts, one walk of B digits per question (Theorems 6.3.4
    and 6.3.5).
  over:
  - card: high-bit-first
    topic: '1.7'
    because: A fixed array and one question about the largest XOR of a pair can be solved by building
      the answer from the top digit with a set of prefixes.
  - card: per-bit-contribution
    topic: '1.7'
    because: A sum of XORs over all pairs separates by bit; no trie is needed.
  - card: prefix-xor
    topic: '1.7'
    because: The XOR of a given range is two prefix values; the trie is for the best range or for counting
      ranges by their XOR.
- weak_signal: A board or a string explored by backtracking where a branch can be dropped as soon as no
    dictionary word begins with the letters so far
  choose: prefix-tree
  when: The trie tells at each step whether any word still begins with the letters read (Theorem 6.3.1
    (b)), so dead branches are cut at once.
  over:
  - card: generate-all
    topic: '3.1'
    because: Backtracking without a trie tries every continuation and tests the word at the end.
  - card: bound-pruning
    topic: '3.1'
    because: A numeric bound prunes by value; a trie prunes by whether a word can still be formed.
glossary_added:
- trie
- pass count
- binary trie
