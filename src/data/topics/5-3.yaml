drill:
- problem: cf-339D
  answer:
    topic: '5.3'
    card: point-update-range-query
  property: The levels of the halving are the levels of the tree, so a change recomputes one leaf-to-root
    path; the join at each node depends on its level (OR or XOR), and the root holds the answer.
  why_others_fail: The whole array changes its meaning after every change, so a table or prefix sums cannot
    be reused; a scan of 2^17 numbers per change is 1.3·10^10 steps.
- problem: cf-1234D
  answer:
    topic: '5.3'
    card: point-update-range-query
  property: A node can keep a 26-bit mask of the letters in its range (join by OR); a change recomputes
    one path and the answer is the number of 1 bits of the OR over the range.
  why_others_fail: Counting different values in general needs a sweep, but there are only 26 letters,
    so a mask per node is a fixed-size summary that joins directly.
- problem: cses-3226
  answer:
    topic: '5.3'
    card: custom-node
  property: The best stretch of a range is a combination of four facts about its parts (sum, best prefix,
    best suffix, best); the query joins the whole nodes in order.
  why_others_fail: A sparse table needs an operation that tolerates overlap, and the best-subarray join
    does not (the overlap would be counted twice).
- problem: cf-380C
  answer:
    topic: '5.3'
    card: custom-node
  property: A node keeps the number of matched pairs, the unmatched "(" and the unmatched ")"; joining
    two nodes matches min(open of the left, close of the right) more pairs.
  why_others_fail: Prefix counts of brackets give the balance of a range but not how many pairs are matched
    inside it, because a closing bracket early in the range matches nothing.
- problem: lc-my-calendar-iii
  answer:
    topic: '1.2'
    card: difference-array
  property: 'With at most 400 calls, keep a sorted map of +1 at each start and −1 at each end and scan
    it after every booking: 400 · 800 steps.'
  why_others_fail: A lazy tree over the times up to 10^9 needs a dynamic tree and much more code; the
    limit makes a plain scan of the events enough.
- problem: cf-1198B
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: A person who is never set again ends with the larger of their money and the largest payout
    after their last change, which is a suffix maximum over the events.
  why_others_fail: A lazy tree with a "raise to at least x" tag also works, but every question comes at
    the end, so one backward pass with a running maximum is shorter and has no log.
- problem: lc-count-integers-in-intervals
  answer:
    topic: '0.6'
    card: ordered-set-lookup
  property: Keep the disjoint intervals in a sorted container; a new interval absorbs all the intervals
    it touches, and the total is updated as intervals are merged. Each interval is merged away once, so
    the work is amortised.
  why_others_fail: A dynamic segment tree with assign tags works, but the sorted container has less code
    and the same total time.
- problem: lc-fruits-into-baskets-iii
  answer:
    topic: '5.3'
    card: tree-descent
  property: A tree of maximums over the basket capacities finds the first basket with enough capacity
    by one walk down; the basket is then used up (set to 0).
  why_others_fail: A sorted set of capacities finds the smallest capacity that fits, not the first basket
    by position, and a scan per fruit is 10^10 steps.
lookalike_pairs:
- a: ac-abc341_e
  b: ac-practice2_l
  a_tool:
    topic: '5.3'
    card: point-update-range-query
  b_tool:
    topic: '5.3'
    card: lazy-range-update
  shared_surface: Both flip every bit in a range of a 0/1 sequence of up to 5·10^5 places and then ask
    a question about a range.
  flipping_difference: In Alternating String let d_i say whether neighbours i and i + 1 are equal. A flip
    of [L, R] keeps d unchanged inside the range and changes only d at L − 1 and at R, so two point changes
    and a range sum answer it. In Lazy Segment Tree the asked count of inversions changes for every pair
    inside the flipped range, so a flip tag on whole nodes is needed.
  flipping_input: 'S = 0101. Flip positions 2..3: S = 0011. The equal-neighbour marks d go from (0, 0,
    0) to (0, 1, 0): only the marks at 1 (= L − 1) and 3 (= R) changed. For 1010 the inversions (a 1 before
    a 0) are 3; after flipping all four bits, 0101, they are 1: the pairs inside all changed.'
- a: ac-practice2_j
  b: ac-practice2_b
  a_tool:
    topic: '5.3'
    card: tree-descent
  b_tool:
    topic: '5.2'
    card: updates-and-range-sums
  shared_surface: Both keep a sequence of up to 5·10^5 numbers with single changes and ask about ranges.
  flipping_difference: In Fenwick Tree the range sum is the difference of two prefix sums, so a Fenwick
    tree is enough. In Segment Tree the range maximum cannot be got from prefixes, and the third question
    (the first position with a value at least v) needs the walk down node maxima, so a segment tree is
    needed.
  flipping_input: A = [5, 1, 4]. The sum of positions 2..3 is prefix(3) − prefix(1) = 10 − 5 = 5. The
    maximum of positions 2..3 is 4, but the prefix maximums are 5 up to 1 and 5 up to 3; the two prefixes
    cannot give it.
self_test:
- q: For a = [3, 1, 4, 1, 5, 9, 2, 6] build the tree of sums of Theorem 5.3.1. How many nodes does it
    have, and what do the root and its two children hold?
  a: There are 2n − 1 = 15 nodes. The root covers 0..7 and holds 31; its left child covers 0..3 and holds
    3 + 1 + 4 + 1 = 9; its right child covers 4..7 and holds 5 + 9 + 2 + 6 = 22.
- q: For the same array, which whole nodes does the query for the minimum of positions 2..6 take, and
    what is the answer?
  a: The nodes 2..3, 4..5 and 6..6 (the root and the nodes 0..3, 4..7 and 6..7 are opened; 0..1 and 7..7
    are outside). Their minimums are 1, 5 and 2, so the answer is 1.
- q: Set a_5 to 0 (positions counted from 0). Which nodes are recomputed, and what is the minimum of the
    whole array afterwards?
  a: 'The nodes whose range contains position 5: 0..7, 4..7, 4..5 and 5..5, from the leaf up. The minimum
    of 3, 1, 4, 1, 5, 0, 2, 6 is 0.'
- q: With the tree of sums, add 10 to positions 2..5. Which nodes receive a tag, and what do their sums
    become?
  a: 'The nodes taken whole are 2..3 and 4..5. Their sums become 5 + 20 = 25 and 14 + 20 = 34, each with
    the tag 10. The nodes above them are recomputed without a tag: 0..3 becomes 4 + 25 = 29, 4..7 becomes
    34 + 8 = 42 and the root 71.'
- q: 'Continue: ask for the value at position 3. What is pushed on the way, and what is the answer?'
  a: 'The query opens the root (no tag), the node 0..3 (no tag) and the node 2..3, which has the tag 10:
    it gives 10 to the leaves 2 and 3 and clears its own tag. The leaf 3 held 1 and now holds 11, so the
    answer is 11.'
- q: A node of length 3 first gets "set to 5" and then "add 2". What is its tag, and what is its sum?
    What if the two operations come in the other order?
  a: 'Set to 5 is (0, 5), then add 2 is (1, 2): the composition is (1 · 0, 1 · 5 + 2) = (0, 7), so every
    value is 7 and the sum is 21. In the other order, add 2 is (1, 2) and then set to 5 is (0, 5): the
    composition is (0 · 1, 0 · 2 + 5) = (0, 5), every value is 5 and the sum is 15. The order matters.'
- q: Join the nodes of [3, -5] and [4, -1] for the best non-empty subarray. What are the four numbers
    of each part and of the whole, and what is the best?
  a: 'The left part: sum −2, prefix 3, suffix −2, best 3. The right part: sum 3, prefix 4, suffix 3, best
    4. The whole: sum 1, prefix max(3, −2 + 4) = 3, suffix max(3, 3 − 2) = 3, best max(3, 4, −2 + 4) =
    4. The best stretch is the single 4.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-1567E
  - cses-1735
  - cf-914D
decision_map:
- weak_signal: Changes to single values mixed with questions about the minimum, maximum or GCD of a range,
    with n and q up to 2·10^5
  choose: point-update-range-query
  when: 'The value of a range is the combination of the values of its halves and it cannot be taken back
    (Theorems 5.3.1 and 5.3.2): keep a segment tree and do each operation in O(log n).'
  over:
  - card: idempotent-range-query
    topic: '5.1'
    because: A table needs an array that never changes.
  - card: updates-and-range-sums
    topic: '5.2'
    because: A Fenwick tree needs a quantity that can be subtracted, such as a sum.
  - card: nested-loops
    topic: '0.5'
    because: Scanning the range for each question is O(nq).
- weak_signal: An operation changes every value in a range (add, set, flip) and the questions ask a sum,
    minimum or count over ranges
  choose: lazy-range-update
  when: What the operation does to a node is known from the node value and its length, and two operations
    can be merged into one tag (Theorems 5.3.3 and 5.3.4).
  over:
  - card: updates-and-range-sums
    topic: '5.2'
    because: If the reads are of single values after the range additions, a Fenwick tree over the differences
      is shorter.
  - card: difference-array
    topic: '1.2'
    because: If all reads come after all the changes, one pass over the differences is enough.
  - card: point-update-range-query
    topic: '5.3'
    because: If only single values change, no tag is needed.
- weak_signal: The answer for a range is a pair of numbers or a short list of numbers about each part
    (best stretch, matched brackets, the smallest value and its count)
  choose: custom-node
  when: 'The facts of the joined range are computed from the same facts of the two parts, and the join
    may not be commutative (Theorem 5.3.6): a node holds the facts.'
  over:
  - card: linear-state
    topic: '3.2'
    because: For a single array that never changes, one pass computes the best stretch.
  - card: offline-sweep-count
    topic: '5.2'
    because: If the node would need the set of values (different values, a median), the facts do not fit
      in a fixed size.
  - card: point-update-range-query
    topic: '5.3'
    because: If one number per node is enough, the plain segment tree suffices.
- weak_signal: The first or last position where a value passes a bound, in an array whose values are used
    up or changed between the questions
  choose: tree-descent
  when: 'A node can say whether such a position exists inside it (the maximum for "at least"): walk down
    from the root, left first (Theorem 5.3.5).'
  over:
  - card: monotone-range-search
    topic: '5.1'
    because: On an array that never changes, a table and a binary search find it.
  - card: kth-present
    topic: '5.2'
    because: If the node values are counts and the position is the k-th one, the Fenwick descent is shorter.
  - card: ordered-set-lookup
    topic: '0.6'
    because: A sorted set finds the nearest value, not the first position.
