decision_map:
- weak_signal: The statement describes a process in detail ("each second …", "after the operations, print
    …")
  choose: direct-simulation
  when: Steps times the cost of one step fits the budget, or the process is deterministic on few states
    so it repeats (Theorem 0.3.1).
  over:
  - card: closed-form
    because: A formula is needed only when the steps are too many and the state space is huge too.
    topic: '0.2'
  - card: case-analysis
    because: Reasoning about cases is riskier than following a short process; use it only when stepping
      is impossible.
- weak_signal: Input is H lines of W characters; neighbours, directions, walking until a wall
  choose: grid-processing
  when: H·W fits the budget and every neighbour access goes through a bounds check or a padding border
    (Theorem 0.3.2).
  over:
  - card: direct-simulation
    because: A walker on a grid is a simulation too; the grid card adds the direction array and the bounds
      check that make it safe.
- weak_signal: 'Transform or check a string: brackets, separators, replacements, case changes'
  choose: string-processing
  when: A small state summarising the prefix decides each next step, so one left-to-right scan answers
    (Theorem 0.3.3).
  over:
  - card: budget-from-constraints
    because: Re-scanning the prefix for every position is O(n²); a state carried along the scan replaces
      it.
    topic: '0.2'
  - card: case-analysis
    because: 'If the characters may be reordered, only the letter counts matter: decide by cases on the
      counts.'
- weak_signal: Few inputs with huge values; YES/NO or a small number as the answer
  choose: case-analysis
  when: The inputs split into a few cases covering every allowed input, each with a direct answer (Theorem
    0.3.4).
  over:
  - card: direct-simulation
    because: Stepping is impossible with values up to 10^18 unless the states repeat quickly.
  - card: closed-form
    because: When one formula covers every input, no cases are needed; cases appear when signs, parities
      or positions change the rule.
    topic: '0.2'
