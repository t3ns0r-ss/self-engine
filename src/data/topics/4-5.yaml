- a: lc-diameter-of-binary-tree
  b: lc-binary-tree-maximum-path-sum
  a_tool:
    topic: '4.5'
    card: longest-path
  b_tool:
    topic: '4.5'
    card: subtree-values
  shared_surface: Both ask for the best path in a binary tree, a path that bends at some node and goes
    down on both sides.
  flipping_difference: 'In A every edge counts positively, so extending both sides is always good: the
    diameter is the largest height on the left plus the height on the right. In B node values may be negative,
    so a side may be dropped (taking 0 instead of a negative chain), and the best chain from every node
    is a value combined from the children.'
  flipping_input: 'A root with the value 1 and two children with the values −5 and −7. A (length in edges)
    would give 2 for the path through the root. B (sum of values) gives 1: take only the root.'
self_test:
- q: The tree with the edges 1–2, 2–3, 2–4 is rooted at 1. What are the visit order, the parents and the
    depths of the walk with a stack of Theorem 4.5.1 (neighbours in the order of the lists)? What are
    the depths if the root is 3?
  a: 'From the root 1: order 1, 2, 4, 3 (vertex 2 pushes 3 and then 4, so 4 is taken first); parents 0,
    1, 2, 2 and depths 0, 1, 2, 2 for the vertices 1, 2, 3, 4. From the root 3: depths 2, 1, 0, 2 for
    the vertices 1, 2, 3, 4. The root decides the depths, not the tree.'
- q: For the same tree rooted at 1 and the order 1, 2, 4, 3, what are the subtree sizes, and why does
    the backward pass need the order to be backwards?
  a: 'The sizes of 1, 2, 3, 4 are 4, 3, 1, 1. Backwards: vertex 3 adds 1 into vertex 2, vertex 4 adds
    1 into vertex 2, then vertex 2 (size 3) adds 3 into vertex 1. A forward pass would add vertex 2 into
    vertex 1 before 3 and 4 had added into it, and the size of 1 would be wrong (Theorem 4.5.2, step 2).'
- q: With the order 1, 2, 4, 3 for the same tree, what are the ranges [tin, tout] and is vertex 4 an ancestor
    of vertex 3?
  a: 'The ranges are 1: [0, 3], 2: [1, 3], 4: [2, 2], 3: [3, 3]. Vertex 4 is not an ancestor of vertex
    3, because tin[3] = 3 is outside [2, 2]; vertex 2 is an ancestor of both (3 is in [1, 3]).'
- q: The tree has the edges 1–2 (1), 2–3 (5), 3–4 (1) and 2–5 (2). Find the diameter with the two walks,
    starting from vertex 1. Why is the farthest vertex from vertex 1 not the end of the answer path?
  a: 'From vertex 1 the distances are 1, 6, 7, 3 to the vertices 2, 3, 4, 5, so the farthest is 4 (7).
    From 4 the distances are 1, 6, 7, 8 to 3, 2, 1, 5, so the farthest is 5 and the diameter is 8 (path
    4–3–2–5). The first walk gives an end of a longest path, not the path: the distance 7 from 1 to 4
    is shorter than 8.'
- q: A tree has 2·10^5 vertices and is a single path. Why can a recursive walk fail, and what does the
    code of this topic do instead?
  a: A recursive walk goes 2·10^5 calls deep, which can overflow the stack of the program. The code walks
    with an explicit stack in a loop, records the visit order, and does the work that needs children first
    in a pass over the order backwards.
- q: A star has the centre 1 and the leaves 2, 3, 4 at the distances 3, 1, 2. What are the farthest distances
    of the four vertices by Theorem 4.5.5?
  a: 'The ends of the diameter are the leaves 2 and 4 (distance 5). From 2 the distances are 3, 4, 5 to
    the vertices 1, 3, 4; from 4 they are 2, 5, 3 to 1, 2, 3. The farthest distances are 3, 5, 4, 5 for
    the vertices 1, 2, 3, 4: for example, from vertex 3 the farthest vertex is vertex 2 at 1 + 3 = 4.'
- q: The path 1–2–3–4 has every edge of length 1. Use Theorem 4.5.6 to find the sum of the distances over
    all pairs, and check it.
  a: 'The edges have the sides (1, 3), (2, 2), (3, 1), so they are used by 3, 4, 3 pairs: the total is
    10. The pairs agree: three pairs at distance 1, two at distance 2 and one at distance 3 give 3 + 4
    + 3 = 10.'
