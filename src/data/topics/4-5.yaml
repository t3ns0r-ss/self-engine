theorems:
- id: 4.5.1
  title: Rooting a tree
  plain_words: 'In a tree there is only one way to get anywhere. So a walk from the root never meets a
    vertex twice: the only already-visited neighbour of a vertex is the one it came from. The walk gives
    each vertex its parent and its depth, and lists every vertex after its parent.'
  code: 4.5/thm-1
- id: 4.5.2
  title: Subtree sums
  plain_words: Go through the vertices from the last visited to the first. When a vertex is reached, all
    its descendants have already been added into it, so its total is final; hand the total to the parent.
    No recursion is needed.
  code: 4.5/thm-2
- id: 4.5.3
  title: Euler tour
  plain_words: 'The walk goes deep first: once it enters a vertex, it visits the whole subtree before
    it takes anything that was waiting. So each subtree is a block of consecutive positions, and "is $u$
    above $v$?" is a comparison of numbers.'
  code: 4.5/thm-3
- id: 4.5.4
  title: Diameter
  plain_words: Start anywhere and go to the vertex farthest from there; it is always one end of some longest
    path. From it, go to the farthest vertex; that gives the longest path. Two walks are enough.
  code: 4.5/thm-4
- id: 4.5.5
  title: Farthest vertices
  plain_words: Whatever vertex you stand on, the vertex farthest from you is one of the two ends of the
    longest path. So walk from each end once, and take the larger of the two distances at every vertex.
  code: 4.5/thm-5
- id: 4.5.6
  title: Sum over all pairs
  plain_words: 'Cut an edge: the tree falls into two parts, and a path between two vertices uses the edge
    exactly when its ends are in different parts. So an edge is used by (size of one part) times (size
    of the other part) pairs, and pays its weight each time.'
  code: 4.5/thm-6
