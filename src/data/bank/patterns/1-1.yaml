# Patterns for topic 1.1 (Sorting, comparators, coordinate compression). Provisional until the lesson maps them to Recognition Cards.
topic: "1.1"
patterns:
  - id: sort-then-scan
    name: Sort, then scan neighbours
    description: After sorting, the answer comes from adjacent elements or one pass (closest pair of values, duplicates, groups of equal values).
    precondition: The answer does not depend on the original order, and every relevant pair is adjacent in sorted order.
  - id: custom-order
    name: Custom ordering
    description: Sort by a key, by several keys, or by a pairwise rule such as comparing a + b with b + a for strings.
    precondition: "The ordering rule is a strict weak ordering: irreflexive, transitive, with transitive incomparability."
  - id: sort-with-index
    name: Sort but remember positions
    description: Process items in value order but report or use their original positions, by sorting (value, index) pairs.
    precondition: The processing needs value order, but answers refer to original indices.
  - id: coordinate-compression
    name: Replace values by ranks
    description: Map large or sparse values to ranks 0..k−1 so they can index an array.
    precondition: Only the relative order (or equality) of values matters, not their magnitudes.
  - id: event-sweep
    name: Sorted events with a counter
    description: Turn intervals into start and end events, sort them, and sweep while keeping a running count (maximum overlap, busiest moment).
    precondition: The quantity changes only at event points, and ties between starts and ends are ordered to match the statement.
