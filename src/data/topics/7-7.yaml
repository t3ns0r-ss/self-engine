- topic: '3.3'
  what: 'Subset sums: the split of arbitrary numbers into equal parts, where a construction does not apply'
- topic: '3.7'
  what: 'Bitmask DP: the partition into three or more equal parts, which has no simple construction'
- topic: '4.1'
  what: 'Breadth-first search: the shortest list of operations in a small state space'
- topic: '4.2'
  what: 'Graph structure: acyclic orders and cycles in a colouring of edges'
