# Topic 3.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.4"
draft: true
cards:
  - id: lis
    name: Longest increasing subsequence
    decisive_property: "The answer is the longest subsequence in which each chosen element must exceed (or be at least) the previous chosen one, a rule between consecutive chosen elements only; then the smallest possible last value for each length forms a sorted array, and each element updates it by one binary search."
    from_theorem: Theorem 3.4.2
    how_to_test: "Check that the rule compares only consecutive chosen elements and is an order (<, ≤); decide strict (lower_bound) or non-strict (upper_bound); for other pairwise rules with n ≤ 5000, use the O(n²) table of Theorem 3.4.1."
    weak_signals:
      - "Longest strictly increasing or non-decreasing subsequence, n up to 2·10^5"
      - "Fewest elements to delete or change so that the array becomes sorted"
      - "For every position, the longest increasing subsequence ending there"
    kill_signals:
      - "The chosen elements must be contiguous (a subarray): a scan or a window, not a subsequence"
      - "Elements may be reordered: then sorting answers it"
    lookalikes:
      - description: "The longest contiguous strictly increasing subarray"
        needs: "sort-then-scan (1.1)"
        flipping_difference: "Contiguity means a single scan counting the current run is enough; a subsequence may skip elements, which needs the tails array."
    complexity: "O(n log n); O(n²) for the simple table."
  - id: lis-reduction
    name: Chains after sorting one key
    decisive_property: "Items have two keys and a chain needs both to increase (nested envelopes, boxes, pairs, players by age and score); after sorting by the first key, with ties ordered so that equal first keys cannot follow each other, a chain is exactly an increasing subsequence of the second key."
    from_theorem: Theorem 3.4.3
    how_to_test: "Write the chain condition as 'both keys increase'; choose the tie order for equal first keys (second key decreasing for strict chains) and check a small case with equal first keys by hand."
    weak_signals:
      - "Put boxes or envelopes inside each other; stack cuboids"
      - "Choose a team or a sequence where two attributes must both increase"
      - "Order is free in the input, but the chain must be increasing in two measures"
    kill_signals:
      - "Only one key matters (plain sorting or plain LIS)"
      - "The goal is the number of chains or groups needed to cover all items (a greedy with sorted piles, or Dilworth-style counting)"
    lookalikes:
      - description: "The longest chain of pairs (a, b) where b of one is less than a of the next"
        needs: "interval-selection (1.5)"
        flipping_difference: "Each pair is an interval and the chain needs them disjoint in order: earliest end first is optimal. Nested envelopes need both sides increasing, which sorting alone does not give."
    complexity: "O(n log n) after sorting."
  - id: lcs
    name: Longest common subsequence
    decisive_property: "Two sequences are matched in order, the best value for two prefixes depends only on shorter prefixes (matching two equal last elements never hurts), and n·m fits; the table over prefix pairs gives the answer and, walking back, one optimal matching."
    from_theorem: Theorem 3.4.4
    how_to_test: "Name the state (i, j) = prefix lengths, list the three moves (skip a_i, skip b_j, match both), and check n·m ≤ about 10^7."
    weak_signals:
      - "Two strings or arrays; keep elements in order on both sides"
      - "Fewest deletions to make two strings equal; lines between equal numbers that must not cross"
      - "Lengths up to 1000–5000 each"
    kill_signals:
      - "One sequence has distinct values that are a permutation of the other's: the matching reduces to LIS in O(n log n)"
      - "Only whether one is a subsequence of the other: two pointers (1.3)"
    lookalikes:
      - description: "Is s a subsequence of t?"
        needs: "merge-walk (1.3)"
        flipping_difference: "Matching each character of s at its first possible place in t is never worse, so two pointers decide it in O(|s| + |t|); the LCS table is needed only when both sides may skip characters."
    complexity: "O(n·m) time, O(m) memory with two rows if only the length is needed."
  - id: edit-distance
    name: Edit distance
    decisive_property: "One string is turned into another by single-character insertions, deletions and replacements with per-operation costs; every edit sequence is an alignment read left to right, so the cheapest cost for two prefixes comes from the three shorter prefix pairs."
    from_theorem: Theorem 3.4.5
    how_to_test: "Check that the operations act on single characters with fixed costs (possibly different per operation), set the base cases E[i][0] and E[0][j], and check n·m."
    weak_signals:
      - "Fewest operations to turn one string into another: insert, delete, replace"
      - "Is a string within distance k of another; spelling correction"
      - "Different costs for deleting, inserting and replacing"
    kill_signals:
      - "Only replacements are allowed and the strings have equal length: count the differing positions"
      - "Only deletions on both sides: n + m − 2·LCS"
    lookalikes:
      - description: "Fewest deletions from both strings to make them equal"
        needs: "lcs (3.4)"
        flipping_difference: "Without insertions or replacements, the answer is n + m − 2·LCS; edit distance is needed when a replacement can do in one step what costs two deletions."
    complexity: "O(n·m)."
