- id: ac-abc281_f
  role: ladder
  card: xor-split
  rung: 1
  twist: 'Base case of the card: the digits are split from the top and no tree is needed.'
  summary: A sequence of up to 1.5·10^5 numbers below 2^30; choose a number x, XOR it into every element,
    and make the largest element as small as possible.
  hints:
  - Look at the top digit of the elements. If some have it and some do not, what does the top digit of
    the largest result look like, whatever x is?
  - 'If both groups exist, the largest result has the top digit 1: x can clear the digit in one group
    only. If only one group exists, x clears it for everyone.'
  - 'Recurse on the next digit with the two groups: with both groups, the answer is 2^digit plus the smaller
    of the two answers; with one group, pass it down. Work on the sorted numbers so that groups are stretches.'
- id: ac-arc122_d
  role: ladder
  card: xor-split
  rung: 2
  twist: 'The crossing pair appears when both groups have an odd size: it is found with a trie.'
  summary: 2N numbers below 2^30 (N up to 2·10^5); they are paired up and the score is the largest XOR
    of a pair; find the smallest possible score (the game reduces to this).
  hints:
  - Split by the top digit. Which pairs have an XOR below 2^digit, and which have an XOR of at least 2^digit?
  - If both groups have an even size, every number can be paired inside its group and the crossing pairs
    are never needed. If both are odd, exactly one pair must cross.
  - With even groups the answer is the larger of the two sub-answers; with odd groups it is the smallest
    XOR between a number of one group and a number of the other, found with a binary trie of one group
    (the walk that prefers the same digit).
- id: cf-888G
  role: ladder
  card: xor-split
  rung: 3
  twist: 'The full XOR spanning tree: the sum over all splits of the cheapest crossing edge.'
  summary: n ≤ 2·10^5 numbers below 2^30; the graph has an edge between every two numbers with weight
    their XOR; the weight of a cheapest spanning tree. †
  hints:
  - The graph is complete, so Kruskal over its edges is impossible. Which edges can be in the tree if
    you look at the top digit?
  - Edges inside a group with the same top digit weigh less than edges across, so by Kruskal the tree
    joins each group first and then adds exactly one crossing edge, the cheapest.
  - Sort the numbers, split them recursively by the digits from the top (equal numbers are removed), and
    at each split find the cheapest crossing edge with a trie of one side. Add the weights in 64 bits.
