# Patterns for topic 3.6 (Interval DP). Provisional until the lesson maps them to Recognition Cards.
topic: "3.6"
patterns:
  - id: merge-split
    name: Split point of a segment
    description: dp[l][r] is the best over a split point k of combining [l, k] and [k+1, r] (merging stones, cutting a stick, matrix order).
    precondition: An optimal solution on [l, r] consists of independent optimal solutions on two sub-segments.
  - id: take-from-ends
    name: Taking from either end
    description: Players or a process remove items only from the ends, so the remaining items always form one contiguous segment.
    precondition: The state is fully described by the remaining segment [l, r].
  - id: palindrome-segment
    name: Palindromes inside segments
    description: Longest palindromic subsequence, or fewest insertions to make a palindrome, from [l+1, r−1], [l+1, r], and [l, r−1].
    precondition: The answer for [l, r] depends only on its first and last characters and the inner segments.
  - id: first-element-match
    name: First element pairs with some k
    description: The first element of the segment is removed together with some element k, splitting the rest into independent parts (removing equal blocks, bracket pairs).
    precondition: After choosing the partner k of l, the parts inside and outside of (l, k) do not interact.
