drill:
- problem: ac-abc373_d
  answer:
    topic: '4.1'
    card: components
  property: 'Each edge fixes the difference of its two ends in both directions (x_u = x_v − w), so inside
    a component one value fixes all others: set one vertex of each component to 0 and walk, adding w along
    an edge and subtracting it against the edge.'
  why_others_fail: There is no distance to minimise, so a queue-based search for fewest edges adds nothing,
    and trying values is impossible with |x| up to 10^18.
- problem: ac-abc269_d
  answer:
    topic: '4.1'
    card: grid-graph
  property: The black cells are the vertices and each has six fixed neighbour offsets; the groups are
    the components of this graph, found by one walk per unmarked black cell (a set or a table indexed
    by shifted coordinates holds the marks).
  why_others_fail: Comparing every pair of black cells is 5·10^5 pairs here, but chaining through other
    cells means a pair test alone cannot decide membership; the walk follows the chains.
- problem: lc-count-unreachable-pairs-of-nodes-in-an-undirected-graph
  answer:
    topic: '4.1'
    card: components
  property: Two nodes are unreachable from each other exactly when they lie in different components; with
    the component sizes, add up the product of each size with the number of nodes in the components found
    before it.
  why_others_fail: Testing each of the n(n−1)/2 ≈ 5·10^9 pairs for a route is far too slow.
- problem: lc-max-area-of-island
  answer:
    topic: '4.1'
    card: grid-graph
  property: Land cells joined through side neighbours form islands; the area is the number of cells a
    walk marks, so keep the largest count over the walks.
  why_others_fail: Looking only at a cell and its four neighbours cannot see a whole island; the island
    has to be followed cell by cell.
- problem: lc-number-of-closed-islands
  answer:
    topic: '4.1'
    card: grid-graph
  property: An island is a component of land cells; it is closed when none of its cells lies on the border.
    Walk each island and note whether the walk touches the border.
  why_others_fail: A cell next to water can still belong to an island that reaches the border further
    away, so each cell alone cannot decide.
- problem: lc-map-of-highest-peak
  answer:
    topic: '4.1'
    card: multi-source
  property: Heights are forced down to the distance from the nearest water cell (neighbours differ by
    at most 1 and water is 0), and the maximum is reached by taking exactly that distance; all water cells
    start together in the queue at 0.
  why_others_fail: One walk per water cell is up to 10^6 walks of 10^6 steps; a single pass with all of
    them in the queue is enough.
- problem: lc-minimum-genetic-mutation
  answer:
    topic: '4.1'
    card: state-graph
  property: The state is the gene string; only strings in the bank (at most 10, plus the start) can be
    entered, and each mutation costs one, so a queue-based search over those states gives the fewest mutations.
  why_others_fail: Trying all orders of mutations is exponential; the state space is tiny, so a search
    that marks each state once is enough.
- problem: lc-minimum-operations-to-convert-number
  answer:
    topic: '4.1'
    card: state-graph
  property: While x is within 0 to 1000 it is a state with at most 3 · 1000 moves; a number outside the
    range can be reached but not left. A queue-based search over the 1001 states gives the fewest operations.
  why_others_fail: Moves go up and down, so a table filled in increasing order of x has no valid order;
    trying all operation sequences is exponential.
- problem: lc-dungeon-game
  answer:
    topic: '3.5'
    card: grid-paths
  property: 'Moves only go right or down, so each cell comes after its top and left neighbours: fill a
    table from the princess''s corner backwards with the least health needed to leave each room alive.'
  why_others_fail: A queue-based walk minimises the number of steps, and every route here has the same
    number of steps; what matters is the health along the route.
- problem: cf-340D
  answer:
    topic: '3.4'
    card: lis
  property: Bubble sort swaps exactly the pairs in the wrong order, so two values are joined when they
    form an inversion; a set with no edge between any two is an increasing subsequence, and the largest
    one is the longest increasing subsequence in O(n log n).
  why_others_fail: The graph can have about 5·10^9 edges for n = 10^5, so building it and walking it is
    impossible.
- problem: lc-count-paths-with-the-given-xor-value
  answer:
    topic: '3.5'
    card: grid-paths
  property: 'Moves only go right or down and the question asks how many paths there are: a table over
    (cell, XOR so far) with 16 XOR values counts them, adding the two predecessor cells.'
  why_others_fail: A search that marks each cell once cannot count routes, and listing every path is exponential.
lookalike_pairs:
- a: lc-shortest-path-in-binary-matrix
  b: lc-01-matrix
  a_tool:
    topic: '4.1'
    card: unweighted-shortest
  b_tool:
    topic: '4.1'
    card: multi-source
  shared_surface: Both ask for distances in steps on a grid of 0s and 1s.
  flipping_difference: A has one start and one end, so one ordinary walk from the top-left cell gives
    the answer (with eight neighbours, counting cells). B asks for the distance of every cell to its nearest
    0; one walk per cell would be far too slow, so all zeros go into the queue together.
  flipping_input: 'A: [[0,1,0],[0,0,0],[1,1,0]] gives 3 (cells (0,0), (1,1), (2,2) along the diagonal).
    B: [[0,1,1],[1,1,1],[1,1,0]] gives [[0,1,2],[1,2,1],[2,1,0]] from one walk that starts at both zeros.'
- a: lc-jump-game-iii
  b: lc-jump-game-iv
  a_tool:
    topic: '4.1'
    card: components
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both jump along an array and ask about reaching an index.
  flipping_difference: 'III only asks whether an index holding 0 can be reached from the start, which
    any traversal with a stack or a queue answers (one-way jumps are fine for reaching). IV asks for the
    fewest jumps, so it needs the queue and the distances, and its jumps to equal values would number
    about n²/2 if every pair were listed: keep a map from each value to its indices and use each group
    once.'
  flipping_input: 'III: [2,0,1,0], start 0: index 0 jumps to 2, index 2 jumps to 1 or 3, both hold 0,
    so the answer is yes. IV: n = 50 000 equal values: listing every pair of equal values would give about
    1.25·10^9 edges, while the grouped search finds the answer 1.'
self_test:
- q: In the graph with arrows 1→2, 2→1, 2→3, 3→4, how many groups of vertices can all reach one another,
    and what does counting the walks of Theorem 4.1.2 give?
  a: 'Three groups: {1, 2}, {3} and {4}. One walk from 1 marks all four vertices, so counting walks gives
    1. The loop of Theorem 4.1.2 needs links that work both ways (step 1 of its proof).'
- q: 'The corridors 1–2 (length 10), 1–3 (length 1) and 3–2 (length 1): which route does the queue-based
    walk from 1 report for vertex 2, what does it cost, and what is the cheapest route?'
  a: The walk reports the direct corridor 1–2 (one edge, cost 10); the cheapest route is 1, 3, 2 with
    cost 2. Theorem 4.1.3 minimises the number of edges, not the total length.
- q: On the map with rows "S.D.T" and "#K###", where D opens only after K has been visited, what does
    a search over cells alone report as the fewest steps, and what is the true answer?
  a: 'The cell-only search reports 4 (along the top row). The true answer is 6: right, down to K, back
    up, then right through D, right, right. The state must be (cell, key held) (Theorem 4.1.6, precondition
    1).'
- q: On the path 1–2–3–4–5, a fire at vertex 1 starts at minute 0 and a fire at vertex 5 starts at minute
    3. When does the first fire reach vertex 4, and what does the multi-source walk report?
  a: 'Minute 3 (from vertex 1: three steps; from vertex 5: 3 + 1 = 4). The multi-source walk lets both
    start at minute 0 and reports 1, so it needs sources that start together (Theorem 4.1.4, precondition
    1).'
- q: Positions 0 to 6 on a line; the move +1 costs 1 and the move +3 costs 5. How many moves and what
    cost does the search for the fewest moves give for reaching 6, and what is the cheapest cost?
  a: The fewest moves are 2 (+3, +3), at cost 10. The cheapest way is six moves of +1 at cost 6. The search
    counts moves, so it is only right when every move costs the same.
- q: A triangle has the edges 1–2, 1–3, 2–3. If a vertex is marked when it is removed from the stack instead
    of when it is pushed, what size does the walk report for the component, and why?
  a: 4 instead of 3. Vertex 2 is pushed by vertex 1 and again by vertex 3 before either copy is removed,
    and is counted twice. Mark at the push (precondition 1 of Theorem 4.1.1).
- q: For n = 10^5 vertices and m = 2·10^5 undirected edges, how many entries do the adjacency lists hold,
    and how many cells would an adjacency matrix need?
  a: The lists hold 2m = 4·10^5 entries (n + 2m = 5·10^5 with the list headers); the matrix has n² = 10^10
    cells, far too many.
- q: 'The cycle of five vertices with edges 1–2, 1–3, 2–4, 3–5, 4–5, started at 1: why does a stack in
    place of the queue report 3 edges to vertex 4 instead of 2?'
  a: The stack follows 1, then 3, then 5 and reaches vertex 4 from 5, before vertex 2 gets its turn to
    reach 4. With a queue, vertex 4 is first reached from 2 (distance 2). Theorem 4.1.3 relies on the
    first in, first out order.
