topic: L0.4
exercises:
- id: rung-1
  role: ladder
  type: change_ladder
  title: 'Read a class diagram: who owns what'
  prompt: 'Read the class diagram of the podcast app and its code, and write owners.txt: for each class, the class that owns it, or none.'
  card: class-diagram
  rung: 1
  new_force: Read a class diagram and name the owner of each object
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.4/ladder/rung-1
  reference: reference/L0.4/ladder/rung-1
  alternatives:
  - 'Read only the diagram and trust it: faster, but the diagram of a different version of the code gives a wrong answer unchecked.'
  hints:
  - For each class, ask who destroys it. A pointer or a reference in a member never answers that question.
  - Look for the filled diamond (`*--`) or in the code for a member by value or a `std::unique_ptr`; the class on the diamond side is the owner.
  - 'A class with no filled diamond pointing at it has no owner: answer none.'
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: rung-2
  role: ladder
  type: change_ladder
  title: Draw a class diagram from the code
  prompt: Draw the class diagram of the four recipe classes in diagram.mmd, with the right arrow for each pair.
  card: class-diagram
  rung: 2
  new_force: Draw a class diagram for 4 classes from code
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.4/ladder/rung-2
  reference: reference/L0.4/ladder/rung-2
  alternatives:
  - 'Draw every method and field in each box: 3 times the lines, and the checker does not read them.'
  hints:
  - List the members of each class one by one and write the arrow for each before drawing anything.
  - 'A `std::vector<Recipe>` held by value is an owned part: `RecipeBook *-- Recipe`. A `std::vector<const Recipe*>` only refers: `MealPlan o-- Recipe`.'
  - Put the diamond on the side of the class that holds the member, never on the part.
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: rung-3
  role: ladder
  type: change_ladder
  title: Draw one request as a sequence
  prompt: 'Draw the sequence diagram of one Editor::save call: each call between objects once, in order, with the function name as the message.'
  card: sequence-diagram
  rung: 3
  new_force: Draw one request through 3 objects as a sequence
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.4/ladder/rung-3
  reference: reference/L0.4/ladder/rung-3
  alternatives:
  - 'Write the order as a numbered list in prose: fine for 3 calls, but nothing compares it with the code.'
  hints:
  - Read save() from top to bottom and write down every line that calls another object.
  - 'Write `A->>B: name` for a call from A to B. The test itself is the first caller: `Test->>Editor: save`.'
  - Do not draw returns or calls inside one object; only calls between objects.
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: rung-4
  role: ladder
  type: change_ladder
  title: Show the error path in the sequence
  prompt: Extend sequence.mmd so that it shows both recorded runs, the successful save and the save that hits DiskFull, with an alt block.
  card: sequence-diagram
  rung: 4
  new_force: Show an error path in the sequence
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.4/ladder/rung-4
  reference: reference/L0.4/ladder/rung-4
  alternatives:
  - 'Draw the failure as a second diagram: two pictures to keep in step instead of one with two paths.'
  hints:
  - 'Run the code in your head with a full disk: which calls happen after write, and which do not?'
  - Use `alt disk full` … `else written` … `end`; the calls that happen in each case go inside its branch.
  - The calls before the failure point (serialise, write) stay outside the alt.
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: rung-5
  role: ladder
  type: change_ladder
  title: A two-class design needs no diagram
  prompt: Decide whether a diagram is worth drawing for a Clock that owns its TimeZone, and write one sentence that names both classes and the relationship.
  card: null
  rung: 5
  new_force: A 2-class design needs no diagram
  needs_new_structure: false
  checkers:
  - kind: kit
    path: L0.4/ladder/rung-5
  reference: reference/L0.4/ladder/rung-5
  alternatives:
  - 'Draw a two-line class diagram anyway: harmless, but it repeats what the sentence says and has to be kept in step.'
  hints:
  - Count the classes and the relationships. How many words does it take to say them?
  - 'Answer `diagram needed: no` and write the sentence in 25 words or fewer.'
  - Name both classes, and say who owns whom.
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: ex-1
  role: worked_example
  type: recognise
  title: Who owns the orders in the shop
  prompt: A shop has a catalog of items, a list of orders, and a mailer that is shared with other parts of the program. A new developer asks which of them the shop owns, which it only refers to, and what happens to each when the shop is destroyed. Decide how to answer.
  card: class-diagram
  answer:
    kind: card
    card: &id001
      topic: L0.4
      card: class-diagram
    property: The question is about who owns whom, which the member declarations state, so a class diagram of the structure answers it in 17 lines and can be checked against the 94-line header.
    why_others_fail: A sequence diagram shows calls in one run, not who deletes what; reading the whole header answers the question but takes 94 lines for every new reader.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: ex-2
  role: worked_example
  type: recognise
  title: What happens when the card is declined
  prompt: An order reserves stock, charges the card and mails a confirmation. When the card is declined, the stock must be given back and no mail sent. A new developer must be shown what happens, in order, in each case. Decide how to show it.
  card: sequence-diagram
  answer:
    kind: card
    card: &id002
      topic: L0.4
      card: sequence-diagram
    property: The question is about the order of calls in one run and the calls skipped on a failure, and a test can record those calls and compare them with the diagram.
    why_others_fail: A class diagram has the same lines for a shop that mails before it reserves; a paragraph of prose cannot be checked against the code.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-1
  role: drill
  type: recognise
  title: Who owns whom in six classes
  prompt: 'A model has six classes: an app, a library, episodes, a playlist, a player and a speaker. A new teammate must be told who owns whom.'
  answer:
    kind: card
    card: *id001
    property: The question is about ownership, which the member declarations state; one view of the six classes answers it.
    why_others_fail: A sequence diagram shows one run of calls and says nothing about who deletes the speaker.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-2
  role: drill
  type: recognise
  title: A user places an order
  prompt: 'You must show what happens, in order, when a user places an order: stock is checked, the card is charged and a mail is sent.'
  answer:
    kind: card
    card: *id002
    property: The question is about the order of calls between objects in one run.
    why_others_fail: The class diagram of the same classes does not change when the order of the calls does.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-3
  role: drill
  type: recognise
  title: A two-line helper
  prompt: A helper function has two lines and calls nothing else. A colleague asks for a diagram of it.
  answer:
    kind: none
    simplest: The two lines themselves
    why: There are no relationships and no calls between objects to draw.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-4
  role: drill
  type: recognise
  title: An undo request
  prompt: 'You must show how an undo request travels through three objects: the button, the history and the document.'
  answer:
    kind: card
    card: *id002
    property: 'Three objects, a fixed order of calls, and a call that undoes another: one run to draw.'
    why_others_fail: A class diagram shows that the history holds commands, not which call comes first.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-5
  role: drill
  type: recognise
  title: A savings account
  prompt: A SavingsAccount is used wherever an Account is accepted, and keeps every rule of Account.
  answer:
    kind: card
    card:
      topic: L0.3
      card: true-subtype
    property: Every promise of the base also holds for the derived class, so it is used wherever the base is.
    why_others_fail: Holding an Account as a member would not let code written for Account take a SavingsAccount.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-6
  role: drill
  type: recognise
  title: A throwaway script
  prompt: A throwaway script has one function and is run once. A colleague wants a design drawing for the review.
  answer:
    kind: none
    simplest: The script itself
    why: One function has no relationships; a diagram would repeat the code.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-7
  role: drill
  type: recognise
  title: A car and its engine
  prompt: A Car creates its Engine and Wheels, and they are destroyed with it; no other object holds them.
  answer:
    kind: card
    card:
      topic: L0.3
      card: owned-part
    property: The parts are built with the whole, destroyed with it and held by nothing else.
    why_others_fail: Pointers to parts built elsewhere would leave nobody to destroy them.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: r-8
  role: drill
  type: recognise
  title: A team and players of other teams
  prompt: A Team lists Players who also belong to other teams and live longer than any one team.
  answer:
    kind: card
    card:
      topic: L0.3
      card: referred-part
    property: The players are built and destroyed elsewhere, so the team refers to them.
    why_others_fail: Owning the players would delete one still in another team, or copy it into each team.
  checkers: []
  techniques:
  - L0.4
  checked_on: '2026-10-19'
- id: cp-1
  role: checkpoint
  type: build
  title: Draw and verify the diagrams of a room-booking codebase
  prompt: 'In 40 minutes (see exercises/L0.4/cp-1): draw the class diagram of the seven classes of the room-booking code and the sequence diagram of Scheduler::book with its conflict path. Add a short decision record saying which relationships you drew as ownership and why, and what the sequence shows that the class diagram cannot.'
  card: class-diagram
  clarifying:
  - q: Which relationships must the class diagram show?
    a: Ownership (`*--`), reference (`o--`) and the interface implemented by the email notifier (`<|..`); dependencies are optional and are not compared.
    critical: true
  - q: Which runs must the sequence show?
    a: The booked run and the conflict run, as two paths of one alt block.
    critical: true
  - q: Does the test caller appear in the sequence?
    a: 'Yes, as Test; the first message is Test->>Scheduler: book.'
    critical: true
  - q: Must returns and thrown exceptions be drawn?
    a: No. A dashed arrow is a return and is not compared.
    critical: false
  - q: How is the diagram checked?
    a: A program reads the headers and the recorded calls and prints one line for each difference.
    critical: false
  checkers:
  - kind: kit
    path: L0.4/cp-1
  - kind: rubric
    id: rubric-lld-build-v1
  reference: reference/L0.4/cp-1
  time_limit_minutes: 40
  techniques:
  - L0.4
  checked_on: '2026-10-19'
