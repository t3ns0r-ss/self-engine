# Topic 3.5 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.5"
cards:
  - id: grid-paths
    name: Paths in a grid with one-way moves
    decisive_property: Every move goes right or down (or in another fixed set of directions that never
      leads back), so the cells can be filled in reading order; the number of paths to a cell is the sum
      over the cells a move comes from, and the cheapest path is the minimum over them.
    from_theorem: Theorem 3.5.1
    how_to_test: Check that no move can return to an earlier row or column; list the cells a move can
      come from; check that rows × columns (× any extra index) is at most about 10^7.
    weak_signals:
      - Count the paths from the top-left to the bottom-right cell moving right or down, avoiding obstacles,
        modulo 10^9 + 7
      - The path with the smallest or largest sum moving right or down, or falling one row at a time
      - A grid up to 1000 × 1000 or 3000 × 3000
    kill_signals:
      - 'Moves in all four directions: a path can come back, so there is no filling order; it is a graph
        search (4.1)'
      - 'No obstacles and only the count is asked: one binomial coefficient (2.3)'
    lookalikes:
      - description: The number of right/down paths in an H × W grid without obstacles, H, W ≤ 10^5
        needs: bijection-paths (2.3)
        flipping_difference: Without obstacles every choice of which moves go down is a path, so C(H +
          W − 2, H − 1) answers it in O(1) after factorials; the table needs H·W = 10^10 cells.
    complexity: O(H·W) time, O(W) memory with two rows.
  - id: sequence-counting
    name: Counting sequences with a small state
    decisive_property: Count sequences or strings of length n where whether the next element is allowed
      depends only on a small summary of the prefix (the last element, the length of the current run,
      a remainder, a flag) that is determined by the prefix; the table counts the prefixes of each length
      with each summary.
    from_theorem: Theorem 3.5.2
    how_to_test: Write the rule and list exactly what it looks at in the past; check that this summary
      is a function of the prefix and has few values; check n × states × choices.
    weak_signals:
      - Count strings of length n with no forbidden substring, or with no k equal letters in a row
      - Neighbouring elements must satisfy a rule (adjacent keys, a knight move, consecutive letters from
        a list)
      - n up to 10^5 and an answer modulo 10^9 + 7
    kill_signals:
      - 'n up to 10^18 with a fixed small state: matrix exponentiation (7.6)'
      - 'The rule looks at the whole set of used elements (all different), so no small summary exists:
        a formula (2.3) or a mask over a small set (3.7)'
    lookalikes:
      - description: Count the strings of length n over k letters with no two equal neighbours
        needs: product-sum-rules (2.3)
        flipping_difference: The number of choices for each letter is the same whatever came before (k,
          then k − 1 each time), so the product k·(k − 1)^(n − 1) answers it; the table is needed when
          the number of allowed choices depends on the state.
    complexity: O(n · states · choices).
  - id: partition-counting
    name: Sums of allowed parts
    decisive_property: Count the ways to write a total as a sum of allowed parts (die faces, step sizes,
      coins, palindromes), where the statement fixes whether order matters; ordered sums put the totals
      outside, unordered sums put the parts outside, and an "at least one" condition is a flag in the
      state or all minus none.
    from_theorem: Theorem 3.5.3
    how_to_test: Decide whether 1 + 2 and 2 + 1 are different in the statement; choose the loop order;
      for "at least one part with a property", check that counting all minus those with none is exactly
      the complement.
    weak_signals:
      - The number of ways to reach a total with rolls of a die or steps of given sizes
      - The number of ways to write n as a sum of parts of a given kind (palindromes, powers, die faces)
      - At least one part is at least d; exactly k parts
    kill_signals:
      - 'Each part may be used at most once: subset sums (3.3)'
      - 'A fixed number of parts with only lower or upper bounds of 0 and no other limits: stars and bars
        (2.3)'
    lookalikes:
      - description: Split n identical candies among k children, each getting at least one
        needs: stars-bars (2.3)
        flipping_difference: Any size is allowed for each part, so the count is C(n − 1, k − 1) directly;
          a table over totals is needed when the parts are limited to a set or capped.
    complexity: O(total × number of parts), times the number of flag values.
  - id: range-sum-transition
    name: Transitions over a range
    decisive_property: 'Each entry of the table is the sum of a contiguous range of entries of an earlier
      row (or of earlier entries of the same row): a child takes 0..a_i items, a jump has a length in
      [L, R], the next value lies within d. Prefix sums of that row make each entry O(1).'
    from_theorem: Theorem 3.5.4
    how_to_test: Write the slow sum and check that the indices it adds form an interval; clip the ends
      to the row; subtract modulo p with + p.
    weak_signals:
      - Each of n people takes between 0 and a_i of K identical items; count the ways
      - A frog jumps any length from a union of segments; count the ways to reach the end
      - The next element must differ from the previous by at most (or at least) d
    kill_signals:
      - 'The predecessors are scattered (all divisors or all multiples): a loop over multiples (2.1)'
      - 'The transition takes a minimum or maximum over the range, not a sum: a sliding window of extremes
        (1.6)'
    lookalikes:
      - description: dp[i] = the cheapest way to reach i when the last jump has a length from 1 to k (minimum
          over a window of earlier entries)
        needs: window-deque (1.6)
        flipping_difference: A minimum cannot be undone by subtraction, so prefix sums do not apply; the
          window moves right, so a deque of candidates gives each minimum in O(1).
    complexity: O(rows × row length).
problems:
  - id: cses-1638
    role: worked_example
    summary: Count the right/down paths through an n × n grid (n ≤ 1000) that avoid the traps, modulo
      10^9 + 7.
  - id: ac-abc179_d
    role: worked_example
    summary: Count the ways to go from cell 1 to cell N ≤ 2·10^5 with jumps whose lengths lie in a union
      of K ≤ 10 disjoint segments, modulo 998244353.
  - id: lc-unique-paths-ii
    role: ladder
    card: grid-paths
    rung: 1
    twist: Base case of the card
    summary: Count the right/down paths from the top-left to the bottom-right cell of an m × n grid (m,
      n ≤ 100) with obstacles.
    hints:
      - From which cells can a path arrive at (i, j)?
      - Only from the cell above and the cell to the left, and the two groups of paths do not overlap
        (Theorem 3.5.1).
      - ways[i][j] = ways[i − 1][j] + ways[i][j − 1] on free cells, 0 on obstacles (the start too, if
        it is blocked); fill row by row.
  - id: lc-triangle
    role: ladder
    card: grid-paths
    rung: 2
    twist: A minimum instead of a count, on a triangle where each step goes to one of two cells below.
    summary: The smallest sum of a path from the top of a number triangle (up to 200 rows) to the bottom
      row, each step going to one of the two adjacent numbers below.
    hints:
      - Which cells can a path come from, and is there an order in which to fill them?
      - Cell j of a row is reached from cells j − 1 and j of the row above; rows go only downwards, so
        row by row is an acyclic order.
      - best[j] = row[j] + min of the two cells above (only one at the edges); or fill bottom-up with
        best[j] = row[j] + min(best[j], best[j + 1]) and read best[0].
  - id: lc-maximal-square
    role: ladder
    card: grid-paths
    rung: 3
    twist: The value of a cell is the size of the largest square ending there, not a count of paths.
    summary: The area of the largest square of 1s in a 0/1 matrix (up to 300 × 300).
    hints:
      - If a square of side s has its bottom-right corner at (i, j), what squares end at its three neighbours
        up, left and up-left?
      - Each of them ends a square of side at least s − 1. Conversely, if all three end squares of side
        at least t, then (i, j) ends one of side t + 1.
      - side[i][j] = 1 + min(side[i − 1][j], side[i][j − 1], side[i − 1][j − 1]) on 1-cells, 0 on 0-cells;
        answer the largest side squared.
  - id: lc-paths-in-matrix-whose-sum-is-divisible-by-k
    role: ladder
    card: grid-paths
    rung: 4
    twist: A remainder is added to the cell as a third index.
    summary: Count the right/down paths through an m × n grid (m·n ≤ 5·10^4, values ≤ 100) whose sum is
      divisible by k ≤ 50, modulo 10^9 + 7.
    hints:
      - What do you need to know about a partial path, besides where it ends, to decide at the end whether
        it counts?
      - Only its sum modulo k. So the state is (i, j, r), with r the remainder of the sum so far (Theorem
        3.5.2 on top of the grid).
      - ways[i][j][(r + grid[i][j]) mod k] += ways[i − 1][j][r] + ways[i][j − 1][r]; the answer is ways
        at the end cell with r = 0. O(m·n·k).
  - id: lc-cherry-pickup-ii
    role: ladder
    card: grid-paths
    rung: 5
    twist: Two walkers move together, one row per step, and the state holds both columns.
    summary: Two robots start in the top corners of a grid (rows, columns ≤ 70) and move one row down
      per step, each to the same or an adjacent column; collect the most cherries, counting a shared cell
      once.
    hints:
      - Both robots are always on the same row. What describes a moment of the walk completely?
      - The row and the two columns. From (row, c1, c2) each robot has 3 moves, 9 pairs in all, and rows
        only go down.
      - best[r][c1][c2] = cherries of the two cells (once if c1 = c2) + max over the 9 previous pairs;
        answer the max over the last row. O(rows · cols² · 9).
  - id: ac-abc175_e
    role: ladder
    card: grid-paths
    rung: 6
    twist: A small counter (items taken in this row) is added to the cell, and moving down resets it.
    summary: Move right/down through an R × C grid (R, C ≤ 3000) with valued items on some cells; take
      at most 3 items per row. The largest total value.
    hints:
      - Besides the cell, what does the rule "at most 3 per row" need to know about the path so far?
      - How many items were taken in the current row, 0 to 3. Moving down starts a new row with count
        0.
      - 'best[i][j][t] for t = 0..3: from the left keep t (or take the item here, t + 1), from above start
        at 0 (or 1 if you take it). 3000² · 4 states in long long; keep two rows if memory is tight.'
  - id: ac-abc242_c
    role: ladder
    card: sequence-counting
    rung: 1
    twist: Base case of the card
    summary: Count the N-digit numbers (N ≤ 10^6) with digits 1..9 in which neighbouring digits differ
      by at most 1, modulo 998244353.
    hints:
      - What must you know about a prefix to know which digit may come next?
      - 'Only its last digit: nine states (Theorem 3.5.2).'
      - cnt[d] for d = 1..9 starts at 1; each step next[d] = cnt[d − 1] + cnt[d] + cnt[d + 1] (when they
        exist); answer the sum after N digits.
  - id: cf-166E
    role: ladder
    card: sequence-counting
    rung: 2
    twist: 'Symmetry merges states: the three vertices other than the start behave alike.'
    summary: An ant walks along the edges of a tetrahedron for n ≤ 10^7 steps, starting at vertex D; count
      the walks that end at D, modulo 10^9 + 7.
    hints:
      - Four states (the current vertex) work. Do you need all four?
      - 'The vertices A, B, C are symmetric, so keep two numbers: walks at D, and walks at one fixed other
        vertex (all three have the same count).'
      - atD′ = 3·other, other′ = atD + 2·other; start with atD = 1, other = 0; O(n) time, O(1) memory.
  - id: lc-domino-and-tromino-tiling
    role: ladder
    card: sequence-counting
    rung: 3
    twist: 'Tilings: the state is the shape of the edge of what is already covered.'
    summary: Count the tilings of a 2 × n board (n ≤ 1000) with dominoes and L-shaped trominoes (any rotation),
      modulo 10^9 + 7.
    hints:
      - Cover the board from left to right. What can the right edge of the covered part look like?
      - Either flat (both rows covered to column i) or with one cell sticking out. By symmetry, the two
        sticking-out shapes have the same count.
      - full[i] = full[i − 1] + full[i − 2] + 2·half[i − 1], half[i] = half[i − 1] + full[i − 2], with
        full[0] = 1; answer full[n].
  - id: lc-count-number-of-texts
    role: ladder
    card: sequence-counting
    rung: 4
    twist: Runs of equal keys are independent, so the answer is a product over runs.
    summary: A phone keypad maps keys 2–9 to 3 or 4 letters, typed by pressing a key that many times;
      count the messages that could produce a string of key presses (length ≤ 10^5), modulo 10^9 + 7.
    hints:
      - Where can one letter end and the next begin, and do different runs of keys influence each other?
      - A letter uses 1..3 presses of one key (1..4 for keys 7 and 9), all inside one run of equal keys;
        runs are independent.
      - For a run of length m, ways[i] = ways[i − 1] + ways[i − 2] + ways[i − 3] (+ ways[i − 4] for 7
        and 9), ways[0] = 1; multiply the values of all runs modulo p.
  - id: cses-2413
    role: ladder
    card: sequence-counting
    rung: 5
    twist: 'Many queries: precompute every answer once.'
    summary: Count the ways to build a tower of width 2 and height n ≤ 10^6 from rectangular blocks, for
      up to 100 values of n, modulo 10^9 + 7.
    hints:
      - Build the tower row by row from the bottom. What about the top row decides how the next row can
        continue?
      - Whether the top row is one block of width 2 or two blocks of width 1. Each block can either continue
        upward or end here.
      - 'With J = top row joined and S = split: J′ = 2J + S, S′ = J + 4S, from J = S = 1 at height 1;
        store J + S for every height up to 10^6 and answer the queries from the table.'
  - id: lc-number-of-ways-to-stay-in-the-same-place-after-some-steps
    role: ladder
    card: sequence-counting
    rung: 6
    twist: The state space is huge (array length 10^6) but only a small part can matter.
    summary: A pointer starts at index 0 of an array of length up to 10^6; each of steps ≤ 500 moves goes
      left, right or stays, never outside. Count the ways to be at 0 at the end, modulo 10^9 + 7.
    hints:
      - Can the pointer use positions far to the right and still return to 0?
      - 'No: to come back it must spend as many steps returning as going, so positions beyond steps/2
        never count.'
      - Keep ways[p] for p up to min(arrLen − 1, steps/2); each step new[p] = ways[p − 1] + ways[p] +
        ways[p + 1] (within bounds). O(steps²).
  - id: ac-abc104_d
    role: ladder
    card: sequence-counting
    rung: 7
    twist: Sum a count over all fillings of the "?" at once, with states for "matched A", "matched AB",
      "matched ABC".
    summary: For a string of A, B, C and ? (length ≤ 10^5), add up over all 3^Q ways to replace the ?
      the number of subsequences ABC; print the sum modulo 10^9 + 7.
    hints:
      - Instead of the fillings, what do you count when you scan left to right?
      - 'Pairs (filling of the scanned part, partial match): cnt[0] = fillings so far, cnt[1] = (filling,
        chosen A), cnt[2] = (filling, A then B), cnt[3] = complete ABC.'
      - A fixed letter adds cnt[j − 1] to cnt[j] for its j; a ? first multiplies all counts by 3 (three
        letters) and then adds cnt[j − 1] to cnt[j] for each j, using the old values. Answer cnt[3].
  - id: lc-number-of-dice-rolls-with-target-sum
    role: ladder
    card: partition-counting
    rung: 1
    twist: Base case of the card
    summary: Count the ways to roll n ≤ 30 dice with k ≤ 30 faces each so that the faces add up to target
      ≤ 1000, modulo 10^9 + 7.
    hints:
      - Are the dice ordered, and how many parts does a sum have?
      - 'The dice are different (die 1, die 2, …), so order matters, and there are exactly n parts: the
        state is (dice rolled, sum so far).'
      - ways[i][s] = Σ over faces f ≤ min(k, s) of ways[i − 1][s − f], ways[0][0] = 1. O(n · target ·
        k).
  - id: cf-1673C
    role: ladder
    card: partition-counting
    rung: 2
    twist: Unordered sums whose parts are generated (palindromes), precomputed for many queries.
    summary: Count the ways to write n as a sum of positive palindromic integers, order ignored, for up
      to 10^4 queries with n ≤ 4·10^4, modulo 10^9 + 7.
    hints:
      - How many palindromes are there below 4·10^4, and does order matter?
      - 'About 500; order does not matter, so each multiset of palindromes is counted once: parts outside,
        totals inside (Theorem 3.3.3).'
      - Generate the palindromes, run the counting knapsack over totals up to 4·10^4 once (about 2·10^7
        steps), and answer each query from the table.
  - id: cf-431C
    role: ladder
    card: partition-counting
    rung: 3
    twist: An "at least one part ≥ d" condition.
    summary: In a tree where every node has k children joined by edges of weights 1..k, count the paths
      down from the root with total weight n ≤ 100 that use at least one edge of weight ≥ d, modulo 10^9
      + 7.
    hints:
      - What is a path from the root, written as a list of edge weights?
      - An ordered sum of parts 1..k equal to n. "At least one edge ≥ d" is a condition on the parts.
      - Count all ordered sums with parts 1..k, subtract those with parts 1..d − 1 only (Theorem 3.5.3),
        or keep a flag in the state.
  - id: ac-dp_m
    role: ladder
    card: range-sum-transition
    rung: 1
    twist: Base case of the card
    summary: Share K ≤ 10^5 identical candies among N ≤ 100 children, child i getting between 0 and a_i;
      count the ways, modulo 10^9 + 7.
    hints:
      - Write ways[i][j] as a sum over what child i gets. Which entries of the previous row does it add?
      - 'Child i takes t in 0..a_i, so the entries j − a_i .. j: a contiguous range.'
      - Keep prefix sums of the previous row; ways[i][j] = P[j + 1] − P[max(0, j − a_i)] modulo p (Theorem
        3.5.4). O(NK).
  - id: ac-dp_t
    role: ladder
    card: range-sum-transition
    rung: 2
    twist: The state is a relative rank, and the range depends on the next sign.
    summary: Count the permutations of 1..N (N ≤ 3000) that follow a given string of < and > between neighbours,
      modulo 10^9 + 7.
    hints:
      - Instead of the actual values, what about the last element of a prefix decides what may come next?
      - 'Its rank among the elements so far: dp[i][j] = prefixes of length i whose last element is the
        j-th smallest of them.'
      - 'For <, dp[i][j] = Σ dp[i − 1][k] over k < j; for >, over k ≥ j (ranks of the previous prefix).
        Both are ranges: prefix sums make it O(N²).'
  - id: ac-abc207_e
    role: ladder
    card: range-sum-transition
    rung: 3
    twist: The predecessors are not a range but a remainder class, collected while scanning.
    summary: Count the ways to cut an array (N ≤ 3000) into consecutive blocks so that the i-th block
      has a sum divisible by i, modulo 10^9 + 7.
    hints:
      - If the k-th block is (j, i], what condition links j and i?
      - 'prefix[i] ≡ prefix[j] (mod k): block k is valid exactly when the two prefix sums have the same
        remainder modulo k.'
      - dp[i][k] = Σ dp[j][k − 1] over earlier j with prefix[j] ≡ prefix[i] (mod k); keep acc[k][r] =
        sum of dp[j][k − 1] for each remainder r, updated as i advances. O(N²).
  - id: lc-minimum-path-sum
    role: drill
    summary: The smallest sum of a right/down path from the top-left to the bottom-right cell of an m
      × n grid (m, n ≤ 200) of non-negative numbers.
  - id: lc-minimum-falling-path-sum
    role: drill
    summary: The smallest sum of a path through an n × n matrix (n ≤ 100) that takes one cell per row,
      each next cell in the same or a neighbouring column.
  - id: lc-count-square-submatrices-with-all-ones
    role: drill
    summary: Count the square submatrices made only of 1s in a 0/1 matrix (up to 300 × 300).
  - id: lc-count-vowels-permutation
    role: drill
    summary: Count the strings of n ≤ 2·10^4 vowels in which each vowel may be followed only by certain
      vowels (a by e, e by a or i, and so on), modulo 10^9 + 7.
  - id: lc-knight-dialer
    role: drill
    summary: Count the phone numbers of length n ≤ 5000 dialed by a chess knight hopping on a phone keypad,
      modulo 10^9 + 7.
  - id: ac-abc211_c
    role: drill
    summary: Count the ways to choose 8 positions of a string (length ≤ 10^5) that spell "chokudai", modulo
