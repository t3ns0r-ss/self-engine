# Patterns for topic 7.9 (Maximum flow, minimum cut, bipartite matching). Cards of the lesson: flow-or-cut and pairing; no-flow holds the look-alike partners and the drill problems that look like flow or matching but are answered by a tool of an earlier topic.
topic: "7.9"
patterns:
  - id: flow-cut
    name: Maximum flow, minimum cut and choosing a side for every item
    description: A quantity is routed through capacities from a source to a sink, paths must share no edge or vertex, or every item picks one of two sides with a cost for the item and a penalty for pairs that are separated. The answer is the value of a maximum flow or the capacity of a minimum cut.
    precondition: All capacities and penalties are non-negative, the network can be written down in at most about 10^5 edges, and the cost of a choice is the sum over the cut edges, with no cost per unit sent.
  - id: matching
    name: Pairing items with slots, and König's theorem
    description: Items of one kind are paired with items of another kind through a list of allowed pairs, each item used at most once; or a set of rows and columns must cover or avoid all marked cells, which is a vertex cover or an independent set of a bipartite graph.
    precondition: The allowed pairs form a bipartite graph, every pair counts the same (no costs on the pairs), and the allowed lists have no threshold or interval structure that a sorted greedy already uses.
  - id: no-flow
    name: Looks like flow or matching, but an earlier tool is enough
    description: The statement has capacities, pairs, assignments or paths that must not share anything, but the lists are intervals or thresholds, the sizes are tiny, the answer needs a count of assignments or the exact set that is used, or a closed form or a sorted pass answers it.
    precondition: A sorted greedy, a bitmask search, a counting inequality with binary search, a DP or a closed form is enough, or the quantity asked for is not a maximum flow, a minimum cut or a matching size.
