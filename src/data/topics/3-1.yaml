# Topic 3.1 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.1"
draft: true
cards:
  - id: generate-all
    name: List every valid object
    decisive_property: "The answer is the list (or the count) of all objects of some kind, there are few enough of them to list, and each object has one canonical order of choices (increasing indices, equal values left to right), so a recursion that only makes choices in that order produces each object exactly once."
    from_theorem: Theorem 3.1.2
    how_to_test: "Estimate the number of valid objects (C(n, k), n!, a multinomial, 2^n) and multiply by the depth; then fix the canonical order and check that two different choice sequences in that order never give the same object."
    weak_signals:
      - "\"Return all …\" combinations, permutations, subsets, partitions or arrangements"
      - "Input has repeated values but the output must not contain duplicates"
      - "n up to about 10–20, or the output itself is the size of the answer"
    kill_signals:
      - "Only the number of objects is asked and that number is huge (10^9 or more, or printed modulo a prime): count with a formula (2.3) instead of listing"
      - "The same sub-question recurs many times in the recursion and its answer does not depend on how it was reached (topic 3.2)"
    lookalikes:
      - description: "Count the subsets of n ≤ 20 numbers with a given sum, without listing them"
        needs: "subset-bitmask (0.5)"
        flipping_difference: "Only a count of objects with 2^n candidates is needed, so a plain bitmask loop is enough and no duplicates need skipping; listing distinct multisets is what needs the canonical order."
    complexity: "O(depth × number of outputs) when every partial choice can be completed; more if dead ends are reached."
  - id: constraint-placement
    name: Place with checks and undo
    decisive_property: "Positions are filled one at a time and every constraint can be checked as soon as the items it involves are placed, so a partial placement that already breaks a constraint can be rejected without extending it, and no partial placement that could still be completed is rejected."
    from_theorem: Theorem 3.1.1
    how_to_test: "For each constraint, find the moment all its items are placed, and check that the test at that moment only reads placed items; then make sure every mark set before a call is cleared after it."
    weak_signals:
      - "A puzzle on a small board or grid: queens, a 9×9 grid, a word path through letters"
      - "Assign values to a few positions so that pairs or groups satisfy rules"
      - "The raw number of placements is astronomically large but the board is small"
    kill_signals:
      - "A constraint can only be checked when everything is placed (pruning does nothing; estimate the full count)"
      - "The board is large and the question is about reachability or distances (Phase 4)"
    lookalikes:
      - description: "Count the ways to place n non-attacking rooks on an n × n board"
        needs: "product-sum-rules (2.3)"
        flipping_difference: "Rooks only constrain rows and columns, so the count is n! by a formula; queens add diagonals, which no simple formula handles."
    complexity: "No clean worst case; count the nodes on the hardest small input (10 queens: 35 539 calls)."
  - id: bound-pruning
    name: Branch and bound
    decisive_property: "It is an optimisation over choices, and for a partial solution there is an optimistic estimate (never worse than any completion) that is cheap to compute; then a branch whose estimate cannot beat the best solution already found can be cut without losing the optimum."
    from_theorem: Theorem 3.1.3
    how_to_test: "Write the estimate and prove it never understates what the rest can achieve (for a minimum: never overstates the cheapest completion); then order the choices so a good solution is found first."
    weak_signals:
      - "Minimise the largest load, or maximise a total, over assignments of n ≤ 12–20 items to k groups"
      - "Split items into equal-sum groups, sticks into a square, cookies among children"
      - "A good greedy answer exists but is not always optimal"
    kill_signals:
      - "The value of the rest depends only on a small summary of what was chosen (for example the remaining capacity), so equal summaries repeat (topic 3.3)"
      - "n is around 40 and the objective splits into two halves (meet in the middle has a guarantee)"
    lookalikes:
      - description: "Split n ≤ 40 numbers into two groups with sums as close as possible"
        needs: "meet-in-middle (3.1)"
        flipping_difference: "Two groups and n ≈ 40: the objective is a sum that splits into halves, so meet in the middle gives O(2^(n/2) n) with a guarantee instead of hoping the bound cuts enough."
    complexity: "No useful worst case; exponential, cut by how tight the estimate is."
  - id: meet-in-middle
    name: Meet in the middle
    decisive_property: "There are n ≈ 30–45 binary (or few-valued) choices, too many for 2^n, and the objective splits into a part from each half combined by a simple rule (a sum, an exclusive or), so that the question about the combination can be answered by searching a sorted list of one half for each element of the other."
    from_theorem: Theorem 3.1.4
    how_to_test: "Write the objective as f(left choices) ⊕ g(right choices) and check that 'equal to', 'at most' or 'closest to' a target for the combination is a lookup in the sorted list of g-values."
    weak_signals:
      - "n up to 40 (or 35–45): too many for 2^n but 2^(n/2) ≈ 10^6 fits"
      - "Subset sums equal to, at most, or closest to a target, possibly modulo m"
      - "Paths of fixed length in a grid with an exclusive-or or sum condition (split at the middle diagonal)"
    kill_signals:
      - "n ≤ 20: plain bitmask search (0.5) is enough"
      - "The values are small (sums up to about 10^5 to 10^7), so the number of different sums is small (topic 3.3)"
    lookalikes:
      - description: "Count subsets of n ≤ 20 numbers with sum at most T"
        needs: "subset-bitmask (0.5)"
        flipping_difference: "n ≤ 20 makes 2^n ≈ 10^6 small enough to list directly; splitting only pays off when n is around 40."
    complexity: "O(2^(n/2) · n): two lists, a sort, and a binary search per element."
problems:
  - id: ac-abc378_d
    role: worked_example
    summary: Count the walks of exactly K ≤ 11 moves between side-adjacent empty cells of an H × W grid
      (H, W ≤ 10) that never visit a cell twice.
  - id: ac-abc184_f
    role: worked_example
    summary: The largest total of a subset of N ≤ 40 times (each ≤ 10^9) that does not exceed T ≤ 10^9.
  - id: lc-combinations
    role: ladder
    card: generate-all
    rung: 1
    twist: Base case of the card
    summary: List all k-element subsets of {1, …, n} (n ≤ 20).
    hints:
      - How do you make sure {1, 2} and {2, 1} are not both produced?
      - 'Choose the numbers in increasing order: the next number is always larger than the last one taken
        (Theorem 3.1.2, part 1).'
      - 'rec(start): if k numbers are chosen, record them; otherwise for x = start..n push x, call rec(x
        + 1), pop x. Optional cut: stop when fewer than (k − chosen) numbers remain.'
  - id: lc-subsets-ii
    role: ladder
    card: generate-all
    rung: 2
    twist: The input has repeated values, and the output must not repeat a subset.
    summary: List every distinct subset of an array with repeated values (n ≤ 10).
    hints:
      - With values (1, 2, 2), why does the plain increasing-index recursion print {2} twice?
      - Sort first; inside one loop, skip a value equal to the previous value tried in the same loop (i
        > start and a[i] = a[i − 1]) (Theorem 3.1.2, part 2).
      - 'This is the distinct sub-multisets template of Section 6: record at every call, loop i from start,
        skip repeats within the loop, recurse on i + 1, undo.'
  - id: lc-permutations-ii
    role: ladder
    card: generate-all
    rung: 3
    twist: 'Arrangements instead of subsets: every element is used once, in any order, with repeated values.'
    summary: List every distinct arrangement of an array with repeated values (n ≤ 8).
    hints:
      - Two copies of the same value are different indices. Which order of the copies will you allow?
      - 'Allow only one order of equal copies, left to right: skip a[i] when a[i] = a[i − 1] and index
        i − 1 is still unused.'
      - Sort; keep used[]; at each position try every unused index except skipped repeats; mark, recurse,
        unmark (the distinct arrangements template).
  - id: lc-palindrome-partitioning
    role: ladder
    card: generate-all
    rung: 4
    twist: 'The choices are pieces of a string: each choice is where the next piece ends, and a piece
      is allowed only if it is a palindrome.'
    summary: List every way to cut a string (length ≤ 16) into pieces that are all palindromes.
    hints:
      - What does one recursive call decide, and what is left for the next call?
      - A call at position start chooses the end of the next piece; only palindromic pieces are allowed,
        so every recorded partition is valid and each partition has one sequence of ends.
      - 'rec(start): if start = n, record the pieces; else for end = start..n − 1, if s[start..end] is
        a palindrome, push it, rec(end + 1), pop. A table isPal[i][j] avoids rechecking.'
  - id: lc-split-a-string-into-the-max-number-of-unique-substrings
    role: ladder
    card: generate-all
    rung: 5
    twist: All pieces must be different, so a set of used pieces is shared state to add to and remove
      from; and the answer is a maximum, not a list.
    summary: Cut a string (length ≤ 16) into the largest number of pieces that are all different.
    hints:
      - What shared state does the "all different" rule need, and when must it be restored?
      - Keep a set of the pieces used so far; a piece may be taken only if it is not in the set; insert
        before the call, erase after (Theorem 3.1.1, condition 2).
      - 'rec(start, count): at the end update the best count; else for each end, if the piece is new,
        insert it, rec(end + 1, count + 1), erase it. Optional cut: count + (characters left) ≤ best.'
  - id: lc-maximum-length-of-a-concatenated-string-with-unique-characters
    role: ladder
    card: generate-all
    rung: 6
    twist: The conflict test between chosen strings is done with 26-bit letter masks (topic 1.7).
    summary: Choose some of up to 16 strings whose letters are all different across the chosen ones; maximise
      the total length.
    hints:
      - How do you test in O(1) that a new string shares no letter with the strings chosen so far?
      - Turn each string into a mask of its letters (drop strings with a repeated letter); a string fits
        when its mask AND the current mask is 0.
      - 'rec(i, mask): update best with the number of bits of mask; for j = i..n − 1, if masks[j] & mask
        is 0, rec(j + 1, mask | masks[j]).'
  - id: lc-expression-add-operators
    role: ladder
    card: generate-all
    rung: 7
    twist: Each choice changes a value that must be evaluated as you go, and multiplication binds tighter
      than + and −.
    summary: Insert +, − or * between the digits of a string (length ≤ 10) in all ways that evaluate to
      a target; numbers may not have leading zeros.
    hints:
      - If you only keep the value so far, what goes wrong when the next operator is *?
      - 'Keep the value so far and the last term added (with its sign). For *, replace that term: value
        − last + last·x, and the new last term is last·x.'
      - 'rec(pos, value, last, expr): for each end of the next operand (skip operands with a leading zero),
        recurse with +x, −x and *x as above; at the end of the string, record expr if value = target.
        Use long long.'
  - id: lc-word-search
    role: ladder
    card: constraint-placement
    rung: 1
    twist: Base case of the card
    summary: Is a word (length ≤ 15) spelled by a path of side-adjacent cells of a small letter grid (at
      most 6 × 6), using each cell at most once?
    hints:
      - What must you remember about the current path, and when does it have to be forgotten?
      - Mark the cells of the current path; a neighbour can be used if it matches the next letter and
        is not marked. Unmark on return (Theorem 3.1.1).
      - 'For each cell matching the first letter: rec(cell, k) marks the cell, returns true if k is the
        last index, tries the four neighbours matching word[k + 1], unmarks, and returns whether any succeeded.'
  - id: lc-the-number-of-beautiful-subsets
    role: ladder
    card: constraint-placement
    rung: 2
    twist: The constraint is between pairs of values (no two chosen values differ by exactly k), checked
      with a count array of chosen values.
    summary: Count the non-empty subsets of up to 18 numbers in which no two numbers differ by exactly
      k.
    hints:
      - When you add a number x, which numbers already chosen could break the rule?
      - Only x − k and x + k. Keep a count of each chosen value; x may be added when both counts are 0
        (the test only reads chosen values).
      - 'rec(i): if i = n, count one subset; else skip a[i] with rec(i + 1), and if allowed, increase
        cnt[a[i]], rec(i + 1), decrease it. Subtract 1 for the empty subset.'
  - id: lc-restore-ip-addresses
    role: ladder
    card: constraint-placement
    rung: 3
    twist: Besides the per-piece checks (no leading zero, at most 255), a length check cuts a partial
      split that cannot be completed.
    summary: Insert three dots into a digit string (length ≤ 20) in every way that gives four valid address
      parts.
    hints:
      - After choosing some parts, how can you tell that the rest of the string cannot be split into the
        remaining parts?
      - Each remaining part has 1 to 3 digits, so the remaining length must be between (parts left) and
        3·(parts left); reject otherwise. Each part must have no leading zero and value ≤ 255.
      - 'rec(pos, parts): if parts = 4, record when pos = n; else for length 1..3, if the part is valid
        and the length check passes, push it, recurse, pop.'
  - id: lc-split-array-into-fibonacci-sequence
    role: ladder
    card: constraint-placement
    rung: 4
    twist: 'Only the first two choices are free: every later number is forced, so the search is over the
      first two numbers only.'
    summary: Split a digit string (length ≤ 200) into a Fibonacci-like sequence of at least 3 numbers
      below 2^31, without leading zeros; return one.
    hints:
      - Once the first two numbers are fixed, how many choices remain for the third?
      - 'None: the third is the sum of the first two, and then every later one is forced. Try every first
        and second number (no leading zeros, < 2^31) and check the rest of the string by walking forward.'
      - For each split into a first and a second number, repeatedly compute the next sum, check that the
        string continues with exactly its digits (and stays below 2^31), and stop at the end of the string
        with at least 3 numbers.
  - id: lc-fair-distribution-of-cookies
    role: ladder
    card: bound-pruning
    rung: 1
    twist: Base case of the card
    summary: Give each of up to 8 bags of cookies to one of k children so that the largest total any child
      receives is as small as possible.
    hints:
      - If one child already has more than your best answer, can this branch still improve it?
      - 'No: totals only grow, so the current largest total is an optimistic estimate; cut when it is
        ≥ the best (Theorem 3.1.3).'
      - 'The smallest-largest-load template of Section 6: give each bag to each child in turn (only one
        empty child, by symmetry), cut on currentMax ≥ best, undo after each call.'
  - id: ac-abc233_c
    role: ladder
    card: bound-pruning
    rung: 2
    twist: 'The bound also protects against overflow: a product above X can never come back down, so the
      branch is cut before multiplying past 10^18.'
    summary: Choose one ball from each of N bags (the product of the bag sizes ≤ 10^5); count the choices
      whose product of numbers is exactly X ≤ 10^18.
    hints:
      - All numbers are at least 1. What happens to the product of a branch once it is larger than X?
      - 'It never decreases, so the branch cannot reach X: cut it. Test product > X / a before multiplying,
        so the product never overflows.'
      - 'rec(i, product): if i = N, count when product = X; else for each ball a in bag i, if a ≤ X /
        product, rec(i + 1, product · a).'
  - id: ac-abc268_d
    role: ladder
    card: bound-pruning
    rung: 3
    twist: Two layers of choices (an order of the words, then how many underscores between them), cut
      by a length limit, and the goal is any name not in a forbidden set.
    summary: Build a name of length 3 to 16 from N ≤ 8 given words in some order, joined by one or more
      underscores, that is not one of M ≤ 10^5 taken names; print any or −1.
    hints:
      - How many underscores can you still afford after placing the words of a given order?
      - The total length is at most 16, so the extra underscores are limited by 16 − (letters + N − 1);
        recursing on the number of underscores with that limit keeps the search small. Put the taken names
        in a set (topic 0.6).
      - Try every order of the words (next_permutation over indices); for each, recursively choose the
        number of underscores between consecutive words while the length stays ≤ 16; at the end check
        length ≥ 3 and that the name is not in the set.
  - id: cses-1625
    role: ladder
    card: bound-pruning
    rung: 4
    twist: Plain backtracking is far too slow; cuts based on the shape of the visited region (the path
      must not split the unvisited cells) make it fast.
    summary: Count the paths from the top-left to the bottom-left corner of a 7 × 7 grid visiting every
      cell once, where some of the 48 moves are fixed by a given description.
    hints:
      - 'Count the paths without any cut: how many calls is that? What situations make a partial path
        hopeless long before it ends?'
      - 'Reaching the bottom-left corner before the last move is hopeless. So is a path that hits a wall
        or visited cell straight ahead while the cells to its left and right are both unvisited: the unvisited
        cells are split into two parts, and a single path cannot cover both.'
      - Backtrack over the 48 moves with the given letters forced, marking visited cells; apply both cuts
        at every step before recursing; count the paths that end at the corner after exactly 48 moves.
  - id: cf-888E
    role: ladder
    card: meet-in-middle
    rung: 1
    twist: Base case of the card
    summary: Choose a subset of n ≤ 35 numbers to maximise the sum of the chosen numbers modulo m (m ≤
      10^9).
    hints:
      - 2^35 subsets are too many. How many subsets does each half have, and what must you look up for
        one subset of the left half?
      - Keep both lists of subset sums modulo m. For a left value a, the best partner is the largest right
        value b < m − a (no wrap), or else the largest right value overall (the sum wraps past m and loses
        m) (Theorem 3.1.4).
      - Sort the right list; for each a, binary-search the largest b ≤ m − 1 − a and also try the largest
        b; take the best (a + b) mod m over all a.
  - id: lc-partition-array-into-two-arrays-to-minimize-sum-difference
    role: ladder
    card: meet-in-middle
    rung: 2
    twist: The two halves must contribute a fixed total number of elements, so the lists are grouped by
      how many elements they take.
    summary: Split 2n ≤ 30 numbers into two arrays of n each so that the absolute difference of their
      sums is as small as possible.
    hints:
      - If k elements of the first array come from the left half, how many must come from the right half?
      - n − k. So list the left sums grouped by count k and the right sums grouped by count, sort each
        group, and for a left sum s with count k search the right group n − k for the value closest to
        total/2 − s.
      - For each k and each left sum s in group k, binary-search the sorted right group n − k around total/2
        − s and check the neighbours; the difference is |total − 2·(s + y)|.
  - id: ac-abc402_f
    role: ladder
    card: meet-in-middle
    rung: 3
    twist: The halves are not halves of a list but halves of a path in a grid, met on the anti-diagonal;
      each cell there has its own pair of lists.
    summary: On an N × N grid of digits (N ≤ 20), walk right or down from corner to corner and read the
      2N − 1 digits as a number; maximise it modulo M ≤ 10^9.
    hints:
      - A full path has 2^(2N−2) choices. Where can you cut every path into two parts of N − 1 moves each?
      - Every path crosses the anti-diagonal exactly once. For each cell on it, list the values of the
        first halves (the prefix digits times the right power of 10, modulo M) and of the second halves
        (the suffix values modulo M).
      - For each anti-diagonal cell, sort one list; for each x in the other, take the largest y < M −
        x, or else the largest y; keep the best (x + y) mod M over all cells.
  - id: ac-abc271_f
    role: ladder
    card: meet-in-middle
    rung: 4
    twist: 'Count instead of maximise, and XOR instead of a sum: the halves are matched by equal values
      in a map.'
    summary: Count the right-or-down paths through an N × N grid (N ≤ 20) whose XOR of all visited numbers
      is 0.
    hints:
      - Where do all paths cross, and which value must the second half of a path have, given the first
        half?
      - Every path crosses the anti-diagonal once. XOR of the whole path is 0 exactly when the XOR of
        the first part (including the meeting cell) equals the XOR of the second part (excluding it).
      - For each anti-diagonal cell, store in a map the count of each first-half XOR value; then walk
        all second halves from the far corner back to that cell and add the count of the matching value.
  - id: ac-abc326_f
    role: ladder
    card: meet-in-middle
    rung: 5
    twist: Two independent sign problems (one per axis), each solved by meet in the middle, and the answer
      must be rebuilt as a sequence of turns.
    summary: A robot alternately moves along the y and x axes by given lengths (N ≤ 80) and chooses a
      left or right turn before each move; reach a target point and print the turns, or report it is impossible.
    hints:
      - What freedom does each move really have once you look only at its axis?
      - 'Each y-move gets a free sign, independently, and so does each x-move: each axis is a problem
        "choose signs of at most 40 numbers to hit a target", solved by meet in the middle with a map
        from half-sums to sign choices.'
      - Solve both axes; if either fails print No. Otherwise convert the chosen signs to the direction
        of each move and, from the current heading, to L or R.
drill: []
lookalike_pairs: []
self_test: []
