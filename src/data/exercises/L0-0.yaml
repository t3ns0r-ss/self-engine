- id: r-5
  role: drill
  type: recognise
  title: A factory that hands over a parser
  prompt: A factory builds a parser and gives sole ownership to its caller.
  answer:
    kind: card
    card: *id002
    property: 'One owner after the factory returns: a unique_ptr returned by value.'
    why_others_fail: A raw pointer leaves the delete to the caller; a shared_ptr pays for a count nobody needs.
  checkers: []
