# Topic 1.5 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.5'
uses:
- topic: '0.1'
  what: 'long long: sums and weighted sums in this lesson pass 2·10^9, some reach 4·10^18'
- topic: '0.3'
  what: Case analysis and one-pass scans, used by several negative examples
- topic: '0.4'
  what: Remainders and divisibility, used by one ladder problem
- topic: '0.5'
  what: 'Brute force: the reference that every greedy rule is tested against, and the source of counterexamples'
- topic: '0.6'
  what: multiset and priority_queue, for the greedy rules whose choice must be updated
- topic: '1.1'
  what: 'Sorting: most greedy rules process items in a sorted order, and comparators (Theorem 1.1.3) express
    that order'
- topic: '1.2'
  what: 'Prefix sums: sums of chosen items'
- topic: '1.3'
  what: 'Two pointers: matching two sorted lists by walking them'
- topic: '1.4'
  what: 'Binary search: Lemma 1.4.4 was a first greedy proof, and searching on the answer often wraps
    a greedy check'
theorems:
- id: 1.5.1
  title: If swapping neighbours never hurts, sorting by the key is optimal
  plain_words: To find the best order of items, compare two neighbours x then y with y then x. If the
    swap never makes the cost worse when the larger key comes first, then sorting the items by that key
    gives an optimal order.
  code: 1.5/thm-1
- id: 1.5.2
  title: Earliest end first keeps the most disjoint intervals
  plain_words: To choose as many non-overlapping intervals as possible, always take the one that ends
    first among those still allowed. The greedy choices end no later than any other choice at every step,
    so it never falls behind, and its ends are also the fewest points that hit every interval.
  code: 1.5/thm-2
- id: 1.5.3
  title: The most extreme items are the best ones
  plain_words: When items count independently and only the number taken is limited, the k largest items
    give the largest total, and taking the largest first reaches a target with the fewest items. The same
    holds for splittable goods, taking the most valuable units first.
  code: 1.5/thm-3
- id: 1.5.4
  title: The smallest sufficient partner never hurts the others
  plain_words: When children are matched to cookies and a cookie works for a child exactly when it is
    big enough, give each child, from the least greedy up, the smallest cookie that is big enough. A larger
    cookie would only be more useful to someone else.
  code: 1.5/thm-4
- id: 1.5.5
  title: A choice that dominates every other state is never worse
  plain_words: If processing positions from left to right and the greedy choice at each position reaches
    a state at least as good as any other choice's state, the greedy result is at least as good as any
    other result.
  code: 1.5/thm-5
cards:
- id: exchange-order
  name: Order by an exchange argument
  decisive_property: The task is to choose an order of items, and comparing two adjacent items x, y with
    "x then y" against "y then x" shows that the item with the smaller key should come first, regardless
    of the others; so sorting by that key is optimal.
  from_theorem: 1.5.1
  how_to_test: Write the cost change of swapping two adjacent items in the middle of any order; check
    that it depends only on those two and has a fixed sign once their keys are compared.
  constraint_shapes:
  - 'n up to 2·10^5 items: trying every order is n! (already 3.6·10^6 for n = 10), while sorting by the
    key is 3.6·10^6 comparisons; sums of weight times time can reach 4·10^18, so long long is tight.'
  weak_signals:
  - form: Asks in which order tasks should be done, to minimise a total waiting time or a total penalty
    shape: n up to 2·10^5 tasks, each with a duration and possibly a weight or deadline
  - form: The cost of an item depends on the items done before it
    shape: A running total of durations multiplies the weight of each task
  - form: Asks whether every job can finish by its deadline
    shape: Durations and deadlines for n tasks
  kill_signals:
  - 'The key ignores a factor of the cost: for jobs (duration, weight) = (1, 1) and (2, 10), shortest
    first gives 31, but sorting by duration over weight gives 23.'
  - 'The order matters through another quantity: for jobs (duration 3, deadline 3) and (1, 10), shortest
    first runs the second job first and the first misses its deadline (finishes at 4); sorting by deadline
    fits both.'
  in_action:
    statement: n jobs with durations t_i and weights w_i are done one after another from time 0. Minimise
      the sum of w_i times the finishing time of job i.
    constraints: n ≤ 2·10^5, t_i, w_i ≤ 10^4.
    budget: Trying every order is n!, hopeless for n = 2·10^5. Sorting is about 3.6·10^6 comparisons.
    candidates:
    - tool: Try every order
      verdict: rejected
      because: n! orders.
    - tool: Sort by t / w using an exchange argument (this topic)
      verdict: chosen
      because: Swapping two adjacent jobs x, y changes the sum by w_x · t_y − w_y · t_x, which has a fixed
        sign once t_x / w_x is compared with t_y / w_y.
    property_check: For adjacent x before y starting at time T, the cost of the pair is w_x (T + t_x)
      + w_y (T + t_x + t_y); swapping gives w_y (T + t_y) + w_x (T + t_x + t_y). The difference is w_x
      t_y − w_y t_x, independent of T and of the other jobs (Theorem 1.5.1). So x should come first when
      t_x / w_x < t_y / w_y.
    decision: Sort by t / w using the exact comparison t_x · w_y < t_y · w_x; add w · (running time) in
      long long.
  examples:
    positive:
    - inline:
        input: The smallest sum of finishing times for durations 3, 1, 2
        answer: '10'
        why: Shortest first gives the finishing times 1, 3, 6, a sum of 10; the input order finishes at
          3, 4, 6, a sum of 13. Swapping a longer task before a shorter one only adds to the sum.
    - inline:
        input: The smallest sum of w times the finishing time for the jobs (t, w) = (2, 1) and (1, 3)
        answer: '6'
        why: Sorting by t / w puts (1, 3) first, giving the finishing times 1, 3 and the cost 3 · 1 +
          1 · 3 = 6; the other order costs 1 · 2 + 3 · 3 = 11.
    negative:
    - inline:
        input: The jobs (t, w) = (1, 1) and (2, 10), ordered by duration alone
        answer: '23'
        method_gives: '31'
        why: Shortest first runs the unimportant job first and costs 1 · 1 + 10 · 3 = 31. The weight changes
          the swap effect, and the right key is t / w, which puts the second job first for 10 · 2 + 1
          · 3 = 23.
      correct_tool:
        topic: '1.5'
        card: exchange-order
    - inline:
        input: Can the jobs (duration 3, deadline 3) and (duration 1, deadline 10) both meet their deadlines,
          if they are run shortest first?
        answer: 'yes'
        method_gives: 'no'
        why: Shortest first runs the second job first, so the first one finishes at 4, after its deadline
          3. Sorting by deadline runs the first job to 3 and the second to 4, which meets both.
      correct_tool:
        topic: '1.5'
        card: exchange-order
  lookalikes:
  - description: Order the items so that a running total never drops below zero, with items that can also
      be skipped
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: Skipping makes the decision a subset choice, which a single adjacent swap does
      not settle; for small n the subsets can be tried.
  complexity: O(n log n).
- id: interval-selection
  name: Earliest end first
  decisive_property: Every chosen interval counts the same and chosen intervals must not overlap, so taking
    the compatible interval that ends first keeps the greedy ahead of any other selection; the same ends
    give the fewest points that hit all intervals.
  from_theorem: 1.5.2
  how_to_test: Check that the goal is a count (not a total weight) and that touching intervals are handled
    as the statement says.
  constraint_shapes:
  - 'n up to 2·10^5 intervals with coordinates up to 10^9: trying every subset is 2^n, while sorting by
    end is 3.6·10^6 comparisons and one scan.'
  weak_signals:
  - form: Asks for the most meetings, films or events, or the fewest intervals to remove so that the rest
      do not overlap
    shape: n up to 2·10^5 intervals in any order
  - form: Asks for the fewest arrows, points or bombs that hit every interval
    shape: Intervals with large coordinates; one point may hit many intervals
  kill_signals:
  - 'All intervals must be kept and grouped: for [1, 5], [2, 3], [4, 6], [7, 8] the earliest-end rule
    keeps 3, but only 2 groups are needed, because at most 2 intervals overlap at any point.'
  - 'Touching intervals are treated as disjoint when the statement counts them as overlapping: [1, 3]
    and [3, 5] share the point 3, so only 1 can be kept, but testing s ≥ lastEnd keeps 2.'
  in_action:
    statement: There are n events [s_i, e_i]. Choose as many as possible so that no two share a point.
    constraints: n ≤ 2·10^5, 0 ≤ s_i ≤ e_i ≤ 10^9.
    budget: Trying every subset is 2^(2·10^5). Sorting by end is 3.6·10^6 comparisons, and the scan is
      2·10^5.
    candidates:
    - tool: Try every subset of the events
      verdict: rejected
      because: 2^n subsets.
    - tool: Sort by end and take each event that starts after the last chosen one ends (this topic)
      verdict: chosen
      because: Every event counts the same, and taking the earliest end leaves the most room for the rest.
    property_check: Let the greedy choices end at e(g_1) ≤ e(g_2) ≤ … and any valid selection at e(o_1)
      ≤ e(o_2) ≤ …. By induction e(g_j) ≤ e(o_j), so the greedy never falls behind, and it cannot stop
      earlier than any other selection (Theorem 1.5.2). Touching events share a point, so the next start
      must exceed the last end.
    decision: Sort by end; keep lastEnd = −1; take an interval when its start is greater than lastEnd.
  examples:
    positive:
    - inline:
        input: The most pairwise disjoint intervals among [1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5,
          9], [6, 10], [8, 11] (touching overlaps)
        answer: '3'
        why: By end the greedy takes [1, 4], then [5, 7] (it starts after 4), then [8, 11]; the others
          each overlap one of these, and no selection of 4 exists.
    - inline:
        input: The fewest points that hit every one of the same eight intervals
        answer: '3'
        why: The ends 4, 7 and 11 of the chosen intervals hit all eight; three points are also needed,
          since three intervals are pairwise disjoint.
    negative:
    - inline:
        input: The fewest groups of pairwise disjoint intervals for [1, 5], [2, 3], [4, 6], [7, 8], answered
          with the number of intervals the earliest-end rule keeps
        answer: '2'
        method_gives: '3'
        why: Nothing may be removed here, so the answer is the largest number of intervals that overlap
          at one point, 2. The earliest-end rule counts the intervals that can all be kept, 3, a different
          quantity.
      correct_tool:
        topic: '1.1'
        card: event-sweep
    - inline:
        input: The most disjoint intervals among [1, 3] and [3, 5], with the test s ≥ lastEnd instead
          of s > lastEnd
        answer: '1'
        method_gives: '2'
        why: The intervals touch at 3, which counts as overlapping. The next start must be strictly greater
          than the last end.
      correct_tool:
        topic: '1.5'
        card: interval-selection
  lookalikes:
  - description: Split all intervals into the fewest groups of non-overlapping intervals
    tool:
      topic: '1.1'
      card: event-sweep
    flipping_difference: Nothing may be removed, so the answer is how many intervals overlap at the busiest
      point.
  complexity: O(n log n).
- id: extreme-first
  name: Most extreme first
  decisive_property: 'Items contribute independently and the only limit is how many items (or units) are
    taken, so the k most valuable items (or units) are best: any other choice can be improved item by
    item.'
  from_theorem: 1.5.3
  how_to_test: Check that an item's value does not depend on which others are taken and that the limit
    is a count, not a size.
  constraint_shapes:
  - 'n up to 2·10^5 items and a target up to 2·10^14: trying every subset is 2^n, while sorting is 3.6·10^6
    and the running sum 2·10^5; with units, the total value can reach 2·10^18.'
  weak_signals:
  - form: Asks for the fewest items whose total reaches a target, or the largest total of at most k items
    shape: n up to 2·10^5 values and one limit
  - form: Describes goods that can be split, each unit worth a fixed value
    shape: Units up to 10^9 per good and a total capacity W
  - form: The smallest or largest remaining item decides what must happen to it
    shape: A sorted order of items and a block rule, as in batches of d days
  kill_signals:
  - 'Items have sizes and cannot be split: with capacity 10 and items (size 6, value 7), (5, 5), (5, 5),
    taking the best value per size first gives 7, but the two items of size 5 give 10.'
  - 'The wrong end is taken: for the fewest items of 5 1 4 2 with sum at least 9, the smallest first needs
    4 items, while the largest first needs 2.'
  in_action:
    statement: Given n positive values and a target T, find the fewest values whose sum is at least T.
    constraints: n ≤ 2·10^5, values up to 10^9, T up to 2·10^14.
    budget: Trying every subset is 2^(2·10^5). Sorting is 3.6·10^6 and the running sum 2·10^5.
    candidates:
    - tool: Try every subset
      verdict: rejected
      because: 2^n subsets.
    - tool: Sort in decreasing order and add values until the sum reaches T (this topic)
      verdict: chosen
      because: Each value counts on its own, and the k largest values have the largest possible sum for
        any k.
    property_check: For any k, the sum of the k largest values is at least the sum of any k values (Theorem
      1.5.3, part 1). So if some t values reach T, the t largest do too, and the greedy uses at most t.
    decision: Sort decreasing; add values one by one; print the count at the first sum at least T, or
      −1.
  examples:
    positive:
    - inline:
        input: The fewest of 5, 1, 4, 2 with sum at least 9
        answer: '2'
        why: The largest two, 5 and 4, already sum to 9, and no single value reaches 9.
    - worked_example: ac-abc318_c
      why: The fares of the most expensive days are better covered by passes than the cheap ones, so sorting
        the fares in decreasing order and covering them in blocks of d days gives the cheapest plan.
    negative:
    - inline:
        input: Capacity 10 and the unsplittable items (size, value) = (6, 7), (5, 5), (5, 5), taken by
          best value per size
        answer: '10'
        method_gives: '7'
        why: The first item has the best value per size (7 / 6) but leaves room for nothing else, so the
          total is 7. The two items of size 5 give 10. With sizes and no splitting, a choice of subset
          is needed.
      correct_tool:
        topic: '0.5'
        card: subset-bitmask
    - inline:
        input: The fewest of 5, 1, 4, 2 with sum at least 9, taking the smallest values first
        answer: '2'
        method_gives: '4'
        why: The smallest first reaches 1, 3, 7, 12, needing all four. The rule is to take the most valuable
          item first.
      correct_tool:
        topic: '1.5'
        card: extreme-first
  lookalikes:
  - description: Items with sizes and values that cannot be split, under a size limit
    tool:
      topic: '0.5'
      card: subset-bitmask
    flipping_difference: Unsplittable items of different sizes break the item-by-item improvement; for
      small n the subsets can be tried.
  complexity: O(n log n).
- id: sorted-matching
  name: Matching two sorted lists
  decisive_property: 'Items of one list are paired with items of another, and whether a pair works (or
    what it costs) depends on a threshold in one sorted order, so pairs never need to cross: walking both
    sorted lists and giving each item the smallest sufficient partner is optimal.'
  from_theorem: 1.5.4
  how_to_test: Check that a smaller partner that works is never more useful to the others than a larger
    one, so uncrossing two pairs never hurts.
  constraint_shapes:
  - 'n and m up to 2·10^5: trying every assignment is m!/(m − n)!, while sorting both lists is 7·10^6
    steps and the matching walk n + m = 4·10^5.'
  weak_signals:
  - form: Pairs children with cookies, people with seats, or tasks with workers
    shape: Two lists of up to 2·10^5 items, each item used at most once
  - form: Asks for the maximum number of pairs
    shape: A pair works when a value in one list is at least a value in the other
  - form: Asks to pair the smallest with the largest to balance sums
    shape: A single list paired with itself from both ends
  kill_signals:
  - 'A pair depends on two attributes at once: for children (greed 1, taste a), (2, b) and cookies (size
    3, flavour b), (3, b), sizes alone say 2 children are satisfied, but only the second child likes the
    flavour.'
  - 'The largest cookie is given instead of the smallest sufficient one: for greed 1, 3 and cookies 3,
    1 it satisfies only 1 child, while giving the cookie 1 to the first child and 3 to the second satisfies
    2.'
  in_action:
    statement: Children have greed values g_i and cookies have sizes c_j. A child is satisfied by a cookie
      of size at least its greed, and each cookie goes to one child. Maximise the number of satisfied
      children.
    constraints: n, m ≤ 2·10^5, values up to 10^9.
    budget: Trying every assignment is up to m!/(m − n)!. Sorting both lists is about 7·10^6 steps and
      the walk is 4·10^5.
    candidates:
    - tool: Try every assignment of cookies to children
      verdict: rejected
      because: Factorially many assignments.
    - tool: Sort both lists, then give each child the smallest cookie that is big enough (this topic)
      verdict: chosen
      because: A child accepts any cookie at least as big as its greed, so a smaller sufficient cookie
        is never more useful to the others.
    property_check: Acceptance is a threshold in one sorted order (size ≥ greed), so if the optimal assignment
      gives the first child a cookie d, replacing d by the smallest sufficient cookie c ≤ d keeps every
      other child satisfied (Theorem 1.5.4). Each child and cookie is used at most once.
    decision: Sort both; for each child by increasing greed advance the cookie pointer to the first cookie
      of size at least the greed, count it and move on.
  examples:
    positive:
    - inline:
        input: Greed 1, 2, 3 and cookies 1, 1
        answer: '1'
        why: The two cookies of size 1 can only satisfy the child of greed 1, and one of them does; the
          others need size 2 or 3.
    - inline:
        input: Greed 1, 2 and cookies 1, 2, 3
        answer: '2'
        why: The child of greed 1 takes the cookie 1 and the child of greed 2 takes the cookie 2; the
          cookie 3 stays unused.
    negative:
    - inline:
        input: Children (greed, taste) (1, a), (2, b) and cookies (size, flavour) (3, b), (3, b); a cookie
          works only for the same taste; matched by size alone
        answer: '1'
        method_gives: '2'
        why: The sizes would satisfy both children, but only the child with taste b can use a cookie of
          flavour b. A condition on two attributes has no single sorted order, and the assignments must
          be tried.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: Greed 1, 3 and cookies 3, 1, giving each child in order the largest cookie that satisfies
          it
        answer: '2'
        method_gives: '1'
        why: The first child takes the cookie 3, which the second child needed, and only 1 child is satisfied.
          The smallest sufficient cookie, 1, leaves 3 for the second child.
      correct_tool:
        topic: '1.5'
        card: sorted-matching
  lookalikes:
  - description: Pair people into boats of capacity C, at most two per boat
    tool:
      topic: '1.3'
      card: opposite-ends
    flipping_difference: Pairs are within one list rather than across two lists; the heaviest person is
      paired with the lightest if possible, which two pointers from the ends do.
  complexity: O(n log n + m log m).
- id: left-to-right-forced
  name: Left-to-right forced choices
  decisive_property: Positions are handled from left to right, what remains possible depends only on a
    small state, and the greedy choice at each position leads to a state that dominates every other choice's
    state, so it is never worse.
  from_theorem: 1.5.5
  how_to_test: Name the state after each position and show that the greedy choice reaches the best state,
    for example the farthest reach or the most useful change left.
  constraint_shapes:
  - 'n up to 2·10^5 segments or positions: trying every subset is 2^n, while one pass in sorted order
    with a reach is 2·10^5 steps; the reach can grow to 2·10^14, so it is a long long.'
  weak_signals:
  - form: Asks whether the end can be reached, or for the fewest jumps or segments to cover a range
    shape: n up to 2·10^5 segments with coordinates up to 10^9
  - form: The first wrong position must be fixed now, and fixing it as far right as possible helps
    shape: A left-to-right scan with one fix per wrong position
  - form: Makes change or builds sums from a fixed set of coins processed in order
    shape: Coins up to 10^9, sorted, and a question about the smallest unreachable sum
  kill_signals:
  - 'One trade is a pair of days, not a sequence of choices: the best single trade in 7 1 5 3 6 4 is 5,
    but adding every daily rise gives 7.'
  - 'A gap that the state does not capture: [0, 2] and [3, 5] do not cover [0, 5] (the points between
    2 and 3 are missing), but a rule that continues from reach + 1 accepts them with 2 segments.'
  in_action:
    statement: Given n segments [l_i, r_i], cover [0, L] with as few of them as possible, or report that
      it is impossible.
    constraints: n ≤ 2·10^5, 0 ≤ l_i < r_i ≤ 10^9, L ≤ 10^9.
    budget: Trying every subset is 2^n. Sorting by left end is 3.6·10^6 and the scan 2·10^5.
    candidates:
    - tool: Try every subset of the segments
      verdict: rejected
      because: 2^n subsets.
    - tool: Sweep from the left and always take the segment starting inside the covered part that reaches
        farthest (this topic)
      verdict: chosen
      because: The state is how far the cover reaches, and a larger reach dominates a smaller one.
    property_check: Any segment usable from a shorter reach is also usable from a longer reach, so the
      state after the greedy step dominates every other state after the same number of steps (Theorem
      1.5.5). If no segment extends the reach, a gap remains and the answer is −1.
    decision: Sort by left end; reach = 0; while reach < L take the farthest-reaching segment with l ≤
      reach, or stop with −1 if none extends it.
  examples:
    positive:
    - inline:
        input: The fewest of [0, 5], [3, 8], [1, 2] that cover [0, 8]
        answer: '2'
        why: From reach 0 the segments [0, 5] and [1, 2] start inside; the farthest is [0, 5]. From reach
          5 the segment [3, 8] reaches 8. Two segments, and no single one covers [0, 8].
    - worked_example: cses-2183
      why: The state is the largest sum reachable so far; a coin larger than reach + 1 leaves a gap, and
        otherwise it extends the reachable range by its value.
    negative:
    - inline:
        input: The best profit of one trade in 7, 1, 5, 3, 6, 4, answered by adding every daily rise
        answer: '5'
        method_gives: '7'
        why: Adding the rises 4 and 3 pretends to trade twice. One trade is a pair of days, buy at 1 and
          sell at 6, which is a prefix minimum, not a sequence of choices.
      correct_tool:
        topic: '1.2'
        card: prefix-extremes
    - inline:
        input: Can [0, 2] and [3, 5] cover [0, 5], with a rule that continues from reach + 1?
        answer: '-1'
        method_gives: '2'
        why: The points between 2 and 3 are not covered by either segment. The rule must continue only
          from segments that start at or before the current reach.
      correct_tool:
        topic: '1.5'
        card: left-to-right-forced
  lookalikes:
  - description: Buy and sell a stock once, with the best profit
    tool:
      topic: '1.2'
      card: prefix-extremes
    flipping_difference: One trade is a pair of days (prefix minimum), not a sequence of choices.
  complexity: O(n log n).
problems:
- id: cses-1630
  role: ladder
  card: exchange-order
  rung: 1
  twist: Base case of the card
  summary: n ≤ 2·10^5 tasks with durations and deadlines done one after another; each earns (deadline
    − finishing time), possibly negative; the largest total.
  hints:
  - Split the total into a part that does not depend on the order and a part that does.
  - 'Σ deadlines − Σ finishing times. Only Σ finishing times depends on the order: shortest first minimises
    it (Section 4.1).'
  - Sort by duration, accumulate the finishing times in long long, and subtract from the sum of deadlines.
- id: ac-abc131_d
  role: ladder
  card: exchange-order
  rung: 2
  twist: A yes/no question about deadlines; the swap compares the worst lateness, not a sum.
  summary: N ≤ 2·10^5 jobs with durations A_i and deadlines B_i, done one at a time from time 0; can all
    be finished by their deadlines?
  hints:
  - Take two adjacent jobs with the later deadline first. Can swapping them make anything late that was
    on time?
  - 'No: after the swap the earlier-deadline job finishes earlier, and the other finishes when the pair
    finished before, which is before the earlier deadline if the pair was on time. So earliest deadline
    first (Theorem 1.5.1).'
  - Sort by deadline, add the durations, and check every finishing time against its deadline (long long).
- id: lc-two-city-scheduling
  role: ladder
  card: exchange-order
  rung: 3
  twist: The order is a split into two equal groups, and the key is a difference of two costs.
  summary: 2n people (2n ≤ 100), each with a cost to city A and to city B; send exactly n to each city
    at the least total cost.
  hints:
  - Suppose everyone goes to B first. What does moving one person to A change?
  - It adds aCost − bCost. Two people in the wrong groups can be swapped when the one in A has the larger
    difference, so sort by aCost − bCost.
  - Sort by aCost − bCost; the first n go to A and the rest to B.
- id: cses-1629
  role: ladder
  card: interval-selection
  rung: 1
  twist: Base case of the card
