# Topic 0.2 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.2'
uses:
- topic: '0.1'
  what: 'Fixed-size integers and integer division: step counts and closed forms are computed in long long,
    and several formulas divide'
theorems:
- id: 0.2.1
  title: A loop nest costs the product of its bounds
  plain_words: Count the steps of a program by multiplying how many times each nested loop runs; about
    10^8 simple steps fit in one second. Plug in the largest input the constraints allow before writing
    any code.
  code: 0.2/thm-1
- id: 0.2.2
  title: Divisors come in pairs with a fixed product
  plain_words: If d divides N then N/d divides N too, and one of the two is at most the square root of
    N. So it is enough to try d up to the square root and record both d and N/d.
  code: 0.2/thm-2
- id: 0.2.3
  title: An arithmetic progression has a closed form
  plain_words: Adding n numbers that grow by the same step each time takes one formula instead of a loop;
    write the sum forwards and backwards and every pair adds to the same value.
  code: 0.2/thm-3
- id: 0.2.4
  title: An inner loop that only moves a shared counter forward is cheap in total
  plain_words: If every inner iteration moves an index forward and the index never goes back, the inner
    loop runs at most n times in total, however many times the outer loop starts it.
  code: 0.2/thm-4
- id: 0.2.5
  title: Looping over the multiples of every number costs n log n
  plain_words: For each i the loop visits only n/i numbers, and n/1 + n/2 + n/3 + ... adds up to about
    n times the natural logarithm of n, far less than n squared.
  code: 0.2/thm-5
cards:
- id: budget-from-constraints
  name: Choose the algorithm class from n
  decisive_property: Plugging the largest allowed input into the step count of your idea (nested loop
    bounds multiply) gives at most about 10^8 steps per second of time limit; if not, the constraint tells
    you which smaller class (n log n, n, √n, a formula) the intended solution lies in.
  from_theorem: 0.2.1
  how_to_test: Write the step count of the idea as a product of loop bounds, substitute the maximum values
    from the constraints, and compare with 10^8 times the time limit.
  constraint_shapes:
  - n up to 2·10^5 with a double loop is 2·10^5 · 2·10^5 = 4·10^10 steps, 400 times the 10^8 a second
    allows; n up to 5000 with the same double loop is 2.5·10^7 steps and fits.
  - N up to 10^12 forbids looping up to N (10^12 steps, close to three hours) but allows looping up to
    √N = 10^6.
  weak_signals:
  - form: Asks for something about pairs, or about every divisor of one number
    shape: One number N up to 10^12, or n up to 5000, where the intended method is one of √N or n²
  - form: Asks for the best choice among all pairs or all subsets
    shape: A small bound such as n ≤ 20 or n ≤ 100 that allows a direct, even exponential, method
  - form: Gives a bound that no loop can reach
    shape: N up to 10^12 or 10^18, so the answer must come from √N steps or a formula
  kill_signals:
  - 'Every idea is already far inside the budget: for n = 100 and a triple loop, 10^6 steps, so the question
    is correctness, not speed.'
  - 'The loop body hides another loop: one loop over n = 10^5 elements whose body scans all n elements
    is 10^10 steps, not 10^5.'
  in_action:
    statement: Given N, print all positive divisors of N in increasing order.
    constraints: 1 ≤ N ≤ 10^12.
    budget: Trying every d from 1 to N is 10^12 steps, about 10^4 seconds at 10^8 steps per second, against
      a limit of about 2 seconds. A method with at most about 2·10^8 steps is needed.
    candidates:
    - tool: Try every d from 1 to N
      verdict: rejected
      because: 10^12 steps, about 5000 times too slow.
    - tool: Try d up to the square root of N and record the partner N / d (this topic)
      verdict: chosen
      because: √(10^12) = 10^6 steps, a millisecond.
    property_check: Each divisor d has the partner N / d, and d · (N / d) = N, so one of the two is at
      most √N (Theorem 0.2.2). Trying d up to √N therefore meets one member of every pair, and 10^6 steps
      fit the budget with a wide margin.
    decision: Loop d while d · d ≤ N and record both d and N / d.
  examples:
    positive:
    - inline:
        input: Count the pairs i < j among n = 3000 items with a double loop
        answer: '4498500'
        why: The loops run n(n − 1)/2 steps, about 4.5·10^6, well under 10^8, so the direct double loop
          fits the budget.
    - worked_example: ac-abc165_b
      why: X reaches 10^18, but the balance grows by 1% a year, so the loop stops after a few thousand
        years; the loop count, not the size of X, is what the budget measures.
    negative:
    - inline:
        input: One loop over n = 10^5 elements, and each iteration scans all n elements
        answer: '10000000000'
        method_gives: '100000'
        why: Counting only the outer loop gives 10^5, but the scan inside is another factor of n, so the
          work is 10^10 steps, 100 times the budget of one second.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
    - inline:
        input: Pairs among n = 5000 items, where each step is a lookup that costs about 50 simple steps
        answer: '624875000'
        method_gives: '12497500'
        why: The 12 497 500 pair steps fit the budget only when a step is simple; at 50 simple steps each
          the cost is about 6·10^8, over a second's budget. The constant factor matters near the boundary.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
  lookalikes:
  - description: The same question with N up to 100 instead of 10^12
    tool:
      topic: '0.2'
      card: budget-from-constraints
    flipping_difference: Only the bound changes. With N up to 100 the direct loop over every candidate
      is fine (10^2 steps); with 10^12 only the √N method fits.
  complexity: Reading the constraints costs nothing; it decides which algorithm to write.
- id: closed-form
  name: Formula instead of a loop
  decisive_property: The quantity added at each step follows an arithmetic progression or repeats with
    a short period, so the total over n steps is a formula (n(2a + (n − 1)d)/2, or full periods times
    one period's sum plus a leftover) that takes O(1) or O(period) steps.
  from_theorem: 0.2.3
  how_to_test: Write out the first few terms of the loop. If consecutive terms differ by a constant, or
    the pattern repeats after p steps, a formula exists. Check the size of the product before dividing.
  constraint_shapes:
  - 'n up to 10^9 or 10^18 with a process that adds one term per step: a loop is 10^9 steps (ten seconds)
    or more, while the formula n(2a + (n − 1)d)/2 is a few operations; for n = 2·10^9 the product n(n
    + 1) = 4·10^18 is near the long long limit of 9.2·10^18.'
  weak_signals:
  - form: Asks for a total, a position or a count after many steps of a simple repeated process
    shape: n up to 10^9 or 10^18, and each step adds a fixed amount or the pattern repeats
  - form: Asks how many pairs, or the sum 1 + 2 + … + n
    shape: The answer depends only on n and a few numbers, not on an array
  kill_signals:
  - 'The terms come from input data with no pattern: for the array 3, 1, 4, 1, 5 the formula for 1 + …
    + 5 style sums, n(first + last)/2 = 5 · 8/2 = 20, but the real sum is 14.'
  - 'The halving is done before multiplying: for n = 5, (n / 2) · (n + 1) = 2 · 6 = 12, but 1 + 2 + 3
    + 4 + 5 = 15; multiply first, then halve.'
  in_action:
    statement: Print the sum 1 + 2 + … + n for a given n.
    constraints: 1 ≤ n ≤ 10^9.
    budget: A loop over n terms is up to 10^9 steps, about 10 seconds, over a limit of about 2 seconds.
      The sum itself is about 5·10^17, which fits long long.
    candidates:
    - tool: Loop and add the terms one by one
      verdict: rejected
      because: 10^9 steps, five times too slow.
    - tool: The formula n(n + 1)/2 (this topic)
      verdict: chosen
      because: One multiplication and one division; n(n + 1) is at most 10^18 + 10^9, below 9.2·10^18.
    property_check: Consecutive terms differ by 1, a constant, so Theorem 0.2.3 applies with a = 1 and
      d = 1. The product n(n + 1) is computed before the division and is always even, so the division
      is exact.
    decision: n(n + 1)/2, computed in long long with the multiplication first.
  examples:
    positive:
    - inline:
        input: Sum 1 + 2 + … + 100000
        answer: '5000050000'
        why: Consecutive terms differ by 1, so the sum is n(n + 1)/2 = 100000 · 100001 / 2.
    - worked_example: cses-1071
      why: The values along each layer of the spiral form an arithmetic progression, so the number in
        a cell is a formula in its layer and its place on it.
    negative:
    - inline:
        input: Sum 1 + 2 + 3 + 4 + 5, computed as (n / 2) · (n + 1)
        answer: '15'
        method_gives: '12'
        why: The halving comes first and n = 5 is odd, so 5 / 2 truncates to 2. The product n(n + 1) =
          30 is even; multiply first and halve last.
      correct_tool:
        topic: '0.2'
        card: closed-form
    - inline:
        input: The sum of the array 3, 1, 4, 1, 5
        answer: '14'
        method_gives: '20'
        why: The terms do not change by a constant, so the progression formula 5 · (3 + 5)/2 = 20 is wrong.
          An array with no pattern is added with a loop, which is cheap for n = 5.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
  lookalikes:
  - description: The same process with n up to 10^5 instead of 10^18
    tool:
      topic: '0.2'
      card: budget-from-constraints
    flipping_difference: With n up to 10^5 the loop is only 10^5 steps and less error-prone than the formula;
      the formula matters when n is too large to loop.
  complexity: O(1) for a formula, O(p) for a period of length p.
- id: amortised-total
  name: Bounded total work
  decisive_property: An inner loop moves a counter or index forward by at least one each iteration, the
    counter never moves back, and its range is 0..n, so the inner loop runs at most n times in total even
    though it is nested in an outer loop.
  from_theorem: 0.2.4
  how_to_test: Find what the inner loop advances. If that index is shared with the outer loop (the outer
    loop continues from where the inner one stopped), the total is linear.
  constraint_shapes:
  - 'n up to 2·10^5 or 10^6 with a nested loop: if the inner loop restarts for every position the work
    is up to n²/2 = 2·10^10 steps, but if the outer loop continues from where the inner one stopped, it
    is n = 2·10^5.'
  weak_signals:
  - form: Asks about maximal blocks (runs) of equal or monotone elements
    shape: One string or array of length up to 10^6, with a question about the longest block or about
      substrings inside blocks
  - form: A scan that skips ahead, such as "find the end of this block, then continue after it"
    shape: A while loop inside a for loop whose index is the same variable
  kill_signals:
  - 'The inner loop restarts from the beginning for each outer iteration: on "aaaa" with the next block
    starting at i + 1 the inner scans take 4 + 3 + 2 + 1 = 10 steps, not 4.'
  - 'The inner loop scans to the end of the array from every position: n = 5 gives 4 + 3 + 2 + 1 = 10
    steps, and n = 10^5 gives about 5·10^9.'
  in_action:
    statement: Given a string of lowercase letters, find the length of its longest block of equal consecutive
      letters.
    constraints: 1 ≤ |s| ≤ 10^6.
    budget: A scan from every position to the end of its block is up to |s|²/2 = 5·10^11 steps on the
      string "aaa…a". A budget of about 10^8 steps needs one pass.
    candidates:
    - tool: For each position, count the equal letters that follow it
      verdict: rejected
      because: On a string of one repeated letter this is about 5·10^11 steps.
    - tool: Find a block's end with j, then continue from j (this topic)
      verdict: chosen
      because: j only moves forward, so all inner iterations together are at most |s| = 10^6.
    property_check: Each inner iteration moves j forward by one, j never decreases and stays at most |s|,
      and the next block starts at j. By Theorem 0.2.4 the inner loop runs at most |s| times in total.
    decision: One pass with an outer index i and an inner index j, setting i = j after each block.
  examples:
    positive:
    - inline:
        input: Split "aabccc" into maximal blocks of equal letters
        answer: '6'
        why: The inner loop runs once per character, 6 times in all, although it sits inside another loop,
          because the next block starts where the last one ended.
    - worked_example: ac-abc329_c
      why: Each maximal block of a letter is found with a forward-only inner index, so counting the strings
        made of one repeated letter is one linear pass.
    negative:
    - inline:
        input: Split "aaaa" into blocks, but the next block starts at i + 1 instead of at j
        answer: '10'
        method_gives: '4'
        why: The inner scan restarts at every position and covers 4 + 3 + 2 + 1 steps. The bound n holds
          only when the outer index jumps to where the inner one stopped.
      correct_tool:
        topic: '0.2'
        card: amortised-total
    - inline:
        input: For each of the 5 positions, scan to the end of the array
        answer: '10'
        method_gives: '5'
        why: Each scan restarts at its own position and the counter does not carry over, so the total
          is 4 + 3 + 2 + 1 = 10, the quadratic n(n − 1)/2. That is fine for n = 5 and too slow for 10^5.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
  lookalikes:
  - description: For each position, scan forward to the end of the array
    tool:
      topic: '0.2'
      card: budget-from-constraints
    flipping_difference: The inner scan restarts at every position, so the total is n²/2, not n; it is
      fine only for small n.
  complexity: O(n) total for the nested loops.
- id: harmonic-loops
  name: Loops over multiples
  decisive_property: For each i, the inner loop visits only multiples of i up to n (or values up to n
    / i), so the total is the sum of n / i, at most n(1 + ln n).
  from_theorem: 0.2.5
  how_to_test: 'Check that the inner loop steps by i (j += i) or runs up to n / i. Then the total is about
    n ln n: fine for n up to about 10^7.'
  constraint_shapes:
  - 'n up to 10^7: the loop over multiples takes 162 725 364 steps, about 1.6·10^8, which fits in a few
    seconds, while testing every pair (i, j) is n² = 10^14 steps.'
  weak_signals:
  - form: Asks for a property of every number up to n that depends on its divisors
    shape: n up to 10^6 or 10^7, with one answer for each k from 1 to n
  - form: Asks to count pairs or triples whose product is at most n
    shape: n up to 10^7, where for each a there are n / a choices of b
  kill_signals:
  - 'Only one number N is involved: the divisors of N = 10^6 take 1000 steps up to √N, while the loop
    over multiples of every i up to 10^6 takes 13 970 034.'
  - 'The inner loop scans every j from 1 to n and tests j % i == 0 instead of stepping by i: for n = 1000
    that is 10^6 steps instead of 7069.'
  in_action:
    statement: For every k from 1 to n, let d(k) be the number of divisors of k. Print d(1) + d(2) + …
      + d(n).
    constraints: 1 ≤ n ≤ 10^7.
    budget: Counting the divisors of each k separately takes about √k steps, 10^7 · 3000 = 3·10^10 in
      all, 300 seconds. A budget of about 2·10^8 steps needs a method close to linear.
    candidates:
    - tool: Count the divisors of each k up to √k
      verdict: rejected
      because: About 3·10^10 steps for n = 10^7.
    - tool: For each i, add 1 to every multiple of i (this topic)
      verdict: chosen
      because: The inner loop visits n / i numbers, so the total is about n ln n = 1.6·10^8 steps.
    property_check: The inner loop for i steps by i, so it visits only n / i numbers, and each visit is
      one step. By Theorem 0.2.5 the total is at most n(1 + ln n) ≈ 1.7·10^8.
    decision: Loop i from 1 to n and, inside it, j from i in steps of i, adding 1 to the count of j.
  examples:
    positive:
    - inline:
        input: Run the loop over multiples for n = 10 and count the steps
        answer: '27'
        why: The inner loop visits 10, 5, 3, 2, 2, 1, 1, 1, 1, 1 numbers for i = 1, …, 10, so 27 steps
          in all.
    - inline:
        input: Run the loop over multiples for n = 1000 and count the steps
        answer: '7069'
        why: The sum of 1000 / i over i = 1, …, 1000 is 7069, below the bound n(1 + ln n) ≈ 7908.
    negative:
    - inline:
        input: The divisors of the single number N = 10^6, found with the loop over multiples of every
          i up to N
        answer: '1000'
        method_gives: '13970034'
        why: One number needs only the divisor pairs up to √N, 1000 steps. The harmonic loop answers all
          numbers up to N at once and spends 13 970 034 steps on that, which is wasted for one number.
      correct_tool:
        topic: '0.2'
        card: budget-from-constraints
    - inline:
        input: n = 1000, with an inner loop that tests every j from 1 to n for j % i == 0
        answer: '1000000'
        method_gives: '7069'
        why: The loop only has the harmonic cost when it steps by i. Scanning all j for every i costs
          n² = 10^6 steps and gives the same counts.
      correct_tool:
        topic: '0.2'
        card: harmonic-loops
  lookalikes:
  - description: Count the divisors of one number N
    tool:
      topic: '0.2'
      card: budget-from-constraints
    flipping_difference: One number needs √N steps; all numbers up to n at once need the harmonic loop.
  complexity: 'O(n log n): about 1.6·10^8 steps for n = 10^7.'
problems:
- id: ac-abc167_b
  role: ladder
  card: closed-form
  rung: 1
  twist: Base case of the card
  summary: A cards with 1, B with 0, C with −1 (A + B + C up to 2·10^9); the largest sum of K chosen cards.
  hints:
  - Which cards would you pick first? Can you count instead of picking one by one?
  - 'Take ones first, then zeros, then minus ones: the answer depends only on how many of each you take,
    not on a loop of K steps.'
  - Answer min(K, A) − max(0, K − A − B), in long long.
- id: ac-abc405_c
  role: ladder
  card: closed-form
  rung: 2
  twist: The sum over all pairs i < j becomes a formula in the total sum and the sum of squares.
  summary: Sum of A_i · A_j over all pairs i < j (N ≤ 3·10^5, A_i ≤ 10^4).
  hints:
  - 'All pairs is about 4.5·10^10 for N = 3·10^5: too many. What is (A_1 + … + A_N)²?'
  - It is the sum of the squares plus twice the sum over pairs i < j.
  - Answer (S² − sum of squares) / 2 with S the total, all in long long (S² ≤ 9·10^18).
- id: ac-abc099_b
  role: ladder
  card: closed-form
  rung: 3
  twist: The heights are triangular numbers 1 + 2 + … + k, given implicitly.
  summary: Towers of heights 1, 1+2, …, 1+…+999 stand 1 m apart; two adjacent towers show a and b metres
    above the snow; find the snow depth.
  hints:
  - Two adjacent towers differ in height by how much?
  - 'The k-th and (k+1)-th towers differ by k + 1, and the visible parts differ by the same amount: k
    + 1 = b − a.'
  - The taller tower has height 1 + 2 + … + (b − a) = (b − a)(b − a + 1)/2; the depth is that minus b.
- id: ac-abc103_c
  role: ladder
  card: closed-form
  rung: 4
  twist: The maximum of a function over all m is found by a formula, without trying any m.
  summary: For N numbers a_i (N ≤ 3000, a_i ≤ 10^5), the largest possible value of (m mod a_1) + … + (m
    mod a_N) over non-negative m.
  hints:
  - What is the largest possible value of a single term m mod a_i?
  - a_i − 1, reached when m + 1 is a multiple of a_i. Is there one m that is one less than a multiple
    of every a_i?
  - m = a_1 · a_2 · … · a_N − 1 works (it is never computed), so the answer is the sum of (a_i − 1).
- id: ac-abc130_c
  role: ladder
  card: closed-form
  rung: 5
  twist: 'A geometric answer: any line through the centre halves the area.'
  summary: A rectangle W by H (up to 10^9) and a point (x, y) in it; cut by a line through the point to
    make the smaller part as large as possible; also say whether several cuts achieve it.
  hints:
  - What is the largest possible area of the smaller part, for any cut?
  - Half of W·H, and a line through the point and the rectangle's centre achieves it.
  - Print W·H / 2 as a real number (W·H fits a long long; print its half with one decimal place), then
    1 if (x, y) is exactly the centre (2x = W and 2y = H), else 0.
- id: cses-1072
  role: ladder
  card: closed-form
  rung: 6
  twist: 'Count pairs with a formula: all pairs minus attacking pairs, for every board size.'
  summary: 'For every k from 1 to n (n ≤ 10^4): the number of ways to place two knights on a k by k board
    so they do not attack each other.'
  hints:
  - How many ways are there to place two knights with no restriction?
  - k²(k² − 1)/2. Attacking pairs fit in a 2 by 3 or 3 by 2 box, each box holding 2 attacking pairs.
  - Answer k²(k² − 1)/2 − 4(k − 1)(k − 2), in long long.
- id: cf-1475B
  role: ladder
  card: closed-form
  rung: 7
  twist: Decide whether n is a sum of copies of two consecutive numbers, without trying all splits.
  summary: 'For each of t tests: can n (n ≤ 10^6) be written as 2020a + 2021b with non-negative a and
    b?'
  hints:
  - Write n = 2020(a + b) + b. What must b be modulo 2020?
  - So b leaves remainder n mod 2020, and a + b = (n − b) / 2020. The smallest choice b = n mod 2020 is
    possible exactly when it is at most a + b = n / 2020.
  - Answer YES when n mod 2020 ≤ n / 2020.
- id: cf-1373A
  role: ladder
  card: closed-form
  rung: 8
  twist: Compare two price formulas instead of trying every amount.
  summary: 'For each of t tests: shop 1 sells donuts at a each, shop 2 sells boxes of b for c; find an
    amount that is cheaper in shop 1 and one that is cheaper in shop 2, or −1.'
  hints:
  - For shop 1 to be strictly cheaper, which amount is the best candidate?
  - 'Buying 1 donut: shop 1 costs a, shop 2 costs c. For shop 2, buying exactly b donuts: shop 1 costs
    a·b, shop 2 costs c.'
  - Print 1 if a < c else −1; print b if c < a·b (in long long) else −1.
- id: cf-1328B
  role: ladder
  card: closed-form
  rung: 9
  twist: 'Locate the k-th string by triangular numbers: blocks of 1, 2, 3, … strings.'
  summary: 'For each of t tests: the k-th string, in lexicographic order, of length n with n − 2 letters
    a and two letters b.'
  hints:
  - Group the strings by the position of the first (leftmost) b. How many strings are in each group?
  - If the first b is the i-th letter from the right, the second b has i − 1 places, so groups have 1,
    2, 3, … strings.
  - Find the smallest i with 1 + 2 + … + i ≥ k, then place the second b according to the remainder; loop
    i (at most about 6·10^4 steps) or solve the triangular inequality.
- id: ac-abc330_c
  role: ladder
  card: budget-from-constraints
  rung: 1
  twist: Base case of the card
  summary: Smallest |x² + y² − D| over non-negative integers x, y (D ≤ 2·10^12).
  hints:
  - How large can x usefully be?
  - Only x up to about √D ≈ 1.5·10^6 matters; for each x, the best y is next to √(D − x²).
  - Loop x while x·x ≤ D (plus one more); compute y as the integer square root of D − x² (Theorem 0.1.5)
    and try y and y + 1.
- id: ac-abc227_c
  role: ladder
  card: budget-from-constraints
  rung: 2
  twist: 'Three nested loops whose bounds shrink: A ≤ N^(1/3), B ≤ √(N / A).'
  summary: Count triples A ≤ B ≤ C of positive integers with A·B·C ≤ N (N ≤ 10^11).
  hints:
  - Since A ≤ B ≤ C, how big can A be? And B for a fixed A?
  - A³ ≤ N and A·B² ≤ N. For fixed A and B, C runs from B to N / (A·B).
  - Loop A and B within those bounds and add N / (A·B) − B + 1; the total is about N^(2/3) ≈ 2·10^7 steps.
- id: ac-abc057_c
  role: ladder
  card: budget-from-constraints
  rung: 3
  twist: Only factor pairs matter, so loop to √N even though N is 10^10.
  summary: Over all ways to write N = A·B (N ≤ 10^10), the smallest possible number of digits of the larger
    factor.
  hints:
  - Which pairs (A, B) need to be tried?
  - 'Only divisors A ≤ √N, with B = N / A (Theorem 0.2.2): at most 10^5 values.'
  - For each divisor A ≤ √N, count the digits of N / A; print the smallest count.
- id: ac-abc179_c
  role: ladder
  card: harmonic-loops
  rung: 1
  twist: Base case of the card
  summary: Count triples (A, B, C) of positive integers with A·B + C = N (N ≤ 10^6).
  hints:
  - C is determined by A and B. Which pairs (A, B) are allowed?
  - Those with A·B < N, that is A·B ≤ N − 1.
  - 'For each A, there are (N − 1) / A choices of B; add them up: about N ln N steps (Theorem 0.2.5).'
- id: ac-abc292_c
  role: ladder
  card: harmonic-loops
  rung: 2
  twist: Count products for every value up to N first, then combine the counts.
  summary: Count quadruples (A, B, C, D) of positive integers with A·B + C·D = N (N ≤ 2·10^5).
  hints:
  - For each X, let f(X) be the number of pairs with A·B = X. How does the answer use f?
  - Answer = sum over X from 1 to N − 1 of f(X) · f(N − X).
  - Compute f for all X by looping over multiples (f(X) is the number of divisors of X); then one more
    loop. Use long long.
- id: ac-abc249_d
  role: ladder
  card: harmonic-loops
  rung: 3
  twist: 'Count by value: for each A_j, loop over its multiples among the values.'
  summary: Count triples (i, j, k) of indices (N ≤ 2·10^5, values ≤ 2·10^5) with A_i / A_j = A_k.
  hints:
  - The condition is A_i = A_j · A_k. Can you count by values instead of positions?
  - Let cnt[v] be how many times v occurs. For each pair of values (q, r) with q·r ≤ 2·10^5, add cnt[q]·cnt[r]·cnt[q·r].
  - 'Loop q from 1 to M and r over values with q·r ≤ M: about M ln M steps for M = 2·10^5. Use long long.'
- id: cses-1069
  role: ladder
  card: amortised-total
  rung: 1
  twist: Base case of the card
  summary: Length of the longest block of one repeated letter in a DNA string (n ≤ 10^6).
  hints:
  - If you start a block at i and extend it, where should the next block start?
  - 'Right after this block ends: the inner index never moves back, so the total work is O(n) (Theorem
    0.2.4).'
  - Scan maximal blocks with i and j; keep the largest j − i.
- id: lc-count-binary-substrings
  role: ladder
  card: amortised-total
  rung: 2
  twist: 'Combine neighbouring blocks: each pair of adjacent blocks contributes the smaller length.'
  summary: Count substrings of a 0/1 string (length ≤ 10^5) with equally many 0s and 1s, all 0s together
    and all 1s together.
  hints:
  - Such a substring sits across the boundary of two adjacent blocks. How many fit across one boundary?
  - min(length of the left block, length of the right block).
  - Compute block lengths in one pass, then add min of each adjacent pair.
- id: lc-number-of-zero-filled-subarrays
  role: ladder
  card: amortised-total
  rung: 3
  twist: 'Count, not just measure: each block of zeros of length L contributes L(L + 1)/2.'
  summary: Count the subarrays made only of zeros (array length ≤ 10^5).
  hints:
  - How many subarrays lie inside one block of L zeros?
  - L(L + 1)/2 (Theorem 0.2.3).
  - Scan maximal blocks of zeros and add L(L + 1)/2 for each, in long long.
- id: ac-abc369_c
  role: ladder
  card: amortised-total
  rung: 4
  twist: Blocks are defined by a property of adjacent pairs (equal differences), not by equal values.
  summary: Count pairs (l, r) such that A_l..A_r is an arithmetic progression (N ≤ 2·10^5).
  hints:
  - An arithmetic progression has all adjacent differences equal. Look at the sequence of differences.
  - Group maximal blocks of equal differences; a block of L equal differences covers L + 1 elements.
  - Each block of L equal differences gives L(L + 1)/2 progressions of length at least 2; add N for length
    1. Use long long.
- id: lc-longest-turbulent-subarray
  role: ladder
  card: amortised-total
  rung: 5
  twist: The block condition alternates (up, down, up, …), and an equal pair breaks every block.
  summary: Length of the longest subarray (length ≤ 4·10^4) whose adjacent comparisons alternate between
    < and >.
  hints:
  - When does a turbulent block end?
  - When two adjacent comparisons have the same sign, or two elements are equal.
  - 'Scan left to right keeping the current block length: extend it when the sign flips, restart at 2
    (or 1 for equal elements) otherwise.'
