theorems:
- id: 4.1.1
  title: Traversal reaches exactly what can be reached
  plain_words: "Walk out from the start, mark every place you reach, and never enter a marked place again. When you run out of places to enter, you have marked exactly the places that can be reached, and you looked at each road at most twice."
  code: 4.1/thm-1
- id: 4.1.2
  title: Components
  plain_words: "Look for an unmarked vertex, walk out from it, and everything you mark is one group. Repeat until nothing is unmarked. Each group is found exactly once, so the number of walks is the number of groups."
  code: 4.1/thm-2
- id: 4.1.3
  title: Breadth-first search finds the fewest edges
  plain_words: "A queue serves the oldest entry first, so the walk spreads out in rings: first the neighbours of the start, then their new neighbours, and so on. The first time a vertex is reached is by the shortest route, and remembering who reached it gives that route."
  code: 4.1/thm-3
- id: 4.1.4
  title: Many sources at once
  plain_words: "If you start the walk from every source at the same moment, each vertex is first reached by whichever source is closest to it, so one pass gives the distance to the nearest source."
  code: 4.1/thm-4
- id: 4.1.5
  title: A grid is a graph
  plain_words: "Treat every free cell as a dot and join side-by-side cells. You do not have to build the lists, because a cell's neighbours are found by adding four fixed offsets, so a traversal of the grid costs a constant per cell."
  code: 4.1/thm-5
- id: 4.1.6
  title: Puzzles as graphs
  plain_words: "Any puzzle where you want the fewest moves and every move counts the same is a search through a graph whose dots are the positions of the puzzle. Walk it with a queue, remember each position you saw, and the first time you reach the goal is the fewest moves."
  code: 4.1/thm-6
