drill:
- problem: ac-abc209_d
  answer:
    topic: '4.2'
    card: two-sides
  property: 'The graph is a tree, so it is bipartite and the distance between two towns has the parity
    of the difference of their colours: colour every town by the parity of its depth in one walk; the
    people meet at a town when the distance is even, that is, when the colours agree.'
  why_others_fail: Finding each distance separately costs up to Q · N = 10^10 steps; only the parity matters.
- problem: lc-is-graph-bipartite
  answer:
    topic: '4.2'
    card: two-sides
  property: 'The question is exactly whether the vertices can be coloured with two colours so that every
    edge joins different colours: walk each component, alternate the colours, and compare at every edge.'
  why_others_fail: Counting cycles or components says nothing about odd cycles; the parity of the cycle
    lengths is what decides.
- problem: cf-1702E
  answer:
    topic: '4.2'
    card: two-sides
  property: Make a vertex of each domino and join two dominoes that share a number; every number occurs
    twice, so every vertex has at most two links. Dominoes that share a number must be in different sets,
    so the sets exist exactly when this graph is bipartite (all its cycles are even).
  why_others_fail: Trying all 2^n assignments is impossible; once the set of one domino is chosen, all
    others in its component are forced.
- problem: cf-1176E
  answer:
    topic: '4.2'
    card: two-sides
  property: 'Colour the vertices by the parity of their distance from vertex 1. Every vertex has a neighbour
    (its parent) in the other class, so each class dominates the other; the smaller class has at most
    n/2 vertices. The graph need not be bipartite: only the parity classes are used.'
  why_others_fail: A smallest dominating set is hard to find; the task asks only for at most n/2 vertices,
    which the smaller parity class gives.
- problem: cf-1867D
  answer:
    topic: '4.2'
    card: directed-cycle
  property: Draw the arrow i → b_i. Every vertex has one arrow out, so the graph splits into cycles with
    chains leading into them; the answer is decided by the lengths of the cycles (every cycle must have
    length exactly k, or b_i = i everywhere when k = 1).
  why_others_fail: Simulating the operations is hopeless for n = 10^5; the structure of the cycles decides
    the answer.
- problem: lc-count-visited-nodes-in-a-directed-graph
  answer:
    topic: '4.2'
    card: directed-cycle
  property: 'One arrow out of every node: find the cycles with the three vertex states; a node on a cycle
    visits exactly the cycle length, and any other node visits one more than the node it points to.'
  why_others_fail: Simulating from every start costs up to n · n = 10^10 steps; each node is entered once
    in the search.
- problem: lc-course-schedule-ii
  answer:
    topic: '4.2'
    card: dependency-order
  property: Each prerequisite pair is an arrow from the course that comes first; take courses with no
    unmet prerequisite one at a time, and return an empty list if some course never becomes free.
  why_others_fail: 'Trying all orders of 2000 courses is impossible, and sorting by a number does not
    exist: the rules come as pairs.'
- problem: lc-course-schedule-iv
  answer:
    topic: '4.1'
    card: components
  property: 'The questions ask whether one course can be reached from another along the prerequisite arrows
    (indirect ones count): reachability. With at most 100 courses, one walk from each course gives all
    answers.'
  why_others_fail: 'An order of the courses does not answer the pairs: many courses are unrelated, and
    a cycle test says nothing about who reaches whom.'
- problem: lc-count-the-number-of-computer-unlocking-permutations
  answer:
    topic: '2.3'
    card: product-sum-rules
  property: Computer 0 is the only one unlocked at the start and can unlock any computer with greater
    complexity; if its complexity is the unique smallest, every order of the other computers is valid
    and the count is (n − 1)!, otherwise 0 (a factorial modulo 10^9 + 7).
  why_others_fail: Building a graph with up to n²/2 pairs and counting its topological orders is out of
    reach; here every order works, so a product counts them.
- problem: lc-score-after-flipping-matrix
  answer:
    topic: '1.7'
    card: high-bit-first
  property: 'Rows are binary numbers, so the leftmost column has the largest weight: flip rows to make
    it all 1, then flip every other column that has more 0s than 1s.'
  why_others_fail: Trying all 2^(m+n) sets of flips is about 10^12 for 20 × 20; the weights of the bits
    decide each choice in turn.
- problem: lc-cracking-the-safe
  answer:
    topic: '4.2'
    card: euler-trail
  property: "Take the strings of n − 1 digits as vertices and every code of n digits as an edge from its first n − 1 digits to its last n − 1. A string that contains every code once is a trail that uses every edge once. Every vertex has k edges in and k out and the graph is connected, so a closed trail exists, and the answer has k^n + n − 1 characters."
  why_others_fail: "Trying strings is hopeless: there are k^(k^n) of them. Treating the codes as vertices to be visited once would need a table over up to 4096 vertices, far beyond the about 20 that a table over sets allows."
- problem: cf-723E
  answer:
    topic: '4.2'
    card: euler-trail
  property: "A vertex can have in-degree equal to out-degree only if its degree is even, so the best possible number is n minus the number of odd vertices. Join every odd vertex to one extra vertex, find an Euler circuit in each piece and direct every edge along it; each real vertex then has as many arrows in as out, except that dropping the extra edges takes one edge away from every odd vertex."
  why_others_fail: "Trying all 2^m directions is out of reach for m = 2000. Choosing each direction greedily at a vertex can leave the last vertex of a piece unbalanced, while a circuit balances all even vertices at once."
lookalike_pairs:
- a: lc-possible-bipartition
  b: lc-divide-nodes-into-the-maximum-number-of-groups
  a_tool:
    topic: '4.2'
    card: two-sides
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both split the nodes of a graph into groups so that nodes joined by an edge are kept
    apart.
  flipping_difference: 'A allows exactly two groups of any size and only asks whether it is possible:
    a two-colouring. B asks for the largest number of groups such that joined nodes sit in neighbouring
    groups; each component must be bipartite, and its number of groups is the largest number of layers
    that a walk from some start of that component reaches.'
  flipping_input: 'The path 1–2–3: A answers yes (two groups: {1, 3} and {2}). B answers 3 (a walk from
    vertex 1 has the layers {1}, {2}, {3}), more than two.'
- a: cses-1669
  b: cses-1678
  a_tool:
    topic: '4.2'
    card: undirected-cycle
  b_tool:
    topic: '4.2'
    card: directed-cycle
  shared_surface: Both ask to print a round trip, a cycle of cities.
  flipping_difference: 'In A the roads work both ways: an edge to a marked city other than the parent
    closes a cycle, and a cycle needs at least three cities. In B the flights are one-way: only an arrow
    to a city on the stack closes a cycle, and two flights back and forth already make a round trip.'
  flipping_input: 'Two cities. A: one road 1–2 gives no round trip. B: the flights 1→2 and 2→1 give the
    round trip 1, 2, 1.'
- a: cses-1679
  b: cses-1757
  a_tool:
    topic: '4.2'
    card: dependency-order
  b_tool:
    topic: '4.2'
    card: dependency-order
  shared_surface: Both print an order of courses in which every requirement "a before b" holds.
  flipping_difference: 'A accepts any valid order, so removing free courses in any sequence is enough.
    B asks to finish course 1 as early as possible, then course 2, and so on: the smallest-first process
    gives a valid order but not that one, and the order has to be built from the back with the largest
    course that nothing remaining must follow (Theorem 4.2.6).'
  flipping_input: 'Three courses and the requirement 3 before 1. A: 2 3 1 is accepted. B: the answer is
    3 1 2, which finishes course 1 at place 2 instead of place 3.'
- a: cses-1693
  b: ac-abc190_e
  a_tool:
    topic: '4.2'
    card: euler-trail
  b_tool:
    topic: '3.7'
    card: path-mask
  shared_surface: "Both ask for one long route in a graph with up to 10^5 vertices that has to cover something: every teleporter in A, a few chosen kinds of gems in B."
  flipping_difference: "A must use every edge exactly once, so the degrees decide and the stack method builds the route in O(n + m). B only has to reach K ≤ 17 chosen vertices and may repeat vertices and edges, so the distances between the chosen vertices (one breadth-first walk each) feed a table over the order in which they are visited."
  flipping_input: "Roads 1–2, 2–3, 3–1 and 3–4. Using every road once gives a trail with 5 vertices (3, 2, 1, 3, 4). Reaching only the kinds 1 and 4 takes 3 vertices (1, 3, 4)."
self_test:
- q: Enemies 1–2, 2–3, 1–3 (a triangle). Can the three pupils form two teams with no enemies inside a
    team? Can they form three teams? What does the walk of Theorem 4.2.1 report?
  a: 'Not two teams: the triangle is a cycle of length 3, an odd cycle. Three teams work (one pupil each).
    The walk colours 1 with 0 and both 2 and 3 with 1, then finds the edge 2–3 inside colour 1 and reports
    impossible; it only knows two sides.'
- q: Three items and the rule "item 1 stands immediately before item 3". How many orders satisfy it, and
    how many orders does the arrow 1→3 allow?
  a: Two orders satisfy the rule (1 3 2 and 2 1 3). The arrow 1→3 only says "before" and allows three
    orders (also 1 2 3). Rules about exact places cannot be turned into arrows.
- q: A single two-way road 1–2 is read as the arrows 1→2 and 2→1. What does the search with three states
    report, and what is the truth for an undirected graph?
  a: 'It reports a directed cycle 1, 2 (the arrow 2→1 leads to a vertex on the stack). In an undirected
    graph one road is not a cycle: a cycle needs at least three vertices. For two-way roads use non-tree
    edges (Theorem 4.2.2).'
- q: Three vertices and the rule "3 before 1". What are the smallest sequence and the order that puts
    vertex 1 as early as possible?
  a: The smallest sequence is 2 3 1 (vertex 2 is free and smallest at the start), which puts 1 last. The
    order from the back is 3 1 2, which puts 1 at place 2 (Theorem 4.2.6).
- q: Arrows 5→1, 1→2, 2→3, 3→1, 3→4. Which vertices does the removal process of Theorem 4.2.3 output,
    and why does it stop?
  a: Only vertex 5. After removing 5, the vertex 1 still has an arrow from 3, so nothing has in-degree
    0. The vertices 1, 2, 3 form a cycle, and 4 is reachable from it.
- q: "Arrows 1→2, 1→3, 2→4, 3→4 and 4→5. How many rounds does the removal process take, how many topological orders are there, and is the order unique?"
  a: "The rounds are {1}, {2, 3}, {4}, {5}: 4 rounds, which is the number of vertices on the longest chain 1, 2, 4, 5 (Theorem 4.2.8). The order is not unique because round 2 holds two vertices; there are exactly 2 orders, 1 2 3 4 5 and 1 3 2 4 5."
- q: "Roads 1–2, 2–3, 3–1 and 4–5, 5–6, 6–4 (two separate triangles). Every degree is even; does a trail use every road exactly once? What does the stack method from vertex 1 write down?"
  a: "No. The roads of the second triangle cannot be reached from vertex 1. The stack method from 1 writes down only 4 vertices (the first triangle: 1, 3, 2, 1 read in the order it finishes them), but m + 1 = 7 are needed, so it reports none (Theorem 4.2.7, the check on the number of vertices)."
- q: "A connected graph has 5 vertices with degrees 2, 2, 3, 3, 4. Is there a trail that uses every edge once, and where can it start? What if the degrees are 1, 1, 1, 3, 2?"
  a: "Degrees 2, 2, 3, 3, 4 have exactly two odd vertices, so an open trail exists; it starts at one vertex of degree 3 and ends at the other. Degrees 1, 1, 1, 3, 2 have four odd vertices, so no trail exists (the sums 14 and 8 are even, as they must be, since each edge adds 2 to the total)."
