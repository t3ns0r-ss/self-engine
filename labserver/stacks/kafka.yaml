# One Kafka broker in KRaft mode (no ZooKeeper). Image pinned in .env.labserver.
# The broker listens on LAB_KAFKA_PORT inside the container too, so the advertised address
# (KAFKA_ADVERTISED_HOST:LAB_KAFKA_PORT) is the same address clients use from the host.
# Environment variable names follow the official apache/kafka image (KAFKA_ prefix, dots become underscores).
services:
  kafka:
    image: ${KAFKA_IMAGE:?set KAFKA_IMAGE in .env.labserver}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${LAB_KAFKA_PORT:-9092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${LAB_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    ports: ["${LAB_BIND:-127.0.0.1}:${LAB_KAFKA_PORT:-9092}:${LAB_KAFKA_PORT:-9092}"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${LAB_KAFKA_PORT:-9092} > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
