# Redis for labs. Image pinned in .env.labserver. Host port: LAB_REDIS_PORT (default 6379).
services:
  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE in .env.labserver}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${LAB_BIND:-127.0.0.1}:${LAB_REDIS_PORT:-6379}:6379"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
