drill:
- problem: cf-863E
  answer:
    topic: '5.1'
    card: idempotent-range-query
  property: Cut the time line at the interval ends and count how many intervals cover each piece; a show
    can be removed exactly when the smallest cover count over its pieces is at least 2.
  why_others_fail: Counting only with prefix sums gives the cover of single pieces but not the minimum
    over an arbitrary stretch, which is a range minimum on a fixed array.
- problem: cf-622C
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: For each position keep the nearest earlier position with a different value in one pass; a
    query looks at its right end and at that position.
  why_others_fail: A range table gives min and max of a range, but "some value ≠ x" is answered by two
    comparisons, so no table is needed.
- problem: cf-1731D
  answer:
    topic: '1.4'
    card: answer-search
  property: If a k × k square with all heights ≥ k exists, so does one for k − 1; binary search k and
    test with 2D prefix sums of the cells with height ≥ k.
  why_others_fail: 'A 2D range minimum table is not needed: thresholding turns the test into a count of
    cells, and the answer is a number to search.'
- problem: cf-1968F
  answer:
    topic: '1.7'
    card: prefix-xor
  property: The XOR of a range is two prefix values; split points are positions of given prefix values,
    found by binary search in position lists.
  why_others_fail: A sparse table needs an operation that ignores repeats, and XOR cancels equal pairs
    instead.
- problem: cf-846D
  answer:
    topic: '1.4'
    card: answer-search
  property: Binary search the time; for a given time mark the broken pixels and check with 2D prefix sums
    whether a k × k square is full.
  why_others_fail: 'There is no array of values to take a range extreme of: the question is the earliest
    time, so the search is over time.'
- problem: cf-1060C
  answer:
    topic: '1.2'
    card: range-sum
  property: A rectangle of the table a_i·b_j has sum (sum of its rows of a) × (sum of its columns of b);
    the smallest window sums per length come from prefix sums.
  why_others_fail: The sums are what is needed, not an extreme, and n, m ≤ 2000 allow O(n²) with prefix
    sums.
- problem: lc-count-stable-subarrays
  answer:
    topic: '1.2'
    card: range-sum
  property: Cut the array into maximal non-decreasing runs; the number of good subarrays ending at each
    position is a run length, summed with prefix sums.
  why_others_fail: The answer is a count built from sums over a range, not a minimum or maximum, so a
    table of extremes is useless.
- problem: lc-minimum-absolute-difference-queries
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: Values are at most 100, so keep prefix counts for each value; scan the 100 values per query
    and take the smallest gap between present ones.
  why_others_fail: A range minimum cannot give the gap between neighbouring values of a range; the small
    value range is what makes prefix counts enough.
lookalike_pairs:
- a: lc-maximum-total-subarray-value-ii
  b: lc-maximum-total-subarray-value-i
  a_tool:
    topic: '5.1'
    card: idempotent-range-query
  b_tool:
    topic: '0.2'
    card: closed-form
  shared_surface: Both ask for the largest total of (largest − smallest) over k chosen subarrays of the
    same array of n ≤ 5·10^4 numbers.
  flipping_difference: In I the same subarray may be chosen again, so the best subarray is taken k times
    and the answer is a formula. In II the k subarrays must be different, so the k best are taken from
    the largest down, and each one needs the largest and smallest value of an arbitrary range at once.
  flipping_input: 'nums = [1, 3, 2], k = 3. I: the whole array has value 2, so the answer is 3 · 2 = 6.
    II: the best different subarrays have values 2, 2 and 1, so the answer is 5.'
- a: cf-1611F
  b: cf-1486D
  a_tool:
    topic: '5.1'
    card: monotone-range-search
  b_tool:
    topic: '1.2'
    card: prefix-extremes
  shared_surface: Both reduce to prefix sums and ask whether some range keeps a sum condition, with an
    array of about 2·10^5 numbers.
  flipping_difference: 'In A both ends are free: for each start the range can run until the first prefix
    value below a bound, which is a search with a range-minimum table. In B (after fixing the median by
    binary search) the left end only has to be at least k places before the right end, so a running minimum
    of the prefix sums is enough and no table is needed.'
self_test:
- q: Build the sparse table of minimums for a = [3, 1, 4, 1, 5, 9, 2, 6]. How many levels does it have,
    how many entries in total, and what is st[2][4]?
  a: 'n = 8, so the levels are 0, 1, 2, 3: four levels. They have 8 + 7 + 5 + 1 = 21 entries (level j
    has n − 2^j + 1). st[2][4] is the minimum of the block of 4 positions starting at 4, that is min(5,
    9, 2, 6) = 2.'
- q: For the same array, which two blocks does the query on positions 1 to 5 use, and what is the result?
  a: 'The length is 5, so k = 2 (4 ≤ 5 < 8). The blocks are [1, 4] and [2, 5]: st[2][1] = min(1, 4, 1,
    5) = 1 and st[2][2] = min(4, 1, 5, 9) = 1, so the answer is 1. The blocks overlap in positions 2 to
    4.'
- q: Take a = [2, 5, 1] and answer the sum of positions 0 to 2 the way the sparse table answers a minimum
    (two blocks of length 2). What do you get, and why is it wrong?
  a: The blocks are [0, 1] and [1, 2] with sums 7 and 6, giving 13. The true sum is 8. The element 5 is
    in both blocks and is added twice; a sum is not idempotent. Prefix sums answer sums.
- q: Is XOR safe for the sparse table? Test it on a = [1, 2, 3] and the range [0, 2].
  a: No. The blocks [0, 1] and [1, 2] have XORs 3 and 1, and 3 XOR 1 = 2, but 1 XOR 2 XOR 3 = 0. The middle
    element is XORed twice and cancels itself, so the overlap changes the answer. Prefix XOR values answer
    XOR ranges.
- q: For a = [20, 12, 18, 6, 9] and l = 0, list the stretches of gcd(a[0..r]). How many are there, and
    what does Theorem 5.1.4 promise as the most?
  a: 'The GCDs are 20, 4, 2, 2, 1: the stretches are 20 on [0, 0], 4 on [1, 1], 2 on [2, 3] and 1 on [4,
    4], so 4 stretches. The bound is 1 + floor(log2 20) = 5.'
- q: For a = [7, 5, 6, 2, 8], l = 0 and the test "min(a[0..r]) ≤ 5", which r is the first one, and how
    many range queries does the binary search of Theorem 5.1.3 make (lo = 0, hi = 5)?
  a: 'The prefix minimums are 7, 5, 5, 2, 2, so the first r is 1. The search: mid = 2 (min 5, true, hi
    = 2), mid = 1 (min 5, true, hi = 1), mid = 0 (min 7, false, lo = 1). Three queries, and lo = hi =
    1.'
- q: For n = 10^6 numbers, how many entries does the table of minimums have, and about how much memory
    is that for ints? Does the answer change if n becomes 10^7?
  a: 'There are 20 levels (2^19 ≤ 10^6 < 2^20), and level j has 10^6 − 2^j + 1 entries, in total about
    1.9·10^7 entries, about 76 MB with 4-byte ints. For n = 10^7 there are 24 levels and about 2.3·10^8
    entries, about 1 GB: too much for the usual limit, so a different tool is needed.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-1547F
  - cf-1706E
  - lc-minimum-stability-factor-of-array
decision_map:
- weak_signal: Many questions about the smallest, largest, GCD, AND or OR of a range [l, r] of an array
    that never changes
  choose: idempotent-range-query
  when: 'The combination does not change when a value is counted twice and the array is fixed (Theorem
    5.1.2): build the table once and answer with two blocks.'
  over:
  - card: range-sum
    topic: '1.2'
    because: For a sum the overlap would count values twice; prefix sums answer it with no table.
  - card: window-deque
    topic: '1.6'
    because: If all the ranges are windows of one length that slide right, a deque is smaller and as fast.
  - card: nested-loops
    topic: '0.5'
    because: Scanning each range is only fine when n · q is below about 10^8.
- weak_signal: The first or last position where the minimum, AND, GCD, maximum or OR of a growing range
    passes a bound; for each start, the first later position with a bigger or smaller value than a threshold
  choose: monotone-range-search
  when: 'For a fixed start the aggregate only moves one way (Theorem 5.1.3): binary search the end with
    table queries.'
  over:
  - card: answer-search
    topic: '1.4'
    because: There the search is over a value of the answer with a greedy check, not over the end of a
      range with a table.
  - card: shrinkable-window
    topic: '1.3'
    because: With positive values and a sum, two pointers move both ends and need no table.
  - card: nearest-greater
    topic: '1.6'
    because: If the threshold is the element itself, a stack finds the next greater element in O(n).
- weak_signal: The sum, count or best, over all subarrays, of the GCD, AND or OR of the subarray; the
    subarray whose AND or GCD is closest to a target
  choose: few-changes-count
  when: 'For a fixed start the value changes only about log(max value) times (Theorem 5.1.4): walk the
    stretches with one search each.'
  over:
  - card: per-bit-contribution
    topic: '1.7'
    because: Bits can be counted separately for sums of AND, OR and XOR, but not for a GCD or a closest
      value.
  - card: element-span
    topic: '1.6'
    because: For minimums and maximums the changes are not few; a stack counts the subarrays where each
      element is the extreme.
  - card: prefix-count-lookup
    topic: '1.2'
    because: A table of counts of prefix values needs an operation that can be undone; GCD, AND and OR
      cannot.
- weak_signal: Many queries asking for the sum or count over a range [l, r] of a fixed array or string
  choose: idempotent-range-query
  when: The aggregate is a minimum, maximum, GCD, AND or OR instead of a sum or a count (Theorem 5.1.2).
  over:
  - card: range-sum
    topic: '1.2'
    because: A sum or a count can be undone by subtracting two prefix values; a minimum cannot, so it
      needs the table.
- weak_signal: The maximum or minimum of every window of k elements; the longest or shortest window with
    max − min within a bound
  choose: idempotent-range-query
  when: The windows have different lengths or arbitrary ends, or the extremes are needed inside a search
    or a two-pointer scan with O(1) per query.
  over:
  - card: window-deque
    topic: '1.6'
    because: For one fixed length k that slides, the deque needs O(n) time and memory and no table.
glossary_added:
- RMQ
- sparse table
- idempotent operation
- range aggregate
