# MySQL for labs. Image pinned in .env.labserver. Host port: LAB_MYSQL_PORT (default 3306).
services:
  mysql:
    image: ${MYSQL_IMAGE:?set MYSQL_IMAGE in .env.labserver}
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_DB_PASSWORD:?set LAB_DB_PASSWORD in .env.labserver}
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD}
      MYSQL_DATABASE: lab
    ports: ["${LAB_BIND:-127.0.0.1}:${LAB_MYSQL_PORT:-3306}:3306"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
