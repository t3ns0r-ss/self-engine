drill:
- problem: lc-number-of-ways-to-paint-n-3-grid
  answer:
    topic: '3.2'
    card: linear-state
  property: 'The last row is one of 12 colourings in two kinds (two colours or three), and the next row
    depends only on the kind: a DP over the rows with two counts, n steps.'
  why_others_fail: 'n ≤ 5000: a loop is enough; the matrix power gives the same recurrence but there is
    no huge index.'
- problem: cf-717D
  answer:
    topic: '7.6'
    card: walk-counting
  property: The state is the xor of the sizes so far, a number below 128; each heap is the same map of
    the 128 probabilities, and n is up to 10^9, so the 128 × 128 matrix (or the convolution) is raised
    to the power n.
  why_others_fail: A DP over the heaps costs n · 128 · 100 = 10^13; Nim (topic 7.5) says that the first
    player wins unless the xor is 0, but the probability needs the distribution of the xor.
- problem: cf-1635D
  answer:
    topic: '3.2'
    card: linear-state
  property: 'Count the numbers by their bit length: len[k] = len[k − 1] + len[k − 2], and the prefix sums
    over k ≤ p ≤ 2·10^5 give the count: a loop of p steps.'
  why_others_fail: p is at most 2·10^5, so a loop is the whole solution and the matrix power is not needed.
- problem: cf-1437C
  answer:
    topic: '3.2'
    card: two-index
  property: 'Sort the dishes; dp[i][j] = the best cost placing the first i dishes in the minutes up to
    j: a DP over two indices with n ≤ 200.'
  why_others_fail: The choice of a minute for a dish is an assignment with a cost; greedy by the best
    time fails, and nothing here has a huge index.
- problem: cf-1627D
  answer:
    topic: '2.1'
    card: multiples-sieve
  property: For each x up to 10^6 take the gcd of the elements of the set that are multiples of x; x can
    be added exactly when this gcd equals x. Loop over the multiples of x (harmonic sum).
  why_others_fail: 'There is no recurrence in the index: the question is a gcd over multiples, and a sieve
    over the multiples answers it in n log n.'
- problem: cf-148D
  answer:
    topic: '3.2'
    card: two-index
  property: 'dp[w][b] = the probability that the princess wins from w white and b black mice: four transitions,
    10^6 states.'
  why_others_fail: The values are probabilities over two small counts; there is no fixed small state set
    and no huge index.
- problem: cf-1845D
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: Prefix sums of the changes; the bound k is best set just before the largest drop of the prefix
    sums, so the answer uses the minimum prefix.
  why_others_fail: 'There is no recurrence and no huge index: the rule is a prefix-sum extremum over one
    array.'
- problem: lc-string-transformation
  answer:
    topic: '7.6'
    card: linear-recurrence
  property: The operations are rotations of s; let m be the number of rotations that equal t (found with
    the Z-function or KMP, topic 6.2). Then the count of the ways after j operations to be at t (a_j)
    and not at t (b_j) follows a two-term linear recurrence with constant coefficients (n − 1 choices
    to leave, m choices to enter), and k is up to 10^15.
  why_others_fail: A DP over k operations is far too slow (k up to 10^15), and a search over rotations
    is exponential; the two-state matrix power gives the answer in 60 steps.
lookalike_pairs:
- a: lc-fibonacci-number
  b: cses-1722
  a_tool:
    topic: '3.2'
    card: linear-state
  b_tool:
    topic: '7.6'
    card: linear-recurrence
  shared_surface: Both ask for the n-th Fibonacci number, with the same rule F(n) = F(n − 1) + F(n − 2).
  flipping_difference: With n ≤ 30 a loop over the terms is the solution (28 additions). With n up to
    10^18 and the answer modulo 10^9 + 7 a loop is impossible, and the 2 × 2 companion matrix is raised
    to the power n by repeated squaring.
  flipping_input: 'n = 10^18: a loop needs 10^18 steps (about 10^10 seconds), against about 120 products
    of 2 × 2 matrices.'
- a: lc-total-characters-in-string-after-transformations-i
  b: lc-total-characters-in-string-after-transformations-ii
  a_tool:
    topic: '3.2'
    card: linear-state
  b_tool:
    topic: '7.6'
    card: walk-counting
  shared_surface: Both replace every letter of a string at each of t steps by other letters and ask for
    the length of the result modulo 10^9 + 7.
  flipping_difference: 'In version I the rule is the same for all letters but z, and t ≤ 10^5: keep the
    counts of the 26 letters and update them t times (26 steps per transformation). In version II every
    letter has its own number of successors and t ≤ 10^9: one step is a fixed 26 × 26 matrix on the counts,
    and its t-th power is taken by repeated squaring.'
  flipping_input: 't = 10^9 and 26 letters: the count update takes 26 · 10^9 = 2.6·10^10 steps, against
    26^3 · 30 · 2 ≈ 10^6 for the matrix power.'
self_test:
- q: Write the companion matrix of x_n = 3 x_(n−1) + 2 x_(n−2) + 5 x_(n−3) and the starting vector v_0
    for x_0 = 1, x_1 = 2, x_2 = 3 (Theorem 7.6.1).
  a: C = [[3, 2, 5], [1, 0, 0], [0, 1, 0]] and v_0 = (x_2, x_1, x_0) = (3, 2, 1). The first row holds
    the coefficients; the rows below shift the old terms.
- q: With C = [[1, 1], [1, 0]], compute C^4 by two squarings and then C^8, and read F_8 and F_9.
  a: C^2 = [[2, 1], [1, 1]], C^4 = [[5, 3], [3, 2]], C^8 = (C^4)^2 = [[34, 21], [21, 13]]. The matrix
    C^n is [[F_(n+1), F_n], [F_n, F_(n−1)]], so F_8 = 21 and F_9 = 34.
- q: How many walks of length 4 go from vertex 0 to vertex 0 in the complete graph on 3 vertices (no loops)?
    (Theorem 7.6.2)
  a: A^2 has the rows (2, 1, 1), (1, 2, 1), (1, 1, 2). The entry (0, 0) of A^4 = (A^2)(A^2) is 2·2 + 1·1
    + 1·1 = 6.
- q: Give the 3 × 3 matrix on the vector (x_n, n, 1) for x_(n+1) = 2 x_n + n + 5, and use it once on (1,
    0, 1) (Theorem 7.6.3).
  a: The rows are (2, 1, 5), (0, 1, 1), (0, 0, 1). Applied to (1, 0, 1) it gives (7, 1, 1), so x_1 = 7
    (and the next application gives x_2 = 2·7 + 1 + 5 = 20).
- q: Why is (max, ×) on integers that may be negative not a semiring for the power trick? Give a counterexample.
  a: '× does not distribute over max when the multiplier is negative: −1 · max(1, 2) = −2, but max(−1
    · 1, −1 · 2) = −1. Then the matrix product is not associative and the squaring may give a wrong answer.'
- q: Two rooms with a corridor 0 → 1 of weight 2 and a corridor 1 → 0 of weight 1. What is the least weight
    of a walk from 0 to 1 with exactly 3 edges, and what does exactly 2 edges give? (Theorem 7.6.4)
  a: 'Exactly 3 edges: 0 → 1 → 0 → 1 with weight 2 + 1 + 2 = 5. Exactly 2 edges: the walk would end in
    room 0, so the entry (0, 1) is infinity (no such walk).'
- q: For n = 10^18, estimate the number of operations for an order k = 50 and for k = 1000. Which can
    be done in one second?
  a: 'About k^3 · 2 · 60. For k = 50: 125 000 · 120 = 1.5·10^7, fast. For k = 1000: 10^9 · 120 = 1.2·10^11,
    far too slow.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-821E
  - cf-852B
  - cf-696C
decision_map:
- weak_signal: The n-th term, or the number of ways to reach a total n, of a rule that looks at the last
    few terms, with n up to 10^18 modulo a prime
  choose: linear-recurrence
  when: The coefficients are constants, the order k is small (at most about 100), and n is far too large
    for a loop (Theorem 7.6.1).
  over:
  - card: linear-state
    topic: '3.2'
    because: If n is at most about 10^7, a loop over the terms is the solution.
  - card: fast-power
    topic: '2.2'
    because: If the term is a single power or a product of powers, a plain fast power is enough; a recurrence
      needs the matrix.
- weak_signal: The number of ways to make exactly L steps in a small graph, automaton or set of states,
    with L up to 10^18, modulo a prime
  choose: walk-counting
  when: 'At most about 100 states, the same transitions at every step, and repeated states allowed: the
    L-th power of the transition matrix counts the walks (Theorem 7.6.2).'
  over:
  - card: path-mask
    topic: '3.7'
    because: If a vertex may not be used twice, the state must hold the set of used vertices.
  - card: unweighted-shortest
    topic: '4.1'
    because: If only the distance is asked, a breadth-first search is enough; no count of walks.
- weak_signal: A recurrence or a sum with an additive constant, a term in n, or a sum of earlier terms,
    with n up to 10^18
  choose: augmented-matrix
  when: 'Every extra term is a constant, a polynomial in n or a sum of earlier terms: add it as a coordinate
    of the state vector (Theorem 7.6.3).'
  over:
  - card: linear-recurrence
    topic: '7.6'
    because: Without an extra term the companion matrix alone does it.
  - card: mod-arithmetic-basic
    topic: '0.4'
    because: If the extra term is a remainder (n mod 3) or periodic, a closed form over one period is
      simpler.
- weak_signal: The best walk (cheapest, most valuable, or just possible) with exactly L edges, or the
    best value of a process repeated T times, with L or T huge
  choose: min-plus
  when: 'The value of a walk is a sum of weights, the optimum is a minimum or maximum, and the number
    of steps is fixed: the power over (min, +), (max, +) or (or, and) (Theorem 7.6.4).'
  over:
  - card: dijkstra
    topic: '4.3'
    because: If the number of edges is free, a shortest-path algorithm is the tool.
  - card: walk-counting
    topic: '7.6'
    because: If the number of walks (not the best value) is asked, the ordinary power counts them.
