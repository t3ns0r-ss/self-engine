# Patterns for topic 1.2 (Prefix sums and difference arrays (1D, 2D)). Provisional until the lesson maps them to Recognition Cards.
topic: "1.2"
patterns:
  - id: range-sum
    name: Static range sums
    description: Answer many sum queries over ranges of a fixed array in O(1) each after O(n) preparation.
    precondition: "The array does not change, and the operation can be undone (sums: subtract the prefix before l)."
  - id: prefix-count-lookup
    name: Pairs of prefix values
    description: Count subarrays whose sum equals k, or is divisible by k, by counting earlier prefix values in a map.
    precondition: The condition on a subarray [l, r] is a condition on the pair of prefix values P[r] and P[l−1] alone.
  - id: difference-array
    name: Many range updates, then read
    description: Apply many "add v to every element in [l, r]" updates, then read the final array once.
    precondition: All updates come before all reads (offline), so each update is two point changes in the difference array.
  - id: prefix-2d
    name: Rectangle sums in a grid
    description: Sum over any sub-rectangle of a fixed grid via the four-corner formula; also 2D range updates read once.
    precondition: The grid is static, and the rectangle sum equals a signed combination of four prefix rectangles.
  - id: prefix-extremes
    name: Prefix and suffix extremes
    description: Precompute prefix and suffix maxima or minima to answer "best value excluding position i" or "best split point".
    precondition: The extreme of a prefix (or suffix) can only grow (or shrink) as it extends, so one pass computes all of them.
