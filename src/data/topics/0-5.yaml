# Topic 0.5 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.5"
draft: true
cards:
  - id: nested-loops
    name: Try every pair or triple
    decisive_property: The candidates are pairs, triples or a few values, every candidate is listed by nested loops, and their number (about n²/2 or n³/6, fewer after computing the last variable from the others) times the check fits the budget.
    from_theorem: Theorem 0.5.1
    how_to_test: Write the candidate as a tuple, count the tuples with the largest input, and see whether one variable is determined by the others.
    weak_signals:
      - '"How many ways to choose …" with three or four variables and a small total'
      - n ≤ 100 to 3000 with a question about pairs or triples
      - A sum of coins or items equals a target
    kill_signals:
      - "n² is far over the budget (n ≥ 10^5): a sort, a map or a formula is needed"
    lookalikes:
      - description: The same question about pairs with n = 2·10^5
        needs: "a faster tool: sorting (1.1) or counting with a map (0.6)"
        flipping_difference: n²/2 = 2·10^10 pairs do not fit the budget.
    complexity: O(n²) or O(n³) checks, or one dimension fewer when the last variable is computed.
  - id: subset-bitmask
    name: All subsets as bitmasks
    decisive_property: Each of n ≤ about 20 items is independently in or out, every subset can be checked on its own, and 2^n · (cost of one check) fits the budget.
    from_theorem: Theorem 0.5.2
    how_to_test: Ask "is this a yes/no choice for each item?", then compute 2^n times the cost of checking one subset.
    weak_signals:
      - N ≤ 15 or N ≤ 20 in an otherwise ordinary statement
      - '"Choose some of …", "split into two groups", "which switches are on"'
      - Every item is either used or not
    kill_signals:
      - Each item has more than two options, or the order matters
      - n is 40 or more
    lookalikes:
      - description: Each item goes to one of three or four places
        needs: recursive-choices (0.5)
        flipping_difference: More than two choices per item do not fit one bit each; recursion (or base k counting) lists them.
    complexity: O(2^n · n) when one subset is checked in O(n).
  - id: permutations
    name: All orders
    decisive_property: The answer depends on the order of n ≤ about 9 items, every order can be checked on its own, and (number of distinct orders, at most n!) times the check fits the budget.
    from_theorem: Theorem 0.5.3
    how_to_test: Ask whether swapping two items changes the result (then the order matters), and compute n! · n.
    weak_signals:
      - '"Visit every city once", "arrange", "in some order", "relabel the vertices"'
      - N ≤ 8 or N ≤ 10
      - The K-th string made from the letters of S
    kill_signals:
      - "Only which items are chosen matters, not their order: subsets are enough"
      - n ≥ 12 (12! ≈ 4.8·10^8 orders)
    lookalikes:
      - description: Choose which items to take, order irrelevant
        needs: subset-bitmask (0.5)
        flipping_difference: "With order irrelevant, 2^n subsets replace n! orders: far fewer candidates."
    complexity: O(n! · n), fewer when values repeat.
  - id: recursive-choices
    name: Recursive generation
    decisive_property: A candidate is a sequence of L choices whose length L is part of the input (or whose allowed choices depend on earlier ones), and the number of sequences (k^L or fewer) times the check fits the budget.
    from_theorem: Theorem 0.5.4
    how_to_test: Write the candidate as positions with choices; check that L varies with the input, so a fixed number of nested loops cannot list it, and bound the number of sequences.
    weak_signals:
      - '"All sequences of length N with …", "non-decreasing sequences", "numbers made only of the digits 3, 5, 7"'
      - Each item has three or more options
      - Small N and M (≤ 10) together
    kill_signals:
      - The count k^L is far over the budget even with small parameters (then a later technique is needed)
    lookalikes:
      - description: Strictly increasing sequences of length N from 1..M
        needs: subset-bitmask (0.5)
        flipping_difference: A strictly increasing sequence is the same as the set of its values, so N-element subsets list them; repeats would break that.
    complexity: O(k^L · cost of the check), depth L.
  - id: enumerate-answer
    name: Try every candidate answer
    decisive_property: The answer (or one key quantity) lies in a range proved small from the constraints, and each value can be checked directly, so testing every value in order finds the smallest that works.
    from_theorem: Theorem 0.5.5
    how_to_test: Bound the answer from the constraints, then check that (range size) × (cost of one check) fits the budget.
    weak_signals:
      - '"The smallest x such that …" with a small bound on x'
      - One quantity (a count of mixed items, a price, a starting value) determines everything else
      - Candidate answers are few even though inputs are large
    kill_signals:
      - "The range is huge (10^18) and the check is not monotone-friendly: a formula or a later search technique is needed"
    lookalikes:
      - description: The same smallest-x question with x up to 10^18
        needs: a formula (0.2) or a later search
        flipping_difference: Testing every value is impossible; the answer must be computed or searched faster.
    complexity: O(range · cost of one check).
problems:
  - id: ac-abc087_b
    role: ladder
    card: nested-loops
    rung: 1
    twist: Base case of the card
    summary: Count the ways to pay exactly X yen with at most A coins of 500, B of 100 and C of 50 (A, B, C ≤ 50).
    hints:
      - How many combinations (a, b, c) are there in total?
      - "At most 51³ ≈ 1.3·10^5: few enough to try them all (Theorem 0.5.1)."
      - Three loops over a ≤ A, b ≤ B, c ≤ C; count those with 500a + 100b + 50c = X.
  - id: ac-abc181_c
    role: ladder
    card: nested-loops
    rung: 2
    twist: Triples of points instead of numbers, with an exact integer test for each.
    summary: Do any three of N points (N ≤ 10^2, coordinates ≤ 10^3) lie on one line?
    hints:
      - How many triples of points are there, and how do you test one without division?
      - At most 100·99·98/6 ≈ 1.6·10^5 triples. Points 1, 2, 3 are on one line exactly when (x2 − x1)(y3 − y1) = (y2 − y1)(x3 − x1).
      - Three loops i < j < k with that integer test; print Yes at the first match.
  - id: ac-abc085_c
    role: ladder
    card: nested-loops
    rung: 3
    twist: The third count is determined by the other two, so two loops suffice.
    summary: Can N bills (N ≤ 2000) of 10000, 5000 and 1000 yen add up to exactly Y yen? Print one way or −1 −1 −1.
    hints:
      - Three loops of 2001 values are 8·10^9 steps. Is the third count free?
      - "No: with x and y chosen, z = N − x − y is forced (Section 4.1)."
      - "Loop x and y with x + y ≤ N, set z = N − x − y, and test 10000x + 5000y + 1000z = Y: about 2·10^6 steps."
  - id: ac-abc051_b
    role: ladder
    card: nested-loops
    rung: 4
    twist: The computed variable needs its own bound check.
    summary: Count triples (X, Y, Z) with 0 ≤ X, Y, Z ≤ K and X + Y + Z = S (K ≤ 2500).
    hints:
      - Three loops cost 1.6·10^10. Which variable is determined by the other two?
      - Z = S − X − Y. It must also satisfy 0 ≤ Z ≤ K, which the loops no longer guarantee.
      - Loop X and Y (6.25·10^6 steps), compute Z, and count it when 0 ≤ Z ≤ K.
  - id: lc-subsets
    role: ladder
    card: subset-bitmask
    rung: 1
    twist: Base case of the card
    summary: List every subset of an array of n ≤ 10 distinct numbers.
    hints:
      - How many subsets are there, and how can one integer stand for one subset?
      - There are 2^n; the integers 0..2^n − 1 correspond to them one-to-one (Theorem 0.5.2).
      - For each mask, collect nums[i] for every i with (mask >> i) & 1.
  - id: ac-abc079_c
    role: ladder
    card: subset-bitmask
    rung: 2
    twist: "Each of the three operators is + or −: a bitmask over the operators, not the items."
    summary: Insert + or − between the four digits of ABCD so the value is 7; print one such formula.
    hints:
      - How many ways are there to choose the three operators?
      - "2³ = 8: let bit k of a mask choose + or − for the k-th operator."
      - For mask 0..7 evaluate the formula; print the first that gives 7.
  - id: ac-abc289_c
    role: ladder
    card: subset-bitmask
    rung: 3
    twist: The check of a subset is itself a small scan (mark the covered numbers).
    summary: M sets of numbers from 1..N (N, M ≤ 10); count the choices of sets whose union is all of 1..N.
    hints:
      - How many choices of sets are there, and how much does checking one cost?
      - "2^M ≤ 1024 choices, each checked by marking the numbers of the chosen sets: about N·M steps."
      - For every mask, mark the elements of the chosen sets in a boolean array and count the masks where all of 1..N are marked.
  - id: ac-abc190_c
    role: ladder
    card: subset-bitmask
    rung: 4
    twist: The bit chooses between two options of a person, not "in or out".
    summary: K people (K ≤ 16) each put a ball on one of two given dishes; M conditions each need two dishes to both have a ball; the most conditions satisfied.
    hints:
      - What is one candidate, and how many are there?
      - "A choice of dish for every person: 2^K ≤ 65536 candidates, one bit per person."
      - For each mask place the balls (dish C_i if bit i is 0, else D_i), then count the conditions met; keep the maximum. About 2^K·(K + M) steps.
  - id: ac-abc167_c
    role: ladder
    card: subset-bitmask
    rung: 5
    twist: Optimise a cost over subsets while checking several requirements at once.
    summary: N books (N ≤ 12) each cost C_i and raise M skills (M ≤ 12) by given amounts; the cheapest set of books that brings every skill to at least X, or −1.
    hints:
      - How many sets of books are there?
      - "2^12 = 4096; for each, add up the cost and the gain in every skill: 4096·12·12 ≈ 6·10^5 steps."
      - For every mask sum costs and skills, check all skills ≥ X, and keep the minimum cost; −1 if no mask passes.
  - id: lc-permutations
    role: ladder
    card: permutations
    rung: 1
    twist: Base case of the card
    summary: List every order of an array of n ≤ 6 distinct numbers.
    hints:
      - If you only had the indices 0..n − 1, which order would come first?
      - The sorted order 0, 1, …, n − 1. Stepping with next_permutation from it visits every order once (Theorem 0.5.3).
      - Fill idx with 0..n − 1, then do { record nums[idx[0]], …, nums[idx[n − 1]] } while (next_permutation(idx)).
  - id: ac-abc145_c
    role: ladder
    card: permutations
    rung: 2
    twist: Average a quantity over all n! orders instead of finding one order.
    summary: N towns (N ≤ 8) at given points; the average length of a path visiting all of them, over all N! orders.
    hints:
      - How many orders are there, and what does each contribute?
      - 8! = 40320 orders; each contributes the sum of the N − 1 distances along it.
      - Loop over all orders of the indices with next_permutation, add each path length, and divide the total by N!. Print with enough decimals.
  - id: ac-abc150_c
    role: ladder
    card: permutations
    rung: 3
    twist: Use the lexicographic order of next_permutation itself to number the orders.
    summary: Two permutations P and Q of 1..N (N ≤ 8); how far apart are they in the lexicographic list of all permutations?
    hints:
      - In which order does next_permutation visit the permutations of 1..N?
      - In increasing lexicographic order, starting from 1, 2, …, N (Theorem 0.5.3), so a counter gives each its position.
      - Step through all orders with a counter; record the counter when the current order equals P and when it equals Q; print the absolute difference.
  - id: lc-letter-combinations-of-a-phone-number
    role: ladder
    card: recursive-choices
    rung: 1
    twist: Base case of the card
    summary: All letter strings a phone keypad digit string (length ≤ 4, digits 2–9) can stand for.
    hints:
      - The number of positions is the length of the input. Why are nested loops awkward?
      - You would need as many loops as digits. Recursion over positions handles any length with the same code (Theorem 0.5.4).
      - "rec(pos): if pos == n save the string; otherwise for each letter of digit pos, append it, recurse, and remove it."
  - id: ac-abc247_c
    role: ladder
    card: recursive-choices
    rung: 2
    twist: The recursion builds a string from two copies of the previous one.
    summary: S_1 = "1" and S_n is S_{n−1}, then n, then S_{n−1}; print S_N (N ≤ 16).
    hints:
      - How is S_n made from smaller strings?
      - From two copies of S_{n−1} around the number n; the base case is S_1.
      - "A recursive function f(n) returning the sequence: f(1) = (1), f(n) = f(n − 1) + (n) + f(n − 1). The length is 2^N − 1 ≤ 65535."
  - id: cses-2165
    role: ladder
    card: recursive-choices
    rung: 3
    twist: The recursion solves a smaller instance twice around one move.
    summary: Move a tower of n disks (n ≤ 16) from the left to the right stack, never a larger disk on a smaller one; print the fewest moves.
    hints:
      - Before the largest disk can move, where must the other n − 1 disks be?
      - "On the middle stack. So: move n − 1 disks left → middle, the largest left → right, then n − 1 disks middle → right."
      - hanoi(n, from, to, via) recursing on n − 1 twice; the base case n = 0 does nothing. Print 2^n − 1 moves first.
  - id: cses-1624
    role: ladder
    card: recursive-choices
    rung: 4
    twist: The choices at a row depend on all earlier rows (columns and diagonals used).
    summary: Place 8 queens on an 8 by 8 board with some reserved squares so that no two attack each other; count the ways.
    hints:
      - Each row must hold exactly one queen. What is the choice at each row?
      - Its column. A column is allowed if it is not reserved in that row and no earlier queen shares its column or a diagonal.
      - rec(row) tries every allowed column, marks the column and the diagonals r + c and r − c + 7, recurses, then unmarks; count the calls that reach row 8.
  - id: ac-abc105_b
    role: ladder
    card: enumerate-answer
    rung: 1
    twist: Base case of the card
    summary: Can exactly N dollars (N ≤ 100) be spent on cakes at 4 dollars and doughnuts at 7 dollars (any counts, including zero)?
    hints:
      - How many cakes can you possibly buy?
      - At most N/4 = 25. For each cake count, the rest must be a multiple of 7.
      - Loop a from 0 while 4a ≤ N and test (N − 4a) % 7 == 0.
  - id: ac-abc157_c
    role: ladder
    card: enumerate-answer
    rung: 2
    twist: The answer space (0..999) is tiny even though it is described by conditions.
    summary: The smallest non-negative integer with exactly N digits (N ≤ 3) whose given digit positions have given values, or −1.
    hints:
      - How large can the answer be?
      - Less than 1000, so test every x from 0 upward (Theorem 0.5.5). Note that 0 has one digit.
      - "For x = 0..999: check that x has exactly N digits and every condition; print the first x that passes, else −1."
  - id: cf-1271A
    role: ladder
    card: enumerate-answer
    rung: 3
    twist: Enumerate one key quantity and compute the best value of the other from it.
    summary: Ties, scarves, vests and jackets in given amounts (≤ 10^5); suit 1 is tie + jacket and earns e, suit 2 is scarf + vest + jacket and earns f; the most money.
    hints:
      - If you fix the number k of first-type suits, what is the best number of second-type suits?
      - "min(b, c, d − k): the remaining jackets limit it too."
      - Try every k from 0 to min(a, d) and maximise k·e + min(b, c, d − k)·f in long long.
  - id: ac-abc414_c
    role: ladder
    card: enumerate-answer
    rung: 4
    twist: "Enumerate a smaller set that contains every answer: palindromes built from their first half."
    summary: Sum of the numbers up to N (N ≤ 10^12) that are palindromes both in base 10 and in base A (A ≤ 9).
    hints:
      - Testing every number up to 10^12 is too slow. How many decimal palindromes are there up to 10^12?
      - "About 2·10^6: a palindrome is fixed by its first half (up to 6 digits), with odd or even length."
      - For every first half h up to 10^6 build the two palindromes (mirror with and without the middle digit); keep those ≤ N whose base-A digits form a palindrome; sum in long long.
