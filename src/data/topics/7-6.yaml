# Topic 7.6 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.6'
uses:
- topic: '0.4'
  what: 'Modular arithmetic: remainders after each sum and product, and the period of a pattern'
- topic: '0.5'
  what: 'Brute force: the plain loop over the steps, the reference of every check'
- topic: '1.1'
  what: 'Sorting: the order of the stretches in a problem with obstacles, and the order of a DP over sorted
    data'
- topic: '1.2'
  what: 'Prefix sums: the sum of a fixed array, and the prefix extremum of a drill problem'
- topic: '1.4'
  what: 'Binary search: the smallest length found by combining saved powers'
- topic: '1.7'
  what: 'Bitwise operations: the binary form of the exponent and the 64-bit masks of the boolean matrix'
- topic: '2.1'
  what: 'Number theory: gcd and multiples in the problems that hide a recurrence'
- topic: '2.2'
  what: 'Fast exponentiation and Fermat: the power by squaring, and exponents reduced modulo p - 1'
- topic: '2.3'
  what: 'Combinatorics: the closed formulas that a recurrence replaces, and the counting rules'
- topic: '3.2'
  what: 'Dynamic programming: a value at each step from the earlier values, and the plain loop for small
    n'
- topic: '3.5'
  what: 'Counting DP: counting problems with a few states and a modulus, solved by a loop when n is small'
- topic: '3.7'
  what: 'Bitmask DP: paths that do not repeat a vertex, which a matrix power cannot count'
- topic: '4.1'
  what: 'Graph traversal: the graph whose walks are counted'
- topic: '4.3'
  what: 'Shortest paths: the cheapest path with any number of edges, against exactly L edges'
- topic: '5.3'
  what: 'Segment tree: a matrix as the value of a node or of a lazy tag'
- topic: '6.2'
  what: 'Prefix function and Z-function: counting the positions of a match before a recurrence is applied'
- topic: '7.5'
  what: 'Sprague–Grundy theorem: Nim and the xor, whose distribution is counted by a matrix power'
theorems:
- id: 7.6.1
  title: The companion matrix
  plain_words: 'One step of the recurrence is the same multiplication every time: the new term is a fixed
    mix of the last $k$ terms, and the other terms just move one place. Doing $n$ steps is doing the same
    multiplication $n$ times, which is a power of the matrix. A power can be built by squaring, so $n$
    steps cost only about $\log_2 n$ squarings.'
  code: 7.6/thm-1
- id: 7.6.2
  title: Walks and the adjacency matrix
  plain_words: A walk of $L + 1$ edges is a walk of $L$ edges followed by one more edge. Counting by where
    the first $L$ edges end is exactly what the product of matrices does. So the power of the adjacency
    matrix counts walks, and a long walk count is a fast power.
  code: 7.6/thm-2
- id: 7.6.3
  title: Constants, indices and sums as coordinates
  plain_words: If a quantity changes by a rule that is linear in the quantities we already follow, add
    it to the list of coordinates. A constant that is added at each step is a coordinate that is always
    1. The index $n$ is a coordinate that grows by 1. A running sum is a coordinate that adds one of the
    others at each step. Then the whole thing is again one fixed matrix.
  code: 7.6/thm-3
- id: 7.6.4
  title: Matrices over a semiring
  plain_words: The squaring trick never uses subtraction or division, only the facts that grouping does
    not matter and that the product spreads over the sum. These facts also hold when "sum" means "smaller
    of two" and "product" means "plus". So the same power gives the cheapest walk with exactly $L$ edges,
    the most valuable one, or just whether one exists.
  code: 7.6/thm-4
cards:
- id: linear-recurrence
  name: A recurrence with fixed coefficients and a huge index
  from_theorem: 7.6.1
  decisive_property: The value at step n is a fixed linear combination of the k values before it (the
    same coefficients at every step, k small), the starting values are known, and the answer is asked
    modulo a number for an index n far too large for a loop.
  how_to_test: 'Write the rule for the next term. Check that the coefficients do not depend on n and that
    the order k is a small constant (at most about 100). Check the size: if n is at most about 10^7, a
    loop is enough. If the rule multiplies earlier terms instead of adding them, take logarithms of the
    exponents (the template for products). Build the companion matrix and test it by the first terms against
    the loop.'
  constraint_shapes:
  - 'n = 10^18 and order k = 6: 6^3 · 60 · 2 ≈ 26 000 operations, against 10^18 steps of a loop'
  - 'n = 10^18 and order k = 100: 100^3 · 60 · 2 = 1.2·10^8 operations, still fine; against 10^18 steps'
  weak_signals:
  - form: Asks for the n-th term (or the count of ways for a total n) modulo 10^9 + 7
    shape: n up to 10^18, a rule that looks at the last few terms
  - form: Asks for the number of arrangements of a length n built from pieces of a few sizes
    shape: n up to 10^18, pieces of at most 100 sizes
  - form: Asks for the n-th term of a sequence whose terms are counted by splitting on the last element
    shape: n up to 10^9 or 10^18, modulo a prime
  kill_signals:
  - 'A coefficient depends on n: the derangements D_n = (n − 1)(D_(n−1) + D_(n−2)) have a different matrix
    at each step, so the power does not exist (D_10 = 1 334 961 exactly, but the matrix with the constant
    9 gives 765 865 530 modulo 10^9 + 7)'
  - 'n is small: for n = 45 (climbing stairs) a loop of 45 steps is the answer and a matrix only adds
    code'
  in_action:
    statement: A frog jumps 1, 2 or 4 steps at a time. Count the sequences of jumps that bring it from
      step 0 exactly to step n, modulo 10^9 + 7.
    constraints: n ≤ 10^18.
    budget: A loop over the steps takes 10^18 steps. The rule has three terms of the past, so we want
      about 60 squarings of a 4 × 4 matrix.
    candidates:
    - tool: A DP over the steps (topic 3.2)
      verdict: rejected
      because: It is the right rule, but n steps are far too many.
    - tool: A closed formula by counting (topic 2.3)
      verdict: rejected
      because: The jumps of three sizes in any order give a sum with too many terms.
    - tool: The companion matrix and its power (this topic)
      verdict: chosen
      because: f(n) = f(n − 1) + f(n − 2) + f(n − 4) has constant coefficients and order 4 (Theorem 7.6.1).
    property_check: The coefficients are the constants 1, 1, 0, 1; the order is 4; the starting values
      f(0..3) = 1, 1, 2, 3 are known. The property holds.
    decision: 'Raise the 4 × 4 companion matrix to the power n: O(4^3 log n).'
  examples:
    positive:
    - inline:
        input: x_0 = 0, x_1 = 1, x_n = x_(n−1) + x_(n−2). What is x_100 modulo 1000000007?
        answer: '687995182'
        why: Order 2, constant coefficients; the power of the 2 × 2 companion matrix gives x_100 in 7
          squarings (Theorem 7.6.1). A loop of 100 steps agrees.
    - inline:
        input: x_0 = 1, x_1 = 1, x_n = 2 x_(n−1) + 3 x_(n−2). What is x_30 modulo 1000?
        answer: '325'
        why: Constants 2 and 3 as the first row of the companion matrix; the coefficients are not 1 but
          they are constant, so the same power works.
    - worked_example: cses-1096
      why: 'The number of ways to reach the sum n with a die is a sum of the six values before it: order
        6, constant coefficients, n up to 10^18.'
    negative:
    - inline:
        input: D_0 = 1, D_1 = 0, D_n = (n − 1)(D_(n−1) + D_(n−2)) (the derangements). What is D_10 modulo
          1000000007?
        answer: '1334961'
        method_gives: '765865530'
        why: The coefficient n − 1 changes at every step, so no single matrix does the step. Using the
          constant 9 (its value at n = 10) in a matrix power gives a wrong number. A loop over n is the
          tool when n is up to 10^6.
      correct_tool:
        topic: '3.2'
        card: linear-state
    - problem: lc-climbing-stairs
      why: 'The recurrence is Fibonacci, but n is at most 45: a loop of 45 steps is the whole solution,
        and a matrix power is more code for no gain.'
      correct_tool:
        topic: '3.2'
        card: linear-state
  lookalikes:
  - description: The same recurrence with n up to 10^6 or less
    tool:
      topic: '3.2'
      card: linear-state
    flipping_difference: When n is small, the loop over the terms is the solution (n·k steps); the matrix
      is needed only when n is too large for it.
  - description: A count of walks in a graph or automaton with a few states
    tool:
      topic: '7.6'
      card: walk-counting
    flipping_difference: A recurrence has the shape of a shifting window; a walk count has a general table
      of transitions. The method is the same, the matrix is read from different data.
  complexity: O(k^3 log n) time and O(k^2) memory.
- id: walk-counting
  name: Walks counted by a transition matrix
  from_theorem: 7.6.2
  decisive_property: The process has a small number of states (at most about 100), the allowed transitions
    between states are the same at every step, and the question asks for the number of ways to make exactly
    L steps (L huge), modulo a number. Repeated states are allowed.
  how_to_test: 'List the states and write the transitions as a matrix. Check that nothing else is remembered
    (otherwise add it to the state) and that the transitions do not change with the step number (otherwise
    use one power per stretch of equal transitions). Check that vertices may repeat: the count is of walks,
    not of paths. Count the states: n^3 log L must be below 10^9.'
  constraint_shapes:
  - 'n = 100 states and L = 10^9 steps: 100^3 · 30 · 2 = 6·10^7 operations, against L·m = 10^13 for a
    DP over the steps'
  - '3 states and L = 10^18: 3^3 · 60 · 2 ≈ 3 200 operations'
  weak_signals:
  - form: Asks for the number of walks of exactly k edges between two vertices of a small graph, modulo
      a prime
    shape: n up to 100 vertices, k up to 10^9 or 10^18
  - form: Asks for the number of strings of length L over a small alphabet that avoid a pattern or follow
      a rule on neighbours
    shape: L up to 10^18, a rule that looks at the last one or two letters
  - form: Asks how a process with a few states moves after L steps, each state going to others by fixed
      rules
    shape: L up to 10^9, at most 100 states
  kill_signals:
  - 'The count must not repeat a vertex: in the complete graph on 4 vertices there are 2 paths of 3 edges
    from 0 to 1 that do not repeat a vertex, but 7 walks (the matrix power gives 7); use a bitmask DP'
  - 'The transitions change with the step number in a way that cannot be split into a few stretches: there
    is no single matrix'
  in_action:
    statement: Count the strings of length L over the letters a, b, c that do not contain "ab" as two
      adjacent letters, modulo 10^9 + 7.
    constraints: L ≤ 10^18.
    budget: Counting string by string is 3^L. A DP over (position, last letter) takes 3L steps, too many
      for 10^18.
    candidates:
    - tool: A DP over (position, last letter) (topic 3.2)
      verdict: rejected
      because: L steps are far too many.
    - tool: Counting by inclusion–exclusion (topic 2.3)
      verdict: rejected
      because: The forbidden pair can occur at any of L − 1 places, overlapping with itself; the terms
        are not countable by a short formula.
    - tool: The power of the transition matrix of the last letter (this topic)
      verdict: chosen
      because: Three states (the last letter), the same transitions at every step, and walks may repeat
        states (Theorem 7.6.2).
    property_check: The state is the last letter, the allowed transitions are fixed (everything except
      a → b), and nothing else is remembered. The property holds.
    decision: 'A 3 × 3 matrix with 1 for each allowed pair; the count is the sum of the entries of the
      row of a virtual start state after L steps: O(3^3 log L).'
  examples:
    positive:
    - inline:
        input: A directed graph with the edges 0 → 1, 1 → 2, 2 → 0, 0 → 2. How many walks with exactly
          5 edges go from vertex 0 to vertex 2?
        answer: '2'
        why: 'The entry (0, 2) of the fifth power of the adjacency matrix (Theorem 7.6.2): the walks are
          0,1,2,0,1,2 and 0,2,0,2,0,2.'
    - inline:
        input: How many binary strings of length 6 have no two adjacent 1s?
        answer: '21'
        why: Two states (the last bit); the transitions 0 → 0, 0 → 1, 1 → 0 give a matrix whose sixth
          power has the row sum 21 (the Fibonacci number).
    - worked_example: cses-1723
      why: Counting walks with exactly k edges in a graph of at most 100 nodes with k up to 10^9.
    negative:
    - inline:
        input: The complete graph on the vertices 0, 1, 2, 3. How many paths with 3 edges go from vertex
          0 to vertex 1 without visiting a vertex twice?
        answer: '2'
        method_gives: '7'
        why: 'The paths are 0,2,3,1 and 0,3,2,1. The cube of the adjacency matrix counts walks, which
          may return to a vertex (0,1,0,1 and 0,2,0,1 and 0,3,0,1 among them): 7 of them.'
      correct_tool:
        topic: '3.7'
        card: path-mask
    - problem: lc-unique-paths
      why: 'Asks for the number of monotone paths in a grid up to 100 × 100: a binomial coefficient, since
        every path has the same number of right and down steps; a walk matrix over 10 000 cells would
        be far too large.'
      correct_tool:
        topic: '2.3'
        card: bijection-paths
  lookalikes:
  - description: Paths that do not repeat a vertex
    tool:
      topic: '3.7'
      card: path-mask
    flipping_difference: The matrix power counts walks that may repeat vertices; a path needs the set
      of used vertices in the state.
  - description: A linear recurrence of a small order
    tool:
      topic: '7.6'
      card: linear-recurrence
    flipping_difference: The companion matrix is a special transition matrix; the recurrence view is simpler
      when the rule is a sum of the last k terms.
  complexity: O(n^3 log L) time and O(n^2) memory for n states.
- id: augmented-matrix
  name: A recurrence with a constant, an index or a running sum
  from_theorem: 7.6.3
  decisive_property: The rule is linear except for a constant, a polynomial in the index n, or a sum of
    earlier terms, and each of these extras follows a linear rule itself, so it can be one more coordinate
    of the state vector.
  how_to_test: Write the rule. For every term that is not one of the earlier terms times a constant, decide
    whether it is a constant (add the coordinate 1), a polynomial in n (add n, n^2, … with their updates),
    or a sum of earlier terms (add the sum). Terms that are not polynomial in n (n mod 3, the number of
    divisors of n) cannot be added. Check the matrix on the first terms against the loop.
  constraint_shapes:
  - 'n = 10^18 and a recurrence of order 2 with a constant and the index n (4 coordinates): 4^3 · 60 ·
    2 ≈ 8 000 operations'
  - 'a prefix sum of a recurrence of order 100 up to 10^9: a 101 × 101 matrix, 10^6 · 30 · 2 = 6·10^7
    operations'
  weak_signals:
  - form: Asks for the sum of the first n terms of a sequence given by a recurrence, modulo a prime
    shape: n up to 10^18, an order of at most 100
  - form: Asks for a recurrence that has an extra additive term such as + 5, + n, or + 2^n
    shape: n up to 10^18
  - form: Asks to build a very long number or sequence by appending blocks whose size or value grows by
      a fixed step
    shape: a length up to 10^18, the number of digits of a term between 1 and 18
  kill_signals:
  - 'The extra term is not a polynomial in n: for x_n = x_(n−1) + (n mod 3) and x_0 = 0 we get x_6 = 6,
    but treating (n mod 3) as n gives x_6 = 21'
  - 'The coefficient of an earlier term depends on n: for x_n = n·x_(n−1) the true x_5 = 120, while a
    matrix with the constant 5 gives 3125'
  in_action:
    statement: x_0 = 0 and x_n = 3 x_(n−1) + n + 2 for n ≥ 1. Print x_n modulo 10^9 + 7.
    constraints: n ≤ 10^18.
    budget: 'A loop takes n steps. The term n + 2 is linear in n, so the state (x, n, 1) has 3 coordinates:
      3^3 · 60 · 2 ≈ 3 200 operations.'
    candidates:
    - tool: A loop over the terms (topic 3.2)
      verdict: rejected
      because: n steps are too many.
    - tool: The companion matrix of x_n = 3 x_(n−1) alone (this topic, Theorem 7.6.1)
      verdict: rejected
      because: The extra term n + 2 is not a multiple of an earlier term.
    - tool: The matrix on (x_n, n, 1) (this topic, Theorem 7.6.3)
      verdict: chosen
      because: The index n has the update n + 1 and the constant has the update 1 → 1, both linear.
    property_check: 'Every extra term is a polynomial in n (degree 1) or a constant: coordinates n and
      1 do the job. The property holds.'
    decision: x_(n+1) = 3 x_n + (n + 1) + 2 = 3 x_n + n + 3; the matrix has the rows (3, 1, 3), (0, 1,
      1), (0, 0, 1) on (x_n, n, 1).
  examples:
    positive:
    - inline:
        input: x_0 = 1, x_n = 2 x_(n−1) + 3. What is x_30 modulo 1000?
        answer: '293'
        why: The vector (x_n, 1) with the matrix [[2, 3], [0, 1]] (Theorem 7.6.3 (a)); its 30th power
          applied to (1, 1) gives x_30.
    - inline:
        input: What is F_0 + F_1 + … + F_49 modulo 1000 (Fibonacci numbers)?
        answer: '73'
        why: The coordinates (S_n, F_(n+1), F_n) with the sum as an extra coordinate (Theorem 7.6.3 (b));
          the 50th power of the 3 × 3 matrix gives S_50.
    negative:
    - inline:
        input: x_0 = 0, x_n = x_(n−1) + (n mod 3). What is x_6?
        answer: '6'
        method_gives: '21'
        why: The matrix for x_n = x_(n−1) + n gives 1 + 2 + … + 6 = 21. But n mod 3 is not a polynomial
          in n; it has the period 3 (every 3 steps the sum grows by 3), so the closed form with the remainders
          mod 3 is the tool.
      correct_tool:
        topic: '0.4'
        card: mod-arithmetic-basic
    - inline:
        input: x_0 = 1, x_n = n · x_(n−1). What is x_5?
        answer: '120'
        method_gives: '3125'
        why: The coefficient n changes at every step; a matrix with the constant 5 would give 5^5 = 3125.
          A loop over n is the tool for n up to 10^6.
      correct_tool:
        topic: '3.2'
        card: linear-state
  lookalikes:
  - description: A plain recurrence with no extra terms
    tool:
      topic: '7.6'
      card: linear-recurrence
    flipping_difference: Without a constant, an index or a sum, the companion matrix alone does the job;
      each extra coordinate makes the matrix one size larger.
  - description: A prefix sum of a fixed array (no recurrence)
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: A sum over a given array is one subtraction of two prefix sums; a sum over a
      recurrence with a huge index needs the extra coordinate.
  complexity: O((k + e)^3 log n) time for a recurrence of order k and e extra coordinates.
- id: min-plus
  name: 'Best walk with exactly L edges: matrix power over (min, +)'
  from_theorem: 7.6.4
  decisive_property: The value to optimise is a sum of weights along a walk with exactly L edges (L huge),
    the graph or the state set is small (at most about 100 states), the transitions never change, and
    the best value is the minimum (or the maximum) of such sums. The product of values distributes over
    the minimum, so the power trick applies.
  how_to_test: 'Write the weight of a step between two states (infinity if not allowed) and check that
    the value of a walk is the sum of the step weights. Check that the number of steps is fixed: for "at
    most L" add a loop of weight 0 at the end state. For a yes/no question use (or, and). Choose infinity
    larger than any real answer but small enough that infinity plus a weight does not overflow. Test on
    the first steps against a DP by layers.'
  constraint_shapes:
  - 'n = 100 states and L = 10^9: 100^3 · 30 · 2 = 6·10^7 operations, against L·m = 10^13 for a DP by
    layers'
  - 'n = 20 states and L = 10^12: 20^3 · 40 · 2 = 6.4·10^5 operations'
  weak_signals:
  - form: Asks for the cheapest (or best) walk with exactly k edges in a small weighted graph, k huge
    shape: n up to 100, k up to 10^9
  - form: Asks for the best value of a process repeated T times, where one pass is a small table of best
      gains from one state to another
    shape: a pass over an array of 100 elements, T up to 10^7
  - form: Asks whether a state is reachable after exactly L steps of a fixed rule
    shape: n up to 64 states, L up to 10^18
  kill_signals:
  - 'The number of edges is not fixed: the cheapest walk from 0 to 3 in the tiny instance of Theorem 7.6.4
    has weight 4 (three edges), but the power with exactly 2 edges gives 6; Dijkstra is the tool'
  - 'The weights multiply and may be negative (min, ×): × does not distribute over min for negative numbers,
    so the power may give a wrong answer'
  in_action:
    statement: A robot moves between 20 rooms. Moving from room i to room j (if a corridor exists) gives
      a score s[i][j] (possibly negative). Find the largest total score of exactly T moves starting in
      room 0.
    constraints: T ≤ 10^12.
    budget: A DP by layers takes T · (number of corridors) steps, far too many. With 20 states, 20^3 ·
      40 · 2 = 6.4·10^5 operations.
    candidates:
    - tool: A DP by layers (topic 3.2)
      verdict: rejected
      because: T steps are far too many.
    - tool: Bellman–Ford (topic 4.3)
      verdict: rejected
      because: It finds the best walk with any number of edges, and the number of moves is fixed.
    - tool: The power of the score matrix over (max, +) (this topic)
      verdict: chosen
      because: The value of a walk is the sum of the scores, the number of moves is exactly T, the transitions
        are fixed (Theorem 7.6.4).
    property_check: The value is a sum along the walk; the optimum is a maximum; + distributes over max;
      exactly T moves. The property holds.
    decision: Raise the 20 × 20 score matrix to the power T in the (max, +) semiring (the identity has
      0 on the diagonal and minus infinity elsewhere); the answer is the largest entry in the row of room
      0.
  examples:
    positive:
    - inline:
        input: A graph with the edges 0 → 1 (weight 4), 0 → 2 (1), 2 → 1 (1), 1 → 3 (2), 2 → 3 (6). What
          is the least weight of a walk with exactly 3 edges from 0 to 3?
        answer: '4'
        why: The only walk with 3 edges is 0, 2, 1, 3 with weight 1 + 1 + 2 = 4; the entry (0, 3) of the
          cube of the weight matrix over (min, +) (Theorem 7.6.4).
    - inline:
        input: The array [3, 1, 2] is written 3 times in a row. What is the length of the longest non-decreasing
          subsequence of the long array?
        answer: '4'
        why: The state is the last value and one copy of the array is a matrix over (max, +); the cube
          of it gives 4, for example 1, 2, 3, 3.
    - worked_example: cses-1724
      why: The cheapest walk with exactly k edges in a graph of at most 100 nodes with k up to 10^9.
    negative:
    - inline:
        input: The graph of the tiny instance of Theorem 7.6.4. What is the least weight of a walk from
          0 to 3 with any number of edges (at most 3 here)?
        answer: '4'
        method_gives: '6'
        why: The power with exactly 2 edges gives 6, but the cheapest walk uses 3 edges and weighs 4.
          When the number of edges is free, a shortest-path algorithm is the tool.
      correct_tool:
        topic: '4.3'
        card: dijkstra
    - problem: lc-network-delay-time
      why: 'Asks for the time for a signal to reach all nodes: the shortest paths with any number of edges
        from one source, found by Dijkstra, not walks with a fixed length.'
      correct_tool:
        topic: '4.3'
        card: dijkstra
  lookalikes:
  - description: Shortest paths with any number of edges
    tool:
      topic: '4.3'
      card: dijkstra
    flipping_difference: A fixed number of edges is a matrix power; a free number of edges is Dijkstra
      or Bellman–Ford.
  - description: Counting the walks (sum and product, not minimum)
    tool:
      topic: '7.6'
      card: walk-counting
    flipping_difference: 'The same power, but over the ordinary numbers: the count of walks, not the best
      weight.'
  complexity: O(n^3 log L) time and O(n^2) memory for n states.
problems:
- id: cses-1096
  role: worked_example
  summary: Count the ways to get the sum n by throwing a die (1 to 6) any number of times, the order of
    the throws mattering, modulo 10^9 + 7; n ≤ 10^18.
- id: cses-1723
  role: worked_example
  summary: A directed graph of n ≤ 100 nodes; count the walks with exactly k edges (k ≤ 10^9) from node
    1 to node n, nodes may repeat, modulo 10^9 + 7.
- id: cses-1724
  role: worked_example
  summary: A directed weighted graph of n ≤ 100 nodes with weights up to 10^9; the least total weight
    of a walk with exactly k edges (k ≤ 10^9) from node 1 to node n, or -1.
- id: lc-n-th-tribonacci-number
  role: ladder
  card: linear-recurrence
  rung: 1
  twist: 'Base case of the card: the companion matrix of a three-term recurrence.'
  summary: T(0) = 0, T(1) = T(2) = 1 and T(n + 3) = T(n) + T(n + 1) + T(n + 2); return T(n) for n ≤ 37
    (here imagine n up to 10^18, modulo 10^9 + 7).
  hints:
  - Write the rule for the next term. How many earlier terms does it use, and do the coefficients change
    with n?
  - 'Three earlier terms with the coefficients 1, 1, 1: the vector (T(n+2), T(n+1), T(n)) is multiplied
    by the same 3 × 3 matrix at each step (Theorem 7.6.1).'
  - The matrix has the first row (1, 1, 1) and 1 just below the diagonal; T(n) is the last entry of its
    n-th power applied to (1, 1, 0). For n ≤ 37 a loop is enough, and the matrix power is the version
    that works for n = 10^18.
- id: cf-1117D
  role: ladder
  card: linear-recurrence
  rung: 2
  twist: 'The order of the recurrence is a parameter: the matrix has size up to 100 and only two non-zero
    coefficients.'
  summary: A magic gem takes 1 unit of space and can be split into M normal gems taking M units in all;
    count the configurations that fill exactly N units, modulo 10^9 + 7; N ≤ 10^18, M ≤ 100. †
  hints:
  - Fix the last gem placed (or the last unit of space). Is it a magic gem kept whole, or a split gem?
  - 'f(n) = f(n − 1) + f(n − M), with f(0) = 1: the last unit is a magic gem, or the last M units are
    a split gem.'
  - 'This has order M with the coefficients 1 for f(n − 1) and 1 for f(n − M): an M × M companion matrix,
    raised to the power N. About 100^3 · 60 · 2 = 1.2·10^8 steps.'
- id: cf-551D
  role: ladder
  card: linear-recurrence
  rung: 3
  twist: 'The recurrence is hidden: the bits are independent, and each bit counts the arrays with no two
    adjacent ones.'
  summary: Count the arrays a of n numbers below 2^l such that (a_1 and a_2) or (a_2 and a_3) or … or
    (a_(n−1) and a_n) equals k, modulo m (any m); n ≤ 10^18, l ≤ 64. †
  hints:
  - Look at one bit of all the numbers at a time. What does the condition say for a bit of k that is 0,
    and for a bit of k that is 1?
  - 'For a bit of k that is 0, no two neighbours may both have the bit: the binary strings of length n
    without two adjacent ones, whose number is the Fibonacci number F(n + 2). For a bit of k that is 1,
    the complement: 2^n − F(n + 2).'
  - 'Multiply over the l bits (the bits are independent); if k has a bit at l or above, the answer is
    0. F(n + 2) comes from the Fibonacci matrix power, modulo m (m need not be prime: nothing is divided).'
- id: cf-718C
  role: ladder
  card: linear-recurrence
  rung: 4
  twist: 'The matrix is a lazy tag: a segment tree adds the same power to a range, and the sum of Fibonacci
    numbers is a vector.'
  summary: 'An array of n ≤ 10^5 numbers and q ≤ 10^5 queries: add x to every element of a range, or print
    the sum of F(a_i) over a range modulo 10^9 + 7. †'
  hints:
  - F(a + x) is a linear combination of F(a) and F(a − 1) for fixed x. Which matrix does it?
  - The vector (F(a), F(a − 1)) is multiplied by the matrix C^x. A sum of such vectors is multiplied by
    the same matrix.
  - A segment tree (topic 5.3) stores in each node the sum of the vectors, and a lazy tag holding a matrix
    product; adding x to a range multiplies the tag by C^x (computed by repeated squaring). Each query
    costs O(log n) products of 2 × 2 matrices.
- id: ac-dp_r
  role: ladder
  card: walk-counting
  rung: 1
  twist: 'Base case of the card: the adjacency matrix to the power K counts the walks.'
  summary: A directed graph of N ≤ 50 vertices given by its adjacency matrix and a number K ≤ 10^18; count
    the walks with exactly K edges (any start, any end), modulo 10^9 + 7.
  hints:
  - A walk with K + 1 edges is a walk with K edges and one more edge. How can the counts be combined?
  - Let w[v] be the number of walks of the current length that end at v. One step maps w to A^T w, the
    same matrix at every step (Theorem 7.6.2).
  - The answer is the sum of all entries of A^K (the sum over all starts and all ends). 50^3 · 60 · 2
    = 1.5·10^7 steps.
- id: cf-222E
  role: ladder
  card: walk-counting
  rung: 2
  twist: The states are letters and the forbidden pairs are the missing transitions.
  summary: Count the strings of length n ≤ 10^18 over an alphabet of m ≤ 52 letters in which k given ordered
