drill:
- problem: cf-1698D
  answer:
    topic: '1.8'
    card: halving
  property: 'The reply for the prefix 1 to m is odd exactly when m is at least the position of the fixed point, so it is monotone in m: halving finds the position in $\lceil \log_2 n \rceil$ questions.'
  why_others_fail: 'Asking about every position needs n questions against a limit of 15; the questions do not return values to compare, so there is no local rule either.'
- problem: cf-1407C
  answer:
    topic: '1.8'
    card: equation-queries
  property: 'Asking a pair in both orders gives the smaller of the two numbers as the larger reply, so every pair settles one number; n - 1 pairs, 2n - 2 questions.'
  why_others_fail: 'Halving needs a reply that says on which side of a probe a value lies; a remainder says nothing about sides.'
- problem: ac-abc355_e
  answer:
    topic: '1.8'
    card: equation-queries
  property: 'Only aligned blocks can be asked, the range is cut into the fewest of them by taking from the left the largest block that fits (its size is read from the lowest set bit of the position), and the answer is the sum of the replies.'
  why_others_fail: 'Asking every cell takes R - L + 1 questions, far above the least possible number; there is no threshold to halve on.'
- problem: ac-abc466_c
  answer:
    topic: '1.3'
    card: count-windows
  property: 'The close points of a point are the next few, and the last close point never moves back as the point moves right, so a pointer that only moves right needs at most 2N questions in all.'
  why_others_fail: 'Halving for each point costs N log N questions, above the limit of 2N.'
- problem: lc-find-positive-integer-solution-for-a-given-equation
  answer:
    topic: '1.3'
    card: opposite-ends
  property: 'f increases in both arguments, so from x = 1 and y = 1000 a value below z moves x up and a value above z moves y down; each call moves one pointer, so at most 2000 calls.'
  why_others_fail: 'A binary search on y for each x costs 1000 times 10 calls; there is no judge budget to halve against.'
- problem: lc-sort-the-jumbled-numbers
  answer:
    topic: '1.1'
    card: custom-order
  property: 'Replace each number by its mapped value and sort the pairs by the mapped value, keeping the original position for equal values.'
  why_others_fail: 'There are no questions at all: nothing is hidden and nothing is counted.'
- problem: lc-minimum-numbers-of-function-calls-to-make-target-array
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: 'The number of doubling steps is the highest set bit over all the numbers and the number of add-one steps is the total number of set bits.'
  why_others_fail: 'The target is given, so nothing is hidden; counting bits is enough.'
- problem: ac-abc341_b
  answer:
    topic: '0.1'
    card: overflow-64bit
  property: 'The amounts grow along the chain of trades and can pass $2^{31}$, so every variable that holds an amount must be a 64-bit integer.'
  why_others_fail: 'The numbers are given in the input and no question is asked of a judge.'
lookalike_pairs:
- a: cf-727C
  b: cf-1167B
  a_tool:
    topic: '1.8'
    card: equation-queries
  b_tool:
    topic: '0.5'
    card: permutations
  shared_surface: 'Both ask you to find hidden numbers with a few questions whose replies are the sum or the product of two chosen hidden numbers.'
  flipping_difference: 'In the first the numbers are arbitrary, so every reply is an equation to solve (Theorem 1.8.3) and about n questions are needed. In the second the six numbers come from the fixed set 4, 8, 15, 16, 23, 42, so after four product replies only one of 720 orders fits, and a check of all of them is cheap.'
  flipping_input: 'Three arbitrary numbers with the sums 8, 7 and 9: the formula gives $a_1 = (8 + 7 - 9)/2 = 3$, and no list of candidates exists to search. Six known numbers with the products 32, 120, 240 and 368: only the order 4, 8, 15, 16, 23, 42 gives all four products.'
- a: lc-find-in-mountain-array
  b: lc-peak-index-in-a-mountain-array
  a_tool:
    topic: '1.8'
    card: compare-halving
  b_tool:
    topic: '1.4'
    card: sorted-search
  shared_surface: 'Both give a mountain array (numbers that rise and then fall) and ask for the peak or for a value in it.'
  flipping_difference: 'In Find in Mountain Array the array can only be read through get(), at most 100 calls for up to $10^4$ numbers, so a scan is rejected and every read counts. In Peak Index in a Mountain Array the array is in the input, reads are free and a scan of $10^5$ numbers is fast enough.'
  flipping_input: 'A mountain array of $10^4$ numbers: a scan uses up to $10^4$ calls of get() and fails the limit of 100, while the search for the peak uses 2 calls per round and 14 rounds, which is 28.'
self_test:
- q: 'A judge holds a number between 1 and 1000 and answers "is $x \le m$?". What is the smallest number of questions that always works, and why can no smaller number work?'
  a: '10. $2^{10} = 1024 \ge 1000$, while $2^9 = 512 < 1000$: nine yes or no questions give at most 512 different reply sequences, fewer than 1000 numbers, so two numbers would get the same replies and the strategy could not tell them apart (Theorem 1.8.1).'
- q: 'Halving finds the number 37 between 1 and 100. Write the first three questions and their replies.'
  a: 'lo = 0 and hi = 100. The middle is 50: "is $x \le 50$?" yes, so hi = 50. The middle is 25: "is $x \le 25$?" no, so lo = 25. The middle is 37: "is $x \le 37$?" yes, so hi = 37.'
- q: 'Give an array of 5 different numbers for which the local minimum search returns a position that does not hold the smallest number.'
  a: '1 3 2 4 0. The search compares positions 3 and 4 first (2 and 4, so it keeps the left part), then positions 2 and 3 (3 and 2, so it moves to position 3) and returns position 3, the number 2. The smallest number 0 is at position 5.'
- q: 'The replies to "? 1 2", "? 1 3" and "? 2 3" are 7, 9 and 10. Find $a_1$, $a_2$ and $a_3$.'
  a: '$a_1 = (7 + 9 - 10)/2 = 3$, so $a_2 = 7 - 3 = 4$ and $a_3 = 9 - 3 = 6$. Check: $a_2 + a_3 = 10$.'
- q: 'An adaptive judge answers "is $x \le m$?" about the numbers 1 to 5 and the first question is $m = 2$. What does it answer, and which numbers are left? Ties go to no.'
  a: 'The numbers that agree with yes are 1 and 2 (two of them) and those that agree with no are 3, 4 and 5 (three), so the larger group is no. It answers no, and the numbers 3, 4, 5 are left.'
- q: 'Why can a program that does not flush after each question still work, and why does it fail once the two fast input lines of topic 0.1 are added?'
  a: 'By default the input stream is tied to the output stream, so a read first flushes the output and the question is sent before the program waits. The two fast input lines remove that tie, so the question stays in the buffer, the judge never sees it, and the program waits forever: "Idleness limit exceeded". Ending each question with endl, which flushes, is always safe.'
- q: 'The limit is 12 questions and $n = 10^5$. Can any strategy find the hidden number with yes or no questions?'
  a: 'No. $2^{12} = 4096 < 10^5$, so 12 yes or no replies give fewer than $10^5$ different sequences (Theorem 1.8.1).'
