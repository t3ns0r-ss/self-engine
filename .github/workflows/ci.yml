# PLAN.md Sections 14.1 and 14.3. Checks every push and pull request; deploys only when enabled.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6          # the design script tests build Go and C++23 fixtures
        with:
          go-version-file: code/go.mod
      - name: GCC 16
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 160
      - run: npm ci
      - name: Chromium for build-time Mermaid diagrams (D10)
        run: npx playwright install --with-deps chromium
      - name: Validator unit tests
        run: npm test
      - name: Build (validates data and checks problem-bank/ is up to date)
        run: npm run build

  # DESIGN_TRACKS_PLAN.md Sections 9 and 14 (D0): Go labs with -race, C++ units with sanitizers, exercise kits,
  # experiment quick modes. Integration tests (Docker stacks) do not run here: they run on the LAN lab server (Section 9.13).
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: code/go.mod
      - name: GCC 16 (C++23)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 160
          g++ --version
      - name: Go module is tidy
        run: cd code && go mod tidy -diff
      - name: Design code units (Go with -race, C++ with sanitizers, claim, calc and pattern units)
        run: bash scripts/test_design.sh code
      - name: Experiment quick modes
        run: cd code && go test -tags experiment -run Quick ./...
      - name: Exercise kits (tests fail on starter and mutants, pass on reference)
        run: |
          if [ -d exercises ]; then bash scripts/exercise_kit_check.sh; else echo "no exercises yet"; fi

  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Component and page tests on the placeholder topic
        run: bash tests/e2e.sh
      - name: Design component tests on the LLD and HLD placeholder topics (desktop and 375 px)
        run: bash tests/e2e-design.sh

  # Optional deploy-on-merge (PLAN.md Section 14.3). Off by default: set the repository variable
  # DEPLOY_ENABLED to "true" and the secrets DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PATH, SITE_URL.
  deploy:
    runs-on: ubuntu-latest
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium for build-time Mermaid diagrams (D10)
        run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Upload with rsync over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host="${DEPLOY_HOST#*@}"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$DEPLOY_HOST:$DEPLOY_PATH/"
