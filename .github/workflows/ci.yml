# PLAN.md Sections 14.1 and 14.3. Checks every push and pull request; deploys only when enabled.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lesson code units (compile, fixed tests, 5000-case stress tests)
        run: bash scripts/test_units.sh code
      - name: Validator unit tests
        run: npm test
      - name: Build (validates data and checks problem-bank/ is up to date)
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Component and page tests on the placeholder topic
        run: bash tests/e2e.sh

  # Optional deploy-on-merge (PLAN.md Section 14.3). Off by default: set the repository variable
  # DEPLOY_ENABLED to "true" and the secrets DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PATH, SITE_URL.
  deploy:
    runs-on: ubuntu-latest
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/test_units.sh code
      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Upload with rsync over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host="${DEPLOY_HOST#*@}"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$DEPLOY_HOST:$DEPLOY_PATH/"
