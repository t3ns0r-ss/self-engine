# Topic 0.6 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.6"
draft: true
cards:
  - id: set-membership
    name: Distinctness and membership
    decisive_property: Only whether a value has occurred matters, not how often or where, so a set of the values seen so far answers each "seen before?" or "how many distinct?" in O(log n).
    from_theorem: Theorem 0.6.2
    how_to_test: Ask whether replacing the input by its set of distinct values keeps the answer. If counts or positions matter, it is a map instead.
    weak_signals:
      - '"How many different …", "is there a duplicate", "has this appeared before"'
      - Values up to 10^9 or strings, too large to index an array
      - n up to 2·10^5 with a question per element
    kill_signals:
      - The answer depends on how many times a value occurs or where (use a map)
    lookalikes:
      - description: Is there a repeated value within distance k?
        needs: "map-counting (0.6): the last position of each value"
        flipping_difference: "The distance between equal values matters, so the set must remember positions: a map from value to last index."
    complexity: O(n log n) with set, O(n) on average with unordered_set.
  - id: map-counting
    name: Counting by key
    decisive_property: The answer depends only on how many times each key occurs (or on a list or last position per key), so a map from key to count, filled in one pass, decides it; pairs with equal keys are counted from the counts read before each increment.
    from_theorem: Theorem 0.6.3
    how_to_test: Write the answer as a function of the per-key counts. If you need "how many earlier elements equal this one", read the count before incrementing.
    weak_signals:
      - '"How many times", "the most frequent", "pairs with equal …"'
      - Grouping items by a key (same letters, same remainder, same name)
      - Names or strings that are assigned numbers in order of appearance
    kill_signals:
      - The question needs the nearest key, not an exact key (use an ordered lookup)
    lookalikes:
      - description: Count pairs i < j with a_i = a_j versus pairs with a_i < a_j
        needs: sorting (1.1, a later topic) or an ordered structure
        flipping_difference: Equality is answered by counts per key; order comparisons between different keys are not.
    complexity: O(n log n) with map, O(n) on average with unordered_map.
  - id: ordered-set-lookup
    name: Nearest value in a changing set
    decisive_property: Each question asks for the smallest stored value ≥ x, the largest ≤ x, or the minimum or maximum, while values are inserted and erased between questions; a set or multiset answers each in O(log n).
    from_theorem: Theorem 0.6.4
    how_to_test: "Check that the collection changes between queries (otherwise a sorted array would do) and that each query is about order: nearest, smallest, largest."
    weak_signals:
      - '"The smallest … that is at least", "the closest", "the largest not exceeding"'
      - Insertions and deletions mixed with queries
      - Max − min of a changing collection
    kill_signals:
      - Only the overall largest is ever taken (a priority queue is simpler)
      - Nothing changes between queries (a sorted array and binary search, topic 1.4)
    lookalikes:
      - description: Always remove the overall largest element
        needs: heap-extract (0.6)
        flipping_difference: Without a bound x, only the extreme is needed, and a priority queue gives it directly.
    complexity: O(log n) per operation.
  - id: heap-extract
    name: Repeatedly take the extreme
    decisive_property: The process itself says to remove the largest (or smallest) element again and again, possibly inserting new ones; a priority queue does each step in O(log n).
    from_theorem: Theorem 0.6.5
    how_to_test: Check that every step needs only the current extreme element, never a value near some x or an element in the middle.
    weak_signals:
      - '"Each time, take the largest …", "repeat K times: halve the biggest"'
      - Merging or combining the two smallest items
      - The k-th largest of a growing collection
    kill_signals:
      - A step needs the largest element below a bound (ordered set)
      - Elements must be removed by value, not only from the top
    lookalikes:
      - description: Each customer takes the most expensive ticket within their budget
        needs: ordered-set-lookup (0.6)
        flipping_difference: The bound depends on the customer, so the overall largest is not enough; a multiset finds the largest ≤ budget.
    complexity: O(log n) per push or pop, O(1) for top.
  - id: stack-queue
    name: Stack and queue processes
    decisive_property: "The process only ever touches the most recent unfinished item (a stack: brackets, undo, merging with the last element) or the oldest waiting item (a queue: first come, first served), so each step is O(1)."
    from_theorem: Theorem 0.6.6
    how_to_test: "Ask which item each step looks at: if always the newest, use a stack; if always the oldest, a queue; if both ends, a deque."
    weak_signals:
      - Brackets, nested structures, "cancel the last …"
      - '"In order of arrival", "the person at the front"'
      - Combining the new element with the last one while a condition holds
    kill_signals:
      - A step needs an element from the middle or the largest overall
    lookalikes:
      - description: Serve the most valuable waiting item first
        needs: heap-extract (0.6)
        flipping_difference: Priority by value replaces arrival order, so a priority queue replaces the queue.
    complexity: O(1) per operation.
