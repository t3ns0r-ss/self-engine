# Patterns for topic 7.2 (Rerooting). Provisional until the lesson maps them to Recognition Cards.
topic: "7.2"
patterns:
  - id: rerooting
    name: An answer for every root, the change along an edge can be undone
    description: Compute a root-dependent value for every root in O(n) by moving the root across each edge; the value for the child is the parent's value with one part taken out and another put in.
    precondition: The answer for a child root is obtained from the parent's answer by removing and adding one child's contribution (a sum, a count, a size, a direction flip).
  - id: exclude-one
    name: Leaving one child out when the combination has no inverse
    description: Compute a root-dependent value for every root when the combination is a maximum, a minimum, a gcd, a product modulo any number or a pair of states; the part above a child needs the other children without it.
    precondition: The part above a child is the combination of the part above its parent and the other children, and that combination is read from prefix and suffix values or from the two best values.
  - id: direction
    name: Edges with a direction or a cost that depends on the direction
    description: The fewest reversals, or the least cost, for every root when each edge has a direction; moving the root across an edge flips the meaning of that one edge.
    precondition: Moving the root across an edge changes only the contribution of that edge, by an amount that depends on the way it points.
