# Topic 1.4 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.4'
uses:
- topic: '0.1'
  what: long long, and why lo + (hi − lo) / 2 avoids overflow
- topic: '0.2'
  what: The step budget, and O(log n) as a cost
- topic: '0.3'
  what: Case analysis and simulation, which several negative examples fall back to
- topic: '0.4'
  what: Remainders and divisibility, used by several ladder problems
- topic: '0.5'
  what: 'Brute force: the reference solutions in the tests, and the plain loops several negative examples
    fall back to'
- topic: '0.6'
  what: The priority queue and set, which this lesson compares binary search with
- topic: '1.1'
  what: 'Sorting: a binary search needs a sorted sequence'
- topic: '1.2'
  what: Prefix sums, which are sorted when the values are non-negative
- topic: '1.3'
  what: 'Two pointers: the forward walk and the corner walk that replace a search in some problems'
theorems:
- id: 1.4.1
  title: Binary search keeps a false position and a true position and halves the gap
  plain_words: When a yes/no question is false up to some point and true from there on, keep one position
    where it is false and one where it is true, and test the middle. Each test halves the gap between
    them, so about log n tests find the first true position.
  code: 1.4/thm-1
- id: 1.4.2
  title: A sorted array answers counting and nearest-value questions by one search
  plain_words: In a sorted array, "is a_i at least x" is false and then true, so its first true position,
    the lower bound, is found by binary search and equals the number of smaller elements. Counts in a
    range and the nearest value follow from two such searches.
  code: 1.4/thm-2
- id: 1.4.3
  title: A smallest working value is found by searching over the answer
  plain_words: If a larger value always works whenever a smaller one does, the smallest value that works
    can be found by binary search over the possible values, with a check that tests one value at a time.
  code: 1.4/thm-3
- id: 1.4.5
  title: Halving a real interval reaches any precision
  plain_words: 'The same halving works on real numbers: each step halves the length of the interval that
    holds the answer, so a fixed number of steps, such as 100, gives any precision a judge asks for.'
  code: 1.4/thm-5
- id: 1.4.6
  title: The k-th smallest is the first value that has at least k elements below it
  plain_words: To find the k-th smallest element of a huge collection, count how many elements are at
    most x, which is non-decreasing in x, and find by binary search the first x for which the count reaches
    k.
  code: 1.4/thm-6
cards:
- id: sorted-search
  name: Search a sorted sequence
  decisive_property: The sequence being searched is sorted (or is non-decreasing by construction, like
    prefix sums of non-negative values), so "a_i ≥ x" is false…false true…true and the first true index
    is found in O(log n); counts and nearest values follow from lower and upper bounds.
  from_theorem: 1.4.2
  how_to_test: Name the sequence and check it is non-decreasing, then write the question as "the first
    index where …" or as a difference of two bounds.
  constraint_shapes:
  - 'n and q both up to 2·10^5: scanning the array for each query is 4·10^10 steps, while one sort and
    q binary searches cost 3.6·10^6 + 2·10^5 · 18 steps; one search is at most ⌈log2(2·10^5)⌉ = 18 tests.'
  weak_signals:
  - form: Asks many independent queries such as how many are at most x, the closest value to x, or the
      first time a running total reaches t
    shape: n and q up to 2·10^5, with the array fixed
  - form: Gives a sorted array, or allows sorting because the question is order-free
    shape: Values up to 10^9 and a bound per query
  - form: Asks, for each element, to count partners in a sorted list that satisfy an inequality
    shape: A loop over elements with one search each, n log n in all
  kill_signals:
  - 'The sequence is not sorted: in 8 1 5 3 the first index with a_i ≥ 5 is 0, but a binary search that
    assumes the order finds index 2.'
  - 'The predicate is not monotone: for "x is a multiple of 3" on 1..8 the first true value is 3, but
    halving the range finds 6, since false and true alternate.'
  in_action:
    statement: A sorted array is fixed; for each query "L R" print how many elements lie in [L, R].
    constraints: n, q ≤ 2·10^5, values up to 10^9.
    budget: Counting by a scan is q · n = 4·10^10 steps. Each query as two binary searches is about 2
      · 18 steps, 7·10^6 in all.
    candidates:
    - tool: Scan the array for each query
      verdict: rejected
      because: 4·10^10 steps.
    - tool: Two lower-bound searches per query, upper(R) − lower(L) (this topic)
      verdict: chosen
      because: The array is sorted, so "a_i ≥ x" is monotone and the lower bound is the number of elements
        below x.
    property_check: In a sorted array, a_i ≥ x is false then true, so the lower bound is found with the
      invariant "a[lo] < x, a[hi] ≥ x" in at most 18 tests, and it equals the number of elements below
      x (Theorem 1.4.2). The elements in [L, R] are those at most R minus those below L.
    decision: Sort once; per query print firstAtLeast(R + 1) − firstAtLeast(L).
  examples:
    positive:
    - inline:
        input: The number of elements at most 5 in the sorted array 1 3 3 5 8
        answer: '4'
        why: The first index with a_i ≥ 6 is 4, which is the number of elements below 6, so 4 elements
          are at most 5.
    - worked_example: ac-abc143_d
      why: With the sticks sorted, for a fixed pair the third stick must be below the sum of the two,
        and the number of such sticks is a lower-bound search.
    negative:
    - inline:
        input: The first index with a_i ≥ 5 in the unsorted 8 1 5 3, found by binary search
        answer: '0'
        method_gives: '2'
        why: The predicate a_i ≥ 5 reads true, false, true, false, which is not false-then-true, so halving
          lands on the wrong side. A scan from the start finds index 0.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The first x in 1..8 with x % 3 == 0, found by binary search
        answer: '3'
        method_gives: '6'
        why: The predicate is false, false, true, false, false, true, false, false, so it is not monotone
          and the invariant breaks. Testing the values in order finds 3.
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
  lookalikes:
  - description: Search a matrix whose rows and columns are sorted but which is not one sorted list
    tool:
      topic: '1.3'
      card: opposite-ends
    flipping_difference: Without a single sorted order, no middle element splits the candidates in two;
      a corner walk that discards a row or a column per step works instead.
  complexity: O(log n) per query after an O(n log n) sort.
- id: answer-search
  name: Search on the answer
  decisive_property: The question asks for the smallest (or largest) x that works, and "x works" is monotone
    in x and can be checked much faster than the answer can be found directly, so binary search over x
    with the check finds it; for real answers, a fixed number of halvings reaches the required precision.
  from_theorem: 1.4.3
  how_to_test: Write the check ok(x); prove that ok(x) implies ok(x + 1) (or the reverse); find bounds
    L and R with the answer between them.
  constraint_shapes:
  - 'An answer up to 2·10^14 with a check of O(n) for n = 2·10^5: trying every value is 2·10^14 · 2·10^5
    steps, while binary search needs ⌈log2(2·10^14)⌉ = 48 checks, about 10^7 steps.'
  weak_signals:
  - form: Asks to minimise the maximum, or to maximise the minimum
    shape: A maximum part sum or a smallest gap, with answers up to 10^9 or 10^18
  - form: Asks for the least time, capacity or speed such that something is possible
    shape: A check that simulates or counts in O(n) for a given value
  - form: Asks to split an array into consecutive parts, or to place items with a minimum gap
    shape: A greedy pass decides whether a given limit is enough
  kill_signals:
  - 'The check is not monotone: "x divides 12" on x from 5 to 12 is true at 6 and 12 but false between,
    so halving finds 12 while the smallest is 6.'
  - 'The search range is too small: the smallest x with x² ≥ 10^18 is 10^9, and a range of 1..10^6 returns
    "none" (10^6 + 1).'
  in_action:
    statement: Split n positive numbers into at most k consecutive parts so that the largest part sum
      is as small as possible.
    constraints: n ≤ 2·10^5, values up to 10^9, k ≤ n.
    budget: Trying every cutting is C(n − 1, k − 1), astronomically many. Binary search over the answer
      needs about 48 checks of O(n), 10^7 steps.
    candidates:
    - tool: Try every way to place the cuts
      verdict: rejected
      because: The number of cuttings is exponential in n.
    - tool: Binary search on the largest allowed part sum, with a greedy check (this topic)
      verdict: chosen
      because: If parts with sums at most x suffice, parts with sums at most x + 1 do too, and a greedy
        pass counts the fewest parts.
    property_check: ok(x) = "the fewest parts with sums at most x is at most k" is monotone in x, because
      a cutting valid for x is valid for every larger x. The greedy pass (fill each part as much as possible)
      gives the fewest parts when values are non-negative (Lemma 1.4.4).
    decision: lo = 0 (false), hi = the total (true); halve; print hi.
  examples:
    positive:
    - inline:
        input: The smallest x with x · x ≥ 50
        answer: '8'
        why: The predicate x² ≥ 50 is false for x ≤ 7 and true from 8, so binary search over the answer
          finds 8 in about 7 tests.
    - worked_example: cses-1085
      why: Whether a limit x is enough is one greedy pass, and it is monotone in x, so the smallest working
        limit is found by halving over the possible sums.
    negative:
    - inline:
        input: The smallest x ≥ 5 that divides 12, searched by halving on 5..12
        answer: '6'
        method_gives: '12'
        why: 'Divisibility is not monotone in x: 6 divides 12, 7 to 11 do not, 12 does. The invariant
          "false then true" fails, and the search lands on 12.'
      correct_tool:
        topic: '0.5'
        card: enumerate-answer
    - inline:
        input: The smallest x with x · x ≥ 10^18, searched only in 1..10^6
        answer: '1000000000'
        method_gives: '1000001'
        why: The range does not contain the answer, so the search reports "none" (one past the top). The
          range must be wide enough, here up to 10^9 or 10^18.
      correct_tool:
        topic: '1.4'
        card: answer-search
  lookalikes:
  - description: The answer is one of a few candidates that can all be tried
    tool:
      topic: '0.5'
      card: enumerate-answer
    flipping_difference: When the candidates are few, trying them all is simpler than proving monotonicity.
  complexity: O(C log(range)) for a check of cost C.
- id: kth-by-counting
  name: k-th smallest by counting
  decisive_property: The question asks for the k-th smallest element of a huge implicit collection (all
    pair sums, a multiplication table, the numbers not in a list), and the number of elements ≤ x can
    be counted fast, so the k-th smallest is the first x with count(x) ≥ k.
  from_theorem: 1.4.6
  how_to_test: Write count(x) and its cost; check that listing the collection is too slow (k or the collection
    size is huge).
  constraint_shapes:
  - 'A table of 3·10^4 × 3·10^4 = 9·10^8 entries: listing them is 9·10^8 values (3.6 GB), while count(x)
    is a sum of 3·10^4 terms and the search needs about 30 counts, 10^6 steps.'
  weak_signals:
  - form: Asks for the k-th smallest of something with n² or more elements
    shape: n up to 10^5 with pairs, or a table of n × m entries
  - form: Gives k up to 10^9 or 10^18
    shape: A collection far too large to list
  - form: Defines the elements by a formula over pairs or over a range
    shape: The number of elements at most x is a sum of simple terms
  kill_signals:
  - 'k is small, up to about 10^5: the k smallest can be listed in order with a priority queue, and counting
    is not needed.'
  - 'The count is off by a tie: with count(x) = elements strictly below x, the 5th smallest of the 3 ×
    3 table (which is 3) comes out as 4, because "at most x" is needed.'
  in_action:
    statement: Print the k-th smallest entry of the n × n multiplication table, whose entry in row i and
      column j is i · j.
    constraints: n ≤ 3·10^4, k ≤ n².
    budget: The table has up to 9·10^8 entries; sorting them is hopeless. count(x) = Σ min(n, ⌊x / i⌋)
      is O(n), and about 30 values of x are tested, about 10^6 steps.
    candidates:
    - tool: List all entries and sort them
      verdict: rejected
      because: Up to 9·10^8 entries.
    - tool: Binary search on x with count(x) ≥ k (this topic)
      verdict: chosen
      because: count(x) is non-decreasing in x and cheap, and the k-th smallest is the first x with count(x)
        ≥ k.
    property_check: In row i the entries at most x number min(n, ⌊x / i⌋), so count(x) is a sum of n terms.
      The k-th smallest value v has count(v) ≥ k and count(x) < k for every x < v (Theorem 1.4.6).
    decision: lo = 0, hi = n²; find the first x with count(x) ≥ k.
  examples:
    positive:
    - inline:
        input: The 5th smallest entry of the 3 × 3 multiplication table (1 2 3 / 2 4 6 / 3 6 9)
        answer: '3'
        why: The sorted entries are 1, 2, 2, 3, 3, 4, 6, 6, 9; count(2) = 3 < 5 and count(3) = 5, so the
          first x with count(x) ≥ 5 is 3.
    - inline:
        input: The 9th smallest entry of the 3 × 3 multiplication table
        answer: '9'
        why: Only x = 9 has count(x) = 9, so the first x with count(x) ≥ 9 is 9.
    negative:
    - inline:
        input: The 9th smallest of the 3 × 3 table, searching only x in 1..5
        answer: '9'
        method_gives: '6'
        why: The answer 9 lies outside the range, so the search ends one past the top. The top of the
          range must be at least the largest possible entry.
      correct_tool:
        topic: '1.4'
        card: kth-by-counting
    - inline:
        input: The 5th smallest of the 3 × 3 table, with count(x) counting the entries strictly below
          x
        answer: '3'
        method_gives: '4'
        why: With strictly below, count(4) is the first to reach 5 (the entries 1, 2, 2, 3, 3), so the
          search stops at 4. The count must include x itself.
      correct_tool:
        topic: '1.4'
        card: kth-by-counting
  lookalikes:
  - description: The k smallest pair sums of two sorted arrays with k ≤ 10^4
    tool:
      topic: '0.6'
      card: heap-extract
    flipping_difference: Small k lets the pairs be listed in increasing order with a priority queue; counting
      is needed only when k is huge.
  complexity: O(C log(range)) where C is the cost of one count.
problems:
- id: lc-binary-search
  role: ladder
  card: sorted-search
  rung: 1
  twist: Base case of the card
  summary: Find the index of a target in a sorted array of n ≤ 10^4 distinct values, or −1, in O(log n).
  hints:
  - Write a monotone predicate on the indices whose first true position tells you where the target would
    be.
  - 'p(i) = (nums[i] ≥ target): false…false true…true. Its first true index is the only place the target
    can be.'
  - Run the template with lo = −1, hi = n; then check whether hi < n and nums[hi] equals the target.
- id: lc-first-bad-version
  role: ladder
  card: sorted-search
  rung: 2
  twist: The predicate is given as a function call, and every call counts.
  summary: Versions 1..n (n up to 2^31 − 1) where every version after the first bad one is bad; find the
    first bad one with few calls of isBadVersion.
  hints:
  - Is "version v is bad" monotone in v?
  - 'Yes: good…good bad…bad. So the answer is the first true position of isBadVersion (Theorem 1.4.1).'
  - lo = 0, hi = n; mid = lo + (hi − lo) / 2, because lo + hi can overflow int here.
- id: lc-search-insert-position
  role: ladder
  card: sorted-search
  rung: 3
  twist: The answer is also needed when the target is absent, which is exactly the lower bound.
  summary: In a sorted array of distinct values, return the target's index, or the index where it would
    be inserted to keep the order.
  hints:
  - Where must the target go if it is not present?
  - 'Before the first value that is at least the target: the lower bound (Theorem 1.4.2).'
  - Return the template's hi for p(i) = (nums[i] ≥ target), or lower_bound − begin.
- id: ac-abc231_c
  role: ladder
  card: sorted-search
  rung: 4
  twist: The array must be sorted first, and many queries share it.
  summary: N, Q ≤ 2·10^5; for each query x, how many of N heights are at least x?
  hints:
  - Does the order of the students matter for the answer?
  - No, so sort. The heights at least x form a suffix starting at the lower bound of x.
  - Sort once; answer N − lower_bound(x) for each query.
- id: lc-find-first-and-last-position-of-element-in-sorted-array
  role: ladder
  card: sorted-search
  rung: 5
  twist: Two searches, one for each end of a block of equal values.
  summary: The first and last index of a target in a sorted array with repeats (n ≤ 10^5), or [−1, −1],
    in O(log n).
  hints:
  - Which two bounds bracket all copies of the target?
  - The lower bound (first ≥ target) and the upper bound (first > target); the copies sit between them.
  - If lower = upper the target is absent; otherwise return [lower, upper − 1].
- id: ac-abc334_d
  role: ladder
  card: sorted-search
  rung: 6
  twist: 'The searched sequence is built: prefix sums of the sorted values.'
  summary: N sleighs need R_i reindeer each (≤ 10^9); for Q ≤ 2·10^5 queries X ≤ 2·10^14, the most sleighs
    that X reindeer can pull.
  hints:
  - Which sleighs should be pulled to pull as many as possible?
  - 'The cheapest ones: sort R. Pulling k sleighs needs the prefix sum P_k, which is non-decreasing.'
  - 'The answer is the largest k with P_k ≤ X: upper_bound(P, X) − 1 on P_0..P_N. long long.'
- id: cf-706B
  role: ladder
  card: sorted-search
  rung: 7
  twist: Many queries with a different bound each, in a Codeforces input format.
  summary: Prices in n ≤ 10^5 shops; on each of q ≤ 10^5 days you have m_i coins; in how many shops can
    you buy the drink?
  hints:
  - Rewrite the question as a count in a sorted array.
  - 'The number of prices at most m_i: the upper bound of m_i in the sorted prices (Theorem 1.4.2).'
  - Sort once, then print upper_bound(m_i) − begin for each day.
- id: lc-search-in-rotated-sorted-array
  role: ladder
  card: sorted-search
  rung: 8
  twist: The array is not sorted, but a different predicate is still monotone.
  summary: A sorted array of distinct values was rotated at an unknown point; find a target in O(log n).
  hints:
  - Compare each element with the last element. What do the answers look like?
  - '"nums[i] ≤ nums[n−1]" is false on the first block and true on the second: monotone, so the rotation
    point is its first true index.'
  - Find the rotation point with one search, then search the one sorted part that can contain the target.
- id: lc-sqrtx
  role: ladder
  card: answer-search
  rung: 1
  twist: Base case of the card
  summary: The integer square root (rounded down) of x ≤ 2^31 − 1, without library powers.
  hints:
  - Is "r·r ≤ x" monotone in r?
  - 'It is true, …, true, false, …: the answer is its last true value (the template with the roles swapped).'
  - Search r in [0, x + 1] with lo true and hi false; compute r·r in long long.
- id: lc-koko-eating-bananas
  role: ladder
  card: answer-search
  rung: 2
  twist: The check is a sum over the input, computed for each candidate.
  summary: Piles of bananas (n ≤ 10^4, piles ≤ 10^9) and h hours; the smallest eating speed k per hour
    that finishes all piles in time.
  hints:
  - How many hours does speed k need? Does a larger k ever need more?
  - 'Σ ceil(p_i / k) hours, which never grows as k grows: monotone (Theorem 1.4.3).'
  - Search the smallest k in [1, max pile] with Σ ceil(p_i / k) ≤ h; use long long for the sum.
- id: cses-1620
  role: ladder
  card: answer-search
  rung: 3
  twist: The answer can be about 10^18, and the count in the check must not overflow.
  summary: n ≤ 2·10^5 machines each making one product per k_i seconds; the least time to make t ≤ 10^9
    products.
  hints:
  - In T seconds, how many products can the machines make together?
  - Σ floor(T / k_i), non-decreasing in T. The answer is the first T where it reaches t.
  - Search T in [1, min(k)·t]; stop adding once the sum reaches t, so it cannot overflow.
- id: ac-abc146_c
  role: ladder
  card: answer-search
  rung: 4
  twist: Maximise instead of minimise, with a cost that jumps at each new digit.
  summary: The integer N costs A·N + B·(digits of N); the largest N ≤ 10^9 affordable with X ≤ 10^18 yen,
    or 0.
  hints:
  - Is "N is affordable" monotone in N?
  - 'Yes: both A·N and the digit count only grow. It is true, …, true, false, …'
  - Search the last affordable N in [0, 10^9] with lo = 0 (always fine) and hi = 10^9 + 1; the cost fits
    in long long.
- id: cf-1873E
  role: ladder
  card: answer-search
  rung: 5
  twist: The check sums how much each column falls short of a candidate height.
  summary: Columns of heights a_i and x units of water; the tallest tank height h such that filling every
    column up to h needs at most x units. (t test cases)
  hints:
  - How much water does height h need?
  - Σ max(0, h − a_i), non-decreasing in h. The answer is the last h whose need is at most x.
  - Search h up to max(a) + x in long long.
- id: cf-371C
  role: ladder
  card: answer-search
  rung: 6
  twist: Three ingredients with stock and prices; the upper bound of the search must be chosen with care.
  summary: A recipe of B, S and C pieces, some stock of each, their prices and r rubles; the most hamburgers
    that can be made.
  hints:
  - What does it cost to make k hamburgers?
  - For each ingredient, max(0, k·need − have) pieces must be bought; the cost is non-decreasing in k.
  - Search the last affordable k with hi around 10^13 (stock plus money cannot do more); compute the cost
    in long long.
- id: cf-780B
  role: ladder
  card: answer-search
  rung: 7
  twist: The answer is a real number, so a fixed number of halvings replaces the integer loop.
  summary: n friends on a line at positions x_i with top speeds v_i; the least time after which all of
    them can be at one common point.
  hints:
  - In time t, which points can friend i reach? When do all friends share a point?
  - Friend i covers [x_i − v_i t, x_i + v_i t]; all intervals meet iff the largest left end ≤ the smallest
    right end, which only gets easier as t grows.
  - Search t over the reals with 100 halvings (Theorem 1.4.5) and print with enough digits.
- id: ac-abc205_d
  role: ladder
  card: kth-by-counting
  rung: 1
  twist: Base case of the card
  summary: For sorted distinct A_i ≤ 10^18 and Q ≤ 10^5 queries K, the K-th smallest positive integer
    not in A.
  hints:
  - How many positive integers up to x are not in A?
  - 'x − (number of A_i ≤ x): non-decreasing in x, so the answer is the first x where it reaches K (Theorem
    1.4.6).'
  - Search x in [1, K + N] with the count computed by an upper bound in A; or, faster, search the index
    i where A_i − i first reaches K.
- id: cses-2422
  role: ladder
  card: kth-by-counting
  rung: 2
  twist: The collection has n² ≈ 10^12 elements, and the count is a sum over rows.
  summary: The middle element of the sorted entries of an n × n multiplication table (n < 10^6, n odd).
  hints:
  - How many entries of row i are at most x?
  - min(n, floor(x / i)); summing over the rows gives count(x) in O(n).
  - The answer is the smallest x with count(x) ≥ (n² + 1) / 2; search x in [1, n²] with long long.
- id: ac-abc155_d
  role: ladder
  card: kth-by-counting
  rung: 3
  twist: Products of pairs with negative numbers, so counting pairs at most x needs care with signs.
  summary: The K-th smallest of the N(N − 1)/2 pairwise products of N ≤ 2·10^5 integers in [−10^9, 10^9].
  hints:
  - For a fixed a_i and a bound x, which a_j satisfy a_i · a_j ≤ x? Separate a_i > 0, a_i = 0 and a_i
    < 0.
  - 'For a_i > 0: a_j ≤ floor(x / a_i); for a_i < 0: a_j ≥ ceil(x / a_i) (dividing by a negative flips
    the inequality); for 0: all if x ≥ 0. Each is a bound in the sorted array.'
  - count(x) = (number of ordered pairs i ≠ j) / 2 — subtract the pairs i = j and halve; search the smallest
    x in [−10^18, 10^18] with count(x) ≥ K, rounding divisions towards −∞ carefully.
- id: ac-abc143_d
  role: worked_example
