  - id: ac-abc116_b
    role: lookalike
    summary: Starting from s ≤ 100, apply n → n/2 (even) or 3n + 1 (odd); the first index at which a value repeats.
  - id: ac-abc106_c
    role: lookalike
    summary: Each day every digit d of a digit string (length ≤ 100) becomes d copies of itself; the K-th character (K ≤ 10^18) after 5·10^15 days.
  - id: ac-abc199_c
    role: checkpoint
    card: string-processing
    summary: "A string of length 2N (N ≤ 2·10^5) and Q (≤ 3·10^5) queries: swap two characters, or swap the first and second halves; the final string."
  - id: ac-abc375_c
    role: checkpoint
    card: grid-processing
    summary: An N by N grid (N ≤ 3000, even); for i = 1 to N/2 the square of layers i and deeper is rotated by 90 degrees clockwise; the final grid.
  - id: ac-abc324_c
    role: checkpoint
    card: string-processing
    summary: Which of N strings (total length ≤ 5·10^5) can be turned into T' by at most one insertion, deletion or change of a letter?
  - id: cf-1607B
    role: review
    card: case-analysis
    review_set: 1
    summary: "For each of t tests: a grasshopper at x_0 jumps i units at minute i, left from an even position and right from an odd one; its position after n jumps (n ≤ 10^14)."
  - id: lc-game-of-life
    role: review
    card: grid-processing
    review_set: 1
    summary: One step of Conway's Game of Life on an m by n board (m, n ≤ 25), all cells updated at once.
  - id: ac-abc278_d
    role: review
    card: direct-simulation
    review_set: 1
    summary: "N values (N ≤ 2·10^5) and Q queries: set every value to x, add x to one value, or print one value."
  - id: cf-1811B
    role: review
    card: case-analysis
    review_set: 2
    summary: "For each of t tests: an n by n grid (n even) is made of nested square conveyor belts; the fewest belt changes to get from one cell to another."
