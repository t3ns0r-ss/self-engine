  role: review
  type: refactor
  title: Fix a Stack that inherits publicly from vector
  prompt: A Stack inherits from std::vector<int> and so offers erase and operator[]. Rewrite it so that the vector is a private member and only the stack operations exist.
  card: owned-part
  review_set: 1
  techniques:
