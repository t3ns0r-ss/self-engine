# Patterns for topic 7.7 (Constructive algorithms). Provisional until the lesson maps them to Recognition Cards.
topic: "7.7"
patterns:
  - id: invariant-then-build
    name: Necessary condition, then construction
    description: Find a condition every answer must satisfy, then build an answer whenever it holds.
    precondition: The necessary condition is also sufficient, as shown by the construction.
  - id: simple-pattern
    name: A simple pattern works
    description: An alternating, sorted, reversed, or cyclically shifted arrangement meets the requirement.
    precondition: The requirement only involves neighbouring or paired elements, which a regular pattern controls.
  - id: permutation-build
    name: Building permutations
    description: Construct a permutation or array with required counts of inversions, fixed points, or adjacent differences.
    precondition: The required quantity can be changed in steps of one by small local modifications.
  - id: operation-sequence
    name: Sequences of operations
    description: Output a sequence of allowed operations, within a limit, that reaches the target state.
    precondition: Each operation fixes at least one more position without breaking those already fixed.
