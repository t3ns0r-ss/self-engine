# Topic 7.2 data file (CURRICULUM_GAPS_PLAN.md Section 5.1, S6). Problems reference the bank by id. reduced_bank: see PROGRESS.md.
id: '7.2'
uses:
- topic: '0.5'
  what: 'Brute force: the reference solution of every check, trying all subsets or a search from every
    vertex'
- topic: '0.6'
  what: 'Standard containers: lists of pairs for the neighbours of a vertex'
- topic: '1.2'
  what: 'Prefix sums: the difference array in one look-alike problem'
- topic: '1.7'
  what: 'Bit operations: the xor of two numbers as the cost of an edge'
- topic: '2.2'
  what: 'Modular arithmetic: counts modulo a prime, inverses, and moduli that have no inverse'
- topic: '2.5'
  what: 'Combinatorics: counting orders of a tree by a product of sizes'
- topic: '3.3'
  what: 'Dynamic programming: a value for each small case built from the values of smaller cases'
- topic: '4.1'
  what: 'Graph traversal: a search from every vertex, and the breadth-first order of a rooted tree'
- topic: '4.2'
  what: 'Graph structure: the two-colouring of a tree'
- topic: '4.6'
  what: 'Trees: rooted trees, subtree sizes, depths and the farthest vertex'
- topic: '4.7'
  what: 'LCA: the distance between two given vertices, in a look-alike problem'
- topic: '7.1'
  what: 'DP on trees: the value of a subtree from its children, the best two children at a top vertex,
    and the iterative order of a rooted tree'
theorems:
- id: 7.2.1
  title: Rerooting
  plain_words: The answer for a root is made from the parts of the tree that hang from its neighbours.
    Rooting the tree once gives the part below every vertex. The part above a vertex $c$ is the tree seen
    from its parent $p$ without the subtree of $c$, and it is made from the part above $p$ and the other
    children of $p$. To leave one child out of a product, keep the product of the children in front of
    it and the product of those behind it. Each vertex does work proportional to its number of children.
  code: 7.2/thm-1
- id: 7.2.2
  title: The best way that avoids a child
  plain_words: A vertex has several ways out, one through each neighbour. To know the best way out of
    a child $c$ that goes up through its parent $p$, we need the best way out of $p$ that does not go
    back into $c$. If the best way out of $p$ is the one through $c$, the answer is the second best; otherwise
    it is the best. So two numbers per vertex are enough, and no division is needed. The same idea with
    prefix and suffix values works for every combination of children, not only for a maximum.
  code: 7.2/thm-2
- id: 7.2.3
  title: Reversing edges for every root
  plain_words: 'When the root moves along one edge, every other edge keeps its meaning (it points toward
    the new root exactly when it pointed toward the old one), and only the edge we crossed changes its
    meaning. So the number of edges that point toward the root changes by exactly one: up by one if that
    edge pointed from the old root to the new, down by one if it pointed the other way.'
  code: 7.2/thm-3
cards:
- id: rerooting
  name: An answer for every vertex taken as the root (moving the root across an edge)
  from_theorem: 7.2.1
  decisive_property: The question asks for a value for each vertex taken as the root (or as the start,
    the centre, the capital), the value is built from the parts of the tree beyond the neighbours of that
    vertex, and the part beyond a neighbour changes in a simple way when the root moves by one edge.
  how_to_test: 'Write the answer for a root r as a combination (sum, product, maximum) over the neighbours
    u of a value of the part beyond u. If the value of the part above a child c can be made from the part
    above its parent and the other children of the parent, rerooting costs O(n). Check whether the combination
    has an inverse: for a maximum, a minimum, a gcd or a product modulo a number that may not be prime,
    use prefix and suffix values or the two best.'
  constraint_shapes:
  - 'n = 2·10^5 and the sum of distances from every vertex: n² = 4·10^10 steps for a search from each
    vertex, against about 3n for the two passes'
  - 'n = 10^5 and, for every vertex, the number of connected black sets that contain it, modulo a number
    that may not be prime: n² = 10^10 for a DP from every vertex, against n with prefix and suffix products'
  weak_signals:
  - form: 'Asks for the same quantity for every vertex of a tree: the sum of distances, the number of
      ways, the best score if this vertex is the root or the start'
    shape: n up to 2·10^5, an array of n answers
  - form: Asks for the best vertex to start at or to choose as the centre, where the cost depends on the
      whole tree seen from it
    shape: n up to 2·10^5, minimise or maximise over the vertices
  - form: Asks for the number of ways for every root, where a division by the factor of one child could
      meet a zero modulo the modulus
    shape: n up to 2·10^5, a modulus of 10^9 + 7 or an arbitrary one
  kill_signals:
  - 'The simple update from the parent drops information: for the farthest vertex, answer(c) = max(down(c),
    answer(p) + 1) is wrong when the farthest way from p goes through c: on the path 3–1–0–2 it gives
    3 for the vertex 1 where the answer is 2'
  - 'Only one root (or a few) is asked about: a single subtree DP is enough'
  in_action:
    statement: A tree is given. For every vertex print the sum of the distances from it to all the other
      vertices.
    constraints: n ≤ 2·10^5.
    budget: 'A search from every vertex: n² = 4·10^10. Need about n.'
    candidates:
    - tool: A breadth-first search from every vertex (topic 4.1)
      verdict: rejected
      because: 4·10^10 steps.
    - tool: Counting the contribution of each edge (topic 4.6)
      verdict: rejected
      because: The edge to the parent of c lies on size(c)·(n − size(c)) paths, which gives the total
        over all pairs, not the sum for each vertex.
    - tool: Rerooting (this topic)
      verdict: chosen
      because: Moving the root from p to c brings size(c) vertices one step closer and the other n − size(c)
        one step farther (Theorem 7.2.1).
    property_check: The answer for a root is a sum over the parts beyond its neighbours, and one edge
      changes it by n − 2·size(c). The property holds.
    decision: 'Compute the sum of depths for the root 0 and the sizes, then answer(c) = answer(p) + n
      − 2·size(c) in the order of a breadth-first search: O(n).'
  examples:
    positive:
    - inline:
        input: In the tree 0–1, 0–2, 2–3, 2–4, what is the sum of the distances from the vertex 2 to all
          vertices?
        answer: '5'
        why: The sum for the root 0 is 1 + 1 + 2 + 2 = 6 and the subtree of 2 has 3 vertices, so 6 + 5
          − 2 · 3 = 5 (Theorem 7.2.1).
    - inline:
        input: In the same tree, how many connected sets of vertices contain the vertex 1?
        answer: '6'
        why: 'down(1) = 1 and up(1) = 5, so the number is 1 · (5 + 1) = 6: the vertex 1 alone, or with
          the vertex 0 and nothing or one of the 4 connected sets of the side of 2.'
    - worked_example: cses-1133
      why: 'The sum of the distances from every vertex of a tree of up to 2·10^5 vertices: answer(c) =
        answer(p) + n − 2·size(c).'
    negative:
    - inline:
        input: In the tree with the edges 0–1, 0–2 and 1–3 (the path 3–1–0–2), what is the largest distance
          from the vertex 1 to another vertex?
        answer: '2'
        method_gives: '3'
        why: The update answer(c) = max(down(c), answer(p) + 1) takes the farthest distance from the vertex
          0, which is 2 and goes through 1 itself, and adds 1. The part above 1 must not contain the subtree
          of 1.
      correct_tool:
        topic: '4.6'
        card: farthest-each
    - problem: cses-2079
      why: Asks for one vertex, a centroid, and it is found by walking from the root towards the heavy
        child; no table of answers for all the vertices is needed.
      correct_tool:
        topic: '4.6'
        card: subtree-values
  lookalikes:
  - description: The same quantity for one fixed root
    tool:
      topic: '7.1'
      card: subtree-dp
    flipping_difference: 'One root: a single subtree DP. Every vertex as the root: the second pass of
      the rerooting is added.'
  - description: The distance between given pairs of vertices
    tool:
      topic: '4.7'
      card: tree-distance
    flipping_difference: 'Queries about pairs: the lowest common ancestor. A value for every vertex as
      the centre: rerooting.'
  complexity: O(n) for the two passes with prefix and suffix values over the children (O(n log n) if the
    children must be sorted); memory O(n).
- id: exclude-one
  name: A value for every root when the part above a child needs the other children without it (a maximum,
    a minimum, a product modulo any number, a pair of numbers)
  from_theorem: 7.2.2
  decisive_property: The value for a vertex taken as the root is a combination (the largest, the smallest,
    a gcd, a product modulo a number that may have no inverse, a pair of numbers) of the values of the
    parts beyond its neighbours, the combination cannot be undone, and the part above a child is the combination
    of the part above its parent and of the other children of the parent, which the two best values or
    prefix and suffix values give in time proportional to the degree.
  how_to_test: 'Write the answer for a root as a combination over its neighbours of a value of the part
    beyond each. Ask whether the part of the child can simply be taken out of the parent total (a sum,
    a count, a product by a number with an inverse): then the first card is enough. If the combination
    is a maximum or a minimum, keep the two best values at each vertex. If it is a product modulo a number
    that may be composite, a gcd or a list of states, keep prefix and suffix values over the children.'
  constraint_shapes:
  - 'n = 2·10^5 and the largest cost of a path from every vertex: a search from each vertex is n² = 4·10^10
    steps, against about 3n with the two best values at each vertex'
  - 'n = 10^5 and, for every capital, a product of factors modulo 10^9 + 7 where a factor can be 0: a
    division by it is impossible, while prefix and suffix products cost the sum of the degrees, n − 1
    in all'
  weak_signals:
  - form: Asks, for every vertex, for the largest or the smallest cost of a way out of it, with costs
      on the vertices or on the edges
    shape: n up to 2·10^5, an array of n answers, costs up to 10^9 (64 bits)
  - form: Asks, for every vertex taken as the root, for a number of ways that is a product over its children,
      modulo a prime or any other number
    shape: n up to 2·10^5, a factor of the product can be 0 modulo the number
  - form: Asks for the number of vertices whose removal, or choice as the centre, keeps a value such as
      a matching or a centroid property
    shape: n up to 2·10^5, a pair of numbers per vertex
  kill_signals:
  - 'The combination has an inverse: for the sum of distances answer(c) = answer(p) + n − 2·size(c) is
    shorter and no best values or prefix values are needed (the first card)'
  - 'All lengths are 1 and only the largest distance is asked: the two ends of a diameter (topic 4.6)
    give it with two searches and no table'
  in_action:
    statement: A tree has a positive cost on each vertex. For every vertex v print the largest total cost
      of a path that starts at v.
    constraints: n ≤ 2·10^5, costs up to 10^9.
    budget: 'A search from every vertex: n² = 4·10^10. Need about n.'
    candidates:
    - tool: A breadth-first search from every vertex (topic 4.1)
      verdict: rejected
      because: 4·10^10 steps.
    - tool: The subtree DP from one root (topic 7.1)
      verdict: rejected
      because: It gives only the paths that go down from each vertex, not the ones that first go up.
    - tool: Rerooting with a part taken out by subtraction (the first card)
      verdict: rejected
      because: 'A maximum cannot be subtracted: the best way out of the parent may be the way through
        the child itself.'
    - tool: The two best ways out of each vertex (this card)
      verdict: chosen
      because: The best way out of the parent that avoids the child is the second best when the best goes
        through the child (Theorem 7.2.2).
    property_check: The answer for v is its cost plus the best of its ways out. The way out of a child
      c through its parent is made from the ways out of the parent without c, and the largest of them
      is read from the two best values. The property holds.
    decision: 'down[v] = cost[v] plus the best child; keep the two best ways out of every vertex; up[c]
      for each child from them in an order with parents first: O(n).'
  examples:
    positive:
    - inline:
        input: In the tree 0–1, 0–2, 2–3, 2–4 with every edge of length 1, what is the largest distance
          from the vertex 1 to another vertex?
        answer: '3'
        why: The ways out of the vertex 0 have the lengths 1 (to 1) and 2 (to 2 and then 3 or 4). For
          the vertex 1 the way through 0 must avoid 1 itself; the best way out of 0 is the one through
          2, of length 2, so the way for 1 has the length 1 + 2 = 3 (Theorem 7.2.2).
    - inline:
        input: In the same tree, how many connected sets of vertices contain the vertex 2, modulo 6?
        answer: '0'
        why: The count is down(2) · (up(2) + 1) = 4 · 3 = 12, which is 0 modulo 6. The factors on the
          way up include 6 itself, which is 0 modulo 6 and has no inverse, so the part above a child is
          made with prefix and suffix products (Theorem 7.2.2).
    negative:
    - inline:
        input: In the same tree, what is the sum of the distances from the vertex 2 to all vertices?
        answer: '5'
        method_gives: '2'
        why: 'The two best ways out answer a different question: the largest distance from the vertex
          2 is 2 (to the vertex 1). A sum has an inverse: answer(c) = answer(p) + n − 2·size(c) takes
          the part of the child out by subtraction, and no best values are needed.'
      correct_tool:
        topic: '7.2'
        card: rerooting
    - problem: cses-1132
      why: 'Asks for the farthest vertex from every vertex of an unweighted tree: one end of a diameter
        is always the farthest, so two searches give every answer and no table of ways out is needed.'
      correct_tool:
        topic: '4.6'
        card: farthest-each
  lookalikes:
  - description: A value for every root whose combination can be undone (a sum, a count)
    tool:
      topic: '7.2'
      card: rerooting
    flipping_difference: 'A sum or a count can be taken out of the parent total in one step. A maximum,
      a product modulo any number or a pair of numbers cannot: it needs the two best values or prefix
      and suffix values.'
  - description: The farthest vertex from every vertex of an unweighted tree
    tool:
      topic: '4.6'
      card: farthest-each
    flipping_difference: 'All lengths 1: the ends of a diameter are enough. Different costs on the vertices
      or on the edges, or counts of ways: the table of ways out is needed.'
  complexity: 'O(n) in all: the two best values or the prefix and suffix values of a vertex cost its degree,
    and the degrees add up to 2(n − 1); memory O(n).'
problems:
- id: cses-1133
  role: worked_example
  summary: A tree of n ≤ 2·10^5 vertices; for every vertex, the sum of the distances from it to all other
    vertices.
- id: ac-abc220_f
  role: ladder
  card: rerooting
  rung: 1
  twist: 'Base case of the card: the sum of distances for every vertex, the question of the first worked
    example on a second judge.'
  summary: A tree of N ≤ 2·10^5 vertices; for every vertex i, the sum of the distances from i to all vertices.
  hints:
  - What changes when the root moves from a vertex to its child? Count the vertices that get closer and
    the ones that get farther.
  - 'size[c] vertices get one step closer and n − size[c] one step farther: answer[c] = answer[p] + n
    − 2·size[c].'
  - Root at the vertex 1; the answer for the root is the sum of the depths; then one pass in an order
    with parents first.
- id: ac-abc160_f
  role: ladder
  card: rerooting
  rung: 4
  twist: A count of orders that changes by a ratio of sizes along an edge.
  summary: A tree of N ≤ 2·10^5 vertices; for each k, the number of ways to write the numbers 1 … N on
    the vertices so that 1 is on the vertex k and each next number is on a vertex adjacent to one that
    already has a number, modulo 10^9 + 7.
  hints:
  - For a fixed k, the numbers form an order of the vertices in which every vertex comes after its parent
    when the tree is rooted at k. How many such orders are there?
  - n! divided by the product of the subtree sizes (rooted at k).
  - 'Moving the root from p to c changes only two sizes: the size of p becomes n − size(c) and the size
    of c becomes n. So answer(c) = answer(p) · size(c) / (n − size(c)), with modular inverses of the numbers
    1 … N.'
- id: cf-543D
  role: ladder
  card: exclude-one
  rung: 1
  twist: 'Base case of the card: products with factors that can be 0 modulo the prime, left out with prefix
    and suffix products.'
  summary: A tree of n ≤ 2·10^5 vertices (the cities and roads); choose which roads to repair; for each
    city taken as the capital, the number of choices in which every path from the capital to a city contains
    at most one road that is not repaired, modulo 10^9 + 7. †
  hints:
  - For one fixed capital, let f(v) be the number of choices inside the subtree of v such that every path
    from v down contains at most one bad road.
  - 'For each child c either the edge to c is repaired and the subtree of c is as f(c), or it is not repaired
    and everything below c must be repaired (1 way): f(v) = Π (f(c) + 1).'
  - 'Reroot: the product without one child cannot be got by dividing, because f(c) + 1 can be 0 modulo
    10^9 + 7. Use prefix and suffix products over the children.'
- id: lc-time-taken-to-mark-all-nodes
  role: ladder
  card: exclude-one
  rung: 2
  twist: 'A maximum of costs that depend on the parity of the target: the two best values.'
  summary: A tree of n ≤ 10^5 nodes; a node is marked at time x if a neighbour was marked at time x −
    1 (odd node) or x − 2 (even node); for each start node, the time when all nodes are marked.
  hints:
  - 'The time to mark a node is the sum, along the path from the start, of the costs of the nodes after
    the start: 1 for an odd node and 2 for an even one. What is asked for each start?'
  - 'The largest cost of a path starting at s. Root the tree once: down[v] = the largest cost below v,
    up[c] = the largest cost of a path leaving through the parent.'
  - 'A maximum has no inverse: keep the two best values at each vertex, as in the template for the farthest
    vertex, and add the cost of the vertex that is reached.'
