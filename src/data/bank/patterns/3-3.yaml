# Patterns for topic 3.3 (Knapsack family: 0/1, unbounded, bounded). Provisional until the lesson maps them to Recognition Cards.
topic: "3.3"
patterns:
  - id: zero-one
    name: Each item at most once
    description: Choose a subset of items with total weight ≤ W maximising value, W up to about 10^5.
    precondition: Items are independent and the capacity is small enough to index the states.
  - id: value-indexed
    name: Small values, huge weights
    description: "Weights are up to 10^9 but total value is small: dp over value storing minimum weight."
    precondition: The total value is small enough to index the states.
  - id: unbounded
    name: Unlimited copies
    description: "Each item may be used any number of times (coin change: number of ways or minimum coins)."
    precondition: Copies are unlimited, so the capacity loop runs upward and may reuse the current item.
  - id: subset-sums
    name: Which totals are reachable
    description: Decide or list which sums can be formed from the items, optionally with a bitset.
    precondition: The range of possible sums is small.
  - id: bounded
    name: Limited copies
    description: Item i may be used up to c_i times; split it into power-of-two bundles and run the at-most-once version.
    precondition: Bundles of sizes 1, 2, 4, …, plus a remainder can form every count from 0 to c_i and nothing more.
