    role: worked_example
    summary: "The sum of the GCDs of all K^N sequences with entries in [1, K] (N, K ≤ 10^5), modulo 10^9 + 7."
  - id: cses-2182
    role: worked_example
    summary: "Given a prime factorisation (up to 10^5 primes ≤ 10^6, exponents ≤ 10^9), the number, sum and product of the divisors modulo 10^9 + 7."
