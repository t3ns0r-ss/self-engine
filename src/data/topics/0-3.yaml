# Topic 0.3 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.3'
uses:
- topic: '0.1'
  what: 'Fast input and output, long long and integer division: processes reach 10^18 steps, and turning
    a direction uses remainders of integers'
- topic: '0.2'
  what: The step budget of about 10^8 per second, used to decide whether a process can be followed step
    by step
theorems:
- id: 0.3.1
  title: A deterministic process on few states repeats, so any step count can be skipped
  plain_words: If the next state depends only on the current state and there are K states, some state
    repeats within K + 1 steps, and from then on the process just goes around a loop. The state after
    any number of steps, even 10^18, follows from where the loop starts and how long it is.
  code: 0.3/thm-1
- id: 0.3.2
  title: A grid scan with checked neighbours costs a constant per cell
  plain_words: Visiting every cell of an H by W grid and looking at its eight neighbours costs at most
    nine looks per cell, and checking each neighbour's row and column first means nothing outside the
    grid is ever read.
  code: 0.3/thm-2
- id: 0.3.3
  title: A small state carried along one scan summarises the prefix
  plain_words: If one small value, such as the number of open brackets, tells everything about the part
    of the string read so far that the rest of the answer needs, then a single left-to-right pass that
    updates it for every character gives the answer.
  code: 0.3/thm-3
- id: 0.3.4
  title: Cases that cover every input prove a program correct
  plain_words: If the cases together cover every allowed input and each case's rule is right for all inputs
    in it, the whole program is right. The usual mistake is a case that falls through the cracks, such
    as two intervals that touch at one point.
  code: 0.3/thm-4
cards:
- id: direct-simulation
  name: Step-by-step simulation
  decisive_property: The number of steps times the cost of one step fits the budget; or the process is
    deterministic on a small set of states, so it repeats within that many steps and the state after T
    steps follows from the first repeat and the period.
  from_theorem: 0.3.1
  how_to_test: Count the steps the statement describes (with the largest input) and multiply by the cost
    of one step. If that is too large, ask whether the next state depends only on the current one and
    how many states exist.
  constraint_shapes:
  - 'N and Q up to 10^5 with O(1) work per step: 10^5 steps is far inside the budget of 10^8, so follow
    the process literally.'
  - 'T up to 10^18 steps over K up to 2·10^5 states: 10^18 steps is impossible, but the state repeats
    within K + 1 = 200 001 steps, and the period gives the state after T.'
  weak_signals:
  - form: Describes a process in detail and asks for its result
    shape: Words such as "repeat", "in each second", "after the operations, print", with N or Q up to
      10^5
  - form: Asks for the state after a huge number of steps of a fixed rule
    shape: T up to 10^18 and a rule on a small set of states, such as positions 1..N
  kill_signals:
  - 'The step count is huge and the state space is huge as well: the rule x → x + 1 applied 10^18 times
    from 0 never repeats, and the answer, 10^18, must be reasoned out, not simulated.'
  - 'The next state depends on the step number as well as on the state: p → (p + t) mod 5 from 0 sees
    position 0 twice in a row but is at position 1 after 4 steps, so cycle detection on the position alone
    is wrong.'
  in_action:
    statement: There are 4 states, and from state s the process moves to next[s], where next = (1, 2,
      3, 1). Starting at state 0, print the state after T = 10^18 steps.
    constraints: States up to K = 2·10^5 in general, T up to 10^18.
    budget: Following 10^18 steps at 10^8 per second takes about 10^10 seconds. Following only the first
      K + 1 = 200 001 steps is instant.
    candidates:
    - tool: Simulate all T steps
      verdict: rejected
      because: 10^18 steps, about 300 years of computing.
    - tool: Follow the process until a state repeats, then use the period (this topic)
      verdict: chosen
      because: The next state depends only on the current state, and K states repeat within K + 1 steps.
    property_check: 'The rule next[s] uses only the current state, so the process is deterministic. The
      states are 0, 1, 2, 3, 1, so the first repeat is state 1 at step 4: it started at step 1 and the
      period is 3. After T steps the state is at position 1 + (T − 1) mod 3 in the list of first visits.'
    decision: Record the step at which each state first appears, stop at the first repeat, and index the
      list with (T − μ) mod λ.
  examples:
    positive:
    - inline:
        input: next = (1, 2, 3, 1) on states 0..3, start at 0, T = 5
        answer: '2'
        why: The states are 0, 1, 2, 3, 1, 2; the cycle 1, 2, 3 starts at step 1, and 5 steps end at state
          2, which the period formula also gives.
    - worked_example: ac-abc165_b
      why: The balance grows by 1% a year and the loop stops after a few thousand years, so following
        the process year by year fits the budget.
    negative:
    - inline:
        input: x → x + 1 from 0, T = 10^18, simulating only the 10^8 steps that fit the budget
        answer: '1000000000000000000'
        method_gives: '100000000'
        why: 'The state never repeats, so neither stepping within budget nor cycle detection works. The
          rule can be reasoned about instead: after T steps the value is T.'
      correct_tool:
        topic: '0.3'
        card: case-analysis
    - inline:
        input: p → (p + t) mod 5 at step t, from position 0; the state after T = 4 steps, using cycle
          detection on the position alone
        answer: '1'
        method_gives: '0'
        why: The position 0 appears at steps 0 and 1, so cycle detection on the position concludes that
          the process stays at 0. But the move depends on the step t as well, so the process has not repeated;
          the true position after 4 steps is 1. Step literally here.
      correct_tool:
        topic: '0.3'
        card: direct-simulation
  lookalikes:
  - description: The same rule applied 5·10^15 times to a string that keeps growing, with no small state
      space
    tool:
      topic: '0.3'
      card: case-analysis
    flipping_difference: Neither stepping nor cycle detection fits; the answer follows from what the rule
      does to each part.
  complexity: O(steps · cost per step); with cycle detection O(K) for K states.
- id: grid-processing
  name: Grid processing
  decisive_property: Each cell is visited a constant number of times, and every neighbour access goes
    through a direction array and a bounds check, so the scan costs O(HW) and never reads outside the
    grid.
  from_theorem: 0.3.2
  how_to_test: Check that H·W fits the budget and that every access (r + dr, c + dc) is either checked
    against 0..H−1 and 0..W−1 or lands in a padding border.
  constraint_shapes:
  - 'H and W up to 10^3: 10^6 cells with up to 9 looks each is 9·10^6 steps, far inside the budget; H
    and W up to 100 (10^4 cells) is trivial even with a growth loop at each cell.'
  weak_signals:
  - form: The input is H lines of W characters, usually '#' and '.'
    shape: H and W up to 100 or 10^3, and a question about each cell or about a walk
  - form: Asks about neighbours, directions, turning left or right, or walking until a wall
    shape: Four or eight directions, a start cell and a command string
  kill_signals:
  - 'The question is about routes: on the grid ".#." / ".#." / "..." the cells (0, 0) and (0, 2) are 2
    apart, but a walker must go around the wall, 6 moves; a scan sees only a cell''s neighbours, not whole
    routes.'
  - 'The grid is huge (H·W = 10^12) and given implicitly: a scan of 10^12 cells is far over the budget.'
  in_action:
    statement: In an H × W grid of '#' (mine) and '.', print for every '.' the number of mines among its
      8 neighbours.
    constraints: 1 ≤ H, W ≤ 100.
    budget: 10^4 cells · 9 looks = 9·10^4 steps, instant.
    candidates:
    - tool: Eight copied if-blocks, one per direction
      verdict: rejected
      because: A typo in one block is easy to miss and hard to find.
    - tool: Two nested loops over dr, dc in −1..1 with a bounds check (this topic)
      verdict: chosen
      because: One loop covers all eight directions, and the check keeps every access inside the grid.
    property_check: Each cell is visited once and looks at itself and at most 8 neighbours, so at most
      9 looks per cell (Theorem 0.3.2). Every neighbour (r + dr, c + dc) is tested against 0 ≤ r + dr
      < H and 0 ≤ c + dc < W before it is read.
    decision: Loop over cells, then over (dr, dc) ≠ (0, 0), with the bounds check before reading.
  examples:
    positive:
    - inline:
        input: 'The neighbours of cell (0, 0) in the grid ".#." / "..." / "#..": how many are mines?'
        answer: '1'
        why: The cell is a corner with only three neighbours inside the grid, and one of them is the '#'
          at (0, 1). The bounds check skips the five outside the grid.
    - worked_example: ac-abc300_c
      why: Each '#' cell is tested for a diagonal cross with the same bounds-checked access, in a grid
        of at most 100 by 100 cells.
    negative:
    - inline:
        input: A robot facing up (direction index 0) turns left, with the left turn written as (d − 1)
          % 4
        answer: '3'
        method_gives: '-1'
        why: In C++ the remainder of a negative number is negative, so (0 − 1) % 4 = −1 and the direction
          array is read out of range. Writing (d + 3) % 4 keeps the index in 0..3.
      correct_tool:
        topic: '0.3'
        card: grid-processing
    - inline:
        input: The number of black neighbours of the centre of a 3 × 3 grid of '#', with a loop over dr,
          dc in −1..1 that does not skip (0, 0)
        answer: '8'
        method_gives: '9'
        why: The cell is its own offset (0, 0) and counts itself, one too many. The offset (0, 0) must
          be skipped when counting neighbours.
      correct_tool:
        topic: '0.3'
        card: grid-processing
  lookalikes:
  - description: The fewest moves from one cell to another around walls
    tool:
      topic: '0.3'
      card: direct-simulation
    flipping_difference: A scan looks at neighbours; counting moves around walls needs to explore routes,
      which a literal step-by-step walker does not do.
  complexity: O(HW) with a constant of at most 9 per cell for 8 neighbours.
- id: string-processing
  name: One-pass string processing
  decisive_property: A small state (a counter, the previous character, a flag) summarises the prefix read
    so far, and the next state depends only on the old state and the next character, so one left-to-right
    scan decides the answer.
  from_theorem: 0.3.3
  how_to_test: Name the state you would keep after reading a prefix, and check that nothing else about
    the prefix is ever needed.
  constraint_shapes:
  - 'A string of length up to 10^6: one pass is 10^6 updates, but re-reading the prefix for every position
    is 10^6 · 10^6 / 2 = 5·10^11 steps.'
  weak_signals:
  - form: 'Transforms or checks a string character by character: brackets, separators, replacements, case
      changes'
    shape: Length up to 10^5 or 10^6 and an output built from the same characters
  - form: Asks whether a string follows a rule where the rule looks only at what came before
    shape: A counter or a flag, such as "inside quotes" or "depth", decides each character
  kill_signals:
  - 'The characters may be reordered: for "aabbc" the answer to "can it become a palindrome" is yes, but
    a left-to-right scan of the string as it stands says no. Then only the letter counts matter.'
  - 'The state does not capture the prefix: for ")(" the final depth is 0, but the string is not a valid
    bracket sequence, because the depth went below 0 in between.'
  in_action:
    statement: Print the nesting depth of a valid bracket string, or NO if it is not valid.
    constraints: The string has up to 10^6 characters, all '(' or ')'.
    budget: One pass is 10^6 updates. Repeatedly removing "()" pairs from the string is up to 10^6 · 5·10^5
      = 5·10^11 steps in the worst case.
    candidates:
    - tool: Remove "()" pairs repeatedly until nothing changes
      verdict: rejected
      because: Up to 5·10^11 steps on a string like "((((…))))".
    - tool: One pass with the depth as the state (this topic)
      verdict: chosen
      because: The depth after each character depends only on the old depth and that character.
    property_check: The string is valid exactly when the depth never goes below 0 and ends at 0, and the
      depth after a prefix is all the rest of the scan needs. Each update is one addition (Theorem 0.3.3).
    decision: Keep depth and best; print "YES best" if the depth never dipped below 0 and ended at 0,
      else NO.
  examples:
    positive:
    - inline:
        input: The maximum depth of the valid string "(()())"
        answer: '2'
        why: The depth goes 1, 2, 1, 2, 1, 0, never below 0 and ending at 0, so the string is valid with
          maximum depth 2; one pass finds it.
    - worked_example: ac-abc282_c
      why: The state "inside a quoted part or not" flips at each quote, and a comma is replaced only outside,
        in one pass over up to 2·10^5 characters.
    negative:
    - inline:
        input: Can the letters of "aabbc" be rearranged into a palindrome? A scan checks whether the string
          as given is a palindrome
        answer: 'yes'
        method_gives: 'no'
        why: 'The letters may be reordered ("abcba"), so the order in the string is irrelevant and only
          the counts matter: at most one letter has an odd count. A scan of the given order answers a
          different question.'
      correct_tool:
        topic: '0.3'
        card: case-analysis
    - inline:
        input: Is ")(" a valid bracket string, if only the final depth is checked?
        answer: 'no'
        method_gives: 'yes'
        why: The final depth is 0, but the depth was −1 after the first character, and no later character
          can repair that. The scan must track the minimum, not only the end.
      correct_tool:
        topic: '0.3'
        card: string-processing
  lookalikes:
  - description: Make a palindrome by reordering the letters freely
    tool:
      topic: '0.3'
      card: case-analysis
    flipping_difference: When order may change, only the counts matter, not a scan of the string.
  complexity: O(n) updates of a constant-size state.
- id: case-analysis
  name: Case analysis
  decisive_property: The inputs split into a few cases that together cover every allowed input (including
    the boundaries), and each case has a direct answer.
  from_theorem: 0.3.4
  how_to_test: List the cases before coding, then check every boundary input (equal values, zero, smallest
    n) against exactly one case's rule. Compare with a brute force on small inputs.
  constraint_shapes:
  - 'A few numbers up to 10^9 or 10^18 and a YES/NO or small answer: no loop over the values is possible
    (10^18 steps), so the answer must follow from comparisons.'
  weak_signals:
  - form: Gives a few quantities, usually large, and asks for a YES/NO or a small number
    shape: Four to six numbers up to 10^9 or 10^18, one test or up to 10^5 tests
  - form: Describes geometry or order of a few objects, such as two intervals or three points
    shape: The answer changes when a comparison flips, such as which interval ends first
  - form: Applies a rule an astronomical number of times
    shape: 5·10^15 or 10^18 applications where each part of the input behaves in a simple way
  kill_signals:
  - 'There are too many cases to list: if the rule needs a table over every residue of x, look for one
    formula or a scan instead.'
  - 'A case is missing: for the sign of a·b with the rule "both positive or both negative gives +, otherwise
    −", the input a = 0, b = 5 gives −, but the product is 0.'
  in_action:
    statement: Two intervals [a, b] and [c, d] of integers are given. Print DISJOINT, TOUCH (exactly one
      common point) or OVERLAP with the length of the common part.
    constraints: Values up to 10^9 in absolute value, a ≤ b and c ≤ d.
    budget: Enumerating the common integer points is up to 2·10^9 steps; a handful of comparisons is O(1).
    candidates:
    - tool: Test every integer for membership in both intervals
      verdict: rejected
      because: Up to 2·10^9 steps per test.
    - tool: Case analysis on lo = max(a, c) and hi = min(b, d) (this topic)
      verdict: chosen
      because: Three cases (lo > hi, lo = hi, lo < hi) cover every pair, boundaries included.
    property_check: The common part is [lo, hi]. If lo > hi it is empty; if lo = hi it is one point; otherwise
      it has length hi − lo > 0. These three cases are exhaustive and exclusive, and the case lo = hi
      covers touching intervals and intervals that are single points.
    decision: DISJOINT if lo > hi, TOUCH if lo = hi, OVERLAP hi − lo otherwise.
  examples:
    positive:
    - inline:
        input: The length of the common part of [1, 5] and [3, 8]
        answer: '2'
        why: lo = 3 and hi = 5 give lo < hi, so the case OVERLAP applies with length 5 − 3 = 2.
    - worked_example: cses-1071
      why: The number in a cell depends on which layer it is on and on two parities, a few cases that
        cover every cell, each with a direct formula.
    negative:
    - inline:
        input: The number of common integer points of [1, 3] and [3, 6], where "lo ≥ hi" is treated as
          disjoint
        answer: '1'
        method_gives: '0'
        why: The intervals touch at 3, so lo = hi = 3 and there is one common point. Merging the touching
          case into DISJOINT drops it; the boundary needs its own case.
      correct_tool:
        topic: '0.3'
        card: case-analysis
    - inline:
        input: The sign of a · b for a = 0, b = 5, with only the cases "both positive or both negative"
          and "otherwise"
        answer: '0'
        method_gives: '-1'
        why: The case a = 0 belongs to neither listed case, so it fell into "otherwise" and gave a wrong
          sign. Zero must be a case of its own.
      correct_tool:
        topic: '0.3'
        card: case-analysis
  lookalikes:
  - description: The same rule applied only a few times
    tool:
      topic: '0.3'
      card: direct-simulation
    flipping_difference: With few steps, following the process is simpler and safer than reasoning about
      cases.
  complexity: O(1) or a constant number of comparisons per input.
problems:
- id: cf-266B
  role: ladder
  card: direct-simulation
  rung: 1
  twist: Base case of the card
  summary: A queue of n boys and girls (n, t ≤ 50); every second, each boy standing directly in front
    of a girl swaps places with her, all at once; the queue after t seconds.
  hints:
  - How many steps does the process take, and how much work is one step?
  - 't seconds times n positions is at most 2500 operations, so follow the process. The trap: in one second
    a boy must not move twice.'
  - Each second, scan i from 0 to n − 2; when s[i] is B and s[i + 1] is G, swap them and skip to i + 2.
- id: ac-abc337_c
  role: ladder
  card: direct-simulation
  rung: 2
  twist: 'The state is "who stands behind whom": store that link and follow it from the front, N steps.'
  summary: Each of N people (N ≤ 3·10^5) is either at the front of a line or right behind a given person;
    print the line from front to back.
  hints:
  - If you know who is at the front, how do you find the second person without searching?
  - Store behind[a] = i for every A_i = a ≠ −1; then each next person is one array lookup away.
  - 'Find the i with A_i = −1, then print cur and set cur = behind[cur], N times in all: O(N).'
- id: ac-abc214_c
  role: ladder
  card: direct-simulation
  rung: 3
  twist: The gems travel around a circle, so the one-step update has to run for two laps.
  summary: N creatures in a circle (N ≤ 2·10^5); creature i passes a gem to the next one S_i time units
    after receiving it, and is also handed a gem at time T_i; the first time each one receives a gem.
  hints:
  - Creature i + 1 first gets a gem either at T_{i+1} or from creature i. At which time can creature i
    pass one on?
  - first[i + 1] = min(T[i + 1], first[i] + S[i]). But first[0] may itself come from creature N − 1, around
    the circle.
  - 'Start with first = T and apply the update for i = 0, 1, …, 2N − 1 (indices mod N): two laps carry
    every chain. Sums reach 2·10^9, so use long long.'
- id: ac-abc250_c
  role: ladder
  card: direct-simulation
  rung: 4
  twist: 'Each step must find a ball by its number: keep a second array from number to position so a step
    costs O(1).'
  summary: Balls numbered 1 to N in a row (N, Q ≤ 2·10^5); each operation swaps the ball numbered x with
    its right neighbour (its left neighbour if it is last); the final row.
  hints:
  - Finding ball x by scanning the row costs N per operation, 4·10^10 in total. What would let you find
    it at once?
  - Keep pos[x], the place of ball x, next to row[p], the ball at place p. A swap changes two entries
    of each.
  - p = pos[x]; q = p + 1, or p − 1 when p is the last place; swap row[p] and row[q]; then set pos[row[p]]
    = p and pos[row[q]] = q.
- id: lc-robot-bounded-in-circle
  role: ladder
  card: direct-simulation
  rung: 5
  twist: 'The process runs forever: reason about the state after one round of the instructions (Theorem
    0.3.1).'
  summary: A robot at (0, 0) facing north repeats a string of G (one step forward), L and R (quarter turns)
    forever (length ≤ 100); does it stay inside some circle?
  hints:
  - After one round of the instructions, the robot has some position and direction. What happens over
    the following rounds?
  - If it faces a new direction after one round, then after 4 rounds it is back at (0, 0) facing north,
    so its path repeats. If it faces north again, every round shifts it by the same vector.
  - Run the instructions once; return true exactly when the robot is back at (0, 0) or does not face north.
- id: cf-263A
  role: ladder
  card: grid-processing
  rung: 1
  twist: Base case of the card
  summary: A 5 by 5 matrix of zeros with a single 1; the fewest swaps of adjacent rows or adjacent columns
    that move the 1 to the centre.
  hints:
  - Does swapping two rows change the column of the 1?
  - 'No: row swaps move the 1 up or down by one, column swaps left or right by one, independently.'
  - Find the 1 at (r, c), 0-based, and print |r − 2| + |c − 2|.
- id: ac-abc075_b
  role: ladder
  card: grid-processing
  rung: 2
  twist: 'All eight neighbours: a direction array of eight offsets with a bounds check.'
  summary: An H by W grid (H, W ≤ 50) of bombs and empty squares; replace each empty square by the number
    of bombs among its eight neighbours.
  hints:
  - How do you visit the eight neighbours of (r, c) without writing eight if statements?
  - Loop over dr and dc from −1 to 1, skipping (0, 0), and check 0 ≤ r + dr < H and 0 ≤ c + dc < W before
    reading.
  - 'For each . cell count the # neighbours that pass the bounds check and write the count as a digit;
    keep # cells as they are.'
- id: ac-abc096_c
  role: ladder
  card: grid-processing
  rung: 3
  twist: A yes/no question about an operation turns into a check of each cell's four neighbours.
  summary: A target pattern of black squares on an H by W grid (H, W ≤ 50); you may only paint two side-adjacent
    squares black at a time (painting a square twice is allowed); can you make exactly the pattern?
  hints:
  - Which black squares of the target can never be painted?
  - A black square can be painted together with a neighbour exactly when one of its four side neighbours
    is black in the target; such pairs never touch a white square.
  - 'Answer Yes when every # has a # among its up, down, left and right neighbours inside the grid, otherwise
    No.'
- id: ac-abc107_b
  role: ladder
  card: grid-processing
  rung: 4
  twist: Decide which rows and columns to keep in one scan of the original grid, then print only those.
  summary: An H by W grid (H, W ≤ 100) of black and white squares with at least one black; remove every
    all-white row and every all-white column; print what is left.
  hints:
  - Does removing an all-white row change whether some column is all white?
  - 'No: a column keeps all its black squares. So the rows and columns to keep can be found from the original
    grid.'
  - 'keepRow[i] = row i has a #, keepCol[j] = column j has a #; print a[i][j] for kept i and kept j only.'
- id: lc-spiral-matrix
  role: ladder
  card: grid-processing
  rung: 5
  twist: A walker with a direction array that turns right when the next cell is outside or already visited.
  summary: The entries of an m by n matrix (m, n ≤ 10) in clockwise spiral order, starting at the top-left
    corner.
  hints:
  - Imagine a walker that records cells. What makes it turn?
  - It turns right when the next cell is outside the matrix or already visited, and it takes exactly m·n
    steps.
  - 'Directions right, down, left, up: dr = {0, 1, 0, −1}, dc = {1, 0, −1, 0}. At each of the m·n steps
    record and mark the cell; if the next cell fails the bounds or visited check, set d = (d + 1) % 4
    first.'
- id: cf-71A
  role: ladder
  card: string-processing
  rung: 1
  twist: Base case of the card
  summary: 'Abbreviate each of n words (n ≤ 100, length ≤ 100): a word longer than 10 letters becomes
    its first letter, the number of letters between, and its last letter.'
  hints:
  - What do you need to know about a long word to abbreviate it?
  - Only its first letter, its last letter and its length.
  - Print s when |s| ≤ 10, else s[0], then |s| − 2, then the last letter.
- id: ac-abc124_c
  role: ladder
  card: string-processing
  rung: 2
  twist: Only two valid final strings exist; count the mismatches against one of them in a single pass.
  summary: A row of tiles given as a 0/1 string (length ≤ 10^5); repaint as few tiles as possible so that
    neighbouring tiles differ.
  hints:
  - How many 0/1 strings of length n have all neighbouring characters different?
  - 'Exactly two: 0101… and 1010…. Each position mismatches exactly one of them.'
  - Count c, the positions where s[i] differs from i % 2; the answer is min(c, n − c).
