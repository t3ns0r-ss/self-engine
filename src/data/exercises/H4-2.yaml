  role: ladder
  type: estimate
  title: A stale read with one lagging replica
  prompt: N = 3, W = 1, R = 1. A write was acknowledged by one replica and has reached two of the three copies; the third lags. A read asks one replica chosen evenly at random. What is the probability that it returns the old value?
  card: quorum-replication
