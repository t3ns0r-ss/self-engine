# Patterns for topic 4.6 (LCA via binary lifting). Provisional until the lesson maps them to Recognition Cards.
topic: "4.6"
patterns:
  - id: kth-ancestor
    name: k-th ancestor
    description: Jump k levels up in O(log n) using ancestors at distances that are powers of two.
    precondition: The 2^(j+1)-th ancestor is the 2^j-th ancestor of the 2^j-th ancestor.
  - id: lca-query
    name: Lowest common ancestor queries
    description: For many pairs, find the deepest vertex that is an ancestor of both.
    precondition: After lifting the deeper vertex to the same depth, "ancestors differ" is monotone in the jump length.
  - id: path-length
    name: Distances in a tree
    description: dist(u, v) = depth(u) + depth(v) − 2 · depth(lca(u, v)), with weighted depths if edges have weights.
    precondition: There is exactly one path between two vertices of a tree, and it passes through their lowest common ancestor.
  - id: path-aggregate
    name: Aggregates and updates on paths
    description: Store, with each power-of-two jump, the aggregate of the edges it covers, and combine jumps along a path. Variant — offline additions on many u–v paths use +1 at u and v and −1 at the meeting vertex and its parent, then a sum over subtrees.
    precondition: The aggregate is associative (minimum, maximum, sum), so it combines over consecutive jumps.
