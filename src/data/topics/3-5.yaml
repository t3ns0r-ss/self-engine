  hints:
  - Which N can be reached at all, and what describes the state of the process?
  - Only N = 2^a 3^b 5^c can be reached. The state is the exponents (a, b, c) still needed; the rolls
    2, 3, 4, 5, 6 lower them, and a roll that goes too far leads to probability 0.
  - P(a,b,c) = (1/5) times the sum over the five rolls other than 1 (the roll of 1 repeats the state,
    so it is divided out), with P(0,0,0) = 1. Use the inverse of 5 modulo the prime and memoise about
