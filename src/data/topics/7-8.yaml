drill:
- problem: lc-24-game
  answer:
    topic: '3.1'
    card: generate-all
  property: 'There are only four cards: pick an ordered pair, replace it by the result of one operation
    and recurse on three numbers, then two, then one. The number of cases is a few thousand.'
  why_others_fail: No formula or fast structure exists; the budget allows listing everything.
- problem: ac-abc136_e
  answer:
    topic: '2.1'
    card: trial-division
  property: The sum S never changes, so the final gcd divides S ≤ 5·10^8; list the divisors of S by trial
    division up to √S, and test each divisor with the sorted residues.
  why_others_fail: The gcd is not found by a greedy or a binary search (the answer is not monotone in
    d); the divisor list is small enough to test every one.
- problem: lc-minimum-one-bit-operations-to-make-integers-zero
  answer:
    topic: '1.7'
    card: high-bit-first
  property: 'The operations clear the highest set bit through a fixed pattern: clearing 2^k costs 2^(k+1)
    − 1, so f(n) = (2^(k+1) − 1) − f(n − 2^k), handled bit by bit from the top.'
  why_others_fail: A breadth-first search over numbers up to 10^9 is impossible; the answer comes from
    the structure of the bits.
- problem: ac-abc237_f
  answer:
    topic: '3.4'
    card: lis
  property: A DP over positions with the three smallest tails of the increasing subsequences of lengths
    1, 2 and 3 as the state (values up to 10, so at most 11³ states).
  why_others_fail: Counting sequences by their longest increasing subsequence needs the tails of the patience-sorting
    state, not only the length.
- problem: cf-1107E
  answer:
    topic: '3.6'
    card: first-element-match
  property: 'dp[l][r][k]: the best score for the substring l … r when k extra equal characters are glued
    to the front: either delete the glued block now or merge it with a later equal character.'
  why_others_fail: The choice of what to delete first changes the later blocks, so a greedy fails; the
    interval DP with the extra count tries both.
- problem: ac-abc194_f
  answer:
    topic: '3.8'
    card: count-up-to-n
  property: Digits of N are scanned from the top with a flag for being below N; once below, only the number
    of distinct digits used matters (c ways to repeat, 16 − c ways to add a new one).
  why_others_fail: N has 2·10^5 hexadecimal digits, so numbers cannot be listed; the count depends on
    the tight prefix and the number of distinct digits.
- problem: lc-minimum-cost-to-convert-string-ii
  answer:
    topic: '4.3'
    card: every-pair
  property: Every rule string is a vertex; conversions keep the length, so Floyd–Warshall per length gives
    the least cost between any two strings; a DP over positions then chooses the blocks.
  why_others_fail: 'One Dijkstra from the source string does not exist: the source is cut into many pieces,
    and each piece needs the cost between any two rule strings.'
- problem: lc-tree-of-coprimes
  answer:
    topic: '4.5'
    card: depths-parents
  property: A DFS from the root keeps, for each value 1 … 50, the deepest ancestor on the current path
    with that value; the answer for a node is the deepest of the values coprime to its own.
  why_others_fail: Values are at most 50, so 50 stacks along the path are enough; a general ancestor query
    structure would be heavier than needed.
- problem: cf-1062E
  answer:
    topic: '4.6'
    card: meeting-vertex
  property: The lowest common ancestor of a set is the one of its vertices with the smallest and the largest
    entry time; removing one employee helps only if it is one of those two, so try both.
  why_others_fail: Trying every removal costs the range size per query; only two candidates matter.
- problem: cf-446C
  answer:
    topic: '5.3'
    card: lazy-range-update
  property: A Fibonacci-like sequence is fixed by its first two terms and such sequences add; keep the
    pair (a, b) as the lazy tag of a segment tree node and shift it when pushing to the right child.
  why_others_fail: A difference array cannot add a Fibonacci sequence to a segment, and a plain Fenwick
    tree cannot hold the pair tag.
- problem: cf-13E
  answer:
    topic: '5.4'
    card: sqrt-blocks
  property: 'The updates change one hole, and the jumps are long chains: cut the row into blocks of √n,
    store for each hole the first position outside the block and the number of jumps, and rebuild one
    block per update.'
  why_others_fail: A segment tree has no simple merge for the "jump out of the block" function; the blocks
    give O(√n) for both operations.
- problem: ac-abc373_f
  answer:
    topic: '3.3'
    card: bounded
  property: For a type, taking k items has the marginal gain v − (2k − 1), which decreases, so the best
    way for each count and weight is taken greedily; then a knapsack over the weights with the harmonic
    sum of counts.
  why_others_fail: A plain 0/1 or unbounded knapsack ignores the diminishing values; the concave marginal
    gains allow the grouped form.
lookalike_pairs:
- a: cf-19C
  b: cf-149E
  a_tool:
    topic: '6.1'
    card: substring-compare
  b_tool:
    topic: '6.2'
    card: z-compare
  shared_surface: Both give a long string and ask about pieces of it that must be equal to others, with
    answers that depend on where those pieces are.
  flipping_difference: In Deletion of Repeats the candidates are many short blocks compared with each
    other at arbitrary places, and each comparison is "are these two blocks equal", so hashing answers
    it in one step. In Martian Strings the same few words are matched against the text from its two ends,
    and the questions are "where does the longest prefix of this word end", which the Z-function of a
    word joined with the text answers for all positions at once.
  flipping_input: 'A single pattern of length 1000 searched in a text of length 10^5: hashing every block
    and comparing is possible but the Z-function gives all matching lengths in one pass.'
- a: lc-strange-printer-ii
  b: cf-776D
  a_tool:
    topic: '4.2'
    card: directed-cycle
  b_tool:
    topic: '4.7'
    card: mutual-reach
  shared_surface: Both turn the statement into a directed graph on small objects (colours, switches) and
    ask whether the conditions can all hold together.
  flipping_difference: In the printer problem each colour must be printed before or after another, and
    the answer is "yes" exactly when the graph of these "before" relations has no directed cycle. In the
    doors problem every door fixes the relation between two switches, an equality or an inequality, and
    the answer is "yes" when no switch is forced to differ from itself; this is found by the strongly
    connected components of the implication graph (or a union-find with parity).
  flipping_input: A cycle of three colours ("before" relations) is impossible; a cycle of three switches
    with three equal-or-different relations may well be possible, depending on the parity of the "different"
    ones.
self_test:
- q: A problem gives n ≤ 2·10^5 and asks for the number of pairs (i, j) with a_i + a_j = x. Write the
    budget line, the candidate tools and the property you check.
  a: 'Budget: n log n or n. Candidates: a hash map of counts (topic 0.6), sorting with two pointers (topics
    1.1 and 1.3). The property to check: equal values and the pair of the same value with itself (x =
    2a), which changes the count by a half.'
- q: What is the difference between a weak signal and a decisive property? Give the weak signal and the
    decisive property for the card "shrinkable window".
  a: 'A weak signal is wording that suggests a few tools and proves nothing. The decisive property is
    the precondition of the correctness proof. For the window: the signal is "longest contiguous segment
    with …"; the property is that shrinking a valid window keeps it valid.'
- q: A problem asks for the longest subarray with sum equal to k and the values can be negative. Which
    card is ruled out, and which one is chosen instead?
  a: The shrinkable window is ruled out (a longer window can be valid after a shorter one fails, because
    the values can be negative). Use prefix sums with a map from the sum to its first index.
- q: Two problems both ask for the number of paths in a graph with n ≤ 100 vertices. In the first the
    paths have exactly k ≤ 10^9 edges and repeats are allowed; in the second the graph is acyclic with
    10^5 vertices. What is used in each?
  a: 'The first: the k-th power of the adjacency matrix (topic 7.6, walk counting). The second: a DP in
    topological order (topic 7.2, count paths). The matrix would cost 10^15 in the second, and a topological
    DP does not exist for a general graph with repeated vertices.'
- q: You have used 40 minutes on a problem and your first tool gave a wrong answer on the sample. What
    do you log, and what is your next step?
  a: Log it as a Recognition miss with the tool tried. Go back to the constraints, list the other candidates,
    check the decisive property of each on the actual statement (negative values? repeated items? huge
    index?), and choose again before writing code.
- q: Why is "I recognise the topic from the contest name" not allowed in this topic, and what replaces
    it?
  a: 'The topic is hidden in a contest, so a habit that depends on the name does not carry over. The routine
    replaces it: budget from the constraints, candidates from the question form, then the property check.'
