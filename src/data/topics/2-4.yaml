decision_map:
- weak_signal: Whether three points turn left or right, whether two segments touch, twice the area of
    a polygon, the lattice points of a polygon, or whether a point is inside a polygon, with integer coordinates
    up to 10^9
  choose: cross-sign
  when: Everything the question needs is the sign or the value of cross products of integer coordinate
    differences (Theorems 2.4.1 to 2.4.4).
  over:
  - topic: '1.1'
    card: sort-then-scan
    because: If the objects are side lengths and not points, the triangle inequality after a sort answers
      it.
  - topic: '0.6'
    card: set-membership
    because: If the rectangles or lines are parallel to the axes, a set of points answers it.
  - topic: '1.2'
    card: prefix-2d
    because: If the coordinates are small (up to about 1000), a table of cells counts points and areas.
  - topic: '2.4'
    card: sorted-sweep
    because: If there are thousands of points and the question is the fence or the nearest pair, the points
      are sorted and swept.
- weak_signal: The fence around all the points, the smallest convex region, or the smallest distance between
    two of n points
  choose: sorted-sweep
  when: The points are fixed, can be sorted by x, and a stack or a window with a proof of what can be
    dropped answers the question (Theorems 2.4.5 and 2.4.6).
  over:
  - topic: '1.2'
    card: prefix-extremes
    because: If the distance is the Manhattan distance, the largest and smallest of x + y and x − y give
      the farthest pair.
  - topic: '1.1'
    card: sort-then-scan
    because: If the points are on one line (numbers), the closest pair is a pair of neighbours after sorting.
  - topic: '2.4'
    card: cross-sign
    because: If there is a single polygon or a single pair of segments, no sorting is needed.
