# Patterns for topic 4.8 (Basic geometry). Cards of the lesson: cross-sign and sorted-sweep; no-geometry holds the look-alike partners and the drill problems that look geometric but are answered by a tool of an earlier topic.
topic: "4.8"
patterns:
  - id: cross-sign
    name: Sides, segments, areas and polygons from cross products
    description: Three points are on one line, turn left or turn right; two segments touch or cross; a polygon has an area (as twice the area) and lattice points; a point is inside, on the border of or outside a polygon. Every test is the sign or the value of a cross product of integer coordinate differences.
    precondition: The coordinates are integers small enough that cross products fit in 64 bits (about 10^9), and the question depends only on sides of lines and on areas.
  - id: sorted-sweep
    name: Convex hull or closest pair by one sorted pass
    description: The points are sorted by x and swept once; a stack that drops points making a right turn gives the convex hull, and a window of recent points kept in a set by y gives the closest pair.
    precondition: The points do not change between the questions, and a point that leaves the stack or the window can never matter again.
  - id: no-geometry
    name: Looks like geometry, but a tool of an earlier topic is enough
    description: The statement has points, distances, triangles or rectangles, but the shapes are axis-parallel, the distance splits by axis, the numbers are lengths and not points, or the size is tiny, so sorting, counting with a set or brute force answers it.
    precondition: No question about the side of a line, an area or the boundary of a polygon is asked, or the input is small enough for brute force.
