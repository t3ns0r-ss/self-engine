# Patterns for topic 3.8 (Digit DP). Provisional until the lesson maps them to Recognition Cards.
topic: "3.8"
patterns:
  - id: count-up-to-n
    name: Count numbers up to N
    description: Count x in [L, R] with a digit property as f(R) − f(L − 1), walking the digits from the most significant.
    precondition: The property can be checked left to right while keeping a small state, plus a flag saying whether the prefix still equals N's prefix.
  - id: digit-sum-state
    name: Digit sums and remainders
    description: The property involves the digit sum or the remainder modulo a small k.
    precondition: The state (position, tight flag, sum or remainder) has few values.
  - id: neighbour-digits
    name: Rules on neighbouring digits
    description: Adjacent digits must differ, or a digit pattern is forbidden; leading zeros need care.
    precondition: The state includes the previous digit and whether a non-zero digit has started.
  - id: digit-aggregate
    name: Totals over a range
    description: Sum over [L, R] of a digit-based quantity (total of digit sums), with dp returning a count and a sum together.
    precondition: The quantity is additive over digits, so each state can return (count, total).
