decision_map:
- weak_signal: A grid; move right and down (or one row per step); count paths or find the best sum
  choose: grid-paths
  when: Moves never lead back, so reading order fills the cells; count = sum over the cells a move comes
    from, best = min or max over them (Theorem 3.5.1).
  over:
  - card: bijection-paths
    because: Without obstacles the count is one binomial coefficient; the table is needed once cells are
      blocked or values matter.
    topic: '2.3'
  - card: generate-all
    because: Backtracking over paths is for small grids where moves can go in all directions and cells
      may not repeat.
    topic: '3.1'
- weak_signal: Count strings or sequences of length n with a local rule, modulo a prime
  choose: sequence-counting
  when: The rule looks only at a small summary of the prefix (last element, run length, remainder, a flag)
    that the prefix determines (Theorem 3.5.2).
  over:
  - card: product-sum-rules
    because: When each position has the same number of choices whatever came before, the count is a product;
      a state table is needed when the choices depend on the past.
    topic: '2.3'
  - card: linear-state
    because: 3.2 tables count by a single index; adding the summary of the prefix as a second index is
      the step this card adds.
    topic: '3.2'
- weak_signal: The number of ways to reach a total with given step sizes or parts
  choose: partition-counting
  when: Decide whether order matters (totals outside for ordered sums, parts outside for unordered) and
    handle "at least one" as all minus none (Theorem 3.5.3).
  over:
  - card: unbounded
    because: It is the same counting knapsack; this card adds the order question and the conditions on
      the parts.
    topic: '3.3'
  - card: stars-bars
    because: Stars and bars counts sums with any part sizes; limited or special parts need the table.
    topic: '2.3'
- weak_signal: 'Each entry adds up many earlier entries: a share between 0 and a_i, jumps of lengths in
    a range, a neighbour within distance d'
  choose: range-sum-transition
  when: The entries added form a contiguous range of an earlier row, so prefix sums make each entry O(1)
    (Theorem 3.5.4).
  over:
  - card: window-deque
    because: If the transition takes a minimum or maximum over the window, subtraction does not work;
      a deque does.
    topic: '1.6'
  - card: range-sum
    because: Prefix sums of a fixed array answer range queries; here the array is the DP row being built.
    topic: '1.2'
- weak_signal: The probability or the expected number of steps of a random process whose next step depends
    only on a small state
  choose: probability-dp
  when: Each step has a known probability depending on the current state only, and the states have an
    acyclic order, so every entry is a weighted sum of earlier (forward) or later (backward) entries (Theorem
    3.5.5).
  over:
  - card: product-sum-rules
    because: If the event is built from independent choices that multiply (at least one, none, all), a
      product or a complement gives it with no table.
    topic: '2.3'
  - card: indicator-linearity
    because: An expected count that is a sum of single events needs one probability per event, not a table
      over states.
    topic: '2.4'
