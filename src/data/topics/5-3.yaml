  hints:
  - A query has two lower bounds. Fix one of them by sorting.
  - Sort the indices by nums1 from large to small and the queries by x from large to small; insert an
    index when its nums1 is at least x.
  - Keep a tree over the compressed values of nums2 that stores the best sum; the answer is the maximum
    over the values at least y (a suffix query).
- id: ac-abc382_f
  role: ladder
