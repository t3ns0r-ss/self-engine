# Topic 1.7 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.7"
draft: true
cards:
  - id: xor-identities
    name: XOR cancellation
    decisive_property: "The values are combined with XOR, which ignores order and cancels every value that appears twice (x ⊕ x = 0); so pairs vanish, a missing or unique value is the XOR of everything, and an equation x ⊕ y = z is solved by x = y ⊕ z."
    from_theorem: Theorem 1.7.1
    how_to_test: Write the quantity as one XOR of all terms and ask which terms appear an even number of times; those cancel.
    weak_signals:
      - '"Every element appears twice except one", "the missing number"'
      - An array was encoded as XORs of neighbours or of a hidden value; recover it
      - The XOR of all pairs, triples or pairings of two arrays
    kill_signals:
      - The values are combined by addition, AND or OR, which do not cancel
      - Elements appear three times (XOR cancels only pairs; count each bit instead)
    lookalikes:
      - description: Every element appears three times except one
        needs: per-bit-contribution (1.7)
        flipping_difference: Three copies do not cancel under XOR; count each bit modulo 3 instead.
    complexity: O(n).
  - id: prefix-xor
    name: XOR of subarrays from prefix values
    decisive_property: "The question is about the XOR of contiguous subarrays; the XOR of a[l..r] is P_r ⊕ P_(l−1), so ranges are answered in O(1) and subarrays with XOR k are pairs of prefix values with P_i = P_j ⊕ k, counted with a map."
    from_theorem: Theorem 1.7.2
    how_to_test: Check that the condition is on the XOR of a contiguous range and equals a fixed value (or is 0); then it is a condition on two prefix values.
    weak_signals:
      - XOR of a range a[l..r], many queries, no updates
      - Subarrays or substrings whose XOR is 0 or k; letters that appear an even number of times
      - Two adjacent parts of a subarray with equal XOR
    kill_signals:
      - The array changes between queries (later topics)
      - The XOR must be at most k, or the largest XOR of a subarray is asked (binary trie, topic 6.3)
    lookalikes:
      - description: Count subarrays whose sum is k
        needs: prefix-count-lookup (1.2)
        flipping_difference: Sums use P_j − P_i and XOR uses P_j ⊕ P_i; the counting with a map is the same.
    complexity: O(n log n) with a map, O(n) with an array when values are small.
  - id: per-bit-contribution
    name: One bit at a time
    decisive_property: "The total is a sum over many pairs, subarrays or subsets of a bitwise result (XOR, AND, OR); each bit of the result depends only on that bit of the operands, so the total is Σ 2^b times the number of terms whose bit b is set, a count per bit."
    from_theorem: Theorem 1.7.3
    how_to_test: Fix one bit b and ask whether the number of terms with bit b set can be counted from bit b of the inputs alone.
    weak_signals:
      - Sum of XOR, AND or OR over all pairs or all subarrays, n up to 2·10^5
      - '"Total Hamming distance", the number of differing bits over all pairs'
      - The largest group whose AND is not zero; an element that appears k times while others appear m times
    kill_signals:
      - The quantity involves addition between the elements (carries mix the bits)
      - Only one pair or subarray is asked for (no sum over many terms)
    lookalikes:
      - description: The largest XOR of one pair, instead of the sum over all pairs
        needs: high-bit-first (1.7)
        flipping_difference: A maximum is decided from the top bit down; a sum adds every bit's count.
    complexity: O(n · B) for B bits (B = 30 or 60).
  - id: high-bit-first
    name: Highest bit first
    decisive_property: "A value built from bits is to be maximised or minimised; bit b is worth more than all lower bits together (2^b > 2^b − 1), so the best value is decided from the highest bit down, keeping a bit whenever some valid choice with the bits already fixed allows it."
    from_theorem: Theorem 1.7.4
    how_to_test: Fix the higher bits as decided and check that you can tell, for the next bit, whether a valid choice with that bit set exists.
    weak_signals:
      - '"Maximise the XOR / AND", "the smallest x such that …" with x ≤ K'
      - Choose x (in a range, or with a given popcount) to optimise an expression in x
      - The answer is compared by its highest differing bit, such as lexicographically by bits
    kill_signals:
      - The objective is a sum over many terms (count per bit instead)
      - Elements are inserted and queried online (binary trie, topic 6.3)
    lookalikes:
      - description: The XOR of a value with each element of a growing set, maximised after every insertion
        needs: a later topic (6.3)
        flipping_difference: Online queries need the bit tree; offline, the prefixes can be checked with a set as the greedy goes down the bits.
    complexity: O(B · n) or O(B · n log n) for B bits.
  - id: bit-identities
    name: Sum and bit identities
    decisive_property: "The statement mixes addition with AND, OR or XOR; a + b = (a ⊕ b) + 2(a & b) and a | b = (a ⊕ b) + (a & b), and x & (x − 1), x & −x act on the lowest set bit, so the unknowns are rebuilt bit by bit with no search."
    from_theorem: Theorem 1.7.5
    how_to_test: Rewrite the condition with the identities and check that each bit of the unknown is forced (or free) independently.
    weak_signals:
      - Given a + b and a ⊕ b (or a & b), find a and b
      - '"Is it a power of two", count the 1 bits, the lowest set bit'
      - Make a | b equal c with the fewest bit flips; operations that only clear bits
    kill_signals:
      - The operation is repeated many times with carries between steps (simulate, or find a cycle)
    lookalikes:
      - description: Find the pair with the largest a ⊕ b among given numbers
        needs: high-bit-first (1.7)
        flipping_difference: With a and b chosen from a list, there is no identity to solve; the top bits are decided greedily.
    complexity: O(B) per value.
problems:
  - id: ac-abc171_e
    role: worked_example
    summary: N (even) hidden integers; a_i is the XOR of all of them except the i-th; recover them.
  - id: ac-abc356_d
    role: worked_example
    summary: The sum of popcount(k AND M) over k = 0..N, for N, M < 2^60, modulo 998244353.
  - id: lc-missing-number
    role: ladder
    card: xor-identities
    rung: 1
    twist: Base case of the card
    summary: n distinct numbers from 0..n (n ≤ 10^4); exactly one is missing; find it.
    hints:
      - XOR together the numbers 0..n and the numbers in the array. What survives?
      - Every present number appears twice and cancels (Theorem 1.7.1, part 4); only the missing one appears once.
      - "x = 0; for i in 0..n−1: x ^= i ^ nums[i]; then x ^= n. Return x."
  - id: cf-1421A
    role: ladder
    card: xor-identities
    rung: 2
    twist: An x to choose, whose best value comes from comparing the two terms bit by bit.
    summary: "For each of t tests: given a and b (≤ 10^9), the smallest value of (a ⊕ x) + (b ⊕ x) over all x ≥ 0."
    hints:
      - Look at one bit. What do the two terms contribute at that bit, for each choice of x's bit?
      - "If a and b agree at the bit, x can make both 0; if they differ, exactly one term has the bit whatever x is. So the minimum is a ⊕ b."
      - "Print a ^ b (take x = a & b)."
  - id: lc-find-the-original-array-of-prefix-xor
    role: ladder
    card: xor-identities
    rung: 3
    twist: Undo a prefix XOR, the reverse of building one.
    summary: Given pref with pref[i] = arr[0] ⊕ … ⊕ arr[i] (n ≤ 10^5), recover arr.
    hints:
      - How do pref[i] and pref[i − 1] differ?
      - "pref[i] = pref[i − 1] ⊕ arr[i]; XOR both sides with pref[i − 1] (Theorem 1.7.1, part 3)."
      - "arr[0] = pref[0] and arr[i] = pref[i] ^ pref[i − 1]."
  - id: ac-abc121_d
    role: ladder
    card: xor-identities
    rung: 4
    twist: A range of 10^12 consecutive integers, too many to XOR one by one.
    summary: The XOR of all integers from A to B (0 ≤ A ≤ B ≤ 10^12).
    hints:
      - Write the answer with two XORs of the form 0 ⊕ 1 ⊕ … ⊕ n.
      - "0 ⊕ … ⊕ n is n, 1, n + 1 or 0 by n mod 4 (Section 4.1); the range is f(B) ⊕ f(A − 1)."
      - "Handle A = 0 separately, and use long long."
  - id: cses-1650
    role: ladder
    card: prefix-xor
    rung: 1
    twist: Base case of the card
    summary: n ≤ 2·10^5 values and q ≤ 2·10^5 queries; print the XOR of each range [a, b].
    hints:
      - What plays the role of prefix sums for XOR?
      - "P_0 = 0, P_i = P_(i−1) ⊕ x_i; the range is P_b ⊕ P_(a−1) (Theorem 1.7.2)."
      - "Build P once in O(n) and answer every query in O(1) with fast input and output."
  - id: lc-count-triplets-that-can-form-two-arrays-of-equal-xor
    role: ladder
    card: prefix-xor
    rung: 2
    twist: Two adjacent parts with equal XOR mean the whole range has XOR 0.
    summary: Count triples i < j ≤ k (n ≤ 300) where the XOR of arr[i..j−1] equals the XOR of arr[j..k].
    hints:
      - If a = b, what is a ⊕ b, and which range has that XOR?
      - "a = b exactly when a ⊕ b = 0, that is, when arr[i..k] has XOR 0, so P_i = P_(k+1). Then every j in (i, k] works."
      - "For every pair i < k + 1 with equal prefix values, add k − i. O(n²) is fine here."
  - id: lc-find-the-longest-substring-containing-vowels-in-even-counts
    role: ladder
    card: prefix-xor
    rung: 3
    twist: The XORed values are bitmasks of letter parities, and the longest range is asked instead of a count.
    summary: The longest substring of a string (length ≤ 5·10^5) in which each vowel appears an even number of times.
    hints:
      - Keep one bit per vowel. What does the XOR of these bits over a substring say?
      - "Each bit is the parity of that vowel's count. All vowels are even exactly when the prefix masks at both ends are equal (Theorem 1.7.2)."
      - "Store the first position of each of the 32 masks (mask 0 at position −1); for each position, the answer is the distance to the first occurrence of its mask."
  - id: lc-sum-of-all-subset-xor-totals
    role: ladder
    card: per-bit-contribution
    rung: 1
    twist: Base case of the card
    summary: The sum of the XOR of every subset of an array (n ≤ 12).
    hints:
      - For one bit b present in some element, in how many subsets is it set in the XOR?
      - "In exactly half of them: pair each subset with the one that toggles a fixed element having bit b."
      - "Answer: (OR of all elements) · 2^(n−1). A loop over all 2^n subsets (topic 0.5) also fits."
  - id: lc-total-hamming-distance
    role: ladder
    card: per-bit-contribution
    rung: 2
    twist: The quantity per pair is the number of differing bits, so every bit counts 1, not 2^b.
    summary: The sum of the Hamming distances (number of differing bits) over all pairs of n ≤ 10^4 integers.
    hints:
      - For one bit, how many pairs differ there?
      - "c · (n − c), where c is the number of values with that bit (Theorem 1.7.3)."
      - "Sum c · (n − c) over the 30 bits."
  - id: cf-1615B
    role: ladder
    card: per-bit-contribution
    rung: 3
    twist: Per-bit counts over a range of consecutive integers, many times, using prefix counts.
    summary: "For each of t tests: from the integers l, l + 1, …, r (r ≤ 2·10^5), delete as few as possible so that the AND of the rest is non-zero."
    hints:
      - When is an AND non-zero? Think of one bit.
      - "When some bit is set in every number kept. For each bit, keep the numbers in [l, r] that have it and delete the rest."
      - "Precompute, for each bit, prefix counts over 1..2·10^5 (topic 1.2); the answer is (r − l + 1) minus the largest count in [l, r]."
  - id: lc-minimize-xor
    role: ladder
    card: high-bit-first
    rung: 1
    twist: Base case of the card
    summary: Find x with the same number of set bits as num2 that makes x ⊕ num1 as small as possible (values ≤ 10^9).
    hints:
      - Which bits of num1 should x cancel first?
      - "The highest ones: cancelling bit b saves more than all lower bits together (Theorem 1.7.4)."
      - "Put x's bits on num1's set bits from the top down; if bits remain, put them on num1's zero bits from the bottom up."
  - id: cf-1420B
    role: ladder
    card: high-bit-first
    rung: 2
    twist: A comparison of two expressions, decided by the highest bit of each value.
    summary: "For each of t tests: count pairs i < j with a_i & a_j ≥ a_i ⊕ a_j (total n ≤ 10^5)."
    hints:
      - Compare the two sides at the highest bit set in either number.
      - "If both numbers have the same highest bit, the AND has it and the XOR does not; otherwise the XOR has it and the AND does not (Theorem 1.7.4)."
      - "Count the numbers by their highest set bit; add c(c − 1)/2 per group, in long long."
  - id: lc-maximum-xor-of-two-numbers-in-an-array
    role: ladder
    card: high-bit-first
    rung: 3
    twist: The best bit at each step needs a pair, checked with a set of prefixes.
    summary: The largest nums[i] ⊕ nums[j] with i ≤ j, for n ≤ 2·10^5 values below 2^31.
    hints:
      - Decide the answer's bits from the top. With the higher bits fixed, how do you check whether bit b can be 1?
      - "Look at the top bits of every number (x >> b). The candidate answer t is reachable if some prefix p has p ⊕ t also among the prefixes (Theorem 1.7.1, part 3)."
      - "For b from 30 down: t = (ans << 1) | 1 on the shifted scale; put all x >> b in a set and keep the bit if some p ^ t is in it."
  - id: lc-power-of-two
    role: ladder
    card: bit-identities
    rung: 1
    twist: Base case of the card
    summary: Is the integer n (−2^31 ≤ n < 2^31) a power of two?
    hints:
      - How many bits does a power of two have?
      - One. And x & (x − 1) clears the lowest set bit (Theorem 1.7.5, part 2).
      - "Return n > 0 && (n & (n − 1)) == 0; use long long or check n > 0 first."
  - id: lc-counting-bits
    role: ladder
    card: bit-identities
    rung: 2
    twist: Popcounts of all numbers 0..n at once, each from an earlier one.
    summary: Return the number of 1 bits of every integer from 0 to n (n ≤ 10^5), in O(n).
    hints:
      - Which smaller number has almost the same bits as i?
      - "i >> 1 (drop the lowest bit) or i & (i − 1) (drop the lowest set bit)."
      - "ans[i] = ans[i >> 1] + (i & 1), or ans[i] = ans[i & (i − 1)] + 1."
  - id: cf-1559A
    role: ladder
    card: bit-identities
    rung: 3
    twist: An operation that can only clear bits; the question is which bits must survive.
    summary: "For each of t tests: an operation replaces elements of a chosen interval by ANDs of mirrored pairs; the smallest possible maximum after any number of operations (n ≤ 100)."
    hints:
      - Can an AND ever set a bit? Which bits can never be cleared from an element?
      - "AND only clears bits. Bits present in every element survive everywhere; every other bit can be cleared from every element."
      - "Print the AND of all elements."
  - id: lc-minimum-flips-to-make-a-or-b-equal-to-c
    role: ladder
    card: bit-identities
    rung: 4
    twist: The bits are independent, and each bit's cost depends on the operator's rule.
    summary: The fewest single-bit flips in a and b so that a | b = c (values ≤ 10^9).
    hints:
      - Look at one bit at a time; what must change there?
      - "If c's bit is 1, at least one of a, b must have it: 1 flip if neither does. If c's bit is 0, both must be 0."
      - "Add, per bit: c_b = 1 → (a_b | b_b) == 0; c_b = 0 → a_b + b_b."
  - id: ac-abc238_d
    role: ladder
    card: bit-identities
    rung: 5
    twist: Existence of x, y from their AND and their sum, for up to 10^5 cases.
    summary: For T ≤ 10^5 pairs (a, s) below 2^60, do non-negative x, y exist with x & y = a and x + y = s?
    hints:
      - Write x + y with XOR and AND (Theorem 1.7.5).
      - "x + y = (x ⊕ y) + 2a, so x ⊕ y = s − 2a, which must be ≥ 0 and share no bit with a."
      - "Yes exactly when s ≥ 2a and ((s − 2a) & a) == 0; use long long (2a < 2^61 fits)."
  - id: cf-1325D
    role: ladder
    card: bit-identities
    rung: 6
    twist: Build the shortest array with a given XOR and sum, not just decide.
    summary: The shortest array of non-negative integers whose XOR is u and whose sum is v (u, v ≤ 10^18), or −1.
    hints:
      - Which necessary conditions follow from sum = XOR + 2·(carries)?
      - "u ≤ v and v − u even; otherwise −1. If u = v, the array is [u] (or empty when u = 0)."
      - "With d = (v − u)/2: three elements [u, d, d] always work; two elements [u ⊕ d, d] work exactly when u & d = 0 (Theorem 1.7.5)."
  - id: cf-1527A
    role: drill
    summary: "For each of t tests: the largest k such that n & (n − 1) & … & k = 0 (n ≤ 10^9)."
  - id: ac-abc347_d
    role: drill
    summary: Find X, Y below 2^60 with popcount(X) = a, popcount(Y) = b and X ⊕ Y = C, or −1.
  - id: ac-abc261_e
    role: drill
    summary: N ≤ 2·10^5 operations "X = X and A", "X = X or A", "X = X xor A"; starting from C, apply operations 1..i for each i in turn, carrying X over, and print X after each.
  - id: ac-abc349_d
    role: drill
    summary: Split the integers L..R−1 (R ≤ 2^60) into the fewest blocks of the form [2^i·j, 2^i·(j + 1)).
  - id: cses-3426
    role: drill
    summary: An array of n ≤ 10^7 generated values; the XOR of the XORs of all windows of k elements.
  - id: lc-sum-of-two-integers
    role: drill
    summary: Add two integers in [−1000, 1000] without using + or −.
  - id: cf-1514B
    role: drill
    summary: "For each of t tests: count arrays of n integers in [0, 2^k) whose AND is 0 and whose sum is as large as possible, modulo 10^9 + 7."
  - id: lc-maximum-xor-for-each-query
    role: drill
    summary: For a sorted array and maximumBit, repeatedly pick k < 2^maximumBit maximising (XOR of the array) ⊕ k, then remove the last element (n ≤ 10^5).
  - id: lc-binary-subarrays-with-sum
    role: drill
    summary: Count the subarrays of a 0/1 array (n ≤ 3·10^4) whose sum is goal.
  - id: ac-abc384_d
    role: drill
    summary: An infinite sequence repeats N positive values; does some contiguous part sum to S (S ≤ 10^18)?
  - id: cses-1631
    role: drill
    summary: Two people must each read all n books, one book at a time and never the same book at once; the least total time.
  - id: lc-single-number
    role: lookalike
    summary: Every element of an array appears twice except one; find it in O(n) time and O(1) extra space.
  - id: lc-single-number-ii
    role: lookalike
    summary: Every element of an array appears three times except one; find it in O(n) time and O(1) extra space.
  - id: ac-abc147_d
    role: lookalike
    summary: The sum of A_i ⊕ A_j over all pairs i < j, for N ≤ 3·10^5 values below 2^60, modulo 10^9 + 7.
  - id: ac-abc365_e
    role: lookalike
    summary: The sum of the XORs of all subarrays of length at least 2, for N ≤ 2·10^5 values up to 10^8.
drill:
  - problem: cf-1527A
    answer_card: high-bit-first
    answer_topic: "1.7"
    property: "The AND keeps n's highest bit until a number without it appears; the first such number counting down is 2^h − 1, and it clears every bit at once."
    why_others_fail: Simulating the AND from n downwards takes up to 10^9 steps per test; only the highest bit matters.
  - problem: ac-abc347_d
    answer_card: bit-identities
    answer_topic: "1.7"
    property: "Where C has a 1, exactly one of X, Y has the bit; where C has a 0, both or neither. So popcount(C) bits are split, and (a + b − popcount(C)) / 2 extra bits are shared on zeros of C; check parity and that enough positions exist."
    why_others_fail: Searching X and Y is impossible below 2^60; each bit's role is fixed by C, so only counts matter.
  - problem: ac-abc261_e
    answer_card: per-bit-contribution
    answer_topic: "1.7"
    property: "Each bit of X evolves on its own: for each bit, keep what the composed operations so far do to a 0 and to a 1, and apply that to X's current bit."
    why_others_fail: Replaying operations 1..i for every i is O(N²); bits do not interact under and, or and xor.
  - problem: ac-abc349_d
    answer_card: high-bit-first
    answer_topic: "1.7"
    property: "From the current l, take the largest aligned block [l, l + 2^i) that does not pass R, where 2^i divides l; a larger block covers more and is never worse."
    why_others_fail: R reaches 2^60, so the numbers cannot be walked one by one; the block sizes are powers of two decided from the top.
  - problem: cses-3426
    answer_card: prefix-xor
    answer_topic: "1.7"
    property: "The XOR of a window is a running XOR: XOR in the entering value and XOR out the leaving one (they cancel), as with prefix values."
    why_others_fail: "A deque (topic 1.6) keeps a maximum; XOR needs no deque because it can be undone."
  - problem: lc-sum-of-two-integers
    answer_card: bit-identities
    answer_topic: "1.7"
    property: "a + b = (a ⊕ b) + 2(a & b): repeat with a ⊕ b and (a & b) << 1 until the carry is 0."
    why_others_fail: There is nothing to search or count; the sum identity is the whole solution.
  - problem: cf-1514B
    answer_card: per-bit-contribution
    answer_topic: "1.7"
    property: "The largest sum with AND 0 has each of the k bits missing from exactly one element; the bits choose independently, giving n^k arrays."
    why_others_fail: Listing arrays is hopeless; bits are independent, so the count is a product over bits.
  - problem: lc-maximum-xor-for-each-query
    answer_card: high-bit-first
    answer_topic: "1.7"
    property: "Within maximumBit bits, the best k sets every bit the current XOR lacks: k = x ⊕ (2^m − 1), which gives all ones, the largest possible value."
    why_others_fail: Trying every k < 2^m for each query is too slow; the top bits are decided independently, all at once.
  - problem: lc-binary-subarrays-with-sum
    answer_card: count-windows
    answer_topic: "1.3"
    property: "Values are 0 or 1, so window sums only grow when the window grows: exactly goal = (at most goal) − (at most goal − 1), each counted by a shrinking window."
    why_others_fail: "It asks for a sum, not a XOR; prefix sums with a map (topic 1.2) also work, but no bit property is involved."
  - problem: ac-abc384_d
    answer_card: shrinkable-window
    answer_topic: "1.3"
    property: "Remove whole periods from S (S mod the period sum), then look for a window with that sum in two copies of the array; positive values make the window shrinkable."
    why_others_fail: S is up to 10^18, so the infinite sequence cannot be walked; there are no bitwise operations in the statement.
  - problem: cses-1631
    answer_card: extreme-first
    answer_topic: "1.5"
    property: "If the longest book takes more than all the others together, the answer is twice it; otherwise the answer is the total. Only the extreme book matters."
    why_others_fail: Nothing involves bits; the answer depends only on the sum and the maximum.
lookalike_pairs:
  - a: lc-single-number
    b: lc-single-number-ii
    a_tool: xor-identities (1.7)
    b_tool: "per-bit-contribution (1.7): count each bit modulo 3"
    flipping_difference: "A's duplicates come in pairs, which cancel under XOR; B's come in threes, which XOR leaves as one copy, so each bit is counted and taken modulo 3."
  - a: ac-abc147_d
    b: ac-abc365_e
    a_tool: "per-bit-contribution (1.7): c_b (N − c_b) pairs per bit"
    b_tool: "prefix-xor with per-bit-contribution (1.7): pairs of prefix values differing at each bit"
    flipping_difference: "A sums over pairs of elements; B sums over subarrays, whose XOR is P_j ⊕ P_(i−1), so the per-bit counting runs over prefix values (and must exclude length-1 subarrays)."
self_test: []
checkpoint:
  time_limit_minutes: 90
  problems: []
decision_map: []
glossary_added:
  - bitwise operator
  - XOR
  - prefix XOR
  - popcount
