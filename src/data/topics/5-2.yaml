decision_map:
- weak_signal: Operations that change a value or add to a range, mixed with questions about the sum, count
    or XOR of a range, with n and q up to 2·10^5
  choose: updates-and-range-sums
  when: 'The quantity can be undone by subtracting (Theorems 5.2.1 and 5.2.2): keep a tree and do each
    operation in O(log n).'
  over:
  - card: range-sum
    topic: '1.2'
    because: If nothing changes, two prefix values answer a range in O(1).
  - card: nested-loops
    topic: '0.5'
    because: Recomputing the range for each question is O(nq).
  - card: idempotent-range-query
    topic: '5.1'
    because: A table needs a fixed array; here the values change, and the sum is not idempotent.
- weak_signal: Counts pairs or triples of elements in a wrong order, or, for each element, how many earlier
    or later ones are smaller or larger
  choose: inversion-count
  when: 'The condition between two items is an order condition after sorting one coordinate (Theorem 5.2.4):
    sweep and count with a tree over the ranks.'
  over:
  - card: nested-loops
    topic: '0.5'
    because: If n ≤ 5000, a double loop is simple and fast enough.
  - card: prefix-count-lookup
    topic: '1.2'
    because: A table of counts of prefix values works for "equal" but not for "at most".
  - card: coordinate-compression
    topic: '1.1'
    because: Compression only makes the ranks; the tree is what counts them.
- weak_signal: Many questions about a fixed array that depend on a quantity changing with the right end
    (distinct values, values at most x, intervals inside a given one)
  choose: offline-sweep-count
  when: All questions are known at the start and the answer to a question is the sum of marks over its
    range after the sweep has reached its right end (Theorem 5.2.5).
  over:
  - card: range-sum
    topic: '1.2'
    because: Prefix sums count elements, not different values.
  - card: set-membership
    topic: '0.6'
    because: A set tells whether a value occurs, not how many different values lie in a range.
  - card: event-sweep
    topic: '1.1'
    because: The sweep over sorted events is the same idea; the tree is what answers a range count at
      each step.
- weak_signal: Repeatedly asks for the k-th smallest (or the k-th remaining place) of a collection that
    gets insertions and removals
  choose: kth-present
  when: 'The values or places are numbered 1..n (or compressed): a tree of counts and the descent of Theorem
    5.2.6 find the k-th in O(log n).'
  over:
  - card: ordered-set-lookup
    topic: '0.6'
    because: A sorted set finds the nearest value but cannot jump to the k-th element.
  - card: heap-extract
    topic: '0.6'
    because: A heap gives only the smallest, not an element at an arbitrary place.
  - card: nested-loops
    topic: '0.5'
    because: Erasing from a vector is O(n) per removal, up to 2·10^10 moves in all.
glossary_added:
- Fenwick tree
