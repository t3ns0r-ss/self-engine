# Topic 1.1 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.1'
uses:
- topic: '0.1'
  what: vector, long long and fast input and output
- topic: '0.2'
  what: The step budget and O(n log n)
- topic: '0.3'
  what: One-pass scans, which do most of the work after sorting
- topic: '0.4'
  what: Remainders and divisibility, used by several problems of this topic
- topic: '0.5'
  what: 'Brute force: lexicographic order, and the reference solutions in the tests'
- topic: '0.6'
  what: 'The STL toolbox: pair, set and map, and the cost of each operation. A set already keeps its elements
    sorted; this lesson is about a sort done once'
theorems:
- id: 1.1.1
  title: Merge sort sorts in n log n comparisons
  plain_words: Split the array in halves, sort each half the same way, then merge the two sorted halves
    by repeatedly taking the smaller front element. Halving needs about log n levels and each level does
    about n work, so the total is n log n.
  code: 1.1/thm-1
- id: 1.1.2
  title: In sorted order, the closest elements are neighbours
  plain_words: After sorting, the two elements closest in value are next to each other, and the k elements
    with the smallest spread are k consecutive ones. So one sort and one pass over neighbours answers
    questions about closeness.
  code: 1.1/thm-2
- id: 1.1.3
  title: Comparing by keys is a valid sorting order
  plain_words: Sorting by one key, or by several keys in turn, is always a valid order for sort, and so
    is any rule that secretly compares one key per element. A comparator written with less-or-equal is
    not valid.
  code: 1.1/thm-3
- id: 1.1.4
  title: Sorting pairs of value and index remembers positions
  plain_words: Sort the pairs of each value with its index. The pairs come out by value, equal values
    by index, and the index of each pair says which input position it came from, so the place of every
    element can be read off.
  code: 1.1/thm-4
- id: 1.1.5
  title: Ranks keep the order of values and are small
  plain_words: Replace every value by the number of distinct smaller values. The order and the equalities
    between values are kept, and the new numbers are below n, so they can index an array even when the
    values are as large as 10^9.
  code: 1.1/thm-5
- id: 1.1.6
  title: A sorted event list gives the coverage everywhere
  plain_words: Turn every interval into a start event that adds one and an end event that subtracts one,
    sort the events by time, and keep a running counter. The counter is the number of intervals covering
    the current time.
  code: 1.1/thm-6
cards:
- id: sort-then-scan
  name: Sort, then look at neighbours
  decisive_property: The question is order-free (shuffling the input never changes the answer), and in
    sorted order the elements that matter to each other are neighbours or a block of consecutive elements,
    so one sort and one scan decide it.
  from_theorem: 1.1.2
  how_to_test: Shuffle a small input by hand and check the answer stays the same; then check that the
    best pair or group can be taken from consecutive elements of the sorted list.
  constraint_shapes:
  - 'n up to 2·10^5 values: comparing every pair is 2·10^10 steps, but sorting is about 2·10^5 · 18 =
    3.6·10^6 steps and the scan over neighbours is 2·10^5.'
  weak_signals:
  - form: Asks for the closest two values, the smallest difference, or k chosen values with the smallest
      spread
    shape: n up to 2·10^5, values up to 10^9, and no condition on positions
  - form: The input order plays no role in the statement
    shape: A set of people, sticks, scores or points, listed in any order
  - form: Intervals are given in any order and overlapping ones must be combined
    shape: n up to 2·10^5 intervals; after sorting by start, overlapping intervals are neighbours
  kill_signals:
  - 'Positions matter: for 4 5 9 and "at least 2 positions apart" the answer is 5, but sorted neighbours
    give 1, from 4 and 5 that sit next to each other.'
  - 'Only input-adjacent elements count: in 4 9 5 the smallest difference of adjacent elements is 4, but
    the sorted order 4 5 9 has a neighbour difference of 1.'
  in_action:
    statement: There are n sticks of lengths p_i. Changing a stick by 1 costs 1. Find the smallest total
      cost to make all sticks the same length.
    constraints: 1 ≤ n ≤ 2·10^5, 1 ≤ p_i ≤ 10^9.
    budget: Trying every target length up to 10^9 for each stick is 2·10^5 · 10^9 steps, far over the
      budget. Sorting is about 3.6·10^6 steps.
    candidates:
    - tool: Try every target length from 1 to 10^9
      verdict: rejected
      because: 2·10^14 steps.
    - tool: Sort the lengths and take the middle one as the target (this topic)
      verdict: chosen
      because: The answer does not depend on the order of the sticks, and the best target is found among
        the sorted values.
    property_check: 'Shuffling the sticks changes nothing, so the question is order-free. In sorted order
      the best target is a median: moving the target up past a stick pays for that stick and one more
      for each stick on the other side, so the total cost is smallest at the middle element.'
    decision: Sort, take p[n / 2], sum |p_i − p[n / 2]| in long long.
  examples:
    positive:
    - inline:
        input: The smallest difference between two of 10 1 7 3 8
        answer: '1'
        why: Sorted, the values are 1 3 7 8 10; the neighbours 7 and 8 differ by 1, and no pair is closer
          than the closest neighbours.
    - worked_example: cses-1074
      why: The order of the sticks is irrelevant, and in sorted order the best common length is the median,
        read off after one sort.
    negative:
    - inline:
        input: The smallest difference between two elements at least 2 positions apart in 4 5 9
        answer: '5'
        method_gives: '1'
        why: Sorting forgets positions. The values 4 and 5 are next to each other in the input, and the
          only pair allowed is 4 and 9, with difference 5.
      correct_tool:
        topic: '0.6'
        card: ordered-set-lookup
    - inline:
        input: The smallest difference between elements adjacent in the input 4 9 5
        answer: '4'
        method_gives: '1'
        why: 'Only pairs next to each other in the input count: |4 − 9| = 5 and |9 − 5| = 4. Sorting makes
          4 and 5 neighbours, which is a pair the question does not allow.'
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: The smallest difference between two values at least x positions apart
    tool:
      topic: '0.6'
      card: ordered-set-lookup
    flipping_difference: The distance condition depends on positions, so the input cannot be sorted; the
      values are inserted into an ordered set as the scan passes them.
  complexity: O(n log n) for the sort, O(n) for the scan.
- id: custom-order
  name: Sort by your own rule
  decisive_property: The statement fixes an order by one or more keys (or by a rule that reduces to comparing
    a key), so sorting with a comparator that is a strict weak ordering, with every tie-break the statement
    asks for, produces it.
  from_theorem: 1.1.3
  how_to_test: Write the order as a list of keys with a direction for each ("by score descending, then
    by index ascending"). If it is a rule between pairs, find the key it compares.
  constraint_shapes:
  - 'n up to 2·10^5 contestants or fractions with numerators and denominators up to 10^18: sorting is
    3.6·10^6 comparisons; comparing fractions by cross-multiplication needs 128-bit products, since 10^18
    · 10^18 = 10^36.'
  weak_signals:
  - form: Asks for the order "by …, and in case of a tie by …"
    shape: Several keys per item and n up to 2·10^5
  - form: Asks for standings, rankings or leaderboards
    shape: A score, a penalty and an id per contestant
  - form: Ratios or fractions decide the order
    shape: Numerators and denominators up to 10^9 or 10^18, so doubles are not exact
  kill_signals:
  - 'The order changes as items are processed: standings printed after every update would need a set of
    (key, id) pairs, because one sort is not enough.'
  - 'Doubles lose exactness: 999999999999999999/10^18 and 999999999999999998/999999999999999999 are different
    fractions, but both are 1.0 as doubles.'
  in_action:
    statement: 'Print the contestants in order: more problems solved first, then less penalty, then smaller
      id.'
    constraints: n ≤ 2·10^5, solved and penalty up to 10^9.
    budget: Repeatedly picking the best remaining contestant is up to 2·10^5 · 2·10^5 = 4·10^10 steps.
      Sorting is about 3.6·10^6 comparisons.
    candidates:
    - tool: Pick the best remaining contestant n times
      verdict: rejected
      because: About 4·10^10 steps.
    - tool: Sort with a comparator on the three keys (this topic)
      verdict: chosen
      because: The order is a list of keys, which is a strict weak ordering, and sort is O(n log n).
    property_check: 'The order is by solved (descending), then penalty (ascending), then id (ascending):
      keys compared in turn, which is a strict weak ordering by Theorem 1.1.3. The last key makes the
      order total, so the unstable sort cannot reorder ties.'
    decision: sort with a comparator that returns the first key where the two differ.
  examples:
    positive:
    - inline:
        input: 'Contestants (solved, penalty): 1 = (2, 50), 2 = (3, 90), 3 = (3, 40); the order'
        answer: 3,2,1
        why: Contestants 2 and 3 solved 3 problems and beat contestant 1; between them, 3 has the smaller
          penalty.
    - inline:
        input: The largest number made by joining 3, 30, 34, 5, 9
        answer: '9534330'
        why: Order the numbers by "x before y when xy > yx", which compares the key x / (10^|x| − 1);
          the order 9, 5, 34, 3, 30 gives 9534330.
    negative:
    - inline:
        input: The largest number made by joining 12 and 121, ordered by plain descending string order
        answer: '12121'
        method_gives: '12112'
        why: Plain string order puts 121 before 12 (12 is a prefix of 121), giving 12112. The rule "xy
          > yx" compares 12121 with 12112 and puts 12 first.
      correct_tool:
        topic: '1.1'
        card: custom-order
    - inline:
        input: Which is larger, 999999999999999999/1000000000000000000 or 999999999999999998/999999999999999999,
          compared as doubles?
        answer: first
        method_gives: equal
        why: Both quotients round to 1.0 as doubles. Cross-multiplication in 128 bits shows 999999999999999999²
          exceeds 999999999999999998 · 10^18 by 1.
      correct_tool:
        topic: '1.1'
        card: custom-order
  lookalikes:
  - description: Print the standings after every update
    tool:
      topic: '0.6'
      card: ordered-set-lookup
    flipping_difference: Keys change between outputs, so one sort is not enough; a set of (key, id) pairs
      keeps the order.
  complexity: O(n log n) comparisons, each O(number of keys).
- id: sort-with-index
  name: Sort but remember positions
  decisive_property: The work needs the elements in value order, but the answer refers to their original
    positions (or ties are broken by position), so the sort runs on (value, index) pairs.
  from_theorem: 1.1.4
  how_to_test: Check whether the output is printed in input order or names indices; if so, every element
    must carry its index through the sort.
  constraint_shapes:
  - 'n up to 2·10^5: a pair of two ints is 8 bytes, 1.6 MB for all of them, and sorting costs 3.6·10^6
    comparisons; finding each element''s place by counting the smaller ones is 4·10^10 steps.'
  weak_signals:
  - form: Asks for the answer to be printed for each element in input order, or for original indices
    shape: n up to 2·10^5 and an output line per element
  - form: Asks for the rank or place of every element, with ties settled by position
    shape: Repeated values and a stated tie rule
  kill_signals:
  - 'Only the multiset of values matters: printing the values in sorted order needs no indices.'
  - 'The tie rule is by later index first: for 50 10 50 7 the second 50 should come before the first,
    but pairs (value, index) put index 0 before index 2.'
  in_action:
    statement: For each element of a, print its place in the sorted order, with equal values ordered by
      index.
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: Counting the smaller elements for each element is 2·10^5 · 2·10^5 = 4·10^10 steps. Sorting
      n pairs is about 3.6·10^6.
    candidates:
    - tool: For each element, count the elements before it in sorted order
      verdict: rejected
      because: 4·10^10 steps.
    - tool: Sort (value, index) pairs and record each index's place (this topic)
      verdict: chosen
      because: The sorted pairs list the indices in value order, so the place of index i is the position
        of its pair.
    property_check: All pairs differ because the indices do, so the sorted order is by value and, for
      equal values, by index (Theorem 1.1.3, part 2). Setting place[index of the k-th pair] = k gives
      the place of every element in one pass.
    decision: Sort the pairs; for k from 0 to n − 1 set place[pair k's index] = k.
  examples:
    positive:
    - inline:
        input: The place of every element of 50 10 50 7, equal values by index
        answer: 2,1,3,0
        why: The sorted pairs are (7, 3), (10, 1), (50, 0), (50, 2), so the indices 3, 1, 0, 2 take places
          0, 1, 2, 3; read by index the places are 2, 1, 3, 0.
    - inline:
        input: The place of every element of 3 1 2
        answer: 2,0,1
        why: The sorted order is 1, 2, 3 at the indices 1, 2, 0, so the element 3 has place 2, the element
          1 place 0 and 2 place 1.
    negative:
    - inline:
        input: The original index of the smallest element of 50 10 50 7, after sorting the values alone
        answer: '3'
        method_gives: '0'
        why: After sorting the values alone, the smallest is at position 0, but that position says nothing
          about where it came from. The index must travel with the value, as in the pair (7, 3).
      correct_tool:
        topic: '1.1'
        card: sort-with-index
    - inline:
        input: The place of the element at index 2 of 50 10 50 7 when equal values must come by descending
          index
        answer: '2'
        method_gives: '3'
        why: Pairs (value, index) put the equal 50s in ascending index order, so index 2 gets place 3.
          The statement asks for descending index, so the tie key must be flipped, which is a custom comparator.
      correct_tool:
        topic: '1.1'
        card: custom-order
  lookalikes:
  - description: Print the values in sorted order
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: No position is reported, so the indices are not needed; sorting the values alone
      is enough.
  complexity: O(n log n).
- id: coordinate-compression
  name: Replace values by ranks
  decisive_property: Only comparisons between values matter (which is smaller, which are equal), never
    their differences, so each value can be replaced by its rank among the distinct values, which is below
    n and can index an array.
  from_theorem: 1.1.5
  how_to_test: Replace the values by others in the same order (for example 7, 10, 50 by 0, 1, 2) and check
    that the answer does not change.
  constraint_shapes:
  - 'Values up to 10^9 with only n = 2·10^5 of them: an array indexed by value needs 10^9 cells (4 GB
    of int), while the ranks are below 2·10^5 and need 800 KB.'
  weak_signals:
  - form: Asks how many distinct values are smaller than each element, or for the k-th largest distinct
      value
    shape: Values up to 10^9 and n up to 2·10^5
  - form: Rows or columns of a grid disappear when they are empty
    shape: Coordinates up to 10^9 but at most n marked cells
  kill_signals:
  - 'Distances between values matter: the union of the intervals [1, 3] and [10, 12] has length 4, but
    after compressing the ends to 0, 1, 2, 3 the same sum gives 2.'
  - 'Sizes of values are added: 7 + 10 + 50 = 67, but the ranks 0, 1, 2 add up to 3.'
  in_action:
    statement: For each element of a, print the number of distinct values smaller than it.
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: Counting distinct smaller values for each element is up to 2·10^5 · 2·10^5 = 4·10^10 steps.
      Sorting is 3.6·10^6.
    candidates:
    - tool: For each element, collect the smaller values in a set
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: Compress to ranks by sorting (value, index) pairs (this topic)
      verdict: chosen
      because: The rank of a value is exactly the number of distinct smaller values.
    property_check: The question compares values only; the rank r(x) satisfies x < y ⟺ r(x) < r(y) and
      x = y ⟺ r(x) = r(y) (Theorem 1.1.5). In the walk over sorted pairs the counter equals the number
      of distinct values seen before the current one.
    decision: Sort the pairs; walk through them with a counter that grows when the value changes; store
      the counter by index.
  examples:
    positive:
    - inline:
        input: The number of distinct smaller values for each element of 50 10 50 7
        answer: 2,1,2,0
        why: For 50 the distinct smaller values are 10 and 7 (2), for 10 only 7 (1), and for 7 none; these
          are the ranks.
    - inline:
        input: The number of distinct values below 10 in 50 10 50 7
        answer: '1'
        why: Only 7 is below 10, which is the rank of 10 among the distinct values 7, 10, 50.
    negative:
    - inline:
        input: The total length of the union of [1, 3] and [10, 12], computed after compressing the ends
          1, 3, 10, 12 to 0, 1, 2, 3
        answer: '4'
        method_gives: '2'
        why: Lengths depend on the actual coordinates. Compression keeps the order but not the gaps, so
          the sum of lengths changes from 2 + 2 to 1 + 1.
      correct_tool:
        topic: '1.1'
        card: event-sweep
    - inline:
        input: The sum of 7, 10 and 50, computed on their ranks 0, 1, 2
        answer: '67'
        method_gives: '3'
        why: Compression loses the sizes of the values. A sum needs the values themselves, and there is
          nothing to compress; a plain loop adds them.
      correct_tool:
        topic: '0.3'
        card: direct-simulation
  lookalikes:
  - description: Total length of the union of intervals
    tool:
      topic: '1.1'
      card: event-sweep
    flipping_difference: Lengths depend on the actual coordinates, not only on their order; the sweep
      adds up the gaps between event times.
  complexity: O(n log n).
- id: event-sweep
  name: Intervals as sorted events
  decisive_property: The quantity (how many intervals cover a point, a running total) changes only at
    interval ends, so sorting the 2n start and end events, with the tie order the statement implies, and
    keeping a counter gives its value everywhere.
  from_theorem: 1.1.6
  how_to_test: List what happens at a start and at an end; check that nothing changes between events;
    decide whether an end and a start at the same time overlap.
  constraint_shapes:
  - 'Times up to 10^9 and n = 2·10^5 intervals: marking every point is 10^9 steps per interval, but 2n
    = 4·10^5 events sort in about 7·10^6 steps and the counter scan is 4·10^5.'
  weak_signals:
  - form: Intervals with coordinates or times up to 10^9
    shape: n up to 2·10^5 intervals, and a question about how many cover a point
  - form: Asks for the busiest moment, or the largest number at the same time
    shape: A maximum over all points, not a count at one given point
  - form: Asks how many days have exactly k active items, or a cost per day between a start and an end
    shape: Start and end days up to 10^9
  kill_signals:
  - 'Touching intervals are handled in the wrong tie order: for [1, 3) and [3, 5) the largest coverage
    is 1, but sorting the start at 3 before the end at 3 gives 2.'
  - 'Closed intervals read as half-open: [1, 3] and [3, 5] share the point 3, so the coverage is 2, but
    reading them as [1, 3) and [3, 5) gives 1; write [l, r] as [l, r + 1).'
  in_action:
    statement: There are n intervals [l_i, r_i] of integers. Print the largest number of intervals that
      contain a common point.
    constraints: n ≤ 2·10^5, 1 ≤ l_i ≤ r_i ≤ 10^9.
    budget: Testing every point of the range is up to 10^9 points times n intervals. Sorting 2n = 4·10^5
      events is about 7·10^6 steps.
    candidates:
    - tool: Mark every point of every interval in an array
      verdict: rejected
      because: Up to 10^9 cells, and each interval touches up to 10^9 of them.
    - tool: Sort the start and end events and keep a counter (this topic)
      verdict: chosen
      because: The coverage changes only at the 2n event times.
    property_check: The interval [l, r] of integers is the half-open [l, r + 1), so its end event is at
      r + 1. After the events with time ≤ t the counter equals the coverage at t, and the ends sort before
      the starts at equal times (Theorem 1.1.6). The maximum of the counter is the answer.
    decision: Events (l, +1) and (r + 1, −1); sort; scan with a counter; print its maximum.
  examples:
    positive:
    - worked_example: ac-abc221_d
      why: Each player is logged in on a range of days up to 2·10^9, so the counts per number of players
        come from the gaps between sorted event days.
    - inline:
        input: The largest coverage of [1, 4), [2, 5), [4, 6)
        answer: '2'
        why: The events (1,+1), (2,+1), (4,−1), (4,+1), (5,−1), (6,−1) give the counter 1, 2, 1, 2, 1,
          0, so the largest coverage is 2.
    - inline:
        input: The largest coverage of [1, 3) and [3, 5), which touch at 3
        answer: '1'
        why: With the end at 3 sorted before the start at 3, the counter goes 1, 0, 1, 0, so the intervals
          never overlap.
    negative:
    - inline:
        input: The same touching intervals [1, 3) and [3, 5), with the start at 3 sorted before the end
          at 3
        answer: '1'
        method_gives: '2'
        why: Processing the start first makes the counter reach 2 for a moment, a coverage that never
          exists. Ends must come before starts at equal times.
      correct_tool:
        topic: '1.1'
        card: event-sweep
    - inline:
        input: The largest coverage of the closed integer intervals [1, 3] and [3, 5], read as the half-open
          [1, 3) and [3, 5)
        answer: '2'
        method_gives: '1'
        why: The closed intervals share the point 3. Written as half-open they are [1, 4) and [3, 6),
          whose events give a coverage of 2.
      correct_tool:
        topic: '1.1'
        card: event-sweep
  lookalikes:
  - description: The same intervals with times up to 10^5 and one query per time
    tool:
      topic: '0.3'
      card: direct-simulation
    flipping_difference: Small coordinates make it cheap to walk every time point, so sorting is optional.
  complexity: O(n log n) to sort 2n events, then O(n).
problems:
- id: cf-1399A
  role: ladder
  card: sort-then-scan
  rung: 1
  twist: Base case of the card
  summary: Up to 50 numbers; repeatedly pick two whose difference is at most 1 and delete the smaller.
    Can one number remain? (t test cases)
  hints:
  - Does the order in which the numbers are listed matter for the answer?
  - 'No, so sort them. In sorted order, a number can only be removed together with a close neighbour (Theorem
    1.1.2: the closest values are neighbours).'
  - Sort; the answer is YES exactly when every pair of sorted neighbours differs by at most 1.
- id: ac-abc132_c
  role: ladder
  card: sort-then-scan
  rung: 2
  twist: The answer is the size of one gap in sorted order, not a minimum over all gaps.
  summary: N even (≤ 10^5) difficulties; count the thresholds K that put exactly half of the problems
    at K or above.
  hints:
  - Which problems are at K or above? Think of the difficulties in sorted order.
  - In sorted order d_1 ≤ … ≤ d_N, the problems at K or above are a suffix. Exactly N/2 of them means
    d_{N/2} < K ≤ d_{N/2+1}.
  - Sort and print d_{N/2+1} − d_{N/2} (with indices from 1).
- id: ac-abc115_c
  role: ladder
  card: sort-then-scan
  rung: 3
  twist: 'A group of K values instead of a pair: the best group is a block of the sorted list.'
  summary: Choose K of N trees (N ≤ 10^5, heights ≤ 10^9) so that the tallest minus the shortest chosen
    height is as small as possible.
  hints:
  - Does the order of the trees in the input matter?
  - No. In sorted order, some best choice is K consecutive trees (Theorem 1.1.2, part 2).
  - Sort and take the minimum of h[i + K − 1] − h[i] over all i.
- id: ac-abc361_c
  role: ladder
  card: sort-then-scan
  rung: 4
  twist: The statement keeps the original order of the remaining elements, which looks like a reason not
    to sort; it is not.
  summary: Remove exactly K of N values (N ≤ 2·10^5) so that the maximum minus the minimum of what remains
    is as small as possible.
  hints:
  - The remaining elements keep their order. Does that order change max − min?
  - 'No: max − min depends only on which values remain. So choose N − K values with the smallest spread.'
  - Sort; the answer is the minimum of a[i + N − K − 1] − a[i] over all i (a block of N − K values).
- id: lc-h-index
  role: ladder
  card: sort-then-scan
  rung: 5
  twist: The condition compares a value with how many values are at least as large, which sorting turns
    into a comparison with an index.
  summary: Given n ≤ 5000 citation counts, the largest h such that at least h papers have at least h citations
    each.
  hints:
  - If the counts are sorted from largest to smallest, how many papers have at least c[i] citations?
  - 'At least i + 1 (indices from 0): the papers 0..i all have at least c[i]. So h works when c[h − 1]
    ≥ h.'
  - Sort in decreasing order and return the largest h with c[h − 1] ≥ h (or 0).
- id: cf-1311B
  role: ladder
  card: sort-then-scan
  rung: 6
  twist: Only some adjacent swaps are allowed, so only parts of the array can be sorted, and the result
    is compared with the fully sorted array.
  summary: An array of up to 100 values and a set of positions p where swapping a[p] and a[p + 1] is allowed
    (any number of times); can the array be sorted? (t test cases)
  hints:
  - Which elements can reach which places using only the allowed swaps?
  - Consecutive allowed positions join places into blocks; inside a block any order can be reached, and
    nothing crosses a block border.
  - Sort each block on its own, then check whether the whole array is non-decreasing. (With n ≤ 100, repeating
    the allowed swaps that fix an out-of-order pair also works.)
- id: lc-relative-sort-array
  role: ladder
  card: custom-order
  rung: 1
  twist: Base case of the card
  summary: Sort arr1 (length ≤ 1000, values ≤ 1000) so that values listed in arr2 come first in arr2's
    order, then the other values in increasing order.
  hints:
  - Can you give every value a number (a key) so that sorting by that number gives the required order?
  - 'Key of v: its position in arr2 if it is there, otherwise 1000 + v (larger than every position). Keys
    compare like the rule (Theorem 1.1.3, part 1).'
  - Build the key with a map or an array of size 1001, then sort arr1 by key.
- id: ac-abc128_b
  role: ladder
  card: custom-order
  rung: 2
  twist: Two keys with opposite directions, the first a string.
  summary: Print N ≤ 100 restaurants by city name in dictionary order and, within a city, by score from
    highest to lowest.
  hints:
  - Write the order as a list of keys with a direction for each.
  - City ascending, then score descending. A pair (city, −score) compared with < gives exactly that (Theorem
    1.1.3, part 2).
  - Sort tuples (city, −score, index) and print the indices.
- id: ac-abc222_c
  role: ladder
  card: custom-order
  rung: 3
  twist: The ranking is recomputed after every round of a simulation.
  summary: 2N ≤ 100 players play M ≤ 100 rounds of rock-paper-scissors, paired by the current ranking
    (more wins first, then smaller number); print the final ranking.
  hints:
  - What decides the pairs of each round?
  - 'The ranking after the previous round: more wins first, ties by smaller number. Re-sort before every
    round; 100 sorts of 100 players are cheap.'
  - Keep wins[]; each round sort the players by (−wins, number), play the pairs (1st, 2nd), (3rd, 4th),
    …, update the wins; print the last ranking.
- id: lc-largest-number
  role: ladder
  card: custom-order
  rung: 4
  twist: The rule compares two items with each other (which concatenation is larger), and you must check
    it is a strict weak ordering.
  summary: Arrange n ≤ 100 non-negative integers (≤ 10^9) so that writing them one after another gives
    the largest number; return it as a string.
  hints:
  - For two numbers x and y, which should come first?
  - x first when the string x + y is larger than y + x. Section 4.3 shows that this rule compares a key,
    so it is a valid comparator.
  - Sort the strings with that comparator and join them; if the result starts with 0, the answer is "0".
- id: lc-sort-the-people
  role: ladder
  card: sort-with-index
  rung: 1
  twist: Base case of the card
  summary: Given n ≤ 1000 names and distinct heights, return the names ordered from tallest to shortest.
  hints:
  - Sorting the heights alone loses which name belongs to which height. What must travel with each height?
  - 'Its index (or the name itself): sort pairs (height, index) (Theorem 1.1.4).'
  - Sort the pairs by height in decreasing order and output names[index] in that order.
- id: ac-abc294_c
  role: ladder
  card: sort-with-index
  rung: 2
  twist: The output is the place of every element in the sorted order, printed in input order.
  summary: Two increasing sequences of lengths N, M ≤ 10^5 with no common value are merged and sorted;
    print the position of every element of each sequence.
  hints:
  - After sorting all N + M values together, how do you know where A_i went?
  - Each value carries a label (which sequence, which index); writing place[label] = k while reading the
    sorted list gives every position (Theorem 1.1.4, part 2).
  - Sort the pairs (value, label); print the places of A's elements, then of B's. (Both inputs are already
    sorted, so merging them also works.)
- id: ac-abc208_c
  role: ladder
  card: sort-with-index
  rung: 3
  twist: The sorted order only decides who gets one extra piece; arithmetic with K up to 10^18 does the
    rest.
  summary: Hand out K ≤ 10^18 sweets to N ≤ 2·10^5 citizens (one each per round, and a last partial round
    to the smallest IDs); print each citizen's total in input order.
  hints:
  - How many full rounds are there, and who receives the last pieces?
  - Everyone gets K / N; the K mod N citizens with the smallest IDs get one more. Who those are needs
    the IDs in sorted order, but the output is in input order.
  - Sort pairs (ID, index), mark the first K mod N indices, then print K / N + mark[i] for each i. Use
    long long.
- id: lc-how-many-numbers-are-smaller-than-the-current-number
  role: ladder
  card: coordinate-compression
  rung: 1
  twist: Base case of the card
  summary: For each of n ≤ 500 values (≤ 100), count the values in the array that are smaller than it.
  hints:
  - In sorted order, where does the first copy of a value stand?
  - 'At the place equal to the number of values smaller than it (not distinct values: every smaller value
    counts).'
  - Sort pairs (value, index); walk them, remembering the place where the current value first appeared,
    and store that place at each index.
- id: lc-rank-transform-of-an-array
  role: ladder
  card: coordinate-compression
  rung: 2
  twist: Equal values get the same rank, and ranks count distinct values.
  summary: Replace each of n ≤ 10^5 values (|value| ≤ 10^9) by its rank among the distinct values, starting
    from 1.
  hints:
  - What should two equal values get? Two different values?
  - This is exactly coordinate compression (Theorem 1.1.5), with ranks starting at 1 instead of 0.
  - Sort pairs (value, index); increase the rank only when the value changes; store rank + 1 at each index.
- id: ac-abc273_c
  role: ladder
  card: coordinate-compression
  rung: 3
  twist: Ranks are counted from the top (distinct values greater), and the answer counts how many elements
    share each rank.
  summary: For each K = 0..N−1 (N ≤ 2·10^5), count the elements that have exactly K distinct values greater
    than them in the array.
  hints:
  - '"Exactly K distinct values greater" is a rank. Counted from which end?'
  - 'From the largest: compress in decreasing order, so the largest value has rank 0.'
  - Compute each element's rank among distinct values in decreasing order, count the elements per rank,
    and print the counts for K = 0..N−1 (zeros after the last rank).
- id: ac-abc213_c
  role: ladder
  card: coordinate-compression
  rung: 4
  twist: Rows and columns are compressed separately, and the input is a grid up to 10^9 by 10^9.
  summary: N ≤ 10^5 numbered cards on an H × W grid (H, W ≤ 10^9); remove every empty row and column;
