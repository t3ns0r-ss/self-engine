  review_set: 1
  techniques:
  - L0.4
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id001
    property: The question is who owns the connection; the class diagram shows the filled diamond from the server to the connection.
    why_others_fail: A sequence diagram shows calls, not who is responsible for deleting an object.
  checkers: []
