# Patterns for topic 0.5 (Brute force: loops, bitmask subsets, permutations, simple recursion). Provisional until the lesson maps them to Recognition Cards.
topic: "0.5"
patterns:
  - id: nested-loops
    name: Try every pair or triple
    description: Check every pair, triple, or value combination with nested loops.
    precondition: The number of combinations times the cost of checking one fits the budget.
  - id: subset-bitmask
    name: All subsets as bitmasks
    description: "n ≤ about 20: loop over all 2^n subsets, each written as a bitmask, and check each one."
    precondition: n is small enough that 2^n · n fits the budget, and each subset can be checked independently.
  - id: permutations
    name: All orders
    description: "n ≤ about 8–10: try every order of the items using next_permutation on a sorted array."
    precondition: n! times the cost of checking one order fits the budget.
  - id: recursive-choices
    name: Recursive generation
    description: Generate every sequence of choices (each position from a small set) with a simple recursive function.
    precondition: The branching factor raised to the depth fits the budget.
  - id: enumerate-answer
    name: Try every candidate answer
    description: Loop over every possible value of the answer (or of one key variable) and check it directly.
    precondition: The range of candidate answers is small and each check is cheap.
