  role: worked_example
  type: estimate
  title: Five replicas, three needed
  prompt: A store keeps five replicas, each up 99.9% of the time and failing independently, with W = R = 3. Work out how many minutes in a 30-day month an operation cannot go ahead, and decide whether five replicas are worth it against three.
  card: quorum-replication
