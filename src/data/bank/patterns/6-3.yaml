# Patterns for topic 6.3 (Trie). Provisional until the lesson maps them to Recognition Cards.
topic: "6.3"
patterns:
  - id: prefix-tree
    name: Words in a prefix tree
    description: Insert words and count or list words with a given prefix, or the longest common prefix of a set.
    precondition: Words with a common prefix share the same path from the root.
  - id: counted-trie
    name: Counts on the nodes, with insertions and removals
    description: A number is kept on every node (how many words pass, the sum of values, the best word) and changes when a word is inserted, removed or blocked; questions read one node or one path.
    precondition: The answer for a beginning depends only on the words that pass through its node, and an insertion or removal changes only the nodes of one word's path.
  - id: dictionary-split
    name: Splitting text into dictionary words
    description: Count or check ways to split a string into words from a dictionary by walking the prefix tree from each position.
    precondition: The words that can start at a position are found by one walk down the prefix tree.
