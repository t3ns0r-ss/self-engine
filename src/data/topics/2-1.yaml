  hints:
  - The GCD of a pair is d exactly when d divides both. For a fixed d, can you count the elements it divides
    fast?
  - For every d, sum cnt over the multiples of d (Theorem 2.1.6, part 1); the harmonic bound keeps it
    O(M log M).
  - Scan d from 10^6 down and stop at the first d that divides at least two elements.
- id: cses-1082
  role: ladder
  card: multiples-sieve
  rung: 2
  twist: N is 10^12, so group the divisors by the number of their multiples instead of looping over them.
  summary: Compute σ(1) + σ(2) + … + σ(n) modulo 10^9 + 7 for n ≤ 10^12, where σ is the sum of divisors.
  hints:
  - 'Exchange the sums: each d ≤ n is a divisor of ⌊n/d⌋ numbers up to n. So the total is Σ d·⌊n/d⌋.'
  - ⌊n/d⌋ takes at most 2√n different values; the d with the same value form a block [l, r] with r = n
    / (n / l).
  - For each block add q · (l + … + r) modulo p, computing the arithmetic sum (Theorem 0.2.3) in __int128
