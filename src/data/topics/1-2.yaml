# Topic 1.2 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '1.2'
uses:
- topic: '0.1'
  what: long long, since sums of 2·10^5 values up to 10^9 reach 2·10^14
- topic: '0.2'
  what: The step budget
- topic: '0.3'
  what: One-pass scans and grids
- topic: '0.4'
  what: Remainders, for sums divisible by k
- topic: '0.5'
  what: 'Brute force: the reference solutions in the tests, and the plain loops several negative examples
    fall back to'
- topic: '0.6'
  what: Counting with a map (Theorem 0.6.3), which Section 4.2 applies to prefix sums
- topic: '1.1'
  what: The event sweep (Theorem 1.1.6), which a difference array replaces when the coordinates are small
theorems:
- id: 1.2.1
  title: A range sum is a difference of two prefix sums
  plain_words: Add up the array from the left once, keeping the running totals. The sum of any range is
    then the total up to its end minus the total up to just before its start, so every question takes
    one subtraction.
  code: 1.2/thm-1
- id: 1.2.2
  title: Subarray conditions become conditions on pairs of prefix sums
  plain_words: A subarray is a pair of prefix positions, and its sum is the difference of their prefix
    sums. To count subarrays with sum K, count earlier prefix values equal to the current one minus K;
    for sums divisible by k, count earlier prefix sums with the same remainder.
  code: 1.2/thm-2
- id: 1.2.3
  title: Range additions are two changes in a difference array
  plain_words: Adding a value to a whole range only changes the step between neighbours at the two ends
    of the range. Record the two changes, and one running sum at the end rebuilds the array.
  code: 1.2/thm-3
- id: 1.2.4
  title: Rectangle sums need four corner values
  plain_words: Keep the sum of every rectangle that starts at the top-left corner. The sum of any rectangle
    is then the big one, minus the two that stick out above and to the left, plus the corner that was
    removed twice.
  code: 1.2/thm-4
- id: 1.2.5
  title: The best value before or after a position is kept with one comparison per step
  plain_words: The maximum or minimum of everything before a position, or after it, grows with one comparison
    as the position moves. This answers questions like the best purchase and sale, the best split, or
    the largest subarray sum.
  code: 1.2/thm-5
cards:
- id: range-sum
  name: Range sums of a fixed array
  decisive_property: The array does not change, and every question asks for the sum (or count) of a range,
    so prefix sums answer each one as P[r+1] − P[l] in O(1) after O(n) preparation.
  from_theorem: 1.2.1
  how_to_test: Check that no update arrives between questions and that the quantity can be undone by subtraction
    (a sum or a count, not a maximum).
  constraint_shapes:
  - 'n and q both up to 2·10^5: adding up each range is up to 2·10^5 · 2·10^5 = 4·10^10 steps, while building
    P is 2·10^5 steps and each query is one subtraction, 4·10^5 in all; the sums reach 2·10^14, so P is
    long long.'
  weak_signals:
  - form: Asks many times for the sum or the number of items from position l to position r
    shape: n and q both up to 2·10^5
  - form: Asks for a split point i with the "before i" and "after i" parts measured by sums or counts
    shape: One answer per i, with n up to 2·10^5
  - form: Asks about a local pattern in a substring, such as two equal neighbours or the letters "AC"
    shape: A string of up to 10^5 characters and many substring queries; the pattern is a 0/1 mark per
      position
  kill_signals:
  - 'Values change between queries: after a[1] is set to 0 in 3 5 1 4, the stored prefix sums still say
    the sum of a[1..2] is 6, but it is 1.'
  - 'The query asks for a maximum: for a[1..2] of 3 5 1 4 the sum is 6, but the maximum is 5, and P cannot
    give a maximum.'
  in_action:
    statement: An array of n integers and q queries "l r"; print the sum of a_l, …, a_r for each query.
    constraints: n, q ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: Adding up each range is up to 2·10^5 · 2·10^5 = 4·10^10 steps in all, 400 times the budget.
      Building prefix sums is 2·10^5 steps and each query is O(1).
    candidates:
    - tool: Add up each range with a loop
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: Prefix sums and one subtraction per query (this topic)
      verdict: chosen
      because: The array is fixed, a sum can be undone by subtraction, and each query is O(1).
    property_check: The array never changes between queries, and the sum of a range is P[r + 1] − P[l]
      (Theorem 1.2.1). P is built once in O(n); sums reach 2·10^5 · 10^9 = 2·10^14, so P is a long long.
    decision: Build P with P[k + 1] = P[k] + a[k]; answer each query with P[r] − P[l − 1] in 1-based terms.
  examples:
    positive:
    - inline:
        input: The sum of a[1..2] in 3 5 1 4
        answer: '6'
        why: The prefix sums are 0, 3, 8, 9, 13, and P[3] − P[1] = 9 − 3 = 6 = 5 + 1.
    - worked_example: ac-abc122_c
      why: The pattern "AC" is turned into a 0/1 mark per position, and the number of occurrences inside
        any substring is a range sum of the marks.
    negative:
    - inline:
        input: The sum of a[1..2] in 3 5 1 4 after a[1] is changed to 0, using the prefix sums built before
          the change
        answer: '1'
        method_gives: '6'
        why: The prefix sums describe the old array. A change between queries invalidates them; with few
          queries the plain loop on the current array is the right tool.
      correct_tool:
        topic: '0.3'
        card: direct-simulation
    - inline:
        input: The maximum of a[1..2] in 3 5 1 4, asked as the prefix-sum difference
        answer: '5'
        method_gives: '6'
        why: A difference of prefix sums is a sum. A maximum cannot be undone by subtraction, so for a
          range of the middle the elements themselves must be scanned.
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: The same queries, but some operations change an element
    tool:
      topic: '0.3'
      card: direct-simulation
    flipping_difference: Updates between queries would force rebuilding the prefix sums after each change,
      which is O(n) per update; with few updates a rebuild is fine, with many a different structure is
      needed.
  complexity: O(n) to build, O(1) per query.
- id: prefix-count-lookup
  name: Pairs of prefix values
  decisive_property: The condition on a subarray [l, r] is a condition on the pair (P[l], P[r+1]) alone,
    such as an exact difference K or equal remainders, so scanning the prefix sums with a map of earlier
    values counts or finds the subarrays, even with negative values.
  from_theorem: 1.2.2
  how_to_test: Rewrite the condition with P[r+1] − P[l]. If it becomes "P[l] equals something computed
    from P[r+1]", count earlier values with a map.
  constraint_shapes:
  - 'n up to 2·10^5: checking every subarray is n²/2 = 2·10^10 steps, while one pass with a map is 2·10^5
    lookups of about 18 steps; the count itself can reach 2·10^10, so it is a long long.'
  weak_signals:
  - form: Asks to count the subarrays with sum exactly K, or with sum divisible by k
    shape: n up to 2·10^5 and values of either sign
  - form: Asks for balanced segments, such as as many A as B
    shape: Each element becomes +1 or −1, and a balanced segment is one with sum 0
  kill_signals:
  - 'The condition is "sum at most K": a map finds exact values only, so for 1 2 1 and K = 3 it finds
    2 subarrays with sum exactly 3, but 5 have sum at most 3.'
  - 'P_0 = 0 is missing: for 1 2 and K = 3, the subarray [1, 2] starts at position 0 and needs the empty
    prefix, so without it the count is 0 instead of 1.'
  in_action:
    statement: Count the subarrays of a with sum exactly K.
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9, |K| ≤ 10^14.
    budget: Summing every subarray is up to n²/2 = 2·10^10 steps. One pass with a map of earlier prefix
      sums is about 2·10^5 · 18 steps.
    candidates:
    - tool: Sum every subarray with two loops
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: Count earlier prefix sums equal to P_j − K with a map (this topic)
      verdict: chosen
      because: The condition is P_j − P_i = K, a lookup of one value, and negative elements do not matter.
    property_check: A subarray [l, r] is the pair (l, r + 1) of prefix indices, with sum P_{r+1} − P_l,
      which equals K exactly when P_l = P_{r+1} − K (Theorem 1.2.2). When j is processed the map holds
      P_0, …, P_{j−1}, so one lookup counts every valid i.
    decision: seen[0] = 1; for each prefix sum P add seen[P − K] to the answer, then seen[P]++.
  examples:
    positive:
    - inline:
        input: Subarrays of 1 2 −1 2 with sum 3
        answer: '2'
        why: The prefix sums are 0, 1, 3, 2, 4; P = 3 finds 0 earlier (the subarray 1 + 2) and P = 4 finds
          1 earlier (2 − 1 + 2), so 2 subarrays.
    - inline:
        input: Subarrays of 1 2 3 with sum divisible by 3
        answer: '3'
        why: The prefix remainders are 0, 1, 0, 0; the equal pairs are (0,2), (0,3) and (2,3), which are
          the subarrays 1 2, 1 2 3 and 3.
    negative:
    - inline:
        input: Subarrays of 1 2 with sum 3, with P_0 = 0 missing from the map
        answer: '1'
        method_gives: '0'
        why: The subarray 1 2 starts at position 0, so it pairs P_2 = 3 with P_0 = 0. Without the empty
          prefix in the map the lookup of 3 − 3 = 0 finds nothing.
      correct_tool:
        topic: '1.2'
        card: prefix-count-lookup
    - inline:
        input: Subarrays of −1 2 1 with even sum, using the raw remainder P % 2
        answer: '2'
        method_gives: '1'
        why: The prefix sums are 0, −1, 1, 2 with raw remainders 0, −1, 1, 0, so −1 and 1 look different
          although both are odd. Normalise with (P % k + k) % k.
      correct_tool:
        topic: '1.2'
        card: prefix-count-lookup
  lookalikes:
  - description: Longest subarray with sum at most K, all values positive
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: An inequality on positive values is closed under shrinking; an exact sum with
      any values is a lookup of one earlier prefix value.
  complexity: O(n log n) with a map.
- id: difference-array
  name: Many range updates, then one read
  decisive_property: All updates add a value to a range and come before all reads, so each update is two
    changes in the difference array, and one running sum rebuilds the array.
  from_theorem: 1.2.3
  how_to_test: Check that no read happens between updates, that updates add (not set) values, and that
    positions fit in an array.
  constraint_shapes:
  - 'n and q up to 2·10^5 range additions: adding to every element of every range is up to 4·10^10 steps,
    while two changes per update and one running sum is 4·10^5 + 2·10^5 steps; values reach 2·10^14.'
  weak_signals:
  - form: Performs q operations "add v to every element from l to r" and prints the final array
    shape: n and q up to 2·10^5, all operations before the output
  - form: Asks for coverage counts of many intervals on a short line
    shape: Positions up to 10^6 or fewer, so an array can be indexed by position
  - form: Asks how many ranges each position falls into
    shape: Each range adds 1
  kill_signals:
  - 'An operation sets a range to a value instead of adding: setting a[1..3] to 5 in 1 1 1 1 1 gives 1
    5 5 5 1, but adding 5 gives 1 6 6 6 1.'
  - 'A read arrives between updates: after adding 2 on [1, 3], the element a[2] is 2, but the difference
    array holds d[2] = 0 until the running sum is taken.'
  in_action:
    statement: An array of n zeros and q operations "l r v" that add v to a_l, …, a_r. Print the final
      array.
    constraints: n, q ≤ 2·10^5, |v| ≤ 10^9.
    budget: Adding v to each element of each range is up to 2·10^5 · 2·10^5 = 4·10^10 steps. Two changes
      per update plus one running sum is about 6·10^5 steps.
    candidates:
    - tool: Loop over every range for every update
      verdict: rejected
      because: Up to 4·10^10 steps.
    - tool: A difference array with two changes per update, then one running sum (this topic)
      verdict: chosen
      because: All updates add, and the array is read only at the end.
    property_check: Adding v to a_l..a_r changes the difference d_i = a_i − a_{i−1} only at i = l (by
      +v) and at i = r + 1 (by −v), and a_i is the running sum of d (Theorem 1.2.3). All reads happen
      after the updates.
    decision: d[l] += v, d[r + 1] −= v for each update; print the running sum of d, in long long.
  examples:
    positive:
    - inline:
        input: n = 5 zeros, add 2 on [1, 3] and add 5 on [2, 4]; the array
        answer: 0,2,7,7,5
        why: The difference array is (0, 2, 5, 0, −2) (the −5 falls past the end), and its running sums
          are 0, 2, 7, 7, 5.
    - inline:
        input: n = 5 zeros, add 3 on [0, 4]; the array
        answer: 3,3,3,3,3
        why: The only changes are d[0] = 3 and d[5] = −3, which is past the end; the running sum is 3
          everywhere.
    negative:
    - inline:
        input: Set a[1..3] to 5 in 1 1 1 1 1, recorded as "add 5 on [1, 3]"
        answer: 1,5,5,5,1
        method_gives: 1,6,6,6,1
        why: A difference array records additions. Setting a range overwrites what was there, so each
          such operation must be applied on the current array, and the plain loops fit when q is small.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The element a[2] after the first update (add 2 on [1, 3]), read from the difference array
          d[2]
        answer: '2'
        method_gives: '0'
        why: d[2] is the step between a[1] and a[2], which is 0 here. The value a[2] is the running sum
          of d, so reading between updates needs a new running sum, which costs O(n) each time.
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: Each operation shifts a whole prefix of the string
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: When every update covers a prefix, each position's total is a suffix sum of the
      updates, so prefix sums are enough and no difference array is needed.
  complexity: O(n + q).
- id: prefix-2d
  name: Rectangles in a grid
  decisive_property: The grid is fixed (or all rectangle updates come before the reads), so the four-corner
    formula on 2D prefix sums gives any rectangle sum in O(1), and four corner changes record any rectangle
    update.
  from_theorem: 1.2.4
  how_to_test: Check that every query is an axis-parallel rectangle of a grid that does not change between
    queries.
  constraint_shapes:
  - 'A grid of 1000 × 1000 cells and q = 2·10^5 queries: summing each rectangle is up to 10^6 cells per
    query, 2·10^11 steps in all, while the 2D prefix sums cost 10^6 steps and each query is four lookups.'
  weak_signals:
  - form: Asks for the sum or count of cells in many sub-rectangles of an H × W grid
    shape: H and W up to 1000 and q up to 2·10^5
  - form: Asks to add 1 (or v) to every cell of several rectangles and then print the grid
    shape: All rectangles before the output
  - form: Asks a one-dimensional range question about a grid
    shape: Each query is a rectangle given by two corners
  kill_signals:
  - 'The shape is not a rectangle: the main diagonal (cells (0, 0) and (1, 1)) of 1 2 3 / 4 5 6 sums to
    6, but the rectangle with those corners sums to 12.'
  - 'The grid changes between queries: a stored S describes the old grid, and one changed cell shifts
    every S value to its right and below.'
  in_action:
    statement: An H × W grid of integers and q queries "x1 y1 x2 y2"; print the sum of the cells in each
      rectangle.
    constraints: H, W ≤ 1000, q ≤ 2·10^5.
    budget: Adding the cells of each rectangle is up to 10^6 steps per query, 2·10^11 in all. 2D prefix
      sums cost 10^6 steps, then each query is four lookups.
    candidates:
    - tool: Sum the cells of every rectangle with two loops
      verdict: rejected
      because: Up to 2·10^11 steps.
    - tool: 2D prefix sums and four corner values per query (this topic)
      verdict: chosen
      because: The grid is fixed and every query is an axis-parallel rectangle.
    property_check: S[x][y] holds the sum of rows 1..x and columns 1..y, with row 0 and column 0 equal
      to 0, and the rectangle is S[x2][y2] − S[x1 − 1][y2] − S[x2][y1 − 1] + S[x1 − 1][y1 − 1] (Theorem
      1.2.4). The sums can reach 10^6 · 10^9, so S is long long.
    decision: Build S in O(HW); answer each query with the four-corner formula.
  examples:
    positive:
    - inline:
        input: The rectangle of rows 0..1 and columns 1..2 in 1 2 3 / 4 5 6
        answer: '16'
        why: S[2][3] − S[0][3] − S[2][1] + S[0][1] = 21 − 0 − 5 + 0 = 16 = 2 + 3 + 5 + 6.
    - inline:
        input: The sum of the whole grid 1 2 3 / 4 5 6
        answer: '21'
        why: The corner S[2][3] is already the sum of rows 1..2 and columns 1..3, 21; the other three
          terms are 0.
    negative:
    - inline:
        input: Row 1, columns 1..2 of 1 2 3 / 4 5 6 (the cells 5 and 6), with the last corner term left
          out
        answer: '11'
        method_gives: '10'
        why: Without the added corner S[1][1] = 1, the corner that was subtracted twice is not restored,
          and the result is 1 too small.
      correct_tool:
        topic: '1.2'
        card: prefix-2d
    - inline:
        input: The main diagonal (cells (0, 0) and (1, 1)) of 1 2 3 / 4 5 6, asked as a rectangle
        answer: '6'
        method_gives: '12'
        why: A rectangle with those corners also contains the cells 2 and 4. A diagonal is not an axis-parallel
          rectangle, and a short loop over its cells answers it.
      correct_tool:
        topic: '0.5'
        card: nested-loops
  lookalikes:
  - description: Count the cells of each colour in a rectangle of a grid that repeats with period N
    tool:
      topic: '1.2'
      card: prefix-2d
    flipping_difference: The grid is huge but periodic, so the rectangle is split into whole periods and
      partial pieces before the formula applies.
  complexity: O(HW) to build, O(1) per query.
- id: prefix-extremes
  name: Best value before or after a position
  decisive_property: Each question needs the maximum or minimum of everything before a position or after
    it (never a middle range), so prefix and suffix extremes, each computed with one comparison per step,
    answer it in O(1).
  from_theorem: 1.2.5
  how_to_test: Write the question for a fixed position i; check that the other side of i is a prefix or
    a suffix.
  constraint_shapes:
  - 'n up to 2·10^5: trying every pair i < j is 2·10^10 steps, while one pass with a running minimum is
    2·10^5; the best subarray sum reaches 2·10^14, so long long.'
  weak_signals:
  - form: Asks to buy before you sell, the largest a_j − a_i with i < j
    shape: n up to 2·10^5 values, and one pair is chosen
  - form: Asks for the best value excluding one position, or the best split point
    shape: One answer per position, with n up to 2·10^5
  - form: Asks for the largest sum of a subarray
    shape: Values of both signs, n up to 2·10^5
  - form: Removes or replaces one element, then asks for the maximum, minimum or gcd of the rest
    shape: The prefix and suffix versions of an operation that cannot be undone by subtraction
  kill_signals:
  - 'The maximum of a middle range is needed: for a[2..3] of 3 5 1 4 the maximum is 4, but the prefix
    maximum up to index 3 is 5.'
  - 'The running minimum is updated before it is used: for −3 −1 the best non-empty subarray sum is −1,
    but updating first lets an empty subarray give 0.'
  in_action:
    statement: A price list a_0, …, a_{n−1}. Print the largest a_j − a_i over i < j (the best profit of
      one purchase and one later sale).
    constraints: 2 ≤ n ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: Trying every pair is up to 2·10^10 steps. One pass with a running minimum is 2·10^5.
    candidates:
    - tool: Try every pair i < j
      verdict: rejected
      because: About 2·10^10 steps.
    - tool: Keep the smallest price so far while scanning (this topic)
      verdict: chosen
      because: For each sale day j the best purchase day is before it, and the smallest earlier price
        is a prefix minimum.
    property_check: For a fixed j the best i < j is the one with the smallest a_i, which is the prefix
      minimum m_j; the answer is the maximum of a_j − m_j over j (Theorem 1.2.5, part 3). The prefix minimum
      is updated with one comparison per step.
    decision: Scan j from 1 to n − 1, update the best with a_j − minSoFar, then update minSoFar with a_j.
  examples:
    positive:
    - inline:
        input: The best a_j − a_i with i < j in 7 1 5 3 6 4
        answer: '5'
        why: The running minimum is 7, 1, 1, 1, 1 before each j, and 6 − 1 = 5 is the largest difference.
    - worked_example: lc-trapping-rain-water
      why: The water above bar i reaches the smaller of the highest bar to its left and the highest bar
        to its right, a prefix maximum and a suffix maximum.
    negative:
    - inline:
        input: The maximum of a[2..3] in 3 5 1 4, answered with the prefix maximum up to index 3
        answer: '4'
        method_gives: '5'
        why: A prefix maximum covers everything from the start, including the 5 outside the range. A range
          in the middle needs its own scan.
      correct_tool:
        topic: '0.5'
        card: nested-loops
    - inline:
        input: The best non-empty subarray sum of −3 −1, with the running minimum updated before it is
          used
        answer: '-1'
        method_gives: '0'
        why: Updating the minimum first lets P_j pair with itself, which is the empty subarray with sum
          0. The minimum must only include earlier prefix sums.
      correct_tool:
        topic: '1.2'
        card: prefix-extremes
  lookalikes:
  - description: The largest sum of a subarray of length exactly k
    tool:
      topic: '1.2'
      card: range-sum
    flipping_difference: A fixed length fixes the start, so each candidate is one range sum; no running
      minimum is needed.
  complexity: O(n).
problems:
- id: lc-running-sum-of-1d-array
  role: ladder
  card: range-sum
  rung: 1
  twist: Base case of the card
  summary: 'Return the running sums of an array of n ≤ 1000 values: the i-th output is the sum of the
    first i + 1 values.'
  hints:
  - How does the i-th running sum relate to the (i − 1)-th?
  - 'It is the previous one plus nums[i]: the recurrence P_{k+1} = P_k + a_k of Theorem 1.2.1.'
  - Keep one running total and write it after each element.
- id: lc-range-sum-query-immutable
  role: ladder
  card: range-sum
  rung: 2
  twist: Many range sum queries on the same array.
  summary: Answer up to 10^4 queries "sum of nums[left..right]" on a fixed array of n ≤ 10^4 values.
  hints:
  - What can be prepared once so that each query is fast?
  - Prefix sums with P_0 = 0; the sum of nums[left..right] is P_{right+1} − P_left (Theorem 1.2.1).
  - Build P in the constructor (size n + 1) and return P[right + 1] − P[left].
- id: cses-1646
  role: ladder
  card: range-sum
  rung: 3
  twist: 1-based queries, 2·10^5 of them, and sums beyond int.
  summary: n, q ≤ 2·10^5; values up to 10^9; print the sum of each queried range [a, b] (1-based).
  hints:
  - How large can a range sum be?
  - 'Up to 2·10^5 · 10^9 = 2·10^14: long long. With 1-based queries, the sum of [a, b] is P[b] − P[a −
    1].'
  - Read with fast input, build P, answer each query in O(1).
- id: lc-left-and-right-sum-differences
  role: ladder
  card: range-sum
  rung: 4
  twist: Every position needs both the sum before it and the sum after it.
  summary: For each i of an array (n ≤ 1000), the absolute difference between the sum of the elements
    left of i and the sum right of i.
  hints:
  - Express "the sum right of i" with the total and a prefix sum.
  - Left sum is P_i; right sum is total − P_{i+1}.
  - One pass for the total, one pass keeping P_i; answer |P_i − (total − P_i − nums[i])|.
- id: lc-find-pivot-index
  role: ladder
  card: range-sum
  rung: 5
  twist: Search for the first position where the two sides are equal, with negative values.
  summary: The leftmost index of an array (n ≤ 10^4, values in [−1000, 1000]) where the sum of the elements
    before it equals the sum after it, or −1.
  hints:
  - Same two sums as the previous rung. Which position do you return?
  - The first i with P_i = total − P_i − nums[i]; negative values only change nothing in the formula.
  - Scan i from 0 with a running left sum and return at the first match.
- id: lc-number-of-ways-to-split-array
  role: ladder
  card: range-sum
  rung: 6
  twist: Count the split points instead of finding one, and the sums can pass int.
  summary: Count the indices i < n − 1 where the sum of the first i + 1 elements is at least the sum of
    the rest (n ≤ 10^5, |values| ≤ 10^5).
  hints:
  - How large can the sums get, and how do you get both sides at every split?
  - 'Up to 10^10: long long. Left = P_{i+1}, right = total − P_{i+1}.'
  - Scan i from 0 to n − 2 with a running sum and count the splits with left ≥ right.
- id: lc-subarray-sum-equals-k
  role: ladder
  card: prefix-count-lookup
  rung: 1
  twist: Base case of the card
  summary: Count the subarrays with sum exactly k in an array of n ≤ 2·10^4 values that may be negative.
  hints:
  - Write the sum of a subarray with two prefix sums. What must hold for it to equal k?
  - 'P_j − P_i = k, i.e. P_i = P_j − k: count earlier prefix sums equal to P_j − k (Theorem 1.2.2).'
  - 'Scan with a map of prefix-sum counts starting with {0: 1}; add count[P − k] before inserting P.'
- id: lc-count-number-of-nice-subarrays
  role: ladder
  card: prefix-count-lookup
  rung: 2
  twist: The quantity summed is "is this element odd", not the element.
  summary: Count the subarrays containing exactly k odd numbers (n ≤ 5·10^4).
  hints:
  - Replace each number by something whose sum over a subarray is the number of odd elements.
  - 1 for odd, 0 for even. Now it is "subarrays with sum exactly k".
  - Apply the previous rung's scan to the 0/1 array (an array of counts works instead of a map, since
    prefix values are at most n).
- id: cf-1398C
  role: ladder
  card: prefix-count-lookup
  rung: 3
  twist: The condition compares the sum with the length; subtracting 1 from every element turns it into
    "sum zero".
  summary: Count the subarrays of a digit string whose digit sum equals their length (sum of lengths ≤
    10^5, t test cases).
  hints:
  - Sum = length means Σ a_i = Σ 1 over the subarray. Move everything to one side.
  - 'Σ (a_i − 1) = 0: subarrays with sum 0 of the shifted values, i.e. pairs of equal prefix sums.'
  - 'Count equal prefix sums of (digit − 1) with a map starting from {0: 1}; the count needs long long.'
- id: cf-466C
  role: ladder
  card: prefix-count-lookup
  rung: 4
  twist: Two cut points must be chosen in order, so the count of earlier good first cuts is kept while
    scanning for the second cut.
  summary: Count the ways to cut an array (n ≤ 5·10^5) into three non-empty consecutive parts with equal
    sums.
  hints:
  - If the total is S, what must the prefix sums be at the two cuts?
  - S/3 at the first cut and 2S/3 at the second (S must be divisible by 3), with the first cut strictly
    before the second.
  - Scan the cut positions; at a position with P = 2S/3, add the number of earlier positions with P =
    S/3; then, if P = S/3 here, count it. long long.
- id: lc-corporate-flight-bookings
  role: ladder
  card: difference-array
  rung: 1
  twist: Base case of the card
  summary: n ≤ 2·10^4 flights and 2·10^4 bookings, each reserving s seats on every flight from first to
    last; the total seats per flight.
  hints:
  - Adding s to every flight of every booking can cost 4·10^8. What changes only at the ends of a booking?
  - 'The difference between neighbouring flights: +s at first, −s after last (Theorem 1.2.3).'
  - d[first] += s, d[last + 1] −= s for each booking, then a running sum over the flights.
- id: ac-abc183_d
  role: ladder
  card: difference-array
  rung: 2
  twist: The read is a check of every time against a capacity, and the intervals are half-open.
  summary: N ≤ 2·10^5 people each use P_i litres per minute from time S_i to T_i (exclusive, times ≤ 2·10^5);
    can a heater of W litres per minute supply everyone?
  hints:
  - Times are small. What do you need to know at every minute?
  - 'The total use at that minute: a sum of range additions [S_i, T_i), all known in advance.'
  - d[S] += P, d[T] −= P; a running sum over the times; answer No if it ever exceeds W. long long.
- id: cf-295A
  role: ladder
  card: difference-array
  rung: 3
  twist: The updates are themselves applied in ranges, so two difference arrays are nested.
  summary: An array (n ≤ 10^5), m operations "add d on [l, r]", and k queries each applying the operations
    x..y once; print the final array.
  hints:
  - First find out how many times each operation is applied in total.
  - 'Each query adds 1 to a range of operations: a difference array over the operations gives each operation''s
    count c.'
  - Then apply each operation once with value c·d through a difference array over the elements. long long.
- id: cses-1652
  role: ladder
  card: prefix-2d
  rung: 1
  twist: Base case of the card
  summary: In an n × n forest map (n ≤ 1000) of trees and empty squares, count the trees in each of q
