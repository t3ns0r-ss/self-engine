decision_map:
- weak_signal: The largest XOR of a number with a stored set that changes; the best subarray XOR in a
    window; the number of XOR values below a bound
  choose: binary-xor
  when: Numbers below 2^B in a binary trie with counts, one walk of B digits per question (Theorems 5.7.1
    and 5.7.2).
  over:
  - card: high-bit-first
    topic: '1.7'
    because: A fixed array and one question about the largest XOR of a pair can be solved by building
      the answer from the top digit with a set of prefixes.
  - card: per-bit-contribution
    topic: '1.7'
    because: A sum of XORs over all pairs separates by bit; no trie is needed.
  - card: prefix-xor
    topic: '1.7'
    because: The XOR of a given range is two prefix values; the trie is for the best range or for counting
      ranges by their XOR.
- weak_signal: The weight of a cheapest tree when the edge between two numbers is their XOR; the smallest
    largest value after XOR-ing one number into every element; a pairing that minimises the largest XOR
  choose: xor-split
  when: Edges (pairs) inside a group with the same top digit are lighter than edges across, so the problem
    splits by the top digit (Theorem 5.7.3).
  over:
  - card: cheapest-connect
    topic: '4.5'
    because: A graph given by a list of edges is solved by sorting the list and joining components; the
      XOR graph has n²/2 edges that only exist as a rule.
  - card: high-bit-first
    topic: '1.7'
    because: A single largest XOR over a fixed array is built digit by digit with a set of prefixes and
      needs no tree.
