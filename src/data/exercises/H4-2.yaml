topic: H4.2
exercises:
- id: rung-1
  role: ladder
  type: lab
  title: Put and Get over three replicas
  prompt: 'Implement the replica handler and the client Put and Get for three replicas with W = 2 and R = 2. In this rung every replica must answer: if any call fails, return an error. Get returns the newest version it saw, and an older write never replaces a newer value. The tests bring a fake network, so you only edit the files in starter/.'
  card: quorum-replication
  rung: 1
  new_force: A key-value store that keeps three copies and reads the newest
  needs_new_structure: true
  checkers:
  - kind: kit
    path: H4.2/lab/rung-1
  reference: reference/H4.2/lab/rung-1
  alternatives:
  - 'One map behind a mutex on one machine: simpler, and enough when a machine failing for 43 minutes a month is acceptable.'
  hints:
  - Each replica keeps a map from key to the newest Versioned it has seen. What should Handle do with a PutReq whose version is not newer?
  - The client helper call already sends one request to every replica at once and gives you a slice with nil for a failed call. Put needs every entry to be non-nil in this rung.
  - Get asks every replica, then picks the reply with the highest Version. Do not take the first reply.
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  clarifying:
  - q: How many replicas are there, and can that number change while the store runs?
    a: Three, fixed for the life of the store. Changing the replica set is a different problem.
    critical: true
  - q: When is a write acknowledged?
    a: When at least W = 2 replicas have stored it.
    critical: true
  - q: Who supplies the version of a value?
    a: The caller; versions grow for each key. The store only compares them.
    critical: false
  - q: What does reading a key nobody wrote return?
    a: The zero value (empty value, version 0), not an error.
    critical: false
  run: Run the real three-process version from code/H4.2/lab-quorumkv/run.md (nodes plus fault proxies) and write in your attempt log what the client printed after each step.
- id: rung-2
  role: ladder
  type: lab
  title: One replica is down
  prompt: Make the store keep working when a replica is down or cut off. Put succeeds when at least W replicas acknowledged and Get when at least R answered. Otherwise return an error that wraps ErrNoQuorum (so errors.Is(err, ErrNoQuorum) is true). With two of three replicas unreachable both operations must fail.
  card: quorum-replication
  rung: 2
  new_force: One replica is down during writes and reads
  needs_new_structure: true
  checkers:
  - kind: kit
    path: H4.2/lab/rung-2
  reference: reference/H4.2/lab/rung-2
  alternatives:
  - 'Keep requiring all replicas: simpler, but then three machines are three ways for the store to be unavailable (write availability 0.997, 129.5 minutes down a month).'
  hints:
  - Count the replicas that answered instead of requiring all of them.
  - Compare the count with c.W for a write and c.R for a read, and wrap ErrNoQuorum with %w.
  - 'There is no need for a new data structure: the fan-out helper already tells you who answered.'
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  run: Run the real three-process version from code/H4.2/lab-quorumkv/run.md (nodes plus fault proxies) and write in your attempt log what the client printed after each step.
- id: rung-3
  role: ladder
  type: lab
  title: Refuse settings that can read stale data
  prompt: Add NewClient. It returns ErrUnsafeQuorum when W + R is not greater than the number of replicas, unless allowStale is true, and an error when W or R is outside 1 to N. A client made with allowStale and W = 1, R = 1 must really be able to return a stale read; the tests set that up with cut links.
  card: quorum-replication
  rung: 3
  new_force: W = 1, R = 1 can read stale data
  needs_new_structure: true
  checkers:
  - kind: kit
    path: H4.2/lab/rung-3
  reference: reference/H4.2/lab/rung-3
  alternatives:
  - 'Leave W and R free and document the rule: less code, but the first person to set W = 1, R = 1 reads stale data without being told.'
  hints:
  - Which inequality makes a read set and a write set always share a replica?
  - Check the range first, then check the overlap rule, and let allowStale switch only the second check off.
  - The struct fields stay as they are; NewClient only validates and fills them.
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  run: Run the real three-process version from code/H4.2/lab-quorumkv/run.md (nodes plus fault proxies) and write in your attempt log what the client printed after each step.
- id: rung-4
  role: ladder
  type: lab
  title: Read repair
  prompt: Add read repair. When the client field ReadRepair is true, Get writes the newest version back to every replica that answered with an older one. A failed repair must not fail the read, a repair never lowers a version, and with the flag off nothing is written.
  card: read-repair
  rung: 4
  new_force: A replica that missed a write stays stale until something repairs it
  needs_new_structure: true
  checkers:
  - kind: kit
    path: H4.2/lab/rung-4
  reference: reference/H4.2/lab/rung-4
  alternatives:
  - 'Do nothing and let the next write of the key bring the replica up to date: fine when keys are rewritten often, wrong for keys that are read much more often than written.'
  hints:
  - After picking the newest version, which of the replies were older?
  - Send a PutReq with the newest version to each of those replicas and ignore the error from that call.
  - The replica already ignores older versions, so a repair that arrives late is harmless.
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  run: Run the real three-process version from code/H4.2/lab-quorumkv/run.md (nodes plus fault proxies) and write in your attempt log what the client printed after each step.
- id: rung-5
  role: ladder
  type: lab
  title: A workload that tolerates a second of staleness
  prompt: 'Write Choose(toleratedStalenessMs) for three replicas. Below 1000 ms return W = 2, R = 2 without read repair. At 1000 ms or more return W = 2, R = 1 with read repair. The client does not change in this rung: the answer is a setting, and the tests check that both settings keep working with one replica down.'
  card: null
  rung: 5
  new_force: A workload that tolerates one second of staleness
  needs_new_structure: false
  checkers:
  - kind: kit
    path: H4.2/lab/rung-5
  reference: reference/H4.2/lab/rung-5
  alternatives:
  - 'Always use R = 2: simplest to reason about, and the right choice when no reader can tolerate staleness. R = 1 saves one read of two per request.'
  hints:
  - Which part of the store has to change to read from one replica instead of two? Probably none.
  - The two settings differ only in R and in the read repair flag.
  - Write the threshold as a single comparison and test the boundary values 999 and 1000.
  techniques:
  - H4.2
  checked_on: '2026-10-18'
  run: Run the real three-process version from code/H4.2/lab-quorumkv/run.md (nodes plus fault proxies) and write in your attempt log what the client printed after each step.
- id: est-1
  role: ladder
  type: estimate
  title: Replication traffic for the session store
  prompt: The session store takes 20 000 writes a second of 1 KB each. Every write is sent to all three replicas. How much data a second leaves the clients and goes to the replicas, in megabytes per second?
