# Topic 2.3 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '2.3'
uses:
- topic: '0.1'
  what: Overflow and long long, for the products of counts
- topic: '0.2'
  what: Closed forms and sums of runs
- topic: '0.4'
  what: Counting multiples in a range (Theorem 0.4.2) and the two-set count of Theorem 0.4.6, part 3
- topic: '0.5'
  what: 'Brute force: permutations (n! orders), subsets as bitmasks (2^n of them), and recursion for the
    reference solutions'
- topic: '0.6'
  what: Counting values with maps
- topic: '1.1'
  what: Sorting the limits and values
- topic: '1.3'
  what: Two pointers over sorted values
- topic: '1.4'
  what: Binary search on the answer
- topic: '1.5'
  what: Greedy choices
- topic: '2.1'
  what: 'Number theory: prime factorisations and trial division'
- topic: '2.2'
  what: 'Modular arithmetic: inverses modulo a prime and fast exponentiation'
theorems:
- id: 2.3.1
  title: Product and sum rules
  plain_words: When an object is built by a sequence of choices and each choice has the same number of
    options whatever came before, multiply the numbers of options. When a set splits into separate cases,
    add their sizes.
  code: 2.3/thm-1
- id: 2.3.2
  title: Binomial coefficients
  plain_words: The number of ways to choose r of n different items is n! / (r! (n − r)!). It is symmetric
    in r and n − r, each entry is the sum of the two above it in Pascal's triangle, and a row sums to
    2^n.
  code: 2.3/thm-2
- id: 2.3.3
  title: Factorial tables
  plain_words: Modulo a prime p larger than N, build the factorials and their inverses up to N once. Every
    binomial coefficient is then three table reads and two multiplications.
  code: 2.3/thm-3
- id: 2.3.4
  title: Multinomial coefficients
  plain_words: A list with c1 copies of the first value, c2 of the second, and so on, can be arranged
    in n! / (c1! c2! …) different ways, since swapping equal copies changes nothing.
  code: 2.3/thm-4
- id: 2.3.5
  title: Stars and bars
  plain_words: Splitting n identical items among k labelled groups is placing k − 1 bars among n stars,
    which is a choice of positions, so there are C(n + k − 1, k − 1) ways. Lower bounds are subtracted
    first.
  code: 2.3/thm-5
- id: 2.3.6
  title: Inclusion–exclusion
  plain_words: To count the objects with none of several bad properties, start with all of them, subtract
    those with each property, add back those with two, subtract those with three, and so on. Each object
    with exactly t bad properties is then counted once if t = 0 and zero times otherwise.
  code: 2.3/thm-6
- id: 2.3.7
  title: Lattice paths
  plain_words: A path with a steps right and b steps up is fixed by choosing which of its a + b steps
    go right, so there are C(a + b, a) of them. This is a bijection between paths and subsets.
  code: 2.3/thm-7
cards:
- id: ncr-mod-p
  name: Binomial coefficients modulo a prime
  decisive_property: The count is a formula in binomial (or multinomial) coefficients C(n, r) with n below
    the prime modulus and small enough for a table (up to a few million); factorial and inverse factorial
    tables then give each coefficient in O(1).
  from_theorem: 2.3.3
  how_to_test: Write the count as choices of positions or subsets, check that every n in C(n, r) is at
    most the table size and below p, and that p is prime.
  constraint_shapes:
  - 'Up to 2·10^5 queries of C(n, r) with n up to 10^6: building Pascal''s triangle is 10^12 entries,
    while the tables are 2·10^6 multiplications and each query is O(1).'
  weak_signals:
  - form: Choose r of n positions, cells, or people; "how many ways" modulo 998244353 or 10^9 + 7
    shape: n up to 10^6
  - form: Many queries of C(n, r)
    shape: Up to 2·10^5 queries and n up to 10^6
  - form: Arrangements of letters with repeats (anagrams), or sequences with fixed counts of each value
    shape: Length up to 10^6
  kill_signals:
  - 'n is at least the prime or huge: C(14, 7) modulo 7 is 2, but 14! is a multiple of 7 and the table
    formula gives 0.'
  - 'The modulus is not prime: C(6, 3) modulo 8 is 4, but the inverse factorials do not exist and the
    formula gives 0.'
  in_action:
    statement: Print the number of strings of length n with exactly r letters a and n − r letters b, modulo
      10^9 + 7, for many queries.
    constraints: n ≤ 10^6, up to 2·10^5 queries.
    budget: Listing the strings is 2^n. Pascal's triangle up to 10^6 is 10^12 entries. Tables of factorials
      are 2·10^6 multiplications, then O(1) per query.
    candidates:
    - tool: Pascal's triangle
      verdict: rejected
      because: It needs n² / 2 entries, 5·10^11 for n = 10^6.
    - tool: Factorial and inverse factorial tables
      verdict: chosen
      because: The modulus 10^9 + 7 is prime and above n, so every factorial has an inverse and each coefficient
        is O(1).
    property_check: The count is C(n, r) (a choice of the r positions of the letter a), n ≤ 10^6 is below
      the prime 10^9 + 7 and fits a table (Theorem 2.3.3).
    decision: Build fact and inv up to 10^6 once, and print fact[n] · inv[r] · inv[n − r] modulo p for
      each query.
  examples:
    positive:
    - inline:
        input: The strings of length 6 with exactly 2 letters a and 4 letters b
        answer: '15'
        why: The string is fixed by the positions of the two a's, C(6, 2) = 15.
    - worked_example: ac-abc145_d
      why: The order of the a + b moves is a choice of which moves are of the first kind, C(a + b, a),
        with a + b up to 10^6.
    negative:
    - inline:
        input: C(14, 7) modulo 7 (n is above the prime)
        answer: '2'
        method_gives: '0'
        why: 14! is a multiple of 7, so the factorial table gives 0 and no inverse of 7! exists; the true
          coefficient is 3432 and 3432 mod 7 = 2. Small n can be computed by recursion on Pascal's rule.
      correct_tool:
        topic: '0.5'
        card: recursive-choices
    - inline:
        input: C(6, 3) modulo 8 (the modulus is not prime)
        answer: '4'
        method_gives: '0'
        why: 3! = 6 has no inverse modulo 8, so the formula with Fermat inverses breaks; the true coefficient
          is 20 and 20 mod 8 = 4.
      correct_tool:
        topic: '0.5'
        card: recursive-choices
  lookalikes:
  - description: Count sequences of length n over k symbols with no restriction
    tool:
      topic: '2.2'
      card: fast-power
    flipping_difference: Without positions to choose, every position is free; the count is k^n by the
      product rule, no binomial coefficient.
  complexity: O(N) to build the tables, O(1) per coefficient.
- id: product-sum-rules
  name: Product and sum rules
  decisive_property: The objects are built by a sequence of choices whose number of options does not depend
    on the earlier choices (multiply), or split into disjoint cases (add).
  from_theorem: 2.3.1
  how_to_test: Describe how to build one object step by step, and check that the number of options at
    each step is the same whatever came before, and that no object is built twice.
  constraint_shapes:
  - 'n up to 2·10^5 positions with their own limits: trying every assignment is up to 10^9 ^ n, while
    one sorted pass multiplies n options.'
  weak_signals:
  - form: Each position gets a value with a restriction against the previous one ("different from its
      neighbour")
    shape: n up to 10^18, answer modulo a prime
  - form: Count the ways to fill or assign, where values must be distinct and each has its own upper limit
    shape: n up to 2·10^5 and limits up to 10^9
  - form: Count pairs or sequences by splitting into cases by one feature
    shape: A few cases, each with a simple count
  kill_signals:
  - 'The same object can be built in several orders: the committees of 2 out of 4, counted as 4 · 3 =
    12 choices, are 6; divide by the overcount or use a binomial coefficient.'
  - 'The number of options at a step depends on which earlier options were taken: strings of length 3
    over {a, b, c} using at most two letters are 21, not 3 · 2 · 2 = 12.'
  in_action:
    statement: Count the sequences of n different integers with 1 ≤ A_i ≤ C_i, modulo 10^9 + 7.
    constraints: n ≤ 2·10^5, C_i ≤ 10^9.
    budget: Trying all assignments is exponential. After sorting the limits, a product of n numbers is
      2·10^5 steps.
    candidates:
    - tool: Try all assignments by recursion
      verdict: rejected
      because: Exponential in n.
    - tool: Sort the limits and multiply the options
      verdict: chosen
      because: In sorted order, position i has C_i − i options whatever the smaller values were, so the
        product rule applies.
    property_check: In sorted order the i smaller values taken are all at most C_i, so the number of options
      is C_i − i and does not depend on which values were chosen (Theorem 2.3.1).
    decision: Sort the limits; multiply C_i − i, and print 0 if any factor is not positive.
  examples:
    positive:
    - inline:
        input: Strings of length 3 over {a, b, c} with no two equal neighbours
        answer: '12'
        why: 3 options for the first letter and 2 for each later one, whatever the previous letter was,
          3 · 2 · 2.
    - worked_example: lc-count-ways-to-make-array-with-product
      why: The prime factors of k are placed independently, so the numbers of ways for the different primes
        multiply.
    negative:
    - inline:
        input: The committees of 2 people out of 4, counted as 4 choices for the first and 3 for the second
        answer: '6'
        method_gives: '12'
        why: The same committee is built in two orders (A then B, B then A), so the product counts each
          twice; the count is C(4, 2) = 6.
      correct_tool:
        topic: '2.3'
        card: ncr-mod-p
    - inline:
        input: Strings of length 3 over {a, b, c} using at most two different letters, counted as 3 ·
          2 · 2
        answer: '21'
        method_gives: '12'
        why: A global condition makes the options at a step depend on the earlier letters; count all 27
          strings and subtract the 6 that use all three letters.
      correct_tool:
        topic: '2.3'
        card: include-exclude
  lookalikes:
  - description: Count the 3-letter strings over an alphabet using at most two different letters
    tool:
      topic: '2.3'
      card: include-exclude
    flipping_difference: A global condition on the whole string makes the options at a step depend on
      earlier letters; subtract the strings that break it.
  complexity: O(number of steps).
- id: stars-bars
  name: Identical items into labelled groups
  decisive_property: The question counts ways to split n identical items (or a total n) into k labelled
    parts with non-negative or lower-bounded sizes; a split is a choice of k − 1 bar positions among n
    + k − 1 symbols.
  from_theorem: 2.3.5
  how_to_test: Check that the items are identical, the groups distinguishable, and only lower bounds constrain
    the sizes; shift the lower bounds away.
  constraint_shapes:
  - 'n and k up to 10^6: listing the splits is C(n + k − 1, k − 1), astronomically many, while one binomial
    coefficient needs tables of size n + k.'
  weak_signals:
  - form: Distribute n identical candies or apples among k children
    shape: n and k up to 10^6
  - form: Count non-decreasing sequences of length k with values in [1, m]
    shape: k and m up to 10^6
  - form: Count ways to write a number as an ordered sum of k parts, or exponents summing to a total
    shape: The total up to 10^6
  kill_signals:
  - 'The parts have upper bounds: 7 candies for 3 children with at most 3 each is 6 ways, not C(9, 2)
    = 36; add inclusion–exclusion over the violated bounds.'
  - 'The items are different: 3 different candies for 2 children are 2^3 = 8 ways, not C(4, 1) = 4.'
  in_action:
    statement: Count the solutions of x_1 + … + x_k = n in integers with x_i ≥ l_i, modulo 998244353.
    constraints: n, k ≤ 10^6, l_i ≤ 10^6.
    budget: Listing the solutions is out of the question. One binomial coefficient with a factorial table
      of size n + k is 2·10^6 multiplications.
    candidates:
    - tool: Recursion over the values of x_1, …, x_k
      verdict: rejected
      because: The number of solutions is astronomical.
    - tool: Stars and bars after removing the lower bounds
      verdict: chosen
      because: With y_i = x_i − l_i the parts are non-negative, and the count is one binomial coefficient.
    property_check: The items are identical, the groups are labelled and only lower bounds appear (Theorem
      2.3.5, part 3).
    decision: L = sum of l_i; if L > n print 0; otherwise print C(n − L + k − 1, k − 1).
  examples:
    positive:
    - inline:
        input: 7 identical candies for 3 children (some may get none)
        answer: '36'
        why: C(7 + 2, 2) = 36, the positions of two bars among nine symbols.
    - worked_example: lc-count-ways-to-make-array-with-product
      why: The e copies of a prime p are spread over the n array slots, a split of e identical items into
        n labelled parts, C(e + n − 1, n − 1).
    negative:
    - inline:
        input: 7 identical candies for 3 children, each child getting at most 3
        answer: '6'
        method_gives: '36'
        why: The upper limit removes the splits where a child gets 4 or more; subtract them by inclusion–exclusion
          (or list the 6 splits (3, 3, 1) and (3, 2, 2) in any order).
      correct_tool:
        topic: '2.3'
        card: include-exclude
    - inline:
        input: 3 different candies for 2 children
        answer: '8'
        method_gives: '4'
        why: Different candies each choose a child independently, 2 · 2 · 2 = 8; the formula C(3 + 1,
          1) = 4 treats them as identical.
      correct_tool:
        topic: '2.2'
        card: fast-power
  lookalikes:
  - description: Distribute n different items among k children
    tool:
      topic: '2.2'
      card: fast-power
    flipping_difference: Different items each choose a child independently, k^n, not a stars-and-bars
      count.
  complexity: O(1) per count after the factorial tables.
- id: include-exclude
  name: Inclusion–exclusion over bad properties
  decisive_property: The objects must avoid several properties at once, and for every set of properties
    the number of objects having all of them is easy to count; the alternating sum over the sets then
    counts the objects with none.
  from_theorem: 2.3.6
  how_to_test: Name the bad properties, write N(S) for a set S of them, and check that N(S) has a formula;
    then check that the number of sets (2^m, or m + 1 sizes) is affordable.
  constraint_shapes:
  - 'm up to 15 properties and N up to 10^18: testing every number is 10^18, while 2^15 = 32768 terms
    is trivial; with m = 40 the 2^40 terms are too many.'
  weak_signals:
  - form: Count numbers up to N divisible by none (or at least one) of a few given numbers
    shape: N up to 10^18 and m ≤ 15 numbers
  - form: Strings or arrays that must contain each of several values at least once
    shape: A few values and a length up to 10^6
  - form: Permutations with no fixed points; distributions where no part exceeds a limit
    shape: n up to 10^6 and a prime modulus
  kill_signals:
  - 'N(S) is miscounted for overlapping sets: the integers in 1..100 divisible by 4 or 6 are 33, but N/(4·6)
    in place of N/lcm(4, 6) gives 37.'
  - 'The number of properties is large and N(S) depends on the whole set S: 2^m terms are too many.'
  in_action:
    statement: Count the integers in [1, N] divisible by none of a_1, …, a_m.
    constraints: N ≤ 10^18, m ≤ 15, a_i ≤ 10^9.
    budget: Testing every integer is 10^18. The alternating sum has 2^15 terms, each an lcm and a division.
    candidates:
    - tool: Test every integer up to N
      verdict: rejected
      because: 10^18 tests.
    - tool: Inclusion–exclusion over the subsets of the a_i
      verdict: chosen
      because: For a set S, the integers divisible by all of S are N / lcm(S), an easy count.
    property_check: Each bad property is "divisible by a_i", and N(S) = ⌊N / lcm(S)⌋ has a formula for
      every set S (Theorem 2.3.6).
    decision: For every subset S of the indices, add or subtract N / lcm(S) by the parity of |S|.
  examples:
    positive:
    - inline:
        input: The integers in 1..100 divisible by none of 2, 3, 5
        answer: '26'
        why: 100 − (50 + 33 + 20) + (16 + 10 + 6) − 3 = 26.
    - inline:
        input: The permutations of 4 elements with no fixed point
        answer: '9'
        why: The sum over j of (−1)^j C(4, j) (4 − j)! = 24 − 24 + 12 − 4 + 1 = 9.
    negative:
    - inline:
        input: The integers in 1..100 divisible by 4 or by 6, with the overlap taken as N/(4·6)
        answer: '33'
        method_gives: '37'
        why: The multiples of both 4 and 6 are the multiples of lcm(4, 6) = 12, which are 8, not 100/24
          = 4; the overlap term needs the lcm.
      correct_tool:
        topic: '0.4'
        card: gcd-lcm
    - problem: ac-abc145_d
      why: There are no bad properties to avoid; the moves are counted by choosing which of them are of
        one kind.
      correct_tool:
        topic: '2.3'
        card: bijection-paths
  lookalikes:
  - description: Count numbers up to N divisible by 6 or by 10
    tool:
      topic: '0.4'
      card: gcd-lcm
    flipping_difference: With only two sets, Theorem 0.4.6 (part 3) already gives the answer; inclusion–exclusion
      is its generalisation to many sets.
  complexity: O(2^m) terms, or O(m) when N(S) depends only on |S|.
- id: bijection-paths
  name: Counting by a bijection
  decisive_property: The objects correspond one-to-one with choices of positions (for example the right
    steps of a lattice path, or the moves of each type), so their number is a single binomial coefficient.
  from_theorem: 2.3.7
  how_to_test: Find what fixes an object (which steps go right, how many moves of each kind), check that
    every such choice gives exactly one object, and count the choices.
  constraint_shapes:
  - 'A grid of 10^6 by 10^6: walking every path is C(2·10^6, 10^6) ≈ 10^600000, while one coefficient
    with tables up to 2·10^6 is O(1).'
  weak_signals:
  - form: Walks on a grid with right and up (or down) steps only
    shape: Coordinates up to 10^6
  - form: Reach a point with two kinds of moves; how many move orders?
    shape: Targets up to 10^6
  - form: Sequences with a fixed number of each of two symbols
    shape: Length up to 10^6
  kill_signals:
  - 'Cells to avoid: the paths from (0, 0) to (2, 2) avoiding the cell (1, 1) are 2, not C(4, 2) = 6.'
  - 'More than two kinds of steps with no fixed counts: with a diagonal step too there are 13 paths to
    (2, 2), not 6.'
  in_action:
    statement: Count the lattice paths from (0, 0) to (a, b) with right and up steps, and those through
      a given cell, modulo 998244353.
    constraints: a, b ≤ 10^6, up to 2·10^5 cells.
    budget: Enumerating paths is hopeless. Factorials up to a + b are 2·10^6 multiplications, then each
      count is O(1).
    candidates:
    - tool: A table of the number of paths to each cell
      verdict: rejected
      because: A grid of 10^6 by 10^6 cells does not fit.
    - tool: Choose the positions of the right steps
      verdict: chosen
      because: A path is fixed by which of its a + b steps go right, one coefficient C(a + b, a).
    property_check: Only right and up steps, every subset of positions gives exactly one path (Theorem
      2.3.7).
    decision: 'paths(a, b) = C(a + b, a); through (x, y): paths(x, y) · paths(a − x, b − y).'
  examples:
    positive:
    - inline:
        input: The lattice paths from (0, 0) to (2, 2) with right and up steps
        answer: '6'
        why: Each path is fixed by which 2 of its 4 steps go right, C(4, 2) = 6.
    - worked_example: ac-abc145_d
      why: The moves (+1, +2) and (+2, +1) with fixed counts a and b are fixed by which of the a + b moves
        are of the first kind.
    negative:
    - inline:
        input: The lattice paths from (0, 0) to (2, 2) that avoid the cell (1, 1)
        answer: '2'
        method_gives: '6'
        why: The blocked cell breaks the bijection; subtract the paths through it, 2 · 2 = 4, leaving
          6 − 4 = 2.
      correct_tool:
        topic: '2.3'
        card: include-exclude
    - inline:
        input: The paths from (0, 0) to (2, 2) with right, up and diagonal steps
        answer: '13'
        method_gives: '6'
        why: With three kinds of steps the number of steps is not fixed, so there is no single choice
          of positions; enumerate with recursion (or a table in Phase 3).
      correct_tool:
        topic: '0.5'
        card: recursive-choices
  lookalikes:
  - description: Grid paths that must avoid a few blocked cells
    tool:
      topic: '2.3'
      card: include-exclude
    flipping_difference: The blocked cells break the bijection; subtract the paths through them, sorted
      by position.
  complexity: O(1) per count after the factorial tables.
problems:
- id: ac-abc145_d
  role: worked_example
  summary: A piece moves by (+1, +2) or (+2, +1); count the move sequences from (0, 0) to (X, Y) with
    X, Y ≤ 10^6, modulo 10^9 + 7.
- id: lc-count-ways-to-make-array-with-product
  role: worked_example
  summary: For up to 10^4 queries (n, k) with n, k ≤ 10^4, count the arrays of n positive integers with
    product k, modulo 10^9 + 7.
- id: cses-1079
  role: ladder
  card: ncr-mod-p
  rung: 1
  twist: Base case of the card
  summary: Answer 10^5 queries C(a, b) modulo 10^9 + 7 with 0 ≤ b ≤ a ≤ 10^6.
  hints:
  - Computing each coefficient from scratch costs up to 10^6 steps. What can be prepared once?
  - Tables of i! and (i!)^(−1) modulo the prime up to 10^6 (Theorem 2.3.3).
  - Answer each query as fact[a]·inv[b]·inv[a − b], reducing after each product.
- id: cses-1715
  role: ladder
  card: ncr-mod-p
  rung: 2
  twist: 'Repeated letters: a multinomial coefficient.'
  summary: How many different strings can be made from all the letters of a given string of length up
    to 10^6? Modulo 10^9 + 7.
  hints:
  - Count the copies of each letter. Which arrangements are the same string?
  - n!/(c_a!·c_b!·…·c_z!) (Theorem 2.3.4).
  - One factorial table up to n; divide by multiplying with inverse factorials.
- id: cf-1462E1
  role: ladder
  card: ncr-mod-p
  rung: 3
  twist: Sort, fix the smallest chosen element, and choose the others from a window.
  summary: Count the triples i < j < z whose largest and smallest values differ by at most 2 (values ≤
    n, total n ≤ 2·10^5 over the tests; exact count).
  hints:
  - 'Sort first: which elements can join a triple whose smallest element is a[i]?'
  - 'Exactly those after i with value at most a[i] + 2: a window ending at some j, found with a pointer
    (topic 1.3).'
  - Add C(j − i, 2) for each i; the answer fits in long long without any modulus.
- id: cf-1475E
  role: ladder
  card: ncr-mod-p
  rung: 4
  twist: Only the ties at the boundary of the best k create choices.
  summary: Choose k of n bloggers (n ≤ 1000) to maximise their total followers; count the ways to reach
    the maximum, modulo 10^9 + 7.
  hints:
  - Sort the followers in decreasing order. Which bloggers are in every best choice?
  - All with more followers than the k-th largest value x. Among the c bloggers with exactly x, any r
    of them can fill the remaining places.
  - The answer is C(c, r), with r the number of x's among the top k.
- id: lc-count-anagrams
  role: ladder
  card: ncr-mod-p
  rung: 5
  twist: A product of multinomial coefficients, one per word.
  summary: Count the strings obtained by permuting the letters within each word of a sentence (length
    ≤ 10^5), modulo 10^9 + 7.
  hints:
  - 'Words are independent: the product rule over the words.'
  - One word gives its length factorial divided by the factorials of its letter counts (Theorem 2.3.4).
  - Build one factorial table up to 10^5 and multiply the multinomial coefficients of all words.
- id: cf-1359E
  role: ladder
  card: ncr-mod-p
  rung: 6
  twist: Prove which arrays work, then count chains of multiples with one binomial each.
  summary: Count the increasing arrays 1 ≤ a_1 < … < a_k ≤ n (n, k ≤ 5·10^5) such that the remainder after
    a chain of mod operations never depends on the order; modulo 998244353.
  hints:
  - Try small arrays. When does the order of the mod operations matter?
  - 'Exactly when some element is not a multiple of the smallest one: the array works if and only if a_1
    divides every a_i.'
  - 'For each a_1, choose the other k − 1 elements among the ⌊n/a_1⌋ − 1 larger multiples: add C(⌊n/a_1⌋
    − 1, k − 1) over a_1.'
- id: ac-abc209_c
  role: ladder
  card: product-sum-rules
  rung: 1
  twist: Base case of the card
  summary: Count the sequences of pairwise different integers with 1 ≤ A_i ≤ C_i (N ≤ 2·10^5, C_i ≤ 10^9),
    modulo 10^9 + 7.
  hints:
  - Choose the values position by position. In which order is the number of options fixed?
  - 'Sort the limits increasingly: the i-th position (0-based) then always has C_i − i options (Theorem
    2.3.1).'
  - Multiply the options modulo the prime; if one is at most 0 the answer is 0.
- id: lc-right-triangles
  role: ladder
  card: product-sum-rules
  rung: 2
  twist: Split by the corner (sum rule), then multiply the two other choices.
  summary: Count the triples of 1-cells in a grid where one cell shares a row with the second and a column
    with the third.
  hints:
  - Which cell of the triangle is special? Fix it.
  - 'Fix the corner cell: the second cell is any other 1 in its row, the third any other 1 in its column,
    independently.'
  - Count 1s per row and column; add (row count − 1)·(column count − 1) over all 1-cells.
- id: lc-number-of-ways-to-split-a-string
  role: ladder
  card: product-sum-rules
  rung: 3
  twist: Two independent cut positions, plus a separate case with no 1s.
  summary: Split a binary string (length ≤ 10^5) into three non-empty parts with equal numbers of 1s;
    count the ways modulo 10^9 + 7.
  hints:
  - With t ones, each part must contain t/3 of them. Where can the first cut go?
  - Anywhere between the (t/3)-th and the (t/3 + 1)-th one; the second cut likewise after the (2t/3)-th
    one. The two choices are independent.
  - 'Multiply the two gap sizes; if t = 0, any 2 of the n − 1 gaps work: C(n − 1, 2).'
- id: lc-count-all-valid-pickup-and-delivery-options
  role: ladder
  card: product-sum-rules
  rung: 4
  twist: Build the sequence by inserting one order at a time.
  summary: Count the sequences of n pickups and n deliveries (n ≤ 500) where each delivery comes after
    its pickup, modulo 10^9 + 7.
  hints:
  - Suppose the first i − 1 orders are placed. In how many ways can order i be inserted?
  - 'There are 2i − 1 gaps among the 2i − 2 events; the pickup and delivery take two slots in order: i(2i
    − 1) ways, the same for every earlier arrangement.'
  - Multiply i(2i − 1) over i = 1..n modulo the prime.
- id: ac-abc220_e
  role: ladder
  card: product-sum-rules
  rung: 5
  twist: Split by the top vertex of the path and the depth reached on each side.
  summary: Count ordered pairs of vertices at distance D in a perfect binary tree of depth N (N ≤ 10^6,
    D ≤ 2·10^6), modulo 998244353.
  hints:
  - A path has a highest vertex. Split the pairs by its depth and by how far the path goes down on each
    side.
  - 'Going down d steps from a vertex reaches 2^d vertices; going down on both sides needs the two different
    child subtrees: 2^(a−1)·2^(b−1) pairs for a + b = D.'
  - For each depth of the top vertex, the valid (a, b) form a range; sum with powers of 2 precomputed,
    and multiply by 2 for the order.
- id: cses-1716
  role: ladder
  card: stars-bars
  rung: 1
  twist: Base case of the card
  summary: Count the ways to give m identical apples to n children (n, m ≤ 10^6), modulo 10^9 + 7.
  hints:
  - The apples are identical and the children are not. Draw a distribution as stars and separators.
  - 'm stars and n − 1 bars in a row: C(m + n − 1, n − 1) (Theorem 2.3.5).'
  - Factorial table up to 2·10^6.
- id: lc-count-sorted-vowel-strings
  role: ladder
  card: stars-bars
  rung: 2
  twist: A sorted string is fixed by how many of each letter it has.
  summary: Count the strings of length n ≤ 50 over the five vowels whose letters are in non-decreasing
    order.
  hints:
  - Given the number of a's, e's, i's, o's and u's, how many sorted strings have exactly those counts?
  - 'Exactly one, so count the 5 counts that add up to n: stars and bars with k = 5.'
  - C(n + 4, 4), small enough for exact integers.
- id: lc-count-the-number-of-ideal-arrays
  role: ladder
  card: stars-bars
  rung: 3
  twist: Fix the last value, then split each prime's exponent along the array.
  summary: Count the arrays of length n ≤ 10^4 with values in [1, maxValue ≤ 10^4] where each element
    divides the next, modulo 10^9 + 7.
  hints:
  - Fix the last element v. What does a chain of divisors ending at v look like, prime by prime?
  - 'For each prime of v with exponent e, the exponent is non-decreasing along the array: its e increases
    are placed among n positions, C(e + n − 1, n − 1) ways (stars and bars).'
  - Multiply over the primes of v (factorise with a smallest prime factor table) and add over all v ≤
    maxValue.
- id: cses-1078
  role: ladder
  card: include-exclude
  rung: 1
  twist: Base case of the card
  summary: Count right/down paths across an n × n grid (n ≤ 10^6) avoiding m ≤ 1000 traps, modulo 10^9
    + 7.
  hints:
  - Paths without traps are one binomial coefficient. How do you remove those through traps without removing
    some twice?
  - 'Sort the traps; let f(t) be the paths from the start to trap t that avoid earlier traps: all paths
    to t minus f(s)·paths(s, t) for traps s before t.'
  - The answer is all paths minus Σ f(t)·paths(t, end); O(m²) binomials from factorial tables.
- id: cf-1295D
  role: ladder
  card: include-exclude
  rung: 2
  twist: Count residues coprime to a number by inclusion–exclusion over its primes.
  summary: For given a < m ≤ 10^10, count x in [0, m) with gcd(a + x, m) = gcd(a, m) (up to 50 tests).
  hints:
  - Divide by g = gcd(a, m). Which values of (a + x)/g work, and what range do they cover?
  - They must be coprime to m/g, and as x runs over [0, m) they run over a full set of residues modulo
    m/g.
  - Factorise m/g by trial division and count the numbers in [1, m/g] divisible by none of its primes
    (Theorem 2.3.6).
- id: ac-abc172_e
  role: ladder
  card: include-exclude
  rung: 3
  twist: The bad properties are positions where the two sequences agree; N(S) depends only on |S|.
  summary: Count pairs of sequences A, B of N distinct values from 1..M with A_i ≠ B_i at every position
    (N ≤ M ≤ 5·10^5), modulo 10^9 + 7.
  hints:
  - Fix A (M!/(M − N)! ways). For B, the bad properties are A_i = B_i at position i.
  - 'If B must agree with A on a set S of j positions, the other N − j positions take distinct values
    from the remaining M − j: (M − j)!/(M − N)! ways.'
  - Sum (−1)^j C(N, j)·(M − j)!/(M − N)! over j, then multiply by the count for A.
- id: lc-unique-paths
  role: ladder
  card: bijection-paths
  rung: 1
  twist: Base case of the card
  summary: Count right/down paths across an m × n grid (m, n ≤ 100); the answer fits in 2·10^9.
  hints:
  - How many steps of each kind does every path have?
  - m − 1 down and n − 1 right; a path is fixed by which steps go down (Theorem 2.3.7).
  - C(m + n − 2, m − 1), computed exactly by multiplying and dividing one factor at a time.
- id: cses-2064
  role: ladder
  card: bijection-paths
  rung: 2
  twist: Count the bad paths by reflecting them (a bijection with an easier set).
  summary: Count the valid bracket sequences of length n ≤ 10^6, modulo 10^9 + 7.
  hints:
  - A sequence is a path with steps +1 and −1 that must never go below 0. How many paths are there without
    that condition?
  - 'Reflect the part of a bad path before it first reaches −1: bad paths correspond one-to-one to all
    paths ending at −2.'
  - 'For n = 2k: C(2k, k) − C(2k, k + 1); for odd n the answer is 0.'
- id: ac-abc205_e
  role: ladder
  card: bijection-paths
  rung: 3
  twist: The same reflection with a shifted boundary.
  summary: Arrange N white and M black balls (N, M ≤ 10^6) so that every prefix has at most K more whites
    than blacks; count modulo 10^9 + 7.
  hints:
  - A row is a lattice path; the condition is a line the path must never cross. When is the answer 0 immediately?
  - If N > M + K, no row works. Otherwise reflect each bad path at its first touch of the line w − b =
    K + 1.
  - 'The bad rows correspond to all rows with M + K + 1 whites: answer C(N + M, N) − C(N + M, M + K +
    1).'
- id: ac-abc132_d
  role: drill
  summary: Arrange K blue and N − K red balls (N ≤ 2000); for each i, count the rows in which the blue
    balls form exactly i groups, modulo 10^9 + 7.
- id: ac-abc156_d
  role: drill
  summary: Count the non-empty subsets of n ≤ 10^9 flowers whose size is neither a nor b (a, b ≤ 2·10^5),
    modulo 10^9 + 7.
- id: ac-abc178_d
  role: drill
  summary: Count the sequences of integers, each at least 3, with sum S ≤ 2000, modulo 10^9 + 7.
- id: cf-1288C
  role: drill
  summary: Count pairs of arrays a (non-decreasing) and b (non-increasing) of length m ≤ 10 over 1..n
    (n ≤ 1000) with a_i ≤ b_i, modulo 10^9 + 7.
- id: cses-1717
  role: drill
  summary: Count the ways to give n ≤ 10^6 children each a gift brought by someone else, modulo 10^9 +
