drill:
- problem: cf-1328A
  answer:
    topic: '0.1'
    card: integer-rounding
  property: 'The answer is (b − a mod b) mod b: an exact remainder computation, 0 when b already divides
    a.'
  why_others_fail: Multi-test is present but not the decision; a loop adding 1 until divisible takes up
    to 10^9 steps per test.
- problem: cf-1409A
  answer:
    topic: '0.1'
    card: integer-rounding
  property: Each move changes a by at most 10, so the answer is ⌈|a − b| / 10⌉, an exact ceiling of non-negative
    values.
  why_others_fail: Trying moves one by one is up to 10^8 steps per test; floating-point ceil is unnecessary.
- problem: cf-1791A
  answer:
    topic: '0.1'
    card: multi-test
  property: 'Each test is one letter and constant work: the only decision is reading t tests correctly.'
  why_others_fail: 'No large values and no rounding: the other cards do not apply.'
