drill:
- problem: lc-implement-trie-prefix-tree
  answer:
    topic: '6.3'
    card: prefix-tree
  property: startsWith asks about the beginning of stored words; a trie with an end flag answers insert,
    search and startsWith in the length of the word.
  why_others_fail: A set of strings answers search but not startsWith, which would scan all stored words.
- problem: lc-extra-characters-in-a-string
  answer:
    topic: '6.3'
    card: dictionary-split
  property: 'dp[i] = the fewest leftover letters from the place i: either leave the letter (1 + dp[i +
    1]) or use a dictionary word that begins at i (dp[i + length]); the words at i come from one trie
    walk.'
  why_others_fail: Trying every word at every place costs the number of words per place; with a large
    dictionary the trie walk makes the cost independent of it.
- problem: lc-camelcase-matching
  answer:
    topic: '1.3'
    card: merge-walk
  property: 'A query matches if the pattern is a subsequence of it and every letter of the query not used
    by the pattern is lower case: one two-pointer pass per query.'
  why_others_fail: One query is compared with one pattern; there is no set of strings with shared beginnings.
- problem: lc-top-k-frequent-words
  answer:
    topic: '0.6'
    card: heap-extract
  property: Count the words in a map and take the k best by (count descending, word ascending) with a
    sort or a heap.
  why_others_fail: The order is by count and then by word, not by prefix; a trie would only replace the
    map.
- problem: lc-words-within-two-edits-of-dictionary
  answer:
    topic: '0.5'
    card: nested-loops
  property: With 100 queries, 100 dictionary words and 100 letters, comparing every pair letter by letter
    is 10^6 steps.
  why_others_fail: The sizes are small; no structure on beginnings is needed.
- problem: lc-partition-string
  answer:
    topic: '0.6'
    card: set-membership
  property: Extend the current segment until it is not in the set of segments seen so far, add it, and
    go on; each letter is read once.
  why_others_fail: The segments are tested as whole strings against a set; no question about beginnings
    is asked.
- problem: lc-replace-words
  answer:
    topic: '6.3'
    card: prefix-tree
  property: For every word of the sentence, the walk down the trie of the roots stops at the first node
    where a root ends; that root is the shortest one that begins the word.
  why_others_fail: Testing every root against every word costs the number of roots per word; the trie
    walk costs the length of the word.
- problem: lc-longest-word-in-dictionary
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: Sort the words; a word can be built if its word without the last letter was built earlier,
    which a set of the built words answers in one lookup.
  why_others_fail: A trie works too, but the sorted order and a set of built words are shorter; no walk
    along shared beginnings is needed.
lookalike_pairs:
- a: lc-count-prefix-and-suffix-pairs-ii
  b: lc-count-prefix-and-suffix-pairs-i
  a_tool:
    topic: '6.3'
    card: prefix-tree
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both count the pairs i < j for which words[i] is both a prefix and a suffix of words[j].
  flipping_difference: 'In version I there are at most 50 words of at most 10 letters, so testing every
    pair costs about 1225 · 10 steps. In version II there are up to 10^5 words: encode each word as the
    sequence of pairs (letter k from the front, letter k from the back) and count, in a trie of such pair-keys
    with end counts, the earlier words that are a beginning of the current one.'
  flipping_input: '100 000 words of average length 5: the number of pairs is about 5·10^9, each tested
    in up to 5 steps, while the trie needs about 5·10^5 steps in all.'
- a: lc-delete-duplicate-folders-in-system
  b: lc-remove-sub-folders-from-the-filesystem
  a_tool:
    topic: '6.3'
    card: prefix-tree
  b_tool:
    topic: '1.1'
    card: sort-then-scan
  shared_surface: Both are about a list of folder paths and the folders inside other folders.
  flipping_difference: In the problem with sub-folders, sorting the paths puts every folder directly before
    the folders inside it, so one pass that remembers the last kept folder decides each path. In the problem
    with duplicate folders, two folders are equal when their whole sets of sub-folders are equal, which
    needs the tree of folders and a name for every subtree.
  flipping_input: 'The paths /a, /a/b, /c, /c/b: sorting alone removes /a/b and /c/b, but deciding that
    /a and /c are duplicates needs the folders below them to be compared as trees.'
self_test:
- q: Build the trie of the words to, tea, ten, i, in. Give pass for every non-root node and say how many
    nodes there are.
  a: 'The nodes are t (pass 3), to (1), te (2), tea (1), ten (1), i (2), in (1): 7 non-root nodes, 8 with
    the root, and at most S + 1 = 2 + 3 + 3 + 1 + 2 + 1 = 12 are possible.'
- q: For the same five words, use Theorem 6.3.2 to find the sum of the longest common prefixes over all
    10 pairs.
  a: 'Add C(pass, 2) over the nodes: t gives 3, te gives 1, i gives 1, the others 0: the sum is 5. Directly:
    to–tea 1, to–ten 1, tea–ten 2, i–in 1, all other pairs 0.'
- q: The dictionary is a, ab, abc and the text is abcab. Which dictionary words begin at place 0, and
    in how many ways can the text be cut?
  a: 'The walk from place 0 passes the end nodes of a (length 1), ab (2) and abc (3). Only one cutting
    exists: abc + ab. Check with the DP: ways[5] = 1, ways[4] = ways[2] = ways[1] = 0 (no word begins
    with b or c), ways[3] = ways[5] = 1 (ab), ways[0] = ways[3] = 1 (abc).'
- q: A trie stores n words of total length S over 26 letters. How many nodes can it have at most, and
    how many array entries does the code use at most?
  a: 'At most S + 1 nodes (Theorem 6.3.1 (a)), and 26 entries per node: 26 (S + 1). For S = 10^6 that
    is 26 million entries, about 100 MB of int.'
- q: The stored words are ab, abc and b. After removing ab, what are the counts of the beginnings a, ab
    and b?
  a: 'The removal subtracts 1 from the nodes root, a and ab. Now abc and b are stored: count(a) = 1 (abc),
    count(ab) = 1 (abc), count(b) = 1.'
- q: In the forbidden-prefix problem, Y has ab (twice) and abc, and then ab goes into X. By how much does
    each node on the path root, a, ab change, and what is the answer?
  a: The node ab has count 3 (ab, ab, abc). The count 3 is subtracted from the root, from a and from ab,
    and ab is marked blocked. The root count is 0, so the answer is 0.
- q: Why is a trie of beginnings no help when the forbidden strings are endings?
  a: A trie shares the beginnings of strings, so a node answers questions about the first letters. Whether
    a string ends with bc is decided by its last letters, which are at the bottom of its path and shared
    with nothing; blocking the node bc blocks strings that begin with bc.
checkpoint:
  time_limit_minutes: 150
  problems:
  - ac-abc287_e
  - lc-concatenated-words
  - ac-abc403_e
decision_map:
- weak_signal: How many strings begin with a given string; the longest common prefix of a string with
    the others; the sum of common prefixes over all pairs; a best value kept for every prefix
  choose: prefix-tree
  when: The questions are about beginnings and the answer for a beginning is kept on one node of a shared
    tree (Theorems 6.3.1 and 6.3.2).
  over:
  - card: sorted-search
    topic: '1.4'
    because: For a fixed set and plain counts, sorted words with two binary searches give a count without
      building a tree.
  - card: map-counting
    topic: '0.6'
    because: Whole strings compared as objects (anagrams, equal words) need a map, not a tree.
- weak_signal: At each place of a text, which dictionary words start there; cutting a string into dictionary
    words with a large dictionary
  choose: dictionary-split
  when: One walk of the text down the trie lists all the words that begin at the place (Theorem 6.3.3).
  over:
  - card: linear-state
    topic: '3.3'
    because: With a small dictionary or short words, a set of substrings gives the words of each place;
      the DP is the same.
  - card: pattern-occurrences
    topic: '6.2'
    because: One pattern is matched with the prefix function; many words that begin at every place use
      the trie.
- weak_signal: A board or a string explored by backtracking where a branch can be dropped as soon as no
    dictionary word begins with the letters so far
  choose: prefix-tree
  when: The trie tells at each step whether any word still begins with the letters read (Theorem 6.3.1
    (b)), so dead branches are cut at once.
  over:
  - card: generate-all
    topic: '3.1'
    because: Backtracking without a trie tries every continuation and tests the word at the end.
  - card: bound-pruning
    topic: '3.1'
    because: A numeric bound prunes by value; a trie prunes by whether a word can still be formed.
- weak_signal: Strings added and removed or blocked while a count of the allowed strings, or the sum of
    values under a beginning, is asked after each operation
  choose: counted-trie
  when: Each operation changes the counts on the path of one string and each question reads one node (Theorem
    6.3.4).
  over:
  - card: map-counting
    topic: '0.6'
    because: A map of counts answers whole strings, not beginnings.
  - card: sorted-search
    topic: '1.4'
    because: With no changes, sorted strings and two binary searches give the count of a beginning.
glossary_added:
- trie
- pass count
