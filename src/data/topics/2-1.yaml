  hints:
  - Common divisors of A and B are the divisors of gcd(A, B). Which divisors can be pairwise coprime?
  - Each chosen divisor other than 1 needs a prime of its own; one prime per divisor is enough.
  - 'Answer: 1 + the number of distinct primes of gcd(A, B), found by trial division.'
- id: cses-1081
  role: ladder
  card: multiples-sieve
  rung: 1
  twist: Base case of the card
