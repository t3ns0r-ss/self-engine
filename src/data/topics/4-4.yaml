- weak_signal: Connect everything at the least total price; keep the cheapest set of roads or cables so
    that all places stay connected; a few extra "build here" options.
  choose: cheapest-connect
  when: The answer is a set of edges that connects all vertices at the least total weight (Theorems 4.4.4
