- id: lc-minimum-limit-of-balls-in-a-bag
  role: drill
  summary: Split bags of balls (n ≤ 10^5 bags, each ≤ 10^9 balls) with at most maxOperations ≤ 10^9 splits
    to minimise the largest bag.
- id: lc-closest-subsequence-sum
  role: lookalike
  summary: Choose a subsequence of n ≤ 40 numbers (|value| ≤ 10^7) whose sum is as close as possible to
