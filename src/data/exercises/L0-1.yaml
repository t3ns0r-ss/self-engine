topic: L0.1
exercises:
- id: rung-1
  role: ladder
  type: change_ladder
  title: A Money that can never hold a bad value
  prompt: Implement Money(cents, currency) (see kit.hpp). No Money may ever hold a negative amount or a currency that is not exactly three capital letters; the constructor throws std::invalid_argument. Keep the fields private.
  card: class-invariant
  rung: 1
  new_force: A Money type must never hold a negative amount
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.1/ladder/rung-1
  reference: reference/L0.1/ladder/rung-1
  alternatives:
  - 'A plain struct with public fields: no code to write, and any caller can write a negative amount.'
  hints:
  - Write the rule as one sentence about the fields. Which function is the only way to create a Money?
  - Check both parts in the constructor, before storing anything, and keep the fields private.
  - 'A struct with public fields cannot refuse a value: the tests check that Money is not a plain struct.'
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: rung-2
  role: ladder
  type: change_ladder
  title: Adding must not overflow or mix currencies
  prompt: Add Money::add. It returns a new Money, throws std::invalid_argument for different currencies and std::overflow_error when the sum does not fit in a long long. Neither operand changes.
  card: class-invariant
  rung: 2
  new_force: Money addition must not overflow or mix currencies
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.1/ladder/rung-2
  reference: reference/L0.1/ladder/rung-2
  alternatives:
  - 'Use a wider integer type for the sum: avoids the check for small amounts and only moves the limit.'
  hints:
  - What goes wrong if you add first and look at the result afterwards?
  - Compare one operand with what is left of the largest value before adding.
  - Build the result with the Money constructor so that the rule is checked once more.
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: rung-3
  role: ladder
  type: change_ladder
  title: An immutable date range
  prompt: Implement DateRange, an immutable range with start <= end. with_start and with_end return a new range; a change that would break the rule throws std::invalid_argument. The old range is never altered.
  card: immutable-value
  rung: 3
  new_force: A DateRange must keep start <= end after every change
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.1/ladder/rung-3
  reference: reference/L0.1/ladder/rung-3
  alternatives:
  - 'A mutable range with set_start and set_end: each setter must look at the other end, and a two-step change can leave a broken range in between.'
  hints:
  - If nothing can write to a DateRange after it is built, which functions can break the rule?
  - The constructor is the only place that must check; with_start and with_end can build a new range through it.
  - Return a new DateRange from with_start; never assign to the fields of this.
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: rung-4
  role: ladder
  type: change_ladder
  title: A value shared by two orders
  prompt: Implement Address::with_street and Order. An Order holds a std::shared_ptr<const Address>; two orders can share one Address object, and replacing the address of one order never shows in the other.
  card: immutable-value
  rung: 4
  new_force: A value object is shared between two orders
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.1/ladder/rung-4
  reference: reference/L0.1/ladder/rung-4
  alternatives:
  - 'Copy the Address into each order: simpler, always safe, and costs a copy per order.'
  hints:
  - If two orders hold the same object, what must be true of that object so that one order cannot disturb the other?
  - Hold the address by pointer to const; a change replaces the pointer in one order only.
  - with_street returns a new Address with the same city.
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: rung-5
  role: ladder
  type: change_ladder
  title: A bag of independent settings
  prompt: 'Implement describe(const Settings&) for the plain struct Settings. Do not turn Settings into a class: no combination of the four fields is invalid, so there is nothing to protect.'
  card: null
  rung: 5
  new_force: A bag of independent settings with no relationship between fields
  needs_new_structure: false
  checkers:
  - kind: kit
    path: L0.1/ladder/rung-5
  reference: reference/L0.1/ladder/rung-5
  alternatives:
  - 'A class with getters and setters: 4 fields become about 20 lines and guard nothing.'
  hints:
  - Is there any combination of values that is invalid?
  - If not, a struct with public fields already accepts exactly the valid values.
  - Write describe as a function that only reads the struct.
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: ex-1
  role: worked_example
  type: recognise
  title: Display preferences with no rule between them
  prompt: 'A settings screen keeps four preferences: dark mode on or off, a font size, a language code and whether tips are shown. Any combination is allowed. A colleague proposes a Settings class with private fields, getters and setters. Decide.'
  answer:
    kind: none
    simplest: A plain struct
    why: No combination is invalid, so a class would guard nothing; five such fields take 21 lines as a class and 9 as a struct.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: ex-2
  role: worked_example
  type: recognise
  title: A grid position used as a key
  prompt: A map from grid positions (x and y) to the item standing there is used by a game. A position is sometimes shifted by one step. Decide how a position should be represented.
  card: immutable-value
  answer:
    kind: card
    card: &id001
      topic: L0.1
      card: immutable-value
    property: A map key must not change after insertion; shifting builds a new position.
    why_others_fail: A position with public x and y can be edited while it is a key, and the map can then no longer find the entry.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-1
  role: drill
  type: recognise
  title: Seats on a flight
  prompt: A booking system keeps the number of seats booked on a flight. It must stay between 0 and the capacity after every booking and every cancellation.
  answer:
    kind: card
    card: &id002
      topic: L0.1
      card: class-invariant
    property: A rule about the object's own fields, checked before each change; every change goes through the class.
    why_others_fail: A public counter lets any code push it past the capacity.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-2
  role: drill
  type: recognise
  title: Board tiles as table keys
  prompt: A game board stores the item on each tile in a lookup table keyed by the tile's row and column. Tiles are never edited, only replaced by other tiles.
  answer:
    kind: card
    card: *id001
    property: The key must not change after insertion; "moving" a tile builds a new one.
    why_others_fail: A key with public fields can be edited while it sits in the table.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-3
  role: drill
  type: recognise
  title: Three unrelated display options
  prompt: 'A struct of unrelated display preferences: dark mode, font size, sidebar width. Any combination is valid.'
  answer:
    kind: none
    simplest: A plain struct
    why: No rule between the fields, so a class would only add code.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-4
  role: drill
  type: recognise
  title: A temperature reading in many places
  prompt: A temperature reading is copied into the log, shown on three screens and stored in a history. No holder may be able to alter what another holder sees.
  answer:
    kind: card
    card: *id001
    property: Several holders of one value; nobody can change it after it is built.
    why_others_fail: A mutable reading edited by one screen changes the log entry that another holder keeps.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-5
  role: drill
  type: recognise
  title: An account balance
  prompt: A bank balance may never go below zero after any operation.
  answer:
    kind: card
    card: *id002
    property: A rule about one field; every operation checks before it writes.
    why_others_fail: A public balance can be set to anything by any line of the program.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-6
  role: drill
  type: recognise
  title: One line parsed into five strings
  prompt: A function parses one line and returns a struct of five strings. The caller reads the fields once and drops it.
  answer:
    kind: none
    simplest: A plain struct
    why: Nothing changes the result after it is returned, so there is no later state to protect.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-7
  role: drill
  type: recognise
  title: A tree node and an iterator
  prompt: A tree node is owned by its parent and referenced by an iterator that never outlives the tree.
  answer:
    kind: card
    card:
      topic: L0.0
      card: ownership-pointer
    property: The parent is the single owner; the iterator only observes and ends first.
    why_others_fail: A shared pointer would add a count for an ownership that is already clear.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: r-8
  role: drill
  type: recognise
  title: A lock, two files and four returns
  prompt: A function takes a lock, opens two files and has 4 return statements, one of which comes from a call that throws. Everything it opened must be released.
  answer:
    kind: card
    card:
      topic: L0.0
      card: raii
    property: Acquire in constructors and release in destructors, so all exits release.
    why_others_fail: Release calls before each return miss the throw.
  checkers: []
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: cp-1
  role: checkpoint
  type: build
  title: Build a Percentage and a Discount that cannot hold bad values
  prompt: Build Percentage and Discount in 45 minutes (see exercises/L0.1/cp-1). A percentage is 0 to 100; a discount has a percentage and a minimum spend, applies from the minimum spend inclusive, rounds down, and refuses negative amounts. Neither class may ever hold a bad value. Add a short decision record naming the rule each class protects and the one place it is checked.
  card: class-invariant
  clarifying:
  - q: What range is a valid percentage, and what happens outside it?
    a: 0 to 100 inclusive; outside it the constructor throws std::invalid_argument.
    critical: true
  - q: Is the minimum spend inclusive?
    a: 'Yes: a total equal to the minimum qualifies.'
    critical: true
  - q: How is the discount rounded?
    a: Down, to whole cents.
    critical: true
  - q: Can a Discount be changed after it is built?
    a: No. It is built once and only read.
    critical: false
  - q: What does none() do?
    a: A discount that changes nothing.
    critical: false
  checkers:
  - kind: kit
    path: L0.1/cp-1
  - kind: rubric
    id: rubric-lld-build-v1
  reference: reference/L0.1/cp-1
  time_limit_minutes: 45
  techniques:
  - L0.1
  checked_on: '2026-10-19'
- id: rev-1-1
  role: review
  type: recognise
  title: Width, height and a stored area
  prompt: A Rectangle keeps width, height and a stored area, with setWidth and setHeight. After setWidth, the area still shows the old product. Name the rule that was broken and say where it should be protected.
  card: class-invariant
  review_set: 1
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: The rule area == width * height involves only the object's fields; every setter must keep it, or the area should be computed instead of stored.
    why_others_fail: Public fields or independent setters let one field change without the other.
  checkers: []
- id: rev-1-2
  role: review
  type: recognise
  title: A user id
  prompt: A user id is created when the account is made, printed on invoices, stored in logs and used to look up the account. Decide whether it should be a mutable field or something else.
  card: immutable-value
  review_set: 1
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id001
    property: Many holders and a lookup that depends on the id staying the same; nothing should change it.
    why_others_fail: A mutable id edited by one holder would break every lookup that kept the old one.
  checkers: []
- id: rev-1-3
  role: review
  type: refactor
  title: A stack that trusts its callers
  prompt: A Stack has a public size field and unchecked push and pop. Make it protect its own rule.
  card: class-invariant
  review_set: 1
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  checkers:
  - kind: kit
    path: L0.1/rev-1-3
  reference: reference/L0.1/rev-1-3
- id: rev-2-1
  role: review
  type: build
  title: A duration that stores seconds and exposes minutes
  prompt: Write a Duration that stores whole seconds, is never negative, never changes, and exposes whole minutes and the leftover seconds.
  card: immutable-value
  review_set: 2
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  checkers:
  - kind: kit
    path: L0.1/rev-2-1
  reference: reference/L0.1/rev-2-1
  clarifying:
  - q: What are the units stored and exposed?
    a: Whole seconds are stored; minutes (rounded down) and the leftover seconds are exposed.
    critical: true
  - q: May a duration be negative?
    a: No; construction refuses it.
    critical: true
  - q: Can a Duration change after it is built?
    a: No; plus returns a new Duration.
    critical: false
  - q: How are minutes rounded?
    a: Down.
    critical: false
- id: rev-2-2
  role: review
  type: recognise
  title: A stack with a public size
  prompt: A stack class has a public integer size and an array of 8 items; push writes items[size] and adds 1. A caller sets size to 12. Name the broken rule and the fix.
  card: class-invariant
  review_set: 2
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  answer:
    kind: card
    card: *id002
    property: The rule 0 <= size <= 8 involves the object's own fields; make the field private and check in push and pop.
    why_others_fail: A public size lets any caller leave the rule behind.
  checkers: []
- id: rev-2-3
  role: review
  type: recognise
  title: A row read from a file
  prompt: A reader returns a struct of six strings for each row of a file; the caller prints it and drops it. Someone proposes private fields, getters and setters.
  card: class-invariant
  review_set: 2
  techniques:
  - L0.1
  checked_on: '2026-10-19'
  answer:
    kind: none
    simplest: A plain struct
    why: Any six strings are valid and nothing changes the row afterwards; a class would guard nothing.
  checkers: []

