decision_map:
- weak_signal: “Expected number of …” in a random process; a random permutation or random swaps
  choose: indicator-linearity
  when: The quantity is a count (or weighted count) of events whose single probabilities have formulas;
    dependence does not matter (Theorem 2.4.2).
  over:
  - card: include-exclude
    because: For the probability that at least one event happens, linearity is not enough; use inclusion–exclusion
      or the complement.
    topic: '2.3'
  - card: nested-loops
    because: Simulating or listing the random outcomes is exponential; linearity needs only one probability
      per event.
    topic: '0.5'
- weak_signal: Sum over all subarrays, subsets or pairs of their minimum, maximum, sum or number of distinct
    values
  choose: contribution-total
  when: The value of a configuration is a sum over its elements (or pairs) of a condition, and each element's
    number of configurations can be counted (Theorem 2.4.3).
  over:
  - card: element-span
    because: For subarray minima or maxima, the count per element comes from the nearest smaller or greater
      elements (topic 1.6); the contribution technique is the frame around it.
    topic: '1.6'
  - card: range-sum
    because: When the question is about one element against all others, prefix sums answer it directly;
      no total over configurations is needed.
    topic: '1.2'
- weak_signal: “Expected number of attempts until …”; collect all kinds; restart on failure
  choose: geometric-wait
  when: 'Independent trials with a fixed success probability within each stage: 1/p per stage, and the
    stages add (Theorem 2.4.5).'
  over:
  - card: indicator-linearity
    because: A fixed number of trials asks about the result, not the waiting time.
  - card: fast-power
    because: The probability of at least one success in k trials is 1 − (1 − p)^k, a power, not a waiting
      time.
    topic: '2.2'
- weak_signal: Expected maximum or minimum of independent dice or draws; expected k-th smallest
  choose: tail-sum
  when: The value is a non-negative integer and P(X ≥ x) factors over independent parts, so E[X] = Σ P(X
    ≥ x) (Theorem 2.4.4).
  over:
  - card: indicator-linearity
    because: A sum of the values is linear; only maxima and minima need tail sums.
  - card: nested-loops
    because: Listing all m^k outcomes is exponential; the tail sum needs m terms.
    topic: '0.5'
