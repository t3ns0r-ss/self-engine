  hints:
  - Can a route be infinite? What falls with every move?
  - Each move costs a positive amount of fuel, so (city, fuel) states form a DAG with fuel falling.
  - dp[city][fuel] = (city = finish) + the sum of dp[next][fuel − cost] over every other city next with
    cost ≤ fuel, memoised, modulo 10^9 + 7. 100 · 200 states with 100 moves each.
- id: lc-frog-jump
  role: ladder
