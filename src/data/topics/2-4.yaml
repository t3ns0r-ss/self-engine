drill:
- problem: cses-3410
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: The Manhattan distance |dx| + |dy| is the larger of |(x+y) − (x'+y')| and |(x−y) − (x'−y')|,
    so after each addition keep the running largest and smallest values of x + y and of x − y.
  why_others_fail: 'The question is about distances, but no side of a line, area or boundary is asked:
    the cross product and the hull do not give the Manhattan farthest pair.'
- problem: ac-abc075_d
  answer:
    topic: '0.5'
    card: nested-loops
  property: N ≤ 50, so choose the left, right, bottom and top sides among the point coordinates (50⁴ =
    6.25·10^6 choices), count the points inside each choice, and keep the smallest area with a count of
    at least K.
  why_others_fail: The rectangle is axis-parallel and the answer is a count, not a side or an area from
    cross products; trying all choices fits the budget.
- problem: cf-2009D
  answer:
    topic: '0.6'
    card: set-membership
  property: With y equal to 0 or 1, a right angle is at a point that has a partner directly above or below
    it (any third point gives a triangle) or at (x, 1) with (x − 1, 0) and (x + 1, 0) present, and the
    same with the rows swapped; count them with a set of the points.
  why_others_fail: There are only two rows, so every right angle has one of a few shapes found by a set
    lookup; no cross product is needed.
- problem: cf-1850G
  answer:
    topic: '0.6'
    card: map-counting
  property: Two points can see each other when they share x, y, x + y or x − y; count the points with
    each key in four maps, and a key with k points gives k(k − 1) ordered pairs.
  why_others_fail: The only directions are the row, the column and the two diagonals, so equal keys replace
    any test of collinearity.
- problem: cf-1486B
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'The Manhattan distance splits into an x part and a y part. Sort the x values and the y values:
    the sum is smallest between the two middle values, and the answer is the product of the number of
    integers there in each axis.'
  why_others_fail: The cost is a sum of absolute differences, which separates by axis; there is no polygon
    and no hull.
- problem: cf-1648A
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: For every colour list the row numbers of its cells in sorted order and the column numbers
    in sorted order; the sum of |a_i − a_j| over all pairs is computed with prefix sums in one scan. Add
    the row part and the column part.
  why_others_fail: It sums distances over pairs, but the distance splits by axis, so sorting each axis
    and a scan answer it; the sweep with a set is not needed.
- problem: cf-1550C
  answer:
    topic: '0.5'
    card: enumerate-answer
  property: Every window of 5 points contains a bad triple, so a good segment has at most 4 points; test
    the windows of length 3 and 4 directly and count the good segments by extending each start to its
    longest good window.
  why_others_fail: The word "Manhattan" suggests geometry, but a bounded window and brute force decide
    it.
- problem: lc-minimum-time-visiting-all-points
  answer:
    topic: '0.2'
    card: closed-form
  property: Between two points the least time is max(|dx|, |dy|), the Chebyshev distance; add the legs.
  why_others_fail: Each leg has a closed form; no polygon, side test or sorted pass is involved.
lookalike_pairs:
- a: lc-largest-triangle-area
  b: lc-largest-perimeter-triangle
  a_tool:
    topic: '2.4'
    card: cross-sign
  b_tool:
    topic: '1.1'
    card: sort-then-scan
  shared_surface: Both ask for the largest triangle (by area in the first, by perimeter in the second)
    that three of the given objects can form, and both give a small list of numbers.
  flipping_difference: In the first the objects are points, and the area of three of them is a cross product.
    In the second they are side lengths, and only the triangle inequality matters, which a sort puts next
    to each other.
  flipping_input: 'The numbers 2, 3, 4: as side lengths they form a triangle of perimeter 9. As the points
    (2, 0), (3, 0), (4, 0) they are on one line, the cross product is 0 and the area is 0.'
- a: lc-minimum-area-rectangle-ii
  b: lc-minimum-area-rectangle
  a_tool:
    topic: '2.4'
    card: cross-sign
  b_tool:
    topic: '0.6'
    card: set-membership
  shared_surface: Both ask for the smallest area of a rectangle whose four corners are among the given
    points.
  flipping_difference: In the second the sides are parallel to the axes, so the opposite corners decide
    and a set of points answers "is the other corner there". In the first the sides may point in any direction,
    and a right angle is tested with a dot product and the area is a cross product.
  flipping_input: The points (0,0), (2,1), (3,−1), (1,−2) form a tilted rectangle of area 5 (the sides
    are (2,1) and (1,−2), and their dot product is 0). The axis-parallel version finds no rectangle in
    them and answers 0.
self_test:
- q: Give three points with coordinates up to 10^9 whose cross product is −1 but which look as if they
    were on one line, and say what a test with `double` numbers answers.
  a: A = (0, 0), B = (10^9, 10^9 − 1) and C = (10^9 − 1, 10^9 − 2). The cross product is 10^9·(10^9 −
    2) − (10^9 − 1)² = −1, so C is just to the right of AB. In doubles both products are about 10^18 and
    are rounded to the same multiple of 128, so the difference is 0 and the points look collinear. Theorem
    2.4.1 holds exactly for `long long`.
- q: The segments (0,0)-(2,0) and (1,0)-(5,0) are on one line. What are the four signs of Theorem 2.4.2,
    and which condition makes the answer yes? What changes if the second segment is (3,0)-(5,0)?
  a: All four signs are 0. The end (1, 0) has sign 0 with the first segment and lies in its bounding box,
    so condition (2) holds and the answer is yes. With (3,0)-(5,0) all four signs are still 0, but no
    end lies in the bounding box of the other segment, so the answer is no.
- q: Twice the area of the triangle (0,0), (5,0), (0,5) is 25. How many lattice points lie on its border
    and how many inside it?
  a: The border has 5 + 5 + 5 = 15 lattice points (each edge has gcd(5, 0) = 5, gcd(5, 5) = 5 or gcd(0,
    5) = 5 points, not counting its end). Pick's theorem 2A = 2I + B − 2 gives 25 = 2I + 15 − 2, so I
    = 6 (Theorem 2.4.3).
- q: In the point-in-polygon test a corner at the height of the point counts as lying just above the ray.
    For the diamond (2,0), (4,2), (2,4), (0,2) and the point (−1, 2), the ray passes through two corners.
    How many edges are counted, and what is the answer?
  a: Two edges are counted (the edge from (4,2) to (2,4) and the edge from (2,4) to (0,2)); the edges
    below the ray are not counted. The count is even, so the point is outside, which is right (Theorem
    2.4.4, step 4).
- q: In the monotone chain, what changes if the stack pops on cross ≤ 0 instead of cross < 0, and for
    which input do the outputs differ?
  a: With cross ≤ 0 a point in the middle of an edge is removed, so only the corners remain; with cross
    < 0 such points stay. For the three points (0,0), (1,1), (2,2) the first rule gives the two end points
    and the second gives all three (Theorem 2.4.5).
- q: In the closest-pair sweep, why does the scan over the window look at only a few points, however many
    points there are?
  a: All points seen before the current one are at least d apart, where d is the best distance so far.
    The window rectangle is d wide and 2d high, and it can be cut into 8 squares of side d/2, each holding
    at most one such point, so at most 8 points are scanned (Theorem 2.4.6, step 3).
- q: For the Manhattan distance, why is the farthest pair of n points not found among the corners of the
    convex hull, and what is the right tool?
  a: For (0,0), (10,0), (6,6) all three points are corners and the farthest pair in the ordinary distance
    is (0,0)-(10,0) with Manhattan distance 10, while the largest Manhattan distance is 12 between (0,0)
    and (6,6). The largest |dx| + |dy| is the larger of the ranges of x + y and x − y, found by running
    extremes (topic 1.2).
