decision_map:
- weak_signal: Answers modulo 10^9 + 7 with n up to 10^9 or 10^18 and a formula like k^n; n independent
    positions with k choices each
  choose: fast-power
  when: The answer is a power (or a product of a few powers) modulo m and the exponent is far too large
    to multiply step by step (Theorem 2.2.1).
  over:
  - card: mod-arithmetic-basic
    because: Multiplying step by step with a reduction each time is enough only when the exponent is small
      (say up to 10^7).
    topic: '0.4'
  - card: overflow-64bit
    because: 'When the power is the modulus (m mod 2^n), no power is computed: m is the answer once 2^n
      > m.'
    topic: '0.1'
- weak_signal: A formula with a division, a geometric sum, a probability or fraction printed modulo 998244353
  choose: inverse-prime
  when: The modulus is prime and no divisor in the formula is a multiple of it, so division is multiplication
    by a^(p−2) and fractions combine as residues (Theorems 2.2.3 and 2.2.4).
  over:
  - card: mod-arithmetic-basic
    because: Division does not commute with reducing; (a/b) mod p is not (a mod p)/(b mod p). Halve exactly
      before reducing, or multiply by an inverse.
    topic: '0.4'
  - card: bezout
    because: For a composite modulus there is no Fermat inverse; extended Euclid gives one exactly when
      gcd(a, m) = 1.
    topic: '2.1'
- weak_signal: Towers a^(b^c), exponents given as huge numbers or products, the product of all divisors
  choose: exponent-reduction
  when: The base's modulus p is prime and p ∤ a, so the exponent only matters modulo p − 1 (Theorem 2.2.5).
  over:
  - card: fast-power
    because: Fast power needs the exponent as a number; when it is itself a huge power, reduce it first.
  - card: mod-arithmetic-basic
    because: Reducing an exponent modulo p (instead of p − 1) gives wrong answers; exponents and values
      have different periods.
    topic: '0.4'
