# Topic 3.4 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '3.4'
uses:
- topic: '0.3'
  what: String processing and case analysis
- topic: '0.6'
  what: Maps for counting and looking up values
- topic: '1.1'
  what: 'Sorting: sorting pairs by one key with a chosen tie order'
- topic: '1.3'
  what: 'Two pointers: the definition of a subsequence, and checking whether one string is a subsequence
    of another'
- topic: '1.2'
  what: Prefix sums
- topic: '1.4'
  what: 'Binary search: lower_bound and upper_bound on a sorted array'
- topic: '1.5'
  what: Greedy choices, including earliest end first for intervals
- topic: '2.1'
  what: Number theory
- topic: '3.3'
  what: Knapsack and subset sums
- topic: '3.2'
  what: 'Dynamic programming foundations: states, Theorems 3.2.1 and 3.2.3, two-index tables, reconstruction
    (Theorem 3.2.6)'
theorems:
- id: 3.4.1
  title: LIS by ending position
  plain_words: The longest increasing subsequence ending at a position is one more than the best one ending
    at an earlier, smaller element. Computing this for every position takes n² steps, which is fine for
    n up to a few thousand and works for any pairwise rule.
  code: 3.4/thm-1
- id: 3.4.2
  title: The tails array
  plain_words: For each length, keep only the smallest value an increasing subsequence of that length
    can end with. These values increase with the length, so each new element finds its place by binary
    search, and the whole thing takes n log n.
  code: 3.4/thm-2
- id: 3.4.3
  title: Chains in two keys
  plain_words: To find the longest chain in which both of two keys must increase, sort by the first key,
    breaking ties by the second key in decreasing order, and take the longest increasing subsequence of
    the second key. The tie order stops pairs with equal first keys from joining a chain.
  code: 3.4/thm-3
- id: 3.4.4
  title: Longest common subsequence
  plain_words: For two prefixes, if the last characters are equal, match them and add one to the answer
    for the shorter prefixes. Otherwise drop the last character of one prefix or the other and take the
    better. A table of all prefix pairs gives the answer.
  code: 3.4/thm-4
- id: 3.4.5
  title: Edit distance
  plain_words: Any sequence of single-character edits lines the two strings up in columns. Looking at
    the last column, the cheapest edit cost of two prefixes comes from the three shorter prefix pairs,
    by deleting, inserting or aligning the last characters.
  code: 3.4/thm-5
cards:
- id: lis
  name: Longest increasing subsequence
  decisive_property: The answer is the longest subsequence in which each chosen element must exceed (or
    be at least) the previous chosen one, a rule between consecutive chosen elements only; then the smallest
    possible last value for each length forms a sorted array, and each element updates it by one binary
    search.
  from_theorem: 3.4.2
  how_to_test: Check that the rule compares only consecutive chosen elements and is an order (<, ≤); decide
    strict (lower_bound) or non-strict (upper_bound); for other pairwise rules with n ≤ 5000, use the
    O(n²) table of Theorem 3.4.1.
  constraint_shapes:
  - 'n up to 2·10^5: the table over ending positions is n² / 2 = 2·10^10 steps, while the tails array
    is n log n = 3.5·10^6.'
  weak_signals:
  - form: Longest strictly increasing or non-decreasing subsequence
    shape: n up to 2·10^5
  - form: Fewest elements to delete or change so that the array becomes sorted
    shape: n up to 2·10^5
  - form: For every position, the longest increasing subsequence ending there
    shape: n up to 2·10^5
  kill_signals:
  - 'The chosen elements must be contiguous: the longest increasing run of 1 3 2 4 5 is 3, but its LIS
    is 4.'
  - 'Elements may be reordered: the longest increasing sequence from 3 1 4 1 5 after reordering has the
    4 distinct values, while the LIS is 3.'
  in_action:
    statement: Print the length of the longest strictly increasing subsequence of n numbers.
    constraints: n ≤ 2·10^5.
    budget: The table over ending positions is 2·10^10 steps. The tails array is n binary searches, 3.5·10^6
      steps.
    candidates:
    - tool: Table L[i] over ending positions
      verdict: rejected
      because: n² / 2 = 2·10^10 steps.
    - tool: Tails array with a binary search per element
      verdict: chosen
      because: The smallest ending value per length is increasing, so each new element is placed by lower_bound.
    property_check: The rule compares only consecutive chosen elements and is a strict order (Theorem
      3.4.2).
    decision: 'For each x: it = lower_bound(tails, x); append if at the end, else *it = x; print the size
      of tails.'
  examples:
    positive:
    - inline:
        input: The longest strictly increasing subsequence of 3 1 4 1 5 9 2 6
        answer: '4'
        why: The tails array ends as 1 2 5 6; for instance 1, 4, 5, 9 is an increasing subsequence of
          length 4.
    - worked_example: cses-1145
      why: A direct longest strictly increasing subsequence with n up to 2·10^5, one binary search per
        element.
    negative:
    - inline:
        input: The longest contiguous increasing run of 1 3 2 4 5, computed as the LIS
        answer: '3'
        method_gives: '4'
        why: A subsequence may skip elements; a subarray may not. One scan counting the current run answers
          it.
      correct_tool:
        topic: '1.1'
        card: sort-then-scan
    - inline:
        input: The longest strictly increasing sequence from 3 1 4 1 5 when the elements may be reordered,
          computed as the LIS
        answer: '4'
        method_gives: '3'
        why: With reordering allowed, sorting the distinct values 1, 3, 4, 5 gives length 4; the order
          of the input is not a constraint.
      correct_tool:
        topic: '1.1'
        card: sort-then-scan
  lookalikes:
  - description: The longest contiguous strictly increasing subarray
    tool:
      topic: '1.1'
      card: sort-then-scan
    flipping_difference: Contiguity means a single scan counting the current run is enough; a subsequence
      may skip elements, which needs the tails array.
  complexity: O(n log n); O(n²) for the simple table.
- id: lis-reduction
  name: Chains after sorting one key
  decisive_property: Items have two keys and a chain needs both to increase (nested envelopes, boxes,
    pairs, players by age and score); after sorting by the first key, with ties ordered so that equal
    first keys cannot follow each other, a chain is exactly an increasing subsequence of the second key.
  from_theorem: 3.4.3
  how_to_test: Write the chain condition as "both keys increase"; choose the tie order for equal first
    keys (second key decreasing for strict chains) and check a small case with equal first keys by hand.
  constraint_shapes:
  - 'n up to 2·10^5 envelopes: checking every pair for nesting is 2·10^10, while one sort and one tails
    array are 4·10^6.'
  weak_signals:
  - form: Put boxes or envelopes inside each other; stack cuboids
    shape: n up to 2·10^5
  - form: Choose a team or a sequence where two attributes must both increase
    shape: n up to 2·10^5
  - form: Order is free in the input, but the chain must be increasing in two measures
    shape: Pairs of integers up to 10^9
  kill_signals:
  - 'The next pair only has to start after the previous one ends: for (1, 2), (2, 3), (3, 4) the longest
    such chain is 2, but both coordinates increase along all three pairs (use earliest end first).'
  - 'Only one key matters: a plain longest increasing subsequence, with no sort needed.'
  in_action:
    statement: Print the largest number of envelopes that can be nested, an envelope fitting in another
      when both its width and its height are strictly smaller.
    constraints: n ≤ 2·10^5.
    budget: Checking every pair is 2·10^10. A sort and a tails array are about 4·10^6 steps.
    candidates:
    - tool: Table over ending envelopes
      verdict: rejected
      because: n² / 2 steps.
    - tool: Sort by width (ties by height decreasing), then LIS of the heights
      verdict: chosen
      because: A chain is an increasing subsequence of the heights, and the tie order stops equal widths
        from joining it.
    property_check: The chain condition is both keys strictly increasing, and equal first keys are sorted
      so that their second keys decrease (Theorem 3.4.3).
    decision: Sort by (w ascending, h descending); run the strict tails array on the heights.
  examples:
    positive:
    - inline:
        input: The longest nesting of the envelopes (5, 4), (6, 4), (6, 7), (2, 3)
        answer: '3'
        why: 'Sorted: (2, 3), (5, 4), (6, 7), (6, 4); the heights 3, 4, 7, 4 have LIS 3.'
    - inline:
        input: The longest chain with both keys increasing among (1, 1), (2, 2), (2, 3), (3, 4)
        answer: '3'
        why: The pairs with equal first key 2 cannot both be used; the chain (1, 1), (2, 2), (3, 4) has
          length 3.
    negative:
    - inline:
        input: The longest chain of (1, 2), (2, 3), (3, 4) where the next pair must start after the previous
          one ends
        answer: '2'
        method_gives: '3'
        why: Here the pairs are intervals that must be disjoint, not pairs that grow in both keys; take
          the earliest end first.
      correct_tool:
        topic: '1.5'
        card: interval-selection
    - problem: cses-1145
      why: A single key and no pairs; the plain tails array is enough with no sorting step.
      correct_tool:
        topic: '3.4'
        card: lis
  lookalikes:
  - description: The longest chain of pairs (a, b) where b of one is less than a of the next
    tool:
      topic: '1.5'
      card: interval-selection
    flipping_difference: Each pair is an interval and the chain needs them disjoint in order; the earliest
      end first is optimal. Nested envelopes need both sides increasing, which sorting alone does not
      give.
  complexity: O(n log n) after sorting.
- id: lcs
  name: Longest common subsequence
  decisive_property: Two sequences are matched in order, the best value for two prefixes depends only
    on shorter prefixes (matching two equal last elements never hurts), and n·m fits; the table over prefix
    pairs gives the answer and, walking back, one optimal matching.
  from_theorem: 3.4.4
  how_to_test: Name the state (i, j) = prefix lengths, list the three moves (skip a_i, skip b_j, match
    both), and check n·m ≤ about 10^7.
  constraint_shapes:
  - 'Two strings of length 5000: the table has 2.5·10^7 cells; two sequences of 10^5 would have 10^10.'
  weak_signals:
  - form: Two strings or arrays; keep elements in order on both sides
    shape: Lengths up to 1000 to 5000 each
  - form: Fewest deletions to make two strings equal; lines between equal numbers that must not cross
    shape: n and m up to 5000
  - form: Lengths up to 1000–5000 each
    shape: Table of n · m cells
  kill_signals:
  - 'One sequence has distinct values that are a permutation of the other''s: for two permutations of
    length 10^5 the table has 10^10 cells, and the answer, 626 for the shuffled one, is the LIS of the
    positions.'
  - 'Only whether one is a subsequence of the other: two pointers decide it in linear time.'
  in_action:
    statement: Print the length of the longest common subsequence of two strings of lengths up to 5000.
    constraints: n, m ≤ 5000.
    budget: All subsequences of the first string are 2^5000. The table has 2.5·10^7 cells, two rows of
      memory.
    candidates:
    - tool: Try every subsequence of one string
      verdict: rejected
      because: 2^n subsequences.
    - tool: Table over prefix pairs
      verdict: chosen
      because: If the last characters are equal, match them; otherwise one of them is unused, and both
        smaller cases are in the table.
    property_check: The value for two prefixes depends only on shorter prefixes and n · m = 2.5·10^7 fits
      (Theorem 3.4.4).
    decision: C[i][j] = C[i − 1][j − 1] + 1 if a_i = b_j, else max(C[i − 1][j], C[i][j − 1]); print C[n][m].
  examples:
    positive:
    - inline:
        input: The longest common subsequence of ACB and ABC
        answer: '2'
        why: The table ends in 2; the common subsequences of length 2 are AB and AC.
    - inline:
        input: The longest common subsequence of AGGTAB and GXTXAYB
        answer: '4'
        why: The subsequence GTAB is in both, and no common subsequence has length 5.
    negative:
    - inline:
        input: The LCS of a shuffled permutation of 1..100000 and the identity
        answer: '626'
        method_gives: too-slow
        why: The table has 10^10 cells; with distinct values each element matches at most one position
          and the LCS is the LIS of the positions.
      correct_tool:
        topic: '3.4'
        card: lis
    - problem: ac-abc185_e
      why: A replacement costs 1 while a deletion costs 1 per side, so the answer is not 2 · (n − LCS);
        the table must count replacements.
      correct_tool:
        topic: '3.4'
        card: edit-distance
  lookalikes:
  - description: Is s a subsequence of t?
    tool:
      topic: '1.3'
      card: merge-walk
    flipping_difference: Matching each character of s at its first possible place in t is never worse,
      so two pointers decide it in O(|s| + |t|); the LCS table is needed only when both sides may skip
      characters.
  complexity: O(n·m) time, O(m) memory with two rows if only the length is needed.
- id: edit-distance
  name: Edit distance
  decisive_property: One string is turned into another by single-character insertions, deletions and replacements
    with per-operation costs; every edit sequence is an alignment read left to right, so the cheapest
    cost for two prefixes comes from the three shorter prefix pairs.
  from_theorem: 3.4.5
  how_to_test: Check that the operations act on single characters with fixed costs (possibly different
    per operation), set the base cases E[i][0] and E[0][j], and check n·m.
  constraint_shapes:
  - 'Two strings of length 5000: the table has 2.5·10^7 cells; trying every sequence of edits is exponential.'
  weak_signals:
  - form: 'Fewest operations to turn one string into another: insert, delete, replace'
    shape: Lengths up to 5000
  - form: Is a string within distance k of another; spelling correction
    shape: Lengths up to 5000
  - form: Different costs for deleting, inserting and replacing
    shape: n · m cells
  kill_signals:
  - 'Only deletions are allowed on both sides: "a" to "b" costs 2 by deletions, so n + m − 2·LCS applies,
    not the edit distance 1.'
  - 'Only replacements are allowed on equal-length strings: abc to bca has 3 differing positions, while
    the edit distance is 2 (a deletion and an insertion).'
  in_action:
    statement: Print the edit distance between two strings of lengths up to 5000.
    constraints: n, m ≤ 5000, operations insert, delete, replace at cost 1.
    budget: Trying every sequence of edits is exponential. The table has 2.5·10^7 cells.
    candidates:
    - tool: Try every sequence of edits
      verdict: rejected
      because: The number of sequences is exponential.
    - tool: Table over prefix pairs
      verdict: chosen
      because: The last column of an alignment is a deletion, an insertion or an alignment of the last
        characters, and the cost of each is the shorter table entry plus its own cost.
    property_check: Every edit sequence gives an alignment of at most the same cost, so the cheapest alignment
      is the answer (Theorem 3.4.5).
    decision: E[i][0] = i, E[0][j] = j; E[i][j] = min(E[i − 1][j] + 1, E[i][j − 1] + 1, E[i − 1][j − 1]
      + [a_i ≠ b_j]); print E[n][m].
  examples:
    positive:
    - inline:
        input: The edit distance from cat to cut
        answer: '1'
        why: Replace a by u; the table's only change is E[2][2] = E[1][1] + 1.
    - worked_example: ac-abc185_e
      why: Removing an element from either side costs 1 and keeping a mismatched pair costs 1, the same
        three moves as the edit distance.
    negative:
    - inline:
        input: The fewest deletions from a and b (deletions only) to make them equal, computed as the
          edit distance
        answer: '2'
        method_gives: '1'
        why: A replacement does in one step what costs two deletions; with only deletions the answer is
          n + m − 2·LCS, here 2.
      correct_tool:
        topic: '3.4'
        card: lcs
    - inline:
        input: The fewest replacements to turn abc into bca (replacements only), computed as the edit
          distance
        answer: '3'
        method_gives: '2'
        why: The edit distance may delete and insert, but only replacements are allowed; count the differing
          positions.
      correct_tool:
        topic: '0.3'
        card: string-processing
  lookalikes:
  - description: Fewest deletions from both strings to make them equal
    tool:
      topic: '3.4'
      card: lcs
    flipping_difference: Without insertions or replacements, the answer is n + m − 2·LCS; edit distance
      is needed when a replacement can do in one step what costs two deletions.
  complexity: O(n·m).
problems:
- id: cses-1145
  role: worked_example
  summary: The length of the longest strictly increasing subsequence of an array of n ≤ 2·10^5 values.
- id: ac-abc185_e
  role: worked_example
  summary: Delete elements from two sequences (N, M ≤ 1000) so that the rests have equal length; the cost
    is the number deleted plus the positions where the rests differ. Minimise it.
- id: lc-increasing-triplet-subsequence
  role: ladder
  card: lis
  rung: 1
  twist: Base case of the card
  summary: Decide whether an array (n ≤ 5·10^5) has indices i < j < k with strictly increasing values,
    in O(n) time and O(1) memory.
  hints:
  - In the smallest-tail array of Theorem 3.4.2, which entries matter if you only care about length 3?
  - 'Only the first two: the smallest value seen so far (tail of length 1) and the smallest tail of an
    increasing pair.'
  - 'Keep first and second (both +∞ at the start); for each x: if x ≤ first, first = x; else if x ≤ second,
    second = x; else return true.'
- id: lc-longest-increasing-subsequence
  role: ladder
  card: lis
  rung: 2
  twist: The whole tails array, not just two entries.
  summary: The length of the longest strictly increasing subsequence of up to 2500 numbers.
  hints:
  - O(n²) passes here, but which array lets you do it in O(n log n)?
  - tails[k] = smallest last value of a strictly increasing subsequence of length k + 1; it is sorted
    (Theorem 3.4.2).
  - For each x, replace the first tail ≥ x (lower_bound), or append if there is none; the answer is the
    size of tails.
- id: lc-find-the-longest-valid-obstacle-course-at-each-position
  role: ladder
  card: lis
  rung: 3
  twist: Non-decreasing instead of strictly increasing, and an answer for every position.
  summary: For every position i of an array (n ≤ 10^5), the longest non-decreasing subsequence that ends
    at i and uses it.
  hints:
  - Which single call changes when equal values may follow each other?
  - 'lower_bound becomes upper_bound: an equal tail may be extended, so x replaces the first tail strictly
    greater than x.'
  - For each i, p = upper_bound(tails, x) − begin; the answer for i is p + 1; then set tails[p] = x (or
    append).
- id: ac-abc393_f
  role: ladder
  card: lis
  rung: 4
  twist: 'Read more than the length from the tails array: how many lengths have a tail ≤ X.'
  summary: 'Q ≤ 2·10^5 queries (R, X) on an array of N ≤ 2·10^5 values: the longest strictly increasing
    subsequence of the first R elements that uses only values ≤ X.'
  hints:
  - Can you answer all queries with the same R from one state of the tails array?
  - 'Yes: process the queries sorted by R while adding A_1, A_2, … to the tails array. A subsequence of
    length k with values ≤ X exists exactly when tails[k − 1] ≤ X.'
  - tails is sorted, so the answer is upper_bound(tails, X) − begin at the moment R elements have been
    added; print the answers in the input order.
- id: ac-abc354_f
  role: ladder
  card: lis
  rung: 5
  twist: For every element, the longest increasing subsequence ending there and the longest starting there.
  summary: For T test cases (total N ≤ 2·10^5), list the indices i such that A_i belongs to at least one
    longest strictly increasing subsequence.
  hints:
  - If A_i is in some longest increasing subsequence, what do the parts before and after it look like?
  - A longest increasing subsequence ending at i and one starting at i, glued at A_i. Compute L[i] with
    the tails array left to right and R[i] right to left (on negated values).
  - i qualifies exactly when L[i] + R[i] − 1 equals the overall length; reset the tails array between
    test cases.
- id: cf-4D
  role: ladder
  card: lis-reduction
  rung: 1
  twist: Base case of the card
  summary: A card of size w × h and n ≤ 5000 envelopes; build the longest chain of envelopes, each strictly
    larger in both sides than the previous, starting with one larger than the card. Print its length and
    the envelopes.
  hints:
  - Which envelopes can never be used, and what order do the rest of a chain follow?
  - Drop envelopes that do not strictly contain the card. A chain is increasing in width, so after sorting
    by width it is an increasing subsequence in both sides (Theorem 3.4.3).
  - 'With n ≤ 5000, the O(n²) table of Theorem 3.4.1 is enough: dp[i] = 1 + max dp[j] over j before i
    with smaller width and height; store the j that gave the max and walk back to print. Print 0 if nothing
    fits.'
- id: lc-maximum-height-by-stacking-cuboids
  role: ladder
  card: lis-reduction
  rung: 2
  twist: Each item may be rotated, and the chain maximises the total height instead of the length.
  summary: Stack some of n ≤ 100 cuboids, each rotatable, so that each one fits under the one below in
    all three sides (≤); maximise the total height.
  hints:
  - For one cuboid, which rotation is never worse than the others?
  - 'Sort its three sides and use the largest as the height: if a stacking works with some rotations,
    it also works with all cuboids sorted this way (compare sorted sides).'
  - Sort the cuboids by their sorted sides; h[i] = height_i + max h[j] over earlier j with all three sides
    ≤; answer max h. O(n²).
- id: lc-delete-columns-to-make-sorted-iii
  role: ladder
  card: lis-reduction
  rung: 3
  twist: '"Increasing" is a check across all rows, so the order is not a single key.'
  summary: Up to 100 strings of equal length ≤ 100; delete the fewest columns so that every string reads
    in non-decreasing order.
  hints:
  - Instead of deleting columns, think about which columns you keep. What must hold between two kept columns
    i < j?
  - In every row, s[i] ≤ s[j]. Kept columns form a chain under this rule, and the rule only compares consecutive
    kept columns.
  - keep[j] = 1 + max keep[i] over i < j that pass the check in every row (Theorem 3.4.1); answer = length
    − max keep. O(L²·n).
- id: lc-uncrossed-lines
  role: ladder
  card: lcs
  rung: 1
  twist: Base case of the card
  summary: Draw lines between equal numbers of two arrays (lengths ≤ 500) written on two parallel lines,
    with no two lines crossing or sharing an endpoint; the most lines.
  hints:
  - If lines do not cross, how do their endpoints appear in the two arrays?
  - 'In the same order on both sides: the matched numbers form a common subsequence.'
  - The answer is the length of the longest common subsequence (Theorem 3.4.4).
- id: lc-maximum-length-of-repeated-subarray
  role: ladder
  card: lcs
  rung: 2
  twist: 'Contiguous: a common substring instead of a common subsequence.'
  summary: The longest subarray that appears in both of two arrays (lengths ≤ 1000).
  hints:
  - What should a table entry mean so that the contiguity is kept?
  - L[i][j] = length of the longest common block ending exactly at a_i and b_j.
  - L[i][j] = L[i − 1][j − 1] + 1 if a_i = b_j, else 0; the answer is the largest entry, not the last
    one.
- id: lc-minimum-ascii-delete-sum-for-two-strings
  role: ladder
  card: lcs
  rung: 3
  twist: Each skipped character has a cost, and the total cost is minimised.
  summary: Make two strings (lengths ≤ 1000) equal by deleting characters; minimise the sum of the ASCII
    codes of the deleted characters.
  hints:
  - What are the moves at (i, j), and what does each cost?
  - Delete s_i (cost its code), delete t_j (cost its code), or keep both if they are equal (cost 0).
  - cost[i][0] and cost[0][j] are prefix sums of codes; cost[i][j] = cost[i − 1][j − 1] if equal, else
    the cheaper of the two deletions.
- id: ac-dp_f
  role: ladder
  card: lcs
  rung: 4
  twist: Print one longest common subsequence, not only its length.
  summary: Print any longest common subsequence of two strings s and t (lengths ≤ 3000).
  hints:
  - With the full table filled, where does an optimal matching end?
  - 'At (n, m): if s_n = t_m that character is the last of an optimal subsequence; otherwise the value
    comes from (n − 1, m) or (n, m − 1), whichever is larger.'
  - Walk back from (n, m) with these rules, collect the matched characters, and reverse them. Keep the
    whole table (9·10^6 ints).
- id: lc-edit-distance
  role: ladder
  card: edit-distance
  rung: 1
  twist: Base case of the card
  summary: The fewest insertions, deletions and replacements of single characters that turn one word into
    another (lengths ≤ 500).
  hints:
  - What are E[i][0] and E[0][j]?
  - 'i deletions and j insertions: turning a prefix into the empty string, or the reverse.'
  - E[i][j] = E[i − 1][j − 1] if the characters are equal, else 1 + min(E[i − 1][j], E[i][j − 1], E[i
    − 1][j − 1]) (Theorem 3.4.5).
- id: cses-1639
  role: ladder
  card: edit-distance
  rung: 2
  twist: 'Strings up to 5000 characters: 2.5·10^7 cells, where two rows save the memory.'
  summary: The edit distance between two strings of lengths up to 5000.
  hints:
  - Which entries does E[i][·] read?
  - Only row i − 1 and the entry to its left in row i.
  - Keep two rows of m + 1 ints (or the full table, about 100 MB, if the memory limit allows); swap them
    after each i.
- id: ac-abc386_f
  role: ladder
  card: edit-distance
  rung: 3
  twist: Only "is the distance at most K ≤ 20" is asked, for strings of length up to 5·10^5.
  summary: Can S be turned into T (lengths ≤ 5·10^5) with at most K ≤ 20 single-character insertions,
    deletions and replacements?
  hints:
  - If E[i][j] ≤ K, how far apart can i and j be?
  - At most K, because each unmatched character costs at least 1. So only the band |i − j| ≤ K of the
    table matters.
  - If ||S| − |T|| > K, print No. Otherwise store E[i][i + δ] for δ in [−K, K], treat cells outside the
    band as K + 1, and cap values at K + 1. O(|S|·K).
