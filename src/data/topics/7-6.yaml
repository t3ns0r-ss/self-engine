  hints:
  - What must you remember about the string built so far to know which letters may come next?
  - Only the last letter. The state is the last letter, and the transition from a to b is allowed unless
    the pair (a, b) is forbidden.
  - Build the m × m matrix of allowed pairs (1 if allowed), raise it to the power n − 1 and sum all entries
    (any first letter, any last letter). 52^3 · 60 · 2 ≈ 1.7·10^7 steps.
- id: cf-691E
  role: ladder
  card: walk-counting
  rung: 3
  twist: The graph is made from the numbers by a rule on pairs, and the same numbers may be used again.
  summary: n ≤ 100 numbers up to 10^18 and a length k ≤ 10^18; count the sequences x_1, …, x_k of indices
    (repeats allowed) such that for every neighbours the number of ones in the binary form of a[x_i] xor
    a[x_(i+1)] is divisible by 3, modulo 10^9 + 7. †
  hints:
  - Build a graph with one vertex for each number. When is there an edge from i to j?
  - There is an edge from i to j if the number of ones in a[i] xor a[j] is a multiple of 3 (use __builtin_popcountll).
    A sequence of k indices is a walk with k − 1 edges.
  - Take the n × n adjacency matrix, raise it to the power k − 1 and sum all entries. 100^3 · 60 · 2 =
    1.2·10^8 steps.
- id: cf-954F
  role: ladder
  card: walk-counting
  rung: 4
  twist: 'The graph changes along the way: obstacles close some rows on stretches, so one power is taken
    for each stretch.'
  summary: A runner moves along a stadium of 3 rows and up to 10^18 columns, one column to the right at
    each step and one row up, down or none; n ≤ 10^4 obstacles block a segment of columns in a row; count
    the ways to go from the first column to the last, modulo 10^9 + 7. †
  hints:
  - In a stretch of columns with no change of obstacles, are the transitions the same at every step?
  - 'Yes: the 3 × 3 matrix of the allowed row changes, with the blocked rows removed. Cut the columns
    at the points where an obstacle starts or ends.'
  - 'Process the stretches in order: multiply the vector of counts (one per row) by the matrix of the
    stretch raised to its length. There are at most 2n + 1 stretches, each with a 3 × 3 power.'
- id: cf-514E
  role: ladder
  card: augmented-matrix
  rung: 1
  twist: 'Base case of the card: a running sum added to a recurrence of order 100.'
  summary: Every vertex of an infinite tree has n ≤ 10^5 children, joined by edges of the given lengths
