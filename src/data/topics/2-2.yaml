- id: cf-913A
  role: lookalike
  summary: Print m mod 2^n for n, m ≤ 10^8.
- id: ac-abc293_e
  role: lookalike
  summary: The sum A^0 + A^1 + … + A^(X−1) modulo M, with A, M ≤ 10^9 and X ≤ 10^12.
- id: cf-963A
  role: lookalike
  summary: A sum of terms ±a^(n−i)·b^i for i = 0..n (n ≤ 10^9), with signs repeating with period k ≤ 10^5,
