drill:
  - problem: lc-decode-ways
    answer_card: linear-state
    answer_topic: '3.2'
    property: Decoding the first i digits ends with a one-digit or a two-digit code, and which codes are
      valid depends only on those last digits; ways[i] = ways[i − 1] (if digit i is not 0) + ways[i −
      2] (if the last two digits form 10..26).
    why_others_fail: Backtracking lists every decoding, exponentially many; no formula handles the zeros
      and the 26 limit.
  - problem: lc-minimum-cost-for-tickets
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'The cheapest cover of the travel days up to day d depends only on d: the last pass bought
      covers d and started 1, 7 or 30 days earlier, so best[d] = min over the three passes of best[d −
      length] + price (best[d] = best[d − 1] on non-travel days).'
    why_others_fail: 'Greedy "buy the pass with the best price per day" fails: a 7-day pass is wasted
      if only 2 travel days fall in it.'
  - problem: cses-1633
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'Split the sequences by the last throw (1..6): ways[n] = ways[n − 1] + … + ways[n − 6],
      with ways[0] = 1; each sequence has one last throw (Theorem 3.2.2).'
    why_others_fail: Listing the sequences is exponential, and a stars-and-bars formula (2.3) counts sums
      with a fixed number of throws and no upper limit per throw.
  - problem: cses-1637
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'The fewest steps from a number depend only on the number: steps[x] = 1 + min over the non-zero
      digits d of x of steps[x − d], filled for x = 1..n.'
    why_others_fail: Search over all subtraction sequences (3.1) is exponential; the table has n states
      with at most 9 transitions each.
  - problem: lc-best-time-to-buy-and-sell-stock-with-transaction-fee
    answer_card: extra-small-state
    answer_topic: '3.2'
    property: What you may do tomorrow depends on whether you hold a share now; with that one extra fact,
      hold = max(hold, free − price) and free = max(free, hold + price − fee).
    why_others_fail: Summing every price increase (the greedy of the fee-free version) pays the fee too
      often; the day alone is not a state.
  - problem: ac-abc306_d
    answer_card: extra-small-state
    answer_topic: '3.2'
    property: 'Whether a course may be eaten, and what state follows, depends only on the stomach state
      (healthy or upset): dp[i][healthy] and dp[i][upset], with skip, eat antidotal (always healthy) and
      eat poisonous (healthy → upset only).'
    why_others_fail: Greedy "eat every positive course" can make you upset and lose a big later course;
      backtracking has 2^N choices.
  - problem: ac-abc270_d
    answer_card: linear-state
    answer_topic: '3.2'
    property: 'With n stones left, the best total for the player to move depends only on n: best[n] =
      max over A_i ≤ n of A_i + (n − A_i − best[n − A_i]), since the opponent then gets best[n − A_i]
      of what remains.'
    why_others_fail: 'Greedy "take the most stones possible" fails: taking fewer can leave the opponent
      a worse position.'
  - problem: lc-beautiful-arrangement
    answer_card: constraint-placement
    answer_topic: '3.1'
    property: Place numbers position by position, checking the divisibility rule at once; the rule involves
      only the position and the number placed, so dead prefixes are cut early, and the search is fast
      for n ≤ 15.
    why_others_fail: 'A one-index table fails: which numbers are still free is part of the future, and
      storing that set needs subset states (topic 3.7). Backtracking is enough here.'
  - problem: lc-find-minimum-time-to-finish-all-jobs
    answer_card: bound-pruning
    answer_topic: '3.1'
    property: An assignment search with the bound "current largest load ≥ best" and a symmetry cut (one
      empty worker) is the smallest-largest-load template (Theorem 3.1.3).
    why_others_fail: The future depends on every worker's load, not on a small summary of the past, so
      a table with one index (or one extra fact) does not exist.
  - problem: lc-best-sightseeing-pair
    answer_card: prefix-extremes
    answer_topic: '1.2'
    property: The score splits into (values[i] + i) + (values[j] − j); for each j the best partner is
      the largest values[i] + i over i < j, a running maximum of a prefix.
    why_others_fail: A table over positions works but is just the running maximum in disguise; no state
      beyond "best value so far" is needed.
  - problem: lc-arithmetic-slices
    answer_card: count-windows
    answer_topic: '1.3'
    property: A piece of an arithmetic subarray is arithmetic (validity is closed under shrinking), so
      for each right end the valid left ends form a range, counted with two pointers.
    why_others_fail: A counting table "number of slices ending at i" works too, but it is the same window
      count; the closure property is the decisive one.
lookalike_pairs:
  - a: lc-house-robber-ii
    b: lc-house-robber-iv
    a_tool: 'linear-state (3.2): best[i] = max(best[i − 1], best[i − 2] + a_i), once without the first
      house and once without the last'
    b_tool: 'answer-search (1.4): binary search on the largest amount, with a greedy left-to-right check
      of how many houses fit'
    flipping_difference: 'Both forbid robbing neighbours. A maximises a total, which depends on all earlier
      choices through the position only: a table. B minimises the largest single amount subject to a count,
      and "can we take k houses using only amounts ≤ c" is monotone in c with a greedy check, so no table
      is needed.'
  - a: lc-maximum-product-subarray
    b: lc-maximum-product-of-three-numbers
    a_tool: 'extra-small-state (3.2): keep the largest and the smallest product of a subarray ending at
      i, since a negative value swaps them'
    b_tool: 'sort-then-scan (1.1): the three largest, or the two smallest times the largest'
    flipping_difference: 'Both maximise a product with negative values. A requires a contiguous subarray,
      so the best product ending at i depends on the best and the worst ending at i − 1: two values of
      state. B allows any three numbers, so order does not matter and sorting gives the two candidates
      directly.'
self_test:
  - q: With steps 1 and 2, how many ways climb 4 stairs if order matters, and how many if only the collection
      of steps matters? Which loop order of Section 7 gives which?
    a: 'Ordered: 5 (1111, 112, 121, 211, 22), from ways[i] = ways[i − 1] + ways[i − 2] with the stair
      loop outside. As collections: 3 ({1, 1, 1, 1}, {1, 1, 2}, {2, 2}), which is what the step loop outside
      counts.'
  - q: How many calls does the plain recursion for the stairs count make for n = 5, and how many with
      memoisation?
    a: 'Plain: C(5) = 15 (C(0) = C(1) = 1, C(i) = 1 + C(i − 1) + C(i − 2): 1, 1, 3, 5, 9, 15). With a
      cache, ways(2)..ways(5) are each computed once and make 2 calls, so 1 + 2·4 = 9 calls in all.'
  - q: Count the fillings of the ? in a string of A, B and ? so that no two neighbours are equal. Is the
      position a state? Give the answer for "A?A" and "??".
    a: 'No: whether the next letter is allowed depends on the previous letter, so the state is (position,
      last letter) (Theorem 3.2.5). "A?A" has 1 filling (ABA); "??" has 2 (AB, BA).'
  - q: Someone memoises f(n) = max(f(n − 1), f(n + 1)) − 1 with f(0) = 0 and f(10) = 0. What happens,
      and which condition of Theorem 3.2.4 fails?
    a: 'f(1) calls f(2), which calls f(1) again before any value is stored: the recursion never ends.
      The condition "no state depends on itself" fails; the states have no order in which each comes after
      the states it uses.'
  - q: A table dp[i][j] has i ≤ 10^5 and j ≤ 10^5 with two transitions per state. Does it fit? What if
      j ≤ 100?
    a: 10^10 states do not fit in time or memory. With j ≤ 100 it is 10^7 states and 2·10^7 transitions,
      which fits easily (Theorem 3.2.3, note 3).
  - q: For the values (1, 3, 1), what are the best sum of non-adjacent elements and the chosen positions?
      For (2, 2, 2, 2), why can walking back from the end print positions 2 and 4?
    a: '(1, 3, 1): sum 3 with position 2 (taking 1 and 3 gives only 2). For (2, 2, 2, 2), walking back
      from the last position takes position 4 first whenever that is still optimal; the result 2, 4 is
      optimal but not the lexicographically smallest 1, 3, which needs a table filled from the end and
      a forward walk.'
checkpoint:
  time_limit_minutes: 120
  problems:
    - cf-1513C
    - lc-wildcard-matching
    - cf-1625C
decision_map:
  - weak_signal: '"Can you reach the end", the fewest jumps or segments to cover, fix the first violation
      from the left'
    choose: linear-state
    when: Steps have different costs or values, so the best way to reach position i matters, not only
      whether it is reachable; the position alone is the state (Theorem 3.2.1).
    over:
      - card: left-to-right-forced
        because: The greedy is right when every reachable position is equally good (only reachability
          or the number of jumps); with costs, a farther jump is not always better.
  - weak_signal: The most non-overlapping intervals, or the fewest points that hit every interval
    choose: linear-state
    when: 'Intervals carry different weights (pay, profit): sort by end, and the best total of a prefix
      comes from the prefix that ends before the current start (Theorem 3.2.1).'
    over:
      - card: interval-selection
        because: Earliest end first maximises the number of intervals, not a weighted total; one long,
          valuable interval can beat many short ones.
  - weak_signal: Fill positions one by one, each with a restriction against earlier ones; count by cases
    choose: extra-small-state
    when: The restriction reads only the last few positions, but the number of allowed choices depends
      on what they hold, so the product rule does not apply; put the last value in the state (Theorem
      3.2.5).
    over:
      - card: product-sum-rules
        because: The product rule needs the number of choices at each position to be the same whatever
          came before.
  - weak_signal: Sequences of a length given in the input; three or more options per position
    choose: extra-small-state
    when: The rule for the next option reads only a small fact about the past (the previous option, a
      parity, a flag), so a table over (position, fact) replaces listing k^n sequences.
    over:
      - card: recursive-choices
        because: Listing all sequences is exponential; it is the tool only when the length is small and
          the check needs the whole sequence.
  - weak_signal: 'Two strings: match with wildcards, interleave one with another, or transform one into
      another'
    choose: two-index
    when: A partial match is described by how much of each string has been used, and every step consumes
      a character of one string or both (Theorem 3.2.3).
    over:
      - card: merge-walk
        because: Two pointers decide subsequence questions where matching each character at its first
          chance is never worse; wildcards and choices of which string to take from break that.
  - weak_signal: A recursive formula or a game on a number, with huge arguments but few reachable values
    choose: memo-recursion
    when: The recursion reaches few distinct arguments but repeats them, and arguments always shrink (Theorem
      3.2.4).
    over:
      - card: closed-form
        because: A formula is best when one exists; a cache is for recursions without one.
  - weak_signal: '"Print the choices", "print any optimal …", or the lexicographically smallest optimal
      answer'
    choose: reconstruct
    when: A table gives the optimal value, and each state records which transition attained it (or the
      table is filled from the end, so the first choice can be made greedily) (Theorem 3.2.6).
    over:
      - card: exchange-order
        because: When an exchange argument proves a fixed order optimal, sorting prints the answer without
          a table.
glossary_added: ["DP state", "transition", "DP", "tabulation", "memoisation", "optimal substructure"]
