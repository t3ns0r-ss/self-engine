drill:
- problem: ac-abc117_c
  answer:
    topic: '1.5'
    card: extreme-first
  property: Sorted, the points form M − 1 gaps; N pieces split them into N groups, and each group costs
    its span. The cost is the total span minus the gaps left uncrossed, so skip the N − 1 largest gaps.
  why_others_fail: Trying every placement of the pieces is exponential; the decision is which gaps to
    skip, and each gap's value is independent.
- problem: ac-abc136_c
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: 'Scan left to right keeping the previous height as low as possible: lower a square whenever
    that keeps the order, since a lower previous height dominates a higher one.'
  why_others_fail: Trying all 2^N choices is impossible; there is nothing to sort, because the order of
    squares is fixed.
- problem: ac-abc396_c
  answer:
    topic: '1.5'
    card: extreme-first
  property: 'Within each colour the best balls are the largest: take blacks and whites in decreasing value,
    a white only while a black is taken with it, and every positive black anyway.'
  why_others_fail: Trying all subsets is impossible; each extra ball's value is independent, so sorting
    each colour is enough.
- problem: ac-abc271_c
  answer:
    topic: '1.5'
    card: extreme-first
  property: 'To read volumes 1, 2, …, trade away the books that will never be read first: duplicates,
    then the largest volumes. Each missing volume costs two such books.'
  why_others_fail: Searching on the answer x also works (enough distinct volumes ≤ x plus spare books
    / 2), using topic 1.4; the greedy needs only the right order of books to give up.
- problem: ac-abc230_d
  answer:
    topic: '1.5'
    card: interval-selection
  property: Each wall is an interval of columns; sorted by right end, the first wall not yet destroyed
    is punched as far right as possible, [R, R + D − 1], which hits every wall a punch could hit together
    with it.
  why_others_fail: Columns go up to 10^9, so walking them is too slow; it is the hitting-points rule of
    Theorem 1.5.2 with wide points.
- problem: lc-jump-game-ii
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: Within the indices reachable with j jumps, the next layer reaches up to the farthest i + nums[i];
    a farther reach dominates, so each jump extends the reach maximally.
  why_others_fail: Trying all jump sequences is exponential; it is the segment-covering rule of Section
    4.5.
- problem: lc-partition-labels
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: A part that starts at the left must extend to the last occurrence of every letter in it; cutting
    as soon as that is reached gives the most parts.
  why_others_fail: Positions are fixed, so nothing can be sorted; a map of last positions (topic 0.6)
    supplies the data for the scan.
- problem: cf-1367C
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: Scan left to right and take every free table that is far enough from the last taken table
    and from the next existing one; taking a table as early as possible never blocks more than a later
    choice would.
  why_others_fail: Subsets of tables are exponential; the decision at each table depends only on the nearest
    taken tables.
- problem: ac-abc371_d
  answer:
    topic: '1.4'
    card: sorted-search
  property: The villages are sorted by coordinate, so the ones in [L, R] form a range of indices found
    by two bounds; prefix sums of the populations give the total.
  why_others_fail: There is no choice to make, so no greedy rule is involved; it is a lookup in a sorted
    array.
- problem: lc-minimum-speed-to-arrive-on-time
  answer:
    topic: '1.4'
    card: answer-search
  property: A faster speed never arrives later, so "speed v arrives in time" is monotone; search the smallest
    v with a check that rounds each waiting time up.
  why_others_fail: There is a single number to choose and the check is easy; no order or pairing has to
    be decided.
- problem: ac-abc321_d
  answer:
    topic: '1.4'
    card: sorted-search
  property: Sort the side dishes; for each main dish A, the sides with A + B < P form a prefix found by
    a bound, summed with prefix sums, and the rest cost P each.
  why_others_fail: All N·M pairs are 4·10^10; no greedy choice is involved, only counting in sorted order.
lookalike_pairs:
- a: lc-non-overlapping-intervals
  b: lc-divide-intervals-into-minimum-number-of-groups
  a_tool:
    topic: '1.5'
    card: interval-selection
  b_tool:
    topic: '1.1'
    card: event-sweep
  flipping_difference: A may remove intervals and keeps the most disjoint ones (earliest end first); B
    must keep every interval and needs as many groups as intervals overlap at the busiest point.
  shared_surface: Both take a list of intervals and ask about the overlapping ones, one how many to remove
    and the other how many groups are needed.
  flipping_input: 'For [1, 5], [2, 3], [4, 6], [7, 8]: A removes 1 interval (keeping [2, 3], [4, 6], [7,
    8]); B needs only 2 groups, since at most 2 intervals overlap at any point.'
- a: lc-best-time-to-buy-and-sell-stock-ii
  b: lc-maximum-difference-between-increasing-elements
  a_tool:
    topic: '1.5'
    card: left-to-right-forced
  b_tool:
    topic: '1.2'
    card: prefix-extremes
  flipping_difference: A allows any number of trades, so every daily rise is taken; B allows one pair
    of days, so it is the best value minus the prefix minimum.
  shared_surface: Both ask for the best profit from a list of daily prices.
  flipping_input: 'Prices 7, 1, 5, 3, 6, 4: with any number of trades (A) the profit is (5 − 1) + (6 −
    3) = 7; with one trade (B) it is 6 − 1 = 5.'
self_test:
- q: Coins of values 1, 3 and 4 (any number of each). Does "take the largest coin that fits" give the
    fewest coins for the amount 6?
  a: 'No: it takes 4, 1, 1 (three coins), while 3 + 3 uses two. The largest-first rule is correct only
    for special coin systems; in general this is a Phase 3 problem.'
- q: In Tasks and Deadlines (reward = deadline − finishing time), why do the deadlines not influence the
    best order?
  a: The total reward is Σ deadlines − Σ finishing times. The first sum is the same for every order, so
    only Σ finishing times matters, and shortest first minimises it (Theorem 1.5.1).
- q: Why can no set of points that hits every interval be smaller than a set of pairwise disjoint intervals?
  a: Disjoint intervals share no point, so each of them needs its own point. Hence (fewest points) ≥ (most
    disjoint intervals), and Theorem 1.5.2 shows equality.
- q: Greeds (1, 2) and cookies (1, 3). What goes wrong if the least greedy child gets the largest cookie?
  a: 'Child 1 takes cookie 3, and child 2 is left with cookie 1, which is too small: 1 child satisfied.
    Giving child 1 the cookie 1 and child 2 the cookie 3 satisfies both. Theorem 1.5.4 gives each child
    the smallest sufficient cookie.'
- q: In Missing Coin Sum, what does the scan answer for the coins (2, 1) if they are not sorted first,
    and what is correct?
  a: It sees 2 > 0 + 1 and answers 1; but 1 can be made with the second coin. Sorted, (1, 2) gives reach
    1, then 3, so the answer is 4. The invariant needs every later coin to be at least the current one.
- q: A greedy rule passes 5000 random tests against a brute force. What has that shown, and what has it
    not?
  a: 'It has shown that the rule is very likely right on small inputs, and it would have caught most wrong
    rules (Section 7). It is not a proof: a rule can fail only on large or special inputs, so the exchange
    or stays-ahead argument is still needed.'
- q: For which kind of goal does earliest end first fail? Give intervals with weights where it chooses
    badly.
  a: 'When intervals have weights and the total weight counts. [1, 2] with weight 1 and [1, 10] with weight
    100: earliest end first takes [1, 2] and then nothing else fits, for 1 instead of 100.'
checkpoint:
  time_limit_minutes: 90
  problems:
