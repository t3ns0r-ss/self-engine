# Topic 7.7 data file (PLAN.md Section 5, Revision 2.1). Problems reference the bank by id.
id: '7.7'
uses:
- topic: '0.1'
  what: 'C++: vectors, strings, sets and the standard algorithms in every construction'
- topic: '0.2'
  what: 'Complexity: why the answer must be built in about n steps, not searched'
- topic: '0.3'
  what: 'Implementation: careful fills of positions, grids and strings, and the checkers'
- topic: '0.4'
  what: 'Parity and divisibility: the necessary conditions of the problems'
- topic: '0.5'
  what: 'Brute force: the exhaustive search for small cases that shows the pattern'
- topic: '0.6'
  what: 'The standard library: map, set, priority queue, next_permutation'
- topic: '1.1'
  what: 'Sorting: ordering the items by count or by value before they are placed'
- topic: '1.2'
  what: 'Prefix sums: counting and checking along a sequence'
- topic: '1.3'
  what: 'Two pointers: the low and high ends of the unused values'
- topic: '1.4'
  what: 'Binary search: the smallest or largest size for which a construction works'
- topic: '1.5'
  what: 'Greedy I: taking the largest remaining item first, as in the equal-sum split'
- topic: '1.6'
  what: 'Monotonic stack: blocks of equal direction in a pattern string'
- topic: '1.7'
  what: 'Bitwise operations: constructions that use xor and the bits of an index'
- topic: '2.1'
  what: 'Number theory: divisibility and prime factors in constructions with numbers'
- topic: '2.2'
  what: 'Modular arithmetic: formulas modulo a number in grids and permutations'
- topic: '2.3'
  what: 'Combinatorics: counting the arrangements that a construction picks one of'
- topic: '2.4'
