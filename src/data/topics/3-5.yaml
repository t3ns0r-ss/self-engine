  - id: lc-knight-probability-in-chessboard
    role: review
    card: sequence-counting
    review_set: 2
    summary: A knight on an n × n board (n ≤ 25) makes k ≤ 100 moves, each chosen uniformly among its
      8 moves; the probability that it is still on the board at the end.
  - id: ac-abc122_d
    role: review
    card: sequence-counting
    review_set: 2
    summary: Count the strings of length N ≤ 100 over A, C, G, T that do not contain AGC, even after swapping
      one pair of neighbouring letters, modulo 10^9 + 7.
  - id: ac-abc183_e
    role: review
    card: range-sum-transition
    review_set: 2
    summary: A queen moves right, down or diagonally down-right any number of cells without crossing walls;
      count its ways from the top-left to the bottom-right cell of an H × W grid (H, W ≤ 2000), modulo
      10^9 + 7.
  - id: ac-abc147_e
    role: review
