drill:
- problem: lc-count-increasing-quadruplets
  answer:
    topic: '1.2'
    card: prefix-2d
  property: For each pair (j, k) with nums[j] > nums[k], the number of i < j with nums[i] < nums[k] times
    the number of l > k with nums[l] > nums[j]; both come from a table of dominance counts (a 2D prefix
    sum over position and value).
  why_others_fail: With n ≤ 4000 an O(n²) table is fast and short; a Fenwick tree for each pair would
    be a log factor of waste.
- problem: lc-minimum-cost-to-split-an-array
  answer:
    topic: '3.2'
    card: linear-state
  property: dp[i] = the least cost of the first i numbers; try every last subarray (j, i] while a count
    array keeps its trimmed length. O(n²).
  why_others_fail: 'n ≤ 1000: the O(n²) DP is enough, and the trimmed length is not a prefix or a window
    quantity.'
- problem: lc-minimum-number-of-coins-for-fruits
  answer:
    topic: '3.2'
    card: linear-state
  property: 'dp[i] = the least cost to get the fruits from i on, given that fruit i is bought: dp[i] =
    prices[i] + the minimum of dp[j] over j in i + 1 .. 2i + 1. O(n²).'
  why_others_fail: 'n ≤ 1000: the loop over the free range is fast enough; the deque would be correct
    but unnecessary.'
- problem: lc-distinct-subsequences-ii
  answer:
    topic: '3.2'
    card: extra-small-state
  property: Keep end[c], the number of distinct subsequences ending with the letter c; a new letter c
    makes end[c] = 1 + the sum of all end[x], replacing the old value. 26 values.
  why_others_fail: 'Only 26 letters: a loop over them replaces a tree, though the replacement is the same
    idea as in the counting card.'
- problem: lc-maximum-earnings-from-taxi
  answer:
    topic: '3.2'
    card: linear-state
  property: 'dp[x] = the most money on reaching the point x: dp[x] = max(dp[x − 1], max over the passengers
    ending at x of dp[start] + gain). The passengers are grouped by the end point.'
  why_others_fail: dp[x − 1] already carries the maximum of everything earlier; no prefix-maximum structure
    is needed.
- problem: cf-519D
  answer:
    topic: '0.6'
    card: map-counting
  property: With prefix sums p of the values, for each letter keep a map from p to the number of positions
    seen; at a position add the count of (letter, p of the position before) of the earlier positions with
    the same letter.
  why_others_fail: Counting equal values needs a map of counts, not an ordered structure over ranks.
- problem: cf-1335E2
  answer:
    topic: '1.2'
    card: range-sum
  property: For every value x keep the positions of x; the outer blocks take the first t and the last
    t copies; the best middle value in between is read from 200 prefix-count tables.
  why_others_fail: The values are at most 200, so tables of prefix counts answer each range count in O(1);
    no DP with a tree.
- problem: cf-1313C2
  answer:
    topic: '1.6'
    card: nearest-greater
  property: 'For each peak the best total on the left comes from a monotonic stack: left[i] = a_i · (i
    − j) + left[j] with j the nearest smaller element to the left; the same on the right; the best peak
    wins.'
  why_others_fail: The transition comes from the nearest smaller element, a single predecessor, not a
    best over a prefix of keys; a stack does it in O(n).
lookalike_pairs:
- a: cf-1799D2
  b: cf-1799D1
  a_tool:
    topic: '7.3'
    card: range-update-transition
  b_tool:
    topic: '3.2'
    card: two-index
  shared_surface: Both give n programs of k kinds to run on two processors; a program run right after
    a program of the same kind on the same processor takes the hot time, any other run takes the cold
    time; the task is the least total time.
  flipping_difference: 'In the easy version n and k are at most 5000, so the table dp[i][j] (j = the last
    program on the other processor) is built entry by entry in O(nk). In the hard version they are up
    to 3·10^5: running the next program on the processor that ran the previous one changes every state
    by the same amount, so that amount is kept as one offset and only one state is changed (a tree or
    a minimum over the states), not the whole table.'
  flipping_input: 'n = k = 3·10^5: the table has 9·10^10 entries, against a tree of 3·10^5 states with
    O(log n) work per program.'
- a: cf-1304F2
  b: cf-1304F1
  a_tool:
    topic: '7.3'
    card: window-transition
  b_tool:
    topic: '3.2'
    card: two-index
  shared_surface: Both give an n × m grid of animal counts for n days; each day a camera that sees k consecutive
    cells on that day and the next day is placed, each animal is counted once, and the task is the largest
    total.
  flipping_difference: 'In the easy version k is at most 20, so the previous day''s camera positions that
    overlap (fewer than 2k) are tried one by one. In the hard version k can be as large as m: the overlapping
    positions form a window whose maximum comes from a deque (or a segment tree), and the non-overlapping
    ones are a prefix maximum and a suffix maximum.'
  flipping_input: 'm = 20000, k = 10000: trying the overlapping positions costs about 2·10^4 · 2·10^4
    per day, against m per day with the deque.'
self_test:
- q: Use Theorem 7.3.1 on the keys 2 1 3 with the weights 4 5 6. Give dp and the answer.
  a: The ranks are 2, 1, 3. dp_1 = 4 (nothing is below 2 yet), dp_2 = 5 (nothing is below 1), dp_3 = 6
    + max(4, 5) = 11. The answer is 11 (the elements 1 and 3, with weights 5 + 6).
- q: Why is the tree asked before the element is inserted, and for the ranks below the element's own?
  a: 'If the element were inserted first, a query that reaches its own rank could return its own dp: the
    element would follow itself, or an equal value. Asking for the smaller ranks before the insertion
    leaves out the element and the values equal to it.'
- q: Run the deque of Theorem 7.3.2 on the weights 3, −1, 4 with k = 2 (a choice may start anywhere).
    Give dp and the deque after each step.
  a: 'Step 1: dp = 3, deque {1}. Step 2: the front is 1, dp = −1 + 3 = 2, and since 3 > 2 the deque is
    {1, 2}. Step 3: the window is 1..2, the front is 1, dp = 4 + 3 = 7, and both older entries are not
    larger than 7, so the deque is {3}. The answer is 7.'
- q: The allowed predecessors for i = 2, 3, 4, 5 are the ranges [1, 1], [1, 2], [2, 3], [1, 4]. Why does
    the deque not apply?
  a: 'The left end goes 1, 1, 2, 1: it moves right and then back. When the left end is 2 the deque drops
    the index 1, and at i = 5 the index 1 is allowed again but is gone. A segment tree with range maximum
    answers each range directly.'
- q: Count the increasing subsequences of 2 1 3 by length, with the layers of Theorem 7.3.3.
  a: 'Length 1: 3 (each element). Length 2: (2, 3) and (1, 3), so 2. Length 3: none, because 2 comes before
    1. The counts are 3, 2, 0.'
- q: For the array 1 1 2, why does counting distinct value sequences replace the old count of the value
    1 and not add to it?
  a: 'The second 1 starts the same sequences as the first: its new count is 1 + (nothing below) = 1, the
    same as before. Adding would give 2 and the later 2 would count the sequence (1, 2) twice. The new
    count already contains what the old one counted.'
- q: In Theorem 7.3.4, why does the state i take the best earlier state when the bit i is 1, and what
    do the earlier states do when the bit is 0?
  a: 'A 1 at the position i makes the last 1 equal to i, and the string before it may be any string of
    length i − 1, so the new state is the best earlier state. A 0 changes nothing: every state keeps its
    value and its last 1; only the intervals ending at i add their rewards.'
- q: Compute the states for n = 2 and the intervals (1, 2, 3) and (2, 2, −1).
  a: 'The states start at 0, 0, 0. Position 1: the state 1 takes the best of the state 0, 0. Position
    2: the state 2 takes the best of the states 0 and 1, 0; the interval (1, 2, 3) adds 3 to the states
    1..2: 0, 3, 3; the interval (2, 2, −1) adds −1 to the state 2: 0, 3, 2. The answer is 3 (the string
    10).'
