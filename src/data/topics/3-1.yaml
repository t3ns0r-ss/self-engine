# Topic 3.1 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.1"
draft: true
cards:
  - id: generate-all
    name: List every valid object
    decisive_property: "The answer is the list (or the count) of all objects of some kind, there are few enough of them to list, and each object has one canonical order of choices (increasing indices, equal values left to right), so a recursion that only makes choices in that order produces each object exactly once."
    from_theorem: Theorem 3.1.2
    how_to_test: "Estimate the number of valid objects (C(n, k), n!, a multinomial, 2^n) and multiply by the depth; then fix the canonical order and check that two different choice sequences in that order never give the same object."
    weak_signals:
      - "\"Return all …\" combinations, permutations, subsets, partitions or arrangements"
      - "Input has repeated values but the output must not contain duplicates"
      - "n up to about 10–20, or the output itself is the size of the answer"
    kill_signals:
      - "Only the number of objects is asked and that number is huge (10^9 or more, or printed modulo a prime): count with a formula (2.3) instead of listing"
      - "The same sub-question recurs many times in the recursion and its answer does not depend on how it was reached (topic 3.2)"
    lookalikes:
      - description: "Count the subsets of n ≤ 20 numbers with a given sum, without listing them"
        needs: "subset-bitmask (0.5)"
        flipping_difference: "Only a count of objects with 2^n candidates is needed, so a plain bitmask loop is enough and no duplicates need skipping; listing distinct multisets is what needs the canonical order."
    complexity: "O(depth × number of outputs) when every partial choice can be completed; more if dead ends are reached."
  - id: constraint-placement
    name: Place with checks and undo
    decisive_property: "Positions are filled one at a time and every constraint can be checked as soon as the items it involves are placed, so a partial placement that already breaks a constraint can be rejected without extending it, and no partial placement that could still be completed is rejected."
    from_theorem: Theorem 3.1.1
    how_to_test: "For each constraint, find the moment all its items are placed, and check that the test at that moment only reads placed items; then make sure every mark set before a call is cleared after it."
    weak_signals:
      - "A puzzle on a small board or grid: queens, a 9×9 grid, a word path through letters"
      - "Assign values to a few positions so that pairs or groups satisfy rules"
      - "The raw number of placements is astronomically large but the board is small"
    kill_signals:
      - "A constraint can only be checked when everything is placed (pruning does nothing; estimate the full count)"
      - "The board is large and the question is about reachability or distances (Phase 4)"
    lookalikes:
      - description: "Count the ways to place n non-attacking rooks on an n × n board"
        needs: "product-sum-rules (2.3)"
        flipping_difference: "Rooks only constrain rows and columns, so the count is n! by a formula; queens add diagonals, which no simple formula handles."
    complexity: "No clean worst case; count the nodes on the hardest small input (10 queens: 35 539 calls)."
  - id: bound-pruning
    name: Branch and bound
    decisive_property: "It is an optimisation over choices, and for a partial solution there is an optimistic estimate (never worse than any completion) that is cheap to compute; then a branch whose estimate cannot beat the best solution already found can be cut without losing the optimum."
    from_theorem: Theorem 3.1.3
    how_to_test: "Write the estimate and prove it never understates what the rest can achieve (for a minimum: never overstates the cheapest completion); then order the choices so a good solution is found first."
    weak_signals:
      - "Minimise the largest load, or maximise a total, over assignments of n ≤ 12–20 items to k groups"
      - "Split items into equal-sum groups, sticks into a square, cookies among children"
      - "A good greedy answer exists but is not always optimal"
    kill_signals:
      - "The value of the rest depends only on a small summary of what was chosen (for example the remaining capacity), so equal summaries repeat (topic 3.3)"
      - "n is around 40 and the objective splits into two halves (meet in the middle has a guarantee)"
    lookalikes:
      - description: "Split n ≤ 40 numbers into two groups with sums as close as possible"
        needs: "meet-in-middle (3.1)"
        flipping_difference: "Two groups and n ≈ 40: the objective is a sum that splits into halves, so meet in the middle gives O(2^(n/2) n) with a guarantee instead of hoping the bound cuts enough."
    complexity: "No useful worst case; exponential, cut by how tight the estimate is."
  - id: meet-in-middle
    name: Meet in the middle
    decisive_property: "There are n ≈ 30–45 binary (or few-valued) choices, too many for 2^n, and the objective splits into a part from each half combined by a simple rule (a sum, an exclusive or), so that the question about the combination can be answered by searching a sorted list of one half for each element of the other."
    from_theorem: Theorem 3.1.4
    how_to_test: "Write the objective as f(left choices) ⊕ g(right choices) and check that 'equal to', 'at most' or 'closest to' a target for the combination is a lookup in the sorted list of g-values."
    weak_signals:
      - "n up to 40 (or 35–45): too many for 2^n but 2^(n/2) ≈ 10^6 fits"
      - "Subset sums equal to, at most, or closest to a target, possibly modulo m"
      - "Paths of fixed length in a grid with an exclusive-or or sum condition (split at the middle diagonal)"
    kill_signals:
      - "n ≤ 20: plain bitmask search (0.5) is enough"
      - "The values are small (sums up to about 10^5 to 10^7), so the number of different sums is small (topic 3.3)"
    lookalikes:
      - description: "Count subsets of n ≤ 20 numbers with sum at most T"
        needs: "subset-bitmask (0.5)"
        flipping_difference: "n ≤ 20 makes 2^n ≈ 10^6 small enough to list directly; splitting only pays off when n is around 40."
    complexity: "O(2^(n/2) · n): two lists, a sort, and a binary search per element."
