- id: ac-abc357_f
  role: ladder
  card: lazy-range-update
  rung: 3
  twist: The node stores more than the sum, and the tag changes several fields.
  summary: 'Two sequences A and B of length N ≤ 2·10^5 and Q ≤ 2·10^5 operations: add x to A_l..A_r, add
