# Topic 2.4 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "2.4"
draft: true
cards:
  - id: indicator-linearity
    name: Expected counts from indicators
    decisive_property: "The quantity whose average is asked is a count (or a weighted sum) of events, and the probability of each single event can be computed; then the expected value is the sum of those probabilities, even when the events depend on each other."
    from_theorem: Theorem 2.4.2
    how_to_test: "Write the random quantity as a sum of indicators (one per position, pair or element) and check that each P(event) has a formula."
    weak_signals:
      - "\"Expected number of …\" fixed points, inversions, matches, distinct values, components"
      - "A random permutation, random choices or random swaps; the answer is a fraction modulo 998244353"
      - "The process is complicated but each element's fate has a simple probability"
    kill_signals:
      - "The quantity is a product or a maximum, not a sum (use tail sums for maxima; products need independence)"
      - "The probability of a single event depends on the whole history (a recurrence over states, Phase 3)"
    lookalikes:
      - description: "The probability that at least one event happens"
        needs: "include-exclude (2.3)"
        flipping_difference: "Linearity gives the expected number of events, not the chance that the number is positive; for that, use inclusion–exclusion or the complement."
    complexity: "O(number of events)."
  - id: contribution-total
    name: Totals by contribution
    decisive_property: "A total over all subarrays, subsets, pairs or permutations is a sum over elements of value times a condition on that element; counting, for each element, the configurations in which it counts gives the total without listing the configurations."
    from_theorem: Theorem 2.4.3
    how_to_test: "Exchange the sums: for one element, describe exactly the configurations in which it contributes, and check that their number has a formula (positions, sorting, nearest greater elements)."
    weak_signals:
      - "The sum over all subarrays (or substrings, subsets) of their minimum, maximum, sum or number of distinct values"
      - "Sum of |a_i − a_j| or of some function over all pairs"
      - "n up to 2·10^5, so listing the O(n^2) configurations is too slow"
    kill_signals:
      - "Only one configuration is asked about (no total over all of them)"
      - "The value of a configuration is not a sum over elements (for example a product of all its elements without logarithms)"
    lookalikes:
      - description: "The maximum over all subarrays of their sum"
        needs: "range-sum (1.2) with prefix minima, or a scan"
        flipping_difference: "A maximum over configurations is not a total; contributions only add up."
    complexity: "O(n) or O(n log n) after the per-element counts."
  - id: geometric-wait
    name: Waiting for a success
    decisive_property: "Independent trials repeat until something happens, with a fixed success probability within each stage; each stage takes 1/p trials on average and the stages add."
    from_theorem: Theorem 2.4.5
    how_to_test: "Split the process into stages in which the success probability is the same at every trial, and check that the stages come one after another."
    weak_signals:
      - "\"Expected number of rolls, draws or attempts until …\""
      - "Collect all kinds, see every face, visit every vertex by random picks"
      - "A process restarts from the beginning on failure"
    kill_signals:
      - "The success probability depends on more than the current stage (state with many values: a recurrence, Phase 3)"
      - "There is a fixed number of trials and the question is about the result (indicators or tail sums instead)"
    lookalikes:
      - description: "The probability of at least one success in k trials"
        needs: "fast-power (2.2)"
        flipping_difference: "A fixed number of trials: 1 − (1 − p)^k, not an expected waiting time."
    complexity: "O(number of stages)."
  - id: tail-sum
    name: Expectation by tail sums
    decisive_property: "The random value is a non-negative integer, typically a maximum or minimum of independent values, and P(X ≥ x) (or P(X ≤ x)) is easy as a product; then E[X] = Σ P(X ≥ x)."
    from_theorem: Theorem 2.4.4
    how_to_test: "Check that the values are integers in a range small enough to sum over, and that P(max ≤ x) or P(min ≥ x) factors over independent parts."
    weak_signals:
      - "Expected maximum or minimum of several dice, draws or random numbers"
      - "Expected value of the largest (or k-th largest) of independent choices"
      - "Probabilities that are easy as \"all of them are at most x\""
    kill_signals:
      - "The values are dependent (drawn without replacement) and no product formula holds"
      - "The value is a sum: plain linearity is simpler"
    lookalikes:
      - description: "Expected sum of several dice"
        needs: "indicator-linearity (2.4)"
        flipping_difference: "A sum is linear: add the expectations. Only maxima and minima need tail sums."
    complexity: "O(range of values × number of independent parts), or less with fast powers."
problems:
