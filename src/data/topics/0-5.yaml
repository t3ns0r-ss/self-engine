# Topic 0.5 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.5"
draft: true
cards:
  - id: nested-loops
    name: Try every pair or triple
    decisive_property: The candidates are pairs, triples or a few values, every candidate is listed by nested loops, and their number (about n²/2 or n³/6, fewer after computing the last variable from the others) times the check fits the budget.
    from_theorem: Theorem 0.5.1
    how_to_test: Write the candidate as a tuple, count the tuples with the largest input, and see whether one variable is determined by the others.
    weak_signals:
      - '"How many ways to choose …" with three or four variables and a small total'
      - n ≤ 100 to 3000 with a question about pairs or triples
      - A sum of coins or items equals a target
    kill_signals:
      - "n² is far over the budget (n ≥ 10^5): a sort, a map or a formula is needed"
    lookalikes:
      - description: The same question about pairs with n = 2·10^5
        needs: "a faster tool: sorting (1.1) or counting with a map (0.6)"
        flipping_difference: n²/2 = 2·10^10 pairs do not fit the budget.
    complexity: O(n²) or O(n³) checks, or one dimension fewer when the last variable is computed.
  - id: subset-bitmask
    name: All subsets as bitmasks
    decisive_property: Each of n ≤ about 20 items is independently in or out, every subset can be checked on its own, and 2^n · (cost of one check) fits the budget.
    from_theorem: Theorem 0.5.2
    how_to_test: Ask "is this a yes/no choice for each item?", then compute 2^n times the cost of checking one subset.
    weak_signals:
      - N ≤ 15 or N ≤ 20 in an otherwise ordinary statement
      - '"Choose some of …", "split into two groups", "which switches are on"'
      - Every item is either used or not
    kill_signals:
      - Each item has more than two options, or the order matters
      - n is 40 or more
    lookalikes:
      - description: Each item goes to one of three or four places
        needs: recursive-choices (0.5)
        flipping_difference: More than two choices per item do not fit one bit each; recursion (or base k counting) lists them.
    complexity: O(2^n · n) when one subset is checked in O(n).
  - id: permutations
    name: All orders
    decisive_property: The answer depends on the order of n ≤ about 9 items, every order can be checked on its own, and (number of distinct orders, at most n!) times the check fits the budget.
    from_theorem: Theorem 0.5.3
    how_to_test: Ask whether swapping two items changes the result (then the order matters), and compute n! · n.
    weak_signals:
      - '"Visit every city once", "arrange", "in some order", "relabel the vertices"'
      - N ≤ 8 or N ≤ 10
      - The K-th string made from the letters of S
    kill_signals:
      - "Only which items are chosen matters, not their order: subsets are enough"
      - n ≥ 12 (12! ≈ 4.8·10^8 orders)
    lookalikes:
      - description: Choose which items to take, order irrelevant
        needs: subset-bitmask (0.5)
        flipping_difference: "With order irrelevant, 2^n subsets replace n! orders: far fewer candidates."
    complexity: O(n! · n), fewer when values repeat.
  - id: recursive-choices
    name: Recursive generation
    decisive_property: A candidate is a sequence of L choices whose length L is part of the input (or whose allowed choices depend on earlier ones), and the number of sequences (k^L or fewer) times the check fits the budget.
    from_theorem: Theorem 0.5.4
    how_to_test: Write the candidate as positions with choices; check that L varies with the input, so a fixed number of nested loops cannot list it, and bound the number of sequences.
    weak_signals:
      - '"All sequences of length N with …", "non-decreasing sequences", "numbers made only of the digits 3, 5, 7"'
      - Each item has three or more options
      - Small N and M (≤ 10) together
    kill_signals:
      - The count k^L is far over the budget even with small parameters (then a later technique is needed)
    lookalikes:
      - description: Strictly increasing sequences of length N from 1..M
        needs: subset-bitmask (0.5)
        flipping_difference: A strictly increasing sequence is the same as the set of its values, so N-element subsets list them; repeats would break that.
    complexity: O(k^L · cost of the check), depth L.
  - id: enumerate-answer
    name: Try every candidate answer
    decisive_property: The answer (or one key quantity) lies in a range proved small from the constraints, and each value can be checked directly, so testing every value in order finds the smallest that works.
    from_theorem: Theorem 0.5.5
    how_to_test: Bound the answer from the constraints, then check that (range size) × (cost of one check) fits the budget.
    weak_signals:
      - '"The smallest x such that …" with a small bound on x'
      - One quantity (a count of mixed items, a price, a starting value) determines everything else
      - Candidate answers are few even though inputs are large
    kill_signals:
      - "The range is huge (10^18) and the check is not monotone-friendly: a formula or a later search technique is needed"
    lookalikes:
      - description: The same smallest-x question with x up to 10^18
        needs: a formula (0.2) or a later search
        flipping_difference: Testing every value is impossible; the answer must be computed or searched faster.
    complexity: O(range · cost of one check).
