drill:
- problem: ac-abc132_d
  answer:
    topic: '2.3'
    card: ncr-mod-p
  property: Choose the i places for the blue groups among the N − K + 1 gaps around the red balls (C(N
    − K + 1, i)), and split the K blue balls into i non-empty groups (C(K − 1, i − 1)); multiply.
  why_others_fail: Listing the rows is exponential; the count is a product of two binomial coefficients.
- problem: ac-abc156_d
  answer:
    topic: '2.3'
    card: ncr-mod-p
  property: All non-empty subsets are 2^n − 1; subtract C(n, a) and C(n, b). n is huge but a and b are
    small, so each coefficient is a product of a factors divided by a!.
  why_others_fail: No factorial table reaches 10^9; the small r makes the product formula of Theorem 2.3.3
    (note 3) work.
- problem: ac-abc178_d
  answer:
    topic: '2.3'
    card: stars-bars
  property: 'For k terms, subtract 3 from each: k non-negative parts summing to S − 3k, C(S − 3k + k −
    1, k − 1) ways; add over k.'
  why_others_fail: 'The terms are ordered and the total is fixed: identical units into labelled terms.'
- problem: cf-1288C
  answer:
    topic: '2.3'
    card: stars-bars
  property: 'a followed by b reversed is one non-decreasing sequence of length 2m over 1..n, and every
    such sequence gives a valid pair: count the non-decreasing sequences, C(n + 2m − 1, 2m).'
  why_others_fail: 'A non-decreasing sequence is fixed by how many times each value appears: stars and
    bars.'
- problem: cses-1717
  answer:
    topic: '2.3'
    card: include-exclude
  property: 'Bad properties: child i gets their own gift. Fixing j of them leaves (n − j)! ways, so the
    count is Σ (−1)^j C(n, j)(n − j)!.'
  why_others_fail: Permutations without fixed points must avoid n properties at once; N(S) depends only
    on |S|.
- problem: ac-abc202_d
  answer:
    topic: '2.3'
    card: ncr-mod-p
  property: 'Build the answer letter by letter: strings starting with a number C(A + B − 1, A − 1); if
    K is at most that, write a, otherwise subtract and write b.'
  why_others_fail: The counts are exact binomial coefficients (below 2^60); the k-th string is found by
    counting, not listing.
- problem: lc-number-of-ways-to-reach-a-position-after-exactly-k-steps
  answer:
    topic: '2.3'
    card: ncr-mod-p
  property: 'With d = |end − start|, the k steps contain (k + d)/2 right steps; a way is fixed by which
    steps go right: C(k, (k + d)/2), or 0 if the parity or distance does not fit.'
  why_others_fail: Only the counts of left and right steps matter, as for lattice paths.
- problem: ac-abc163_d
  answer:
    topic: '2.3'
    card: product-sum-rules
  property: For a fixed number k of chosen numbers, every sum between the k smallest and the k largest
    is reachable, a range of k(N − k + 1) + 1 values; ranges for different k are disjoint (sum rule),
    so add them over k ≥ K.
  why_others_fail: Sums of different counts never coincide because of the 10^100 part, so the cases add.
- problem: lc-nth-magical-number
  answer:
    topic: '1.4'
    card: answer-search
  property: The count of magical numbers up to x is monotone in x and equal to ⌊x/a⌋ + ⌊x/b⌋ − ⌊x/lcm⌋
    (two sets, Theorem 0.4.6); binary search the smallest x with count n.
  why_others_fail: 'Only two divisors: the two-set count of topic 0.4 is enough, and the main tool is
    the search over x.'
- problem: lc-count-number-of-homogenous-substrings
  answer:
    topic: '0.2'
    card: closed-form
  property: Each maximal run of length L contributes L(L + 1)/2 substrings; sum over the runs.
  why_others_fail: No choice of positions or exclusion is involved; one formula per run.
- problem: cf-1526C1
  answer:
    topic: '1.5'
    card: extreme-first
  property: Drink every potion; whenever health becomes negative, give up the most harmful potion drunk
    so far (a heap); each removal is forced and loses one potion.
  why_others_fail: 'Nothing is counted: it is an optimisation with a greedy exchange.'
lookalike_pairs:
- a: lc-distribute-candies-among-children-ii
  b: lc-distribute-candies-among-children-i
  a_tool:
    topic: '2.3'
    card: include-exclude
  b_tool:
    topic: '0.5'
    card: nested-loops
  flipping_difference: The same question with different sizes. With n ≤ 50, trying every pair of amounts
    is 2500 steps. With n up to 10^6 that loop is still fine for 3 children, but the closed form of inclusion–exclusion
    is O(1) and is the tool that scales to more children.
  shared_surface: Both distribute n candies among 3 children with a limit per child.
  flipping_input: 'A: n = 10^6 and limit 5·10^5, where only the closed form with inclusion–exclusion is
    fast enough. B: n = 5 and limit 2, where two nested loops over the first two amounts are 36 steps.'
- a: lc-ugly-number-iii
  b: lc-minimize-the-maximum-of-two-arrays
  a_tool:
    topic: '2.3'
    card: include-exclude
  b_tool:
    topic: '1.4'
    card: answer-search
  flipping_difference: Both binary search a value and count multiples below it. A needs the union of three
    sets, so the count is the seven-term alternating sum. B only ever needs two sets (and their intersection),
    which topic 0.4 already counts; its difficulty is the feasibility condition, not the count.
  shared_surface: Both binary search a value and count multiples below it.
  flipping_input: 'A: how many numbers up to 100 are divisible by 2, 3 or 5 is 74, a seven-term alternating
    sum of three sets. B: with two divisors 2 and 3 the count is x − ⌊x/2⌋ − ⌊x/3⌋ + ⌊x/6⌋, two sets and
    the overlap, and the work is the binary search.'
self_test:
- q: How many 4-letter strings over {a, b, c} have no two equal neighbours, and why may the options be
    multiplied?
  a: 3·2·2·2 = 24. The first letter has 3 options and every later letter 2, whatever the earlier letters
    were, so the product rule applies (Theorem 2.3.1).
- q: Why does the factorial table method need n < p, and what goes wrong for n ≥ p?
  a: For n ≥ p, n! contains the factor p, so n! ≡ 0 and (r!)^(−1) may not exist; the formula silently
    gives 0 or garbage (Theorem 2.3.3, note 1).
- q: In how many ways can 10 identical sweets be shared by 4 children if each gets at least 2?
  a: 'Give each child 2 first; the remaining 2 sweets go to 4 children freely: C(2 + 3, 3) = 10 (Theorem
    2.3.5).'
- q: How many numbers in 1..60 are divisible by 2, 3 or 5? Show the inclusion–exclusion terms.
  a: 30 + 20 + 12 − 10 − 6 − 4 + 2 = 44 (multiples of 2, 3, 5, then of 6, 10, 15, then of 30).
- q: A string has 3 a's, 2 b's and 1 c. How many different arrangements does it have, and what is the
    count as a product of binomials?
  a: '6!/(3!·2!·1!) = 60 = C(6, 3)·C(3, 2)·C(1, 1): choose the positions of the a''s, then of the b''s
    among the rest (Theorem 2.3.4).'
- q: Why is the number of lattice paths from (0, 0) to (3, 2) not 2^5?
  a: '2^5 counts all sequences of 5 steps, but a path to (3, 2) must have exactly 3 right steps; it is
    fixed by their positions: C(5, 3) = 10 (Theorem 2.3.7).'
