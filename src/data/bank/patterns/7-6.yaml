# Patterns for topic 7.6 (Matrix exponentiation for linear recurrences). Provisional until the lesson maps them to Recognition Cards.
topic: "7.6"
patterns:
  - id: linear-recurrence
    name: Linear recurrences with huge n
    description: f(n) as a fixed linear combination of the previous k values, n up to 10^18, via the k × k matrix power.
    precondition: Each step is the same linear map, and matrix multiplication is associative.
  - id: walk-counting
    name: Counting walks of length k
    description: Number of walks of length exactly k between vertices = entries of the adjacency matrix to the power k.
    precondition: Walks of length a + b split uniquely at step a, which is exactly matrix multiplication.
  - id: augmented-matrix
    name: Recurrences with extra terms
    description: Recurrences with a constant, n, or a running sum added; extend the state vector with those terms.
    precondition: The extra terms themselves follow a linear recurrence.
  - id: min-plus
    name: Best walk with exactly k edges
    description: Shortest walk with exactly k edges using matrix "multiplication" with (min, +).
    precondition: (min, +) is associative and + distributes over min, so the power trick still works.
