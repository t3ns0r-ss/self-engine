# Bridge set, Phase 4 to 5 (CURRICULUM_GAPS_PLAN.md Section 6, item 3). Not a topic: no row in curriculum.yaml.
# Problems of about 1900 to 2100 that a reader who has finished Phase 4 can solve with one step beyond the tools they have.
# `have` is the known tool (topic ids in `have_topics`, none after Phase 4); `new_idea` is the one step beyond, one line.
# Every statement was opened and read, and every new_idea checked against it (source_check: page). No problem here is in a topic bank.
id: bridge-4-5
title: "Bridge set: Phase 4 to Phase 5"
rating: "1900 to 2100"
problems:
  - id: ac-abc239_f
    source: atcoder
    title: "Construct Highway"
    url: https://atcoder.jp/contests/abc239/tasks/abc239_f
    difficulty: "1959"
    summary: "Add highways between towns so that the network is connected and every town has exactly its required number of highways."
    have: "Union-find on the given edges to get the components (4.5)."
    have_topics: ["4.1", "4.5"]
    new_idea: "Shrink each component to one node whose budget is its unused degree, then build a tree from the degree list by hanging budget-1 nodes on nodes with spare budget."
    checked_on: 2026-11-16
  - id: ac-abc229_f
    source: atcoder
    title: "Make Bipartite"
    url: https://atcoder.jp/contests/abc229/tasks/abc229_f
    difficulty: "1917"
    summary: "Delete the cheapest set of edges from a wheel-shaped graph so that what remains is bipartite."
    have: "A graph is bipartite when it has a 2-colouring with no edge inside a colour (4.2)."
    have_topics: ["4.2"]
    new_idea: "Fix the colours of vertex 0 and vertex 1, then run a two-state DP around the cycle, paying for every edge whose ends get the same colour."
    checked_on: 2026-11-16
  - id: ac-abc142_f
    source: atcoder
    title: "Pure"
    url: https://atcoder.jp/contests/abc142/tasks/abc142_f
    difficulty: "1919"
    summary: "Find a set of vertices of a directed graph whose induced subgraph has in-degree and out-degree exactly 1 everywhere."
    have: "Breadth-first search from each vertex (4.1) and cycle detection (4.2)."
    have_topics: ["4.1", "4.2"]
    new_idea: "A shortest cycle has no chord, because a chord would give a shorter cycle, so it is already an induced cycle: take the shortest cycle over all start vertices."
    checked_on: 2026-11-16
  - id: ac-abc260_f
    source: atcoder
    title: "Find 4-cycle"
    url: https://atcoder.jp/contests/abc260/tasks/abc260_f
    difficulty: "1995"
    summary: "Find a cycle of length 4 in a bipartite graph with many vertices on one side and at most 3000 on the other."
    have: "Adjacency lists and the two sides of a bipartite graph (4.1, 4.2)."
    have_topics: ["4.1", "4.2"]
    new_idea: "Pigeonhole: record every pair of neighbours of each left vertex; at most T(T-1)/2 pairs can be new, so a repeated pair, which is a 4-cycle, appears after few steps."
    checked_on: 2026-11-16
  - id: ac-abc181_f
    source: atcoder
    title: "Silver Woods"
    url: https://atcoder.jp/contests/abc181/tasks/abc181_f
    difficulty: "2009"
    summary: "Largest circle that can roll through a corridor with nails in it."
    have: "Kruskal with union-find (4.5) over distances between points."
    have_topics: ["4.5"]
    new_idea: "Make the two walls extra nodes, join nodes in increasing order of distance, and stop when the walls become connected: that distance is the circle diameter that no longer fits."
    checked_on: 2026-11-16
  - id: ac-abc375_g
    source: atcoder
    title: "Road Blocked 2"
    url: https://atcoder.jp/contests/abc375/tasks/abc375_g
    difficulty: "2014"
    summary: "For every road, decide whether closing it changes the shortest distance between city 1 and city N."
    have: "Dijkstra (4.3) from both ends, and bridges (4.8)."
    have_topics: ["4.3", "4.8"]
    new_idea: "Keep only the edges that lie on some shortest route; a road changes the answer exactly when it is a bridge of that subgraph."
    checked_on: 2026-11-16
  - id: ac-abc369_g
    source: atcoder
    title: "As far as possible"
    url: https://atcoder.jp/contests/abc369/tasks/abc369_g
    difficulty: "2055"
    summary: "For every K, the longest closed walk from vertex 1 that an adversary can force by naming K vertices to visit."
    have: "Depth-first search with distances, and the farthest vertex (4.6)."
    have_topics: ["4.6"]
    new_idea: "Long-path decomposition: cut the tree into chains by always following the deepest child; the answer for K is twice the total length of the K longest chains."
    checked_on: 2026-11-16
  - id: ac-abc359_g
    source: atcoder
    title: "Sum of Tree Distance"
    url: https://atcoder.jp/contests/abc359/tasks/abc359_g
    difficulty: "2099"
    summary: "Sum of tree distances over all pairs of vertices that carry the same value."
    have: "Depths, subtree sums and the lowest common ancestor formula for tree distance (4.6, 4.7)."
    have_topics: ["4.6", "4.7"]
    new_idea: "Split each distance as depth + depth - 2 * depth of the common ancestor, and merge the per-colour (count, depth sum) tables of children small into large so that each pair is counted once, at its ancestor."
    checked_on: 2026-11-16
  - id: ac-abc295_g
    source: atcoder
    title: "Minimum Reachable City"
    url: https://atcoder.jp/contests/abc295/tasks/abc295_g
    difficulty: "2091"
    summary: "Answer smallest-reachable-vertex queries on a tree while edges that point back up are added."
    have: "Strongly connected components (4.8) and union-find (4.5)."
    have_topics: ["4.5", "4.8"]
    new_idea: "The new edge u to v has v above u in the base tree, so it closes a cycle along the whole tree path: merge that path into one component by walking up from u, keeping the minimum label; each vertex merges once."
    checked_on: 2026-11-16
  - id: ac-abc197_f
    source: atcoder
    title: "Construct a Palindrome"
    url: https://atcoder.jp/contests/abc197/tasks/abc197_f
    difficulty: "1945"
    summary: "Shortest path from vertex 1 to vertex N whose edge letters spell a palindrome."
    have: "Breadth-first search over a graph of states (4.4)."
    have_topics: ["4.4"]
    new_idea: "Grow the palindrome from both ends at once: a state is the pair of end vertices, both step along edges with the same letter, and the answer is twice the distance to a pair (a, a) or twice plus one to a pair joined by an edge."
    checked_on: 2026-11-16
  - id: ac-abc258_g
    source: atcoder
    title: "Triangle"
    url: https://atcoder.jp/contests/abc258/tasks/abc258_g
    difficulty: "1944"
    summary: "Count the triangles of a graph with up to 3000 vertices given as a 0/1 matrix."
    have: "An adjacency matrix (4.1) and bit operations (1.7)."
    have_topics: ["1.7", "4.1"]
    new_idea: "Count triangles through each edge (i, j) as the number of set bits in the AND of two adjacency rows stored as bitsets, which costs about N^3 / 64 operations."
    checked_on: 2026-11-16
  - id: ac-abc233_f
    source: atcoder
    title: "Swap and Sort"
    url: https://atcoder.jp/contests/abc233/tasks/abc233_f
    difficulty: "2038"
    summary: "Sort a permutation using only a given list of allowed position swaps, with at most 500000 swaps."
    have: "Union-find to see which positions can exchange values (4.5), and paths in a spanning tree (4.6)."
    have_topics: ["4.5", "4.6"]
    new_idea: "Swaps along a spanning tree are enough: repeatedly take a leaf, bring the right value to it along the tree path, delete the leaf; at most N(N-1)/2 swaps in total."
    checked_on: 2026-11-16
