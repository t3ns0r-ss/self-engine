drill:
- problem: lc-delete-operation-for-two-strings
  answer:
    topic: '3.4'
    card: lcs
  property: 'Only deletions are allowed, so what survives is a common subsequence; keeping the longest
    one deletes the fewest: n + m − 2·LCS.'
  why_others_fail: Edit distance would allow a replacement for cost 1, which here costs two deletions;
    matching letters greedily can pick the wrong copy of a repeated letter.
- problem: lc-longest-ideal-subsequence
  answer:
    topic: '3.4'
    card: lis
  property: 'The rule compares only consecutive chosen letters, so the best subsequence ending in each
    letter is all you need: best[c] = 1 + max best[c′] over the letters c′ within k (26 values instead
    of n indices).'
  why_others_fail: The O(n²) table of Theorem 3.4.1 is 10^10 steps; the tails array needs an order like
    <, and "within k" is not one.
- problem: cses-3403
  answer:
    topic: '3.4'
    card: lcs
  property: 'Both arrays keep their order and both may skip elements, with n·m = 10^6: the table over
    prefix pairs, then a walk back from (n, m) to print one subsequence.'
  why_others_fail: Two pointers only decide whether one array is a subsequence of the other; the reduction
    to LIS needs distinct values, and these arrays may repeat.
- problem: lc-longest-arithmetic-subsequence
  answer:
    topic: '3.4'
    card: lis
  property: 'The rule between consecutive chosen elements depends on the difference, so put it in the
    state: len[i][d] = 1 + len[j][d] over j < i with a_i − a_j = d, an O(n²) table as in Theorem 3.4.1.'
  why_others_fail: The difference is not given, so the one-value map of a fixed difference does not apply;
    the tails array needs an order between values, not equal differences.
- problem: ac-abc204_d
  answer:
    topic: '3.3'
    card: subset-sums
  property: 'Only the total time given to the first oven matters, and it is a subset sum ≤ 10^5: answer
    = min over reachable s of max(s, total − s).'
  why_others_fail: 'The greedy "next dish into the less loaded oven" fails: times 3, 3, 2, 2, 2 give 7
    that way, but 3 + 3 and 2 + 2 + 2 finish at 6. Nothing here is a sequence to keep in order.'
- problem: lc-last-stone-weight-ii
  answer:
    topic: '3.3'
    card: subset-sums
  property: Every order of smashing ends with |sum(A) − sum(B)| for some split into two groups, and every
    split can be reached; so find the reachable subset sum closest to half the total.
  why_others_fail: 'Always smashing the two heaviest stones fails: 3, 3, 2, 2, 2 leaves 2 that way, but
    the split 3 + 3 against 2 + 2 + 2 leaves 0.'
- problem: lc-number-of-matching-subsequences
  answer:
    topic: '1.4'
    card: sorted-search
  property: 'Deciding "is a subsequence" is greedy: match each letter at its first possible position after
    the previous one, found by binary search in that letter''s sorted list of positions.'
  why_others_fail: An LCS table per word is 5000 · 5·10^4 · 50 steps; it answers a harder question than
    the one asked.
- problem: lc-longest-arithmetic-subsequence-of-given-difference
  answer:
    topic: '3.2'
    card: linear-state
  property: 'The predecessor of a value x must be exactly x − d, so best[x] = best[x − d] + 1 with best
    kept in a map by value: one index, one transition.'
  why_others_fail: The O(n²) table of Theorem 3.4.1 is 10^10 steps, and the tails array needs an order
    (<), not a fixed difference.
- problem: lc-wiggle-subsequence
  answer:
    topic: '3.2'
    card: extra-small-state
  property: Whether the next element may be taken depends only on whether the last step went up or down,
    so two numbers (longest ending with a rise, with a fall) updated in one pass suffice.
  why_others_fail: The O(n²) subsequence table of Theorem 3.4.1 also passes at n ≤ 1000, but it tracks
    the last index where only the last direction matters; the tails array does not apply because the rule
    is not an order.
lookalike_pairs:
- a: lc-russian-doll-envelopes
  b: lc-maximum-length-of-pair-chain
  a_tool:
    topic: '3.4'
    card: lis-reduction
  b_tool:
    topic: '1.5'
    card: interval-selection
  flipping_difference: Both build the longest chain of pairs. In A both coordinates must increase, so
    after sorting one key the other still has to form an increasing subsequence. In B a pair only has
    to start after the previous one ends, like disjoint intervals, and the earliest end first is optimal.
  shared_surface: Both build the longest chain of pairs.
  flipping_input: 'A: the pairs (1, 2), (2, 3), (3, 4) as envelopes where both sides must increase: the
    chain has length 3, found by sorting and the tails array. B: the same pairs as intervals that must
    not overlap: the chain has length 2, found by taking the earliest end first.'
- a: lc-minimum-operations-to-make-a-subsequence
  b: lc-longest-common-subsequence
  a_tool:
    topic: '3.4'
    card: lis-reduction
  b_tool:
    topic: '3.4'
    card: lcs
  flipping_difference: Both are a longest common subsequence (A asks for |target| − LCS). In A the values
    of target are distinct, so each element of arr matches at most one position and the LCS is an increasing
    subsequence of positions, O(n log n) at 10^5. In B letters repeat, and at 1000 × 1000 the table is
    fast enough.
  shared_surface: Both are a longest common subsequence of two sequences.
  flipping_input: 'A: the target has distinct values, so each element of arr matches at most one position
    and the LCS is an increasing subsequence of positions, at length 10^5. B: letters repeat, and at 1000
    × 1000 the table over prefix pairs is fast enough.'
self_test:
- q: Run the smallest-tail array on 3, 1, 4, 1, 5, 9, 2, 6 (strictly increasing). What is it after each
    element, and what is the answer?
  a: '[3], [1], [1, 4], [1, 4], [1, 4, 5], [1, 4, 5, 9], [1, 2, 5, 9], [1, 2, 5, 6]; the answer is 4.
    The final array is not itself a subsequence (2 comes after 5 and 9 in the input).'
- q: On the array 2, 2, 2, what do lower_bound and upper_bound give, and which matches "strictly increasing"
    and which "non-decreasing"?
  a: 'lower_bound keeps replacing the single tail: length 1, the strict answer. upper_bound appends every
    time: length 3, the non-decreasing answer.'
- q: Envelopes (2, 3) and (2, 4). After sorting by width, why must equal widths be ordered by height descending?
  a: Ascending gives heights 3, 4, an increasing subsequence of length 2, but (2, 3) does not fit into
    (2, 4) since the widths are equal. Descending gives 4, 3, length 1, which is right.
- q: Fill the LCS table for ABCBDAB and BDCABA. What is the length, and which subsequence does the walk
    back give if ties go up?
  a: Length 4; walking back from the corner, taking equal letters diagonally and moving up on ties, gives
    BCBA.
- q: What is the edit distance from kitten to sitting, and which three edits achieve it?
  a: '3: replace k by s, replace e by i, insert g at the end.'
- q: For abc and abd, compare the edit distance with the fewest deletions (from both sides) to make them
    equal.
  a: 'Edit distance 1 (replace c by d). Deletions only: LCS = 2 (ab), so 3 + 3 − 2·2 = 2. A replacement
    does in one step what costs two deletions.'
- q: n ≤ 3000, and a subsequence may continue from a_j to a_i only if a_j divides a_i. Which tool, and
    why not the tails array?
  a: 'The O(n²) table of Theorem 3.4.1: dp[i] = 1 + max dp[j] over j < i with a_j dividing a_i. Divisibility
    is not a total order (2 and 3 do not divide each other), so a smallest tail for each length does not
    tell which later values can extend it.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - lc-minimum-number-of-removals-to-make-mountain-array
  - cf-1446B
  - lc-max-dot-product-of-two-subsequences
decision_map:
- weak_signal: '"Longest subsequence such that…", one array, n up to 2·10^5'
  choose: lis
  when: 'The rule compares consecutive chosen elements with < or ≤: the smallest-tail array (Theorem 3.4.2);
    for other pairwise rules with n ≤ 5000, the O(n²) table (Theorem 3.4.1).'
  over:
  - card: linear-state
    because: When the predecessor is a single fixed value (x − d, x − 1), a one-index table in a map is
      enough.
    topic: '3.2'
  - card: sort-then-scan
    because: If elements may be reordered, or the answer must be contiguous, sorting or one scan answers
      it.
    topic: '1.1'
- weak_signal: Items with two measures; nest, stack or chain them; the input order is free
  choose: lis-reduction
  when: 'A chain needs both keys to increase: sort by one key, break ties so equal first keys cannot follow
    each other, then LIS on the second (Theorem 3.4.3).'
  over:
  - card: interval-selection
    because: If a pair only has to start after the previous one ends (disjoint intervals), the earliest
      end first is optimal and no LIS is needed.
    topic: '1.5'
- weak_signal: Two strings or arrays; keep order on both sides; delete or match
  choose: lcs
  when: 'Both sides may skip elements and n·m ≤ about 10^7: the table over prefix pairs (Theorem 3.4.4),
    walking back for one solution.'
  over:
  - card: merge-walk
    because: If the question is only whether one is a subsequence of the other, two pointers decide it
      in linear time.
    topic: '1.3'
  - card: lis-reduction
    because: If one sequence has distinct values, map the other to positions and take an LIS in O(n log
      n), needed when n·m is too large.
- weak_signal: Turn one string into another with insertions, deletions, replacements; is it within k edits
  choose: edit-distance
  when: 'Single-character edits with fixed costs: the alignment table of Theorem 3.4.5; for "within k"
    only the band |i − j| ≤ k.'
  over:
  - card: lcs
    because: With deletions only (or insertions only) the answer is n + m − 2·LCS; a replacement changes
      the costs, so it needs its own table.
  - card: two-index
    because: Edit distance is a two-index table of 3.2 with a fixed shape; recognising the three moves
      is what this card adds.
    topic: '3.2'
