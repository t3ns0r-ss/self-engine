  - 'With J = top row joined and S = split: J′ = 2J + S, S′ = J + 4S, from J = S = 1 at height 1; store
    J + S for every height up to 10^6 and answer the queries from the table.'
- id: ac-abc104_d
  role: ladder
  card: sequence-counting
  rung: 6
  twist: Sum a count over all fillings of the "?" at once, with states for "matched A", "matched AB",
    "matched ABC".
  summary: For a string of A, B, C and ? (length ≤ 10^5), add up over all 3^Q ways to replace the ? the
    number of subsequences ABC; print the sum modulo 10^9 + 7.
  hints:
  - Instead of the fillings, what do you count when you scan left to right?
  - 'Pairs (filling of the scanned part, partial match): cnt[0] = fillings so far, cnt[1] = (filling,
    chosen A), cnt[2] = (filling, A then B), cnt[3] = complete ABC.'
  - A fixed letter adds cnt[j − 1] to cnt[j] for its j; a ? first multiplies all counts by 3 (three letters)
    and then adds cnt[j − 1] to cnt[j] for each j, using the old values. Answer cnt[3].
- id: lc-number-of-dice-rolls-with-target-sum
  role: ladder
  card: partition-counting
  rung: 1
  twist: Base case of the card
  summary: Count the ways to roll n ≤ 30 dice with k ≤ 30 faces each so that the faces add up to target
    ≤ 1000, modulo 10^9 + 7.
  hints:
  - Are the dice ordered, and how many parts does a sum have?
  - 'The dice are different (die 1, die 2, …), so order matters, and there are exactly n parts: the state
    is (dice rolled, sum so far).'
  - ways[i][s] = Σ over faces f ≤ min(k, s) of ways[i − 1][s − f], ways[0][0] = 1. O(n · target · k).
- id: cf-1673C
