# Topic 0.1 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.1'
uses: []
theorems:
- id: 0.1.1
  title: A b-bit integer type holds a fixed range
  plain_words: A 32-bit int stops at about 2.1 billion and a 64-bit long long at about 9.2 quintillion;
    a result above the limit is not stored correctly, so the type must be chosen from the largest value
    any step can reach.
  code: 0.1/thm-1
- id: 0.1.2
  title: A product can be compared with a limit without computing it
  plain_words: To ask whether a times b is above a limit L, ask whether a is above L divided by b (rounded
    down). The product itself, which might not fit, is never computed.
  code: 0.1/thm-2
- id: 0.1.3
  title: Work sized by each test adds up to the sum of the sizes
  plain_words: If every test costs time proportional to its own size, all tests together cost time proportional
    to the sum of the sizes. If every test costs time proportional to the largest possible size, the cost
    is multiplied by the number of tests.
  code: 0.1/thm-3
- id: 0.1.4
  title: Floor and ceiling division from truncating division
  plain_words: C++ division cuts off the fraction, which rounds toward zero. For non-negative numbers
    that is rounding down; for a negative number that is not an exact multiple it rounds up, so one must
    be subtracted to get the floor.
  code: 0.1/thm-4
- id: 0.1.5
  title: An integer square root needs an integer correction
  plain_words: A double holds integers exactly only up to about 9·10^15, so the square root of a large
    integer computed in floating point can be off by one. Check the guess with integer comparisons and
    move it down or up until it fits.
  code: 0.1/thm-5
cards:
- id: overflow-64bit
  name: 64-bit integers
  decisive_property: Some intermediate value (a sum, a product, a count) can exceed about 2.1·10^9 but
    stays below about 9.2·10^18, so every step must be computed in long long; a product that could pass
    10^18 is checked by division first (a > L / b) instead of being computed.
  from_theorem: 0.1.1
  how_to_test: Multiply out the largest values the constraints allow for every intermediate result, not
    just the answer. Over 2.1·10^9 means long long; over 9.2·10^18 means checking before multiplying (Theorem
    0.1.2) or unsigned long long up to 1.8·10^19.
  constraint_shapes:
  - 'n up to 2·10^5 values of size up to 10^9: the sum reaches 2·10^5 · 10^9 = 2·10^14, which is 10^5
    times the int limit of 2.1·10^9, while two such values multiplied give 10^18, still below the long
    long limit of 9.2·10^18.'
  weak_signals:
  - form: Asks for a sum, a product, or a count of pairs over many values
    shape: Values up to 10^9 or 10^18 in the constraints and n of 10^5 or more
  - form: Warns that the answer may not fit in a 32-bit integer
    shape: The output section states a large maximum, such as 10^14 or 10^18
  - form: Asks for every value of a process that grows, such as repeating a rule on a start value
    shape: Start values up to 10^6 or more whose steps climb past 2^31
  kill_signals:
  - 'All values and every combination of them stay below 2·10^9: for n = 100 and values up to 10^6 the
    sum is at most 10^8, and an int is enough.'
  - 'Even the 64-bit range is exceeded: four values of 10^6 give 10^24 > 9.2·10^18, so the product must
    be checked by division or reduced as the statement asks.'
  in_action:
    statement: Read n integers a_1, …, a_n and print their sum.
    constraints: n ≤ 2·10^5, |a_i| ≤ 10^9.
    budget: 'Reading and adding n numbers is 2·10^5 steps, far below 10^8 per second, so time is no issue.
      The danger is the type: the largest possible sum is 2·10^5 · 10^9 = 2·10^14.'
    candidates:
    - tool: Keep the sum in an int
      verdict: rejected
      because: 2·10^14 is about 10^5 times the int limit of 2.1·10^9, so the sum wraps around.
    - tool: Keep the sum in a double
      verdict: rejected
      because: A double is exact only up to about 9·10^15; it would work here, but it is the wrong habit
        for exact counts, and the next problem may exceed that.
    - tool: Keep the sum in a long long (this topic)
      verdict: chosen
      because: 2·10^14 is far below 9.2·10^18, so every step is exact.
    property_check: 'Largest intermediate value: the running sum, at most 2·10^14. It exceeds 2.1·10^9
      and stays below 9.2·10^18, so long long is the right type for the sum. Each value is also read into
      a long long, so the addition happens in 64 bits.'
    decision: long long for the sum and for every value that is added to it.
  examples:
    positive:
    - inline:
        input: 200000 values, all equal to 10^9; print the sum
        answer: '200000000000000'
        why: The running sum reaches 2·10^14, above the int limit and far below the long long limit, so
          a long long sum is exact.
    - worked_example: cses-1068
      why: The process starts below 10^6, but its values climb to about 10^12, above 2^31, so the values
        themselves need long long.
    negative:
    - inline:
        input: price 0.29 (read as a decimal); print 100 · price in cents
        answer: '29'
        method_gives: '28'
        why: Nothing here is large. The decimal 0.29 is stored in a double as 0.28999…, and times 100
          it gives 28.999999999999996, which is cut to 28. The trap is rounding, so the exact way is to
          read the digits as the integer 29.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
    - problem: ac-abc048_b
      why: The values reach 10^18 and long long is needed, but the part that goes wrong is the count below
        a when a = 0 (an empty range), where truncating division gives 0 instead of the floor of −1/x.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
  lookalikes:
  - description: Multiply a large integer by a decimal with two digits and print the integer part
    tool:
      topic: '0.1'
      card: integer-rounding
    flipping_difference: The product fits in 64 bits, so size is not the danger; the decimal's floating-point
      error is. Reading it as an integer number of hundredths removes the error.
  complexity: 'No extra cost: long long arithmetic is as fast as int for these purposes.'
- id: multi-test
  name: Many test cases in one input
  decisive_property: The statement bounds the sum of the sizes over all test cases, so the work per test
    must depend only on that test's size; anything sized by the maximum (clearing a global array) multiplies
    by the number of tests.
  from_theorem: 0.1.3
  how_to_test: Find the line that bounds the sum of n over all tests. Then check that every loop and every
    allocation inside a test is sized by that test's n, and that nothing carries over from the previous
    test.
  constraint_shapes:
  - 't up to 10^4 and the sum of n at most 2·10^5: per-test work proportional to n costs 2·10^5 steps
    in all, but clearing an array of 2·10^5 entries in every test costs 10^4 · 2·10^5 = 2·10^9 steps,
    far over the 10^8 per second a judge allows.'
  weak_signals:
  - form: The first line of the input is a count t of test cases
    shape: t up to 10^4 or 10^5, with a sentence that bounds the sum of n over all tests
  - form: Asks the same question about many independent small instances
    shape: Each instance is a short array or string, and the instances do not refer to each other
  kill_signals:
  - 'There is one test: then the cost of one test is the whole cost, and there is nothing to reset.'
  - 'The "tests" share data, such as operations on one growing array: for the operations add 5, add 3,
    add 2 and the question "print the total", resetting after each operation prints 5, 3, 2 instead of
    5, 8, 10.'
  in_action:
    statement: There are t tests. In each, n numbers are given; print how many of them are above the average
      of that test.
    constraints: t ≤ 10^4, the sum of n over all tests ≤ 2·10^5, values up to 10^9.
    budget: If each test costs time proportional to its own n, all tests cost 2·10^5 steps. If each test
      clears a global array of 2·10^5 entries, all tests cost 10^4 · 2·10^5 = 2·10^9 steps, about 20 seconds.
    candidates:
    - tool: A global array of the maximum size, cleared in every test
      verdict: rejected
      because: 2·10^9 steps in the worst case, too slow even though the real data is small.
    - tool: A vector created inside the test loop, sized by that test's n (this topic)
      verdict: chosen
      because: The work for a test depends only on its n, and nothing is left over from the previous test.
    property_check: 'The statement bounds the sum of n, so work proportional to each test''s n adds up
      to the sum (Theorem 0.1.3). The vector, the sum and the counter are all created per test, so condition
      2 of the theorem holds: the work depends only on that test''s size.'
    decision: Per-test vector and variables, declared inside the loop.
  examples:
    positive:
    - inline:
        input: t = 3 tests of sizes 3, 5 and 2; count the steps of a program that loops over each test's
          own array
        answer: '10'
        why: Each test costs its own size, so the total is 3 + 5 + 2 = 10, the sum of the sizes.
    - worked_example: ac-abc284_b
      why: Each test counts the odd numbers among its own N values, with a counter declared inside the
        test loop.
    negative:
    - inline:
        input: 10000 tests of size 20 each (sum 200000), where every test clears a global array of 200000
          entries
        answer: '2000000000'
        method_gives: '200000'
        why: The sum bound would predict 200000 steps, but that holds only when the work is sized by each
          test's n. Clearing the maximum size in every test costs 10^4 · 2·10^5 steps.
      correct_tool:
        topic: '0.1'
        card: multi-test
    - inline:
        input: 'three operations on one shared total: add 5, add 3, add 2; print the total after each'
        answer: 5,8,10
        method_gives: 5,3,2
        why: The "tests" are not independent. A variable declared inside the loop starts from 0 every
          time and prints 5, 3, 2; the total must live outside the loop.
      correct_tool:
        topic: '0.1'
        card: multi-test
  lookalikes:
  - description: Many queries on one array whose values are large, so the totals need more than 32 bits
    tool:
      topic: '0.1'
      card: overflow-64bit
    flipping_difference: There the type of the totals is the decision, not how the tests are organised;
      both can apply, but the first thing to fix is whichever fails on the largest input.
  complexity: 'Sum over tests of the per-test cost: O(total n) when each test is linear in its own n.'
- id: integer-rounding
  name: Exact integer rounding
  decisive_property: All quantities are integers, so floors, ceilings and square roots can be computed
    exactly with integer arithmetic (a / b with a sign correction, (a + b − 1) / b for a ≥ 0, a corrected
    integer square root) instead of floating point.
  from_theorem: 0.1.4
  how_to_test: Look for 'round up', 'at least how many', 'divided by … rounded', a square root, or a percentage.
    Then check the signs of the values (negative values change truncation) and whether values exceed 2^53
    ≈ 9·10^15 (double loses exactness).
  constraint_shapes:
  - 'Values up to 10^18 are above 2^53 ≈ 9·10^15, so a double cannot hold them exactly: the integer 10^18
    − 1 is stored as 10^18, and the square root taken from it is off by one.'
  weak_signals:
  - form: Asks how many groups, boxes or rounds are needed ("at least how many", "rounded up")
    shape: Integer sizes with a division and a remainder, often up to 10^9 or 10^18
  - form: Asks for a floor or ceiling of a quotient that can be negative
    shape: Values with both signs, such as a position relative to a start
  - form: Asks for a square root or a percentage of a large integer
    shape: Integers up to 10^18; the answer is the integer part
  kill_signals:
  - 'The answer is a real number with an allowed absolute or relative error: the average of 1 and 2 is
    1.5, and integer division would print 1.'
  in_action:
    statement: Each of n people needs one seat and a bus holds b people; print how many buses are needed.
    constraints: 1 ≤ n, b ≤ 10^9.
    budget: One division per test, O(1). The risk is the answer, not the time.
    candidates:
    - tool: Floating-point division and ceil
      verdict: rejected
      because: n and b are integers; the quotient is exact in a double only up to 9·10^15, and a result
        such as 7 / 3 = 2.333… is not needed as a real number.
    - tool: Repeat adding b until the total reaches n
      verdict: rejected
      because: Up to 10^9 steps per test.
    - tool: Integer ceiling (a + b − 1) / b (this topic)
      verdict: chosen
      because: O(1) and exact, valid because n ≥ 0.
    property_check: 'All quantities are integers, and n ≥ 0, so Theorem 0.1.4, part 1 applies: (n + b
      − 1) / b is the ceiling. For n = 7 and b = 3 the answer is (7 + 2) / 3 = 3.'
    decision: The integer ceiling (n + b − 1) / b.
  examples:
    positive:
    - inline:
        input: n = 7 people, a bus holds b = 3; print the number of buses
        answer: '3'
        why: 7 / 3 = 2.33…, rounded up gives 3, and (7 + 3 − 1) / 3 = 3; the property holds because 7
          is not negative.
    - worked_example: ac-abc048_b
      why: The count of multiples of x up to v is the floor of v / x plus one, computed exactly on integers
        up to 10^18.
    negative:
    - inline:
        input: ceiling of −6 / 4 (that is −1.5)
        answer: '-1'
        method_gives: '0'
        why: The shortcut (a + b − 1) / b needs a ≥ 0. For a = −6 it computes −3 / 4, which truncates
          to 0, and the ceiling is −1.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
    - inline:
        input: the integer square root of 10^18 − 1
        answer: '999999999'
        method_gives: '1000000000'
        why: Converting 10^18 − 1 to a double already rounds it to 10^18, so the square root of the double
          gives 10^9. The guess must be corrected with integer comparisons.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
  lookalikes:
  - description: Multiply large integers and print the exact product, where the size of the result is
      the trap
    tool:
      topic: '0.1'
      card: overflow-64bit
    flipping_difference: The values fit and nothing needs rounding; the question is which type holds every
      intermediate result.
  complexity: O(1) per division; the integer square root correction moves the guess by at most one or
    two steps.
problems:
- id: cses-1083
  role: ladder
  card: overflow-64bit
  rung: 1
  twist: Base case of the card
  summary: All numbers 1..n except one are given (n ≤ 2·10^5); find the missing one.
  hints:
  - What is 1 + 2 + … + n, and how large can it get?
  - It is n(n + 1)/2 ≈ 2·10^10 for n = 2·10^5, more than an int holds (Theorem 0.1.1).
  - Compute n(n + 1)/2 in long long and subtract the sum of the given numbers (also in long long).
- id: ac-abc162_b
  role: ladder
  card: overflow-64bit
  rung: 2
  twist: 'The sum is of a filtered sequence: only the terms not divisible by 3 or 5.'
  summary: Sum of the numbers 1..N (N ≤ 10^6) that are divisible by neither 3 nor 5.
  hints:
  - How big is the sum of all numbers up to 10^6?
  - 'About 5·10^11: it needs long long even though every term fits in an int.'
  - Loop i from 1 to N, add i when i % 3 != 0 and i % 5 != 0, keeping the total in long long.
- id: ac-abc165_b
  role: ladder
  card: overflow-64bit
  rung: 3
  twist: A loop whose value grows by 1% a year and stops at 10^18, with a floor at every step.
  summary: A balance of 100 grows by 1% a year, rounded down each year; in how many years does it first
    reach X (X ≤ 10^18)?
  hints:
  - How many years can it take, and how big can the balance get just before it stops?
  - 'Under 4000 years, but the balance reaches 10^18, and balance · 101 must not overflow: 10^18 · 101
    is about 10^20.'
  - Keep the balance in long long and update balance += balance / 100 (the same as balance · 101 / 100
    rounded down, without the big product).
- id: ac-abc327_b
  role: ladder
  card: overflow-64bit
  rung: 4
  twist: Powers grow so fast that the loop must stop before computing a power that overflows.
  summary: Given B ≤ 10^18, find A with A^A = B, or −1.
  hints:
  - How large can A be if A^A ≤ 10^18?
  - 15^15 ≈ 4.4·10^17 and 16^16 ≈ 1.8·10^19, so only A ≤ 15 can work; 16^16 itself does not fit.
  - For A = 1..15 compute A^A by repeated multiplication in long long and compare with B.
- id: ac-abc079_b
  role: ladder
  card: overflow-64bit
  rung: 5
  twist: A recurrence whose values grow towards 10^18.
  summary: The N-th Lucas number (L_0 = 2, L_1 = 1, L_i = L_{i−1} + L_{i−2}), N ≤ 86.
  hints:
  - Lucas numbers grow like Fibonacci numbers. Will the 86th fit in an int?
  - 'No: the statement promises it is below 10^18, so long long is needed and enough.'
  - Keep two long long variables for the last two terms and step N times.
- id: cses-1094
  role: ladder
  card: overflow-64bit
  rung: 6
  twist: The answer is a total of many increments, each up to 10^9.
  summary: Fewest +1 moves (n ≤ 2·10^5, x_i ≤ 10^9) to make the array non-decreasing.
  hints:
  - If x_i is smaller than the previous value, how many moves does it need at least?
  - Raise it exactly to the previous value; the total can reach about 2·10^5 · 10^9 = 2·10^14.
  - Scan left to right, keeping the current maximum; add max − x_i when x_i is smaller. Use long long
    for the total.
- id: lc-count-odd-numbers-in-an-interval-range
  role: ladder
  card: integer-rounding
  rung: 1
  twist: Base case of the card
  summary: Count the odd numbers in [low, high] (0 ≤ low ≤ high ≤ 10^9).
  hints:
  - How many odd numbers are there in [0, v]?
  - 'Exactly ⌊(v + 1) / 2⌋: for v ≥ 0 that is plain integer division.'
  - Answer (high + 1) / 2 − low / 2, since the odd numbers below low number ⌊low / 2⌋.
- id: ac-abc176_a
  role: ladder
  card: integer-rounding
  rung: 2
  twist: 'A ceiling: the number of batches is ⌈N / X⌉.'
  summary: A machine makes at most X pieces at a time in T minutes; minutes to make N pieces (all ≤ 1000).
  hints:
  - How many batches are needed for N pieces?
  - ⌈N / X⌉ batches, each taking T minutes.
  - Print (N + X − 1) / X · T, which is safe because all values are positive (Theorem 0.1.4).
- id: ac-abc302_a
  role: ladder
  card: integer-rounding
  rung: 3
  twist: The same ceiling with values up to 10^18, so the shortcut must be checked for overflow.
  summary: Stamina A drops by B per attack (A, B ≤ 10^18); fewest attacks to reach 0 or less.
  hints:
  - The answer is ⌈A / B⌉. Is (A + B − 1) / B safe here?
  - A + B − 1 can reach 2·10^18, still below 9.2·10^18, so it fits a long long.
  - 'Read A and B as long long and print (A + B − 1) / B. Do not use floating point: 10^18 / 3 is not
    exact in a double.'
- id: ac-abc273_b
  role: ladder
  card: integer-rounding
  rung: 4
  twist: Rounding to the nearest multiple of 10^i, repeated K times, with halves rounded up.
  summary: Round X (X < 10^15) to the nearest multiple of 10, then of 100, …, up to 10^K, in turn; print
    the result.
  hints:
  - For a power p = 10^i, how do you round X to the nearest multiple of p with integers only?
  - 'The remainder r = X % p decides: if 2r ≥ p round up (X − r + p), else down (X − r).'
  - Loop i = 1..K with p in long long (10^15 fits); apply the rule each time.
- id: ac-abc334_b
  role: ladder
  card: integer-rounding
  rung: 5
  twist: 'Floor division of possibly negative values: positions are A + kM with A, L, R down to −10^18.'
  summary: Trees stand at A + kM for every integer k; count those in [L, R] (coordinates up to ±10^18,
    M ≤ 10^9).
  hints:
  - Shift everything by A. Which k satisfy L ≤ A + kM ≤ R?
  - k from ⌈(L − A) / M⌉ to ⌊(R − A) / M⌋, and L − A can be negative, so C++ / is not the floor.
  - 'Use floorDiv from Section 6: answer ⌊(R − A) / M⌋ − ⌈(L − A) / M⌉ + 1. The differences stay within
    ±2·10^18.'
- id: cf-1A
  role: ladder
  card: integer-rounding
  rung: 6
  twist: 'Two ceilings multiplied: the product can pass the int range.'
  summary: Cover an n by m rectangle with a by a tiles (n, m, a ≤ 10^9); fewest tiles.
  hints:
  - How many tiles does one side of length n need?
  - ⌈n / a⌉ along one side and ⌈m / a⌉ along the other.
  - 'Multiply the two ceilings in long long: each can be 10^9, so the product reaches 10^18.'
- id: cf-1742A
  role: ladder
  card: multi-test
  rung: 1
  twist: Base case of the card
  summary: 'For each of t tests, three numbers: is one of them the sum of the other two?'
  hints:
  - What does one test need, and what must be read t times?
  - Read t, then loop t times; each test reads its own three numbers and prints YES or NO.
  - Check a == b + c, b == a + c, or c == a + b.
- id: cf-1703A
  role: ladder
  card: multi-test
  rung: 2
  twist: Each test is a short string compared without regard to letter case.
  summary: 'For each of t tests, a 3-letter string: is it "yes" in any mix of upper and lower case?'
  hints:
  - How do you compare letters ignoring case?
  - Convert every letter to lower case (tolower) and compare with "yes".
  - Loop over the t tests, reading one string each.
- id: cf-1283A
  role: ladder
  card: multi-test
  rung: 3
  twist: Each test is a small time calculation.
  summary: For each of t tests, a time h:m (not midnight); minutes until the next midnight.
  hints:
  - How many minutes are there in a day?
  - 1440; the current time is 60h + m minutes after midnight.
  - Print 1440 − (60h + m) for each test.
- id: cf-1335A
  role: ladder
  card: multi-test
  rung: 4
  twist: Each test is a counting formula with n up to 2·10^9.
  summary: 'For each of t tests: in how many ways can n candies be split as a > b > 0 with a + b = n?'
  hints:
  - For a given b, what is a, and when is a > b?
  - a = n − b and a > b means b < n / 2, so b runs from 1 to ⌊(n − 1) / 2⌋.
  - Print (n − 1) / 2 for each test; n up to 2·10^9 needs long long (or unsigned) to be safe when reading.
- id: cses-1068
  role: worked_example
  summary: From n ≤ 10^6, halve when even and replace by 3n + 1 when odd until 1; print every value.
- id: ac-abc284_b
  role: worked_example
  summary: For each of T tests (T, N ≤ 100), count the odd numbers among N given.
- id: ac-abc048_b
  role: worked_example
  summary: Count the integers in [a, b] divisible by x (0 ≤ a ≤ b ≤ 10^18, 1 ≤ x ≤ 10^18).
- id: cf-1328A
  role: drill
  summary: 'For each of t tests: fewest +1 moves to make a divisible by b (a, b ≤ 10^9).'
- id: cf-1409A
  role: drill
  summary: 'For each of t tests: fewest moves of adding or subtracting a number from 1 to 10 to turn a
    into b (a, b ≤ 10^9).'
- id: cf-1791A
  role: drill
  summary: 'For each of t tests, one letter: does it appear in the word "codeforces"?'
- id: cf-1772A
  role: drill
  summary: 'For each of t tests, a string "a+b" with single digits: print the sum.'
- id: cf-2009A
  role: drill
  summary: 'For each of t tests, a ≤ b: the smallest value of (c − a) + (b − c) over integers c in [a,
    b].'
- id: cf-1676A
  role: drill
  summary: 'For each of t tests, a six-digit ticket: is the sum of the first three digits equal to the
    sum of the last three?'
- id: ac-abc220_c
  role: drill
  summary: A sequence A (N ≤ 10^5, A_i ≤ 10^9) is repeated forever; after how many terms does the running
    sum first exceed X (X ≤ 10^18)?
- id: ac-abc281_c
  role: drill
  summary: A playlist of N songs (lengths up to 10^9) repeats forever; which song is playing at time T
    (T ≤ 10^18), and how far into it?
- id: ac-abc169_b
  role: lookalike
  summary: Product of N numbers (N ≤ 10^5, each ≤ 10^18), or −1 if it exceeds 10^18.
- id: ac-abc169_c
  role: lookalike
  summary: A × B with A ≤ 10^15 an integer and B < 10 a number with two decimals; print the product with
    its fraction dropped.
- id: ac-abc239_b
  role: lookalike
  summary: Print ⌊X / 10⌋ for −10^18 ≤ X ≤ 10^18.
- id: ac-abc345_b
  role: lookalike
  summary: Print ⌈X / 10⌉ for −10^18 ≤ X ≤ 10^18.
- id: lc-string-to-integer-atoi
