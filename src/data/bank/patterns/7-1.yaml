# Patterns for topic 7.1 (DP on trees, rerooting). Provisional until the lesson maps them to Recognition Cards.
topic: "7.1"
patterns:
  - id: subtree-dp
    name: Dynamic programming over subtrees
    description: "dp[v][state] from children's values: independent sets, matchings, colourings."
    precondition: A vertex's subtree interacts with the rest of the tree only through the vertex itself.
  - id: rerooting
    name: Answer for every root
    description: Compute a root-dependent value for every root in O(n) by moving the root across each edge.
    precondition: The answer for a child root is obtained from the parent's answer by removing and adding one child's contribution.
  - id: tree-merge
    name: Merging children with sizes
    description: Combine children's tables bounded by subtree sizes (choose k vertices in a subtree), total O(n^2).
    precondition: Merging tables of sizes a and b costs a · b, and the sum over all merges is O(n^2).
  - id: through-vertex
    name: Best path through a vertex
    description: Longest or best-scoring path where each vertex combines the two best downward paths of its children.
    precondition: Every path has a unique highest vertex, where it joins at most two downward paths.
