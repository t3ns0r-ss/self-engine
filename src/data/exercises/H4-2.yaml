    key: stale_read_probability_w1r1_one_lagging
    unit: probability
    factor: 2
  hints:
  - Write the formula with units first.
  - Check that every quantity is per second or per month, not mixed.
  - Compare your answer with one machine to see whether the setup is worth it.
  alternatives: []
