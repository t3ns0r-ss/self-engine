drill:
- problem: lc-perfect-squares
  answer:
    topic: '3.3'
    card: unbounded
  property: 'Each square may be used any number of times and the total is small: fewest[x] = 1 + min over
    squares q ≤ x of fewest[x − q], with the upward loop.'
  why_others_fail: 'Greedy "largest square first" fails: 12 = 9 + 1 + 1 + 1 (4) but 4 + 4 + 4 (3).'
- problem: lc-combination-sum-iv
  answer:
    topic: '3.3'
    card: unbounded
  property: Unlimited copies with a small total, and here 1 + 2 and 2 + 1 are different, so the amount
    loop is outside and every number is tried as the last one (Theorem 3.3.3, note 2).
  why_others_fail: With the items outside, the table counts multisets and misses the orders; listing the
    sequences (3.1) is exponential.
- problem: cses-1634
  answer:
    topic: '3.3'
    card: unbounded
  property: 'Unlimited copies and a total up to 10^6: the coin table over amounts, upward loop, with −1
    for unreachable totals.'
  why_others_fail: Greedy by the largest coin fails for coins such as {1, 3, 4} and x = 6 (4 + 1 + 1 against
    3 + 3).
- problem: cses-1745
  answer:
    topic: '3.3'
    card: subset-sums
  property: 'Each coin is used at most once and all sums are at most 10^5: the reachable-sums row (or
    a bitset) built downwards gives every sum.'
  why_others_fail: Bitmasks over 2^100 subsets are impossible; the unbounded upward loop would reuse coins.
- problem: ac-abc240_c
  answer:
    topic: '3.3'
    card: subset-sums
  property: 'Every jump contributes exactly one of two values and the totals are at most 10^4: the set
    of reachable totals after i jumps, updated from the previous set, decides it.'
  why_others_fail: Trying all 2^100 choices is impossible; a greedy choice per jump cannot see whether
    X stays reachable.
- problem: lc-ways-to-express-an-integer-as-sum-of-powers
  answer:
    topic: '3.3'
    card: subset-sums
  property: 'The candidates k^x ≤ n are each used at most once and n is small: count subsets by their
    sum with the downward loop.'
  why_others_fail: The upward loop would allow 1^x + 1^x, a repeated integer; listing the sets (3.1) is
    possible but slower and gives no count modulo a prime directly.
- problem: ac-abc289_d
  answer:
    topic: '3.2'
    card: linear-state
  property: 'Whether step x can be reached depends only on x: ok[x] = not a trap and ok[x − A_i] for some
    i, filled upwards. No capacity or value, just reachability of positions.'
  why_others_fail: Thinking of the moves as coins with a total X works too, but the traps make it a plain
    table over positions, the one-index state of 3.2.
- problem: ac-abc118_d
  answer:
    topic: '3.2'
    card: reconstruct
  property: best[n] = the most digits using exactly n sticks; the answer has best[N] digits and is rebuilt
    greedily from the front, taking the largest digit that keeps best[remaining] = best[current] − 1 (Theorem
    3.2.6).
  why_others_fail: A knapsack value table cannot compare whole numbers as values; the length table plus
    the greedy walk is what decides the largest number.
- problem: lc-maximum-ice-cream-bars
  answer:
    topic: '1.5'
    card: extreme-first
  property: 'Every bar counts the same, so the cheapest bars first is optimal: replacing a bought bar
    by a cheaper unbought one never hurts.'
  why_others_fail: A 0/1 knapsack over 10^8 coins is far too large, and it is not needed when all values
    are equal.
- problem: lc-closest-dessert-cost
  answer:
    topic: '0.5'
    card: recursive-choices
  property: With m ≤ 10 toppings and 3 choices each, there are 3^10 ≈ 6·10^4 combinations per base, few
    enough to try all by recursion.
  why_others_fail: A bounded knapsack table also works, but trying every combination is simpler and fast
    enough.
lookalike_pairs:
- a: ac-dp_d
  b: ac-dp_e
  a_tool:
    topic: '3.3'
    card: zero-one
  b_tool:
    topic: '3.3'
    card: zero-one
  flipping_difference: The same 0/1 knapsack; only the bounds differ. In A the capacity is small, so it
    indexes the table. In B the capacity is 10^9 but the values add up to at most 10^5, so the roles swap
    (Theorem 3.3.2).
  shared_surface: Both are 0/1 knapsacks with n up to 100.
  flipping_input: 'A: the capacity is 10^5 and the values are up to 10^9, so the table is indexed by capacity.
    B: the capacity is 10^9 and the values add up to at most 10^5, so the table is indexed by value, with
    the smallest weight for each total value.'
- a: cses-1635
  b: cses-1636
  a_tool:
    topic: '3.3'
    card: unbounded
  b_tool:
    topic: '3.3'
    card: unbounded
  flipping_difference: Both count ways to pay x with unlimited coins. A counts 2 + 3 and 3 + 2 separately,
    so each amount is split by its last coin (amounts outside). B counts each collection once, so the
    coins are added in a fixed order (coins outside).
  shared_surface: Both count the ways to pay an amount with unlimited coins.
  flipping_input: 'A: with the coins 1 and 2 and the amount 3, the ordered sequences 111, 12, 21 are 3,
    with the amount loop outside. B: the multisets {1, 1, 1} and {1, 2} are 2, with the coin loop outside.'
self_test:
- q: Items (weight, value) (2, 3), (3, 4), (4, 5) and capacity 5. Fill the one-row table after each item.
    What goes wrong if the loop runs upwards?
  a: 'After (2, 3): 0 0 3 3 3 3. After (3, 4): 0 0 3 4 4 7. After (4, 5): 0 0 3 4 5 7; the answer is 7.
    Upwards, the first item alone gives best[4] = 6 by taking it twice.'
- q: Coins {1, 2} and amount 4. How many ways if order matters, and how many if it does not? Which loop
    is outside in each case?
  a: 'Ordered: 5 (1111, 112, 121, 211, 22), amounts outside. Unordered: 3 ({1, 1, 1, 1}, {1, 1, 2}, {2,
    2}), coins outside.'
- q: 100 items with weights up to 10^9, values up to 100, capacity 10^9. Which table do you build, and
    how big is it?
  a: 'Index by value (Theorem 3.3.2): the values add up to at most 10^4, so 100 × 10^4 = 10^6 steps; a
    capacity table would need 10^9 columns.'
- q: Why does the bitset update reach |= reach << a use the number a only once, although it is a single
    operation?
  a: The shift is computed from the old bitset before the or, so every new sum is an old sum plus a, never
    an already-new sum plus a again (Theorem 3.3.4).
- q: Split 13 copies into bundles. Which counts can be made, and how do you make 11?
  a: 'Bundles 1, 2, 4 and the remainder 6 (13 − 7). Every count 0..13 can be made; 11 = 1 + 4 + 6 (Theorem
    3.3.5: 11 − 6 = 5 = 1 + 4).'
- q: Give a case where "best value per unit of weight first" fails for the 0/1 knapsack but works when
    items can be cut.
  a: 'Capacity 10, items (6, 60), (5, 45), (5, 45): the ratio greedy takes 60 and then nothing fits, while
    45 + 45 = 90. With divisible goods it takes all of the first item and 4/5 of the second, 96, which
    is optimal.'
checkpoint:
  time_limit_minutes: 120
  problems:
  - ac-abc153_e
  - cf-577B
  - cf-1516C
decision_map:
- weak_signal: '"The fewest items to reach a total", "the largest total with at most k items", goods that
    can be split'
  choose: zero-one
  when: Items are whole (taken or not) with different weights and values, and the capacity or the total
    value is small enough to index (Theorem 3.3.1).
  over:
  - card: extreme-first
    because: Taking the best ratio first is optimal only for divisible goods or equal values; for whole
      items it can leave capacity unused.
    topic: '1.5'
- weak_signal: Choose items with a cost and a gain under a budget; n up to 100–1000, budget up to 10^5
  choose: zero-one
  when: Each item is used at most once and only the total cost links the items (Theorem 3.3.1); if the
    budget is huge but values are small, index by value (Theorem 3.3.2).
  over:
  - card: meet-in-middle
    because: With n ≤ 40 and huge weights and values, meet in the middle is the tool; it does not scale
      to n = 100.
    topic: '3.1'
  - card: subset-bitmask
    because: 2^n subsets are only possible for n ≤ 20.
    topic: '0.5'
- weak_signal: Coins of given values with unlimited supply; fewest coins or number of ways to pay
  choose: unbounded
  when: 'Copies are unlimited and the amount is small: upward loop; coins outside for multisets, amounts
    outside for sequences (Theorem 3.3.3).'
  over:
  - card: extreme-first
    because: The largest coin first is optimal only for special coin systems; for arbitrary values it
      fails (coins 1, 3, 4 and amount 6).
    topic: '1.5'
  - card: linear-state
    because: Counting ordered sequences of steps is the 3.2 table over the total; for unordered collections
      the coin loop must be outside.
    topic: '3.2'
- weak_signal: Small n (≤ 20) and "choose some of the items"
  choose: subset-sums
  when: Only reachability or a count by sum is asked and the sums are small, so n can be in the hundreds
    or thousands (Theorem 3.3.4).
  over:
  - card: subset-bitmask
    because: Bitmasks are fine for n ≤ 20 whatever the values; with larger n and small sums the table
      is needed.
    topic: '0.5'
- weak_signal: n up to 40 (30–45); choose a subset or signs to hit, approach or stay under a target
  choose: subset-sums
  when: The values are small (sums up to about 10^5–10^7), so the number of different sums is small even
    though 2^n is huge.
  over:
  - card: meet-in-middle
    because: Meet in the middle is for large values with n ≈ 40; with small values the reachable-sums
      row is simpler and handles any n.
    topic: '3.1'
- weak_signal: Each kind of item comes in a limited number of copies
  choose: bounded
  when: Copies of a kind are interchangeable, so bundles 1, 2, 4, … plus a remainder reduce it to the
    0/1 knapsack (Theorem 3.3.5); for counting ways, loop over the number of copies instead.
  over:
  - card: unbounded
    because: The upward loop allows any number of copies and ignores the limit.
