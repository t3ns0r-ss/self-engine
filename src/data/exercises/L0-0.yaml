topic: L0.0
exercises:
- id: rung-1
  role: ladder
  type: change_ladder
  title: A connection that closes itself
  prompt: 'Implement Connection (see kit.hpp). Creating one counts an open in the Log it is given and destroying it counts one close, whichever way the scope ends: the last line, an early return, or an exception. A Connection cannot be copied but can be moved, and a moved-from one closes nothing.'
  card: raii
  rung: 1
  new_force: A class that owns a connection and closes it in its destructor
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.0/ladder/rung-1
  reference: reference/L0.0/ladder/rung-1
  alternatives:
  - 'A plain close() function that the caller calls: simpler to write, skipped by every early return and every throw.'
  hints:
  - Which function of the class always runs when an object goes out of scope, however the scope ends?
  - Count the open in the constructor and the close in the destructor. Two owners of one connection would close it twice, so what should copying do?
  - 'A move must leave the old object with nothing to close: keep a pointer and set the old one to null.'
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: rung-2
  role: ladder
  type: change_ladder
  title: A function that returns a heap object
  prompt: 'Implement make_report(n): it returns a std::unique_ptr<Report> whose total is 1 + 2 + ... + n and which the caller owns. For n below 1 it throws std::invalid_argument and leaves no Report alive.'
  card: raii
  rung: 2
  new_force: A function returns a heap object and the caller must not leak it
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.0/ladder/rung-2
  reference: reference/L0.0/ladder/rung-2
  alternatives:
  - 'Return a raw pointer: shorter, and the caller must remember to delete it on every path.'
  hints:
  - Who destroys the Report when the caller is done with it?
  - std::make_unique<Report>(...) builds the object and puts it straight into the owner. Check n before building anything.
  - 'Return the unique_ptr by value: the caller receives sole ownership.'
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: rung-3
  role: ladder
  type: change_ladder
  title: Two owners really need the same object
  prompt: 'Implement ImageCache::get(name): callers asking for the same name while any of them still holds the image get the same Image. The cache must not keep an image alive on its own; when all holders let go the image is destroyed, and the next get loads a new one.'
  card: ownership-pointer
  rung: 3
  new_force: Two owners really need the same object
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.0/ladder/rung-3
  reference: reference/L0.0/ladder/rung-3
  alternatives:
  - 'The cache holds shared_ptr and keeps every image for the life of the program: simplest, and right when images should live that long.'
  hints:
  - How many owners can an Image have here, and when should it die?
  - Hand out std::shared_ptr<Image>. What can the cache hold so that it can find an image without owning it?
  - std::weak_ptr has a lock() function that returns an owner, or an empty pointer if the image is gone.
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: rung-4
  role: ladder
  type: change_ladder
  title: A function that only reads an object
  prompt: 'Implement name_length(const Image&): it returns the number of characters in the image name, takes no ownership and makes no copy. It must accept a temporary Image and a const Image.'
  card: ownership-pointer
  rung: 4
  new_force: A function only reads an object it does not own
  needs_new_structure: true
  checkers:
  - kind: kit
    path: L0.0/ladder/rung-4
  reference: reference/L0.0/ladder/rung-4
  alternatives:
  - 'Take a std::shared_ptr<Image>: needed only if the function stores the image, and otherwise a count update on every call for nothing.'
  hints:
  - Does the function keep the image after it returns?
  - 'If not, it does not need to own it: a reference is enough. Which kind of reference accepts a temporary?'
  - A const reference can bind to a temporary and promises not to change the object.
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: rung-5
  role: ladder
  type: change_ladder
  title: A small value that is copied freely
  prompt: 'Implement midpoint(Point, Point) for the plain value type Point: each coordinate is the integer average of the two inputs, truncating toward zero. Do not add pointers or smart pointers: Point stays a plain value.'
  card: null
  rung: 5
  new_force: A small value type is copied freely
  needs_new_structure: false
  checkers:
  - kind: kit
    path: L0.0/ladder/rung-5
  reference: reference/L0.0/ladder/rung-5
  alternatives:
  - 'Hold the Point behind a unique_ptr: adds an allocation and an owner to think about for 8 bytes of data.'
  hints:
  - Does Point need an owner?
  - Two ints copy as 8 bytes and nothing else can go wrong. Pass and return Points by value.
  - Integer division of -3 by 2 gives -1 in C++, which is the truncation the tests expect.
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: ex-1
  role: worked_example
  type: recognise
  title: A lock that must be released on every return path
  prompt: A 25-line function takes a lock, then has three return statements and one call that can throw. Decide how to make sure the lock is released every time.
  card: raii
  answer:
    kind: card
    card: &id001
      topic: L0.0
      card: raii
    property: Acquire in a constructor and release in the destructor, so all 4 exits release it.
    why_others_fail: An unlock before each return misses the throw and breaks when a fifth exit is added.
  checkers: []
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: ex-2
  role: worked_example
  type: recognise
  title: A pair of numbers passed to a function 100 times a second
  prompt: A struct of two ints (a point) is passed to a function 100 times a second. Someone suggests wrapping it in a smart pointer so that it is never copied. Decide.
  answer:
    kind: none
    simplest: Pass the small struct by value
    why: Copying 8 bytes costs less than the allocation and the count a smart pointer would add; there is nothing to own.
  checkers: []
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: r-1
  role: drill
  type: recognise
  title: A socket that may throw halfway
  prompt: A function opens a socket, parses a header and may throw halfway. The socket must be closed whatever happens.
  answer:
    kind: card
    card: *id001
    property: Acquire in a constructor and release in the destructor, so the throw and every return release it.
    why_others_fail: A close() at the end is skipped by the throw.
  checkers: []
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: r-2
  role: drill
  type: recognise
  title: One image for three widgets
  prompt: A photo viewer decodes a 40 MB picture once and shows it in three panels; each panel may be closed first, in any order.
  answer:
    kind: card
    card: &id002
      topic: L0.0
      card: ownership-pointer
    property: 'Several owners with no known release order: the last one out destroys the image (shared_ptr).'
    why_others_fail: A unique_ptr per widget would copy 40 MB three times; a raw pointer would dangle when the first widget ends.
  checkers: []
  techniques:
  - L0.0
  checked_on: '2026-10-19'
- id: r-3
  role: drill
  type: recognise
  title: A printing helper
  prompt: A helper prints a record it is given and keeps nothing.
  answer:
    kind: none
    simplest: A const reference parameter
    why: 'The helper owns nothing and keeps nothing: no pointer of any kind is needed.'
  checkers: []
  techniques:
