drill:
- problem: lc-implement-trie-prefix-tree
  answer:
    topic: '6.3'
    card: prefix-tree
  property: startsWith asks about the beginning of stored words; a trie with an end flag answers insert,
    search and startsWith in the length of the word.
  why_others_fail: A set of strings answers search but not startsWith, which would scan all stored words.
- problem: lc-map-sum-pairs
  answer:
    topic: '6.3'
    card: prefix-tree
  property: Every node keeps the sum of the values of the keys below it; an insertion adds the change
    of the key's value along its path, and sum(prefix) reads one node.
  why_others_fail: A map from keys to values would add up all keys with the prefix for every query.
- problem: lc-extra-characters-in-a-string
  answer:
    topic: '6.3'
    card: dictionary-split
  property: 'dp[i] = the fewest leftover letters from the place i: either leave the letter (1 + dp[i +
    1]) or use a dictionary word that begins at i (dp[i + length]); the words at i come from one trie
    walk.'
  why_others_fail: Trying every word at every place costs the number of words per place; with a large
    dictionary the trie walk makes the cost independent of it.
- problem: cf-1879D
  answer:
    topic: '1.7'
    card: per-bit-contribution
  property: 'The XOR of a subarray is two prefix values; each bit is counted on its own: for each bit
    keep the count and the sum of the indices of the prefixes with the digit 0 and with 1, and add 2^bit
    times the sum of distances to prefixes with the other digit.'
  why_others_fail: A trie finds the best partner; here the sum over all pairs separates by bit and no
    tree is needed.
- problem: lc-camelcase-matching
  answer:
    topic: '1.3'
    card: merge-walk
  property: 'A query matches if the pattern is a subsequence of it and every letter of the query not used
    by the pattern is lower case: one two-pointer pass per query.'
  why_others_fail: One query is compared with one pattern; there is no set of strings with shared beginnings.
- problem: lc-top-k-frequent-words
  answer:
    topic: '0.6'
    card: heap-extract
  property: Count the words in a map and take the k best by (count descending, word ascending) with a
    sort or a heap.
  why_others_fail: The order is by count and then by word, not by prefix; a trie would only replace the
    map.
- problem: lc-words-within-two-edits-of-dictionary
  answer:
    topic: '0.5'
    card: nested-loops
  property: With 100 queries, 100 dictionary words and 100 letters, comparing every pair letter by letter
    is 10^6 steps.
  why_others_fail: The sizes are small; no structure on beginnings is needed.
- problem: lc-partition-string
  answer:
    topic: '0.6'
    card: set-membership
  property: Extend the current segment until it is not in the set of segments seen so far, add it, and
    go on; each letter is read once.
  why_others_fail: The segments are tested as whole strings against a set; no question about beginnings
    is asked.
lookalike_pairs:
- a: lc-count-prefix-and-suffix-pairs-ii
  b: lc-count-prefix-and-suffix-pairs-i
  a_tool:
    topic: '6.3'
    card: prefix-tree
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both count the pairs i < j for which words[i] is both a prefix and a suffix of words[j].
  flipping_difference: 'In version I there are at most 50 words of at most 10 letters, so testing every
    pair costs about 1225 · 10 steps. In version II there are up to 10^5 words: encode each word as the
    sequence of pairs (letter k from the front, letter k from the back) and count, in a trie of such pair-keys
    with end counts, the earlier words that are a beginning of the current one.'
  flipping_input: '100 000 words of average length 5: the number of pairs is about 5·10^9, each tested
    in up to 5 steps, while the trie needs about 5·10^5 steps in all.'
- a: lc-maximum-strong-pair-xor-ii
  b: lc-maximum-strong-pair-xor-i
  a_tool:
    topic: '6.3'
    card: binary-xor
  b_tool:
    topic: '0.5'
    card: nested-loops
  shared_surface: Both ask for the largest XOR among pairs (x, y) with |x − y| ≤ min(x, y).
  flipping_difference: 'In version I there are at most 50 numbers, so all pairs (2500) are tested directly.
    In version II there are up to 5·10^4 numbers: sort them, slide a window of numbers that can pair with
    y (those between y / 2 and y) and keep the window in a binary trie with counts.'
  flipping_input: '5·10^4 numbers: all pairs would be 1.25·10^9 tests, while the window and the trie need
    about 5·10^4 · 20 = 10^6 steps.'
self_test:
- q: Build the trie of the words to, tea, ten, i, in. Give pass for every non-root node and say how many
    nodes there are.
  a: 'The nodes are t (pass 3), to (1), te (2), tea (1), ten (1), i (2), in (1): 7 non-root nodes, 8 with
    the root, and at most S + 1 = 2 + 3 + 3 + 1 + 2 + 1 = 12 are possible.'
- q: For the same five words, use Theorem 6.3.2 to find the sum of the longest common prefixes over all
    10 pairs.
  a: 'Add C(pass, 2) over the nodes: t gives 3, te gives 1, i gives 1, the others 0: the sum is 5. Directly:
    to–tea 1, to–ten 1, tea–ten 2, i–in 1, all other pairs 0.'
- q: The dictionary is a, ab, abc and the text is abcab. Which dictionary words begin at place 0, and
    in how many ways can the text be cut?
  a: 'The walk from place 0 passes the end nodes of a (length 1), ab (2) and abc (3). Only one cutting
    exists: abc + ab. Check with the DP: ways[5] = 1, ways[4] = ways[2] = ways[1] = 0 (no word begins
    with b or c), ways[3] = ways[5] = 1 (ab), ways[0] = ways[3] = 1 (abc).'
- q: With 4-bit numbers, the set is 6, 9, 12 and x = 10. Which number does the walk of Theorem 6.3.4 reach,
    and what is the largest XOR?
  a: 6 = 0110, 9 = 1001, 12 = 1100 and x = 1010. The top digit of x is 1; the numbers with top digit 0
    is 6. Go to 6; the other digits cannot change the choice. 10 XOR 6 = 1100 = 12, while 10 XOR 9 = 3
    and 10 XOR 12 = 6.
- q: With the set 1, 2, 3, 4, how many stored y have 6 XOR y < 4?
  a: 'The XORs are 6⊕1 = 7, 6⊕2 = 4, 6⊕3 = 5, 6⊕4 = 2. Only 2 is below 4: one number (y = 4).'
- q: Why must all numbers in a binary trie be written with the same number of digits?
  a: The comparison of two XOR values by the first differing digit works only for strings of the same
    length. Written without leading zeros, 1 would be the digit string 1 and 2 would be 10, and their
    digits would line up at the wrong places. With 3 digits they are 001 and 010.
- q: To count the pairs i < j with a_i XOR a_j < k, the numbers are inserted into the trie as they are
    counted. For the single number 5 and k = 1, what goes wrong if the number is inserted before it is
    counted?
  a: 'Inserted first, the number 5 is counted against itself: 5 XOR 5 = 0 < 1 gives one pair, but there
    are no pairs at all. The number must be counted against the earlier numbers first and inserted afterwards.'
- q: A trie stores n words of total length S over 26 letters. How many nodes can it have at most, and
    how many array entries does the code use at most?
  a: 'At most S + 1 nodes (Theorem 6.3.1 (a)), and 26 entries per node: 26 (S + 1). For S = 10^6 that
    is 26 million entries, about 100 MB of int.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - ac-abc287_e
