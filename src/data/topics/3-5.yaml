drill:
  - problem: lc-minimum-path-sum
    answer_card: grid-paths
    answer_topic: '3.5'
    property: 'Moves go only right or down, so reading order is an acyclic order, and the best path to
      a cell extends the best path to the cell above or to the left: best = value + min of the two.'
    why_others_fail: Greedy "go to the smaller neighbour" can walk into an expensive region; trying all
      paths is C(398, 199).
  - problem: lc-minimum-falling-path-sum
    answer_card: grid-paths
    answer_topic: '3.5'
    property: Each step goes one row down, so rows are an acyclic order; a cell is reached from at most
      three cells of the row above, and the best is the value plus their minimum.
    why_others_fail: Taking the smallest cell of each row ignores the column rule; listing paths is 3^(n
      − 1).
  - problem: lc-count-square-submatrices-with-all-ones
    answer_card: grid-paths
    answer_topic: '3.5'
    property: side[i][j] = 1 + min of the three neighbours up, left and up-left, the largest all-1 square
      ending at (i, j); a cell with side s is the corner of exactly s squares, so the answer is the sum
      of all sides.
    why_others_fail: Checking every square with a 2D prefix sum is O(n³) = 2.7·10^7, fine here but slower;
      the corner table counts them in O(n²).
  - problem: lc-count-vowels-permutation
    answer_card: sequence-counting
    answer_topic: '3.5'
    property: 'Whether the next vowel is allowed depends only on the last vowel: five states, and each
      step adds the counts of the allowed predecessors.'
    why_others_fail: The choices per letter depend on the last letter, so no single product rule gives
      the count; listing is 5^n.
  - problem: lc-knight-dialer
    answer_card: sequence-counting
    answer_topic: '3.5'
    property: 'The next digit depends only on the current one (the knight moves from it): ten states,
      next[d] = sum of cnt over the digits a knight move away.'
    why_others_fail: Different digits have different numbers of moves (5 has none), so the count is not
      a simple power; listing is exponential.
  - problem: ac-abc211_c
    answer_card: sequence-counting
    answer_topic: '3.5'
    property: 'Scanning left to right, a choice so far is described by how many letters of "chokudai"
      have been matched, 0..8: ways[k + 1] += ways[k] when the character equals the (k + 1)-th letter.'
    why_others_fail: An LCS table (3.4) finds one longest match, not the number of ways; trying all 8-subsets
      is far too many.
  - problem: ac-abc248_c
    answer_card: partition-counting
    answer_topic: '3.5'
    property: 'Ordered sums of exactly N parts from 1..M: ways[i][s] = Σ over the last part, with N·K·M
      ≈ 6·10^6 steps; add up ways[N][s] for s ≤ K.'
    why_others_fail: Stars and bars (2.3) handles the lower bound 1 but not the upper bound M without
      inclusion–exclusion; listing is M^N.
  - problem: ac-abc222_d
    answer_card: range-sum-transition
    answer_topic: '3.5'
    property: 'dp[i][v] = Σ dp[i − 1][u] over u ≤ v, a prefix range of the previous row: prefix sums make
      each entry O(1), O(N·3000) in all.'
    why_others_fail: Summing u one by one is 3000³ = 2.7·10^10; a closed formula ignores the per-position
      bounds.
  - problem: lc-path-with-maximum-gold
    answer_card: generate-all
    answer_topic: '3.1'
    property: With at most 25 usable cells, every simple path can be tried by depth-first backtracking
      with a visited mark, starting from each gold cell.
    why_others_fail: Moves in four directions can come back, so there is no filling order and the grid
      table of 3.5 does not apply.
  - problem: lc-kth-smallest-instructions
    answer_card: bijection-paths
    answer_topic: '2.3'
    property: Without obstacles, the paths starting with a given prefix are counted by one binomial coefficient
      (choose where the remaining V moves go), so the answer is built letter by letter, comparing k with
      C(h − 1 + v, v).
    why_others_fail: A path-counting table works too but is not needed; listing all C(30, 15) ≈ 1.55·10^8
      strings is too slow.
  - problem: lc-count-submatrices-with-top-left-element-and-sum-less-than-k
    answer_card: prefix-2d
    answer_topic: '1.2'
    property: Such a submatrix is a prefix rectangle, so its sum is the 2D prefix sum P[i][j]; count the
      cells with P[i][j] ≤ k.
    why_others_fail: 'It looks like a table filled from the top-left, but nothing is counted over paths:
      each rectangle is one cell of the prefix-sum table.'
lookalike_pairs:
  - a: ac-dp_h
    b: ac-dp_y
    a_tool: 'grid-paths (3.5): the table over all H·W cells'
    b_tool: 'bijection-paths (2.3) with a table over the walls: paths to each wall avoiding earlier walls,
      by binomial coefficients'
    flipping_difference: 'The same question. In A the grid has 10^6 cells, so the cell table is fine.
      In B it has 10^10 cells but only 3000 walls: count paths to each wall (sorted) as all paths minus
      those through an earlier wall, each term a binomial coefficient times an earlier count.'
  - a: lc-jump-game-vii
    b: cf-1941E
    a_tool: 'range-sum-transition (3.5): a prefix count of reachable indices in the window'
    b_tool: 'window-deque (1.6): the minimum cost over the window of earlier supports'
    flipping_difference: Both take each position from a sliding window of earlier positions. In A only
      "is any of them reachable" matters, a count, so prefix sums answer it. In B the cheapest earlier
      support is needed, a minimum, which cannot be undone by subtraction; a monotone deque keeps it.
self_test:
  - q: Fill the path counts of a 3 × 3 grid whose centre cell is blocked (right and down moves). What
      is the answer, and how does a binomial coefficient confirm it?
    a: 'Rows 1 1 1 / 1 0 1 / 1 1 2: the answer is 2. Without the block there are C(4, 2) = 6 paths; through
      the centre 2 · 2 = 4; 6 − 4 = 2.'
  - q: Count the strings of length 4 over {a, b} with no two a in a row. Which states do you use, and
      what are the counts?
    a: 'States "ends with a" and "ends with b": (1, 1), (1, 2), (2, 3), (3, 5) for lengths 1 to 4; the
      answer is 3 + 5 = 8.'
  - q: In the run-limit template, why is next[1] = total · (k − 1) and not total · k?
    a: A new run needs a letter different from the last one. With k, repeating the last letter is counted
      both as "run grows" and as "new run", so the state is no longer determined by the string; for n
      = 2, k = 2 it gives 6 instead of 4.
  - q: How many ways are there to write 5 as an ordered sum of 1s and 2s, and as an unordered one? Which
      loop is outside in each case?
    a: 'Ordered: 8 (totals outside). Unordered: 3, namely 1+1+1+1+1, 1+1+1+2, 1+2+2 (parts outside).'
  - q: The previous row is 1, 2, 2, 1 for j = 0..3, and the next person takes 0 to 2 items. Compute the
      next row with prefix sums.
    a: 'Prefix sums 0, 1, 3, 5, 6. new[j] = P[j + 1] − P[max(0, j − 2)]: 1, 3, 5, 5.'
  - q: Modulo p, the count of all objects is 3 and the count of bad objects is 10 (as remainders). What
      does C++ print for (3 − 10) % p, and what is the right answer?
    a: It prints −7. The right answer is (3 − 10 + p) % p = p − 7; the true counts can be in the opposite
      order from their remainders.
  - q: A knight starts in a corner of a 3 × 3 board and makes one random move. What is the probability
      that it stays on the board, and how does the table compute it?
    a: 2 of its 8 moves stay on the board, so 2/8 = 0.25. The table sends 1/8 of the probability of each
      cell to each move that stays on the board and adds up what arrives.
checkpoint:
  time_limit_minutes: 120
  problems:
    - cses-3359
    - ac-abc362_e
    - cf-474D
decision_map:
  - weak_signal: A grid; move right and down (or one row per step); count paths or find the best sum
    choose: grid-paths
    when: Moves never lead back, so reading order fills the cells; count = sum over the cells a move comes
      from, best = min or max over them (Theorem 3.5.1).
    over:
      - card: bijection-paths
        because: Without obstacles the count is one binomial coefficient; the table is needed once cells
          are blocked or values matter.
      - card: generate-all
        because: Backtracking over paths is for small grids where moves can go in all directions and cells
          may not repeat.
  - weak_signal: Count strings or sequences of length n with a local rule, modulo a prime
    choose: sequence-counting
    when: The rule looks only at a small summary of the prefix (last element, run length, remainder, a
      flag) that the prefix determines (Theorem 3.5.2).
    over:
      - card: product-sum-rules
        because: When each position has the same number of choices whatever came before, the count is
          a product; a state table is needed when the choices depend on the past.
      - card: linear-state
        because: 3.2 tables count by a single index; adding the summary of the prefix as a second index
          is the step this card adds.
  - weak_signal: The number of ways to reach a total with given step sizes or parts
    choose: partition-counting
    when: Decide whether order matters (totals outside for ordered sums, parts outside for unordered)
      and handle "at least one" as all minus none (Theorem 3.5.3).
    over:
      - card: unbounded
        because: It is the same counting knapsack; this card adds the order question and the conditions
          on the parts.
      - card: stars-bars
        because: Stars and bars counts sums with any part sizes; limited or special parts need the table.
  - weak_signal: 'Each entry adds up many earlier entries: a share between 0 and a_i, jumps of lengths
      in a range, a neighbour within distance d'
    choose: range-sum-transition
    when: The entries added form a contiguous range of an earlier row, so prefix sums make each entry
      O(1) (Theorem 3.5.4).
    over:
      - card: window-deque
        because: If the transition takes a minimum or maximum over the window, subtraction does not work;
          a deque does.
      - card: range-sum
        because: Prefix sums of a fixed array answer range queries; here the array is the DP row being
          built.
glossary_added: ["monotone path", "acyclic order", "composition", "integer partition", "range transition"]
