theorems:
- id: 7.7.1
  title: A permutation for a pattern string
  plain_words: For an "up" take the smallest number that is still unused, so every number that comes later
    is larger. For a "down" take the largest one, so everything that comes later is smaller. The numbers
    left over always form an unbroken range, so the rule never gets stuck.
  code: 7.7/thm-1
- id: 7.7.2
  title: No two equal neighbours
  plain_words: A letter can stand at most in every second place, so no letter may fill more than half
    of the places (rounded up). If this holds, write the most frequent letter first into the even places,
    then the next one, and so on; after the even places are full, continue with the odd places. A letter
    that has to be split between even and odd places is short enough that its two parts do not touch.
  code: 7.7/thm-2
- id: 7.7.3
  title: Two sets of equal sum
  plain_words: 'If the total is odd, no split into two equal halves exists. If the total is even, take
    the large numbers first and the small numbers last: the large ones eat up most of the half-sum, and
    the small ones, which are fine-grained, fill the gap exactly.'
  code: 7.7/thm-3
- id: 7.7.4
  title: Sorting by swaps
  plain_words: Each swap can fix at most one more cycle, because a swap changes the number of cycles by
    exactly one. The sorted permutation has all $n$ elements in cycles of their own. So at least $n -
    c$ swaps are needed. The simple method that puts the values 1, 2, 3, … in place one by one makes every
    swap split off one fixed point, so it uses exactly that many.
  code: 7.7/thm-4
cards:
- id: permutation-build
  name: Build a permutation by placing values from the ends
  from_theorem: 7.7.1
  decisive_property: The answer is a permutation or an arrangement of 1 … n whose condition involves only
    the order of neighbours, a count that changes by one when one local change is made (the number of
    distinct differences, of inversions, of ups and downs), or a property that a regular zig-zag controls;
    and a given arrangement can be checked in O(n).
  how_to_test: 'Write the checker. For n up to 7 or 8, print every valid answer from a brute force and
    look at their shape: monotone runs, a zig-zag between small and large values, blocks that are reversed.
    State the pattern, build it for all small inputs and compare with the brute force (exists or not),
    and only then test the large case.'
  constraint_shapes:
  - 'n = 10^5 numbers: n! arrangements, against one pass of O(n) placements'
  - 'n = 10^4 and a target count k: n! arrangements, against a zig-zag over k + 1 numbers and the rest
    in order'
  weak_signals:
  - form: Asks to print any permutation (or array of 1 … n) with a stated number of distinct differences,
      ups and downs, or inversions
    shape: n up to 10^5, any valid answer is accepted
  - form: Asks to print a permutation that matches a string of increases and decreases, possibly the smallest
      one
    shape: a string of length up to 10^5
  - form: Asks to print an arrangement where a property of neighbours holds (no neighbours differ by 1,
      differences at least 2)
    shape: n up to 10^5, the answer exists for all n above a small bound
  kill_signals:
  - 'The answer is the number of such arrangements: for n = 7 there are 1596 permutations with exactly
    3 distinct neighbour differences, and one construction shows only one of them (use a search or a DP)'
  - The condition is about non-neighbours, such as no three terms in arithmetic progression, so a zig-zag
    does not control it (that needs a recursive construction, as for the Beautiful Array)
  in_action:
    statement: Given n and m with 0 ≤ m ≤ n(n − 1)/2, print a permutation of 1 … n with exactly m inversions
      (pairs i < j with p_i > p_j).
    constraints: n ≤ 2·10^5.
    budget: There are n! permutations. We want O(n log n) or better.
    candidates:
    - tool: A search over permutations with a count of inversions (topic 0.5)
      verdict: rejected
      because: n! permutations.
    - tool: Random permutations and a check
      verdict: rejected
      because: The chance of exactly m inversions is tiny.
    - tool: Build by steps of one inversion (this topic)
      verdict: chosen
      because: The sorted list has 0 inversions and moving the element at the front back by one place
        adds one inversion, so the count can be raised in steps of one.
    property_check: The count changes by one with a local change and can be checked in O(n log n). The
      property holds.
    decision: 'Choose for each position how many of the later elements are smaller, at most n − i for
      position i, summing to m (give the first positions as much as they can take); then pick the matching
      unused values: O(n log n).'
  examples:
    positive:
    - inline:
        input: Is there a permutation of 1 … 6 with exactly 4 distinct absolute differences between neighbours?
          Answer yes or no.
        answer: 'yes'
        why: 'The zig-zag 1, 5, 2, 4, 3 has the differences 4, 3, 2, 1, and the rest 6 adds the difference
          3: the set is {1, 2, 3, 4} (the idea of Theorem 7.7.1 applied to the ends of 1 … k + 1).'
    - inline:
        input: Is there a permutation of 0 … 4 matching the pattern IDDI (up, down, down, up)?
        answer: 'yes'
        why: 'Theorem 7.7.1: the values 0, 4, 3, 1, 2 (take lo for I and hi for D): 0 < 4 > 3 > ... the
          pattern is matched for every string.'
    - worked_example: lc-beautiful-arrangement-ii
      why: A controlled number of distinct differences is reached by a zig-zag over the first k + 1 numbers
        and the rest in order.
    negative:
    - inline:
        input: How many permutations of 1 … 7 have exactly 3 distinct absolute differences between neighbours?
        answer: '1596'
        method_gives: '1'
        why: A construction shows one valid permutation. A count of all valid ones needs a search over
          the permutations (n = 7 has 5040).
      correct_tool:
        topic: '0.5'
        card: permutations
    - problem: lc-beautiful-arrangement
      why: 'Asks for the number of permutations with a divisibility rule between values and positions
        (n ≤ 15): a count, to be found by a search with pruning or a bitmask DP, not by one construction.'
      correct_tool:
        topic: '3.7'
        card: assignment-mask
  lookalikes:
  - description: A construction that must be the smallest in lexicographic order
    tool:
      topic: '7.7'
      card: permutation-build
    flipping_difference: Any valid answer is built with the two ends; the smallest one needs blocks that
      are reversed from the sorted list.
  - description: A requirement on the exact number of arrangements
    tool:
      topic: '0.5'
      card: permutations
    flipping_difference: 'A count cannot be answered by one example: it needs a search, or a DP over the
      unused values.'
  complexity: O(n) or O(n log n) time to build; O(n) to check.
- id: simple-pattern
  name: A regular arrangement works when a counting condition holds
  from_theorem: 7.7.2
  decisive_property: The requirement involves only neighbours or pairs (no two equal neighbours, rows
    and columns of a fixed kind), a regular arrangement (sorted, interleaved, written into every second
    place, shifted by a fixed step) meets it, and whether it exists depends on a simple count such as
    the largest multiplicity.
  how_to_test: State the necessary count condition (the most frequent item at most ⌈n/2⌉ times, a row
    sum equal to a column sum). Try the regular arrangement on all small cases by a program that also
    does the exhaustive search, and compare the answers "exists or not". Check the boundary cases n =
    1, n = 2 and the cases where the count is exactly at the limit.
  constraint_shapes:
  - 'n = 2·10^5 items: n! arrangements, against sorting and one pass of writing into positions 0, 2, 4,
    … then 1, 3, 5, …'
  - 'a grid of 1000 × 1000 cells: 10^6 cells, against one fill by formulas for the cell (i, j)'
  weak_signals:
  - form: Asks to rearrange a sequence so that no two equal (or too close) items stand next to each other,
      or to report that it is impossible
    shape: n up to 2·10^5, a count of each value
  - form: Asks to fill a grid so that every row and every column has a given sum, xor or number of ones
    shape: n up to 1000, a formula in i and j is expected
  - form: Asks for the answer to exist for all large n and to print one such object
    shape: a bound like n ≥ 4 below which it fails
  kill_signals:
  - 'The requirement reaches beyond neighbours: for the letters aabb, no two equal letters at distance
    1 or 2 is impossible, yet the count rule (largest count at most 2) says yes'
  - 'The question asks for a number, not an arrangement: the least time to run tasks with a cool-down
    is computed from the largest count and the number of tasks with that count'
  in_action:
    statement: n students belong to teams; seat them in a row so that no two students of the same team
      sit next to each other, or say that it is impossible.
    constraints: n ≤ 2·10^5, up to n teams.
    budget: n! seatings; we want O(n log n).
    candidates:
    - tool: A search over seatings (topic 0.5)
      verdict: rejected
      because: n! seatings.
    - tool: A greedy that seats the next student from a different team than the last (topic 1.5)
      verdict: rejected
      because: 'It can get stuck: seating the small teams first leaves two students of the big team together
        at the end.'
    - tool: Sort by team size and write into every second seat (this topic)
      verdict: chosen
      because: The condition on the largest team is both necessary and sufficient (Theorem 7.7.2).
    property_check: The requirement is only about neighbours and the feasibility is the count of the largest
      team at most ⌈n/2⌉. The property holds.
    decision: 'Order the students by decreasing team size (a team together), write them into the seats
      0, 2, 4, … and then 1, 3, 5, …: O(n log n).'
  examples:
    positive:
    - inline:
        input: Can the letters of aabbc be arranged with no two equal letters next to each other? Answer
          yes or no.
        answer: 'yes'
        why: The most frequent letter occurs twice, at most ⌈5/2⌉ = 3. Theorem 7.7.2 gives a b a b c.
    - inline:
        input: Can the letters of aaaabbc be arranged with no two equal letters next to each other? Answer
          yes or no.
        answer: 'yes'
        why: 'The letter a occurs 4 times, exactly ⌈7/2⌉ = 4, the limit: a b a b a c a.'
    negative:
    - inline:
        input: Can the letters of aabb be arranged so that no two equal letters are at a distance of 1
          or 2?
        answer: 'no'
        method_gives: 'yes'
        why: The count rule of Theorem 7.7.2 is only for neighbours. With the distance 2 included, each
          letter would need three free places after itself, and four places are not enough.
      correct_tool:
        topic: '7.4'
        card: extract-and-replace
    - problem: lc-task-scheduler
      why: Asks for the least time to run tasks with a cool-down, a number computed from the largest count
        and the number of tasks that have it; no arrangement is printed.
      correct_tool:
        topic: '1.5'
        card: extreme-first
  lookalikes:
  - description: A rule on neighbours that holds for the sorted order, plus an exact number of distinct
      values
    tool:
      topic: '7.7'
      card: permutation-build
    flipping_difference: When the requirement is a count of distinct differences or a pattern of ups and
      downs, the arrangement is built from the two ends, not by interleaving.
  - description: A requirement that depends on a chain of choices (a heap with a cool-down)
    tool:
      topic: '7.4'
      card: extract-and-replace
    flipping_difference: When items must be at least d places apart, the greedy that takes the most frequent
      available item each time (with a heap) is the tool.
  complexity: O(n log n) for the sort (O(n) with counting); O(n) to write and to check.
- id: invariant-then-build
  name: Find the necessary condition, then build an answer when it holds
  from_theorem: 7.7.3
  decisive_property: There is a simple quantity that every valid answer must have right (a parity, a sum,
    a count, a symmetry); and a construction shows that whenever the quantity is right, an answer exists.
    The two together decide existence and give the answer.
  how_to_test: 'Find the conditions by asking what every valid answer has in common: print all valid answers
    for small inputs and look for a quantity they share (a sum, a symmetric string, a count of a kind).
    Write the conditions as a function and check "conditions hold" against "an answer exists" for all
    small inputs. If they differ in one direction, the condition is not sufficient and needs another clause
    or a different method.'
  constraint_shapes:
  - 'n = 10^5 vertices: n^(n−2) trees, against the check of three conditions and a construction in O(n)'
  - 'a board of 1000 × 1000: the broken-profile DP is 2^1000, against the area parity and a fill by rows
    in O(nm)'
  weak_signals:
  - form: Asks to decide whether an object exists and to print one if it does
    shape: n up to 10^5, a yes/no and an object
  - form: Asks about a split into parts with equal sums, equal counts or a given parity
    shape: the numbers 1 … n, or a string of conditions
  - form: Asks for a tree, a string or a matrix whose summaries (sizes, sums) are prescribed
    shape: a prescribed set of sizes of length up to 10^5
  kill_signals:
  - 'The condition is necessary but not sufficient: 1 … 3 cannot be split into three sets of equal sum
    although the total 6 is divisible by 3 (the number 3 is larger than the target 2)'
  - 'The numbers are arbitrary, not 1 … n: for 1, 2, 5 the total 8 is even, yet no set has the sum 4 (a
    subset-sum problem)'
  in_action:
    statement: An n × m board (n, m ≤ 1000). Tile it with 1 × 2 dominoes, or print that it is impossible.
    constraints: n, m ≤ 1000.
    budget: A DP over the broken profile has 2^m states, impossible for m = 1000. We want O(nm).
    candidates:
    - tool: A backtracking over placements (topic 3.1)
      verdict: rejected
      because: 2^(nm) placements, with pruning still far too many.
    - tool: A broken-profile DP (topic 3.7)
      verdict: rejected
      because: 2^m states for m = 1000.
    - tool: The area parity as the condition, then a fill by rows or columns (this topic)
      verdict: chosen
      because: Each domino covers two cells, so the area must be even; if it is, pairs of rows or columns
        can be filled.
    property_check: A simple necessary condition (the area is even) which the construction shows to be
      sufficient. The property holds.
    decision: 'If n·m is odd print "impossible"; if n is even, put vertical dominoes in each pair of rows
      (rows 2i and 2i + 1); otherwise m is even and pair the columns: O(nm).'
  examples:
    positive:
    - inline:
        input: Can the numbers 1 … 8 be split into two sets with equal sums? Answer yes or no.
        answer: 'yes'
        why: The total 36 is even; the greedy of Theorem 7.7.3 takes 8, 7 and 3 (sum 18) and the rest
          has the sum 18.
    - inline:
        input: Can the numbers 1 … 6 be split into two sets with equal sums? Answer yes or no.
        answer: 'no'
        why: The total 21 is odd, so no split exists (Theorem 7.7.3, step 1).
    - worked_example: ac-arc103_c
      why: Three necessary conditions on the string of sizes, and a tree built for every string that meets
        them.
    negative:
    - inline:
        input: Can the numbers 1 … 3 be split into three sets with equal sums? Answer yes or no.
        answer: 'no'
        method_gives: 'yes'
        why: The total 6 is divisible by 3, so the divisibility condition holds, but the target is 2 and
          the number 3 does not fit in any set. The condition is necessary and not sufficient.
      correct_tool:
        topic: '3.7'
        card: group-mask
    - inline:
        input: Can the numbers 1, 2, 5 be split into two sets with equal sums? Answer yes or no.
        answer: 'no'
        method_gives: 'yes'
        why: The total 8 is even, so the parity condition holds, but no set has the sum 4. For arbitrary
          numbers the question is a subset-sum problem.
      correct_tool:
        topic: '3.3'
        card: subset-sums
  lookalikes:
  - description: The conditions are known and an arrangement with a regular pattern is built
    tool:
      topic: '7.7'
      card: simple-pattern
    flipping_difference: When the count condition is also the only obstacle and a regular fill meets it,
      the pattern card applies; the invariant card is for a more varied set of conditions.
  - description: A split of given numbers into parts of equal sum
    tool:
      topic: '3.3'
      card: subset-sums
    flipping_difference: For arbitrary numbers the parity is not enough; a subset-sum DP decides.
  complexity: O(n) for the check and the construction (O(n log n) with sorting).
- id: operation-sequence
  name: A list of operations within a limit, each putting one more element in place
  from_theorem: 7.7.4
  decisive_property: The answer is a list of allowed operations that brings a start state to a target;
    a potential (the number of elements in place, the number of cycles, the number of changes between
    neighbours) improves by at least one with a suitable operation, and the limit on the list follows
    from the range of the potential.
  how_to_test: 'Name the potential. Show an operation that improves it by one and never worsens what is
    already done. Count: the range of the potential gives the length of the list. Write a checker that
    applies the list to the start state; test on all small states. If the shortest list is asked, the
    construction must also be shown optimal (as with n − c swaps); otherwise the limit in the statement
    is what to meet.'
  constraint_shapes:
  - 'n = 10^5 elements and a limit of 3n operations: the search over states is n!, against one pass that
    places each element with 2 or 3 operations'
  - 'n = 2000 and a limit of n operations: one operation for each position'
  weak_signals:
  - form: Asks to print a sequence of operations (swaps, reversals, additions on a segment) that turns
      the start into the target, with at most a given number of operations
    shape: n up to 10^5, a limit like n, 2n or 3n
  - form: Asks for the least number of swaps (or flips) to sort a permutation and the swaps themselves
    shape: n up to 10^5
  - form: Asks to make all elements equal or zero by operations that change a prefix, a segment or a pair
    shape: n up to 2·10^5, a limit given in terms of n
  kill_signals:
  - 'The shortest sequence is asked and the move set is awkward: the least number of prefix reversals
    for [3, 2, 4, 1] is 3, but the method that fixes two flips per value uses 5 (for small n a breadth-first
    search finds the least)'
  - 'Only neighbouring elements may be swapped: for [3, 2, 1] the least number is 3 (the inversions),
    not n − c = 1'
  in_action:
    statement: A binary string of length n. One operation flips all the first k characters (0 becomes
      1 and 1 becomes 0) for a chosen k. Make all characters equal using at most n + 1 operations.
    constraints: n ≤ 10^5.
    budget: The states are 2^n; we want O(n).
    candidates:
    - tool: A breadth-first search over strings (topic 4.1)
      verdict: rejected
      because: 2^n states.
    - tool: Fix one character at a time from the left
      verdict: rejected
      because: A flip of a prefix disturbs all the characters already fixed.
    - tool: 'A potential: the number of places where neighbours differ (this topic)'
      verdict: chosen
      because: A flip of the first i characters, where s_i ≠ s_(i+1), makes them equal and lowers the
        potential by one without creating new differences.
    property_check: The potential (adjacent pairs that differ) is at most n − 1, and a flip at a differing
      pair lowers it by exactly one. The property holds.
    decision: 'For i = 1 … n − 1, if s_i ≠ s_(i+1) flip the first i characters; at the end flip all n
      characters if they are ones: at most n operations.'
  examples:
    positive:
    - inline:
        input: What is the least number of swaps of two elements (any positions) that sort the permutation
          2, 3, 1, 5, 4?
        answer: '3'
        why: The cycles are (1 2 3) and (4 5), so n − c = 5 − 2 = 3 (Theorem 7.7.4).
    - inline:
        input: Can the permutation 3, 2, 4, 1 be sorted by at most 5 prefix reversals (pancake flips)?
          Answer yes or no.
        answer: 'yes'
        why: 'For k = 4 down to 2, bring the largest remaining value to the front with one flip and then
          to its place with another: at most 2(n − 1) = 6 flips, and in this case 5 (a search shows 3
          are enough).'
    negative:
    - inline:
        input: What is the least number of prefix reversals (pancake flips) that sort 3, 2, 4, 1?
        answer: '3'
        method_gives: '5'
        why: The two-flips-per-value method gives a valid list of 5 flips but not the shortest. For the
          least number, a breadth-first search over the 24 permutations is the tool.
      correct_tool:
        topic: '4.1'
        card: state-graph
    - inline:
        input: What is the least number of swaps of two NEIGHBOURING elements that sort 3, 2, 1?
        answer: '3'
        method_gives: '1'
        why: 'The formula n − c counts swaps of any two elements: (3, 2, 1) has two cycles and one swap
          of the ends sorts it. With neighbours only, the least number is the number of inversions.'
      correct_tool:
        topic: '5.2'
        card: inversion-count
  lookalikes:
  - description: Only some valid sequence within a limit is asked, not the shortest
    tool:
      topic: '7.7'
      card: operation-sequence
    flipping_difference: With a loose limit (2n, 3n) two or three operations per element are enough; with
      the shortest list the construction must also be proved optimal.
  - description: The least number of moves in a small state space
    tool:
      topic: '4.1'
      card: state-graph
    flipping_difference: When the state space is small (n ≤ 8), a breadth-first search over the states
      gives the least number directly.
  complexity: O(n) or O(n log n) to build the list; the length of the list is bounded by the range of
    the potential.
problems:
- id: lc-beautiful-arrangement-ii
  role: worked_example
  summary: Given n and k < n ≤ 10^4, print a permutation of 1 … n in which the n − 1 absolute differences
    of neighbours have exactly k distinct values.
- id: ac-arc103_c
  role: worked_example
  summary: A string s of n ≤ 10^5 characters 0 and 1; build a tree on n vertices such that s_i = 1 exactly
    when removing some edge leaves a component with i vertices, or print -1.
- id: lc-beautiful-array
  role: ladder
  card: permutation-build
  rung: 1
  twist: 'Base case of the card: a property that survives affine maps, built by splitting into odds and
    evens.'
  summary: Given n ≤ 1000, print a permutation of 1 … n with no index triple i < k < j such that 2·a[k]
    = a[i] + a[j].
  hints:
  - What kind of triple is forbidden? If a[i] and a[j] have different parity, can their average be an
    integer value of the array?
  - 'An odd and an even number have a non-integer average, so putting all odds before all evens kills
    every triple that mixes them (Theorem 7.7.1: build from two groups).'
  - The property survives a map x → 2x − 1 and x → 2x. Build the answer for ⌈n/2⌉ and ⌊n/2⌋ recursively
    and map the odd part by 2x − 1 and the even part by 2x.
- id: cf-1473C
  role: ladder
  card: permutation-build
  rung: 2
  twist: Find the part of the permutation that may change, then reverse it.
  summary: Given k and n with k ≤ n < 2k, a sequence a = 1, 2, …, k − 1, k, k − 1, …, 2k − n; choose a
    permutation p of 1 … k and form b_i = p_(a_i) so that b has no more inversions than a and is the lexicographically
    largest such sequence; print p. †
  hints:
  - Which values appear once in a and which twice? Which ones can change the number of inversions?
  - The first 2k − n − 1 values appear once in a, in increasing order; keep them in place. Only the tail
    p_(2k−n), …, p_k can be reordered without adding inversions.
  - 'Reverse the tail: p = 1, 2, …, 2k − n − 1, k, k − 1, …, 2k − n. A reversed block is the largest order
    that keeps the inversions of the doubled part the same.'
- id: ac-arc140_c
  role: ladder
  card: permutation-build
  rung: 3
  twist: The differences must grow, so the construction starts in the middle and zig-zags outward.
  summary: Given N and X, print a permutation P of 1 … N with P_1 = X that has the longest possible increasing
    subsequence in the sequence |P_(i+1) − P_i|.
  hints:
  - What does a long increasing subsequence of the differences ask of the permutation? What is the best
    possible length?
  - 'If the differences were strictly increasing the answer would be N − 1. Differences grow when the
    values zig-zag out from the middle: m, m + 1, m − 1, m + 2, …'
  - If X is the middle value, start there and zig-zag; otherwise start at X and zig-zag over the remaining
    values from their middle. This gives N − 1 (or N − 2 in the other case). Check by a brute force for
    N ≤ 8.
- id: ac-arc091_c
  role: ladder
  card: permutation-build
  rung: 4
  twist: 'Two lengths are prescribed at once: an increasing and a decreasing subsequence, so the bounds
    decide existence before the blocks are built.'
  summary: Given N, A and B, print a permutation of 1 … N whose longest increasing subsequence has the
    length A and whose longest decreasing subsequence has the length B, or -1.
  hints:
  - An increasing and a decreasing subsequence share at most one element. What does that say about N,
    A and B?
  - 'A permutation with both lengths exists exactly when A + B − 1 ≤ N ≤ A · B (Theorem 7.7.3 pattern:
    a necessary condition that is also sufficient).'
  - Split 1 … N into A blocks, none of size more than B and one of size exactly B, put the blocks in increasing
    order of values and write each block in decreasing order. The LIS is A and the LDS is B.
- id: cf-1368C
  role: ladder
  card: simple-pattern
  rung: 1
  twist: 'Base case of the card: a regular shape whose neighbour counts are controlled by a formula.'
  summary: Given n ≤ 500, print a connected set of at most 5·10^5 cells of the grid such that every cell
    of the set has an even number of neighbours (side by side) inside the set, and exactly n cells have
    exactly 2 neighbours. †
  hints:
  - Draw the smallest example. Which shapes have every neighbour count even?
  - 'A 2 × 2 square: every cell has 2 neighbours. Joining squares along a staircase makes the shared cells
    have the count 4.'
  - 'Grow a diagonal chain: each new step adds the same few cells and exactly one more cell with 2 neighbours.
    Write the counts as a formula in n and check the neighbour counts by a program for n ≤ 20.'
- id: cf-1497C2
  role: ladder
  card: simple-pattern
  rung: 2
  twist: The parts of the sum are chosen so that one value repeats, which makes the lcm easy to bound.
  summary: Given n and k ≤ n, print k positive integers with the sum n whose least common multiple is
    at most n / 2. †
  hints:
  - Put k − 3 of the numbers equal to 1; they do not change the lcm. What is left to split?
  - The remaining three numbers must sum to m = n − (k − 3) with lcm ≤ n / 2. Split into cases by the
    parity of m and by m mod 4.
  - If m is odd use (1, (m − 1)/2, (m − 1)/2); if m is divisible by 4 use (m/2, m/4, m/4); if m = 2 mod
    4 use (2, (m − 2)/2, (m − 2)/2). Each lcm is at most m/2.
- id: lc-reorganize-string
  role: ladder
  card: simple-pattern
  rung: 3
  twist: The condition (the largest count at most ⌈n/2⌉) decides existence, and the sorted fill builds
    the answer.
  summary: Given a string s of lowercase letters (length up to 500), rearrange it so that no two equal
    letters are next to each other, or return an empty string.
  hints:
  - What makes it impossible? Think about the letter that occurs most often.
  - If a letter occurs more than ⌈n/2⌉ times, two copies must touch. Otherwise Theorem 7.7.2 says the
    rearrangement exists.
  - Sort the letters by count, the most frequent first, and write them into the positions 0, 2, 4, … and
    then 1, 3, 5, …. This is the template of this topic.
- id: cf-1360G
  role: ladder
  card: simple-pattern
  rung: 4
  twist: Rows and columns must both have exact counts, and the fill is a cyclic shift.
  summary: Given n, m, a and b, print an n × m matrix of 0 and 1 with exactly a ones in each row and b
    ones in each column, or say that it is impossible. †
  hints:
  - Count the ones two ways, by rows and by columns. What must hold?
  - Rows give n · a and columns give m · b; they must be equal. If they are, the question is how to place
    them evenly.
  - In row i put the ones in the a columns starting at (i · a) mod m, wrapping around. The columns then
    receive the ones in turn, each b times.
- id: cf-1658C
  role: ladder
  card: invariant-then-build
  rung: 1
  twist: 'Base case of the card: a few local conditions on a sequence decide whether a permutation exists.'
  summary: An array c of length n; c_i is the "power" of the i-th cyclic shift of a permutation (the number
    of jumps to the next greater element needed to leave the shift, starting at its first element). Is
    there a permutation with these powers? †
  hints:
  - Write the powers of all cyclic shifts of a few small permutations. What do all the arrays have in
    common?
  - 'Exactly one element equals 1 (the shift that starts at the largest value), and going round the cycle
    the next power is at most the previous one plus 1 (recalled: check it with a brute force).'
  - Check the two conditions in one pass. The conditions are the whole solution; no permutation needs
    to be printed.
- id: cf-1187C
  role: ladder
  card: invariant-then-build
  rung: 2
  twist: The conditions are on segments, and one pass of marked positions builds the array.
  summary: Given n and m facts, each saying that the segment [l, r] is non-decreasing (t = 1) or not non-decreasing
    (t = 0); print an array with these facts or NO. †
  hints:
  - What must be true at the position pairs (i, i + 1) inside a sorted segment?
  - Mark the pairs inside the segments with t = 1 as "no decrease". Every other pair may decrease, and
    a segment with t = 0 needs at least one decreasing pair.
  - Make the marked pairs equal, all the others strictly decreasing; then check that each segment with
    t = 0 contains an unmarked pair. If one does not, print NO.
- id: cf-1365F
  role: ladder
  card: invariant-then-build
  rung: 3
  twist: The multiset of pairs and the middle element are invariant under the operation, and they are
    also enough.
  summary: Two arrays a and b of length n; an operation swaps a prefix of length k with the suffix of
    length k (k ≤ n / 2). Can a be turned into b? †
  hints:
  - What does one operation do to the pairs (a_i, a_(n+1−i))?
  - It keeps every pair together (maybe reversed) and moves the pairs around; for odd n the middle stays
    in place.
  - So the sorted list of unordered pairs {a_i, a_(n+1−i)} and the middle element must be equal for a
    and b; and the conditions are also sufficient, by building b pair by pair from the outside.
- id: cf-1396A
  role: ladder
  card: operation-sequence
  rung: 1
  twist: 'Base case of the card: a fixed list of three operations, whatever the array is.'
  summary: An array of n ≥ 1 integers; in each operation choose a segment of length l and add to each
    of its elements an integer multiple of l (each element its own multiple); make the whole array zero
    in exactly three operations and print them. †
  hints:
  - For n = 1, two operations are easy. What if the segment is of length 1, and what if it is of length
    n − 1?
  - Operation 1 on [1, 1] makes a_1 zero (add −a_1, a multiple of 1). Operation 2 on [2, n] adds n − 1
    times a_i to each element a_i (a multiple of the length n − 1).
  - Operation 3 on [1, n] adds −n · a_i to each element; then each a_i + (n − 1) a_i − n a_i = 0. Special
    case n = 1.
- id: cf-1227C
  role: ladder
  card: operation-sequence
  rung: 2
  twist: Each operation fixes the next position, so n operations are enough.
  summary: A bracket string s of length n (even); in at most n reversals of substrings make it regular,
    with exactly k regular proper prefixes; print the reversals. †
  hints:
  - Decide the target string first. How do you write a regular string with exactly k − 1 pairs of the
    form "()" at the start?
  - 'Target: (k − 1) copies of "()" followed by a nested block ((…)) of the rest.'
  - Go through the positions; at position i, if s_i is not the target character, find the nearest later
    position j with the right character and reverse [i, j]. One reversal per position gives at most n.
- id: lc-pancake-sorting
  role: ladder
  card: operation-sequence
  rung: 3
  twist: Two flips per value bring it to its place, so 2(n − 1) flips suffice.
  summary: Sort an array that is a permutation of 1 … n by flips of a prefix (arr[0 … k − 1] reversed);
    return any list of flips of length at most 10 n.
  hints:
  - Where is the largest value? How can a flip bring it to the front?
  - Flip the prefix that ends at the largest value, so it goes to the front; then flip the whole unsorted
    part, so it goes to the end.
  - 'Repeat for n, n − 1, …, 2. That is at most 2(n − 1) flips (Theorem 7.7.4: each operation puts one
    more element in place).'
- id: cf-1672F1
  role: checkpoint
  card: permutation-build
  summary: Given an array a of length n (Σ n ≤ 2·10^5, values between 1 and n), find a permutation (shuffle)
    b of its elements such that the fewest swaps needed to turn b into a is the largest possible. †
- id: cf-1110E
  role: checkpoint
  card: invariant-then-build
  summary: Arrays c and t of n ≤ 10^5 numbers; an operation replaces c_i by c_(i−1) + c_(i+1) − c_i for
    an inner index i; can c be turned into t? †
- id: cf-1427D
  role: checkpoint
  card: operation-sequence
  summary: A permutation of n ≤ 50 numbers; one operation splits it into k ≥ 2 contiguous blocks and writes
    the blocks in the reverse order; sort it in at most n operations and print them. †
- id: cf-1450C1
  role: review
  card: simple-pattern
  review_set: 1
  summary: A grid of n ≤ 300 with X tokens and empty cells (k tokens); change at most ⌊k / 3⌋ of the X
    into O so that no three equal tokens stand in a row or in a column. †
- id: cf-1349B
  role: review
  card: invariant-then-build
  review_set: 1
  summary: An array of n numbers and a number k; an operation replaces a segment by its median; can all
    become k? †
- id: cf-1416B
  role: review
  card: operation-sequence
  review_set: 1
  summary: An array of n positive numbers, at most 3n operations of "move x · i from a_i to a_j" (i <
    j, x multiple); make all elements equal or say -1. †
- id: cf-1734E
  role: review
  card: simple-pattern
  review_set: 2
  summary: A prime n ≤ 350 and the main diagonal of an n × n matrix; fill it so that for every two cells
    the sums on the two diagonals of the rectangle are different modulo n (rows and columns indexed from
    0). †
- id: cf-1217D
  role: review
  card: invariant-then-build
  review_set: 2
  summary: A directed graph with n ≤ 5000 vertices and m ≤ 5000 edges; colour the edges with the fewest
    colours so that no cycle has all edges of one colour. †
- id: cf-1558C
  role: review
  card: operation-sequence
  review_set: 2
  summary: A permutation of odd length n ≤ 2021; a prefix of odd length can be reversed; sort it in at
    most 5n/2 operations and print them. †
- id: cf-1438C
  role: review
  card: simple-pattern
  review_set: 3
  summary: A grid of n × m numbers (n, m ≤ 100); increase some by 1 so that no two side-adjacent cells
    have equal values. †
- id: cf-1468H
  role: review
  card: invariant-then-build
  review_set: 3
  summary: The numbers 1 … n, a set B of k of them to keep and an odd m; one operation removes m numbers
    whose median is in B; can exactly the numbers of B remain? †
- id: cf-1621D
  role: review
  card: invariant-then-build
  review_set: 3
  summary: A 2n × 2n grid of costs in which one n × n quarter is already free; the answer is the sum of
    the opposite quarter plus the cheapest of a few special cells next to the corners (the statement is
    recalled, read the original). †
- id: lc-di-string-match
  role: lookalike
  card: permutation-build
  summary: A string of I and D of length up to 10^5; print any permutation of 0 … n whose neighbours go
    up for I and down for D. (DI String Match)
- id: lc-construct-smallest-number-from-di-string
  role: lookalike
  card: permutation-build
  summary: A pattern of I and D of length up to 8; the lexicographically smallest number with digits 1
    to 9, each used once, that matches. (Smallest Number from DI String)
- id: lc-next-permutation
  role: lookalike
  card: permutation-build
  summary: Rearrange the array into the next lexicographically larger permutation in place. (Next Permutation)
- id: lc-maximum-swap
  role: lookalike
  card: permutation-build
  summary: A number up to 10^8; swap two of its digits at most once to get the largest number. (Maximum
    Swap)
- id: lc-distant-barcodes
  role: drill
  summary: An array of barcodes with n ≤ 10^4 values; rearrange so that no two equal barcodes are adjacent
    (an answer is guaranteed to exist).
- id: cf-1208C
  role: drill
  summary: Given n divisible by 4, fill an n × n matrix with distinct numbers 0 … n² − 1 so that the xor
    of every row and every column is the same. †
- id: cf-1179B
  role: drill
  summary: Visit every cell of an n × m grid exactly once, starting at (1, 1), so that all the jump vectors
    between consecutive cells are different; print the order. †
- id: cf-1196E
  role: drill
  summary: Given b black and w white cells, build a connected set of cells of a chessboard with exactly
    those numbers of black and white cells, or say -1. †
- id: lc-construct-k-palindrome-strings
  role: drill
  summary: A lowercase string s of length up to 10^5 and a number k; can all characters of s be used to
    build exactly k non-empty palindromes?
- id: lc-max-chunks-to-make-sorted
  role: drill
  summary: A permutation of 0 … n − 1 (n ≤ 10); cut it into the most pieces so that sorting each piece
    alone sorts the whole array.
- id: lc-minimum-number-of-increments-on-subarrays-to-form-a-target-array
  role: drill
  summary: A target array of n ≤ 10^5 positive numbers; one operation adds 1 to a contiguous subarray;
    the fewest operations to build the target from zeros.
- id: lc-minimum-domino-rotations-for-equal-row
  role: drill
  summary: Rows tops and bottoms of n ≤ 2·10^4 dominoes (values 1 to 6); a rotation swaps the two halves
    of one domino; the fewest rotations to make one row all equal, or -1.
drill:
- problem: lc-distant-barcodes
  answer:
    topic: '7.7'
    card: simple-pattern
  property: Sort by count, the most frequent first, and write into the positions 0, 2, 4, … and then 1,
    3, 5, …; the guarantee says the largest count is at most ⌈n/2⌉.
  why_others_fail: A heap that takes the most frequent available value each time also works for n = 10^4,
    but the sorted fill is shorter and needs no heap (topic 7.4).
- problem: cf-1208C
  answer:
    topic: '7.7'
    card: simple-pattern
  property: 'Fill 4 × 4 blocks with the numbers 16b … 16b + 15 so that every row and column of a block
    has the xor 0 (a fixed pattern), then add the offset 16b to the block: xor of each line is 0 as well.'
  why_others_fail: 'There is no search to run: a table of 16 numbers repeated with a block offset is the
    answer.'
- problem: cf-1179B
  answer:
    topic: '7.7'
    card: simple-pattern
  property: Pair the row i with the row n + 1 − i and go along the two rows by alternating cells; the
    jump vectors are all different because the column steps are different.
  why_others_fail: A path search over the cells (topic 3.1) is hopeless for n·m up to 10^6; the regular
    zig-zag is the construction.
- problem: cf-1196E
  answer:
    topic: '7.7'
    card: simple-pattern
  property: Place the larger colour as a path along a line and add the other colour on each cell; the
    larger colour is at most 3 · the smaller + 1, otherwise -1.
  why_others_fail: The count condition decides existence, and a line with side cells builds the set; a
    search over shapes is not needed.
- problem: lc-construct-k-palindrome-strings
  answer:
    topic: '7.7'
    card: invariant-then-build
  property: 'The number of letters with an odd count is at most k, and k is at most the length: both necessary,
    and a construction shows they are sufficient.'
  why_others_fail: 'There is no search or DP: only the counts of the letters matter.'
- problem: lc-max-chunks-to-make-sorted
  answer:
    topic: '1.2'
    card: prefix-extremes
  property: A cut after the index i is possible exactly when the maximum of the prefix is i; count those
    indices in one pass.
  why_others_fail: Nothing is constructed; the answer is a count of prefix maxima that equal the index.
- problem: lc-minimum-number-of-increments-on-subarrays-to-form-a-target-array
  answer:
    topic: '1.2'
    card: difference-array
  property: 'Each rise of the target over its left neighbour needs new operations: the answer is the sum
    of the positive differences, with the first element counted from 0.'
  why_others_fail: The operations are not printed, only counted; the difference array turns the segment
    additions into point changes.
- problem: lc-minimum-domino-rotations-for-equal-row
  answer:
    topic: '0.5'
    card: enumerate-answer
  property: The common value must be tops[0] or bottoms[0]; try both and count the rotations for each.
  why_others_fail: Only two candidate values exist, so enumerating the answer is the whole solution; no
    construction is needed.
lookalike_pairs:
- a: lc-di-string-match
  b: lc-construct-smallest-number-from-di-string
  a_tool:
    topic: '1.3'
    card: opposite-ends
  b_tool:
    topic: '7.7'
    card: permutation-build
  shared_surface: Both ask for a permutation matching a string of I (up) and D (down) between neighbours.
  flipping_difference: 'When any matching permutation is accepted, the low and the high end of the unused
    values are enough: take the low one for I and the high one for D. When the smallest one is asked,
    the sorted order is the start and each block of D is reversed, so the values are not taken from the
    ends.'
  flipping_input: 'The string DI: any answer 1 2 0... but the smallest is 2 1 3; the two-ends method gives
    2 0 1 (valid, not smallest).'
- a: lc-next-permutation
  b: lc-maximum-swap
  a_tool:
    topic: '0.5'
    card: permutations
  b_tool:
    topic: '1.5'
    card: extreme-first
  shared_surface: Both rearrange the digits of an array or a number by a few exchanges to get a larger
    result.
  flipping_difference: 'The next permutation is the lexicographic successor: find the last rise, swap
    with the next larger digit on the right, reverse the tail. The maximum swap allows one exchange and
    wants the largest number: swap the first digit that has a larger digit later with the last occurrence
    of the largest later digit.'
  flipping_input: '1993: the maximum swap gives 9913 (swap 1 with the later 9), while the next permutation
    of 1993 is 3199.'
self_test:
- q: Build the permutation of 0 … 4 for the pattern IDID with the two ends (Theorem 7.7.1).
  a: 'Take lo = 0 and hi = 4: I → 0, D → 4, I → 1, D → 3, last value 2. The permutation 0 4 1 3 2 matches
    IDID.'
- q: Can the letters of aaab be rearranged with no two equal neighbours? Give the bound of Theorem 7.7.2.
  a: 'n = 4, the bound is ⌈4/2⌉ = 2, and a occurs 3 times, so no. For aab the bound is 2 and a occurs
    twice: aba works.'
- q: Can 1 … 5 be split into two sets of equal sum? And 1 … 7? Use the invariant (Theorem 7.7.3).
  a: 'The total 15 is odd, so 1 … 5 cannot. For 1 … 7 the total 28 is even, the target is 14: take 7,
    6 and 1.'
- q: How many swaps sort 2, 3, 1, 5, 4? Name the cycles (Theorem 7.7.4).
  a: The cycles are (1 2 3) and (4 5), two cycles, so n − c = 5 − 2 = 3 swaps.
- q: Give an example where the condition "the largest count is at most ⌈n/2⌉" is not enough, because the
    requirement reaches beyond neighbours.
  a: 'The letters aabb with "no equal letters at distance 1 or 2": the count rule allows it, but the three
    positions after an a already contain the other letters only twice, so it is impossible.'
- q: A construction gives a valid permutation with exactly 3 distinct neighbour differences for n = 7.
    Does that answer "how many such permutations are there"?
  a: No. One construction shows existence; the number of such permutations (1596 for n = 7) needs a search
    or a DP.
- q: The operation limit is 3n and each operation fixes one element. What is the potential, and why does
    the sequence stay within the limit?
  a: The potential is the number of elements already in their place. Each element needs at most 3 operations
    to reach its place without moving the fixed ones, and there are n elements, so at most 3n operations.
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-1672F1
  - cf-1110E
  - cf-1427D
decision_map:
- weak_signal: Print any permutation or array with a stated count of differences, ups and downs, or inversions,
    with n up to 10^5
  choose: permutation-build
  when: Any valid answer is accepted and the count changes by one with a local change; place values from
    the ends or in a zig-zag (Theorem 7.7.1).
  over:
  - card: permutations
    topic: '0.5'
    because: If n is at most 8 and the count of all valid ones is asked, a search over the permutations
      decides.
  - card: assignment-mask
    topic: '3.7'
    because: If the number of valid permutations is asked, a DP over masks counts them.
- weak_signal: Rearrange items so that no two equal (or close) items stand together, or fill a grid so
    that every row and column has a given sum
  choose: simple-pattern
  when: The rule concerns neighbours or pairs, and a sorted-and-interleaved fill meets it as soon as a
    count condition holds (Theorem 7.7.2).
  over:
  - card: extract-and-replace
    topic: '7.4'
    because: If the items must be at least d places apart, a heap that takes the most frequent available
      item is needed.
  - card: exchange-order
    topic: '1.5'
    because: If a best order is asked by a cost, not any valid order, the exchange argument decides.
- weak_signal: Decide whether an object exists and print one, with a split into parts, a parity or a prescribed
    set of sizes
  choose: invariant-then-build
  when: Every answer has a simple quantity right (a sum, a parity, a count) and a construction shows that
    this is also enough (Theorem 7.7.3).
  over:
  - card: subset-sums
    topic: '3.3'
    because: If the numbers are arbitrary, not 1 … n, the split is a subset-sum problem for a DP.
  - card: parity
    topic: '0.4'
    because: If only the yes/no is asked and no object is printed, the parity condition alone may be the
      answer.
- weak_signal: Print a list of operations within a limit like n, 2n or 3n that brings the start to the
    target
  choose: operation-sequence
  when: Each operation puts one more element in place without disturbing those already fixed, and the
    limit follows from the potential (Theorem 7.7.4).
  over:
  - card: state-graph
    topic: '4.1'
    because: If the state space is small and the shortest list is asked, a breadth-first search finds
      it.
  - card: reconstruct
    topic: '3.2'
    because: If the shortest list of a restricted move set is asked, a DP with reconstruction decides.
