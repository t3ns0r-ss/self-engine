- id: lc-minimum-genetic-mutation
  role: drill
  summary: Change one letter at a time to turn an 8-letter gene string over A, C, G, T into another, where
    every string on the way must be in a bank of at most 10 genes; the fewest changes, or −1.
- id: lc-minimum-operations-to-convert-number
  role: drill
  summary: Starting from a number start ≤ 1000, one operation adds, subtracts or XORs one of up to 1000
    given numbers; while 0 ≤ x ≤ 1000 the operations are allowed. The fewest operations to reach goal,
    or −1.
- id: lc-dungeon-game
  role: drill
  summary: A knight walks right or down through an m × n dungeon (m, n ≤ 200) whose rooms add or remove
    health, and must never reach health 0 or less; find the smallest starting health.
- id: cf-340D
  role: drill
  summary: A graph on n ≤ 10^5 vertices has an edge between two values whenever bubble sort swaps them
    while sorting a given permutation; find the size of its largest set of vertices with no edge between
    any two.
- id: lc-count-paths-with-the-given-xor-value
  role: drill
  summary: Count the right/down paths through an m × n grid (m, n ≤ 300, values below 16) whose XOR of
    all visited numbers equals k, modulo 10^9 + 7.
- id: lc-shortest-path-in-binary-matrix
  role: lookalike
  summary: In an n × n grid of 0s and 1s (n ≤ 100), find the length, counted in cells, of the shortest
    path of 0 cells from the top-left to the bottom-right corner, moving to any of the 8 neighbours, or
    −1.
- id: lc-01-matrix
  role: lookalike
  summary: For every cell of a 0/1 matrix with m·n ≤ 10^4 cells and at least one 0, give the number of
    side steps to the nearest 0.
- id: lc-jump-game-iii
  role: lookalike
  summary: From a start index of an array (n ≤ 5·10^4), jump to i + arr[i] or i − arr[i] without leaving
    the array; can you reach an index holding 0?
- id: lc-jump-game-iv
  role: lookalike
  summary: From the first index of an array (n ≤ 5·10^4), move to i + 1, i − 1 or any other index holding
    the same value; the fewest jumps to the last index.
- id: lc-count-the-number-of-complete-components
  role: checkpoint
  card: components
  summary: Given an undirected graph with n ≤ 50 vertices, count the connected components in which every
    pair of vertices is joined by an edge.
- id: ac-abc339_d
  role: checkpoint
  card: state-graph
  summary: On an N × N grid (N ≤ 60) with obstacles, two players start on different cells; each move picks
    one direction and both try to step that way (a player who is blocked stays). Find the fewest moves
    until both stand on the same cell, or −1.
- id: lc-find-the-safest-path-in-a-grid
  role: checkpoint
  card: multi-source
  summary: On an n × n grid (n ≤ 400) with some cells holding thieves, walk from the top-left to the bottom-right
    cell; the safeness of a route is the smallest Manhattan distance from any of its cells to a thief.
