# Patterns for topic 1.6 (Monotonic stack and deque). Provisional until the lesson maps them to Recognition Cards.
topic: "1.6"
patterns:
  - id: nearest-greater
    name: Nearest greater or smaller element
    description: For each element, find the nearest element to its left or right that is greater (or smaller).
    precondition: An element that is dominated by a later and larger one can never be the answer for any position further right.
  - id: min-max-span
    name: Element as minimum of many subarrays
    description: Sum, over all subarrays, of the minimum (or maximum), by counting how many subarrays each element is the minimum of.
    precondition: The subarrays where a[i] is the minimum stretch exactly to the nearest smaller elements on both sides (with ties broken on one side).
  - id: histogram-rectangle
    name: Largest rectangle under bars
    description: Largest rectangle in a histogram, or the largest all-ones sub-rectangle of a grid row by row.
    precondition: The best rectangle whose lowest bar is i spans exactly to the nearest lower bars on both sides.
  - id: window-extreme-deque
    name: Window maximum with a deque
    description: Maximum or minimum of every length-k window in O(n) total with a monotonic deque.
    precondition: An element smaller than a newer element can never again be the maximum of any window that contains both.
  - id: deque-window-condition
    name: Windows constrained by their extremes
    description: Longest window where max − min ≤ k, or other window rules that need the window's extremes, using deques together with a shrinking window.
    precondition: Validity is closed under shrinking, and the window's maximum and minimum must be available in O(1) as both ends move.
