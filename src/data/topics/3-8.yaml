drill:
- problem: lc-rotated-digits
  answer:
    topic: '3.8'
    card: count-up-to-n
  property: 'The property is checked digit by digit with a tiny state: "no invalid digit so far" and "some
    digit changes"; the tight walk counts up to any n.'
  why_others_fail: At n ≤ 10^4 a loop over all numbers also works; the walk is what scales to n = 10^18.
- problem: lc-numbers-at-most-n-given-digit-set
  answer:
    topic: '3.8'
    card: count-up-to-n
  property: 'Shorter numbers are |D|^length each; for n''s own length, walk n''s digits: add (allowed
    digits below n''s digit) · |D|^(remaining), and continue only while n''s digit is allowed.'
  why_others_fail: Listing the numbers is up to 9^9 ≈ 3.9 · 10^8; a single power counts only full lengths
    and ignores the bound n.
- problem: lc-super-palindromes
  answer:
    topic: '0.5'
    card: enumerate-answer
  property: 'Such a number is r² with r < 10^9 a palindrome, and r is fixed by its first half (< 10^5):
    build all r from their halves, square, and test.'
  why_others_fail: A digit walk over x cannot check "x is the square of a palindrome"; the candidates
    are few enough to list.
- problem: lc-sequential-digits
  answer:
    topic: '0.5'
    card: enumerate-answer
  property: There are only 36 such numbers (12, 123, …, 89, …), so list them all and keep those in the
    range.
  why_others_fail: A digit DP counts, but the answer here is a list, and the whole list has 36 entries.
- problem: lc-numbers-with-same-consecutive-differences
  answer:
    topic: '3.1'
    card: generate-all
  property: Each next digit has at most two choices (d + k, d − k), so building the numbers digit by digit
    lists them all in at most 9 · 2^8 steps.
  why_others_fail: There is no upper bound N and the numbers themselves are wanted, so counting with a
    tight walk does not answer it.
- problem: lc-monotone-increasing-digits
  answer:
    topic: '1.5'
    card: left-to-right-forced
  property: 'Find the first place where a digit is larger than the next; lower it by one (moving left
    while that breaks the order) and set the rest to 9: the best number is forced.'
  why_others_fail: Only one number is wanted, not a count, so no digit DP is needed; trying numbers downward
    from n can take up to 10^8 steps.
- problem: cses-2431
  answer:
    topic: '1.4'
    card: answer-search
  property: The number of digits written by 1..x grows with x and is a sum over digit lengths; binary
    search for the number containing position k, then pick the digit.
  why_others_fail: Only the lengths of the numbers matter, not their digits, so a digit DP is not needed.
- problem: lc-reordered-power-of-2
  answer:
    topic: '0.6'
    card: map-counting
  property: Reordering keeps the multiset of digits; compare the digit counts of n with those of the 31
    powers of two below 2^31.
  why_others_fail: Trying all 10! orders is unnecessary; no counting over a range is asked.
lookalike_pairs:
- a: lc-count-special-integers
  b: lc-count-numbers-with-unique-digits
  a_tool:
    topic: '3.8'
    card: count-up-to-n
  b_tool:
    topic: '2.3'
    card: product-sum-rules
  flipping_difference: 'Both count numbers with distinct digits. In B the bound is 10^n, so every length
    is complete and each digit has a fixed number of choices: a product. In A the bound n is arbitrary,
    so the digits of n limit the prefix and the tight walk is needed.'
  shared_surface: Both count numbers with distinct digits.
  flipping_input: 'A: the numbers up to an arbitrary n with all digits different, where the digits of
    n limit the prefix and the tight walk is needed. B: the numbers below 10^n with all digits different,
    where every length is complete and the count per length is 9 · 9 · 8 · …, a product.'
- a: ac-abc336_e
  b: cf-597A
  a_tool:
    topic: '3.8'
    card: digit-sum-state
  b_tool:
    topic: '0.4'
    card: divisibility
  flipping_difference: Both count divisible numbers in a range. In B the divisor is fixed and the value
    alone matters, so division counts the multiples. In A the divisor is the number's own digit sum, which
    depends on its digits, so the walk must track the digit sum and the remainder together.
  shared_surface: Both count divisible numbers in a range.
  flipping_input: 'A: the numbers in [1, 100] divisible by their own digit sum, 33, where the divisor
    depends on the digits and the walk must track the digit sum and the remainder together. B: the multiples
    of 4 in [0, 100], 26, counted by division with no walk.'
self_test:
- q: For N = 25, which numbers in [0, 25] have a digit sum divisible by 4, and how does the tight walk
    split them by the first digit?
  a: '0, 4, 8, 13, 17, 22: six. First digit 0 (free): 3; first digit 1 (free): 2; first digit 2 (tight,
    second digit at most 5): 1.'
- q: How many numbers in [10, 25] have a digit sum divisible by 4, using F?
  a: F(25) − F(9) = 6 − 3 = 3 (13, 17, 22).
- q: Why does the memo store only states that are no longer tight?
  a: 'A tight state''s count depends on the remaining digits of N, a free state''s does not. Sharing one
    memo entry mixes them: for numbers up to 110 with one distinct digit, the tight prefix 1 would get
    the free count, which includes 111.'
- q: Among 1..100, how many numbers have no two equal neighbouring digits? What does a walk without the
    started flag count?
  a: 90 (9 one-digit and 81 two-digit numbers). Without the flag, "001" … "009" contain "00" and are rejected,
    giving 81.
- q: For N = 25, what pair (count, total of digit sums) does the prefix 2 return, and why?
  a: '(6, 27): six completions 20..25; their second digits add up to 15, and the digit 2 appears in each
    of the 6, adding 12.'
- q: When is a product formula enough instead of a digit DP, for "numbers with all digits different"?
  a: 'When the bound is 10^n: every length is complete and each digit has a fixed number of choices (9
    · 9 · 8 · …). An arbitrary bound N needs the tight walk.'
- q: A and B are decimal strings with 10^4 digits. How do you count [A, B] without computing A − 1?
  a: F(B) − F(A) + [A has the property], modulo the prime if needed (Theorem 3.8.2).
checkpoint:
  time_limit_minutes: 120
  problems:
  - ac-abc129_e
  - cf-914C
  - ac-abc154_e
decision_map:
- weak_signal: Count numbers in [L, R] up to 10^18 (or given as long strings) with a digit property
  choose: count-up-to-n
  when: The property is checked left to right with a small state; walk the digits of the bound with a
    tight flag, and use F(R) − F(L − 1) (Theorems 3.8.1, 3.8.2).
  over:
  - card: product-sum-rules
    because: If the bound is a power of 10, every digit is free and a product counts the numbers.
    topic: '2.3'
  - card: enumerate-answer
    because: If the qualifying numbers are few (palindromic squares, sequential digits), list them instead.
    topic: '0.5'
- weak_signal: Digit sums, remainders, "divisible by its digit sum"
  choose: digit-sum-state
  when: The sum or remainder after each digit follows from the old one and the digit; for a modulus that
    depends on the digits, fix it outside the walk.
  over:
  - card: divisibility
    because: Divisibility of the value alone by a fixed k is counted by division, without digits.
    topic: '0.4'
- weak_signal: Neighbouring digits must differ, step by one, never decrease; binary without "11"
  choose: neighbour-digits
  when: The state is the previous digit plus a started flag for leading zeros (Theorem 3.8.3).
  over:
  - card: generate-all
    because: If the numbers themselves are wanted and they are few (n ≤ 9 digits with two choices per
      step), build them.
    topic: '3.1'
  - card: left-to-right-forced
    because: If only the largest number ≤ n with the rule is wanted, a greedy fix of the first violation
      gives it.
    topic: '1.5'
- weak_signal: 'Totals over a range: number of 1s written, sum of digit sums, sum of qualifying values'
  choose: digit-aggregate
  when: The quantity splits as this digit plus the rest, so each state returns (count, total) (Theorem
    3.8.4).
  over:
  - card: answer-search
    because: If only the lengths of the numbers matter (the k-th digit of 123456…), count by lengths and
      binary search.
    topic: '1.4'
glossary_added:
- digit DP
- tight flag
- leading zero
