- id: ac-abc348_e
  role: drill
  summary: A tree of N ≤ 10^5 vertices with a weight C_i on each; the smallest value of the sum of C_i
    times the distance from a vertex v to the vertex i, over the choice of v.
- id: cf-219D
  role: ladder
  card: rerooting
  rung: 2
  twist: 'A direction on every edge: the answer changes by one, up or down, according to the way the edge
    points.'
  summary: A tree of n ≤ 2·10^5 cities whose roads have a direction; choose the capital so that the fewest
    roads must be reversed for every city to be reachable from it; print that number and all such cities.
    †
  hints:
  - Root the tree at city 1. For this capital, which roads must be reversed? Count them.
  - Move the capital from a city p to a neighbour c across the road between them. Only that road changes
    its meaning. By how much does the count change when the road points from p to c, and when it points
    from c to p?
  - answer(c) = answer(p) + 1 if the road points from p to c, and answer(p) − 1 if it points from c to
    p. Find answer(1) in one traversal, the rest in an order with parents first, and print the least value
    with every city that has it (Theorem 7.2.3).
- id: cf-1882D
  role: ladder
  card: rerooting
  rung: 3
  twist: 'A cost on every edge that is paid by the part away from the root: the answer changes by the
    edge cost times a difference of sizes.'
  summary: A tree of n ≤ 2·10^5 vertices with a number on each; one operation xors a chosen value into
    every vertex of the subtree of a vertex at a cost of that value times the subtree size; for every
    vertex taken as the root, the least total cost to make all numbers equal. †
  hints:
  - Look at one edge. To make its two ends equal, one operation on the part below it with the xor of the
    two ends is needed, and its cost is that xor times the size of the part.
  - For a fixed root the best total is the sum over the edges of (the xor of the ends) times (the size
    of the part away from the root). Do the operations on different edges get in each other's way?
  - 'Moving the root from p to c changes only the edge between them: the part away from the root was the
    subtree of c, of size s, and is now the rest, of size n − s. So answer(c) = answer(p) + w · (n − 2s)
    with w the xor of the two ends. Use 64 bits.'
- id: lc-difference-between-maximum-and-minimum-price-sum
  role: ladder
  card: exclude-one
  rung: 3
  twist: 'The best path from every root, with the largest over the neighbours: the two best values give
    the best way out of each vertex.'
  summary: A tree of n ≤ 10^5 nodes with a positive price on each; for a chosen root the cost is the largest
    price sum of a path starting at the root minus the smallest such sum; the largest cost over all roots.
  hints:
  - All prices are positive, so the path with the smallest price sum that starts at the root is the root
    alone. What is left to maximise?
  - The cost of a root is the largest price sum of a path that starts at it, minus its own price. For
    every vertex that is the best, over its neighbours, of the value of the way out through that neighbour.
  - down[v] = price[v] plus the best child; for a child c the best way out of its parent that does not
    enter c is read from the two best values of the parent, because a maximum has no inverse (Theorem
    7.2.2).
- id: ac-abc223_g
  role: ladder
  card: exclude-one
  rung: 4
  twist: A pair of values for each part (its matching and whether its root is free), combined by sums
    and counts, and then a count over all removed vertices.
  summary: A tree of N ≤ 2·10^5 vertices; the number of vertices whose deletion leaves a maximum matching
    of the same size as the whole tree's.
  hints:
  - Removing a vertex cuts the tree into the parts beyond its neighbours. What do you need to know about
    each part?
  - The size of its maximum matching, and whether its root can be left unmatched in some maximum matching.
    From the leaves up, a vertex is matched to a child exactly when some child is free.
  - 'The part above a child c is the part of its parent p without c: add the matchings of the other children
    and of the part above p, and count how many of those parts have a free root, taking c''s own contribution
    out of the totals. Then the matching of the tree without v is the sum over the parts around v; count
    the vertices where it equals the matching of the whole tree.'
- id: lc-minimum-edge-reversals-so-every-node-is-reachable
  role: review
  card: rerooting
  review_set: 1
  summary: A directed graph on n ≤ 10^5 nodes that is a tree when the directions are forgotten; for every
    node, the fewest edge reversals after which every other node can be reached from it.
- id: cf-1774E
  role: drill
  summary: A tree of n ≤ 10^5 vertices and a number d; two pieces start at the root, and one must always
    stand d steps behind the other on the way to the root; given the vertices that each piece has to visit,
    the fewest moves for both to visit theirs and come back. †
- id: cf-1929D
  role: drill
  summary: A tree rooted at 1 with n ≤ 3·10^5 vertices; the number of non-empty sets of vertices with
    a given property about the paths from the root, modulo 998244353. †
- id: lc-maximum-points-after-collecting-coins-from-all-nodes
  role: drill
  summary: A tree of n ≤ 10^5 nodes with a number of coins on each and a number k; at every node take
    the coins minus k, or half the coins (halving also all coins below); the largest total.
- id: lc-count-the-number-of-good-nodes
  role: drill
  summary: A tree of n ≤ 10^5 nodes rooted at 0; a node is good if all the subtrees of its children have
    the same size; the number of good nodes.
- id: lc-validate-binary-tree-nodes
  role: drill
  summary: n ≤ 10^4 nodes with the left and right child of each; whether they form exactly one valid binary
    tree.
drill:
- problem: cf-1092F
  answer:
    topic: '7.2'
    card: rerooting
  property: The cost of a root changes along an edge by S − 2·sub[c], where S is the total weight and
    sub[c] the weight of the subtree.
  why_others_fail: A search from every vertex costs O(n²).
- problem: cf-1324F
  answer:
    topic: '7.2'
    card: rerooting
  property: The best set for a vertex is its own value plus the positive parts of its neighbours; the
    part above a child is the parent's answer without the contribution of that child.
  why_others_fail: The subtree DP from every vertex as the root costs O(n²).
- problem: ac-abc348_e
  answer:
    topic: '7.2'
    card: rerooting
  property: f(c) = f(p) + W − 2·sub[c] with W the total weight and sub[c] the weight of the subtree of
    c; take the minimum over the vertices.
  why_others_fail: A search from every vertex costs O(N²).
- problem: cf-1774E
  answer:
    topic: '4.6'
    card: depths-parents
  property: One traversal that keeps the stack of ancestors gives the d-th ancestor of every vertex; a
    vertex one piece must visit forces its d-th ancestor for the other piece, and the answer is twice
    the number of edges of the union of the root paths.
  why_others_fail: 'A DP over the pair of positions of the two pieces is not needed: what each piece must
    visit is fixed by the input.'
- problem: cf-1929D
  answer:
    topic: '7.1'
    card: subtree-dp
  property: dp[v] = the product over the children of (dp[c] + 1), computed from the leaves up; the answer
    is read from the values of one rooted tree.
  why_others_fail: The answer is one number for the whole tree, not one for each root, so the second pass
    of rerooting is not needed.
- problem: lc-maximum-points-after-collecting-coins-from-all-nodes
  answer:
    topic: '7.1'
    card: subtree-dp
  property: dp[v][j] with j halvings made above, at most 14 of them; the children are combined by a sum
    of two options.
  why_others_fail: One root is given; a table for every root is not asked.
- problem: lc-count-the-number-of-good-nodes
  answer:
    topic: '4.6'
    card: subtree-values
  property: Subtree sizes from one traversal; a node is good when all the sizes of its children are equal.
  why_others_fail: 'There is nothing to choose or to move: a plain subtree value is enough.'
- problem: lc-validate-binary-tree-nodes
  answer:
    topic: '4.6'
    card: depths-parents
  property: Every node has at most one parent, exactly one node has none, and a traversal from that node
    reaches all n nodes.
  why_others_fail: 'No values or choices are involved: only the shape of the tree is checked.'
lookalike_pairs:
- a: lc-maximize-the-number-of-target-nodes-after-connecting-trees-ii
  b: lc-maximize-the-number-of-target-nodes-after-connecting-trees-i
  a_tool:
    topic: '4.2'
    card: two-sides
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both join two trees by one edge and ask, for each vertex of the first tree, the largest
    number of target vertices after the best choice of the edge.
  flipping_difference: 'In version I the trees have at most 1000 vertices and a target is at distance
    at most k, so a search from every vertex counts them. In version II the trees have up to 10^5 vertices
    and a target is at an even distance: the two-colouring of each tree gives the count of even distances
    for every vertex at once.'
  flipping_input: 'Two trees of 10^5 vertices: 10^5 searches of 10^5 steps each are 10^10 steps, while
    two colourings take about 2·10^5.'
- a: lc-count-the-number-of-houses-at-a-certain-distance-ii
  b: lc-count-the-number-of-houses-at-a-certain-distance-i
  a_tool:
    topic: '1.2'
    card: difference-array
  b_tool:
    topic: '4.1'
    card: unweighted-shortest
  shared_surface: Both count, for each distance k, the pairs of houses in a line with one extra street
    at that shortest distance.
  flipping_difference: 'In version I there are at most 100 houses, so a search from every house is enough.
    In version II there are up to 10^5: the pairs are split by their place relative to the extra street
    (a line, a cycle, tails) and the counts for ranges of distances are added with a difference array.'
  flipping_input: 'n = 10^5 houses: 10^5 searches of 10^5 steps are 10^10 steps, against O(n) with the
    difference arrays.'
self_test:
- q: Use answer(c) = answer(p) + n − 2·size(c) to find the sums of the distances in the path 0–1–2–3,
    rooted at 0.
  a: answer(0) = 0 + 1 + 2 + 3 = 6. size(1) = 3, size(2) = 2, size(3) = 1, so answer(1) = 6 + 4 − 6 =
    4, answer(2) = 4 + 4 − 4 = 4, answer(3) = 4 + 4 − 2 = 6. The sums are 6, 4, 4, 6.
- q: Why does the template for connected sets use prefix and suffix products and not a division by the
    factor of one child?
  a: The modulus may be any number, and a factor down(c) + 1 can be 0 modulo it (for M = 6 the factor
    6 is 0), so it has no inverse and the division is impossible. Prefix and suffix products leave one
    child out without dividing.
- q: For the farthest vertex from every vertex, why is answer(c) = max(down(c), answer(p) + 1) wrong?
  a: answer(p) may be the length of a path that goes down into c; adding 1 and using it for c counts the
    way into c's own subtree. On the path 3–1–0–2 it gives 3 for the vertex 1 where the answer is 2. The
    way out of p without c needs the second best way.
- q: Use Theorem 7.2.2 on the star with the centre 0 and the 4 leaves 1 to 4, every edge of length 1.
    What is the best way out of the centre, and what is up of a leaf?
  a: 'The ways out of the centre are 1, 1, 1, 1, so b1 = b2 = 1. For a leaf c, down(c) + 1 = 1 equals
    b1, so the second best is used, also 1: up(c) = 1 + 1 = 2. The farthest vertex from a leaf is at distance
    2.'
- q: What does Theorem 7.2.2 give when the best value is shared by two children (the values 5, 5, 2)?
    Why is the rule "use the second best when the value of the child is the best" still right?
  a: 'The two best values counted with multiplicity are b1 = 5 and b2 = 5. Leaving out either child with
    the value 5 leaves the other 5, which is b2. Leaving out the child with 2 leaves 5, which is b1. The
    rule is about positions, not values: b2 is the second largest in the list, so it is 5.'
- q: The path 0–1–2–3 has the directed edges 0→1, 2→1 and 2→3. Use Theorem 7.2.3 to find the fewest reversals
    so that every vertex can be reached from each root.
  a: 'For the root 0 the edges that point toward it: 2→1 points toward 0, and the others point away, so
    r(0) = 1. Then r(1) = 1 + 1 = 2 (the edge 0→1 points from the old root to the new), r(2) = 2 − 1 =
    1 (the edge 2→1 points from the new root to the old) and r(3) = 1 + 1 = 2. The answers are 1, 2, 1,
    2.'
checkpoint:
  time_limit_minutes: 150
  problems:
  - ac-dp_v
