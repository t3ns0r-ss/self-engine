# Patterns for topic 5.1 (Sparse table and RMQ). Provisional until the lesson maps them to Recognition Cards.
topic: "5.1"
patterns:
  - id: static-min
    name: Range minimum on a static array
    description: O(1) minimum or maximum over any range after O(n log n) preparation.
    precondition: The array never changes, and the range is covered by two overlapping power-of-two blocks.
  - id: idempotent-op
    name: Other overlap-safe operations
    description: Range GCD, AND, or OR queries on a static array with the same two-block trick.
    precondition: The operation is idempotent (op(x, x) = x), so overlapping blocks do not change the result.
  - id: search-over-ranges
    name: Searching with range queries
    description: For each start, find the longest range whose minimum or GCD still satisfies a condition, by searching over the end.
    precondition: The range aggregate is monotone in the right end, and each query is O(1).
