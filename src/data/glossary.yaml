# Glossary (PLAN.md Section 5.1). Terms are added by the lesson that first defines them.
# Terms marked topic 1.3 that belong to earlier topics (subarray) move to those topics when their
# lessons are written (M3).
- term: "subarray"
  definition: "A run of consecutive elements a[l], a[l+1], …, a[r] of an array, written [l, r] with both ends included. Also called a segment."
  topic: "1.3"
- term: "window"
  definition: "A subarray the algorithm is currently looking at, described by its two ends l and r. The empty window has l = r + 1."
  topic: "1.3"
- term: "pointer"
  definition: "In two-pointer methods, an integer variable holding an index into an array (not a C++ pointer type)."
  topic: "1.3"
- term: "two pointers"
  definition: "The method of keeping two indices into one or two arrays and moving each in only one direction, so the total number of moves is linear."
  topic: "1.3"
- term: "sliding window"
  definition: "A window whose two ends both move right as the algorithm runs."
  topic: "1.3"
- term: "validity condition"
  definition: "A yes/no property of windows given by the problem, such as 'the sum is at most K'. A window with the property is valid."
  topic: "1.3"
- term: "sub-window"
  definition: "A window [l', r'] lying inside [l, r], that is l ≤ l' and r' ≤ r (possibly empty)."
  topic: "1.3"
- term: "closed under shrinking"
  definition: "A validity condition is closed under shrinking if every sub-window of a valid window is also valid."
  topic: "1.3"
- term: "closed under extension"
  definition: "A validity condition is closed under extension if every window containing a valid window is also valid; equivalently, its opposite is closed under shrinking."
  topic: "1.3"
- term: "amortised analysis"
  definition: "Bounding the total cost of a sequence of steps instead of each step alone, for example by counting how far a pointer can move in total."
  topic: "0.2"
- term: "subsequence"
  definition: "A sequence obtained from another by deleting some elements without changing the order of the rest."
  topic: "1.3"
- term: "CP"
  expansion: "competitive programming"
  definition: "Solving well-defined algorithmic problems under time and memory limits, judged automatically."
  topic: "0.1"
- term: "compiler"
  definition: "A program that turns source code into a program the computer can run, or reports a compile error."
  topic: "0.1"
- term: "online judge"
  definition: "A website that compiles a submission, runs it on hidden tests, and compares its output with the expected output."
  topic: "0.1"
- term: "standard input"
  definition: "The text a program reads (cin in C++); judges supply the test there. Standard output (cout) is where the answer is written."
  topic: "0.1"
- term: "verdict"
  definition: "The judge's result for a submission: AC, WA, TLE, MLE, RE, or CE."
  topic: "0.1"
- term: "AC"
  expansion: "Accepted"
  definition: "Verdict: correct on every test."
  topic: "0.1"
- term: "WA"
  expansion: "Wrong Answer"
  definition: "Verdict: some output differs from the expected output."
  topic: "0.1"
- term: "TLE"
  expansion: "Time Limit Exceeded"
  definition: "Verdict: the program ran longer than the time limit."
  topic: "0.1"
- term: "MLE"
  expansion: "Memory Limit Exceeded"
  definition: "Verdict: the program used more memory than allowed."
  topic: "0.1"
- term: "RE"
  expansion: "Runtime Error"
  definition: "Verdict: the program crashed, for example by reading outside an array or dividing by zero."
  topic: "0.1"
- term: "CE"
  expansion: "Compilation Error"
  definition: "Verdict: the source did not compile."
  topic: "0.1"
- term: "test case"
  definition: "One complete input instance. A multi-test input holds several, usually preceded by their count t."
  topic: "0.1"
- term: "bit"
  definition: "A binary digit, 0 or 1. A b-bit integer type has 2^b possible values."
  topic: "0.1"
- term: "signed type"
  definition: "An integer type holding negative and positive values (int, long long); an unsigned type holds only values ≥ 0."
  topic: "0.1"
- term: "overflow"
  definition: "When the exact result of an arithmetic step does not fit its type. For signed types the result is undefined in C++."
  topic: "0.1"
- term: "integer division"
  definition: "C++ a / b for integers: the quotient truncated toward zero. The remainder a % b satisfies a == (a / b) * b + a % b."
  topic: "0.1"
- term: "floor"
  definition: "The largest integer at most x, written ⌊x⌋. The ceiling ⌈x⌉ is the smallest integer at least x."
  topic: "0.1"
- term: "floating-point number"
  definition: "An approximate real number (C++ double) with 53 significant bits; integers above 2^53 are not all exact."
  topic: "0.1"
- term: "integer square root"
  definition: "The largest integer whose square is at most x, that is ⌊√x⌋."
  topic: "0.1"
- term: "step"
  definition: "One simple operation (arithmetic, comparison, array access, assignment). Running time is counted in steps."
  topic: "0.2"
- term: "big-O"
  definition: "f(n) = O(g(n)) if f(n) ≤ c·g(n) for some constant c and all large n: f grows at most as fast as g, up to a constant factor."
  topic: "0.2"
- term: "complexity class"
  definition: "The function g in a bound O(g(n)), such as O(1), O(log n), O(n), O(n log n), O(n²), O(2^n)."
  topic: "0.2"
- term: "budget"
  definition: "The number of steps that fit in the time limit: about 10^8 simple steps per second."
  topic: "0.2"
- term: "closed form"
  definition: "A formula that gives the value of a sum (or other repeated computation) without performing every step."
  topic: "0.2"
- term: "harmonic sum"
  definition: "H_n = 1 + 1/2 + … + 1/n, at most 1 + ln n. Loops over multiples cost about n·H_n steps."
  topic: "0.2"
- term: "divisor"
  definition: "A positive integer d with N mod d = 0. Divisors come in pairs (d, N/d), one of them at most √N."
  topic: "0.2"
- term: "simulation"
  definition: "A program that carries out a described process step by step, keeping the process's state in variables."
  topic: "0.3"
- term: "state"
  definition: "All the values that determine what a process does next."
  topic: "0.3"
- term: "deterministic"
  definition: "A process is deterministic if its next state depends only on its current state."
  topic: "0.3"
- term: "eventually periodic"
  definition: "A sequence that, from some index μ on, repeats with a period λ ≥ 1: x(i + λ) = x(i) for all i ≥ μ."
  topic: "0.3"
- term: "pigeonhole principle"
  definition: "If more than K objects are put into K boxes, some box holds at least two."
  topic: "0.3"
- term: "grid"
  definition: "An H by W array of cells (r, c) with 0 ≤ r < H and 0 ≤ c < W; 4-neighbours share a side, 8-neighbours a side or a corner."
  topic: "0.3"
- term: "direction array"
  definition: "Arrays of row and column changes, one entry per direction, so that all neighbours are handled by one loop."
  topic: "0.3"
- term: "one-pass scan"
  definition: "Reading a string or array once from left to right while updating a small, fixed set of variables."
  topic: "0.3"
- term: "case analysis"
  definition: "Splitting all possible inputs into cases that together cover everything and solving each case by its own rule."
  topic: "0.3"
- term: "divides"
  definition: "a divides b (written a | b) if b = k·a for some integer k."
  topic: "0.4"
- term: "multiple"
  definition: "b is a multiple of a if b = k·a for some integer k; 0 is a multiple of every integer."
  topic: "0.4"
- term: "remainder"
  definition: "For m > 0, a mod m is the unique r with 0 ≤ r < m and a = q·m + r. C++'s a % m is negative when a is negative."
  topic: "0.4"
- term: "congruent"
  definition: "a ≡ b (mod m) if m divides a − b, that is if a and b have the same remainder modulo m."
  topic: "0.4"
- term: "parity"
  definition: "Whether an integer is even (divisible by 2) or odd."
  topic: "0.4"
- term: "invariant"
  definition: "A quantity that no step of a process changes, such as the parity of a count when every step changes it by 2."
  topic: "0.4"
- term: "GCD"
  expansion: "greatest common divisor"
  definition: "The largest integer dividing both numbers; gcd(a, 0) = |a|."
  topic: "0.4"
- term: "coprime"
  definition: "Two integers are coprime if their GCD is 1."
  topic: "0.4"
- term: "LCM"
  expansion: "least common multiple"
  definition: "The smallest positive integer that is a multiple of both numbers; lcm(a, b) = a / gcd(a, b) · b."
  topic: "0.4"
- term: "Euclidean algorithm"
  definition: "Computes gcd(a, b) by replacing (a, b) with (b, a mod b) until the second number is 0; O(log) steps."
  topic: "0.4"
- term: "search space"
  definition: "The set of all candidates that might be the answer to a problem."
  topic: "0.5"
- term: "brute force"
  definition: "Exhaustive search: checking every candidate in the search space and keeping the best or the first that passes."
  topic: "0.5"
- term: "bitmask"
  definition: "An integer used as a set: element i belongs to it exactly when bit i is 1, tested with (mask >> i) & 1."
  topic: "0.5"
- term: "permutation"
  definition: "An arrangement of all elements of a list in some order; n different elements have n! permutations."
  topic: "0.5"
- term: "lexicographic order"
  definition: "Comparing sequences at the first position where they differ, as words in a dictionary."
  topic: "0.5"
- term: "recursion"
  definition: "A function calling itself on a smaller problem, with a base case that stops without a further call."
  topic: "0.5"
- term: "base case"
  definition: "The smallest case of a recursive function, solved directly without calling itself."
  topic: "0.5"
- term: "STL"
  expansion: "Standard Template Library"
  definition: "The part of the C++ standard library with containers (vector, set, map, …) and algorithms."
  topic: "0.6"
- term: "container"
  definition: "An object that stores a collection of elements, such as vector<int> or set<int>."
  topic: "0.6"
- term: "iterator"
  definition: "A pointer-like object to one element of a container; *it is the element, ++it the next one, c.end() the position past the last."
  topic: "0.6"
- term: "ordered set"
  definition: "C++ set: distinct values kept in increasing order, with insert, erase and lookups in O(log n)."
  topic: "0.6"
- term: "multiset"
  definition: "An ordered set that allows repeated values; erase(x) removes every copy, erase(find(x)) one copy."
  topic: "0.6"
- term: "map"
  definition: "C++ map: pairs (key, value) with distinct keys, ordered by key; cnt[x] inserts x with value 0 if missing."
  topic: "0.6"
- term: "hash table"
  definition: "unordered_set and unordered_map: elements in buckets chosen by a hash of the value; O(1) operations on average, no order."
  topic: "0.6"
- term: "stack"
  definition: "A container where only the most recently added element can be read or removed (last in, first out)."
  topic: "0.6"
- term: "queue"
  definition: "A container where elements leave in the order they arrived (first in, first out)."
  topic: "0.6"
- term: "deque"
  definition: "A double-ended queue: elements can be added and removed at both ends in O(1)."
  topic: "0.6"
- term: "priority queue"
  definition: "A container that gives the largest element in O(1) and inserts or removes the largest in O(log n)."
  topic: "0.6"
- term: "heap"
  definition: "A tree stored in an array in which every parent is at least as large as its children; it implements a priority queue."
  topic: "0.6"
- term: "non-decreasing"
  definition: "A sequence is non-decreasing (sorted) if i < j implies a[i] ≤ a[j]; a function f on indices is non-decreasing if i < j implies f(i) ≤ f(j). Non-increasing is the same with ≥."
  topic: "1.1"
- term: "merging"
  definition: "Producing one sorted sequence from two sorted sequences, by repeatedly taking the smaller front element."
  topic: "1.1"
- term: "merge sort"
  definition: "Sorting an array by sorting its two halves by the same method and merging them; O(n log n) comparisons."
  topic: "1.1"
- term: "order-free"
  definition: "A question about a list is order-free if shuffling the list never changes the answer; such a question may be asked about the sorted list."
  topic: "1.1"
- term: "comparator"
  definition: "A function less(x, y) telling sort when x must come before y."
  topic: "1.1"
- term: "strict weak ordering"
  definition: "A comparator that is irreflexive (less(x, x) is false), transitive, and whose equivalence (neither less(x, y) nor less(y, x)) is transitive. sort requires one; a comparator written with <= is not."
  topic: "1.1"
- term: "stable sort"
  definition: "A sort that keeps equivalent elements in their original relative order, such as merge sort or std::stable_sort."
  topic: "1.1"
- term: "rank"
  definition: "The rank of a value in a collection is the number of distinct values in the collection smaller than it."
  topic: "1.1"
- term: "coordinate compression"
  definition: "Replacing every value by its rank, which keeps all comparisons and makes the values small enough to index an array."
  topic: "1.1"
- term: "event"
  definition: "A pair (time, change) marking where a quantity changes, such as the start or end of an interval."
  topic: "1.1"
- term: "sweep"
  definition: "Processing events in sorted order while keeping the current value of the quantity they change."
  topic: "1.1"
