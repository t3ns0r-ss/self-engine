decision_map:
- weak_signal: The largest total weight (or a count with weights) of a chain in which each next element
    has a larger key, with n up to 2·10^5
  choose: prefix-max-transition
  when: The allowed earlier states are those with a smaller key, a prefix of the ranks, and states are
    only added (Theorem 7.3.1).
  over:
  - card: lis
    topic: '3.4'
    because: 'Only the length is asked: the table of tails with a binary search.'
  - card: point-update-range-query
    topic: '5.3'
    because: The allowed keys form a range, not a prefix.
- weak_signal: The best total of a path or a cut in which the previous state is at most k positions back,
    or in a range whose ends move right
  choose: window-transition
  when: Both ends of the range of predecessors only move to the right, and the values come from the DP
    itself (Theorem 7.3.2).
  over:
  - card: window-deque
    topic: '1.6'
    because: 'A fixed array with no DP on top: only the window extreme.'
  - card: point-update-range-query
    topic: '5.3'
    because: The range ends are arbitrary and may jump back.
- weak_signal: The number of increasing (or valid) subsequences modulo a prime, or of a given small length
  choose: counting-with-tree
  when: The choices are counted by their last element and the earlier ones allowed are a prefix of the
    ranks (Theorem 7.3.3).
  over:
  - card: inversion-count
    topic: '5.2'
    because: 'Only pairs are counted: no chain recurrence.'
  - card: linear-state
    topic: '3.2'
    because: 'Small n: the sum over the earlier elements is enough.'
- weak_signal: Rewards paid for intervals, or parts valued by distinct counts, with a DP over the last
    choice
  choose: range-update-transition
  when: One element adds the same amount to a contiguous range of states (Theorem 7.3.4).
  over:
  - card: lazy-range-update
    topic: '5.3'
    because: Assignments or sums over ranges, with no DP on top.
  - card: difference-array
    topic: '1.2'
    because: Many range updates and one final read.
