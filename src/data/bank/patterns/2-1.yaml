# Patterns for topic 2.1 (Sieve, factorisation, divisors, extended Euclid). Provisional until the lesson maps them to Recognition Cards.
topic: "2.1"
patterns:
  - id: sieve
    name: Primes up to N
    description: List or test primality of all numbers up to N ≤ about 10^7 with the sieve of Eratosthenes.
    precondition: Every number in question is at most N, and an array of size N fits in memory.
  - id: spf-factorise
    name: Fast factorisation of many numbers
    description: Factor many numbers up to about 10^7 in O(log x) each using a precomputed smallest prime factor table.
    precondition: All numbers are bounded by an array-sized N, and each division by the smallest prime factor at least halves the number.
  - id: trial-division
    name: Divisors of one large number
    description: Factor one number, or list its divisors, up to about 10^12 by trying divisors up to √n.
    precondition: Divisors come in pairs (d, n / d) with d ≤ √n.
  - id: multiples-sieve
    name: Work over all multiples
    description: For every d ≤ N, aggregate over the multiples of d (divisor counts, how many array values each d divides).
    precondition: The total work is the sum of N / d over d, which is O(N log N).
  - id: bezout
    name: Linear equations in integers
    description: Solve a·x + b·y = c in integers, decide whether it has solutions, or find the smallest non-negative one, with extended Euclid.
    precondition: Integer combinations of a and b are exactly the multiples of gcd(a, b) (Bézout's identity).
