drill:
  - problem: ac-abc187_c
    answer_card: set-membership
    answer_topic: "0.6"
    property: Insert every string into a set; then for each string S without !, ask whether "!" + S is in the set.
    why_others_fail: Only presence matters, not counts; comparing all pairs is 2·10^10.
  - problem: ac-abc403_c
    answer_card: set-membership
    answer_topic: "0.6"
    property: Keep a set of granted (user, page) pairs and a set of users with full access; each query is a membership test.
    why_others_fail: Users and pages go up to large values, so a table is impossible; nothing needs counting.
  - problem: ac-abc310_c
    answer_card: set-membership
    answer_topic: "0.6"
    property: Store the smaller of each string and its reverse in a set; the answer is the set size.
    why_others_fail: A map of counts works but counts are not needed; only distinctness after normalising.
  - problem: ac-abc251_c
    answer_card: set-membership
    answer_topic: "0.6"
    property: A set of poems seen so far decides whether a submission is original; keep the best original score in one pass.
    why_others_fail: Sorting by score loses "first submission"; the set answers "seen before?" directly.
  - problem: ac-abc200_c
    answer_card: map-counting
    answer_topic: "0.6"
    property: "A_i − A_j is a multiple of 200 exactly when A_i and A_j have the same remainder (topic 0.4): count remainders and add c(c − 1)/2."
    why_others_fail: All pairs are 2·10^10; the condition depends only on the count per remainder.
  - problem: ac-abc417_c
    answer_card: map-counting
    answer_topic: "0.6"
    property: "Rewrite j − A_j = i + A_i: for each j, add the count of earlier i with i + A_i = j − A_j, then record j + A_j."
    why_others_fail: The raw condition looks like a pair search; after separating i and j it is counting equal keys.
  - problem: ac-abc378_c
    answer_card: map-counting
    answer_topic: "0.6"
    property: A map from value to its last position, read before updating, answers each position.
    why_others_fail: A set only says whether a value appeared, not where.
  - problem: ac-abc413_c
    answer_card: stack-queue
    answer_topic: "0.6"
    property: Store blocks (value, count) in a queue; a removal of k takes whole blocks from the front and part of the next one.
    why_others_fail: Storing c copies one by one is up to 2·10^14 elements; only the front of the sequence is ever removed.
  - problem: ac-abc196_c
    answer_card: enumerate-answer
