- id: cses-1733
  role: checkpoint
  card: period-border
  summary: Print all period lengths of a string of up to 10^6 letters.
- id: cf-631D
  role: checkpoint
  card: pattern-occurrences
  summary: Two texts given as runs (a length and a letter), up to 2·10^5 runs each; count the places where
