  shared_surface: Both give a tree of n ≤ 2·10^5 vertices and ask about the largest distances in it.
  flipping_difference: 'In A one number is asked, the diameter: two walks. In B the farthest distance
    is asked for every vertex: two more walks, and for each vertex the larger of the distances to the
    two ends of the diameter.'
  flipping_input: 'The path 1–2–3 (every edge 1). A: the answer is 2. B: the answers are 2, 1, 2 for the
