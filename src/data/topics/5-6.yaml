decision_map:
- weak_signal: Many questions about ranges of an array that never changes, all known in advance, where
    adding or removing one element repairs the answer in O(1) (distinct values, sums of squares of counts,
    pairs)
  choose: mo-offline
  when: The answer of a window is repaired in constant time when one end moves one step (Theorem 5.6.2);
    order the questions as Theorem 5.6.1 and move the window.
  over:
  - topic: '5.2'
    card: offline-sweep-count
    because: If one mark per value is enough (distinct values), the sweep with a Fenwick tree is O((n
      + q) log n).
  - topic: '5.1'
    card: idempotent-range-query
    because: If the answer comes from the answers of the halves, a table or a tree does it with no order
      of questions.
  - topic: '0.5'
    card: nested-loops
    because: If n and q are small, recount each range.
- weak_signal: The same offline questions, but the array changes between them, or the questions are paths
    of a tree, or the answer is a maximum that cannot be repaired when an element leaves
  choose: mo-variants
  when: 'A step still repairs the answer in O(1): add time as a third coordinate (Theorem 5.6.3), use
    the Euler order with cancelling (Theorem 5.6.4), or grow the window only and roll back the left part
    (Theorem 5.6.5).'
  over:
  - topic: '5.6'
    card: mo-offline
    because: If the array never changes and the questions are ranges, the plain order has fewer moves.
  - topic: '5.3'
    card: point-update-range-query
    because: If the answer of a range is a combination of the answers of its halves, a tree answers in
      O(log n) steps with changes.
  - topic: '4.6'
    card: path-counts
    because: If the quantity on a path is a sum, it comes from the two root-to-vertex values and the common
      ancestor.
