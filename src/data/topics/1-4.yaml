  - id: ac-abc270_e
    role: review
    card: answer-search
    review_set: 2
    summary: Walking around N baskets in a circle, eating one apple from each non-empty basket passed, until K ≤ 10^12 apples are eaten; the apples left in each basket.
  - id: cf-760B
    role: review
    card: answer-search
    review_set: 3
    summary: "n hobbits in a row share m pillows, at least one each, and neighbours may differ by at most one; the most pillows the k-th hobbit can get."
