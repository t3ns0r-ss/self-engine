decision_map:
  - weak_signal: '"Is it possible to reach …?" with moves that change two things at once'
    choose: parity
    when: Every move changes some quantity by an even amount, so its parity is fixed (Theorem 0.4.3).
    over:
      - card: direct-simulation
        because: Following moves cannot prove impossibility; an invariant can.
      - card: case-analysis
        because: Parity is often the first case split; the remaining cases still need a construction.
  - weak_signal: '"divisible by", "multiple of", counts in a huge range [l, r]'
    choose: divisibility
    when: Only remainders modulo k matter, or the count of multiples is ⌊r/k⌋ − ⌊(l−1)/k⌋ (Theorem 0.4.2).
    over:
      - card: closed-form
        because: Counting multiples is a closed form of its own; use the floor formula with care for l ≤ 0.
      - card: budget-from-constraints
        because: Looping over the range is too slow for r up to 10^18.
  - weak_signal: Repeated subtraction of the smaller from the larger; periods that must coincide
    choose: gcd-lcm
    when: Subtractions and remainders keep the GCD (Theorem 0.4.5); common multiples are multiples of the LCM (Theorem 0.4.6).
    over:
      - card: direct-simulation
        because: Subtracting one at a time can take 10^18 steps; Euclid replaces a run of subtractions by one remainder.
      - card: divisibility
        because: With two divisors at once, the LCM decides what is divisible by both.
  - weak_signal: '"print the answer modulo 10^9 + 7"; huge sums, products or counts'
    choose: mod-arithmetic-basic
    when: Only additions, subtractions and multiplications are needed, reduced after every step (Theorem 0.4.4).
    over:
      - card: overflow-64bit
        because: long long alone cannot hold the exact value; reducing modulo m keeps every number small.
      - card: direct-simulation
        because: When a process on remainders must stop, the remainders repeat within m steps (Theorem 0.3.1).
