# Patterns for topic 3.7 (Bitmask DP). Provisional until the lesson maps them to Recognition Cards.
topic: "3.7"
patterns:
  - id: assignment-mask
    name: Assign items to slots
    description: Assign n ≤ about 20 items to n slots; dp over the mask of items already used.
    precondition: Only the set of used items matters, not the order in which they were used.
  - id: path-mask
    name: Visit every vertex
    description: Shortest or counted Hamiltonian paths with dp[mask][last].
    precondition: The future depends only on the set of visited vertices and the current vertex.
  - id: group-mask
    name: Pack items into groups
    description: Split items into the fewest groups under a capacity, with dp[mask] = (groups used, fill of the last group).
    precondition: Groups can be filled in any order, so items can be added one at a time to the last group.
  - id: submask-mask
    name: Iterate over submasks
    description: dp[mask] combines dp of its submasks, O(3^n) in total.
    precondition: n is at most about 15–18, and the value for a mask depends on a split into a submask and its complement.
