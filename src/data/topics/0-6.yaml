    b: lc-contains-duplicate-ii
    a_tool: set-membership (0.6)
    b_tool: "map-counting (0.6): last position per value"
    flipping_difference: B limits the distance between the equal values, so the set of seen values must become a map from value to its last position.
  - a: ac-abc141_d
    b: cses-1091
    a_tool: heap-extract (0.6)
    b_tool: ordered-set-lookup (0.6)
    flipping_difference: In B each customer needs the largest price within their own budget, not the overall largest, so a multiset searched with s.upper_bound replaces the priority queue.
self_test:
  - q: n = 2·10^5 values, each followed by the question "has this value appeared before?". Compare a vector scan, a set and an array indexed by value when values go up to 10^9.
    a: "Vector scan: up to n²/2 = 2·10^10 steps, too slow. Array: 10^9 entries, too much memory. set: n·log n ≈ 3.6·10^6 comparisons, fine."
  - q: After cnt[x]++ for every element of (5, 2, 5, 5, 2), how many pairs i < j have equal values? Compute it from the counts.
    a: "Counts: 5 → 3, 2 → 2. Pairs: 3·2/2 + 2·1/2 = 3 + 1 = 4."
  - q: Why can "if (cnt[x] > 0)" make a map grow, and what should be used instead for a pure check?
    a: cnt[x] inserts the key x with value 0 if it is missing, so checking many absent values fills the map with zeros (more memory, slower iteration, a wrong size()). Use cnt.count(x) or cnt.find(x) != cnt.end().
  - q: In a multiset {1, 4, 4, 9}, what are *s.lower_bound(4), *s.upper_bound(4), and the largest element ≤ 3? What does s.erase(4) leave?
    a: lower_bound(4) → the first 4; upper_bound(4) → 9; the largest ≤ 3 is the element before upper_bound(3) (which points to the first 4), namely 1. s.erase(4) removes both 4s, leaving {1, 9}; s.erase(s.find(4)) would leave {1, 4, 9}.
  - q: A process repeatedly removes the largest element and inserts half of it. Why is a priority queue enough here, but not for "remove the largest element that is at most x"?
    a: A priority queue only gives the overall largest element. The first process needs exactly that (Theorem 0.6.5); the second needs a search by value below a bound, which needs an ordered set (Theorem 0.6.4).
  - q: Why is push_back on a vector O(1) on average even though it sometimes copies the whole vector?
    a: The capacity doubles when it is full, so the copies over n calls total 1 + 2 + 4 + … < 2n (Theorem 0.6.1); spread over n calls that is less than 2 copies per call.
  - q: "Is a stack or a queue right for: (a) undoing the last action, (b) serving customers in order of arrival, (c) matching brackets?"
    a: "(a) stack: the last action is undone first. (b) queue: the earliest arrival is served first. (c) stack: a closing bracket matches the most recent unmatched opening one (Theorem 0.6.6)."
