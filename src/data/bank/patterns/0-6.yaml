# Patterns for topic 0.6 (STL toolbox: vector, pair, set, map, priority_queue and their costs). Provisional until the lesson maps them to Recognition Cards.
topic: "0.6"
patterns:
  - id: set-membership
    name: Distinctness and membership
    description: Count distinct values, or answer "have we seen x?" under insertions, using set or unordered_set.
    precondition: Only membership matters, and each insertion or lookup costs O(log n) (or O(1) expected).
  - id: map-counting
    name: Counting by key
    description: Count how often each value or key appears, or group items by key, using map.
    precondition: The answer depends only on the count (or list) per key.
  - id: ordered-set-lookup
    name: Nearest value in a changing set
    description: Find the smallest stored value ≥ x (or largest ≤ x) and erase values while the set changes, with set or multiset.
    precondition: The collection changes between queries, so a sorted array would need rebuilding, while a balanced tree keeps O(log n) per operation.
  - id: heap-extract
    name: Repeatedly take the extreme
    description: The process described in the statement repeatedly removes the smallest or largest item and inserts new ones; priority_queue makes each step O(log n).
    precondition: The statement itself says which item to take; the only problem is doing it fast.
  - id: stack-queue
    name: Stack and queue processes
    description: Bracket matching, undo operations, or first-come-first-served processes with stack, queue, or deque.
    precondition: The process only ever touches the most recent item (stack) or the oldest item (queue).
