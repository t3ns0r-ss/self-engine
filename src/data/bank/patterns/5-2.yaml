# Patterns for topic 5.2 (Fenwick tree (BIT), inversion counting). Provisional until the lesson maps them to Recognition Cards.
topic: "5.2"
patterns:
  - id: point-prefix
    name: Point updates, prefix sums
    description: Change single elements and query prefix or range sums, both in O(log n).
    precondition: The operation is invertible (sum), so a range sum is a difference of two prefix sums.
  - id: inversions
    name: Counting inversions
    description: Count pairs i < j with a[i] > a[j] by inserting values left to right and asking how many larger ones are present.
    precondition: Values (after compression) index the tree, and pairs are counted from the later element's side.
  - id: range-add-point
    name: Range updates, point reads
    description: Add to a range and read single elements, using the tree over a difference array.
    precondition: A point's value is the prefix sum of the difference array.
  - id: offline-sorted-count
    name: Offline counting by sorting
    description: Answer counting queries ("distinct values in [l, r]", points in rectangles) by sorting queries and updates together and sweeping.
    precondition: All queries are known in advance, so processing order can be chosen to make each query a prefix query.
  - id: kth-in-tree
    name: k-th present element
    description: Find the k-th smallest present value by descending the tree bit by bit.
    precondition: Counts are non-negative, so prefix counts are monotone and the descent can choose each bit greedily.
