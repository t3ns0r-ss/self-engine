    role: review
    card: answer-search
    review_set: 3
    summary: "n quests with rewards, d days, one quest per day and a cooldown of k days before repeating a quest; the largest k that still earns at least c coins, or Infinity, or Impossible."
drill:
  - problem: ac-abc248_d
    answer_card: sorted-search
    answer_topic: "1.4"
    property: "For each value X keep the sorted list of its positions; the answer is the number of positions in [L, R], a difference of two bounds in that list."
    why_others_fail: "A 2D table of prefix counts per value needs N² memory; scanning each query is too slow."
  - problem: ac-abc353_c
    answer_card: sorted-search
    answer_topic: "1.4"
    property: "Without the mod the sum is (N − 1)·ΣA; each pair with A_i + A_j ≥ 10^8 loses 10^8 once. After sorting, the partners j > i with A_j ≥ 10^8 − A_i form a suffix found by a lower bound."
    why_others_fail: All pairs are 4.5·10^10; the mod makes a pure formula impossible without counting the overflowing pairs.
  - problem: lc-find-minimum-in-rotated-sorted-array
    answer_card: sorted-search
    answer_topic: "1.4"
    property: "\"nums[i] ≤ nums[n − 1]\" is false on the first block and true on the second, so the minimum is its first true index."
    why_others_fail: A linear scan is O(n), and the statement asks for O(log n); sorting would also lose the point.
  - problem: lc-capacity-to-ship-packages-within-d-days
    answer_card: answer-search
    answer_topic: "1.4"
    property: "A capacity c works iff loading each day greedily needs at most D days (Lemma 1.4.4); larger capacities work too, so search the smallest c."
    why_others_fail: The order is fixed, so sorting does not apply; trying every capacity up to the total weight is too slow.
  - problem: lc-minimum-number-of-days-to-make-m-bouquets
    answer_card: answer-search
    answer_topic: "1.4"
    property: "By day d, a scan counts runs of bloomed flowers and the bouquets they give; later days only add bloomed flowers, so \"m bouquets by day d\" is monotone."
    why_others_fail: Simulating every day up to 10^9 is too slow; the adjacency condition rules out sorting.
  - problem: lc-kth-smallest-element-in-a-sorted-matrix
    answer_card: kth-by-counting
    answer_topic: "1.4"
    property: "count(x) of entries ≤ x takes one staircase walk or n bounds; the k-th smallest is the first x with count(x) ≥ k."
    why_others_fail: "Copying and sorting all n² entries breaks the memory limit the statement sets; a heap works but costs k log n."
  - problem: cf-1538C
    answer_card: sorted-search
    answer_topic: "1.4"
    property: "Order-free, so sort; for each i the partners j > i with l − a_i ≤ a_j ≤ r − a_i form a range found by two bounds."
    why_others_fail: All pairs are 2·10^10; a map of counts answers equality, not a range of values.
  - problem: ac-abc341_d
    answer_card: kth-by-counting
    answer_topic: "1.4"
    property: "The numbers up to x divisible by exactly one of N, M number x/N + x/M − 2·x/lcm(N, M), non-decreasing in x; the K-th is the first x where the count reaches K."
    why_others_fail: Listing the numbers one by one takes up to K = 10^10 steps.
  - problem: ac-abc267_c
    answer_card: range-sum
    answer_topic: "1.2"
    property: "Moving the part one step right changes the weighted sum by −(sum of the old part) + M·(new element), and the sum of a part is a range sum: O(N) with prefix sums."
    why_others_fail: Nothing here is monotone in a searchable way; it is an update of a running value with range sums.
  - problem: ac-abc339_c
    answer_card: prefix-extremes
    answer_topic: "1.2"
    property: "The start count must be at least −(smallest prefix sum) and at least 0; the answer is that start plus the total."
    why_others_fail: Searching over the start value works but is unnecessary; the bound is a prefix minimum read off in one pass.
  - problem: lc-product-of-array-except-self
    answer_card: prefix-extremes
    answer_topic: "1.2"
    property: "The product of everything except i is (product of the prefix before i) × (product of the suffix after i), both built in one pass each."
    why_others_fail: Division is forbidden (and fails with zeros); there is nothing to search.
lookalike_pairs:
  - a: lc-search-a-2d-matrix
    b: lc-search-a-2d-matrix-ii
    a_tool: sorted-search (1.4)
    b_tool: "a corner walk discarding a row or a column per step (1.3)"
    flipping_difference: In A each row starts above the previous row's end, so the matrix read row by row is one sorted list; in B only rows and columns are sorted, so no middle element splits the candidates.
  - a: lc-find-k-pairs-with-smallest-sums
    b: lc-kth-smallest-number-in-multiplication-table
    a_tool: heap-extract (0.6)
    b_tool: kth-by-counting (1.4)
    flipping_difference: A needs only k ≤ 10^4 items, which a priority queue lists in order; B's k can be 9·10^8, so the k-th must be found by counting.
self_test:
  - q: "In First Bad Version, n can be 2^31 − 1. What goes wrong with mid = (lo + hi) / 2 in int, and what is the fix?"
    a: "lo + hi can exceed 2^31 − 1 (for example lo = 2·10^9, hi = 2^31 − 1) and overflows to a negative number, so mid is negative. lo + (hi − lo) / 2 never exceeds hi, so it cannot overflow."
  - q: The template starts with lo = −1 and hi = n. Why does it never read a[−1] or a[n]?
    a: "It only reads a[mid], and while hi − lo ≥ 2, mid = lo + (hi − lo) / 2 is strictly between lo and hi, so 0 ≤ mid ≤ n − 1. The two outside positions are part of the invariant by agreement but are never tested."
  - q: "On the array (5, 3, 8), is p(i) = (a_i ≥ 4) monotone? What can binary search return for \"the first index with a_i ≥ 4\" and \"the first index with a_i ≥ 6\"?"
    a: "p is true, false, true: not monotone. For x = 6 the search tests index 1 (3, false), then index 2 (8, true) and returns 2, which is right by luck; for x = 4 it tests index 1 (false) and returns 2, but the correct answer is 0. Sort first, or prove monotonicity."
  - q: "For \"maximise the smallest gap d when choosing m positions\", in which direction is ok(d) monotone, and what are safe starting values for lo and hi?"
    a: "If d works, every smaller d works: ok is true, …, true, false, …. Keep ok(lo) true and ok(hi) false: lo = 0 (always possible) and hi = span + 1 (impossible); the answer is lo."
  - q: "Why can \"while (hi − lo > 1e-9)\" loop forever for answers near 10^9 with double, while 100 fixed iterations cannot?"
    a: "Neighbouring doubles near 10^9 are about 1.2·10^-7 apart, so the gap can never drop below 1e-9: once hi and lo are neighbours, mid equals one of them and nothing changes. A fixed count of 100 halvings always ends, and leaves the interval as narrow as the type allows."
  - q: "S = {1, 2, 2, 3} and k = 2. Why is the k-th smallest the smallest x with count(x) ≥ k, and not an x with count(x) = k?"
    a: "count(1) = 1 and count(2) = 3: no x has count exactly 2. The 2nd smallest is 2, the first x where the count reaches at least 2 (Theorem 1.4.6)."
  - q: "In (1, 3, 5, 5, 8), compute the lower and upper bounds of 5 and of 4, and the number of elements in [4, 5]."
    a: "lower(5) = 2, upper(5) = 4, lower(4) = 2, upper(4) = 2. The elements in [4, 5] number upper(5) − lower(4) = 4 − 2 = 2 (the two 5s)."
checkpoint:
  time_limit_minutes: 90
  problems: [ac-abc174_e, lc-find-k-th-smallest-pair-distance, cf-1201C]
decision_map:
  - weak_signal: Many independent queries about a fixed sorted collection, "how many ≤ x", the nearest value
    choose: sorted-search
    when: The searched sequence is sorted (or non-decreasing by construction), so each query is one or two bounds (Theorem 1.4.2).
    over:
      - card: direct-simulation
        because: Scanning for every query is O(n) per query.
      - card: merge-walk
        because: A forward walk needs the queries sorted too; it fits when all queries are known in advance, the search fits always.
  - weak_signal: '"The smallest … at least x", "the closest", min and max of a changing collection'
    choose: sorted-search
    when: The collection does not change between the questions, so a sorted array and two bounds answer them.
    over:
      - card: ordered-set-lookup
        because: A set pays for keeping order under insertions and erasures; with no changes, a sorted vector is simpler and faster.
  - weak_signal: '"Minimise the maximum", "maximise the minimum", "the least time / capacity / speed such that …"'
    choose: answer-search
    when: The check "can the answer be x?" is monotone in x and much cheaper than solving directly (Theorem 1.4.3).
    over:
      - card: enumerate-answer
        because: Trying every x works only when the range of answers is small; the search needs log of the range checks.
      - card: sort-then-scan
        because: A single sorted scan decides the answer only when the best choice is visible in sorted order; a capacity or time limit usually needs the check.
  - weak_signal: The k-th smallest element of a huge collection (pair sums, products, a table, numbers not in a list)
    choose: kth-by-counting
    when: The number of elements at most x can be counted fast, and the collection is too large to list (Theorem 1.4.6).
    over:
      - card: heap-extract
        because: Popping k items from a priority queue works only for small k (about 10^5).
      - card: sort-then-scan
        because: Sorting needs the whole collection in memory, impossible for n² elements.
  - weak_signal: 'Two lists: merge them, match elements, closest element, or pairs across them'
    choose: sorted-search
    when: One list is fixed and each element of the other is handled on its own, for example online or with a condition that is not monotone along the second list.
    over:
      - card: merge-walk
        because: The walk needs both lists sorted and a monotone partner index; a search needs only the searched list sorted.
glossary_added:
  - predicate
  - monotone predicate
  - binary search
  - lower bound
  - upper bound
  - feasibility check
  - search on the answer

