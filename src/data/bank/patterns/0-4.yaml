# Patterns for topic 0.4 (Parity, divisibility, GCD via Euclid, basic modular arithmetic). Provisional until the lesson maps them to Recognition Cards.
topic: "0.4"
patterns:
  - id: parity
    name: Parity arguments
    description: Decide possibility or the answer from whether a sum, count, or difference is even or odd.
    precondition: Every allowed operation keeps (or flips in a known way) the parity of some quantity, so parity is an invariant.
  - id: divisibility
    name: Divisibility and remainders
    description: Questions about multiples, remainders, ceilings of quotients, or counting multiples of k in [l, r] as r/k − (l−1)/k.
    precondition: The condition depends only on values modulo k, or on whether k divides a quantity.
  - id: gcd-lcm
    name: GCD and LCM via Euclid
    description: Compute or reason about the greatest common divisor of two numbers or an array, and the least common multiple as a / gcd(a, b) · b.
    precondition: gcd(a, b) = gcd(b, a mod b), and gcd(a, b) = gcd(a, b − a), so subtractions and remainders keep the GCD.
  - id: mod-arithmetic-basic
    name: Arithmetic modulo m
    description: Compute a large sum or product modulo m by reducing after every step (no division).
    precondition: (a + b) mod m and (a · b) mod m depend only on a mod m and b mod m.
