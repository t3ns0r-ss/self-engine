# Topic 0.4 data file (PLAN.md Section 5, Revision 2). Problems reference the bank by id.
id: '0.4'
uses:
- topic: '0.1'
  what: long long, overflow and how C++ rounds integer division and % for negative numbers (Theorem 0.1.4)
- topic: '0.2'
  what: 'The step budget and closed forms: counting multiples below is a closed form'
- topic: '0.3'
  what: Processes that repeat (Theorem 0.3.1) and case analysis; remainders often explain why a process
    repeats
theorems:
- id: 0.4.1
  title: Division with remainder, and the remainder in C++
  plain_words: Every integer a splits uniquely as a quotient times m plus a remainder between 0 and m
    − 1. C++ gives a negative remainder for a negative a, so add m and take the remainder again to get
    the usual one.
  code: 0.4/thm-1
- id: 0.4.2
  title: Multiples of k up to n are counted by one division
  plain_words: Up to n there are exactly n divided by k, rounded down, multiples of k. For a range from
    l to r, count up to r and remove the count up to l − 1.
  code: 0.4/thm-2
- id: 0.4.3
  title: Parity is unchanged by even steps and flipped by odd ones
  plain_words: If every move changes a quantity by an even amount, its parity never changes, so a target
    of the other parity can never be reached. A walker on a grid flips the parity of x + y with every
    step.
  code: 0.4/thm-3
- id: 0.4.4
  title: Sums, differences and products can be reduced modulo m at any time
  plain_words: To find a sum, difference or product modulo m, replace each number by its remainder first,
    and again after every operation. The result is the same as computing the huge exact number and reducing
    at the end.
  code: 0.4/thm-4
- id: 0.4.5
  title: Euclid's algorithm computes the GCD in a logarithmic number of steps
  plain_words: The greatest common divisor of a and b equals that of b and the remainder of a divided
    by b. Repeating this shrinks the numbers fast, at least by half every two steps, until the remainder
    is 0.
  code: 0.4/thm-5
- id: 0.4.6
  title: The least common multiple comes from the GCD
  plain_words: The least common multiple of a and b is a times b divided by their GCD, best computed as
    a divided by the GCD, times b. Numbers divisible by a or b are counted by adding the two counts and
    removing the numbers counted twice, the multiples of the LCM.
  code: 0.4/thm-6
cards:
- id: parity
  name: Parity invariant
  decisive_property: Every allowed move changes some integer quantity by an even amount (or flips its
    parity every time), so its parity is fixed by the start and the number of moves; a target with the
    other parity is impossible.
  from_theorem: 0.4.3
  how_to_test: Write down what one move does to a sum, a count or a coordinate sum, and check whether
    the change is always even (or always odd). Then compare the parity at the start and at the target.
  constraint_shapes:
  - 'Coordinates up to 10^9 and a number of steps t up to 10^18: the set of reachable cells cannot be
    listed (10^18 steps), but the parity of x + y after t steps is a single comparison.'
  weak_signals:
  - form: Asks whether a target can be reached, or whether something can be made equal, using moves that
      change two things at once
    shape: Values up to 10^9 or 10^18, so no search; a yes/no answer
  - form: Moves of fixed size ±2, swaps of two elements, or flips of two items
    shape: A sum or count that each move changes by a known amount
  - form: A sum that must split into two equal halves
    shape: The total must be even for any split to exist
  kill_signals:
  - 'Parity is only necessary, not sufficient: to reach (5, 0) from (0, 0) in exactly 3 steps, the parities
    agree (both odd), but the distance 5 is more than 3.'
  - 'The moves change the value by arbitrary amounts: from 5, moves that subtract 1 or 2 reach 0 in exactly
    4 moves, although a parity rule that assumed every move flips parity would say no.'
  in_action:
    statement: A walker starts at (0, 0) and moves one step up, down, left or right at a time. Can it
      be at (tx, ty) after exactly t steps?
    constraints: '|tx|, |ty| ≤ 10^9 and 0 ≤ t ≤ 10^18.'
    budget: Listing the cells reachable after t steps is up to 10^18 steps. A constant number of comparisons
      is what fits.
    candidates:
    - tool: Expand the set of reachable cells step by step
      verdict: rejected
      because: Up to 10^18 steps, and the set grows with every step.
    - tool: Compare the parity of x + y with the parity of t, and check the distance (this topic)
      verdict: chosen
      because: Each step changes x + y by exactly 1, an odd amount, so the parity is fixed by t.
    property_check: Every step changes x + y by 1, so after t steps x + y has the parity of t (Theorem
      0.4.3). The cell (tx, ty) needs d = |tx| + |ty| steps at least, so d ≤ t is also needed, and then
      t − d must be even.
    decision: YES exactly when d ≤ t and t − d is even.
  examples:
    positive:
    - inline:
        input: Back to the start (0, 0) in exactly 6 steps
        answer: 'yes'
        why: The distance is 0, 6 − 0 is even, so the walker can step out and back three times.
    - inline:
        input: The cell (1, 2) in exactly 5 steps
        answer: 'yes'
        why: The distance is 3 and 5 − 3 = 2 is even, so after 3 steps of the direct route, one step away
          and one back fit in.
    negative:
    - inline:
        input: The cell (5, 0) in exactly 3 steps, judged by parity alone
        answer: 'no'
        method_gives: 'yes'
        why: The parities agree (5 and 3 are both odd), but the distance 5 is more than the 3 steps available.
          Parity is necessary, not sufficient; the distance must also fit.
      correct_tool:
        topic: '0.4'
        card: parity
    - inline:
        input: From 5, moves that subtract 1 or 2; can 5 become 0 in exactly 4 moves, if every move is
          assumed to flip the parity?
        answer: 'yes'
        method_gives: 'no'
        why: A move of 2 does not change the parity, so the invariant does not exist. Here 1 + 1 + 1 +
          2 = 5 reaches 0; with so few states, step through them.
      correct_tool:
        topic: '0.3'
        card: direct-simulation
  lookalikes:
  - description: Reach a target where each move changes a value by an arbitrary amount
    tool:
      topic: '0.4'
      card: divisibility
    flipping_difference: Without a fixed even change per move, parity says nothing; the question is then
      about which values the moves can make up, a divisibility question.
  complexity: O(1) per question.
- id: divisibility
  name: Divisibility and counting multiples
  decisive_property: The condition depends only on remainders modulo k or on whether k divides a quantity,
    so it is decided by % and integer division; the multiples of k in [l, r] number ⌊r/k⌋ − ⌊(l−1)/k⌋.
  from_theorem: 0.4.2
  how_to_test: Ask whether replacing every value by its remainder modulo k changes the answer. If not,
    work with remainders; for counts of multiples use the floor formula, checking the sign of l − 1.
  constraint_shapes:
  - 'A range [l, r] with r up to 10^18: testing every number is 10^18 steps, while ⌊r/k⌋ − ⌊(l − 1)/k⌋
    is two divisions.'
  weak_signals:
  - form: Asks how many numbers in a range are divisible by k, or are multiples of k
    shape: Range ends up to 10^9 or 10^18, so counting by loop is impossible
  - form: Mentions "divisible by", "multiple of" or "remainder when divided by"
    shape: The condition depends only on a number modulo k
  - form: Asks for equal shares, groups of size k, or rounding up to the next multiple
    shape: Integers up to 10^18 and a divisor k
  kill_signals:
  - 'Two divisors at once: the numbers in 1..100 divisible by 12 or 18 are 11, but adding 100/12 = 8 and
    100/18 = 5 gives 13, because 36, 72 are counted twice.'
  - 'The range starts at 0 or below: for the multiples of 3 in [0, 9] there are 4, but 9/3 − (0 − 1)/3
    = 3 − 0 = 3 with C++ division, because (−1)/3 truncates to 0 instead of the floor −1.'
  in_action:
    statement: Count the integers in [l, r] that are multiples of k.
    constraints: 1 ≤ l ≤ r ≤ 10^18, 1 ≤ k ≤ 10^18.
    budget: Testing every integer is up to 10^18 steps. Two divisions are O(1).
    candidates:
    - tool: Loop over [l, r] and test each number
      verdict: rejected
      because: Up to 10^18 steps.
    - tool: Count multiples with ⌊r/k⌋ − ⌊(l − 1)/k⌋ (this topic)
      verdict: chosen
      because: Two divisions, exact, and l − 1 ≥ 0 so C++ division equals the floor.
    property_check: The positive multiples of k are k, 2k, 3k, …, and jk ≤ n exactly when j ≤ ⌊n/k⌋ (Theorem
      0.4.2). Counting up to r and removing those up to l − 1 leaves the multiples in [l, r]; l ≥ 1 keeps
      l − 1 non-negative.
    decision: r / k − (l − 1) / k in long long.
  examples:
    positive:
    - inline:
        input: The multiples of 7 in [20, 100]
        answer: '12'
        why: ⌊100/7⌋ − ⌊19/7⌋ = 14 − 2 = 12; they are 21, 28, …, 98.
    - worked_example: ac-abc048_b
      why: The count of integers divisible by x between a and b up to 10^18 is exactly this formula, with
        the empty-range case a = 0 handled separately.
    negative:
    - inline:
        input: The multiples of 3 in [0, 9], counted with 9 / 3 − (0 − 1) / 3 in C++
        answer: '4'
        method_gives: '3'
        why: The range starts at 0, so l − 1 = −1 and C++ division gives 0, not the floor −1. The multiple
          0 is lost; use the floor from Theorem 0.1.4 or count 0 separately.
      correct_tool:
        topic: '0.1'
        card: integer-rounding
    - inline:
        input: The numbers in 1..100 divisible by 12 or by 18, counted as 100 / 12 + 100 / 18
        answer: '11'
        method_gives: '13'
        why: The numbers divisible by both, 36 and 72, are counted twice. Subtract the multiples of lcm(12,
          18) = 36.
      correct_tool:
        topic: '0.4'
        card: gcd-lcm
  lookalikes:
  - description: Count numbers in [l, r] divisible by a or by b
    tool:
      topic: '0.4'
      card: gcd-lcm
    flipping_difference: With two divisors, numbers divisible by both are counted twice unless the multiples
      of lcm(a, b) are subtracted.
  complexity: O(1) per count.
- id: gcd-lcm
  name: GCD and LCM via Euclid
  decisive_property: The answer is the GCD or LCM of some numbers, or a quantity kept by remainders and
    subtractions (gcd(a, b) = gcd(b, a mod b) = gcd(a, b − a)), so Euclid computes it in O(log) steps.
  from_theorem: 0.4.5
  how_to_test: Check whether the process only subtracts one value from another or takes remainders; if
    so, the GCD is unchanged throughout. For a common multiple, check that a / gcd · b stays within the
    type.
  constraint_shapes:
  - 'Numbers up to 10^18: Euclid takes at most 121 steps, while testing every candidate divisor is up
    to 10^18; the LCM of 4·10^9 and 6·10^9 is 1.2·10^10, but their product 2.4·10^19 exceeds even the
    long long limit of 9.2·10^18.'
  weak_signals:
  - form: A process repeatedly subtracts the smaller number from the larger, or reduces by remainders
    shape: Values up to 10^9 or 10^18 and a question about the final value
  - form: Asks for the largest size that divides everything, or the smallest number that is a multiple
      of all of them
    shape: An array of up to 10^5 numbers
  - form: Events repeat with different periods and the first time they coincide is asked
    shape: Periods up to 10^9, so the meeting time is an LCM
  kill_signals:
  - 'The LCM is computed as a · b: for 12 and 18 that gives 216, but the LCM is 36; divide by the GCD.'
  - 'a · b overflows even though the LCM fits: for 4·10^9 and 6·10^9 the 64-bit product wraps around;
    compute a / gcd · b, or check the bound before multiplying.'
  in_action:
    statement: Monsters with healths A_1, …, A_N fight; each attack lowers the target's health by the
      attacker's health. Print the smallest possible health of the last survivor.
    constraints: 2 ≤ N ≤ 10^5, 1 ≤ A_i ≤ 10^9.
    budget: Trying every order of attacks is at least N! ≈ 10^456 000 for N = 10^5 (a factorial of 10^5),
      hopeless. One Euclid step per number, 10^5 steps of about 30 each, is instant.
    candidates:
    - tool: Try every order of attacks
      verdict: rejected
      because: The number of orders is N!, far over the budget even for N = 20.
    - tool: The GCD of all healths (this topic)
      verdict: chosen
      because: An attack replaces a health a by a − b, a step that keeps the GCD of the healths unchanged.
    property_check: Subtracting one value from another keeps gcd(a, b) = gcd(a, b − a) (Theorem 0.4.5,
      part 1), so the GCD of all healths never changes, and a single survivor has health equal to it.
      It can be reached by repeating the Euclid steps.
    decision: Print gcd(A_1, …, A_N), computed left to right.
  examples:
    positive:
    - inline:
        input: The GCD of 1071 and 462
        answer: '21'
        why: Euclid gives (1071, 462) → (462, 147) → (147, 21) → (21, 0), so the GCD is 21.
    - worked_example: ac-abc118_c
      why: An attack subtracts one health from another, which keeps the GCD of all healths; the smallest
        possible final health is that GCD.
    negative:
    - inline:
        input: The LCM of 12 and 18, computed as 12 · 18
        answer: '36'
        method_gives: '216'
        why: The product counts the common factor 6 twice. The LCM is 12 / gcd(12, 18) · 18 = 36.
      correct_tool:
        topic: '0.4'
        card: gcd-lcm
    - inline:
        input: The LCM of 4·10^9 and 6·10^9, computed as a · b / gcd in 64-bit arithmetic
        answer: '12000000000'
        method_gives: '2776627963'
        why: The product 2.4·10^19 exceeds the long long limit and wraps around before the division, so
          the result is wrong. Divide first, a / gcd · b, or check the bound.
      correct_tool:
        topic: '0.1'
        card: overflow-64bit
  lookalikes:
  - description: Can a sum of multiples of A have remainder C modulo B?
    tool:
      topic: '0.4'
      card: mod-arithmetic-basic
    flipping_difference: The question is about remainders reachable by multiples, not about one common
      multiple; the remainders of kA repeat with period B, so trying k = 1..B decides it.
  complexity: O(log max(a, b)) per GCD.
- id: mod-arithmetic-basic
  name: Arithmetic modulo m
  decisive_property: Only additions, subtractions and multiplications are applied, and the answer is asked
    modulo m (or only remainders matter), so every intermediate value can be reduced modulo m without
    changing the result.
  from_theorem: 0.4.4
  how_to_test: Check that no division is needed before the final answer, and that a product of two reduced
    values (below m²) fits in long long.
  constraint_shapes:
  - 'm = 10^9 + 7 and n = 10^6 multiplications: n! has more than 5 million digits, but every reduced value
    stays below m, and a product of two such values is below 10^18, inside long long.'
  weak_signals:
  - form: Asks to print the answer modulo 10^9 + 7 or 998244353
    shape: Counts or products that grow exponentially, far beyond 10^18
  - form: Asks about a sequence whose terms are built by a rule such as multiply by 10 and add 7, and
      about when a remainder appears
    shape: A modulus up to 10^6 and a search of at most that many steps
  - form: Asks for pairs whose sum is divisible by k
    shape: Only the remainder of each value matters, so remainders r and k − r pair up
  kill_signals:
  - 'The formula divides: (10 / 2) mod 6 = 5, but reducing first and then dividing gives (10 mod 6) /
    2 = 2; division needs the exact quotient first, so reducing before dividing is wrong.'
  - 'A subtraction can go below 0: (3 − 5) mod 7 is 5, but C++ gives (3 − 5) % 7 = −2; add m before the
    last %.'
  in_action:
    statement: Print (a_1 b_1 + … + a_n b_n) mod m as a value in [0, m).
    constraints: n ≤ 10^5, 1 ≤ m ≤ 2·10^9, |a_i|, |b_i| ≤ 10^18.
    budget: The exact sum reaches 10^5 · 10^36, far beyond any built-in type. n reductions and multiplications
      are 10^5 steps.
    candidates:
    - tool: Compute the exact products and sum, then reduce
      verdict: rejected
      because: A product of two values of 10^18 is 10^36, which no built-in type holds.
    - tool: Reduce each factor into [0, m) and reduce after every operation (this topic)
      verdict: chosen
      because: Only sums and products are used, and each reduced product is below (2·10^9)² = 4·10^18,
        inside long long.
    property_check: Theorem 0.4.4 says reducing each factor and each partial sum modulo m does not change
      the result modulo m. Negative values are brought into [0, m) with (x % m + m) % m first (Theorem
      0.4.1). Both factors are below m ≤ 2·10^9, so their product is below 4·10^18 ≤ 9.2·10^18.
    decision: Keep ans = (ans + norm(a) · norm(b)) % m, with norm(x) = (x % m + m) % m.
  examples:
    positive:
    - inline:
        input: 123 · 456 modulo 7
        answer: '4'
        why: 123 mod 7 = 4 and 456 mod 7 = 1, so the answer is 4 · 1 mod 7 = 4; the exact product 56 088
          = 7 · 8012 + 4 agrees.
    - worked_example: ac-abc174_c
      why: Each term of 7, 77, 777, … is 10 times the previous plus 7, so only the remainder modulo K
        is kept, and the terms themselves never get big.
    negative:
    - inline:
        input: (10 / 2) modulo 6, computed as (10 mod 6) / 2
        answer: '5'
        method_gives: '2'
        why: Division is not covered by the rule. The quotient 10 / 2 = 5 is exact and must be computed
          before reducing; reducing 10 first changes it to 4, and 4 / 2 = 2.
      correct_tool:
        topic: '0.1'
        card: overflow-64bit
    - inline:
        input: (3 − 5) modulo 7 as a value in [0, 7), computed as (3 − 5) % 7
        answer: '5'
        method_gives: '-2'
        why: C++ gives a negative remainder for a negative number. Adding m before the final % gives (−2
          + 7) % 7 = 5.
      correct_tool:
        topic: '0.4'
        card: mod-arithmetic-basic
  lookalikes:
  - description: The answer is a fraction p/q printed modulo a prime
    tool:
      topic: '0.4'
      card: divisibility
    flipping_difference: Division modulo m is not the remainder of a division, so this card does not apply;
      a question that only asks whether k divides a quantity stays a divisibility question.
  complexity: O(1) per operation, O(n) for n operations.
problems:
- id: cf-4A
  role: ladder
  card: parity
  rung: 1
  twist: Base case of the card
  summary: Can a watermelon of weight w (w ≤ 100) be split into two parts that both have even, positive
    weight?
  hints:
  - If both parts are even, what is the parity of their sum?
  - Even plus even is even, so w must be even (Theorem 0.4.3). Is every even w possible?
  - YES exactly when w is even and w > 2 (w = 2 would need a part of weight 0).
- id: cf-1367B
  role: ladder
  card: parity
  rung: 2
  twist: Count the misplaced elements of each parity; a swap fixes one of each kind.
  summary: 'For each of t tests: an array of n ≤ 40 numbers; with swaps of any two elements, make every
    position i have the parity of i; the fewest swaps or −1.'
  hints:
  - Which elements are in a wrong position, and what kinds of wrong are there?
  - x = odd values at even positions, y = even values at odd positions. A useful swap exchanges one of
    each kind, and no swap fixes two of the same kind.
  - If x = y the answer is x, else −1.
- id: cses-1092
  role: ladder
  card: parity
  rung: 3
  twist: Parity rules out half the inputs; for the rest, an explicit construction proves possibility.
  summary: Split the numbers 1, 2, …, n (n ≤ 10^6) into two sets with equal sums, and print them, or report
    that it is impossible.
  hints:
  - What must the total sum n(n + 1)/2 satisfy for two equal halves to exist?
  - It must be even. When it is, take numbers from n downwards into the first set while they fit into
    the remaining half; every remainder below the current number can still be made exactly.
  - If n(n + 1)/2 is odd print NO. Else set need = n(n + 1)/4 and for i = n down to 1 put i in set 1 when
    i ≤ need (need −= i), otherwise in set 2. Use long long and fast output.
- id: ac-abc125_d
  role: ladder
  card: parity
  rung: 4
  twist: The invariant is the parity of the number of negative values, under an operation that flips two
    signs.
  summary: An array of N integers (N ≤ 10^5, |A_i| ≤ 10^9); any number of times, multiply two adjacent
    elements by −1; the largest possible sum.
  hints:
  - What does one operation do to the number of negative values?
  - It changes it by −2, 0 or +2, so its parity never changes; and repeated operations can move a pair
    of minus signs anywhere, so any arrangement with that parity is reachable.
  - With an even count of negatives (zeros count as either sign), the answer is the sum of |A_i|; with
    an odd count, subtract 2·min|A_i|. Use long long.
- id: ac-abc101_b
  role: ladder
  card: divisibility
  rung: 1
  twist: Base case of the card
  summary: Does the digit sum S(N) divide N (N ≤ 10^9)?
  hints:
  - How do you get the digits of N one at a time?
  - N % 10 is the last digit and N / 10 removes it; repeat on a copy of N.
  - Compute S on a copy, then print Yes when N % S == 0.
- id: cses-1618
  role: ladder
  card: divisibility
  rung: 2
  twist: Count multiples of 5, 25, 125, … up to n instead of computing n!.
  summary: The number of trailing zeros of n! (n ≤ 10^9).
  hints:
  - A trailing zero comes from a factor 10 = 2·5. Which factor is rarer in n!?
  - 'Factors 5 are rarer, so count them: every multiple of 5 up to n gives one, every multiple of 25 one
    more, and so on (Theorem 0.4.2).'
  - Answer n/5 + n/25 + n/125 + … while the power of 5 is at most n; keep the power in long long.
- id: ac-abc182_c
  role: ladder
  card: divisibility
  rung: 3
  twist: Divisibility by 3 depends only on the digit sum modulo 3, so only remainders of digits matter.
  summary: Erase as few digits as possible from N (N < 10^18) so that the rest (at least one digit) is
    a multiple of 3; print the count or −1.
  hints:
  - When is a number a multiple of 3, in terms of its digits?
  - Exactly when its digit sum is (10 ≡ 1 modulo 3). With s = digit sum mod 3, you need to erase digits
    whose remainders add up to s modulo 3.
  - 's = 0: answer 0. Otherwise erase one digit with remainder s if one exists (1), else two digits with
    remainder 3 − s (2); answer −1 if that would erase every digit.'
- id: cses-1754
  role: ladder
  card: divisibility
  rung: 4
  twist: Divisibility gives a necessary condition, and a bound on the two piles completes it.
  summary: 'For each of t ≤ 10^5 tests: two piles of a and b coins (≤ 10^9); each move removes 1 from
    one pile and 2 from the other; can both become empty?'
  hints:
  - How many coins does every move remove in total?
  - Three, so a + b must be divisible by 3. Also the larger pile loses at most 2 per move while the smaller
    loses at least 1.
  - YES when (a + b) % 3 == 0 and max(a, b) ≤ 2·min(a, b); otherwise NO.
- id: cf-1360D
  role: ladder
  card: divisibility
  rung: 5
  twist: Search the divisors of n up to √n (topic 0.2) for the largest one not exceeding k.
  summary: 'For each of t tests: buy exactly n shovels (n, k ≤ 10^9) using packages of one size d ≤ k;
    the fewest packages.'
  hints:
  - If every package has d shovels and the total is exactly n, what must d be?
  - d must divide n and be at most k; the number of packages is n / d, so the largest such d is best.
  - Loop i from 1 while i·i ≤ n; for each divisor i, consider d = i and d = n / i when they are at most
    k; print n / (largest d).
- id: lc-find-greatest-common-divisor-of-array
  role: ladder
  card: gcd-lcm
  rung: 1
  twist: Base case of the card
  summary: The GCD of the smallest and the largest element of an array (length ≤ 1000).
  hints:
  - Which two numbers are involved?
  - Find the minimum and maximum, then apply Euclid (Theorem 0.4.5).
  - 'Return gcd(min, max), with the loop while b ≠ 0: (a, b) = (b, a % b), or std::gcd.'
- id: lc-greatest-common-divisor-of-strings
  role: ladder
  card: gcd-lcm
  rung: 2
  twist: The GCD appears in the lengths of strings, not in values.
  summary: The longest string x such that both str1 and str2 (lengths ≤ 1000) are copies of x repeated.
  hints:
  - If x repeats to make both strings, what must the length of x divide?
  - It must divide both lengths. A common repeating block exists exactly when str1 + str2 equals str2
    + str1.
  - If str1 + str2 ≠ str2 + str1 return ""; otherwise return the prefix of str1 of length gcd(len1, len2).
- id: ac-abc297_d
  role: ladder
  card: gcd-lcm
  rung: 3
  twist: 'Subtracting repeatedly is Euclid in slow motion: replace a run of subtractions by one division.'
  summary: Starting from A and B (≤ 10^18), repeatedly subtract the smaller from the larger until they
    are equal; how many subtractions?
  hints:
  - With A = 10^18 and B = 1 the process takes about 10^18 steps. What does a run of subtractions of B
    from A amount to?
  - Subtracting B from A while A > B is the same as replacing A by A mod B, except that it stops at B
    when B divides A.
  - 'While A ≠ B (say A > B): if A % B == 0 add A / B − 1 and stop; else add A / B and set A = A % B.
    O(log) rounds (Theorem 0.4.5).'
- id: ac-abc109_c
  role: ladder
  card: gcd-lcm
  rung: 4
  twist: Turn the question into the GCD of differences.
  summary: From position X, a walker can move ±D any number of times; find the largest D that lets it
    visit every city x_1..x_N (N ≤ 10^5, values ≤ 10^9).
  hints:
  - Which positions can the walker reach for a fixed D?
  - Exactly X + kD for integers k, so D must divide every |x_i − X|.
  - The answer is the GCD of all |x_i − X|, folded with Euclid from 0.
- id: ac-abc070_c
  role: ladder
  card: gcd-lcm
  rung: 5
  twist: 'The LCM of many large numbers: divide before multiplying to stay within long long.'
