drill:
- problem: cf-1516D
  answer:
    topic: '4.6'
    card: jump-up
  property: The first index where a block starting at i must end depends only on i (two pointers with
    the last occurrence of each prime); the answer for [l, r] is the number of jumps of this pointer that
    stay inside the range.
  why_others_fail: Splitting greedily from l for every question is O(n) per question; the pointer is a
    "one next place" rule, so the table of 2^j jumps answers each question in O(log n).
- problem: lc-lowest-common-ancestor-of-deepest-leaves
  answer:
    topic: '4.6'
    card: meeting-vertex
  property: 'The answer is the lowest vertex whose subtree contains all the deepest leaves: one pass returns
    (depth, vertex) for each subtree, and a vertex whose two sides have the same depth is the answer.'
  why_others_fail: A table for many questions is not needed (one question on at most 1000 nodes), and
    the lowest common ancestor of two vertices is not enough, since the deepest leaves can be many.
- problem: lc-find-all-possible-recipes-from-given-supplies
  answer:
    topic: '4.2'
    card: dependency-order
  property: A recipe can be made when all its ingredients exist; process in the order of "ingredient before
    recipe", counting the missing ingredients of each recipe (Kahn). Recipes on a cycle never reach zero
    missing.
  why_others_fail: Repeated passes over all recipes until nothing changes are slower and give no clear
    cycle rule; a depth-first search would need a visiting state for the cycles.
- problem: lc-find-minimum-time-to-reach-last-room-ii
  answer:
    topic: '4.3'
    card: extra-state
  property: The cost of a move depends on the parity of the number of moves made so far, so the state
    is (cell, parity), and Dijkstra runs over these states with the arrival time max(t, moveTime) + cost.
  why_others_fail: A plain Dijkstra over cells has one distance per cell and forgets which cost comes
    next.
- problem: lc-satisfiability-of-equality-equations
  answer:
    topic: '4.4'
    card: merge-groups
  property: Join the two sides of every "==" first; then every "!=" must have its two letters in different
    groups.
  why_others_fail: Checking the equations in the given order is wrong, because a later "==" can make an
    earlier "!=" false; a graph search for each "!=" is slower than two find calls.
- problem: cf-1209D
  answer:
    topic: '4.4'
    card: merge-groups
  property: Each guest is an edge between two flavours; in a group of s joined flavours at most s − 1
    guests can be happy, so the sad guests are the edges that close a cycle — the unions that find both
    flavours already in one group.
  why_others_fail: 'Simulating the orders of the guests is exponential; a spanning-tree argument is the
    same thing: the edges beyond a forest are the sad guests.'
- problem: ac-abc270_c
  answer:
    topic: '4.5'
    card: depths-parents
  property: Root the tree at X; then the path from Y to X is found by following parents from Y, and printing
    it reversed.
  why_others_fail: Searching for all simple paths between X and Y is pointless in a tree; one walk from
    X with parents is enough, and a recursive walk can overflow the stack for a chain of 2·10^5.
- problem: lc-reorder-routes-to-make-all-paths-lead-to-the-city-zero
  answer:
    topic: '4.5'
    card: depths-parents
  property: Walk the tree from city 0, remembering for every road in which direction it was given; every
    road met going away from 0 that points away from 0 has to be turned.
  why_others_fail: Trying subsets of roads is exponential; the walk away from city 0 sees each road once,
    from its upper end.
- problem: lc-maximum-score-after-applying-operations-on-a-tree
  answer:
    topic: '4.5'
    card: subtree-values
  property: 'Keep at least one value on every path from the root to a leaf: keep(v) = values[v] for a
    leaf, else the smaller of values[v] and the sum of keep over the children; the answer is the total
    minus keep(root) — combine children before parents.'
  why_others_fail: Choosing nodes to take one by one with a greedy rule fails, as an early choice can
    empty a whole path; the answer is a value built from the subtrees.
lookalike_pairs:
- a: cses-1687
  b: cses-1688
  a_tool:
    topic: '4.6'
    card: jump-up
  b_tool:
    topic: '4.6'
    card: meeting-vertex
  shared_surface: Both give the same company tree of n ≤ 2·10^5 employees and q ≤ 2·10^5 questions about
    bosses.
  flipping_difference: 'In A the number of levels k is given: jump up by the bits of k. In B no number
    is given and the place where the two chains of bosses meet must be found: lift the deeper one, then
    jump both while their bosses differ.'
  flipping_input: 'Employees 2 and 3 are both directly under employee 1. A with (x = 3, k = 1): the answer
    is 1. B with (a = 2, b = 3): the answer is 1 as well, but it comes from comparing the two chains,
    not from a number of levels.'
- a: lc-number-of-ways-to-assign-edge-weights-i
  b: lc-number-of-ways-to-assign-edge-weights-ii
  a_tool:
    topic: '4.5'
    card: depths-parents
  b_tool:
    topic: '4.6'
    card: tree-distance
  shared_surface: Both use the same tree with edge weights 1 or 2 and ask for the number of assignments
    with an odd total on a path; the formula 2^(length − 1) is the same.
  flipping_difference: In A the path always starts at the root, so its length is one depth from a single
    walk. In B the path joins any two nodes, so its length is depth[u] + depth[v] − 2 · depth[lca], and
    the lowest common ancestor is needed.
  flipping_input: 'The chain 1–2–3. A: the deepest node is 3 at depth 2, answer 2^1 = 2. B with the query
    (2, 3): the path is one edge, answer 2^0 = 1; adding the depths 1 + 2 = 3 instead of 3 − 2·1 would
    give 4, which is wrong.'
self_test:
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1. What are the depth of vertex 7 and the entries up[0][7], up[1][7], up[2][7] of the table of
    Theorem 4.6.1 (0 means "none")? What is the 3rd ancestor of 7, and the 4th?'
  a: 'The depth of 7 is 3 (7 → 6 → 3 → 1). up[0][7] = 6, up[1][7] = up[0][6] = 3, up[2][7] = up[1][3]
    = up[0][1] = 0. The 3rd ancestor: 3 = 1 + 2, so bit 0 gives up[0][7] = 6 and bit 1 gives up[1][6]
    = 1, so the answer is vertex 1. The 4th ancestor does not exist, since 4 is larger than the depth
    3: the answer is 0 (none).'
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1. Follow the algorithm of Theorem 4.6.2 for the vertices 4 and 7: what is lifted first, which
    jumps are made in the second phase, and what is returned?'
  a: 'Depth 4 is 2 and depth 7 is 3, so 7 is lifted by 1 to vertex 6. The vertices 4 and 6 differ. Level
    1: up[1][4] = 1 and up[1][6] = 1 are equal, so no jump. Level 0: up[0][4] = 2 and up[0][6] = 3 differ,
    so 4 → 2 and 6 → 3. Now the parents are equal, and the answer is up[0][2] = 1.'
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1. Why does the second phase test "up[j][a] != up[j][b]" and not "up[j][a] != 0"? Use the vertices
    4 and 5.'
  a: 'The test must stop the jump at the place just below the meeting point. For 4 and 5 (both children
    of 2), level 1 gives up[1][4] = up[1][5] = 1: they are equal, so no jump, and the answer is the parent
    2. With the test "!= 0" both would jump to vertex 1 and the program would answer 1, a common ancestor
    but not the lowest one.'
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1. What is the distance between 5 and 7? And with the edge lengths 5, 3, 7, 2, 4, 6 for the edges
    from the vertices 2, 3, 4, 5, 6, 7 to their parents, what is the weighted distance between 4 and 7?'
  a: The lowest common ancestor of 5 and 7 is 1 (depth 0), so the distance is 2 + 3 − 0 = 5 edges. For
    4 and 7 the weighted depths are wd[4] = 5 + 7 = 12 and wd[7] = 3 + 4 + 6 = 13, the lowest common ancestor
    is 1 with wd = 0, so the distance is 12 + 13 = 25 (the path 4–2–1–3–6–7 has the lengths 7 + 5 + 3
    + 4 + 6 = 25).
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1, with the lengths 5, 3, 7, 2, 4, 6 on the edges to the parents of 2, 3, 4, 5, 6, 7. What is the
    smallest length on the path from 7 to 4, and which parts of the answer come from the lift and from
    the second phase of Theorem 4.6.4?'
  a: 'The path 7–6–3–1–2–4 has the lengths 6, 4, 3, 5, 7, so the smallest is 3. The lift moves 7 to 6
    and collects 6. In the second phase no jump of level 1 is made; at level 0 the pair (6, 4) is lifted
    to (3, 2), collecting 4 and 7. The last two edges, from 3 and from 2 to their parent, are added at
    the end: 3 and 5. The minimum of 6, 4, 7, 3, 5 is 3.'
- q: 'The tree with the vertices 1..7 and the parents (vertex: parent) 2:1, 3:1, 4:2, 5:2, 6:3, 7:6, rooted
    at 1. The trips are 4 → 5 and 4 → 7. Which marks do you write by Theorem 4.6.5, and how many trips
    use each edge?'
  a: 'Trip 4 → 5: +1 at 4, +1 at 5, −2 at their lowest common ancestor 2. Trip 4 → 7: +1 at 4, +1 at 7,
    −2 at the lowest common ancestor 1. The marks: 4: 2, 5: 1, 7: 1, 2: −2, 1: −2. The subtree sums give
    the edge counts (edge from the vertex to its parent): 4 → 2: 2, 5 → 2: 1, 2 → 1: 1, 3 → 1: 1, 6 →
    3: 1, 7 → 6: 1. The first trip uses the edges of 4 and 5; the second uses 4, 2, 3, 6, 7.'
- q: You must answer one lowest common ancestor question on a binary tree with 10^5 nodes, once. Is a
    lifting table worth building? What would change for 10^5 questions on the same tree?
  a: 'No: one question can be answered by one pass over the tree (return the node when it is one of the
    two, combine the two sides), in O(n). The table costs O(n log n) to build and pays back only when
    there are many questions: with 10^5 questions each one takes about 2 · 17 steps instead of O(n).'
checkpoint:
  time_limit_minutes: 120
  problems:
  - cf-1702G2
  - cses-1136
  - ac-abc133_f
decision_map:
- weak_signal: One next place for every item (a parent, a teleporter, a next block) and a number of steps
    that is far too large to follow, asked many times.
  choose: jump-up
  when: 'The next item depends only on the current item (Theorem 4.6.1): build the table of 2^j steps
    and use the bits of k.'
  over:
  - card: state-graph
    because: If the next place depends on the step number or on a choice, the state must carry that extra
      information first.
    topic: '4.1'
  - card: directed-cycle
    because: If only a yes or no about a cycle is asked, no table is needed.
    topic: '4.2'
- weak_signal: The place where two chains of bosses meet; the lowest common boss of two vertices; a query
    on a tree about two vertices a and b.
  choose: meeting-vertex
  when: 'The tree is fixed and rooted and there are many questions: lift the deeper vertex, then jump
    both while the ancestors differ (Theorem 4.6.2).'
  over:
  - card: depths-parents
    because: If only depths or parents are asked, one walk is enough and no table is needed.
    topic: '4.5'
  - card: subtree-ranges
    because: If the question is only whether one vertex is above the other, the ranges of the visit order
      answer it in constant time.
    topic: '4.5'
- weak_signal: The distance between two vertices of a tree, for many pairs; the length or number of edges
    on the path between a and b.
  choose: tree-distance
  when: 'The graph is a tree: depth[a] + depth[b] − 2 · depth[lca] (Theorem 4.6.3), with weighted depths
    for weighted edges.'
  over:
  - card: unweighted-shortest
    because: If the graph has cycles, the tree formula is wrong; use the walk from a start vertex.
    topic: '4.1'
  - card: every-pair
    because: If the graph is small and has cycles with weights, all pairs of distances can be computed
      at once.
    topic: '4.3'
- weak_signal: The smallest, largest or sum of the weights on the path between two vertices of a tree,
    for many pairs.
  choose: path-values
  when: Store the aggregate for each jump of the table and combine the pieces along the lift and the second
    phase (Theorem 4.6.4).
  over:
  - card: largest-edge
    because: If the graph has cycles and the best path is asked, first build the spanning tree of the
      Kruskal order.
    topic: '4.4'
  - card: subtree-values
    because: If the value is a sum from the root, a prefix from the root minus the prefix at the lowest
      common ancestor is enough.
    topic: '4.5'
- weak_signal: Many trips on a tree, and how many use each edge or vertex; all the trips are known in
    advance.
  choose: path-counts
  when: Write +1 at both ends and −2 at the lowest common ancestor, then take subtree sums once (Theorem
    4.6.5).
  over:
  - card: subtree-values
    because: If there is no path, just a value per vertex combined from the children, the sums need no
      lowest common ancestor.
    topic: '4.5'
  - card: meeting-vertex
    because: If the trips come one at a time and are answered at once, the lowest common ancestor of each
      is enough.
glossary_added:
- k-th ancestor
- lowest common ancestor
- binary lifting
- weighted depth
