decision_map:
- weak_signal: 'A hidden number, position or threshold to find with a limit of about $\log_2 n$ questions'
  choose: halving
  when: 'Every reply is monotone in the probe and the budget is at least $\lceil \log_2 n \rceil$ (Theorem 1.8.1).'
  over:
  - card: answer-search
    topic: '1.4'
    because: 'The check is code of ours and costs time, not a question from a counted budget.'
  - card: enumerate-answer
    topic: '0.5'
    because: 'Trying every candidate is possible only when the number of questions allowed is about n.'
- weak_signal: 'Questions that read one number or give the position of an extreme value, and a local minimum, a peak or a sign change to find'
  choose: compare-halving
  when: 'One comparison of two numbers at the middle restores an invariant at the ends of half of the range (Theorem 1.8.2).'
  over:
  - card: sorted-search
    topic: '1.4'
    because: 'The array is given and reads are free: the same template without a budget.'
  - card: halving
    because: 'The reply is a value to compare, not a yes or no for a threshold.'
- weak_signal: 'Few questions whose replies are sums, xors, products or distances of hidden values, or a design of questions fixed in advance'
  choose: equation-queries
  when: 'The replies give as many independent equations as there are unknowns (Theorem 1.8.3).'
  over:
  - card: range-sum
    topic: '1.2'
    because: 'The numbers are given in the input, so the sums are computed, not solved.'
  - card: xor-identities
    topic: '1.7'
    because: 'Xor replies alone cannot fix the numbers; one reply of another kind or a known number is needed first.'
