# Patterns for topic 1.8 (Interactive problems). Provisional until the lesson maps them to Recognition Cards.
topic: "1.8"
patterns:
  - id: halving
    name: Halving under a query budget
    description: The hidden number or position lies in a range and a question gives a reply that is monotone in the probe (a yes or no, a count, a three-way answer); binary search finds it in ceil(log2 n) questions.
    precondition: Every reply says on which side of the probe the answer lies, so each question can drop half of the range, and the budget is at least ceil(log2 n).
  - id: compare-halving
    name: Halving with comparison replies
    description: The questions compare two neighbouring values or ask for the position of an extreme value of a range; the reply keeps a range that must contain a local minimum, a peak, a sign change or the largest value.
    precondition: A kept range has an invariant that holds at its ends (the left neighbour is larger and the right neighbour is smaller, or the largest value is inside), and one comparison restores it for half the range.
  - id: equation-queries
    name: Replies that are equations
    description: Each reply is a sum, an xor, a product, a distance or a bit of a few hidden values; a fixed small set of questions fixes all the values, or a design of questions makes every answer single.
    precondition: The replies form as many independent equations as there are unknowns, or each question settles one new unknown.
  - id: any-reply
    name: A strategy that works against every reply
    description: A game or a task in which the judge is adaptive; the strategy keeps an invariant (a pairing, a parity, a sorted order) that holds after every possible move of the judge.
    precondition: For every reply the judge may give, the invariant can be restored by one move of ours.
  - id: budget-walk
    name: A budget that forces a walk instead of a search
    description: The questions are free to repeat but their number is counted, and the structure is monotone in two directions, so two pointers use at most a linear number of questions.
    precondition: Each question moves one of two pointers and neither pointer moves back.
