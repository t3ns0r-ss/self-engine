drill:
- problem: cf-425D
  answer:
    topic: '5.4'
    card: threshold-split
  property: 'A column with many points is rare (few columns hold more than √n points) and a column with
    few points has few pairs: enumerate the pairs of points in a light column and, for a heavy column,
    enumerate the points of the other columns.'
  why_others_fail: Checking all pairs of points is 10^10 steps, and no tree or table answers a question
    about squares; the split by the size of a column is what bounds the work.
- problem: cf-343D
  answer:
    topic: '5.3'
    card: lazy-range-update
  property: In the order of an Euler tour a subtree is a range; time stamps turn "fill" into a range assignment
    of a time and "empty" into a point change, and a vertex is full if its fill time is later than its
    empty time.
  why_others_fail: Blocks also work, but the operations compose as time stamps, so a lazy tree does everything
    in O(log n) with less code.
- problem: cf-369E
  answer:
    topic: '5.2'
    card: offline-sweep-count
  property: A segment contains none of the points exactly when it lies inside a gap between two neighbouring
    points, so the answer is n minus the sum over gaps of the number of segments inside the gap, counted
    offline with a Fenwick tree.
  why_others_fail: The questions are offline, which suggests Mo's algorithm, but a window over the segments
    does not have a cheap step; the sweep over sorted gaps does.
- problem: ac-abc403_g
  answer:
    topic: '5.3'
    card: custom-node
  property: A node of a tree over the value range keeps the count and the sums of the elements at odd
    and at even places inside it; two nodes join by a parity rule, and the tree is created on demand.
  why_others_fail: The queries are online, so Mo's algorithm cannot reorder them; blocks over the sorted
    values need the values in advance.
- problem: ac-abc157_e
  answer:
    topic: '5.2'
    card: updates-and-range-sums
  property: 'There are only 26 letters: one Fenwick tree of counts per letter (or a segment tree of 26-bit
    masks) answers a range with 26 prefix queries and changes with two updates.'
  why_others_fail: Mo's algorithm does not allow changes between the questions; blocks work but are longer
    than 26 trees.
- problem: cf-641E
  answer:
    topic: '5.2'
    card: offline-sweep-count
  property: 'Group the operations by the value x, keeping their input order; for each group compress the
    time stamps and use a Fenwick tree over time: add and remove are ±1, a question is a prefix sum.'
  why_others_fail: The operations are given out of order of time, which looks like a job for Mo's algorithm,
    but the question is a count at a point of time inside one value, which one tree per value answers.
- problem: cf-755D
  answer:
    topic: '5.2'
    card: updates-and-range-sums
  property: A new chord adds 1 plus the number of earlier chords it crosses; the crossings are the marked
    chord ends strictly inside its arc, which a Fenwick tree over the vertices counts.
  why_others_fail: The range is the arc of the chord and the marks change with every chord; blocks give
    the same answer in O(√n) per chord but are slower than a tree.
- problem: cf-961E
  answer:
    topic: '5.2'
    card: offline-sweep-count
  property: Cap each a_i at n; sweep x upward, keep every position y with a_y ≥ x in a Fenwick tree (remove
    y when x passes a_y), and add the count of positions in (x, a_x].
  why_others_fail: The cap a_i ≤ n invites a threshold split, but the sweep with a tree is a single pass
    of O(n log n) steps.
lookalike_pairs:
- a: ac-abc242_g
  b: cf-522D
  a_tool:
    topic: '5.4'
    card: mo-offline
  b_tool:
    topic: '5.3'
    card: point-update-range-query
  shared_surface: Both ask a question about the equal elements inside a range of an array, for up to 10^6
    and 5·10^5 ranges known in advance.
  flipping_difference: In Range Pairing Query the answer is a sum over the colours of a quantity that
    changes by 0 or 1 when one element enters the window, so Mo's algorithm moves the window in O(1) steps.
    In Closest Equals the answer is a minimum, which cannot be undone when an element leaves the window;
    instead the questions are sorted by the right end, the distance to the previous equal element is stored
    at its left position, and a tree answers the minimum over positions at least l.
  flipping_input: 'a = [5, 3, 5, 3, 5]. Range 1..5: 5 occurs 3 times and 3 occurs twice, so the largest
    number of disjoint pairs is 1 + 1 = 2. The smallest distance between two equal elements is 2 (positions
    1 and 3), and it does not change when the range is shortened from the left to 2..5: then it is the
    distance 2 between positions 2 and 4; a removal cannot tell what the new minimum is without the stored
    distances.'
- a: ac-abc293_g
  b: cf-301D
  a_tool:
    topic: '5.4'
    card: mo-offline
  b_tool:
    topic: '5.2'
    card: offline-sweep-count
  shared_surface: Both count tuples of positions inside a range that satisfy a condition, for up to 2·10^5
    ranges known in advance.
  flipping_difference: In Triple Index the tuples are three equal values, and one element entering the
    window changes the count by C(c, 2), so Mo's algorithm works. In Yaroslav and Divisors the pairs are
    positions whose values divide one another; there are only about n ln n such pairs in all, so each
    pair becomes a segment, and counting the segments that lie inside the range is an offline sweep with
    a Fenwick tree. The window of Mo would have to add all pairs of a new element at once.
  flipping_input: 'Values 1 1 1 1: the triples of equal values in the range 1..4 number C(4, 3) = 4, and
    adding a fourth copy to a window with 3 copies adds C(3, 2) = 3. For the permutation 2 1 4 3 the divisor
    pairs (1 divides 2, 1 divides 4, 2 divides 4) become the segments [1,2], [2,3], [1,3] of positions,
    and a range counts those inside it.'
self_test:
- q: The array has n = 10 positions and the block size is 3. For the range [1, 7], which positions are
    handled one by one and which blocks as a whole?
  a: The blocks are 0..2, 3..5, 6..8 and 9..9. The range cuts the block 0 (positions 1 and 2 are single
    positions), covers the block 1 (3..5) entirely, and cuts the block 2 (positions 6 and 7 are single
    positions). So 4 positions are handled one by one and 1 block as a whole.
- q: For n = q = 2·10^5 and blocks of 450 positions, about how many steps does one range operation take
    at most, and how many all together?
  a: 'At most 2 · 449 positions in the two partial blocks plus ⌈2·10^5 / 450⌉ = 445 whole blocks: about
    1345 steps. For 2·10^5 operations that is about 2.7·10^8 steps, which is why blocks are used only
    when a tree does not fit.'
- q: n = 9 and the questions (0,2), (4,8), (1,5), (3,3). Give the block size of Mo's order, the order
    of the questions, and the number of steps the window makes from the empty window.
  a: 'B = ⌊9 / √4⌋ = 4. The blocks of the left ends are 0, 1, 0, 0. Block 0 (even) is sorted by r ascending:
    (0,2), (3,3), (1,5); block 1 holds (4,8). The order is the questions 0, 3, 2, 1. The steps are 3,
    then 4, then 4, then 6, in all 17.'
- q: The window holds the values 2, 2, 3, 2 and the number of equal pairs is 3. What happens to the count
    when another 2 enters, and when the 3 leaves?
  a: 'A 2 enters with count 3 in the window, so it makes 3 new pairs: the count becomes 6 (four 2s make
    C(4, 2) = 6 pairs). The 3 leaves: its count goes from 1 to 0 and the pairs lost are that count after
    the decrease, 0: nothing changes.'
- q: The window is [0, 1] and the next question is [5, 6]. Why does Mo's algorithm grow the window before
    it shrinks it? What goes wrong if the left end is moved first?
  a: 'If the left end moves first it passes the right end and removes the positions 2, 3, 4, which were
    never added: the counts become negative, and for the number of different values the answers are wrong.
    Growing first adds 2..6 before the positions 0..4 are removed, so only positions that are in the window
    are removed.'
- q: For a = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3] and the step 2, T_2[5] is the sum along 5, 7, 9. What is it?
    And what is the sum from position 0 with step 4, with the threshold 3?
  a: 'T_2[5] = a_5 + a_7 + a_9 = 9 + 6 + 3 = 18. Step 4 is not below the threshold, so it is walked: positions
    0, 4, 8 hold 3, 5, 5 and the sum is 13.'
- q: How many different values x can occur at least x times in an array of n = 5050 numbers? Is the bound
    reached?
  a: 'The values are different, so their sizes add up to at least 1 + 2 + ... + m = m(m + 1)/2, and this
    is at most n: m(m + 1)/2 ≤ 5050 gives m ≤ 100. It is reached by the array in which every x from 1
    to 100 occurs exactly x times (1 + 2 + ... + 100 = 5050).'
checkpoint:
  time_limit_minutes: 150
  problems:
  - cf-617E
  - cf-438D
  - cf-830C
decision_map:
- weak_signal: 'Range operations or questions where a tree does not fit: the effect on a block is simple,
    but a tag would not compose, or the block needs a sorted copy'
  choose: sqrt-blocks
  when: A block of about √n positions can be changed or read as a whole in one step and the ends are done
    one by one (Theorems 5.4.1 and 5.4.2).
  over:
  - card: lazy-range-update
    topic: '5.3'
    because: If the effect composes as a tag and the node is small, a lazy tree does it in O(log n) steps.
  - card: updates-and-range-sums
    topic: '5.2'
    because: If the question is a sum with single changes, a Fenwick tree is shorter.
  - card: nested-loops
    topic: '0.5'
    because: Scanning the range for each operation is O(nq).
- weak_signal: Many questions about ranges of an array that never changes, all known in advance, where
    adding or removing one element repairs the answer in O(1) (distinct values, sums of squares of counts,
    pairs)
  choose: mo-offline
  when: The answer of a window is repaired in constant time when one end moves one step (Theorem 5.4.4);
    order the questions as Theorem 5.4.3 and move the window.
  over:
  - card: offline-sweep-count
    topic: '5.2'
    because: If one mark per value is enough (distinct values), the sweep with a Fenwick tree is O((n
      + q) log n).
  - card: idempotent-range-query
    topic: '5.1'
    because: If the answer comes from the answers of the halves, a table or a tree does it with no order
      of questions.
  - card: nested-loops
    topic: '0.5'
    because: If the array changes between the questions, recount (for small n and q).
- weak_signal: A parameter of the question (a step, a count, a size) is either large, so that few steps
    or few items are involved, or small, so that all small cases can be precomputed together
  choose: threshold-split
  when: 'Both sides cost about √n at the threshold (Theorems 5.4.5 and 5.4.6): walk or enumerate the large
    side, tabulate or count the small side.'
  over:
  - card: range-sum
    topic: '1.2'
    because: If the step is always the same, one array of prefix sums answers every question.
  - card: sqrt-blocks
    topic: '5.4'
    because: If the structure is over ranges of positions, not over a parameter, blocks apply.
  - card: nested-loops
    topic: '0.5'
    because: If n is small (at most a few thousand), plain loops are enough.
