drill:
- problem: cf-1276B
  answer:
    topic: '4.1'
    card: components
  property: Remove the first fair and search from the second to find the towns that can no longer be reached
    from it, then do the same with the fairs swapped; the answer is the product of the two counts.
  why_others_fail: 'Looking for all articulation points and block structure is more than needed: only
    two towns are fixed, and two blocked searches (O(n + m)) count the pairs directly.'
- problem: lc-disconnect-path-in-a-binary-matrix-by-at-most-one-flip
  answer:
    topic: '4.1'
    card: grid-graph
  property: Moves are only right and down, so every route crosses each anti-diagonal once; mark the cells
    reachable from the start and those that reach the end, and a cell that is the only marked cell on
    its anti-diagonal blocks every route.
  why_others_fail: The cells form a graph with cycles in the undirected sense, but the moves are one-way
    and monotone; articulation points of the undirected cells are the wrong question.
- problem: lc-maximum-number-of-fish-in-a-grid
  answer:
    topic: '4.1'
    card: grid-graph
  property: Each group of connected water cells is a component of the grid graph; a flood fill from every
    unvisited water cell sums the fish.
  why_others_fail: 'No directions and no removed cells appear: plain connected pieces are the whole question.'
- problem: ac-abc308_d
  answer:
    topic: '4.1'
    card: grid-graph
  property: The letter of a cell fixes its place in the cycle s, n, u, k, e, so a move is allowed exactly
    when the next cell holds the following letter; a breadth-first search over the cells decides.
  why_others_fail: The moves depend on the letters only, so the cells are the states; there is no cycle
    structure to exploit.
- problem: cf-1263D
  answer:
    topic: '4.4'
    card: merge-groups
  property: Union the letters of each password into one group; the answer is the number of distinct groups
    among the letters that appear.
  why_others_fail: A graph over passwords would be quadratic; the 26 letters are the vertices, and one
    union per password is enough.
- problem: lc-regions-cut-by-slashes
  answer:
    topic: '4.4'
    card: merge-groups
  property: Split each cell into four triangles, join the triangles that the characters leave connected
    and the triangles of neighbouring cells that touch, and count the groups.
  why_others_fail: The regions are not given as a graph; modelling them as one is the work, then a union
    structure counts the pieces.
- problem: cf-1131F
  answer:
    topic: '4.4'
    card: merge-groups
  property: Keep a list with each group (its head and tail); joining two groups appends one list to the
    other in constant time, and the final list is a valid arrangement.
  why_others_fail: Moving the elements of the smaller group on every merge is too slow for the worst orders;
    the lists make each join O(1).
- problem: lc-count-pairs-of-connectable-servers-in-a-weighted-tree-network
  answer:
    topic: '4.5'
    card: depths-parents
  property: For each centre, walk each branch from it, count the vertices whose distance from the centre
    is divisible by the speed, and combine the counts of different branches by the sum of products.
  why_others_fail: The tree is small (n ≤ 1000), so a walk for every centre is enough; no table over pairs
    is needed.
lookalike_pairs:
- a: cses-2076
  b: cses-2077
  a_tool:
    topic: '4.7'
    card: bridges
  b_tool:
    topic: '4.7'
    card: cut-vertices
  shared_surface: Both give the same connected network of n ≤ 10^5 cities and m ≤ 2·10^5 roads and ask
    for the "necessary" ones.
  flipping_difference: In A a road is removed, and the test is low[v] > tin[parent]. In B a city is removed
    with its roads, and the test is low[child] ≥ tin[v] for a city that is not the first of the walk,
    and at least two children for the first.
  flipping_input: 'The path 1–2–3. A: both roads are necessary (2 roads). B: only city 2 is necessary
    (1 city), since removing an end city leaves the other two connected.'
- a: cf-711D
  b: cf-659E
  a_tool:
    topic: '4.7'
    card: mutual-reach
  b_tool:
    topic: '4.4'
    card: merge-groups
  shared_surface: Both give n towns and roads and ask for a choice of directions for the roads, where
    cycles decide the answer.
  flipping_difference: 'In A every town already has one outgoing road, so the groups of towns that reach
    each other are exactly the cycles, and each cycle of length L gives 2^L − 2 good patterns. In B the
    roads are undirected and only one fact per connected piece matters: whether it contains a cycle, which
    a union structure tells by counting the roads against the towns.'
  flipping_input: 'A piece with the three towns 1, 2, 3 and the roads 1–2, 2–3, 3–1. A: the roads 1→2,
    2→3, 3→1 form one cycle of length 3, giving 2^3 − 2 = 6 patterns. B: the piece has a cycle (3 roads
    for 3 towns), so every town can be entered, and it adds 0 to the answer; the piece 1–2–3 with only
    two roads would add 1.'
self_test:
- q: Take the undirected roads 1–2, 2–3, 3–1, 3–4, 4–5, 5–6, 6–4 (two triangles joined by the road 3–4),
    listed in this order, and the walk of Theorem 4.7.1 from vertex 1 (the neighbours in the order of
    the roads). What are tin and low of the six vertices?
  a: The walk meets 1, 2, 3, 4, 5, 6 in this order, so tin = 0, 1, 2, 3, 4, 5. The back edges are 3–1
    (from 3 up to 1) and 6–4 (from 6 up to 4). So low[3] = 0, low[2] = 0, low[1] = 0, and low[6] = 3,
    low[5] = 3, low[4] = 3.
- q: 'For the same walk: which roads are bridges and which vertices are articulation points? Apply Theorems
    4.7.2 and 4.7.3 and name the numbers you compare.'
  a: 'The tree edge 3–4 has low[4] = 3 > tin[3] = 2: a bridge. The tree edges 1–2, 2–3, 4–5, 5–6 have
    low ≤ tin of the parent (0 ≤ 0, 0 ≤ 1, 3 ≤ 3, 3 ≤ 4): not bridges. Articulation points: vertex 3 has
    the child 4 with low[4] = 3 ≥ tin[3] = 2, and vertex 4 has the child 5 with low[5] = 3 ≥ tin[4] =
    3. Vertex 2 has the child 3 with low[3] = 0 < 1: not one. Vertex 1 is the first of the walk and has
    the single child 2: not one. So the bridge is 3–4 and the articulation points are 3 and 4.'
- q: For the same network, how many pieces do the other towns fall into when town 1, 3 or 4 fails? Why
    does the first town need a different rule?
  a: 'Town 1 is the first of the walk and has one child (2), so one piece. Town 3 has the child 4 with
    low ≥ tin[3]: the part outside its subtree ({1, 2}) is one piece and the subtree of 4 another: 2 pieces.
    Town 4 has the child 5 with low[5] = 3 ≥ tin[4]: pieces {1, 2, 3} and {5, 6}: 2. The first town has
    no part above it, so the rule ''the part above is one piece, plus the cut children'' would count one
    piece too many; for it each child subtree is a piece, and a back edge to something above cannot exist.'
- q: 'The directed graph on the vertices 1..6 with the roads 1→2, 2→3, 3→1, 3→4, 4→5, 5→6, 6→4 (the undirected
    version has the roads 1–2, 2–3, 3–1, 3–4, 4–5, 5–6, 6–4, in this order of numbers 0 to 6). Run Kosaraju''s
    method: what is the finishing order of the first pass (the neighbours in the order of the roads),
    which walk on the reversed graph starts first, and what are the groups?'
  a: 'The first walk from 1 goes 1 → 2 → 3 → 4 → 5 → 6 (the roads 3→1 and 6→4 lead to seen vertices),
    so the vertices finish in the order 6, 5, 4, 3, 2, 1. The second pass starts from the vertex that
    finished last, 1: on the reversed roads it reaches 3 (from the road 3→1) and then 2, so the first
    group is {1, 2, 3}. The next unseen vertex from the end of the list is 4: the reversed roads reach
    6 (from 6→4) and 5, so the second group is {4, 5, 6}. The road 3→4 goes from group 1 to group 2, as
    Theorem 4.7.5 says.'
- q: 'For the same directed network: which group is the only source, which vertices reach all vertices,
    and what is the fewest number of towns to start couriers from? Then add the road 4→1: what changes?'
  a: 'The group {1, 2, 3} has no road entering it from another group, so it is the only source; the vertices
    1, 2 and 3 reach all six vertices, while the vertices 4, 5 and 6 do not (they cannot reach 1). One
    courier town is enough (any of 1, 2, 3). After adding 4→1, the group {4, 5, 6} can reach {1, 2, 3}
    too, and the two groups merge into one: every vertex reaches every vertex, and the answer is still
    1 courier.'
- q: Can the undirected roads 1–2, 2–3, 3–1, 3–4, 4–5, 5–6, 6–4 be made one-way so that one can drive
    from any town to any other? And if the road 1–6 is added?
  a: 'No: the road 3–4 is a bridge. Whatever its direction, the towns on one side cannot reach the towns
    on the other side, or the reverse (Theorem 4.7.4 (c) needs no bridge). With the road 1–6 added, the
    cycle 1–3–4–6–1 goes through 3–4, so no road is a bridge, and the walk''s orientation (tree edges
    downwards, other roads upwards) is strongly connected.'
- q: A directed graph has the roads 1→2, 3→2 and 2→4. How many guides are needed at least so that every
    stop is reached from some guide, and why is the group of stop 2 not a source?
  a: 'The groups are single vertices. The vertices 1 and 3 have no road entering them, so they are the
    two sources and each needs a guide: 2 guides. Stop 2 is entered by the roads from 1 and from 3, so
    its group is not a source: it is reached from the guides at 1 and 3 (Theorem 4.7.6).'
checkpoint:
  time_limit_minutes: 120
  problems:
  - cf-1000E
  - cf-949C
  - cf-1900E
decision_map:
- weak_signal: One-way roads and a question about groups of places that can all reach each other, or about
    whether everything can reach everything.
  choose: mutual-reach
  when: Label the groups with the two walks of Theorem 4.7.5 and use the labels.
  over:
  - card: components
    because: If the roads are two-way, the groups are the plain connected pieces and one search per piece
      is enough.
    topic: '4.1'
  - card: directed-cycle
    because: If only one cycle must be found and printed, the walk with vertex states does it directly.
    topic: '4.2'
- weak_signal: One-way roads and a question about places to start from, about reaching everything from
    one place, or about two places where one cannot reach the other.
  choose: condensed-dag
  when: Label the groups, mark the groups that have a road entering from another group, and reason about
    the unmarked ones (Theorem 4.7.6).
  over:
  - card: unweighted-shortest
    because: If the number of steps is asked, the groups forget the distances; use a breadth-first search.
    topic: '4.1'
  - card: mutual-reach
    because: If only the groups themselves are asked, the labels are the whole answer.
- weak_signal: Two-way roads and a question about which roads, or how many, disconnect the network when
    lost.
  choose: bridges
  when: 'One walk with entry times and low-link values: the tree edge to a vertex v is a bridge when low[v]
    > tin[parent] (Theorem 4.7.2).'
  over:
  - card: reverse-time
    because: If the roads disappear one after another and the pieces are counted each time, reverse the
      time and use the union structure.
    topic: '4.4'
  - card: unweighted-shortest
    because: If the question is about longer routes and not about disconnection, a search after each removal
      is needed.
    topic: '4.1'
- weak_signal: Two-way roads and a question about which towns, or how many, split the rest of the network
    when they fail.
  choose: cut-vertices
  when: The same walk with the test low[child] ≥ tin[v], and the two-children rule for the first town
    (Theorem 4.7.3).
  over:
  - card: bridges
    because: If roads and not towns are removed, the test is strict and has no special first town.
  - card: components
    because: If only the pieces of the graph as it is are asked, no removal is involved.
    topic: '4.1'
- weak_signal: Two-way roads where the groups that survive any one road loss matter, or the roads must
    all be made one-way and keep everything reachable.
  choose: bridge-tree
  when: Label the pieces between the bridges, or orient the tree edges down and the other edges up when
    there is no bridge (Theorem 4.7.4).
  over:
  - card: mutual-reach
    because: If the roads already have directions, the groups are strongly connected components, not pieces
      without bridges.
  - card: undirected-cycle
    because: If only the number of roads to remove to get a forest is asked, the count of roads minus
      towns plus pieces is enough.
    topic: '4.2'
glossary_added:
- strongly connected component
- condensation
- bridge
- articulation point
- 2-edge-connected component
- entry time
- low-link value
- back edge
