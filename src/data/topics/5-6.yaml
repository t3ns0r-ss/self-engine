drill:
- problem: lc-next-greater-element-iv
  answer:
    topic: '1.6'
    card: nearest-greater
  property: 'Each element waits for two larger ones: a stack of elements that have seen no larger one
    yet and a stack of elements that have seen one, both kept in order, answer all positions in one pass.'
  why_others_fail: The ranges are all of the form "to the right of i", so there is nothing to sort by
    blocks; and a window cannot find the second larger element by adding and removing single values.
- problem: lc-minimum-operations-to-convert-all-elements-to-zero
  answer:
    topic: '1.6'
    card: nearest-greater
  property: 'A stack that keeps the values in increasing order: a value that is smaller than the top ends
    the top values; each distinct positive value that stays on the stack costs one operation.'
  why_others_fail: There are no questions about ranges at all, only one array and one count; a window
    with a repair step has nothing to move over.
- problem: lc-continuous-subarray-sum
  answer:
    topic: '1.2'
    card: prefix-count-lookup
  property: Two prefix sums with the same remainder modulo k enclose a subarray with sum divisible by
    k; keep the first index of each remainder and check that the distance is at least two.
  why_others_fail: There is one question, not many ranges, so no order of questions can save steps; the
    prefix remainders answer it in one pass.
- problem: cf-279B
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: All times are positive, so a window of books that fits in t stays valid when it shrinks; move
    the right end forward and the left end only when the sum exceeds t. †
  why_others_fail: There is a single question about the whole array, which a two-pointer window answers
    in O(n); sorting many questions is not needed.
- problem: lc-describe-the-painting
  answer:
    topic: '1.1'
    card: event-sweep
  property: Each segment adds its colour at its start and subtracts it at its end; sorting the ends and
    keeping a running sum gives the pieces.
  why_others_fail: The coordinates are the ends of the segments and one sweep over them is enough; there
    are no separate questions to answer in a clever order.
- problem: lc-random-pick-with-weight
  answer:
    topic: '1.4'
    card: sorted-search
  property: Prefix sums of the weights are sorted; pick a random number up to the total and binary search
    the first prefix sum that reaches it.
  why_others_fail: The questions arrive one at a time and online (each is a fresh random number); they
    cannot be gathered and ordered, and no window is involved.
- problem: lc-eliminate-maximum-number-of-monsters
  answer:
    topic: '1.5'
    card: sorted-matching
  property: The time at which each monster arrives is ⌈dist / speed⌉; sort these times and shoot in order,
    stopping when the next monster arrives no later than the minute of the shot.
  why_others_fail: It is a greedy choice on sorted arrival times, with no ranges and no repair steps.
- problem: cf-1155D
  answer:
    topic: '3.2'
    card: extra-small-state
  property: The state is the position and one of three phases (before, inside, after the multiplied part);
    the best sum ending at each position in each phase follows from the previous position. †
  why_others_fail: The subarray is chosen freely and there is a single question, so the structure is a
    table over positions and phases, not a set of ranges to answer offline.
lookalike_pairs:
- a: ac-abc242_g
  b: cf-522D
  a_tool:
    topic: '5.6'
    card: mo-offline
  b_tool:
    topic: '5.3'
    card: point-update-range-query
  shared_surface: Both ask a question about the equal elements inside a range of an array, for up to 10^6
    and 5·10^5 ranges known in advance.
  flipping_difference: In Range Pairing Query the answer is a sum over the colours of a quantity that
    changes by 0 or 1 when one element enters the window, so Mo's algorithm moves the window in O(1) steps.
    In Closest Equals the answer is a minimum, which cannot be undone when an element leaves the window;
    instead the questions are sorted by the right end, the distance to the previous equal element is stored
    at its left position, and a tree answers the minimum over positions at least l.
  flipping_input: 'a = [5, 3, 5, 3, 5]. Range 1..5: 5 occurs 3 times and 3 occurs twice, so the largest
    number of disjoint pairs is 1 + 1 = 2. The smallest distance between two equal elements is 2 (positions
    1 and 3), and it does not change when the range is shortened from the left to 2..5: then it is the
    distance 2 between positions 2 and 4; a removal cannot tell what the new minimum is without the stored
    distances.'
- a: ac-abc293_g
  b: cf-301D
  a_tool:
    topic: '5.6'
    card: mo-offline
  b_tool:
    topic: '5.2'
    card: offline-sweep-count
  shared_surface: Both count tuples of positions inside a range that satisfy a condition, for up to 2·10^5
    ranges known in advance.
  flipping_difference: In Triple Index the tuples are three equal values, and one element entering the
    window changes the count by C(c, 2), so Mo's algorithm works. In Yaroslav and Divisors the pairs are
    positions whose values divide one another; there are only about n ln n such pairs in all, so each
    pair becomes a segment, and counting the segments that lie inside the range is an offline sweep with
    a Fenwick tree. The window of Mo would have to add all pairs of a new element at once.
  flipping_input: 'Values 1 1 1 1: the triples of equal values in the range 1..4 number C(4, 3) = 4, and
    adding a fourth copy to a window with 3 copies adds C(3, 2) = 3. For the permutation 2 1 4 3 the divisor
    pairs (1 divides 2, 1 divides 4, 2 divides 4) become the segments [1,2], [2,3], [1,3] of positions,
    and a range counts those inside it.'
self_test:
- q: n = 9 and the questions (0,2), (4,8), (1,5), (3,3). Give the block size of Mo's order, the order
    of the questions, and the number of steps the window makes from the empty window.
  a: 'B = ⌊9 / √4⌋ = 4. The blocks of the left ends are 0, 1, 0, 0. Block 0 (even) is sorted by r ascending:
    (0,2), (3,3), (1,5); block 1 holds (4,8). The order is the questions 0, 3, 2, 1. The steps are 3,
    then 4, then 4, then 6, in all 17.'
- q: The window holds the values 2, 2, 3, 2 and the number of equal pairs is 3. What happens to the count
    when another 2 enters, and when the 3 leaves?
  a: 'A 2 enters with count 3 in the window, so it makes 3 new pairs: the count becomes 6 (four 2s make
    C(4, 2) = 6 pairs). The 3 leaves: its count goes from 1 to 0 and the pairs lost are that count after
    the decrease, 0: nothing changes.'
- q: The window is [0, 1] and the next question is [5, 6]. Why does Mo's algorithm grow the window before
    it shrinks it? What goes wrong if the left end is moved first?
  a: 'If the left end moves first it passes the right end and removes the positions 2, 3, 4, which were
    never added: the counts become negative, and for the number of different values the answers are wrong.
    Growing first adds 2..6 before the positions 0..4 are removed, so only positions that are in the window
    are removed.'
- q: The array [1, 2, 1, 3, 2] has the change a_1 = 3 and the questions (0, 3, 0), (0, 3, 1). With changes,
    what is the third number of a question, and how many different values does each question ask about?
  a: The third number is how many changes have happened before the question. The first question sees [1,
    2, 1, 3] and has 3 different values; the second sees [1, 3, 1, 3] and has 2.
- q: A tree has the edges 0-1, 0-2, 1-3, 1-4. Write its Euler order, and give the range for the path from
    3 to 2 and the vertex that is added on its own.
  a: 'Enter and leave every vertex, children in the order of the edges: 0 1 3 3 4 4 1 2 2 0. The vertex
    3 is not an ancestor of 2, so the range runs from the end of 3 (position 3) to the start of 2 (position
    7): 3 4 4 1 2 contains 3, 1 and 2 once and 4 twice; the lowest common ancestor 0 is added on its own.
    The path is 3, 1, 0, 2.'
- q: Why can the best value x · count(x) not be repaired when an element leaves the window, and what does
    the rollback version do instead?
  a: 'A window holds 2, 2, 1 and the stored best value is 4. When one 2 leaves, the best value becomes
    2, but the window never kept the second best value, so finding it needs a pass over all values. The
    rollback version never removes: per block of left ends it grows the right end only, adds the left
    part for one question, and then undoes exactly those additions and restores the saved best value.'
