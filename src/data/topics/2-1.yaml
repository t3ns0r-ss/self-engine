# Topic 2.1 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "2.1"
draft: true
cards:
  - id: sieve
    name: All primes up to N
    decisive_property: "Every number whose primality matters is at most N, with N small enough for an array (about 10^7); the sieve then answers \"is x prime\" for all x ≤ N at once in O(N log log N)."
    from_theorem: Theorem 2.1.1
    how_to_test: "Find the largest number you will ever test for primality, and check that an array of that size fits in memory and time."
    weak_signals:
      - "Primes or prime counts in many ranges, or many primality tests of numbers up to 10^6 or 10^7"
      - "Numbers built from primes, such as p·q, p²·q or p^a·q^b, counted up to a bound; the primes involved are at most a root of the bound"
      - "The next or previous prime after a value"
    kill_signals:
      - "One number up to 10^12 or more is tested (trial division up to its square root instead)"
      - "Each number's full factorisation is needed, not just whether it is prime (record the smallest prime factor instead)"
    lookalikes:
      - description: "Is a single n ≤ 10^12 prime?"
        needs: "trial-division (2.1)"
        flipping_difference: "One large number does not fit in a sieve, but √n = 10^6 trial divisors do."
    complexity: "O(N log log N) time, N + 1 flags of memory."
  - id: spf-factorise
    name: Factorising many numbers with a table
    decisive_property: "Many numbers must be factorised, and all of them are at most N, with N small enough for an int array; a smallest prime factor table built once factorises each in O(log x)."
    from_theorem: Theorem 2.1.4
    how_to_test: "Check the bound on every number you will factorise (the values, not their count); if it is about 10^7 or less, build the table."
    weak_signals:
      - "Divisor counts, distinct prime factors or prime exponents of every array element"
      - "Two elements share a prime factor; a number is coprime to all elements"
      - "Replace a number by a function of its prime factors, repeatedly"
    kill_signals:
      - "The numbers go up to 10^12 or more (trial division, or a sieve of the primes up to the square root)"
      - "Only primality matters (a plain sieve is enough)"
    lookalikes:
      - description: "The GCD of all elements, or of pairs of elements"
        needs: "gcd-lcm (0.4)"
        flipping_difference: "A GCD needs no factorisation; the Euclidean algorithm gives it directly. Factor only when the question is about individual primes."
    complexity: "O(N log log N) to build, O(log x) per number."
  - id: trial-division
    name: Divisors of one large number
    decisive_property: "One number (or a few) up to about 10^12 must be factorised or have its divisors listed; trying divisors d with d² ≤ n costs √n = 10^6 steps, and the leftover after division is a prime."
    from_theorem: Theorem 2.1.5
    how_to_test: "Count the numbers to factorise and multiply by √n; it must fit the budget. The numbers can be far beyond any array size."
    weak_signals:
      - "A single n up to 10^12 or 10^14; its divisors, prime factors or number of divisors"
      - "The divisors of a GCD, or of N!, or of a difference of two numbers"
      - "Choose some divisors of n under a condition"
    kill_signals:
      - "Many numbers must be factorised (a table, or only prime trial divisors)"
      - "n is up to 10^18 (√n is 10^9, too slow; look for structure instead)"
    lookalikes:
      - description: "Divisor counts of every number up to N"
        needs: "multiples-sieve (2.1)"
        flipping_difference: "For all numbers at once, add 1 to every multiple of every d (O(N log N)) instead of N separate trial divisions (O(N √N))."
    complexity: "O(√n) per number."
  - id: multiples-sieve
    name: Work over all multiples
    decisive_property: "The question aggregates over divisibility for every d up to a bound M on the values (how many elements d divides, the GCD of a pair being d); each d visits its M/d multiples, O(M log M) in total, and \"GCD exactly d\" follows from \"divisible by d\" by subtracting the multiples from large d to small."
    from_theorem: Theorem 2.1.6
    how_to_test: "Check that the values (not the positions) are bounded by an array size M, and that the answer for d depends on the multiples of d."
    weak_signals:
      - "For every d, how many elements are divisible by d, or the sum of divisors of every number up to N"
      - "Count pairs or subsets with GCD exactly d, or the largest GCD of k elements"
      - "Values up to 10^6 and the answer is about divisors, not positions"
    kill_signals:
      - "The values reach 10^9 or more (no array indexed by value)"
      - "The question is about one number only (trial division)"
    lookalikes:
      - description: "Count pairs of positions whose sum is divisible by k"
        needs: "mod-arithmetic-basic (0.4)"
        flipping_difference: "Divisibility of a sum depends on the remainders only; there is no loop over divisors."
    complexity: "O(M log M)."
  - id: bezout
    name: Linear equations in integers
    decisive_property: "The question asks for integers x, y with a·x + b·y = c, or for which c such a combination exists; solutions exist exactly when gcd(a, b) divides c, extended Euclid gives one, and the others differ by multiples of (b/g, −a/g)."
    from_theorem: Theorem 2.1.2
    how_to_test: "Rewrite the condition as a·x + b·y = c (or a·x ≡ c modulo b, which is a·x + b·y = c), then check that x and y may be any integers, possibly with a sign or range condition afterwards."
    weak_signals:
      - "Two step sizes or jug volumes; can you reach exactly c"
      - "Moving k steps at a time around a circle of n positions; when do you land on a given position first"
      - "A point with integer coordinates on a line a·x + b·y + c = 0"
    kill_signals:
      - "The number of uses of each step is bounded and small (brute force or later topics)"
      - "Three or more step sizes with a target to minimise (a shortest-path model, topic 4.3)"
    lookalikes:
      - description: "Can you reach c with steps of a and b in either direction, without counting steps?"
        needs: "gcd-lcm (0.4)"
        flipping_difference: "Only the existence is asked: it is gcd(a, b) | c, no coefficients needed."
    complexity: "O(log min(a, b))."
problems:
  - id: ac-abc177_e
    role: worked_example
    summary: "Up to 10^6 integers up to 10^6: are they pairwise coprime, only coprime as a whole set, or neither?"
  - id: ac-abc383_d
    role: worked_example
    summary: Count the integers up to N ≤ 4·10^12 with exactly 9 divisors.
  - id: lc-count-primes
    role: ladder
    card: sieve
    rung: 1
    twist: Base case of the card
    summary: "The number of primes strictly less than n, for 0 ≤ n ≤ 5·10^6."
    hints:
      - Testing each number separately costs about √k each. Can every prime cross off its multiples instead?
      - "Sieve of Eratosthenes up to n − 1 (Theorem 2.1.1); careful with n ≤ 2, where the answer is 0."
      - "Mark composites for p with p·p < n, starting at p·p; count the unmarked numbers from 2 to n − 1."
  - id: ac-abc084_d
    role: ladder
    card: sieve
    rung: 2
    twist: Many range queries about a property built from two primality tests.
    summary: "Q ≤ 10^5 queries [l, r] with odd ends up to 10^5: count the odd x in the range with both x and (x + 1)/2 prime."
    hints:
      - Each query could check every x in its range, but there are 10^5 queries. What can be prepared once?
      - "Sieve to 10^5; mark good[x] when x and (x + 1)/2 are both prime; answer each query with prefix sums (topic 1.2)."
      - "cnt[x] = cnt[x − 1] + good[x]; print cnt[r] − cnt[l − 1]."
  - id: cf-230B
    role: ladder
    card: sieve
    rung: 3
    twist: The numbers reach 10^12, but the property reduces to primes up to 10^6.
    summary: "For n ≤ 10^5 numbers up to 10^12, decide for each whether it has exactly three positive divisors."
    hints:
      - Use the divisor-count formula (Theorem 2.1.3). Which exponent patterns give exactly 3 divisors?
      - "3 is prime, so only one prime with exponent 2: the number must be p² for a prime p. So p ≤ 10^6."
      - "Sieve to 10^6; for each x take the exact integer square root s (topic 0.1), and answer YES when s·s = x and s is prime."
  - id: lc-closest-prime-numbers-in-range
    role: ladder
    card: sieve
    rung: 4
    twist: A search over consecutive primes inside a range, with a tie rule.
    summary: "Given 1 ≤ left ≤ right ≤ 10^6, find two primes left ≤ num1 < num2 ≤ right with the smallest difference (smallest num1 on ties), or [−1, −1]."
    hints:
      - The closest pair is always two consecutive primes of the range. Why?
      - "If a prime lay between num1 and num2, it would form a closer pair. So sieve to right and compare neighbours."
      - "Scan the primes in [left, right] in order, keeping the previous one; update the answer only on a strictly smaller gap, which keeps the smallest num1."
  - id: ac-abc096_d
    role: ladder
    card: sieve
    rung: 5
    twist: A construction, not a count; the sieve supplies primes with a chosen remainder.
    summary: "Print N (5 ≤ N ≤ 55) distinct primes up to 55 555 such that every sum of five of them is composite."
    hints:
      - When is a sum of five numbers surely composite? Think about a common divisor of all such sums.
      - "If all the primes are ≡ 1 (mod 5), any five of them sum to a multiple of 5 greater than 5 (topic 0.4)."
      - "Sieve to 55 555 and print the first N primes p with p mod 5 = 1 (11, 31, 41, …); there are enough of them."
  - id: cses-1713
    role: ladder
    card: spf-factorise
    rung: 1
    twist: Base case of the card
    summary: "For n ≤ 10^5 integers x ≤ 10^6, print the number of divisors of each."
    hints:
      - "Trial division costs up to 10^3 steps per number: is that fast enough here? What changes if you prepare a table first?"
      - "A smallest prime factor table up to 10^6 (Theorem 2.1.4) factorises each x in at most 20 divisions."
      - "Split x into runs of equal smallest prime factors; multiply (e + 1) over the runs (Theorem 2.1.3)."
  - id: lc-distinct-prime-factors-of-product-of-array
    role: ladder
    card: spf-factorise
    rung: 2
    twist: The product is huge, so work with the factors of each element instead.
    summary: "Given n ≤ 10^4 integers between 2 and 1000, count the distinct primes dividing their product."
    hints:
      - Can you compute the product? If not, which primes divide a product?
      - "By Euclid's lemma (Theorem 2.1.2, part 3), a prime divides the product exactly when it divides some element."
      - "Factorise every element (table or trial division) and insert its primes into a set; return the set size."
  - id: ac-abc215_d
    role: ladder
    card: spf-factorise
    rung: 3
    twist: Factorise the input, then mark the multiples of the primes found.
    summary: "Given N ≤ 10^5 integers up to 10^5 and M ≤ 10^5, list every k in [1, M] coprime to all of them."
    hints:
      - "gcd(A_i, k) > 1 means A_i and k share a prime. Which primes are forbidden in k?"
      - "Collect the primes of all A_i with a smallest prime factor table; k is valid exactly when none of them divides k."
      - "For each forbidden prime p, mark p, 2p, 3p, … up to M (harmonic bound); print the unmarked k."
  - id: cf-1349A
    role: ladder
    card: spf-factorise
    rung: 4
    twist: A GCD of all pairwise LCMs, read off from exponents.
    summary: "Given n ≤ 10^5 integers up to 2·10^5, find the GCD of the LCMs of all pairs."
    hints:
      - "Work one prime at a time with Theorem 2.1.3, part 3: the LCM takes the maximum exponent and the GCD the minimum."
      - "For a prime p, the answer's exponent is the minimum over pairs of the larger exponent: the second smallest exponent of p among all elements (zeros included)."
      - "Factorise all elements, keep for each prime its exponent list, and take the second smallest exponent, treating missing elements as exponent 0."
  - id: cf-1366D
    role: ladder
    card: spf-factorise
    rung: 5
    twist: A construction from the factorisation, for up to 5·10^5 numbers up to 10^7.
    summary: "For each a_i ≤ 10^7, find two divisors d_1, d_2 > 1 with gcd(d_1 + d_2, a_i) = 1, or report −1."
    hints:
      - If a_i is a power of one prime, every divisor is a multiple of that prime. What follows for d_1 + d_2?
      - "Otherwise split a_i = p^k · m with p = spf(a_i) and m > 1 coprime to p. Take d_1 = p^k, d_2 = m."
      - "No prime of a_i divides p^k + m: a prime dividing one of the two terms does not divide the other. Build the table up to 10^7."
  - id: cf-1203C
    role: ladder
    card: trial-division
    rung: 1
    twist: Base case of the card
    summary: "Given n ≤ 4·10^5 integers up to 10^12, count the positive integers that divide all of them."
    hints:
      - Which numbers divide every element? Relate them to one number.
      - "They are exactly the divisors of g = gcd of all elements (topic 0.4)."
      - "Count the divisors of g by trial division up to √g ≤ 10^6 (Theorem 0.2.2)."
  - id: ac-abc169_d
    role: ladder
    card: trial-division
    rung: 2
    twist: A greedy on each prime exponent after factorising.
    summary: "Repeatedly divide N ≤ 10^12 by a prime power not used before; find the largest number of divisions."
    hints:
      - Factorise N. Do different primes interact?
      - "For p^e, use p^1, p^2, … as long as the exponents still fit: the largest k with 1 + 2 + … + k ≤ e (Theorem 0.2.3)."
      - "Trial division gives the exponents; sum the k over all primes."
  - id: ac-abc142_d
    role: ladder
    card: trial-division
    rung: 3
    twist: Pairwise coprime common divisors are counted by distinct primes.
    summary: "Given A, B ≤ 10^12, choose as many common divisors as possible, pairwise coprime; print the count."
    hints:
      - Common divisors of A and B are the divisors of gcd(A, B). Which divisors can be pairwise coprime?
      - "Each chosen divisor other than 1 needs a prime of its own; one prime per divisor is enough."
      - "Answer: 1 + the number of distinct primes of gcd(A, B), found by trial division."
  - id: cses-1081
    role: ladder
    card: multiples-sieve
    rung: 1
    twist: Base case of the card
    summary: "Given n ≤ 2·10^5 integers up to 10^6, find the largest GCD of two of them."
    hints:
      - The GCD of a pair is d exactly when d divides both. For a fixed d, can you count the elements it divides fast?
      - "For every d, sum cnt over the multiples of d (Theorem 2.1.6, part 1); the harmonic bound keeps it O(M log M)."
      - "Scan d from 10^6 down and stop at the first d that divides at least two elements."
  - id: cses-1082
    role: ladder
    card: multiples-sieve
    rung: 2
    twist: N is 10^12, so group the divisors by the number of their multiples instead of looping over them.
    summary: "Compute σ(1) + σ(2) + … + σ(n) modulo 10^9 + 7 for n ≤ 10^12, where σ is the sum of divisors."
    hints:
      - "Exchange the sums: each d ≤ n is a divisor of ⌊n/d⌋ numbers up to n. So the total is Σ d·⌊n/d⌋."
      - "⌊n/d⌋ takes at most 2√n different values; the d with the same value form a block [l, r] with r = n / (n / l)."
      - "For each block add q · (l + … + r) modulo p, computing the arithmetic sum (Theorem 0.2.3) in __int128 before reducing."
  - id: ac-abc206_e
    role: ladder
    card: multiples-sieve
    rung: 3
    twist: Pairs with GCD exactly g, counted from large g down, then the pairs where one divides the other removed.
    summary: "Count ordered pairs (x, y) with L ≤ x, y ≤ R ≤ 10^6 whose GCD g satisfies g ≠ 1, x ≠ g and y ≠ g."
    hints:
      - "Count pairs with g ≥ 2 first, then remove those where g = x or g = y, that is, where one number divides the other."
      - "Pairs with both numbers multiples of g: c(g)², with c(g) the multiples of g in [L, R]. Subtract the exact counts of 2g, 3g, … from large g down (Theorem 2.1.6, part 3)."
      - "For each x ≥ max(2, L), the multiples y of x in [L, R] give pairs (x, y) and (y, x), with y = x counted once; subtract them."
  - id: lc-water-and-jug-problem
    role: ladder
    card: bezout
    rung: 1
    twist: Base case of the card
    summary: "Jugs of x and y litres (≤ 10^3) with fill, empty and pour operations: can the total water be exactly target?"
    hints:
      - Every operation changes the total by x or y or keeps it. Which totals are combinations of x and y?
      - "By Bézout's identity (Theorem 2.1.2, part 2) the reachable totals are the multiples of gcd(x, y); the jugs also limit the total to x + y."
      - "Return target ≤ x + y and target mod gcd(x, y) = 0."
  - id: lc-check-if-it-is-a-good-array
    role: ladder
    card: bezout
    rung: 2
    twist: Bézout's identity for many numbers instead of two.
    summary: "Given n ≤ 10^5 positive integers up to 10^9, can an integer combination of some of them equal 1?"
    hints:
      - For two numbers, combinations reach exactly the multiples of their GCD. What about three or more?
      - "By induction, the combinations of a_1, …, a_k are the multiples of gcd(a_1, …, a_k): combine gcd(a_1, …, a_(k−1)) with a_k (Theorem 2.1.2)."
      - "Return whether the GCD of the whole array is 1."
  - id: ac-abc340_f
    role: ladder
    card: bezout
    rung: 3
    twist: A geometric condition that becomes a linear equation in integers.
    summary: "Given (X, Y) ≠ (0, 0) with |X|, |Y| ≤ 10^17, find integer A, B with |A|, |B| ≤ 10^18 such that the triangle (0, 0), (X, Y), (A, B) has area 1, or print −1."
    hints:
      - "The triangle with vertices (0, 0), (X, Y), (A, B) has area |X·B − Y·A| / 2. Write the condition as an equation in A and B."
      - "X·B − Y·A = ±2 has a solution exactly when g = gcd(|X|, |Y|) divides 2 (Theorem 2.1.2, part 2)."
      - "Get u, v with |X|·u + |Y|·v = g from extended Euclid, fix the signs, and multiply by 2/g; the bounds of part 1 keep the values within 10^18."
  - id: cf-1244C
    role: ladder
    card: bezout
    rung: 4
    twist: A linear equation with an extra limit on x + y, solved by bounding one variable.
    summary: "Find non-negative x, y, z with x + y + z = n, x·w + y·d = p (d < w, n ≤ 10^12, p ≤ 10^17, w ≤ 10^5), or report −1."
    hints:
      - If y ≥ w, trade w draws for d wins. What happens to the points and to x + y?
      - "Replacing w draws (w·d points) by d wins (d·w points) keeps the points and lowers x + y by w − d > 0, so if any solution exists, one with y < w does."
      - "Try every y from 0 to w − 1: check that p − y·d is non-negative and divisible by w, then x = (p − y·d)/w and x + y ≤ n."
