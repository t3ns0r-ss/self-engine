# Patterns for topic 1.4 (Binary search: invariant template, search on the answer). Provisional until the lesson maps them to Recognition Cards.
topic: "1.4"
patterns:
  - id: sorted-search
    name: Search in a sorted array
    description: Find the first position with value ≥ x (or > x) and count values in a range of a sorted array.
    precondition: The array is sorted, so the predicate a[i] ≥ x is false…false true…true.
  - id: answer-search
    name: Search on the answer
    description: Minimise a maximum or maximise a minimum by searching over the answer with a feasibility check.
    precondition: "Feasibility is monotone in the answer: if x is achievable, every larger (or every smaller) x is too."
  - id: real-search
    name: Search over real numbers
    description: The answer is a real number; run a fixed number of halving steps until the interval is shorter than the required precision.
    precondition: The predicate is monotone over the reals and the required precision is known.
  - id: kth-by-counting
    name: k-th smallest by counting
    description: Find the k-th smallest element of an implicit collection (all pair sums, a multiplication table) by counting elements ≤ x.
    precondition: count(≤ x) is non-decreasing in x and can be computed much faster than listing the collection.
  - id: first-reaching-index
    name: First index reaching a threshold
    description: Find the first index where a monotone cumulative quantity (prefix sums of positive values, a sorted derived array) reaches a target, for many queries.
    precondition: The cumulative quantity is monotone along the index.
