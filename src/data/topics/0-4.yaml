drill:
- problem: cf-1325A
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: gcd(1, y) = 1 and lcm(1, y) = y, so a = 1, b = x − 1 works for every x.
  why_others_fail: No remainder computation or parity argument is needed; the property is a fact about
    GCD and LCM with 1.
- problem: cf-1665A
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: With b = c = d = 1 both sides are 1, so a = n − 3 works.
  why_others_fail: Searching over quadruples is far too slow for n = 10^9; the GCD/LCM facts give a direct
    construction.
- problem: cf-1389A
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: 'For x < y, lcm(x, y) is a multiple of y: either y itself (then x divides y, so y ≥ 2x) or
    at least 2y. So the LCM is always at least 2x ≥ 2l, and (l, 2l) works exactly when 2l ≤ r.'
  why_others_fail: Trying all pairs in [l, r] is quadratic in a range of 10^9.
- problem: ac-abc131_c
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: Count multiples of C or D up to x as x/C + x/D − x/lcm(C, D) (Theorem 0.4.6), then take the
    complement on [A, B].
  why_others_fail: Divisibility alone counts each divisor separately and double-counts numbers divisible
    by both.
- problem: ac-abc177_c
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: 'Keep the running sum of earlier values modulo p and add A_i times it: only products and sums,
    reduced at every step.'
  why_others_fail: All pairs cost 2·10^10 steps; the exact sum overflows long long without the reductions.
- problem: ac-abc133_c
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: If R − L ≥ 2019 some number in the range is a multiple of 2019 and the answer is 0; otherwise
    at most 2019² pairs, each computed with reduced factors.
  why_others_fail: Looks like a huge range, but remainders modulo 2019 take only 2019 values (the pigeonhole
    principle).
- problem: ac-abc410_c
  answer:
    topic: '0.4'
    card: mod-arithmetic-basic
  property: Keep a start offset s; a rotation adds k to s modulo N, and position p means index (s + p
    − 1) mod N.
  why_others_fail: Rotating the array each time costs N per query, 3·10^11 in total.
- problem: cf-1617B
  answer:
    topic: '0.4'
    card: gcd-lcm
  property: 'Take c = 1 and split n − 1 into two distinct coprime numbers other than 1: two consecutive
    numbers when n − 1 is odd; otherwise two odd numbers that differ by 2 or 4 (their GCD divides the
    difference and is odd, so it is 1).'
  why_others_fail: No parity rule alone fixes all three numbers; the GCD condition does.
- problem: ac-abc285_c
  answer:
    topic: '0.3'
    card: string-processing
  property: 'Read the name left to right keeping value = value·26 + (letter − A + 1): a one-pass scan
    with one number of state.'
  why_others_fail: Looks like a remainder problem, but nothing is reduced modulo anything; the value fits
    in long long and one scan computes it.
- problem: ac-abc283_c
  answer:
    topic: '0.3'
    card: string-processing
  property: 'Scan the digits once: each 00 pair costs one press, each other digit one press; the state
    is "the previous digit was an unpaired 0".'
  why_others_fail: 'Divisibility by 100 is a distraction: the work is a left-to-right scan of the digit
    string.'
- problem: ac-abc299_c
  answer:
    topic: '0.3'
    card: string-processing
  property: One scan over the maximal runs of o, remembering whether any - exists in the string.
  why_others_fail: No remainders or parity are involved; the state of a one-pass scan decides.
