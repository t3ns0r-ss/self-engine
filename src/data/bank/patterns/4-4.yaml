# Patterns for topic 4.4 (DSU and MST: Kruskal, Prim, cut property). Provisional until the lesson maps them to Recognition Cards.
topic: "4.4"
patterns:
  - id: dsu-connectivity
    name: Merging components online
    description: Answer "are u and v connected?" and component sizes while edges are only added.
    precondition: Components only merge and never split.
  - id: reverse-deletions
    name: Deletions processed backwards
    description: Edges or vertices are removed over time; process the operations in reverse as additions.
    precondition: All operations are known in advance (offline), so time can be reversed.
  - id: kruskal
    name: Minimum spanning tree
    description: Build a minimum-weight spanning tree by adding edges in increasing weight when they join two components.
    precondition: "Cut property: the lightest edge crossing any cut belongs to some minimum spanning tree."
  - id: mst-variants
    name: Spanning tree variants
    description: Maximum spanning tree, the minimum possible largest edge on a path, or a spanning tree with some edges forced.
    precondition: The cut and cycle properties still hold for the variant's weight order.
