drill:
  - problem: ac-abc195_c
    answer_card: closed-form
    answer_topic: "0.2"
    property: Numbers with the same number of digits use the same number of commas, so count each digit-length range with a formula.
    why_others_fail: Looping to 10^15 is far over budget; there is no array, so no amortised scan applies.
  - problem: ac-abc368_c
    answer_card: closed-form
    answer_topic: "0.2"
    property: "The damage pattern repeats every 3 attacks (5 damage per period): full periods are counted by division, the rest by a short loop."
    why_others_fail: Hitting one point at a time takes up to 10^9 steps per enemy.
  - problem: ac-abc180_c
    answer_card: budget-from-constraints
    answer_topic: "0.2"
    property: "Divisors of one number N ≤ 10^12 come in pairs: loop d up to √N = 10^6."
    why_others_fail: Loops over multiples answer questions about all numbers up to n, not one number; looping to N is too slow.
  - problem: ac-abc343_c
    answer_card: budget-from-constraints
    answer_topic: "0.2"
    property: "Cubes up to 10^18 have roots up to 10^6, so try every root: 10^6 candidates, each checked in about 18 steps."
    why_others_fail: Looping over all numbers up to N is impossible; no formula gives palindromes directly.
  - problem: ac-abc381_c
    answer_card: amortised-total
    answer_topic: "0.2"
    property: Around each slash, extend left over 1s and right over 2s; each scan is bounded by its block of 1s or 2s, so the total is O(N).
    why_others_fail: Checking every substring is O(N²) or worse.
  - problem: ac-abc143_c
    answer_card: amortised-total
    answer_topic: "0.2"
    property: The answer is the number of maximal blocks of equal colours, found in one pass.
    why_others_fail: Fusing slimes one at a time and rebuilding the string is quadratic.
  - problem: cf-1520B
    answer_card: closed-form
    answer_topic: "0.2"
    property: There are 9 such numbers per digit length; count full lengths by formula and the last length by comparing n with ddd…d.
    why_others_fail: Checking every number up to 10^9 per test is too slow.
  - problem: cf-1426A
    answer_card: closed-form
    answer_topic: "0.2"
    property: "After the first floor, floors hold x flats each: the floor is 1 + ⌈(n − 2) / x⌉ for n > 2."
    why_others_fail: Walking floor by floor takes up to 10^9 steps per test.
  - problem: ac-abc123_c
    answer_card: integer-rounding
    answer_topic: "0.1"
    property: "Only the slowest transport matters: the answer is ⌈N / min⌉ + 4, an exact ceiling of values up to 10^15."
    why_others_fail: Looks like a step-by-step process over minutes (up to 10^15 of them), but the formula needs only integer rounding from 0.1.
lookalike_pairs:
  - a: ac-abc144_b
    b: ac-abc144_c
    a_tool: "budget-from-constraints (0.2): all 81 pairs"
    b_tool: "budget-from-constraints (0.2): divisors up to √N"
    flipping_difference: B allows N up to 10^12 and any factors, so only the pairs (d, N/d) with d ≤ √N can be tried.
  - a: ac-abc106_b
    b: ac-abc172_d
    a_tool: "budget-from-constraints (0.2): count each number's divisors directly"
    b_tool: harmonic-loops (0.2)
    flipping_difference: "B needs the divisor counts of every number up to 10^7: checking each separately is far too slow, while looping over multiples costs about n ln n."
self_test:
  - q: Is 3n² + 5n + 7 = O(n)? Justify with numbers.
    a: No. For any constant c, 3n² > c·n as soon as n > c/3; for example with c = 1000, n = 400 gives 480 000 > 400 000. The term n² eventually beats every constant multiple of n.
  - q: n ≤ 2·10^5 and the time limit is 2 seconds. Is an O(n²) idea acceptable? And O(n√n)?
    a: "O(n²) is 4·10^10 steps, about 400 seconds: no. O(n√n) is about 2·10^5 · 450 ≈ 9·10^7 steps: about a second, acceptable if the steps are simple."
  - q: 'Is "for i = 1..n: for j = 1..n/i: (one step)" an O(n²) loop?'
    a: "No. The inner loop runs ⌊n/i⌋ times, so the total is at most n·H_n ≤ n(1 + ln n) (Theorem 0.2.5): about 1.5·10^7 for n = 10^6."
  - q: The maximal-blocks loop has a while loop inside a while loop. Why is it O(n) and not O(n²)?
    a: The inner loop advances j, and the outer loop continues from i = j. The index only moves forward from 0 to n, so the inner loop runs at most n times in total (Theorem 0.2.4).
  - q: Compute 1 + 2 + … + n for n = 4·10^9 in long long. Does n·(n + 1)/2 work as written?
    a: "No: n(n + 1) ≈ 1.6·10^19 exceeds the long long maximum 9.2·10^18 before the division. Since one of n and n + 1 is even, divide that one by 2 first: (n / 2)·(n + 1) when n is even, n·((n + 1) / 2) otherwise. The result 8·10^18 fits."
  - q: To list the divisors of N = 10^12, how many values of d must be tried, and why is it enough?
    a: All d with d·d ≤ N, that is d ≤ 10^6. Every divisor e > √N has a partner N/e < √N that is tried, and e is recorded as N/d then (Theorem 0.2.2).
  - q: Can a program store an array of 10^8 long long values within a 256 MB memory limit?
    a: "No: 10^8 · 8 bytes = 800 MB. Even 10^8 int values need 400 MB. Plan memory from the constraints just like time: about 6·10^7 ints fit in 256 MB."
checkpoint:
  time_limit_minutes: 90
  problems:
    - ac-abc153_d
    - ac-abc190_d
    - cf-1352C
decision_map:
  - weak_signal: A huge bound such as N ≤ 10^12, or pairs (a, b) with a fixed product
    choose: budget-from-constraints
    when: The bound rules out looping to N; factor pairs let you loop only up to √N (Theorem 0.2.2).
    over:
      - card: closed-form
        because: A formula is needed only when even √N steps are too many or no pairing exists.
  - weak_signal: A repeated simple process with n up to 10^9 or 10^18
    choose: closed-form
    when: The added amount follows an arithmetic progression or repeats with a short period, so the total is a formula.
    over:
      - card: budget-from-constraints
        because: A plain loop is fine only when n times the cost of one step fits the budget.
      - card: overflow-64bit
        because: The formula still needs 64-bit products; check sizes as in topic 0.1.
  - weak_signal: Maximal blocks (runs) of equal or similar elements; a while loop inside a loop
    choose: amortised-total
    when: The inner loop advances an index that the outer loop then continues from, so the total is O(n).
    over:
      - card: budget-from-constraints
        because: If the inner loop restarts for every position, the count is n²/2 and must fit the budget instead.
  - weak_signal: A property of every number up to n that depends on its divisors, or counts of products at most n
    choose: harmonic-loops
    when: Turning the question around (each i visits its multiples) costs about n ln n in total.
    over:
      - card: budget-from-constraints
        because: Divisors up to √k for each k separately cost about n√n, too slow for n around 10^7.
