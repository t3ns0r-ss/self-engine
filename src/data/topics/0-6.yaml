# Topic 0.6 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "0.6"
cards:
  - id: set-membership
    name: Distinctness and membership
    decisive_property: Only whether a value has occurred matters, not how often or where, so a set of the values seen so far answers each "seen before?" or "how many distinct?" in O(log n).
    from_theorem: Theorem 0.6.2
    how_to_test: Ask whether replacing the input by its set of distinct values keeps the answer. If counts or positions matter, it is a map instead.
    weak_signals:
      - '"How many different …", "is there a duplicate", "has this appeared before"'
      - Values up to 10^9 or strings, too large to index an array
      - n up to 2·10^5 with a question per element
    kill_signals:
      - The answer depends on how many times a value occurs or where (use a map)
    lookalikes:
      - description: Is there a repeated value within distance k?
        needs: "map-counting (0.6): the last position of each value"
        flipping_difference: "The distance between equal values matters, so the set must remember positions: a map from value to last index."
    complexity: O(n log n) with set, O(n) on average with unordered_set.
  - id: map-counting
    name: Counting by key
    decisive_property: The answer depends only on how many times each key occurs (or on a list or last position per key), so a map from key to count, filled in one pass, decides it; pairs with equal keys are counted from the counts read before each increment.
    from_theorem: Theorem 0.6.3
    how_to_test: Write the answer as a function of the per-key counts. If you need "how many earlier elements equal this one", read the count before incrementing.
    weak_signals:
      - '"How many times", "the most frequent", "pairs with equal …"'
      - Grouping items by a key (same letters, same remainder, same name)
      - Names or strings that are assigned numbers in order of appearance
    kill_signals:
      - The question needs the nearest key, not an exact key (use an ordered lookup)
    lookalikes:
      - description: Count pairs i < j with a_i = a_j versus pairs with a_i < a_j
        needs: sorting (1.1, a later topic) or an ordered structure
        flipping_difference: Equality is answered by counts per key; order comparisons between different keys are not.
    complexity: O(n log n) with map, O(n) on average with unordered_map.
  - id: ordered-set-lookup
    name: Nearest value in a changing set
    decisive_property: Each question asks for the smallest stored value ≥ x, the largest ≤ x, or the minimum or maximum, while values are inserted and erased between questions; a set or multiset answers each in O(log n).
    from_theorem: Theorem 0.6.4
    how_to_test: "Check that the collection changes between queries (otherwise a sorted array would do) and that each query is about order: nearest, smallest, largest."
    weak_signals:
      - '"The smallest … that is at least", "the closest", "the largest not exceeding"'
      - Insertions and deletions mixed with queries
      - Max − min of a changing collection
    kill_signals:
      - Only the overall largest is ever taken (a priority queue is simpler)
      - Nothing changes between queries (a sorted array and binary search, topic 1.4)
    lookalikes:
      - description: Always remove the overall largest element
        needs: heap-extract (0.6)
        flipping_difference: Without a bound x, only the extreme is needed, and a priority queue gives it directly.
    complexity: O(log n) per operation.
  - id: heap-extract
    name: Repeatedly take the extreme
    decisive_property: The process itself says to remove the largest (or smallest) element again and again, possibly inserting new ones; a priority queue does each step in O(log n).
    from_theorem: Theorem 0.6.5
    how_to_test: Check that every step needs only the current extreme element, never a value near some x or an element in the middle.
    weak_signals:
      - '"Each time, take the largest …", "repeat K times: halve the biggest"'
      - Merging or combining the two smallest items
      - The k-th largest of a growing collection
    kill_signals:
      - A step needs the largest element below a bound (ordered set)
      - Elements must be removed by value, not only from the top
    lookalikes:
      - description: Each customer takes the most expensive ticket within their budget
        needs: ordered-set-lookup (0.6)
        flipping_difference: The bound depends on the customer, so the overall largest is not enough; a multiset finds the largest ≤ budget.
    complexity: O(log n) per push or pop, O(1) for top.
  - id: stack-queue
    name: Stack and queue processes
    decisive_property: "The process only ever touches the most recent unfinished item (a stack: brackets, undo, merging with the last element) or the oldest waiting item (a queue: first come, first served), so each step is O(1)."
    from_theorem: Theorem 0.6.6
    how_to_test: "Ask which item each step looks at: if always the newest, use a stack; if always the oldest, a queue; if both ends, a deque."
    weak_signals:
      - Brackets, nested structures, "cancel the last …"
      - '"In order of arrival", "the person at the front"'
      - Combining the new element with the last one while a condition holds
    kill_signals:
      - A step needs an element from the middle or the largest overall
    lookalikes:
      - description: Serve the most valuable waiting item first
        needs: heap-extract (0.6)
        flipping_difference: Priority by value replaces arrival order, so a priority queue replaces the queue.
    complexity: O(1) per operation.
problems:
  - id: cses-1621
    role: ladder
    card: set-membership
    rung: 1
    twist: Base case of the card
    summary: The number of distinct values among n integers (n ≤ 2·10^5, values ≤ 10^9).
    hints:
      - Values up to 10^9 cannot index an array. What container keeps each value once?
      - "A set: inserting a value twice keeps one copy (Theorem 0.6.2)."
      - "Insert all values into a set<int> and print its size: O(n log n)."
  - id: ac-abc164_c
    role: ladder
    card: set-membership
    rung: 2
    twist: The values are strings instead of numbers.
    summary: The number of different item names among N draws (N ≤ 2·10^5, names of up to 10 letters).
    hints:
      - Does a set work for strings?
      - "Yes: set<string> compares strings in dictionary order; each operation costs O(log N) comparisons of up to 10 letters."
      - Insert every name into a set<string> and print its size.
  - id: ac-abc291_c
    role: ladder
    card: set-membership
    rung: 3
    twist: The values are positions (pairs) produced by a walk.
    summary: A walk of N steps (N ≤ 2·10^5) on the grid from the origin, each step L, R, U or D; does it visit some point twice?
    hints:
      - What do you need to remember about the walk so far to answer "have I been here before?"
      - The set of points visited so far; a pair<int, int> can be stored in a set.
      - Insert (0, 0), then after each step check whether the new point is already in the set before inserting it.
  - id: ac-abc278_c
    role: ladder
    card: set-membership
    rung: 4
    twist: Insertions and deletions of pairs, with membership questions in between.
    summary: "Users up to 10^9 and Q ≤ 2·10^5 operations: A follows B, A unfollows B, or ask whether A and B follow each other."
    hints:
      - Users go up to 10^9, so a table of all pairs is impossible. What exactly must be stored?
      - 'Only the "A follows B" relations created so far: a set of pairs, with insert and erase.'
      - "set<pair<int, int>>: insert {A, B}, erase {A, B}, and answer Yes when both {A, B} and {B, A} are in it."
  - id: ac-abc398_c
    role: ladder
    card: map-counting
    rung: 1
    twist: Base case of the card
    summary: Among N people (N ≤ 3·10^5) holding numbers up to 10^9, the person whose number is the largest among numbers that nobody else holds, or −1.
    hints:
      - Which numbers are held by exactly one person?
      - Count each number with a map (Theorem 0.6.3); the candidates are the numbers with count 1.
      - Count all numbers, then scan the people and keep the one with count 1 and the largest number.
  - id: ac-abc206_c
    role: ladder
    card: map-counting
    rung: 2
    twist: "Count the complement: all pairs minus pairs of equal values."
    summary: The number of pairs i < j with A_i ≠ A_j (N ≤ 3·10^5).
    hints:
      - Counting unequal pairs directly needs all pairs. What is easier to count?
      - All pairs N(N − 1)/2 minus equal pairs, and equal pairs come from the counts per value.
      - Answer N(N − 1)/2 − Σ c(c − 1)/2 over the counts c, in long long.
  - id: ac-abc261_c
    role: ladder
    card: map-counting
    rung: 3
    twist: The count is read before incrementing, while the input is processed.
    summary: Print N names (N ≤ 2·10^5) in order, adding "(k)" to a name that already appeared k times before.
    hints:
      - For each name you need the number of earlier equal names. Which theorem gives it?
      - "Theorem 0.6.3, part 2: the count read just before incrementing."
      - map<string, int> cnt; for each name print it, plus "(" + to_string(cnt[s]) + ")" if cnt[s] > 0; then cnt[s]++.
  - id: ac-abc137_c
    role: ladder
    card: map-counting
    rung: 4
    twist: The key is a summary of the string (its letter counts), not the string itself.
    summary: Count pairs among N strings of 10 letters (N ≤ 10^5) that are anagrams of each other.
    hints:
      - Two strings are anagrams exactly when what is equal?
      - Their letter counts. Use the array of 26 counts (or any fixed summary of them) as the key of a map.
      - Count each summary with a map and add c(c − 1)/2 per summary, in long long (the answer can reach 5·10^9).
  - id: cf-1702C
    role: ladder
    card: map-counting
    rung: 5
    twist: Store a first and a last position per key instead of a count.
    summary: 'For each of t tests: stations along a route (n ≤ 2·10^5, values ≤ 10^9) and k queries "can I go from a to b?" (a must occur before b).'
    hints:
      - For a query (a, b), which occurrences of a and b matter?
      - "The first occurrence of a and the last occurrence of b: the trip is possible exactly when both exist and first[a] < last[b]."
      - Two maps filled in one pass (first index if not set yet, last index always); answer each query in O(log n).
  - id: lc-my-calendar-i
    role: ladder
    card: ordered-set-lookup
    rung: 1
    twist: Base case of the card
    summary: Book intervals [start, end) one at a time (≤ 1000 bookings), refusing a booking that overlaps an existing one.
    hints:
      - Which existing bookings can overlap a new interval?
      - "Only its neighbours in start order: the first booking that starts at or after the new start, and the one just before it."
      - Keep a map<int, int> start → end; check map.lower_bound(start) (it must start at or after the new end) and the one before it (it must end at or before the new start).
  - id: ac-abc294_d
    role: ladder
    card: ordered-set-lookup
    rung: 2
    twist: Only the smallest element of a changing set is needed.
    summary: "N people (≤ 5·10^5) and Q ≤ 5·10^5 events at a bank: call the next new person, someone arrives, or call again the smallest waiting person; print the calls of the last kind."
    hints:
      - Which people can be called again, and which one is called?
      - Called but not yet arrived; the smallest of them. The set changes with every event.
      - "set<int> waiting: insert on a new call, erase on arrival, print *waiting.begin() for a repeated call."
  - id: ac-abc253_c
    role: ladder
    card: ordered-set-lookup
    rung: 3
    twist: "Many equal values with bulk removal: a map of counts that also keeps the keys ordered."
    summary: "Q ≤ 2·10^5 queries on a multiset: add x, remove up to c copies of x, or print maximum minus minimum."
    hints:
      - Removing c copies one by one can be slow. What can store "how many copies" and the order of values together?
      - "A map from value to count: its first and last keys are the minimum and maximum (Theorem 0.6.4)."
      - "Add: cnt[x]++. Remove: cnt[x] −= min(c, cnt[x]) and erase the key when it reaches 0. Max − min: prev(end)→first − begin()→first."
  - id: ac-abc241_d
    role: ladder
    card: ordered-set-lookup
    rung: 4
    twist: Walk a few steps from the found iterator instead of just reading it.
    summary: "Q ≤ 2·10^5 queries: add x (≤ 10^18), or print the k-th largest value ≤ x, or the k-th smallest value ≥ x (k ≤ 5), or −1."
    hints:
      - How do you find the largest value ≤ x in a changing multiset, and then the next smaller ones?
      - prev(s.upper_bound(x)), then step back with prev up to k − 1 more times, checking for begin().
      - multiset<long long>; for "≥ x" start at s.lower_bound(x) and step forward, checking for end(). At most 5 steps per query.
  - id: lc-last-stone-weight
    role: ladder
    card: heap-extract
    rung: 1
    twist: Base case of the card
    summary: Repeatedly smash the two heaviest stones (≤ 30 stones); equal stones vanish, otherwise the difference remains; the last weight or 0.
    hints:
      - Which two stones does each step use?
      - "The two heaviest: a priority queue gives them (Theorem 0.6.5)."
      - Pop two, push their difference if it is not 0; return the top, or 0 if the queue is empty.
  - id: lc-kth-largest-element-in-a-stream
    role: ladder
    card: heap-extract
    rung: 2
    twist: Keep only the k largest values, so the k-th largest is the smallest of those.
    summary: A stream of values with k given; after each new value, report the k-th largest so far (≤ 10^4 additions).
    hints:
      - Do you need all the values seen so far?
      - Only the k largest. Among them, the k-th largest overall is the smallest.
      - "A min-priority queue of size at most k: push, pop when the size exceeds k, report the top."
  - id: lc-seat-reservation-manager
    role: ladder
    card: heap-extract
    rung: 3
    twist: Released items return to the heap and can be taken again.
    summary: Seats 1..n (n ≤ 10^5); reserve the smallest free seat or release a reserved one (≤ 10^5 calls).
    hints:
      - Which seat does each reservation take?
      - The smallest free one, and released seats become free again.
      - "A min-priority queue of free seats (initially 1..n): reserve pops the top, release pushes the seat back."
  - id: lc-valid-parentheses
    role: ladder
    card: stack-queue
    rung: 1
    twist: Base case of the card
    summary: Is a string of ( ) [ ] { } (length ≤ 10^4) properly nested?
    hints:
      - Which opening bracket must the next closing bracket match?
      - "The most recent unmatched one: a stack (Theorem 0.6.6)."
      - Push opening brackets; at a closing bracket the stack must be non-empty with the same kind on top; pop. At the end the stack must be empty.
  - id: ac-abc351_c
    role: ladder
    card: stack-queue
    rung: 2
    twist: The new element merges with the last one again and again while they are equal.
    summary: Add N balls (N ≤ 2·10^5) of sizes 2^{A_i} one by one to a row; while the last two have equal size, replace them by one ball of twice the size; how many balls remain?
    hints:
      - Which balls does a merge touch?
      - Only the last two, so the row is a stack of exponents; merging two balls of size 2^a gives 2^{a+1}.
      - Push A_i; while the stack has two elements and the top two are equal, pop both and push one more than their value. Print the size. Each ball is pushed and popped O(1) times overall.
  - id: ac-abc389_c
    role: ladder
    card: stack-queue
    rung: 3
    twist: "Queue elements shift positions together: store absolute positions and one global offset."
    summary: "Q ≤ 3·10^5 queries on a queue of snakes: add a snake of length l at the back, remove the front snake (all others move forward by its length), or print the head position of the k-th snake."
    hints:
      - Updating every snake on each removal is too slow. What changes and what stays?
      - The differences between heads never change; only one shift, the total length removed so far, applies to all.
      - Store each head as an absolute position in a vector with a front index; on removal add the length to the shift; answer head[front + k − 1] − shift. Use long long.
  - id: lc-evaluate-reverse-polish-notation
    role: ladder
    card: stack-queue
    rung: 4
    twist: The stack holds partial results, not brackets.
    summary: "Evaluate an arithmetic expression in reverse Polish notation (≤ 10^4 tokens: integers and + − * /, division truncating toward zero)."
    hints:
      - When an operator arrives, which numbers does it use?
      - "The two most recent unused values: the top two of a stack of numbers."
      - Push numbers; for an operator pop b, then a, and push a op b (C++ / already truncates toward zero). The answer is the last value left.
