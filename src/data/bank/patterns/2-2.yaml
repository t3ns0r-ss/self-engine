# Patterns for topic 2.2 (Fast exponentiation, Fermat's little theorem, modular inverse). Provisional until the lesson maps them to Recognition Cards.
topic: "2.2"
patterns:
  - id: fast-power
    name: Powers with huge exponents
    description: Compute a^b mod m for b up to 10^18 in O(log b) multiplications.
    precondition: a^(2k) = (a^k)^2 and multiplication modulo m is associative.
  - id: inverse-prime
    name: Division modulo a prime
    description: Divide modulo a prime p by multiplying with a^(p−2) mod p.
    precondition: p is prime and p does not divide a, so Fermat's little theorem gives a^(p−1) ≡ 1.
  - id: fraction-output
    name: Rational answers modulo a prime
    description: Output a rational answer P/Q as P · Q^(−1) mod p.
    precondition: The exact answer is a fraction whose denominator is not divisible by p.
  - id: exponent-reduction
    name: Reducing huge exponents
    description: Reduce an exponent modulo p − 1 (tower powers, exponents given modulo something) when the base is coprime to p.
    precondition: p is prime and gcd(a, p) = 1, so a^(p−1) ≡ 1 (mod p).
  - id: inverse-general
    name: Inverse modulo a non-prime
    description: Find a^(−1) mod m for composite m using extended Euclid.
    precondition: gcd(a, m) = 1; otherwise no inverse exists.
