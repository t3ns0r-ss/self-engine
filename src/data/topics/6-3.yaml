- id: cf-965E
  role: review
  review_set: 2
  card: prefix-tree
  summary: n ≤ 10^5 distinct names of total length up to 10^5; replace each name by a code that is the
    beginning of it, so that no code is a beginning of another code, with the smallest total length of
