drill:
- problem: lc-fruit-into-baskets
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: '"At most two different values" is closed under shrinking: removing elements cannot add values.'
  why_others_fail: 'Fixed-size window: the length is not given. Prefix sums: the condition is about distinct
    values, not a sum.'
- problem: cf-1354B
  answer:
    topic: '1.3'
    card: shrinkable-window
  property: '"Contains all three digits" is closed under extension, so its opposite shrinks well: shortest
    window by Theorem 1.3.1.'
  why_others_fail: Counting windows answers a different question. Trying all substrings is O(n²) for n
    = 2·10^5.
- problem: lc-permutation-in-string
  answer:
    topic: '1.3'
    card: fixed-window
  property: 'A rearrangement of s1 has length exactly |s1|: compare letter counts of every window of that
    length, one add and one remove per slide.'
  why_others_fail: Sorting every substring costs O(n·m log m). A shrinkable window can be made to work
    but needs more care; the length is fixed by the question.
- problem: lc-number-of-substrings-containing-all-three-characters
  answer:
    topic: '1.3'
    card: count-windows
  property: '"Missing at least one letter" is closed under shrinking: count those windows by Theorem 1.3.2
    and subtract from n(n+1)/2.'
  why_others_fail: Longest or shortest window gives one window, not a count. Prefix sums of counts need
    a search per right end.
- problem: lc-boats-to-save-people
  answer:
    topic: '1.3'
    card: opposite-ends
  property: After sorting, the heaviest person either shares with the lightest or rides alone, so one
    end is settled at every step.
  why_others_fail: 'A window: boats group people by weight, not by position. A map: pairing is about sums,
    not equal values.'
- problem: ac-abc172_c
  answer:
    topic: '1.3'
    card: merge-walk
  property: Read i books from A (prefix sums of a sorted, increasing sequence); the most books from B
    that still fit only decreases as i grows, so one pointer walks down B while i walks up A.
  why_others_fail: 'Opposite ends of one sorted array: here there are two separate lists of prefix sums.
    A window: the books taken from A must start at the top.'
- problem: ac-abc388_c
  answer:
    topic: '1.3'
    card: merge-walk
  property: 'In the sorted list, the number of sizes a with 2a ≤ b only grows as b grows: one pointer
    moves forward through the list.'
  why_others_fail: Opposite ends would count pairs by sum; this is a ratio between the two, and the forward
    walk over one sorted list fits directly.
- problem: ac-abc395_c
  answer:
    topic: '0.6'
    card: map-counting
  property: 'Only the distance between two equal values matters: keep a map from value to its last position
    and take the smallest gap.'
  why_others_fail: A shortest window also works ("has a repeated value" is closed under extension), but
    the last-position map is shorter and has no window to maintain.
- problem: ac-abc366_c
  answer:
    topic: '0.6'
    card: map-counting
  property: A map of counts with erase at zero answers each query; the bag changes in arbitrary order.
  why_others_fail: 'Looks like a fixed-window summary, but nothing slides: balls are removed in any order,
    so there are no pointers, only the map.'
- problem: ac-abc364_c
  answer:
    topic: '1.1'
    card: sort-then-scan
  property: 'The order is ours to choose: sort sweetness in decreasing order and count how many dishes
    exceed X; do the same for saltiness and Y; the answer is the smaller count.'
  why_others_fail: 'Looks like a shortest window, but there is no fixed array: the eater picks the order,
    so sorting decides it.'
lookalike_pairs:
- a: cses-1660
  b: cses-1661
  a_tool:
    topic: '1.3'
    card: count-windows
  b_tool:
    topic: '1.2'
    card: prefix-count-lookup
  flipping_difference: B allows negative values, so "sum at most x" is no longer closed under shrinking
    and the windows with sum x cannot be found by moving pointers.
  shared_surface: Both ask for the number of subarrays with sum exactly x.
  flipping_input: a = [3, −3, 3] and x = 3 has 3 subarrays with sum 3 (the first element, the last, and
    the whole array). With non-negative values (A) a shrinking window counts them; with negative values
    (B) sums can return to x, so a window that shrinks when the sum exceeds x loses windows, and a map
    of earlier prefix sums is needed.
- a: lc-max-consecutive-ones-iii
  b: lc-contiguous-array
  a_tool:
    topic: '1.3'
    card: shrinkable-window
  b_tool:
    topic: '1.2'
    card: prefix-count-lookup
  flipping_difference: '"At most k zeros" is closed under shrinking; "as many 0s as 1s" is not: removing
    one element from a balanced window unbalances it, while a longer window can balance again.'
  shared_surface: Both ask for the longest subarray of a 0/1 array that satisfies a condition on its zeros
    and ones.
  flipping_input: 'a = [1, 0, 0, 1, 0]: with at most one zero (A) the longest window is 2 ([1, 0] or [0,
    1]); with as many zeros as ones (B) it is 4 ([1, 0, 0, 1]).'
self_test:
- q: Give a 3-element array with a negative value where the shrinking-window template returns the wrong
    answer for "longest subarray with sum at most 2".
  a: 'a = [5, −4, 1], K = 2. The whole array has sum 2, so the answer is 3. The template drops 5 at r
    = 0 (sum 5 > 2) and never brings it back, so it returns 2 (the window −4, 1). Validity is not closed
    under shrinking here: [5, −4, 1] is valid but its sub-window [5] is not.'
- q: In Theorem 1.3.1 one value of r can make the inner while loop run many times. Why is the total over
    all r still at most n?
  a: Every pass of the while loop increases l by 1, l never decreases, and l never exceeds n. So all passes
    together number at most n, however they are spread over the values of r (amortised analysis).
- q: Which of "at most k distinct values" and "exactly k distinct values" is closed under shrinking? Give
    a counterexample for the other, and say how to count windows with exactly k distinct values.
  a: '"At most k" is closed under shrinking. "Exactly k" is not: with k = 2, the window [1, 2] is valid
    but its sub-window [1] has 1 distinct value. Count exactly-k windows as (windows with at most k) −
    (windows with at most k − 1), each by Theorem 1.3.2.'
- q: '"The window contains the letters a, b and c." Is this closed under shrinking or under extension?
    How would you find the shortest such window and count all such windows?'
  a: 'Closed under extension: adding letters cannot remove a, b or c, while removing one can ([a, b, c]
    is valid, [b, c] is not). Its opposite, "misses at least one of the letters", is closed under shrinking,
    and the empty window satisfies it. Shortest: Theorem 1.3.1 on the opposite (Section 4.1). Count: count
    the windows of the opposite with Theorem 1.3.2 and subtract from n(n+1)/2.'
- q: Run the pair-sum loop without sorting on a = [1, 3, 2] with T = 4. What happens, and which precondition
    failed?
  a: '(l, r) = (0, 2): 1 + 2 = 3 < 4, so l moves to 1. (1, 2): 3 + 2 = 5 > 4, so r moves to 1, and the
    loop stops with NO. But 1 + 3 = 4. Discarding index 0 assumed that a[2] was the largest partner left,
    which needs sorted order.'
- q: A fixed window of length k keeps its minimum in one int variable, updated with min() whenever an
    element enters. Give an input where this fails, and a summary that works.
  a: 'a = [1, 5, 6], k = 2. The windows are [1, 5] with minimum 1 and [5, 6] with minimum 5, but the variable
    still holds 1 after the 1 leaves. A single minimum cannot undo an add. A multiset of the window values
    works: erase one copy of the leaving value and read the first element.'
- q: In Container With Most Water, when h[l] = h[r], is it safe to move either pointer? Why?
  a: Yes. With h[l] = h[r], any pair (l, j) with l < j < r has smaller width and height at most h[l],
    so it is no better than (l, r); the same holds for any pair (j, r). Either end can be discarded, so
    the discard argument of Theorem 1.3.4 allows both moves.
- q: Theorem 1.3.6 matches each character of t at its earliest possible position in s. Give s and t where
    matching the first character later loses a valid answer.
  a: s = "aba", t = "ab". Matching the a of t at position 0 leaves the b at position 1, so the answer
    is yes. Matching it at position 2 leaves nothing after it, and the b cannot be matched.
