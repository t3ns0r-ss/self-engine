# Topic 3.7 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.7"
draft: true
cards:
  - id: assignment-mask
    name: Assigning items with a mask of used ones
    decisive_property: Items (jobs, partners, numbers, primes) are used at most once each, there are at
      most about 20 of them, and the future depends only on the set already used, not on the order; then
      dp[mask] over used sets, with the next position given by the size of the mask, replaces trying all
      n! orders.
    from_theorem: Theorem 3.7.1
    how_to_test: 'Write what a partial solution must remember: if it is just "which of the n items are
      taken" (plus the position, which equals the count), and 2^n · n fits, the mask DP applies.'
    weak_signals:
      - n ≤ 16–20 people, jobs or numbers to pair or order, with an arbitrary cost table
      - '"Each used at most once" with a small universe (letters of a word, primes below 30, skills)'
      - A game where players take numbers from a small pool, and the pool left decides the position
    kill_signals:
      - 'n up to 10^5: no mask; the cost must have structure (sorting, greedy)'
      - 'The cost of a pair depends only on comparing two values (a threshold): sorting and a greedy match
        solve it'
    lookalikes:
      - description: Match players to trainers (10^5 each), a player fitting a trainer with capacity at
          least the player's ability; the most matches
        needs: sorted-matching (1.5)
        flipping_difference: Whether a pair works is a threshold on sorted values, so matching in sorted
          order is optimal; with an arbitrary cost table (XOR, compatibility scores) and n ≤ 20, the mask
          DP is needed.
    complexity: O(2^n · n) time, O(2^n) memory.
  - id: path-mask
    name: Paths through every vertex
    decisive_property: A route must visit every one of n ≤ about 18 places exactly once (or count such
      routes), with arbitrary distances or allowed moves between them; the state is (visited set, current
      place), since the rest of the route depends on nothing else.
    from_theorem: Theorem 3.7.2
    how_to_test: Check that "each place exactly once" (or "all places") is required, that the cost of
      the next step depends only on the current place and the next one, and that 2^n · n² fits.
    weak_signals:
      - Visit all n ≤ 16–18 cities, return or not; the shortest route
      - Order all words, strings or numbers so that neighbours fit together (overlap, divisibility, a
        chain rule)
      - Count the orders or routes that use every element once, n ≤ 20
    kill_signals:
      - 'Points on a line or with a special metric: the best order is sorted, no mask needed'
      - 'Visit every edge, not every vertex, or n large: a different problem (Eulerian paths, later topics)'
    lookalikes:
      - description: Visit all n ≤ 10^5 points on a number line, starting at any point; the shortest walk
        needs: sort-then-scan (1.1)
        flipping_difference: On a line, walking from the leftmost to the rightmost point visits all of
          them, so the answer is max − min after sorting; with arbitrary distances between places the
          order matters and needs the (set, last) table.
    complexity: O(2^n · n²) time, O(2^n · n) memory.
  - id: group-mask
    name: Packing items into the fewest groups
    decisive_property: At most about 20 items must be split into the fewest groups (rides, sessions, bins)
      under a capacity, groups are interchangeable, and a set of packed items is best summarised by (groups
      used, fill of the last group); then items are added one at a time over masks.
    from_theorem: Theorem 3.7.3
    how_to_test: Check that groups have a capacity and no order, that n ≤ 20, and that the pair (groups,
      last fill) compared in that order is never worse for the future.
    weak_signals:
      - Fewest elevator rides, work sessions or trucks for n ≤ 20 items with weights
      - Split n ≤ 16 numbers into k groups with equal sums
      - Each group holds at most C in total, any number of items
    kill_signals:
      - 'At most two items per group: sort and pair the lightest with the heaviest'
      - 'Only two groups (equal halves): subset sums (3.3), with much larger n'
    lookalikes:
      - description: The fewest boats for n ≤ 5·10^4 people with weights, each boat carrying at most two
          people and weight at most C
        needs: opposite-ends (1.3)
        flipping_difference: With at most two people per boat, pairing the heaviest with the lightest
          that fits is optimal (two pointers on the sorted weights); with any number of items per group,
          the order of filling matters and the mask table is needed.
    complexity: O(2^n · n) time.
  - id: submask-mask
    name: Splitting a set into a first group and the rest
    decisive_property: The value of a set of at most about 16 items is the best way to split it into one
      group and the rest (or a set is built from two disjoint parts), so dp[mask] tries every submask;
      all masks with all their submasks take 3^n steps.
    from_theorem: Theorem 3.7.4
    how_to_test: Check that the answer combines a chosen subset with an answer for its complement, that
      the value of a single group can be precomputed for every mask, and that 3^n fits (n ≤ 16–18).
    weak_signals:
      - Partition n ≤ 16 items into groups of any size; each group scores a value
      - Schedule courses or tasks in rounds, choosing a subset each round
      - Choose two disjoint subsets with properties
    kill_signals:
      - 'Each subset is judged on its own and only counted or compared: enumerate the 2^n subsets directly
        (0.5)'
      - 'The groups have a capacity and should be few: the (groups, fill) table of the group-mask card
        is faster, 2^n · n'
    lookalikes:
      - description: Count the subsets of n ≤ 16 numbers whose bitwise OR is the largest possible
        needs: subset-bitmask (0.5)
        flipping_difference: Each subset is checked alone, so enumerating the 2^n masks and computing
          each OR is enough; the submask DP is needed when a set's value depends on how it is split into
          parts.
    complexity: O(3^n) time, O(2^n) memory.
problems:
  - id: ac-dp_o
    role: worked_example
    summary: Count the ways to pair N ≤ 21 men with N women along a 0/1 compatibility table, modulo 10^9
      + 7.
  - id: lc-special-permutations
    role: worked_example
    summary: Count the orders of n ≤ 14 distinct numbers in which every two neighbours divide one another,
      modulo 10^9 + 7.
  - id: lc-minimum-xor-sum-of-two-arrays
    role: ladder
    card: assignment-mask
    rung: 1
    twist: Base case of the card
    summary: Rearrange the second of two arrays (n ≤ 14) to minimise the sum of nums1[i] XOR nums2[i].
    hints:
      - If nums1[0..k−1] are already matched, what about the matching matters for the rest?
      - Only which elements of nums2 are used, a mask; k is its popcount (Theorem 3.7.1).
      - dp[mask | 1 << j] = min(dp[mask] + (nums1[popcount(mask)] XOR nums2[j])) over free j; answer dp[all].
  - id: ac-abc318_d
    role: ladder
    card: assignment-mask
    rung: 2
    twist: 'Not every item must be used, and pairs are unordered: always decide the lowest undecided vertex.'
    summary: Choose edges with pairwise distinct endpoints in a complete weighted graph on N ≤ 16 vertices,
      maximising the total weight.
    hints:
      - Pairs are unordered and some vertices stay unmatched. How do you avoid building the same matching
        in many orders?
      - 'Always decide the lowest vertex not yet in the mask: leave it unmatched, or match it with another
        free vertex.'
      - 'dp[mask] over decided vertices; from mask, let i = lowest free vertex: dp[mask | 1 << i] (unmatched)
        and dp[mask | 1 << i | 1 << j] + w(i, j). O(2^N · N).'
  - id: lc-maximize-score-after-n-operations
    role: ladder
    card: assignment-mask
    rung: 3
    twist: Items are used two at a time, and the step number (from the popcount) multiplies the score.
    summary: 2n ≤ 14 numbers; in operation i (1-based) remove two of them, x and y, scoring i · gcd(x,
      y). Maximise the total.
    hints:
      - After some operations, what do you know about the next operation from the set of used numbers
        alone?
      - 'Its number: popcount(mask) / 2 + 1, and which numbers are still free.'
      - dp[mask] for masks of even size; add every free pair (i, j) with (popcount/2 + 1) · gcd; precompute
        the gcds.
  - id: ac-abc354_e
    role: ladder
    card: assignment-mask
    rung: 4
    twist: 'A two-player game: a mask is winning or losing instead of a cost.'
    summary: N ≤ 18 cards with a front and a back number; players alternately remove two cards with equal
      fronts or equal backs; who cannot move loses. Who wins?
    hints:
      - What does a position consist of, and when is it winning?
      - Only the set of cards still on the table. It is winning if some allowed move leads to a losing
        set.
      - 'win[mask] for increasing masks (removing cards makes the mask smaller): check all pairs in mask;
        O(2^N · N²).'
  - id: ac-abc142_e
    role: ladder
    card: assignment-mask
    rung: 5
    twist: Each choice adds a whole set at once (a key opens several boxes), combined by OR, and may be
      reused.
    summary: N ≤ 12 boxes and M ≤ 1000 keys; a key costs a_i, opens a given set of boxes, and can be used
      any number of times. The least cost to open all boxes, or −1.
    hints:
      - Write each key as a mask of boxes. What does buying a key do to the set of opened boxes?
      - 'mask becomes mask | key: a knapsack whose "weight" is a set combined by OR (topic 3.3, unbounded).'
      - cost[0] = 0; for every mask in increasing order and every key, cost[mask | key] = min(cost[mask]
        + a); answer cost[all]. O(2^N · M).
  - id: cf-895C
    role: ladder
    card: assignment-mask
    rung: 6
    twist: The mask is a parity of prime exponents, combined by XOR, with values repeated many times.
    summary: Count the non-empty subsets of n ≤ 10^5 numbers (each ≤ 70) whose product is a perfect square,
      modulo 10^9 + 7.
    hints:
      - When is a product a square, in terms of the primes up to 70?
      - When every prime appears an even number of times. Store for each value the parities of its prime
        exponents as a mask over the 19 primes; a product is a square when the XOR of the masks is 0.
      - 'Group equal values: taking an even or an odd number of the c copies of a value gives 2^(c − 1)
        ways each. dp over the 70 values and the 2^19 parity masks; subtract the empty subset.'
  - id: ac-abc180_e
    role: ladder
    card: path-mask
    rung: 1
    twist: Base case of the card
    summary: A tour from city 1 through all N ≤ 17 cities in 3D and back; moving from (a, b, c) to (p,
      q, r) costs |p − a| + |q − b| + max(0, r − c). The cheapest tour.
    hints:
      - The costs are not symmetric. Does the template care?
      - 'No: Theorem 3.7.2 works with any costs d(u, v); only the set visited and the current city matter.'
      - Compute all costs, run dp[mask][last] from city 1, close the tour back to city 1. O(2^N · N²).
  - id: cf-580D
    role: ladder
    card: path-mask
    rung: 2
    twist: A bonus on the edge between consecutive items, and only m of the n items are used.
    summary: Eat exactly m of n ≤ 18 dishes in some order; dish i gives a_i, and eating y right after
      x gives a bonus c(x, y). Maximise the total.
    hints:
      - What decides the value of eating dish j next?
      - 'Its own value and the dish eaten just before it: the state is (dishes eaten, last dish).'
      - dp[mask][last] with a_j + bonus(last, j) per step; the answer is the best over masks with popcount
        m. Use long long.
  - id: ac-abc278_f
    role: ladder
    card: path-mask
    rung: 3
    twist: 'A game on paths: a state is winning or losing.'
    summary: N ≤ 16 words; players alternately say an unused word whose first letter is the last letter
      of the previous word; who cannot move loses. Does the first player win?
    hints:
      - What does the next player need to know?
      - Which words are used and which word was said last.
      - win[mask][last] = some unused j with first(j) = last letter of last and win[mask | j][j] false;
        evaluate from full masks down (or memoise). The first move can be any word.
  - id: cf-11D
    role: ladder
    card: path-mask
    rung: 4
    twist: 'Count cycles, each counted once: fix the lowest vertex as the start and divide by the two
      directions.'
    summary: Count the simple cycles (length at least 3) in a simple undirected graph with n ≤ 19 vertices.
    hints:
      - A cycle can be written starting at any of its vertices and in two directions. How do you pick
        one way?
      - Start at its lowest vertex s and only use higher vertices; then each cycle is found exactly twice
        (two directions).
      - cnt[mask][v] = paths from lowest(mask) to v inside mask; close when v is adjacent to the start
        and the path has at least 3 vertices; divide the total by 2.
  - id: cses-1653
    role: ladder
    card: group-mask
    rung: 1
    twist: Base case of the card
    summary: Take n ≤ 20 people with weights up an elevator with capacity x; the fewest rides.
    hints:
      - Rides are interchangeable. What do you keep for a set of people already taken?
      - The smallest (rides, weight in the last ride) over all ways to pack them (Theorem 3.7.3).
      - 'best[mask] = min over the last person p of adding p to best[mask without p]: into the last ride
        if it fits, else a new ride.'
  - id: lc-minimum-number-of-work-sessions-to-finish-the-tasks
    role: ladder
    card: group-mask
    rung: 2
    twist: Time instead of weight; the same pair state.
    summary: Finish n ≤ 14 tasks in work sessions of at most sessionTime ≤ 15 hours each; a task cannot
      be split. The fewest sessions.
    hints:
      - How is a session like an elevator ride?
      - Its capacity is the session time; tasks are the people. The order of sessions does not matter.
      - The same (sessions, time used in the current session) per mask; answer the session count for all
        tasks.
  - id: lc-minimum-incompatibility
    role: ladder
    card: group-mask
    rung: 3
    twist: Groups of a fixed size with distinct values; the cost of a group (max − min) is collected while
      it is filled.
    summary: Split n ≤ 16 numbers into k groups of equal size with no repeated value inside a group; a
      group costs its max minus its min. Minimise the total, or −1.
    hints:
      - Sort the numbers and fill the groups one after another, each in increasing order of value. What
        must the state remember?
      - 'The used set and the last element added: the size of the current group follows from popcount(mask)
        mod (n/k), and its cost grows by (next − last) at each step.'
      - 'Sort the numbers first. dp[mask][last]: within a group add a free element with a larger value
        (cost += difference); when a group is full, start the next one with the lowest free element, which
        is then the group''s minimum (cost 0). O(2^n · n²).'
  - id: ac-dp_u
    role: ladder
    card: submask-mask
    rung: 1
    twist: Base case of the card
    summary: Split N ≤ 16 rabbits into groups; every pair in the same group adds a given (possibly negative)
      score. Maximise the total.
    hints:
      - What is the score of one group, and how do you split a set into a first group and the rest?
      - score[s] = sum over pairs in s, precomputed for all masks; the group of the lowest rabbit is some
        submask s.
      - best[mask] = max over submasks s containing the lowest bit of score[s] + best[mask ^ s] (Theorem
        3.7.4). O(3^N).
  - id: lc-parallel-courses-ii
    role: ladder
    card: submask-mask
    rung: 2
    twist: The submask is limited to k courses chosen among those currently available.
    summary: n ≤ 15 courses with prerequisites; at most k per semester, each only after its prerequisites.
      The fewest semesters.
    hints:
      - Why is "take the k courses with the most dependants" not safe?
      - Choices interact through later prerequisites; greedy rules fail on small cases. A state is just
        the set of finished courses.
      - dp[mask] = fewest semesters; available = courses not in mask with prerequisites in mask; if at
        most k are available take all, else try every submask of size k.
  - id: ac-abc332_e
    role: ladder
    card: submask-mask
    rung: 3
    twist: A fixed number of groups D, so the table has a count index as well as the mask.
    summary: Put N ≤ 15 items with weights into D bags (bags may be empty) to minimise the variance of
      the bag weights.
    hints:
      - The mean is fixed. What is left to minimise?
      - The sum of the squared bag weights.
      - sq[mask] = (sum of mask)²; dp[d][mask] = min over submasks s of dp[d − 1][mask ^ s] + sq[s]; variance
        = dp[D][all] / D − mean². O(D · 3^N).
  - id: lc-can-i-win
    role: drill
    summary: Players alternately pick an unused number from 1..m (m ≤ 20), adding it to a running total;
      whoever first reaches at least T ≤ 300 wins. Can the first player force a win?
  - id: lc-count-the-number-of-square-free-subsets
    role: drill
    summary: Count the non-empty subsets of n ≤ 1000 numbers (each ≤ 30) whose product is square-free,
      modulo 10^9 + 7.
  - id: lc-the-number-of-good-subsets
    role: drill
    summary: Count the subsets of n ≤ 10^5 numbers (each ≤ 30) whose product is a product of distinct
      primes, modulo 10^9 + 7.
  - id: lc-maximum-number-of-achievable-transfer-requests
    role: drill
    summary: Choose the most of up to 16 transfer requests (from building, to building) so that every
      building has as many people leaving as arriving.
  - id: lc-minimum-time-to-break-locks-i
    role: drill
    summary: Break n ≤ 8 locks in some order; the time for each depends on a sword factor that grows by
      k after every lock. The least total time.
  - id: lc-minimum-moves-to-spread-stones-over-grid
    role: drill
    summary: A 3 × 3 grid holds 9 stones, some cells several; one move shifts a stone to a neighbouring
      cell. The fewest moves to leave one stone per cell.
  - id: lc-longest-string-chain
    role: drill
    summary: The longest chain of words (up to 1000 words of length ≤ 16) in which each word is the previous
      one with one letter inserted.
  - id: cses-1744
    role: drill
    summary: Cut an a × b rectangle (a, b ≤ 500) into squares with the fewest straight cuts across a piece.
  - id: lc-maximum-compatibility-score-sum
    role: lookalike
    summary: Pair m ≤ 8 students with m mentors (one each) to maximise the total number of matching yes/no
      answers.
  - id: lc-maximum-matching-of-players-with-trainers
    role: lookalike
    summary: Match players with trainers (10^5 each), a player fitting a trainer whose capacity is at
      least the player's ability; the most matches.
  - id: lc-maximum-product-of-the-length-of-two-palindromic-subsequences
    role: lookalike
    summary: Choose two disjoint palindromic subsequences of a string (length ≤ 12) with the largest product
      of lengths.
  - id: lc-count-number-of-maximum-bitwise-or-subsets
    role: lookalike
    summary: Count the non-empty subsets of n ≤ 16 numbers whose bitwise OR is the largest possible.
drill:
  - problem: lc-can-i-win
    answer_card: assignment-mask
    answer_topic: '3.7'
    property: A position is the set of numbers already picked (the total follows from it), at most 2^20
      sets; a set is winning if some unused number reaches T or leads to a losing set.
    why_others_fail: Searching the game tree without remembering sets visits up to 20! move orders; greedy
      "take the largest" can hand the opponent a winning total.
  - problem: lc-count-the-number-of-square-free-subsets
    answer_card: assignment-mask
    answer_topic: '3.7'
    property: A product is square-free when no prime is used twice; the primes below 30 are 10, so cnt[mask]
      over the primes already used is a knapsack over 2^10 masks.
    why_others_fail: Enumerating subsets of 1000 numbers is impossible; a product formula ignores the
      clashes between numbers sharing a prime.
  - problem: lc-the-number-of-good-subsets
    answer_card: assignment-mask
    answer_topic: '3.7'
    property: Only 30 different values exist; count each, and run a DP over masks of the 10 primes below
      30, adding each square-free value with its multiplicity; the 1s multiply the result by 2^(count
      of 1s).
    why_others_fail: Enumerating subsets of 10^5 numbers is impossible, and a product of independent choices
      per value ignores that two values may share a prime (6 and 10 both use 2).
  - problem: lc-maximum-number-of-achievable-transfer-requests
    answer_card: subset-bitmask
    answer_topic: '0.5'
    property: 'With 16 requests there are 2^16 subsets, and each subset is checked on its own in O(16):
      plain enumeration.'
    why_others_fail: 'No DP is needed: nothing is combined between subsets, so a mask DP would only add
      work.'
  - problem: lc-minimum-time-to-break-locks-i
    answer_card: permutations
    answer_topic: '0.5'
    property: 'Only 8! = 40320 orders, each evaluated in O(n): try them all.'
    why_others_fail: A mask DP over (set of broken locks) also works, but with n ≤ 8 trying every order
      is simpler.
  - problem: lc-minimum-moves-to-spread-stones-over-grid
    answer_card: permutations
    answer_topic: '0.5'
    property: At most 8 extra stones must go to at most 8 empty cells; try every matching order (≤ 8!)
      and add the Manhattan distances.
    why_others_fail: Simulating moves one by one is a search over grid states; matching extra stones to
      empty cells directly is enough.
  - problem: lc-longest-string-chain
    answer_card: lis-reduction
    answer_topic: '3.4'
    property: A chain goes from shorter to longer words, so sorting by length gives the order; best[w]
      = 1 + best of w with one letter removed, looked up in a map.
    why_others_fail: It looks like ordering items along a path, but with 1000 words a mask is impossible,
      and the length already fixes the order.
  - problem: cses-1744
    answer_card: merge-split
    answer_topic: '3.6'
    property: 'Each cut splits a piece into two independent rectangles: moves[a][b] = 1 + min over all
      cuts of the two parts (0 for a square).'
    why_others_fail: No small set of items is involved, so no mask; the greedy "cut off the largest square"
      fails (5 × 6 needs 4 cuts, the greedy 5).
lookalike_pairs:
  - a: lc-maximum-compatibility-score-sum
    b: lc-maximum-matching-of-players-with-trainers
    a_tool: 'assignment-mask (3.7): dp over the set of mentors used'
    b_tool: 'sorted-matching (1.5): sort both lists and match greedily'
    flipping_difference: Both pair the items of two lists one-to-one. In A the value of a pair is an arbitrary
      table (shared answers), so no order helps and the set of used mentors must be the state. In B a
      pair works by a threshold on numbers, so after sorting the smallest player takes the smallest trainer
      that fits.
  - a: lc-maximum-product-of-the-length-of-two-palindromic-subsequences
    b: lc-count-number-of-maximum-bitwise-or-subsets
    a_tool: 'submask-mask (3.7): for each palindromic mask, the submasks of its complement'
    b_tool: 'subset-bitmask (0.5): enumerate the 2^n subsets and test each one'
    flipping_difference: Both look at the subsets of a small set. In B each subset is judged alone, so
      a single loop over masks is enough. In A two disjoint subsets must be combined, so for each mask
      the submasks of its complement are visited, 3^n pairs in all.
self_test: []
checkpoint:
  time_limit_minutes: 120
  problems: []
decision_map: []
glossary_added: ["bitmask DP", "submask", "Hamiltonian path", "TSP"]
