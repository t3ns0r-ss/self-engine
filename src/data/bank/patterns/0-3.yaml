# Patterns for topic 0.3 (Implementation and simulation). Provisional until the lesson maps them to Recognition Cards.
topic: "0.3"
patterns:
  - id: direct-simulation
    name: Follow the process
    description: Carry out the process exactly as described, step by step, and report the result.
    precondition: The number of steps times the cost of one step fits the budget.
  - id: grid-processing
    name: Grid scanning
    description: Read a 2D grid of characters or numbers and examine cells, rows, columns, neighbours, or borders.
    precondition: The grid is small enough to visit each cell a constant number of times.
  - id: string-processing
    name: Character-level processing
    description: Transform or check a string character by character using a few state variables.
    precondition: One left-to-right pass with constant state decides the answer.
  - id: case-analysis
    name: Careful case analysis
    description: The input splits into a few cases (by sizes, signs, equalities), each with a direct answer; the difficulty is missing none.
    precondition: The cases cover every input and each case's answer is computed directly.
