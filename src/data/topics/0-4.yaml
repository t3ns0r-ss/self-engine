lookalike_pairs:
  - a: ac-abc161_c
    b: ac-abc175_c
    a_tool: "divisibility (0.4): only N mod K matters"
    b_tool: "parity (0.4): the parity of the leftover moves decides"
    flipping_difference: In B exactly K moves must be made, so after reaching the closest point the remaining moves bounce between two values and their parity picks one; in A any number of operations is allowed.
  - a: ac-abc148_c
    b: ac-abc060_b
    a_tool: "gcd-lcm (0.4): lcm(A, B)"
    b_tool: "mod-arithmetic-basic (0.4): remainders of kA modulo B repeat"
    flipping_difference: A asks for one common multiple; B asks which remainders the multiples of A can leave modulo B, which repeat after B steps, so trying k = 1..B decides it.
self_test:
  - q: What does C++ print for -7 % 3, and how do you get the remainder in [0, 3)?
    a: It prints −1, because C++ rounds −7/3 toward zero (to −2) and −7 − (−2)·3 = −1. The remainder in [0, 3) is ((−7 % 3) + 3) % 3 = 2 (Theorem 0.4.1).
  - q: How many multiples of 6 lie in [10, 50]? Compute with the formula and check the boundaries.
    a: "⌊50/6⌋ − ⌊9/6⌋ = 8 − 1 = 7: they are 12, 18, 24, 30, 36, 42, 48. Using ⌊10/6⌋ instead of ⌊9/6⌋ would also give 7 here only because 10 is not a multiple; for [12, 50] it would lose 12."
  - q: Five coins show heads; a move flips exactly two coins. Can all five show tails? Name the invariant.
    a: No. Each move changes the number of heads by −2, 0 or +2, so its parity is invariant (Theorem 0.4.3). It starts odd (5) and the target 0 is even.
  - q: Why is (a·b) mod m computed as ((a mod m)·(b mod m)) mod m, and when can this product still overflow?
    a: Theorem 0.4.4 says the remainder of a product depends only on the factors' remainders, and reducing first keeps the factors below m. The product is then below m², which overflows long long when m is larger than about 3·10^9.
  - q: Can you compute (a / b) mod m as ((a mod m) / b) mod m? Give a counterexample.
    a: "No. With a = 10, b = 2, m = 6: 10/2 = 5, but (10 mod 6)/2 = 2. Theorem 0.4.4 covers only addition, subtraction and multiplication; division modulo m needs a later tool (topic 2.2)."
  - q: Trace Euclid on (252, 105) and give the number of loop steps.
    a: "(252, 105) → (105, 42) → (42, 21) → (21, 0): three steps, gcd = 21. Each step replaces (a, b) by (b, a mod b); 252 mod 105 = 42, 105 mod 42 = 21, 42 mod 21 = 0."
  - q: Why is lcm(a, b) computed as a / gcd(a, b) · b rather than a · b / gcd(a, b)?
    a: "Both are equal mathematically (Theorem 0.4.6), but a · b can overflow even when the LCM fits: for a = b = 10^18 the LCM is 10^18, while a · b = 10^36. Dividing first keeps every intermediate value at most the LCM."
