# Topic 3.3 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "3.3"
draft: true
cards:
  - id: zero-one
    name: Each item at most once
    decisive_property: "Each item is taken or not, independently of the others except through one total (weight, cost, size), and either that total's capacity or the sum of the values is small enough to index; then best[items][capacity] (or the least weight for each exact value) loses nothing."
    from_theorem: Theorem 3.3.1
    how_to_test: "Check that no item excludes or requires another, find the one total that is bounded, and compare n·W with n·(sum of values): index the table by whichever is small (Theorem 3.3.2 for values)."
    weak_signals:
      - "Choose items with a cost and a gain under a budget, each item once"
      - "n up to 100–1000 and a capacity up to 10^5, or weights up to 10^9 with small values"
      - "Two quantities per item, one bounded and one maximised"
    kill_signals:
      - "Items can be split or taken fractionally (greedy by ratio, 1.5)"
      - "Capacity and values are both huge but n ≤ 40 (meet in the middle, 3.1)"
    lookalikes:
      - description: "Fill a knapsack with divisible goods (any fraction of an item) to maximise value"
        needs: "extreme-first (1.5)"
        flipping_difference: "Fractions remove the all-or-nothing choice, so taking the best value per weight first is optimal; whole items need the table."
    complexity: "O(n·W) time and O(W) memory with one row; O(n·V) when indexed by value."
  - id: unbounded
    name: Unlimited copies
    decisive_property: "Every item (coin, piece length, attack) may be used any number of times, so after taking one copy the same item is still available; one row with the capacity loop running upwards reads the current row and is correct. For counts, the items loop is outside when the order of the parts does not matter."
    from_theorem: Theorem 3.3.3
    how_to_test: "Check that copies are unlimited; for a count, decide whether 1 + 2 and 2 + 1 are the same solution (item loop outside) or different (capacity loop outside)."
    weak_signals:
      - "Coins of given values, as many of each as needed: fewest coins or number of ways"
      - "Cut a rod or ribbon into pieces of given lengths; spells with a damage and a cost, cast any number of times"
      - "Total up to 10^4–10^6"
    kill_signals:
      - "Each item may be used at most once (downward loop, 0/1)"
      - "The coin system is canonical (1, 5, 10, 25) and a greedy proof exists (1.5)"
    lookalikes:
      - description: "The fewest coins of values 1, 5, 10 and 25 for an amount up to 10^18"
        needs: "extreme-first (1.5)"
        flipping_difference: "For these coin values the greedy is provably optimal, so a huge amount is no problem; with arbitrary coin values the table over amounts is needed and the amount must be small."
    complexity: "O(n·W)."
  - id: subset-sums
    name: Which totals are reachable
    decisive_property: "The question is only which sums (or how many subsets for each sum) can be formed from numbers each used once, and the range of sums is small; the row of reachable sums, updated downwards or with a bitset shift, answers it."
    from_theorem: Theorem 3.3.4
    how_to_test: "Bound the largest relevant sum S and check that n·S (or n·S/64 with a bitset) fits; check whether a count, a yes/no, or the closest reachable sum is asked."
    weak_signals:
      - "Split items into two groups with sums as equal as possible, or with equal sums"
      - "Can exactly X be reached by choosing one of two moves per step"
      - "Counts of subsets with a given sum, modulo a prime"
    kill_signals:
      - "The sums are huge but n ≤ 40 (meet in the middle, 3.1)"
      - "Only the number of elements matters, not their values"
    lookalikes:
      - description: "Split n ≤ 40 numbers up to 10^9 into two groups with sums as close as possible"
        needs: "meet-in-middle (3.1)"
        flipping_difference: "Sums up to 4·10^10 cannot be indexed; with n ≤ 40, two lists of 2^20 half-sums do the job instead."
    complexity: "O(n·S), or O(n·S/64) with a bitset."
  - id: bounded
    name: Limited copies
    decisive_property: "Item i may be taken up to c_i times, copies of one item are interchangeable, and splitting c_i into bundles 1, 2, 4, … plus a remainder lets the 0/1 table choose every count from 0 to c_i and nothing more."
    from_theorem: Theorem 3.3.5
    how_to_test: "Check that only the number of copies taken matters, compute Σ log c_i, and check that W·Σ log c_i fits; for counts of ways, split by the number of copies instead (each count once)."
    weak_signals:
      - "Each kind of coin, book or item comes in a given number of copies"
      - "Recipes or buns with limited ingredients"
      - "c_i up to 1000 and capacity up to 10^5"
    kill_signals:
      - "All c_i are 1 (plain 0/1) or unlimited (unbounded)"
      - "Counting ways where bundles would count a choice several times: loop over the number of copies instead"
    lookalikes:
      - description: "Pay an amount with coins of given values, each available in unlimited supply"
        needs: "unbounded (3.3)"
        flipping_difference: "With no limit on copies the upward loop already allows any count; bundles are needed only when the count is capped."
    complexity: "O(W · Σ log c_i)."
