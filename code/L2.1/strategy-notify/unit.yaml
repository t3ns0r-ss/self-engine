kind: pattern
domain: notifications
variants: [naive, patterned]
claims: ["L2.1.1"]
scenarios:
  - name: 01-push
    request: "Add a push channel that cuts the text at 60 characters."
    blast_radius:
      naive: {count: 2, behaviours: ["EMAIL", "SMS"], where: "Notifier::send"}
      patterned: {count: 0, behaviours: [], where: "make_notifier (wiring only)"}
  - name: 02-sms-prefix
    request: "SMS messages start with the sender tag [Acme], and the whole message stays within 160 characters."
    blast_radius:
      naive: {count: 2, behaviours: ["EMAIL", "PUSH"], where: "Notifier::send"}
      patterned: {count: 0, behaviours: [], where: "SmsChannel::send"}
  - name: 03-priority
    request: "Every send carries a priority, and an urgent message starts with URGENT: on every channel. Every channel now needs the priority."
    blast_radius:
      naive: {count: 0, behaviours: [], where: "Notifier::send (every channel changes)"}
      patterned: {count: 0, behaviours: [], where: "every channel class and Notifier::send (every channel changes)"}
