# Topic 1.2 data file (PLAN.md Section 5). Problems reference the bank by id.
id: "1.2"
draft: true
cards:
  - id: range-sum
    name: Range sums of a fixed array
    decisive_property: The array does not change, and every question asks for the sum (or count) of a range, so prefix sums answer each one as P[r+1] − P[l] in O(1) after O(n) preparation.
    from_theorem: Theorem 1.2.1
    how_to_test: Check that no update arrives between questions and that the quantity can be undone by subtraction (a sum or a count, not a maximum).
    weak_signals:
      - Many queries "sum (or number of …) from l to r"
      - A split point i with "everything before i" and "everything after i" measured by sums or counts
      - n and q both up to 2·10^5
    kill_signals:
      - Values change between queries (later topics)
      - The query asks for a maximum or minimum of a middle range
    lookalikes:
      - description: The same queries, but some operations change an element
        needs: "a tree structure (topic 5.2, later)"
        flipping_difference: Updates between queries would force rebuilding the prefix sums.
    complexity: O(n) preparation, O(1) per query.
  - id: prefix-count-lookup
    name: Pairs of prefix values
    decisive_property: The condition on a subarray [l, r] is a condition on the pair (P[l], P[r+1]) alone, such as an exact difference K or equal remainders, so scanning the prefix sums with a map of earlier values counts or finds the subarrays, even with negative values.
    from_theorem: Theorem 1.2.2
    how_to_test: Rewrite the condition with P[r+1] − P[l]. If it becomes "P[l] equals something computed from P[r+1]", count earlier values with a map.
    weak_signals:
      - '"Count the subarrays with sum exactly K" or "sum divisible by k"'
      - Negative values are allowed
      - Balanced segments (as many A as B), turned into sums of +1 and −1
    kill_signals:
      - The condition is "sum at most K" (an inequality, not a lookup of one value)
      - The subarray must satisfy something that is not a function of its sum
    lookalikes:
      - description: Longest subarray with sum at most K, all values positive
        needs: "moving both ends of the segment forward (topic 1.3, later)"
        flipping_difference: An inequality on positive values is closed under shrinking; an exact sum with any values is a lookup.
    complexity: O(n log n) with map, O(n) on average with unordered_map.
  - id: difference-array
    name: Many range updates, then one read
    decisive_property: All updates add a value to a range and come before all reads, so each update is two changes in the difference array, and one running sum rebuilds the array.
    from_theorem: Theorem 1.2.3
    how_to_test: Check that no read happens between updates, that updates add (not set) values, and that positions fit in an array.
    weak_signals:
      - '"For each of q operations, add v to every element from l to r; print the final array"'
      - Coverage counts of many intervals on a short line
      - Ranges of answers each receiving +1
    kill_signals:
      - A query arrives between updates
      - Coordinates up to 10^9 (sort events instead, topic 1.1)
    lookalikes:
      - description: Each operation shifts a whole prefix of the string
        needs: range-sum (1.2), suffix sums of the shifts
        flipping_difference: When every update covers a prefix, each position's total is a suffix sum of the updates, with no difference array needed.
    complexity: O(1) per update, O(n) for the read.
  - id: prefix-2d
    name: Rectangles in a grid
    decisive_property: The grid is fixed (or all rectangle updates come before the reads), so the four-corner formula on 2D prefix sums gives any rectangle sum in O(1), and four corner changes record any rectangle update.
    from_theorem: Theorem 1.2.4
    how_to_test: Check that every query is an axis-parallel rectangle of a grid that does not change between queries.
    weak_signals:
      - Sums or counts over sub-rectangles of an H × W grid
      - '"Add 1 to every cell of the rectangle", then print the grid'
      - The same 1D question asked about a grid
    kill_signals:
      - Shapes other than rectangles (diagonals, paths)
      - The grid changes between queries
    lookalikes:
      - description: Count the cells of each colour in a rectangle of a grid that repeats with period N
        needs: prefix-2d (1.2) plus counting whole periods (0.4)
        flipping_difference: The grid is huge but periodic, so the rectangle is split into whole periods and partial pieces before the formula applies.
    complexity: O(HW) preparation, O(1) per rectangle.
  - id: prefix-extremes
    name: Best value before or after a position
    decisive_property: Each question needs the maximum or minimum of everything before a position or after it (never a middle range), so prefix and suffix extremes, each computed with one comparison per step, answer it in O(1).
    from_theorem: Theorem 1.2.5
    how_to_test: Write the question for a fixed position i; check that the other side of i is a prefix or a suffix.
    weak_signals:
      - '"Buy before you sell", the largest a_j − a_i with i < j'
      - '"The best value excluding position i", "the best split point"'
      - The largest subarray sum
    kill_signals:
      - The maximum of an arbitrary range [l, r] is needed (topic 5.1, later)
    lookalikes:
      - description: The largest sum of a subarray of length exactly k
        needs: range-sum (1.2)
        flipping_difference: A fixed length fixes the start, so each candidate is one range sum; no running minimum is needed.
    complexity: O(n) for all prefixes and suffixes.
