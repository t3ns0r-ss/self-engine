# Patterns for topic 0.1 (C++ for CP: I/O, types, overflow, compiling, online judges). Provisional until the lesson maps them to Recognition Cards.
topic: "0.1"
patterns:
  - id: fast-io
    name: Large input and output
    description: Read or print up to about 10^6 numbers, where the speed of the stream calls decides whether the program finishes in time.
    precondition: The input or output volume is large enough that unsynchronised C++ streams (or many separate flushes) become the bottleneck, while the algorithm itself is linear.
  - id: overflow-64bit
    name: 64-bit arithmetic
    description: Sums or products exceed 2^31 − 1, so 32-bit int silently overflows; the fix is long long in the right places.
    precondition: The largest intermediate value is above about 2.1·10^9 but below about 9.2·10^18, so long long holds it exactly.
  - id: multi-test
    name: Many test cases
    description: One input file holds many test cases; all state must be reset per test and the work per test must be proportional to that test's size.
    precondition: The statement bounds the sum of n over all tests, so O(n) work per test is O(total n) overall, but clearing a fixed-size global array per test is not.
  - id: integer-rounding
    name: Exact integer formulas
    description: Ceilings, floors, and divisions done with integer formulas such as (a + b − 1) / b instead of floating point.
    precondition: All quantities are integers, so an exact integer formula exists and avoids floating-point rounding errors on large values.
