- id: rev-2-1
  role: review
  type: recognise
  title: 'Class or sequence: how does a webhook retry flow?'
  prompt: A service posts a webhook and retries three times with growing delays if the receiver fails. A new colleague asks how it works. Which diagram do you draw, and what does it show?
  card: sequence-diagram
  review_set: 2
  techniques:
  - L0.4
  checked_on: '2026-10-19'
